id: algebraic-expressions
subject: math
why: A letter lets a child say something true about a number before anyone knows what that number is. They stop asking only "what’s the answer?" and start describing how a situation works, whatever the number turns out to be.
hook:
  title: Four socks and a coin
  time: 5 minutes
  covers: [K2.2, U2.1]
  body: |-
    Out of sight, drop **3 coins** into each of **4 socks** and fold the tops shut. Put the socks on the table with **1 loose coin** beside them. Say only: "Every sock holds the same number."

    Ask your child to write down how many coins are on the table. They will protest. Good. Ask: **"Could it be 12? Could it be 13? What could you write on a note for someone who needs the total, when nobody is allowed to open a sock?"** Leave the socks shut and go to the lesson.
activities:
  - title: The kitchen machine
    time: 15 minutes
    materials: Paper, a pencil, and a robot voice
    covers: [K2.7, S2.5, S2.6]
    steps:
      - One person is the machine. They secretly write an expression on folded paper, such as \(2n + 1\) or \(n + 4\).
      - Everyone else feeds it whole numbers. The machine substitutes, whirs, and announces what comes out. Keep a list of what went in and what came out.
      - 'Nobody may name the rule until they can predict: "If I feed it 10, it will say 21." The machine runs it to see.'
      - Write your guess as an expression and test it on every line of the list. Only then unfold the paper. Swap who is the machine.
  - title: Open a very odd shop
    time: 15 minutes
    materials: Paper for a sign, toys as customers, buttons as money
    covers: [K2.3, K2.5, K2.6, S2.5, S2.6]
    steps:
      - Your child invents a shop, such as a worm wash or sock repair, with a fee everyone pays at the door and a price for each item.
      - They pick a letter for the number of items and write the sign, such as \(3s + 2\). Beside it, they say in words what the letter stands for.
      - Customers come in wanting different numbers of items. Your child substitutes and charges them in buttons.
      - 'A grumpy customer buys nothing at all. Ask: "What do they pay? Which part of your sign changes from customer to customer, and which part never does?"'
questions:
  - In \(3n + 2\), what could change, and what can’t?
  - Could \(n\) be 0 in this story? What would that look like?
  - If \(b\) is the books in one box, what would \(6b\) be if there were 20 in a box? What if there were 50?
  - What is different about the stories for \(3n\) and \(n + 3\)?
  - Which totals could never come out of this expression? How do you know without trying them all?
misconceptions:
  - thought: '"\(6b\) means 6 books."'
    why: In everyday writing, 6 kg means 6 kilograms, so a letter after a number looks like a label.
    tryThis: Ask what \(6b\) would be if each box held 20 books. If the answer is 120, ask whether that is still "6 books".
  - thought: '"\(4n + 3\) is the same as \(7n\)."'
    why: Children have always finished a sum by making one number, so leaving a + sign in the answer feels unfinished.
    tryThis: Put out 4 socks and 3 loose coins. Ask whether that is the same as 7 socks. Then let them leave the + sign alone, with a clear conscience.
  - thought: '"If \(n\) is 4, then \(3n\) is 34."'
    why: In every number they have ever read, two symbols side by side mean place value.
    tryThis: Read \(3n\) aloud as "3 groups of \(n\)" and lay out 3 groups of 4 coins. Ask them to compare that with 34 coins.
  - thought: '"\(\frac{c}{6}\) and \(\frac{6}{c}\) mean the same thing."'
    why: \(3 \times 4\) and \(4 \times 3\) are the same, so swapping seems harmless.
    tryThis: Put out 12 crackers and ask which number is the pile and which is the people sharing it. Sharing 6 crackers among 12 people is a very different party.
lookFor:
  - They ask what the letter stands for in the story before they write anything.
  - They point to one part of an expression and say that it stays the same, while another part changes.
  - They test an expression with a second number before they trust it.
  - They leave \(4n + 3\) as it is, and can say why it won’t become one term.
adapt:
  support:
    - Keep the socks out. Move to writing only after your child can say "3 socks and 2 coins" without looking.
    - Start with repeated addition, such as \(n + n + n\), and write \(3n\) underneath only after that feels ordinary.
    - Use one letter, one story and small numbers for a while, and change only the number you substitute.
  access:
    - need: reading
      tip: Read expressions aloud in words, "3 groups of \(n\), plus 2", until your child starts to read them that way.
    - need: writing
      tip: Put numbers, letters and + signs on sticky notes, so your child can build an expression by moving them around.
    - need: attention
      tip: Keep machine rounds short, with five numbers in and then a new machine. Each new number is a small surprise.
    - need: worry
      tip: A letter means that nobody knows the number yet, including you. Say so. Not knowing is the starting point here, not a failure.
    - need: language
      tip: Let your child say "the number in front" and "the number on its own" for as long as they need. Add "coefficient" and "constant term" while you point at each one.
  stretch:
    - Write two very different stories that both fit \(2n + 5\). Then change the story so the expression becomes \(5n + 2\).
    - Find a number that \(3n + 1\) can never make when \(n\) is a whole number. How can you be sure, without trying every \(n\)?
together:
  - problem: d1
    how: Before any math, ask which farm your child would pick for a short walk and which for a very long one, and why. Then let the expressions test that hunch. Ask what happens to each bill when one more hour is added.
  - problem: d2
    how: Be the machine. Read the table in your best burping voice. At the first part, ask why so many expressions fit, and let that bother your child for a moment before going on.
  - problem: d3
    how: Get some real shoes out, in pairs with one extra, and let your child try to reach 40. Ask what they notice each time they add a pair. Save the writing until they have something to say.
