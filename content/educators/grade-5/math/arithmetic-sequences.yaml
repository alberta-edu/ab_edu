id: arithmetic-sequences
subject: math
why: This topic teaches a child to leap ahead. They don’t need to build the 40th step if they can see how every step relates to its position. They also learn not to trust a rule until it has been tested, because a rule can fit once and still be wrong.
hook:
  title: Will row 20 fit?
  time: 5 minutes
  covers: [U1.1, S1.6]
  body: |-
    Lay out coins or buttons in rows, starting from the edge of a table. **Row 1** has 3, **row 2** has 6, **row 3** has 9. Hand your child the coins for row 4 without saying how many it needs.

    Now ask: **"Will row 20 fit on this table? We don’t own enough coins to try it. Who says yes, who says no, and how could we ever find out?"** Take a vote, and leave the question open.
activities:
  - title: Ramp and sabotage
    time: 15 minutes
    materials: Blocks, books or cans to stack, some stiff cardboard or a long ruler, and a toy car if you have one
    covers: [K1.2, S1.1, S1.2, S1.4]
    steps:
      - Your child builds four stacks, evenly spaced, of 2, 4, 6 and 8 blocks, with a card numbered 1 to 4 at the foot of each stack.
      - 'Rest the cardboard on top. Does it touch every stack? Roll the car down, and ask: "Why does it work?"'
      - Your child looks away while you add or remove a block from one stack. Using only the ramp, can they find the stack you changed?
      - 'Now they pick a rule of their own, such as \(3n\) or \(n + 2\), and build it. Ask: "How tall would stack 50 be? Would it reach the ceiling?"'
  - title: When I’m 40
    time: 15 minutes
    materials: Paper and a pencil
    covers: [S1.1, S1.3, S1.4, S1.5, S1.6]
    steps:
      - Your child chooses anyone older, such as a sibling, a cousin, a grown-up or a favourite character, and works out how many years older that person is.
      - They make a table with their own age in one row and the other person’s age in the row below. They fill in five columns.
      - They write the rule with a letter, such as \(n + 28\), and test it on each column.
      - 'Ask the big questions: "How old will they be when you’re 40? When you’re 80?"'
      - 'Try the trap, with made-up ages if you like: "You’re 10 and I’m 40, so I’m 4 times your age. When you’re 20, will I be 4 times your age?"'
questions:
  - What is the difference between where a term is and what it is?
  - How many columns would you test before you trusted this rule?
  - Could 50 be in this sequence? How could you tell without listing them all?
  - What in the story tells you this is a "times" rule or a "plus" rule?
  - What would it mean if one point didn’t fit on the line?
misconceptions:
  - thought: '"Position 3 means the number 3."'
    why: Position and term are both just numbers, sitting side by side in a table.
    tryThis: Line up toys and give each a numbered card that isn’t its place in line. Ask, "Where is it standing? What is it wearing?"
  - thought: '"The first term is 4, so the rule is \(4n\)."'
    why: The rule does fit position 1. Children reasonably stop looking once something works.
    tryThis: Make testing the second and third columns a habit. Ask, "Does it still work over here?" and let the table give the answer.
  - thought: '"It goes up by 6 each time, so the rule is \(6n\)."'
    why: The jump is the easiest thing to see in a table, and it often is the coefficient.
    tryThis: Look at the top row. If the positions skip, as they do on even days only, ask how far the top row moved to make that jump of 6.
  - thought: '"Whoever starts ahead stays ahead."'
    why: In many races, that is what happens.
    tryThis: Start two piles, with 6 coins in one and none in the other. Add 1 to the first and 3 to the second each turn, and watch.
lookFor:
  - They use the words "position" and "term" correctly, or point to the correct row.
  - They test a rule on more than one column before they believe it.
  - They answer for a far-off position using the rule, without building up to it.
  - They spot a wrong point on a graph by looking at the line, before calculating.
adapt:
  support:
    - Build each term with objects, and put a position card beneath it. Writing the table comes after.
    - Use "times" rules such as \(2n\) first, then bring in "plus" rules such as \(n + 3\).
    - Stay with positions under 10 until the rule feels reliable. Then ask about position 100 just for the fun of it.
  access:
    - need: reading
      tip: Read tables out loud as pairs, "position 1, term 8; position 2, term 16", while your child points.
    - need: writing
      tip: Have your child say the rule while you write it down. Sticky notes work well for the columns of a table, since they can be moved or replaced.
    - need: worry
      tip: A rule gets tested, not your child. When a rule fails, it was the rule that got caught, and that’s how the good one gets found.
    - need: language
      tip: '"Term" can also mean part of the school year. Show position by pointing to a place in a line, and term by pointing to what’s there.'
    - need: hands
      tip: Your child says how many go in each stack and you place them. On paper, they can direct you to each point on the grid.
  stretch:
    - Find a "times" rule and a "plus" rule that give the same term at position 2. Tell a story for each one. What tells you which story goes with which rule?
    - Find two rules, one "times" and one "plus", whose lines cross at a point you choose. Then find two rules whose lines never cross.
together:
  - problem: d1
    how: Before the math, have your child draw two faces and vote on which beard wins in the end. Build the beards with stacks of coins, one week at a time, and let them keep score. Hold off on the graph until they have made a table.
  - problem: d2
    how: Chalk or tape out some of the lily pads, or just list the pads aloud, with your child hopping along. Try a jump they suggest and let the skunk wake up. Ask what would have to be true about a jump that lands on 24.
  - problem: d3
    how: Build both rows with real boxes, books or blocks, and try the ramp on each one. Your child may see it before they can say it, so ask them to point to where each ramp fails or fits, and then to put that into words.
