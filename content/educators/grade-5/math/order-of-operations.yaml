id: order-of-operations
subject: math
why: |-
  Math is a shared language, with agreements so an expression means one thing to everyone. Parentheses teach a child to say exactly what they mean.
hook:
  title: Can 20 be right?
  time: 5 minutes
  covers: [U1.2, K1.1]
  body: |-
    1. Write \(4 \times 3 + 2\) large on paper, and ask what it equals. Your child will likely say 14.
    2. Say: "A friend says 20, and my friend can multiply just fine."
    3. Ask: **"How might they have got 20? What would have to change on this page to make 20 right?"**
    4. Welcome every idea, and confirm none yet.
activities:
  - title: The very literal cook
    time: 15 minutes
    materials: Beans and buttons as food, a few plates, paper
    covers: [K1.1, U1.1, U1.2, S1.1]
    steps:
      - You are a cook who does exactly what an order says, and never what anyone meant. Your child is the waiter.
      - '"Three tables each want 5 tacos and 2 pickles." Your child writes the whole order as one expression.'
      - Follow it to the letter, using the order of operations. If it says \(3 \times 5 + 2\), make 15 tacos and exactly 2 pickles for the whole restaurant.
      - Let your child rewrite the order until every table is happy.
      - Swap roles. You write orders that go wrong, and your child cooks them just as written.
  - title: Spoon parentheses
    time: 10 minutes
    materials: Paper, a pen, two spoons
    covers: [S1.1, U1.2, K1.2]
    steps:
      - Write \(3 + 4 \times 6 - 2\) with big gaps between the numbers. The value with no spoons is 25.
      - |-
          Two spoons are parentheses. Place them around one + or − and its two numbers, then find the new value: your treasure.
      - Each player tries to get the most treasure. Then try for the least. (Highest is 40 and lowest is 19.)
      - Your child writes a new expression to challenge you, and hunts for a place where the spoons change nothing.
questions:
  - What do you want to happen first in this story? How could you show that in writing?
  - If we delete these parentheses, does the value change? How could you find out?
  - Why would people bother to agree on an order at all? What would go wrong if they hadn’t?
  - What is this expression worth? Can you say it in a different way, with other numbers?
misconceptions:
  - thought: '"You just go left to right, like reading."'
    why: Everything else they read goes left to right. It’s the most sensible first guess.
    tryThis: Try the literal cook with \(3 + 2 \times 5\), once going left to right and once following the rule. Ask what each one is saying about the food.
  - thought: '"20 − (5 + 3) is the same as 20 − 5 + 3. The parentheses are just decoration."'
    why: Parentheses often seem to change nothing, and in many expressions they don’t. It takes a certain kind of expression to see that they matter.
    tryThis: |-
      Tell a coupon story: pay for two things out of $20, both ways. What is the + 3 doing to your money?
  - thought: '"Add before you subtract, and multiply before you divide."'
    why: The rule is often said with the operations in a list, and it sounds like a ranking.
    tryThis: Try \(20 - 8 + 3\) both ways with counters. Then say the rule. + and − go in the order they appear, from left to right, and so do × and ÷.
lookFor:
  - They scan an expression and say what happens first before calculating.
  - They write parentheses because of what a story needs, not just because they were told to.
  - They predict that a pair of parentheses won’t change a value, and they can say why.
  - They fix a wrong expression by asking what the person meant.
adapt:
  support:
    - 'Start with two operations and one pair of parentheses, such as \(2 \times (3 + 4)\), and small numbers.'
    - Circle or highlight the first step in colour. Rewrite the expression on a new line after each step, so only one thing changes at a time.
    - Attach every expression to a story with objects before it stands alone.
  access:
    - need: reading
      tip: Long expressions can look like a blur. Write them large, with wide gaps, and cover everything but the part you’re working on.
    - need: writing
      tip: Rewriting a line for each step is a lot of writing. Your child can say each step while you write, or use the lesson’s step-by-step view.
    - need: attention
      tip: The literal cook turns each expression into a short, silly scene. One or two orders is a good day’s work.
    - need: language
      tip: '"Parentheses" is a long word, and "brackets" is used too. Use the spoons, or draw them with your fingers, and tell a simple story in words your child knows.'
    - need: worry
      tip: Take the wrong answers yourself as the cook. When a meal goes silly, the fault is in the order, and there’s nothing to be embarrassed about.
  stretch:
    - 'Using exactly four 4s, and parentheses that hold + or − with none inside another, which numbers from 1 to 5 can you make?'
    - Look for an expression where a pair of parentheses changes nothing, and one where the same pair changes everything. Explain the difference.
together:
  - problem: d1
    how: Use play money and act out the purchase before writing anything. Ask your child to match each step in the story to a part of the expression.
  - problem: d3
    how: |-
      - Test whether a basic calculator behaves like Nonna’s, or one of you plays the calculator.
      - Your child explains what the machine did at each step.
