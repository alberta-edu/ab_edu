id: solving-equations
subject: math
why: Solving an equation is reasoning backward from a result to what must have been true at the start. A child also learns that they can prove their own answer, without waiting for an adult to say it’s right.
hook:
  title: I can read your mind
  time: 5 minutes
  covers: [K3.1, S3.2]
  body: |-
    1. Say: "Think of a whole number. Double it. Add 3. What did you get?"
    2. Name their number straight away. Repeat a few times, with a straight face.
    3. Just for you: take away 3, then halve it. An even number means they slipped.
    4. Ask: **"What am I doing with your number? How could you catch me out?"**
activities:
  - title: Under the cups
    time: 15 minutes
    materials: 3 cups you can’t see through, 2 plates, and beans or buttons
    covers: [K3.1, U3.1, U3.2, S3.3, S3.4]
    steps:
      - |-
          Out of sight, hide 4 beans under each of 3 cups, with 2 loose beside them. Put 14 on the other plate: "Both plates are equal."
      - 'Give the rules: no peeking, and whatever you do to one plate, you must do to the other.'
      - 'Your child works out how many beans are under one cup. If they’re stuck, ask, "What could you take from both plates and keep it fair?"'
      - They say their number, and count both plates as if it were true. Only then lift the cups.
      - Swap. They hide the beans and you solve out loud. Take beans from one plate only, on purpose, and let them stop you.
  - title: House mysteries
    time: 15 minutes
    materials: Paper, and things around the house such as cans, forks, socks or books
    covers: [S3.1, S3.4, S3.5]
    steps:
      - In secret, your child sets up a scene with equal groups and some extras, such as 4 shelves with the same number of cans and 3 more on the counter. They count the total.
      - |-
          They write a story that hides the group size: "4 shelves hold the same number of cans, plus 3 on the counter. 31 cans in all."
      - Everyone else writes an equation and solves it, without looking.
      - Go and see. Whoever solved it checks by putting their answer back in the equation, then by counting the real cans.
questions:
  - What happened to \(x\) first? What happened last?
  - How could you find out if you’re right without asking me?
  - Is \(11 = 2x + 3\) allowed, with the equals sign in that spot? Would it change the answer?
  - If you take 2 from this side only, what happens? How could you make it fair again?
  - What story could go with this equation? Could a very different story fit it too?
misconceptions:
  - thought: '"In \(3x + 6 = 21\), I’ll divide by 3 first, so \(x + 6 = 7\)."'
    why: They have learned that multiplying comes first in an expression, so it seems natural to deal with it first here too. And only the 3 is standing next to \(x\).
    tryThis: |-
      Put on a sock, then a shoe. Which comes off first? Then ask what went on \(x\) last.
  - thought: '"I took the 5 away from \(x + 5 = 9\), so \(x\) must be 9."'
    why: The 5 is gone from where they were looking, and the left side now looks finished.
    tryThis: Go back to the plates. Take 5 beans from one plate only, and ask whether they still hold the same number.
  - thought: '"My check didn’t work, so I must have checked it wrong."'
    why: They worked hard on the steps, and the check is the shortest part. It’s natural to doubt the small thing and trust the big thing.
    tryThis: Treat a failed check as good news, like a smoke alarm that works. Ask, "Where could we look for what it’s warning us about?"
lookFor:
  - They say what was done to the variable, in order, before they start to undo anything.
  - They do the same thing to both sides without being reminded, and they object when someone doesn’t.
  - They check an answer without being asked, and believe the check.
  - They make up a story for an equation, or an equation for a story.
adapt:
  support:
    - Start with one step, as in \(x + 5 = 9\), using beans. Add the second step when taking away from both plates feels fair and obvious.
    - Have your child guess a number and test it in the equation. Guessing and checking is a sensible way to learn what a solution is.
    - Say "undo" in place of "inverse operation" until the idea is steady.
  access:
    - need: reading
      tip: Read a story aloud and act it out with objects before anyone writes an equation.
    - need: writing
      tip: Write each line of a solution on its own slip. Your child arranges the slips, and you copy down the moves they call out.
    - need: attention
      tip: Do one undo at a time, with a real move of beans each time. Stop and stretch between the two steps if that helps.
    - need: worry
      tip: The check belongs to your child. They can find out for themselves whether they are right, so being wrong stays private and fixable.
    - need: language
      tip: '"Solution" has other meanings in everyday English. Show what it means here: the number that makes both sides match.'
    - need: hands
      tip: Your child calls the move, such as "take 2 from both", and you move the beans. The thinking is all in the calling.
  stretch:
    - Write an equation that looks fine but has no whole-number solution, like the one Jude’s result gives. How can you tell before you finish solving it?
    - |-
        Hide 6 in an equation like \(ax + b = 40\). How many whole-number versions exist? Which values of \(a\) stop working, and why?
together:
  - problem: d1
    how: Set it up with plates if you can, with beans standing in for kilograms. Before the last part, let your child test each change on the plates and say what happened.
  - problem: d3
    how: |-
      - Your child tries a value of \(a\), even one that won’t work. Then swap equations and solve each other’s.
      - Ask what they did first when making it, and what the solver did first.
