id: add-subtract-fractions
subject: math
why: This topic teaches a child to ask what is being counted before they calculate. Once eighths are things you can count, like apples, a rule to memorize turns into something they can reason out for themselves.
hook:
  title: The overflow
  time: 5 minutes
  covers: [K1.1, K1.3, S1.2]
  body: |-
    Set out an empty egg carton or muffin tin with **12** cups, and say that the whole thing is one whole. Put a bean or piece of cereal in **7** cups. Ask what fraction of the carton is filled.

    Then hand over **8** more, and ask your child to put one in each empty cup. They’ll run out of cups with pieces still in their hand.

    Ask: **"Now what? How much do we have altogether? What would you write?"** Don’t settle it. Let them hold on to the extra pieces as you open the lesson.
activities:
  - title: Eighths race
    time: 15 minutes
    materials: A die, paper, a small marker for each player
    covers: [S1.2, S1.4, K1.2, K1.3]
    steps:
      - Draw a track of three long bars, each split into **8** boxes. Mark a few boxes "slip back 3 eighths".
      - 'On your turn, roll and move that many eighths. Say the sum aloud: "5 eighths plus 4 eighths is 9 eighths, or 1 and 1 eighth."'
      - If you land on a slip-back box, say the subtraction out loud as you move.
      - The first to reach three wholes wins. Stop the game to ask whether the size of the pieces ever changed.
  - title: The perfect afternoon
    time: 15 minutes
    materials: Paper and a pencil, a clock or timer if you want to try the plan
    covers: [S1.3, S1.4, S1.5, K1.3]
    steps:
      - 'Your child has exactly **3 hours** to plan, in quarter hours only. Write every time in fourths, even half an hour, which is \(\frac{2}{4}\).'
      - 'They list what they’d do and how long, such as \(\frac{3}{4}\) hour biking and \(1\frac{2}{4}\) hours building.'
      - After each item, they add it to the total and work out how much time is left.
      - 'Try the total both ways, with mixed numbers and with improper fractions. Ask: "Which was easier today? Would it always be?"'
questions:
  - What kind of piece are we counting? Did that change?
  - Could adding ever make the answer smaller than what you started with? What would that tell you?
  - Would you rather do this with mixed numbers or improper fractions? Why these numbers?
  - How could you undo that step, to check it?
  - Say this sum using words, not symbols. What do you notice?
misconceptions:
  - thought: '"\(\frac{3}{8} + \frac{2}{8} = \frac{5}{16}\). You add the tops and add the bottoms."'
    why: Adding is what you do with numbers, and they see four numbers. Nothing tells them that the bottom number is a different kind of number.
    tryThis: Say it in words, "3 eighths plus 2 eighths". Then fold a paper strip to check. Could adding make the pieces smaller?
  - thought: '"Nutmeg is ahead by \(1\frac{3}{5}\), so handing that over makes it even."'
    why: The gap seems like the amount to fix. They’re thinking of one pile at a time.
    tryThis: Use two piles of buttons. Move one button and ask what happened to each pile, and to the gap.
  - thought: '"In \(3\frac{1}{5} - 1\frac{3}{5}\), I just subtract the smaller from the bigger."'
    why: It’s the same habit as whole-number columns, and it gives a tidy answer.
    tryThis: Draw 3 wholes and one extra fifth, then ask them to cross off \(1\frac{3}{5}\). They’ll have to cut open a whole, and they’ll see why.
  - thought: '"Improper fractions are the proper way," or "mixed numbers are always better."'
    why: Children often assume there is one correct method, and that the others are for people who can’t do it.
    tryThis: Time both on an easy sum with big wholes, then both on one that needs regrouping. Let them see that each one wins sometimes.
lookFor:
  - They read a fraction as a count of pieces, saying "that’s five eighths" with some meaning.
  - They notice when an answer has to be more or less than where they started, before calculating.
  - They look at the numbers before choosing between mixed numbers and improper fractions.
  - They check a subtraction by adding back, without being told.
adapt:
  support:
    - 'Start within one whole. Share 8 crackers among family members in different ways, and say each share in eighths.'
    - Keep the denominator in words at first, "2 fourths", and bring in the written form later.
    - Stay with sums that make less than one whole until counting pieces feels easy.
  access:
    - need: reading
      tip: Fractions inside sentences are hard to read. Rewrite the numbers large on paper, and read the story aloud while your child draws it.
    - need: writing
      tip: Fractions take fine pencil control, and mixed numbers take more. Let your child say the answer in words, or use the site’s answer box, while you handle any writing.
    - need: attention
      tip: A few turns of Eighths race is enough. Rolling and moving gives every sum a clear purpose and a clear end.
    - need: worry
      tip: The otters problem and Fern’s trap have many right answers. Try one of those first, so there’s no single answer to miss.
    - need: language
      tip: '"Eighth" and "eight" sound alike, and so do "fourth" and "four". Hold up pieces as you say the words, and put the two words side by side when your child is ready.'
  stretch:
    - 'Try the jars trick with other rows, such as \(\frac{1}{50}\) up to \(\frac{49}{50}\) or \(\frac{1}{7}\) up to \(\frac{6}{7}\). Which rows leave a jar with no partner? Why?'
    - 'Write a two-step backwards story, like the snow on the picnic table, using mixed numbers with the same denominator. Test it on someone.'
together:
  - problem: d1
    how: Use buttons as the seeds, with each button worth one fifth. Let your child try Eli’s idea with real piles and be surprised, before anyone says why it went wrong.
  - problem: d2
    how: Use glasses with water if you can, or draw the jars. Ask what a lazy person would pour first, and let your child find the pairing on their own.
  - problem: d3
    how: Ask your child to make you fall into the trap. Try their subtraction by taking the smaller numerator from the bigger one, and ask how they could tell you got caught.
