id: divisibility-factors
subject: math
why: Divisibility shows a child that numbers have an inner structure you can read without calculating. It also gives them an early taste of testing a rule, and of asking whether a pattern that has worked so far must keep working.
hook:
  title: One more cracker
  time: 5 minutes
  covers: [U1.1, S1.1]
  body: |-
    1. Put **12** crackers on the table. How many friends could share them fairly, with none left over? Let your child deal them out.
    2. Add one more, so there are **13**, and try again. Almost every sharing breaks.
    3. Ask: **"I gave you more, and it got harder. How can that be?"** Leave it there, and eat the evidence.
activities:
  - title: Number hunt
    time: 15 minutes or a whole walk
    materials: A walk or drive, or a stack of flyers and old mail
    covers: [S1.2, K1.1]
    steps:
      - Spot a number in the wild, such as a house number, a bus route or a price without its cents.
      - Race to call which of the tests it passes for 2, 3 and 5, and give the reason. Each correct test scores a point.
      - Declare a jackpot for any number that passes all three. Before you hunt, ask what such a number has to look like.
      - Settle arguments with a calculator when you get home.
  - title: The marching band
    time: 15 minutes
    materials: 48 small things, such as pasta, coins or building bricks
    covers: [S1.3, K1.1, U1.1]
    steps:
      - |-
          Before moving anything, use the tests: rows of 2? Rows of 3? Rows of 5? Your child says yes or no, and why.
      - March them out and check each prediction. Then try other row sizes, dividing or dealing to see what happens.
      - For each one that works, write down the row size and the number of rows. Those are a pair of factors.
      - 'Ask: "Are we sure we’ve found them all? How would you know when to stop looking?"'
  - title: The empty plates
    time: 5 minutes
    materials: 12 crackers and some plates
    covers: [K1.2, U1.1]
    steps:
      - Put 3 crackers on each plate until all 12 are used. Count the plates. Do it again with 2 crackers per plate, then 1.
      - 'Now say, with a straight face: "Put **0** crackers on each plate until all 12 are used."'
      - Keep setting out plates, as many as your child wants, and keep asking whether the crackers are gone yet.
      - Ask how many plates it would take, and let your child tell you why they can’t answer.
questions:
  - Before you divide, what can you already tell about this number?
  - Why does the test for 5 care only about the last digit, when the test for 3 cares about all of them?
  - If a number is divisible by 2, must it be divisible by 4? How could you find out?
  - You found a rule that has worked three times. Is that enough? What would break it?
  - Is 0 ÷ 8 the same kind of question as 8 ÷ 0? What does each one ask?
misconceptions:
  - thought: '"It has a 5 in it, so it’s divisible by 5."'
    why: The digit 5 is right there, and it looks like it should count for something.
    tryThis: Count by fives together and write the numbers in a list. Ask which digit keeps a pattern, and which digits do anything they want.
  - thought: '"It ends in 2, so it can’t be divisible by 3."'
    why: The tests for 2 and 5 only use the ones digit, so it’s reasonable to expect the test for 3 to do the same.
    tryThis: Count by threes up to 30 and look at the last digits. Every digit shows up, so the last digit can’t be the clue.
  - thought: '"12 ÷ 0 is 0," or "12 ÷ 0 is 12."'
    why: Zero usually makes things vanish, or leaves them alone. Either guess fits something they know about zero.
    tryThis: Do the empty plates. Then check each guess by multiplying back. What number times 0 makes 12?
  - thought: '"The digit-sum test works for 3, so it must work for 4 too."'
    why: Spotting a pattern and extending it is good thinking, and here the extension happens to fail.
    tryThis: Praise the idea, then ask them to try to break it with a two-digit number. A rule fails as soon as one number breaks it.
lookFor:
  - They use a test on a big number instead of reaching for long division.
  - They stop looking for factors at a sensible point and can say why.
  - They treat "it worked a few times" as a reason to test more, not as proof.
  - They explain that you can’t divide by zero with their own example, not just as a rule.
adapt:
  support:
    - Start with the tests for 2 and 5, using counters in rows. Save the digit sum for after they feel successful.
    - Use small numbers, within 30, that can actually be dealt out by hand.
    - Keep a card with the three tests on it nearby. The goal is using them, not memorizing them on the first day.
  access:
    - need: reading
      tip: Read the pirate and hockey card stories aloud, and act out each share with objects before anyone reads the question.
    - need: writing
      tip: Have your child build factor pairs as rows of objects. You can record them, or take a photo as the record.
    - need: attention
      tip: The number hunt suits a child who needs to move. Stop as soon as the energy drops, and come back another day.
    - need: hands
      tip: Dealing small things can be tiring. Use the lesson’s hundred chart with a keyboard, or have your child direct you as you deal.
    - need: language
      tip: '"Divisible" is a long word for a simple idea. Start with "shares fairly with none left over", and bring in the math word once the idea is clear.'
  stretch:
    - |-
        Find numbers that pass the tests for 2 and 3. Are they all divisible by 6? Hunt for one that isn’t.
    - Which numbers from 1 to 100 have someone dancing alone at the Factor Dance? Predict the next one before you check it.
together:
  - problem: d1
    how: Set out coins as treasure and take on the roles of pirate and parrot. Ask which test to try first, and let your child build a list of candidates before checking for the parrot.
  - problem: d2
    how: Put each factor of 36 on a slip and physically pair the slips up. When one slip is left without a partner, ask what’s going on, and let that sit.
