id: ratios-percentages
subject: math
why: Ratios teach a child that a number means little until you know what it’s being compared with. A child who asks "out of how many?" is better prepared for every poll, headline and sales pitch they’ll meet.
hook:
  title: The 100% shooter
  time: 5 minutes
  covers: [K1.3, S1.2]
  body: |-
    1. Crumple paper into a ball and set a bin on the floor.
    2. Stand over the bin, drop the ball in once, and announce: **"One shot, one basket. I’m a 100% shooter."**
    3. Your child takes **10** shots from a fair distance. Say they make 6: "Only 60%? So I’m better."
    4. Ask: **"Am I? What would you say to me?"** Enjoy the outrage, and don’t settle it.
activities:
  - title: The clue bag
    time: 15 minutes
    materials: A bag or cup, and 10 small things of two or three kinds, such as buttons, coins or bricks
    covers: [K1.1, K1.2, S1.1, U1.1]
    steps:
      - Your child secretly puts exactly **10** things in the bag, using two or three kinds.
      - |-
          They give clues as ratios from the real counts, like "Red to blue is 3 : 5. Red to everything is 3 : 10."
      - You work out what’s inside and say your reasoning out loud. Then tip out the bag and check.
      - Swap roles. Give one clue that isn’t enough, and ask your child what else they need to know.
  - title: The hundred-square flag
    time: 20 minutes
    materials: Grid paper or a hand-drawn 10 by 10 grid, three markers
    covers: [K1.3, S1.2, U1.2]
    steps:
      - Your child designs a flag on the grid, using three colours and filling every square.
      - You look at it and guess each colour’s percentage. Your child counts and tells you how close you got.
      - 'They label each colour four ways: as a ratio, a fraction, a decimal and a percentage, such as 30 : 100, \(\frac{30}{100}\), 0.30 and 30%.'
      - 'Ask: "Add the three percentages. What do you get? What would it mean if you got something else?"'
questions:
  - Out of how many? How do you know that’s the whole?
  - Is this comparing a part with a part, or a part with the whole?
  - Which number should go first in this ratio? How does the wording tell you?
  - Could someone have more of something and still have a smaller percentage? How?
  - If these percentages add to more than 100, is something wrong? What would you check?
misconceptions:
  - thought: '"5 marshmallows and 20 oat bits is 25% marshmallows."'
    why: The fraction \(\frac{5}{20}\) really does equal \(\frac{25}{100}\). They’ve done the math correctly on the wrong comparison.
    tryThis: Ask what the 20 is counting. Then pour the pieces together and ask how many are in the bowl.
  - thought: '"3 out of 4 is 34%, or 0.34."'
    why: They see two digits, and percentages and decimals look like digits placed side by side.
    tryThis: Colour 3 of 4 sections of a bar. Ask whether it looks like about a third, or much more.
  - thought: '"0.7 is 7%."'
    why: The 7 is right there, and it seems natural to just add the percent sign.
    tryThis: Shade 0.7 on a hundred grid by colouring 7 full rows, then count the squares.
  - thought: '"More fans means a bigger percentage."'
    why: In everyday talk, more is better, and the whole is easy to forget because it isn’t in the sentence.
    tryThis: Compare a family of 4 where 3 like broccoli with a school of 100 where 10 do. Ask who loves broccoli more.
lookFor:
  - They ask "out of how many?" when they hear a percentage.
  - They say which is the part and which is the whole before writing a ratio.
  - 'They read 3 : 5 and 5 : 3 as different statements, and they can say what each one means.'
  - They catch a claim where the parts can’t add up to the whole.
adapt:
  support:
    - Use objects a child can sort by hand, and say the ratio in words first, "3 red for 5 blue".
    - Keep the whole at 10 or 100 until moving between fractions, decimals and percentages feels steady.
    - Use one situation, such as one bag of buttons, for all four forms. It helps them see that nothing has changed but the writing.
  access:
    - need: reading
      tip: Words like "to" and "of" carry the whole meaning here. Read them with extra stress, and point to the two groups as you say them.
    - need: language
      tip: '"Percent" may be a new word. Point at a hundred grid as you say "out of 100", and use that phrase often.'
    - need: hands
      tip: The lesson’s grid has a slider that works with a keyboard. For the flag, your child can name squares for you to colour.
    - need: worry
      tip: In the clue bag, your child holds all the answers and you do the guessing, so someone else is on the spot.
  stretch:
    - Try the flag with 20 or 25 big squares in place of 100. Which percentages can you make, and which can’t you?
    - Invent a poll report that must have a mistake in it, and one that only looks like it does. Then see if someone else can tell which is which.
    - 'If a "25% off" sign comes up in a store, talk about what the number means, 25 out of 100. Working out the sale price comes later, in Grade 6.'
together:
  - problem: d1
    how: Throw balled-up paper yourself, or act it out. Ask your child to predict what will happen to the percentage while Waffles sleeps, before working anything out.
  - problem: d2
    how: Draw two classrooms and let your child fill them with fans. Ask which room should be big and which should be small, and why that might help.
  - problem: d3
    how: Run both polls at the table, with stuffed animals as voters if you need more. Ask in which poll one voter can be counted two times.
