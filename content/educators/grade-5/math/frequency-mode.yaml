id: frequency-mode
subject: math
why: Data doesn’t speak for itself. Someone chose the question, the list and the categories, and a child who knows this can look at any poll or graph and ask what was counted and what was left out.
hook:
  title: What is there most of?
  time: 5 minutes
  covers: [K2.4, S1.1]
  body: |-
    1. Open a junk drawer or toy bin. Ask: **"What is there most of in here?"**
    2. Let your child answer from a glance, then prove it any way they like.
    3. When they have a winner, disagree: "I say there is most of *red things*." Or *broken things*.
    4. Ask: **"Who is right? How could we settle it?"** Don’t settle it.
activities:
  - title: The rigged poll
    time: 20 minutes
    materials: Paper and a pencil, and at least five people to ask, in person, by phone or by message
    covers: [K2.1, K2.2, K2.3, S1.5, S2.1, S2.2]
    steps:
      - 'Your child writes a closed-list question with a shamelessly rigged list, such as "Are my jokes funny, very funny, or the funniest ever?"'
      - They ask at least five people, tally the answers, and announce the mode with great ceremony.
      - 'Ask: "What did we actually find out? Who couldn’t tell the truth on this list?" Then they write a fair list and ask again.'
      - |-
          Ask the same people an open-ended question, like "What do you think of my jokes?" Sort, count, and compare the versions.
  - title: Window scoreboard
    time: 20 minutes
    materials: Paper, and beans, buttons or coins
    covers: [K1.2, K2.4, K2.5, S1.2, S1.3, S1.4, S2.4, S2.5]
    steps:
      - 'Pick something to count: cars going past a window, birds at a feeder, shoes at the door, or things in the fridge. Your child writes down a prediction of the mode.'
      - They choose the categories, and tally for about ten minutes. Then they make a frequency table.
      - Turn the table into a graph on the floor, with a stack of coins for each category, or with a column of beans for a dot plot.
      - |-
          Ask: "Was your prediction right? One mode, two, or none?" Sort by colour, then by type. Did the mode change?
questions:
  - Is this number a category or a count? How can you tell?
  - Who couldn’t answer this question truthfully?
  - If we sorted these answers a different way, would the mode change?
  - Can something be the mode when most people didn’t choose it?
  - What question can this graph answer? What question can’t it answer?
misconceptions:
  - thought: '"The mode is 9."'
    why: They just hunted for the biggest number and found it, so it feels like the answer. It’s harder still when the categories are numbers, such as shoe sizes.
    tryThis: Ask them to read the row as a full sentence, "9 people chose toque." Then ask which part of that sentence is the category.
  - thought: '"Two bars tie for tallest, so there is no mode."'
    why: In a game, a tie means nobody won, so a tie seems to cancel the winner.
    tryThis: Stack coins into two tall stacks and two short ones, then make all the stacks equal. Ask what is different about those two pictures.
  - thought: '"The mode is what most people want."'
    why: The mode looks like the winner of a vote, and we often say that winners are what most people wanted.
    tryThis: Hold a family vote with one favourite and several similar choices, and count the votes that did not go to the mode. The mascot problem is built on this.
  - thought: '"Each dot is one tooth."'
    why: The dot sits right above the label "2 teeth", so it seems to be counting teeth.
    tryThis: Build the plot with real beans, one for each child, and ask what one bean stands for. Then ask how many teeth that bean’s child lost.
lookFor:
  - They name a category as the mode, not a number from the frequency column.
  - They ask who answered, or what was on the list, before they trust a result.
  - They try sorting data another way, just to see what changes.
  - They can say why they chose a table, a bar graph or a dot plot for a set of data.
adapt:
  support:
    - Start with real objects in piles, three categories and about ten things. Add tally marks once piling feels easy.
    - Work with bar graphs and dot plots for a while before stem-and-leaf plots. Build the plots from real objects first.
    - For a stem-and-leaf plot, read out each leaf as a full number, such as "stem 2, leaf 5, that’s 25".
  access:
    - need: reading
      tip: Read the question and the category names aloud. Most of the numbers in these problems are short, so the words are where a child can get stuck.
    - need: writing
      tip: Use beans, stacks and tally marks. A person can run a whole survey with no written sentences, and you can jot down what they call out.
    - need: attention
      tip: Live counting at a window has its own suspense. Keep it short, and have a prediction on the line.
    - need: worry
      tip: A survey result can’t really be wrong, because it reports what happened. A surprise is the most interesting thing that can come out of it.
    - need: language
      tip: '"Mode" also shows up on phones and games, and "frequency" on radios. Say "how many times" alongside "frequency" for a while, and point at the category as you say "mode".'
  stretch:
    - Can 20 votes among 3 flavours have no mode? What about 21? What must be true of the total for that to happen?
    - Take a real set of numbers, such as the minutes your family read this week, and make a stem-and-leaf plot. Then find a way to sort the same data so a different category becomes the mode.
together:
  - problem: d1
    how: |-
      - Give each dot a bean and a pretend child’s name. Ask what one bean stands for.
      - Hand over coins from a real pile, column by column. Which column empties the pile fastest?
  - problem: d3
    how: |-
      - Use 21 buttons in three cups. Set up the ending first, then go back one vote.
      - Check by rebuilding the start of the story from the cups.
