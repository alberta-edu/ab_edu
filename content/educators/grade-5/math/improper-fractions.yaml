id: improper-fractions
subject: math
why: |-
  A fraction becomes a number you can count with, past one and beyond, not only "part of something". One amount can wear two names, and you pick the one that fits.
hook:
  title: Seven out of four?
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. Tear two slices of bread into four pieces each. Put **7** pieces on a plate, and eat the last one.
    2. Ask: **"How much bread is on this plate?"** Take whatever they say.
    3. Add: "One friend says seven fourths. Another says that’s impossible: you can’t have 7 out of 4."
    4. Ask: **"Who is right?"** Don’t settle it.
activities:
  - title: Hop the line
    time: 10 minutes
    materials: Masking tape or chalk, or a row of floor tiles
    covers: [S1.1, S1.2, U1.2]
    steps:
      - Make a long line with marks for **0, 1, 2 and 3**, about three small hops apart.
      - 'Your child hops from 0, saying each landing in thirds: "One third. Two thirds. Three thirds. Four thirds."'
      - 'Call "Freeze!" at a random moment. Your child says where they are in both ways, such as \(\frac{7}{3}\) and \(2\frac{1}{3}\).'
      - Now make it four hops per whole. Ask them to walk straight to \(\frac{7}{4}\) before anyone counts, then count to check.
  - title: Only one scoop
    time: 15 minutes
    materials: A 1/4-cup measure or a small cup, a bowl, dry rice or water
    covers: [S1.3, S1.5, K1.4]
    steps:
      - 'Say: "This recipe needs \(1\frac{3}{4}\) cups, and this is the only scoop we own. How many scoops?" Your child predicts first.'
      - Scoop into the bowl, counting out loud in fourths, and see if the prediction holds. There’s no need to cook anything.
      - 'Reverse it: "I used 11 scoops. What did the recipe say?" Your child answers with a mixed number, then checks by scooping.'
      - Look through a real recipe for any amount given in fourths, and predict its scoops.
questions:
  - What is the whole here? How do you know?
  - When does it make sense to have more than one of something, and when doesn’t it?
  - Why does the bottom number stay the same when you change the name?
  - Is this closer to 1 or to 2? How can you tell without calculating?
  - You’re ordering pizza. Would you say \(\frac{11}{4}\) pizzas or \(2\frac{3}{4}\) pizzas? Why?
misconceptions:
  - thought: '"You can’t have 7 out of 4."'
    why: Fractions have usually been taught as a part out of a whole, and you really can’t take 7 out of 4 things.
    tryThis: Change the words to "7 fourths". Lay out the fourths and count them, the way you would count anything else.
  - thought: '"Two bars with 8 of 10 parts shaded is \(\frac{8}{10}\)."'
    why: Counting shaded parts out of all the parts is exactly what they did with one whole.
    tryThis: |-
      Cover the second bar: how many parts make one bar? Then uncover it. The denominator is the piece size, not the picture size.
  - thought: '"\(3\frac{1}{2}\) is \(\frac{4}{2}\), because 3 + 1 = 4."'
    why: It’s a tidy way to combine the numbers they can see, and nothing on the page says a whole is more than one part.
    tryThis: Build it with socks. Three pairs and one extra sock is how many single socks? Ask where the robot’s answer loses some.
  - thought: '"\(1\frac{3}{4}\) means 1 times \(\frac{3}{4}\)."'
    why: Elsewhere, numbers written side by side can mean multiplying, so it’s a fair guess.
    tryThis: Scoop it. One full cup and three more scoops. Ask whether that looks like 1 times something or 1 plus something.
lookFor:
  - They ask what the whole is before answering.
  - They move between both names without being asked, and they say they’re the same amount.
  - They place a fraction on a line by thinking about wholes first.
  - They reject a fraction past 1 when the situation can’t go past 1, such as a full tank.
adapt:
  support:
    - 'Start with halves and socks. 7 socks is \(\frac{7}{2}\) pairs, which is 3 pairs and one lonely sock.'
    - Build every fraction with objects or folded paper before writing it.
    - Stay with one denominator for a while, such as fourths, and count far past one before changing it.
  access:
    - need: hands
      tip: If hopping or scooping is hard, walk a toy along a paper line. The lesson’s fraction explorer does the same counting with a keyboard.
    - need: language
      tip: Say fractions as counting words, "seven fourths", and not as "seven over four". The word "fourths" tells your child what is being counted, the same as "seven apples" does.
    - need: reading
      tip: Math symbols can be hard to track. Read each fraction aloud as you point, and build it first. Writing it can come last.
    - need: worry
      tip: The hook has no wrong side. Ask your child to argue for one friend, then to argue for the other, so the debate feels like a game and not a test.
    - need: attention
      tip: Keep it moving. Hopping or scooping gives a job to the body, and three or four rounds is plenty for one sitting.
  stretch:
    - 'Pick a new whole, such as a box of 12 crayons or a 6-egg carton. Count what’s in the house and name it as an improper fraction and a mixed number.'
    - Invent three improper fractions that land between 3 and 4, then decide which one is closest to 4 and defend your choice.
together:
  - problem: d1
    how: Use toy wheels, coins or buttons as the pile, and group them as you go. Ask what changed when you switched from tricycles to cars, and what stayed the same.
  - problem: d3
    how: Have your child draw the trail with the 2 km and 3 km marks, and point to a spot before writing anything. Ask what number sits exactly halfway.
