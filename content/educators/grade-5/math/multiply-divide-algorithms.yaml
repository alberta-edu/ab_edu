id: multiply-divide-algorithms
subject: math
why: |-
  A big, scary job breaks into small jobs by place value. And the story, not the calculation, decides what an answer means, so a remainder can be everything or nothing.
hook:
  title: How many days old are you?
  time: 5 minutes
  covers: [S1.5, S1.6]
  body: |-
    1. Ask: **"Have you been alive for more than 1 000 days? 10 000? A million?"** Everyone commits, with no calculating.
    2. Ask: **"How could we find out without counting calendar squares? What would we need to know?"**
    3. Write the guesses down, and come back to them after the lesson.
activities:
  - title: The paper money bank
    time: 15 minutes
    materials: Paper slips marked 100, 10 and 1, six bowls or cups
    covers: [S1.1, S1.3]
    steps:
      - 'Make **$624** in slips: six 100s, two 10s and four 1s. Set out six bowls. The bank must share it all fairly.'
      - Share the biggest slips first, one 100 per bowl. Set up \(624 \div 6\) as a long division beside the bowls, and write what each bowl got above the hundreds digit.
      - |-
          Now the two 10s: not enough to go around. What do you write for the tens, and what happens to the slips?
      - Trade them at the bank for ones, and finish sharing. Compare the bowls with the long division, line by line.
  - title: Pack it up
    time: 15 minutes
    materials: About 130 small things, such as dried beans or cereal
    covers: [S1.3, S1.4]
    steps:
      - Pour out a pile and count it in groups of ten, so you know the exact number. Packs hold 6.
      - Your child estimates how many packs, then does the division on paper.
      - |-
          Ask about one pile: How many full packs for the shelf? How many packs to carry every bean? How many beans for a snack?
      - Your child invents a fourth story for the same division, one where the remainder matters in a new way.
  - title: How big is this book?
    time: 15 minutes
    materials: Any book with a section under 100 pages
    covers: [S1.2, S1.5, S1.6]
    steps:
      - Everyone writes down a guess for how many words are in one chapter or section.
      - Count the words in one ordinary line, and the lines on one ordinary page. Multiply to get the words on a page.
      - Round to estimate the total first, then multiply the words on a page by the number of pages.
      - 'Check the guesses. Ask: "Is our answer exact? Which parts are rough, and how could it be off?"'
questions:
  - About how big should this answer be, and how do you know?
  - In this row, what is that 2 really worth?
  - What does the remainder mean in this story? Would it mean the same thing in another story?
  - Your remainder is 12 and you’re dividing by 7. What could happen next?
  - Is there a faster way for these particular numbers? What would make you choose it?
misconceptions:
  - thought: '"8 doesn’t go into 2, so skip it."'
    why: Nothing to share feels like nothing to write. Zeros seem like they don’t need recording.
    tryThis: Use the paper money bank, and ask what each bowl got from that place. Writing 0 means "no tens", and it holds the other digits where they belong.
  - thought: '"The 2 in 26 is just 2, so I multiply by 2."'
    why: Each digit looks like a small, separate number, and the algorithm hides the place value.
    tryThis: Ask what 347 × 2 is and what 347 × 26 should be near. Then ask where the placeholder zero came from, and what it’s telling us.
  - thought: '"32 each, with 12 left over. It checks, so it’s right."'
    why: Their multiplying back really does work. Nothing in the check says the leftovers had to be small.
    tryThis: Act it out with 12 buttons and 7 cups. Ask what those cups would say about the 12 leftovers.
  - thought: '"You always round up," or "you always drop the remainder."'
    why: They’ve seen one or the other work on past questions, and rules feel safer than judgment.
    tryThis: |-
      Tell two stories for one division: eggs in cartons, then students in vans. What happens to the last few?
lookFor:
  - They estimate before calculating, and they notice when an answer is about ten times off.
  - They say what a digit is worth as they work, such as "that’s 20 times 347".
  - They ask what the story wants before saying what to do with a remainder.
  - They choose a mental shortcut when the numbers invite one, and use the algorithm when they don’t.
adapt:
  support:
    - Begin with 2-digit by 1-digit, or a friendly number like 200 × 23, before the full size.
    - Keep a multiplication table in reach, so the thinking goes to the steps and not the facts.
    - Draw the area model first, and match each box to a line of the algorithm.
  access:
    - need: writing
      tip: Use grid paper turned sideways so digits stay in columns, or write what your child dictates. Long division takes a lot of space, so allow a full page.
    - need: attention
      tip: One calculation with a funny story beats a list. The lesson’s stepper lets your child press for each step, which breaks the job into small pieces.
    - need: reading
      tip: Read the story first and ask what is going on, before anyone looks at the numbers. The stories matter more than the wording.
    - need: worry
      tip: Long calculations give many chances to slip. Try estimating first, since a good estimate is a success on its own, and any slip then becomes a small thing to find.
    - need: hands
      tip: Your child can say each step while you write. A calculator can handle the facts if the goal today is understanding the steps.
  stretch:
    - |-
        Use 1, 2, 3, 4 and 5 once each in ▢▢▢ × ▢▢. Which gives the greatest product, which the least, and why?
    - Which day of the week will it be 100 days from today? 200 days? Try it, then check on a calendar.
together:
  - problem: d1
    how: Start by asking whether 13 octopuses could really wear 824 socks. Then use the paper money with 8 bowls, and let your child find where Milo’s steps and the bowls stop matching.
  - problem: d2
    how: |-
      - Play Auntie Bea from across the kitchen. Call out "Wrong!" without calculating.
      - Let your child work out how you could know. Save your reasoning for later.
  - problem: d3
    how: Use a real calendar. Mark today’s date and move forward by whole weeks first, so your child can see that a week changes nothing, before any division.
