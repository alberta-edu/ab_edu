id: area-perimeter
subject: math
why: Area and perimeter teach a child that one shape can be measured in two different ways that answer two different questions. Children who see this learn to ask "what am I actually measuring?", which is a question worth asking well beyond math.
hook:
  title: The farmer’s fence
  time: 5 minutes
  covers: [S1.8, S1.9]
  body: |-
    Tie a loop of string about **2 metres** long. Have your child hold it open on the floor with four fingers to make a long, skinny rectangle. Ask: "How much floor is inside?" Now pull it into a square, using the very same string.

    Don't explain anything. Ask: **"Did the string change? Did the space inside change? How can that be?"** Let the question hang there as you open the lesson.
activities:
  - title: Sticky-note floor plan
    time: 15 minutes
    materials: Sticky notes or paper squares
    covers: [S1.7, S1.8, S1.9]
    steps:
      - 'Give your child **24** sticky notes and ask them to make a rectangular "pool" using all of them, with no gaps.'
      - Walk a finger around the edge and count the sides of the notes to find the distance around. Write down the length, the width and that distance.
      - Ask for a different rectangle made of the same 24 notes. Keep a list.
      - 'Ask: "A lifeguard must walk around the pool. Which pool is the shortest walk? Which one would you build, and why?"'
  - title: Which unit would you dare to use?
    time: 10 minutes
    materials: Nothing, or a walk outside
    covers: [S1.5, S1.6]
    steps:
      - 'Name things to measure: a stamp, your bedroom floor, the soccer field, Calgary, a phone screen.'
      - Your child picks cm², m² or km² for each one and gives a guess. Silly guesses are welcome.
      - 'Pick one wrong unit on purpose and talk it out: "How many square centimetres would a soccer field be? Why is that a terrible way to say it?"'
questions:
  - If I double the sides of a poster, do I need double the paint? How could we find out?
  - Two rectangles have the same area. Can you tell which one has the longer perimeter just by looking? What do you look for?
  - Why do we measure area in **squares** and not in lines or circles?
  - When would you care about area, and when would you care about perimeter? Think of a real job for each.
  - That number looks huge. Is the thing really huge, or is the unit tiny?
misconceptions:
  - thought: '"Same perimeter means same area."'
    why: The string didn’t change, so it seems the space inside shouldn’t change either.
    tryThis: Do the string loop from the hook, and let them see the space shrink as the rectangle gets skinnier.
  - thought: '"A 1 m by 1 m square is 100 cm², because 1 metre is 100 cm."'
    why: Length converts by 100, so they expect area to do the same.
    tryThis: Sketch the metre square and ask how many 1 cm squares fit along one row, then how many rows there are.
  - thought: '"The area is 2 × length + 2 × width."'
    why: Both words sound like "measuring the rectangle", and they mix up the two procedures.
    tryThis: Ask what they would be doing in real life. Painting a wall is area. Walking around a yard is perimeter.
  - thought: '"Sides twice as long will take twice the paint."'
    why: The ribbon around the edge really does double, so it seems everything should.
    tryThis: Put down one sticky note. Build a rectangle with sides twice as long, using more notes, and count how many it took.
lookFor:
  - They ask whether a question is about the edge or the inside before they start calculating.
  - They predict that a skinnier rectangle will need more fence, and they can say why.
  - They choose a unit for a real object and can explain why the others would be silly.
adapt:
  support:
    - Build with square tiles or sticky notes first, and write the numbers only after the shape exists.
    - Stay with one small area, such as 12, and find every rectangle before moving on.
    - Colour the inside and trace the edge in two different colours, so the two ideas look different.
  access:
    - need: reading
      tip: Read problems aloud together, and draw the story as a sketch before talking about numbers.
    - need: writing
      tip: Let your child say the reason out loud, or point at a sketch, while you write it down.
    - need: attention
      tip: Do one rectangle at a time and physically build it. Moving tiles often holds attention better than a page of numbers.
    - need: worry
      tip: Try "design" problems first. Because many answers work, there's nothing to be afraid of getting wrong.
    - need: hands
      tip: The lesson’s rectangle builder works with a keyboard. Off screen, an adult can place the tiles while your child gives directions.
    - need: language
      tip: Point at the shape as you say each word. "Perimeter" and "area" are easier when they are tied to a gesture, tracing the edge and sweeping across the inside.
  stretch:
    - Find a rectangle with a given perimeter that has the largest possible area. What do you notice as the sides get closer together?
    - Invent a problem where someone *should* care about perimeter but mistakenly calculates area. What goes wrong for them?
together:
  - problem: d1
    how: Before any math, have your child write down how many jars they think the giant poster will take. Then sketch the giant poster, or lay out sheets of paper, and ask how many first posters fit. Let the picture argue with the prediction.
  - problem: d2
    how: Use the edge of a table as the school wall, and build gardens with sticky notes. Count only the sides that need fence. When they find one that beats the square, ask, "So was the rule wrong?" and wait.
  - problem: d3
    how: Take turns suggesting rectangles, and keep a score of the two numbers for each. Before the last part, ask, "What would convince you for every length, even the ones we haven’t tried?" Trying more rectangles won’t be enough, and they may notice that.
