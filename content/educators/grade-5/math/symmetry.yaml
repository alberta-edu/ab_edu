id: symmetry
subject: math
why: Symmetry teaches a child to test what they think they see. "It looks balanced" turns into two separate questions, "does it fold?" and "does it turn?", and a shape can pass one and fail the other.
hook:
  title: Did I turn it?
  time: 5 minutes
  covers: [K1.3, U1.1]
  body: |-
    1. Put out a paper square, a paper rectangle, a round lid, a fork and a mug.
    2. Your child closes their eyes. Turn one thing on the spot, or nothing at all.
    3. Eyes open: **"Did I turn anything? Which one?"** Play a few rounds, sometimes a half turn, sometimes a quarter.
    4. When they accuse you of something, ask: **"Which things can keep a secret, and which give it away?"** Don’t explain why.
activities:
  - title: Mirror partners
    time: 10 minutes
    materials: String or a ruler, pairs of small objects such as spoons, forks and buttons, and a small mirror if you have one
    covers: [K1.1, S1.3, S1.4]
    steps:
      - Lay the string across a table, with one player on each side. Each player has a matching set of objects.
      - |-
          One player puts an object down. The other places its mirror partner, the same distance from the string.
      - After about ten objects, stand a mirror on the string, or picture folding the table along it. Does each object land on its partner?
      - 'Swap leaders, then lay the string on a slant. Ask: "What got harder? Why?"'
  - title: The spinning tray
    time: 15 minutes
    materials: A round tray, a paper plate or a square piece of cardboard, a coin, and small objects in sets of four
    covers: [K1.3, K1.4, S1.5, S2.2]
    steps:
      - Put the coin in the middle of the tray as the centre. Place one object near the edge closest to you.
      - |-
          Give the tray a quarter turn and place a matching object in that spot. Repeat until all four are down.
      - |-
          One person closes their eyes while the other turns the tray a quarter. Can they tell? Count the matches in a full turn.
      - |-
          Challenge: make a design that matches when it turns, but has no line of symmetry. Test it with the string.
  - title: The symmetry awards
    time: 15 minutes
    materials: Things at home or on a walk, such as leaves, shoes, mugs and an apple
    covers: [K1.2, K1.7, S1.1, S1.2, U1.2]
    steps:
      - Hunt for things, indoors or out. Your child gives out awards for Best Fold, Best Turn, and So Close (a face, a leaf).
      - |-
          For solid things, ask where a giant blade could split it into mirror halves. Chop the air to show it.
      - An adult slices an apple across its middle, not from top to bottom. Your child looks at the seeds and decides which award it wins.
      - If you can, look at a library or museum photo of a star quilt made by Plains First Nations makers, or of Métis floral beadwork. Say who made it, and ask what symmetry your child can see.
questions:
  - Can something match when it turns, but not when it folds? What would that look like?
  - What is the smallest change you could make to this shape so it loses its symmetry?
  - Why does a square have more lines of symmetry than a rectangle?
  - Is your face really symmetrical? How would you test that?
  - How could you test this without folding anything?
misconceptions:
  - thought: '"A diagonal cuts a rectangle into two identical triangles, so it must be a line of symmetry."'
    why: Two identical halves sound like the very definition. They are identical. They just don’t match in a mirror.
    tryThis: Fold a sheet of printer paper corner to corner and look at the corners that stick out. Then ask how else one triangle could land on the other.
  - thought: '"A rectangle has 4 sides, so its order of rotation is 4."'
    why: In a square, the sides and the order are the same, and it’s easy to treat that as a rule for all shapes.
    tryThis: Trace around a book on paper and turn the book on its outline. Count how many times it really lands in a full turn.
  - thought: '"It has no lines of symmetry, so it has no symmetry."'
    why: Most children meet folding first, so symmetry comes to mean folding.
    tryThis: Build a pinwheel on the spinning tray, with everything leaning the same way. Ask them to try the fold test and the turn test separately.
  - thought: '"A circle has 360 lines of symmetry."'
    why: They know a full turn is 360°. Thinking of a line for each degree is reasonable.
    tryThis: Draw two lines through the centre of a round lid’s outline, very close together. Ask whether another could fit between them, and then another.
lookFor:
  - They do the fold test and the turn test separately, without being reminded.
  - They count the order by turning, not by counting the sides.
  - They point out symmetry in things around them, and notice when something is only nearly symmetrical.
  - They can say why a shape fails a test, as well as saying that it does.
adapt:
  support:
    - Start with shapes you can really fold and turn. An adult can cut a square, a rectangle and a triangle from paper.
    - Work on lines of symmetry for a while before bringing in rotation.
    - Put a dot on one corner and trace the outline, so your child can see each match as the shape turns.
  access:
    - need: language
      tip: |-
        - "Order" usually means putting things in order, or ordering food. Show this meaning with a turning hand and a count.
        - Call them the "fold test" and the "turn test".
    - need: attention
      tip: Mirror partners works in short rounds of three or four objects. "Did I turn it?" can come back any time as a one-minute break.
    - need: worry
      tip: Real things are rarely perfect, so "almost" is a good answer. The So Close award turns a near miss into something worth noticing.
    - need: hands
      tip: Your child gives directions while you fold, place or turn. Picture tests also work, with your child saying what they expect before you try it.
  stretch:
    - Design a shape with exactly 1 line of symmetry, then one with 3, then one with order 3 and no lines at all. Which is hardest, and why?
    - Sort all the capital letters by which tests they pass, fold, turn, both or neither. Which group is smallest?
together:
  - problem: d1
    how: |-
      - Your child writes down what each word will become.
      - Then write the word on paper and really turn it. Ask which letters decide it.
  - problem: d3
    how: |-
      - Lay out the six arms with spoons or sticks, and take arms away for real.
      - Test folds with a string across the flake. Predict before each test.
