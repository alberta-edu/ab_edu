subject: math
promise: |-
  We hope your child comes to see math as something they can figure out, not something they are told.

  - A calculator can do the sums.
  - Knowing which sum matters, and noticing when an answer can't be right, is the part only they can do.
shifts:
  - instead: Showing the method, then assigning ten more like it.
    tryThis: Give one interesting problem first, and let your child try it their own way before you show anything.
  - instead: 'Asking "What’s the answer?"'
    tryThis: 'Asking "How did you figure that out? Could you check it another way?"'
  - instead: Telling them straight away whether they’re right.
    tryThis: 'Asking "How sure are you? What would convince you?" Do it for right answers as well as wrong ones.'
  - instead: Treating a wrong answer as something to erase.
    tryThis: Getting curious about it. Most wrong answers come from sensible thinking, and finding that thinking teaches more than the correction.
  - instead: Making problems harder with bigger numbers.
    tryThis: Keeping the numbers small and changing the question. Work it backwards, find every answer, or ask what happens if one thing changes.
routines:
  - name: Notice and wonder
    time: 3 minutes
    how: |-
      1. Show a picture, table or problem without its question.
      2. Ask what your child notices, then what they wonder.
      3. Their questions are often better than the printed one.
  - name: Hide the question
    time: 5 minutes
    how: |-
      1. Read a story problem aloud with the numbers covered.
      2. Ask what is going on, and what might be asked.
      3. Reveal the numbers. This stops the habit of grabbing numbers and guessing an operation.
  - name: Which one doesn’t belong?
    time: 5 minutes
    how: |-
      1. Write four numbers, or draw four shapes.
      2. Ask which one doesn’t belong, and why.
      3. Any answer with a good reason is right, so it’s safe for a child who fears being wrong.
  - name: Estimate first
    time: 2 minutes
    how: Before any calculation, ask for an answer that is too small, one that is too big, and one that is about right. Then check whether the real answer lands between them.
  - name: Teach it back
    time: 5 minutes
    how: |-
      1. Pretend you are confused, or bring in a stuffed animal who is.
      2. Your child explains the idea.
      3. Whatever they can’t explain shows you what to go back to.
assess:
  - They can explain their answer in their own words, or show it with a drawing or objects.
  - They catch their own mistake because an answer doesn’t make sense.
  - They can solve the same problem a second way.
  - They keep trying for a few minutes when they are stuck, and they ask a question that shows what they have already tried.
sources:
  - label: 'NRICH: using low-threshold, high-ceiling tasks'
    url: https://nrich.maths.org/7701
  - label: 'University of Waterloo CEMC: Problem of the Week'
    url: https://cemc.uwaterloo.ca/resources/potw
  - label: 'Peter Liljedahl: Building Thinking Classrooms'
    url: https://www.buildingthinkingclassrooms.com/about-btc
