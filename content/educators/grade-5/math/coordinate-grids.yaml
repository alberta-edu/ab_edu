id: coordinate-grids
subject: math
why: A pair of coordinates lets two people, anywhere, mean exactly the same spot. A child learns why precise language beats "over there", and sees that the order of information can be part of its meaning.
hook:
  title: Where’s my dot?
  time: 5 minutes
  covers: [U1.2]
  body: |-
    Sit back to back, each with a blank sheet of paper. Draw a dot on yours in secret. Using everyday words only, tell your child where to draw theirs: "A bit left of the middle, kind of high." Do three dots.

    Hold the two papers together up to a window or lamp, and enjoy how far apart the dots are. Ask: **"What went wrong? What would you have needed me to say?"** Don’t offer any ideas. Let them wonder as you open the lesson.
activities:
  - title: Secret rectangle
    time: 20 minutes
    materials: Paper and pencils, and a book to hide your paper behind
    covers: [K1.2, K1.3, S1.1, S1.2, S1.3, S1.4, S1.5]
    steps:
      - Each player draws two grids, with lines numbered 0 to 6 across the bottom and up the side. One grid is for your rectangle, and the other tracks your guesses.
      - In secret, mark four crossings as the corners of a rectangle with sides along the grid lines. Write down their coordinates.
      - Take turns calling a crossing as an ordered pair. If it’s a corner, say "Corner!" If it isn’t, give a direction toward any corner you like, such as "right and up".
      - The first player to name all four corners wins. Then compare grids, and check that each pair was read across first, then up.
  - title: Toy corners
    time: 15 minutes
    materials: Floor tiles, chalk on a sidewalk, or lines of tape or string, plus some toys and a long piece of string
    covers: [K1.2, S1.1, S1.4, S1.5, U1.1]
    steps:
      - Make a giant grid with lines numbered 0 to 5 each way, one big step apart.
      - Call out coordinates. Your child walks across first, then up, and sets a toy on that crossing. Do this for four or five toys.
      - 'Run the string around the toys, in the order you called them. Ask: "What shape did we make?"'
      - 'One time, call the corners in a tangled order: (1, 1), (4, 3), (4, 1), (1, 3). Run the string and ask how to fix the shape without moving a single toy.'
      - Swap. Your child calls the coordinates and you walk them, sometimes going up first on purpose. They catch you.
questions:
  - Why do you think the corner of the grid is 0, and not 1?
  - If I swap the two numbers, have I gone somewhere new? Is that always true?
  - Which number changes when you move left or right? Which changes when you move up or down?
  - Where is that point, if you can’t use any numbers? How many other points would fit what you said?
  - Are there other ways to walk from here to there? Are they all the same length?
misconceptions:
  - thought: '"(3, 5) and (5, 3) are the same place."'
    why: In addition, 3 + 5 and 5 + 3 are the same, so swapping numbers has usually been harmless.
    tryThis: Stand on each spot on a floor grid, and call out to each other across the room. Use the hall and stairs from the lesson, across first, then up.
  - thought: '"The corner of the grid is 1, so the next line is 2."'
    why: Children have counted from 1 all their lives, so the first thing they touch gets called 1.
    tryThis: Stand on the corner and ask how many steps you have taken so far. Then take one and count it together.
  - thought: '"To get from (2, 6) to (5, 2), go 5 right and 2 down."'
    why: Those numbers are right there in the address, and a move and a location look the same when written down.
    tryThis: Put a finger on (2, 6) and ask, "Are you starting from 0?" Walk it out, watching where the first number goes.
  - thought: '"The point goes inside the square."'
    why: Board games and many maps do label the squares, so this is sensible.
    tryThis: Put a coin on a crossing on a grid, and read its coordinates from the numbered lines. Ask what a coin in the middle of a square would be called.
lookFor:
  - They say or gesture "across, then up" as they read a point, and stop needing to before long.
  - They catch a swapped pair, in their work or yours.
  - They describe a move between two points without counting from 0 again.
  - They complain that "near the middle" isn’t good enough.
adapt:
  support:
    - Start on a smaller grid, 0 to 4, with big crossings.
    - Walk it first on floor tiles. Then trace with a finger on paper, then read by eye.
    - Write the first number in one colour and draw the across line in that colour. Do the same for the second number and the up line.
  access:
    - need: reading
      tip: Read a story aloud and let your child trace it with a finger on the grid. Most of the reading load here is in keeping track of the moves.
    - need: writing
      tip: Your child says each pair and you write it. If you write what they said exactly, a swapped pair will show up by itself.
    - need: attention
      tip: Use the floor grid and a whole body. Walking to each point gives every question a beginning and an end.
    - need: worry
      tip: In Secret rectangle, a miss gives you a clue, so a wrong guess still moves you forward. Point that out when it happens.
    - need: language
      tip: Pair "across" with a sliding arm and "up" with a lifting one. "Vertex" and "vertices" can wait behind "corner" until the idea is steady.
    - need: hands
      tip: Your child calls out each pair and an adult places the marker. In Toy corners, a toy can be pointed to or directed into place.
  stretch:
    - Draw a square that is tilted, with no side along a grid line and every corner on a crossing. Give its coordinates, and measure the sides with a ruler to convince a friend.
    - Choose five points that make two very different polygons, depending on the order you join them. Write out the two orders.
together:
  - problem: d2
    how: Be the rude detector out loud, with "obviously" at full volume. After each clue, have your child shade out the crossings that can’t be right, on paper or with a hand. Ask which crossings the clue just ruled out.
  - problem: d3
    how: Walk it on floor tiles if you can, with one of you starting at each home. Ask how each of you could tell whether a corner is fair. For the last part, ask them to predict before counting, and let the idea of half a block be funny.
  - problem: d4
    how: Do it for real, back to back like the dot game or over the phone. You follow their words exactly, even when you can guess what they meant. Let the drawing show them which words they still need.
