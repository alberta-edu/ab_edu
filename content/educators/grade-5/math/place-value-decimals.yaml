id: place-value-decimals
subject: math
why: Place value teaches a child that a digit’s worth comes from where it sits, so a longer number isn’t always a bigger one. It also teaches them to choose how exact a number needs to be for the job at hand.
hook:
  title: Hands closing in
  time: 5 minutes
  covers: [K1.3, S1.4]
  body: |-
    Hold your hands about a ruler’s length apart. Say: "This hand is **0.9**. This hand is **1**. Name a number that fits between them." When your child names one, slide a hand in so it stands for that number, and ask again. Keep going until your hands nearly touch.

    Then ask: **"How many more numbers fit in here? Will we ever run out?"** Take their guess, and don’t settle it. If they say nothing fits, that’s a fine place to stop and open the lesson.
activities:
  - title: Clothesline numbers
    time: 15 minutes
    materials: String or a strip of tape, paper slips, clothespins or sticky tack
    covers: [S1.3, S1.4, S1.5, K1.2]
    steps:
      - Run the string between two chairs, and label one end **2** and the other **3**.
      - 'Hand over these slips one at a time for your child to hang: 2.5, 2.05, 2.35, 2.305, 2.50. Ask for a reason before each one goes up.'
      - Two slips want the same spot. Let your child discover that and tell you what it means.
      - 'Now your child writes a new slip that fits between the two closest neighbours on the line. Then you do. Take turns until someone gets stuck, or decides nobody ever has to.'
  - title: Paper plane scoreboards
    time: 20 minutes
    materials: Paper, a tape measure or metre stick, a pencil
    covers: [K1.1, S1.5, S1.7]
    steps:
      - Each person folds a plane and flies it three times. Measure each flight in metres, to the nearest centimetre, such as 2.37 m.
      - 'Keep three scoreboards: one rounds to the nearest metre, one to the nearest tenth, and one shows the exact measure.'
      - Look for a surprise. Does anyone tie on one board but not on another? Does the winner change?
      - 'Ask: "Which board would you use for a world record? Which would you use to tell Grandma about it at dinner?"'
  - title: No take-backs
    time: 10 minutes
    materials: A deck of cards with the face cards removed (10 counts as 0, ace as 1), or a die, paper
    covers: [S1.2, S1.5, S1.6]
    steps:
      - 'Each player draws six blanks with a point in the middle: three before and three after.'
      - Flip one card. Everyone writes that digit in any blank, and it can’t move again. Repeat six times.
      - Greatest number wins, but only if its owner can read it aloud correctly, using "and" for the point.
      - 'Write the two numbers with <, > or = between them. Next round, try for the smallest, or the closest to 500.'
questions:
  - Which digit in this number is doing the most work? How can you tell?
  - If a number has more decimal places, does that make it bigger? What does it change?
  - Could both of these measurements be right? What would have to be true?
  - When would you want this number rounded, and when would rounding get you into trouble?
  - How far does the mirror go? Does it ever stop? How do you know?
misconceptions:
  - thought: '"4.125 is bigger than 4.2, because 125 is more than 2."'
    why: For years, more digits really did mean a bigger number. They’re using a rule that always worked for whole numbers.
    tryThis: Write both with the same number of decimal places, 4.125 and 4.200, or hang them on the clothesline. Let the line argue with the rule.
  - thought: '"Erasing a last zero never changes anything," or "4.70 must be more than 4.7."'
    why: Zero looks like nothing, and they have seen zeros matter a lot in numbers like 630.
    tryThis: Compare $4.70 with 4.7 dollars on a calculator screen, then erase the 0 from 630 and ask what happened to the 6.
  - thought: '"14.2 and 14.18 are different, so one of them must be wrong."'
    why: In school, different answers usually mean a mistake. Nobody has told them a measurement can be right at different levels of detail.
    tryThis: Measure a spoon with a ruler, once to the nearest centimetre and once to the nearest millimetre. Same spoon, two honest numbers.
  - thought: '"To round to the hundred thousands, I can round to the thousands first."'
    why: Each step is correct on its own, so the method feels careful. Nothing warns them that the first step changed a digit the second one needs.
    tryThis: Try it on 1 249 637 both ways, then ask which digit changed between the two routes and who changed it.
lookFor:
  - They compare two decimals by going place by place from the left, not by how long the numbers look.
  - They name a place by its mirror without counting, such as hearing "hundreds" and answering "hundredths".
  - They ask what a number is for before deciding how to round it.
  - They say out loud that there is always room for another number between two others.
adapt:
  support:
    - Start with money. Dollars, dimes and cents give tenths and hundredths a meaning before thousandths arrive.
    - Compare decimals of the same length first, then add a zero to make different lengths match.
    - 'Use a paper strip with place names on it, and slide it under the number being read.'
  access:
    - need: reading
      tip: Very long numbers blur together. Cover the number and reveal one group of digits at a time, reading each group aloud together.
    - need: language
      tip: '"Tens" and "tenths" sound nearly the same. Write them side by side and tap your left and right arm as you say each one. Some children have learned to write a comma where we write a point, so ask what they’re used to.'
    - need: worry
      tip: Begin with the hands-closing game. Any number between your hands is a good move, and being stuck is an interesting moment, not a wrong answer.
    - need: attention
      tip: Keep No take-backs to one quick round at a time. Each flip brings a new decision, so there is something to do every few seconds.
    - need: hands
      tip: Your child can say where each digit goes while you write it, or point at the clothesline while you hang the slip.
  stretch:
    - Invent a mirror number with thousands and thousandths, and find the greatest one under 5 000.
    - Invent two jump lengths that are almost the same but round to different tenths, and two that are far apart but round to the same tenth.
together:
  - problem: d1
    how: Before any rounding, ask who your child thinks should be cheering, and put a finger on each snail on the number line. Save the scoreboard for after they have a view.
  - problem: d2
    how: Play Squeeze-In out loud first, with your hands from the hook. When someone says "nothing fits", ask how they could make some room, and wait.
  - problem: d3
    how: Take turns being Fitz, loudly and with total confidence, while the other checks place by place. Ask what the pairs he gets right have in common.
