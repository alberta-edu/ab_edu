id: add-subtract-algorithms
subject: math
why: A machine can run these steps faster than any child. What’s worth building is knowing why each step works, and the habit of asking "does this answer make sense?" before believing it.
hook:
  title: The paper that knew
  time: 5 minutes
  covers: [S1.1]
  body: |-
    1. Write **1089** on a slip of paper, fold it and leave it in plain sight.
    2. Ask for a three-digit number whose first digit is at least 2 bigger than its last, like 732.
    3. Your child flips the digits (237) and subtracts the smaller from the larger (495).
    4. They flip that answer (594) and add the two (1089). Open your slip.
    5. Ask: **"How did the paper know? Will it happen again?"** Neither of you needs to know why. If a try misses 1089, look for a slip together.
activities:
  - title: Flyer dash
    time: 20 minutes
    materials: A store flyer, or ten made-up prices on paper
    covers: [S1.1, S1.2, S1.3]
    steps:
      - Each player has **$50.00** and secretly picks items, trying to get as close to $50 as possible without going over. Skip deals like "3 for $5", prices per kilogram and anything marked as a percent off.
      - Plan by rounding each price to the nearest dollar, with no exact adding yet.
      - Reveal your lists. Each player adds the other’s prices exactly, in columns, then subtracts from $50.00 to find what’s left.
      - 'The closest wins. Ask: "When was rounding good enough, and when did you need the cents?"'
  - title: Slip it past me
    time: 15 minutes
    materials: Paper and a pencil
    covers: [S1.1, S1.2, K1.1]
    steps:
      - Each player writes three column sums or subtractions with their answers. One of the three has a mistake planted on purpose, such as a forgotten carry or digits lined up on the right.
      - Swap papers. The detective estimates first, and only then checks whatever looks suspicious.
      - Score a point for catching the mistake, or a point for the planter if it gets through.
      - Talk about which planted mistakes an estimate caught, and which ones it couldn’t see.
questions:
  - About how big should this answer be, before you work it out?
  - You carried a 1 there. One what? What is it really worth?
  - Why do we line up the decimal points, and not the last digits?
  - When is an estimate good enough, and when do you need the exact number?
  - How could you check this subtraction without doing it again?
misconceptions:
  - thought: '"Line up the numbers on the right, like I always have."'
    why: With whole numbers, that’s exactly what lines up the places, so it feels like the rule.
    tryThis: Write 12.5 and 3.75 as money, $12.50 and $3.75. Ask where the dollars go and where the cents go.
  - thought: '"In each column, take the smaller digit from the bigger one."'
    why: They learned that you can’t take a bigger number from a smaller one, so swapping seems like the only sensible move.
    tryThis: Show 43 − 18 with paper slips marked 10 and 1. Ask them to take away 8 ones from 3 ones, and let them discover they need to trade.
  - thought: '"There’s a zero next door, so I can’t regroup here."'
    why: Zero looks like an empty place with nothing to lend, and it’s a fair objection.
    tryThis: With slips, start with 500 as five 100s and buy something for $3. Trade a 100 for tens, then a 10 for ones, and watch where the 9 comes from.
  - thought: '"My estimate was close, so my answer is right."'
    why: Estimating is taught as a check, so passing it feels like proof.
    tryThis: Change one digit in a correct answer, a small one, and ask whether an estimate can catch it. An estimate catches big mistakes, not small ones.
lookFor:
  - They say what a carry is worth, such as "that’s one ten", without being asked.
  - They glance at an answer and say it can’t be right, before redoing any calculation.
  - They write a 0 in an empty decimal place because they want the columns to match.
  - They choose on their own whether a situation needs an estimate or an exact answer.
adapt:
  support:
    - Use money amounts first, since dollars and cents already make sense to most children.
    - Turn lined paper sideways so each column has its own stripe.
    - Do one column aloud while your child does the next, taking turns all the way across.
  access:
    - need: writing
      tip: Lining up digits by hand takes real effort. Use grid paper, or write the digits your child dictates while they do the thinking.
    - need: attention
      tip: Give one calculation that matters, like the goat’s chewed receipt, not ten that don’t. Cover the columns not yet in use with a slip of paper.
    - need: worry
      tip: Plant your own mistakes and let your child catch you. Being the detective gives them the same practice without their own work under the spotlight.
    - need: language
      tip: Words like "carry", "regroup" and "borrow" don’t translate well. Show the trade with slips marked 100, 10 and 1, and use the words after they have seen it.
  stretch:
    - Try the paper trick with four-digit numbers. Does it still land on one answer? What do you notice?
    - Invent a missing-digit puzzle like the chewed receipt, with exactly one solution, and try it on someone.
together:
  - problem: d1
    how: Write the receipt out large, and cover the missing digits with coins. Ask which column they could start with, then work column by column with your child in charge.
  - problem: d2
    how: |-
      - Make a list together of swaps and how far off each one is.
      - Don’t mention the pattern. Ask what the list is doing, and let them extend it.
  - problem: d3
    how: Play Malik yourself, adding only rounded prices with great confidence, while your child tries to invent prices that fool you. Ask what makes a price sneaky.
