id: moon-eclipses-auroras
subject: science
why: Children have seen the Moon thousands of times without really watching it. This topic builds the patience to observe something over weeks, and the skill of picturing how objects in space must be placed to produce what we see.
hook:
  title: The Moon from memory
  time: 5 minutes
  covers: [K1.3, S1.2]
  body: |-
    1. Without looking outside, each person draws tonight’s Moon. Put the drawings side by side. They probably won’t agree.
    2. Ask: **"Why does it change at all? Where does the missing part go?"**
    3. Keep every drawing and theory, unjudged. Look at the real Moon tonight, if you can.
activities:
  - title: Moon in your hand
    time: 15 minutes
    materials: A lamp with no shade and a light-coloured ball
    covers: [K1.2, K1.3, S1.3, S1.7]
    steps:
      - In a dark room with a lamp on, your child holds a ball at arm’s length, above their head. Head is Earth, ball is Moon.
      - They turn slowly, watching the ball. "How much of the lit part can you see?" Stop on a slice, a half, a full circle.
      - 'Ask: "Where does the ball have to be for a full Moon? Where for almost nothing?"'
      - '"Can you put the ball in your shadow? Hide the lamp behind it?" A lamp is safe, but never look straight at the Sun.'
  - title: Moon diary, with one fake
    time: 1 minute a day, for two weeks
    materials: A calendar or paper, and a pencil
    covers: [K1.3, S1.2, S1.4]
    steps:
      - Each day or night that you can spot the Moon, your child sketches its shape on the calendar. The Moon isn’t always up at bedtime, so morning sightings count too.
      - On cloudy nights, they draw what they think is there and mark it as a guess.
      - After a week, ask them to predict next Friday’s Moon and draw it in pen.
      - Your child adds one fake drawing to the diary, then challenges you to find it. Swap, and let them catch yours.
  - title: Name this month’s moon
    time: 10 minutes
    materials: A window or a short walk
    covers: [K1.3, K1.8, S1.5]
    steps:
      - Reread the part of the lesson about how many First Nations, including Cree and Anishinaabe peoples, name the moons of the year. Notice that the names differ from place to place.
      - Go outside or look out the window. What is happening in nature near you this month?
      - Your family picks its own name for this moon, like First Frost Moon. Make it clear that this is your family’s own game and doesn’t stand in for anyone’s real names.
      - Would a family in Inuvik pick the same name? For local names, ask an Indigenous cultural centre or your school how to ask respectfully.
questions:
  - The Sun always lights half of the Moon. So why don’t we always see half?
  - Could a solar eclipse happen at midnight? How do you know?
  - Your cousin far away says there’s no eclipse where they are. Could you both be right?
  - How would you describe the northern lights to someone who has never seen them?
  - Why do you think stories about the northern lights differ from place to place?
misconceptions:
  - thought: '"The phases are Earth’s shadow on the Moon."'
    why: In daily life, shadows are what make things go dark, and the Moon looks partly covered.
    tryThis: In Moon in your hand, stop at half lit. Your child finds their own shadow. Is it on the ball?
  - thought: '"A solar eclipse darkens the whole Earth."'
    why: A dark sky in the daytime feels too big to happen in only one place.
    tryThis: Hold your hand near a lamp and look at its shadow on the wall. Ask how much of the room the shadow covers.
  - thought: '"A lunar eclipse could happen at any phase."'
    why: Eclipses and phases are usually taught as two separate things, and films mix them up.
    tryThis: Using the ball, ask where it must be to reach your child’s shadow. Then ask what phase the ball shows there.
  - thought: '"The Moon changes shape at random."'
    why: Most of us only glance at it on scattered nights, so we never see the order.
    tryThis: The diary shows the order. After a week, ask your child to bet on tomorrow’s shape.
lookFor:
  - They predict what the Moon will look like next week without checking.
  - They explain a phase using how much of the lit half faces them, and they point or use a ball to show it.
  - They ask where the Sun is when they look at the Moon or a picture of an eclipse.
adapt:
  support:
    - Begin with just three shapes, new, half and full. Add the crescents after those feel easy.
    - Act it out before you look at any map. A view from above Earth is a big jump, so stand in the room first and draw it afterward.
    - Build the two eclipse line-ups on the table with a salt shaker, a grape and a plate. Let your child slide them into place while saying what each stands for.
  access:
    - need: reading
      tip: Read "waxing" and "waning" aloud with a drawing beside each. "Growing" and "shrinking" are fine words until the real ones stick.
    - need: attention
      tip: One look at the sky takes a minute. Tie it to bedtime or the walk to school. Missing a night is fine.
    - need: hands
      tip: Your child can sit while you carry the ball around them, stopping when they say so. For the diary, they can cover part of a paper circle or describe the shape while you draw.
    - need: language
      tip: |-
        - Show the phases with your hand: a curved finger is a crescent, a flat palm is half.
        - Your child shows you tonight’s Moon the same way.
    - need: worry
      tip: A dark room or stories of spirits can feel big to some children. Keep a hall light on, and read the northern lights stories together ahead of time.
  stretch:
    - Count the days between the next few full Moons. Why doesn’t a full Moon land on the same date each month?
    - Write a film scene with one hidden science mistake about an eclipse or a phase. Challenge someone to catch it.
together:
  - problem: d1
    how: |-
      - Use the floor as the map: your child is Earth, in the middle, and you hold a ball at each letter.
      - Let them say what they see at each spot before looking at the choices.
  - problem: d4
    how: |-
      - Play a grumpy tourist: "It’s midnight, and I can’t see any lights! Why not?"
      - Your child answers you before reading the choices.
