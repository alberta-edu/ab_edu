id: climate-agriculture
subject: science
why: Farming shows a child what it means to decide from a long pattern, not from one good or bad year, and to think about next year’s harvest while working on this one. It also teaches them to tell a sign that warns of something from a thing that causes it.
hook:
  title: Banana or bread?
  time: 5 minutes
  covers: [S4.1, K4.1]
  body: |-
    Put a banana and a slice of bread on the table. Ask: **"One of these could have started out on a farm near here. Which one? What makes you think so?"**

    Then push further: **"So why can’t an Alberta farmer just decide to grow the other one?"** Let them argue with you. Say you’re not sure yet, and leave it there as you open the lesson.
activities:
  - title: Windstorm in a pan
    time: 15 minutes
    materials: Two baking pans or box lids, dry soil, dry grass, a piece of stiff cardboard, and an old sheet or paper
    covers: [K4.5, S4.2, K4.4]
    steps:
      - Go outside. Fill both pans with dry soil. Leave one bare, and press dry grass into the other to stand for stubble.
      - Set each pan on the sheet, and ask which one will lose more soil.
      - Fan each pan with the cardboard, 20 strokes each, with the same strength. Keep your face back, and fan away from people.
      - 'Look at what landed on the sheet. Ask: "What would you tell a farmer?"'
  - title: Farm Fate
    time: 15 minutes
    materials: A die, four sticky notes as fields, and a handful of buttons as the harvest
    covers: [K4.1, K4.4, S4.3, U4.1]
    steps:
      - 'The die decides the year: 1 drought, 2 flood, 3 fire, 4 windstorm, 5 or 6 a good year.'
      - 'Your child writes the rules, using the lesson’s table. What does each event do to a field? Does a field with stubble do better in a windstorm? In a fire?'
      - Mark each field bare or covered. Roll for 5 years, adding buttons for each field’s harvest and taking away for damage.
      - 'After the game, ask: "What will you do differently next time, now that you’ve seen a bad year?" Play again.'
  - title: Sign hunters
    time: 10 minutes, then a few moments over several weeks
    materials: A walk, a small notebook, and an older person to ask
    covers: [K5.1, U5.1, S5.1]
    steps:
      - 'Ask an older family member or neighbour: "What told you winter or spring was coming when you were young?"'
      - On a walk, look for one sign, such as geese gathering. Write down the date.
      - Over the next weeks, write down when the weather changes as well.
      - 'Ask: "Does the sign bring the weather, or does it warn us? How could you tell?"'
questions:
  - Why might a farmer leave last year’s stubble on a field, even if it looks untidy?
  - A crop grew well last year. What else would you want to know before planting it again?
  - How much could you take from a lake every year and still have fish? How would you find out?
  - What would be different about your school day if we lived in Singapore?
  - Why might someone grow corn, beans and squash together? What might each plant do for the others?
  - Which would hurt a farm more, a drought or a windstorm? What would you want to know first?
misconceptions:
  - thought: '"A ploughed, bare field looks tidy, so it must be the healthy one."'
    why: Neat usually means looked after, and stubble looks messy.
    tryThis: Do the windstorm in a pan, and ask where the soil from the bare pan ended up.
  - thought: '"It grew last year, so it will grow here."'
    why: One real result feels stronger than a list of numbers, especially when it’s the latest one.
    tryThis: Make a list of 10 seasons with one lucky year among them. Ask, "Was last year a usual year?" and cross out the seasons that wouldn’t work.
  - thought: '"We have plenty now, so we can drop the limit."'
    why: Limits look like something you need only when things are scarce.
    tryThis: Run the lesson’s lake at a steady catch. Then raise the catch and see what happens over the years.
  - thought: '"Geese leaving makes the frost come."'
    why: When two things happen in the same order every year, it feels like one causes the other.
    tryThis: Ask, "The school bus always comes before the bell. Does the bus make the bell ring?"
lookFor:
  - They ask what usually happens here before they judge a crop or a plan.
  - They bring up next year’s harvest while talking about this year’s.
  - They link a weather event to one part of a farm, such as its soil, water, crops or animals.
  - They can say whether something is a sign or a cause.
adapt:
  support:
    - Begin with how climate shapes your child’s own day, such as coats, boots and the rink. Then move out to farms.
    - Take one weather event at a time. What does it do to the soil? What does a farmer do about it?
    - On the lesson’s lake, keep a steady catch and change just one number at a time.
  access:
    - need: reading
      tip: Read problems aloud. Farm tables have a lot in them, so read one row, picture it and move to the next.
    - need: writing
      tip: The letter from a handful of soil is just as good performed in a silly voice. Write it down for them, or record it.
    - need: attention
      tip: Every roll in Farm Fate is a new small event. Play a year, ask one question, then play the next year.
    - need: worry
      tip: Some children have lived through a flood, a fire or a hard farm year. Let them choose how close to get, use a made-up farm, and keep the focus on what farmers do in response.
    - need: language
      tip: '"Stubble", "tilled" and "ploughed" may be new even to children who grew up with English. Show pictures, or drive past a field. Keep a little picture list of farm words on the fridge.'
  stretch:
    - Plan the next three years for one made-up field, using a crop rotation of canola, wheat and peas from the lesson. Explain how the plan considers future harvests.
    - Write a rule for a made-up lake that says how many fish each person can take. Test it on the lesson’s lake, and defend your number.
together:
  - problem: d1
    how: Read Odile’s notebook aloud in a great-grandmother’s voice. Let your child find the gaps with a finger on a calendar. Take Uncle Stu’s plan very seriously, and ask them to talk him out of it.
  - problem: d2
    how: Play the seed seller with all the charm you’ve got, and let your child check your claim against the list. In the last part, argue for whichever crop they didn’t choose, so that their reason has to hold up.
