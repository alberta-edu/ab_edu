id: buoyancy
subject: science
why: A floating boat looks as if nothing is happening, yet two forces are at work on it. Buoyancy teaches a child to read an invisible cause from what they can see, and to test a plausible idea by imagining what would follow if it were true.
hook:
  title: Push it under
  time: 5 minutes
  covers: [K2.1]
  body: |-
    Fill a sink or tub. Hand your child an empty plastic bottle with its cap on, and ask them to push it to the bottom and hold it there. When you say so, they let go.

    Ask: **"What was fighting you? Which way was it pushing?"** Then have them do the same with a small stone and ask: **"Is anything fighting you now? How would you know?"** Give no names for anything yet.
activities:
  - title: Cargo captains
    time: 20 minutes
    materials: Squares of foil, a tub or sink, coins or marbles, a towel
    covers: [S2.3, S2.4, K2.2, K2.3, U2.1]
    steps:
      - Fill the tub halfway, keep it well away from anything plugged in, and put a towel down for drips.
      - Each person shapes a boat from one square of foil and predicts how many coins it will carry.
      - 'Add coins one at a time, gently. Ask: "Where is the boat sitting now, compared with before?"'
      - 'When it goes down, ask: "What was different about that last coin?" Then rebuild from a new square, and try to beat your record.'
  - title: Bet on it
    time: 15 minutes
    materials: Eight small things that water can’t harm, including a grape or an egg, two bowls of tap water, salt, and buttons to bet with
    covers: [S2.1, S2.2, K2.1, K2.2, K2.3]
    steps:
      - For each object, your child bets buttons on float or sink. Drop it in, then pay out.
      - After each drop, they make the two forces with their arms, one reaching up for the push and one down for the weight. Which is longer? Are they the same?
      - Pick out the objects that sank. Stir a lot of salt into the second bowl, so that the fluid is the only thing that changes. Nobody tastes it.
      - 'Bet again on those objects. Ask: "What did we change? What did we keep the same? So what can we say?"'
questions:
  - A rock sits on the bottom of a pond. Is the water still pushing on it? How could you tell?
  - A toy boat is floating, perfectly still. What does that tell you about the two forces on it?
  - How can a giant ship float when a tiny pebble sinks?
  - Is the air around you a fluid? What makes you think so?
  - It’s much easier to lift a friend in a swimming pool than on land. Why might that be?
misconceptions:
  - thought: '"Once something sinks, the water stops pushing on it."'
    why: It’s lying still on the bottom, so it looks as if the water has given up.
    tryThis: Hold a stone just under the surface, then lift it out of the water. Ask what stopped helping at that moment.
  - thought: '"To float, the push has to be bigger than the weight."'
    why: Floating feels like winning. If the forces were only equal, surely the boat would start to sink.
    tryThis: Push a bottle under and let go. It races upward, and that is what a bigger push does. Then ask what it does once it’s floating still.
  - thought: '"Salt water pushes harder on a floating apple, because it sits higher."'
    why: Salt water did make a difference for the egg, so it seems like a rule for everything.
    tryThis: Have them say what floating means, once for each glass. Then ask whether the apple’s weight changed between the glasses.
  - thought: '"The rock got heavier when it came out of the water."'
    why: It really does feel heavier at the moment it breaks the surface, and hands don’t lie.
    tryThis: 'Lift something under water and then out, and ask: "Did any rock get added? What was helping you before?"'
lookFor:
  - They describe a floating object as having two equal forces on it, not as having no forces.
  - They mention the push on things that sink, without being asked.
  - When they test an idea, they change one thing and keep the rest the same.
  - When a boat goes down, they explain it with push and weight, not just "too heavy."
adapt:
  support:
    - Start with real objects and no arrows at all. Let your child float and sink things for a while, then add the arms for the forces.
    - Compare one object in the water and out of it, before you compare different objects.
    - Use only tap water at first. Bring in salt water and air once the first rule feels steady.
  access:
    - need: reading
      tip: Read the problem aloud, and let your child act out the arrows with their arms before reading the choices.
    - need: attention
      tip: One coin at a time, with a drumroll if you like. Each coin is a small cliffhanger, so the suspense does the work for you.
    - need: worry
      tip: Sinking is the best moment here, not a failure. Cheer when a boat goes down. If water itself is uneasy, a mixing bowl on a table works just as well as a tub.
    - need: language
      tip: '"Sink" is also the thing you’re filling with water, so point out the two meanings and enjoy them. Say "fluid" as you pour something, so the word goes with the flow.'
    - need: hands
      tip: A small plastic container can be the boat if foil is fiddly. Your child can decide how many coins go in and where, and you place them.
  stretch:
    - Choose your own question about boats and plan a fair test. Say what you’d change, what you’d keep the same and what result would answer the question.
    - What do a boat floating on a pond and a helium balloon staying still in a gym have in common? Draw the arrows for each one.
together:
  - problem: d1
    how: Do it with a real foil boat if you can. Before each coin, ask your child to show the push and the weight with their arms. Stop before the last coin and ask for a prediction and a reason.
  - problem: d3
    how: Read Zoe and Dev as two different voices. Ask, "What test would make them give different answers?" Try whatever your child suggests with clay and a tub, and don’t suggest a shape yourself.
