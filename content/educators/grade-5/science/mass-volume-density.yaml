id: mass-volume-density
subject: science
why: Density asks a child to hold two measurements in mind at once and compare them, instead of trusting how heavy something feels. They learn to stop and ask what a fair comparison needs, and that one number alone can mislead.
hook:
  title: The twin tubs
  time: 5 minutes, plus 1 minute to set up
  covers: [K2.7, K2.8]
  body: |-
    Before your child comes in, fill two matching tubs to the top. Use cereal or cotton balls in one, and rice or dried beans in the other. Put the lids on.

    Put one in each of their hands and ask: **"Same tub. Same size. Why don’t they feel the same? What would you want to know before you decide why?"** Don’t open them yet, and don’t offer any new words.
activities:
  - title: Coat hanger league
    time: 20 minutes
    materials: A coat hanger, string, two matching cups, and dry foods from the cupboard
    covers: [S2.1, S2.3, K2.8, K2.9, S2.7]
    steps:
      - Hang the hanger from a door handle and tie a cup to each end. Check that the empty cups hang level. If they don’t, ask your child how to fix it before anything goes in.
      - Fill one cup level with rice and the other level with cereal. Ask which way it will tip, then let go.
      - 'Run a league: rice, cereal, dried beans, sugar, flour. Each match has a winner, the side that goes lower. Your child announces it with the words "denser" and "less dense."'
      - 'Ask: "Why fill both cups level? What would happen to the test if one were half full?"'
  - title: The squeeze test
    time: 10 minutes
    materials: Two matching plastic bottles with caps, or a clean medicine syringe, and a sink
    covers: [K2.12, S2.6, S2.5]
    steps:
      - Over the sink, fill one bottle right to the top with water and cap it tightly. Cap the other one with only air inside.
      - Ask which one will squeeze in more. Then squeeze both, with the same grip.
      - If you have a medicine syringe, try the same thing. Draw in air, block the tip with a finger and push. Then do it with water.
      - Ask your child to draw the particles in each one and use the drawing to explain what happened.
  - title: A tiny tower
    time: 10 minutes
    materials: A tall clear glass, small amounts of honey, dish soap, water and vegetable oil, and a few small objects such as a grape and a bit of cork
    covers: [K2.10, K2.11, S2.4, S2.7]
    steps:
      - Your child draws the order they expect the layers to end up in. Then they pour slowly, in any order they like.
      - Let it settle, and compare it with the drawing. Nothing gets tasted, and spills get wiped up right away.
      - 'Before dropping in each small object, ask them to point to where it will stop. After it stops, ask: "What does that tell you about the object and the liquids above and below it?"'
questions:
  - A big log and a small pebble go into a lake. What do you expect, and what does that tell you about the word "heavy"?
  - If I cut this loaf of bread in half, what happens to its mass? Its volume? How tightly it’s packed?
  - What would you need to keep the same to compare those two things fairly?
  - You pour juice from a tall glass into a wide bowl. What is different now? What isn’t?
  - Can a very big thing float while a very small thing sinks? How could that be?
misconceptions:
  - thought: '"Heavy things sink. Light things float."'
    why: The rule works often enough in everyday life to feel true.
    tryThis: Put a big apple or orange and a small coin in a bowl of water. Ask what the rule needs to say now.
  - thought: '"A small piece will float, because it’s so much lighter."'
    why: They notice the mass going down, and they don’t yet notice the volume going down with it.
    tryThis: Drop a chocolate bar in water, then a square snapped off it. Predict first. Then ask what the square has less of, besides mass.
  - thought: '"Air doesn’t weigh anything. Pumping up a ball makes it lighter."'
    why: Air can’t be seen, and things full of air feel light and bouncy.
    tryThis: Hang a ruler from a string at its middle, with a blown-up balloon at each end, and get it level. Let the air out of one balloon and watch.
  - thought: '"It looks like less now, so there must be less."'
    why: Eyes are hard to argue with, and a wide bowl of juice really does look smaller.
    tryThis: Pour juice from a glass into a bowl and back into the same glass. Ask them to mark the level on the glass with a piece of tape first.
lookFor:
  - Before comparing two things, they ask whether the two things are the same size.
  - They stop using "heavier" and "denser" as if they meant the same thing.
  - When something changes shape, they ask whether any matter was added or taken away.
  - They explain the squeeze using spaces between particles.
adapt:
  support:
    - Density here is always a comparison, in words. There’s no formula to learn, so don’t bring one in.
    - Do mass and volume on separate days. Add the word density only after your child has felt the twin tubs.
    - Compare only two things at a time, in matching cups.
  access:
    - need: reading
      tip: Bring real packages to the table. A milk carton and a bag of flour make L, mL, kg and g easier to read than a list does.
    - need: attention
      tip: Keep the rounds short, with a guess first and a result right after. A tipping beam gives an answer every time.
    - need: worry
      tip: Treat predictions as bets on the scale. If a bet loses, the scale said so, and your only reply is "Interesting. Why did it do that?"
    - need: language
      tip: The word "volume" can also mean how loud something is. Say so, then hold up a cup as the sign for this meaning. Use a tight fist for "denser" and an open hand for "less dense."
    - need: hands
      tip: Your child can direct the pouring and balancing while you carry it out. Read the small marks on a measuring cup aloud together, with the cup at eye level.
  stretch:
    - Find two objects where one has more mass and also more volume. What can you say for sure about which is denser? How could you make the test fair?
    - Why can a dry sponge squash so small when a block of wood can’t? Look in the holes for a clue, and use the words mass and volume.
together:
  - problem: d1
    how: If you have a flat ball and a pump, use them, or use a balloon. Before reading any choices, ask your child to show with one hand what the beam will do, and ask what has been added to the ball.
  - problem: d2
    how: Bring in what you can, such as bread, clay or a glass of juice. For each one, have your child say out loud what happened to the mass and to the volume before they decide.
  - problem: d3
    how: Hold off on the hints. Ask, "What would make this a fair race between two liquids?" Let them try out their plan on water and juice with the coat hanger, if you built one.
