id: energy-resources
subject: science
why: '"Renewable" is a precise word everyday talk blurs. A child who asks "who replaces this, and how soon?" is harder to fool, and weighs both sides fairly.'
hook:
  title: And before that?
  time: 5 minutes
  covers: [U1.1, K1.1]
  body: |-
    1. Turn on a light. Ask: **"Where did that light come from?"**
    2. Whatever they say, the wire or the wall, ask: **"And before that?"**
    3. Take turns until one of you says "I don’t know". It helps if you run out first.
    4. End with: **"Let’s find out what’s at the very start of that chain."**
activities:
  - title: The forest and the mine
    time: 15 minutes
    materials: Two bowls and about 40 pieces of dry cereal
    covers: [K1.2, K1.4, S1.1]
    steps:
      - Put 20 pieces in each bowl. One bowl is a forest, and the other is a mine.
      - Each round, the town needs 5 pieces, and your child chooses which bowl they come from. Eat them if you like.
      - At the end of each round, the forest grows back 3 pieces. The mine gets nothing.
      - Play until the town is in trouble. Then ask, "What is the most you can take from the forest each round and keep it at 20?"
      - 'Ask: "What happens to the mine, however careful you are?"'
  - title: Lights out
    time: 10 minutes
    materials: Scraps of paper folded into little tents
    covers: [S1.2, K1.3, K1.5, S1.1]
    steps:
      - Write one resource on each tent, such as solar, wind, water and hydro, biomass, natural gas and nuclear. Line them up.
      - 'You call out a condition: "Dark night!" "Calm day!" "The creek froze!" Your child knocks down every tent that has to stop.'
      - Swap roles. Make a wrong move on purpose, and let them catch you.
      - 'Ask: "If you could keep only two for a town that can’t go dark, which two? Why those?"'
  - title: The town hall
    time: 15 minutes
    materials: The lesson’s map of Canada
    covers: [S1.1, S1.2, S1.3, K1.6]
    steps:
      - Each person plays a resource and speaks as it. "I am Wind. I make no smoke, and I come back every day."
      - The other person replies with a polite "Yes, but..." and names a real disadvantage.
      - Pick a province or territory on the map, and read how it makes most of its electricity. Each character makes its case for that place.
      - Swap characters, so that each person has to argue for a resource they were just arguing against.
questions:
  - Coal forms naturally in the ground. So why isn’t it renewable?
  - Is there a resource with no disadvantages at all? Try to find one.
  - Can something renewable still run out? How?
  - What would a calm week do in a town that relies on wind? What would have to be true for it not to matter?
  - What do you notice about how Alberta and Quebec make most of their electricity? What would you want to know next?
misconceptions:
  - thought: '"It comes from nature, so it’s renewable."'
    why: Coal comes out of the ground and not from a factory, and "natural" sounds as if nature will take care of it.
    tryThis: Ask, "How soon will nature make more?" Compare a tree they could watch grow with coal, which takes millions of years.
  - thought: '"Smoke means non-renewable. No smoke means renewable."'
    why: They often hear the two ideas together, so they seem like one idea.
    tryThis: 'Ask two separate questions about wood and about nuclear: "Will it run out?" and "Does it make smoke?" Let the answers fall where they fall.'
  - thought: '"A ship brings more every year, so diesel is renewable."'
    why: From where they stand, it really does keep coming back.
    tryThis: Ask who brought it back, people or nature. Then follow the fuel backward to where it came from.
  - thought: '"Renewable means it can’t run out."'
    why: The word sounds like a promise.
    tryThis: Play The forest and the mine, and take more than the forest grows back. Let the bowl make the argument.
lookFor:
  - They ask how soon something comes back, not just whether it is natural.
  - They can give a disadvantage for a resource they like and an advantage for one they don’t.
  - They say what a resource needs in order to work, and predict when it would stop.
adapt:
  support:
    - Start with only wind and coal, and only one question. Will nature make more soon?
    - Run the lesson’s 100-year experiment, and spend time on the prediction before pressing Run.
    - Leave tidal and geothermal for last. They are harder to picture from Alberta, so use the lesson’s table.
  access:
    - need: reading
      tip: Make a card for each resource with a small drawing on it. Read problems aloud, and let your child hold up the cards they’re thinking about.
    - need: writing
      tip: Town hall speeches can be spoken, and you or a phone can capture them. Short notes are enough for planning a town’s energy.
    - need: attention
      tip: A forest about to run out is a built-in cliffhanger. Play three quick rounds, then one question.
    - need: worry
      tip: Energy can feel personal here, since some families earn their living from oil, gas, wind or farming. Treat every resource as having advantages and disadvantages, with no villains.
    - need: language
      tip: Show the word "renewable" in parts, with "re" meaning again. "Fills back up" is a good everyday phrase for "replenished" until the real word sticks.
  stretch:
    - Invent two resources for a made-up planet, and test someone with them. They must decide from how soon nature replaces each one, not from how much there is.
    - Pick two provinces or territories on the map. What would a calm week or a dry year do to each?
together:
  - problem: d1
    how: |-
      - Treat Gerald the ghost as a real suspect.
      - Your child points to two rows where only one thing changed. Ask, "Who does that rule out?"
  - problem: d3
    how: |-
      - Before the choices, ask what makes a resource renewable.
      - For each made-up resource, ask, "If we keep using it, does it come back?"
