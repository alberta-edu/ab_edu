id: forces-of-flight
subject: science
why: 'Flight splits one tangled event into two simple pairs: which side is winning in each? Taking a problem apart like this works far beyond wings.'
hook:
  title: The paper race
  time: 5 minutes
  covers: [K1.4, K1.6]
  body: |-
    1. Crumple one of two identical sheets into a tight ball.
    2. Hold both at the same height. Your child bets on which lands first. Drop them, twice.
    3. Ask: **"It’s the very same paper, and nothing was added. So what was different on the way down?"**
    4. Take every answer and leave it open.
activities:
  - title: Test pilots
    time: 20 minutes
    materials: Paper, a few paper clips, sticky notes
    covers: [S1.6, S1.7, S1.2, S1.3, K1.7]
    steps:
      - Your child folds any glider they like. Clear a hallway or yard, and check that nobody is in front or off to either side, since test gliders veer.
      - Throw it three times with the same push, and mark each landing with a sticky note.
      - Change one thing, such as a paper clip on the nose or wider wings. Predict, then throw three more times.
      - 'Ask: "Which force did your change affect? Which pair is uneven now?"'
      - 'Last challenge: land it in a laundry basket from across the room.'
  - title: Thrust referee
    time: 10 minutes
    materials: A pair of rolled-up socks and a clear space
    covers: [K1.3, K1.4, K1.6, S1.2]
    steps:
      - 'You throw the socks gently. Your child shouts "Thrust!" while they are in your hand, and "Over!" the moment they leave it.'
      - Swap roles, and try to fool each other with fake throws.
      - 'Throw again. When your child shouts "Freeze!", they say which forces are on the socks at that moment, and show the directions with their arms.'
      - Unroll the socks and throw them flat, with the same push. Ask which force changed.
  - title: Sky commentators
    time: 10 minutes
    materials: A window or a walk outside
    covers: [S1.4, S1.1, K1.7, U1.1]
    steps:
      - Watch anything that flies, such as birds, insects or a distant plane.
      - 'Your child commentates like a sports announcer: "She’s flapping! Now a long glide, and she’s dropping!"'
      - For each flyer, make one quick call. Was it the speed that changed, or the altitude?
      - Back inside, draw one moment from the sky with four arrows, with the biggest force as the longest arrow.
questions:
  - What is pushing an arrow forward when it’s halfway to the target?
  - A plane keeps the same speed for an hour. Is one force winning, or are they equal? How can you tell?
  - Why would someone make a fishing spear long and thin, not wide and flat?
  - If a flyer starts to drop, which pair of forces would you check first? What if it starts to slow down?
  - Does a bird have to flap to stay in the air? What have you seen?
misconceptions:
  - thought: '"At a steady speed, thrust must be bigger than drag, or the plane would slow down."'
    why: Engines are running, and pushing harder feels like what keeps things going.
    tryThis: Set thrust and drag equal on the lesson’s sliders, and watch the Speed bar together.
  - thought: '"The push stays with the arrow after it leaves the bow."'
    why: It’s still moving fast, so it seems that something must still be pushing.
    tryThis: Play Thrust referee, and ask what is touching the socks while they are in the air.
  - thought: '"No flapping means no lift."'
    why: Flapping is the thing you can see a bird doing, so it gets all the credit.
    tryThis: Launch a glider and drop a ball of paper from the same height. Ask what the glider has that the ball doesn’t.
  - thought: '"Drag pulls things down."'
    why: The word sounds like dragging something down, and down is where falling things end up.
    tryThis: Walk fast holding a big flat card in front of you. Which way does the air push? Then drop it and ask again.
lookFor:
  - They split a flight into pairs without being asked, saying something like "It’s slowing down, so drag must be winning."
  - They say exactly when a force stops, such as thrust ending when the launcher lets go.
  - They say "equal" for a steady flyer, and don’t expect equal forces to make it stop.
  - When a glider misbehaves, they change one thing at a time.
adapt:
  support:
    - Deal with one pair at a time. Cover the up and down arrows with your hand while you talk about thrust and drag.
    - Have your child stand as the plane and make the arrows with their arms, longer or shorter.
    - Ask only about speed, then only about altitude, before mixing the two.
  access:
    - need: reading
      tip: Force diagrams say a lot without many words. Look at the arrows first, then read the sentence aloud.
    - need: writing
      tip: Let a drawing do the job, with longer and shorter arrows. An idea for a flying device can be built or told out loud before anyone writes it down.
    - need: attention
      tip: Test flights are short bursts with a result every time. Do a flight, then a question, then another flight.
    - need: worry
      tip: Crashes are the reason for a test flight. Give each crash a silly name and a cause, and treat it as useful news.
    - need: language
      tip: '"Lift", "drag" and "weight" also have everyday meanings. Act out each one with a big arrow on paper, and point to the arrow every time you say the word.'
    - need: hands
      tip: Your child can be chief engineer, directing the folds and calling the test while someone else folds and throws.
  stretch:
    - Invent and name a stunt, like the Lazy Elevator. Describe what it does, and challenge someone else to draw its arrows.
    - Compare the bow and arrow, the slingshot and the fishing spear from the lesson. Where does the thrust come from in each, and when does it end?
    - Make the slowest glider you can from one sheet of paper. Which force did you work with?
together:
  - problem: d1
    how: Trace the whole trip on the graph with a finger before reading the first question. Ask your child to tell Zippy’s story, section by section, and to say which pair of forces matters at each change.
  - problem: d2
    how: |-
      - Toss a soft ball straight up. Your child shows each force with their arms: going up, at the top, coming down.
      - If they get stuck, ask only, "What does drag act against?"
  - problem: d3
    how: |-
      - Build a rough version first, and write afterward.
      - Ask, "Where does your thrust end? What is your device doing halfway across the room?"
