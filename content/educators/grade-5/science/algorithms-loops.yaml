id: algorithms-loops
subject: science
why: Telling a machine what to do makes a child say exactly what they mean. When a program fails, they learn to read what it says, not what they meant.
hook:
  title: The very obedient robot
  time: 5 minutes
  covers: [K1.2, K1.6]
  body: |-
    1. In a robot voice: "I am a robot. I do exactly what you say and nothing else."
    2. Hold out a sock, and ask your child how to put it on your foot.
    3. "Put on the sock": put it on your ear. "Lift your foot": lift it and leave it in the air. Stay in character.
    4. Ask: **"Why is this so hard? Whose fault is it when the robot gets it wrong?"**
activities:
  - title: Living room robot
    time: 15 minutes
    materials: Sheets of paper for a floor grid, sticky notes, a small treat
    covers: [K1.6, K1.7, S1.3, S1.4, S1.5]
    steps:
      - Lay the paper in a grid on the floor and put the treat on a far square. One person is the robot, standing on a corner square and facing one way.
      - Your child writes code on sticky notes, one instruction per note. The only instructions are move forward, turn left and turn right.
      - The robot runs the notes in order. Off the path, it says "Bonk" and stops. Your child fixes the notes and reruns.
      - Now add a large note that says "repeat ___ times", with instructions stuck on top of it. Ask, "Can you reach the treat using fewer notes?"
  - title: The dance loop
    time: 10 minutes
    materials: Paper and a pencil, and music if you like
    covers: [K1.7, S1.2, S1.5]
    steps:
      - Choose three moves together, such as clap, stomp and spin. Your child writes a dance as code, using one repeat.
      - You perform exactly what is written, even if it looks silly. Ask them to predict how many claps there will be before you start.
      - Swap jobs. You perform a long dance with a pattern in it, such as clap, stomp, stomp, clap, stomp, stomp, without saying anything.
      - Your child writes the shortest code they can for your dance. Then you perform their code to check it.
questions:
  - The robot bumped into something. Which block would you look at first? Why that one?
  - Before you press Run, where do you think it will stop? How sure are you?
  - Which steps have to repeat, and which only need to happen once?
  - What does a person know about brushing teeth that a robot wouldn’t?
  - Where in your day do you already do a loop?
misconceptions:
  - thought: '"The robot will know what I meant."'
    why: People fill in the gaps for them all day long, so this has always worked.
    tryThis: Bring back the very obedient robot, and follow one of their instructions exactly as it’s written.
  - thought: '"Turn right moves the robot to the right."'
    why: In everyday talk, "go right" means walking over there.
    tryThis: Stand up and turn right on the spot. Ask, "Did your feet leave your square?"
  - thought: '"Everything for the job goes inside the loop."'
    why: We think of doing the whole job 4 times, and forget that only part of it repeats.
    tryThis: Run the code with spoons. Each time through "get out a spoon", add a real spoon to the table, and let the pile tell the story.
  - thought: '"Five plants need five moves."'
    why: Counting things and counting the gaps between things feel like the same count.
    tryThis: Walk across five sticky notes and count the steps. Then look at the gaps between your fingers.
lookFor:
  - They trace the code with a finger before they run it.
  - They blame the code, not the robot, and go looking for the exact block that went wrong.
  - They spot repeats in daily life and say something like "That’s a loop."
  - After a failed run, they change one thing and try again instead of starting over.
adapt:
  support:
    - Start with no loops and a path of three squares. Bring in the repeat note when your child complains about writing the same note again.
    - Let your child be the robot first, walking through code you wrote, so they feel how literal it is.
    - Use a set of pre-made cards so they can spend their effort on the order, not the writing.
  access:
    - need: reading
      tip: Draw arrows on the cards in place of words. Read the blocks aloud together as you trace them.
    - need: writing
      tip: Nobody needs a pencil for this. Your child can place cards, point or speak the code while you lay it out.
    - need: attention
      tip: Keep each try short. A robot that bumps into a wall gives instant feedback, and one solved puzzle is a fine place to stop.
    - need: worry
      tip: Write a broken program yourself and ask your child to find the trouble. A robot bumping into things is how anyone finds out what to change, so it’s worth laughing together.
    - need: hands
      tip: The lesson’s blocks are tapped, not dragged. Off screen, your child can call out the code while you place the cards.
  stretch:
    - Design a patrol that walks exactly 36 squares and ends where it started, using one repeat. How many different answers can you find?
    - Trace a robot through a loop that repeats 1000 times without running it. What do you need to work out first?
    - If your child wants the robot to decide things, as in "If there’s a rock, go around", enjoy the idea. Then return to move, turn and repeat, since deciding blocks come in a later grade.
together:
  - problem: d1
    how: |-
      - Draw the four squares and use a coin as the robot. Let your child trace the number 4.
      - At 100, ask "Do you need to trace all of that?" and wait.
  - problem: d3
    how: Put five sticky notes on the floor and let your child be the robot, starting with the code that ends in a splash. Ask them to count the plants and the steps, then choose.
