id: body-systems
subject: science
why: 'The body is a team: every job depends on others, and trouble in one place can show up far away. Children learn to work back from a sign to its cause.'
hook:
  title: The toe question
  time: 5 minutes
  covers: [K1.8, S1.4]
  body: |-
    1. Have a snack together. Your child wiggles a big toe. Its muscle needs food to work.
    2. Ask: **"The cracker went in your mouth. Your toe is way down there. How does it get what it needs?"**
    3. Let them draw the route, however wild. Don’t correct it, and keep the drawing for later.
activities:
  - title: The delivery run
    time: 15 minutes
    materials: A bag, paper squares marked oxygen and nutrients, and signs for three spots around the house
    covers: [K1.6, K1.8, S1.4, U1.1]
    steps:
      - Put up far-apart signs for the lungs, the intestines and a toe muscle. You are the heart in the middle, and your child is the blood.
      - Your child picks up an oxygen square at the lungs and a nutrient square at the intestines, then delivers them to the toe.
      - The blood can only move to your clap. Clap slowly, then quickly. Then pause, and ask who is left waiting.
      - 'Surprise round: take down the lungs sign. What does the toe get now? Try again with the intestines.'
      - 'Ask: "Which job could this body do without?" Let them try to find one.'
  - title: Count it yourself
    time: 10 minutes
    materials: A clock or a phone timer
    covers: [K1.5, K1.6, K1.8, S1.4]
    steps:
      - Sitting quietly, your child counts their breaths for one minute. If they’re comfortable, they can also feel for a heartbeat at the wrist or neck.
      - Ask what they expect to happen after moving. Then they move for one song, in any way that suits their body.
      - They count again right away and compare the numbers.
      - 'Ask: "Why would both numbers change? What is the rest of your body asking for?"'
  - title: Body map
    time: 20 minutes
    materials: Large paper or a flattened cardboard box, markers, and sticky notes
    covers: [S1.3, K1.3, K1.4, K1.5, K1.6, K1.7]
    steps:
      - Trace your child on the paper, or draw a big person if they prefer.
      - 'Without looking, they stick on labels where they think each part goes: mouth, stomach, intestines, liver, pancreas, trachea, lungs, diaphragm, heart, blood vessels, muscles, bones.'
      - Check against the lesson’s picture, and move anything that needs moving.
      - Colour each system differently. Trace a bite of apple with a finger, and ask where it stops being one system’s job and becomes another’s.
questions:
  - Which system do you think matters most? What can’t it do on its own?
  - When you wave at a friend, what has to be working, besides your arm?
  - You breathe in air. Where do you think the air stops, and what keeps going?
  - A muscle gets oxygen but no nutrients. What would you want to check?
  - Think of a dog or a bird. Which of these jobs does it need done?
misconceptions:
  - thought: '"Air rushes down tubes from my lungs to my legs."'
    why: You breathe in air and your legs need it, so a direct route makes good sense.
    tryThis: In The delivery run, only oxygen squares go in the bag. Trace it on the body map, from the lungs into the blood and then to the muscle.
  - thought: '"The heart is the delivery truck."'
    why: The heart is the famous one, and it does move the blood.
    tryThis: 'After The delivery run, ask: "Who did the travelling, you or the one clapping?" Does the heart ever leave the chest?'
  - thought: '"Food never goes through the liver or pancreas, so they can’t be digestive."'
    why: Digestion gets drawn as a tube, so it seems that only the tube counts.
    tryThis: Ask whether a hockey coach is part of the team, even without touching the puck. What do these two parts do for the digestive team?
  - thought: '"Breathing and heartbeat have nothing to do with each other."'
    why: You feel them in different places, and you can choose to hold your breath but not your heartbeat.
    tryThis: After Count it yourself, ask what the working muscles need from each one.
lookFor:
  - They talk about jobs, not only names, when you ask about a part of the body.
  - Asked what would happen if one part stopped, they follow the effects to other systems.
  - They say that blood carries oxygen, not air.
  - They go back to their cracker drawing and fix it on their own.
adapt:
  support:
    - Take one system at a time, using your child’s own body. Chew, feel the chest rise, bend an elbow.
    - Learn the job before the name. "Which one moves blood?" comes before any list of parts.
    - Start with the three systems that make deliveries. Bring in the musculoskeletal system as the one receiving them.
  access:
    - need: reading
      tip: Body part names are long. Say each one, touch the place, and only then look at the written word. Read problems aloud.
    - need: writing
      tip: Answers can be given by pointing at the body map. The heart’s meeting in problem d2 can be performed, with the words written down afterward if at all.
    - need: attention
      tip: Do two laps of The delivery run, then one question, then two more laps.
    - need: worry
      tip: |-
        Bodies can feel personal, especially after illness or hospital stays.

        - Use a made-up creature or stuffed toy instead of their own body.
        - Skip the heartbeat if it unsettles them.
        - Keep "what goes wrong" as silly as the grumpy toe.
    - need: language
      tip: Touch the body as you say the word, such as the front of the neck for "trachea." If your family has home-language words for body parts, use both.
    - need: hands
      tip: Your child can run the delivery from a chair, using a toy car on a map drawn on the table. For counting, any movement that suits their body will do.
  stretch:
    - Pick an everyday action, such as singing or skipping rope. List each system it relies on, and explain how.
    - Invent a creature with different parts from ours, but make sure every job gets done. Ask someone to find the flaw.
together:
  - problem: d1
    how: |-
      - Give the toe a grumpy voice. For each letter, your child says what is arriving before naming a system.
      - Then ask, "What does that tell you is still working?"
  - problem: d2
    how: |-
      - You play the heart, as pompously as you can. Your child answers as the lungs or the intestines.
      - Ask one follow-up: "And could you manage without me?"
