id: evidence-bias-ethics
subject: science
why: Children meet graphs, claims and surveys every day. This topic teaches them to ask how a result was collected and shown, to accept that their own hopes can tip a result, and to see honesty as part of doing science.
hook:
  title: The fancy water
  time: 5 minutes
  covers: [K2.1, K2.2]
  body: |-
    1. Pour water from one jug into two glasses. Label one "Premium Glacier Water" and the other "Tap".
    2. Serve them with ceremony. Your child scores each out of 10.
    3. Show them the jug: **"They came from the same place. So what happened to your scores?"**
    4. Don’t explain. If the scores matched, ask why anyone might expect them not to.
activities:
  - title: Blind snack test
    time: 15 minutes
    materials: Two brands of a food your child already eats, plates, a scarf or closed eyes
    covers: [K2.1, S2.1, U2.1]
    steps:
      - Your child says which brand they think is better and writes it down.
      - Taste with eyes closed. The server marks each plate secretly, and stays silent and straight-faced.
      - Do it a few times, in a mixed-up order, and record every score. Then reveal the results.
      - 'Ask: "Why did the server need to keep a straight face? Where could your expectations have got in the way?"'
  - title: The book wall
    time: 10 minutes
    materials: Blocks or coins, and a large book
    covers: [K4.2, K4.4, S4.2, S4.3]
    steps:
      - Build two stacks, one with 12 blocks for Team A and one with 14 for Team B. Ask how much bigger Team B’s stack is.
      - Stand the book in front so that only the top of each stack shows, 2 blocks and 4 blocks.
      - Your child writes a headline for each view. "Team B is twice as big!" is a good one.
      - 'Ask: "Are the numbers true in both? Which view gives the wrong idea? Who might want to use the wall?"'
  - title: Ethics court
    time: 15 minutes
    materials: A wooden spoon for a gavel
    covers: [K5.2, S5.1, U5.1]
    steps:
      - |-
          - Your child is the judge, and you are on trial. Confess one case at a time:
            - "My plant looked sad, so I wrote 14 cm when it was 12."
            - "I put everyone’s survey answers on a poster with their names."
            - "I kept a frog in a jar for a week for my project."
      - You defend yourself badly, and your child decides which rule of scientific ethics you broke and how the investigation could be done properly.
      - Your child sentences you to something silly, such as walking like a frog to the kitchen.
      - Swap roles. Your child invents a case, and you are the judge.
questions:
  - What might have been left out?
  - What does this picture want me to believe? What do the numbers say?
  - What are you hoping the result will be? How could that change what you do?
  - What is real that you can’t see, hear or touch? What could help us observe it?
  - How could you find this out with less harm?
  - Would you want your name beside that answer? Why or why not?
misconceptions:
  - thought: '"Bias only happens to people who cheat, and I’d know if I were doing it."'
    why: The word sounds like an accusation, and we can’t feel our own bias at work.
    tryThis: Go back to the fancy water, and ask whether anyone lied. Then compare your child’s prediction with the blind test.
  - thought: '"If the numbers on a graph are true, the picture must be fair."'
    why: They’ve learned to trust numbers, and pictures seem to simply show them.
    tryThis: Bring out the book wall. Then, on a real graph, read the bottom of the scale together before looking at the bars.
  - thought: '"Never leave out any number" or "Throw out any number that looks wrong."'
    why: Each one sounds like a simple rule for being honest.
    tryThis: Talk through a real mistake, like a brother spinning the hamster wheel. Ask what a reader would need to know.
  - thought: '"If I can’t see it, it isn’t there."'
    why: Their eyes have been reliable so far, and most of what they know comes from looking.
    tryThis: Ask how we know about the bones in your arm or craters on the Moon. Which technology let us observe them?
lookFor:
  - They ask "Out of how many?" or "What got left out?" when they hear a claim.
  - They read the scale on a graph before believing the picture.
  - They report a result that surprised them instead of quietly fixing it.
  - They ask before sharing someone’s answers, or take care with a bug they’re watching.
adapt:
  support:
    - Start with a single idea. "What we hope can change what we do." Do the blind test before you use the word bias.
    - Use block towers before paper graphs. Your child can see the whole tower and what gets hidden.
    - Begin ethics with "Is this fair? Who could get hurt?" Name the four rules afterward.
  access:
    - need: reading
      tip: Read the four-point checklist aloud, and turn it into four short questions your child can count on their fingers.
    - need: language
      tip: Bias is a hard word to translate. Use the fancy water as your shared example, so "like the fancy water" can stand in until the word sticks.
    - need: worry
      tip: |-
        - Some children don’t like being fooled. Warn them a trick test is coming, or let them fool you.
        - Everyone has biases, including adults.
    - need: attention
      tip: In Ethics court, do one case at a time, and hand over the gavel. A child who loves to argue has a lot to do here.
  stretch:
    - Find a graph in a flyer or the news. Redraw it with all the data. What changes?
    - Run a small family survey twice, once with hands up and once on paper slips with no names. Compare the results, and decide how to share them without naming anyone.
together:
  - problem: b1
    how: Build the two bars with blocks, then hide the bottoms behind a book. Ask your child to read the scale aloud before saying anything about the picture.
  - problem: d1
    how: |-
      - After the first part, act it out: your child is the hen, pecking the table.
      - Lean forward, then straighten up at the right number. Ask how they knew when to stop.
  - problem: d2
    how: |-
      - Read the numbers aloud. Each of you argues for a different choice.
      - Ask what a reader would need to know. Let your child change their mind out loud.
