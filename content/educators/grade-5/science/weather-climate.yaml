id: weather-climate
subject: science
why: One event and a long pattern are different kinds of evidence. A child who asks "is that one day, or what usually happens?" learns what a measurement can show.
hook:
  title: Two bets
  time: 5 minutes
  covers: [K1.1, K1.2, S1.1]
  body: |-
    1. Offer two bets, with pretend coins:
       - **It will rain on this exact date next year.**
       - **Next January will be colder than next July.**
    2. See how much they put on each.
    3. Ask: **"You don’t know the future either way. So why are you surer about one?"** Don’t settle it.
activities:
  - title: The year-long suitcase
    time: 15 minutes
    materials: A bag, clothes from around the house, and the lesson’s climate graphs
    covers: [S1.3, K1.5, S1.4, S1.6]
    steps:
      - Your child secretly picks a place from the lesson’s graphs, such as Singapore, Cairo, Vancouver, Edmonton or Iqaluit.
      - They study its graph, then pack a bag for living there for a **whole year**.
      - 'You open the bag and guess the place. Ask about anything odd: "Why four sweaters?"'
      - Swap roles. Pack badly on purpose, and let them catch your mistake using the graph.
  - title: One-tool weather station
    time: 10 minutes to build, then 1 minute a day for a week
    materials: A straight-sided jar and a ruler, or a plastic bag tied to a stick as a windsock
    covers: [S2.2, S2.3, S2.4, K2.1, U2.1]
    steps:
      - Your child chooses one tool and builds it.
      - 'Before it goes outside, ask: "Where should this go, so that it measures the real thing?" Let them choose, and hear the reason.'
      - Read it at about the same time each day, and record it with numbers, words or little drawings.
      - At the end of the week, turn the record into something anyone could read, such as a chart, a calendar or a row of pictures.
  - title: The weather show
    time: 15 minutes
    materials: Large paper, sticky notes, and a weather app or website
    covers: [S2.5, S2.6, K2.2]
    steps:
      - Sketch your region and mark your town and a few places nearby. Look up today’s readings for each.
      - Your child draws weather symbols on sticky notes and places them on the map.
      - They present the forecast to the camera, or to a stuffed audience, with big gestures.
      - 'Add a twist: a farmer, a pilot and a family going camping each call in. What does each one need to know?'
questions:
  - It snowed in May. What does that tell you about Alberta’s climate? What doesn’t it tell you?
  - Why 30 years? Why wouldn’t 2 years be enough?
  - Could two places have the same temperature today and very different climates? How?
  - If a big lake appeared next to our town, what might change over the years? What wouldn’t?
  - Who might have watched the weather here for a very long time? What can long watching show that one tool can’t?
  - When would a forecast help you more than 30 years of records? When would the records help more?
misconceptions:
  - thought: '"It was freezing last week, so our climate is cold."'
    why: Weather is what they can feel, and 30 years is longer than their whole life so far.
    tryThis: Ask someone older what winters have usually been like here. Then ask your child what last week does and doesn’t add to that.
  - thought: '"Same July temperature means same climate."'
    why: The numbers match, and matching numbers feel like the end of the question.
    tryThis: Cover all but July on a climate graph, then reveal the other months one at a time. Stop whenever your child wants to change their mind.
  - thought: '"A wind vane points to where the wind is going."'
    why: Arrows nearly always show where something is headed.
    tryThis: Outside, turn until the wind is on your nose. Your nose is the arrow. Where is the wind coming from?
  - thought: '"My jar caught more, so it’s more accurate."'
    why: More usually feels better, and a fuller jar looks like a more successful one.
    tryThis: In the next rain, put one jar in the open and one under the edge of a roof. Ask where the extra water came from.
lookFor:
  - They use time words on their own, like "usually", "over many years" and "right now."
  - They ask where a tool was put before they trust its numbers.
  - They look at a whole year on a climate graph, not just one month.
  - They can say which tool or method would answer a given question.
adapt:
  support:
    - Sort spoken sentences into "right now" or "usually", with lots of examples from your child’s own day.
    - Learn the tools one kind of weather at a time in the lesson’s weather station. Don’t try to memorize all seven at once.
    - Read one climate graph with one question, such as "Which month is coldest?" Then compare it with Edmonton.
  access:
    - need: reading
      tip: Tables and graphs can be a lot at once. Cover everything but one row or one month with a sheet of paper, and uncover the rest as needed.
    - need: writing
      tip: A weather diary can be symbols, drawings or a daily voice note. The record only has to be readable and regular.
    - need: attention
      tip: One minute a day suits this topic well. Put the jar on the way to the door, so the reading becomes part of leaving the house.
    - need: worry
      tip: |-
        - Forecasters can be wrong too. Everyone forecasts tomorrow, and enjoy being wrong together.
        - If storms are frightening, stay with how forecasts help people get ready.
    - need: language
      tip: Point out the window for "today", and sweep a long arm for "many years." Tool names are long, so say them slowly with a gesture, like a spinning finger for anemometer.
    - need: hands
      tip: Your child can choose the spot and decide how to record, and you carry the jar and hold the ruler. Bring the jar to the table if that makes it easier to read.
  stretch:
    - Compare Alberta with another province or territory on the lesson’s graphs. Which factor do you think explains the biggest difference? Say why.
    - Build a second copy of your tool and put it somewhere else in the yard. When the two disagree, which one would you trust, and why?
    - The lesson says First Nations, Métis and Inuit communities use traditional knowledge to read the weather. To learn from local knowledge keepers, ask a school or cultural centre how to invite them respectfully, and follow what they tell you.
together:
  - problem: d1
    how: Keep a map of Canada handy and let your child move the mountains with their hands. Before reading any choices, ask which factor Olga has changed and what she has left alone.
  - problem: d3
    how: |-
      - You play the worried caller. Your child runs the repair shop.
      - Ask only "What would a working gauge show?" and "How could you check it today?" They can test with a jar.
