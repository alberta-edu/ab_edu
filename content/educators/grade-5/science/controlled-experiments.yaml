id: controlled-experiments
subject: science
why: Anyone can say "It worked." This topic gives a child the habit of asking "What else changed?", and a fair way to settle an argument with evidence instead of volume.
hook:
  title: The lucky sock
  time: 5 minutes
  covers: [K3.5, S3.5]
  body: |-
    1. Put a sock on your throwing hand: "My lucky sock makes me a better thrower."
    2. Stand one step from a basket and toss in a paper ball. Score!
    3. Take off the sock, walk across the room and throw. Miss. "See? It’s the sock."
    4. Ask: **"Are you convinced? Why or why not?"** Defend the sock seriously, and let your child argue.
activities:
  - title: The scrunch test
    time: 20 minutes
    materials: Scrap paper, a tape measure or big footsteps, sticky notes
    covers: [K3.1, K3.2, K3.3, K3.4, S3.1, S3.2, S3.4]
    steps:
      - 'Ask: "Does a tighter scrunch make a paper ball fly farther?" Your child decides what has to stay the same, such as the sheet size, the thrower and the line on the floor.'
      - 'Sort sticky notes into three groups: what we change, measure and keep the same. Name them once the groups make sense.'
      - Throw each ball three times. Mark each landing with a note and record every distance, including the bad throws.
      - Cheat once on purpose, over the line. Your child calls it out as referee. Ask, "Why does that ruin this throw?"
      - Your child says what the evidence shows, starting with the words "In our test...".
  - title: Family claims court
    time: 15 minutes, spread over a week
    materials: Paper, and whatever the claim needs
    covers: [K3.5, S3.1, S3.5, U3.1]
    steps:
      - Collect things your family says, such as "The dog comes faster when I call" or "This pen makes my writing neater". Your child picks one that is safe and easy to test.
      - Your child plans the test and names the one thing that will change. Anyone can object by saying, "What else changed?"
      - Run it. If it involves a pet, keep it gentle and short, and stop if the animal doesn’t want to play.
      - Your child gives a verdict at supper, using the evidence. "No difference" and "We can’t tell yet" are both real verdicts.
questions:
  - What else changed?
  - What would you keep the same? Why that?
  - How will you know what happened? What will you measure or count?
  - Nothing changed in your test. Did you learn anything?
  - Would your result be true on a different floor, or with a different car? How could you find out?
  - What result would show you’re right? What result would show you’re not?
misconceptions:
  - thought: '"A fair test means everything is the same."'
    why: In daily life, fair does mean treating everything equally.
    tryThis: Throw the same ball from the same line twice. "What did we find out?" What would you need to change to learn something?
  - thought: '"Cooking time is a manipulated variable, always."'
    why: The names sound like labels that stick to a thing.
    tryThis: Ask two different questions about the same toy car. The car’s load is what you change for one question and what you keep the same for the other.
  - thought: '"Same result, so neither thing matters."'
    why: Matching numbers look as if nothing happened.
    tryThis: Change one thing at a time and watch. Ask whether two changes could have been hiding each other.
  - thought: '"My test proves it for everyone, everywhere."'
    why: The result felt so clear that it seems like it must always be true.
    tryThis: Ask what exactly you tested. Then finish the sentence, "In our test, with these things..."
lookFor:
  - They ask "What else changed?" about an ad or a friend’s claim.
  - They keep things the same without being reminded, like going back to the same line.
  - They say "in our test" instead of "always".
  - They accept a result that didn’t go the way they hoped.
adapt:
  support:
    - Try two tests and one change. Ask only "What did we change? What did we watch?" Add the terms once it’s clear.
    - Sort variables with three short phrases. "I choose it." "I wait and measure it." "I keep it the same."
    - Use the lesson’s fair test lab first, because it highlights each change for your child.
  access:
    - need: reading
      tip: Manipulated and responding are long words. Give each kind of variable its own colour of sticky note, and use that colour every time.
    - need: writing
      tip: Mark results on the floor with notes or take a photo. Your child says the conclusion aloud while you write it down.
    - need: attention
      tip: Make your child the official referee or measurer, with one clear job each round. Keep to one question and one short test.
    - need: worry
      tip: Tell your child that a test can’t fail, since a surprise is still evidence. Let your own idea be proven wrong first, as with the sock.
    - need: language
      tip: Show "fair test" with a race, using the same start line, and then an unfair race. The word is easier after feeling the difference.
    - need: hands
      tip: Your child can be the referee and call out measurements while someone else throws.
  stretch:
    - Test four or five levels of the thing you change instead of two, and make a table. Does the result keep changing the same way all the way along?
    - Plan a test about a pet or a person that does no harm, where two possible causes always come together, and pull them apart.
together:
  - problem: d1
    how: |-
      - Sort the runs from both days, first by cape, then by order. Ask what they notice.
      - Insist the cape works, and let them use the times to talk you out of it.
  - problem: d3
    how: |-
      - Your child pictures only the books changing, then only the pushers. Try it with a toy car and books, if you have them.
      - Let them say why Rosa’s test can’t settle this.
