id: plant-transport
subject: science
why: A plant sits so still that children assume nothing is happening inside it. This topic teaches them that a quiet outside can hide busy work, and that damage in one spot can cause trouble far away, much later.
hook:
  title: The tallest drink
  time: 5 minutes
  covers: [K2.3, U2.1]
  body: |-
    Stand under the tallest tree you can find, or put a house plant on the table. Look up at the very top leaf. Say: "Imagine you are that leaf. You’re thirsty. The water is far below you, under the ground. You have no legs, and nobody is bringing it."

    Ask: **"How do you get a drink? And the root tip, down there in the dark, how does it get what it needs?"** Let the wild ideas pile up. Write them down and correct nothing.
activities:
  - title: Delivery roads
    time: 15 minutes
    materials: Socks, paper scraps, two baskets, a cup, string or tape
    covers: [K2.1, K2.3, K2.4, U2.1]
    steps:
      - 'Lay two string paths down a hallway, one for xylem and one for phloem. Put a basket at one end ("roots") and a basket at the other ("leaves"). Put a cup past the leaves ("fruit").'
      - Your child is the delivery crew. Socks are water and nutrients, and they start at the roots. Paper scraps are sugars, and they start at the leaves. Each cargo may only travel on its own path.
      - 'Ask: "Who needs what?" Your child runs deliveries until every part of the plant has what it needs.'
      - 'Now a disaster. Lay a pillow across the phloem path and keep playing for one minute. Ask: "Where is a pile growing? Who runs out first? What happens after that?"'
  - title: The blue stalk
    time: 10 minutes, over two days
    materials: Leafy celery, a glass of water, food colouring, some drinking straws
    covers: [K2.3, S2.1]
    steps:
      - The lesson’s animation already shows this, so do it only if you’d enjoy seeing the real thing. An adult stands the stalk in strongly coloured water. Your child draws where they think the colour will be tomorrow.
      - The next day, compare the drawing with the stalk. Check the leaves first.
      - An adult slices across the stalk. Your child lays the slices in order and hunts for the dots.
      - 'Hold up a bundle of straws. Ask: "Is the inside of the stalk more like this, or more like a sponge? What did you see that makes you say so?"'
questions:
  - A root tip grows in the dark, far from any leaf. How does it get what it needs?
  - Why might a plant need two kinds of tubes instead of one?
  - A plant is drooping, but its soil is wet. What could be going on?
  - How is a stem like your blood vessels? How is it not?
  - If a tree looked sick, which part would you check first? Why that part?
misconceptions:
  - thought: '"Xylem carries water up, so water can’t go down."'
    why: Almost every plant they’ve seen has its roots at the bottom, and we keep saying "up".
    tryThis: Turn a drawing of a plant upside down. Ask your child to say the xylem’s job without using the word "up".
  - thought: '"Phloem carries sugars down."'
    why: Roots are the part they picture being fed, so the trip feels one-way.
    tryThis: Point to a fruit at the top of a plant, or an apple on a branch. Ask how the sugars got there.
  - thought: '"Plants get their sugars from the soil."'
    why: People feed plants through the soil, so soil seems like the place where all food comes from.
    tryThis: Go back to the lesson’s visual, switch to Phloem and put a finger where the dots begin.
  - thought: '"It has no heart, so nothing moves around inside a plant."'
    why: In their own body, things moving goes with a beat they can feel.
    tryThis: Return to the blue colour in the celery animation. Ask where it went, and what that tells them.
lookFor:
  - They describe a tube by what it carries and where that starts, not only by "up" or "down".
  - When a plant looks unwell, they wonder about its roots as well as its leaves.
  - They compare a plant with their own body and also notice a way the two are different.
adapt:
  support:
    - Follow one tube at a time. Use the lesson’s Xylem switch alone, then Phloem alone, before trying Both.
    - Draw a plant together. Your child adds blue arrows for water and yellow arrows for sugars, and you add the labels.
    - Practise a short pairing while touching a real plant. "Xylem, water, from the roots. Phloem, sugars, from the leaves."
  access:
    - need: reading
      tip: Both words look strange on the page. Say them aloud together (ZY-lem, FLOW-em) and keep them on a sticky note with a small drawing beside each one.
    - need: language
      tip: These words are new to nearly every child, so your child isn’t behind. Tie each to a gesture, such as a hand climbing from the floor for xylem and a hand spreading out from a leaf for phloem.
    - need: attention
      tip: Keep the delivery game to one-minute rounds, with a new question between them. Running the cargo gives the idea somewhere to go.
    - need: hands
      tip: In the delivery game, your child can be the dispatcher who calls out what goes where while someone else carries it.
  stretch:
    - Invent another accident for a plant, such as a broken stem or a chewed root. Predict which parts will notice first and which will notice much later.
    - If your child asks what makes water climb or how leaves get their sugars, it’s fine to say that comes in a later grade. This grade stays with what moves, from where and to where.
together:
  - problem: d1
    how: Before reading the choices, keep a finger on each road in the drawing, or act it out with the delivery game. Ask "Which road did the hare cut?" and wait. Let your child tell you what happens next, one step at a time.
  - problem: d2
    how: Hold a drawing of a plant upside down between you. Ask your child to trace where the water starts and where it needs to go. Let them decide what Nell has mixed up.
  - problem: d3
    how: Cover the choices. Ask what a sponge would do with two colours, and what straws would do. Once your child has said both, uncover the choices and let them match.
