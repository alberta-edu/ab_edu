id: particle-model
subject: science
why: Particles are far too small to see, so this topic asks a child to explain what they can see using something they never will. A child who can reason from an invisible model to a real pour, smell or shape, and say where the model falls short, has learned how science explains things.
hook:
  title: The smell that walks
  time: 5 minutes
  covers: [K1.1, K1.4]
  body: |-
    Have your child stand at the far end of a room with their eyes closed. Stand at the other end and peel an orange. Vanilla on a cotton ball works too. Their job is to raise a hand the moment they smell it.

    Then ask: **"Nothing you could see crossed the room. So what reached your nose? How did it get there?"** Let every idea stand, however odd. Don’t explain. Carry the question into the lesson.
activities:
  - title: Shake the box
    time: 10 minutes
    materials: A clear food container with a lid, and about 30 dried beans or buttons
    covers: [S1.1, S1.2, K1.2, K1.3, K1.4, K1.5]
    steps:
      - 'Lid off. Your child squeezes the beans into a tight block in one corner, using their fingers as walls, and jiggles them without letting any bean swap places. Ask: "What are your fingers pretending to be?"'
      - Now let go and tilt the container slowly. The beans slide past each other and gather at the low end. Ask what changed and what didn’t.
      - Lid on. Shake hard, in every direction. Listen to the beans hitting all the walls.
      - 'Stop shaking. Ask: "Real particles would keep going. What else does our bean model get wrong?"'
  - title: Hold on, let go
    time: 10 minutes
    materials: Two or more people and some clear floor
    covers: [K1.5, S1.3, U1.1]
    steps:
      - 'Call out "Solid!" Everyone links arms tightly, stays on the spot and wiggles.'
      - 'Call out "Liquid!" Hold hands loosely and shuffle around each other, staying close.'
      - 'Call out "Gas!" Let go and walk in any direction, all over the room, without stopping.'
      - Your child becomes the caller. Sudden switches are allowed, and so is trying to trick you.
      - 'Afterward, ask: "Which one was hardest to pull apart? What did holding on do to the way you could move?"'
questions:
  - A brick looks perfectly still. What might be going on inside it that you can’t see?
  - If you shrank down and stood in a glass of juice, what would it be like? What about in the air above it?
  - Why can you walk through air and swim through water, but not walk through a wall?
  - You pour juice into a wider glass. What changes about its particles, and what doesn’t?
  - What is our drawing good at showing? What does it get wrong?
misconceptions:
  - thought: '"The brick is still, so its particles have stopped."'
    why: In everyday life, still means still. Nothing they can see says otherwise.
    tryThis: 'Hold your hand out and make it tremble on one spot. Ask: "Did my hand go anywhere? Is it moving?"'
  - thought: '"Gas particles must be bigger, because a gas fills the whole jar."'
    why: When something takes up more room, we usually expect it to have grown.
    tryThis: 'Stand close together, then walk to opposite ends of the room. Ask: "Who grew? What got bigger?"'
  - thought: '"Gas is light, so its particles stay up at the top of the jar."'
    why: They have seen balloons rise, and gas does feel like nothing at all.
    tryThis: Go back to the orange. Ask whether the smell stayed up near the ceiling, or whether a person sitting on the floor could smell it too.
  - thought: '"A puck flying across the rink has zooming particles, so it isn’t really a solid."'
    why: '"In place" sounds like one spot in the room, not one spot among neighbours.'
    tryThis: Slide the box with the beans held in their tight block. Ask whether any bean got new neighbours on the trip.
lookFor:
  - They draw a gas with particles the same size as a solid’s, and make the spaces larger instead.
  - They explain something ordinary, like a smell spreading or a drink pouring, by talking about particles without being asked.
  - They point out what a model gets wrong, such as "real particles wouldn’t stop."
adapt:
  support:
    - Start from what your child already knows. What does a solid do? A liquid? A gas? Then ask what the particles might be doing to make that happen.
    - Stay with one state at a time. Let your child say what they see in the lesson’s picture before you move on to the next.
    - Draw just 6 dots. A few dots are easier to arrange and talk about than many.
  access:
    - need: reading
      tip: Many problems are stories about a puck, a pickle jar or a sand pail. Read them aloud, and let your child retell the story before looking at the choices.
    - need: writing
      tip: Drawings count. A box of dots with a few arrows can say what a paragraph would. Your child can explain the drawing while you write.
    - need: attention
      tip: Play one round of Hold on, let go between questions. Two minutes of moving, then back to one question.
    - need: worry
      tip: 'Nobody can see these particles, so a wrong guess is ordinary here. Try saying, "It’s a model. Let’s test how good it is."'
    - need: language
      tip: 'Tie each state to a hand shape: a tight fist that trembles, loose fingers sliding over each other, fingers flung wide. Say "holding on" first, then swap in "attractive forces" once the idea is there.'
    - need: hands
      tip: Your child gives the orders and you move the beans. The thinking stays with them.
  stretch:
    - Draw one juice box with all three states in it, the box, the juice and the air inside. Use attractive forces to explain each one.
    - Improve the bean box. What could you change so that it shows something it got wrong before?
together:
  - problem: d1
    how: Read Professor Wobble’s rays in a silly voice. Before each part, ask your child to name one thing the story promises will stay the same. Keep the beans nearby to test ideas.
  - problem: d2
    how: Take Jonah’s side and argue for it, badly but with great confidence. Ask your child what evidence would change your mind, and let them look at real sand or sugar if you have some.
