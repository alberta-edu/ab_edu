subject: science
promise: |-
  We hope your child comes to ask "How do you know?", and to enjoy being surprised.

  - Facts can be looked up in seconds.
  - Predicting, testing fairly and changing your mind because of evidence is what science really gives them.
shifts:
  - instead: Explaining the idea, then showing an experiment that proves it.
    tryThis: Getting a prediction first. On the site’s experiments, have your child commit to an answer before pressing Run, and say why.
  - instead: Saying "That’s wrong" when a child has a mistaken idea.
    tryThis: 'Asking "What would we see if that were true?" Then look. Children hold on to ideas until something they see makes them doubt.'
  - instead: Treating a surprising result as a failed experiment.
    tryThis: Celebrating it. A result nobody expected is the most interesting thing that can happen, so ask what might explain it.
  - instead: Answering every question they ask.
    tryThis: 'Saying "How could we find out?" It’s also fine to say "I don’t know", and it shows that adults keep learning too.'
  - instead: Memorizing vocabulary first.
    tryThis: Letting them see the thing and describe it in their own words, then giving them the science word for what they’ve already noticed.
routines:
  - name: Predict, watch, explain
    time: 5 minutes
    how: |-
      Use it with any on-screen experiment:

      1. Predict, with a reason.
      2. Run it, and say what happened.
      3. Say why.

      A wrong prediction is the best part, so ask what they think now.
  - name: Who’s right?
    time: 5 minutes
    how: |-
      1. Describe two friends who disagree: "Ana says the ship floats because it is big. Sam says it’s because it holds air."
      2. Your child decides who has the better reason, and what evidence would settle it.
  - name: Change one thing
    time: 5 minutes
    how: |-
      Whenever your child suggests a test, ask:

      - What are you changing?
      - What stays the same?
      - How will you know?

      Soon they will ask it themselves.
  - name: Science walk
    time: 15 minutes
    how: Go outside with one question, such as where the wind is coming from or what the Moon looks like tonight. Come back with one thing noticed and one thing wondered.
assess:
  - They give a reason with their prediction, not just a guess.
  - They change their mind because of something they saw, and they can say what it was.
  - They spot when a test isn’t fair.
  - They use the science word correctly without being asked, in a new situation.
sources:
  - label: 'TERC Inquiry Project: concept cartoons'
    url: https://inquiryproject.terc.edu/assessment/concept_cartoons.cfm.html
