id: seasons-day-length
subject: science
why: Most children already have a sensible explanation for summer, and it’s wrong. This topic gives them practice in testing an idea against what happens elsewhere on Earth, and in telling a steady cycle apart from a passing change in the weather.
hook:
  title: Twenty-four coins
  time: 5 minutes
  covers: [K1.5, S1.1]
  body: |-
    Put 24 coins or pieces of cereal on the table, one for each hour of a day. Make two piles for June 21 in Edmonton: about 17 hours of daylight and the rest dark. Now make the piles again for December 21, with only 7 or 8 in the daylight pile.

    Ask: **"The same 24 hours. The same Sun. So where did all that daylight go?"** Write down every theory, and don’t say which one is right. Check them after the lesson.
activities:
  - title: Be the Earth
    time: 10 minutes
    materials: A chair and room to walk
    covers: [K1.4, K1.5, S1.1, S1.7]
    steps:
      - The chair is the Sun, and your child is Earth. They hold one arm up at a slant, pointing high toward the door. Their hand is the north end.
      - 'The rule is that the arm always points at the door. Your child walks slowly all the way around the chair and stops when the hand leans most toward the Sun, and again when it leans most away.'
      - 'At each stop, ask: "What season is it in Alberta? Are the days long or short? What is the south end doing right now?"'
      - 'Break the rule. This time your child keeps the arm aimed at the chair all the way around. Ask: "What would that do to Alberta’s year?"'
  - title: Sunset bets
    time: 2 minutes a week, for a month
    materials: A weather app or a window, and paper on the fridge
    covers: [K1.3, K1.5, S1.4]
    steps:
      - On Sunday, look up today’s sunset time, or note when it gets dark. Write it on the fridge.
      - Everyone bets on the time of next Sunday’s sunset. The closest bet picks the dessert or the game.
      - After a month, ask what the bets have taught you. Is the sunset moving? Which way?
      - 'Ask: "When do you think it will stop moving that way? How could we check?" Find the next solstice in the lesson’s table.'
  - title: The family year wheel
    time: 15 minutes
    materials: Paper and markers
    covers: [K1.7, K1.8, K1.9, S1.7]
    steps:
      - Draw a big circle and split it into four seasons. Your child fills it with what your family does in each one, and when it gets dark at supper.
      - Add what the lesson shows. Mark planting and harvesting, the Sunrise Festival in Inuvik in January, and the Sun Dance that many Plains First Nations hold in late spring or early summer.
      - 'Ask: "Which of these come back because of where Earth is on its trip? Why would people watch for those times?"'
      - Treat ceremonies as things to learn about, not to copy at home. To learn more, ask a local Indigenous cultural centre or your school how to ask respectfully.
questions:
  - When it’s summer here, what do you think a child in Australia is wearing today? How would you explain that?
  - If being closer to the Sun caused summer, who should be having summer right now?
  - Which days could you write on next year’s calendar in pen? Which couldn’t you?
  - A warm wind melts the snow in February. What has changed? What hasn’t?
  - How do you think it would feel to see the first sunrise after weeks of dark?
misconceptions:
  - thought: '"Summer is when Earth is closer to the Sun."'
    why: Standing closer to a heater makes you warmer, so this is good reasoning from real experience.
    tryThis: Ask what season it is in Australia on the same day. Earth can’t be close for one half of the planet and far for the other.
  - thought: '"The lean changes during the year, so the north tips toward the Sun in summer."'
    why: Words like "tilted toward" make it sound as if Earth moves its axis to face the Sun.
    tryThis: Play Be the Earth. Your child’s arm never changes direction, yet the hand leans toward the chair at one spot and away from it at another.
  - thought: '"The far north is cold and dark, so it always has the least daylight."'
    why: Pictures of the Arctic are usually snowy winter scenes.
    tryThis: Watch the lesson’s midnight sun animation again, and ask what Inuvik looks like at midnight in June.
  - thought: '"A warm spell means the season has changed."'
    why: Warmth is what we feel, and the length of the day is easy to ignore.
    tryThis: On a warm winter day, check the sunset time. Ask whether the warm wind moved it.
lookFor:
  - They use a hand or an arm to show the lean when explaining, without being asked.
  - They mention the other hemisphere when they talk about summer or winter.
  - They separate weather from daylight, as in "It’s warm, but the days are still short."
adapt:
  support:
    - Start with one hemisphere and two days, June and December. Add the equinoxes later.
    - Ask only "Leaning toward the Sun, or away?" before you bring in the names of the seasons.
    - Use **Play a year** in the lesson’s visual and pause it often. Let your child say what the daylight bars will do next.
  access:
    - need: reading
      tip: Solstice and equinox are hard words. Say "longest day", "shortest day" and "equal day" first, and add the real names once the ideas are solid.
    - need: language
      tip: Lean your own body as you say "tilted toward" and "tilted away". The movement carries the meaning of both phrases.
    - need: hands
      tip: Instead of walking, your child can move a pencil around a cup on the table, keeping it pointed at the door. Or they can give directions while you walk.
    - need: worry
      tip: In Sunset bets, being wrong is part of the game, and adults lose too. Start there if questions about the tilt feel risky.
  stretch:
    - Use a weather app to compare this week’s daylight in a town far in the north of Canada and a town far in the south. What do you notice? What do you predict for six months from now?
    - Tell the story of one year from the point of view of a child in Inuvik, with the midnight sun and the polar night.
together:
  - problem: d1
    how: Act out the straight globe with your own bodies, with your arm straight up. Ask your child what they notice at each stop before you look at the choices.
  - problem: d2
    how: Ask your child to say Bronte’s argument in their own words. The fact in it is true, which is what makes this hard. Then ask, "Who else is on Earth that day?" and leave them to it.
  - problem: d4
    how: Play a picky reader of the storybook. For each number your child enters, ask "How do you know?" Let them start with the boxes they feel surest about.
