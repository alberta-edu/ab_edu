id: design-process
subject: science
why: Children often treat a first try as a verdict on themselves. Design teaches that version 1 is supposed to have problems, that a test tells you what to change next, and that something new isn’t always something better.
hook:
  title: The worst thing in the house
  time: 5 minutes
  covers: [K2.1, S2.2]
  body: |-
    Say: "We have three minutes to find the worst-designed thing in this house." Each person brings back one thing, such as a cup that dribbles, a remote with tiny buttons or a lid that won’t stay on. Leave anything sharp where it is.

    Hold a trial. Ask: **"What is it supposed to do? Who would defend it? Someone thought this was a good idea, so how did it end up like this?"** Crown a winner, and leave it there.
activities:
  - title: The coin carrier
    time: 25 minutes
    materials: Paper, tape, string, elastics, 10 coins
    covers: [K2.2, K2.3, K2.4, K2.5, S2.3, S2.5]
    steps:
      - 'Set the need: "Carry 10 coins across the room, one-handed, without dropping any." Your child builds version 1 with a five-minute timer. Rough is fine.'
      - Someone else tests it. Walk it across the room, and then try it faster. Score it out of 5 for doing its job and for being easy to use.
      - 'Ask the tester, "What annoyed you?" Your child makes one change and says whether it adds something new (enhancing) or improves what’s there (refining).'
      - Test again. Keep every version in a row on the table.
      - 'Ask: "Which change helped most? Did any change make something worse?"'
  - title: New and worsened
    time: 10 minutes
    materials: Paper and pencils, and a spoon to look at
    covers: [K2.1, K2.4, S2.2, U2.1]
    steps:
      - Draw a plain spoon. Take turns adding one "new and improved" feature, such as a radio, a horn or a second handle.
      - After five rounds, admire the monster. Score it on safety, functionality, usability, reliability, efficiency and aesthetics.
      - 'Ask: "What does a spoon need to do? Which of these changes helped with that?"'
      - Your child draws version 6, keeping only what helps and refining one thing.
  - title: Then and now
    time: 15 minutes
    materials: An older person to talk to, or old photos
    covers: [K2.4, S2.1, U2.1]
    steps:
      - Your child is a reporter. They ask someone older what a thing was like when they were young, such as a phone, a bike, skates or a toothbrush.
      - 'Together, list what is different now. For each change, ask: "Was that added, or did something already there get better?"'
      - 'Ask: "What need was each change meeting? Is anything worse than it used to be?"'
questions:
  - Who is this made for? Have they tried it?
  - If you change that, what might get worse?
  - Was this part added, or is it a better version of something already there? How can you tell?
  - How could this fail? What would happen if it did?
  - What did that test tell you that you didn’t know before?
  - Two testers disagree. What does each of them actually need?
misconceptions:
  - thought: '"More features means a better design."'
    why: Ads say so all the time, and adding things feels like progress.
    tryThis: Ask of each new feature, "Which part of the job does this help?" New and worsened is a good way to feel the problem.
  - thought: '"I tested it myself, so it works."'
    why: It really did work for them, and it’s hard to imagine being someone else.
    tryThis: Hand the design to someone much taller or shorter, or ask them to use it with their other hand. Watch without helping.
  - thought: '"Refining means a small change and enhancing means a big one."'
    why: Both words mean making something better, so they try to sort them by size.
    tryThis: Ask only, "Did the last version already have this part?" Compare with the version right before, not the very first one.
  - thought: '"A good change makes everything better."'
    why: They expect that improving one thing can’t cost anything.
    tryThis: Change something in the lesson’s water bottle and watch all the bars. Ask which bar went down, and why.
lookFor:
  - They say who a thing is for and what its job is before they start building.
  - They keep old versions and compare them, instead of throwing them away.
  - They say something like "This helps that part, but makes this part worse."
  - They ask someone else to try their design, and they listen without defending it.
adapt:
  support:
    - Improve something that already exists, like a paper cup holder, before you design from nothing.
    - Use just two questions at first. "Does it do its job? Is it easy to use?" Add the other factors one at a time.
    - Offer three needs to choose from. Picking one is an easier first step than inventing one.
  access:
    - need: writing
      tip: Keep the record as photos or quick sketches, and let your child say the scores aloud. The row of versions on the table is the report.
    - need: hands
      tip: Your child can be the lead designer who gives directions while someone else folds, cuts and tapes. Making the decisions is the real work here.
    - need: worry
      tip: Call the first try "version 1" from the start, and show one of your own flops. Keep the timer short, so nobody is too attached to the first try.
    - need: attention
      tip: Use five-minute builds, each with a real test right after. A test gives your child a reason to come back and change something.
    - need: language
      tip: Keep each factor on a card with a small picture and the question from the lesson’s table. Use the questions first and the factor names later.
  stretch:
    - Score a real object on all six factors. Then write to its maker, proposing one enhancement and one refinement, and name the factor each one helps.
    - Design something for a person whose needs are very different from your own. Have them test it, and make version 2 from what they say.
together:
  - problem: d1
    how: Draw the door widths on paper with a ruler and let your child try numbers. For the last part, invite them to try to find a width that works for everyone. Let them discover that they can’t before they look at the choices.
  - problem: d3
    how: Hold off on the numbers. Ask your child to picture the tenth toot, and then the tenth squeeze at the bottom of a hill. Ask, "What happens next?" and listen.
  - problem: d4
    how: You play Lev and your child is the designer. Respond to each idea in character, as in "I still can’t sleep." Then switch to Nasra. Let the two complaints push them away from simply choosing brighter or dimmer.
