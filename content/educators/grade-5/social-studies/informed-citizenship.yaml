id: informed-citizenship
subject: social-studies
why: This topic teaches a child to slow down before believing or passing something on, and to hear out people who see things differently. They find out that knowing more can lead to doing something, even at their age.
hook:
  title: Who is right about the box?
  time: 5 minutes
  covers: [K1.3, S1.2]
  body: |-
    1. Hold a cereal box between you, so your child sees the front and you see the back.
    2. Describe only your side: **"This box is all tiny numbers and words."**
    3. When they object, stay firm: "There’s no picture at all. I’m looking right at it."
    4. Don’t turn it yet. Ask: **"Is one of us lying? How could we settle this?"**
activities:
  - title: Three chairs
    time: 15 minutes
    materials: Three chairs and some paper for name signs
    covers: [K1.3, S1.2]
    steps:
      - Pick a small disagreement that isn’t raw in your family, such as a dog run at the park or road hockey on the street.
      - Label each chair with someone it affects, such as a dog owner, a neighbour and a parent with a stroller.
      - Your child sits in each chair and speaks as that person. Play a nosy reporter, and ask, "What matters most to you here?"
      - Your child then stands up and says what they think in their own voice.
      - 'Ask: "Which chair was hardest to sit in? Why?"'
  - title: Ask the neighbourhood
    time: 20 minutes, spread over a few days
    materials: Paper or a phone to record with
    covers: [K1.2, S1.2, S1.3]
    steps:
      - Your child names something nearby they wish were better, such as a messy park or a hard crossing.
      - Together, find three people it touches in different ways, such as a neighbour, an older relative and a store owner. An adult stays along for every conversation.
      - 'Your child asks each one the same two questions: "What do you see happening?" and "What matters most to you about it?"'
      - Add one source that isn’t a person, such as a school newsletter, the town website or their own count.
      - 'Ask: "What do you know now that you didn’t at the start? Did your first idea change?"'
  - title: One small action
    time: 10 minutes to choose, then a few days to do
    materials: Whatever the action needs. Often nothing.
    covers: [K1.4, S1.4, U1.1]
    steps:
      - Start from something your child has found out. Ask if it makes them want to do anything.
      - 'Offer four ways in: share information, collect donations, volunteer or change a habit. Your child chooses, not you.'
      - Keep it small enough to finish this week, such as a poster for the fridge, a bag of outgrown clothes for a local charity or shorter showers.
      - 'Afterward, ask: "What surprised you? What would you do differently next time?"'
questions:
  - Where did you hear that? How could you check it?
  - Who else does this affect? What might they say?
  - Can two people disagree and both be telling the truth? When?
  - What would change your mind?
  - Does anything from the ancient world remind you of this?
  - Now that you know this, is there anything you’d want to do?
misconceptions:
  - thought: '"Seven posts say it, so it must be true."'
    why: Hearing something many times makes it feel solid, and that happens to adults too.
    tryThis: Draw the posts on paper with arrows showing who copied whom, using a joke or rumour they have heard. Ask where it really began.
  - thought: '"It has an exact number, so it settles the question."'
    why: Numbers look careful and official, and often they are.
    tryThis: 'Ask how many children are at their school at 2 pm on a Sunday. It’s a true number, but ask: "Does it tell you how busy the school is?"'
  - thought: '"If two sources disagree, you can’t trust either one."'
    why: Disagreement can feel like a sign that someone is lying.
    tryThis: Bring back the cereal box. Ask what each of you could see, and what each of you really looked at.
  - thought: '"If I understand them, I have to agree with them."'
    why: Listening kindly can feel like giving in, especially when they care about their own side.
    tryThis: 'Practise this sentence on something small: "I still think ___, but I get why you ___."'
lookFor:
  - They ask where something came from before they repeat it.
  - They name who else an issue touches, without being prompted.
  - They can say what someone else values, even while they disagree with that person.
  - They suggest something they could do, and it fits what they found out.
adapt:
  support:
    - Start with a tiny question close to home, and just two sources. Is the park busy after school? Ask someone, then go and look.
    - Use the Riverbend sources one at a time, and after each one ask only, "What do you know now?"
    - Give one real example of each kind of action from your own life, then let your child add one.
  access:
    - need: reading
      tip: Read each Riverbend source aloud in a different voice, so the post sounds different from the town report. Short sessions of one or two sources are enough.
    - need: writing
      tip: Your child can record interviews on a phone, or tell you their plan to write down. For a poster, drawings can carry the message.
    - need: attention
      tip: Three chairs and neighbourhood walks build in movement. For long investigations, do one source a sitting and keep a simple list of what you have so far.
    - need: worry
      tip: |-
        - Stay with small, local issues. It’s fine to leave out frightening world news.
        - A small action they can finish can feel better than hearing about a big problem.
    - need: language
      tip: Knowing another language is a real strength here. Your child could interview a relative or neighbour in that language, then report back in English.
    - need: hands
      tip: Your child taps through sources by telling you which one to open. For an action, they might lead the idea while someone else makes the poster.
  stretch:
    - Choose one trail from the lesson. Then find a decision at school or in town, and ask who might be left out of it.
    - Find two sources that disagree about something local. Explain why each could honestly say what it says.
    - Follow one rumour at school back to where it started, as far as you can.
together:
  - problem: d1
    how: Read the message in your most dramatic voice, and ask what they would do right now. Then uncover the sources one at a time, and ask each time, "What do you think now?"
  - problem: d2
    how: |-
      - Ask who is right, the town or the parent, before reading the small print.
      - After the small print, ask when they would count the cars, and why.
