id: trade-economy
subject: social-studies
why: This topic shows a child that their dinner, their town and the jobs around them are tied to people far away. They learn to follow one change as it ripples outward, and to ask who gains and who loses.
hook:
  title: A trip around the spice shelf
  time: 5 minutes
  covers: [K1.7]
  body: |-
    1. Open the spice cupboard. Eyes closed, your child gently sniffs pepper or cinnamon.
    2. They hunt for anything else on the shelf that could never grow near home.
    3. Ask: **"How did this get here?"**
    4. Then: **"Take away every truck, plane and store. Who would carry it? Why bother?"** Let the guesses stand.
activities:
  - title: Snack bazaar
    time: 15 minutes
    materials: Three or more snacks everyone can eat, and a handful of dry shell pasta or buttons
    covers: [K1.3, K1.4]
    steps:
      - Each player gets a pile of one snack. Stuffed animals can be extra players, with you speaking for them.
      - Whisper to each player which snack they want. Set it up in a ring, so that no two players can simply swap with each other.
      - Let them try to swap. Let the frustration build, and ask, "What could make this easier?"
      - Bring in the pasta shells. Everyone agrees they will buy anything. Play again.
      - 'Ask: "Why would anyone give you a cracker for a piece of dry pasta?" Then eat the snacks, not the shells.'
  - title: The town jar
    time: 15 minutes
    materials: A jar, a die, sticky notes and 20 buttons or coins for each player
    covers: [K1.4, U1.2]
    steps:
      - 'The empty jar is the town’s money. Roll 6 times: a 1 is a fire, a 2 a broken road. Each costs 5 buttons.'
      - 'Game one has no rule: pay whatever, whenever. Trouble the jar can’t pay stays, on a sticky note.'
      - In the second game, everyone pays 1 button into the jar on every roll.
      - 'Compare the two towns. Ask: "Where would you rather live? Was the rule fair? Should everyone pay the same?"'
  - title: Pass the silk
    time: 10 minutes
    materials: A scarf or piece of cloth, and 3 or more people. A phone call can add a person.
    covers: [K1.7, K1.8]
    steps:
      - Name a few rooms after stops on the lesson’s map, such as Chang’an and Samarkand. Make up a short tale of how the cloth was made, with three silly details.
      - The first trader gets the scarf and hears the tale once, then carries both to the next room and hands them over.
      - Each trader passes along the scarf and retells the tale from memory.
      - At the last stop, the final trader holds up the scarf and tells the tale. Compare it with the first version.
      - 'Ask: "What arrived safely? What changed along the way? What could a trader carry without any bag at all?"'
questions:
  - If you stopped making everything for yourself, what would you do instead? Who would you need?
  - Is anything worth the same everywhere? Why or why not?
  - In your town, what is paid for by everyone together?
  - Who gains when a new road comes to town? Who loses?
  - What can travel a long way without anyone carrying a bag?
misconceptions:
  - thought: '"In a trade, one side wins and the other side loses."'
    why: In the games children play, a winner usually means a loser.
    tryThis: After each swap in the snack bazaar, ask both players, "Are you sorry you did that?" Let them notice when the answer is no twice.
  - thought: '"Gold is always worth more than salt."'
    why: Gold is treasure in every story they know.
    tryThis: 'Ask: "You’ve been walking through a desert for days. Would you trade your water bottle for a gold ring?" Then ask what changed.'
  - thought: '"20 farmers and 60 other workers means each farmer feeds 3 people."'
    why: The farmers are the ones doing the feeding, so it is easy to forget they eat too.
    tryThis: Set out 8 buttons as people, with 2 of them as farmers. Hand a cracker to each button, and ask who grew each one.
  - thought: '"Roman coins in India means Rome ruled there."'
    why: Coins carry a ruler’s power, and they look official.
    tryThis: Find any foreign coin or a picture of one. Ask, "Could this be in your home without that country ruling you?"
lookFor:
  - They follow a change through several steps, saying "then that means".
  - They ask what each side wants before they say a deal is good or bad.
  - They point out a market, a bank or a tax in daily life and link it to the lesson.
  - They separate things that can be carried from ideas that travel with people.
adapt:
  support:
    - Start with surplus. Count something real, then take away what the family needs. What is left over?
    - Do one direct swap with real objects before you try a longer chain.
    - Tell the village-to-city story with toys. Move a few farmer toys into town jobs, and see who is left to farm.
  access:
    - need: reading
      tip: Read the trader diaries and tax plans aloud in different voices. Use real objects for the numbers, so the story isn’t locked inside the words.
    - need: writing
      tip: Your child can explain their tax plan to you as if you were the queen, and you write it down as their official scribe.
    - need: attention
      tip: 'Give the map a job: "Find a way from Chang’an to Sardis." One mission at a time holds attention better than free exploring.'
    - need: worry
      tip: The queen’s tax plans have no single right answer. Tell your child up front that people disagree about this, and that you want to hear their reasons.
    - need: language
      tip: Words such as surplus, currency and tax are easier with objects. Hold up the extra food, the coin and the jar as you say them.
    - need: hands
      tip: Your child can call out the slider moves on the village and nilometer while you tap. In the games, you move the buttons as they direct.
  stretch:
    - Choose one thing in your home and follow it back as far as you can. Who touched it, and where did it come from?
    - Visit or picture a market today. What would feel familiar to a merchant from a Greek agora, and what wouldn’t?
    - Predict the ripples if a highway moved away from your town. Who would be affected first, and who next?
together:
  - problem: d2
    how: |-
      - Read the two diary pages in two voices.
      - Before the choices, ask each trader, "What did you have plenty of? Are you sorry?"
  - problem: d3
    how: Use real beans or buttons, and let your child count out each harvest and pay each tax. When they reach the open question, you play the queen and push back.
  - problem: d4
    how: |-
      - Write "sea route" in the middle of a page.
      - Your child draws an arrow to each person it touches, then onward. Ask, "And then what?"
