id: latitude-longitude
subject: social-studies
why: This topic gives a child an exact way to say where a place is, and the habit of asking why people live there. They start to read a map as a record of choices about water, soil and travel.
hook:
  title: Where is the sticker?
  time: 5 minutes
  covers: [K1.4]
  body: |-
    1. Put a sticker on a ball or orange, and turn it away from you.
    2. Close your eyes: **"Tell me where the dot is, so I can put my finger on it. No pointing."**
    3. When your child says "near the top", turn the ball over. Which part is the top now? Follow their directions badly, with good humour.
    4. Ask: **"A ball has no corners and no edges. So how could anyone give a place on Earth an exact address?"**
activities:
  - title: Floor globe hide-and-seek
    time: 15 minutes
    materials: Two long strings or pieces of painter’s tape, and a coin
    covers: [K1.4]
    steps:
      - 'Cross two floor strings: the equator and the prime meridian. Choose a north wall. One big step is 10°.'
      - While you look away, your child hides the coin on the floor and writes down its address, such as 20°S, 30°E.
      - You walk there from the crossing, using only the address. Then swap.
      - Try one with the letters left off on purpose. Ask how many spots the seeker has to check.
      - Try one walk that crosses a string. Ask what happens to the number as you get to the line, and after you pass it.
  - title: The aqueduct challenge
    time: 20 minutes
    materials: Paper, foil, tape, books, two cups and water. Work at a sink or outside.
    covers: [K1.8, K1.4]
    steps:
      - Put a cup of water, the spring, on a stack of books. Put an empty cup, the city, on the counter about an arm’s length away.
      - Your child builds a channel from paper, foil and tape. Nobody may hold it up once the water starts.
      - Pour slowly. See how much reaches the city, then let them repair and try again.
      - Now put the city on a taller stack than the spring. Ask them to predict what will happen, then test it.
  - title: Choose your valley
    time: 15 minutes
    materials: Paper, a pencil and a paper clip for each player
    covers: [K1.2, K1.6, K1.7, S1.2, S1.3]
    steps:
      - Together, draw a made-up land with a river valley, a bay, rocky mountains and a desert.
      - Each player sets down a paper clip as their village and names two features that make it a good spot.
      - 'Call out a change: "A volcano erupts!" "The rains stop!" "The river moves!"'
      - For each change, players decide whether to move, adapt or build something. Let them argue with you.
questions:
  - If I say "30°" and stop there, what haven’t I told you?
  - When you climb a mountain, what changes about your location? What stays the same?
  - Would you settle by the river or by the bay? What would you miss?
  - Why might people stay in a place that floods every year?
  - What would make you leave your home, and what would make you stay and change the land?
misconceptions:
  - thought: '"From 10°N, flying 30° south puts you at 40°S."'
    why: Going farther usually means a bigger number, so adding feels right.
    tryThis: Walk it on the floor strings. Count down to zero as you reach the equator, then count back up on the other side.
  - thought: '"Athens and Anyang are close, because 38°N and 36°N are close."'
    why: They looked at one column, and one number really is close.
    tryThis: Stand at opposite ends of the equator string. Your latitude matches, but ask if you are close enough to touch.
  - thought: '"If I keep going north, I can reach 91°N."'
    why: Numbers go on forever, and "north" sounds like a direction you can always walk.
    tryThis: Put a finger on the very top of a ball and slide it any way you like. Ask whether it can get any higher.
  - thought: '"No river and no coast means nobody would build a city there."'
    why: The lesson shows so many rivers and coasts that "many" can start to sound like "all".
    tryThis: Bring up Petra and ask how people could live in a dry place, and what might bring travellers there anyway.
lookFor:
  - They always say N or S, and E or W, and they notice when someone leaves them out.
  - They slow down near the equator or prime meridian, and they think about which side they are on.
  - They give a reason for a settlement by naming what the land offers.
  - They expect people to adapt, move or change the land when the environment changes.
adapt:
  support:
    - Start with sides only. Above or below the equator? Left or right of the prime meridian? Add numbers later.
    - On the floor, use one step for each number, with small numbers such as 1, 2 and 3.
    - For settlement, begin with one question, "Where would you get your water?"
  access:
    - need: reading
      tip: Cover the coordinates table with a sheet of paper and slide it down one row at a time. Read the small symbols aloud, such as "thirty degrees north".
    - need: writing
      tip: Your child can say the coordinates aloud, or place a sticker on a printed grid, in place of writing them.
    - need: attention
      tip: Try the Coordinate Quest in short bursts, and move between rounds. Stepping an address out on the floor can help the two numbers stick.
    - need: worry
      tip: Let your child give you addresses and catch your mistakes. Being the one who checks can make the letters feel less like a trap.
    - need: language
      tip: Point with your whole arm as you say north, south, east and west. Home-language words for directions are welcome alongside the English ones.
    - need: hands
      tip: Your child says "keep spinning" and "stop" while you turn the globe. On the floor, a toy or a marker on paper can make the trip in place of walking.
  stretch:
    - Find your town’s latitude, longitude and elevation on a map. Which city in the lesson’s table has the closest latitude?
    - Plan a route for Gertie the goose with four flights that ends exactly where it began, crossing both zero lines.
    - Invent a dry place with no river. What could people build there, and what might bring them there at all?
together:
  - problem: d3
    how: |-
      - Lean a big book against a stack as a hillside. Your child places fields and houses, and explains.
      - Ask what the water would do, and let them change their mind.
  - problem: d2
    how: |-
      - Use a ball or an orange as Earth. Your child puts a finger on the North Pole.
      - Ask them to take one step "more north" with the finger, and say where it goes.
