subject: social-studies
promise: |-
  We hope your child comes to think like a historian and a citizen.

  - Dates are one search away.
  - Asking who wrote this, why, and what they left out is a skill for life.
shifts:
  - instead: Memorizing names and dates.
    tryThis: 'Big questions about real people: why would an Egyptian farmer care how high the river rose? Who gained, who lost?'
  - instead: Presenting history as one settled story.
    tryThis: Showing that people disagree, then and now. Ask what each person could see from where they stood.
  - instead: Judging the past by today’s rules right away.
    tryThis: First asking why it made sense to people then. Then asking whether it was fair. Both questions are worth asking, and in that order.
  - instead: Saying what the right opinion is.
    tryThis: 'Asking "What’s your evidence? What would someone who disagrees say?" A child can hold a view and still understand another.'
routines:
  - name: Who made this, and why?
    time: 5 minutes
    how: Look at any source together, whether an ancient record, a news story or an ad. Ask who made it, who it was for, what they wanted you to think, and what they left out.
  - name: Step into their sandals
    time: 10 minutes
    how: |-
      1. Choose two people in the same moment, such as a merchant and a farmer.
      2. Your child says what each hopes for and fears.
      3. Ask how the same event looks to each.
  - name: Then and now
    time: 5 minutes
    how: 'Pick something from an ancient civilization, such as money, roads or laws. Ask "What’s the same today? What’s different? Why did that change?"'
  - name: Rank the causes
    time: 10 minutes
    how: |-
      1. Write the causes of an event on slips of paper.
      2. Your child ranks them, and defends the top one.
      3. There is no single right order. The reasons count.
assess:
  - They ask who wrote something before they believe it.
  - They can describe an event from two different points of view.
  - They back up an opinion with a reason or a piece of evidence.
  - They connect something from the past to something happening today.
sources:
  - label: 'Peter Seixas and Tom Morton: The Big Six Historical Thinking Concepts'
    url: https://school.nelson.com/the-big-six-historical-thinking-concepts/
  - label: 'Amy von Heyking: historical thinking in the elementary years'
    url: https://www.thenhier.ca/en/content/von-heyking-amy-%E2%80%9Chistorical-thinking-elementary-years%E2%80%9D-2008-0.html
