id: rise-fall-civilizations
subject: social-studies
why: Big changes rarely have one cause, and causes push on each other. A child who looks for those links asks better questions about the news, sports, or a playground fight.
hook:
  title: Sheep in the streets
  time: 5 minutes
  covers: [K1.2, S1.1]
  body: |-
    1. Stack a tower from books, cans or blocks: **"This is the richest, strongest city in the world. Huge walls. A giant army."**
    2. Add: "Five hundred years from now, sheep wander through its empty streets."
    3. Ask: **"What happened?"** Write down every guess, and give no verdicts.
    4. Keep the list for after the lesson.
activities:
  - title: Domino decline
    time: 15 minutes
    materials: Dominoes, or small boxes or books that stand up, and sticky notes
    covers: [K1.2, S1.1]
    steps:
      - Write one cause on each sticky note and put it on a domino. Use war, rebellion, expenses, a fight over who rules, weaker rains and changing beliefs.
      - Your child stands them in a line so each one could knock over the next, saying aloud how one leads to another.
      - Tip the first one. Your child tells the story of the fall as the line goes down.
      - 'Ask them to reorder the line. "Does another order make sense too?"'
      - 'Ask: "You may pull out one domino to save the empire. Which one, and why?"'
  - title: Spend your ten
    time: 10 minutes
    materials: 10 buttons, coins or dried beans
    covers: [K1.1, K1.2]
    steps:
      - 'Name a made-up kingdom. Mark four spots on the table: organized structures, strong leadership, military power and innovations.'
      - Your child places all 10 buttons across the four spots, any way they like, and says why.
      - 'Read out a surprise: "The rains fail." "Raiders cross the border." "The ruler’s two children both want the throne."'
      - After each one, ask which pile would help, and whether it is big enough.
      - Play again and let them move their buttons. Ask what they changed, and what it cost them.
  - title: The ancient house hunt
    time: 15 minutes
    materials: Sticky notes and a pen
    covers: [K1.3, S1.2, U1.1]
    steps:
      - 'Write nine labels: writing, farming, buildings, calendars, trade and money, stories and big ideas, math and science, how groups decide, rights and freedoms.'
      - Your child races around the home, sticking each label on something it explains. A coin, a calendar and a bag of flour go fast.
      - Ask which label was hardest to place. "How groups decide" and "rights and freedoms" can start a good argument.
      - 'Pick one label and ask: "If this vanished tomorrow, what would break first?"'
questions:
  - Can one thing be good for a kingdom and bad for it too? What would that look like?
  - If you could give a young kingdom just one gift, what would you choose? What would you worry about next?
  - When one thing goes wrong, what else does it make harder?
  - What has to be true before we can say a civilization has ended?
  - Would someone on the winning side and someone on the losing side tell this story the same way?
misconceptions:
  - thought: '"Rome fell because of one big thing, on one day."'
    why: Stories and movies love one dramatic moment, and a date is easy to remember.
    tryThis: Build the domino line, then ask which single domino was "the cause". Let them discover that the question is hard.
  - thought: '"A factor either helps a civilization rise or makes it fall. It can’t do both."'
    why: Sorting things into good and bad feels tidy, and the lesson’s own lists look that way at first.
    tryThis: Play out Bartholomew’s table with buttons, adding each land’s tax and taking away its cost. Ask when the pile stopped growing, and what the army was doing then.
  - thought: '"When Rome conquered Greece, that was an outside factor for both of them."'
    why: They were two lands, so an army crossing between them feels outside to everyone.
    tryThis: Stand at one end of the room as Rome, then walk to the other end as Greece. From each spot, ask where the army is coming from.
  - thought: '"500 BCE is later than 100 BCE, because 500 is bigger."'
    why: In every other part of life, bigger year numbers mean later.
    tryThis: Count down from 10 to 1 like a rocket, then up from 1. BCE is the countdown. Walk paper dates along a hallway.
lookFor:
  - Their explanations use "and that made" or "so then", linking causes instead of listing them.
  - They ask "inside or outside for whom?" when they sort a cause.
  - They spot a legacy in an ordinary object without being asked.
  - They name more than one cause, and they can defend which one mattered most.
adapt:
  support:
    - Start with one made-up kingdom and just two causes, one from inside and one from outside.
    - Try a small story first, such as a lemonade stand that grows and then spends too much. Bring in ancient names later.
    - Lay paper dates along the floor and walk the timeline, so BCE and CE are something they can stand on.
  access:
    - need: reading
      tip: The Empire of Vell and Empire Clinic stories are long. Read them aloud, one line at a time, and let your child sketch or act out each symptom.
    - need: writing
      tip: Let your child tell you their "next stop" on an innovation trail, or draw it, while you write down the words.
    - need: attention
      tip: Use the timeline slider as a hunt. Give one thing to find, such as two civilizations alive at the same time, then stop and talk.
    - need: worry
      tip: If talk of falling empires makes your child uneasy, stay with made-up kingdoms for a while. These changes took hundreds of years, and it is fine to say so.
    - need: language
      tip: Tie the big words to gestures. Hands on your chest for internal, hands pushing out for external, and a sinking hand for decline.
    - need: hands
      tip: Your child can call out the moves on the timeline and the city while you tap. Off screen, you stack and tip the dominoes as they direct.
  stretch:
    - Choose one civilization on the timeline, rank the causes of its decline and defend the top one.
    - Find an event that was a rise for one group and a decline for another. Tell it twice, once from each side.
    - Follow one innovation trail, and work out what problem each stop fixed about the one before it.
together:
  - problem: d1
    how: |-
      - Give your child buttons. Land by land, add the tax and take away the cost.
      - When the pile stops growing, say nothing, and wait for them to notice.
  - problem: d2
    how: |-
      - Your child is the doctor. Write the four symptoms, and draw an arrow whenever one makes another worse.
      - Keep asking, "What does this one push on?"
  - problem: d3
    how: Read the three friends in three silly voices. Before asking who is right, ask whether anyone is lying.
