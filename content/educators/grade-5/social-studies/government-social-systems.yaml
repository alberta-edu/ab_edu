id: government-social-systems
subject: social-studies
why: This topic helps a child ask why people follow a leader, and who gains from the way a society is arranged. They learn that power rests on reasons, and that different reasons can give way in different ways.
hook:
  title: Supreme Ruler of the Kitchen
  time: 5 minutes
  covers: [K1.2, K1.3]
  body: |-
    With a straight face, announce, **"From now on I am Supreme Ruler of this Kitchen. Everyone must call me Oh Mighty Spoon before speaking."** A crown is optional. Wait, and see what your child does.

    When they refuse or laugh, ask: **"Why aren’t you obeying? What would it take to make you?"** Follow up on what they say, and explain nothing. Then swap, so your child gets to be Supreme Ruler and try to make you obey.
activities:
  - title: The herald’s contest
    time: 15 minutes
    materials: Paper and a pen for three made-up rulers
    covers: [K1.2, S1.3]
    steps:
      - 'Invent three rulers. One says the gods chose them. One says, "My family has always ruled." One says, "I won with my army."'
      - Your child announces each boast in their grandest voice.
      - 'Read out some trouble, one at a time: "Floods drown the crops for three years." "The army loses a great battle." "The ruler has no children."'
      - 'After each one, ask: "Whose claim is in trouble now? What might a rebel shout?"'
      - 'Ask: "Which ruler would you rather be, and why?"'
  - title: Who holds up whom?
    time: 10 minutes
    materials: 10 paper cups, blocks or folded cards
    covers: [K1.7, S1.4, U1.1]
    steps:
      - 'Build a pyramid with rows of 4, 3, 2 and 1. Name the rows from the top, using Egypt: the pharaoh, nobles and priests, scribes and craftspeople, then farmers and enslaved people. Keep this to the cups. No one plays an enslaved person.'
      - Lift off the top cup and see what falls. Put it back, then slide out a bottom cup.
      - 'Ask: "Which row has the most people? Which has the most power? Who grows the food?"'
      - Your child picks a row and says one opportunity and one challenge for the people in it.
      - 'Ask first, "Why did this make sense to people then?" Then ask, "Was it fair?"'
  - title: Hold the crossing
    time: 15 minutes
    materials: A string, and two kinds of small things to be gold and salt, such as buttons and dried beans
    covers: [K1.9]
    steps:
      - Lay the string across a table, as a crossing between the gold lands and the salt lands. One player holds the crossing. The other is a trader, with gold on one side and salt on the other.
      - Each time the trader carries a load across, they pay the holder one piece. After 5 crossings, count the holder’s pile.
      - 'Ask: "What could the holder pay for with this? How does the trader feel about it?"'
      - The trader may now refuse, look for another path or try to claim the crossing. Argue it out, then swap roles.
      - Look at Ghana, Mali and Songhai on the lesson’s map. Ask where a fight like this could have started.
questions:
  - Why might someone follow a ruler they don’t like?
  - If a ruler’s power comes from fear, what happens when no one is watching?
  - Two people wake up on the same day, one at the top of the pyramid and one near the bottom. What is each one worried about?
  - Who gains when things stay the way they are? Who would want them to change?
  - What would you want to check before you put a label on a whole society?
misconceptions:
  - thought: '"Egypt had a woman pharaoh, so women ran Egypt."'
    why: One remarkable person stands out, and they are right that she was remarkable.
    tryThis: Read the lesson’s table together and ask who held most of the high offices. Then ask what one example can show, and what it can’t.
  - thought: '"A huge, rich city must be an empire."'
    why: The word empire sounds like "the biggest", and being big feels like being powerful.
    tryThis: 'Ask one question of each example: "Who does it rule?" Try it on a big city near you.'
  - thought: '"People at the top were just cleverer, or they worked harder."'
    why: Children often hear that hard work pays off, so they expect that it always did.
    tryThis: Read Egypt’s pyramid table and ask what each layer was based on. Then ask what parents can pass on to their children.
  - thought: '"Empires take turns, like a relay race."'
    why: Lists in books put one empire after another, so they seem to wait their turn.
    tryThis: Cut paper strips the lengths of the Ghana, Mali and Songhai bars on the timeline, and lay them out. Slide a finger across and ask which ones it touches at once.
lookFor:
  - They ask why people follow, and don’t assume everyone does it for the same reason.
  - They predict which claim or motive would give way under a certain kind of trouble.
  - They describe different challenges for different classes, including at the top.
  - They hesitate before labelling a whole society, and look for more than one example.
adapt:
  support:
    - Start with the three reasons for following a leader, using a made-up king. Add the longer words later.
    - Use one civilization for the pyramid, such as Egypt, and tap one layer at a time.
    - Sort the three ways to claim power with quick, silly examples before you try the real rulers.
  access:
    - need: reading
      tip: Read the villagers and the heralds aloud, each in a different voice. Go through the pyramid tables one row at a time, with a sheet of paper over the rest.
    - need: writing
      tip: For the diary lines and the museum sign, your child can speak while you write, or record their voice.
    - need: attention
      tip: Keep it moving with the cups and the crossing. One short round of a game, then one row of a table, then a break, can work better than a long sit.
    - need: worry
      tip: Force, fear and slavery are heavy subjects. Look through the lesson first and tell your child they can pause and ask anything. Made-up kingdoms give some distance when it’s needed.
    - need: language
      tip: Pair each word with a picture or object. A crown for monarchy, a pointed stack of cups for hierarchy. "Patri" comes from a word for father, and "matri" from a word for mother.
    - need: hands
      tip: Your child can name the bin in the card sort and direct your hands. In the cup pyramid, they tell you which cup to lift.
  stretch:
    - Write what a rebel would shout against each kind of claim, and what the ruler would answer.
    - Using the lesson’s table, compare what women could do in Athens, Rome, Egypt and Kush. Which label would you hesitate to use, and why?
    - Choose Kush and Axum, or Ife and Benin, from the lesson’s map. What did wealth and trade have to do with the change?
together:
  - problem: d1
    how: You voice Nan, Ferro and Pim. Before each part, ask your child to look back at what that villager said, and to predict what would make them stop bowing.
  - problem: d3
    how: Read the sign aloud like a visitor at a museum. Ask, "What would have to be true of a whole society for this to be right?" Then let them hunt in the table.
