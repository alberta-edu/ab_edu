id: historians-sources
subject: social-studies
why: A child learns to ask "How does anyone know that?", and that a changed mind is good work. A source can be wrong about one thing and honest evidence about another.
hook:
  title: The recycling bin dig
  time: 5 minutes
  covers: [K1.4]
  body: |-
    1. Lay five clean things from the recycling bin on the table, without a word.
    2. Say: **"It is two thousand years from now. You just dug these up. Nobody alive has met the people who used them."**
    3. Ask: **"Who lived here? What did they do this week? What can’t these things tell you?"**
    4. Welcome every theory. Don’t say which are right.
activities:
  - title: The case of the last cookie
    time: 10 minutes
    materials: Sticky notes and a pen
    covers: [K1.5]
    steps:
      - 'Suspects for the missing cookie: Uncle Bram, Tess and Biscuit the dog. Clue 1: crumbs on Bram’s chair. Write a verdict.'
      - 'Clue 2: Biscuit has crumbs on her nose. Your child writes a new verdict and sticks it beside the first.'
      - 'Clue 3: a note in Tess’s writing says, "Sorry! I ate it on Bram’s chair and gave Biscuit a bite." One more verdict.'
      - 'Look at the row of verdicts and ask: "Was your first one silly, or was it the best you could do with one clue?"'
      - 'Ask: "What would a fourth clue have to say to change your mind again?"'
  - title: Four detectives out and about
    time: 20 minutes
    materials: Nothing, just a trip to a park, school yard or main street
    covers: [K1.4, S1.3]
    steps:
      - Your child chooses a detective for the first stretch, and you take another.
      - 'The historian hunts for writing: signs, plaques and dates. The archaeologist hunts for objects and buildings people left, looking only and never digging.'
      - 'The anthropologist watches how people use the place and what they seem to value. The geographer studies the land and water, and asks why this spot.'
      - Swap detectives at each corner, and report one finding each time.
      - 'Back home, ask: "Which detective learned the most? What couldn’t any of them find out?"'
  - title: Two stories and a ticket stub
    time: 20 minutes
    materials: A photo, ticket or text message from a past event, and a phone to record with if you like
    covers: [S1.4, S1.5]
    steps:
      - Choose a small, happy event that people remember, such as a trip or a game. If family history feels tender, use a class or team event instead.
      - Find something made on the day, such as a photo, a ticket or a message.
      - Ask two people to tell the story separately while your child listens for differences.
      - Check the differences against the thing made on the day. Ask what it settles, and what it can’t.
      - 'Your child tells a short encyclopedia version of the event. Ask: "Was this made then, or later? What might it get wrong?"'
questions:
  - How do you know that? How could someone check?
  - Who made this, and when? Were they there?
  - What can this source not tell us?
  - What new find would change your mind?
  - When experts change their minds, should we trust them more or less? Why?
  - What will people two thousand years from now get wrong about us?
misconceptions:
  - thought: '"It’s really old, so it’s a primary source."'
    why: To a child, 1890 and ancient Rome both feel like the distant past.
    tryThis: 'Always ask together: "What are we studying?" and "Was this made then?" Try it on an old school book.'
  - thought: '"One mistake means the whole source is useless."'
    why: At school, a wrong answer is simply wrong, so a wrong source seems like trash.
    tryThis: Look at a young child’s family drawing, with people huge and tiny. Nobody is that size. What can it still tell you?
  - thought: '"If experts changed their minds, they must have been bad at their jobs."'
    why: Children often hear that being right is what matters, and changing your answer can feel like losing.
    tryThis: Play the cookie case and look at the row of verdicts. Each one was sensible for the clues at that moment.
  - thought: '"One kind of source is just better than the other."'
    why: It is easier to look for one source to trust than to ask what each one is good for.
    tryThis: 'Ask two questions about a game or match your child remembers: "How did it feel?" and "How did the whole season go?" Then ask who or what could answer each.'
lookFor:
  - They ask when something was made, or who made it, before they believe it.
  - They say "probably" or "we can’t tell yet" and seem comfortable with it.
  - They change an idea when new evidence appears, and they can say what changed it.
  - They match a question to the kind of social scientist who would study it.
adapt:
  support:
    - Say "made then" and "made later" until sorting feels easy, and add the words primary and secondary after that.
    - Sort sources about something they lived through, such as last summer, before you sort sources about Rome.
    - Start with two social scientists, the historian and the archaeologist, and add the others one at a time.
  access:
    - need: reading
      tip: Many sources here are short. Read each one aloud in its writer’s voice, so a soldier sounds different from an encyclopedia.
    - need: writing
      tip: Your child can say the new museum sign for Queen Tavi out loud, or record it, while you write it down.
    - need: attention
      tip: On the outing, change detectives often. In the lesson, tap one social scientist, say one thing they found, and take a break.
    - need: worry
      tip: This topic has honest answers like "probably" and "we can’t tell". Say out loud that experts use those answers too, so not knowing isn’t a failure here.
    - need: language
      tip: Show what "source" means by holding things up, such as a photo or a letter. "Evidence" and "interpretation" become easier as "what we found" and "what we think it means".
    - need: hands
      tip: Your child names the bin in the card sort and you tap it. Off screen, they can point to a verdict while you move the notes.
  stretch:
    - Choose one fact from the lesson. Which social scientist would you ask to check it, and what evidence would they need?
    - Find two sources about the same event in your town or school, and list where they agree and where they don’t.
    - 'Ask what a book from 1950 could tell you that a book from today can’t.'
together:
  - problem: d1
    how: |-
      Read it in three stops:

      1. After the carving: what would they conclude?
      2. After the book: what had its writer seen?
      3. After the sandals: what has to change, and what doesn’t?
  - problem: d2
    how: |-
      - First be Dr. Vee in your own kitchen. Point at things and ask, "Found, or guessed?"
      - Then read her report together with the same two words.
  - problem: d3
    how: |-
      - Tell your child Lucía’s thinking is good. They say it as a chain of steps, one finger per step.
      - Then they reread the note carefully, looking for a step that hasn’t been proven.
