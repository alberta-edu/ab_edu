id: figurative-language
subject: english-language-arts
why: To understand a comparison, a child has to hold two very different things in mind and work out what they share. That habit of asking "in what way?" also helps them weigh any comparison someone uses to explain or convince.
hook:
  title: Was that a lie?
  time: 5 minutes
  covers: [K3.1]
  body: |-
    With a perfectly straight face, say a few things that aren’t true about what is around you. "This couch is a cloud." "My feet are two blocks of ice." "This kitchen is a furnace."

    Then ask: **"Was I lying? How is that different from telling you I ate the last cookie, when I didn’t?"** Let your child argue it out. Don’t name what you were doing.
activities:
  - title: Draw exactly what I said
    time: 10 minutes
    materials: Paper and a pencil, and a timer if you like
    covers: [K3.1, K3.2, S3.6]
    steps:
      - One person says a comparison, such as "Dad’s snoring is a chainsaw" or "The bus was a sardine can."
      - The other has 30 seconds to draw exactly what the words say. No helping it make sense.
      - Show the drawing and enjoy it. Then say what the sentence really means.
      - 'Ask: "What do the two things share? What about them did the sentence leave behind?"'
  - title: The mystery sock
    time: 10 minutes
    materials: A clean sock and a few safe objects, such as a sponge, a spoon, a pine cone or a rubber band
    covers: [S3.5, S3.7]
    steps:
      - Your child reaches into the sock without looking, and feels one object you put there.
      - They can only describe it with comparisons, such as "It’s as bumpy as..." or "It feels like..." You guess what it is.
      - For the next object, they can’t use like or as. "It’s a tiny..." Which was harder?
      - Swap. Ask which comparison gave the object away, and why.
  - title: How far does it stretch?
    time: 10 minutes
    materials: Nothing. It works well on a walk.
    covers: [S3.5]
    steps:
      - 'Start with an analogy, such as "A school is like a beehive."'
      - Take turns adding one way it fits. Who are the workers? What is the honey?
      - Keep going until it gets silly. Who stings? Where does it stop working?
      - 'Ask: "It broke. Is it still useful? What could it help you explain?"'
questions:
  - What do these two things really share? What don’t they share?
  - Why couldn’t this be literally true? Can you picture it?
  - What would change for a reader if you swapped this word for another one?
  - Why do you think the writer didn’t just say it straight?
  - What might these words mean somewhere else? What around them tells you which meaning this is?
  - Where does this comparison stop working?
misconceptions:
  - thought: '"If it has the word like, it’s a simile."'
    why: They learned to look for a signal word, and spotting it worked at first.
    tryThis: Say "I like snow" and "The snow fell like feathers." Ask them to finish, "Snow is being compared to..." for each.
  - thought: '"If the hallway is a river, the hallway must be wet."'
    why: Reading exactly what the words say is sensible, and it is usually what they are asked to do.
    tryThis: Draw the literal picture, then circle only the parts the writer wanted you to think about.
  - thought: '"You can only compare things that are alike."'
    why: At school, comparing often means looking at two similar things.
    tryThis: Ask how a storm and a giant are alike. Then try "My dog is as big as a dog." Which one tells you more, and why?
  - thought: '"If an analogy breaks somewhere, it’s wrong."'
    why: Children love catching adults out, and a real exception feels like proof.
    tryThis: Play How far does it stretch? Then ask what the speaker was trying to explain, and whether the analogy did that one job.
lookFor:
  - They notice a comparison in everyday talk and grin, or ask, "Do you mean really?"
  - They say what two things share, and don’t just name the kind of comparison.
  - They reject their own comparison because it gives the wrong feeling, and try another.
  - They use a comparison, without being asked, to explain something to someone.
adapt:
  support:
    - Start with similes, since like and as are easy to see. Then remove the word and see what is left.
    - Use what your child loves, such as a game, a sport or an animal, for the things being compared.
    - 'Offer a frame: "The gym was as ___ as ___."'
    - If your child takes words at their exact meaning, treat that as accurate reading. Say, "Yes, that’s what the words say. Why might someone say it anyway?" Then tell them plainly what a phrase means, with a picture.
  access:
    - need: reading
      tip: Read "Storm over the Foothills" aloud, and pause so your child can picture each comparison. Short excerpts are enough.
    - need: writing
      tip: Comparisons work just as well out loud. Let your child say the snow rescue or the truck sentences while you write them down.
    - need: attention
      tip: Hunt for comparisons in a song or a sports broadcast. Stop as soon as you find three.
    - need: worry
      tip: Make terrible comparisons on purpose, and award a prize for the worst one. When being bad at it is the game, there is nothing to get wrong.
    - need: language
      tip: Sayings often don’t translate word for word, so confusion here makes sense. Ask what sayings your home language has, and compare them. Explain one phrase at a time, with a picture.
    - need: hands
      tip: In the drawing game, your child can direct you, telling you exactly what to draw. You can place things in the sock and hold the object against their hand, too.
  stretch:
    - Keep one metaphor going through a whole paragraph, as the writer does with the storm and the giant. Where does it help most?
    - Explain something your child knows well from science or math to a younger child, using an analogy. Then say where the analogy stops working.
together:
  - problem: d1
    how: Be a panel of judges in a contest, with cards to hold up. Read each entry aloud in a game-show voice. Your child rules first and has to give a reason.
  - problem: d2
    how: Read both versions aloud. Walk your fingers across the table for one of them, and ask which version your fingers could act out.
  - problem: d4
    how: Before writing, ask how the reader should feel about the truck. Then make two lists of rattling, smoky things, ones you’d love and ones you wouldn’t get close to.
