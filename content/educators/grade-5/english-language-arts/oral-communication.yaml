id: oral-communication
subject: english-language-arts
why: A child learns that being heard is something you design, not a talent you either have or lack. They start to plan for who is listening and what the room is doing, and to notice when someone’s "sure" doesn’t sound like yes.
hook:
  title: The talking closet
  time: 5 minutes
  covers: [K3.3]
  body: |-
    Pick a silly sentence, such as "The moose ate my homework." Say it in the same voice in three places, with your child beside you: in the bathroom with the door closed, with your head in a closet full of coats, then from the far end of a hallway. Let your child try it, too.

    Ask: **"Same words, same voice. So why didn’t it sound the same?"** Take every guess. Don’t explain it.
activities:
  - title: Back to back
    time: 10 minutes
    materials: Nothing
    covers: [K2.1, K2.3, K2.4, S2.1]
    steps:
      - 'Sit back to back. Choose two plain words, such as "Nice shoes." Say them with a secret meaning: you love them, you’re teasing, you’re jealous or you’re surprised.'
      - Your child guesses from your voice alone, and says what gave it away. Then swap.
      - 'Turn to face each other. Say "I’m fine" in a cheerful voice, with your arms crossed and your eyes on the floor. Ask: "Which part of me do you believe?"'
      - Try it again with words, body and voice all matching. Ask what changed.
  - title: One more step back
    time: 10 minutes
    materials: A hallway, yard or park
    covers: [K2.5, K3.3, S2.2, S3.1]
    steps:
      - Your child stands a few steps away and says a silly sentence, such as "Seven snails sat in soup." You repeat exactly what you heard.
      - Each clean repeat earns one big step back. No shouting allowed.
      - 'When the words start to go, try one change at a time: stand tall, take a full breath, put energy into every word.'
      - 'Move somewhere new, such as outside or a stairwell. Ask: "What do you have to change here? Why?"'
  - title: The Saturday plan
    time: 15 minutes
    materials: A real small decision, such as Saturday lunch or which game to play
    covers: [K4.1, K4.4, K4.5, S4.1, S4.4]
    steps:
      - Each person says what they want and why. Before adding your own idea, you say back what the last person said.
      - Look for a plan with something in it for everyone. Expect each person to give up a little.
      - Check with thumbs. Up means yes, sideways means I can accept it, down means no. Watch faces as well as thumbs.
      - If someone says "sure" in a flat voice, ask what they would change. Then really try the plan you reach.
questions:
  - Who is listening, and what do they need from you?
  - If I couldn’t see you, what would I still know? If I couldn’t hear you?
  - Which word would you lean on here? What would that change?
  - What does this room do to your voice? What could you do about it?
  - What story does our family keep telling, even though everyone knows the ending?
  - Did everyone really agree, or did some people just stop talking? How could you tell?
misconceptions:
  - thought: '"If they can’t hear me, I need to shout."'
    why: '"Speak up!" is what they usually get told, and loud feels like the only control there is.'
    tryThis: In One more step back, compare a shout at the floor with a full breath and standing tall. Let the repeats be the judge.
  - thought: '"Everyone said yes, so we agree."'
    why: Words are what we are taught to listen to, and a yes is easy to write down.
    tryThis: 'Say "Sure" with a shrug, looking at the floor. Ask: "If you were my friend, what would you do next?"'
  - thought: '"What worked in the gym will work everywhere."'
    why: A rule that worked once feels safe, and rules are what they expect to learn.
    tryThis: Ask what each trick was for, then whether that reason is still true in this new space.
  - thought: '"If a story is on a website, anyone can perform it."'
    why: Almost everything they meet online seems free for the taking.
    tryThis: Ask how your family would feel if a stranger told a family story on stage and changed the ending. Then talk about whose story it is, and who would know how it may be shared. With a Blackfoot story, as the lesson says, that means Blackfoot Elders, and the answer may be yes or no.
lookFor:
  - They change how they talk for a new listener without being told, such as with a small child or a visitor.
  - They take a breath, stand up or move closer before speaking across a room.
  - 'They notice a mismatch: "You said fine, but you don’t look fine."'
  - In a disagreement, they repeat another person’s point before adding their own.
adapt:
  support:
    - Start with one control. Stress one word of "You ate my sandwich" and stop there.
    - Begin with one listener, a short distance and one sentence. Build from there.
    - 'Offer starters for disagreeing, such as "I heard you say..." and "I see it differently, because..."'
    - If speech itself is hard for your child, use the way they communicate. A device, signs or gestures still involve word choice, pacing, pauses and body.
  access:
    - need: reading
      tip: Read the problems aloud, and try each choice with your voice. Many of these answers are easier to hear than to read.
    - need: writing
      tip: Your child can record the snail speech and say or show the notes for body and voice. You can add the square brackets later.
    - need: attention
      tip: Keep it moving, with a voice game between lesson sections. Each one takes only a few minutes.
    - need: worry
      tip: Start where no one is looking. Back to back helps, as does speaking to a pet or making a private recording. Your child decides when to add an audience.
    - need: language
      tip: Ask how your home language shows surprise or a question, and compare it with English. Knowing two ways is a strength. Also ask how your child wants their name said, and say it that way.
  stretch:
    - Give the same short talk for two different listeners, and record both. What changed, and why?
    - Invent a trickster, rather than retelling a story from a real tradition, and tell it aloud to someone younger, with a different voice for each character.
    - Choose how to share one piece of news, such as a speech, a recording or a video. Defend the choice, thinking about who is listening.
together:
  - problem: d1
    how: Read the scene aloud, with you as Mo. Do the shrug and the flat "Sure", and watch your child’s face. Ask what they would do if they were Ivy, before looking at the choices.
  - problem: d3
    how: Have your child perform the speech while you listen with your eyes closed, then again with your eyes open. Tell them what you noticed each time, and let them decide what to change.
  - problem: b5
    how: Read it slowly, and ask only, "Whose story is this? Who would know?" Give it time. This one is about care more than cleverness.
