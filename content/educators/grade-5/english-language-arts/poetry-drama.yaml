id: poetry-drama
subject: english-language-arts
why: Poems and scripts ask a child to listen for what isn’t said outright, such as a feeling tucked into one word, or a shrug that changes a whole line. That ear helps them understand people, not only books.
hook:
  title: What colour was that?
  time: 5 minutes
  covers: [K5.1, U5.1, S5.1]
  body: |-
    Find the last stanza of "Coulee Morning" in the lesson, and keep the screen to yourself. Ask your child to close their eyes. Read it once, slowly.

    Ask: **"What colour was that? Where in your body did you feel it?"** Any answer is fine. Then ask, "Those were only words. How did they get in there?" Don’t say what the lines mean. Let them wonder as you open the lesson.
activities:
  - title: The two-line play
    time: 15 minutes
    materials: Paper, or nothing at all
    covers: [K6.2, K6.3, U6.1]
    steps:
      - 'Write a tiny script. A: "You’re home early." B: "I know."'
      - Your child is the director. They whisper you a secret, such as "You broke the window" or "You have a surprise", and tell you how to stand and how to say your line.
      - Perform it together. Then swap, and try to guess their secret from their acting.
      - Keep every word the same. Add one silent action at the end, such as dropping the keys or holding out a hand.
      - 'Ask: "What just happened to the story? I didn’t change a word."'
  - title: The feeling walk
    time: 15 minutes
    materials: A place nearby, even a porch or a top bunk
    covers: [K5.3, K7.1, U7.1, S5.5, S7.1]
    steps:
      - Your child chooses a place that means something to them. Go there, or close your eyes and imagine it.
      - Stay quiet for one minute. Then ask for one sound, one thing they can see and one thing they can feel on their skin.
      - 'Choose one and ask: "What is that like?"'
      - Your child says two to four lines about that one moment, and you write them down.
      - 'Ask: "What happened here that makes this place matter to you?"'
  - title: Poem through the house
    time: 10 minutes, on a few different days
    materials: A short poem, on paper if you can
    covers: [K5.4, S5.2, S5.4]
    steps:
      - Choose "Coulee Morning" or another short poem your child likes. Give each stanza its own spot, such as the door, the stairs and the window.
      - At each spot, ask what picture that stanza holds, and say its lines there.
      - Walk the route again, leaving the page behind for one more spot each time.
      - When it holds, perform it along the route for someone, or sing it to a made-up tune.
questions:
  - Which word in this line would you fight to keep? Why that one?
  - Where does the feeling change in this poem? What tipped you off?
  - What does this character want but never say?
  - How would this line change if the actor looked at the floor?
  - What might this place mean to you that it wouldn’t mean to a visitor?
misconceptions:
  - thought: '"It rhymes, so it’s a lyric poem." Or: "It doesn’t rhyme, so it isn’t one."'
    why: Rhyme is the easiest thing to notice about a poem, so it feels like the thing that decides.
    tryThis: Read a rhyming weather report next to a few lines about how snow made someone feel. Ask after each, "Do I know how the speaker feels?"
  - thought: '"A poem is a puzzle with one right answer."'
    why: Most reading questions they meet have one answer to find.
    tryThis: Ask what they felt first, and where in the poem. Later, if two readings come up, ask which one has more lines behind it.
  - thought: '"The words in a script decide what happens. The rest is decoration."'
    why: The words are what fills the page.
    tryThis: 'Say "Great job" with a shrug and a flat voice, looking at the floor. Ask: "Do you believe me? Why not? The words were nice."'
  - thought: '"A new stanza starts when something new happens."'
    why: A new action looks like a clear place to break, and stanzas look like paragraphs.
    tryThis: Give each stanza a short title. If two would get the same title, ask whether they are really the same idea.
lookFor:
  - They go quiet or pull a face at a line, and can point to the line that did it.
  - They change their voice or body when acting, and can say why.
  - When they get stuck reciting, they go back to the picture for that stanza, not to the very beginning.
  - They explain what a place means to them through something that happened there.
adapt:
  support:
    - Listen only, at first. Press Listen in the lesson, and ask just, "What did you notice?"
    - Learn one stanza by heart before trying the whole poem. Two lines is a fine start.
    - Act the script before reading it closely. Use a real cloth and a real windowsill.
    - Read ahead yourself. "Coulee Morning" is about missing a grandmother, and "Dust on the Sill" is about a family in hard times. If that sits close to home, choose your moment, or use another poem.
  access:
    - need: reading
      tip: Use the poem reader’s Listen button, and read the script as a play, with you as Tomas. Hearing it comes first, and poetry counts when it is heard.
    - need: writing
      tip: A poem can be spoken or recorded, and you can write it down. Let your child say where each line should end by pausing.
    - need: attention
      tip: Scripts are made to be moved through. Stand up, use props and do a single scene. Tie each stanza to a place, so memorizing has legs.
    - need: worry
      tip: Reciting can be to a pet, a stuffed toy or a private recording. Your child can keep the page close by, and hide words only when they choose.
    - need: language
      tip: Show pictures of a coulee, a meadowlark and a windowsill before reading. Invite a poem or song from your home language, too. Beauty and emotion come through in any language.
    - need: hands
      tip: Eyes, face and a small lean all count as body language. Your child can also direct you as the actor, giving every move in words.
  stretch:
    - Write a second stanza that shifts the feeling of the first. Say why the new idea needs its own stanza.
    - Write a six-line scene where nobody says what they really want. Show it through stage directions.
together:
  - problem: d1
    how: Read the last stanza aloud. You each take a side, Rae or Jo, and hunt for one line that helps. Then swap sides and hunt again.
  - problem: d2
    how: Be the actor and let your child direct you. Say each line exactly as they tell you to, even if it seems wrong, and let them see what it does.
  - problem: d3
    how: Stand in the place, or close your eyes and go there in your mind, before any writing. Ask what they can hear. Don’t offer a feeling word, or a comparison of your own.
