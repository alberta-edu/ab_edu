id: inference-evidence
subject: english-language-arts
why: A child learns to tell what the words say from what they worked out, and to back one with the other. "We can’t tell" can be the smartest answer.
hook:
  title: What’s under the towel?
  time: 5 minutes
  covers: [K3.1, S3.2]
  body: |-
    Tell this tiny story, slowly:

    > Ravi came in very quietly, with one boot on. He was holding a towel over something that was wriggling. He looked at his aunt and said, "You know how you always say we should be kind to animals?"

    1. Ask: "What’s going on? What happens next?" Enjoy the theories.
    2. Then: **"I never told you any of that. So where did it come from?"**
activities:
  - title: Silent movie
    time: 10 minutes
    materials: Nothing
    covers: [K3.2, S3.2]
    steps:
      - Act out a 20-second scene with no words, such as waiting for news, finding something awful in the fridge or trying not to laugh.
      - Your child says what is going on, and what you did that made them think so.
      - 'Ask: "What do you know from your own life that made that a clue?"'
      - 'Then ask: "What can’t you tell from what I did?" Swap, and let them act.'
  - title: Move your bet
    time: 15 minutes
    materials: Any story, comic or show, ten buttons or coins, and three slips of paper
    covers: [K3.2, S3.3]
    steps:
      - Stop at a good moment. Your child writes or says three things that could happen next, one on each slip.
      - They place all ten buttons across the slips, more on what seems likely.
      - Read or watch a little more. They can move any buttons, but must name the clue that moved them.
      - At the end, look at where the buttons went. Praise the moves that had a reason, more than the ones that were right from the start.
  - title: Three corners
    time: 10 minutes
    materials: A page from any story, a picture book or a comic, and three paper signs
    covers: [K3.1, S3.1, S3.2]
    steps:
      - 'Put a sign in each corner: **It says so**, **We can work it out** and **We can’t tell**.'
      - Read the page together. Then say something about it, such as "She has a brother" or "She’s scared of the dog."
      - Your child runs to a corner, then points to the words or the picture that sent them there.
      - Swap, and let your child make up statements that might fool you.
questions:
  - Where did that idea come from, the words or your own life? Or both?
  - Can you put your finger on the words that made you think so?
  - What does this sentence really prove? What doesn’t it prove?
  - Can we tell from this, or would we need to know more?
  - Did anything you just read change your mind? Which words did it?
  - Where did you stop following? What could you try?
misconceptions:
  - thought: '"It’s in the story, so it proves my idea."'
    why: They have been told to find evidence, and the sentence really is in the text.
    tryThis: 'Ask: "If I guess who will win a race and that runner wins, did I have a reason?" Then ask, "Does this prove my idea, or something else?"'
  - thought: '"An inference is just a guess, so anything I think counts."'
    why: It feels personal, and they have heard that readers can have their own ideas.
    tryThis: Ask them to point to the clue. If there isn’t one, say cheerfully, "So we can’t tell yet." Three corners practises this.
  - thought: '"I read it three times, so I understand it."'
    why: Being able to say the words feels the same as knowing what they mean.
    tryThis: Ask one "why" question about the part they know. If they get stuck, ask what else they could try, such as asking a question or looking for clues just before it.
  - thought: '"If I change my prediction, I got it wrong."'
    why: At school, being right the first time is often what gets noticed.
    tryThis: Play Move your bet, and celebrate each move that comes with a clue. A changed mind with a reason is good reading.
lookFor:
  - They point to a word or a line without being asked.
  - They say "we can’t tell" calmly, or "the story doesn’t actually say."
  - They change a prediction when something new turns up, and aren’t embarrassed.
  - 'They notice when they are lost: "Wait, I missed something. Can I go back?"'
adapt:
  support:
    - Start with pictures, comics and silent scenes, where there is less to read while learning to use clues.
    - Read one paragraph, then stop. Ask, "What do you know now that nobody told you?"
    - 'Offer the frame: "The text says... I know... So I think..."'
    - Read "The Arch" in two sittings. Pause after paragraph 7 and ask what might happen.
  access:
    - need: reading
      tip: |-
        - Read "The Arch" aloud, taking turns if your child likes. They say when to stop, and what they noticed.
        - Inference is thinking. Your voice can carry the words.
    - need: writing
      tip: Your child can say their reasons while you write. They can mark evidence with sticky notes and say why they chose it.
    - need: attention
      tip: Use Three corners between sections so that they can move. Stop at paragraph breaks, and ask for one prediction each time.
    - need: worry
      tip: Tell your child that "we can’t tell" counts as an answer, and that two readers can both have reasons. Ask, "What’s one clue you noticed?" before asking what it means.
    - need: language
      tip: |-
        Inference needs background knowledge. A child new to Alberta may not know minus twenty-six, or heavy mitts.

        - Show real mitts.
        - Check the outside temperature.
        - Act out rolling your eyes.
    - need: hands
      tip: For problems where your child taps a sentence, they can read it out or say which one, and you can tap it.
  stretch:
    - Hide a secret in a four-sentence story without stating it. Test it on someone. If they miss it, which clue would help?
    - Find a place in a favourite book where two readings seem fair. Weigh them with evidence, then say what each one has in its favour.
together:
  - problem: d1
    how: |-
      - Take each idea one at a time: "Put your finger on it."
      - If there is nothing to point to, wait. Don’t say whether the idea goes too far.
  - problem: d3
    how: Read Liam’s claim and his proof separately. Ask when each one happens in the story, and let your child see the gap for themselves.
