id: authors-craft
subject: english-language-arts
why: Choosing words on purpose teaches a child that language can make a reader feel something without ever naming it. Once they can do that themselves, they start to notice when a writer is doing it to them.
hook:
  title: The silent entrance
  time: 5 minutes
  covers: [S2.6]
  body: |-
    1. Leave the room and come back acting out something that just happened, without a word. Tiptoe, look behind you, ease the door shut and hold it.
    2. Stay in character for ten seconds, then sit down.
    3. Ask: **"What just happened to me? How do you know? I never said anything."** Take every guess.
    4. Then: **"How could a writer do that on paper, with no body to use?"** Leave it unanswered.
activities:
  - title: Same kitchen, two stories
    time: 15 minutes
    materials: One room in your home, with the lights on, then low
    covers: [K2.6, S2.4]
    steps:
      - Stand in the room and decide that it is the safest, warmest place in the world. Your child finds one thing to see, one to hear and one to touch that fit that feeling.
      - 'Dim the lights: something is not quite right in here. Hunt for three new details. Not spooky? Try "someone is in a hurry".'
      - Your child says a sentence from one version, with no feeling words allowed. You guess which version it is.
      - 'Ask: "Nothing in the room changed. So what did?"'
  - title: The sentence thief
    time: 15 minutes
    materials: Any book your child loves
    covers: [K2.5, S2.2]
    steps:
      - Your child hunts through the book for a sentence they wish they had written, and reads it to you with feeling.
      - 'Ask: "What is the writer doing here? What is the trick?" Help them say it in their own words.'
      - Close the book. Using the same trick and all new words, each of you writes a line about someone in your home or a pet.
      - Read them aloud. Which one would make a stranger want to keep reading?
  - title: Who said that?
    time: 10 minutes
    materials: Slips of paper and a bowl
    covers: [S2.7, K2.3]
    steps:
      - Write a few characters on slips, such as a tired hockey coach, a toddler, a very polite robot and the family pet.
      - Draw one in secret. Someone announces a problem, such as "The power just went out."
      - Say one line as your character, without saying who you are. Everyone guesses.
      - 'Ask: "Which word gave it away?" Then write the best line down, with no name on it.'
questions:
  - Where in this could you close your eyes and see something?
  - Which word here would you fight to keep? Why that one?
  - What would change if the author had used a different word there?
  - How does this place feel? Where in the words is that coming from?
  - Who does this character sound like? What did they say that makes you think so?
  - Who is reading this? Would they get it?
misconceptions:
  - thought: '"To show a feeling, I use a bigger feeling word."'
    why: Children are often told to replace *sad* with something stronger, so *miserable* feels like a step up.
    tryThis: Hold up a pretend camera. "What would it record?" A camera can’t film *miserable*, but it can film someone leaving a sandwich untouched.
  - thought: '"Words from a thesaurus can go anywhere, because they mean the same thing."'
    why: A thesaurus lists them side by side, as if they could be traded.
    tryThis: Cross the room three times, tiptoeing, marching and staggering. Then ask which way of walking fits the sentence.
  - thought: '"Using a mentor text is copying."'
    why: They have rightly been told not to copy, and this can sound like permission to do it.
    tryThis: Have them name the trick in a sentence first, then close the book before they write. Tricks can be borrowed, and the words stay with the author.
  - thought: '"You should never use the same word twice."'
    why: They have probably been told exactly that, and it is often good advice.
    tryThis: Read "First Dive" aloud with a different word for the second *groaned*. Ask whether anything changed, and let them decide.
lookFor:
  - They stop to hunt for the exact word instead of taking the first one.
  - They explain why a word works by saying what it makes them see or hear.
  - They describe how someone feels by what that person did. "He kept looking at the door."
  - They give feedback that points to one place. "I got lost here."
adapt:
  support:
    - Begin with a picture or a real moment, and describe it out loud before writing anything.
    - Improve one sentence by changing only the verb. Then stop, and enjoy the difference.
    - Offer three verbs to choose from instead of a blank. Choosing is still craft.
  access:
    - need: reading
      tip: Read "First Dive" aloud, and make the groan of the board. Hearing the word helps with the question of why the author chose it.
    - need: writing
      tip: Act out the scene and say it first, then write down the best line for your child. Craft lives in the word choice, and that doesn’t need a pencil.
    - need: worry
      tip: Hold a worst-sentence contest. Trying to write something terrible on purpose takes the pressure off, and it teaches what makes writing work.
    - need: language
      tip: Shades of meaning are hard in a new language, so act out or draw words such as *trudged* and *shuffled*. Let your child say a sensory word in their first language, then hunt for the closest English word together.
    - need: attention
      tip: Keep every task sentence-sized, and do one sentence at a time between moving around. Acting out a word first gives it somewhere to land.
  stretch:
    - Write a short scene where the setting stays the same and the mood flips because of one event.
    - Rewrite a scene for a Grade 1 reader. Which words had to change, and which ones were worth keeping?
    - Write a conversation with no names on it, where a reader can still tell who is speaking.
together:
  - problem: d1
    how: |-
      - Read both moments aloud, acting out what Lena does each time.
      - Read it again with *creaked* the second time. Ask what is different, and wait.
  - problem: d4
    how: |-
      - Your child describes the kitchen out loud for each version before writing. If stuck, change *walked* first.
      - Then try to guess their version without being told which it is.
