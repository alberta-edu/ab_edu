id: text-forms-genres
subject: english-language-arts
why: A child who knows what kind of text is in front of them can ask what it is trying to do, whether that is to make them laugh, teach them or change their mind. That question works on a cereal box or a video as well as it does on a novel.
hook:
  title: What does it want from you?
  time: 5 minutes
  covers: [K1.1, K1.2, S1.1]
  body: |-
    Grab five bits of writing within reach: a cereal box, a flyer, a birthday card, a manual, a phone with a video open. Put them on the table and ask your child to sort them into piles, any way they like.

    Then pick up the cereal box and ask: **"If this could talk, what would it want from you? What about this one?"** If your child says a box doesn’t count as reading, or that the video wants two things at once, don’t settle it. Say, "Hmm. Let’s find out."
activities:
  - title: Tall-tale relay
    time: 10 minutes
    materials: Nothing. It works well in the car.
    covers: [K3.2, S3.1]
    steps:
      - 'Pick something real that needs explaining: why the dryer eats socks, why your road is so bumpy, why the wind never stops.'
      - Invent a hero together. Give them a name to remember, and a body or an ability nobody could really have.
      - Take turns adding one sentence. Each turn must be bigger and sillier than the last.
      - 'Finish with "And that, folks will tell you, is how..." and explain the real thing.'
      - 'Ask: "What if our hero was only a bit strong? Would it still be a tall tale?"'
  - title: Feature race
    time: 10 minutes
    materials: A non-fiction book, magazine or appliance manual, sticky notes and a timer
    covers: [K2.1, U2.1, S2.1]
    steps:
      - 'Give your child 30 seconds to find something specific: what a word means, a number, how to switch the thing off.'
      - Ask what got them there so fast, and let them show you.
      - Cover the headings, boxes and bold words with sticky notes. Ask a new question and start the timer.
      - 'Ask: "What got harder? What were those bits doing for you?"'
      - Swap, so your child sets the question and you race.
  - title: Character on trial
    time: 15 minutes
    materials: A favourite book, show or game with a story
    covers: [K3.8, K3.9, K3.10, K3.11, S3.4]
    steps:
      - 'Choose a character your child knows well. The charge: this character is flat and never changes.'
      - Your child picks a side and you take the other. Allowed evidence is what the character says, thinks or does, and what others say and think about them.
      - Each side gets three pieces of evidence. No evidence, no point.
      - 'End with a verdict, round or flat. Ask: "What would this story lose if this character were the other kind?"'
questions:
  - Who made this, and what do they hope you will do or feel afterward?
  - Is this true, made up, or both? What makes you say so?
  - Could this text be doing two jobs at once? How can you tell?
  - If you moved this story somewhere completely different, what would it still be saying?
  - Why might an author show you the future, and then go back?
  - Would you read this differently if you found out who wrote it?
misconceptions:
  - thought: '"Robots mean science fiction. Someone tall means tall tale."'
    why: One obvious detail feels like a label, and the name "tall tale" practically invites it.
    tryThis: 'Find a real book or video about robots, and ask first: "Is this made up?" Then compare an ordinary tall kid with someone geese have to fly around.'
  - thought: '"A text has one purpose. It’s funny or it teaches."'
    why: They are often asked for "the" purpose, as if there were only one.
    tryThis: Watch a funny science video and pause twice. At each pause, ask what that bit is there to do.
  - thought: '"A flat character is a badly written one."'
    why: Flat sounds like an insult, and round sounds like praise.
    tryThis: Name a favourite sidekick who never changes. Ask what the story would lose if they did. Sometimes the one who stays the same shows how far another character has come.
  - thought: '"If the writer gains from it, the reasons must be lies."'
    why: Children hear both "trust the newspaper" and "don’t believe what you read", so all or nothing seems like the only choice.
    tryThis: 'Make up a lemonade seller’s sign that says "Best price on the street." Ask: "The seller gains from this. Does that make it false? How could you check?"'
lookFor:
  - They flip through something new and say what kind of text it seems to be before reading it.
  - They back up a claim about a character with something that character did, or something another character said.
  - They name what a story is saying without mentioning its setting or plot.
  - They ask who made something, without being prompted, when a flyer or video tries to convince them.
adapt:
  support:
    - Start with purpose alone, using real things from your home. Ask only, "What does this want you to do?"
    - Talk about characters and theme using a show your child loves, before moving to the written stories.
    - Do one lesson section per sitting. There are eight, and they don’t all need to happen in a day.
  access:
    - need: reading
      tip: Listen first, then read. Take turns paragraph by paragraph in the stories. For stamina, let your child choose what they read, including comics and manuals, and add only a little time when it’s going well.
    - need: writing
      tip: Your child can tell their tall tale or their new scene for Mr. Grubb out loud while you type it. The ideas are what count here.
    - need: attention
      tip: Use the Feature race as a break. Short, timed rounds with a clear goal give a restless child something to chase.
    - need: worry
      tip: Tell your child that some texts really do fit on two shelves. Defending a choice counts, so there is less to fear from picking "wrong".
    - need: language
      tip: Round, flat and tall mean something special here. Sketch a character as a circle full of details and another as a single line. Say each word as you point.
  stretch:
    - Add a flash-forward to a story your child has already written. Try it in two places and decide where it makes the reader feel the most.
    - Write a short opinion piece about a house rule, with a larger topic, two subtopics and one cause-and-effect sentence.
together:
  - problem: d1
    how: Make your child the robot’s repair person. At each part, ask, "What did Shelfie look at? What should it have looked at?" For the last part, take the opposite shelf and argue with them.
  - problem: d2
    how: Read Commander Bo’s two lines aloud in exactly the same voice, with Ines’s words around them. Ask what is different the second time, and wait.
  - problem: d3
    how: Hand your child a broom and let them be Mr. Grubb when nobody is watching. Write only after they have acted out something surprising.
