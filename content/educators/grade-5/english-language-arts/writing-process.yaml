id: writing-process
subject: english-language-arts
why: Working in stages shows a child that a hard job can be taken apart, and that a first try is only a start. Revising also teaches them to read their own words the way someone else would.
hook:
  title: The terrible interrupter
  time: 5 minutes
  covers: [K1.1]
  body: |-
    Ask your child to tell you about the best thing that happened this week. Every few words, cut in. "How do you spell *yesterday*?" "Is *fun* really the best word?" "Was that a comma or a period?" Keep a straight face.

    Then swap, and let them interrupt you while you try to tell a story. When you are both laughing or fed up, stop and ask: **"What happened to the story? What was going on in your head?"** Don't explain. Open the lesson.
activities:
  - title: The sticky-note surgery
    time: 15 minutes
    materials: Sticky notes or torn paper strips, and a pen
    covers: [K1.8, S1.7, K1.5]
    steps:
      - Together, make up a five- or six-sentence piece about something at home, such as the worst chore in the house. Write each sentence on its own note.
      - Sneak in one sentence that has nothing to do with it, and mix up the order.
      - Spread the notes on the floor. Your child finds the sentence to cut, then moves the others until the piece makes sense.
      - 'Ask: "Which order is the funniest? What would make a better last sentence?" Add one new note.'
  - title: The kitchen-table campaign
    time: 20 minutes
    materials: Paper, and something your child really wants that you might agree to
    covers: [S1.6, S1.1, K1.3]
    steps:
      - Your child picks a real request, such as choosing Friday’s supper. Choose only something you could say yes to.
      - They give you their reasons out loud. Answer honestly as the reader. "That’s why you want it. What’s in it for me? What am I worried about?"
      - They keep the two reasons that moved you and write a short letter, with their position first and a closing line.
      - Post the letter on the fridge and give a real answer in writing.
  - title: Walk your sentences
    time: 10 minutes
    materials: A favourite book, and a piece your child wrote. Tapping on a table works as well as walking.
    covers: [K1.6, K1.7, S1.7]
    steps:
      - Read a paragraph aloud. Take one step for each word and stop dead at every period.
      - Do the same with a piece your child wrote. Which one is a steady march? Which one has long strides and sudden stops?
      - Your child changes one or two sentences to change the walk, then walks it again.
      - 'Ask: "Where did the stop surprise you? What did it do to that sentence?"'
questions:
  - Which job are you doing right now, getting ideas down, making it clearer or fixing it?
  - If you were reading this, where would you stop and ask a question?
  - Which sentence could disappear without anyone missing it?
  - Why did you save that detail for last?
  - Who is reading this? What would they need to hear before they would say yes?
  - Would printing, cursive or a keyboard suit this reader best? Why?
misconceptions:
  - thought: '"Revising means fixing my spelling."'
    why: Both happen after the first draft, and the marks children see on their work are often about spelling.
    tryThis: Put the spelling aside for one sitting, with a rule that you may not mention it. Ask for one sentence to cut and one to add.
  - thought: '"Good writers get it right the first time."'
    why: Children only ever see finished books. Nobody shows them the messy pages.
    tryThis: Write something short in front of them, such as a note to a neighbour. Think aloud, cross out and change your mind.
  - thought: '"My reason is that I really like it."'
    why: A reason feels strong from the inside, because it is the real reason they want it.
    tryThis: Play the reader and ask, "Why would I care?" Then ask them to name what this reader is hoping for or worried about.
  - thought: '"Longer is better."'
    why: They have often been asked to write more, so more feels like the goal.
    tryThis: Walk a long sentence followed by a very short one, then four medium ones. Ask which one stopped them.
lookFor:
  - They leave a mistake for now and say they will get to it later.
  - They cut a sentence they liked because it wasn’t helping.
  - They ask who will read it before they start.
  - They read their work aloud and change something because of how it sounded.
adapt:
  support:
    - Give each stage its own day, so that a planning day has no drafting in it at all.
    - Start with three sticky notes only, one for the topic sentence, one for a detail and one for the closing sentence.
    - Choose a real reader and a tiny job, such as a thank-you note to a grandparent.
  access:
    - need: writing
      tip: Let your child say the draft while you write it down, or record it and type it up later. Revising dictated words is still real revising.
    - need: reading
      tip: Read their draft back to them in a plain voice. Children often hear what needs changing before they can see it.
    - need: attention
      tip: Set a timer for a five-minute draft, then move around. Moving sentences on the floor gives revising a physical job.
    - need: worry
      tip: Make messy drafts the rule. Cross out with a flourish, and don’t look at spelling until the editing day.
    - need: hands
      tip: A keyboard makes changes easy. Off screen, your child can tell you which note to move, and you move it.
    - need: language
      tip: Let your child plan in their strongest language, then bring the ideas into English together. Give transitions a gesture, such as a turn of the hand for *however*.
  stretch:
    - Grow a good paragraph into several, with an introduction, two paragraphs of evidence and a conclusion.
    - Publish a piece for a real reader, choosing a graphic, caption or chart that helps that reader.
    - Send the same message as a poster and as a letter. Which tool suits each one, and how would a reader respond differently?
together:
  - problem: d1
    how: Write Gabi’s six sentences on sticky notes so that your child can physically pull and move them. Read the result aloud after each change, and let them judge it.
  - problem: d2
    how: You read Draft A and your child reads Draft B, then swap. Walk or tap each one. Ask what happens just before *I was slow*, and leave the reason to them.
  - problem: d3
    how: Argue about Monday out loud first. Your child lists every complaint, then picks the two a reader would believe. You only ask, "Would that convince someone who likes Mondays?"
