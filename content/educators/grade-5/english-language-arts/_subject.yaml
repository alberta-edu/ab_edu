subject: english-language-arts
promise: |-
  We hope your child comes to love what words can do, and to notice how writers do it.

  - A machine can produce a tidy paragraph.
  - Reading closely, hearing what is unsaid and having something of your own to say is still up to them.
shifts:
  - instead: Asking questions that test whether they read it.
    tryThis: 'Asking questions that make them go back and look: "Why that word? What makes you say so? Where does it tell you that?"'
  - instead: Teaching a grammar rule, then doing exercises.
    tryThis: Playing with a real sentence. Move a word, change a tense or cut a comma, then ask what changed.
  - instead: Correcting every error in their writing.
    tryThis: Responding to what they said first. Then choose one thing to work on, the one that would help the reader most.
  - instead: Choosing all their reading for them.
    tryThis: Letting them choose often, including comics, manuals and magazines. Stamina grows from reading that a child actually wants to do.
  - instead: Making every response a written one.
    tryThis: Letting them talk it through, act it out or draw it first. Writing comes more easily once they know what they think.
routines:
  - name: What makes you say that?
    time: 3 minutes
    how: Whenever your child says something about a book, ask this one question, with real curiosity. It turns an opinion into a reading backed by evidence.
  - name: Word swap
    time: 5 minutes
    how: |-
      1. Swap a strong word in a passage for a plainer one, like walked for crept.
      2. Read both aloud.
      3. Ask what got lost.
  - name: Read it like an actor
    time: 5 minutes
    how: Read one line three ways, as if angry, as if scared and as if joking. Ask which fits the story, and what clues in the text say so.
  - name: Two-sentence story
    time: 5 minutes
    how: Take turns writing or saying a two-sentence story with a rule, such as no adjectives, or the reader has to guess the feeling. Short pieces make it easy to try things, and to laugh.
assess:
  - They point to a word or a line when they explain an idea.
  - They read aloud with expression that matches the meaning.
  - They make a change to their own writing because of how a reader would take it.
  - They talk about why an author made a choice, and not only about what happened.
sources:
  - label: 'Achieve the Core: guide to creating text-dependent questions'
    url: https://achievethecore.org/file/353
  - label: 'Alberta Education: Making a Difference, on differentiated instruction'
    url: https://open.alberta.ca/publications/9780778586012
