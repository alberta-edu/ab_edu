id: research-skills
subject: english-language-arts
why: Research teaches a child to ask "How would anyone know that?" and to keep track of who said what. It also teaches that other people’s words and stories belong to them.
hook:
  title: Breaking news
  time: 5 minutes
  covers: [K3.10]
  body: |-
    1. Ask "Do you like peas?" and write down the answer.
    2. Cut it so it says something else. "I don’t really like peas unless they’re frozen" becomes, in a news voice: **"Breaking news! My child says, 'I... really like peas!'"**
    3. When they protest, look puzzled: **"But those were your words. Did I do anything wrong? What, exactly?"**
    4. Let the argument run, and don’t settle it.
activities:
  - title: The kitchen-table detective
    time: 30 minutes, over a day or two
    materials: Sticky notes, a pen and a real question about your home or street
    covers: [K3.1, K3.2, S3.2, S3.6, U3.1, K3.9]
    steps:
      - Start big, with "our street" or "our family." Narrow it until you have a question your child really wants answered, such as "Why does our street have that name?" or "How did this recipe get into our family?"
      - Choose two different sources, and make at least one a person. Your child asks permission before writing down what the person says.
      - Put each fact on its own note, with the source’s name on it. Sort the notes into groups on a table.
      - 'Ask: "What can you say now that nobody told you?"'
      - Share the answer as a labelled drawing or a map on the fridge.
  - title: Who would know?
    time: 10 minutes
    materials: Slips of paper with sources you have, such as a neighbour, a calendar, a map, an old photo album, a grandparent and the family dog
    covers: [S3.4, S3.5]
    steps:
      - Put the slips in a pile. One of you asks a question, such as "What was this town like 50 years ago?" or "How far away is the arena?"
      - The other picks the slip they would trust most and says how that source could know.
      - Keep one slip, and ask a new question. Is the same source still good? Sometimes the dog knows where the crumbs are.
      - 'Add a challenge to any choice: "What might this source get wrong?"'
  - title: Catch me changing it
    time: 10 minutes
    materials: Any non-fiction book or a trusted website
    covers: [K3.8, K3.10, S3.7]
    steps:
      - Each of you reads one short paragraph, then closes the book.
      - Tell each other what it said in ten words or fewer. The listener writes the note.
      - 'Check the book: did *sometimes* become *always*? Anything missing? A catch scores a point. Sometimes change something on purpose.'
      - Finish with a citation, adding the title and author beside each note.
questions:
  - How could anyone know that?
  - Who is in a position to know this? What might they not know?
  - Is this question too big, too small or about right? How can you tell?
  - Does this note say what the source says, or something a little different?
  - Whose words are these? Did they say you could share them?
  - Looking at all of your notes together, what can you say now that none of them says alone?
misconceptions:
  - thought: '"The narrower the question, the better."'
    why: They have heard "narrow it down" so often that smaller seems always right.
    tryThis: Picture the report. Ask, "What would go in the second paragraph?" If the question is over in one word, it has gone too far.
  - thought: '"A source is either good or bad."'
    why: Sorting is simpler, and they may have heard rules like "books are good and websites are bad."
    tryThis: Play "Who would know?" and keep the same source for two questions. Say "Trust it for what?" until your child starts saying it.
  - thought: '"Every word is real, so the quote is fair."'
    why: Copying someone’s exact words feels like the most honest thing you could do.
    tryThis: Go back to the "Breaking news" hook. Ask what a stranger would believe now, and whether that is what was meant.
  - thought: '"If I put their name on it, I don’t need to ask."'
    why: Citing is a good habit they have learned, so it feels as if it covers everything.
    tryThis: |-
      - Separate two questions: "Where did this come from?" and "Am I allowed to share it?"
      - Ask how they’d feel if their story went online with their name on it.
lookFor:
  - They ask, "Where did you hear that?" about something at home, without being prompted.
  - They change a question because it was too big or too small.
  - They ask before repeating someone’s story or sharing someone’s photo.
  - They say "the book says" for a source and "I think" for their own conclusion.
adapt:
  support:
    - Start with something your child already loves. Curiosity carries a lot of the work.
    - Use one question and two sources, with two note headings ready before they begin.
    - Begin with a person. Asking one question out loud is an easier start than reading.
  access:
    - need: reading
      tip: People, photos, maps and videos are all sources, so research doesn’t have to wait on reading. For a hard text, read it aloud and let your child decide what goes in the note.
    - need: writing
      tip: Notes can be sketches, single words or voice recordings. You can write for them, as long as they decide what the note says.
    - need: worry
      tip: Practise the questions on you first, and let your child write them out ahead of time. A question sent in a note or asked with you beside them still counts.
    - need: language
      tip: |-
        - Sources in a home language count, and a relative may be the best one.
        - Own words are harder in a new language, so offer a frame: "The book says ___. I think ___."
    - need: attention
      tip: Choose a question that sends them off to count, look or ask, and keep each session to one small job.
    - need: hands
      tip: Your child can give directions while you sort the notes, or record notes by voice instead of writing them.
  stretch:
    - Find two sources that disagree about one small fact. Ask who wrote each one and when, and what might explain the difference.
    - Write a few paragraphs with a clear main idea, using facts, details and explanations from your detective work.
    - If your school or community knows an Elder or Knowledge Keeper, ask ahead what protocol is right. Protocols vary, so don’t guess.
together:
  - problem: d1
    how: |-
      - Put the notes on sticky notes, and draw the days of the week on a table.
      - Your child walks one piece of food through the week. Ask where it is each day, and hold back what you think.
  - problem: d2
    how: |-
      Don’t sort the sources into good and bad. For each choice, ask only:

      - "How could they know?"
      - "Do they have a reason to get it wrong?"
