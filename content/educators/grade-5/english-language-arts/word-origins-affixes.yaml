id: word-origins-affixes
subject: english-language-arts
why: Taking words apart teaches a child that an unfamiliar word is something to work out, not a wall to stop at. Word histories show them that language is made by people, including people like them, and that it is still changing.
hook:
  title: Place your bets
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    Say five ordinary words: **shampoo, toboggan, sky, menu, algebra**. Ask your child to guess where each one came from. They can name a country, point in a direction or spin a globe. Silly guesses are welcome.

    Write the bets on the back of an envelope. Ask: **"Which of these do you think English made up by itself?"** Don’t correct anything. The map in the lesson will settle the bets.
activities:
  - title: Package hunt
    time: 10 minutes
    materials: Cereal boxes, flyers, shampoo bottles or anything with words on it
    covers: [K1.3, S1.4, S2.3]
    steps:
      - Your child hunts for long words with an affix from the lesson, such as words ending in -ment, -al or -ous, or starting with sub-, trans- or ex-.
      - Cover the affix with a finger. Is a word with a linked meaning left? Sometimes a silent e has dropped off, as in natural and nature.
      - Score one point for a real affix. Score two for catching a fake, where the letters only look like one, as in plant.
      - If you can’t agree, check a dictionary together. The dictionary gets the last word in this game.
  - title: Old words, new words duel
    time: 15 minutes
    materials: Someone at least thirty years older than your child, in person or on the phone
    covers: [K1.2, S1.2, S1.3]
    steps:
      - Your child quizzes the older person on new words, such as emoji, selfie or podcast. "What do you think it means?"
      - The older person quizzes back with words from their childhood, or with words whose meanings have shifted.
      - 'Ask the older person: "Which word did you use differently when you were ten?" If your family speaks another language, ask about words from there, too.'
      - Your child records the best word from each side. Who won? Why did those words change or appear?
  - title: Thesaurus roulette
    time: 10 minutes
    materials: A thesaurus, in print or online, and a dictionary
    covers: [K2.2, S2.3]
    steps:
      - Write a plain sentence together, such as "My dog is cool and has a big nose."
      - Your child looks up one word and swaps in the first word listed, no matter what it is. Read it aloud in a very grand voice.
      - Laugh at what broke. Which listed word would really fit? Check it in a dictionary.
      - 'Ask: "Why didn’t the first word work, if the book says it’s a match?"'
questions:
  - Is there a smaller word hiding inside this long one? Does it help?
  - Going only by its parts, what might this word mean? How could you check?
  - Where else have you seen this word part? Does it mean the same thing there?
  - Why might people borrow a word instead of making up their own?
  - Which words do you use that your grandparents didn’t have? Why did they appear?
  - What word did you hear this week that you want to keep?
misconceptions:
  - thought: '"It ends in -ant, so -ant must be a suffix."'
    why: Spotting patterns is what they are supposed to do, and the letters really are the same.
    tryThis: Compare pleasant and plant. Cover the last three letters of each. What is left? Is it linked to the whole word’s meaning?
  - thought: '"Words mean one thing, and the dictionary decides what that is."'
    why: A dictionary looks like a rulebook, so it seems as if someone is in charge.
    tryThis: 'Talk about cloud or mouse. Ask: "Who decided these words could mean something new?" Let your child work out that people did, just by using them.'
  - thought: '"Any word in the thesaurus can replace the first word."'
    why: The list looks like a list of matches, and fancier words look like better ones.
    tryThis: Play Thesaurus roulette, and read the results aloud. A broken sentence teaches this quickly.
  - thought: '"English came first, and other languages borrowed from it."'
    why: If English is the language of their school, it can feel like the starting point.
    tryThis: Look at kayak (Inuktitut) and muskeg (Cree) in the lesson. Ask who knew those things first, and who was meeting them for the first time.
lookFor:
  - They stop at a long word and try taking it apart before asking you.
  - They test a guess against the sentence around the word.
  - They ask where a word came from, and want to look it up.
  - They use a new word from their collection, even if it comes out a little wrong.
adapt:
  support:
    - Stay with one family of words, such as transport and export, and use two or three words at most.
    - Start with prefixes as hand signals. Move a hand across for trans-, under for sub-, out for ex- and around for circum-.
    - Write a long word on a card, and cover all but the base with your fingers. Reveal one part at a time.
  access:
    - need: reading
      tip: Long words can look like walls. Read them in chunks, with a finger covering the rest, and read the problems aloud so the energy goes to meaning.
    - need: writing
      tip: A word log can be voice notes, drawings or photos of labels. Spelling doesn’t have to be perfect for a word to be worth keeping.
    - need: attention
      tip: Hunt for one affix a day, for five minutes at most. A hunt with points gives your child a reason to move and look.
    - need: worry
      tip: Start with made-up words, such as the ones in the first problem. Nobody can be embarrassed about a word that doesn’t exist. When a sensible guess turns out wrong, say, "That’s what the parts told you. Let’s check."
    - need: language
      tip: Your child’s other languages are a resource. Ask if a word looks like one they already know, and check it together. Link each word part to a picture or a gesture.
  stretch:
    - Follow one base through a dictionary, such as mit in transmit, admit and permit. What does each prefix change?
    - Keep a list of words that seem brand new this year. Which ones will still be used in ten years? Defend each choice.
together:
  - problem: d1
    how: Physically do each word. Pull a sock out of a boot, and pull a chair toward you. Ask what is the same each time before your child answers.
  - problem: d2
    how: Be Edith, in your best old-fashioned voice. Ask confused questions about the note, and let your child rescue you. Refuse to understand any word from after 1900.
  - problem: d4
    how: Your child reads you their sentence, and you honestly guess the meaning from the clues alone. If you guess wrong, ask what clue would have helped you.
