id: spelling-punctuation
subject: english-language-arts
why: Spelling patterns show a child that English isn’t random, and that a wrong spelling usually has a reason behind it. That turns spelling into working things out, and it turns capitals and punctuation into choices a writer makes.
hook:
  title: The hiding letter
  time: 5 minutes
  covers: [K3.2, U3.1]
  body: |-
    Write two words large on a piece of paper: **sign** and **signal**. Say them both aloud, slowly. Say, in your best detective voice, "One of these words has a letter that is pretending not to be there."

    Once your child finds it, ask: **"Why would anyone keep a letter that nobody says? Is it a mistake, a leftover, or is it doing a job?"** Take sides and argue. Don't settle it. Open the lesson.
activities:
  - title: The letter graveyard
    time: 15 minutes
    materials: Paper squares or letter tiles, and a small dish
    covers: [K3.2, S3.1, S3.3]
    steps:
      - Make the words *hope*, *fame*, *nerve*, *fury*, *glory* and *courage* from letters. Make the suffixes *ing* and *ous* in a different colour if you can.
      - Before joining a base and a suffix, your child predicts what will happen. Any letter that gets kicked out goes in the dish, the letter graveyard.
      - Check each new word in a dictionary, then sort the words into piles by what happened at the join.
      - 'Ask: "What do the words in this pile have in common? Which one doesn’t fit, and what is its excuse?"'
  - title: The sign hunt
    time: 15 minutes
    materials: A walk down your street, or the mail and flyers at home
    covers: [K1.1, K1.2, S1.1, S1.3]
    steps:
      - Hunt for short forms, such as St., Ave., Dr. and km. Your child says what each one stands for and how they know.
      - Look for capitals. Which words got one? Which signs use all capitals?
      - 'At each one, ask: "Why did the person who made this choose that? What would happen if it were in small letters?"'
      - Make a sign for your own door, using capitals on purpose.
  - title: The side-comment game
    time: 10 minutes
    materials: Nothing, then a pen and paper for your favourite
    covers: [K1.3, S1.2, S1.3]
    steps:
      - One person says a plain sentence. "Grandpa made supper tonight."
      - The other cups both hands around their mouth, like a pair of parentheses, and whispers a side comment. "(He burned the toast.)" Keep it kind.
      - Trade roles and try a few. Which side comment changes how you feel about the sentence?
      - Write the best one down with real parentheses, and post it on the fridge.
questions:
  - What parts can you see in this word?
  - Who else is in this word’s family?
  - What do you think will happen when we add this suffix? Why?
  - What job could that letter be doing?
  - If we took out what’s in the parentheses, what would be lost?
  - How would your reader feel if this were all in capitals?
misconceptions:
  - thought: '"I should spell it the way it sounds."'
    why: That is how they learned to spell, and it worked well for years.
    tryThis: Hunt for a relative of the word. Say *soft*, then *soften*. Ask where a letter you can’t hear might have come from.
  - thought: '"The silent e always drops," or "The e stayed, so the rule is broken."'
    why: Rules often get taught as all-or-nothing, so one exception can feel like the whole thing has fallen apart.
    tryThis: Read *couragous* aloud together, and listen to the g. Ask what the e might be doing in *courageous*.
  - thought: '"You just have to memorize -ance and -ence."'
    why: You can’t hear the difference, so listening doesn’t help, and memorizing seems to be all that’s left.
    tryThis: Ask for a relative of the word. *Assistant* and *assistance* share an a, and *different* and *difference* share an e.
  - thought: '"Capitals are for words that matter."'
    why: Capitals do show importance, so children reasonably use them for anything they care about, like Hockey or Lunch.
    tryThis: Ask whether the word names one particular person, place or time. Then compare turkey and Turkey, and march and March.
lookFor:
  - They pause at a long word and break it into parts out loud.
  - When unsure about a spelling, they think of a related word.
  - They tell you why they used capitals or parentheses in a note.
  - They use an abbreviation and stop to wonder whether their reader will know it.
adapt:
  support:
    - Work on one pattern at a time. Stay with the silent e before moving on to y changing to i.
    - Write the base and the suffix in two colours, so that your child can see the join.
    - Start with words your child already uses and cares about, from their favourite game or hobby.
  access:
    - need: reading
      tip: Cover the suffix with a finger and read the base first, then uncover it. Long words become less frightening in parts.
    - need: writing
      tip: Spelling doesn’t need a pencil. Use tiles or a keyboard, or say the letters aloud. Keep handwriting out of it when spelling is the goal.
    - need: worry
      tip: Treat a wrong spelling as a clue, and name the part that’s right first. One habit behind several mistakes is good news, because it is only one thing to fix.
    - need: language
      tip: English keeps letters it doesn’t say, which can seem unfair, so say so. If your child reads another language, compare how spelling works there. Word families help because they don’t depend on hearing small sound differences.
    - need: attention
      tip: Do one word family in a sitting, for five minutes, with tiles that move. A word that falls apart and comes back together holds attention better than a list.
    - need: hands
      tip: Your child says the letters or points, and you move the tiles and write. They still do all of the deciding.
  stretch:
    - Collect words where an e stays to keep a sound right. Try *notice* + *able*. What do you think is happening?
    - Write the same short message twice, once for a friend and once for a school report. Use capitals and punctuation on purpose, and say what changed.
    - Invent a set of abbreviations for your family’s notes, then test whether someone else can read them.
together:
  - problem: d1
    how: Read the made-up word aloud together, and enjoy how wrong it sounds. Ask what letter comes right after the g, and let your child build the idea before you test it on the next word.
  - problem: d2
    how: Say *mus-cu-lar* slowly, more than once, and don’t point at the letter. Then write *sine* beside *signal* and ask whether they still look related.
  - problem: d3
    how: Ask how the brother in the sentence might have cleaned his room, and what you would hate to find out later. Have them read the sentence with and without the parentheses, and say what changed.
