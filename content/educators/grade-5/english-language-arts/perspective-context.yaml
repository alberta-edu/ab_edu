id: perspective-context
subject: english-language-arts
why: This topic teaches a child to ask what someone has lived through before deciding what that person is like. That habit changes how they read a story, how they take an argument at recess and how they meet someone new.
hook:
  title: The two-sided box
  time: 5 minutes
  covers: [K4.1]
  body: |-
    Stand a cereal box, or any box or book with two different sides, on the table between you, so each of you can see only one side. Take turns saying what you see, with total confidence. "It has a big picture on it." "No, it’s a plain list of numbers."

    Don't turn it around. Ask: **"One of us must be wrong. Who? How could we settle this without moving?"** Let them argue, and open the lesson with the box still standing there.
activities:
  - title: Walk the street three times
    time: 20 minutes
    materials: A short walk. A hallway or a view from a window also works.
    covers: [K4.2, S4.4]
    steps:
      - Choose three walkers, such as a mail carrier, someone pushing a stroller and a dog.
      - Go along the same short stretch three times, being a different walker each time. At each stop ask, "What do you notice first? What do you love here? What bothers you?"
      - Afterward, compare. Did the same hill, curb or icy patch mean the same thing to all three?
      - 'Ask: "Whose walk did we leave out? What would they notice?"'
  - title: One memory, two tellers
    time: 15 minutes
    materials: A funny family or class memory, and a second teller
    covers: [K5.2, S5.3, K4.2]
    steps:
      - Choose a funny, low-stakes memory, such as a birthday that went wrong.
      - Two people tell it, one at a time, without correcting each other. You can be one of them. A phone call to a relative works too.
      - Your child listens for one thing. What did one teller mention that the other left out?
      - 'Ask: "What in each person’s life or interests might explain that?" Let your child guess, then ask the tellers.'
  - title: The character chair
    time: 15 minutes
    materials: A chair, and a story your child knows well
    covers: [S4.2, S4.3, S4.4]
    steps:
      - Your child picks a supporting character from a favourite book or film, someone who hardly gets to speak.
      - They sit in the chair and become that character. You interview them like a reporter. "What did you really think when that happened? What does nobody know about you?"
      - Swap chairs. Now you are the main character, giving your side of the same moment.
      - 'Ask: "Where do these two disagree? What in each one’s life explains it?"'
questions:
  - Whose voice is missing here? What might they say?
  - What would you need to know about this character’s life to understand that?
  - Is that in the words on the page, or did you bring it with you?
  - Who wrote this? What might they care about? What might they not bother to mention?
  - Did anything here shift how you see this? What was it?
misconceptions:
  - thought: '"If two people disagree, one of them has to be wrong."'
    why: Many school questions have one right answer, so it is a fair thing to expect.
    tryThis: Ask whether a big snowfall is good or bad, then ask, "For whom?" Keep adding people until the question stops making sense without knowing who is asking.
  - thought: '"Dad just hates animals."'
    why: Actions are what we can see. The reason behind them often comes later in a story, or never.
    tryThis: Read only the first paragraph of "The Beaver Pond" and ask what kind of person Dad is. Then read paragraph 4. Ask what has changed, and what hasn’t.
  - thought: '"The writer has something to gain, so none of it is true." Or the opposite, "The writer is an expert, so all of it is true."'
    why: Trust it or don’t is a much simpler choice than trusting part of something.
    tryThis: Imagine a coach writing about why her sport is the best one. Ask which parts you would still believe, and what she might not bring up.
  - thought: '"The story says the dog wanted to hurt her."'
    why: Our memories fill in a story so quickly that it feels as if the words said it.
    tryThis: 'Play "point to the words." If they can’t point to it, they brought it themselves. Say that this is fine, and that good readers notice when they do it.'
lookFor:
  - They explain what a character does by pointing to something in that character’s life.
  - They ask who hasn’t been heard from, without being prompted.
  - They keep their own opinion and can still say why someone else sees it differently.
  - They separate what the words say from what they are adding.
adapt:
  support:
    - Start with real life and low stakes. Who loves a rainy Saturday? Who hates it? Why? Do this before opening a story.
    - Stay with one character and one moment. Ask only, "What does this person care about?"
    - Sketch two columns, one for what a character does and one for what is in their life, and draw lines between them.
  access:
    - need: reading
      tip: Read "The Beaver Pond" aloud together in voices. Your child can read Tess while you read Dad and Mrs. Novak, or just listen.
    - need: writing
      tip: Let your child say the gull’s reply in a gull voice while you write it down. Speaking in character counts as the thinking.
    - need: attention
      tip: Stop after each paragraph of the story and ask, "What do you think of this person now?" The opinion changing is what keeps it interesting.
    - need: worry
      tip: Speaking as a character can feel safer, because the opinion belongs to the character. If it comes out wrong, the character was wrong.
    - need: language
      tip: Phrases such as *jaw tight* hide a feeling, so make the face together. If your child has lived somewhere else, invite that view when they want to share it, and never ask them to speak for a whole culture.
  stretch:
    - Write the note that a neighbour downstream, who needs the creek to keep flowing, might leave for Dad.
    - Choose a non-fiction book at home and read what it says about the author. What in that person’s life might shape what the book focuses on?
together:
  - problem: d1
    how: Show one part at a time and pause before each one. Ask, "What do you actually know so far, and what are you guessing?" Let your child commit to a guess, then come back to it when the new facts arrive.
  - problem: d2
    how: You each read the dog story aloud, once as each reader. Don’t discuss the right answer. Ask what each reading made your voice do, and which words caused it.
  - problem: d3
    how: Do the gull’s reply out loud first, in a gull voice. Ask what the gull would call what happened, then let your child choose the facts that help the gull’s case.
