id: grammar
subject: english-language-arts
why: Grammar shows a child that small words carry real meaning, such as who did what, when, and how two ideas connect. A child who plays with sentences learns to read closely and to say exactly what they mean.
hook:
  title: The potato and the shoe
  time: 5 minutes
  covers: [S2.3, S2.4, K2.4]
  body: |-
    Grab two silly objects, such as a potato and a shoe. Say, **"The potato kicked the shoe."** Your child acts it out with the objects. Now say, **"The shoe kicked the potato."** Act it out again. Then say, **"It kicked it."**

    Your child will want to know which one. Ask: **"Same words, nothing added, and the story flipped. Then it got impossible. What is going on?"** Leave the objects on the table and open the lesson.
activities:
  - title: Adverb charades
    time: 10 minutes
    materials: Slips of paper and a bowl
    covers: [K2.2, S2.6]
    steps:
      - Together, write words such as *sleepily*, *angrily*, *proudly* and *nervously* on slips. On other slips, write everyday actions, such as *brushed your teeth* or *ate cereal*.
      - Draw one of each and act it out. Everyone guesses the word and says the sentence.
      - Say the sentence three ways, moving the adverb. "Angrily, she ate cereal." "She angrily ate cereal." "She ate cereal angrily."
      - 'Ask: "Did the picture change? Which one do you like best?"'
  - title: Time jump!
    time: 10 minutes
    materials: Nothing
    covers: [K2.1, S2.1]
    steps:
      - Tell a silly story about yesterday, and let the verbs slip now and then. "So I walked into the store and the goat eats all the bananas."
      - Your child shouts "Time jump!" at every slip, and fixes it for a point. Take turns as the storyteller.
      - Now and then say something where the time really does change. "I ate too many tacos last night, and I feel awful today."
      - 'Ask: "Is that a time jump, or did the time really change?" Let them defend their call.'
  - title: The because-but-so chain
    time: 10 minutes
    materials: Slips with *and*, *but*, *so*, *because*, *or* and *although* in a bowl
    covers: [K2.3, S2.7]
    steps:
      - Start with something odd. "The cat fell asleep on the bus."
      - The next person draws a conjunction and must carry on using it. "...because the driver was playing lullabies."
      - Keep going around, and let the story get as strange as it wants.
      - 'Pick one link and swap in a different word. Ask: "How does the story change?"'
questions:
  - Who is doing the action here? Who is getting it?
  - Who is *they* in this sentence? How do you know?
  - What happens to the picture if we move that word?
  - When is this happening? Did the time really change, or only the verb?
  - What does *but* tell you here that *and* wouldn’t?
  - Take away the other person. How does it sound now?
misconceptions:
  - thought: '"*Hugo and I* always sounds more polite, so it must be right."'
    why: Adults have often corrected them for saying "me and Hugo," so this is careful thinking based on what they were told.
    tryThis: Take away the other person and say it aloud. Ask who is doing the action and who is getting it.
  - thought: '"Every word that ends in -ly is an adverb."'
    why: It is a handy clue, and it is often taught as a rule.
    tryThis: 'Find what the word describes. Try *silly*, *friendly* and *lovely*. Ask, "Silly what?" If the answer is a noun, the clue has failed.'
  - thought: '"*Her* is one kind of pronoun, so it’s always that kind."'
    why: It looks the same every time, so it seems reasonable that it would do the same job.
    tryThis: Draw "I saw her" and "I saw her cat." Ask who is in each picture and what the word is doing.
  - thought: '"Two tenses in one sentence is always a mistake."'
    why: They were just told to stay in one time, and a clear rule is comforting.
    tryThis: Draw a line for time and put each verb on it. If the actions sit in the same place, the tense should match. If they don’t, it can change.
lookFor:
  - They catch a tense slip in a story, in their own writing or in something you say.
  - They stop and ask who *they* or *it* refers to when reading.
  - They move a word around to see what happens, just out of curiosity.
  - They choose *but* or *so* on purpose and can tell you the difference.
adapt:
  support:
    - Act first, and name it later. Use the objects to show who does what before saying *subject* or *object*.
    - Stay with *I* and *me*, and with *they* and *them*, before adding other pronouns.
    - Use your child’s own sentences, about their pet or game, instead of made-up ones.
  access:
    - need: writing
      tip: Nearly all of this can be spoken. Sentences said aloud, moved around and acted out are real grammar work, with no pencil needed.
    - need: reading
      tip: Say sentences aloud and keep them short. Agreement slips are often easier to hear than to see.
    - need: attention
      tip: Use the charades and the chain as short bursts between other work. A silly sentence about your child’s own life holds up better than a list.
    - need: worry
      tip: Let your child catch your mistakes first. Respond to what they mean in conversation, and save the corrections for the games.
    - need: language
      tip: Some languages show time, number or *he* and *she* in other ways, so these slips are a sign of learning and not carelessness. Ask how their other language shows "yesterday," and compare.
    - need: hands
      tip: Your child can say where to move a word while you shift the note or object. Acting out with the whole body can replace the objects.
  stretch:
    - Write two notes that differ by a single pronoun and lead to two very different results.
    - Find a sentence in a favourite book with an adverb. Move it around. When does the meaning change, and when doesn’t it?
    - Tell the same two events twice, using different conjunctions, so that a different thing caused what happened.
together:
  - problem: d1
    how: Show one sentence at a time, and have your child draw or place toy animals for each one. Keep asking, "How could you tell?" If the honest answer is that they can’t, celebrate saying so.
  - problem: d2
    how: Draw a line for time on paper. For each sentence, your child places the actions on it before deciding. Ask only when each action happened.
  - problem: d3
    how: Act out both sentences. Your child stands and dances, reading only the words. Then have them write their own pair, and you act it out exactly as written.
