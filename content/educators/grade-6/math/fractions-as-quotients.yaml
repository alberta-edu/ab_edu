id: fractions-as-quotients
subject: math
why: Seeing a fraction as a division joins two ideas a child has kept apart. It explains where decimals for fractions come from, and it makes fair sharing something they can reason about.
hook:
  title: Three pancakes, four people
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    1. Cut 3 paper circles and set out 4 plates.
    2. Ask: **"How can we share these so it’s fair?"**
    3. Let your child try. Some children cut every circle into 4. Others cut in halves first.
    4. Ask: **"How much is on each plate? Is it the same for every way of sharing?"**
activities:
  - title: Plate puzzles
    time: 15 minutes
    materials: Paper circles, scissors, plates or paper squares as plates
    covers: [S1.1, S1.2, U1.2]
    steps:
      - Share 2 circles among 4 plates, then 4 circles among 8 plates. Compare one plate from each.
      - Share 5 circles among 2 plates, once with wholes first and once by cutting every circle.
      - Your child writes each share as a fraction and as a division.
  - title: Calculator check
    time: 10 minutes
    materials: A calculator, paper and a pencil
    covers: [K1.3, S1.4]
    steps:
      - Write five fractions, like \(\frac{1}{4}\), \(\frac{3}{8}\) and \(\frac{2}{3}\). Your child predicts each decimal, roughly.
      - They divide numerator by denominator on paper, then check with the calculator.
      - Talk about the ones that never stop, like \(\frac{2}{3}\).
questions:
  - What is being shared, and how many shares are there?
  - Will each person get more or less than one whole? How can you tell before dividing?
  - Can you share it another way and get the same amount?
  - Why does \(\frac{6}{8}\) give the same decimal as \(\frac{3}{4}\)?
  - Which number goes inside the division bracket?
misconceptions:
  - thought: '"\(\frac{3}{5}\) is \(5 \div 3\)."'
    why: Children are used to dividing the bigger number by the smaller one.
    tryThis: Act it out. 3 cookies for 5 people, so does each get more or less than one?
  - thought: '"You can’t share 3 things among 4 people."'
    why: In earlier grades, division with natural numbers stopped at whole answers or remainders.
    tryThis: Cut paper circles. Each person gets pieces, not wholes.
  - thought: '"Cutting differently gives a different amount."'
    why: The plates look different, so the amounts seem different.
    tryThis: Stack the pieces from two plates on top of each other to compare.
lookFor:
  - They read \(\frac{a}{b}\) as "a shared among b" without prompting.
  - They predict whether a share is more or less than 1 before dividing.
  - They model one sharing in two different ways.
  - They connect equivalent fractions to equal shares.
adapt:
  support:
    - Use paper circles you can really cut, and start with 2, 3 and 4 people.
    - Write each share in words first, then as a fraction, then as a division.
    - Keep to fractions with denominators 2, 4, 5 and 10 for decimals at first.
  access:
    - need: hands
      tip: The lesson’s sliders and buttons work with a keyboard. At home, an adult can cut while your child says where.
    - need: language
      tip: Use "shared among" and "each gets" in every sentence, pointing to the numerator and the denominator.
    - need: worry
      tip: Paper sharing has no wrong first try. Any fair way of cutting is a good way.
  stretch:
    - Find two different sharings where each person gets exactly 0.4 of a pizza.
    - Which fractions with denominators up to 12 give a decimal that ends? What do their denominators have in common?
together:
  - problem: d1
    how: Draw the two tables with plates. Work out each share before talking about sharing everything.
  - problem: d2
    how: Make a table of kids and muffins and divide each pair. Look for the pairs that land between 0.5 and 0.6.
