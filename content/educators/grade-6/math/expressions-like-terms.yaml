id: expressions-like-terms
subject: math
why: The order of operations is an agreement so that everyone reads an expression the same way. Like terms teach a child that only things of the same kind can be counted together, which is the start of all algebra.
hook:
  title: Same keys, different answers
  time: 5 minutes
  covers: [K1.2, S1.1]
  body: |-
    1. Write \(2 + 3 \times 4^2\) and ask your child to work it out on their own.
    2. Work it out yourself, on purpose, from left to right. You get 400.
    3. Ask: **"We used the same numbers. Who is right? How could we agree?"**
activities:
  - title: Fruit salad algebra
    time: 15 minutes
    materials: A few apples, bananas and grapes, or pictures of them
    covers: [S2.1, K2.1, K2.3]
    steps:
      - Put out 2 apples, 3 bananas, 1 apple and 2 grapes in a jumbled row.
      - Your child writes it as an expression, like \(2a + 3b + a + 2g\).
      - They sort the fruit by kind and write the simplified expression, \(3a + 3b + 2g\).
      - 'Ask: "Can apples and bananas be combined into one term? Why not?"'
  - title: Bracket battle
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S1.1, K1.1, K1.2]
    steps:
      - Write an expression like \(1 + 2 \times 3^2\).
      - Take turns adding one pair of parentheses to make the biggest or smallest value.
      - Each player evaluates their own expression aloud, step by step, and the other checks.
questions:
  - What gets done first here? Why?
  - Which number does this power belong to?
  - Are these like terms? What makes them alike?
  - What did you just use, the commutative or the distributive property?
  - How can you check that two expressions are equivalent?
misconceptions:
  - thought: '"\(2 \times 3^2 = 36\)."'
    why: Reading left to right feels natural, so \(2 \times 3\) gets done first.
    tryThis: Circle the power and its base before doing anything else.
  - thought: '"\(2x + 3 = 5x\)."'
    why: The numbers are right there, so adding them seems sensible.
    tryThis: Use tiles. Two \(x\)-tiles and three unit tiles can’t be stacked into five \(x\)-tiles.
  - thought: '"\(3(x + 4) = 3x + 4\)."'
    why: The 3 sits right next to the \(x\), so it seems to belong only to it.
    tryThis: Build three groups of \(x + 4\) with tiles, and count the unit tiles.
lookFor:
  - They mark the power first in an expression with no parentheses.
  - They sort terms by kind before combining.
  - They test equivalent expressions with more than one value.
  - They name the property they used to rearrange or expand.
adapt:
  support:
    - Use algebra tiles or real objects for every simplification at first.
    - Highlight like terms in the same colour before combining.
    - Keep the order of operations table in sight.
  access:
    - need: reading
      tip: Read \(3x\) as "three x" and \(x^2\)-style powers as "squared", so the symbols turn into words.
    - need: hands
      tip: The lesson’s tiles move with buttons. On paper, your child can say which terms go together while you write.
    - need: attention
      tip: Do one step per line, and cover the rest of the problem with a card.
  stretch:
    - Use the digits 1, 2, 3 and 4 once each, with one power and any operations, to make the biggest number you can.
    - Write an expression with five terms that simplifies to \(4x + 1\).
together:
  - problem: d1
    how: Write the expression on a strip of paper, and use two pencils as the parentheses. Slide them around and evaluate each try.
  - problem: d2
    how: Make a quick table of values for \(x\) = 1, 2, 3 and compare the two expressions.
