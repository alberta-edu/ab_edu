id: functions
subject: math
why: Functions describe how one thing changes with another, like growth, temperature and travel. A child who can move between a story, a table, a graph and an equation can read the world’s data, not just calculate.
hook:
  title: Guess my rule
  time: 5 minutes
  covers: [S1.2, U1.1]
  body: |-
    1. Think of a secret rule, like "double it, then add 1".
    2. Your child calls out numbers. You answer with the output each time.
    3. Ask: **"What’s my rule? Test it before you say it."**
activities:
  - title: Growth tracker
    time: 10 minutes a day for a week
    materials: A bean seed in a cup, a ruler, a notebook
    covers: [K1.2, K1.3, S1.1, S1.3]
    steps:
      - Plant a bean and measure its height each day. Record days and heights in a table.
      - Your child decides which column is independent and which is dependent.
      - At the end of the week, plot the points on grid paper and talk about the pattern.
  - title: Phone plan maker
    time: 15 minutes
    materials: Paper and a pencil
    covers: [S1.4, S1.6, S1.7, S1.8]
    steps:
      - Invent a plan, like $5 to start plus $3 a month. Your child writes the equation.
      - Find the cost after 4 months, then work backwards to find when it costs $35.
      - Invent a second plan and decide when each plan is cheaper.
questions:
  - What depends on what here?
  - What is the rule, in words? Can you write it as an equation?
  - If I tell you the output, how could you find the input?
  - Is this a function? Could one input have two outputs?
  - Where would this pair go on the graph?
misconceptions:
  - thought: '"The independent variable is the one in the first sentence."'
    why: They choose by order in the text, not by meaning.
    tryThis: Ask "Does A change because of B, or B because of A?" every time.
  - thought: '"y = 4x + 3 fits because the first pair works."'
    why: Checking one pair feels like checking.
    tryThis: Always check at least two rows of the table.
  - thought: '"(7, 3) and (3, 7) are the same point."'
    why: The same numbers appear.
    tryThis: Plot both on grid paper and see how far apart they are.
lookFor:
  - They name the independent variable by asking what depends on what.
  - They find a rule from a table by looking at how much y grows each step.
  - They check a rule with more than one pair.
  - They use more than one strategy to find an input from an output.
adapt:
  support:
    - Start with rules of one step, like "add 4" or "times 3".
    - Use a function machine drawn on paper, with a slot for in and out.
    - Fill tables before writing equations.
  access:
    - need: hands
      tip: The lesson’s slider works with arrow keys. Tables can be dictated to an adult.
    - need: language
      tip: '"Independent" and "dependent" are long words. Use "what you choose" and "what you get" alongside them.'
    - need: attention
      tip: Guess my rule is quick, with a reveal after each round.
  stretch:
    - Find two rules whose graphs both pass through (1, 5) and (3, 9). Is there more than one?
    - Make a table for the temperature of water cooling down. Can the rule be "multiply, then add"?
together:
  - problem: d1
    how: Draw both plants as bars on grid paper, week by week, and watch which one is taller.
  - problem: d2
    how: Plot (2, 11) on grid paper and draw two of the lines together.
