id: simplify-solve-equations
subject: math
why: Real equations rarely arrive tidy. Learning to tidy each side first, and to trust that the solution doesn’t change, gives a child a way into any equation, and a habit of checking their answer against the original.
hook:
  title: The messy balance
  time: 5 minutes
  covers: [U3.1, S3.1]
  body: |-
    1. Put 2 identical cups on one side of a table, then 3 more, and a pencil. Put 19 coins on the other side.
    2. Say: **"These sides are worth the same. Every cup holds the same number of coins, and the pencil is worth 4 coins."**
    3. Ask: **"How many coins are in a cup? What would you do first?"**
activities:
  - title: Bag balance
    time: 20 minutes
    materials: Paper bags or cups, small objects like coins, sticky notes
    covers: [S3.1, S3.2, S3.4]
    steps:
      - In secret, put the same number of coins in each of 4 bags. Lay out 1 bag, then 3 bags, plus 2 loose coins.
      - Write the total number of coins on a sticky note, like 22.
      - Your child writes the equation, like \(b + 3b + 2 = 22\), simplifies it and solves it.
      - Open a bag to check. Then swap roles.
  - title: Two ways race
    time: 15 minutes
    materials: Paper and pencils
    covers: [S3.3, S3.4]
    steps:
      - Write an equation like \(3(x + 4) = 27\).
      - You solve it one way, and your child solves it another way, such as expanding first or guess and check.
      - Compare answers, then check them in the original equation together.
questions:
  - What can you simplify on each side before you start?
  - Which terms are like terms here?
  - Is there another way to solve this?
  - How can you be sure your answer works in the original equation?
  - What would happen if you did something to one side only?
misconceptions:
  - thought: '"\(2x + 5 + 3x = 30\) becomes \(2x + 8x = 30\)."'
    why: The 5 and \(3x\) sit next to each other, so they get combined.
    tryThis: Highlight like terms in matching colours before combining anything.
  - thought: '"Simplifying changed the problem, so the answer must be different."'
    why: The equation looks very different after simplifying.
    tryThis: Test the solution in every line of the work, as in the lesson’s table.
  - thought: '"I checked my answer in my last line, so it’s right."'
    why: The last line is simplest, so it feels like the real equation.
    tryThis: Always check in the first line. A mistake in simplifying hides from a check in the last line.
lookFor:
  - They simplify each side before using inverse operations.
  - They check in the original equation, not a later line.
  - They solve one equation two different ways.
  - They write an equation from a story with terms that need combining.
adapt:
  support:
    - Use cups and coins until the steps feel natural.
    - Write each side of the equation on its own card, and simplify one card at a time.
    - Keep numbers small, with solutions under 10.
  access:
    - need: writing
      tip: Your child can say each step aloud while you write. Ask them to tell you what to write on each side.
    - need: hands
      tip: The lesson’s balance moves with buttons. For the bag game, an adult can move the coins.
    - need: worry
      tip: Checking the answer at the end lets your child find their own mistakes before anyone else does.
  stretch:
    - Write an equation with like terms on both sides of the equals sign, with constants only on the right, that has a solution of 6.
    - Solve \(5(x + 1) = 45\) three different ways.
together:
  - problem: d1
    how: Use cups as bags and coins as kilograms. Act out adding a bag to one side and 3 coins to the other.
  - problem: d2
    how: Pick the solution first, then build the equation forward. Swap puzzles and solve each other’s.
