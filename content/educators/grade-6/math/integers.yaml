id: integers
subject: math
why: Negative numbers are the first time a child meets numbers less than nothing. Learning that a number has both a size and a direction prepares them for temperatures, money owed, and every graph with four quadrants.
hook:
  title: Colder than zero
  time: 5 minutes
  covers: [K1.5, S1.1]
  body: |-
    1. Look up tonight’s forecast together, or remember a really cold morning.
    2. Ask: **"If it’s 0 °C and it gets colder, what number comes next?"**
    3. Ask: **"Is −10 °C bigger or smaller than −2 °C?"** Let your child argue both ways.
    4. Don’t settle it yet. The lesson will.
activities:
  - title: Stairs and the basement
    time: 15 minutes
    materials: A staircase, or a hallway with tape marks, and some sticky notes
    covers: [K1.1, K1.6, S1.3, S1.4]
    steps:
      - Label one step or tape mark 0. Mark steps above as 1, 2, 3 and steps below as −1, −2, −3.
      - Your child stands on 0. Call out numbers and they walk there, saying how many steps they are from 0.
      - 'Ask: "Which two steps are exactly 2 steps from 0?" Then do it for 3 and 4.'
      - 'Ask: "Why does every number above zero have a twin below?"'
  - title: Thermometer order
    time: 15 minutes
    materials: Paper strips or index cards and a marker
    covers: [S1.5, S1.6, K1.5]
    steps:
      - Write ten temperatures on cards, like −12 °C, −3 °C, 0 °C, 4 °C and 18 °C.
      - Your child lays them out from coldest to warmest.
      - Pick two cards. Your child writes a true sentence with < or > between them.
      - Make a "warm pile" and a "cold pile" and ask what the cards in each pile have in common.
questions:
  - How far from zero is that number? Which direction?
  - Which is colder, −10 °C or −2 °C? How do you know?
  - Is owing $8 more or less money than owing $2? Which number is greater?
  - What number has the same magnitude as −6? Are there any others?
  - Is zero positive, negative, or something else? Why?
misconceptions:
  - thought: '"−8 is bigger than −3, because 8 is bigger than 3."'
    why: For years, a bigger digit meant a bigger number. They see the 8 and stop there.
    tryThis: Put both on a thermometer and ask which is colder. Then ask which is greater.
  - thought: '"Zero is a positive number."'
    why: Zero is in the counting numbers they know, so it feels like one of the positives.
    tryThis: Ask which direction zero is from zero. It has no direction, so it gets no sign.
  - thought: '"Magnitude means how big the number is."'
    why: In everyday talk, magnitude sounds like size, and size sounds like value.
    tryThis: Use "how many steps from zero" in place of magnitude for a while. −9 is 9 steps away but is still less than 1.
lookFor:
  - They point to the correct side of zero before they say a negative number.
  - They say which is colder or which is owed more before they compare the numbers.
  - They find both numbers with a given magnitude, without being asked for the second one.
  - They catch a comparison that ignores the sign.
adapt:
  support:
    - Start with an upright thermometer. "Below" is easier to feel than "left".
    - Keep the numbers between −10 and 10 until comparing feels steady.
    - Say the context every time, such as "5 degrees below zero", before writing −5.
  access:
    - need: reading
      tip: Read the sign aloud as "negative" every time, so −5 never sounds like 5.
    - need: language
      tip: '"Below zero", "owe" and "sea level" may be new phrases. Act each one out with the stairs.'
    - need: hands
      tip: The lesson’s sliders work with arrow keys. On the stairs, your child can direct you to walk instead.
    - need: worry
      tip: In Thermometer order, there is a quick check. Hold up a real thermometer picture, so nobody has to say "wrong".
  stretch:
    - Find the greatest negative integer. Is there a least one? Why or why not?
    - Order a list of seven temperatures, some with the same magnitude, and write the whole list with < signs.
together:
  - problem: d1
    how: Write the four possible pairs on paper. Cross them out together as each clue comes in.
  - problem: d2
    how: Fold a paper number line at zero and hold it up to a window. Ask where each number lands.
