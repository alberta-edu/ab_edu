id: transformations
subject: math
why: Moving shapes in the plane, and predicting their new coordinates, builds the visual thinking behind animation, games, maps and design. It also links geometry to number patterns a child can check.
hook:
  title: Robot moves
  time: 5 minutes
  covers: [K2.1, K2.2, K2.3]
  body: |-
    1. Cut a paper triangle and put it on a sheet of grid paper.
    2. Ask your child to give you robot commands to move it: slide, flip or turn.
    3. Follow their commands exactly. Ask: **"Which commands kept it facing the same way?"**
activities:
  - title: Floor transformations
    time: 20 minutes
    materials: Masking tape axes on the floor, a paper or cardboard triangle
    covers: [S2.1, S2.3, S2.5, S2.7]
    steps:
      - Place the triangle with its corners on crossings, and write the coordinates down.
      - Your child slides it, then flips it over one axis, then turns it a quarter turn about a corner.
      - After each move they write the new coordinates and say what changed.
  - title: Guess my move
    time: 15 minutes
    materials: Grid paper with axes from −6 to 6, two colours of pencils
    covers: [S2.2, S2.4, S2.6]
    steps:
      - Draw a triangle in one colour. In secret, draw its image after one move in the other colour.
      - Your child works out the move, such as "4 left and 2 down", or "over the y-axis".
      - Swap roles.
questions:
  - Which coordinate changes when you flip over the x-axis? Why that one?
  - How far left or right did the shape move? How far up or down?
  - Which point stays put when you turn about a vertex?
  - Does this shape still face the same way? How can you tell?
misconceptions:
  - thought: '"Reflecting over the y-axis changes y."'
    why: The axis is named y, so y seems to be the one that changes.
    tryThis: Stand on the y-axis tape and flip a paper shape over it. Watch which way it moves.
  - thought: '"A rotation always turns about the middle of the shape."'
    why: Spinning things, like wheels, usually turn about their centre.
    tryThis: Pin one corner to the table with a finger and turn the paper shape about it.
  - thought: '"Clockwise and counter-clockwise are the same for 180°."'
    why: This one is actually true, which makes children unsure about 90° and 270°.
    tryThis: Turn a shape 90° each way about the same corner, and compare where they land.
lookFor:
  - They predict the image’s coordinates before drawing it.
  - They describe a translation with both a horizontal and a vertical part.
  - They name the line of reflection from the coordinates.
  - They see that a rotation about a vertex leaves that vertex in place.
adapt:
  support:
    - Use a paper cut-out for every move, and trace its starting position.
    - Start with translations, then reflections, then rotations.
    - Track one vertex at a time.
  access:
    - need: hands
      tip: The lesson’s buttons and sliders do the moving. On paper, your child can direct an adult.
    - need: language
      tip: Pair "translate" with "slide", "reflect" with "flip", and "rotate" with "turn".
    - need: attention
      tip: Guess my move is short, with a quick reveal after every round.
  stretch:
    - Find two different single transformations that map a point onto the same image.
    - Find a pair of moves that brings a triangle back exactly where it started.
together:
  - problem: d1
    how: Use a paper triangle on grid paper and do both flips for real. Write the coordinates after each flip.
  - problem: d2
    how: Ask which vertex will be the last to cross each axis. Move that one first.
