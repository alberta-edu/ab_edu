id: prime-factorization
subject: math
why: Primes are the building blocks of every whole number. A child who can read a prime factorization can see at a glance what a number divides by, which makes fractions, common factors and later algebra much easier.
hook:
  title: The unbreakable numbers
  time: 5 minutes
  covers: [K1.2, K1.3]
  body: |-
    1. Give your child 12 coins or blocks. Ask them to arrange them in a rectangle. How many different rectangles can they make?
    2. Now try 7 blocks. Only one long row works.
    3. Ask: **"Which numbers can only make a single row? What is special about them?"**
activities:
  - title: Factor tree race
    time: 15 minutes
    materials: Paper and pencils, a timer
    covers: [K1.3, S1.2, U1.1]
    steps:
      - Pick a number like 84. You and your child each make a factor tree, starting with a different first split.
      - Compare the primes at the ends of your branches.
      - Write the prime factorization with powers together, like \(2^2 \times 3 \times 7\).
      - Try it again with a number you choose, and predict whether the primes will match before you start.
  - title: Divisibility detective
    time: 15 minutes
    materials: Index cards, a pencil
    covers: [S1.4, K1.4, S2.3]
    steps:
      - Write a prime factorization on a card, like \(2^3 \times 3 \times 5\), without working out the number.
      - Your child decides whether the number is divisible by 6, 9, 10, 16 and 20, using only the primes.
      - Then multiply out the number (120) and check each one by dividing.
questions:
  - Is this number prime or composite? How do you know?
  - Did your tree end in the same primes as mine? Why?
  - In \(2^4\), what does the 4 count?
  - Without dividing, how can you tell whether this number is divisible by 9?
  - Which factors do these two numbers share?
misconceptions:
  - thought: '"\(2^3\) means \(2 \times 3\)."'
    why: Two numbers written together usually mean they work with each other once.
    tryThis: Write \(2^3\) as "2, three times", then as \(2 \times 2 \times 2\). Compare 6 and 8.
  - thought: '"1 is a prime number."'
    why: It can’t be split, so it seems prime.
    tryThis: Count its factors. A prime has exactly two factors, and 1 has only one.
  - thought: '"My factor tree for 48 ends with 4 and 6, so I’m done."'
    why: The product is correct, so the job feels finished.
    tryThis: Colour every prime gold. Any branch without gold still has work to do.
lookFor:
  - They keep splitting until every factor is prime, without a reminder.
  - They write repeated factors as powers.
  - They decide divisibility by comparing prime factors, not by dividing.
  - They expect different trees for one number to end in the same primes.
adapt:
  support:
    - Use the divisibility tests for 2, 3 and 5 from Grade 5 to find the first split.
    - Start with numbers under 50 that have small primes only.
    - Keep a list of primes up to 20 in sight.
  access:
    - need: writing
      tip: Factor trees can be built with sticky notes moved around a table instead of drawn.
    - need: hands
      tip: The lesson’s tree grows with a button, and the divisibility box takes typed numbers.
    - need: language
      tip: '"Base" and "exponent" are new words. Point to each one in \(5^3\) as you say it.'
    - need: attention
      tip: Use the race format, with a short timer. Each tree is a small, finished job.
  stretch:
    - Find a number below 100 with exactly four different prime factors. Why is there only one?
    - 'Which numbers below 50 have a prime factorization with only one prime, like \(2^5\)?'
together:
  - problem: d1
    how: Write "three 2s" and "two 3s" on slips of paper as you work out each clue. Then multiply the slips together.
  - problem: d2
    how: 'Write \(12 = 2^2 \times 3\) and \(18 = 2 \times 3^2\) side by side, and ask what a number needs in order to hold both.'
