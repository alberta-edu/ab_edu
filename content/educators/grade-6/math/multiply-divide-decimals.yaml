id: multiply-divide-decimals
subject: math
why: Decimals are how money and measurements really work. A child who estimates first will catch a misplaced decimal point, the most common and most expensive mistake with decimals.
hook:
  title: Where does the point go?
  time: 5 minutes
  covers: [S1.3, S1.1]
  body: |-
    1. Write on paper: **4.75 × 12 = 5 7 0 0**, with no point.
    2. Ask: **"These digits are right. Where does the decimal point go?"**
    3. Let your child argue for 5.7, 57 or 570.
    4. Ask how they could be sure without doing the whole calculation.
activities:
  - title: Price check
    time: 15 minutes
    materials: A grocery flyer, paper and a pencil
    covers: [S1.4, S1.2, S1.3]
    steps:
      - Choose an item and a quantity from 10 to 30, like 12 cans at $1.45.
      - Your child estimates the total first, then multiplies exactly.
      - Next, pick a pack price and a count, like 24 bottles for $16.80, and find the price of one.
      - Compare which deal is cheaper for each item.
  - title: Ribbon shares
    time: 15 minutes
    materials: A long strip of paper or string, a measuring tape, scissors
    covers: [K1.2, S1.2]
    steps:
      - Measure a strip, like 245 cm, and choose a number of friends to share it with, like 14.
      - Your child divides and writes the remainder as a decimal, 17.5 cm each.
      - Measure and cut one share to check that it looks right.
questions:
  - About how big should the answer be? How did you estimate?
  - Why does the decimal point go straight up in long division?
  - What does this remainder mean in the story? Can it be shared?
  - How many decimal places should the product have? Why?
  - How could you check this answer with the opposite operation?
misconceptions:
  - thought: '"Multiplying always makes a number bigger, and dividing always makes it smaller."'
    why: That was true with every natural number they met before.
    tryThis: Try \(12 \times 0.5\) with real objects. Half of 12 apples is 6 apples.
  - thought: '"230 ÷ 20 = 11 R 10, so it’s 11.10."'
    why: The remainder looks like the digits after a point.
    tryThis: Share the 10 left over among 20 people. Ask how much each one gets.
  - thought: '"4.75 × 12 = 570."'
    why: They placed the point by guessing, or by counting digits from the wrong end.
    tryThis: Estimate first. 5 × 12 = 60, so the answer must be near 60.
lookFor:
  - They estimate before calculating, and use the estimate to place the decimal point.
  - They keep dividing past the point instead of stopping at a remainder.
  - They decide, from the story, what a remainder means.
  - They check a quotient by multiplying.
adapt:
  support:
    - Use money first. Dollars and cents make two decimal places feel natural.
    - Let your child multiply without the point first, then talk about where it goes.
    - Keep a list of the 12, 15, 16, 24 and 25 times tables in sight for long division.
  access:
    - need: writing
      tip: Grid paper keeps every column and the decimal point lined up.
    - need: attention
      tip: In the lesson, the calculation moves one step at a time with Next step. Pause and predict the next digit.
    - need: worry
      tip: Estimating first gives a safety net. A wrong answer that is near the estimate is almost right.
    - need: hands
      tip: Your child can say each step aloud while you write it, keeping the thinking theirs.
  stretch:
    - 'Find a decimal that, times 16, gives exactly 100. Then do the same for 32.'
    - Why does \(10 \div 3\) never finish? Try a few more numbers that never finish.
together:
  - problem: d1
    how: Use real or pretend money. Lay out what the class paid and what it took in before working out the profit.
  - problem: d2
    how: Make a table of 2-digit numbers and 100 ÷ each one. Ask which ones give a decimal with two places.
