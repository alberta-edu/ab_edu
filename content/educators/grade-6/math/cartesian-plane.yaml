id: cartesian-plane
subject: math
why: The Cartesian plane joins numbers and space. Every map, graph and screen uses it, and adding negative numbers lets a child describe any location around a starting point.
hook:
  title: Where is the treasure?
  time: 5 minutes
  covers: [U1.1, K1.4]
  body: |-
    1. Stand in the middle of a room and call that spot "home base".
    2. Hide a small toy and describe where it is from home base using only steps, like "3 steps toward the window, 2 steps toward the door".
    3. Ask: **"How could we write that with numbers, if some directions are backwards?"**
activities:
  - title: Floor plane
    time: 20 minutes
    materials: Masking tape, sticky notes, a few small toys
    covers: [S1.1, S1.2, S1.3, K1.3]
    steps:
      - Make two tape lines that cross in the middle of the floor. Mark steps from −4 to 4 on each.
      - Call out ordered pairs like (−3, 2). Your child walks there from the origin, across first.
      - Your child places toys and tells you their coordinates. You walk there to check.
  - title: Map a room
    time: 20 minutes
    materials: Grid paper, a pencil
    covers: [S1.4, S1.5, U1.1]
    steps:
      - Draw axes in the middle of grid paper. The origin is the centre of a room.
      - Your child plots the corners of furniture, like a rug or a table, as polygons.
      - They list the coordinates of each corner and describe where each object is.
questions:
  - Which number do you read first? What does it tell you?
  - What does a negative x tell you about where the point is?
  - Is this point on an axis? How can you tell from its coordinates?
  - How far apart are these two points? How do you know, without counting squares?
misconceptions:
  - thought: '"(−3, 4) and (4, −3) are the same point."'
    why: The same two numbers are there, just in a different order.
    tryThis: Walk both points on a floor plane, across first each time.
  - thought: '"The distance from −4 to 5 is 1."'
    why: They subtract the numbers they see, 5 − 4.
    tryThis: Walk it on a number line. Count to zero first, then past it.
  - thought: '"Points on the x-axis have x = 0."'
    why: The axis is named x, so x seems to be the special one.
    tryThis: Stand on the x-axis tape and ask how far up you are.
lookFor:
  - They move across first, then up or down, without reminders.
  - They read the sign as a direction, left or below.
  - They find distances across zero by adding the two distances.
  - They name a missing vertex by matching coordinates.
adapt:
  support:
    - Start with the floor plane before paper.
    - Use one colour for x, left and right, and another for y, up and down.
    - Keep the plane from −5 to 5 at first.
  access:
    - need: hands
      tip: The lesson’s plane responds to taps. On the floor, your child can give directions while you walk.
    - need: language
      tip: Use "across" and "up or down" alongside "x" and "y" until the letters feel natural.
    - need: attention
      tip: Treasure hunts with three hidden toys give each turn a clear finish.
  stretch:
    - Plot a polygon with a vertex on each side of each axis. Describe it to someone who can’t see it.
    - Find all the points with whole-number coordinates that are exactly 5 units from the origin along grid lines.
together:
  - problem: d1
    how: Plot the three given vertices on grid paper first. Let the rectangle show where D must go.
  - problem: d2
    how: Mark points like (−3, 3) and (−4, 4) on paper, and ask what pattern they make.
