id: ratios-rates
subject: math
why: Proportional thinking is behind recipes, maps, prices, speeds and sales. A child who sees that a ratio is a fixed relationship can scale anything up or down, and can tell a real deal from a fake one.
hook:
  title: The giant cookie
  time: 5 minutes
  covers: [K1.2, U1.1]
  body: |-
    1. Show a recipe that uses 2 cups of flour and 3 eggs.
    2. Ask: **"We want to make a giant cookie with 6 cups of flour. How many eggs?"**
    3. Listen. Some children say 7, by adding 4. Others say 9.
    4. Ask: **"Which cookie would taste like the recipe? Why?"**
activities:
  - title: Best buy hunt
    time: 20 minutes
    materials: A grocery flyer or store visit, a calculator
    covers: [S1.3, K1.5, S1.6]
    steps:
      - Find one product sold in two sizes, like juice or cereal.
      - Your child finds the unit price of each, such as the cost per 100 mL or per item.
      - Decide which is the better buy, and talk about when the bigger size isn’t better.
  - title: Percent of our stuff
    time: 15 minutes
    materials: Price tags or a flyer with sale signs
    covers: [S1.5, K1.7, S1.4]
    steps:
      - Choose a price and a sale percent, like 25% off $40.
      - Your child estimates the discount, then calculates it by multiplying and dividing by 100.
      - Check with 10% steps. 10% of $40 is $4, so 25% is $4 + $4 + $2.
questions:
  - What did you multiply by? Did you do the same to both terms?
  - How much is it for just one?
  - If I double one amount, what happens to the other?
  - Which is easier to compare, the totals or the unit prices? Why?
  - Is 30% of this number more or less than half? How do you know?
misconceptions:
  - thought: '"2 : 3 is the same as 6 : 7, because I added 4 to both."'
    why: Adding the same amount keeps differences the same, and it feels fair.
    tryThis: Make juice with 2 scoops of mix and 3 cups of water, then 6 scoops and 7 cups. Taste the difference.
  - thought: '"The bigger package is always the better buy."'
    why: Bulk often is cheaper, so it becomes a rule.
    tryThis: Compare unit prices on a real flyer. Find one where the smaller size wins.
  - thought: '"30% of 70 is 30."'
    why: The 30 is right there, and percent feels like a label, not an operation.
    tryThis: Use a double number line from 0 to 70 with 0% to 100% on top. Find 10%, then 30%.
lookFor:
  - They multiply both terms by the same number without being told.
  - They find a unit rate before comparing two rates.
  - They estimate a percent with 10% or 50% first.
  - They check an equivalent ratio by dividing back down.
adapt:
  support:
    - Use a ratio table with columns that double, then triple, before jumping to any multiplier.
    - Draw a double number line for every rate problem.
    - Start with percents that are multiples of 10.
  access:
    - need: reading
      tip: Rate words like "per", "for every" and "each" carry the meaning. Read them with emphasis.
    - need: hands
      tip: The lesson’s double line works with the arrow keys. Ratio tables can be filled in by an adult as your child says the numbers.
    - need: language
      tip: '"Per" may be new. Swap it for "for each" until it feels familiar.'
    - need: worry
      tip: Estimating first, like "about half", gives a safe start before the exact answer.
  stretch:
    - A recipe for 4 people uses 3 cups of rice. How much for 10 people? Find two different ways.
    - Which is more, 40% of 60 or 60% of 40? Try other pairs. What do you notice?
together:
  - problem: d1
    how: Draw red and yellow blocks in groups of 2 and 3 to build each batch.
  - problem: d2
    how: Make a table of percents, 5%, 10%, 15% and up, and find the price that makes $12 for each one.
