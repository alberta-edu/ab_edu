id: unlike-denominators
subject: math
why: The rule "you can only add things with the same unit" runs through all of math and science. Fractions with different denominators are where children first meet it head on.
hook:
  title: Can you add these?
  time: 5 minutes
  covers: [U1.1, U1.2]
  body: |-
    1. Ask: **"What is 3 apples plus 2 apples?"** Then: **"3 apples plus 2 bananas?"**
    2. Ask: **"What is 1 loonie plus 1 quarter?"** Talk about why it isn’t "2".
    3. Now ask: **"What is \(\frac{1}{2} + \frac{1}{4}\)?"** Let your child decide what the problem is.
activities:
  - title: Paper strip fractions
    time: 20 minutes
    materials: Paper strips of the same length, a ruler, coloured pencils
    covers: [K1.2, K1.3, S1.3, S1.4]
    steps:
      - Fold strips into halves, thirds, fourths, sixths and eighths. Label each part.
      - Lay a half under a fourths strip. How many fourths fit? Repeat with a third under sixths.
      - Pick two fractions, like \(\frac{1}{2}\) and \(\frac{3}{8}\). Find a strip that measures both, then add them.
  - title: Recipe mash-up
    time: 15 minutes
    materials: A recipe with fraction amounts, measuring cups
    covers: [S1.5, S1.4]
    steps:
      - Choose two ingredients measured in the same kind of cup, like \(\frac{3}{4}\) cup and \(\frac{1}{3}\) cup.
      - Your child predicts whether together they fill 1 cup. Then they calculate.
      - Pour real water to check.
questions:
  - Are these pieces the same size? How could you make them the same size?
  - Is one denominator a multiple of the other?
  - What number could you multiply by? Does it change the amount?
  - Is your answer bigger than each part? Should it be?
  - Is there a smaller common denominator that also works?
misconceptions:
  - thought: '"\(\frac{1}{3} + \frac{1}{4} = \frac{2}{7}\)."'
    why: Adding tops and bottoms treats a fraction like two separate whole numbers.
    tryThis: Show \(\frac{1}{3}\) on a strip. Ask if adding more can give a smaller amount.
  - thought: '"Changing \(\frac{3}{4}\) to \(\frac{9}{12}\) makes it bigger."'
    why: The numbers got bigger, so the amount seems bigger.
    tryThis: Fold a strip in fourths, shade 3, then fold each fourth in three. Count the twelfths.
  - thought: '"You always have to multiply the denominators."'
    why: It always works, so it feels like the only rule.
    tryThis: Try \(\frac{1}{2} + \frac{3}{8}\) both ways, with 16ths and with 8ths. Which was easier?
lookFor:
  - They check whether denominators are related before choosing a common one.
  - They estimate whether a sum is more or less than 1.
  - They explain that multiplying top and bottom by the same number keeps the amount.
  - They compare fractions by giving them a common denominator.
adapt:
  support:
    - Use fraction strips or the lesson’s bars for every problem at first.
    - Start with related denominators only, like halves and fourths.
    - Keep a multiplication chart in sight for finding multiples.
  access:
    - need: hands
      tip: The lesson’s bars change with buttons. Folding strips can be done by an adult while your child gives directions.
    - need: language
      tip: Say the unit out loud, "3 twelfths", instead of "3 over 12". It keeps the idea of a unit in view.
    - need: attention
      tip: Break each sum into three short jobs, a common unit, rename, then add.
  stretch:
    - Find three different fractions with unrelated denominators that add to exactly 1.
    - What is the smallest common denominator for \(\frac{1}{4}\), \(\frac{1}{6}\) and \(\frac{1}{10}\)?
together:
  - problem: d1
    how: Draw a rectangle for the plot, split it into 12 equal squares, and colour each vegetable’s share.
  - problem: d2
    how: Start from a pair you know makes 1, like \(\frac{1}{2} + \frac{1}{2}\), and play with equivalent fractions together.
