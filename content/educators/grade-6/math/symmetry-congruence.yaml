id: symmetry-congruence
subject: math
why: Symmetry and congruence train a child to picture shapes moving in their head, a skill used in art, design and building. Tessellations show math inside things they know, like star blankets.
hook:
  title: Same or not?
  time: 5 minutes
  covers: [U2.1, U2.2, S2.1]
  body: |-
    1. Cut two identical shapes from paper, like an L or a flag. Turn one over and place it across the table.
    2. Ask: **"Are these the same shape? How could you prove it?"**
    3. Let your child slide, flip and turn one until it covers the other.
activities:
  - title: Flip or turn?
    time: 15 minutes
    materials: Paper, scissors, a pencil
    covers: [S1.1, S1.2, S1.3, K2.1]
    steps:
      - Cut two identical L shapes. Place them in a new position for each round.
      - Your child predicts whether one flip, one turn, or two moves will put one on the other.
      - They move the shape to check, and say what kind of symmetry it was.
  - title: Tiling hunt
    time: 20 minutes
    materials: A phone or tablet camera, or paper for sketches
    covers: [S1.5, S1.4, K1.2]
    steps:
      - Walk around home or the neighbourhood looking for tessellations, such as floors, walls, fences and quilts.
      - Photograph or sketch three of them.
      - For each one, your child points to a tile and describes the move that maps it onto its neighbour.
questions:
  - Which move would put this shape exactly on that one, a flip or a turn?
  - If you can lay one on top of the other, what does that tell you?
  - Could two shapes be congruent but not related by symmetry? Show me.
  - Where in this tiling do you see a reflection? A rotation?
  - Why can’t circles tile a floor?
misconceptions:
  - thought: '"If a shape is turned, it’s a different shape."'
    why: Children name shapes by how they look on the page, so a tipped square seems like a diamond.
    tryThis: Turn a paper square slowly in front of them, and ask when it stopped being a square.
  - thought: '"Any two matching shapes are symmetrical."'
    why: Matching and symmetry are often used as the same word.
    tryThis: Slide one paper shape straight across the table. Ask for one flip or one turn that does the same job.
  - thought: '"A reflection works over any line."'
    why: They know the image is a mirror image, but forget the mirror has a place.
    tryThis: Hold a small mirror at different places and watch where the image appears.
lookFor:
  - They predict where a shape lands before flipping or turning it.
  - They separate "congruent" from "related by symmetry".
  - They describe a combination of two moves.
  - They spot tessellations in everyday places without prompting.
adapt:
  support:
    - Use paper cut-outs for every question, and trace the starting position.
    - Start with reflections over vertical lines, then horizontal, then turns.
    - Use an L shape, so a flip and a turn look different.
  access:
    - need: hands
      tip: The lesson’s buttons flip and turn the shape. An adult can move paper shapes while your child gives directions.
    - need: language
      tip: Pair "reflect" with "flip" and "rotate" with "turn" until the formal words feel natural.
    - need: attention
      tip: In the tiling hunt, a short walk with three photos is a complete job.
  stretch:
    - Design a tile that isn’t a rectangle or a triangle but still tessellates.
    - Find two different pairs of moves that map the same shape onto the same place.
together:
  - problem: d1
    how: Cut a few paper triangles, squares and hexagons and try fitting them around a point before calculating.
  - problem: d2
    how: Make a quick list of numbers from 5 to 12 and test whether each one divides 360.
