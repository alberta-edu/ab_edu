id: fraction-times-whole
subject: math
why: '"Of" means multiply is one of the most useful ideas in everyday math: half of the pizza, three-quarters of the class, two-thirds of the trip. It also breaks the belief that multiplying always makes things bigger.'
hook:
  title: Half of a dozen
  time: 5 minutes
  covers: [U1.3, S1.5]
  body: |-
    1. Put 12 crackers or coins on the table.
    2. Ask: **"What is half of these? A third? Three-quarters?"** Let your child move them into groups.
    3. Ask: **"Is three-quarters of 12 more or less than 12? Then is \(12 \times \frac{3}{4}\) bigger or smaller than 12?"**
activities:
  - title: Snack shares
    time: 15 minutes
    materials: 24 small snacks or counters, 4 small bowls
    covers: [S1.5, S1.6, K1.6]
    steps:
      - Ask for \(\frac{1}{4}\) of 24. Your child shares them into 4 bowls and counts one bowl.
      - Then ask for \(\frac{3}{4}\) of 24, and \(\frac{2}{3}\) of 24 using 3 bowls.
      - Write each one as a multiplication, like \(\frac{3}{4} \times 24 = 18\).
  - title: Measuring cup math
    time: 15 minutes
    materials: Measuring cups, water or rice
    covers: [S1.1, S1.2, U1.2]
    steps:
      - Pour \(\frac{1}{3}\) cup 5 times into a bowl. Your child writes it as repeated addition and as a multiplication.
      - Predict how many full cups that makes, then pour it back into a 1-cup measure to check.
      - Try \(\frac{3}{4}\) cup 3 times.
questions:
  - Is this "groups of a fraction" or "a fraction of a number"?
  - Will the answer be more or less than the number you started with? How do you know?
  - What is one part worth? How many parts do you need?
  - Why does the denominator stay the same when you multiply by a whole number?
misconceptions:
  - thought: '"\(\frac{2}{5} \times 15 = \frac{30}{75}\)."'
    why: They multiply the top and bottom, as they did for equivalent fractions.
    tryThis: Ask for 15 groups of two-fifths, with strips. The pieces stay fifths.
  - thought: '"Multiplying always makes a number bigger."'
    why: With natural numbers, it always did, except for 0 and 1.
    tryThis: Ask for half of 10 with real objects. Then write it as \(10 \times \frac{1}{2}\).
  - thought: '"Three-fourths of what is left is the same as three-fourths of the whole."'
    why: The words "three-fourths" are the same, so the amount seems the same.
    tryThis: Draw the trail. Shade what is left first, then take three-fourths of only that part.
lookFor:
  - They read "of" as multiply.
  - They predict whether the product will be bigger or smaller than the number.
  - They find one part first by dividing by the denominator.
  - They write repeated addition as a multiplication without help.
adapt:
  support:
    - Use counters, and numbers that divide evenly by the denominator at first.
    - Draw a bar for the whole number and split it into equal parts.
    - Say "groups of" and "of" aloud with every problem.
  access:
    - need: hands
      tip: The lesson’s sliders work with a keyboard. Counters can be moved by an adult as your child directs.
    - need: language
      tip: '"Of" is a small word carrying a big job. Point at it and say "times" as you read.'
    - need: worry
      tip: Start with half of an amount, which most children already know, before thirds and fourths.
  stretch:
    - Find three different fractions whose product with 24 is a whole number less than 10.
    - Is \(\frac{2}{3}\) of 9 the same as \(\frac{9}{3}\) of 2? Try other pairs and explain.
together:
  - problem: d1
    how: Draw a 12-square strip for the trail. Colour day 1, then day 2, and count what is left.
  - problem: d2
    how: Make a quick table with fractions less than 1, equal to 1 and more than 1, all times 8.
