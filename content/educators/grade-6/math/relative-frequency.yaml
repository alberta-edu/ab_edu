id: relative-frequency
subject: math
why: Relative frequency lets a child compare groups of different sizes fairly and judge claims based on small samples. These are everyday skills for reading surveys, sports stats and news.
hook:
  title: Is this coin fair?
  time: 5 minutes
  covers: [U2.3, S2.2]
  body: |-
    1. Toss a coin 10 times together and count the heads.
    2. Ask: **"Is this coin fair? How could you be more sure?"**
    3. Let your child suggest a plan, like more tosses or a tally chart.
activities:
  - title: Big toss
    time: 20 minutes
    materials: A coin, paper for a tally chart
    covers: [S2.2, S2.4, S2.6, K2.3]
    steps:
      - Toss a coin in rounds of 10. After each round, your child writes the heads as a fraction and a percent.
      - Keep a running total for 5 or 6 rounds.
      - 'Ask: "Which was closer to 50%, one round or all the rounds together?"'
  - title: Survey two groups
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K1.1, S1.1, S1.2]
    steps:
      - Ask the same question to two groups of different sizes, like your family and your child’s class.
      - Your child writes each answer’s relative frequency as a percent.
      - Compare the groups, and talk about why counts alone could mislead.
questions:
  - Out of how many? What is the total?
  - What fraction, decimal and percent is that?
  - Before you start, what do you expect to happen? Why?
  - Would you trust 10 tries or 1000 tries more? Why?
  - Which group has more, and which has a greater share? Are those the same thing?
misconceptions:
  - thought: '"7 heads in 10 tosses means the coin is unfair."'
    why: They expect chance to give exact results every time.
    tryThis: Toss in several rounds of 10 and see how much the results vary.
  - thought: '"More people chose it, so it is more popular."'
    why: Counts are easier to see than shares.
    tryThis: Compare 3 out of 4 people with 10 out of 100 people.
  - thought: '"After 5 tails in a row, heads is due."'
    why: It feels like the coin should even things out.
    tryThis: Ask whether the coin remembers what it did. Then toss and record the next 20 results.
lookFor:
  - They always ask "out of how many?"
  - They move easily between fractions, decimals and percents.
  - They predict a likelihood before running an experiment.
  - They trust bigger samples more than small ones, and can say why.
adapt:
  support:
    - Use totals of 10, 20, 25, 50 and 100 at first, so percents are easy.
    - Keep a fraction, decimal and percent chart in sight.
    - Run small experiments with real coins and dice before the virtual one.
  access:
    - need: hands
      tip: The lesson’s experiment runs with buttons. With real coins, an adult can toss while your child records.
    - need: attention
      tip: Short rounds of 10 tosses give quick, finished results to compare.
    - need: worry
      tip: Predictions are guesses, not tests. Celebrate a good reason, whatever the result.
  stretch:
    - Design a spinner where blue is about 3 times as likely as red. Test it with paper and a paper clip.
    - Roll two dice 50 times and record the sums. Which sums come up most? Why might that be?
together:
  - problem: d1
    how: Make a spinner with 5 equal sections and cover some colours. Try to guess them from your spins.
  - problem: d2
    how: Draw spinners with 6, 8 and 10 sections and colour exactly half blue.
