id: area-parallelograms-triangles
subject: math
why: A parallelogram is a rearranged rectangle, and a triangle is half a parallelogram. Seeing that lets a child find areas by reasoning, and split any odd shape into pieces.
hook:
  title: Same paper, new shape
  time: 5 minutes
  covers: [S1.1, U1.1]
  body: |-
    1. Cut a paper rectangle. Ask your child for its area.
    2. Cut a triangle off one end and tape it to the other end to make a slanted parallelogram.
    3. Ask: **"Did the area change? How could you find it now?"**
activities:
  - title: Paper parallelograms
    time: 15 minutes
    materials: Grid paper, scissors, tape
    covers: [S1.1, S1.2, S1.4, K1.4]
    steps:
      - Draw a parallelogram on grid paper and cut it out.
      - Cut off the end triangle and move it to make a rectangle. Count the squares.
      - Draw the same parallelogram again and cut it along a diagonal. Lay the two triangles on top of each other.
  - title: Floor plan detective
    time: 20 minutes
    materials: A floor plan or a sketch of a room or yard, a ruler
    covers: [S2.1, S2.2, S1.7]
    steps:
      - Sketch an L-shaped or slanted space, like a room with an angled wall, with measurements.
      - Your child splits it into rectangles, parallelograms and triangles, and finds the area.
      - Then they split it a different way and check that the total matches.
questions:
  - Which length is the height? How do you know it is the height?
  - What would happen to the area if this parallelogram leaned more?
  - Why do we divide by 2 for a triangle?
  - Can you split this shape a different way? Will the area change?
misconceptions:
  - thought: '"The area of a parallelogram is base × slanted side."'
    why: The slanted side is drawn, and the height usually has to be imagined.
    tryThis: Push a parallelogram made of straws flatter. The slanted side stays the same, but the shape gets thinner.
  - thought: '"A triangle’s area is base × height."'
    why: That is the rectangle rule they already know.
    tryThis: Draw the triangle inside its rectangle and shade it. It clearly fills about half.
  - thought: '"A longer, leaning triangle has more area."'
    why: Longer sides look like more space.
    tryThis: Draw three triangles on the same base between two parallel lines, then count the squares in each.
lookFor:
  - They find the height before calculating.
  - They explain the ÷ 2 by pointing to two copies of a triangle.
  - They split a composite shape in more than one way.
  - They work backwards from an area to a missing base or height.
adapt:
  support:
    - Use grid paper so every base and height can be counted.
    - Start with right triangles, where the height is a side.
    - Mark the height in a different colour every time.
  access:
    - need: hands
      tip: The lesson’s slider and buttons do the cutting. An adult can cut paper while your child says where.
    - need: language
      tip: '"Perpendicular" may be new. Show it as a square corner, like a book’s corner on the base.'
    - need: attention
      tip: Floor plan detective works well in short rounds, one room shape at a time.
  stretch:
    - Find three different parallelograms with an area of 36 square units, all with base 6.
    - Draw a composite shape that is easiest to split into exactly three triangles.
together:
  - problem: d1
    how: Draw the shape on grid paper, cut it out, and try both splits with scissors.
  - problem: d2
    how: List pairs of numbers that multiply to 48, then sketch two of the triangles.
