id: money-measurement-problems
subject: math
why: By Grade 6 the adding and subtracting are reliable. The real skill is reading a messy situation and deciding what to calculate, which is what adults do with money and measurements every day.
hook:
  title: The receipt mystery
  time: 5 minutes
  covers: [K1.2, S1.1]
  body: |-
    1. Find a real grocery or store receipt, and cover the total with a sticky note.
    2. Ask: **"About how much do you think we spent?"**
    3. Then ask: **"If I paid with a $50 bill, about how much change?"**
    4. Peel off the sticky note and see who was closest.
activities:
  - title: Shopping with a budget
    time: 20 minutes
    materials: A flyer or online store page, paper and a pencil
    covers: [S1.1, K1.2, K1.1]
    steps:
      - Give your child a pretend budget, such as $40.
      - They choose three or more items, estimate the total, then add exactly.
      - They work out the change, then check by adding the change to the total.
      - 'Ask: "What could you swap to have at least $10 left?"'
  - title: Measure and cut
    time: 15 minutes
    materials: A measuring tape, string or ribbon, scissors
    covers: [K1.2, S1.1]
    steps:
      - Cut a piece of string about 2 m long, and have your child measure it exactly.
      - Ask for two pieces, one in metres and one in centimetres, like 0.65 m and 48 cm.
      - Before cutting, your child predicts how much will be left. Then cut and measure to check.
questions:
  - What is the whole here, and what are the parts?
  - Is this story combining, taking away or comparing?
  - Are all the measurements in the same unit?
  - About how big should the answer be? Does your answer match?
  - How could you check this answer with the opposite operation?
misconceptions:
  - thought: '"3.6 + 12.45 = 12.81."'
    why: Whole numbers line up on the right, so they line up decimals the same way.
    tryThis: Write money amounts, like $3.60 and $12.45. Line up the dollars with dollars and cents with cents.
  - thought: '"0.85 m + 15 cm = 15.85 m."'
    why: They add the numbers they see without checking the units.
    tryThis: Hold up a metre stick. Ask if a sunflower can really grow from under 1 m to almost 16 m in a week.
  - thought: '"Every word problem with two numbers means adding."'
    why: Many early problems were sums, and "and" sounds like adding.
    tryThis: Use the Hide the question routine. Talk about what is happening before any numbers appear.
lookFor:
  - They estimate before calculating, without being asked.
  - They draw a bar or a quick sketch to sort out the parts and the whole.
  - They change all measurements to one unit before calculating.
  - They check an answer with the opposite operation.
adapt:
  support:
    - Start with whole-dollar amounts, then add cents.
    - Use real coins and bills for money problems, and a metre stick for lengths.
    - Draw the bar model for your child at first, and let them label the parts.
  access:
    - need: reading
      tip: Read the story aloud once without numbers, then again with them.
    - need: writing
      tip: Grid paper keeps columns and decimal points lined up.
    - need: attention
      tip: Break a long problem into a checklist, such as "what was spent", "what is left", "check".
    - need: language
      tip: '"Change", "left over" and "how much more" all hint at subtraction. Act them out with coins.'
  stretch:
    - Plan a party for 10 people with a $75 budget, using real prices from a flyer.
    - Write a money problem with a piece of extra information that a reader should ignore.
together:
  - problem: d1
    how: Cut a 6 m length of string or paper to model the fabric roll. Mark each piece before cutting.
  - problem: d2
    how: Try a few amounts for Mia in a table with columns for Mia, Raj and the total. Look for when the total first goes over $25.
