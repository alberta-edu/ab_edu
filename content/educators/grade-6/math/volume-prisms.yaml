id: volume-prisms
subject: math
why: Volume is the space things take up, from lunch boxes to rooms. Seeing a prism as layers of cubes lets a child trust the formula, because they know where every number in it comes from.
hook:
  title: Which holds more?
  time: 5 minutes
  covers: [U1.1, U1.3]
  body: |-
    1. Find two boxes with different shapes, like a tall cereal box and a flat cracker box.
    2. Ask: **"Which one holds more? How could we find out without guessing?"**
    3. Let your child suggest ideas, like filling them with rice or blocks.
activities:
  - title: Cube builders
    time: 20 minutes
    materials: Building blocks, sugar cubes or dice, all the same size
    covers: [S1.3, S1.5, K1.5, U1.6]
    steps:
      - Your child builds a rectangular prism, one layer at a time, saying how many blocks are in each layer.
      - Ask for the total before they count every block.
      - Rebuild the same blocks into a different prism. Ask if the volume changed.
  - title: Box measure
    time: 15 minutes
    materials: Three small boxes, a ruler
    covers: [S1.6, S1.7, S1.1]
    steps:
      - Your child measures the length, width and height of each box, to the nearest centimetre.
      - They estimate which box has the greatest volume, then calculate each one in cm³.
      - Compare the answers with the estimates.
questions:
  - How many cubes are in one layer? How many layers are there?
  - Why do we multiply three numbers for volume, but only two for area?
  - If you rearranged these cubes into another shape, would the volume change?
  - Which unit would you use for this, cm³ or m³? Why?
misconceptions:
  - thought: '"I can only count the cubes I can see."'
    why: Pictures show the outside, and the hidden cubes are easy to forget.
    tryThis: Build the stack with real blocks, then take it apart layer by layer.
  - thought: '"A taller box always holds more."'
    why: Height is the easiest size to see.
    tryThis: Compare a tall narrow box with a short wide one by filling both with rice.
  - thought: '"Volume is measured in cm²."'
    why: Area units are the most recent ones they learned.
    tryThis: Hold up a flat square and a cube. Ask which one can be filled.
lookFor:
  - They count one layer, then multiply by the number of layers.
  - They include hidden cubes without being reminded.
  - They choose cm³ or m³ sensibly for an object.
  - They know two different prisms can have the same volume.
adapt:
  support:
    - Use real blocks for every problem at first.
    - Draw the base on grid paper, then stack blocks on it.
    - Start with prisms only 1 or 2 layers high.
  access:
    - need: hands
      tip: The lesson’s sliders and button build the prism. With blocks, your child can direct an adult.
    - need: language
      tip: '"Base area" may be new. Point to the bottom layer and call it "the floor".'
    - need: attention
      tip: Building one layer at a time gives a short, finished task with each layer.
  stretch:
    - Find every whole-centimetre box with a volume of 24 cm³.
    - How many cubic centimetres fit in a cubic metre? Explain with layers.
together:
  - problem: d1
    how: Use small boxes in a bigger box, or draw the crate from above. Count how many fit along each edge.
  - problem: d2
    how: Use 36 blocks and try to build each design. Which shapes can you make?
