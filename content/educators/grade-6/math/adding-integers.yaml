id: adding-integers
subject: math
why: Zero pairs turn a set of sign rules into one picture that makes sense. A child who sees subtraction as adding the opposite has one idea to trust, not four rules to remember.
hook:
  title: The cancelling game
  time: 5 minutes
  covers: [K2.2, S2.1]
  body: |-
    1. Hold up 5 coins in one hand and say each is "+1".
    2. Hold up 5 paper slips in the other hand and say each is "−1, an IOU for one coin".
    3. Ask: **"If I give you all of these, how rich are you?"**
    4. Let your child argue. Then ask what happens with 5 coins and 3 IOUs.
activities:
  - title: Coins and IOUs
    time: 15 minutes
    materials: About 10 coins and 10 small paper slips marked IOU
    covers: [S2.3, S2.4, S2.5, K2.5]
    steps:
      - A coin is +1 and an IOU is −1. A coin and an IOU together are worth zero.
      - Call out a sum, like "4 + (−6)". Your child lays out the coins and slips, then pushes the zero pairs aside.
      - They say what is left, like "2 IOUs, so −2". Then swap roles.
      - 'Ask: "When will the answer be negative? Can you tell before you count?"'
  - title: Zero, ten ways
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S2.2, U2.1]
    steps:
      - Challenge your child to write zero as a sum in ten different ways.
      - After the easy ones, like 3 + (−3), ask for sums of three or four integers.
      - 'Then pick any number, like 4, and ask: "Can you write it as a sum that uses a negative number?"'
questions:
  - Before you work it out, will the answer be positive, negative or zero? How can you tell?
  - What is left over after the zero pairs go?
  - How could you write this subtraction as an addition?
  - Can you show the same sum on a number line?
  - Why does adding a negative number make the total smaller?
misconceptions:
  - thought: '"(−7) + 4 = −11."'
    why: They add the magnitudes, which works when both signs match, and then keep the sign of the first number.
    tryThis: Lay out 7 IOUs and 4 coins. Ask what happens to the 4 coins.
  - thought: '"Subtracting always makes a number smaller."'
    why: That was true for every subtraction they did before Grade 6.
    tryThis: Take away 2 IOUs from a pile of 3 coins and 2 IOUs. Ask if the pile got richer or poorer.
  - thought: '"2 − 5 can’t be done."'
    why: In earlier grades they were told you can’t take a bigger number from a smaller one.
    tryThis: Walk it on a number line or a staircase. Start at 2 and take 5 steps down.
lookFor:
  - They predict the sign of a sum before working it out.
  - They split a number to make a zero pair, such as 5 = 3 + 2.
  - They rewrite a subtraction as adding the opposite without being asked.
  - They check an answer by drawing arrows on a number line.
adapt:
  support:
    - Use real objects, coins and IOUs, until the counter picture is steady.
    - Keep the numbers to 10 or less at first.
    - Write every negative number in brackets, like (−3), so the sign and the operation don’t blur together.
  access:
    - need: reading
      tip: Read \((-3)\) as "negative three", and the − between numbers as "minus" or "take away". Two words for two jobs.
    - need: writing
      tip: Your child can move counters and say the sum. You write what they say.
    - need: hands
      tip: In the lesson, the sliders and buttons work with a keyboard. At the table, your child can direct you to move the coins.
    - need: worry
      tip: Predicting the sign first makes a quick, low-stakes guess. Celebrate a good reason, even when the guess is wrong.
  stretch:
    - Find four different integers, two positive and two negative, that add to −1.
    - Is the difference between two negative numbers always negative? Find examples to test it.
together:
  - problem: d1
    how: Use coins and IOUs. Your child builds the four numbers and checks that everything cancels.
  - problem: d2
    how: Draw a tall thermometer on paper and mark both temperatures. Count the degrees between them before writing any sums.
