subject: math
promise: |-
  We hope your child leaves Grade 6 seeing math as a set of ideas that fit together, not a pile of rules.

  - Negative numbers, fractions, ratios and equations all sit on the same number line.
  - A calculator can find an answer. Knowing which calculation the situation needs, and whether the answer makes sense, is the part only they can do.
shifts:
  - instead: Teaching a rule, such as "flip the sign", and drilling it.
    tryThis: Start with a picture or a story, such as a thermometer, a recipe or a bus schedule. Let the rule come out of it.
  - instead: 'Asking "What’s the answer?"'
    tryThis: 'Asking "How could you check that? Is there another way to see it?"'
  - instead: Moving on as soon as the answer is right.
    tryThis: 'Asking "What would change if…?" One small change shows whether the idea is really there.'
  - instead: Treating a wrong answer as something to erase.
    tryThis: Asking what rule your child was following. Most wrong answers come from a sensible rule used in the wrong place.
  - instead: Making problems harder with bigger numbers.
    tryThis: Keeping the numbers friendly and changing the question. Work backwards, find every answer, or spot a mistake.
routines:
  - name: Estimate first
    time: 2 minutes
    how: |-
      1. Before any calculation, ask for an answer that is too small and one that is too big.
      2. Then ask for one that is about right.
      3. Check whether the real answer lands between them.
  - name: Which one doesn’t belong?
    time: 5 minutes
    how: |-
      1. Show four numbers, expressions or shapes, such as 12, 2³, 3², 18.
      2. Ask which one doesn’t belong, and why.
      3. Any answer with a good reason is right, so it’s safe for a child who fears being wrong.
  - name: Two ways
    time: 5 minutes
    how: |-
      1. Solve one problem together.
      2. Ask for a second way that gets the same answer, such as a picture, a number line or a table.
      3. Ask which way they would trust more, and why.
  - name: Hide the question
    time: 5 minutes
    how: |-
      1. Read a story problem aloud with the question covered.
      2. Ask what is going on, and what might be asked.
      3. Reveal the question. This stops the habit of grabbing numbers and guessing an operation.
  - name: Teach it back
    time: 5 minutes
    how: |-
      1. Pretend you are confused, or bring in a stuffed animal who is.
      2. Your child explains the idea.
      3. Whatever they can’t explain shows you what to go back to.
assess:
  - They can explain their answer in their own words, or show it with a drawing or a number line.
  - They catch their own mistake because an answer doesn’t make sense.
  - They can solve the same problem a second way.
  - They keep trying for a few minutes when they are stuck, and they can say what they have already tried.
sources:
  - label: 'NRICH: using low-threshold, high-ceiling tasks'
    url: https://nrich.maths.org/7701
  - label: 'University of Waterloo CEMC: Problem of the Week'
    url: https://cemc.uwaterloo.ca/resources/potw
  - label: 'Peter Liljedahl: Building Thinking Classrooms'
