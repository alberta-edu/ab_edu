id: shape-action-reaction
subject: science
why: Choosing the right material is half of good design, and it starts with asking whether a change should spring back or stay. Newton’s Third Law explains how swimmers, rockets and walkers all move, by pushing something else the other way.
hook:
  title: Push the wall
  time: 5 minutes
  covers: [K3.2, U3.1]
  body: |-
    1. Have your child stand on a skateboard or in sock feet on a smooth floor, facing a wall.
    2. Ask them to push the wall gently, then a bit harder.
    3. Ask: **"You pushed the wall. So what pushed you?"** Leave the question open.
activities:
  - title: Spring back or stay?
    time: 10 minutes
    materials: A rubber band, a paper clip, a lump of play dough or clay, a kitchen sponge, a piece of aluminum foil
    covers: [S2.2, S2.1, K2.1, K2.2]
    steps:
      - Before testing, your child predicts for each object whether it will spring back or stay changed.
      - Stretch, bend or squeeze each one a little, then let go. Sort them into two piles, temporary and permanent.
      - 'Ask: "Which of these would make a good trampoline? A good sculpture?"'
  - title: Balloon rocket race
    time: 15 minutes
    materials: Balloons, a long piece of string, a straw, tape, two chairs
    covers: [S3.1, K3.1, K3.2, K3.3]
    steps:
      - Thread the string through the straw and tie it between two chairs. Tape a blown-up balloon to the straw.
      - Let go, and watch which way it zooms compared with the air rushing out.
      - Draw it together with two arrows, one on the air and one on the balloon, the same length.
      - Turn the balloon around and predict the new direction before letting go.
questions:
  - When you push the wall, what pushes you back?
  - Is a bigger push always matched by a bigger reaction? How could we check?
  - Would you make a trampoline from an elastic or a plastic material? What about a sculpture?
  - How does a swimmer move forward by pushing water backward?
  - Can something push back without trying or moving?
misconceptions:
  - thought: '"Only things that move can push back."'
    why: A wall looks like it does nothing, so it seems to have no force.
    tryThis: Push the wall on a skateboard or in sock feet. The reaction rolls you backward.
  - thought: '"The stronger thing pushes harder."'
    why: In daily life, the bigger person seems to win a push.
    tryThis: Run the scooter-board experiment again and point at the arrows. They are always the same size.
  - thought: '"Elastic means stretchy, and plastic means made of plastic."'
    why: Both words have everyday meanings that are different from the science meanings.
    tryThis: Use "springs back" and "stays changed" until the science words stick. A plastic spoon can even bend and spring back.
lookFor:
  - They name both forces in an interaction and say which object each one acts on.
  - They draw action and reaction arrows the same length, pointing opposite ways.
  - They choose elastic or plastic materials by what the job needs.
adapt:
  support:
    - Start with the stretch test and the card sort before any action and reaction.
    - Use a two-column chart for every interaction, "Who pushes?" and "Who pushes back?".
    - Act out the scooter-board push with palms together, standing up.
  access:
    - need: reading
      tip: Read the action and reaction table aloud and have your child act out each row.
    - need: hands
      tip: Pre-stretch or pre-bend the objects for your child, and let them call out "springs back" or "stays changed".
    - need: worry
      tip: Pushing games can feel risky. Keep them gentle, on soft floors, and make it fine to sit out and be the judge.
    - need: language
      tip: Pair "action" with pointing forward and "reaction" with pointing back. Keep the arrows in every drawing.
  stretch:
    - Explain how a rocket in space can move with nothing to push against except the gas it pushes out.
    - Find three objects at home that need elasticity, and three that need plasticity.
together:
  - problem: d1
    how: |-
      - Do the balloon rocket for real if you can, then answer each part.
      - After each part, ask your child to draw the two arrows.
  - problem: b3
    how: |-
      - Try Owen’s push yourselves, in sock feet on a smooth floor.
      - Ask what the wall did to you, and how you know.
