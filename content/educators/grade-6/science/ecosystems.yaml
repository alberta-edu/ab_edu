id: ecosystems
subject: science
why: Seeing an ecosystem as connected parts helps a child predict what a change will do, not just name what is there. A dry year, a drained wetland or a missing decomposer all ripple outward.
hook:
  title: Pull one thread
  time: 5 minutes
  covers: [K1.4, U1.1]
  body: |-
    1. Ask: **"What would happen to the ducks at a pond if it stopped raining for a whole year?"**
    2. Whatever they say, ask: **"And then what?"** two or three times.
    3. Keep their chain. You’ll compare it with the virtual experiment.
activities:
  - title: Backyard ecosystem survey
    time: 20 minutes
    materials: A magnifying glass, a phone camera, paper and a pencil
    covers: [S1.2, K1.8, K1.2, K1.3]
    steps:
      - Choose a small patch outside, such as a corner of the yard, a park bed or under a tree.
      - 'Make two lists: biotic and abiotic. Use the magnifying glass for tiny animals and the camera instead of collecting.'
      - Lift one rock or log gently, look, and put it back exactly where it was.
      - Draw arrows between three things on your lists that affect each other.
  - title: Jar model
    time: 20 minutes to build, then a few minutes a week
    materials: A clean jar with a lid, soil or pond mud, small plants, water
    covers: [S1.4, K1.1, K1.3]
    steps:
      - Build a small sealed garden or pond model, and name its biotic and abiotic parts.
      - Keep it near a window. Each week, record one change.
      - 'Ask: "What is our model missing compared with a real ecosystem?"'
questions:
  - Name a way an abiotic part affects a biotic part in our neighbourhood.
  - What would happen if every decomposer disappeared?
  - Why might a large forest have more kinds of animals than a small park?
  - How is protecting a wetland a way of fighting climate change?
  - How can we study animals without disturbing them?
misconceptions:
  - thought: '"Abiotic parts don’t matter as much as living things."'
    why: Living things are more interesting to watch.
    tryThis: Run the dry-year experiment. Water, an abiotic part, decided what happened to everything else.
  - thought: '"Each animal only depends on what it eats."'
    why: Food chains from Grade 3 show one link at a time.
    tryThis: Ask what the ducks need besides food. Shelter, water and nesting places all count.
  - thought: '"Micro-organisms are just germs."'
    why: Children mostly hear about bacteria that make people sick.
    tryThis: Introduce decomposers as nature’s recyclers, and look at a rotting log or compost.
lookFor:
  - They sort parts into biotic and abiotic, and justify tricky ones like dead leaves or mushrooms.
  - They describe an indirect effect, with at least two steps.
  - They compare two ecosystems using characteristics, not just "it’s hotter".
adapt:
  support:
    - Start with the figure and name one biotic and one abiotic part at a time.
    - Use the dry-year experiment twice, naming the direct and indirect effects the second time.
    - Compare just two ecosystem types before the full table.
  access:
    - need: reading
      tip: The ecosystem table is wide. Look at one row and find a picture of that ecosystem together.
    - need: hands
      tip: For the survey, your child can direct while you lift and photograph.
    - need: attention
      tip: The outdoor survey is short and active. Set a timer and look for five biotic parts as fast as possible.
    - need: language
      tip: Pair "biotic" with "bio" in biology, meaning life. "A" at the front means not.
  stretch:
    - Compare two ecosystems you have visited using all five characteristics.
    - Draw a web of at least eight parts of one ecosystem with arrows, and label each arrow.
together:
  - problem: d1
    how: |-
      - If you built a jar model, use it for every part.
      - Ask your child to predict what Ivy’s jar would look like after a month in the dark.
  - problem: b2
    how: |-
      - Read the table row by row and ask which row is abiotic.
      - Then trace the chain from that row to the birds.
