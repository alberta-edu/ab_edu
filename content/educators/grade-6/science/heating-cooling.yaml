id: heating-cooling
subject: science
why: Temperature stops being a number on a screen and becomes something happening to particles. A child who can picture that can explain melting, boiling and frost without memorizing three separate facts.
hook:
  title: The disappearing ice cube
  time: 5 minutes
  covers: [K1.6, K1.5]
  body: |-
    1. Put an ice cube in a sealed sandwich bag. Let your child feel how heavy it is.
    2. Ask: **"When it melts, will the bag be heavier, lighter or the same?"**
    3. Don’t answer. Leave the bag on the counter, and come back after the lesson.
activities:
  - title: Weigh the melt
    time: 10 minutes, plus waiting
    materials: A kitchen scale, a sealed bag or jar, a few ice cubes
    covers: [S1.3, K1.6]
    steps:
      - Weigh the sealed bag of ice and write the mass down together.
      - 'Before it melts, ask: "What has to stay the same for this to be a fair test?" Aim for the same bag, the same scale, and nothing in or out.'
      - Weigh it again once all the ice has melted. Wipe off any drops on the outside first, since those came from the air.
      - 'Ask: "The water looks like less. Why is the mass the same?"'
  - title: Be the particles
    time: 10 minutes
    materials: Some open floor space and a few family members
    covers: [K1.1, K1.2, K1.3, K1.4, S1.2]
    steps:
      - Everyone stands close, arms linked, and sways in place. You are ice.
      - 'Call out "Heat!" Everyone moves a little faster, unlinks and slides past each other. Now you are water.'
      - 'Call "More heat!" and everyone spreads out and walks quickly in all directions. Then call "Cool!" and come back together.'
      - 'Ask: "What happened to the spaces between us each time?"'
questions:
  - What is really different about the particles in a hot mug and a cold one?
  - Does 0 °C mean there is no temperature? How do you know?
  - Ice turns into water and the water looks like less. Is it less matter? How could we check?
  - Why do you think scientists chose water to set up the Celsius scale?
  - What would you have to keep the same to prove that mass doesn’t change when something melts?
misconceptions:
  - thought: '"Heat makes the particles get bigger."'
    why: Things that are heated often take up more room, so it seems the pieces themselves must grow.
    tryThis: Use the slider and count. The same number of particles, the same size, but more space between them.
  - thought: '"When ice melts, some of it disappears."'
    why: A puddle looks like much less than a block of ice, and water spreads out thin.
    tryThis: Weigh it in a sealed bag before and after. Let the scale make the argument.
  - thought: '"At 0 °C, things have no temperature."'
    why: Zero usually means none, as with zero apples.
    tryThis: Point out that people chose to put zero at water’s freezing point. Then show ice at −20 °C on the slider, still vibrating.
  - thought: '"Cold gets added to things in the freezer."'
    why: We talk about cold as if it were a thing, like "let the cold in".
    tryThis: Describe cooling as particles slowing down. Ask what happened to the particles, not what got added.
lookFor:
  - They explain a change of state by what the particles do, not just by naming the change.
  - They say faster or slower when they talk about a higher or lower temperature.
  - They insist that nothing gets in or out before they believe a mass result.
adapt:
  support:
    - Use only water and three temperatures at first, such as −20 °C, 25 °C and 120 °C on the slider.
    - Act out the particles before naming any phase change.
    - Say the pattern aloud together, "Hotter, faster, further apart", before the table.
  access:
    - need: reading
      tip: Read the phase change table aloud, one row at a time, and let your child point to the matching box of particles.
    - need: hands
      tip: The slider’s jump buttons (−20 °C, 0 °C, 25 °C, 100 °C, 120 °C) work with one tap or the keyboard, so dragging isn’t needed.
    - need: attention
      tip: Start the sealed-bag ice cube before the lesson. Checking on it gives a natural break halfway through.
    - need: language
      tip: Pair each word with a gesture. Wiggle in place for solid, slide hands past each other for liquid, and fling arms wide for gas.
    - need: worry
      tip: The melting prediction splits adults too. Make a guess yourself and be happy if you are wrong.
  stretch:
    - Use the slider to find the two temperatures where water changes state. Why might the Celsius scale use exactly those two?
    - Design a fair test to show that mass stays the same when chocolate melts. What would you keep the same?
together:
  - problem: d1
    how: |-
      - Before part 1, cover the choices and ask your child to predict the mass.
      - After part 3, ask them to tell the story of the bag in particles, from start to finish.
  - problem: b3
    how: |-
      - For each plan, list together everything that changed between the two weighings.
      - The fair plan is the one with only one item on its list.
