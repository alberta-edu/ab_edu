id: hypotheses-evidence
subject: science
why: Being wrong in a testable way is how science moves forward. A child who can turn a hunch into a testable hypothesis, and judge which evidence to trust, is protected against a lot of nonsense.
hook:
  title: Prove me wrong
  time: 5 minutes
  covers: [K1.2, K1.3]
  body: |-
    1. Make a bold claim, such as **"Ice cubes melt faster in the fridge than on the counter."**
    2. Ask: **"How could you prove me wrong?"**
    3. Then make an untestable claim, such as **"My socks are secretly happy."** Ask the same question, and enjoy the silence.
activities:
  - title: Hypothesis lab
    time: 20 minutes
    materials: Ice cubes, two plates, salt, a timer
    covers: [S1.2, K1.3, K1.4, K2.1]
    steps:
      - Ask what your child already knows about salt and ice, such as salt on winter sidewalks.
      - Write a hypothesis together, such as "Salted ice melts faster than plain ice."
      - Test it with two equal ice cubes on two plates, salt on one. Time both.
      - Decide whether the evidence supports or contradicts the hypothesis.
  - title: Trust ranking
    time: 10 minutes
    materials: Four made-up claims about the weather, from different sources
    covers: [S2.3, K2.3]
    steps:
      - Write four sources, such as a 30-year weather record, one photo, a friend’s memory and a guess.
      - Your child ranks them from most to least trustworthy, using the four questions from the lesson.
      - Swap and defend the rankings.
questions:
  - What makes a hypothesis testable?
  - Is a hypothesis that turns out wrong a failure? Why not?
  - What do you already know that could help you make a hypothesis about melting ice?
  - How could your feelings sneak into your results?
  - Why do scientists trust 30 years of measurements more than one month?
misconceptions:
  - thought: '"A hypothesis is just a guess."'
    why: Many people describe it as an educated guess.
    tryThis: Point out that a hypothesis is a proposed explanation that uses what you already know, and that it must be testable.
  - thought: '"If the evidence contradicts my hypothesis, the experiment failed."'
    why: Being wrong feels bad.
    tryThis: Celebrate the Moon shadow result. The wrong hypothesis was tested and ruled out, which is real progress.
  - thought: '"Evidence I saw myself is always best."'
    why: Seeing is believing.
    tryThis: Compare one backyard rain gauge for one month with 30 years of records. Ask which would fool you less.
lookFor:
  - They say what result would prove their hypothesis wrong.
  - They base hypotheses on something they already know.
  - They ask how evidence was measured and how much there is before trusting it.
adapt:
  support:
    - Start with the testable or not card sort before writing hypotheses.
    - Use the sentence frame "If I change ___, then ___ will happen, because ___."
  access:
    - need: reading
      tip: Read the five-step table aloud with the Moon example, and point at the animation as you go.
    - need: worry
      tip: Make wrong hypotheses something to celebrate. Share one you got wrong yourself.
    - need: writing
      tip: Hypotheses can be spoken and recorded on a phone instead of written.
    - need: language
      tip: Pair "supports" with a thumbs up and "contradicts" with a thumbs down.
  stretch:
    - Write a testable hypothesis about hours of daylight, and check it with sunrise and sunset times for a month.
    - Find a claim in an ad, and rewrite it as a testable hypothesis.
together:
  - problem: d1
    how: |-
      - Before part 2, ask your child what result would contradict Max.
      - Look up the date Earth is closest to the Sun together.
  - problem: b2
    how: |-
      - Ask how Rosa could make her records fair.
      - Measure two real objects by eye, then with a ruler, and compare.
