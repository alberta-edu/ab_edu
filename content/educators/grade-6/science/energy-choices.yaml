id: energy-choices
subject: science
why: Energy choices are argued about in Alberta every day, at kitchen tables and in the news. A child who can name the factors and weigh trade-offs can join that conversation fairly, without villains.
hook:
  title: Where did that come from?
  time: 5 minutes
  covers: [K2.6, S2.4]
  body: |-
    1. Walk through the home together and point at things that use energy: the stove, the furnace, a lamp, the car.
    2. For each one, ask: **"What is it using, just as it is found, or changed into something first?"**
    3. Don’t settle the answers yet. Keep the list for later.
activities:
  - title: Energy detective walk
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K2.6, S2.4, S2.2]
    steps:
      - 'Make four columns: heating and cooling, lighting, cooking, transportation.'
      - Walk around the home or neighbourhood and list every energy use you can spot in the right column.
      - Beside each one, write B for before processing or A for after processing.
      - 'Ask: "Which column has the most? Why do you think so?"'
  - title: Town council
    time: 15 minutes
    materials: Four cards labelled availability, societal, economic and environmental
    covers: [K1.1, S1.1, U1.1]
    steps:
      - Choose a made-up town and a decision, such as building a wind farm or a natural gas plant.
      - Each person draws a factor card and argues one advantage and one disadvantage from that point of view.
      - Swap cards and argue again. Then vote, and say which factor mattered most to you.
  - title: Sail cart challenge
    time: 20 minutes
    materials: A toy car, paper, straws, tape, and a piece of cardboard to fan with
    covers: [S2.5, K2.2]
    steps:
      - Design a sail and attach it to the car. Fan it and measure how far it goes.
      - Change one thing at a time, such as the sail’s size or shape, and test again.
questions:
  - Which energy resources does our home use before processing? After?
  - Why can electricity do so many different jobs?
  - Is there a resource with only advantages? Try to find one.
  - What should happen to land after a mine closes?
  - Why might a town choose more than one resource?
misconceptions:
  - thought: '"Electricity is an energy resource, like coal or wind."'
    why: It comes out of the wall, so it seems like a source.
    tryThis: Follow it back. Ask what made the electricity, and point out that it is the result of processing another resource.
  - thought: '"One resource is the good one and the others are bad."'
    why: News and ads often take one side.
    tryThis: Ask for one advantage and one disadvantage of every resource, including a favourite.
  - thought: '"Natural means used before processing."'
    why: Natural gas sounds untouched.
    tryThis: Ask what happens to it between the ground and the furnace. It is cleaned and piped first.
lookFor:
  - They say whether a resource is used before or after processing, with a reason.
  - They name more than one factor when explaining an energy choice.
  - They describe what responsible management looks like after a resource is taken.
adapt:
  support:
    - Start with only wind, wood and electricity before adding fossil fuels and biofuel.
    - Use the card sort several times, until your child can explain every card.
    - Keep the four factors on a sticky note as questions to ask.
  access:
    - need: reading
      tip: Read the Alberta table aloud and turn each row into one spoken sentence.
    - need: writing
      tip: In the detective walk, your child can take photos or draw icons instead of writing words.
    - need: worry
      tip: Energy can feel personal, since some families work in oil, gas or renewables. Keep every resource as having trade-offs, with no blame.
    - need: language
      tip: Say "used as it is" for before processing and "changed first" for after processing until the terms stick.
  stretch:
    - Compare how a cabin and a city apartment meet the same four energy needs.
    - Design a device that uses water before processing, such as a water wheel that lifts a small load.
together:
  - problem: d2
    how: |-
      - Cover the choices. Ask your child to find each option’s weakest row in the table.
      - Then ask how the other option helps with that weakness.
  - problem: b2
    how: |-
      - Ask what the table can tell you and what it can’t.
      - Point out the year, and talk about why newer data would matter.
