id: space-exploration
subject: science
why: Satellites shape daily life, from weather forecasts to maps on a phone, and Alberta students have built one. Weighing the barriers to living in space is practice in thinking about a hard problem from several sides at once.
hook:
  title: Spot the space station
  time: 10 minutes, on a clear evening
  covers: [K2.7, K2.5]
  body: |-
    1. Look up when the ISS will pass over your town, using a site such as NASA’s Spot the Station.
    2. Go outside together and watch for a bright, steady dot crossing the sky in a few minutes.
    3. Ask: **"It isn’t a star. What could it be, and why is it shining?"**
activities:
  - title: Satellite in a day
    time: 10 minutes
    materials: A ball for Earth, a small toy for the space station, a second ball for the Moon
    covers: [K2.2, K2.3, S2.2]
    steps:
      - One person walks the toy space station quickly around the Earth ball, close in.
      - Another walks the Moon ball slowly, far away.
      - Count how many laps the station makes while the Moon goes a short way. Ask which is natural and which is artificial.
  - title: Mission planners
    time: 20 minutes
    materials: Paper and a pencil
    covers: [S2.1, S2.3, K2.1]
    steps:
      - Choose a destination, such as Mars, Saturn’s rings or the far side of the Moon.
      - Choose the best technology for it from the lesson’s table, and say why.
      - List one barrier of each kind, personal, societal, technological and environmental, and one way to deal with it.
questions:
  - Is the Moon a satellite? How do you know?
  - Which space technology would you choose to study a faraway moon, and why?
  - What would be hardest for you about living on the space station?
  - What do you think Ex-Alta 1’s designers had to learn first?
  - How has new technology changed what we know about other planets?
misconceptions:
  - thought: '"Satellites are only machines."'
    why: In everyday talk, "satellite" usually means a machine like a satellite dish or GPS.
    tryThis: Go back to the definition. Anything that orbits a larger object is a satellite, so the Moon counts.
  - thought: '"Astronauts float because there is no gravity in space."'
    why: Floating looks like gravity has switched off.
    tryThis: Keep it simple at this grade. Say astronauts experience near weightlessness, and save the reasons for later.
  - thought: '"Satellites make their own light."'
    why: A moving dot in the night sky looks like it glows.
    tryThis: Ask whether the ISS is visible at midnight in the middle of winter, and why it’s easiest to see near dusk and dawn. It reflects sunlight.
lookFor:
  - They classify the Moon and the ISS correctly and explain the difference.
  - They match a technology to a job, with a reason.
  - They name barriers of different kinds, not just "it’s dangerous".
adapt:
  support:
    - Start with the virtual experiment and the two kinds of satellites only.
    - Use the barrier table as four sorting boxes, and sort example cards into them.
  access:
    - need: reading
      tip: The technology table has many long words. Read one row, then look at a photo of that technology together.
    - need: worry
      tip: Some children worry about astronauts’ safety. Talk about how each barrier is solved, not just what it is.
    - need: language
      tip: Pair "natural" with a leaf and "artificial" with a gear, and use the icons when sorting satellites.
  stretch:
    - Find out what one Canadian satellite does, and present it.
    - Design a daily schedule for an astronaut that deals with at least two kinds of barriers.
together:
  - problem: d1
    how: |-
      - Act as mission planners together. Your child leads, and you ask "What could go wrong?"
      - At the end, add one barrier of your own.
  - problem: b4
    how: |-
      - If you can, go outside to look for the ISS together.
      - Ask what is making it shine.
