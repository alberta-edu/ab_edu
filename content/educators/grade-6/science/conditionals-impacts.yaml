id: conditionals-impacts
subject: science
why: Conditionals are how devices respond to the world, from automatic doors to video games. Thinking about impacts, planned and unplanned, helps children become thoughtful users and makers of technology.
hook:
  title: Simon says, with conditions
  time: 5 minutes
  covers: [K1.8]
  body: |-
    1. Play a version of Simon Says with rules like **"If I touch my head, then clap. Else, stamp."**
    2. Speed up, and add a loop: **"Repeat until I say stop."**
    3. Ask: **"How did you know what to do each time?"**
activities:
  - title: Be the robot
    time: 15 minutes
    materials: Five cups, some with a little water and some empty, a pitcher
    covers: [S1.4, K1.6, K1.7, K1.8]
    steps:
      - Write the robot’s code on paper. Repeat 5 times, move to the next cup, if empty then fill it, else skip it.
      - Your child follows the code exactly, as a robot would, while you watch for mistakes.
      - Swap the cups around and run it again. Then change the code on purpose to make a bug.
  - title: Impact detectives
    time: 15 minutes
    materials: One technology your family uses every day, such as a phone, tablet or smart speaker
    covers: [K2.1, K2.2, S2.1, S2.2]
    steps:
      - List one personal, social, environmental and economic impact of that technology.
      - Mark each one positive or negative, and planned or unplanned.
      - Predict one impact of a technology that is coming, such as self-driving cars.
questions:
  - What would happen if a robot’s code had no conditionals?
  - Where do you see if-then-else in everyday devices?
  - Can a technology have a good impact for one person and a bad one for another?
  - What is an unintentional impact you have noticed from a technology?
  - How could designers predict impacts before a new app comes out?
misconceptions:
  - thought: '"The computer will figure out what I meant."'
    why: Apps often seem to read our minds.
    tryThis: Run Ana’s swapped clothing code on paper. A computer follows the code exactly.
  - thought: '"Technology is either good or bad."'
    why: News and adults often talk about it one way or the other.
    tryThis: Use the impact table. Find a positive and a negative impact for the same technology.
  - thought: '"Unintentional impacts are always bad."'
    why: Surprises from technology are often reported as problems.
    tryThis: Look for a happy accident, such as a game that unexpectedly helps someone learn to read.
lookFor:
  - They trace a program with a conditional and predict what happens for each case.
  - They name all three structures in a short program.
  - They predict impacts from more than one point of view.
adapt:
  support:
    - Play Be the robot before using the on-screen code.
    - Use the colours from the experiment, orange for loops, purple for conditionals and blue for actions.
  access:
    - need: reading
      tip: Read code blocks aloud as sentences, such as "If the soil is dry, then water it."
    - need: hands
      tip: In Be the robot, your child can give the instructions while you act as the robot.
    - need: attention
      tip: Keep each robot run short, five cups, and change one thing between runs.
    - need: language
      tip: Use "plan" and "surprise" alongside intentional and unintentional.
  stretch:
    - Write if-then-else code for a device at home, such as a fridge alarm, and test it with three situations.
    - Predict the impacts of one new technology from the points of view of three different people.
together:
  - problem: d1
    how: |-
      - Draw the feeder’s code as blocks on paper as you go.
      - Test it by acting it out with an empty and a full bowl.
  - problem: d2
    how: |-
      - Ask who might find the app hard to use.
      - Talk about how the city could plan for that.
