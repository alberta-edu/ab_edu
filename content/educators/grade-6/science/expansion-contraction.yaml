id: expansion-contraction
subject: science
why: Expansion explains things children see every day, from sagging power lines to sidewalk cracks. Water’s odd behaviour when it freezes shows that one exception to a rule can matter for every fish in a frozen lake.
hook:
  title: The sidewalk lines
  time: 5 minutes
  covers: [K3.7, S3.3]
  body: |-
    1. Walk along a sidewalk, or look at a photo of one. Point at the lines cut across it every few steps.
    2. Ask: **"Why would anyone cut lines into a brand new sidewalk?"**
    3. Collect every idea without judging. Come back to them after the lesson.
activities:
  - title: Bottle thermometer
    time: 20 minutes
    materials: A small plastic bottle, water, food colouring, a clear straw, modelling clay, two bowls (warm tap water and ice water)
    covers: [S2.2, S2.1, K2.1, S2.4]
    steps:
      - Fill the bottle to the top with coloured water. Push the straw through a lump of clay so the clay seals the bottle’s mouth.
      - Mark the level in the straw. Stand the bottle in ice water and wait, then mark that level 0 °C.
      - An adult pours warm tap water into the other bowl. Move the bottle there and watch the level rise.
      - 'Ask: "How would you make it move even further?" A narrower straw is a good answer.'
  - title: Ice detective
    time: 10 minutes, plus freezing time
    materials: A small plastic container filled to the brim with water, a glass of water, an ice cube
    covers: [K3.3, K3.4, S3.1]
    steps:
      - Before freezing, ask your child to predict what the full container will look like when it is frozen.
      - Freeze it overnight, then look at the top. The ice bulges above the rim.
      - Drop an ice cube into a glass of water. Ask, "What does floating tell us about ice and water?"
questions:
  - Why do you think bridges have gaps at the ends?
  - What would happen to a frozen lake if ice sank?
  - Most things contract when they cool. What is the exception, and why does it matter?
  - Why does a thermometer need such a narrow tube?
  - What would a safe thermometer experiment need?
misconceptions:
  - thought: '"Ice floats because it has air in it."'
    why: Ice cubes from the freezer are often cloudy with bubbles, and air is something that floats.
    tryThis: Clear ice floats too. Ask what happened to the space the water took up when it froze.
  - thought: '"Everything shrinks when it freezes."'
    why: Most matter does contract when it cools, so the rule feels universal.
    tryThis: Freeze a full container of water and look at the bulge. Water is the exception worth remembering.
  - thought: '"A thermometer measures how much heat is in the room."'
    why: The liquid moves when it is warmer, so it seems to collect heat.
    tryThis: Describe what the liquid is doing. It expands when warmed and contracts when cooled, and the scale turns that into a number.
lookFor:
  - They explain a thermometer reading by expansion or contraction, not by "it measures heat".
  - They use "less dense" rather than "lighter" when explaining why ice floats.
  - They spot gaps and joints in structures and say what they are for.
adapt:
  support:
    - Run the bottle thermometer experiment twice. The first time just watch, and the second time say what the particles are doing.
    - Hold up two fingers close together for cold particles, then spread them apart for warm particles.
    - Take the safety table as a checklist before any hands-on activity.
  access:
    - need: reading
      tip: The building table is dense. Read one row at a time and find a real example in a photo or on a walk.
    - need: writing
      tip: For the thermometer activity, let your child mark the straw with stickers instead of writing numbers.
    - need: hands
      tip: An adult can handle the bottle and hot water, while your child calls out where to mark the levels.
    - need: language
      tip: Pair "expand" with spreading your arms and "contract" with hugging yourself. Use the gestures every time the words come up.
  stretch:
    - Find three expansion joints or sidewalk lines near home, and explain each one to someone else.
    - 'Write a short "what if" story: what would winter be like if ice sank?'
together:
  - problem: d1
    how: |-
      - Before each part, ask your child to say what would happen on Earth, then what changes in the strange world.
      - At the end, ask what one property of water does for every fish in Alberta’s lakes.
  - problem: b3
    how: |-
      - Draw the straw on paper and mark 0 °C and 20 °C at the right heights.
      - Ask where 10 °C should go, and why halfway makes sense.
