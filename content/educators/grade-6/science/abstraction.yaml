id: abstraction
subject: science
why: Abstraction is how people tame complicated problems, by keeping what matters and setting the rest aside. It is used in maps, apps and science models, and it is a skill for life, not just for coding.
hook:
  title: Draw your route to school
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    1. Ask your child to draw a map from home to school that a visitor could follow, in two minutes.
    2. Look at what they drew and what they left out.
    3. Ask: **"Why did you leave out the trees? What would happen if you drew every house?"**
activities:
  - title: Keep or cut?
    time: 15 minutes
    materials: A photo of a busy place, such as a mall or park, and a pencil
    covers: [K1.1, S1.1, K1.3]
    steps:
      - Choose a job for a map, such as finding the washrooms or the exit.
      - List everything in the photo. Mark each item keep or cut for that job.
      - Draw the simplest map that still does the job, with straight lines for paths.
      - Change the job, and see how the keep list changes.
  - title: Abstraction hunt
    time: 10 minutes
    materials: Your kitchen and living room
    covers: [K1.4, S1.2]
    steps:
      - Find five controls that hide complicated parts, such as a microwave button, a remote or a thermostat.
      - For each one, say what it hides.
      - 'Ask: "Which one would you redesign, and what would you keep?"'
questions:
  - What is the difference between data and information?
  - What does a light switch hide from you?
  - When can removing details make a map worse?
  - What computer tools help your family meet a need?
  - How would you design an app that is simple but still useful?
misconceptions:
  - thought: '"Simpler is always better."'
    why: Abstraction sounds like "remove stuff".
    tryThis: Make a map that removes the wrong things, as in Leo’s hiking map, and try to use it.
  - thought: '"Abstraction is only for computers."'
    why: The word appears in coding lessons.
    tryThis: Point out abstractions everywhere, like recipes, maps, emoji and the steering wheel.
  - thought: '"Data and information are the same thing."'
    why: Both words describe facts.
    tryThis: Jumble a bus timetable, then sort it. The facts didn’t change, but now they are useful.
lookFor:
  - They choose details to keep based on the job, not on what is interesting.
  - They spot a pattern that lets one design work for many cases.
  - They name what an everyday control hides.
adapt:
  support:
    - Start with the bus map experiment, and pause after each layer disappears to ask why.
    - Use keep and cut cards for sorting details.
  access:
    - need: reading
      tip: The tables have short rows. Read the left column first, then guess the right column before reading it.
    - need: writing
      tip: For the keep or cut activity, circle and cross out on the photo instead of writing lists.
    - need: language
      tip: Use "keep, cut, same pattern" as everyday words for the three steps before the science words.
  stretch:
    - Design a simple app screen on paper for a need in your family, and explain what you left out.
    - Find a map that generalizes, such as a subway map, and compare it with the real streets.
together:
  - problem: d1
    how: |-
      - Before part 1, ask your child what question the app answers.
      - Use that question to test every piece of data.
  - problem: b4
    how: |-
      - Ask what a hiker needs. Then compare it with Leo’s map.
      - Talk about why simpler is not always better.
