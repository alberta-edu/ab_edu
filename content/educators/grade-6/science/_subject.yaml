subject: science
promise: |-
  We hope your child comes to ask "How do you know?", and to enjoy changing their mind when the evidence says so.

  - Grade 6 science asks children to explain, not just describe: why ice floats, why a skater rolls backward, why one study isn’t enough.
  - A good explanation can be tested. That idea runs through every topic this year.
shifts:
  - instead: Explaining the idea, then showing an experiment that proves it.
    tryThis: Getting a prediction first. On the site’s experiments, have your child commit to an answer before pressing Run, and say why.
  - instead: Accepting "because of heat" or "because of gravity" as an answer.
    tryThis: 'Asking "What are the particles doing?" or "Which forces, and which way?" Grade 6 explanations name the mechanism.'
  - instead: Treating a surprising result as a failed experiment.
    tryThis: Celebrating it. A result nobody expected is the most interesting thing that can happen, so ask what might explain it.
  - instead: Answering every question they ask.
    tryThis: 'Saying "How could we find out?" It’s also fine to say "I don’t know", and it shows that adults keep learning too.'
  - instead: Treating science facts as settled forever.
    tryThis: Sharing an idea scientists once believed and later refined, such as the tongue map. Ask what evidence changed their minds.
routines:
  - name: Predict, watch, explain
    time: 5 minutes
    how: |-
      Use it with any on-screen experiment:

      1. Predict, with a reason.
      2. Run it, and say what happened.
      3. Say why.

      A wrong prediction is the best part, so ask what they think now.
  - name: Who’s right?
    time: 5 minutes
    how: |-
      1. Describe two friends who disagree: "Ana says ice floats because it is light. Sam says it’s because ice is less dense than water."
      2. Your child decides who has the better reason, and what evidence would settle it.
  - name: Could we test it?
    time: 5 minutes
    how: |-
      Whenever someone offers an explanation, ask:

      - What would we see if it were true?
      - What would we see if it were wrong?
      - What would we change, and what would stay the same?
  - name: Science walk
    time: 15 minutes
    how: Go outside with one question, such as where the sidewalk has gaps or which plants grow in the shade. Come back with one thing noticed and one thing wondered.
assess:
  - They give a reason with their prediction, not just a guess.
  - They explain with a mechanism, such as particles, forces or light, rather than a label.
  - They spot when a test isn’t fair, or when one result isn’t enough.
  - They use the science word correctly without being asked, in a new situation.
