id: solar-system
subject: science
why: Most pictures of the solar system mislead us about size and distance. A child who has walked out a scale model, and who knows why Pluto was reclassified, understands both the solar system and how science updates itself.
hook:
  title: How far is Earth?
  time: 5 minutes
  covers: [K1.8, S1.6]
  body: |-
    1. Hold up a ball and say it is the Sun.
    2. Ask: **"If this is the Sun, how big is Earth, and where should I put it?"**
    3. Let your child place a pea or bead. Don’t correct it until after the scale model experiment.
activities:
  - title: Toilet paper solar system
    time: 20 minutes
    materials: A roll of toilet paper, a marker, a long hallway or outdoor space
    covers: [K1.8, S1.6, S1.1]
    steps:
      - Let one square stand for about 50 million km. Mark the Sun at the start.
      - Count out and mark each planet. Mercury is at about 1 square, Earth at 3, Jupiter at 16 and Neptune at 90.
      - Mark the main asteroid belt between Mars and Jupiter.
      - 'Ask: "What surprised you about the spaces?"'
  - title: Classify the sky
    time: 10 minutes
    materials: Pictures of celestial bodies from a book or website, such as NASA Science
    covers: [S1.2, S1.7, K1.2]
    steps:
      - Sort each picture into star, planet, moon, dwarf planet, asteroid, comet or meteoroid.
      - For each, say whether it emits or reflects light.
      - Find one that is hard to sort, and explain why.
questions:
  - Why is Pluto no longer called a planet? What didn’t change?
  - Why is Venus hotter than Mercury?
  - Why are pictures of the solar system almost never to scale?
  - Which bodies emit light, and which reflect it?
  - What has exploring other planets taught us about Earth?
misconceptions:
  - thought: '"The planets are close together, like in pictures."'
    why: Books and posters squeeze them onto one page.
    tryThis: Do the scale model. Earth ends up about a soccer field away from a 1 m Sun.
  - thought: '"Pluto was demoted because it was too small or did something wrong."'
    why: Losing planet status sounds like a punishment.
    tryThis: Look at the timeline together. New information about other objects changed how scientists sort them.
  - thought: '"Any bright light in the night sky is a star."'
    why: Stars and planets look alike to the eye.
    tryThis: Look for Venus or Jupiter with an app or star chart. They reflect sunlight.
lookFor:
  - They name the eight planets in order and place the asteroid belt.
  - They classify a new object by what it orbits, its shape and what it is made of.
  - They explain what a model shows well and what it gets wrong.
adapt:
  support:
    - Start with the explorer, one body a day.
    - Use the moose sentence, and act out each word.
    - Use the card sort before the table of definitions.
  access:
    - need: reading
      tip: The explorer card reads aloud well. Read one row at a time, and compare two bodies.
    - need: hands
      tip: The explorer list buttons are large and work with a keyboard. Tapping the tiny planets isn’t needed.
    - need: attention
      tip: The toilet paper model is active and funny. Use it as a movement break.
    - need: language
      tip: Make a picture card for each kind of celestial body, and keep them handy during practice.
  stretch:
    - Use a digital resource, such as NASA’s website, to compare two moons, and share three differences.
    - Find out what else, besides Pluto, is a dwarf planet.
together:
  - problem: d1
    how: |-
      - Make a three-question checklist together. What does it orbit? What shape is it? What is it made of?
      - Use it on each object.
  - problem: d2
    how: |-
      - For each statement, hunt for one body that breaks it.
      - Celebrate a good counterexample as much as a right answer.
