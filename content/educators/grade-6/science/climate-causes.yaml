id: climate-causes
subject: science
why: Climate change is in the news children hear every day. Knowing how sunlight, clouds, ice and greenhouse gases work together turns a scary headline into a system they can reason about, and act on.
hook:
  title: The blanket question
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. Ask: **"Why does a blanket keep you warm at night? Does it make heat?"**
    2. Let your child explain. The blanket only keeps in heat their body already makes.
    3. Ask: **"Could Earth have a blanket?"** Leave it open until after the experiment.
activities:
  - title: Shiny or dark?
    time: 20 minutes on a sunny day
    materials: Two identical cups of water, a sheet of white paper, a sheet of black paper, a thermometer if you have one
    covers: [K1.1, S1.1]
    steps:
      - Set one cup on white paper and one on black paper in the same sunny spot. Start them at the same temperature.
      - Predict which will warm faster. After 20 minutes, feel or measure both.
      - 'Ask: "Which one is like ice, and which is like dark ocean water? What does that mean for the Arctic?"'
  - title: Climate detectives
    time: 15 minutes
    materials: The lesson’s climate graphs
    covers: [K1.3, S1.1]
    steps:
      - Compare Edmonton with Vancouver, then with Iqaluit.
      - For each pair, name the one location factor that best explains the difference.
      - 'Ask: "Where would a city be warmer than the farms around it? Why?"'
questions:
  - What would Earth be like with no greenhouse gases at all?
  - Can something natural, like a volcano, change the climate? Which way?
  - Why might a city be warmer than the countryside around it?
  - Which personal action could your family take this week?
  - Why do you think melting ice can lead to even more melting?
misconceptions:
  - thought: '"Greenhouse gases are all bad."'
    why: News usually mentions them as a problem.
    tryThis: Remind them Earth would average about −18 °C without any. The trouble is adding more, not having some.
  - thought: '"If climate changed naturally before, people can’t be causing it now."'
    why: Two causes feel like they compete, so one must be wrong.
    tryThis: Ask whether a fire can start from lightning and also from a campfire. Both causes can be real.
  - thought: '"Closer to the Sun means warmer, so mountains should be hot."'
    why: The Sun is hot, so getting nearer seems like it should help.
    tryThis: Look at a photo of snow on summer mountain tops. Higher places are colder.
lookFor:
  - They explain warming with trapped heat, not just with "the Sun is stronger".
  - They name a location factor when comparing two places’ climates.
  - They sort causes as natural or human and give a reason.
adapt:
  support:
    - Act out the experiment. One person is the ground giving off heat, and the other bounces some back as the gases.
    - Start with only greenhouse gases before adding clouds and ice.
    - Use two places your child has visited to compare location factors.
  access:
    - need: reading
      tip: Read one row of each table at a time, and point to the matching part of the animation.
    - need: worry
      tip: Climate change can feel frightening. Spend as much time on clean energy and personal actions as on causes.
    - need: attention
      tip: The shiny or dark activity has a natural 20-minute wait. Use it for the climate graphs.
    - need: language
      tip: Use "blanket" for trapping heat and "mirror" for reflecting sunlight until the science words stick.
  stretch:
    - Explain why melting sea ice can cause even more warming, using the words reflect and trap.
    - Find out what your town or school does to use clean energy.
together:
  - problem: d1
    how: |-
      - Before each part, ask your child to say which way the temperature will go, and why.
      - For part 3, collect every answer that would work.
  - problem: d2
    how: |-
      - Ask what is good about each friend’s idea before deciding.
      - Talk about why Ana’s plan seems right at first.
