id: climate-change-effects
subject: science
why: Climate change can feel far away or overwhelming. Following one change to the next, from a shrinking glacier to a farmer’s irrigation, makes it concrete and shows that people are already responding.
hook:
  title: Follow the water
  time: 5 minutes
  covers: [K2.1, S2.1]
  body: |-
    1. Fill a glass of water from the tap. Ask: **"Where was this water a year ago?"**
    2. Follow it backward together, to a river, then to snow or a glacier in the mountains.
    3. Ask: **"What would happen to this glass if the glacier got smaller?"**
activities:
  - title: Chain reaction cards
    time: 15 minutes
    materials: Index cards and a pencil
    covers: [K2.1, K2.2, S2.1, S2.2]
    steps:
      - Write "Summers get hotter and drier" on the first card.
      - Take turns adding a card that follows from the one before, such as "Grass dries out", then "More fires".
      - Make a second chain for farming, starting from the same first card.
      - 'Ask: "Where do your two chains meet?"'
  - title: Dinosaur detectives
    time: 15 minutes
    materials: The lesson’s three theory cards, paper
    covers: [K2.4, S2.5]
    steps:
      - Read each theory aloud. Your child gives each one a "how sure are we?" rating from 1 to 5.
      - Share one clue at a time, such as the crater in Mexico or the lava in India. After each clue, rerate.
      - 'Ask: "Which clue changed your mind the most? Why?"'
questions:
  - How could a smaller glacier in the Rockies affect a farm on the prairies?
  - Why might a hunter’s trusted route over the ice stop being safe?
  - Why do some animals migrate at different times than they used to?
  - Which dinosaur theory do you find most convincing, and what evidence would change your mind?
  - How are communities like Tuktoyaktuk responding to rising seas?
misconceptions:
  - thought: '"A cold winter proves climate change isn’t real."'
    why: The cold is easy to feel, and climate is hard to see.
    tryThis: Remind them that climate is a 30-year pattern. Look at a climate graph rather than one day’s weather.
  - thought: '"Climate change only affects polar bears and faraway places."'
    why: Arctic pictures are common in the news.
    tryThis: Follow an Alberta river back to its glacier, and ask what that means for farms here.
  - thought: '"Scientists know exactly what killed the dinosaurs."'
    why: The asteroid story is told often, so it sounds settled.
    tryThis: Look at the three theories and ask what evidence supports each. Scientists still compare them.
lookFor:
  - They connect one effect of climate change to another.
  - They name a specific community and a specific effect, not a general "it’s bad".
  - They weigh evidence for each dinosaur theory instead of picking one by habit.
adapt:
  support:
    - Start with one effect at a time, using the experiment for sea level.
    - Use the chain reaction cards with only two or three cards.
    - Read the farming table as a story about one farm through one year.
  access:
    - need: worry
      tip: This topic can feel heavy. Name what people are doing, like moving houses inland, changing crops and tracking ice, as well as the problems.
    - need: reading
      tip: Read the Tuktoyaktuk and Nain columns aloud, then look at the communities on a map together.
    - need: language
      tip: Build a picture word wall for migration, irrigation, erosion and extinction.
  stretch:
    - Research how one northern, Inuit or coastal community in Canada is adapting to climate change.
    - Write a short news report from 66 million years ago, arguing for one dinosaur theory with evidence.
together:
  - problem: d1
    how: |-
      - Draw the chain as boxes and arrows as you go.
      - At the end, ask your child to add one more box of their own.
  - problem: b2
    how: |-
      - Look at Nain on a map first.
      - Ask what the sea ice is used for, and what happens when it changes.
