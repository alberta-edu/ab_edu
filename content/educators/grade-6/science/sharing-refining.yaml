id: sharing-refining
subject: science
why: Science is a way of checking, improving and sharing explanations. Knowing that wrong ideas get corrected, slowly and with evidence, helps children trust science for the right reasons.
hook:
  title: The tongue map test
  time: 5 minutes
  covers: [K4.3, S4.2]
  body: |-
    1. Ask if your child has heard that different parts of the tongue taste different things.
    2. Put a few grains of sugar on a clean cotton swab and touch it to the side or back of the tongue.
    3. Ask: **"Could you taste it there? What does that tell us about the old idea?"**
activities:
  - title: One idea, two audiences
    time: 20 minutes
    materials: A lamp, a ball, paper and markers
    covers: [S3.2, S3.4, K3.3, K3.4]
    steps:
      - Pick one phenomenon, such as the Moon’s phases.
      - Your child explains it once for a five-year-old, with the lamp and ball and everyday words.
      - Then they make a labelled diagram for a science fair judge, using science words.
      - 'Ask: "What did you change for each audience, and why?"'
  - title: Make a proper graph
    time: 20 minutes
    materials: Squared paper, a ruler, two colours, and some data such as daily high temperatures for a week
    covers: [S3.3]
    steps:
      - Choose a scale that starts at 0 and goes up in even steps.
      - Draw the bars, then add a title, axis labels and a legend if you use two colours.
      - Swap graphs with someone and check each other’s for all four parts.
questions:
  - Why did people once believe the eyes give off light? What evidence changed that?
  - If one new study disagrees with hundreds of others, what should scientists do?
  - How would you explain the same idea to a younger child and to a scientist?
  - What can a story or a drawing teach that a graph can’t, and the other way around?
  - What are the four parts of a good graph?
misconceptions:
  - thought: '"Scientists who believed wrong things were silly."'
    why: Knowing the answer now makes old ideas look obvious.
    tryThis: Ask what evidence people had at the time. Their explanations fit what they knew.
  - thought: '"If science changes its mind, we can’t trust it."'
    why: Changing your mind can look like being unreliable.
    tryThis: Point out that science changes because of evidence, carefully and slowly. That is why it gets better.
  - thought: '"Only written science counts."'
    why: Science at school often means textbooks and worksheets.
    tryThis: Look at the many ways explanations are shared, including stories, winter counts, models and planetarium shows.
lookFor:
  - They name what evidence led to a refined explanation.
  - They insist on more than one study before an explanation changes.
  - They change their words, detail and method for different audiences.
  - Their graphs have a title, labels, a scale and a legend when needed.
adapt:
  support:
    - Run the dark room experiment and talk about what the person saw each time.
    - Use one of the three refined explanations at a time.
    - Use a graph checklist with four tick boxes.
  access:
    - need: reading
      tip: The refined explanations table is dense. Read across one row as a short story, from old idea to evidence to new idea.
    - need: writing
      tip: For the two-audiences activity, explanations can be spoken and recorded.
    - need: hands
      tip: Graphs can be made with a spreadsheet or graphing app instead of squared paper.
    - need: language
      tip: Use "made better" for refined, and keep the word wall from earlier lessons in view.
  stretch:
    - Find another explanation that was refined by new evidence, and explain what changed.
    - Make the same data into a table and a graph, and say which suits which audience.
together:
  - problem: d1
    how: |-
      - Try the tongue test for real with sugar or salt on a swab.
      - Ask how many people you would need to test before you were sure.
  - problem: b1
    how: |-
      - Ask your child to count the studies on each side.
      - Talk about what scientists would do next with the new study.
