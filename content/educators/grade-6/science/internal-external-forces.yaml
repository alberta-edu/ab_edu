id: internal-external-forces
subject: science
why: Every bridge, chair and shoelace is holding forces we can’t see. Naming them, from a push outside to the tension or torsion inside, lets a child explain why things bend, slide, stretch or break.
hook:
  title: Four ways to wreck a sponge
  time: 5 minutes
  covers: [K1.1, K1.8, K1.10, K1.6]
  body: |-
    1. Hand your child a dry kitchen sponge.
    2. Ask: **"How many different ways can you change its shape with your hands?"**
    3. Watch for pulling, squashing, twisting and pushing the top and bottom opposite ways. Don’t name them yet.
activities:
  - title: Friction race
    time: 15 minutes
    materials: A toy car or a small box, a ruler or tape measure, a ramp such as a propped-up book, and three surfaces (tile, a towel, a rug)
    covers: [S1.1, K1.5, K1.4]
    steps:
      - Let the car roll down the same ramp onto each surface. The ramp gives the same push every time.
      - Measure how far it goes after the bottom of the ramp. Try each surface three times.
      - 'Ask: "Which surface gave the most friction? How do you know?"'
      - 'Then ask: "What did we keep the same, and why?"'
  - title: Force hunt
    time: 10 minutes
    materials: A walk through the house or schoolyard
    covers: [S1.2, K1.3, K1.1, K1.2]
    steps:
      - Look for objects with a force acting on them right now, such as a shelf, a clothesline, a door hinge or a bike chain.
      - For each one, name the force from outside first, then the force inside.
      - Score a bonus point for finding torsion, the hardest one to spot.
questions:
  - What is the difference between a force on an object and a force inside it?
  - Can one push cause more than one internal force? Show me with something you can bend.
  - Is friction always a nuisance? When do we need it?
  - Why do you think we need safety glasses when testing springs?
misconceptions:
  - thought: '"Friction only happens when things are rough."'
    why: Rough surfaces like sandpaper make friction easy to feel, and smooth ones seem to have none.
    tryThis: Slide a block on ice and on a smooth table. Both slow down eventually, so friction is still there, just less of it.
  - thought: '"Forces only matter when something moves."'
    why: Children notice forces when they make something start or stop.
    tryThis: Sit on a stool and ask what the legs are doing. Compression is at work even though nothing moves.
  - thought: '"Tension and compression are the same, just different words."'
    why: Both feel like "force on the object" and both change its shape.
    tryThis: Draw lines on a pool noodle and bend it. One side’s lines squeeze together and the other side’s spread apart.
lookFor:
  - They say whether a force acts from outside or inside an object.
  - They pick out every force in a story, not just the most obvious one.
  - They name what to keep the same before testing friction.
adapt:
  support:
    - Start with just two forces, applied force and friction, and add the internal forces one at a time.
    - Use the foam bar visual and the sponge side by side, so your child does each force with their hands as they watch it.
    - Give a gesture for each internal force, such as pulling, squeezing, sliding hands past each other and twisting.
  access:
    - need: reading
      tip: The tables are short but dense. Cover all but one row at a time and act each one out.
    - need: hands
      tip: Use a soft sponge or a pool noodle, which take very little strength to change shape.
    - need: attention
      tip: The friction race is a natural competition. Run it in short heats and record each heat before the next.
    - need: language
      tip: Make picture cards for the seven force words, with an arrow drawing on each, and keep them in sight during practice.
  stretch:
    - Find an object that has two internal forces at once, and explain where each one acts.
    - Design a fair friction test with a toy car, and predict the order of four surfaces before testing.
together:
  - problem: d1
    how: |-
      - Do it with a real pool noodle or a rolled-up towel marked with a pen.
      - Your child bends it and reads the answer off the lines before choosing.
  - problem: b3
    how: |-
      - Ask your child to list everything Kai changed.
      - Then ask how they would fix his test, using the virtual experiment as a guide.
