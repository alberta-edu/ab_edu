id: plants-and-animals
subject: science
why: Plants and animals trade what each other needs, from oxygen and carbon dioxide to food, shelter and clean water. Learning about sacred plants shows that respect and giving back are part of how many peoples relate to plants.
hook:
  title: The breath swap
  time: 5 minutes
  covers: [K3.2, K3.4]
  body: |-
    1. Have your child breathe out onto a cold window or mirror, then look at a house plant.
    2. Ask: **"You just gave that plant something. What was it?"**
    3. Ask: **"What does it give you back?"** Return to it after the jar experiment.
activities:
  - title: Plant hunt at home
    time: 15 minutes
    materials: Sticky notes
    covers: [K3.3, K3.2]
    steps:
      - Search the home for things that came from plants, such as food, clothing, paper, wood and medicine.
      - Put a sticky note on each, labelled with the need it meets.
      - 'Ask: "Which need did you find the most of? Which would be hardest to replace?"'
  - title: Erosion tray
    time: 15 minutes
    materials: Two trays of soil, one with grass sod or sprouted seeds, a watering can
    covers: [K3.1]
    steps:
      - Tilt both trays the same amount over a sink or outside.
      - Pour the same amount of water down each one.
      - Compare how much soil washes off. Ask what the roots were doing.
questions:
  - What do you give plants every time you breathe out?
  - Which roles do plants play in our neighbourhood?
  - Name three things you used today that came from plants.
  - Why might someone offer tobacco before harvesting a plant?
  - What makes a relationship with a plant sustainable?
misconceptions:
  - thought: '"Plants don’t breathe. They only make oxygen."'
    why: The swap is often taught as plants make oxygen and animals use it.
    tryThis: Ask what happens to the sealed jar in a dark closet. Plants use oxygen too, and only make extra in the light.
  - thought: '"Animals need plants, but plants don’t need animals."'
    why: Plants seem able to grow on their own.
    tryThis: Look at the carbon dioxide row in the jar experiment, and at bees on canola.
  - thought: '"Sacred tobacco is the same as cigarettes."'
    why: The same word is used for both.
    tryThis: Explain that ceremonial tobacco is offered with respect, while commercial tobacco in cigarettes harms health.
lookFor:
  - They describe the gas exchange in both directions.
  - They name several roles plants play, not just food.
  - They speak about sacred plants respectfully, and say teachings come from Elders and Knowledge Keepers.
adapt:
  support:
    - Run the jar experiment and talk about each jar separately before comparing.
    - Start the human needs table with food and clothing, which are easiest to see.
  access:
    - need: reading
      tip: Read the sacred plants section aloud slowly. If you can, invite a local Knowledge Keeper or use a resource from a local Nation.
    - need: hands
      tip: For the erosion tray, an adult can pour while your child watches and describes.
    - need: language
      tip: Use "give" and "take" arrows on a drawing of a person and a plant to show the gas swap.
  stretch:
    - Design a sealed jar that stays balanced. What would you put in it, and where would you keep it?
    - Find out which plants are important to a First Nation or Métis community near you, from a source they share.
together:
  - problem: d1
    how: |-
      - Before each part, ask what is missing or still there in the closet.
      - At the end, ask which part of the ecosystem was really in charge.
  - problem: b3
    how: |-
      - Read the meanings table together first.
      - Talk about a time your family gave thanks or gave back before taking something.
