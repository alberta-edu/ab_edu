id: tracking-climate
subject: science
why: A single hot day or cold snap tells us little. Children who learn to ask "compared with when?" and "says who?" can judge climate claims, and see that Elders’ knowledge and scientists’ data each fill gaps in the other.
hook:
  title: When you were my age
  time: 5 minutes
  covers: [K3.3, K4.1]
  body: |-
    1. Have your child ask an older relative or neighbour: **"What were winters like when you were my age?"**
    2. Listen for details: snow depth, when the lake froze, how cold it got.
    3. Ask: **"How could we check if that’s still true today?"**
activities:
  - title: Then and now
    time: 20 minutes
    materials: A weather website with historical data, such as Environment and Climate Change Canada’s past weather, and paper
    covers: [S3.1, K3.1, U3.1]
    steps:
      - Pick your town and one date, such as your child’s birthday.
      - Look up that date’s temperature this year and long ago. Then look up several years in between.
      - Make a simple table with a title and labelled columns.
      - 'Ask: "Is one year enough to tell? How many would you want?"'
  - title: Storm desk
    time: 10 minutes
    materials: A weather radar app or website
    covers: [K3.6, S3.3]
    steps:
      - Open a radar map on a rainy or snowy day and play the loop.
      - 'Ask: "Which way is it moving? When will it reach us?"'
      - Check later to see if your prediction came true.
questions:
  - Why isn’t one hot summer enough to prove the climate is changing?
  - What can an Elder’s memory tell us that a weather station can’t? And the other way around?
  - Which extreme weather events happen where you live?
  - How does radar help keep people safe?
  - How could people in your community work together to learn about local climate?
misconceptions:
  - thought: '"Written data is always more reliable than what people remember."'
    why: Numbers look exact and official.
    tryThis: Point out that records may be short or from far away, while an Elder may have watched the same place for 70 years.
  - thought: '"If this year was colder than last year, climate change has stopped."'
    why: Last year is easy to remember, so it seems like the right thing to compare with.
    tryThis: Look at the sea ice graph and compare 1979 with 2024, not just 2012 with 2024.
  - thought: '"Forecasters just guess."'
    why: Forecasts are sometimes wrong, so they seem like guesses.
    tryThis: Watch the radar experiment again. The prediction follows a measured pattern.
lookFor:
  - They ask how many years the evidence covers before trusting a claim.
  - They value both oral narratives and measured data, and say what each adds.
  - They match extreme weather events to places in Canada and around the world.
adapt:
  support:
    - Start with the radar experiment, which is short and concrete.
    - Use only the sea ice graph before the larger table of measurements.
    - Talk about one extreme weather event your family remembers.
  access:
    - need: reading
      tip: The extreme weather table is long. Read one row at a time and find each place on a map.
    - need: worry
      tip: Extreme weather can frighten children. Focus on how radar, satellites and warnings keep people safe.
    - need: language
      tip: Use a family member’s story as the oral narrative example, so the term connects to something real.
  stretch:
    - Make a labelled graph from 10 years of one weather measurement for your town.
    - Plan a way for students, Elders and a scientist to share what they know about one local lake or river.
together:
  - problem: d1
    how: |-
      - Talk about a real river or lake near you as you work through the parts.
      - At the end, ask who you could actually ask in your community.
  - problem: b1
    how: |-
      - Look at the graph together and agree on what each bar shows.
      - Ask what Jo would need to look at to make a fair claim.
