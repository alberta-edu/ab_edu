id: photosynthesis
subject: science
why: Every bite of food and every breath depends on leaves turning light into sugar. Once a child sees that a tree is built mostly from air and water, the living world looks different.
hook:
  title: Where did the tree come from?
  time: 5 minutes
  covers: [K2.1, K2.2]
  body: |-
    1. Point at a big tree. Ask: **"This tree started as a tiny seed. Where did all of this wood come from?"**
    2. Most children say the soil. Don’t correct it yet.
    3. Tell them about van Helmont’s willow at the end of the practice, and let the evidence surprise them.
activities:
  - title: Leaf in the dark
    time: 5 minutes to set up, then a week
    materials: A house plant, a strip of foil or dark paper, a paper clip
    covers: [K2.1, K2.4, S2.2]
    steps:
      - Clip the foil over part of one leaf, top and bottom. Leave the plant in its usual sunny place.
      - After a week, remove the foil and compare the covered part with the rest of the leaf.
      - 'Ask: "What did the covered part miss out on? What does that tell us about light?"'
  - title: Bubble watch
    time: 15 minutes on a sunny day
    materials: A clear glass of water and a fresh leaf from a tree or plant
    covers: [S2.3, K2.5]
    steps:
      - Put the leaf in the glass of water in bright sunlight.
      - After 10 to 15 minutes, look closely for tiny bubbles on the leaf.
      - 'Ask: "What gas do you think is in those bubbles? How could scientists check?"'
questions:
  - What does a plant need to make its own food?
  - Why do animals that never eat plants still depend on them?
  - How could you prove that a plant needs light?
  - Where did the starch in a potato come from, if potatoes grow in the dark?
  - Why do you think most leaves are green?
misconceptions:
  - thought: '"Plants get their food from the soil."'
    why: Plants grow in soil, and we add plant food to it.
    tryThis: Share van Helmont’s willow. The soil barely changed, but the tree gained about 75 kg.
  - thought: '"Plants breathe in carbon dioxide and animals breathe in oxygen, and that’s the difference."'
    why: The gas swap is often taught as a simple trade.
    tryThis: Point out the lesson’s line that plants also use oxygen for respiration. Photosynthesis is how they make food.
  - thought: '"Sunlight is food for plants."'
    why: Plants need the Sun, and people say plants "feed on sunlight".
    tryThis: Light is the energy. The food is the sugar the plant makes with it.
lookFor:
  - They name all three things plants use and both things plants make.
  - They design a light test that changes only the light.
  - They trace an animal’s food and oxygen back to plants.
adapt:
  support:
    - Use the leaf diagram as a recipe card, with three ingredients and two results.
    - Run the virtual experiment and pause after the bubbles, before the splint test.
    - Talk about a potato or a carrot as stored plant food.
  access:
    - need: reading
      tip: Read the "where it comes from" table aloud and point to each part on the leaf diagram.
    - need: writing
      tip: For the leaf-in-the-dark activity, take before and after photos instead of writing notes.
    - need: language
      tip: Split the word. "Photo" means light and "synthesis" means putting together.
  stretch:
    - Plan a test of whether the colour of light matters, and list what you would keep the same.
    - Explain to someone why a wolf depends on photosynthesis.
together:
  - problem: d2
    how: |-
      - Before showing the choices, ask your child to guess where the tree’s mass came from.
      - After solving, go back to their guess and talk about what the evidence changed.
  - problem: b2
    how: |-
      - Ask your child to list everything that was different between Nia’s two plants.
      - Then plan the fair version together.
