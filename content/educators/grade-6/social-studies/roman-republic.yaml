id: roman-republic
subject: social-studies
why: This topic shows a child why big places choose representatives instead of voting on everything. They learn to ask whether a system is fast, and whether it gives everyone a voice.
hook:
  title: The 600 km vote
  time: 5 minutes
  covers: [K1.11, K1.8]
  body: |-
    1. Say: **"From now on, every family decision needs a vote from Grandma."** Pick a relative who lives far away.
    2. Ask how long it would take to get her vote on what’s for dinner.
    3. Let your child invent a fix. Most children land on "someone votes for her".
    4. Say: **"That fix has a name, and the Romans used it 2,500 years ago."**
activities:
  - title: Elect a family council
    time: 15 minutes
    materials: Slips of paper and a pencil
    covers: [K1.8, S1.3]
    steps:
      - Split into two teams, each with a different idea about a weekend outing. Each team elects one representative.
      - The two representatives meet in private and decide.
      - Ask the others whether they felt represented, and what they would tell their representative next time.
  - title: The veto game
    time: 10 minutes
    materials: None
    covers: [K1.10, K1.11]
    steps:
      - Two of you are consuls for a day. Every plan needs both of you to agree, and either one may say "Veto!"
      - Try to plan a snack, a game and a bedtime.
      - Talk about what was good about two leaders, and what was annoying.
  - title: Build the Republic
    time: 15 minutes
    materials: Three cups or blocks, a book and sticky notes
    covers: [K1.10]
    steps:
      - Stand three cups on a book. Label the book "Constitution".
      - Label the cups Executive, Legislative and Judicial. Your child writes who was in each branch.
      - Take one cup away. Ask what would go wrong in Rome without that branch.
questions:
  - Why couldn’t the Roman Republic run a direct democracy like Athens?
  - Is it fair if some people’s votes count more than others? Why might the rich have wanted it that way?
  - What is good about having two leaders instead of one? What could go wrong?
  - A farmer in Sicily paid Roman taxes but had no vote. How might that farmer have felt about Rome?
  - Who represents you today? How would you get a message to them?
misconceptions:
  - thought: '"A republic is the same as an empire."'
    why: Rome was both, one after the other, and both ruled huge lands.
    tryThis: Point out that a republic elects its leaders, while an empire is ruled by one emperor. Rome became an empire after the Republic ended.
  - thought: '"Representative democracy means everyone was represented."'
    why: The word sounds like it includes everyone.
    tryThis: List who could vote in Rome, then who couldn’t. Ask who was left without a representative.
  - thought: '"Everyone in Rome was a plebeian or a patrician."'
    why: Those are the two class names they learn first.
    tryThis: Ask where women, slaves and people in the provinces fit. Patricians and plebeians were the groups of male citizens who could vote.
lookFor:
  - They explain the difference between voting yourself and electing someone to vote for you.
  - They link the size of the Republic to the way it was governed.
  - They can say one way Athens and Rome were alike, and one way they were different.
  - They notice when a system gives some people more say than others.
adapt:
  support:
    - Start with the card sort in the lesson, and talk through each card before moving on.
    - Use only two words at first, "direct" and "representative", with a family example of each.
    - Keep the four Roman assemblies on a sticky note, so the names don’t get in the way.
  access:
    - need: reading
      tip: The Latin names are hard for everyone. Read them aloud together, and use the plain-English job for each.
    - need: writing
      tip: The card sort and the cup model let your child show the branches without writing.
    - need: attention
      tip: Play the veto game first. A few minutes of acting makes the branches easier to remember.
    - need: worry
      tip: Let your child be a consul with the power to veto your silly plans. It turns a hard idea into a game they can win.
    - need: language
      tip: Many languages borrow from Latin. Look for words like "senate" or "republic" in your home language.
    - need: hands
      tip: Your child can tell you where each card goes while you tap, or point to the cups.
  stretch:
    - Find out who represents your family in Alberta’s Legislature and in Parliament in Ottawa.
    - Design a fair way to vote for a club with members in three towns. What would Rome have done better with your plan?
together:
  - problem: d1
    how: |-
      - Use 9 coins as 9 groups. Put 5 coins in the "rich" pile, though only a few people are in those groups.
      - Count how many coins win, and ask who never got to vote.
  - problem: b1
    how: |-
      - Find a place about 600 km from home on a map.
      - Ask what it would take to vote there in person.
