id: england-rights
subject: social-studies
why: This topic shows a child that rights were won, written down and built on, one step at a time. They learn that a right on paper matters most when people keep using it.
hook:
  title: The rule-maker’s rules
  time: 5 minutes
  covers: [K1.12]
  body: |-
    1. Announce that for the next five minutes you are an absolute ruler. Make one silly rule, such as "everyone hops".
    2. Change it the moment your child follows it. Then make a rule that doesn’t apply to you.
    3. Ask: **"What would you need to stop me?"**
    4. Write down their answer. It is probably close to what the barons demanded in 1215.
activities:
  - title: Write a family charter
    time: 15 minutes
    materials: Paper, a pen and a "seal", such as a sticker or thumbprint
    covers: [K1.12, K1.14]
    steps:
      - Together, write three rules that even the grown-ups must follow, such as "No changing screen time without a family meeting."
      - Seal it. Ask which rule limits a grown-up’s power, and which makes someone consult others.
      - Check it in a week. Did anyone try to ignore it? What made it stick?
  - title: Habeas corpus role-play
    time: 10 minutes
    materials: A stuffed toy, a box as the "jail" and a chair as the judge’s bench
    covers: [K1.13]
    steps:
      - Lock the toy in the box with no reason given. Your child is its friend and asks the judge for a writ.
      - You, as jailer, must bring the toy before the judge. The judge asks for a lawful reason.
      - Try once with a reason and once without. Talk about what would happen if there were no habeas corpus.
  - title: Then and now hunt
    time: 10 minutes
    materials: A news story about a court case or a debate in the Legislature
    covers: [K1.16, U1.1]
    steps:
      - Read the story together.
      - Hunt for an idea from the Magna Carta, the Habeas Corpus Act or the Bill of Rights.
questions:
  - Why would a king ever agree to limit his own power?
  - Who did the Magna Carta protect in 1215, and who did it leave out?
  - Why might free speech in Parliament matter, even if the speaker is wrong?
  - The Magna Carta was cancelled after a few months. Why do we still remember it?
  - What would daily life be like if a ruler could jail anyone, for any reason?
misconceptions:
  - thought: '"The Magna Carta made England a democracy."'
    why: It is the famous start of the story, so it gets the credit for all of it.
    tryThis: Line up the three dates on the floor, and ask what each step added. Ask who could vote in 1215.
  - thought: '"Habeas corpus means you can’t go to jail."'
    why: The lesson focuses on people being set free.
    tryThis: Point out that the judge checks for a lawful reason. If there is one, the person stays.
  - thought: '"Once a right is written down, it is safe forever."'
    why: A written law feels permanent.
    tryThis: Talk about the Magna Carta being cancelled in 1215. Ask what kept the idea alive.
lookFor:
  - They describe power moving from the monarch to Parliament, step by step.
  - They can name what each document added, not only its date.
  - They ask who a right protected, and who it left out.
  - They spot ideas from these documents in Canada today.
adapt:
  support:
    - Start with the balance in the lesson, and say only "more power" or "less power" for each date.
    - Use one sentence per document, such as "the king follows the law".
    - Act out habeas corpus before reading about it.
  access:
    - need: reading
      tip: Read the Bill of Rights table aloud, one row at a time, and say each right in your own words.
    - need: writing
      tip: The family charter can be drawn as pictures, or spoken while you write.
    - need: attention
      tip: Do one document a day, with the role-play or charter in between.
    - need: worry
      tip: In the role-play, let your child be the judge who decides. Being in charge of the rules makes it feel safer.
    - need: language
      tip: The Latin and old English words are new to everyone. Share any words for "law" or "rights" from your home language.
    - need: hands
      tip: Your child can tell you which date to tap on the balance, and act out the role-play with words.
  stretch:
    - Find out what a member of Alberta’s Legislature said in a recent debate, and why free speech there matters.
    - Design a fourth weight for the balance. What right would you add for everyone today, and why?
together:
  - problem: d1
    how: |-
      - Lay the four dates on the table as cards.
      - Cover the later cards, and ask after each one whether the Magna Carta has mattered yet.
  - problem: b2
    how: |-
      - Each of you takes one person, Hugh or Agnes.
      - Tell the other how you feel about the Magna Carta, and why.
