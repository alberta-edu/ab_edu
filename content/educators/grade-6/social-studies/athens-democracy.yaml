id: athens-democracy
subject: social-studies
why: This topic shows a child that the way we decide things was invented by people, and can change. They start asking the two questions every democracy must answer, who gets a say and how.
hook:
  title: Who chooses the movie?
  time: 5 minutes
  covers: [K1.1, K1.3]
  body: |-
    1. Say that you will choose tonight’s movie alone. Watch the reaction.
    2. Now let everyone at home vote, with a show of hands.
    3. Ask: **"Which way felt fairer? What if the baby, or the dog, had a vote?"**
    4. Don’t settle it yet. Say: **"About 2,500 years ago, a city called Athens argued about exactly this."**
activities:
  - title: Our own Assembly
    time: 15 minutes
    materials: A family question that really matters, such as the weekend plan, and a timer
    covers: [K1.7, K1.3]
    steps:
      - Copy the Athens herald. Ask "Who wishes to speak?" and give each speaker one minute.
      - Everyone votes with a show of hands. The majority decides.
      - Talk about how it felt for the people who lost the vote.
      - Ask what would happen if your whole street, or your whole town, had to meet this way.
  - title: Lottery or election?
    time: 10 minutes
    materials: Slips of paper, a bowl and a job nobody loves, such as sorting the recycling
    covers: [K1.7, K1.2]
    steps:
      - Choose who does the job by election. Then choose by drawing names from the bowl.
      - Ask who usually wins an election, and who never gets picked.
      - Ask which way an Athenian would call more equal, and why.
  - title: Secret or show of hands?
    time: 10 minutes
    materials: Two kinds of small objects, such as buttons and coins, and a cup
    covers: [K1.7]
    steps:
      - Vote on a silly question by show of hands, such as "Is pineapple good on pizza?"
      - Vote again in secret. Each person drops a button for yes or a coin for no into the cup, hidden in a fist.
      - Compare the results. Did anyone change their vote when no one could see it?
questions:
  - Why do you think the people of Athens wanted a democracy after years of tyrants?
  - Would direct democracy work for all of Alberta today? What would get in the way?
  - A metic paid taxes and fought for Athens, but couldn’t vote. Was that fair? How might a metic have felt?
  - What is one thing Athens did that we still do today?
  - Is a lottery a fair way to choose leaders? What could go wrong?
misconceptions:
  - thought: '"In a democracy, everyone gets a vote."'
    why: That is true in Canada today, so they assume it was always true.
    tryThis: Count the household in problem b3 together. Ask who in your own home would have voted in Athens.
  - thought: '"Democracy means everyone agrees."'
    why: Voting can sound like a way to make everyone happy.
    tryThis: Run a family vote and ask the losing side how they feel. Majority rule decides, even when people disagree.
  - thought: '"The Greeks invented voting, so they must have had elections like ours."'
    why: Voting is the part of democracy children know best.
    tryThis: Point out that Athens chose many officials by lottery. Ask why a city might choose by chance.
lookFor:
  - They ask who is allowed to take part, not only how the vote works.
  - They link the small size of Athens to the way it governed itself.
  - They can name a feature of Athens, such as the secret ballot, and find it in Canada today.
  - They can see the same event from the side of a citizen, a metic and a slave.
adapt:
  support:
    - Start with one question, "Who decides?" Then add "How do they decide?"
    - Use the three columns of citizens, metics and slaves as a sorting game with names on cards.
    - Stick to one body of government, the Assembly, before adding the Council and the courts.
  access:
    - need: reading
      tip: Read the table "The road to democracy" aloud, one row at a time, and ask what changed each time.
    - need: writing
      tip: Every answer can be spoken. Let your child tell you which class each person belongs to.
    - need: attention
      tip: Run one part of the Athens visual at a time, then stand up and act it out before the next one.
    - need: worry
      tip: Let your child be the herald who runs the family vote. Being in charge of the rules can make the topic feel safe.
    - need: language
      tip: The Greek words are new to everyone. Say them together, and connect them to words in your child’s home language for "people" and "power".
    - need: hands
      tip: Your child can say "run it" while you press the buttons, or vote by nodding in the family Assembly.
  stretch:
    - Find out how jurors are chosen in Alberta today, and compare it with the lottery in Athens.
    - Design a fair way for a whole school to make one decision together. Which Athens features would you keep?
together:
  - problem: b3
    how: |-
      - Draw the household as stick figures.
      - Your child crosses out each person who can’t vote, and says why.
  - problem: d2
    how: |-
      - Each of you takes a side, lottery or election, and argues it for one minute.
      - Then swap sides.
