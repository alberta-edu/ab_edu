id: haudenosaunee-confederacy
subject: social-studies
why: This topic shows a child a living government, older than Canada, that decides by consensus. They learn that democracy has more than one shape, and that a vote is not the only fair way to decide.
hook:
  title: Everyone has to agree
  time: 5 minutes
  covers: [K1.17]
  body: |-
    1. Choose a small family decision, such as a dessert to share.
    2. Announce one rule: **"We only decide when every single person agrees."**
    3. Let it run. Notice who changes their mind, and why.
    4. Ask: **"Was that harder than a vote? Was it fairer?"**
activities:
  - title: Across the fire
    time: 15 minutes
    materials: A candle or a paper fire, and a small object as "the matter"
    covers: [K1.18, K1.17]
    steps:
      - Sit in three groups around the fire. Name them the Firekeepers, the Elder Brothers and the Younger Brothers.
      - The Firekeepers bring a matter, such as a weekend plan. Pass the object to the Elder Brothers, then across the fire.
      - Any group that doesn’t agree passes it back with a question. Keep going until everyone is of one mind.
  - title: Chief and Clan Mother
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K1.19, S1.5]
    steps:
      - Your child lists what makes a good leader. Compare it with the Haudenosaunee Confederacy’s list, such as honest, reliable and fair to the people.
      - Talk about why the person who chooses a leader should also be able to remove them.
  - title: Listen to Haudenosaunee voices
    time: 15 minutes
    materials: The Onondaga Nation or Haudenosaunee Confederacy website
    covers: [K1.17, K1.20]
    steps:
      - Read a page about the Grand Council together, written by the Haudenosaunee themselves.
      - Find one thing the lesson said, and one new thing. Ask why it matters who tells a people’s story.
questions:
  - What is different about deciding by consensus instead of by vote? What is the same?
  - Why might a Nation with fewer Chiefs prefer consensus?
  - Why do you think the person who chooses a Chief is also allowed to remove him?
  - The Grand Council still meets today. What does that tell you about the Great Law of Peace?
  - Where do you see consensus at home, at school or on a team?
misconceptions:
  - thought: '"The Haudenosaunee Confederacy is only history."'
    why: It appears in a unit beside ancient Athens and Rome.
    tryThis: Point out the present tense in the lesson. The Grand Council still meets on Onondaga territory.
  - thought: '"Consensus means the leader decides and everyone agrees."'
    why: Children often see agreement that is really going along with an adult.
    tryThis: Run the "across the fire" activity, and pass the matter back at least once.
  - thought: '"Only the Chiefs have power."'
    why: The Chiefs are the ones who speak in council.
    tryThis: Ask who chooses the Chiefs and who can remove them. Then ask again who has power.
lookFor:
  - They explain consensus as everyone agreeing, not most people agreeing.
  - They describe the roles of both Chiefs and Clan Mothers.
  - They speak about the Confederacy in the present tense, as a living government.
  - They name a democratic principle the Confederacy shows, and give an example.
adapt:
  support:
    - Start with the council visual and the word "agree". Add the Nation names later.
    - Use two groups at first, then add the Firekeepers.
    - Keep the table of Nations nearby as a picture guide.
  access:
    - need: reading
      tip: Read the Nation names aloud together, slowly, and check the Onondaga Nation site for how they are said.
    - need: writing
      tip: All the activities are spoken or acted. Your child can show the order of a decision with objects.
    - need: attention
      tip: Run the council visual, then act it out right away with the family.
    - need: worry
      tip: Consensus has no losers, which some children find calming. Point out that every voice is needed.
    - need: language
      tip: Ask how decisions are made in your family’s culture or home language. Many communities use consensus too.
    - need: hands
      tip: Your child can say "pass it" while you move the object around the fire.
  stretch:
    - Find out which Haudenosaunee communities are in Canada today, and where they are on a map.
    - Plan a class decision that uses consensus. What would you do if one person never agrees?
together:
  - problem: d1
    how: |-
      - Use 50 small objects as Chiefs, sorted into five piles.
      - Count a majority vote, then try consensus. Ask which way protects the smallest pile.
  - problem: b2
    how: |-
      - Talk about how Ben’s idea seemed right from what he saw.
      - Then ask what else he would need to look at.
