subject: social-studies
promise: |-
  We hope your child comes to see democracy as something people built, and something they can take part in.

  - Facts about governments are one search away.
  - Asking who has a voice, who is left out and what you can do about it is a skill for life.
shifts:
  - instead: Memorizing the names of documents and offices.
    tryThis: 'Asking what each one changed. Who gained a voice? Who still didn’t have one?'
  - instead: Presenting democracy as finished and perfect.
    tryThis: Showing that it grew step by step, from Athens to the Charter, and is still growing.
  - instead: Treating Indigenous governments as history.
    tryThis: Speaking about the Haudenosaunee Confederacy in the present tense, using Haudenosaunee sources.
  - instead: Saying which party or politician is right.
    tryThis: 'Asking "Who decides this? How could you have a say?" Let your child form their own views.'
  - instead: Waiting until your child can vote.
    tryThis: Planning a small project together now, from naming an issue to reflecting on how it went.
routines:
  - name: Who decides?
    time: 5 minutes
    how: When something in the news or at home needs a decision, ask who makes it. Is it federal, provincial, local, a court, or the family?
  - name: Is that a right?
    time: 5 minutes
    how: |-
      1. When your child says "That’s not fair!", ask which right or principle they mean.
      2. Ask who else the rule affects.
      3. Ask whether there is a reasonable limit.
  - name: Two sides of the chamber
    time: 10 minutes
    how: Pick a small family plan. One person proposes it, the other plays the Official Opposition and asks three hard questions. Then swap.
  - name: Look back
    time: 5 minutes
    how: After any family project or outing, ask what went well, what didn’t and what you would change. That is the last step of every project plan.
assess:
  - They explain how a decision is made, and who gets a voice in it.
  - They compare two systems, such as direct and representative democracy, and say what each does well.
  - They connect a right or practice in Canada today to an earlier system.
  - They notice when someone is left out, and suggest how to include them.
  - They can plan a small project in clear steps.
sources:
  - label: 'Canadian Charter of Rights and Freedoms (Justice Laws Website)'
    url: https://laws-lois.justice.gc.ca/eng/const/page-12.html
  - label: 'Onondaga Nation: Government'
    url: https://www.onondaganation.org/government/
  - label: 'Haudenosaunee Confederacy: Confederacy structure'
    url: https://www.haudenosauneeconfederacy.com/government/
  - label: 'Elections Alberta'
    url: https://www.elections.ab.ca/
  - label: 'Peter Seixas and Tom Morton: The Big Six Historical Thinking Concepts'
    url: https://school.nelson.com/the-big-six-historical-thinking-concepts/
