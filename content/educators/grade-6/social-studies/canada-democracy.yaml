id: canada-democracy
subject: social-studies
why: This topic turns the news into something a child can follow. They learn who decides what, how those people get there, and who keeps them honest.
hook:
  title: Who fixes it?
  time: 5 minutes
  covers: [K1.10, S1.6]
  body: |-
    1. Name three things near home, such as a pothole, a school and a stamp on a letter.
    2. Ask: **"If each one broke, who would you call to fix it?"**
    3. Let your child guess. Don’t correct them yet.
    4. Say: **"Canada has a rule book that answers this. Let’s find out if you were right."**
activities:
  - title: Kitchen-table election
    time: 20 minutes
    materials: Paper ballots, a box and three "parties" with silly plans, such as Pizza Fridays
    covers: [K1.5, K1.7, S1.3]
    steps:
      - Split the house into three "ridings", such as kitchen, living room and bedrooms. Each riding votes by secret ballot.
      - The winner in each riding gets a seat. Count the seats.
      - The party with the most seats picks a "premier". The next party becomes the Official Opposition and asks one hard question.
  - title: Find your representatives
    time: 15 minutes
    materials: A computer, and your postal code
    covers: [K1.9, S1.5]
    steps:
      - Use the Elections Alberta and Elections Canada websites to find your MLA and your MP.
      - Read what each one is working on. Ask your child which issues are provincial and which are federal.
      - If your child cares about an issue, help them write a short, polite letter to the right one.
  - title: Who decides?
    time: 10 minutes
    materials: Sticky notes
    covers: [K1.10, S1.6]
    steps:
      - Write everyday things on sticky notes, such as the army, a hospital, coins and a school.
      - Your child sorts them under "federal" and "provincial", and explains each choice.
questions:
  - Why do you think Canada has an Official Opposition, and not only a government?
  - What might happen if judges had to do what the premier told them?
  - Why does each riding elect its own member, instead of everyone voting for one leader?
  - Who is your MLA? What is one thing you would ask them?
  - Which idea in Canada’s democracy comes from Athens? From Rome? From England?
misconceptions:
  - thought: '"Canadians vote for the prime minister."'
    why: News coverage focuses on party leaders, so it sounds like a vote for one person.
    tryThis: Run the kitchen-table election and show that people vote in their own riding.
  - thought: '"The government with the most votes always wins."'
    why: It makes sense that the most votes should win overall.
    tryThis: Try problem d1 together, and count seats and votes side by side.
  - thought: '"The Official Opposition is against everything."'
    why: The word "opposition" sounds like disagreeing for the sake of it.
    tryThis: Talk about a coach who asks hard questions before a game. Hard questions can make a plan better.
lookFor:
  - They explain how votes in ridings become seats, and seats become a government.
  - They sort a responsibility into federal or provincial, and give a reason.
  - They can say why the Official Opposition and independent judges matter.
  - They connect a part of Canada’s democracy to Athens, Rome or England.
adapt:
  support:
    - Start with one level, Alberta, and one job, the premier. Add the federal level later.
    - Use the election visual several times before reading the steps.
    - Keep a two-column chart, federal and provincial, on the fridge as the topic goes on.
  access:
    - need: reading
      tip: Read the job titles aloud with what the letters stand for, such as MLA, Member of the Legislative Assembly.
    - need: writing
      tip: The card sort and kitchen-table election need no writing at all.
    - need: attention
      tip: Hold a quick election with two minutes per step. The movement and counting help.
    - need: worry
      tip: Let your child run the count in the family election. Being the counter can make the rules feel safe.
    - need: language
      tip: Elections Canada and Elections Alberta have information in many languages. Look at one together.
    - need: hands
      tip: Your child can tell you where each card goes, and drop ballots by pointing or saying their choice.
  stretch:
    - Watch a short part of Question Period in Alberta’s Legislature online. Who asks, and who answers?
    - Find out how the Northwest Territories chooses its premier, and compare it with the Haudenosaunee Grand Council.
together:
  - problem: d1
    how: |-
      - Draw the three ridings as boxes. Colour each one by its winner.
      - Then count all the votes, and talk about why the two answers differ.
  - problem: b4
    how: |-
      - Look up your own MLA together.
      - Talk about whether Kai’s letter would be the same if the issue were the post office.
