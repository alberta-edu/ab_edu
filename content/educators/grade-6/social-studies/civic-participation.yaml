id: civic-participation
subject: social-studies
why: This topic shows a child that they don’t have to wait until they can vote to make a difference. They learn to turn "someone should fix that" into a plan they can carry out.
hook:
  title: Someone should fix that
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. Go for a short walk, or look out the window. Ask your child to spot one thing they wish were better.
    2. Ask: **"Who could fix it?"**
    3. Then ask: **"Could you help?"**
    4. Write the idea down. It might become your project.
activities:
  - title: A real mini-project
    time: Several short sessions over two weeks
    materials: A notebook, and the idea from the hook
    covers: [K1.4, S1.2]
    steps:
      - Use the seven steps in the lesson. Your child writes one line for each step before doing anything.
      - Do some research together. Ask the people affected, or count something.
      - Carry out the plan, even if it is small. Then talk through the last step, reflecting on the outcome.
  - title: Formal or informal?
    time: 10 minutes
    materials: Sticky notes
    covers: [K1.3]
    steps:
      - List ways your family already takes part, such as voting, volunteering or helping neighbours.
      - Sort them into formal and informal. Ask which ones influence change and which sustain the community.
  - title: Go to a meeting
    time: 1 hour
    materials: A public council or school council meeting, in person or online
    covers: [K1.3, S1.1]
    steps:
      - Watch part of a meeting together. Note who speaks and what they ask for.
      - Ask your child whose voices were missing, and how they could be heard next time.
questions:
  - Why is taking part a responsibility, and not only a right?
  - What could a Grade 6 student do to influence a decision in your town?
  - Which matters more, formal or informal participation? Can you have one without the other?
  - Why do you think research comes before setting goals?
  - What is one thing in your community you would like to keep strong for years?
misconceptions:
  - thought: '"Kids can’t take part in democracy until they can vote."'
    why: Voting is the most visible way to take part.
    tryThis: Sort the cards in the lesson together. Most of the actions don’t need a vote.
  - thought: '"Civic participation means going to protests."'
    why: News stories often show protests.
    tryThis: Point out everyday actions, such as volunteering or speaking at a school council.
  - thought: '"If the project didn’t work perfectly, it failed."'
    why: Children often judge a project by its result alone.
    tryThis: Do the reflection step together. Ask what you learned and what you’d change next time.
lookFor:
  - They tell formal participation from informal, and give an example of each.
  - They use the seven steps to plan a project, in order.
  - They explain why democracy needs people to take part.
  - They reflect honestly on a plan, and suggest an improvement.
adapt:
  support:
    - Start with one tiny project, such as a recycling bin at home, and use only four steps at first.
    - Use the project path in the lesson as a model, step by step.
    - Give a list of sample issues to choose from.
  access:
    - need: reading
      tip: Read each project step aloud, then have your child say what the class did in their own words.
    - need: writing
      tip: The plan can be drawn as a comic strip, one box per step, or recorded as a voice note.
    - need: attention
      tip: Spread the mini-project over many short sessions, one step at a time.
    - need: worry
      tip: Choose a small, low-risk project first. Make sure your child knows a project that teaches something is a success.
    - need: language
      tip: A project can be done in your home language, such as a poster for your cultural community.
    - need: hands
      tip: Your child can be the planner and spokesperson, while others do the physical work.
  stretch:
    - Plan a project that uses both formal and informal participation, such as a clean-up and a letter to council.
    - Find a young person in Alberta who started a community project, and map their steps onto the seven in the lesson.
together:
  - problem: d1
    how: |-
      - Use play money or paper slips to "buy" the bench, seeds and soil.
      - Try different mixes, and check each against the $200.
  - problem: b2
    how: |-
      - Talk about a time you guessed what someone needed and got it wrong.
      - Ask what one question would have saved the Read-a-thon class.
