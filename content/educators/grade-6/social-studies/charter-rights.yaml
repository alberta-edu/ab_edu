id: charter-rights
subject: social-studies
why: This topic shows a child that their rights are written down, that they belong to everyone around them too, and that they can be used. They learn to ask who a rule protects and who it leaves out.
hook:
  title: Who is protected?
  time: 5 minutes
  covers: [K1.2, K1.3]
  body: |-
    1. Ask: **"If a tourist from another country visits Alberta, do they get the same rights as you?"**
    2. Let your child guess, and give a reason.
    3. Then ask: **"What about voting?"**
    4. Say: **"Canada’s Charter answers both questions, and the answers are different. Let’s find out why."**
activities:
  - title: Charter detectives
    time: 15 minutes
    materials: The Charter’s text on the Government of Canada website
    covers: [K1.2, K1.3, K1.6]
    steps:
      - Read sections 2, 3 and 15 together. Circle the first words of each, such as "Everyone", "Every citizen" and "Every individual".
      - Ask why the Charter uses different words for different rights.
      - Find section 16 and read which languages it names.
  - title: Freedom with limits
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K1.10, S1.4]
    steps:
      - Your child invents a new freedom for all Canadians.
      - Together, list who could be harmed by it. Then write one reasonable limit that would protect them.
  - title: Spot discrimination
    time: 15 minutes
    materials: A news story or a book where someone is treated unfairly
    covers: [K1.11, S1.5]
    steps:
      - Read it together, and ask who is treated unfairly, and because of what.
      - Ask what someone could do about it, from speaking up to using the Charter.
      - Keep the talk calm and concrete. Focus on what fairness looks like.
questions:
  - Which right or freedom matters most in your life? Why?
  - Why do some rights belong to everyone, and others only to citizens?
  - Why might a group need rights of its own, like French-language schools?
  - Can a freedom ever go too far? Give an example.
  - What new responsibility should every Canadian take on?
misconceptions:
  - thought: '"Rights mean I can do anything I want."'
    why: The word "freedom" sounds limitless.
    tryThis: Use the freedom-with-limits activity. Ask who your freedom might harm.
  - thought: '"Only citizens have rights in Canada."'
    why: Citizenship and rights are often taught together.
    tryThis: Use the charter-check visual. Compare freedom of religion with the right to vote.
  - thought: '"Discrimination is in the past."'
    why: History lessons often show unfairness as something that ended long ago.
    tryThis: Look at the Statistics Canada facts in the lesson, and talk about why the Charter still matters.
lookFor:
  - They can say who a right protects, using the Charter’s own words.
  - They tell an individual right from a collective right, and give an example of each.
  - They explain why a right might need a reasonable limit.
  - They notice unfair treatment, and suggest a way to respond.
adapt:
  support:
    - Start with three rights only, religion, voting and equality, and the three people in the visual.
    - Use the card sort with the "why" notes read aloud.
    - Link each collective right to something your child knows in Alberta, such as a French or Catholic school.
  access:
    - need: reading
      tip: The Charter’s wording is formal. Read one short line, then say it together in everyday words.
    - need: writing
      tip: Inventing a freedom and its limit can be done out loud, with you writing it down.
    - need: attention
      tip: Do one lesson step at a time, with a short talk about your child’s own life in between.
    - need: worry
      tip: The section on discrimination can feel heavy. Stress what people do to help, and let your child ask anything.
    - need: language
      tip: The Charter is published in English and French, and summaries exist in many languages. Read a section in your home language if you can.
    - need: hands
      tip: Your child can say which bin each card goes in while you tap it.
  stretch:
    - Read about the Mahé case on the Canadian Encyclopedia, and explain how three parents changed Alberta’s schools.
    - Compare one Charter right with the same right in another country’s rights document.
together:
  - problem: d1
    how: |-
      - Read Amira’s story, and pause after each part.
      - Ask how she might feel, and what a good friend on the team could do.
  - problem: d2
    how: |-
      - Each of you invents a new freedom.
      - Swap, and find a reasonable limit for the other person’s freedom.
