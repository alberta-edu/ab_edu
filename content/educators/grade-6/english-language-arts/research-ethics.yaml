id: research-ethics
subject: english-language-arts
why: A child learns to find answers they can trust, and to treat other people's words, pictures and stories with respect. Those are the habits of an honest researcher at any age.
hook:
  title: The squeaky wheel
  time: 5 minutes
  covers: [S3.2, K3.1]
  body: |-
    Tell your child that Red River carts were so loud they were nicknamed "the North West fiddle."

    1. Ask: "What questions does that make you want to ask?"
    2. Then: **"Which one could we actually answer by tonight?"**
activities:
  - title: Source taste test
    time: 15 minutes
    materials: Three sources on one question, such as a library book, a museum website and a random video
    covers: [S3.5, K3.2]
    steps:
      - Ask one narrow question together.
      - For each source, ask who made it, whether it is on topic, and how they know.
      - Rank the sources from most to least trustworthy, and explain the order.
  - title: Family story, with permission
    time: 20 minutes
    materials: A family member willing to share a story
    covers: [K3.4, K3.7, S3.6]
    steps:
      - Your child asks a relative to tell a family story.
      - Before writing it down, they ask, "May I share this? With whom?"
      - They write it as it was told, and add a line saying who told it and when.
  - title: Notes to table
    time: 15 minutes
    materials: Paper, and notes from any short research question
    covers: [K3.5, K3.6, S3.4]
    steps:
      - Write each fact on its own sticky note, with its source.
      - Sort the notes into groups, then turn the groups into a table.
      - Ask, "Would a chart, a table or a paragraph show this best?"
questions:
  - Is your question small enough to answer well?
  - Who made this source? How do they know?
  - Does another reliable source agree?
  - Whose story or picture is this? Did they say you could share it?
  - Did you say it the way they said it?
misconceptions:
  - thought: '"If it''s online, I can use it."'
    why: Things online feel free and public.
    tryThis: Ask who made it and whether they gave permission. Being able to see something isn't the same as being allowed to share it.
  - thought: '"Citing means copying."'
    why: Citations sit next to borrowed words.
    tryThis: Explain that citing is giving credit, like saying thank you in writing. Put facts in your own words, and still cite.
  - thought: '"When sources disagree, pick the one I like."'
    why: The more interesting answer is tempting.
    tryThis: Weigh who made each one and look for a third, reliable source, as in the bear-fat problem.
lookFor:
  - They narrow a question before searching.
  - They ask who made a source before trusting it.
  - They ask permission before sharing someone else's story or photo.
adapt:
  support:
    - Use a funnel drawing to narrow a topic, one level at a time.
    - Give two sources only, one strong and one weak, and compare them.
    - 'Offer the frame: "I trust this source because ___."'
  access:
    - need: reading
      tip: Choose sources with pictures and short sections. A museum page or a picture book about the Red River cart works well.
    - need: writing
      tip: Notes can be drawings, voice memos or single words. The organizing matters more than neat writing.
    - need: language
      tip: Your child can gather information in their home language too, then share findings in English.
    - need: attention
      tip: Break research into short sessions, one step each, such as a question on day one and sources on day two.
  stretch:
    - Research a question about your own community's history. Contact a local museum or archive and ask how they would answer it.
    - Make a table and a chart from the same findings, and decide which one works better for a Grade 3 audience.
together:
  - problem: d1
    how: Read both sources aloud. Before the first part, ask your child which one they want to believe, and why. Then weigh them properly.
  - problem: b2
    how: Talk about a time someone shared something of yours without asking. How did it feel?
