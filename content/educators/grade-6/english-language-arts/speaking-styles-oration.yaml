id: speaking-styles-oration
subject: english-language-arts
why: A child learns that how they speak shapes how they are heard, and that listening well is as much a skill as talking. These are the skills of every friendship, team and community.
hook:
  title: Say it four ways
  time: 5 minutes
  covers: [K2.3, S2.2]
  body: |-
    Pick one message, such as "I'm hungry."

    1. Say it to a king, then to Grandma, then to a friend, then in the newest slang your child knows.
    2. Ask: **"Same message. Why did it change every time?"**
activities:
  - title: A talking-stone dinner
    time: 15 minutes
    materials: A smooth stone or any small object
    covers: [K1.1, K1.2, S1.1]
    steps:
      - At dinner, ask one question, such as "What made you laugh this week?"
      - Pass the stone around. Only the holder speaks. Anyone may pass.
      - 'Afterwards, ask: "How did it feel to be listened to all the way through?"'
  - title: Mismatch charades
    time: 10 minutes
    materials: Nothing
    covers: [K2.1, S2.1]
    steps:
      - Say a line like "I love broccoli" while your body and voice say the opposite.
      - Your child says which part they believed, and why.
      - Swap. Then try a line where all three match.
  - title: A one-minute oration
    time: 20 minutes
    materials: Index cards
    covers: [K5.4, S5.3]
    steps:
      - Choose a real occasion, such as a birthday toast or welcoming a guest.
      - Work through invention, arrangement and style on one card each. Make the last line echo.
      - Practise from memory, then deliver it at the occasion.
questions:
  - Who is listening, and what style fits them?
  - Did the words, the body and the voice agree?
  - Are we talking about the idea, or about the person who said it?
  - What do you think now that you didn't think before the talk?
  - Which line from that speech would people remember? Why that one?
misconceptions:
  - thought: '"Slang is bad English."'
    why: Adults often correct it.
    tryThis: Treat styles as tools. Ask, "Where would slang be perfect? Where would it go badly?"
  - thought: '"A vote is the same as agreeing."'
    why: Voting is the fair way to decide they know best.
    tryThis: 'After a vote, ask the losing side: "Can you live with this?" Then compare it with finding a plan everyone accepts.'
  - thought: '"If I''m not talking, I''m not part of the discussion."'
    why: Speaking is the part that gets noticed.
    tryThis: In a talking circle, point out that listening is the job of everyone without the stone. Ask what they noticed while listening.
lookFor:
  - They change their style for a different listener without being reminded.
  - They build on someone else's idea out loud, using the person's name kindly.
  - They plan a talk in order and practise it before giving it.
adapt:
  support:
    - Start with the style card sort. Say each line aloud in the voice it belongs to.
    - Plan a speech with only three cards, an opening, one idea and an ending.
    - 'Offer sentence starters: "Building on what ___ said…" and "I see it differently because…"'
  access:
    - need: worry
      tip: Let your child give their oration to one person, or record it first. Confidence grows from preparation, so practise in small steps.
    - need: language
      tip: Colloquial expressions and slang are hard for newcomers. Collect a few in a list with their meanings, and compare them with expressions in your home language.
    - need: attention
      tip: Keep talking circles short, with a single question and a soft object to hold.
    - need: reading
      tip: Read "One Hundred Years" aloud as a real speech. The rhythm is easier to hear than to see.
    - need: hands
      tip: A speech can be given seated, and the stone can be passed by sliding it across a table.
  stretch:
    - Watch a real oration, such as a Remembrance Day address, and note one line with rhythm and one moment of strong delivery.
    - Give the same two-minute talk to two different audiences, and change three things for the second one.
together:
  - problem: d1
    how: Plan Priya's speech with real index cards, one per element, before answering each part.
  - problem: b4
    how: Read paragraphs 2 and 3 aloud together, clapping on each repeated start.
