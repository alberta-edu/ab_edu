id: ballads-land
subject: english-language-arts
why: A child learns that stories are kept in songs, quilts, stones and trees, not only in books. Reading them well means looking closely, connecting clues and saying how sure you are.
hook:
  title: The oldest thing in the house
  time: 5 minutes
  covers: [U5.1, K7.2]
  body: |-
    Hold up the oldest object in your home, such as a dish, a photo or a tool.

    1. Ask: "Who used this before us? What story could it tell?"
    2. Then: **"If it could sing, what would its song be about?"**
activities:
  - title: Sing it
    time: 10 minutes
    materials: The ballad on screen
    covers: [S5.1, K5.1]
    steps:
      - Read "The Ballad of the Blue Quilt" aloud together, clapping the beat.
      - Try singing it to a tune you both know. Most four-line stanzas fit many tunes.
      - Use the poem reader to hide words, and try saying a stanza from memory.
  - title: A family ballad stanza
    time: 20 minutes
    materials: Paper and a pencil
    covers: [S5.4, S5.3]
    steps:
      - Choose a short family story, such as a move, a storm or a lost pet that came home.
      - Pick two rhyming words for lines 2 and 4 first. Then build the stanza around them.
      - Read it aloud. Does it keep a beat? Does it move the story on?
  - title: Read your neighbourhood
    time: 20 minutes
    materials: A walk outside
    covers: [K7.2, S7.1]
    steps:
      - Find three human-made things on the land, such as a fence, a cairn, a monument or a path worn into the grass.
      - For each, ask, "Who made this, and what is it telling us?"
      - Look for one that could mean two different things to two different people.
questions:
  - Which line made you feel what the character felt? Why that line?
  - What does this stanza add to the story?
  - Who made this structure, and how do we know what it meant to them?
  - Could this be read in another way? Who might read it differently?
  - How sure are we? What would make us surer?
misconceptions:
  - thought: '"A poem has to be about feelings."'
    why: In Grade 5, they met lyric poems, which express feelings.
    tryThis: Ask them to retell the ballad's story in three sentences. A poem that can be retold like that is telling a story.
  - thought: '"Totem poles are idols that people worshipped."'
    why: Old movies and books spread this idea.
    tryThis: Read about a real pole from a Haida or other Coastal First Nations source together. Notice the crests and the family history it records.
  - thought: '"There is one right meaning for a structure, and experts know it."'
    why: Museums and books often give one label.
    tryThis: Look at Stonehenge together. Ask, "If experts still disagree, what can we say for sure, and what is a guess?"
lookFor:
  - They point to a line or an image when they say how a poem makes them feel.
  - They say who made a structure before saying what it means.
  - They use words like "might," "suggests" and "we can't be sure" when the evidence is thin.
adapt:
  support:
    - Start with one stanza at a time. Ask what happens in it, and what changes from the stanza before.
    - On the globe, visit only the structures from Canada first, then go further.
    - 'Offer the frame: "It was made by ___. It could tell a traveller ___."'
  access:
    - need: reading
      tip: Let the poem reader read the ballad aloud first. Rhythm and rhyme make a ballad easier to follow by ear.
    - need: writing
      tip: For the stanza, your child can say lines aloud while you write them, or record them.
    - need: hands
      tip: The globe turns with a tap on any name. There is no need to drag it.
    - need: language
      tip: Words like *sod house*, *portage* and *chamber* may be new. Draw a quick sketch of each together.
    - need: worry
      tip: The stanza has no single right answer. Praise a good rhyme or a strong image, even if the beat is uneven.
  stretch:
    - Find a real ballad or folk song about a place or a historical event, and retell its story in four sentences.
    - Learn about one structure in your own area from a local First Nations, Métis or Inuit source, such as a cultural centre or museum.
together:
  - problem: d1
    how: Before the last part, ask your child to rate each clue as "strong" or "not sure." Then compare.
  - problem: d2
    how: Clap the beat of a stanza together before writing. Read the new stanza aloud right after the last one, and ask whether it sounds like it belongs.
