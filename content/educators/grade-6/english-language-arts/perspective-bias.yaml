id: perspective-bias
subject: english-language-arts
why: A child learns to hear the slant in what they read and watch, to read old texts in their own time, and to imagine the reasons behind someone else's behaviour. That makes them harder to fool and kinder to others.
hook:
  title: Two headlines
  time: 5 minutes
  covers: [K4.4, S4.6]
  body: |-
    Say two headlines about the same family event, such as "Brave Dad Rescues Dinner" and "Dad Burns Dinner Again."

    1. Ask: "Did the same thing happen in both?"
    2. Then: **"So which words are doing the work?"**
activities:
  - title: Slant swap
    time: 15 minutes
    materials: A short news story, ad or post
    covers: [K4.3, K4.4, S4.6, S5.5]
    steps:
      - Your child circles any word that makes you feel something about one side.
      - Swap each circled word for a neutral one, and read both versions aloud.
      - 'Ask: "Who made this, and what did they want us to think?"'
  - title: Artifact detective
    time: 15 minutes
    materials: One old object from home, such as a letter, a photo, a ticket stub or a tool
    covers: [K5.6, S5.4]
    steps:
      - Your child lists three clues on the object, such as words, dates or materials.
      - For each clue, they say what it suggests about the people, the time or the place.
      - Check one guess with whoever owns the object.
  - title: The other side of the story
    time: 10 minutes
    materials: Any story where a character seems mean or grumpy
    covers: [K4.2, S4.5, S4.2]
    steps:
      - Retell one moment from that character's point of view.
      - 'Ask: "What might they know, or feel, that the main character doesn''t?"'
      - Talk about a time someone misjudged you, or you misjudged someone.
questions:
  - Which words show what the writer thinks, even if they never say "I think"?
  - Who made this, and what do they want you to do?
  - What changed this character's mind? New information, experience, time or context?
  - When and where was this written? What did people believe then?
  - What can this object tell us about the people who used it?
misconceptions:
  - thought: '"Bias means lying."'
    why: Both feel unfair.
    tryThis: Show that every fact in the skater's post can be true and still slanted. Bias is about which side the words favour.
  - thought: '"Old texts that are out of date were wrong."'
    why: Out of date looks like a mistake.
    tryThis: Use Pluto. Ask, "Was the 1990 book wrong for 1990?"
  - thought: '"If someone is grumpy, they''re a grumpy person."'
    why: Children judge by what they see right now.
    tryThis: Reread "The Shortcut" from Mr. Petrov's side. Ask what he knew that Ava didn't.
lookFor:
  - They point out a loaded word and suggest a neutral one.
  - They ask who made an ad or post, and who paid for it.
  - They say "back then" or "at that time" when reading something old.
adapt:
  support:
    - Start with two very slanted sentences about a sports game, and one plain one.
    - Use the slant meter's buttons together, one report at a time.
    - 'Offer the frame: "The writer wants me to think ___, because of the word ___."'
  access:
    - need: language
      tip: Loaded words are hard to feel in a new language. Ask whether your home language has words that sound nice or nasty for the same thing, such as "slim" and "skinny."
    - need: reading
      tip: Read "The Shortcut" aloud with different voices for Ava and Mr. Petrov. Tone of voice helps children hear perspective.
    - need: worry
      tip: Talking about misjudging people can feel personal. Share a time you misjudged someone first.
    - need: hands
      tip: For problems where your child taps a sentence, they can read it out and you can tap it.
  stretch:
    - Find a real ad and a real news story about the same product or event. Compare their word choices.
    - Ask a grandparent for an object from their childhood, and write three things it tells you about that time.
together:
  - problem: d1
    how: Look at a real sponsored post together, with the label showing. Ask your child to find the words that try to make them feel left out.
  - problem: d2
    how: Act out paragraph 2 twice, once as a grumpy man and once as a man protecting eggs. Ask which fits the whole story.
