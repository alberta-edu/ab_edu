id: word-roots-affixes
subject: english-language-arts
why: A child learns that words have histories and working parts. Long words stop being walls and become puzzles they can take apart.
hook:
  title: Where did breakfast come from?
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    Point to things on the table, such as bacon, coffee, a saskatoon jam or a bagel.

    1. Ask: "Which of these words do you think came from another language?"
    2. Look up two of them on Wiktionary together. **"Who gave us that word?"**
activities:
  - title: Word detectives on a map
    time: 20 minutes
    materials: A map, or the globe in the lesson, and Wiktionary
    covers: [K1.4, S1.4, K1.5, S1.5]
    steps:
      - List five place names or words from your area, such as a town, a river or a park.
      - Look each one up on Wiktionary, or on your town's own website.
      - Pin them on the map by the language they came from. Which language has the most pins?
  - title: Affix relay
    time: 10 minutes
    materials: Cards with pro-, com-, con-, en-, oc-, -en and -ize, and cards with bases
    covers: [K1.6, K1.7, S1.8]
    steps:
      - Take turns joining an affix card to a base card.
      - If it makes a real word, say what it means using both parts. If not, make up a meaning anyway, for a laugh.
      - Check real ones in a dictionary.
  - title: Then and now
    time: 10 minutes
    materials: Nothing
    covers: [K1.2, S1.2, S1.6]
    steps:
      - Ask a grandparent or an older neighbour what *tablet*, *stream* or *cloud* meant when they were ten.
      - List three words they use that you don't, and three you use that they didn't know.
questions:
  - Which part of this word do you already know from another word?
  - Where do you think this word came from? How could we check?
  - What did this word mean long ago? What changed?
  - Does looking alike prove two words are related?
  - Which affix would make this word mean "make"?
misconceptions:
  - thought: '"Words that look alike are related."'
    why: Often they are, so the guess usually works.
    tryThis: Look up *emoji* and *emotion* together. Then try *pineapple* and *apple*.
  - thought: '"English words come from England."'
    why: English is the language they hear every day.
    tryThis: Spin the globe in the lesson. Count how many continents the words on it come from.
  - thought: '"Spelling rules are random."'
    why: Double letters like the cc in *occur* look like accidents.
    tryThis: 'Say *obcur*, then *occur*. Ask, "Which is easier to say? What do you think happened?"'
lookFor:
  - They split a new word into parts without being asked.
  - They wonder aloud where a word came from, and check.
  - They notice words from First Nations, Métis or Inuit languages in local places.
adapt:
  support:
    - Start with one prefix at a time, using the affix lab, and only two words.
    - Keep a root wall with tele, photo and aqua, adding words as you find them.
    - 'Offer the frame: "___ means ___, and ___ means ___, so the word means ___."'
  access:
    - need: reading
      tip: Say the word parts aloud while pointing to them. Hearing *con-nect* helps as much as seeing it.
    - need: language
      tip: Many Greek and Latin roots appear in other languages too. Ask your child whether a root looks like a word in another language they know.
    - need: writing
      tip: Build words with cards or tiles instead of writing them.
    - need: attention
      tip: The globe and the affix lab are short. Do one, then move or stretch, then the other.
  stretch:
    - Find out where the name of your town, river or street came from, and whether it comes from a First Nations, Métis or Inuit language.
    - Collect five new words that have entered English in your lifetime, and say what new thing each one names.
together:
  - problem: d1
    how: Say *obcur* and *occur* aloud together before the second part. Let your child feel the change in their mouth.
  - problem: b2
    how: Cover all but the first letter of each base. Ask your child to say the prefix that sounds easier before it.
