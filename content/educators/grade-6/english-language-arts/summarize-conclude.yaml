id: summarize-conclude
subject: english-language-arts
why: A child learns to boil a text down to what matters, to combine sources into something new, and to say how sure a conclusion really is. Those are the habits of a careful thinker in any subject.
hook:
  title: Thirty-second news
  time: 5 minutes
  covers: [S2.1]
  body: |-
    Read a short news story or watch a short news clip together.

    1. Ask: "Tell me the whole thing in one sentence."
    2. Then: **"How do you know that's the main idea and not just one detail?"**
activities:
  - title: Two sources, one picture
    time: 20 minutes
    materials: A short article and a chart or photo on the same topic, such as weather, sports or a local event
    covers: [S2.4, K3.2]
    steps:
      - Your child says what the article says, then what the chart or photo shows.
      - Together, write one sentence that neither source says alone.
      - 'Ask: "What do you understand now that you didn''t before?"'
  - title: How sure are you?
    time: 10 minutes
    materials: Three sticky notes marked "Very sure," "Fairly sure" and "Not sure yet"
    covers: [K3.1, S3.3]
    steps:
      - Make a conclusion about something at home, such as "The cat knocked over the plant."
      - Your child lists the stated facts and the inferences behind it.
      - They put it on a sticky note, and say what evidence would move it up.
  - title: Strategy switch
    time: 15 minutes
    materials: Any chapter book
    covers: [K1.1, S1.1, S1.2]
    steps:
      - Read a page aloud. Stop and name the strategy you just used, such as "I predicted."
      - Your child does the same on the next page.
      - At the end, ask which strategy helped most today, and why.
questions:
  - What does the text say, and what did you work out yourself?
  - What is the main idea? What supports it?
  - What do these two sources tell you together that neither says alone?
  - How sure are you? What else could explain it?
  - When did you get lost, and what did you do about it?
misconceptions:
  - thought: '"A summary is a shorter retelling of everything."'
    why: Retelling is the first kind of summary they learned.
    tryThis: Limit it to one sentence plus one piece of evidence. Ask, "Could this stand in for the whole thing?"
  - thought: '"If two things change together, one caused the other."'
    why: It is often true, so it feels like a rule.
    tryThis: Ask, "What else changed at the same time?" The weather in the bike bus article is a good example.
  - thought: '"Changing my prediction means I was wrong."'
    why: Being right the first time is what usually gets praised.
    tryThis: Celebrate the revision. Ask, "What new information changed your mind?"
lookFor:
  - They give a main idea and back it with one or two pieces of evidence.
  - They use words like "probably" and "I'm not sure yet" when the evidence is thin.
  - They pull ideas from a picture, chart or caption, not only from the words.
adapt:
  support:
    - Start by sorting ideas into stated and inferred before summarizing anything.
    - Read the article in three chunks, summarizing each in one sentence before the whole.
    - 'Offer the frame: "The main idea is ___. I know because ___."'
  access:
    - need: reading
      tip: Read the article aloud, and point to the chart as you mention it. Comprehension is the thinking, not the decoding.
    - need: writing
      tip: Summaries and conclusions can be spoken and recorded.
    - need: attention
      tip: Use the sticky-note activity between lesson steps. Moving the notes keeps the thinking active.
    - need: language
      tip: Words like *drop-off*, *crosswalk* and *organizers* may be new. Walk past a school drop-off zone, or draw one together.
  stretch:
    - Find two news sources on the same local event. Write one sentence that synthesizes them, and one question they leave open.
    - Turn a conclusion from "not sure yet" to "fairly sure" by naming exactly what evidence you would need.
together:
  - problem: d1
    how: Before the last part, ask your child to rate Liam's conclusion out of 10 for how sure it is. Ask again after, and talk about what changed.
  - problem: b3
    how: Ask your child to say what each wrong summary is missing, or adding, before choosing.
