id: clauses-sentences
subject: english-language-arts
why: A child learns that sentences are built from clauses, like blocks, and that choosing how to join them changes how ideas connect. Grammar becomes a tool for meaning, not a list of rules.
hook:
  title: Then what?
  time: 5 minutes
  covers: [K2.5, K2.4]
  body: |-
    Say a dependent clause and stop, such as "When the dog got into the kitchen…"

    1. Wait. Your child will probably ask, "Then what?"
    2. Then: **"Why did that feel unfinished? What does it need?"**
activities:
  - title: Clause cards
    time: 15 minutes
    materials: Cards with short clauses, such as "the dog barked," and cards with and, but, so, because, when and although
    covers: [K2.2, K2.6, S2.3, S2.4]
    steps:
      - Draw two clause cards and one joiner card.
      - Build the sentence aloud, and decide whether it is simple, compound or complex.
      - Swap the joiner and ask how the meaning changed.
  - title: Tense detective
    time: 10 minutes
    materials: A paragraph your child wrote
    covers: [K2.1, S2.1]
    steps:
      - Underline every verb together.
      - Mark each one past, present or future.
      - Fix any verb that jumps out of step, and read it aloud again.
  - title: One or many?
    time: 10 minutes
    materials: Nothing
    covers: [S2.2]
    steps:
      - Say a sentence about one thing, such as "The bus is late."
      - Your child makes it about many, and changes the verb to match.
      - Try a tricky one, such as "The bag of apples is heavy."
questions:
  - Can this part stand on its own? How do you know?
  - What is the subject? What is the verb?
  - How many clauses are in this sentence?
  - When did this happen? Do all the verbs agree on that?
  - What changed when you swapped *but* for *although*?
misconceptions:
  - thought: '"Every sentence with *and* is compound."'
    why: Compound sentences often use *and*.
    tryThis: Look at "Priya and Owen skated." Ask whether you can split it into two sentences that stand alone.
  - thought: '"A long sentence is a complex sentence."'
    why: The word complex sounds like long or hard.
    tryThis: Show a short complex sentence, "We left when it rained," and a long simple one. Count the clauses.
  - thought: '"The verb agrees with the noun right before it."'
    why: The nearest noun is the easiest to hear.
    tryThis: Cover the middle words in "The box of crayons sits." Ask what really sits on the shelf.
lookFor:
  - They notice and fix a fragment that starts with *because* or *when*.
  - They join two short sentences in more than one way, and choose one on purpose.
  - They keep a story in one tense, or notice when they slip.
adapt:
  support:
    - Start by finding the subject and the verb in short sentences, before naming clauses.
    - Use colours, green for independent and orange for dependent, as the clause builder does.
    - 'Offer the test: "Read it alone. Does it leave you waiting?"'
  access:
    - need: language
      tip: Joining words like *although* may be new. Find matching words in your home language and compare how sentences are built.
    - need: writing
      tip: Build sentences out loud or with cards before writing them.
    - need: hands
      tip: The clause builder only needs taps. Your child can say which joiner to try, and you can tap.
    - need: attention
      tip: Do one sentence type a day, with a short game each time.
  stretch:
    - Rewrite a paragraph using all three sentence types, and read it aloud to hear the difference.
    - Find a sentence in a favourite book that starts with a dependent clause, and explain why the author put it first.
together:
  - problem: d1
    how: Read Aiden's story aloud with a long pause after "gym." Ask your child how it feels to hear it.
  - problem: d2
    how: Read both sentences aloud, and then each clause alone. Let your child hear which one still works on its own.
