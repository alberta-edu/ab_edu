id: word-choice-tone
subject: english-language-arts
why: A child learns that every word is a choice with an effect, and that they can make those choices on purpose. That is where a writer's own voice comes from.
hook:
  title: Pretty is not enough
  time: 5 minutes
  covers: [S2.2, K2.3]
  body: |-
    Read Anne's line aloud: "Pretty? Oh, pretty doesn't seem the right word to use."

    1. Look out the window together. Ask your child to describe what they see in one plain word.
    2. Then: **"Now find a word that goes far enough."**
activities:
  - title: Tone switch
    time: 10 minutes
    materials: Nothing
    covers: [K2.5, S2.6]
    steps:
      - Pick a piece of news, such as "We're having leftovers tonight."
      - Take turns saying it in a cheerful, a disappointed and an annoyed tone, using different words each time.
      - Ask which words carried the tone.
  - title: Thesaurus challenge
    time: 15 minutes
    materials: A thesaurus, paper or online
    covers: [S2.7, S2.5]
    steps:
      - Write a plain sentence, such as "The cat walked across the room."
      - Look up *walked*. Rewrite the sentence three times with three different words.
      - Act each one out. Which effect does each word create?
  - title: Suspense in six sentences
    time: 20 minutes
    materials: Paper and a pencil
    covers: [S2.4, S2.3]
    steps:
      - Choose an everyday moment that could be tense, such as waiting for a test result or the last second of a game.
      - Your child writes it in six short sentences, ending before the result.
      - Read it aloud to someone, and pause where it is most tense.
questions:
  - Why do you think the author chose that word, and not a plainer one?
  - How does the writer feel about this topic? Which words tell you?
  - Who is this written for? Do the words fit them?
  - What would you change if your reader were younger, or older?
  - Did your writing have the effect you wanted? How do you know?
misconceptions:
  - thought: '"Fancy words make better writing."'
    why: Long words can sound grown-up.
    tryThis: Compare a recipe written in fancy words with a plain one. Ask which one a cook would want.
  - thought: '"Tone is the same as mood."'
    why: Both are about feelings.
    tryThis: Explain that tone is the writer's attitude, and mood is what the reader feels. A cheerful writer can describe a gloomy day.
  - thought: '"If my reader misunderstood, they read it wrong."'
    why: The meaning seems obvious to the writer.
    tryThis: Test a short piece on two readers. If either misreads it, ask what to change.
lookFor:
  - They swap a plain word for a precise or colourful one without being asked.
  - They name the tone of a text and point to the words that create it.
  - They try several versions of a line and pick one for a reason.
adapt:
  support:
    - Start with one sentence and three word choices, and talk about each effect.
    - Read the Montgomery passage aloud first, and explain the hard words before analyzing it.
    - 'Offer the frame: "The word ___ makes me feel ___."'
  access:
    - need: reading
      tip: Montgomery's sentences are long. Read paragraph 1 aloud, slowly, pausing at each comma.
    - need: writing
      tip: Your child can say their suspense opening aloud, and you can write it down. Word choice matters as much spoken as written.
    - need: language
      tip: Tone can be hard to hear in a new language. Say the same sentence in two tones, and ask your child which words and which voice changed.
    - need: worry
      tip: Make the creative process playful. Praise experiments that didn't work, because they helped find the one that did.
  stretch:
    - Find a page in a favourite book with strong word choices. Rewrite one sentence with plain words, and compare.
    - Write the same short scene twice, once in a comedy tone and once full of suspense.
together:
  - problem: d1
    how: Make a real poster together. Test it on two family members before making the final version.
  - problem: b3
    how: Read Matthew's and Anne's lines aloud in two very different voices before choosing.
