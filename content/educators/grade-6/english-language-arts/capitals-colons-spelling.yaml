id: capitals-colons-spelling
subject: english-language-arts
why: A child learns that capitals, colons and spelling are signals to a reader. Used well, they make writing clear and let the important parts stand out.
hook:
  title: The shouting sign
  time: 5 minutes
  covers: [K1.1, S1.3]
  body: |-
    Write a sign in all capitals, such as "PLEASE SHUT THE DOOR THE CAT GETS OUT."

    1. Ask: "Which word matters most? Can you tell?"
    2. Then: **"Rewrite it so that one word stands out."**
activities:
  - title: Colon hunt
    time: 10 minutes
    materials: Cereal boxes, recipes, signs or a newspaper
    covers: [K1.3, S1.2]
    steps:
      - Find three colons in real texts.
      - For each, decide whether it introduces a list, an explanation or an example.
      - Write one colon sentence of each kind about your own day.
  - title: Family tree for words
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K3.2, U3.1, S3.2]
    steps:
      - Write a base, such as *sign*, *nation* or *compete*, in the middle of the page.
      - Branch out with every word you can build by adding prefixes and suffixes.
      - Circle any letter that is silent or blurry in one word but clear in another.
  - title: Abbreviation translator
    time: 10 minutes
    materials: A text message, a recipe or an address
    covers: [K1.2]
    steps:
      - Find every abbreviation together.
      - Your child explains each one, and says who would and wouldn't understand it.
      - Rewrite one message for a grandparent or a younger child.
questions:
  - Which word in this sentence is most important? Does it look important?
  - Is the part before the colon a complete thought?
  - Who will read this? Will they know that abbreviation?
  - Which family member makes the hard part of this word clear?
  - Which pattern helps when you add this suffix?
misconceptions:
  - thought: '"All caps makes something important."'
    why: Signs and posts often shout.
    tryThis: Write a sign in all caps and one with a single capitalized word. Ask which word stands out more.
  - thought: '"A colon is a fancy comma."'
    why: Both mark a pause.
    tryThis: Test the part before the colon. If it can't stand alone, a colon doesn't belong there.
  - thought: '"Spell it the way it sounds."'
    why: Sounding out worked when the words were short.
    tryThis: Say *competition* and *compete* together. Ask which one tells you how to spell the middle.
lookFor:
  - They use a colon after a complete thought to introduce a list or a reason.
  - They think of a family member when a word is hard to spell.
  - They choose abbreviations their reader will know.
adapt:
  support:
    - Start with colons that introduce lists, the easiest kind, before explanations and examples.
    - Keep a word family wall with *sign*, *nation* and *compete*.
    - 'Offer the test: "Read the part before the colon. Could it be a sentence?"'
  access:
    - need: writing
      tip: Practise with sentence strips your child can cut and rearrange, instead of rewriting.
    - need: language
      tip: Capitalization rules differ between languages. Compare which words get capitals in English and in your home language.
    - need: reading
      tip: Read the effect versions aloud with matching expression, so your child hears what the punctuation does.
    - need: hands
      tip: The capitals activity in the lesson only needs taps. Your child can point and you can tap.
  stretch:
    - Write a short poster that uses capitals and one colon for effect, then test it on someone who hasn't seen it.
    - Find three words with silent letters, such as *autumn* and *bomb*, and a family member for each that makes the letter heard.
together:
  - problem: d1
    how: Say *compete* and *competition* slowly, clapping each part. Let your child hear where the e goes quiet.
  - problem: b4
    how: Hold the four signs up from across the room. Which one can your child read and understand fastest?
