subject: english-language-arts
promise: |-
  We hope your child leaves Grade 6 able to take a text apart and say how it works, and to put their own voice into what they say and write.

  - A machine can sort facts and produce a neat paragraph.
  - Asking who made a text, what it leaves out, and what they really think about it is still up to them.
shifts:
  - instead: Asking what happened in a text.
    tryThis: 'Asking how it was built: "Why start there? What is this part doing? What if it were cut?"'
  - instead: Accepting a fact because it sounds sure of itself.
    tryThis: 'Asking two questions every time: "Who made this?" and "How could we check it?"'
  - instead: Teaching a grammar rule, then doing exercises.
    tryThis: Playing with a real sentence. Join two clauses, move one, or cut a colon, then ask what changed.
  - instead: Correcting every error in their writing.
    tryThis: Responding to what they said first. Then choose one change that would help the reader most.
  - instead: Making every response a written one.
    tryThis: Letting them talk it through, give it as a speech or act it out first. Writing comes more easily once they know what they think.
routines:
  - name: What makes you say that?
    time: 3 minutes
    how: Whenever your child says something about a text, ask this one question, with real curiosity. It turns an opinion into a reading backed by evidence.
  - name: Who made it?
    time: 3 minutes
    how: |-
      1. Pick an ad, a post or a poster you see together.
      2. Ask who made it, and what they want.
      3. Ask which words were chosen to make you feel that way.
  - name: Word of the week
    time: 5 minutes
    how: Choose a word from a book, a game or the news. Look up where it came from on Wiktionary together, and try to use it three times that week.
  - name: Say it two ways
    time: 5 minutes
    how: Take turns saying the same thing formally and in slang, or as a speech and as a text message. Ask which fits which listener, and why.
assess:
  - They point to a word or a line when they explain an idea.
  - They ask where a fact came from before they repeat it.
  - They change their speaking style for a different listener without being reminded.
  - They make a change to their own writing because of how a reader would take it.
sources:
  - label: 'Achieve the Core: guide to creating text-dependent questions'
    url: https://achievethecore.org/file/353
  - label: 'Alberta Education: Making a Difference, on differentiated instruction'
    url: https://open.alberta.ca/publications/9780778586012
  - label: 'Wiktionary: word origins'
    url: https://en.wiktionary.org/
