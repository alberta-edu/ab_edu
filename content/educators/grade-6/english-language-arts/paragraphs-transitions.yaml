id: paragraphs-transitions
subject: english-language-arts
why: A child learns that good writing is built and rebuilt, not poured out once. They learn to organize ideas so a reader can follow them, and to revise for a real audience.
hook:
  title: Shuffle the paragraphs
  time: 5 minutes
  covers: [K1.3, S1.7]
  body: |-
    Cut a short letter or article into paragraphs and shuffle them.

    1. Ask your child to put it back together.
    2. Then: **"Which words helped you know the order?"**
activities:
  - title: A real letter
    time: 30 minutes, over two days
    materials: Paper or a keyboard, and a real audience, such as a grandparent, a coach or the school council
    covers: [K1.1, K1.2, S1.1, S1.5]
    steps:
      - Plan together. Who is it for, what do you want, and what form fits?
      - Your child drafts three or four paragraphs without stopping to fix things.
      - The next day, revise with fresh eyes, then edit, then send it.
  - title: Transition relay
    time: 10 minutes
    materials: Cards with transitions, such as first, however, most importantly and in the end
    covers: [K1.3, S1.8]
    steps:
      - Start a story or an argument with one sentence.
      - Your child draws a card and must continue with that transition.
      - Keep going until someone draws "In the end."
  - title: Same note, three tools
    time: 10 minutes
    materials: A pencil, paper and a keyboard
    covers: [K4.1, K4.2, S4.1]
    steps:
      - Write the same short note by printing, in cursive and by typing.
      - Ask which was fastest, which was neatest and which felt most personal.
      - Decide which tool fits a birthday card, a sign and a report.
questions:
  - Who is going to read this, and what do you want them to do?
  - What is your position? Which sentence says it clearly?
  - Which transition shows how these two paragraphs connect?
  - Is every sentence helping your main idea?
  - Read it aloud. Where did you stumble?
misconceptions:
  - thought: '"Revising means fixing spelling."'
    why: Corrections on their work are often about spelling and punctuation.
    tryThis: Separate the two. Revise first, by adding, cutting or moving ideas. Edit last.
  - thought: '"More words make better writing."'
    why: Longer work can seem like more effort.
    tryThis: Ask, "Does this sentence help your position?" Cut one that doesn't, and read both versions aloud.
  - thought: '"Short sentences are always clearer."'
    why: They are often told to avoid run-ons.
    tryThis: Read a choppy paragraph aloud together. Then mix in one longer sentence and listen to the difference.
lookFor:
  - They plan who the writing is for before they start.
  - They use a transition to start a new paragraph.
  - They cut a sentence of their own because it doesn't fit, without being told.
adapt:
  support:
    - Use a four-box plan, with a lead, two reasons and a conclusion, before writing paragraphs.
    - Keep a transition list on the fridge or the desk.
    - Revise one thing at a time, adding one example or cutting one sentence.
  access:
    - need: writing
      tip: Your child can say each paragraph while you type or write it. Revising out loud counts.
    - need: hands
      tip: Keyboarding or voice typing can replace handwriting for long pieces. Save handwriting practice for short notes.
    - need: attention
      tip: Spread the writing process over several days. Each stage is a separate short session.
    - need: worry
      tip: Make the first draft a "messy draft," and promise nobody will read it but them.
    - need: language
      tip: Transitions are hard to learn in a new language. Ask for the words your home language uses for "first," "however" and "in the end," and match them.
  stretch:
    - Write a letter to a real decision-maker, such as a town councillor, about something your child cares about. Send it.
    - Rewrite the same letter for two audiences, and list five things that changed.
together:
  - problem: d1
    how: Read Priya's draft aloud in a council member's voice. Ask your child how the council would react, then revise together.
  - problem: b3
    how: Ask your child to underline each transition before ordering the paragraphs.
