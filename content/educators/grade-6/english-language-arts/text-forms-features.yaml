id: text-forms-features
subject: english-language-arts
why: A child learns to ask what a text is really for, how its shape helps it work, and whether its facts hold up. That is the start of reading the world critically.
hook:
  title: The purpose behind the joke
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    Find any cereal box, flyer or app screen at home.

    1. Ask: "What is all this here for? The jokes, the colours, the games?"
    2. Then: **"If you could keep only one part, which part is everything else helping?"**
activities:
  - title: Purpose detective
    time: 15 minutes
    materials: Five texts from around the house, such as a flyer, a recipe, a comic, a game box and a letter
    covers: [K1.1, S1.1, S1.2]
    steps:
      - For each text, your child names every purpose they can find, and whether it is fiction or non-fiction.
      - Then they choose the one purpose that stands out, and point to the part that proves it.
      - Swap roles, and argue playfully if you disagree.
  - title: Same news, three forms
    time: 20 minutes
    materials: Paper and a pencil, or a phone to record
    covers: [K1.4, S1.3, K4.2]
    steps:
      - Pick a small family event, such as a burnt dinner or a new pet.
      - Your child tells it as a headline and a news lead, then as a 30-second speech, then as a story told by the pet or the pot.
      - 'Ask: "What changed when the form changed? What stayed the same?"'
  - title: Check it twice
    time: 10 minutes
    materials: One surprising fact from a cereal box, an ad or a video
    covers: [K4.3, S4.3]
    steps:
      - Ask who made the fact, and what they gain if you believe it.
      - Find one different source together, such as a library book or a government website, and compare.
      - Decide together whether it is confirmed, wrong, or still unknown.
questions:
  - What is everything else in this text helping to do?
  - Did this really happen, or is it invented? How can you tell?
  - Who is this written for, and how does its form show that?
  - Which feature would you look at first, and why?
  - Who made this, and how could we check it?
misconceptions:
  - thought: '"If it’s funny, its purpose is to entertain."'
    why: Humour is the first thing they notice.
    tryThis: 'Ask: "Take away the jokes. Does it still do its job? Take away the facts. Does it?"'
  - thought: '"A true story can’t start in the middle, or it isn’t true any more."'
    why: True stories at school are often retold in time order.
    tryThis: Retell a family story twice, once in order and once starting at the funniest moment. Ask whether anything became untrue.
  - thought: '"It’s online, so it’s false," or "It’s online, so it’s true."'
    why: They have heard both warnings and promises about the internet.
    tryThis: Steer them to the source instead of the screen. Ask, "Who made this, and how do they know?"
lookFor:
  - They name more than one purpose, then pick one and say why it stands out.
  - They point to a greeting or a call to action when they say a text is a speech.
  - They ask "Who made this?" before deciding whether to trust a fact.
adapt:
  support:
    - Start with picture-heavy texts like flyers and comics, where the parts are easy to see.
    - Use the X-ray views together, and say the job of each part aloud.
    - 'Offer the frame: "It mostly wants to ___, because ___."'
  access:
    - need: reading
      tip: Read "The Lake on Our Field" aloud as a real speech, standing up. Hearing a speech is how speeches are meant to be met.
    - need: writing
      tip: Every activity works out loud. Your child can tell a story in three forms into a phone recorder.
    - need: attention
      tip: Use one card sort at a time, with a stretch between them. The X-ray views are short, so let your child press the buttons.
    - need: language
      tip: Words like *caretaker*, *council* and *permeable* may be new. Find the glossary in the features page together, then make your own glossary of three words.
    - need: hands
      tip: For problems where your child taps a sentence, they can read it out and you can tap it.
  stretch:
    - Find a real speech online, such as one from a Remembrance Day ceremony, and mark its problem, solution or call to action.
    - Take one paragraph of a report and add two features that help a reader. Explain what each one does.
together:
  - problem: b3
    how: |-
      - Read Mr. Dubois's log together first.
      - For each fact, ask, "Was Mr. Dubois in a position to know this?"
  - problem: d2
    how: Read the speech aloud without paragraph 3, then ask your child to play a council member and ask the first question that comes to mind.
