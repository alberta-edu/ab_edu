id: context-figurative
subject: english-language-arts
why: A child learns to treat an unknown word as a puzzle with two kinds of clues, and to choose words that say exactly what they mean. That makes them readers who don't skip and writers who aren't vague.
hook:
  title: Mystery word
  time: 5 minutes
  covers: [S2.2]
  body: |-
    Say a sentence with one hard word, such as "The fog made the mountains **invisible**."

    1. Ask: "What does it mean? Which part of the word helped? Which part of the sentence helped?"
    2. Then: **"What if the word parts and the sentence disagree? Which do you trust?"**
activities:
  - title: Palindrome hunt
    time: 10 minutes
    materials: Paper, and the palindrome mirror in the lesson
    covers: [K3.2]
    steps:
      - Hunt for palindromes in names, words and numbers, such as Hannah, kayak or 1221.
      - Check each one in the mirror.
      - Try to make a short palindrome phrase, like "Step on no pets."
  - title: Sort it six ways
    time: 15 minutes
    materials: Twelve word cards from your child's own reading
    covers: [K2.1, S2.1]
    steps:
      - Your child writes twelve words they like on cards.
      - Sort them one way, such as by meaning. Then shuffle and sort another way, such as by topic or by part of speech.
      - Ask which sorting helped them remember the words best.
  - title: Analogy machine
    time: 10 minutes
    materials: Nothing
    covers: [S3.1, U3.1]
    steps:
      - Name a thing, such as a library, a bike helmet or a heart.
      - Your child says, "It's like a ___, because ___." The "because" must explain the job.
      - Vote on the clearest one, then the funniest one.
questions:
  - What do the word parts suggest? Does the sentence agree?
  - What would this metaphor look like if you read it literally?
  - What does this comparison help you understand?
  - Is this word useful everywhere, or only in one subject?
  - How else could you sort these words?
misconceptions:
  - thought: '"If I know the word parts, I know the word."'
    why: Word parts usually do work.
    tryThis: Look at *invaluable* and *priceless* together. Ask what the context says.
  - thought: '"Any comparison is an analogy."'
    why: Similes and metaphors are also comparisons.
    tryThis: 'Ask, "Does it **explain** how something works, step by step?" A heart like a pump explains. A heart like a balloon doesn''t.'
  - thought: '"Big words make writing better."'
    why: Long words can sound impressive.
    tryThis: Compare a vague sentence with a precise one. Precise words are often short. They are the exact words for the job.
lookFor:
  - They try to work out a word before asking, using both the parts and the sentence.
  - They notice figurative language in songs, ads and everyday talk.
  - They use a tier 3 word correctly when explaining a subject.
adapt:
  support:
    - Start with word parts your child already knows, then add one new root at a time.
    - Read figurative lines literally first, with a silly drawing, then say what they mean.
    - 'Offer the frame: "The parts say ___. The sentence says ___. So it means ___."'
  access:
    - need: language
      tip: Figurative language is hard in a new language. Ask for a saying from your home language, and compare what it says literally with what it means.
    - need: reading
      tip: Read the example sentences aloud. Your child can do the thinking while you carry the words.
    - need: writing
      tip: The analogy can be said aloud and recorded, or drawn as a two-part picture.
    - need: hands
      tip: The palindrome mirror has buttons for every example, so typing isn't needed.
  stretch:
    - Find a palindrome sentence of five words or more.
    - Write three analogies for the same idea, and say which one explains it best and why.
together:
  - problem: b2
    how: Cover the second sentence first. Let your child guess from the parts, then reveal the context and see if the guess survives.
  - problem: d2
    how: Talk through two possible analogies before writing. Ask, "What does it **do**? What else does that job?"
