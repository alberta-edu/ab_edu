id: conflict-comedy-tragedy
subject: english-language-arts
why: A child learns that every story runs on a struggle, that the one in the way isn't always a villain, and that writers choose how a story ends. That makes them readers who see choices, not just events.
hook:
  title: Who's in the way?
  time: 5 minutes
  covers: [K3.4, K3.8]
  body: |-
    Name a favourite movie, game or book together.

    1. Ask: "What does the main character want more than anything?"
    2. Then: **"So what, or who, keeps getting in the way?"** Let the answer surprise you. It is often not a villain.
activities:
  - title: Swap the ending
    time: 15 minutes
    materials: A fairy tale or short story you both know
    covers: [K6.1, K6.2, K6.3, U6.1]
    steps:
      - Retell the story's beginning together.
      - Your child acts out a comedy ending, with something funny and a happy finish.
      - Then they act out a tragedy ending, serious and unhappy. Ask, "What had to change? What stayed the same?"
  - title: Stock character charades
    time: 10 minutes
    materials: Slips of paper with stock characters, such as the brave knight, the mad scientist, the wise wizard and the grumpy neighbour
    covers: [K3.5, K3.6]
    steps:
      - Take turns acting out a stock character with no words. The others guess.
      - 'Ask: "How did you know so fast?" That speed is what makes it a stock character.'
      - Then flip one, like a timid dragon or a scientist who is scared of her own robot, and see if it makes everyone laugh.
  - title: The story inside
    time: 15 minutes
    materials: Nothing
    covers: [K3.3, S3.2]
    steps:
      - Start a story about your child doing something ordinary, such as waiting for a bus.
      - Partway through, a character in it tells a short story of their own. Your child invents that inner story.
      - Return to the outer story. Ask, "Can the inner story change what happens out here?"
questions:
  - What does the main character want, and what is stopping them?
  - Is the antagonist a person, a group or a force? Is it evil, or just in the way?
  - What did this character say, do or think that told you what they are like?
  - Have you met this kind of character before? What did you expect them to do?
  - If the ending were happy instead of sad, what else would have to change?
misconceptions:
  - thought: '"The antagonist is the bad guy."'
    why: Cartoons and movies often make the antagonist a villain.
    tryThis: Point to Lulu, the town council or the weather. Ask, "Are they evil, or just in the way?"
  - thought: '"The protagonist is whoever the story ends with."'
    why: The last moment of a story is the easiest to remember.
    tryThis: 'Ask: "Whose goal is the story about from the very start?"'
  - thought: '"A tragedy is any sad part of a story."'
    why: Sad moments happen in comedies too.
    tryThis: Look at the ending. A sad middle with a happy ending is still a comedy.
lookFor:
  - They name the conflict as a struggle between a character and a person, a group or a force.
  - They notice when a familiar type of character behaves in a surprising way.
  - They back up a claim about a character with something the character said, did or thought.
adapt:
  support:
    - Start with picture books and short cartoons, where the goal and the obstacle are easy to see.
    - Use the conflict map first, and say the sentence together, "___ wants ___, but ___ gets in the way."
    - Read "The Last Bedtime Story" in two parts, stopping after paragraph 3 to predict.
  access:
    - need: reading
      tip: Read the story aloud together, with your child as Lulu. Dialogue is easier to follow when you hear two voices.
    - need: attention
      tip: Act out the snow fort play in both versions. Moving and using voices keeps the comparison alive.
    - need: worry
      tip: Tragedy is about sad endings, but here they stay small, like a fallen snow fort. Let your child pick which version to act first.
    - need: language
      tip: Stock characters vary across cultures. Ask about stock characters from stories your family knows, and compare them with the knight and the dragon.
    - need: hands
      tip: For problems where your child taps a sentence, they can read it out and you can tap it.
  stretch:
    - Write a six-line comedy scene with a stock character who does the opposite of what readers expect.
    - Find a story within a story in a book they love, and explain how the inner story mirrors the outer one.
together:
  - problem: d1
    how: Read paragraphs 5 to 8 aloud together. Before each part, ask your child to point to the lines they need.
  - problem: b2
    how: 'Ask your child to finish the sentence for each character: "This story is about ___ trying to ___." Only one works from the first line.'
