id: changing-state
subject: science
why: Children see water change all around them, from frost to puddles to steam. Linking each change to heating or cooling turns everyday sights into science.
hook:
  title: The vanishing drop
  time: 5 minutes
  covers: [K2.5, U2.1]
  body: |-
    1. Paint a wet stripe on a dark plate or the sidewalk with a wet finger.
    2. Ask: **“Where will the water go?”**
    3. Watch it shrink together. Don’t explain yet.
activities:
  - title: Ice cube race
    time: 15 minutes
    materials: Three ice cubes, three small plates, a sunny window, a shady spot and the fridge
    covers: [K2.3, U2.1, S2.1]
    steps:
      - Put one ice cube in the sun, one in the shade and one in the fridge. Your child guesses which melts first.
      - Check every five minutes. What was different about the winner’s spot?
  - title: Make it rain
    time: 10 minutes
    materials: A dry glass, ice water and a paper towel
    covers: [K2.6, S2.1]
    steps:
      - Fill a dry glass with ice water and set it on a paper towel.
      - Ask your child to guess where any water will come from. Wait five minutes and look.
questions:
  - Why does a wet swimsuit dry faster on a hot day?
  - Where do the drops on a cold juice box come from?
  - What changes of state happen in our kitchen?
  - Can you think of something that melts and then freezes again?
misconceptions:
  - thought: '“The puddle soaked into the ground.”'
    why: Some water does soak in, so it seems like the whole answer.
    tryThis: Watch a puddle on a plate dry up. A plate can’t soak anything in.
  - thought: '“The cold glass is leaking.”'
    why: The drops appear on the glass, so they seem to come from inside.
    tryThis: Use coloured juice with ice. The drops outside are clear, not coloured.
  - thought: '“Steam is the same as water vapour.”'
    why: The white cloud above a kettle is what children call steam.
    tryThis: Water vapour is invisible. The white cloud is tiny drops that have already condensed.
lookFor:
  - They name a change and say whether it needs heating or cooling.
  - They explain drops on a cold glass with water vapour from the air.
adapt:
  support:
    - Teach melting and freezing first, with real ice. Add evaporation and condensation on another day.
    - Use the four-arrow picture in the lesson as a map to point at.
  access:
    - need: reading
      tip: Read the problems aloud. The choices are one or two words.
    - need: language
      tip: Pair each word with an action. Hands open for melting, fists for freezing, fingers floating up for evaporation.
    - need: worry
      tip: Guesses about where a puddle goes are often wrong at first. Say that scientists guessed wrong too.
  stretch:
    - Find a change of state outside in each season, such as frost, puddles and snowmelt.
together:
  - problem: d1
    how: If you can, lift a pot lid together, with a grown-up handling the hot pot. Name each change out loud.
  - problem: b1
    how: After the next shower, look at the mirror together. Ask your child to explain it to you.
