id: contact-forces
subject: science
why: Friction, tension and springiness are everywhere a child plays. Naming them helps a child choose the right material for a job.
hook:
  title: Sock skating
  time: 5 minutes
  covers: [K1.4]
  body: |-
    1. Your child slides in socks on a smooth floor, then on a rug.
    2. Ask: **“Why can you slide here but not there?”**
    3. Collect ideas. Don’t explain yet.
activities:
  - title: Slide test
    time: 15 minutes
    materials: A small book, a ruler or tape, and three surfaces such as tile, a towel and a rug
    covers: [K1.4, S1.5]
    steps:
      - Give the book the same flick on each surface. Mark where it stops.
      - Ask which surface had the most friction, and how they know.
  - title: Squash and spring
    time: 10 minutes
    materials: A sponge, play dough, an elastic band and a soft ball
    covers: [S1.6, K1.4]
    steps:
      - Squeeze or stretch each one, then let go.
      - Sort them into “springs back” and “stays changed”.
questions:
  - Why do winter boots have bumpy soles?
  - What would happen if a swing’s ropes went slack?
  - Which toys use an elastic force?
misconceptions:
  - thought: '“Friction is always bad.”'
    why: It slows things down, which sounds like a problem.
    tryThis: Ask how you would walk, hold a pencil or stop a bike without it.
  - thought: '“Only stretchy things change shape.”'
    why: Shape changes in hard things are hard to see.
    tryThis: Squeeze an empty plastic bottle. Ask what force changed its shape.
lookFor:
  - They name the contact force in a new situation, such as tension in a kite string.
  - They choose a surface or material because of its friction or springiness.
adapt:
  support:
    - Focus on friction first, with lots of sliding. Add the other three after.
    - Act out tension with a skipping rope between you.
  access:
    - need: reading
      tip: Read the problems aloud. Try each situation with real objects.
    - need: language
      tip: Pair each force word with a motion, like rubbing hands together for friction.
    - need: hands
      tip: Your child gives instructions and you do the squeezing and sliding.
  stretch:
    - Find something at home that uses all four contact forces, such as a bike.
together:
  - problem: d1
    how: Build a quick ramp with a book. Test carpet and a bare floor at the bottom.
  - problem: d2
    how: Imagine walking on a giant ice rink in socks. Act it out carefully.
