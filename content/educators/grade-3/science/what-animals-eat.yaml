id: what-animals-eat
subject: science
why: Sorting animals by what they eat is a first step in seeing how food chains work. It also builds careful, evidence-based sorting.
hook:
  title: What’s on the menu?
  time: 5 minutes
  covers: [K2.1, K2.2, K2.3]
  body: |-
    1. Name a pet or farm animal, like a cat, a cow or a chicken.
    2. Ask: **“What does it eat? Plants, meat, or both?”**
    3. Give the word for each: herbivore, carnivore, omnivore.
activities:
  - title: Animal menus
    time: 15 minutes
    materials: Paper, crayons and three animal pictures from a book or magazine
    covers: [K2.1, K2.2, K2.3, U2.1]
    steps:
      - Draw a menu for each animal, with plants on one side and meat on the other.
      - Decide if each animal is a herbivore, carnivore or omnivore.
  - title: Label a chain
    time: 10 minutes
    materials: A food chain drawn on paper
    covers: [S2.1]
    steps:
      - Write H, C or O under each animal in the chain.
      - Talk about which animals were hardest to decide, and why.
questions:
  - Is our pet a herbivore, carnivore or omnivore?
  - Why is a bear an omnivore and a wolf a carnivore?
  - What animal near us eats only plants?
misconceptions:
  - thought: '“Big animals are carnivores.”'
    why: Movies show big, scary meat eaters.
    tryThis: Name bison and moose. They are huge, and they eat only plants.
  - thought: '“If an animal eats one berry, it’s an omnivore.”'
    why: Children apply the rule too strictly.
    tryThis: Point to the word **mostly** in “carnivores eat mostly meat.”
lookFor:
  - They classify an animal from a list of what it eats.
  - They label the animals in a food chain.
adapt:
  support:
    - Use two groups first, plants only and meat only, then add “both.”
    - Sort toy animals into three boxes.
  access:
    - need: reading
      tip: Read each animal’s food list aloud.
    - need: attention
      tip: Sort a few toy animals between problems.
    - need: language
      tip: Use the leaf, meat and plate icons to stand for the three words.
  stretch:
    - Look up an Alberta animal you don’t know, and find out what it eats.
together:
  - problem: d1
    how: Write the grizzly’s foods on cards. Take away the berry card and ask what is left.
  - problem: d2
    how: Talk about the word “mostly” with your own food. What do you eat mostly?
