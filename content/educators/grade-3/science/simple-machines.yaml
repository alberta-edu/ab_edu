id: simple-machines
subject: science
why: Children use simple machines every day without noticing. Seeing a ramp shrink a push, or a lever turn a push around, makes forces feel useful.
hook:
  title: The heavy book stack
  time: 5 minutes
  covers: [K2.1]
  body: |-
    1. Stack a few heavy books on a chair.
    2. Ask your child how they could move the stack to the table with **less** effort.
    3. Collect every idea before you try any.
activities:
  - title: Ramp test
    time: 15 minutes
    materials: A toy car with a small bag of coins taped on, a board, a stack of books and an elastic band
    covers: [K2.1, S2.1, S2.3]
    steps:
      - Hook the elastic band to the car and lift it straight up to the top of the stack. Watch how far the band stretches.
      - Now pull it up a board ramp to the same height. Compare the stretch.
  - title: Design a mover
    time: 20 minutes
    materials: A box, spools or bottle caps, straws, tape and a board
    covers: [S2.2, S2.3]
    steps:
      - Your child designs a device that moves a toy across the floor and onto a shelf.
      - Ask which simple machines it uses, and test it safely together.
questions:
  - Where is a lever in a playground?
  - Why do grocery carts have wheels?
  - How is an ulu’s blade like a ramp?
misconceptions:
  - thought: '“A machine has to have a motor.”'
    why: The word machine makes children think of cars and robots.
    tryThis: Show a ramp, a bottle opener and a wagon. Ask what each one makes easier.
  - thought: '“A ramp makes things lighter.”'
    why: The push feels smaller, so the load seems lighter.
    tryThis: Lift the same toy before and after using the ramp. Ask if it changed.
lookFor:
  - They name a lever, wheel or ramp in a new place, like scissors or a wheelchair ramp.
  - They explain that a lever can turn a push down into a lift up.
adapt:
  support:
    - Start with the ramp only. Try the same lift with and without it.
    - Use a seesaw at the park to show a lever.
  access:
    - need: reading
      tip: Read the problems aloud. Act each one out with toys.
    - need: hands
      tip: Your child directs and you build the device.
    - need: language
      tip: Pair each machine with a gesture, like a sloped hand for a ramp.
  stretch:
    - Find three simple machines in the kitchen, and say what each one makes easier.
together:
  - problem: d1
    how: Build Ava’s device from a box, some spools and a board. Test it with a bag of rice.
  - problem: d2
    how: Lift a backpack, then pull it up a ramp. Ask whether the backpack got lighter.
