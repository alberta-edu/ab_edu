id: changing-earth
subject: science
why: Land looks still to a child. Seeing slow changes sped up, and fast ones in Alberta’s own history, shows that Earth is always changing.
hook:
  title: Was it always here?
  time: 5 minutes
  covers: [U1.1, K1.1]
  body: |-
    1. Look at a hill, a riverbank or a photo of the Rockies together.
    2. Ask: **“Did it always look like this? How could it change?”**
    3. Sort their ideas into fast and slow.
activities:
  - title: Sand tray land
    time: 20 minutes
    materials: A baking tray, damp sand, a cup of water and a spray bottle
    covers: [S1.1, K1.1, K1.2]
    steps:
      - Build a sand hill. Spray it gently many times, then pour a cup of water at once.
      - Ask which was like a flood and which was like rain over many years.
  - title: Big Rock, two ways
    time: 15 minutes
    materials: Paper and crayons
    covers: [K1.3, S1.2, S1.3]
    steps:
      - Retell the Blackfoot story of Napi and Big Rock, and the glacier story from science.
      - Your child draws one picture for each way of telling.
questions:
  - What fast change could happen near where we live?
  - Why might an Elder know how a river has changed?
  - How could a mountain be shorter long from now?
misconceptions:
  - thought: '“Mountains and rivers never change.”'
    why: The changes are too slow to see in a lifetime.
    tryThis: Run the mountain experiment, then look for loose rocks at the bottom of a hill.
  - thought: '“Only one way of knowing is right.”'
    why: Children may think stories and science compete.
    tryThis: Ask what each telling of Big Rock helps us learn, and who shares it.
lookFor:
  - They sort changes into fast and slow and give an example of each.
  - They name a way knowledge of the land is shared, like stories or science.
adapt:
  support:
    - Use only landslides and mountains at first, one fast and one slow.
    - Act out a landslide with a pile of blocks on a tilted book.
  access:
    - need: reading
      tip: Read the problems aloud and show the matching picture from the lesson.
    - need: attention
      tip: Do one tray model between problems.
    - need: language
      tip: Use a fast clap for fast changes and a slow rub for slow ones.
  stretch:
    - Find out what the Frank Slide looks like today, and how scientists watch Turtle Mountain.
together:
  - problem: d1
    how: Build Sam’s sand hill. Try the jug and the dripping, and compare.
  - problem: b2
    how: Tell both versions of Big Rock aloud. Ask your child what each one teaches.
