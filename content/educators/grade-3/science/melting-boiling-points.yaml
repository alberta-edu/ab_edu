id: melting-boiling-points
subject: science
why: A thermometer turns “hot” and “cold” into numbers to compare. Each substance’s own melting point explains why ice melts but spoons don’t.
hook:
  title: Why doesn’t the spoon melt?
  time: 5 minutes
  covers: [K4.2, U4.1]
  body: |-
    1. Put an ice cube and a metal spoon side by side on a plate.
    2. Ask: **“Both are solid. Why does only one melt?”**
    3. Collect ideas. Don’t explain yet.
activities:
  - title: Melting race
    time: 15 minutes
    materials: Small pieces of ice, chocolate and a crayon, foil cups, and a sunny window
    covers: [S4.1, K4.2]
    steps:
      - Your child guesses which will melt first, and which won’t melt at all.
      - Set all three in the sun and check every ten minutes.
      - Ask what this says about each one’s melting point.
  - title: Thermometer watch
    time: 10 minutes
    materials: A kitchen thermometer, ice water and a grown-up with a kettle
    covers: [K4.6, K4.7, S4.2]
    steps:
      - Read the thermometer in ice water. Is it near 0 °C?
      - A grown-up reads it in just-boiled water, kept well away from your child. Is it near 100 °C?
questions:
  - Why do icicles melt in spring but rocks don’t?
  - What would happen if water boiled at 30 °C?
  - Why is a pot made of metal, not ice or chocolate?
misconceptions:
  - thought: '“Water freezes at a colder temperature than ice melts.”'
    why: Freezing feels like it needs “extra cold”.
    tryThis: Point out that 0 °C is the line for both. Just above it ice melts, and just below it water freezes.
  - thought: '“Metal can’t melt.”'
    why: Children have never seen it happen.
    tryThis: Talk about how metal is melted in factories to make cans and cars. It needs very high temperatures.
lookFor:
  - They compare a temperature with a melting point to predict what will melt.
  - They say that a substance melts and freezes at the same temperature.
adapt:
  support:
    - Start with water only, 0 °C and 100 °C. Add other substances once those two are solid.
    - Use a big drawing of a thermometer to point at.
  access:
    - need: reading
      tip: Read numbers aloud with their units, such as “thirty-five degrees Celsius”.
    - need: language
      tip: Draw each word on the thermometer picture. Melting point and freezing point go at the same spot.
    - need: worry
      tip: Keep all heating with a grown-up. Your child can still do the predicting and the reading.
  stretch:
    - Look up the melting point of gold. Put it on your thermometer drawing, far above water.
together:
  - problem: d1
    how: Treat it like a detective case. Your child reads the clue, then checks each suspect in the table.
  - problem: b1
    how: Ask your child to say each comparison out loud, such as “Is 35 hotter than 30? Than 1538?”
