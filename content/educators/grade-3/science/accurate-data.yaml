id: accurate-data
subject: science
why: Children often trust any number they write down. Seeing two friends get different answers for the same table shows why tools, care and honesty matter.
hook:
  title: How long is the couch?
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. You and your child each measure the couch in hand spans.
    2. Compare your numbers. Why are they different?
    3. Measure again with a tape measure. Do you agree now?
activities:
  - title: Tool hunt
    time: 10 minutes
    materials: A ruler, a kitchen timer, a thermometer and a scale, if you have them
    covers: [K1.1, S1.2]
    steps:
      - Your child picks one thing to measure with each tool.
      - Say what each tool measures before you use it.
  - title: Fair race
    time: 15 minutes
    materials: Two toy cars, a ramp made from a book, and a tape measure
    covers: [K1.3, S1.2]
    steps:
      - Roll each car and measure from the bottom of the ramp.
      - Write every result, even the surprising ones.
questions:
  - Why do stores use scales instead of guessing how heavy fruit is?
  - What could make a measurement wrong?
  - Why should we write down a result we didn’t expect?
misconceptions:
  - thought: '“Any way of measuring is fine.”'
    why: Hand spans and steps feel like measuring.
    tryThis: Run the table experiment. Then measure one thing with hands and a ruler.
  - thought: '“If I want it to win, I can write a bigger number.”'
    why: Children want their own plant or car to do best.
    tryThis: Sort the objective cards. Talk about why other people need to trust our data.
lookFor:
  - They choose the right tool for a question.
  - They line up the 0, read at eye level and write what they see.
adapt:
  support:
    - Start with one tool, the ruler, and lots of small things to measure.
    - Mark the 0 on the ruler with a sticker.
  access:
    - need: reading
      tip: Read each problem aloud.
    - need: attention
      tip: Measure one real thing between each level.
    - need: hands
      tip: Hold the ruler still while your child reads it.
  stretch:
    - Measure the same plant every few days for two weeks, and keep a careful record.
together:
  - problem: d1
    how: Roll a toy car off a book ramp. Measure from the top, then from the bottom, and compare.
  - problem: d2
    how: Measure a houseplant together, following the steps in order.
