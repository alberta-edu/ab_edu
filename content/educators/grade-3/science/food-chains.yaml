id: food-chains
subject: science
why: Food chains show children that plants and animals need each other. A change to one can change them all.
hook:
  title: Who ate what?
  time: 5 minutes
  covers: [K1.1]
  body: |-
    1. Ask what your child ate for lunch, and what that food ate or needed.
    2. Keep going back until you reach a plant.
    3. Say: **“That is a food chain!”**
activities:
  - title: Food chain links
    time: 15 minutes
    materials: Paper strips, tape and crayons
    covers: [S1.1, K1.2]
    steps:
      - Draw a plant or animal on each strip. Loop the strips into a paper chain in food chain order.
      - Make one chain for a place near you, and one for somewhere else in Canada.
  - title: Food chain story
    time: 10 minutes
    materials: None
    covers: [K1.2, K1.4]
    steps:
      - Tell a short story of a food chain together, like a mouse, an owl and some seeds.
      - Retell it with a fox instead of the owl. Ask how many chains the mouse is in.
questions:
  - What food chain could we find in our park or yard?
  - Why does a hawk need grass, even though it doesn’t eat grass?
  - What is another way to show a food chain?
misconceptions:
  - thought: '“The arrow means ‘eats’.”'
    why: Children read the arrow from left to right as the action.
    tryThis: Say the arrow means “is eaten by,” or “food goes to.” Trace it with a finger.
  - thought: '“Each animal is in only one food chain.”'
    why: Most diagrams show one chain at a time.
    tryThis: Step through the many-chains visual and count the mouse’s chains.
lookFor:
  - They put a food chain in order, starting with a plant.
  - They explain what could happen if one part of a food chain changed.
adapt:
  support:
    - Start with two links, like grass and a rabbit, then add a third.
    - Use toy animals and line them up in order.
  access:
    - need: reading
      tip: Read the plant and animal names aloud, pointing to each picture.
    - need: attention
      tip: Make one paper chain between problems.
    - need: language
      tip: Use the sentence frame “The ___ eats the ___.”
  stretch:
    - Draw a food chain with four links, from a place in Canada your child chooses.
together:
  - problem: d1
    how: Line up toy animals for the chain. Take the sheep away and ask what changes.
  - problem: d2
    how: List everything a fox might eat, then make a chain for each.
