id: water-safety
subject: science
why: Alberta children live beside water that freezes and thaws. Knowing why ice changes keeps them safe, and caring for water starts early.
hook:
  title: What is under the ice?
  time: 5 minutes
  covers: [K5.5, S5.3]
  body: |-
    1. Show a photo of a frozen lake with people skating.
    2. Ask: **“Is the whole lake frozen? Where are the fish?”**
    3. Collect guesses. Don’t explain yet.
activities:
  - title: Freeze a pond
    time: 10 minutes, then overnight
    materials: A plastic bowl of water and the freezer, or a cold night outside
    covers: [K5.5, S5.3]
    steps:
      - Put the bowl in the freezer and check after an hour. Where did the ice start?
      - Tap through the thin ice. Is there water underneath?
  - title: Safety walk
    time: 15 minutes
    materials: A walk to a local pond, creek or storm drain, with a grown-up
    covers: [S5.2, S5.5]
    steps:
      - Stop well back from the water. Talk about what makes it safe or unsafe this season.
      - Find one thing you could do to respect this water, like picking up litter.
questions:
  - Why do fish not freeze in winter?
  - Why is ice in March more dangerous than ice in January?
  - Where does the water in a storm drain go?
  - What are our family’s rules near water?
misconceptions:
  - thought: '“If ice looks solid, it is safe.”'
    why: Thin or grey ice can look just like strong ice.
    tryThis: Look at the ice-check pictures together. Only a grown-up who measures can tell.
  - thought: '“Lakes freeze all the way to the bottom.”'
    why: The top looks frozen solid.
    tryThis: Freeze a bowl of water for an hour and look underneath the top layer.
lookFor:
  - They give a safety rule for the season, with a reason.
  - They name a change of state they saw outside this week.
adapt:
  support:
    - Focus on one rule, “Never go on ice without a grown-up.” Add the rest later.
    - Use real local places your child knows.
  access:
    - need: reading
      tip: Read the problems aloud. Act out “stand back” and “check the ice”.
    - need: worry
      tip: Keep the tone calm. These are rules that keep us safe so we can enjoy the water.
    - need: language
      tip: Use pictures of each season. Point and name the danger in simple words.
  stretch:
    - Make a water-safety poster with one rule for each season.
together:
  - problem: d1
    how: Draw the three spots on paper. Your child checks each one for thickness and colour.
  - problem: b1
    how: Ask your child to explain the danger before reading the choices.
