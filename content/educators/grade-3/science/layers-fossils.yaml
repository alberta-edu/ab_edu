id: layers-fossils
subject: science
why: To a child, a cliff is just rock. Knowing that layers pile up in order lets them read it like a story of the past.
hook:
  title: Sandwich stack
  time: 5 minutes
  covers: [K4.1, U4.1]
  body: |-
    1. Stack a slice of bread, cheese, then another slice.
    2. Ask: **“Which did I put down first? How can you tell?”**
    3. Say that rock layers pile up the same way, one on top of another.
activities:
  - title: Layers in a jar
    time: 15 minutes, then overnight
    materials: A clear jar, water, and a cup each of sand, soil and small gravel
    covers: [K4.1, S4.1]
    steps:
      - Pour in one material at a time, waiting for each to settle. Hide a small toy between two layers.
      - The next day, ask which layer is oldest, and when the toy got buried.
  - title: Dig like a paleontologist
    time: 20 minutes
    materials: A tray of sand, a few clean chicken bones or pasta shapes, a paintbrush and a spoon
    covers: [K4.4, K4.9]
    steps:
      - Bury the “fossils” at different depths. Your child digs slowly with the spoon and brushes off the sand.
      - Talk about why paleontologists dig so carefully.
questions:
  - Where have you seen layers in rock or soil?
  - Why are the bottom layers the oldest?
  - How do paleontologists know dinosaurs lived long ago?
misconceptions:
  - thought: '“Fossils are old bones.”'
    why: They look like bones.
    tryThis: Explain that over millions of years the bone turned to stone. Hold a rock and a bone to compare.
  - thought: '“People and dinosaurs lived at the same time.”'
    why: Cartoons and movies often show them together.
    tryThis: Count the rock layers in the fossil-forms visual. Talk about how long millions of years is.
lookFor:
  - They say which layer is oldest and why.
  - They explain that fossil bones in old layers show how long ago dinosaurs lived.
adapt:
  support:
    - Use a stack of coloured paper as layers and lift them off one at a time.
    - Name only two layers at first, top and bottom.
  access:
    - need: reading
      tip: Read the problems aloud and point to the layers in the lesson pictures.
    - need: attention
      tip: Do the sand dig between problems.
    - need: language
      tip: Use hand signs for “older” (hand low) and “newer” (hand high).
  stretch:
    - Look at a road cut or riverbank with layers. Draw it and guess which layer is oldest.
together:
  - problem: d1
    how: Stack books for layers and put a fish picture low and a bone picture high. Ask which is older.
  - problem: b1
    how: Act out the steps with a toy dinosaur, a tray of sand and a cup of water.
