id: creativity-inventions
subject: science
why: Children often think creativity means art, or starting from nothing. Seeing that inventors build on old ideas shows them they can invent too.
hook:
  title: How many ways?
  time: 5 minutes
  covers: [K2.2, U2.1]
  body: |-
    1. Hold up a spoon, a sock or an empty box.
    2. Ask: **“What else could this be?”** Take turns giving ideas.
    3. Count your ideas together. Silly ones count too.
activities:
  - title: Two routes
    time: 15 minutes
    materials: Paper, a pencil, and a simple map of your street or home
    covers: [S2.1, K2.1]
    steps:
      - Together, write two different sets of steps from the front door to the kitchen, or from home to school.
      - Test both. Do they get to the same place?
  - title: Invent from old
    time: 20 minutes
    materials: Clean recycling, tape and scissors
    covers: [S2.3, K2.4]
    steps:
      - Combine, change or reapply two things to make something new.
      - Your child names which one they did, and what it is for.
questions:
  - What is your favourite invention? What old ideas is it made from?
  - How many ways could we get to the park?
  - Why do astronauts need a robot arm in space?
misconceptions:
  - thought: '“Creativity is only for drawing and art.”'
    why: Art is where children hear the word most.
    tryThis: Tap through the Canadarm. Engineers and programmers use creativity too.
  - thought: '“There is only one right way.”'
    why: Many school tasks have one right answer.
    tryThis: Run the two-ways experiment, then find a third way together.
lookFor:
  - They give more than one way to reach the same outcome.
  - They say how a new thing combines, changes or reapplies old ideas.
adapt:
  support:
    - Start with two ways to do something they know well, like brushing teeth.
    - Act out Ava’s and Ben’s ways on the floor with tape squares.
  access:
    - need: reading
      tip: Read each problem aloud.
    - need: attention
      tip: Build the recycling invention first, then do the problems.
    - need: language
      tip: Use the frame “I combined ___ and ___ to make ___.”
  stretch:
    - Find out about another Canadian invention, like the snowmobile or basketball, and what old ideas it used.
together:
  - problem: d1
    how: Draw the grid on paper. Move a toy along Ella’s steps, then Jay’s.
  - problem: d2
    how: Find something at home that combines two old ideas, like a pencil with an eraser.
