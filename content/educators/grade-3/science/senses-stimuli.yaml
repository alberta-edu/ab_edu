id: senses-stimuli
subject: science
why: Children know animals see and hear, but rarely think of plants as sensing anything. Watching both respond shows how all living things work to survive.
hook:
  title: Freeze and listen
  time: 5 minutes
  covers: [K3.1, K3.2]
  body: |-
    1. Your child closes their eyes. Make a small sound, like a clap or a crinkle.
    2. Ask: **“What did you sense? What did your body want to do?”**
    3. Say that animals sense and respond the same way.
activities:
  - title: Plant in a box
    time: 10 minutes, then a week
    materials: A shoebox with a hole cut in one end, a small potted bean or pea plant
    covers: [K3.1, S3.1]
    steps:
      - Put the plant in the box, close the lid and set the hole toward a window.
      - Peek each day. Draw which way the plant is growing.
  - title: Animal watch
    time: 15 minutes
    materials: A window or a walk outside
    covers: [K3.2, S3.1]
    steps:
      - Watch a bird or squirrel quietly. Notice what it looks at or listens to.
      - Talk about what it sensed and how it responded.
questions:
  - What does our cat or dog do when it smells food?
  - Why do plants on a windowsill lean toward the window?
  - What helps a rabbit stay safe from a fox?
misconceptions:
  - thought: '“Plants don’t do anything.”'
    why: Plants move too slowly to see.
    tryThis: Run the windowsill experiment, or try the plant in a box.
  - thought: '“Animals only use their eyes.”'
    why: Sight is the sense children notice most.
    tryThis: Talk about the bear that smells berries and the pups that hear their pack.
lookFor:
  - They name what a plant or animal senses, and how it responds.
  - They explain how sensing helps it survive.
adapt:
  support:
    - Start with your child’s own senses before plants and animals.
    - Act out an animal sensing danger and running away.
  access:
    - need: reading
      tip: Read each problem aloud and act it out.
    - need: attention
      tip: Check on the plant in the box between problems.
    - need: language
      tip: Use the frame “It senses ___, so it ___.”
  stretch:
    - Find out how one Alberta animal gets ready for winter, and what it senses.
together:
  - problem: d1
    how: Play deer and wolf. One person sneaks, the other listens with eyes closed.
  - problem: b2
    how: Lift a log or rock outside, if you can, and watch what the bugs do. Put it back gently.
