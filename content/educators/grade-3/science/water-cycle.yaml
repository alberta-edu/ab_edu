id: water-cycle
subject: science
why: The water in a glass has been a cloud, a lake and a snowflake. The cycle links changes of state to the weather.
hook:
  title: Where was this water yesterday?
  time: 5 minutes
  covers: [K5.1, U5.1]
  body: |-
    1. Hand your child a glass of water.
    2. Ask: **“Where was this water last week? Last year?”**
    3. Enjoy the wild ideas. Don’t correct them yet.
activities:
  - title: Water cycle in a bag
    time: 10 minutes, then check after a few hours
    materials: A zip bag, a little water, tape and a sunny window
    covers: [K5.2, S5.1, U5.1]
    steps:
      - Put a little water in the bag, seal it and tape it to a sunny window.
      - Your child predicts what will happen. Check after a few hours.
      - Ask them to point to evaporation, condensation and “rain” in the bag.
  - title: Draw the circle
    time: 10 minutes
    materials: Paper and crayons
    covers: [S5.1, K5.2]
    steps:
      - Your child draws a lake, the sun, a cloud and a mountain.
      - Together, add arrows to show where the water goes, and label each change.
questions:
  - Where does a puddle go on a sunny day?
  - Why do clouds form high up in the sky?
  - Is the water cycle the same in winter? What changes?
misconceptions:
  - thought: '“Clouds are made of smoke or cotton.”'
    why: Clouds look fluffy and solid from the ground.
    tryThis: Breathe on a cold window and look at the fog. Clouds are tiny drops like these.
  - thought: '“When water dries up, it’s gone.”'
    why: The vapour can’t be seen.
    tryThis: Do the bag activity. The water that “disappears” shows up again as drops.
lookFor:
  - They draw the cycle as a loop, with arrows going all the way around.
  - They name each change of state in the right part of the cycle.
adapt:
  support:
    - Teach two changes first, evaporation and rain. Add condensation once the loop makes sense.
    - Use the bag activity as the anchor and keep pointing back to it.
  access:
    - need: reading
      tip: Read the problems aloud. Act out each part of the cycle with your hands.
    - need: language
      tip: Say “goes up”, “makes clouds” and “falls down” first. Add the science words after.
    - need: attention
      tip: Do the bag activity in the morning, and come back to the lesson after lunch to check.
  stretch:
    - Keep a weather log for a week. Which part of the water cycle did you see each day?
together:
  - problem: d1
    how: If you can, make a jar garden together and watch for drops on the lid each morning.
  - problem: d2
    how: Ask your child to draw Owen’s idea as a line, then fix it by making it a circle.
