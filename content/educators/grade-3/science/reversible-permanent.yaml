id: reversible-permanent
subject: science
why: Children learn to ask “Can this be undone?” It helps them predict changes in the kitchen, and later in chemistry.
hook:
  title: Un-bake it
  time: 5 minutes
  covers: [K6.2, K6.1]
  body: |-
    1. Show a cookie and an ice cube.
    2. Ask: **“Can we turn the cookie back into dough? Can we turn the ice back into water?”**
    3. Let your child argue both. Don’t explain yet.
activities:
  - title: Kitchen change hunt
    time: 15 minutes
    materials: The kitchen while a meal is made, with a grown-up doing the cooking
    covers: [S6.1, K6.1, K6.2]
    steps:
      - Your child watches for changes, such as butter melting or pasta softening.
      - For each change, they decide if it can be undone, and say why.
  - title: Melt and set
    time: 15 minutes, plus cooling time
    materials: Chocolate chips, a paper cup, a sunny window or warm water, and the fridge
    covers: [S6.2, K6.1]
    steps:
      - Put chips in the cup in a warm spot until they melt. A grown-up handles any warm water.
      - Put the cup in the fridge. Is it solid again? Is the shape the same?
questions:
  - What changes in our kitchen can be undone?
  - Why can melted wax be used again, but a burnt match can’t?
  - Is cutting paper reversible? Why do you think so?
misconceptions:
  - thought: '“Melting chocolate is permanent because the shape changed.”'
    why: The new shape looks different from the old one.
    tryThis: Ask if it is still solid chocolate. Reversible means the material comes back, even in a new shape.
  - thought: '“Cooling undoes everything heating does.”'
    why: It works for melting, which they learned first.
    tryThis: Cool a piece of toast together. Is it bread again?
lookFor:
  - They give a reason, such as “you can freeze it again”, not just a label.
  - They see that the same heat changes different materials in different ways.
adapt:
  support:
    - Start with two clear examples, ice and an egg, before sorting more.
    - Use “can be undone” and “can’t be undone” before the words reversible and permanent.
  access:
    - need: reading
      tip: Read the cards aloud. The pictures carry most of the meaning.
    - need: language
      tip: Act out “undo” by rewinding with your hands.
    - need: worry
      tip: Some changes are tricky even for adults. Thinking out loud is more useful than being right.
  stretch:
    - Find a change that is hard to sort, like a torn page or dissolving sugar. What would you need to know to decide?
together:
  - problem: d1
    how: Take Jay’s side cheerfully. Your child finds the example that proves you wrong.
  - problem: b2
    how: Ask what is the same and what is different about the chocolate and the batter.
