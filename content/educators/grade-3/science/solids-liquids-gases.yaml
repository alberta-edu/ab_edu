id: solids-liquids-gases
subject: science
why: Children sort the stuff of the world by watching how it behaves. Shape and volume are the first clues scientists use to tell matter apart.
hook:
  title: Is air something?
  time: 5 minutes
  covers: [K2.1, K3.4]
  body: |-
    1. Hand your child an “empty” plastic bag. Ask: **“Is there anything in it?”**
    2. Scoop the bag through the air and twist it shut. Let them squeeze it.
    3. Ask: **“What is pushing back?”** Don’t explain yet.
activities:
  - title: Same water, new shape
    time: 10 minutes
    materials: A measuring cup, water, and three differently shaped clear containers
    covers: [K3.2, K3.3, K3.6, S3.2]
    steps:
      - Pour one cup of water into the tallest container. Mark the level.
      - Ask which container will have “the most water” after you pour. Get a guess.
      - Pour it from container to container, then back into the measuring cup. Still one cup?
  - title: Solid, liquid or gas hunt
    time: 10 minutes
    materials: Paper, a pencil and the kitchen
    covers: [K2.2, S3.1]
    steps:
      - Your child finds three solids, three liquids and one gas in the kitchen.
      - For each one, ask whether it keeps its shape, and how they know.
questions:
  - Why does a balloon get bigger when you blow into it?
  - Is toothpaste a solid or a liquid? How could you test it?
  - Why can you smell cookies baking from another room?
  - Juice looks like more in a thin glass. How could you check?
misconceptions:
  - thought: '“Air is nothing.”'
    why: You can’t see it, so it seems empty.
    tryThis: Blow up a balloon. Ask what is taking up the space inside.
  - thought: '“The tall glass has more juice.”'
    why: Children judge amount by height.
    tryThis: Pour it back into a measuring cup together. Let the result surprise them.
  - thought: '“Sand and sugar are liquids, because they pour.”'
    why: They flow and take the shape of the cup.
    tryThis: Look at one grain with a magnifying glass. Pour some on a plate. Does it spread flat?
lookFor:
  - They name the state by what it does, “it keeps its shape”, not just by what it is.
  - They know that pouring a liquid into a new shape doesn’t change how much there is.
adapt:
  support:
    - Start with one solid, one liquid and one gas you can touch or see, such as ice, water and a balloon.
    - Use hand shapes. A fist for a solid, a flat hand sliding for a liquid, fingers spread for a gas.
  access:
    - need: reading
      tip: Read the problem aloud. Most choices have a picture.
    - need: language
      tip: Say “keeps its shape”, “takes the shape” and “fills it all” before the words solid, liquid and gas.
    - need: attention
      tip: Do one pour at the sink between problems. Two minutes, then back.
  stretch:
    - Find something that is hard to sort, like jelly or shaving foam. Decide which state fits best, and why.
together:
  - problem: d1
    how: Draw the three mystery bags in a big box together before answering. Your child draws what each one did.
  - problem: d2
    how: Take Leo’s side cheerfully. Pour sand or sugar on a plate and ask your child to change your mind.
