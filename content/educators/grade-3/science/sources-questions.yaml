id: sources-questions
subject: science
why: Children meet facts everywhere, online and off. Asking “Where is this from?” and “What new question does it give us?” is how scientists build knowledge.
hook:
  title: Where did you hear that?
  time: 5 minutes
  covers: [K1.4, K1.5]
  body: |-
    1. Share a fact, like “Bats are not blind.”
    2. Ask: **“How could we find out if it’s true?”**
    3. List the sources you could check, and pick the most trustworthy one.
activities:
  - title: Bean in the dark
    time: 10 minutes, then a week
    materials: Two cups, soil, dry beans and water
    covers: [U1.1, S1.5]
    steps:
      - Plant one bean in a sunny spot and one in a dark cupboard. Water both.
      - Check every two days. Talk about what you see and what new question it gives you.
  - title: Ask a Knowledge Keeper or community member
    time: 20 minutes
    materials: A question about plants, animals or the land near you
    covers: [K1.4, K1.5]
    steps:
      - Find out how your school or local Friendship Centre invites an Elder or Knowledge Keeper, and follow that protocol.
      - Or ask a community member, like a gardener, what they have noticed over the years.
questions:
  - How do we know a website is trustworthy?
  - What surprised you in an investigation? What new question did it give you?
  - Who in our community knows a lot about plants or animals?
misconceptions:
  - thought: '“If it’s online, it’s true.”'
    why: Websites look official.
    tryThis: Sort the trust cards. Compare an official government site with a random post.
  - thought: '“If the test didn’t match my guess, it failed.”'
    why: Children feel they got it wrong.
    tryThis: Run the seeds-in-the-dark experiment. A surprising result teaches us something new.
lookFor:
  - They name a source and say if it is trustworthy, and why.
  - They say whether data supports or contradicts an idea, and ask a new question.
adapt:
  support:
    - Start with two sources only, a textbook and a stranger’s post.
    - Use real data from the bean activity for the analyzing step.
  access:
    - need: reading
      tip: Read each problem and table aloud.
    - need: attention
      tip: Check the bean cups between levels.
    - need: language
      tip: Use the frame “I trust this source because ___.”
  stretch:
    - Write three new questions about the pale bean sprout. Pick one you could test.
together:
  - problem: d1
    how: Put one ice cube in the sun and one in the shade. Time them, then test a new question.
  - problem: d2
    how: Look up why worms come out after rain in a science book or a trustworthy website together.
