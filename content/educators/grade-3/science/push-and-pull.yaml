id: push-and-pull
subject: science
why: Children use forces all day without naming them. Describing a force’s strength and direction is how scientists predict what will move.
hook:
  title: Push me, pull me
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    1. Hand your child a toy car.
    2. Ask them to make it move without throwing it, in as many ways as they can.
    3. Ask: **“Was that a push or a pull?”** after each one.
activities:
  - title: Strong and weak rolls
    time: 10 minutes
    materials: A ball, a hallway and some tape to mark where it stops
    covers: [K1.6, S1.3, S1.4]
    steps:
      - Your child predicts how far a gentle push and a hard push will roll the ball.
      - Roll it each way and mark where it stops. Was the prediction right?
  - title: Arrow detective
    time: 10 minutes
    materials: Paper, a pencil and a walk around the house
    covers: [K1.7, S1.2]
    steps:
      - Find three forces, such as opening a door or lifting a bag.
      - Draw each one with an arrow. Make the arrow bigger for a stronger force.
questions:
  - What pushes and pulls did you use getting ready this morning?
  - How could you make a ball roll farther?
  - Can a thing that isn’t alive push or pull? Can you find one?
misconceptions:
  - thought: '“Only living things make forces.”'
    why: Children think of forces as something they do with their muscles.
    tryThis: Roll a ball into a block tower. Ask what pushed the blocks.
  - thought: '“A force is the same as moving.”'
    why: The forces they notice usually make things move.
    tryThis: Push hard on a wall. Ask if there was a force, even though nothing moved.
lookFor:
  - They describe a force with both a strength and a direction, such as “a strong push from the left”.
  - They draw bigger arrows for stronger forces without being asked.
adapt:
  support:
    - Start with push and pull only. Add strength and direction once those are easy.
    - Act out each force with your own body.
  access:
    - need: reading
      tip: Read the problems aloud and act out each one.
    - need: language
      tip: Use gestures for each direction word, then say the word together.
    - need: hands
      tip: Your child can say “stronger” or “weaker” while you roll the ball.
  stretch:
    - Draw a tug of war with arrows. How do the arrows show which team is pulling harder?
together:
  - problem: d1
    how: Act it out with a real box or laundry basket. Your child decides who pushes harder.
  - problem: d2
    how: Take Kai’s side. Your child finds things around the house that push without being alive.
