id: computational-thinking
subject: science
why: Children solve problems every day without naming how. Naming chunks, patterns and working backward gives them tools for any subject.
hook:
  title: Robot says
  time: 5 minutes
  covers: [S1.1, K1.1]
  body: |-
    1. You are the robot. Your child gives you steps to walk to the door.
    2. Do **exactly** what they say, even if it is silly.
    3. When you bump into something, work backward together to find the wrong step.
activities:
  - title: Chunk a chore
    time: 15 minutes
    materials: A real job at home, like setting the table or tidying a shelf
    covers: [K1.1, S1.2]
    steps:
      - Your child splits the job into three chunks and names them.
      - Do one chunk at a time, ticking each one off.
  - title: Write robot steps
    time: 15 minutes
    materials: Paper, a pencil and a toy to move
    covers: [S1.1, K1.1]
    steps:
      - Write 3 or 4 steps to move the toy from the couch to a box.
      - Someone follows them exactly. Fix any bug you find.
questions:
  - What big job could we break into chunks?
  - What pattern do you see in the way we get ready in the morning?
  - How does a map app know which way to go?
misconceptions:
  - thought: '“The robot made a mistake.”'
    why: Children picture machines as thinking for themselves.
    tryThis: Watch the robot experiment again. It did exactly what the steps said, so the steps had the bug.
  - thought: '“If it goes wrong, start all over.”'
    why: Starting again feels simpler.
    tryThis: Work backward from where it went wrong. Usually only one step needs fixing.
lookFor:
  - They break a job into chunks, or spot a repeating pattern, and say which one they used.
  - They write clear steps in order, and work backward to fix one that goes wrong.
adapt:
  support:
    - Play Robot says with only two steps first.
    - Sort the chunks of a job with real objects, like cutlery into a tray.
  access:
    - need: reading
      tip: Read each problem aloud and act out the steps.
    - need: attention
      tip: Do a round of Robot says between levels.
    - need: language
      tip: Use the frame “First ___, then ___, last ___.”
  stretch:
    - Write steps for a game of hide-and-seek. Ask someone to follow them and find any bugs.
together:
  - problem: d1
    how: Act out the toast steps with a slice of bread and a pretend toaster. Where should the butter go?
  - problem: d2
    how: Your child is the robot and waters a real plant, following the steps in order.
