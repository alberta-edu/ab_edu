id: natural-processed
subject: science
why: Children learn that everything they use began in nature. Asking “What was this before?” builds care for where things come from.
hook:
  title: What was it before?
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    1. Put a pencil, a glass jar, a wool sock and a pinecone on the table.
    2. Ask: **“Which of these did people make? What was it before?”**
    3. Let every guess stand. Don’t explain yet.
activities:
  - title: Kitchen detectives
    time: 10 minutes
    materials: Five or six things from the kitchen, such as a spoon, a paper bag, a jar and an apple
    covers: [K1.1, S1.1, U1.1]
    steps:
      - Your child sorts the things into natural and processed piles.
      - For each processed thing, ask what natural material it started as. Guesses are fine.
      - Look one up together, such as how paper or glass is made.
  - title: The drip test
    time: 10 minutes
    materials: A cotton or wool cloth, a plastic bag, a spoon and a cup of water
    covers: [K1.2]
    steps:
      - Ask which one would make the best rain hat. Get a prediction.
      - Drip three spoonfuls of water on each one. Feel underneath.
      - 'Ask: “Which job was each material made for?”'
questions:
  - What is the most surprising thing you found that started as a tree?
  - Why do you think people make plastic instead of always using wood?
  - What natural materials could you build a shelter from in our backyard?
  - Why would someone ask a plant for permission before picking it?
misconceptions:
  - thought: '“Paper comes from trees, so paper is natural.”'
    why: The link to the tree is real, so it feels like the whole answer.
    tryThis: 'Ask: “Could you find a sheet of paper in a forest?” Processed means people changed it.'
  - thought: '“Natural means it’s from a plant.”'
    why: Plants are the natural things children think of first.
    tryThis: Name rocks, shells, snow and wool. Ask where each one came from.
lookFor:
  - They ask “What was this made from?” about new objects without being prompted.
  - They explain that a processed material was changed by people, not just that it came from nature.
adapt:
  support:
    - Sort only three things at first, one clearly natural, one clearly processed and one tricky.
    - Hold the real objects. Touching a rock and a brick helps more than pictures.
  access:
    - need: reading
      tip: Read the problems aloud. The choices are short and have pictures.
    - need: language
      tip: Use “from nature” and “made by people” before the words natural and processed.
    - need: hands
      tip: Your child points and you tap. The sorting thinking stays with them.
  stretch:
    - Pick one processed thing at home and draw its journey back to nature in three pictures.
together:
  - problem: d1
    how: Take Theo’s side and argue it cheerfully. Ask your child what question would prove you wrong.
  - problem: b2
    how: Before the choices, ask what your child would build from snow. Then read the choices together.
