id: soil
subject: science
why: To a child, soil is just dirt. Seeing the life, air and water in it helps them care for the ground.
hook:
  title: A handful of soil
  time: 5 minutes
  covers: [K5.1, S5.1]
  body: |-
    1. Scoop a handful of soil from a garden or park onto white paper.
    2. Ask: **“What can you find in it?”**
    3. Sort what you find into rock bits, living things and dead things.
activities:
  - title: Soil shake
    time: 10 minutes, then a few hours
    materials: A clear jar with a lid, garden soil and water
    covers: [K5.1, S5.1]
    steps:
      - Fill the jar a third with soil, then nearly to the top with water. Close it tight and shake.
      - Watch for bubbles and floating bits. Look again in a few hours for layers.
  - title: Who lives here?
    time: 15 minutes
    materials: A garden trowel and a magnifying glass, if you have one
    covers: [K5.2, S5.2]
    steps:
      - Lift a rock or log, or dig a small hole. Look for worms, ants and beetles.
      - Put everything back gently, just as you found it.
questions:
  - What lives in the soil near our home?
  - Where does the soil’s air come from?
  - How could a worm change our garden?
misconceptions:
  - thought: '“Soil is just dirt.”'
    why: It all looks brown from above.
    tryThis: Do the soil shake and name each part you see.
  - thought: '“Worms are bad for gardens.”'
    why: Some children find worms gross or scary.
    tryThis: Step through the soil-changes visual. Ask what the tunnels do for the soil.
lookFor:
  - They name parts of soil, including living and decaying things.
  - They describe how worms or plants change soil.
adapt:
  support:
    - Start with three parts of soil, rock bits, living things and water.
    - Use picture cards of each part to sort.
  access:
    - need: reading
      tip: Read the problems aloud and point to the parts in the lesson picture.
    - need: attention
      tip: Do the soil shake first, then come back to the problems.
    - need: language
      tip: Use the emoji on each button to name each part.
  stretch:
    - Put soil from two places, like a garden and a schoolyard, in two jars. Compare them.
together:
  - problem: d1
    how: Do the soil shake together before trying this problem.
  - problem: b1
    how: Leave a few leaves on soil in a pot with a worm. Check each week.
