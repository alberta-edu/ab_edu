id: wind-water-ice
subject: science
why: Alberta’s hoodoos, rivers and glaciers are carved and fed by wind, water and ice. Seeing how helps a child read the land around them.
hook:
  title: Blow and pour
  time: 5 minutes
  covers: [K2.1]
  body: |-
    1. Pour a little sand or flour on a tray.
    2. Your child blows on it gently, then you trickle water across it.
    3. Ask: **“Where did the sand go?”**
activities:
  - title: Make a hoodoo
    time: 15 minutes
    materials: A tray, damp sand, a few coins and a spray bottle
    covers: [K2.1, K2.5, S2.1]
    steps:
      - Pat the sand flat and lay coins on top. Spray it many times, gently.
      - Ask why the sand under the coins is still there.
  - title: Glacier to ocean
    time: 15 minutes
    materials: An ice cube, a sloped tray or baking sheet, and a bowl
    covers: [S2.2, K2.3]
    steps:
      - Set the ice at the top of the slope and the bowl at the bottom as the ocean.
      - Watch the meltwater run down. Name a river it could be, like the Bow.
questions:
  - Which river near us starts at a glacier?
  - How could wind change a sandy field?
  - What could we do to slow down warming?
misconceptions:
  - thought: '“Rivers are always there. Nothing feeds them.”'
    why: Children rarely see where a river starts.
    tryThis: Look at a map of the Bow River together. Follow it back to the Bow Glacier.
  - thought: '“Glaciers never change.”'
    why: The changes are too slow to see in one visit.
    tryThis: Compare old and new photos of the Athabasca Glacier.
lookFor:
  - They explain how wind or water carried material away, using a hoodoo or a canyon.
  - They trace water from a glacier, through a river, to an ocean.
adapt:
  support:
    - Start with water only. Add wind and ice once water makes sense.
    - Draw the glacier-to-ocean trip as three boxes and arrows.
  access:
    - need: reading
      tip: Read the problems aloud. Point to each place on the lesson pictures.
    - need: attention
      tip: Do the hoodoo tray in two short sessions.
    - need: language
      tip: Use hand motions for wind blowing, water flowing and ice sliding.
  stretch:
    - Find the Columbia Icefield on a map and trace one river to each ocean.
together:
  - problem: b2
    how: Act out the drop’s trip from the top of the stairs to a bowl at the bottom.
  - problem: d1
    how: Melt two ice cubes, one in a cool spot and one in a warm spot. Compare.
