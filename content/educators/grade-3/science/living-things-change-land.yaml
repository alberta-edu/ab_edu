id: living-things-change-land
subject: science
why: Children see people, plants and animals as living on the land, not changing it. Noticing those changes builds a sense of shared responsibility.
hook:
  title: Then and now
  time: 5 minutes
  covers: [K3.1, U3.1]
  body: |-
    1. Look at your street or schoolyard together.
    2. Ask: **“What did this place look like before people built here?”**
    3. List what people added and what they took away.
activities:
  - title: Change detectives
    time: 20 minutes
    materials: A walk outside, and paper to tally on
    covers: [S3.1, S3.2]
    steps:
      - Tally changes to the land made by people, plants and animals, like paths, holes and fallen trees.
      - Ask which ones help the land and which ones harm it.
  - title: Where does breakfast grow?
    time: 10 minutes
    materials: Two or three breakfast foods with labels
    covers: [S3.4, K3.1]
    steps:
      - For each food, find the crop it comes from, like wheat, oats or canola.
      - Talk about how a farm changed the land to grow it.
questions:
  - What changes have people made to the land near our home?
  - How does a beaver change a stream?
  - What can our family do to care for the land?
misconceptions:
  - thought: '“Only people change the land.”'
    why: Animal changes are slow or hidden underground.
    tryThis: Look for ant hills, gopher mounds or chewed trees on a walk.
  - thought: '“Farms are just nature.”'
    why: Fields are green and full of plants.
    tryThis: Compare a picture of a wheat field with one of wild prairie. Ask what changed.
lookFor:
  - They name a human, plant or animal activity and say how it changes the land.
  - They suggest a stewardship action that fits a problem.
adapt:
  support:
    - Start with animals the child knows, like a dog digging a hole.
    - Sort picture cards into people, plants and animals.
  access:
    - need: reading
      tip: Read the problems aloud and point to the matching lesson picture.
    - need: attention
      tip: Do the activities outdoors in short bursts.
    - need: language
      tip: Use the emoji on each button to name the activity first.
  stretch:
    - Plan one stewardship project for your yard or school, and carry it out.
together:
  - problem: d1
    how: Draw the park before and after the deer. Ask what happens to the soil next.
  - problem: d2
    how: Pick a real spot near you. Plan what stewardship would look like there.
