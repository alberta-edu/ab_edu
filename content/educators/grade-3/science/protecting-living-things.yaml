id: protecting-living-things
subject: science
why: Children care about animals. Knowing how plants and animals depend on each other shows them small actions that really help.
hook:
  title: Who needs whom?
  time: 5 minutes
  covers: [K4.2]
  body: |-
    1. Look out a window or at a picture of a backyard.
    2. Ask: **“Which animals here need a plant? Which plants need an animal?”**
    3. Draw lines between the pairs you find.
activities:
  - title: Respectful nature walk
    time: 20 minutes
    materials: A park or green space, and a notebook
    covers: [S4.2, K4.1]
    steps:
      - Agree on rules first, like staying on the path and watching from far away.
      - Tally the birds or animals you see, like a mini bird count.
  - title: Protect it poster
    time: 15 minutes
    materials: Paper and crayons
    covers: [S4.1, U4.1]
    steps:
      - Choose a plant or animal near you.
      - Draw one action your family can take to protect it.
questions:
  - What plants or animals near us need protecting?
  - How do bees and flowers help each other?
  - Why do some roads have animal crossing signs?
misconceptions:
  - thought: '“Feeding wild animals helps them.”'
    why: It feels kind.
    tryThis: Explain that people food can make wild animals sick and less afraid of cars and people.
  - thought: '“Plants don’t need animals.”'
    why: Plants seem to grow on their own.
    tryThis: Tap through the bee and the bird in the need-each-other visual.
lookFor:
  - They name an action that protects plants or animals, and say why it helps.
  - They explain one way a plant and an animal depend on each other.
adapt:
  support:
    - Start with one pair, like a bee and a flower.
    - Act out an animal crossing a road with toy cars.
  access:
    - need: reading
      tip: Read each card in the sort aloud.
    - need: attention
      tip: Take the walk first, then do the problems.
    - need: language
      tip: Use the frame “The ___ needs the ___ for ___.”
  stretch:
    - Find out about a bird count near you, and take part with your family.
together:
  - problem: d1
    how: Look at a picture of a river valley in winter. Talk about why it was a good place for buffalo and people.
  - problem: d2
    how: Role-play finding a nest. Practise backing away quietly.
