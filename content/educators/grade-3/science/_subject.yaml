subject: science
promise: |-
  We hope your child comes to love asking “What will happen?” and then finding out.

  - Grade 3 science is about watching closely: ice melting, a cart rolling, a worm tunnelling.
  - Short topics, a guess before every experiment, and plenty of “Oh!” moments.
shifts:
  - instead: Explaining the idea, then showing the experiment.
    tryThis: Asking for a guess first. On every on-screen experiment, your child picks a prediction before pressing Run.
  - instead: Saying “That’s wrong” to a surprising idea.
    tryThis: 'Asking “How could we check?” Then watch the experiment, or try it safely at the sink.'
  - instead: Long explanations.
    tryThis: One idea at a time, with something to look at. Let your child say what they see before you add a word.
  - instead: Teaching the science words first.
    tryThis: Let them describe it in their own words, then give the science word for what they noticed.
routines:
  - name: Guess, watch, why
    time: 5 minutes
    how: |-
      Use it with any on-screen experiment:

      1. Guess what will happen, and say why.
      2. Run it and say what you saw.
      3. Say why it happened.
  - name: What was it before?
    time: 2 minutes
    how: Pick any object at home. Ask what it was made from, and what that was before. Keep going back to nature.
  - name: Two friends disagree
    time: 5 minutes
    how: |-
      1. Describe two friends with different ideas, such as “Ice melts faster in the fridge.”
      2. Your child decides who is right, and how to check.
  - name: Science walk
    time: 15 minutes
    how: Go outside with one question, such as where the puddle went or what is under a log. Come back with one thing noticed and one wondered.
assess:
  - They make a guess with a reason before an experiment.
  - They say what they saw, even when it surprised them.
  - They use a science word, like melting or friction, in a new place without being asked.
