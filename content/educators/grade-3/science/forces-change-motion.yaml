id: forces-change-motion
subject: science
why: Children think moving things “run out” of motion. Seeing that a force starts, stops or turns things is a big step.
hook:
  title: The lazy ball
  time: 5 minutes
  covers: [K1.2]
  body: |-
    1. Put a ball on the floor. Ask your child to make it move without touching it.
    2. Then roll it and ask: **“Why did it stop?”**
    3. Accept every answer for now.
activities:
  - title: Smooth and rough
    time: 15 minutes
    materials: A toy car, a smooth floor, a rug and some tape
    covers: [S1.5, K1.2, S1.4]
    steps:
      - Push the car with the same push on the smooth floor and on the rug. Mark where it stops.
      - Ask what slowed it more, and why.
  - title: Make it turn
    time: 10 minutes
    materials: A ball and a wall or a box
    covers: [K1.8, S1.5]
    steps:
      - Your child rolls the ball so that it changes direction, starts, speeds up and stops.
      - For each one, ask what force did it.
questions:
  - Why does a hockey puck slide farther on ice than on grass?
  - What would happen if you kicked a ball in space?
  - What forces stop your bike?
misconceptions:
  - thought: '“Moving things stop by themselves.”'
    why: On Earth, rubbing and bumping always stop things, so children never see otherwise.
    tryThis: Compare the same push on smooth ice or a smooth floor and on carpet. Ask what is different.
  - thought: '“If something moves, a force must keep pushing it.”'
    why: Pushing a heavy box only works while you push.
    tryThis: Slide a puck or coin on a smooth table. Ask what is pushing it after it leaves your hand.
lookFor:
  - They name a force whenever an object starts, stops or turns.
  - They predict a moving object will keep going if nothing touches it.
adapt:
  support:
    - Act it out. Your child is the ball and only moves when pushed, and only stops when caught.
    - Use the four buttons, start, speed up, turn and stop, as the only words at first.
  access:
    - need: reading
      tip: Read the problems aloud. Roll a ball to show each story.
    - need: attention
      tip: Do one roll between problems. Ask what the force did.
    - need: language
      tip: Use a hand signal for each change. Point to start, flat palm to stop, a curve to turn.
  stretch:
    - Draw a pinball game. Label every force that starts, stops or turns the ball.
together:
  - problem: d1
    how: Slide a coin on a smooth table first. Then imagine a table that goes on forever.
  - problem: d2
    how: Roll a ball on grass and on a hard floor. Ask your child to explain the difference to Maya.
