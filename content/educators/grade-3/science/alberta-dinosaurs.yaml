id: alberta-dinosaurs
subject: science
why: Alberta is one of the best places in the world for dinosaur fossils. Children link the dinosaurs they love to real places they can visit.
hook:
  title: Dinosaur names
  time: 5 minutes
  covers: [K4.7]
  body: |-
    1. Say “Albertosaurus” and “Edmontosaurus” slowly together.
    2. Ask: **“What places do you hear in these names?”**
    3. Tell them both dinosaurs lived right here in Alberta.
activities:
  - title: Map the fossils
    time: 15 minutes
    materials: A printed or hand-drawn map of Alberta, and stickers
    covers: [K4.5, K4.8, S4.4]
    steps:
      - Your child puts stickers on the badlands, Grande Cache, Fort McMurray, Drumheller and Wembley.
      - Find your own town, and the closest dinosaur museum to it.
  - title: Then and now picture
    time: 15 minutes
    materials: Paper folded in half, and crayons
    covers: [K4.3]
    steps:
      - Draw Alberta today on one half, and Alberta 75 million years ago on the other.
      - Ask what changed, and where the sea was.
questions:
  - Which Alberta dinosaur would you most like to see, and why?
  - What was Alberta like when dinosaurs lived here?
  - Why are so many fossils found in the badlands?
misconceptions:
  - thought: '“Dinosaurs lived in snowy Alberta, like today.”'
    why: Children picture the Alberta they know.
    tryThis: Run the back-in-time experiment and name the plants and the sea.
  - thought: '“All dinosaurs ate meat.”'
    why: Famous meat eaters, like T. rex, are in many books.
    tryThis: Compare Edmontosaurus and Albertosaurus in the lesson.
lookFor:
  - They name an Alberta dinosaur and a place where its fossils are found.
  - They describe Alberta long ago as warm, with forests and an inland sea.
adapt:
  support:
    - Start with one dinosaur and one place, like Albertosaurus and Drumheller.
    - Use toy dinosaurs to act out the back-in-time experiment.
  access:
    - need: reading
      tip: Read the dinosaur names aloud, slowly, clapping each part.
    - need: attention
      tip: Do one map sticker between problems.
    - need: language
      tip: Match each dinosaur to a picture of its food, meat or plants.
  stretch:
    - Plan a visit to the Royal Tyrrell Museum or the Philip J. Currie Dinosaur Museum, online or in person.
together:
  - problem: d1
    how: Find Fort McMurray on a map of Alberta. Talk about the sea that once covered it.
  - problem: b1
    how: Ask how a sea shell could end up far from any ocean. Let your child explain it to you.
