id: multiply-divide-strategies
subject: math
why: Strategies turn a fact a child can’t remember into facts they can. That makes them less afraid of numbers they don’t know yet.
hook:
  title: The fact I forgot
  time: 5 minutes
  covers: [K2.1, S2.1]
  body: |-
    1. Say: **"I forgot 7 × 8. Can you help me work it out?"**
    2. Let your child try any way they like.
    3. Ask them to show you how, with a drawing.
activities:
  - title: Cut the array
    time: 15 minutes
    materials: Grid paper, a pencil and scissors
    covers: [K2.1, K2.2, S2.1, S2.2]
    steps:
      - Draw a 6 by 8 rectangle on grid paper and cut it out.
      - Your child cuts it into two rectangles they know, and finds each part.
      - Add the parts. Cut a new one a different way and compare.
  - title: Mystery number
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K2.6, S2.4, S2.3]
    steps:
      - Write a fact with a box, like ☐ × 6 = 42 or 40 ÷ ☐ = 5.
      - Your child finds the box and checks it with the opposite operation.
questions:
  - What fact do you already know that is close to this one?
  - How could you split this number to make it easier?
  - How can you check that number in the box?
misconceptions:
  - thought: '"6 × 7 is 6 × 5 + 2."'
    why: They split the 7 but forget the 2 still means 2 groups of 6.
    tryThis: Draw the array and colour the two parts. Count the second part.
  - thought: '"In 48 ÷ ☐ = 6, the box is 48 × 6."'
    why: Undoing feels like it should always use the opposite sign on the two numbers shown.
    tryThis: Read it as "48 shared into how many groups gives 6 each?" and build it.
lookFor:
  - They use a known fact to find a new one.
  - They check a missing number by putting it back in.
adapt:
  support:
    - Split using 5s and 10s first. They are the easiest facts.
    - Draw arrays on grid paper before writing numbers.
  access:
    - need: reading
      tip: Read a box aloud as "what number?" so the sentence makes sense.
    - need: attention
      tip: One cut array is enough for a session. Keep the pieces to revisit.
    - need: writing
      tip: Colour the parts of an array instead of writing the numbers.
  stretch:
    - Find three different ways to split 9 × 8. Which way is fastest for you?
together:
  - problem: d1
    how: |-
      - Take turns making up mystery numbers for each other.
      - Check each answer with the opposite operation.
  - problem: d2
    how: |-
      - Draw 7 rows of 8 dots and cut between rows in different places.
      - Write the two facts for each cut.
