id: sharing-grouping
subject: math
why: Children care about fair shares. Division makes sharing fair, and helps them decide what to do with leftovers.
hook:
  title: Fair shares
  time: 5 minutes
  covers: [K1.4, S1.5]
  body: |-
    1. Put 13 crackers on a plate for 3 people.
    2. Ask: **"How can we share these fairly?"**
    3. When one is left, ask: "What should we do with this one?"
activities:
  - title: Deal it out
    time: 15 minutes
    materials: A deck of cards or a pile of buttons
    covers: [S1.5, K1.4, K2.7, U2.1]
    steps:
      - Deal 20 cards to 3 players, one at a time.
      - Your child says how many each player got and how many are left.
      - Now make piles of 3 instead. How many piles? Is it the same leftover?
  - title: Leftover stories
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S2.6, S2.7]
    steps:
      - Tell a story, like "17 kids, 4 in each canoe."
      - Your child decides if the leftovers need one more canoe, or can be left out.
questions:
  - Are you sharing out, or making groups?
  - What should we do with the leftovers here?
  - How can multiplying check your answer?
misconceptions:
  - thought: '"12 ÷ 3 is the same as 3 ÷ 12."'
    why: Turning a multiplication works, so turning a division seems fine too.
    tryThis: Share 12 crackers among 3 people, then 3 crackers among 12 people.
  - thought: '"The leftover is always ignored."'
    why: Workbooks often just write the remainder and stop.
    tryThis: Ask about the last 2 children who need a ride. Can they walk to the zoo?
lookFor:
  - They choose to share or to group, and explain which.
  - They check a division by multiplying.
adapt:
  support:
    - Use real objects and plates, and deal one at a time.
    - Start with numbers that share with nothing left over.
  access:
    - need: reading
      tip: Act out the stories with toys instead of reading them.
    - need: worry
      tip: A leftover is not a mistake. It is part of the answer.
    - need: hands
      tip: Use the share and group buttons on screen instead of dealing objects.
  stretch:
    - How many marbles shared by 4 friends leave 3 over? Find every answer up to 40.
together:
  - problem: d1
    how: |-
      - Use 23 buttons and egg-carton boxes of 4.
      - Count the full boxes, then ask how close the last box is to full.
  - problem: d2
    how: |-
      - Deal buttons to 5 cups until 3 are left.
      - Try again with more buttons. What do the answers have in common?
