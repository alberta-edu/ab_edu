id: measuring-length
subject: math
why: Knowing how metres, centimetres and millimetres fit inside each other makes every ruler and tape measure make sense.
hook:
  title: Inside a metre
  time: 5 minutes
  covers: [K1.1, K1.2, S1.1]
  body: |-
    1. Lay a metre stick or tape measure on the floor.
    2. Ask: “How many centimetres do you think are in this?”
    3. Count by tens together, from 0 to 100.
activities:
  - title: Measure hunt
    time: 15 minutes
    materials: A ruler marked in cm and mm, small household objects
    covers: [K1.4, S1.4, U1.2]
    steps:
      - Your child measures five objects, lining up one end at 0 each time.
      - For any object between two cm marks, they measure again in mm.
  - title: String for curves
    time: 10 minutes
    materials: String, a ruler, a plate or a curvy toy track
    covers: [S1.4, S1.3]
    steps:
      - Lay string along a curve, pinch it at the end, and straighten it along a ruler.
      - 'Ask: “Would you use mm, cm or m for this? Why?”'
questions:
  - Where is the 0 on your ruler?
  - Would mm, cm or m give a sensible number?
  - How many mm is that in cm?
misconceptions:
  - thought: '"I start measuring at the 1, or at the end of the ruler."'
    why: The edge of a ruler looks like the start.
    tryThis: Measure the same pencil starting at 0 and at 1. Which answer matches counting the centimetres?
  - thought: '"120 mm is longer than 12 cm, because 120 is bigger."'
    why: They compare the numbers and ignore the units.
    tryThis: Measure one pencil both ways on the same ruler.
lookFor:
  - They line up with 0 without being reminded.
  - They switch to mm when a length falls between cm marks.
adapt:
  support:
    - Use a ruler marked only in whole centimetres at first.
    - Colour the 0 line on the ruler.
  access:
    - need: reading
      tip: Point to the unit on the ruler as you say its name.
    - need: hands
      tip: Use the on-screen ruler instead of a real one.
    - need: worry
      tip: Measure twice and compare. Two different answers is a puzzle, not a failure.
  stretch:
    - Find something about 1 dm long, then check it is 10 cm.
together:
  - problem: d1
    how: |-
      - Measure one pencil in cm, then in mm.
      - Then measure it again starting at 1. What changes?
  - problem: d2
    how: |-
      - Cut a 1 m string into two pieces.
      - Measure one in cm and the other in mm, then check they make 1000 mm.
