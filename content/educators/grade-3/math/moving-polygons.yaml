id: moving-polygons
subject: math
why: Knowing that moves never change lengths or angles lets a child test whether two shapes really match.
hook:
  title: Same or different?
  time: 5 minutes
  covers: [K2.1, U2.1]
  body: |-
    1. Cut a paper triangle and trace it.
    2. Slide, turn or flip the triangle, and trace it again.
    3. Ask: “Is it the same triangle? How could you prove it?”
activities:
  - title: Move and measure
    time: 15 minutes
    materials: A paper polygon, a ruler, a sheet of paper
    covers: [K2.2, S2.1, U2.1]
    steps:
      - Your child traces the polygon, then slides, turns or flips it and traces it again.
      - They measure the sides of both tracings. What do they notice?
  - title: Moves around the house
    time: 10 minutes
    materials: None
    covers: [K2.1, S2.1]
    steps:
      - Find things that slide, turn or flip, like a drawer, a door or a pancake.
      - Your child names each move as a translation, rotation or reflection.
questions:
  - Which way does it face now?
  - What changed, and what stayed the same?
  - Could a slide alone do that?
misconceptions:
  - thought: '"When a shape turns, it becomes a different shape."'
    why: It looks different when it faces a new way.
    tryThis: Turn a paper shape and lay it back on its tracing. It fits exactly.
  - thought: '"A flip is just a turn."'
    why: Both make the shape face a new way.
    tryThis: Colour one side of a paper shape. A flip shows the other side.
lookFor:
  - They name the move from how the shape faces.
  - They say lengths stay the same, and check with a ruler.
adapt:
  support:
    - Use a large paper shape with one corner coloured.
    - Do one move at a time.
  access:
    - need: reading
      tip: Show each move with a real object instead of words.
    - need: hands
      tip: Use the move buttons on screen.
    - need: worry
      tip: Tracing and checking is part of the job, so a wrong first guess is fine.
  stretch:
    - Find two moves that put a shape back where it started.
together:
  - problem: d1
    how: |-
      - Cut out triangle A, colour its corners, and lay it on B.
      - Try turning it first. Then try flipping it over.
  - problem: d2
    how: |-
      - Ask: “Do we need to know what Mo did?”
      - Add the sides together.
