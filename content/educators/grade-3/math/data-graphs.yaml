id: data-graphs
subject: math
why: Graphs are everywhere, from news to sports. A child who asks a question, collects data and reads the story can check what others claim.
hook:
  title: Guess the winner
  time: 3 minutes
  covers: [S1.1, S1.2]
  body: |-
    1. Ask: “Which do people in our family like best: pancakes, waffles or toast?”
    2. Everyone guesses the winner first.
    3. Then ask each person and see who guessed right.
activities:
  - title: Family dot plot
    time: 15 minutes
    materials: Paper, sticky dots or a marker
    covers: [S2.1, S2.2, K2.1, S2.3]
    steps:
      - Your child picks a question, like “What is your favourite colour?”, and asks 8 to 12 people.
      - They draw one dot for each answer, then tell the story of their dot plot.
  - title: Data detective
    time: 10 minutes
    materials: A newspaper, flyer or website with a bar graph
    covers: [K2.2, U2.1, S2.3]
    steps:
      - Find a bar graph someone else made. Read its title together.
      - Ask who collected the data, and when and where. Then say what story it tells.
questions:
  - What question does this graph answer?
  - Who collected the data, you or someone else?
  - What story does the graph tell? Was your guess right?
misconceptions:
  - thought: '"My guess was wrong, so I did it wrong."'
    why: They think a prediction must match.
    tryThis: Say that a guess is a starting point. The data is how we find out.
  - thought: '"Every class would get the same graph."'
    why: They see one graph as the answer for everyone.
    tryThis: Ask the same question of a different group and compare the two graphs.
lookFor:
  - They draw exactly one dot, or one square, for each answer.
  - They link the story of a graph back to the question.
adapt:
  support:
    - Start with 2 choices and 6 people.
    - Collect answers as tally marks first, then make the dot plot.
  access:
    - need: reading
      tip: Use picture choices, like 🍎 and 🍌, instead of words.
    - need: hands
      tip: Press Ask the next kid on screen instead of drawing dots.
    - need: worry
      tip: Make the first question a silly one, like “Socks or no socks?”
  stretch:
    - Make a bar graph and a dot plot of the same data. Which story is easier to see?
together:
  - problem: d1
    how: |-
      - Point to each dot as you count it together.
      - Ask a few family members the same question and compare.
  - problem: d2
    how: |-
      - Use 12 coins or buttons for the 12 kids.
      - Sort them into 3 piles, then check the rules.
