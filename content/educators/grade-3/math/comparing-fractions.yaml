id: comparing-fractions
subject: math
why: Comparing fractions trains a child to think about the size of the parts, not just the numbers they can see.
hook:
  title: Would you rather?
  time: 5 minutes
  covers: [U1.4, S1.9]
  body: |-
    1. Ask: **"Would you rather have 1/3 of a cake or 1/8 of the same cake?"**
    2. Many children pick 1/8, because 8 is bigger.
    3. Cut two paper "cakes" and let them check.
activities:
  - title: Fraction strip race
    time: 15 minutes
    materials: Paper strips folded into halves, thirds, fourths, sixths and eighths
    covers: [S1.8, S1.9, S1.10, U1.4]
    steps:
      - Line up the folded strips under each other.
      - Your child compares pairs, like 2/3 and 2/6, and writes < or >.
      - 'Ask: "Why are sixths smaller than thirds?"'
  - title: Half or not?
    time: 10 minutes
    materials: A long strip of tape on the floor marked 0, 1/2 and 1
    covers: [S1.11, S1.12, K1.6]
    steps:
      - Call out a fraction, like 3/8. Your child stands where they think it goes.
      - 'Ask: "Are you before or after 1/2? How do you know?"'
questions:
  - Are the parts the same size? Are there the same number of parts?
  - How many parts would make exactly half?
  - Are the two wholes the same size?
misconceptions:
  - thought: '"1/8 is bigger than 1/3 because 8 is bigger than 3."'
    why: With whole numbers, bigger digits mean more.
    tryThis: Share one cookie among 3 people, then among 8. Which share is bigger?
  - thought: '"Half is always the same amount."'
    why: They compare the fractions and forget the wholes.
    tryThis: Cut half of an apple and half of a grape. Are the halves the same?
lookFor:
  - They say why, using "same size parts" or "fewer, bigger parts".
  - They check whether a fraction is before or after 1/2.
adapt:
  support:
    - Compare only same-denominator fractions first, with folded strips.
    - Mark 1/2 on every strip with a crayon.
  access:
    - need: reading
      tip: Read fractions as words, like "two thirds", so the size is easier to picture.
    - need: hands
      tip: Use the sliders on screen instead of folding paper.
    - need: worry
      tip: Guess first, then check with strips. A wrong guess is a good surprise.
  stretch:
    - Find every fraction with a denominator of 10 that is between 1/2 and 1.
together:
  - problem: d1
    how: |-
      - Fold strips into fourths, fifths and eighths, and colour 3 parts of each.
      - Lay them side by side to see who ran farthest.
  - problem: d2
    how: |-
      - Pick a strip and mark its half.
      - Find every number of parts that is past half but not the whole.
