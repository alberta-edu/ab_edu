id: estimating-perimeter
subject: math
why: Perimeter is length put to work, and estimating with a referent is how people judge lengths every day without a ruler.
hook:
  title: Ant walk
  time: 5 minutes
  covers: [K2.1, U2.1]
  body: |-
    1. Lay a string around the edge of a book.
    2. Straighten the string and measure it.
    3. Ask: “Is the string longer, shorter or the same as the way around?”
activities:
  - title: Fence the table
    time: 15 minutes
    materials: A ruler or tape measure, a rectangular table or tray
    covers: [S2.1, S2.2]
    steps:
      - Your child measures each side and adds them to find the perimeter.
      - Hide one side’s length. They find it from the perimeter and the other sides.
  - title: Fingernails and metre sticks
    time: 10 minutes
    materials: A metre stick or tape measure
    covers: [S3.1, S3.2, S3.3]
    steps:
      - Your child estimates small things with fingernail widths and big things in metres.
      - Measure to check. Was the estimate close?
questions:
  - What is the distance all the way around?
  - Which sides do you know? What is left over?
  - What referent could help you estimate?
misconceptions:
  - thought: '"A rectangle’s perimeter is just the two numbers added."'
    why: Only two sides are labelled.
    tryThis: Run a finger around all four sides and say each length aloud.
  - thought: '"An estimate is just a guess."'
    why: They don’t picture a referent.
    tryThis: Hold up a fingernail first, then estimate how many would fit.
lookFor:
  - They count every side, even unlabelled ones.
  - They use a referent and say what it was.
adapt:
  support:
    - Use shapes on grid paper so sides can be counted.
    - Mark each side with a tick as it is added.
  access:
    - need: reading
      tip: Read the side lengths aloud while pointing.
    - need: hands
      tip: Use the walk and unroll buttons on screen.
    - need: worry
      tip: Estimates are meant to be close, not exact. Praise good reasons.
  stretch:
    - Find every rectangle with whole-metre sides and a perimeter of 20 m.
together:
  - problem: d1
    how: |-
      - Bend a pipe cleaner into a square, then a triangle.
      - Straighten it each time and measure it.
  - problem: d2
    how: |-
      - Use toothpicks as 1 m of fence. Lay out 16.
      - Make as many different rectangles as you can.
