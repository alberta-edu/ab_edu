id: naming-fractions
subject: math
why: Fractions are the first numbers between whole numbers. Seeing them as counts of equal parts makes them feel like real numbers.
hook:
  title: Is it fair?
  time: 5 minutes
  covers: [U1.3, S1.1]
  body: |-
    1. Fold a sheet of paper into 4 parts that are clearly **not** equal.
    2. Say: **"I cut this into fourths. Is that fair?"**
    3. Let your child explain, then fold a fair one together.
activities:
  - title: Fold and name
    time: 15 minutes
    materials: Paper strips, crayons and scissors
    covers: [S1.1, S1.3, S1.4, S1.5, K1.2]
    steps:
      - Fold strips into halves, fourths and eighths.
      - Your child colours some parts and writes the fraction and its name.
      - 'Ask: "How many 1/8 parts did you colour?"'
  - title: Snack fractions
    time: 10 minutes
    materials: A handful of grapes or crackers on a plate
    covers: [K1.1, S1.6, K1.5]
    steps:
      - Put 12 crackers in 4 equal groups. Your child eats one group.
      - 'Ask: "What fraction did you eat? What fraction is the whole plate?"'
questions:
  - Are the parts equal? How can you tell?
  - What does the bottom number count? The top number?
  - How many of these parts make one whole?
misconceptions:
  - thought: '"Any 4 pieces are fourths."'
    why: They count pieces without checking the sizes.
    tryThis: Cut a sandwich into 4 uneven pieces and ask who wants the smallest "fourth".
  - thought: '"The numerator and denominator are two separate numbers."'
    why: A fraction looks like two numbers stacked up.
    tryThis: Say it as one amount, "three eighths", and point to all 3 shaded parts.
lookFor:
  - They check that parts are equal before naming a fraction.
  - They say 3/8 as "three 1/8 parts".
adapt:
  support:
    - Start with halves and fourths, folding real paper.
    - Always say the name aloud while writing the fraction.
  access:
    - need: hands
      tip: Tap parts on screen instead of folding paper.
    - need: language
      tip: Fraction names like "thirds" sound like "third place". Use a picture with each name.
    - need: reading
      tip: Read fractions aloud as words, like "two fifths".
  stretch:
    - Find every fraction with a numerator of 4 that is less than one whole.
together:
  - problem: d1
    how: |-
      - Fold a strip into 5 parts and colour 4. Then try 6 parts.
      - Ask what stays the same each time.
  - problem: d2
    how: |-
      - Cut a paper "pan" into 12 squares.
      - Share it among 12 toys, then among 6 toys.
