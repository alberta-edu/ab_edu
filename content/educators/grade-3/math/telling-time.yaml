id: telling-time
subject: math
why: Clocks run the school day, the bus and bedtime. Knowing why 60 matters lets a child work time out.
hook:
  title: One minute, how long?
  time: 3 minutes
  covers: [K1.1, K1.3, S1.1]
  body: |-
    1. Your child closes their eyes and opens them when they think 1 minute has passed.
    2. Watch a clock’s second hand while they wait.
    3. Ask: “How many ticks was that?”
activities:
  - title: Paper-plate clock
    time: 15 minutes
    materials: A paper plate, card, a paper fastener, a pencil
    covers: [S1.4, S1.2, K1.5]
    steps:
      - Your child writes 1 to 12 around the plate and adds a short and a long hand.
      - You say a digital time, like 4:35. They set it, then say the minutes past 4 and until 5.
  - title: Our day in two clocks
    time: 10 minutes
    materials: Paper, a pencil
    covers: [S1.3, S1.5, K1.6, K1.7]
    steps:
      - List 4 things your child does in a day, with times, like waking up and bedtime.
      - Write each one with a.m. or p.m., then on the 24-hour clock.
questions:
  - Which hand shows the hour? Which shows the minutes?
  - How many minutes until the next hour?
  - Is that a.m. or p.m.? How do you know?
misconceptions:
  - thought: '"The short hand is near 5, so it is 5:35."'
    why: They read the nearest number, not the one the hand has passed.
    tryThis: Turn the minute hand slowly from 4:00 and watch the hour hand creep toward 5.
  - thought: '"15:00 is 5 o’clock."'
    why: They read the last digit only.
    tryThis: Count on from noon on fingers. 13 is 1 p.m., 14 is 2 p.m., 15 is 3 p.m.
lookFor:
  - They read the hour from the hand that has passed it.
  - They use 60 to switch between minutes past and minutes until.
adapt:
  support:
    - Start with times on the hour, then counting by 5 minutes.
    - Colour the minute numbers 5, 10, 15 and so on outside the clock face.
  access:
    - need: reading
      tip: Say each time out loud together as the clock shows it.
    - need: hands
      tip: Use the arrow buttons on screen instead of dragging the hand.
    - need: worry
      tip: Check a reading two ways, on the analog clock and on the digital one.
  stretch:
    - Find all the times between 1:00 and 2:00 when the minutes past are double the minutes until.
together:
  - problem: d1
    how: |-
      - Slide the day clock on screen to 15:20.
      - Count on from noon together to find the p.m. time.
  - problem: d2
    how: |-
      - Use the minutes past and until clock on screen.
      - Start at 6:30, then move the hand one minute at a time and check the two numbers.
