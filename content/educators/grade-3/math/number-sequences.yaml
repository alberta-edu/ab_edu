id: number-sequences
subject: math
why: Spotting how a sequence changes, and jumping straight to a far term, is early algebra and makes skip counting fast.
hook:
  title: Blast off
  time: 3 minutes
  covers: [K1.2, K1.3, S1.3]
  body: |-
    1. Count down from 10 together and “blast off”.
    2. Then count up from 1. Ask: “When will we stop?”
    3. One ends and one never does.
activities:
  - title: Line up by position
    time: 10 minutes
    materials: Toys or stuffed animals
    covers: [K1.1, S1.2]
    steps:
      - Line up the toys for a race. Your child names who is 1st, 2nd, 3rd and so on.
      - Swap two toys. Ask who is 4th now.
  - title: Times-table trains
    time: 15 minutes
    materials: Paper, coloured pencils
    covers: [S2.1, S2.2, S2.3]
    steps:
      - Your child writes a skip-counting sequence as a train of cars, one term in each.
      - Cover one car. They find it with multiplication, like 7 × 5, and check by counting.
questions:
  - What is the 1st term? The 5th?
  - How does each term change?
  - Does this sequence ever end?
misconceptions:
  - thought: '"To find the 9th term I have to write all of them."'
    why: They only know counting on.
    tryThis: Skip count by 6 on fingers, then show that 9 fingers means 9 × 6.
  - thought: '"An infinite sequence has every number in it."'
    why: It sounds like “everything”.
    tryThis: Ask whether 7 is in the even numbers. They go on forever, but skip 7.
lookFor:
  - They use ordinal words correctly.
  - They describe a change with an operation, like “subtract 4”.
adapt:
  support:
    - Start with counting by 2, 5 and 10.
    - Write the position number above each term.
  access:
    - need: reading
      tip: Say the sequences aloud with a clap on each term.
    - need: hands
      tip: Tap the cars on screen instead of writing.
    - need: worry
      tip: Check a found term by counting on. Two ways that agree feel safe.
  stretch:
    - Make a sequence where 100 is the 20th term.
together:
  - problem: d1
    how: |-
      - Write the odd numbers on sticky notes, one per term.
      - Count them as you go, and look at the last digit of each.
  - problem: d2
    how: |-
      - Open the times table and find every 24.
      - For each row, find the 4th term.
