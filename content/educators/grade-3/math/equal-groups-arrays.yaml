id: equal-groups-arrays
subject: math
why: Seeing multiplication as equal groups and arrays gives a child a picture to fall back on when a fact slips their mind.
hook:
  title: How many do you see?
  time: 5 minutes
  covers: [S1.6, K1.3]
  body: |-
    1. Show an egg carton or a muffin tray for two seconds.
    2. Ask: **"How many spots? How did you see it?"**
    3. Listen for "2 rows of 6" or "6 and 6".
activities:
  - title: Snack plates
    time: 15 minutes
    materials: Small snacks or buttons, and a few plates
    covers: [S1.1, S1.2, S1.3, S1.4, K1.7]
    steps:
      - Your child puts the same number of snacks on each plate.
      - They say it three ways, like "3 plates of 4", "4 + 4 + 4" and "3 × 4".
      - Try empty plates, then 1 on each plate. What happens to the total?
  - title: Array hunt
    time: 10 minutes
    materials: Your home or street, and a pencil
    covers: [S1.6, K1.5, S1.7]
    steps:
      - Find arrays, like windows, tiles, egg cartons or chocolate squares.
      - Your child writes a multiplication for each one, then turns it to write another.
questions:
  - How many groups? How many in each group?
  - Does 3 × 4 look the same as 4 × 3? Is it the same number?
  - What is 7 groups of nothing?
misconceptions:
  - thought: '"3 × 4 means 3 + 4."'
    why: Both signs look like they put numbers together.
    tryThis: Build 3 plates of 4 snacks and count them. Then build 3 snacks and 4 snacks.
  - thought: '"Any number × 0 is that number."'
    why: Adding 0 changes nothing, so multiplying by 0 seems to change nothing too.
    tryThis: Set out 5 empty plates and ask how many snacks there are.
lookFor:
  - They describe a picture as groups, like "4 groups of 5".
  - They turn an array to find an easier fact.
adapt:
  support:
    - Start with groups of 2, 5 and 10, which they can already skip count.
    - Build with real objects before drawing dots.
  access:
    - need: reading
      tip: Read "4 × 3" aloud as "4 groups of 3" every time.
    - need: hands
      tip: Use the sliders on screen instead of moving small objects.
    - need: language
      tip: Words like "rows", "groups" and "each" do the math. Point while you say them.
  stretch:
    - Find every array for 36 things with no more than 10 in a row.
together:
  - problem: d1
    how: |-
      - Use 24 buttons as chairs and set out rows on the table.
      - Write each array that fits, then turn it.
  - problem: d2
    how: |-
      - Draw 4 rows of 7 dots on paper.
      - Turn the paper sideways and count the new rows.
