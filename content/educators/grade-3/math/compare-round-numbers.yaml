id: compare-round-numbers
subject: math
why: Comparing teaches a child to look at the biggest places first. Rounding teaches them when "about" is good enough.
hook:
  title: Which is more?
  time: 5 minutes
  covers: [S1.7, U1.3]
  body: |-
    1. Write two prices from a flyer, like $389 and $398.
    2. Ask: **"Which costs more? How can you tell so fast?"**
    3. Then try 1 200 and 999. Does the longer number always win?
activities:
  - title: Sign war
    time: 15 minutes
    materials: A deck of cards with the face cards taken out, paper and a pencil
    covers: [S1.7, S1.8, K1.6]
    steps:
      - Each player turns over four cards to make a number.
      - Write both numbers with <, > or = between them. The greater number wins.
      - 'After each round, ask: "Which place decided it?"'
  - title: About how many?
    time: 10 minutes
    materials: News stories, a sports page or a cereal box
    covers: [K1.5, S1.6]
    steps:
      - Find big numbers in print, such as a crowd or a distance.
      - Your child rounds each one and says if "about" is good enough there.
questions:
  - Where do you start when you compare? Why there?
  - Which place decided which number is greater?
  - When would a rounded number be a problem?
misconceptions:
  - thought: '"The number with the bigger last digit is bigger."'
    why: The last digit is read last, so it sticks in their memory.
    tryThis: Compare 1 009 and 900. Ask which place they should look at first.
  - thought: '"Rounding means cutting off the end."'
    why: Dropping digits gives a number that looks close.
    tryThis: Mark 4 300, 4 350 and 4 400 on the floor with tape. Stand at 4 368 and ask which end is closer.
lookFor:
  - They compare from the left and stop at the first place that is different.
  - They choose to round only when an exact count isn’t needed.
adapt:
  support:
    - Line the two numbers up in a place value chart before comparing.
    - Round on a drawn number line with the halfway mark coloured in.
  access:
    - need: reading
      tip: Say "greater than" and "less than" aloud each time your child writes > or <.
    - need: attention
      tip: Play one quick round of Sign war, not ten.
    - need: hands
      tip: Use the on-screen tools, or say the sign out loud while you write it.
  stretch:
    - Find a number that rounds to 30 000 to the nearest ten thousand and to 25 000 to the nearest thousand.
together:
  - problem: d1
    how: |-
      - Write 4 ☐ 518 on paper and try each digit card in the box.
      - Cross out the digits that break a clue.
  - problem: d2
    how: |-
      - Draw a line from 2 000 to 3 000 and mark 2 450, 2 500 and 2 550.
      - Shade where each clue allows. Where do the shadings overlap?
