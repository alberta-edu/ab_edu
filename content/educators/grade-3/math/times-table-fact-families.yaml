id: times-table-fact-families
subject: math
why: Knowing facts by heart frees a child’s mind for harder thinking. Fact families mean each fact learned gives three more for free.
hook:
  title: Twins in the table
  time: 5 minutes
  covers: [K3.1, S3.1]
  body: |-
    1. Show a times table up to 10 × 10.
    2. Ask: **"Can you find a number that is in the table twice?"**
    3. Then ask: "Is any number there three times?"
activities:
  - title: Fact family houses
    time: 15 minutes
    materials: Paper, a pencil and coloured markers
    covers: [K3.2, S3.2, U3.1]
    steps:
      - Draw a house with a product in the roof, like 24, and two factors on the door, like 4 and 6.
      - Your child writes the four facts that live in the house.
      - Make a street of houses for the facts they find hardest.
  - title: Pattern spotting
    time: 10 minutes
    materials: A printed times table and coloured pencils
    covers: [S3.1, S3.3]
    steps:
      - Colour every product that ends in 0. Then every even product.
      - Your child describes one pattern in their own words.
questions:
  - Which facts do you know without counting?
  - If you know 6 × 7, what other facts do you know?
  - Why does row 5 end in 0 and 5?
misconceptions:
  - thought: '"8 + 7 = 15 is in the 7, 8, 56 family."'
    why: It uses the same small numbers, so it seems to belong.
    tryThis: Check each fact for all 3 numbers, 7, 8 and 56.
  - thought: '"I have to learn 100 facts."'
    why: The table looks like 100 separate facts.
    tryThis: Cross out each twin and each 1s and 10s fact together. Count how few are left.
lookFor:
  - They answer a division by thinking of a multiplication fact.
  - They notice patterns in rows, like 5s ending in 0 or 5.
adapt:
  support:
    - Learn the 2s, 5s and 10s first. Then use them to build 4s and 9s.
    - Keep a table nearby, and let them look things up while they learn.
  access:
    - need: reading
      tip: Say facts aloud together, like a chant, instead of reading them.
    - need: worry
      tip: Use a table freely at first. Memory grows from use, not from tests.
    - need: attention
      tip: Practise one family a day, for two minutes.
  stretch:
    - Which products show up the most times in the table? Why?
together:
  - problem: d1
    how: |-
      - Circle every 12 in a printed table, then every 16.
      - Ask why 16 has an odd number of circles.
  - problem: d2
    how: |-
      - Pick 24 and hunt for it in every row.
      - Write each fact you find, and cross out twins.
