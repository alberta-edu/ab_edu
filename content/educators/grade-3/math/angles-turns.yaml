id: angles-turns
subject: math
why: Seeing an angle as a turn, not as the length of its lines, prepares children to measure angles in Grade 4.
hook:
  title: Arm angles
  time: 5 minutes
  covers: [U1.1, U1.2, S1.2]
  body: |-
    1. Stand with one arm straight out. Slowly lift it.
    2. Ask: “Where is the vertex? Is the angle getting bigger?”
    3. Stop when your arm points straight up. That is a right angle.
activities:
  - title: Angle tester
    time: 15 minutes
    materials: A sheet of paper folded into a corner
    covers: [S2.4, S2.5, S2.3]
    steps:
      - Your child hunts for angles at home and guesses each one first.
      - 'They check with the paper corner: smaller, right angle or bigger?'
  - title: Trace and compare
    time: 10 minutes
    materials: Tracing paper or baking paper, a pencil
    covers: [S2.1, S2.2, U2.1]
    steps:
      - Trace a corner from a book, then lay the tracing on a corner of a box.
      - 'Ask: “Which opens wider? How do you know?”'
questions:
  - Where is the vertex? Where are the arms?
  - Which one opens wider?
  - Is it smaller or bigger than your paper corner?
misconceptions:
  - thought: '"The angle with longer arms is bigger."'
    why: Longer lines look bigger.
    tryThis: Draw two angles with the same opening but very different arm lengths, then lay one on the other.
  - thought: '"Only corners of shapes are angles."'
    why: Shapes are where they first met angles.
    tryThis: Find angles in a bent elbow, an open door and a ramp.
lookFor:
  - They compare angles by the opening, not the arms.
  - They use a referent, like a paper corner, to check for a right angle.
adapt:
  support:
    - Use two strips of card joined with a split pin to make an angle that opens and closes.
    - Compare only one pair at a time.
  access:
    - need: reading
      tip: Show each word, vertex and arm, by pointing at a real angle.
    - need: hands
      tip: Use the on-screen turning arm and paper corner.
    - need: worry
      tip: Guess before checking. A wrong guess shows what to look at next time.
  stretch:
    - Find a time on a clock when the hands make an angle bigger than a right angle.
together:
  - problem: d1
    how: |-
      - Use a toy clock or draw one. Set it to 3:00, then 2:00.
      - Lay a paper corner between the hands each time.
  - problem: d2
    how: |-
      - Turn the minute hand a quarter turn at a time.
      - Count the turns until it is back at 12.
