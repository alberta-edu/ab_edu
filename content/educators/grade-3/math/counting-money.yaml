id: counting-money
subject: math
why: Counting real money is place value and skip counting a child can hold. It also builds confidence for buying things on their own.
hook:
  title: The mystery purse
  time: 5 minutes
  covers: [S1.9]
  body: |-
    1. Put a few nickels, dimes and quarters in a purse or sock.
    2. Ask: **"Guess how much money is in here."**
    3. Pour it out. Ask: "What is the fastest way to count it?"
activities:
  - title: Corner store
    time: 20 minutes
    materials: Real or paper coins and bills, and toys with price tags
    covers: [S1.9, S1.10, K1.8, K1.9]
    steps:
      - Your child writes price tags in cents or in whole dollars.
      - You buy things, paying with a mix of coins or bills.
      - They count what you paid, biggest coins first, and say if it is enough.
  - title: Bilingual price tags
    time: 10 minutes
    materials: Paper, a pencil, and a flyer or cereal box in English and French
    covers: [K1.8, S1.11]
    steps:
      - Look for prices on packaging printed in English and French.
      - Your child writes three prices both ways, like $4 and 4 $.
questions:
  - Which coins did you count first? Why?
  - Is a bigger coin always worth more?
  - Can you make the same amount with fewer coins?
misconceptions:
  - thought: '"A nickel is worth more than a dime."'
    why: The nickel is the bigger coin, and bigger usually means more.
    tryThis: Trade 2 nickels for 1 dime, and ask who got the better deal.
  - thought: '"5 coins is 5¢."'
    why: They count the coins, not what each one is worth.
    tryThis: Ask them to say each coin’s value as they touch it, then keep a running total.
lookFor:
  - They sort coins and start with the ones worth the most.
  - They read 5 $ as five dollars.
adapt:
  support:
    - Count only one kind of coin at a time, then mix two kinds.
    - Lay coins in a line and write the running total under each one.
  access:
    - need: reading
      tip: Use real coins. The value is stamped on each one.
    - need: hands
      tip: Slide coins across a table instead of picking them up, or use the on-screen tray.
    - need: language
      tip: Learn the coin names with the coins in hand. Loonie and toonie are Canadian words.
  stretch:
    - Find every way to make 25¢ with nickels and dimes.
together:
  - problem: d1
    how: |-
      - Lay out 8 nickels. Swap one nickel for a dime at a time.
      - Count after every swap until you reach 60¢.
  - problem: d2
    how: |-
      - Make 85¢ with real coins two ways: with quarters and without.
      - Count the coins in each pile.
