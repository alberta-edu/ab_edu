id: inches-feet-yards
subject: math
why: Canadian children meet inches and feet every day, in heights, screens and lumber, so they need both systems and a feel for how they match.
hook:
  title: Two rulers
  time: 5 minutes
  covers: [K1.5, S1.5]
  body: |-
    1. Find a ruler with cm on one edge and inches on the other.
    2. Ask: “Why are the numbers different on each side?”
    3. Measure a book both ways.
activities:
  - title: Build a yard
    time: 10 minutes
    materials: Three 12-inch rulers, or three 30 cm strips of paper
    covers: [K1.5, S1.2]
    steps:
      - Lay the rulers end to end and count the inches by twelves.
      - 'Ask: “How many feet? How many inches?”'
  - title: About how many feet?
    time: 15 minutes
    materials: A metre stick or tape measure
    covers: [K1.6, S1.6]
    steps:
      - Measure a door, a table and a bed in metres.
      - Your child uses 1 m ≈ 3 ft to guess each one in feet.
questions:
  - Is that unit metric or imperial?
  - How many inches make a foot? How many feet make a yard?
  - About how many feet is a metre?
misconceptions:
  - thought: '"3 ft is longer than 1 yd, because 3 is more than 1."'
    why: They compare the numbers and ignore the units.
    tryThis: Lay 3 one-foot rulers next to a yardstick.
  - thought: '"A yard and a metre are exactly the same."'
    why: They are close, and both are called a big step.
    tryThis: Lay a metre stick next to a yardstick. Which one sticks out?
lookFor:
  - They check the unit before comparing two numbers.
  - They use a rough match, like 30 cm ≈ 1 ft, to estimate.
adapt:
  support:
    - Use only inches and feet at first.
    - Keep a card with the matches on it nearby.
  access:
    - need: reading
      tip: Say the full unit name, not just the short form.
    - need: hands
      tip: Use the bars on screen instead of real rulers.
    - need: worry
      tip: These are estimates. Close is the goal, not exact.
  stretch:
    - Find your height in cm, then estimate it in feet.
together:
  - problem: d1
    how: |-
      - Use three 1-foot strips of paper to make one yard.
      - Count the strips you would need for 3 yards.
  - problem: d2
    how: |-
      - Cut a 36-inch string. Cut a foot off it.
      - Measure what is left in inches.
