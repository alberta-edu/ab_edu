id: equal-sign-equations
subject: math
why: Seeing = as “the same as”, not “the answer is”, is the start of all later algebra.
hook:
  title: Is this true?
  time: 5 minutes
  covers: [K1.1, K1.2, U1.1]
  body: |-
    1. Write **7 = 3 + 4** and ask, “True or false?”
    2. Many children say false, because “the answer goes at the end”.
    3. Build each side with blocks and compare the two piles.
activities:
  - title: Coat-hanger balance
    time: 15 minutes
    materials: A coat hanger, two paper cups, string, and pennies or paper clips
    covers: [K2.1, S1.1, U1.1]
    steps:
      - Hang a cup from each end. Put 3 and 4 clips in one cup, and 7 in the other.
      - Your child makes other pairs that balance, then writes each one as an equation.
  - title: What’s in the bag?
    time: 10 minutes
    materials: A paper bag, counters
    covers: [K2.2, S2.1, S2.2, S2.3]
    steps:
      - Secretly put some counters in the bag. Say, “The bag and 5 more make 12.”
      - Your child writes □ + 5 = 12 and finds the number, then opens the bag to check.
questions:
  - Is each side the same number?
  - Can the answer go on the left?
  - What could the box be? How can you check?
misconceptions:
  - thought: '"= means write the answer next."'
    why: Most equations they have seen end with the answer.
    tryThis: Mix in equations like 9 = 4 + 5 and 3 + 5 = 6 + 2, and ask if each is true.
  - thought: '"□ + 6 = 14, so □ is 20."'
    why: They add the two numbers they can see.
    tryThis: Put 20 in the box and check. Is 20 + 6 really 14?
lookFor:
  - They check both sides before saying an equation is true.
  - They put their answer back in the box to check it.
adapt:
  support:
    - Keep numbers under 20 and use real objects on each side.
    - Read = aloud as “is the same as”.
  access:
    - need: reading
      tip: Tell the stories aloud. Your child writes only the equation.
    - need: hands
      tip: Use the balance on screen instead of a coat hanger.
    - need: worry
      tip: Guess a number for the box, then check it. A wrong guess tells you which way to go.
  stretch:
    - Find every way to fill □ + □ = 10 with whole numbers.
together:
  - problem: d1
    how: |-
      - Build 4 + 5 and 9 + 2 with blocks.
      - Ask: “Are these the same? What would make them the same?”
  - problem: d2
    how: |-
      - Pick a multiplication fact you both know.
      - Take turns finding two numbers that add to the same answer.
