id: place-value-100000
subject: math
why: Place value lets a child make sense of big numbers they could never count, from a score to a price.
hook:
  title: Ten makes one
  time: 5 minutes
  covers: [K1.1, U1.1]
  body: |-
    1. Pour out about 50 beans or buttons.
    2. Ask: **"How many? Can you find out without counting one by one?"**
    3. If they make groups, ask why that helps.
    4. Ask: "What if there were 1 000?" Don’t answer yet.
activities:
  - title: Bundle up
    time: 15 minutes
    materials: Craft sticks or straws, and elastic bands
    covers: [K1.1, K1.2, K1.4, S1.2, S1.5]
    steps:
      - Your child bundles sticks into tens, and ten tens into a hundred.
      - Write 236. They build it with bundles and loose sticks.
      - 'Ask: "Can you show 236 another way?" Unbundle a hundred and count again.'
  - title: Number detectives
    time: 15 minutes
    materials: Flyers, game boxes or a calendar
    covers: [S1.4, S1.3, U1.3]
    steps:
      - Hunt for big numbers in print, like prices or puzzle pieces.
      - Your child reads each one aloud and says what one digit is worth.
questions:
  - Which digit is worth the most? How do you know?
  - What happens when you have 10 of one place?
  - Is 45 hundreds the same as 4 500? How could you show it?
misconceptions:
  - thought: '"5 is always worth 5."'
    why: A digit looks the same wherever it sits.
    tryThis: Write 5, 50, 500 and 5 000 in a column. Ask how many dollars each 5 is worth.
  - thought: '"More digits means bigger, even with a 0 in front."'
    why: Counting digits usually works, and scoreboards show zeros on the left.
    tryThis: Read 08 450 aloud together. Did the 0 change anything you said?
  - thought: '"4 thousands and 5 hundreds can’t be 45 hundreds."'
    why: They know one way to say each number, so a second way sounds like a different number.
    tryThis: Unbundle each thousand into 10 hundreds and count the hundreds out loud.
lookFor:
  - They say what a digit is worth, such as "the 4 is worth 40 000".
  - They explain regrouping with words like "10 tens make a hundred".
adapt:
  support:
    - Stay with three-digit numbers and real bundles until trading 10 for 1 feels easy.
    - Read numbers in two chunks, with a finger covering one part.
  access:
    - need: reading
      tip: Read number words aloud and let your child point to the number.
    - need: writing
      tip: Use digit cards or sticky notes instead of writing numbers.
    - need: language
      tip: '"Thousands" and "hundreds" sound alike. Point to each column as you say its name.'
  stretch:
    - Make the biggest and smallest numbers you can with four digit cards.
together:
  - problem: d1
    how: |-
      - Cut out five paper cards with 0, 2, 5, 7 and 9.
      - Move the cards and read every number aloud before you decide.
  - problem: d2
    how: |-
      - Draw 3 big squares for the thousands. Add 4 more blocks as hundreds or ones.
      - Write the number for each way you find.
