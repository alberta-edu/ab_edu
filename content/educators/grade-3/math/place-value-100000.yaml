id: place-value-100000
subject: math
why: Place value is how a child makes sense of big numbers, from a score to a price. Knowing that each place is worth ten of the next lets them read, compare and estimate numbers they could never count.
hook:
  title: Ten makes one
  time: 5 minutes
  covers: [K1.1, U1.1]
  body: |-
    1. Pour out a pile of about 50 small things, like pasta, beans or buttons.
    2. Ask: **"How many are there? Can you find out without counting one by one?"**
    3. Let them try. If they start making groups, ask why that helps.
    4. Ask: "What if we had 1 000 of them? How would you count?" Don’t answer yet.
activities:
  - title: Bundle up
    time: 15 minutes
    materials: Craft sticks or straws, elastic bands, and paper cups
    covers: [K1.1, K1.2, K1.4, S1.2, S1.5]
    steps:
      - Your child bundles sticks into tens with elastic bands, and ten tens into a hundred.
      - Write a number like 236. They build it with bundles and loose sticks.
      - 'Ask: "Can you show 236 a different way?" Unbundle a hundred into 10 tens and count again.'
      - 'Ask: "How many bundles would 1 000 need? What about 10 000?"'
  - title: Number detectives
    time: 15 minutes
    materials: Flyers, a calendar, game boxes, or a map with distances
    covers: [S1.4, S1.7, S1.8, K1.5, S1.6]
    steps:
      - Hunt for big numbers in print, like prices, page counts or the number of pieces in a puzzle.
      - Your child reads each one aloud. Write down three of them.
      - They order the three numbers and write them with < or >.
      - 'Ask: "When would we only need about how many?" Round one number together.'
questions:
  - Which digit is worth the most in this number? How do you know?
  - What happens when you have 10 of one place?
  - Is 900 tens the same as 9 000? How could you show it?
  - Where do you start when you compare two big numbers?
  - When is "about" good enough? When do we need the exact number?
misconceptions:
  - thought: '"5 is always worth 5."'
    why: A digit looks the same wherever it sits, and in Grade 1 most digits really were worth their face value.
    tryThis: Write 5, 50, 500 and 5 000 in a column. Ask how much money each 5 would be worth in dollars.
  - thought: '"More digits means a bigger number, even with a 0 in front."'
    why: Counting digits usually works, so it feels like a rule. Scoreboards and odometers show zeros on the left.
    tryThis: Read 08 450 aloud together. Ask if the 0 changed anything you said.
  - thought: '"4 thousands and 5 hundreds can’t be 45 hundreds."'
    why: They have learned one way to say each number, and a second way sounds like a different number.
    tryThis: Build it with bundles. Unbundle each thousand into 10 hundreds and count the hundreds out loud.
  - thought: '"4 368 rounds to 4 300 because I just drop the end."'
    why: Cutting off digits looks like rounding, and it gives a number that seems close.
    tryThis: Mark 4 300, 4 350 and 4 400 on a hallway with tape. Your child stands at 4 368 and says which end is closer.
lookFor:
  - They say what a digit is worth, not only its name, such as "the 4 is worth 40 000".
  - They compare from the left and stop at the first place that is different.
  - They explain regrouping with words like "10 tens make a hundred".
  - They choose to round when a situation only needs about how many.
adapt:
  support:
    - Stay with three-digit numbers and real bundles until trading 10 for 1 feels easy.
    - Use a place value chart drawn on paper, with a column for each place, and slide digit cards into it.
    - Read numbers in two chunks, the thousands and then the rest, with a finger covering one part.
  access:
    - need: reading
      tip: Read number words aloud and let your child point to the numeral. Reading "forty thousand six hundred eight" is harder than knowing the number.
    - need: writing
      tip: Use digit cards or sticky notes instead of writing numerals. Moving a card into a place shows the same thinking.
    - need: attention
      tip: Keep it physical and short. Five minutes of bundling beats twenty minutes of worksheets.
    - need: language
      tip: Place names like "thousands" and "hundreds" sound alike. Say them while pointing to each column, and use the same order every time.
    - need: hands
      tip: Use the on-screen chart with its large ▲ and ▼ buttons instead of small objects.
  stretch:
    - 'Make the greatest and least numbers you can with four digit cards. Then find the one closest to 5 000.'
    - Find a number that rounds to 30 000 to the nearest ten thousand and to 25 000 to the nearest thousand.
together:
  - problem: d1
    how: |-
      - Cut out five paper cards with the digits 0, 2, 5, 7 and 9.
      - Move the cards around for each part, and read every number aloud before you decide.
  - problem: d2
    how: |-
      - Draw a long line from 2 000 to 3 000 and mark the halfway point.
      - Shade where the newspaper number could be, then where the sign number could be. Where do they overlap?
