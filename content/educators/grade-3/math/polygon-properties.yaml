id: polygon-properties
subject: math
why: Properties move a child from “it looks like a square” to “it has 4 equal sides and 4 right angles”.
hook:
  title: Corner hunt
  time: 5 minutes
  covers: [K1.3, K1.4, S1.2]
  body: |-
    1. Fold a scrap of paper into a corner. That is your right-angle tester.
    2. Hunt the room for corners it fits exactly, and corners it doesn’t.
    3. Ask: “Is this corner bigger or smaller than the tester?”
activities:
  - title: Straw polygons
    time: 15 minutes
    materials: Straws or craft sticks, some cut shorter, and modelling clay for corners
    covers: [K1.5, K1.6, S1.3, S1.5]
    steps:
      - Your child builds a triangle, a quadrilateral, a pentagon and a hexagon.
      - 'Ask: “Can you make one regular, with all sides and all corners the same? Now an irregular one?”'
  - title: Mystery sort
    time: 10 minutes
    materials: 8 paper polygons, two bowls
    covers: [S1.4, U1.2, S1.1]
    steps:
      - Secretly sort the shapes into two bowls by one rule, like “has parallel sides”.
      - Your child guesses the rule, then sorts by a rule of their own for you to guess.
questions:
  - How many sides? What is it called?
  - Does your paper corner fit? Is that angle bigger or smaller?
  - Are all the sides equal? Are all the angles equal?
misconceptions:
  - thought: '"A shape with equal sides is always regular."'
    why: They check the sides and forget the angles.
    tryThis: Push a square of straws into a diamond. The sides stay equal, but are the corners still square?
  - thought: '"Only a shape that looks like a hexagon from a book is a hexagon."'
    why: Most pictures show regular shapes.
    tryThis: Draw a 6-sided shape that looks odd, and count its sides together.
lookFor:
  - They use a referent, like a paper corner, to check right angles.
  - They name a polygon by counting its sides, not by how it looks.
adapt:
  support:
    - Start with triangles and quadrilaterals only.
    - Trace sides with a finger while counting.
  access:
    - need: reading
      tip: Say the property names aloud and point to them on the shape.
    - need: hands
      tip: Use the shapes on screen instead of straws.
    - need: worry
      tip: In the mystery sort, every guess helps. A wrong rule rules something out.
  stretch:
    - Find a shape with right angles but no parallel sides. Is it possible?
together:
  - problem: d1
    how: |-
      - Cut out a square and a diamond with the same side length.
      - Lay a paper corner in each corner of both.
  - problem: d2
    how: |-
      - Draw your child’s rectangle on grid paper.
      - Ask what would have to change to make it regular.
