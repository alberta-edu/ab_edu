id: add-subtract-1000
subject: math
why: A child who knows why we trade 10 for 1 can add and subtract any numbers, and spot an answer that can’t be right.
hook:
  title: Too many ones
  time: 5 minutes
  covers: [S1.2, K1.2]
  body: |-
    1. Give your child 16 loose beans and some small cups.
    2. Say: **"A cup holds exactly 10. How can you show 16 with cups?"**
    3. Ask: "What would you do with 23 beans? With 40?"
activities:
  - title: Bean bank
    time: 20 minutes
    materials: Beans, small cups for tens, and bowls for hundreds (10 cups each)
    covers: [S1.2, K1.2, S1.3]
    steps:
      - Build two numbers, like 258 and 167, with beans, cups and bowls.
      - Push them together. Every 10 loose beans go into a cup, and every 10 cups into a bowl.
      - Write the sum the paper way, and match each small 1 to a trade.
  - title: Estimate first
    time: 10 minutes
    materials: A shopping flyer, paper and a pencil
    covers: [K1.3, S1.5, S1.6]
    steps:
      - Pick two prices under $500. Your child estimates the total by rounding to hundreds.
      - Then they add exactly, and check that the answer is close to the estimate.
questions:
  - Which place did you start with? Why that one?
  - Where did that small 1 come from?
  - Is your answer close to your estimate?
misconceptions:
  - thought: '"In 342 − 158, I just do 8 − 2."'
    why: Smaller from bigger feels like a rule, and it gives a number.
    tryThis: Build 342 with blocks and try to take 8 ones away. What do you need to do first?
  - thought: '"You can’t subtract from 600. There are no tens."'
    why: Breaking twice is two steps, and the empty tens look stuck.
    tryThis: Break 1 bowl into 10 cups, then 1 cup into 10 beans. Count what you have.
lookFor:
  - They explain each trade, like "10 ones made 1 ten".
  - They estimate before or after, and notice a far-off answer.
adapt:
  support:
    - Start with two-digit numbers, then add the hundreds.
    - Use beans and cups until trading feels easy, then write it on paper.
  access:
    - need: writing
      tip: Use grid paper so each digit sits in its own place.
    - need: attention
      tip: One sum with blocks is enough. Stop while it is still fun.
    - need: worry
      tip: An estimate is never wrong. It only needs to be close.
  stretch:
    - Find two 3-digit numbers with no zeros that add to exactly 1 000.
together:
  - problem: d1
    how: |-
      - Write the sum large on paper with blank boxes.
      - Try digits in the ones box until the ones end in 3.
  - problem: d2
    how: |-
      - Try 500 + 500 first, then ask what goes wrong.
      - Find one answer, then change it to make another.
