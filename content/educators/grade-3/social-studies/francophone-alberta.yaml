id: francophone-alberta
subject: social-studies
why: A child learns that a community has a story that keeps changing. French in Alberta started small and now connects Alberta to the world.
hook:
  title: Bonjour hunt
  time: 5 minutes
  covers: [K1.11, U1.3]
  body: |-
    1. Look at a cereal box or a toy package together. Find the French words.
    2. Ask: **"Who reads these French words in Alberta? Where did French come from?"**
    3. Open the lesson and follow the path.
activities:
  - title: Town name sleuths
    time: 15 minutes
    materials: A map of Alberta
    covers: [K1.10, S1.5]
    steps:
      - Look for places that start with "St." or have French words, like Lac Ste. Anne or Beaumont.
      - Pick one, and find out who named it and when, using the town’s website.
  - title: Our family path
    time: 15 minutes
    materials: Paper and crayons
    covers: [S1.5, K1.12]
    steps:
      - Draw a path like the one in the lesson, with three or four stops in your own family’s story.
      - Compare it with the Francophone path. Ask what is the same and what is different.
questions:
  - Why do you think French was the first European language spoken here?
  - How did one mission become a whole community?
  - What does it mean that French speakers come to Alberta from all over the world?
misconceptions:
  - thought: '"French is only spoken in Quebec."'
    why: Quebec is the place children hear about most when French comes up.
    tryThis: Spin the globe in the lesson, and count the places where French is spoken.
  - thought: '"Francophones in Alberta all come from France."'
    why: The word French sounds like France.
    tryThis: Read the stories of Amina and Luc in the practice, and find Cameroon and Quebec on the globe.
lookFor:
  - They tell how Francophone communities began and how they changed.
  - They name a Francophone place in Alberta.
  - They connect the fleur-de-lis to French speakers.
adapt:
  support:
    - Follow only the first and last stops on the path first. Then fill in the middle.
    - Point to St. Albert and Edmonton on a real map, and talk about how close they are.
  access:
    - need: reading
      tip: Read each stop aloud as your child presses ▶. The pictures carry the story.
    - need: language
      tip: If your child speaks French, let them lead and teach you a word or two.
    - need: attention
      tip: Do the path and the map one day, and the cards and the globe another day.
  stretch:
    - Find a Francophone school or festival in Alberta, and tell what it celebrates.
together:
  - problem: d1
    how: Ask your child to name the first and the last stop on the lesson’s path. What changed between them?
  - problem: d2
    how: Read each card aloud. Ask which one could not happen until another had happened first.
