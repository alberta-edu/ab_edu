id: resources-growth
subject: social-studies
why: Many Alberta towns are where they are because of a resource. Knowing that helps a child read their own town’s story.
hook:
  title: Why is our town here?
  time: 5 minutes
  covers: [K1.4, K1.3]
  body: |-
    1. Ask: **"Why do you think people first built a town where we live?"**
    2. Listen to every idea, such as a river, farmland or a mine.
    3. Open the lesson and tap the resources on the map.
activities:
  - title: Town detective
    time: 20 minutes
    materials: An online map or a local history book
    covers: [K1.4, K1.5, S1.1]
    steps:
      - Find out what your town or a nearby town was first known for, such as farming, coal or oil.
      - Draw the land, the resource and one job people did there.
  - title: Follow the money
    time: 10 minutes
    materials: Paper strips and a pencil
    covers: [S1.4]
    steps:
      - Write the four steps from the lesson, from oil to schools, on four strips.
      - Mix them up, and ask your child to put them back in order and explain each link.
questions:
  - What natural resources are near where you live?
  - Why did so many people move to Leduc after 1947?
  - How might a school be paid for by something under the ground?
misconceptions:
  - thought: '"All of Alberta has oil."'
    why: Oil is talked about so much that it seems to be everywhere.
    tryThis: Tap each resource on the map and name the region it is in.
  - thought: '"Towns are put in random places."'
    why: Children see towns already built and rarely hear why they started.
    tryThis: Press ▶ on Leduc again, and ask what the town needed before it grew.
lookFor:
  - They name a resource found in a region, such as oil sands in the boreal forest.
  - They explain that people moved to towns like Leduc for jobs.
  - They tell how money from resources can help pay for schools, hospitals and roads.
adapt:
  support:
    - Build a town with blocks. Add a "mine" and then more houses, and talk about why people came.
    - Do the card sort aloud, with your child pointing to each region on the map.
  access:
    - need: reading
      tip: Read each map card and job card aloud.
    - need: attention
      tip: Do the map and Leduc one day, and the jobs and money another day.
    - need: hands
      tip: Your child can say "Find oil!" while you press the buttons.
  stretch:
    - Find out what resource helped your nearest city grow, and add it to a drawing of the map.
together:
  - problem: b2
    how: Read Mia’s idea, then ask your child which fact shows people moving to a resource.
  - problem: d2
    how: Act out the coal town story with toys, one step at a time, before putting the cards in order.
