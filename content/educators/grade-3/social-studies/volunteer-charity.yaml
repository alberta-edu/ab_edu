id: volunteer-charity
subject: social-studies
why: Giving time and giving things are both real ways a child can help. Making and doing a plan turns a kind idea into action.
hook:
  title: Time or things?
  time: 5 minutes
  covers: [K1.3, K1.4]
  body: |-
    1. Ask: **"Have you ever given something away to help? Have you ever given your time?"**
    2. Ask which one felt better, and why.
    3. Open the lesson and sort the cards together.
activities:
  - title: Family food drive
    time: 1 week
    materials: A box and a local food bank’s list of needed items
    covers: [S1.2, K1.4, S1.3]
    steps:
      - Collect a few items from the food bank’s list. Count them each day.
      - Drop them off together, and ask what volunteers do there.
  - title: Our volunteer plan
    time: 30 minutes to plan, then the event
    materials: Paper and a pencil
    covers: [S1.4, K1.3]
    steps:
      - Use the five plan steps to choose one way to help your school or street.
      - Do it together, then talk about what changed.
questions:
  - Would you rather give time or give things? Why?
  - Which group in our community would you most like to help?
  - What could our family do to help someone this month?
misconceptions:
  - thought: '"Only adults with money can help."'
    why: Children often hear about large donations.
    tryThis: Sort the cards again. Count how many need only time.
  - thought: '"Giving things is enough. Nobody needs to volunteer."'
    why: Children rarely see the work that happens after a donation.
    tryThis: Press only Donate in the food bank until the bin is full. Ask what is missing.
lookFor:
  - They tell volunteering (giving time) from charity (giving things or money).
  - They name a group they could help, such as a food bank or animal shelter.
  - They give a reason for choosing to volunteer or to donate.
  - They put the steps of a volunteer plan in order.
adapt:
  support:
    - Play "food bank" with toy food. One person donates, one packs, then swap jobs.
    - Talk about a time someone helped your family, with time or with things.
  access:
    - need: reading
      tip: Read each card and plan step aloud.
    - need: attention
      tip: Do the sort and food bank one day, and the groups and plan another day.
    - need: worry
      tip: Talking about families without food can feel sad. Focus on how people help each other.
  stretch:
    - Find a local group that helps people or animals. Ask what they need most, time or things.
together:
  - problem: b2
    how: Read Zoe’s and Omar’s ideas as two voices. Ask your child to find one good reason in each.
  - problem: d1
    how: Your child explains each plan step in their own words before putting them in order.
