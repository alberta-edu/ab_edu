id: quality-of-life
subject: social-studies
why: Small actions and shared events make life better for everyone. It is the start of being an active citizen.
hook:
  title: What makes a good day?
  time: 5 minutes
  covers: [K1.1]
  body: |-
    1. Ask: **"What makes you feel safe, comfy, healthy and happy?"**
    2. Ask: **"What could you do to help someone else feel that way?"**
    3. Open the lesson and fill the meters together.
activities:
  - title: Kindness chart
    time: 10 minutes a day for a week
    materials: A chart with four columns, safety, comfort, health and happiness
    covers: [K1.2, K1.1]
    steps:
      - Each day, do one small action for yourself or someone else.
      - Put a sticker in each column the action helped.
  - title: Event explorers
    time: 1 afternoon
    materials: A local events calendar
    covers: [K1.5, K1.6]
    steps:
      - Choose a community event near you, such as a festival, a clean-up or a skating party.
      - Go together if you can. Afterwards, talk about who was there and what was shared.
questions:
  - What makes your quality of life good?
  - Which community event would you like to go to, and why?
  - What is one thing you could do this week to help your community?
misconceptions:
  - thought: '"Helping only counts if it is big."'
    why: Children hear most about big events and famous helpers.
    tryThis: Tap a small action on the meters, like inviting someone to play, and watch what goes up.
  - thought: '"Festivals are only for people from that culture."'
    why: Children may not know that most cultural festivals welcome everyone.
    tryThis: Flip the Heritage Festival card again, and ask who can go.
lookFor:
  - They name safety, comfort, health and happiness as parts of quality of life.
  - They tell how a community event helps people share and enjoy cultures.
  - They contrast an action that helps one person with one that helps the whole community.
adapt:
  support:
    - Act out each action on the meters with toys before tapping it.
    - Talk about one community event your family has been to.
  access:
    - need: reading
      tip: Read each action and card aloud.
    - need: attention
      tip: Do the meters and events one day, and the sort and helpers another day.
    - need: worry
      tip: Some children feel helpless about big problems. Focus on small actions they can do today.
  stretch:
    - Plan a mini community event for your street or class, such as a games afternoon. List who it would help.
together:
  - problem: w2
    how: Ask your child how Ana feels, and how her neighbour feels, before reading the choices.
  - problem: d2
    how: Read each idea aloud. Ask your child to act out what would happen next for each one.
