id: natural-resources
subject: social-studies
why: Some things we use every day come back, and some can run out. Parks help us take care of them.
hook:
  title: Where does it come from?
  time: 5 minutes
  covers: [S1.3, K1.1]
  body: |-
    1. Turn on a tap, a light and the stove or furnace.
    2. Ask: **"Where does the water, the light and the heat come from?"**
    3. Open the lesson and press ▶ on the tanks together.
activities:
  - title: Resource hunt
    time: 15 minutes
    materials: Paper and a pencil
    covers: [S1.3, K1.1, K1.2]
    steps:
      - Walk through your home and list five things that use water, sun, wind, oil or gas.
      - Mark each one ♻️ if nature replaces it, or ⏳ if it can run out.
  - title: Park poster
    time: 20 minutes
    materials: Paper and crayons
    covers: [S1.2, K1.6]
    steps:
      - Choose a park from the map. Draw what it protects, such as animals, lakes or mountains.
      - Write one reason why the park should stay a park.
questions:
  - What would change in your day if there were no natural gas?
  - Why does it matter that coal and oil can run out?
  - Which park on the map would you most like to visit, and what does it protect?
misconceptions:
  - thought: '"Oil and gas will be made again soon, like rain."'
    why: Children see many things refill, such as a water bottle or a gas tank.
    tryThis: Press ▶ on the tanks again. Ask why the oil tank stayed down.
  - thought: '"A park is just a place to play."'
    why: Many parks near home have playgrounds.
    tryThis: Tap Elk Island on the map. Ask what would have happened to the elk without it.
lookFor:
  - They sort water, wind and sun as renewable, and coal, oil and natural gas as non-renewable.
  - They name a way they use a natural resource every day.
  - They give a reason that parks help protect land, water or animals.
adapt:
  support:
    - Fill a cup with water, drink some, then refill it from the tap. Compare it with a snack that is gone once eaten.
    - Flip one card at a time and act out the day without it.
  access:
    - need: reading
      tip: Read the tank labels and cards aloud, then let your child press the buttons.
    - need: attention
      tip: Do the tanks one day and the parks map another day.
    - need: worry
      tip: Running out can sound scary. Talk about the wind, sun and water that keep coming back.
  stretch:
    - Find out which resource heats your home or school, and whether it is renewable.
together:
  - problem: b2
    how: Ask your child to argue for keeping the park before reading the choices.
  - problem: d2
    how: Point to each place in the list. Your child says "comes back" or "runs out" for each.
