id: alberta-regions
subject: social-studies
why: A child learns to read a map as a picture of real land. Some borders are lines people drew, and some follow the land.
hook:
  title: Where does our yard end?
  time: 5 minutes
  covers: [S2.1, K2.1]
  body: |-
    1. Stand at the edge of your yard, school field or park.
    2. Ask: **"How do we know where it ends?"** Look for a fence, a path, a hedge or a sign.
    3. Ask: **"Could you see the edge if the fence were gone?"**
    4. Say nothing more yet. Open the map in the lesson and press ▶.
activities:
  - title: Salt dough Alberta
    time: 20 minutes
    materials: Salt dough or modelling clay, a tray, a ruler, and the regions map from the lesson
    covers: [K2.2, K2.3, U2.1]
    steps:
      - Press the dough flat into Alberta’s shape. Use the ruler for the three straight sides.
      - Pinch tall peaks along the south-west side, then lower hills beside them.
      - Keep the south-east flat, and poke small lakes into the middle and the north.
      - 'Ask: "Which side of our Alberta did you need the ruler for? Which side did the mountains make?"'
  - title: Region detective
    time: 10 minutes
    materials: Photos of Alberta landscapes from a library book or calendar
    covers: [K2.3, S2.2]
    steps:
      - Look at one photo at a time. Your child names the landforms and water they see.
      - They point to the region on the lesson’s map and say which clue helped.
      - 'Swap: you describe a place in three clues, and your child guesses the region.'
questions:
  - Why are three of Alberta’s borders straight?
  - If you stood on the east border, what would you see?
  - Which region would you most like to visit, and what would you bring?
  - How is a region different from a province?
misconceptions:
  - thought: '"Borders are painted on the ground, like on the map."'
    why: Maps show borders as bold lines, so children expect to see them.
    tryThis: Look at a photo of a prairie road at the Saskatchewan border. Ask what tells you where the border is.
  - thought: '"Alberta is all prairie."'
    why: Many Albertans live in or near flat land, and the word prairie is used for the whole province.
    tryThis: Play the find game in the lesson, then count how many regions are not flat.
  - thought: '"A region is the same as a province."'
    why: Both are areas on a map with names.
    tryThis: Point out that regions are about the land, so the Rocky Mountains keep going into British Columbia.
lookFor:
  - They tell apart a border drawn by people from one that follows a landform.
  - They describe a region by its landforms and water, not only by its name.
  - They use a map to find a place, and say what the map shows.
adapt:
  support:
    - Start with only two regions, the Rocky Mountains and the grassland, before adding the rest.
    - Trace each border with a finger while saying "straight" or "mountains".
  access:
    - need: reading
      tip: Read each map card aloud. The emoji on each region gives a clue without words.
    - need: attention
      tip: Do the border drawing one day and the region game another day.
    - need: language
      tip: Pair each region with one gesture, such as a pointy peak for mountains or a flat hand for grassland.
    - need: hands
      tip: Your child can name the region and you tap it on the map.
  stretch:
    - Find your own town on the regions map. Which region do you live in, and what landforms are near you?
together:
  - problem: d1
    how: Before the choices, ask your child to show with their hands where the mountain border runs.
  - problem: d2
    how: Read the postcard aloud. Your child holds up one finger for each clue in bold.
