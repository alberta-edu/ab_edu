id: alberta-symbols
subject: social-studies
why: Alberta's symbols are on licence plates, flags and buildings. A child learns to read what they say about the land and its people.
hook:
  title: Spot the symbol
  time: 5 minutes
  covers: [S1.3, K1.10]
  body: |-
    1. Find something with an Alberta symbol on it, such as a licence plate, a flag or a sign.
    2. Ask: **"Why would Alberta put that picture there?"**
    3. Open the lesson and flip the cards.
activities:
  - title: Shield of my own
    time: 20 minutes
    materials: Paper and crayons
    covers: [S1.3, C_WNkKO6SkOOEOWyK5nq7g#K1.19]
    steps:
      - Draw a shield in four parts. Fill each part with something about your family’s land, history or language.
      - Explain each part, as you did for Alberta’s shield.
  - title: Symbol walk
    time: 30 minutes
    materials: A walk downtown, or photos of the Legislature Building
    covers: [K1.10, S1.3]
    steps:
      - Look for Alberta’s flag, colours, wild rose or coat of arms.
      - Count how many you find, and say what each one stands for.
questions:
  - Which Alberta symbol do you like best, and why?
  - What does the shield tell you about Alberta’s land?
  - If you could add one symbol for Alberta today, what would it be?
misconceptions:
  - thought: '"Symbols are just decorations."'
    why: Children see symbols everywhere, often without being told what they mean.
    tryThis: Build the shield again, and ask what each part stands for.
  - thought: '"The flag and the coat of arms are the same thing."'
    why: Both show the same shield.
    tryThis: Flip both cards again. Ask what the coat of arms has that the flag does not.
lookFor:
  - They name at least four of Alberta’s official symbols.
  - They tell what the shield shows about Alberta’s land.
  - They explain that symbols show heritage and identity.
adapt:
  support:
    - Print or draw the symbols, and play a matching game with their names.
    - Point to each part of the shield and name it together.
  access:
    - need: reading
      tip: Read each card aloud as your child flips it.
    - need: hands
      tip: Your child can say "next" while you press the button to build the shield.
    - need: language
      tip: Say "fortis et liber" together, then "strong and free". Ask if your family’s language has a word for "free".
  stretch:
    - Compare Alberta’s flag with your own community’s flag, such as a First Nation, Métis or Franco-Albertan flag.
together:
  - problem: b2
    how: Ask your child what the wheat field shows before reading the choices.
  - problem: d1
    how: Talk about the symbols from the earlier lessons, such as the sash and the tipi ring, before answering.
