id: first-nations-treaties
subject: social-studies
why: A child learns that Alberta's story starts with First Nations. A treaty is a promise between nations, and both sides had reasons to make it.
hook:
  title: Who was here first?
  time: 5 minutes
  covers: [K1.1, U1.1]
  body: |-
    1. Ask: **"Who lived in our town before our family did?"** Then: **"And before them?"**
    2. Keep asking "before them?" until your child gets stuck.
    3. Say: "Let’s find out who was here first." Open the lesson and press ▶.
activities:
  - title: Our class treaty
    time: 15 minutes
    materials: Paper, a pen, and two people who share something, such as a toy shelf or a garden bed
    covers: [K1.3, K1.4, S1.2]
    steps:
      - Each person says what they want from the shared space, and why.
      - Write an agreement that gives each side something it needs. Both sign it.
      - 'Ask: "Why did you sign? Was your reason the same as mine?"'
  - title: Treaty map puzzle
    time: 15 minutes
    materials: A printed outline of Alberta, scissors and crayons
    covers: [S1.1, K1.2]
    steps:
      - Copy the treaty areas from the lesson’s map, and colour each one.
      - Cut them out, mix them up and rebuild Alberta.
      - Find where you live. Say which treaty area it is in.
questions:
  - What does "since time immemorial" mean to you?
  - Why do you think people write down an agreement?
  - What did each side hope the treaty would bring?
  - Which treaty area do you live in? Who signed it?
misconceptions:
  - thought: '"Nobody lived here before the settlers came."'
    why: Many stories children hear start when settlers arrived.
    tryThis: Walk through the timeline in the lesson. Ask who was there at the very first stop.
  - thought: '"A treaty is a rule the government made."'
    why: Children often meet the government as the one who makes rules.
    tryThis: Ask who signed it. A treaty needs two sides that agree.
  - thought: '"All First Nations are one group."'
    why: The words "First Nations" sound like one name.
    tryThis: Read the names of the nations that signed Treaty 7 in the lesson. Each is its own nation.
lookFor:
  - They say First Nations were the first people in Alberta.
  - They find the treaty area for a place on a map.
  - They give one reason for each side signing a treaty.
adapt:
  support:
    - Start with the treaty where you live, then add the others.
    - Use two toy figures to act out a meeting where each side says what it wants.
  access:
    - need: reading
      tip: Read each map card aloud. The numbers on the map match the treaty names.
    - need: attention
      tip: Do the timeline one day and the map game another day.
    - need: language
      tip: Use "agreement" and "promise" alongside "treaty" until the word sticks.
    - need: hands
      tip: Your child names the treaty and you tap it on the map.
  stretch:
    - Find out which First Nations live closest to you, and what their nation is called in its own language.
together:
  - problem: b1
    how: Read the quote in two voices. Ask your child which person’s family had always lived on the land.
  - problem: d2
    how: Before ordering, ask your child to say the year Alberta became a province.
