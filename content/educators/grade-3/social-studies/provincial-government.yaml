id: provincial-government
subject: social-studies
why: School, the doctor and camping trips all depend on the province. A child learns who decides for all of Alberta, and how they are chosen.
hook:
  title: Who runs my school?
  time: 5 minutes
  covers: [K1.6, K1.5]
  body: |-
    1. Ask: **"Who do you think decides what you learn at school, all over Alberta?"**
    2. Ask the same about hospitals.
    3. Open the lesson and find where Alberta’s government meets.
activities:
  - title: Find your MLA
    time: 15 minutes
    materials: The Legislative Assembly of Alberta website
    covers: [K1.8, S1.1]
    steps:
      - Find the name of the MLA for your area, and a photo of the Legislature Building.
      - Talk about how your MLA and your local council members are alike.
  - title: Two-level town
    time: 20 minutes
    materials: Paper, crayons and two colours of sticky dots
    covers: [S1.2, K1.6, U1.1]
    steps:
      - Draw a town with a school, a hospital, a library, a fire hall and a park.
      - Put one colour of dot on local services, and the other colour on provincial services.
questions:
  - Why does Alberta need a government for the whole province, and not only town councils?
  - What does an MLA do?
  - How is choosing an MLA like choosing a council member?
misconceptions:
  - thought: '"The premier makes all the decisions."'
    why: The premier is the provincial leader that children hear about most.
    tryThis: Flip the MLA card again. Ask who debates and votes.
  - thought: '"Calgary is Alberta’s capital."'
    why: Calgary is the biggest city, and many children know it best.
    tryThis: Tap the Legislature on the map. Ask which city it is in.
lookFor:
  - They say that the Legislative Assembly meets in Edmonton, the capital.
  - They describe at least three provincial leaders, such as the premier, an MLA and the lieutenant-governor.
  - They sort services into local and provincial, such as libraries and hospitals.
adapt:
  support:
    - Make a name card for each leader, and act out a short meeting where the MLAs vote.
    - Do the town game together, saying "town" or "province" before each tap.
  access:
    - need: reading
      tip: Read each leader card aloud as your child flips it.
    - need: attention
      tip: Do the map and leaders one day, and the town game and circles another day.
    - need: language
      tip: Say "M-L-A" and then the full name. Point to the card each time.
  stretch:
    - Find out which minister is in charge of education in Alberta, and one thing they decide.
together:
  - problem: b2
    how: Ask your child which places in the town were local before reading the choices.
  - problem: d2
    how: Read both park names aloud. Ask your child what is different about them.
