id: metis-alberta
subject: social-studies
why: A child learns that the Métis are a people with their own culture, not "part" of another. Blending can make something new.
hook:
  title: Mix two, make one
  time: 5 minutes
  covers: [K1.9, U1.2]
  body: |-
    1. Mix two colours of play dough, or two juices, in front of your child.
    2. Ask: **"Is this still the first colour? The second one? Or something new?"**
    3. Say: "Some peoples blended ways of life too." Open the lesson and press ▶.
activities:
  - title: Finger weaving
    time: 20 minutes
    materials: Three or four long strands of thick yarn in different colours, and tape
    covers: [K1.8, S1.4]
    steps:
      - Tape the strands to a table. Your child braids or weaves them over and under to make a short band.
      - Compare it with the sash on the lesson’s card. Ask what the colours and the weaving might mean to the person who made it.
  - title: Build a cart
    time: 20 minutes
    materials: A small box, two paper plates, string, a pencil and tape
    covers: [K1.8, S1.4]
    steps:
      - Build a cart using only paper, wood and string, no metal.
      - Load it with small toys and pull it. Ask what you would do if a wheel broke on the prairie.
questions:
  - What is the same and what is different about Métis, First Nations and European ways?
  - Why would a family carry a sash or travel by Red River cart?
  - What does it mean for a community to govern itself?
misconceptions:
  - thought: '"Métis people are half First Nations and half European."'
    why: The idea of blending sounds like two halves.
    tryThis: Use the play dough from the hook. Ask whether the new colour is "half" or its own colour.
  - thought: '"The Métis only lived long ago."'
    why: Carts and sashes look like history.
    tryThis: Find the eight Métis Settlements on the map. People live and make decisions there today.
lookFor:
  - They describe Métis culture as its own, with roots in two traditions.
  - They name a Métis symbol and say what it shows.
  - They find a Métis Settlement on a map.
adapt:
  support:
    - Start with the sash. It is something your child can touch or make.
    - Count the eight Settlements on the map with your finger before playing the game.
  access:
    - need: reading
      tip: Read the circles aloud. Let your child press the button and say what changed.
    - need: hands
      tip: Thicker yarn and a looser weave make finger weaving easier.
    - need: language
      tip: Say "Métis" (MAY-tee) together. Point to each picture as you say its name.
  stretch:
    - Visit the website of the Métis Settlements General Council, and find one decision a Settlement council made.
together:
  - problem: b1
    how: Make two piles with your child, "First Nations roots" and "European roots". Sort Marie’s family’s work into them.
  - problem: d2
    how: Ask your child where a family on the prairie long ago could get wood, leather or metal.
