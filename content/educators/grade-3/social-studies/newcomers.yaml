id: newcomers
subject: social-studies
why: A child learns that Alberta keeps changing as people arrive. Getting to know others is something they can do today.
hook:
  title: Where is everyone from?
  time: 5 minutes
  covers: [S1.7, K1.17]
  body: |-
    1. Ask: **"Who in our family, or a friend’s family, moved here from somewhere else?"**
    2. Ask: **"Why do you think they came?"**
    3. Open the lesson and sort the reasons together.
activities:
  - title: Hello wall
    time: 15 minutes
    materials: Sticky notes and a pen
    covers: [S1.7, K1.21]
    steps:
      - Write "hello" in every language your family, friends and classmates speak, one per note.
      - Stick them on a wall. Ask each person how to say it, and practise together.
  - title: Taste and talk
    time: 30 minutes
    materials: A dish from a culture that is new to your family
    covers: [K1.21, K1.18]
    steps:
      - Cook or buy a dish from a culture that is new to you. Find out where it comes from.
      - While you eat, ask what else you would like to learn about that culture.
questions:
  - Why might a family leave everything to move to Alberta?
  - What do newcomers bring with them?
  - How would you want to be treated in a new school?
  - What is one thing you could do to help a new kid feel welcome?
misconceptions:
  - thought: '"Immigrants all came long ago."'
    why: History lessons focus on the past.
    tryThis: Ask your child whether anyone at school arrived in Alberta recently.
  - thought: '"Being different is a problem."'
    why: Children notice differences and sometimes copy what they hear.
    tryThis: Flip the culture cards again. Ask what Alberta would be missing without each one.
lookFor:
  - They give more than one reason people move to Alberta.
  - They name cultures and beliefs that newcomers brought.
  - They suggest a kind action when someone is treated unfairly.
adapt:
  support:
    - Start with your own family’s story before the cards.
    - Act out the lunch problem with toys, then talk about what could help.
  access:
    - need: reading
      tip: Read the culture cards aloud as your child flips them.
    - need: worry
      tip: Unfair treatment can be personal. Let your child share only what they want to.
    - need: language
      tip: Let your child teach you a word in a language they know, and be the learner.
  stretch:
    - Find a cultural festival near you, and plan what you would like to see or try there.
together:
  - problem: b2
    how: Ask your child how Priya feels before reading the choices. Then talk about what a friend could do.
  - problem: d2
    how: Read each kid’s story aloud. Your child names each reason on a finger.
