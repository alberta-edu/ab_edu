id: early-settlers
subject: social-studies
why: A child learns that settlers came from many places and found life here hard. It builds empathy for anyone starting over somewhere new.
hook:
  title: Pack one bag
  time: 5 minutes
  covers: [K1.15, K1.16]
  body: |-
    1. Say: **"We are moving to a farm far away, with no stores. You can pack one bag."**
    2. Your child chooses five things and explains each one.
    3. Ask: **"What would be the hardest part?"** Then open the lesson.
activities:
  - title: Sod house
    time: 20 minutes
    materials: Small squares of sponge or cardboard, a tray and a little soil or sand
    covers: [K1.15, S1.6]
    steps:
      - Stack the squares like bricks to build a small house, as settlers did with sod.
      - Talk about what it would be like inside in winter and in rain.
  - title: Settler interview
    time: 15 minutes
    materials: A grandparent, an older neighbour or a local museum’s website
    covers: [S1.6, U1.4]
    steps:
      - Find a story about an early settler family near you.
      - Your child asks or reads where they came from and what was hard. Tell the story back together.
questions:
  - Why would a family leave its home country for a farm in Alberta?
  - Which challenge would be hardest for you, and why?
  - What did settlers bring with them that we still see today?
misconceptions:
  - thought: '"All settlers came from England."'
    why: English is the main language children hear, so they expect everyone came from England.
    tryThis: Spin the globe in the lesson and count the places settlers came from.
  - thought: '"Free land meant an easy life."'
    why: Free sounds like a gift.
    tryThis: Follow the homestead story again. Ask what the family had to do to keep the land.
lookFor:
  - They name more than one place settlers came from.
  - They describe a settler challenge, and why it was hard.
  - They connect something in Alberta today to a settler group.
adapt:
  support:
    - Start with one settler group, such as the Ukrainians, before the whole globe.
    - Act out the language barrier with a made-up language, then talk about how it felt.
  access:
    - need: reading
      tip: Read the globe cards aloud as your child taps the dots.
    - need: worry
      tip: Some settlers left because of unfair treatment. Keep it simple, and let your child ask questions.
    - need: language
      tip: If your family moved to Canada, share your own story of what was new and hard.
  stretch:
    - Find a museum or historic site near you about early settlers, and plan a visit.
together:
  - problem: d1
    how: Speak a few words in a made-up language, and ask your child to fetch something. Then talk about Olena.
  - problem: d2
    how: Count on from 1905 on your fingers together. Then ask why Canada wanted farms.
