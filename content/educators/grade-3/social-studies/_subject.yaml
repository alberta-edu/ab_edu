subject: social-studies
promise: |-
  We hope your child comes to know Alberta: its land, its peoples and how it works together.

  - Facts about Alberta are easy to look up.
  - Asking "Who lives here? Who decides? How can I help?" is a habit for life.
shifts:
  - instead: Memorizing names on a map.
    tryThis: 'Asking what the land is like there, and how that shapes how people live.'
  - instead: Talking about "First Nations" or "settlers" as one group.
    tryThis: Naming the people, such as the Siksika, the Cree or Ukrainian settlers. Each has its own language and story.
  - instead: Telling your child which community or symbol matters most.
    tryThis: 'Asking "What does this mean to the people it belongs to? How do you know?"'
  - instead: Saying that helping is good.
    tryThis: Planning one real way to help, doing it, then talking about what changed.
routines:
  - name: Where in Alberta?
    time: 5 minutes
    how: When a town comes up in the news or a story, find it on the lesson’s map. Ask which region it is in and what the land is like.
  - name: Whose job is it?
    time: 5 minutes
    how: |-
      1. On a walk, spot a road, a park, a library or a school.
      2. Ask who looks after it: the town or city, or the province.
  - name: Symbol hunt
    time: 5 minutes
    how: Look for symbols around you, such as flags, sashes or the wild rose. Ask what each one says about the people who use it.
  - name: Make it better
    time: 10 minutes
    how: |-
      1. Ask what would make your street or school a little better.
      2. Choose one small action, and do it together.
assess:
  - They describe a place in Alberta by its landforms and water.
  - They name more than one people who make Alberta home, and something about each.
  - They tell apart what a town or city does and what the province does.
  - They suggest a real action that would help someone nearby.
sources:
  - label: 'Alberta Education: Social Studies Kindergarten to Grade 6 curriculum (2025)'
    url: https://curriculum.learnalberta.ca/
  - label: 'Amy von Heyking: historical thinking in the elementary years'
    url: https://www.thenhier.ca/en/content/von-heyking-amy-%E2%80%9Chistorical-thinking-elementary-years%E2%80%9D-2008-0.html
