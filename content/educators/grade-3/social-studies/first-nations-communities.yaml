id: first-nations-communities
subject: social-studies
why: A child learns that First Nations are many nations, not one. They start to notice First Nations languages and names in the places around them.
hook:
  title: Name detectives
  time: 5 minutes
  covers: [U1.1, K1.3]
  body: |-
    1. Say three Alberta place names: Wetaskiwin, Ponoka, Okotoks.
    2. Ask: **"Do these sound like English words? Where could they come from?"**
    3. Let your child guess. Then open the lesson to find out.
activities:
  - title: Our own place names
    time: 15 minutes
    materials: A map of Alberta, paper and a pencil
    covers: [U1.1, K1.3]
    steps:
      - Look for place names near you that might come from Cree, Blackfoot or Dene.
      - Look one up together on the town’s or First Nation’s own website. Write what it means.
  - title: Make a family symbol
    time: 20 minutes
    materials: Paper and crayons
    covers: [K1.5, S1.2]
    steps:
      - Talk about the tipi ring and the standing bear from the lesson.
      - Your child draws a symbol that tells something true about your family.
      - Swap drawings. Each person guesses what the other symbol means before hearing the answer.
questions:
  - Why does each First Nation have its own name and flag?
  - Which First Nations language is spoken nearest to where you live?
  - What would you want people to know about your own culture?
misconceptions:
  - thought: '"All First Nations speak the same language."'
    why: The words "First Nations" sound like one group.
    tryThis: Look at the three colours on the lesson’s map, and count the languages.
  - thought: '"First Nations only lived long ago."'
    why: Many books show First Nations only in the past.
    tryThis: Look at a First Nation’s own website together, with its news and events today.
  - thought: '"Every First Nation lives in tipis."'
    why: The tipi is the picture children see most often.
    tryThis: Ask what a tipi ring tells us about the past, and how families in that nation live today.
lookFor:
  - They name more than one First Nations language.
  - They say each First Nation has its own language, culture and history.
  - They ask what a symbol means to the people who chose it.
adapt:
  support:
    - Start with the First Nation nearest to you before the whole map.
    - Count the 48 in groups of ten with blocks or beans.
  access:
    - need: reading
      tip: Read each card aloud. The colour dots on the map show the language without words.
    - need: language
      tip: If your family speaks another language, compare how a place got its name in that language.
    - need: hands
      tip: Your child says which card to flip, and you tap it.
  stretch:
    - Find out how to say "hello" in the First Nations language spoken nearest to you, from that nation’s own website.
together:
  - problem: d1
    how: Look at the two cards from the lesson again. Ask what each nation might want people to know about itself.
  - problem: d2
    how: Before the second part, ask how many languages your child saw on the map.
