id: local-government
subject: social-studies
why: A child sees local government every day, in the park, the library and the snowplough. It shows how a community works.
hook:
  title: Who fixed that?
  time: 5 minutes
  covers: [K1.2]
  body: |-
    1. On a walk, point to a road, a park or a fire hall.
    2. Ask: **"Who do you think looks after this?"**
    3. Open the lesson and tap each place in the town.
activities:
  - title: Service spotting
    time: 20 minutes
    materials: Paper, a pencil and a walk around your neighbourhood
    covers: [K1.2, U1.1]
    steps:
      - Look for six local services, such as a fire hydrant, a library, a park or a sidewalk.
      - Draw each one, and say what would go wrong without it.
  - title: Meet your leader
    time: 15 minutes
    materials: Your town, city, county or First Nation website
    covers: [K1.1, S1.4, K1.3]
    steps:
      - Find the name and title of your local leader, such as mayor, reeve or Chief.
      - Find out when the next local election is.
questions:
  - What does your town or city do for your family every day?
  - Is your local leader a mayor, a reeve or a Chief? Why?
  - Why does the council meet before it decides?
misconceptions:
  - thought: '"The mayor decides everything."'
    why: The mayor is the leader that children hear about most.
    tryThis: Watch the council story again. Ask who votes on the decision.
  - thought: '"Every place has a mayor."'
    why: Most children's books and shows are set in cities and towns.
    tryThis: Sort the leader cards again, and ask what kind of place each community is.
lookFor:
  - They name services a municipal government provides, such as libraries and roads.
  - They match mayor, reeve and Chief to a city or town, a county and a First Nation.
  - They explain that citizens vote for representatives who meet to make decisions.
adapt:
  support:
    - Hold a small family "council meeting" to decide a snack. Talk first, then vote.
    - Use toy buildings to make your own town, and say who runs each one.
  access:
    - need: reading
      tip: Read each town card and leader card aloud.
    - need: attention
      tip: Do the town and the leaders one day, and the council and the cards another day.
    - need: language
      tip: Say the new words, mayor, reeve, council and trustee, together. Point to a picture for each.
  stretch:
    - Look up a decision your local council made this year. Ask who it helps.
together:
  - problem: b2
    how: Point out that the two names look alike. Ask your child which one is a county.
  - problem: d1
    how: Ask your child who would want the library and who would want the skatepark, before reading the choices.
