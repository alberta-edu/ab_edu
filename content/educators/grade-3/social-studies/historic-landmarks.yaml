id: historic-landmarks
subject: social-studies
why: A child learns that places hold stories. Asking "What happened here?" turns a cliff or an old building into history.
hook:
  title: Our own landmark
  time: 5 minutes
  covers: [K2.4]
  body: |-
    1. Ask: **"If a friend got lost near our home, what would you tell them to look for?"**
    2. List the places your child names, such as a big tree, a water tower or a church.
    3. Ask: **"Which of these did nature make? Which did people build?"**
activities:
  - title: Landmark museum label
    time: 15 minutes
    materials: An index card, crayons, and a photo or drawing of a local landmark
    covers: [S2.3, K2.4]
    steps:
      - Choose one landmark near you. Find out one thing that happened there long ago.
      - Your child draws it and tells you its story while you write one or two lines.
      - Stand the card up like a museum sign, and give a tour to someone at home.
  - title: Plaque detectives
    time: 20 minutes
    materials: A walk past old buildings, a park or a cemetery near you
    covers: [K2.5]
    steps:
      - Look for plaques or signs that say a place is historic.
      - Read one together. Ask what happened there, and why people want to remember it.
questions:
  - What makes a place a landmark?
  - Can something made by nature have a history with people?
  - Why would people want to protect an old place?
  - Which place near us has a story worth keeping?
misconceptions:
  - thought: '"Only old buildings can be historic."'
    why: Most historic places children visit are museums or old buildings.
    tryThis: Look at Head-Smashed-In on the lesson’s map. Ask who made the cliff, and why it is historic.
  - thought: '"A big or famous place must be historic."'
    why: Size and fame feel important.
    tryThis: Compare a new arena with the Legislature Building. Ask which one has a story from long ago.
lookFor:
  - They tell apart natural and constructed landmarks.
  - They give a reason from the past when they say a place is historic.
  - They say what being a historic site does for a place.
adapt:
  support:
    - Start with landmarks your child has seen in person before the ones on the map.
    - Sort photos into two piles, "nature made it" and "people built it", before the card sort.
  access:
    - need: reading
      tip: Read each landmark card aloud. The pictures on the map help your child remember which is which.
    - need: worry
      tip: The Frank Slide was a disaster. Keep to the facts in the lesson, and let your child ask questions.
    - need: language
      tip: Use "special place" for landmark and "important story" for historical significance at first.
  stretch:
    - Find a historic site in your own region, and tell its story in three sentences.
together:
  - problem: d1
    how: Ask your child to name one thing that happened at Head-Smashed-In, then one thing that happened at a new mall.
  - problem: d2
    how: Read the two places aloud. Before the second part, ask what makes a place historic.
