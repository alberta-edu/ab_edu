id: oral-traditions
subject: english-language-arts
why: A child learns that stories carried by voice link them to their family and community, and that these stories deserve care and respect.
hook:
  title: A story about you
  time: 5 minutes
  covers: [K1.2, K1.3]
  body: |-
    Tell your child a true story from the day they were born, or from when you were their age.

    1. Ask: "Who else knows this story?"
    2. Then: "Who might you tell it to one day?"
activities:
  - title: Story keeper
    time: 20 minutes
    materials: An older relative or family friend, in person or on a call
    covers: [S1.3, S1.2]
    steps:
      - Your child asks, "What story did your family tell you when you were little?"
      - They listen without interrupting, then say thank you.
      - They ask if they may share it, and how.
      - Later, they retell it to you, keeping it true.
  - title: Pass it on
    time: 10 minutes
    materials: Three or more people
    covers: [K1.2, U1.1]
    steps:
      - Whisper a short story to the first person, who tells it to the next.
      - The last person says it aloud. What changed?
      - 'Talk about it: "How do people keep a story the same for a hundred years?"'
questions:
  - Who told you this story? Who told them?
  - What does this story teach our family?
  - How could a story last for hundreds of years without being written?
  - Why do we ask before we share someone else’s story?
misconceptions:
  - thought: '"Stories only last if they are written down."'
    why: Children mostly meet stories in books.
    tryThis: Name a family story nobody ever wrote down. It lasted because people told it.
  - thought: '"Any story I hear is mine to share."'
    why: Stories feel free to retell.
    tryThis: 'Ask: "Whose story is it?" Practise asking permission before sharing.'
lookFor:
  - They explain that people spoke before they wrote.
  - They name generations in order, such as grandparents, parents and children.
  - They retell a family story and say what it teaches.
  - They ask permission and thank the teller.
adapt:
  support:
    - Draw a family tree with three generations, and put a story beside one person.
    - Retell one short family story together before your child tries alone.
  access:
    - need: language
      tip: Your child can collect a story in your home language, and share it in either language.
    - need: worry
      tip: If family stories are hard to reach, a story from a neighbour, coach or teacher works too.
    - need: reading
      tip: Read “The Big Snow” aloud, the way a grandparent would tell it.
  stretch:
    - Record an older relative telling a story, with their permission.
    - Find out about an oral tradition from a community near you, and who may share it.
together:
  - problem: d2
    how: Read “The Big Snow” aloud. Ask, "What does the family do now because of this story?"
  - problem: d1
    how: Ask, "If nobody could write, how would you remember a story?"
