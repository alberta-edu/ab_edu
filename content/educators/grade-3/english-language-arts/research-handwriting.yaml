id: research-handwriting
subject: english-language-arts
why: A child learns that research follows a question, that sources are always listed, and that cursive and typing get easier with practice.
hook:
  title: Question jar
  time: 5 minutes
  covers: [K3.1]
  body: |-
    Pick an animal your child loves.

    1. Together, list three questions about it, such as "What does it eat?"
    2. Pick the question they most want answered.
activities:
  - title: Kitchen-table report
    time: 20 minutes
    materials: A library book or a kids’ website, paper and crayons
    covers: [K3.3, K3.4, K3.6, S3.2, S3.4]
    steps:
      - Draw a web with the animal in the middle and three branches, like food, home and babies.
      - Your child finds one fact for each branch, in their own words.
      - At the bottom, write the book or website under **My sources**.
  - title: Cursive warm-up
    time: 5 minutes
    materials: Lined paper
    covers: [K4.2, S4.2]
    steps:
      - Your child writes one joined word slowly, like *tile* or *little*.
      - Check together. Do tall letters reach the top line? Do all letters lean the same way?
questions:
  - What do you want to find out?
  - Where could you look for that fact?
  - Which branch of your web does this fact go on?
  - Where did this fact come from?
  - Do all your letters lean the same way?
misconceptions:
  - thought: '"Research means copying from a book."'
    why: Copying feels like getting the facts right.
    tryThis: Read a fact, close the book, and say it in your own words. Then write it.
  - thought: '"I only need my sources if I copy."'
    why: Their own words feel like their own facts.
    tryThis: Ask, "Who found this fact first?" Then list that source.
lookFor:
  - They ask a focused question.
  - They sort facts into groups, and list their sources.
  - Their cursive letters have the same size and slant.
  - They keep their fingers on the home row when they type.
adapt:
  support:
    - Give three branch labels for the web, ready to fill.
    - Practise cursive one letter at a time before joining.
  access:
    - need: writing
      tip: Your child can type their facts, or say them while you write.
    - need: hands
      tip: Use a thicker pencil, or write big on a whiteboard first.
    - need: language
      tip: Research in your home language first. Then find the English words together.
  stretch:
    - Share the research as a short slide show or a poster.
    - Find one more source, and check that it agrees.
together:
  - problem: d1
    how: Look at a book made for Grade 1 first. Ask, "What makes this easy for little kids to read?"
  - problem: d2
    how: Write *tile* in cursive together on lined paper. Point to the top line.
