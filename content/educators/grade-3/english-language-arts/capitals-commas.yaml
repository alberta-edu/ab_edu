id: capitals-commas
subject: english-language-arts
why: A child learns that capitals, end marks, commas and abbreviations tell readers how to read their words.
hook:
  title: Read it like a robot
  time: 5 minutes
  covers: [U1.1, K1.3]
  body: |-
    Write a short note with no capitals, commas or end marks.

    1. Your child reads it aloud with no pauses at all, like a robot.
    2. Add the marks together. Read it again. What changed?
activities:
  - title: Shopping list sentence
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K1.3, S1.3]
    steps:
      - Your child writes one sentence listing four things you need from the store.
      - They read it aloud and tap the table at each pause. Add a comma there.
  - title: Envelope address
    time: 10 minutes
    materials: An envelope or a postcard
    covers: [K5.1, S5.1, S1.1]
    steps:
      - Your child writes a real address, with capitals and abbreviations like **St.** and **AB**.
      - Mail it, or post it on the fridge.
questions:
  - Is that sentence telling, asking or showing a strong feeling?
  - Where do you pause when you read it aloud?
  - Which words are names that need capitals?
  - Is there a short way to write that word?
misconceptions:
  - thought: '"Put a comma wherever you take a breath."'
    why: Commas often match pauses in speech.
    tryThis: Read a sentence aloud. Ask, "Is this a pause between parts, or a list?"
  - thought: '"Every abbreviation ends with a period."'
    why: Many common ones, like Dr. and St., do.
    tryThis: Look for **cm**, **min** and **AB** on a ruler, a recipe or a map.
lookFor:
  - They capitalize sentences, names, days and headings.
  - They end sentences with the mark that fits.
  - They add commas in lists and between parts.
  - They spell common abbreviations.
adapt:
  support:
    - Keep a card with the three end marks and an example of each.
    - Fix one kind of mark at a time, such as only capitals.
  access:
    - need: reading
      tip: Read the sentences aloud. Your child points to where the marks go.
    - need: hands
      tip: Your child can type, or point while you write the marks.
    - need: language
      tip: Talk about how your home language shows a question or a list.
  stretch:
    - Find abbreviations on signs, calendars and food labels. Say what each stands for.
    - Write a sentence where a comma changes the meaning.
together:
  - problem: d1
    how: Read both sentences aloud together, the second one with no pause at all.
  - problem: d2
    how: Look at a letter or parcel that came to your home. Find the abbreviations.
