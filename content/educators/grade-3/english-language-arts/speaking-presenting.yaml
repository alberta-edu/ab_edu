id: speaking-presenting
subject: english-language-arts
why: A child learns that a good talk is planned, that the voice and body can help, and that the audience matters too.
hook:
  title: Say it three ways
  time: 5 minutes
  covers: [K4.1, K4.2]
  body: |-
    Say "I love broccoli!" three ways: mumbling at the floor, shouting, and clearly with a smile.

    1. Ask: "Which one did you believe?"
    2. Then let your child try.
activities:
  - title: Show and tell
    time: 15 minutes
    materials: A favourite object
    covers: [K5.4, S5.1, S5.5]
    steps:
      - Your child plans three things to say about the object, in order.
      - They add a hello at the start and a thank-you at the end.
      - They take a slow breath, stand tall, and give the talk to the family.
  - title: Poem by heart
    time: 10 minutes a day for a few days
    materials: A short poem
    covers: [S5.4, K2.3, K2.4]
    steps:
      - Read the poem together and mark where to pause with a slash.
      - Each day, cover one more line and say it from memory.
      - Perform it for someone, with pauses in the right places.
questions:
  - Could the person at the back hear you?
  - What did your face say while you talked?
  - Where would a pause help here?
  - Who is your audience? What do they need?
  - What can an audience do to help a speaker?
misconceptions:
  - thought: '"Louder is always better."'
    why: Children hear "speak up" a lot.
    tryThis: Practise a voice that fits the room. Loud enough for the back, but not shouting.
  - thought: '"Pausing means I forgot."'
    why: Stops can feel awkward.
    tryThis: Show how a pause before a key word makes it stand out.
lookFor:
  - They breathe and stand tall before speaking.
  - They speak loudly and clearly enough to be heard.
  - They plan ideas in a logical order.
  - They are a quiet, kind audience and ask a question after.
adapt:
  support:
    - Give a plan card with Hello, First, Next, Last, Thank you.
    - Practise in front of one person, then two, then the family.
  access:
    - need: worry
      tip: A recorded talk or digital story can come first, before speaking live.
    - need: language
      tip: Your child can present in their home language to family first, then in English.
    - need: attention
      tip: Keep talks to about one minute.
  stretch:
    - Interview a family member and record it.
    - Perform a short readers’ theatre script with a friend.
together:
  - problem: d1
    how: Read each sentence aloud and ask, "Is this a start, a middle or an end?"
  - problem: d2
    how: Act out Lily’s line two ways, and ask which one you believe.
