id: fluent-reading
subject: english-language-arts
why: A child learns that good reading is smooth and full of expression, and that every reader gets stuck sometimes and knows how to get unstuck.
hook:
  title: Robot reader
  time: 5 minutes
  covers: [K1.2, S1.2]
  body: |-
    Read a sentence from a favourite book like a robot, one flat word at a time.

    1. Then read it again with expression.
    2. Ask: "Which way was easier to understand? Why?"
activities:
  - title: Sight word flash
    time: 5 minutes a day
    materials: Index cards and a marker
    covers: [S2.1, K2.1]
    steps:
      - Write common words your child meets often, such as *because*, *friend* and *again*.
      - Flash each card for a second. Keep the ones they read at a glance in a "fast" pile.
  - title: Fix-up bookmark
    time: 10 minutes
    materials: A strip of card and crayons
    covers: ['LANENG3-OI7-GQ1-LO1#K6.1', 'LANENG3-OI7-GQ1-LO1#S6.2']
    steps:
      - 'Your child draws four fixes on a bookmark: reread, read ahead, picture it and ask why.'
      - At bedtime reading, they point to the fix they used when they got stuck.
questions:
  - Did that sound smooth, or choppy?
  - What does the punctuation tell your voice to do?
  - Where did it stop making sense?
  - Which fix could you try?
  - Did the fix work?
misconceptions:
  - thought: '"The fastest reader is the best reader."'
    why: Speed is easy to notice and to measure.
    tryThis: Read a page too fast, then just right. Ask which one was easier to follow.
  - thought: '"Good readers never get stuck."'
    why: Children don't see the fixing that good readers do in their heads.
    tryThis: Think aloud as you read, and show a moment where you reread.
lookFor:
  - They read common words at a glance.
  - They read in phrases, with pauses and expression.
  - Their voice follows the punctuation.
  - They notice where reading stops making sense, and choose a fix.
adapt:
  support:
    - Read a line first, then your child echoes it.
    - Reread the same short book many times. Fluency grows with each read.
  access:
    - need: reading
      tip: Choose a book a little below your child's level, so they can focus on expression.
    - need: language
      tip: Read together in your home language too. Expression works in every language.
    - need: worry
      tip: Read to a pet or a stuffed animal. There is no one to judge.
  stretch:
    - Practise a readers' theatre part until it sounds like the character.
    - Record a reading, then listen and pick one thing to improve.
together:
  - problem: d2
    how: Read a sentence super fast, then with pauses. Your child picks which one they understood.
  - problem: b2
    how: Cover the second sentence first. Can your child guess *ambled*? Then uncover it.
