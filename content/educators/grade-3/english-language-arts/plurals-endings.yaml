id: plurals-endings
subject: english-language-arts
why: A child learns spelling patterns for plurals and endings, and that some plurals must be learned one by one.
hook:
  title: One, two, many
  time: 5 minutes
  covers: [K3.2, S3.3]
  body: |-
    Say a word, like *dog*. Your child says the plural, *dogs*.

    1. Mix in tricky ones: *sheep*, *child*, *mouse*, *tooth*.
    2. Laugh at silly guesses, like *mouses*. Then find the real word.
activities:
  - title: Plural pairs
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K3.1, S5.6]
    steps:
      - Write *baby*, *cherry*, *leaf* and *loaf*.
      - Your child writes each plural, then checks in a dictionary.
  - title: Ending spinner
    time: 10 minutes
    materials: A paper clip and a pencil, for a spinner
    covers: [K5.3, K5.4, S5.3]
    steps:
      - Draw a spinner with *-s*, *-ed*, *-ing* and *-er*.
      - Spin, then add the ending to a word, like *bake* or *hop*. Does a letter drop or double?
questions:
  - Does the word end in y, f or fe? What changes?
  - Does this plural follow a pattern, or is it a new word?
  - What job does this ending do?
  - Does a letter drop, or double?
  - Are you comparing two things, or three or more?
misconceptions:
  - thought: '"Every plural just adds -s."'
    why: Most plurals do.
    tryThis: Collect plurals that don’t, like *mice*, *teeth* and *moose*, on a fridge list.
  - thought: '"Add -ed to every verb in the past."'
    why: It works for most verbs.
    tryThis: Say *I runned*. Laugh, then find the real word, *ran*.
lookFor:
  - They change y to i and f to v before adding es.
  - They know common plurals that change or stay the same.
  - They drop the e or double a letter before -ing or -ed.
  - They use -er for two things and -est for three or more.
adapt:
  support:
    - Use letter tiles. Swap the y or f tile for the new letter.
    - Practise one pattern at a time.
  access:
    - need: reading
      tip: Say each word aloud before your child spells it.
    - need: language
      tip: Talk about how your home language shows more than one.
    - need: hands
      tip: Your child can spell aloud while you write, or type the words.
  stretch:
    - Find five words in a book that end in *-ies* or *-ves*.
    - Make a funny poster of three things, using *-er* and *-est*.
together:
  - problem: d1
    how: Write *leaf* and *leaves* one above the other. Circle what changed.
  - problem: d2
    how: Clap *run-ning* together. Each clap gets one *n*.
