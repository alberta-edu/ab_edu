id: connect-predict
subject: english-language-arts
why: A child learns to link a book to what they already know, and that a good guess can change as the story goes.
hook:
  title: Cover detectives
  time: 5 minutes
  covers: [S3.1, S3.2]
  body: |-
    Show the cover of a book your child hasn’t read.

    1. Ask: "What do you think will happen? What clue tells you?"
    2. Write the prediction on a sticky note, and check it later.
activities:
  - title: Connection chain
    time: 10 minutes
    materials: A story you read together
    covers: [K2.2, S2.1, S2.2, S2.3]
    steps:
      - After reading, take turns making a connection to yourselves, another book, or the world.
      - Each person names which kind of connection they made.
  - title: Stop and predict
    time: 15 minutes
    materials: A picture book
    covers: [S3.1, S3.3, S3.4]
    steps:
      - Stop before each page turn and make a prediction together.
      - After the page, ask, "Keep it or change it? Why?"
questions:
  - Does this remind you of anything in your life?
  - Is it like another book you know?
  - What is happening in the world that is like this?
  - What clue makes you think that?
  - Do you want to keep or change your prediction?
misconceptions:
  - thought: '"A wrong prediction means I’m a bad reader."'
    why: Children often feel predictions are tests.
    tryThis: Celebrate changing a prediction. It shows you were reading closely.
  - thought: '"Any guess is a prediction."'
    why: Children enjoy wild guesses.
    tryThis: 'Ask, "What clue in the book made you think that?"'
lookFor:
  - They make connections before, during and after reading.
  - They tell text-to-me, text-to-text and text-to-world connections apart.
  - They predict using a clue and what they know.
  - They change a prediction when they learn something new.
adapt:
  support:
    - Start with text-to-me connections. They are the easiest.
    - Point to a clue in the pictures before asking for a prediction.
  access:
    - need: language
      tip: Make connections in your home language first, then name the kind in English.
    - need: reading
      tip: Read the story aloud, and let your child focus on predicting.
    - need: worry
      tip: Make your own wrong predictions out loud, and change them happily.
  stretch:
    - Keep a prediction log for a chapter book, and mark each one kept or changed.
    - Find a connection to something in the news, with a grown-up.
together:
  - problem: d1
    how: Ask, "What happens to your snowman on a warm day?"
  - problem: d2
    how: Underline each clue word, then talk about where you would use those things.
