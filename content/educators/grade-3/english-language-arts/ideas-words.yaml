id: ideas-words
subject: english-language-arts
why: A child learns that ideas are everywhere, and that the senses, exact words and varied sentences make writing come alive.
hook:
  title: Mystery bag
  time: 5 minutes
  covers: [K2.6, S2.6]
  body: |-
    Hide a fruit, like an orange, in a bag.

    1. Your child touches and smells it, then describes it without naming it.
    2. Guess together, then list the best describing words.
activities:
  - title: Idea jar
    time: 10 minutes
    materials: A jar and slips of paper
    covers: [K2.3, S2.3, K2.1]
    steps:
      - Brainstorm ideas from your life, your imagination and favourite books. Write each on a slip.
      - When it is time to write, your child pulls one out.
  - title: Sense walk
    time: 15 minutes
    materials: A notebook
    covers: [K2.6, S2.6]
    steps:
      - Walk outside. Your child writes one thing they see, hear, smell and feel.
      - Back home, turn the list into two sentences.
questions:
  - Where did that idea come from?
  - What would you see, hear, smell, taste or feel there?
  - Is there a more exact word than that?
  - How else could you start that sentence?
  - Which form fits what you want to say?
misconceptions:
  - thought: '"Describing means only colours and sizes."'
    why: Sight words come first to mind.
    tryThis: Close your eyes and describe a place using only sounds and smells.
  - thought: '"I have nothing to write about."'
    why: Children often think stories must be exciting adventures.
    tryThis: Brainstorm small moments, like a funny breakfast or a lost mitt.
lookFor:
  - They find ideas in their life, knowledge, imagination and books.
  - They add details from more than one sense.
  - They swap a plain word for an exact one.
  - They start sentences in different ways.
adapt:
  support:
    - Use real objects to describe before writing.
    - Keep a list of exact words, like *tiptoed* and *whispered*, on the fridge.
  access:
    - need: writing
      tip: Your child can say the sentences while you write, or type them.
    - need: language
      tip: Describe in your home language first. Then find the English words together.
    - need: worry
      tip: Write together first. Silly ideas are welcome.
  stretch:
    - Write a short poem using all five senses.
    - Rewrite a page from a favourite book with new sensory details.
together:
  - problem: d2
    how: Eat a snack together first. Describe how it looks, sounds, smells and tastes.
  - problem: d1
    how: Ask, "Can you picture a good day? What would make it easier to see?"
