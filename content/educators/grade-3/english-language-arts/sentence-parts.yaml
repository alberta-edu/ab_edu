id: sentence-parts
subject: english-language-arts
why: A child learns that sentences do different jobs, that each has a subject and a predicate, and that the subject and verb must match.
hook:
  title: Simon says
  time: 5 minutes
  covers: [K2.1, S2.1]
  body: |-
    Play a quick round of Simon Says.

    1. Point out that every instruction was a **command**, like *Touch your nose.*
    2. Ask your child for a command that tells you **not** to do something.
activities:
  - title: Sentence mix-up
    time: 10 minutes
    materials: Strips of paper and scissors
    covers: [K2.2, K2.3, K2.4, S2.2, S2.3]
    steps:
      - Write four short sentences. Cut each one between the subject and the predicate.
      - Mix the pieces. Your child builds new, silly sentences, like *Grandpa | sways in the wind.*
  - title: One or many?
    time: 10 minutes
    materials: Toy animals
    covers: [K2.8, S2.7]
    steps:
      - Put out one toy, and say what it does, like *The horse runs.*
      - Add more of the same toy. Your child says the sentence again so it agrees.
questions:
  - Is this sentence telling, asking, commanding or exclaiming?
  - Who or what is this sentence about?
  - What is the subject doing or being?
  - Is it one, or more than one? Does the verb match?
misconceptions:
  - thought: '"The subject is always the first word."'
    why: In many short sentences it is.
    tryThis: Try *The tall trees sway.* The subject is three words, *The tall trees*.
  - thought: '"Add s to the verb when there are many."'
    why: Nouns get an s for more than one.
    tryThis: Compare *the dog runs* and *the dogs run*. The s moves!
lookFor:
  - They sort sentences that tell, ask, command and exclaim.
  - They find the subject of a sentence.
  - They find the predicate of a sentence.
  - They notice when a subject and verb don’t agree.
adapt:
  support:
    - Ask "Who?" to find the subject, then "Doing what?" to find the predicate.
    - Use two colours to underline the two parts.
  access:
    - need: reading
      tip: Read the sentences aloud, then talk about each one.
    - need: language
      tip: Some languages don’t change the verb for one or many. Practise with real objects.
    - need: attention
      tip: Do one kind of sentence at a time.
  stretch:
    - Write a poster of pool rules, using only commands.
    - Find the subject and predicate in sentences from a favourite book.
together:
  - problem: d2
    how: Talk about real pool rules first. Which ones say what **not** to do?
  - problem: d1
    how: Read *My friend was* and *My friends were* aloud. Which pair sounds right?
