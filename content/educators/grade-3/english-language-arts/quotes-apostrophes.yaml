id: quotes-apostrophes
subject: english-language-arts
why: A child learns that quotation marks show someone’s exact words, and that apostrophes show missing letters or an owner.
hook:
  title: Comic bubbles
  time: 5 minutes
  covers: [K1.4, S1.4]
  body: |-
    Open a comic or a picture book with speech bubbles.

    1. Your child reads one bubble aloud.
    2. Write it as a sentence together, with quotation marks around the bubble’s words.
activities:
  - title: Family quotes
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S1.4, K1.4]
    steps:
      - At dinner, your child listens for one funny thing someone says.
      - Afterwards, they write it with quotation marks and who said it.
  - title: Whose is it?
    time: 10 minutes
    materials: Sticky notes
    covers: [S1.7, S3.4, S3.5]
    steps:
      - Your child labels things around the house, like *Dad’s mug* or *the cats’ bowls*.
      - Ask, "One owner or more? Does it already end in s?"
questions:
  - Which words did they really say?
  - Is that word used in its usual way?
  - Which letters did the apostrophe replace?
  - Does someone own it, or is it just more than one?
misconceptions:
  - thought: '"Every word ending in s needs an apostrophe."'
    why: They see apostrophes near the letter s a lot.
    tryThis: Ask, "Does it own something? Are letters missing?" If not, no apostrophe.
  - thought: '"Quotation marks go around the whole sentence."'
    why: The whole sentence is about the talking.
    tryThis: Point to a speech bubble. Only the bubble’s words go inside the marks.
lookFor:
  - They put quotation marks around a speaker’s words.
  - They spot a word used in a special way.
  - They spell contractions like *don’t* and *I’m*.
  - They write *dog’s* for one owner and *dogs’* for many.
adapt:
  support:
    - Act it out. Your child holds up a paper bubble while they speak.
    - Write the two long words first, then cross out letters to make the contraction.
  access:
    - need: reading
      tip: Read the sentence aloud in a different voice for the speaker’s words.
    - need: hands
      tip: Your child can point to where the marks go while you write them.
    - need: language
      tip: Talk about how your home language shows someone’s words in writing.
  stretch:
    - Write a short conversation between two pets, with quotation marks.
    - Hunt for contractions in a favourite book and say the two words for each.
together:
  - problem: d2
    how: Line up three toy cars. Ask, "Whose cars are these? One boy’s, or the boys’?"
  - problem: d1
    how: Read the sentence aloud and ask, "What do the birds own?"
