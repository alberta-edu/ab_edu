id: story-elements
subject: english-language-arts
why: A child learns that stories are built from parts, so they can follow a story, retell it, and build their own.
hook:
  title: Where did we go?
  time: 5 minutes
  covers: [K3.9]
  body: |-
    Tell a tiny story about your morning that ends where it began, such as leaving the house and coming home.

    1. Ask: "Where did my story start? Where did it end?"
    2. Then: "Can you think of a book that ends back home?"
activities:
  - title: Story walk
    time: 10 minutes
    materials: A favourite picture book
    covers: [K1.7, S1.5]
    steps:
      - Read the book together.
      - Your child takes one step for each part. Beginning, problem, events, solution, ending.
      - At each step, they say what happens in that part.
  - title: I or she?
    time: 10 minutes
    materials: Paper and a pencil
    covers: [K3.10, S3.7]
    steps:
      - Your child tells something that happened today, starting with "I".
      - Then they tell it again with their name, as if someone else were watching.
      - 'Ask: "Which way lets us hear what you were thinking?"'
questions:
  - Who is this story mostly about? How do you know?
  - Where and when does this story happen?
  - What is the problem? What fixes it?
  - Does this story end near where it started?
  - Who is telling this story? Is it a character?
misconceptions:
  - thought: '"The major character is the one in the title."'
    why: Titles often name a character or a thing.
    tryThis: 'Ask: "Who has the problem? Who tries to fix it?" That is usually the major character.'
  - thought: '"Setting is only a place."'
    why: Places are easy to picture.
    tryThis: Point out time words, such as *in winter* or *long ago*. They are part of the setting too.
  - thought: '"The narrator is always the writer."'
    why: Children often picture the author telling the story.
    tryThis: Read a page with "I" and ask, "Who is the I?" It is a character, not the writer.
lookFor:
  - They name the characters, setting and plot of a story.
  - They retell a story in order, with its problem and solution.
  - They spot a story that ends back where it started.
  - They say whether the narrator is inside or outside the story.
adapt:
  support:
    - Use five sticky notes for the five parts of a story.
    - Start with very short picture books, where each page is one part.
    - Give the frame "This story is mostly about ___, because ___."
  access:
    - need: reading
      tip: Read the story cards aloud, and let your child do the tapping.
    - need: hands
      tip: Your child can say "Next" and you press the button.
    - need: language
      tip: Act out *setting* by pointing around the room, and *character* by pointing at people.
  stretch:
    - Make up a circle story about a pet, and draw it on a paper plate.
    - Retell a fairy tale with the narrator inside, starting with "I".
together:
  - problem: d2
    how: |-
      - Read the story twice.
      - Ask, "Who wants something? Who does the work?"
  - problem: d1
    how: Draw a circle on paper with Sam’s tree at the top. Ask where the new ending would go.
