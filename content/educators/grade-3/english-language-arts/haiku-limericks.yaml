id: haiku-limericks
subject: english-language-arts
why: A child learns that a poem can have a shape, a beat and a rhyme, and that playing with those rules is fun.
hook:
  title: Clap your name
  time: 5 minutes
  covers: [K5.3]
  body: |-
    Clap the beats in everyone’s name at the table.

    1. Ask: "Whose name has the most beats?"
    2. Then: "Can we make a line of exactly five beats?"
activities:
  - title: Haiku walk
    time: 20 minutes
    materials: A notebook, and a walk outside
    covers: [S5.3, K5.3]
    steps:
      - Walk slowly and pick one thing in nature to look at.
      - Say a 5-beat line about it, then a 7-beat line, then a 5-beat line.
      - Write it down. Clap each line to check.
  - title: Silly limerick
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K5.4, S5.3]
    steps:
      - 'Start with "There once was a ___ from ___".'
      - List words that rhyme with the place.
      - Build the five lines together. Lines 3 and 4 get their own rhyme.
questions:
  - How many beats are in this line? Let’s clap it.
  - What picture does this haiku put in your head?
  - Which lines rhyme? Can you name the pattern?
  - Is this word used in its exact meaning, or in a new way?
misconceptions:
  - thought: '"A syllable is a letter."'
    why: Short words like *a* are one letter and one beat.
    tryThis: Clap *strong*. Six letters, one beat.
  - thought: '"All poems have to rhyme."'
    why: Many poems children hear do rhyme.
    tryThis: Point out that a haiku is built on beats, not rhymes.
lookFor:
  - They clap the syllables of a line correctly.
  - They name the 5-7-5 shape of a haiku.
  - They find the AABBA rhymes in a limerick.
  - They write a haiku and check it by clapping.
adapt:
  support:
    - Put a hand under the chin. Each time the jaw drops, that is a beat.
    - Write a haiku together first, then let your child try alone.
  access:
    - need: writing
      tip: Your child says the haiku aloud and you write it down.
    - need: language
      tip: Clap familiar words first, like family names and foods.
    - need: attention
      tip: Make clapping a game. Stand up and stomp the beats.
  stretch:
    - Write a limerick about a family pet.
    - Write a haiku for each season.
together:
  - problem: d1
    how: Write A or B under each end word together. Then ask which pair breaks the pattern.
  - problem: d2
    how: Clap each line together. If it has too many beats, swap a long word for a short one.
