id: suffixes-compounds
subject: english-language-arts
why: A child learns that word endings carry meaning, that two small words can build a big one, and that long words break into beats.
hook:
  title: Who does it?
  time: 5 minutes
  covers: [K2.6, S2.3]
  body: |-
    Act out an action, such as painting, swimming or acting.

    1. Your child names the action, then the person: *paint*, *painter*.
    2. Try *art* and *sail*. Which ending fits?
activities:
  - title: Compound word snap
    time: 10 minutes
    materials: Index cards and a marker
    covers: [S2.4]
    steps:
      - Write small words on cards, such as *snow*, *ball*, *foot*, *rain* and *bow*.
      - Your child snaps pairs into compound words and says what each one means.
  - title: Adverb charades
    time: 10 minutes
    materials: None
    covers: [S2.2, K2.5]
    steps:
      - Walk slowly, quickly or quietly. Your child guesses the -ly word.
      - Swap roles. Then name things you do daily and weekly.
questions:
  - What does the -ly word tell you about the action?
  - Who is a person who does that?
  - What two words make this compound word?
  - Does the meaning match the two parts?
  - How many beats can you clap in that word?
misconceptions:
  - thought: '"A compound word always means its two parts."'
    why: Many first compound words, like *snowman*, do.
    tryThis: Talk about *butterfly* and *hotdog*. Do the parts tell you what they are?
  - thought: '"-ly always tells how."'
    why: Most -ly words children meet tell how.
    tryThis: 'Compare *slowly* with *weekly* and *lastly*. Which tells when? Which tells order?'
lookFor:
  - They add -ly to make words that tell how, when or in what order.
  - They name a person who does something with -er, -or, -ar or -ist.
  - They split a compound word and check its meaning.
  - They clap the syllables in a long word.
adapt:
  support:
    - Start with -er words, like *teacher* and *farmer*.
    - Clap syllables while you say a word slowly together.
  access:
    - need: language
      tip: Many languages have words for jobs. Compare how they are built.
    - need: reading
      tip: Read each word aloud first, then clap it together. Put a hand under the chin to feel each beat.
    - need: attention
      tip: Do one step a day, with one word game each.
  stretch:
    - Invent a new compound word, and say what it means.
    - Find a word with both a suffix and a prefix, such as *unkindly*.
together:
  - problem: d1
    how: Draw a fly made of butter together, then look at a real butterfly picture.
  - problem: b1
    how: Ask, "What does a person who plays the guitar do?"
