id: fiction-nonfiction
subject: english-language-arts
why: A child learns that every text was made by someone for a reason, and starts asking, “Is this made up, or is it true?”
hook:
  title: Text hunt
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    Walk through one room together and point at things with words or pictures: a cereal box, a calendar, a book.

    1. Ask: "Is this a text? Who made it?"
    2. Then: "Was it made to teach us something, or for fun?"
activities:
  - title: True or made up?
    time: 10 minutes
    materials: Two books from home or the library, one story and one fact book on the same topic
    covers: [K1.3, K1.4, K1.5, S1.3]
    steps:
      - Read one page of each book together.
      - Your child finds one thing that could never really happen.
      - Then they find one fact they could check with an expert.
  - title: One story, three ways
    time: 15 minutes
    materials: Paper, crayons, and a family member to act
    covers: [K1.6, S1.4]
    steps:
      - Pick a tiny story, such as the dog stealing a sock.
      - Draw it in three boxes, with no words.
      - Then act it out, with each person saying one line.
      - 'Ask: "Which way did you like best? Why?"'
questions:
  - Who made this text? Why do you think they made it?
  - Could this really happen? How do you know?
  - What is one fact in this book?
  - Can a picture with no words be a text?
  - What book do you love? What makes you love it?
misconceptions:
  - thought: '"A book about a real animal is non-fiction."'
    why: The topic is real, so the whole book seems real.
    tryThis: 'Ask: "Could this really happen?" A talking wolf is still fiction.'
  - thought: '"Only books are texts."'
    why: At school, reading usually means books.
    tryThis: Point out signs, maps, videos and drawings. Each one has meaning for someone.
  - thought: '"Fiction has no true facts in it."'
    why: Stories feel completely made up.
    tryThis: Read a story about an animal and find one true fact the writer put in.
lookFor:
  - They sort a text as fiction or non-fiction and give a reason.
  - They say whether a text was made to inform or for enjoyment.
  - They name a drama, a short story or an image as a form of text.
  - They explain why they like a book, using “because”.
adapt:
  support:
    - Start with picture books, where the pictures make made-up parts easy to see.
    - Use only two questions at first, "Fact or made up?" and "Fun or facts?".
    - Give the frame "I like it because ___."
  access:
    - need: reading
      tip: Read “Bella’s Busy Night” aloud. Your child can say “fact” or “made up” after each sentence.
    - need: language
      tip: Fiction and non-fiction look alike as words. Hold up a real story book and a fact book as you say each one.
    - need: attention
      tip: Do the card sorts quickly, one card at a time, and celebrate each one.
  stretch:
    - Write two sentences about a pet, one fiction and one non-fiction.
    - Find a text that is made both to inform and for enjoyment, such as a funny fact book.
together:
  - problem: d1
    how: |-
      - Cover the choices and ask, "Could a wolf pup talk to a crow?"
      - Then read Sam’s idea together and look for the mistake.
  - problem: d2
    how: Read the story one sentence at a time. After each one, ask, "Could a real beaver do that?"
