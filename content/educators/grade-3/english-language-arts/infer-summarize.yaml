id: infer-summarize
subject: english-language-arts
why: A child learns to read what the writer didn’t say, and to retell what matters most, in order and in their own words.
hook:
  title: Detective face
  time: 5 minutes
  covers: [K4.1, S4.2]
  body: |-
    Make a face or act something out without words, such as shivering.

    1. Your child guesses how you feel, or what is happening.
    2. Ask: "What clue told you? What do you know that helped?"
activities:
  - title: Clue hunt
    time: 10 minutes
    materials: A picture book
    covers: [S4.1, S4.2]
    steps:
      - Stop on a page where a character shows a feeling without naming it.
      - Your child names the feeling and points to the words or picture that show it.
  - title: Five-finger retell
    time: 10 minutes
    materials: None
    covers: [S5.1, S5.2, S5.3]
    steps:
      - After a story, your child holds up a finger for each big event as they retell it.
      - Five fingers at most. Small details don’t get a finger.
questions:
  - How do you think the character feels? What tells you?
  - Why do you think they did that?
  - What clue did you use? What did you already know?
  - What are the most important ideas?
  - Can you tell it in your own words, in order?
misconceptions:
  - thought: '"An inference is just a guess."'
    why: Both are ideas the text doesn’t say.
    tryThis: 'Always ask, "What clue in the text tells you that?"'
  - thought: '"A summary tells everything."'
    why: Children want to include every favourite part.
    tryThis: Ask if a detail is needed to understand the story. If not, leave it out.
lookFor:
  - They use a clue and what they know to infer.
  - They explain a character’s feelings with evidence.
  - They pick out the important ideas.
  - They retell the big events in order, in their own words.
adapt:
  support:
    - Use pictures first. Faces and bodies give clear clues.
    - Start summaries with First, Next, Then and Last.
  access:
    - need: language
      tip: Retell in your home language first, then in English.
    - need: reading
      tip: Read the text aloud, and let your child focus on the thinking.
    - need: writing
      tip: Your child can draw the big events as four boxes, instead of writing.
  stretch:
    - Retell a story from another character’s point of view.
    - Summarize a chapter book chapter in three sentences.
together:
  - problem: d1
    how: Act out the scene together. Ask how Dev’s sister felt when he held out his cone.
  - problem: d2
    how: Point to each clue word and ask, "When do you wear that?"
