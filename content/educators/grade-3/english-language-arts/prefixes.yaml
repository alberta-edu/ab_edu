id: prefixes
subject: english-language-arts
why: A child learns that many long words are built from parts, and that knowing a prefix unlocks many new words.
hook:
  title: Prefix flip
  time: 5 minutes
  covers: [K2.4, S2.1]
  body: |-
    Say a word: *happy*, *tie*, *lock*.

    1. Your child adds **un-** and acts out the new word.
    2. Then try **re-**: *retie*, *relock*. What changed?
activities:
  - title: Prefix hunt
    time: 10 minutes
    materials: A book, a cereal box or a store flyer
    covers: [S2.1, U2.1]
    steps:
      - Hunt for words that start with re-, un-, dis-, mis-, sub- or super-.
      - For each one, cover the prefix and check that a base is left.
  - title: Prefix cards
    time: 10 minutes
    materials: Index cards and a marker
    covers: [K2.2, K2.4]
    steps:
      - Write prefixes on one colour of card and bases on another.
      - Your child joins pairs to make real words, and says what each one means.
questions:
  - What is the base in this word?
  - What does the prefix add?
  - If you cover the first letters, is a base left?
  - Can you think of another word with the same prefix?
misconceptions:
  - thought: '"Every word that starts with un or re has a prefix."'
    why: Children learn to spot the letters before the meaning.
    tryThis: 'Cover the letters in *uncle* and *ready*. Is a base left?'
  - thought: '"un- works with every word."'
    why: It is the first prefix most children learn.
    tryThis: 'Try *unagree*, then *disagree*. Which one is a real word?'
lookFor:
  - They split a word into a prefix and a base.
  - They say what a prefix means, such as again, not or under.
  - They use a prefix to work out a new word.
  - They notice when letters are not a prefix.
adapt:
  support:
    - Start with **un-** and **re-**. Act each word out.
    - Use two colours for prefix and base when writing words.
  access:
    - need: language
      tip: Some home languages have prefixes too. Compare one or two.
    - need: reading
      tip: Read each word aloud, then cover the prefix together.
    - need: attention
      tip: Do one prefix a day. Collect its words on a sticky note.
  stretch:
    - Find a word with two affixes, such as *unkindly*.
    - Invent a superhero and name its powers with prefixes.
together:
  - problem: d1
    how: Write *uncle* and *unkind*. Cover *un* in each and compare what is left.
  - problem: d2
    how: Try each prefix you know on all three words, out loud.
