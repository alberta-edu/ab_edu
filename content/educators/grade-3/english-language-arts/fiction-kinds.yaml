id: fiction-kinds
subject: english-language-arts
why: A child learns to notice what kind of story they are reading, so they know what to expect and can pick more stories they love.
hook:
  title: Guess the kind
  time: 5 minutes
  covers: [K3.1, S3.1]
  body: |-
    Read only the first line of three different books.

    1. Ask: "Is this set today or long ago? Is there a secret?"
    2. Then: "Which one do you want to keep reading?"
activities:
  - title: Detective at home
    time: 15 minutes
    materials: A small toy to hide, and three clues on paper
    covers: [K3.5]
    steps:
      - Hide the toy. Leave three clues that lead to it.
      - Your child follows the clues and solves the mystery.
      - Then they hide it, and write clues for you.
  - title: Long ago, or today?
    time: 10 minutes
    materials: An old family photo or a story from a grandparent
    covers: [K3.3, K3.4]
    steps:
      - Look at the photo and talk about what was different then.
      - Make up one sentence of historical fiction set at that time.
      - Then make up one sentence of realistic fiction set today.
questions:
  - When does this story happen? How can you tell?
  - Could this really happen today?
  - What is the secret? What clues have you found?
  - Who is the hero? What brave thing do they do?
  - What would this character's voice sound like?
misconceptions:
  - thought: '"Historical fiction is true."'
    why: Real places and times make it feel true.
    tryThis: Ask, "Did this exact person really live?" The setting is real, but the story is imagined.
  - thought: '"A myth is any story with magic."'
    why: Many myths have magic.
    tryThis: Point out that a myth is a traditional story, told for a very long time, often with a brave hero.
lookFor:
  - They name a kind of fiction and give a reason.
  - They use the time, the place and the characters to decide.
  - They find a clue that helps solve a mystery.
  - They use voice and body to show a character.
adapt:
  support:
    - Start with only two kinds, realistic and historical.
    - Use the question "Today or long ago?" first, then "Is there a secret?"
  access:
    - need: reading
      tip: Read “The Missing Hat” aloud, and pause so your child can guess before the end.
    - need: worry
      tip: Act out the scene together first, so your child is never acting alone.
    - need: language
      tip: Show a picture for each kind, such as a clock for historical and a magnifying glass for mystery.
  stretch:
    - Write a three-clue mystery for a friend to solve.
    - Find a myth from another country at the library and retell it.
together:
  - problem: d1
    how: Ask, "Did Anna, the girl in the wagon, really live? Or did a writer imagine her?"
  - problem: b1
    how: Read paragraph 2 and ask, "Which clue is right on the doghouse?"
