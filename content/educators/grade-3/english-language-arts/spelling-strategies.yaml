id: spelling-strategies
subject: english-language-arts
why: A child learns to spell new words from ones they know, to spot tricky words, and to use a strategy or tool when stuck.
hook:
  title: Word family race
  time: 5 minutes
  covers: [S3.1, S3.2]
  body: |-
    Write *ake* on a piece of paper.

    1. Your child adds letters in front to make words, like *cake* and *snake*.
    2. How many can they make in one minute?
activities:
  - title: Have a go
    time: 10 minutes
    materials: Paper folded into three columns
    covers: [K4.1, S4.1]
    steps:
      - Say a word your child doesn’t know how to spell, like *giraffe*.
      - They try it three ways, one in each column, and circle the one that looks right.
      - Check it together in a dictionary.
  - title: Tricky word wall
    time: 10 minutes
    materials: Sticky notes
    covers: [K3.6, S3.7, K4.2]
    steps:
      - When your child meets a tricky word, like *said* or *friend*, write it on a sticky note.
      - Put the notes on a wall. Read them together often.
questions:
  - What word do you know that looks like this one?
  - Can you hear every letter in that word?
  - Is that part spelled the same as in other words?
  - What could you try when you are stuck?
  - Where could you check the spelling?
misconceptions:
  - thought: '"You can always sound a word out."'
    why: Sounding out works for many words.
    tryThis: Sound out *said* and *two* together. Then talk about picturing tricky words.
  - thought: '"Good spellers never check."'
    why: They seem to just know.
    tryThis: Show how you check a spelling in a dictionary or with spell check.
lookFor:
  - They use a word they know to spell a new one.
  - They spell prefixes, suffixes and compound words the same way each time.
  - They name some tricky words.
  - They try a strategy or a tool when they are stuck.
adapt:
  support:
    - Keep a short list of word families on the fridge, like -ight and -ake.
    - Learn two or three tricky words a week.
  access:
    - need: reading
      tip: Say the words aloud before your child sorts or spells them.
    - need: hands
      tip: Spell aloud, with letter tiles, or by typing.
    - need: worry
      tip: Praise good tries. Trying a few ways is a real strategy.
  stretch:
    - Make a word family book, one page per pattern.
    - Find tricky words in a favourite book, and say what makes each one tricky.
together:
  - problem: d1
    how: Look for *because* in a book. Trace it with a finger, then write it from memory.
  - problem: d2
    how: Show your child a real dictionary and spell check. Try both with *dinosaur*.
