id: word-meanings
subject: english-language-arts
why: A child learns that words have neighbours, opposites, look-alikes and sound-alikes, and that the words around a word tell you what it means.
hook:
  title: Opposite game
  time: 5 minutes
  covers: [S1.6]
  body: |-
    Say a word. Your child shouts its opposite as fast as they can: hot, up, happy, open.

    1. Then switch: you say a word, they say one that means the same.
    2. Ask: "Which was harder?"
activities:
  - title: Sound-alike hunt
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S1.6]
    steps:
      - Say a pair of homophones, such as *pair* and *pear*.
      - Your child draws a tiny picture for each one.
      - Find three more pairs together, such as *sea* and *see*.
  - title: Word collector
    time: 5 minutes a day
    materials: A small notebook
    covers: [S1.1, S1.2, S1.4]
    steps:
      - Your child writes one new word a day from a book, sign or class.
      - They draw a picture or write what it means.
      - At dinner, they use the word in a sentence.
questions:
  - Can you think of a stronger word than that?
  - What is the opposite of this word?
  - Which spelling fits this sentence?
  - What words around it help you know what it means?
  - Which class would you hear this word in?
misconceptions:
  - thought: '"Synonyms mean exactly the same thing."'
    why: Synonyms are often taught as matching pairs.
    tryThis: Compare *large* and *enormous*. They are close, but one is much bigger.
  - thought: '"A word has only one meaning."'
    why: Children often learn a word through one use.
    tryThis: 'Find a word like *bat* or *ring*, and draw each meaning.'
lookFor:
  - They name a synonym and an antonym for a common word.
  - They choose the right homophone in a sentence.
  - They use the words around a word to choose its meaning.
  - They use new subject words in talk and writing.
adapt:
  support:
    - Start with antonyms. They are easiest to picture.
    - Use pictures for homophones, such as a pear and a pair of socks.
  access:
    - need: language
      tip: Find out if your home language has words that sound alike too. Compare them.
    - need: reading
      tip: Read the card sentences aloud, and let your child choose the bin.
    - need: writing
      tip: For the synonym question, your child can say a word and you type it.
  stretch:
    - Make a homophone joke, such as “Why did the bee get married? It found its honey.”
    - Make a word ladder from *tiny* to *enormous*.
together:
  - problem: d2
    how: Ask, "How do you feel on your birthday?" Collect several words before typing one.
  - problem: b1
    how: Cover *bat* and ask what else might hang upside down in a barn.
