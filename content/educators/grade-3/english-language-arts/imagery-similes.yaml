id: imagery-similes
subject: english-language-arts
why: A child learns that words can mean just what they say, or paint a picture with imagery, hyperbole and similes.
hook:
  title: Simile game
  time: 5 minutes
  covers: [K1.6, S1.5]
  body: |-
    Point to something in the room, such as a pillow.

    1. Ask: "What is it like?" Your child finishes: "As soft as ___."
    2. Take turns. Silly answers are welcome!
activities:
  - title: Hyperbole hunt
    time: 10 minutes
    materials: None
    covers: [K1.5, K1.2]
    steps:
      - Listen for stretched truths at home, such as "I'm starving!" or "This takes forever!"
      - Each time, ask your child what the speaker really means.
  - title: Picture in my head
    time: 10 minutes
    materials: Paper and crayons
    covers: [K1.4, S1.5]
    steps:
      - Read a sentence with imagery from a favourite book.
      - Your child draws exactly what the words show, then adds one more detail in words.
questions:
  - Does that mean just what it says?
  - What picture do these words make in your head?
  - Is that really true, or is it stretched?
  - What two things are being compared?
  - What could you compare this to?
misconceptions:
  - thought: '"Every sentence with like is a simile."'
    why: Children learn the like-or-as rule before the comparing idea.
    tryThis: 'Compare *I like cake* with *soft like a cake*. Ask: what is being compared?'
  - thought: '"Hyperbole is lying."'
    why: The words are not true.
    tryThis: Ask whether the listener is fooled. Hyperbole is a stretch everyone knows is a stretch.
lookFor:
  - They tell literal from figurative words.
  - They point out words that help them see a picture.
  - They explain what a hyperbole really means.
  - They make a simile that compares two unlike things.
adapt:
  support:
    - Start with "as ___ as" similes. They are easiest to build.
    - Act out a hyperbole, then say what it really means.
  access:
    - need: language
      tip: Share a simile or saying from your home language. Talk about the picture it makes.
    - need: reading
      tip: Read the sentence cards aloud, and let your child choose the bin.
    - need: attention
      tip: Do one step a day. Each step has its own picture to play with.
  stretch:
    - Write a three-line poem that uses one simile and one hyperbole.
    - Turn a plain sentence into one with imagery, then a simile.
together:
  - problem: d2
    how: Ask, "What is a rink made of?" Then list shiny things together before typing one.
  - problem: b1
    how: Close your eyes while your child reads each sentence. Say what you can see.
