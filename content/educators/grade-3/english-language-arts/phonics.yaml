id: phonics
subject: english-language-arts
why: A child learns the letter teams that trip up readers, and a way to read any big word one chunk at a time.
hook:
  title: Silent letter detectives
  time: 5 minutes
  covers: [K1.4, S1.3]
  body: |-
    Write *know*, *write* and *lamb* on paper.

    1. Your child reads each word and crosses out the letter they can't hear.
    2. Ask: "Why might it still be there?"
activities:
  - title: Letter team hunt
    time: 10 minutes
    materials: A favourite book and three coloured pencils
    covers: [S1.1, S1.2, S1.3]
    steps:
      - Copy six words from the book. Underline blends in one colour, digraphs in another and silent letters in a third.
      - Say each word slowly to check.
  - title: Chunk it
    time: 10 minutes
    materials: Sticky notes
    covers: [K1.5, S1.4, S1.5]
    steps:
      - Write a long word from a book, such as *grasshopper*, one chunk per sticky note.
      - Your child reads each chunk, then slides them together and reads the whole word.
questions:
  - Do you hear every letter in that team?
  - What sound do those two letters make together?
  - Which letter is silent?
  - How could you break that word into chunks?
  - Does the vowel in that chunk say its name?
misconceptions:
  - thought: '"Every letter makes a sound."'
    why: Early phonics teaches one sound for each letter.
    tryThis: Count the letters and the sounds in *knee*. Which number is bigger?
  - thought: '"A blend and a digraph are the same."'
    why: Both are two consonants side by side.
    tryThis: 'Say *st* and *sh* slowly. In which one can you hear both letters?'
lookFor:
  - They find blends at the start and end of words.
  - They read less common digraphs, such as ph, wh and gh.
  - They spot silent letters.
  - They chunk a long word and read it in a sentence.
adapt:
  support:
    - Start with blends you can stretch out, like *s-t-o-p*.
    - Tap a finger for each sound in a word.
  access:
    - need: language
      tip: Some sounds may not be in your home language. Practise them with a mirror.
    - need: reading
      tip: Say the word first, then look at its letters together.
    - need: attention
      tip: Do one kind of letter team a day.
  stretch:
    - Find a word with a blend, a digraph and a silent letter.
    - Make a list of words where *gh* sounds like **f**, or is silent.
together:
  - problem: d2
    how: Tap a finger for each sound as you both say *shrimp* slowly.
  - problem: b2
    how: Clap *pumpkin* together. Where does the clap split it?
