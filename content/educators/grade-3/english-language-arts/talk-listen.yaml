id: talk-listen
subject: english-language-arts
why: A child learns that a good conversation is shared work, and that real listening is something you do on purpose.
hook:
  title: Two-way talk
  time: 5 minutes
  covers: [K2.1, K2.2]
  body: |-
    Have a short talk about dinner where you only talk, and never ask anything.

    1. Ask: "How did that feel? Did you get a turn?"
    2. Then try again, taking turns and asking questions.
activities:
  - title: Question ball
    time: 10 minutes
    materials: A soft ball
    covers: [K2.2, S2.1]
    steps:
      - Pick a topic, such as the best summer day.
      - Whoever holds the ball shares one idea, then tosses it.
      - The catcher asks a question about that idea, or adds to it.
  - title: Listening detective
    time: 10 minutes
    materials: A short video or read-aloud
    covers: [K3.1, S3.1]
    steps:
      - Before you start, say why you are listening, such as "to find out what owls eat".
      - Pause halfway. Your child asks one question to clear something up.
      - At the end, they tell you one new word or fact.
questions:
  - Is that an idea, a fact, or an opinion?
  - What did your friend say? What could you ask them?
  - Who hasn’t had a turn yet?
  - What were you listening for?
  - What new word did you hear?
misconceptions:
  - thought: '"Listening means being quiet."'
    why: Children are often told to listen by being quiet.
    tryThis: Show that listening is active. You think about the purpose, ask questions and respond.
  - thought: '"Asking a question means I wasn’t listening."'
    why: Some children worry that questions look silly.
    tryThis: Praise questions like "Did you mean ___?" They show careful listening.
lookFor:
  - They take turns and stay on topic.
  - They ask questions that fit the topic.
  - They ask for clarification when unsure.
  - They invite others to share.
adapt:
  support:
    - Use sentence starters, such as "I agree because…" and "Can you tell me more about…?"
    - Hold a talking object. Only the holder speaks.
  access:
    - need: language
      tip: Practise the question "Can you say that again?" It works in any talk.
    - need: worry
      tip: Let your child practise a question with you before asking a guest or teacher.
    - need: attention
      tip: Keep talks short, and give your child a job, such as asking one question.
  stretch:
    - Lead a family talk about weekend plans, making sure everyone has a turn.
    - Listen to a podcast for kids and share three new facts.
together:
  - problem: d2
    how: Act out the nurse’s visit together. Your child does each move as you go.
  - problem: b2
    how: Ask, "How would Lee feel if nobody asked her?"
