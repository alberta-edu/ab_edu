id: nonfiction-features
subject: english-language-arts
why: A child learns that fact books are built in patterns, and that maps and graphs hold facts too.
hook:
  title: What does the picture know?
  time: 5 minutes
  covers: [U2.1, S2.1]
  body: |-
    Open a fact book to a page with a map, graph or labelled picture.

    1. Cover the main text with your hand.
    2. Ask: "What can you learn from just the picture?"
activities:
  - title: Make a cycle wheel
    time: 15 minutes
    materials: A paper plate, crayons
    covers: [K4.3, S4.2]
    steps:
      - Pick a cycle, such as a frog, a butterfly, or the seasons.
      - Draw each stage around the edge of the plate.
      - Turn the plate and tell the cycle. Notice that it never really ends.
  - title: Bird count graph
    time: 15 minutes a day for a week
    materials: Paper, a window, crayons
    covers: [K2.1, S2.2]
    steps:
      - Each day, count the birds you see in five minutes.
      - Colour one square for each bird, in a column for that day.
      - At the end of the week, ask which day had the most.
questions:
  - What is this whole page mostly about?
  - Which facts help prove the main idea?
  - Do these steps go in a line or in a circle?
  - How are these two things alike? How are they different?
  - What does this map or graph tell you that the words don’t?
misconceptions:
  - thought: '"The main idea is the first fact I read."'
    why: The first sentence is often the main idea, but not always.
    tryThis: 'Ask: "What are **all** the sentences about?"'
  - thought: '"Pictures are only there to look nice."'
    why: Picture books for younger children use pictures that way.
    tryThis: Cover a caption or graph and ask what fact is now missing.
lookFor:
  - They find the main idea and some supporting details.
  - They tell steps in a line from a cycle.
  - They say how two things are alike and different.
  - They use a map, graph or contents page to find a fact.
adapt:
  support:
    - Use the frame "This is mostly about ___."
    - Start with cycles your child knows, such as the days of the week.
  access:
    - need: reading
      tip: Read the moose sentences aloud, and let your child tap the parts.
    - need: hands
      tip: Your child can point to a card and tell you which bin it goes in.
    - need: language
      tip: Show a real map and a real graph as you name each one.
  stretch:
    - Make a one-page fact sheet about an animal, with a picture, a caption and a map of where it lives.
    - Compare two animals in a three-column chart. Frog only, both, toad only.
together:
  - problem: d2
    how: Read the main text first. Ask, "Does it say which day?" Then look at the graph together.
  - problem: b1
    how: Read each sentence and ask, "Is this about building?"
