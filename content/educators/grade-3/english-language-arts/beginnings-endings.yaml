id: beginnings-endings
subject: english-language-arts
why: A child learns that writers choose how to start, how characters talk and how to finish, so readers stay hooked.
hook:
  title: First-line test
  time: 5 minutes
  covers: [S2.5]
  body: |-
    Read the first lines of three books from your shelf.

    1. Your child picks the one they most want to keep reading.
    2. Ask: "What did the writer do to hook you?"
activities:
  - title: Comic to dialogue
    time: 15 minutes
    materials: A comic strip and paper
    covers: [K2.7, S2.7]
    steps:
      - Read a comic together. Point out the speech bubbles.
      - Your child rewrites one panel as sentences with quotation marks.
  - title: Two endings
    time: 10 minutes
    materials: A short story you read together
    covers: [S2.9]
    steps:
      - Your child tells a new ending that ties everything up.
      - Then they tell one that leaves you wondering. Which do they like better?
questions:
  - How could you start so a reader wants more?
  - What would that character say, in their own words?
  - How would an exclamation mark change that sentence?
  - Does your ending tie it up, or leave us wondering?
  - How will you share it?
misconceptions:
  - thought: '"Every story starts with One day."'
    why: Many early stories do.
    tryThis: Collect first lines from books, and sort them by the kind of hook.
  - thought: '"The more exclamation marks, the better."'
    why: They look exciting.
    tryThis: Read a page full of them aloud. Talk about saving them for big moments.
lookFor:
  - They write a beginning that hooks.
  - They turn telling into dialogue.
  - They choose punctuation for an effect.
  - They write an ending that ties up or leaves readers wondering.
adapt:
  support:
    - Give a choice of hooks, such as a sound or a question, to start from.
    - Act out a conversation, then write down what was said.
  access:
    - need: writing
      tip: Your child can say the beginning or ending while you write it.
    - need: language
      tip: Try dialogue in your home language first. Talk about how people speak.
    - need: attention
      tip: Work on just one part, the beginning or the ending, at a time.
  stretch:
    - Write one story with two different endings.
    - Make a short class book, with a title page, pictures and captions.
together:
  - problem: d2
    how: Brainstorm three hooks out loud, a sound, a question and dialogue, then pick one.
  - problem: d1
    how: Ask, "How would you feel if your favourite movie ended with 'It was all a dream'?"
