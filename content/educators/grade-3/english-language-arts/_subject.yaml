subject: english-language-arts
promise: |-
  We hope your child finds out that words are fun to play with, and that stories and facts are worth hunting for.

  - A machine can read words out loud.
  - Wondering what a story means, and having their own thing to say, is still up to them.
shifts:
  - instead: Asking, "Did you read it?"
    tryThis: 'Asking, "What made you think that? Show me where it says so."'
  - instead: Teaching a rule, then doing a worksheet.
    tryThis: Playing with one real sentence. Swap a word or move a comma, then ask what changed.
  - instead: Fixing every mistake in their writing.
    tryThis: Enjoying what they said first. Then fix one thing, the one that helps a reader most.
  - instead: Choosing all their books for them.
    tryThis: Letting them choose often, including comics, joke books and fact books.
  - instead: Long practice sessions.
    tryThis: Ten short, happy minutes, most days. Stop while it is still fun.
routines:
  - name: What makes you say that?
    time: 3 minutes
    how: When your child says something about a book or a show, ask this one question with real curiosity.
  - name: Read it like an actor
    time: 5 minutes
    how: |-
      1. Pick one line someone says in a story.
      2. Read it three ways: happy, grumpy and scared.
      3. Ask which way fits the story.
  - name: Word of the day
    time: 3 minutes
    how: Pick one fun word from a sign or a book. Clap its syllables, find its parts, and use it at dinner.
  - name: Two-line story
    time: 5 minutes
    how: Take turns making up a two-sentence story. Add a rule, such as it must have a simile, or end with a question.
assess:
  - They point to a word or a picture when they explain an idea.
  - They read aloud with pauses and expression that fit the meaning.
  - They change their own writing to help a reader.
  - They use word parts and sound patterns to work out new words.
sources:
  - label: 'Alberta Education: English Language Arts and Literature K–6 curriculum'
    url: https://curriculum.learnalberta.ca/curriculum/en/s/laneng
  - label: 'Reading Rockets: phonics and decoding'
    url: https://www.readingrockets.org/topics/phonics-and-decoding
  - label: 'Reading Rockets: fluency'
    url: https://www.readingrockets.org/topics/fluency
  - label: 'Achieve the Core: guide to creating text-dependent questions'
    url: https://achievethecore.org/file/353
