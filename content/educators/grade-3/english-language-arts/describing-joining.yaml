id: describing-joining
subject: english-language-arts
why: A child learns the small words that describe, show who owns what, tell where or when, and join ideas.
hook:
  title: Hide the toy
  time: 5 minutes
  covers: [K2.10, S2.9]
  body: |-
    Hide a toy somewhere in the room.

    1. Your child asks yes-or-no questions, like "Is it under the couch?"
    2. Swap. Point out the words *under*, *on*, *beside* and *behind*.
activities:
  - title: Describe it, act it
    time: 10 minutes
    materials: None
    covers: [K2.6, K2.7, S2.5, S2.6]
    steps:
      - Your child adds an adjective to a noun, like *a grumpy bear*.
      - You add an adverb, like *stomped loudly*. Act the whole sentence out together.
  - title: Join the cards
    time: 10 minutes
    materials: Index cards
    covers: [K2.5, S2.4]
    steps:
      - Write *and*, *but*, *or*, *so* and *for* on cards.
      - Say two short sentences. Your child picks a card that joins them.
questions:
  - What word tells what it looks like?
  - How did it move?
  - Whose is it? How can you tell?
  - Does that word tell where, or when?
  - Which joining word fits best?
misconceptions:
  - thought: '"*His* and *hers* need an apostrophe."'
    why: Possessive nouns, like *Sam’s*, have one.
    tryThis: Write *his*, *hers*, *ours* and *theirs*. None of them has an apostrophe.
  - thought: '"Every word ending in -ly is an adverb."'
    why: Many adverbs end in -ly.
    tryThis: Try *friendly* and *lovely*. They describe nouns, as in *a friendly dog*.
lookFor:
  - They add adjectives and adverbs to make a sentence clearer.
  - They tell possessive nouns, adjectives and pronouns apart.
  - They use prepositions to tell where or when.
  - They join two ideas with a conjunction that fits.
adapt:
  support:
    - Ask "What kind?" for adjectives and "How?" for adverbs.
    - Move a real toy as you say each preposition.
  access:
    - need: reading
      tip: Say the sentences aloud. Your child points to the describing word.
    - need: language
      tip: Compare where describing words go in your home language and in English.
    - need: attention
      tip: Try one kind of word per day.
  stretch:
    - Write a short treasure-hunt clue, using three prepositions.
    - Add an adjective and an adverb to every sentence on one page of a story.
together:
  - problem: d2
    how: Walk a toy dog around the room first. Say where it goes, and how.
  - problem: d1
    how: Read the sentence aloud three times, once with each word. Which one makes sense?
