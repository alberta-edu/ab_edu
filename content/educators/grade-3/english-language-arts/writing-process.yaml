id: writing-process
subject: english-language-arts
why: A child learns that writing happens in stages, so they can get ideas down first and make them better later.
hook:
  title: The never-ending sentence
  time: 5 minutes
  covers: [K1.6, S1.4]
  body: |-
    Tell about your day in one breathless sentence: "and then… and then… and then…"

    1. Ask: "Was that easy to follow?"
    2. Retell it with stops, and talk about the difference.
activities:
  - title: One piece, five stages
    time: 3 short sessions
    materials: Paper, pencils and crayons
    covers: [K1.1, S1.7, S1.8]
    steps:
      - Plan and draft a short story one day. Revise it the next day, and edit and share it on the third.
      - Keep every version, so your child sees how it grew.
  - title: Read it to a pet
    time: 5 minutes
    materials: Your child’s writing
    covers: [S1.9, K1.10]
    steps:
      - Your child reads their writing aloud to a pet or a toy.
      - Wherever they stumble, they mark the spot and fix it.
questions:
  - Who will read this, and why are you writing it?
  - Where should this sentence stop?
  - Which words did you say more than once?
  - Is every sentence about the same idea?
  - How does it sound when you read it aloud?
misconceptions:
  - thought: '"Revising means fixing spelling."'
    why: Children often mix up revising and editing.
    tryThis: Revise ideas first, with a green pencil. Edit spelling after, with a red one.
  - thought: '"A good writer gets it right the first time."'
    why: Children rarely see an adult’s drafts.
    tryThis: Show a messy draft of something you wrote, like a list or an email.
lookFor:
  - They plan with a sketch or a web.
  - They break run-ons into sentences.
  - They write three to five sentences about one idea, in order.
  - They read their writing aloud and fix what sounds bumpy.
adapt:
  support:
    - Let your child say the sentences while you write the draft.
    - Use the words First, Next, Then and Last.
  access:
    - need: writing
      tip: Your child can type, or draw with labels, instead of handwriting.
    - need: language
      tip: Plan in your home language, then write in English.
    - need: attention
      tip: Do one stage a day. Short sessions work best.
  stretch:
    - Write the same story twice, for two different readers.
    - Add a picture and a title when sharing, to fit the purpose.
together:
  - problem: d2
    how: Talk about the place first. Your child names three things to do there before writing.
  - problem: d1
    how: Read the run-on aloud together, and clap where you take a breath.
