id: area-rectangles
subject: math
why: |-
  Multiplying length by width is not a magic rule. It is a quick way to count rows of squares, and a child who sees the rows can always rebuild the rule.
hook:
  title: The paint roller
  time: 5 minutes
  covers: [U1.2, S1.1]
  body: |-
    1. Hold a ruler flat on a table and slide it slowly toward you.
    2. Ask: "If the ruler left paint behind, what shape would it paint?"
    3. Ask: **"How could we tell how much paint it used?"**
activities:
  - title: Rows and columns
    time: 15 minutes
    materials: Centimetre grid paper, coloured pencils
    covers: [S1.6, S1.7, U1.5]
    steps:
      - Draw three rectangles on grid paper. Colour the first row of each, then count the rows.
      - Write each area as a multiplication, such as 4 rows of 6 is 4 × 6 = 24 cm². Check one by counting every square.
  - title: Measure and multiply
    time: 15 minutes
    materials: A ruler, small flat rectangles such as cards, sticky notes and photos
    covers: [S1.7, S1.8, K1.4]
    steps:
      - Measure the sides of each object to the nearest centimetre. Multiply to find the area.
      - Order the objects from smallest to largest area. Did any surprise you?
  - title: Same area, new shape
    time: 10 minutes
    materials: 24 square tiles or paper squares
    covers: [U1.5, S1.6]
    steps:
      - Make as many different rectangles as you can with all 24 squares.
      - Write each as a multiplication. Talk about why they all have the same area.
questions:
  - How many rows are there? How many squares in each row?
  - Why do we multiply instead of add?
  - If the rectangle were one row taller, how much would the area grow?
  - If you know the area and one side, how can you find the other side?
  - What shape would a sliding ruler paint? How much?
misconceptions:
  - thought: '"Area is length plus width."'
    why: Both numbers are on the picture, and adding is the first thing they try.
    tryThis: Draw the squares inside. Count them, then compare with the sum.
  - thought: '"Area is the same as perimeter."'
    why: Both are measured on the same rectangle, often in the same lesson.
    tryThis: Trace the edge with a finger for perimeter, and colour the inside for area. One is a length, the other is squares.
  - thought: '"Different-looking rectangles must have different areas."'
    why: Long, thin shapes and squarish shapes look very different.
    tryThis: Build a 2 by 12 and a 4 by 6 from the same 24 tiles.
lookFor:
  - They describe a rectangle as rows of square units before multiplying.
  - They write the area in square units, such as cm².
  - They work backwards from an area and one side to the other side.
  - They break a harder shape into rectangles, or take one rectangle away from another.
adapt:
  support:
    - Start by counting squares on grid paper, then count rows, then multiply.
    - Use rectangles with sides up to 10 cm first.
    - Keep a multiplication chart nearby so facts don’t slow down the thinking.
  access:
    - need: reading
      tip: Draw every story problem as a rectangle with the side lengths written on it.
    - need: attention
      tip: Use the sweep tool on the lesson page. Watching the rows appear one at a time keeps the idea concrete.
    - need: worry
      tip: Counting squares is always allowed. Multiplying is a faster way, not the only right way.
    - need: hands
      tip: The sweep tool on the lesson page builds rectangles with sliders, so no drawing is needed.
  stretch:
    - Find all the rectangles with whole-centimetre sides that have an area of 36 cm².
    - Find the area of an L-shaped figure by splitting it into two rectangles.
together:
  - problem: b4
    how: Ask your child to draw Jae’s rectangle on grid paper. Count the squares inside and compare with 22.
  - problem: d2
    how: Use 24 tiles or paper squares. Build every rectangle you can, and write each one as a multiplication.
