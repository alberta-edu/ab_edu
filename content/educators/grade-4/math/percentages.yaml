id: percentages
subject: math
why: |-
  Percentages are everywhere a child looks, from battery icons to juice boxes. Knowing that percent just means "out of 100" turns a mysterious symbol into hundredths they already understand.
hook:
  title: Battery check
  time: 5 minutes
  covers: [S1.1, K1.4]
  body: |-
    1. Show the battery icon on a phone, tablet or laptop.
    2. Ask: "What does that number mean? What would 100% look like? What about 1%?"
    3. Ask: **"If the battery shows 50%, how much of a full charge is that?"**
activities:
  - title: Percent hunt
    time: 15 minutes
    materials: Food labels, flyers, a device with a battery icon, paper
    covers: [S1.1, K1.1]
    steps:
      - Hunt around the house for the % sign. Write down five places you find it.
      - For each one, say what it is out of 100, and whether it is more or less than half.
  - title: Hundred grid colouring
    time: 10 minutes
    materials: Grid paper, coloured pencils
    covers: [S1.3, U1.1, K1.2, K1.3]
    steps:
      - Draw a 10 by 10 square. Colour some squares in each of three colours.
      - Write each colour three ways, as a fraction out of 100, a decimal and a percent.
      - Check that the three percentages add to 100%.
  - title: Percent war
    time: 10 minutes
    materials: Index cards with percents, decimals and fractions
    covers: [S1.2, S1.3]
    steps:
      - Write cards such as 40%, 0.45, 1/2, 9% and 0.09. Shuffle and deal them out.
      - Both players flip a card. The greater amount wins, but first say it as a percent.
questions:
  - What does this percentage mean? Out of how many?
  - Is this more or less than half? How do you know?
  - How would you write this percent as a decimal? As a fraction?
  - Why is 0.5 the same as 50%, not 5%?
  - Which is more, 0.4 or 45%? What did you do to decide?
misconceptions:
  - thought: '"0.5 is 5%."'
    why: They copy the digit and add a % sign, without thinking about hundredths.
    tryThis: Shade 0.5 of a hundred grid, which is 5 full columns. Count the squares together.
  - thought: '"45% and 54% are about the same, because they use the same digits."'
    why: They are looking at the digits, not at the place each digit is in.
    tryThis: Shade both on a hundred grid. 45 squares is less than half, and 54 squares is more than half.
  - thought: '"More rings means a better score."'
    why: Counting is how most games are won, so comparing counts feels natural.
    tryThis: Compare 7 out of 10 with 8 out of 20. Write both out of 100 before deciding.
lookFor:
  - They explain a percent as "out of 100" without being reminded.
  - They switch between fraction, decimal and percent for the same part.
  - They compare a decimal with a percent by writing both the same way.
  - They notice percents in daily life and say what they mean.
adapt:
  support:
    - Start with the hundred grid. Each square is 1%, so any percent can be counted.
    - Use benchmarks first, 100%, 50%, 25% and 10%, before other numbers.
    - Connect to money, where 1 cent is 1% of a dollar.
  access:
    - need: reading
      tip: Read % aloud as "out of 100" for a while, before using the word "percent".
    - need: language
      tip: '"Per cent" means "for each hundred". In French, it is "pour cent".'
    - need: worry
      tip: Use real objects like battery icons. Children already know what a nearly empty battery looks like.
    - need: hands
      tip: The hundred grid on the lesson page shades squares with buttons, so no colouring is needed.
  stretch:
    - Make a flag on a 100-square grid where red, white and blue are given as a fraction, a decimal and a percent.
    - Write 1/5, 2/5 and 4/5 as percentages, using equivalent fractions out of 100.
together:
  - problem: b3
    how: Shade 0.5 of a hundred grid together, then count the squares. Ask how Raj could check his own rule next time.
  - problem: d1
    how: Ask who your child thinks won before any math. Then turn each score into a percent and see if the winner changes.
