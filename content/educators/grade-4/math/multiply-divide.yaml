id: multiply-divide
subject: math
why: |-
  Facts that come quickly free a child’s mind for the interesting part of a problem. Choosing a strategy that fits the numbers is real mathematical thinking, not a shortcut.
hook:
  title: The quick-way race
  time: 5 minutes
  covers: [U1.1, S1.3]
  body: |-
    1. Write \(199 \times 4\) and \(4 \times 200\) side by side.
    2. Ask your child which one they could do in their head, and how close the two answers are.
    3. Ask: **"Can the easy one help with the hard one?"** Let them find the 4 to take away.
activities:
  - title: Fact family cards
    time: 10 minutes
    materials: Index cards or paper slips, a pencil
    covers: [S1.1, K1.1]
    steps:
      - Write a product to 144 on one side of a card, such as 84. Your child names a fact that makes it.
      - Turn it into a whole family, such as 7 × 12, 12 × 7, 84 ÷ 7 and 84 ÷ 12. Keep the 11s and 12s in the deck.
  - title: Zeros on the move
    time: 10 minutes
    materials: Paper with place value columns, digit cards
    covers: [S1.2]
    steps:
      - Make a number like 36. Multiply by 10, 100 and 1 000 by sliding the cards left, not by adding zeros.
      - Then divide 3 600 by 10 and by 100. Ask what stays the same each time.
  - title: Pack the bags
    time: 15 minutes
    materials: A bag of dried beans or pasta, small cups
    covers: [S1.6, S1.9, S1.8]
    steps:
      - Count out about 150 beans. Ask how many cups of 8 you could fill, and estimate first.
      - Share them out to check. Write the division with its remainder, and talk about what the leftovers mean.
questions:
  - Which strategy fits these numbers best? Why?
  - What is an easy number close to this one? How does it help?
  - What happens to the digits when you multiply by 100?
  - What does the remainder mean in this story?
  - About how big should the answer be? How do you know?
misconceptions:
  - thought: '"6 × 1 000 is 1 006, because times 1 000 makes it 1 000 bigger."'
    why: They mix up "1 000 times as much" with "1 000 more", which sound alike.
    tryThis: Show 6 groups of 1 000 with paper "thousand" slips. Count them, then compare with 6 and 1 000 more.
  - thought: '"The remainder can be bigger than the number I divided by."'
    why: They stop sharing too early, before checking whether another full group fits.
    tryThis: Ask, "Could each group get one more?" If the leftovers are enough for another round, keep sharing.
  - thought: '"In 347 × 6, I multiply 3 × 6, 4 × 6 and 7 × 6 and write them side by side."'
    why: They forget that the 3 is worth 300 and the 4 is worth 40, so the carries go missing.
    tryThis: Draw the area model. Split 347 into 300, 40 and 7, and find each part before adding.
lookFor:
  - They recall facts with factors to 12 quickly, or use a fact they know to build one they don’t.
  - They choose different strategies for 199 × 4 and 347 × 6, and say why.
  - They check a division by multiplying back and adding the remainder.
  - They estimate first, and notice when an answer is far from the estimate.
adapt:
  support:
    - Use the area model with base-ten blocks or drawings before the standard algorithm.
    - Practise facts in families, so one fact gives four.
    - Keep a 12 by 12 multiplication chart nearby for longer problems, so facts don’t block the thinking.
  access:
    - need: reading
      tip: Read story problems aloud, and act them out with objects before choosing an operation.
    - need: attention
      tip: Practise facts in short bursts of a few minutes, a little each day, instead of one long session.
    - need: worry
      tip: Timed fact drills can make children anxious. Use games without a clock, and count what they know, not what they missed.
    - need: hands
      tip: The column calculator on the lesson page writes each step, so your child can focus on saying what happens.
  stretch:
    - Find every 3-digit number that leaves a remainder of 1 when divided by 2, 3 and 4. Start small and look for a pattern.
    - Invent a story where the remainder means you need one more, such as one more bus or one more box.
together:
  - problem: b3
    how: Ask for an estimate first, then a quick way. Compare the quick way with the algorithm and ask which your child would use and when.
  - problem: d1
    how: Ask what day your child’s own birthday fell on last year and this year. Then use the division to explain why it moved.
