id: measuring-angles
subject: math
why: |-
  Angles measure turning, which children feel every time they spin, steer or open a door. Degrees give that feeling a number, and benchmarks let them check it.
hook:
  title: Human clock hand
  time: 5 minutes
  covers: [S1.3, U1.1]
  body: |-
    1. Stand up and face a wall. Turn a quarter turn, then a half turn, then a full turn.
    2. Ask: "How many quarter turns make a full turn?"
    3. Say that a full turn is 360 tiny steps called degrees. Ask: **"How many degrees is a quarter turn?"**
activities:
  - title: Paper protractor
    time: 15 minutes
    materials: A paper plate or circle of paper, a ruler, a pencil
    covers: [K1.1, S1.3, U1.2]
    steps:
      - Fold the circle in half, then in quarters, then in eighths. Unfold it and draw along the folds.
      - Label the folds 0°, 45°, 90°, 135° and so on around to 360°. Use it to check angles around the house.
  - title: Angle hunt
    time: 15 minutes
    materials: A protractor, paper
    covers: [S1.1, S1.2, K1.2]
    steps:
      - Find five angles at home, such as an open book, scissors or a door. Estimate each one first.
      - Measure with the protractor and name it as acute, right, obtuse or straight. Was the estimate close?
  - title: Guess my angle
    time: 10 minutes
    materials: Two pencils or straws, a protractor
    covers: [K1.3, S1.4]
    steps:
      - One person makes an angle with two pencils. The other estimates, using 45°, 90° or 180° to compare.
      - Measure it together. Score a point for an estimate within 10°, then swap.
questions:
  - Is this angle more or less than a right angle? How can you tell without measuring?
  - Which benchmark is it closest to?
  - Which scale on the protractor should you read? How do you know?
  - What fraction of a full turn is this angle?
  - If the arms were longer, would the angle change?
misconceptions:
  - thought: '"Longer arms make a bigger angle."'
    why: A drawing with longer arms takes up more space, so it looks bigger.
    tryThis: Draw two angles with the same opening and different arm lengths. Measure both with a protractor.
  - thought: '"This angle is 130°," for an acute angle.'
    why: Protractors have two scales, and it is easy to read the wrong one.
    tryThis: Decide first whether the angle is acute or obtuse. Then choose the number that fits.
  - thought: '"Angles only go up to 180°."'
    why: Most protractors are half circles and stop at 180°.
    tryThis: Turn your body three quarter turns, or watch the minute hand go from 12 to 9. That turn is 270°.
lookFor:
  - They estimate before measuring and compare the estimate with the measure.
  - They place the protractor centre on the vertex and line one arm up with 0.
  - They name angles as acute, right, obtuse or straight without counting degrees.
  - They link 90°, 180°, 270° and 360° to quarter, half, three-quarter and full turns.
adapt:
  support:
    - Start with turns of the body before any protractor.
    - Use the corner of a page as a right angle tester before measuring in degrees.
    - Begin with angles that are multiples of 10°.
  access:
    - need: reading
      tip: Say angle names with a gesture, such as arms close together for acute and wide apart for obtuse.
    - need: attention
      tip: Turn the angle hunt into a short race. Find three angles of each kind in five minutes.
    - need: worry
      tip: Estimates don’t have to be exact. Praise any estimate that names the right benchmark.
    - need: hands
      tip: A paper protractor is easier to hold than a plastic one, and the angle turner on the lesson page needs only a slider.
  stretch:
    - Find two angles in the classroom or kitchen that together make a straight angle.
    - Estimate the angle between the hands of a clock at 2:00, then check it is 60°.
together:
  - problem: w3
    how: Ask whether the angle is acute or obtuse before reading any number. Let that decide which scale to trust.
  - problem: d1
    how: Act out the robot. Turn on the spot by quarter turns and then by half of a quarter turn, counting as you go.
