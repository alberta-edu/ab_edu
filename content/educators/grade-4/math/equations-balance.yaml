id: equations-balance
subject: math
why: |-
  An equal sign means "both sides are the same", not "the answer comes next". A balance makes that idea something children can see and feel, and it turns solving into fair moves.
hook:
  title: The coat hanger balance
  time: 5 minutes
  covers: [S2.2, K2.1]
  body: |-
    1. Hang two paper cups from the ends of a coat hanger. Put 5 coins in each.
    2. Ask: "How can we add coins and keep it level?"
    3. Then add coins to one cup only. Ask: **"What would you have to do to the other cup?"**
activities:
  - title: Fair moves
    time: 10 minutes
    materials: A coat hanger balance or a toy balance, coins or blocks, paper
    covers: [S2.2, S2.3, K2.1]
    steps:
      - Write an equation with no unknown, such as 6 + 2 = 8, and build it on the balance.
      - Take turns making a "fair move" to both sides, writing the new equation each time. Check that it stays level.
  - title: Mystery bag
    time: 10 minutes
    materials: A paper bag, coins or blocks, the balance
    covers: [S2.4, U2.1]
    steps:
      - Secretly put some coins in the bag. Put the bag and 4 loose coins on one side, and enough coins on the other to balance.
      - Your child writes the equation, then takes the same number of coins off both sides to find what is in the bag.
  - title: Story to equation
    time: 10 minutes
    materials: Paper, a pencil
    covers: [S2.1, S2.5]
    steps:
      - Tell a short story with a missing number, such as "I had some apples, ate 3, and now have 9."
      - Your child writes the equation with a □, solves it, and checks the answer in the story.
questions:
  - Is this balance level? How do you know without counting?
  - What could you do to both sides and keep it fair?
  - What does the □ stand for here?
  - How can you check that your answer is right?
  - Which equation fits this story? Why not the others?
misconceptions:
  - thought: '"The equal sign means the answer comes next."'
    why: Most equations they have seen end with = and an answer, like 3 + 4 = 7.
    tryThis: Write 7 = 3 + 4 and 3 + 4 = 5 + 2. Ask whether each is true, and build them on a balance.
  - thought: '"To solve □ − 7 = 12, subtract 7."'
    why: They copy the operation they see, instead of undoing it.
    tryThis: Put their answer back into the equation. When it doesn’t work, ask what would undo taking 7 away.
  - thought: '"I can change just one side, as long as I am careful."'
    why: They are focused on getting the box alone, not on keeping both sides equal.
    tryThis: Show a real balance tipping when only one side changes. Fair moves must happen to both sides.
lookFor:
  - They describe the equal sign as "the same as".
  - They do the same operation to both sides, and say why.
  - They check an answer by putting it back into the equation.
  - They write an equation for a story before solving it.
adapt:
  support:
    - Use a real balance with objects before writing equations.
    - Start with adding and subtracting, then move to multiplying and dividing.
    - Use small numbers so the moves are easy to see.
  access:
    - need: reading
      tip: Read story problems aloud and act them out with objects. Then write the equation together.
    - need: language
      tip: Say "is the same as" for the equal sign until the idea is solid.
    - need: worry
      tip: Checking is built in. Putting the answer back in the box shows whether it works, without anyone saying "wrong".
    - need: hands
      tip: The balance on the lesson page makes each move with one tap, so no small objects are needed.
  stretch:
    - Make two different equations that have the same unknown value, one with adding and one with multiplying.
    - Write a story for the equation □ ÷ 4 = 6, then solve it.
together:
  - problem: b3
    how: Ask your child to check Zoe’s answer by putting 5 back in the box. Then talk about what would undo taking away 7.
  - problem: d1
    how: Draw the three balances on paper. Solve one at a time, and write each result on the drawing before moving on.
