id: triangles-quadrilaterals
subject: math
why: |-
  Sorting shapes by what can be measured, not by how they look, is how mathematicians think. A shape can belong to several families at once, and that is a big idea for a nine-year-old.
hook:
  title: Is a square a rectangle?
  time: 5 minutes
  covers: [U1.2, S1.6]
  body: |-
    1. Draw a square and a long rectangle side by side.
    2. Ask: **"Is the square a rectangle?"** Let your child argue either way.
    3. Ask what a shape needs to be a rectangle. Leave the question open for now.
activities:
  - title: Straw triangles
    time: 15 minutes
    materials: Straws cut to a few lengths, tape or pipe cleaners, a protractor
    covers: [S1.4, S1.5, K1.5, K1.6]
    steps:
      - Build triangles from the straw pieces. Try to make one of each kind by sides.
      - Measure the angles with a protractor. Name each triangle by its sides and by its angles.
      - Try to build a right equilateral triangle. Talk about why it can’t be done.
  - title: Shape family tree
    time: 15 minutes
    materials: Paper, scissors, a ruler, a set square or a corner of paper
    covers: [S1.1, S1.6, U1.2]
    steps:
      - Cut out a square, a rectangle, a rhombus, a parallelogram and a trapezoid.
      - Test each one for parallel sides, equal sides and right angles. Write what you find on the shape.
      - Arrange them in a family tree on the table, with the most general shape at the top.
  - title: Turn and flip test
    time: 10 minutes
    materials: Tracing paper, the paper shapes
    covers: [S2.2, K2.2]
    steps:
      - Trace a shape. Turn the tracing a half turn and see if it lands on the shape.
      - Flip the tracing over and try again. Write down which sides matched each time.
questions:
  - How do you know these sides are parallel? How could you check?
  - What does this shape need to belong to that family?
  - Can a shape be in two families at once? Give an example.
  - Can you make a triangle that is right and isosceles? Right and equilateral?
  - What did turning the copy prove about the sides?
misconceptions:
  - thought: '"A square isn’t a rectangle."'
    why: In everyday talk, "rectangle" means a long shape, and squares get their own name.
    tryThis: List what a rectangle needs, then test the square against the list. Families are about properties, not looks.
  - thought: '"A shape turned on its corner becomes a different shape."'
    why: Squares are usually drawn flat. A tilted square looks like a "diamond".
    tryThis: Turn a paper square slowly in your hands. Ask what changed about its sides and angles.
  - thought: '"Any shape with parallel sides is a parallelogram."'
    why: The word parallelogram starts with "parallel", so any parallel sides seem enough.
    tryThis: Hold up a trapezoid and count the pairs of parallel sides. A parallelogram needs two pairs.
lookFor:
  - They check properties by measuring or testing, not by how a shape looks.
  - They name a triangle in two ways, by sides and by angles.
  - They explain why a square belongs to the rectangle, rhombus and parallelogram families.
  - They use a turn or flip of a tracing to show which sides are equal.
adapt:
  support:
    - Use paper cut-outs so shapes can be turned, flipped and measured by hand.
    - Start with triangles by sides only, then add angles.
    - Keep a corner of paper handy as a right angle tester.
  access:
    - need: reading
      tip: Make picture cards for each shape name, with the key property drawn on, such as arrows for parallel sides.
    - need: language
      tip: Many shape words come from Greek and Latin. "Tri" means three, "quad" means four, and "lateral" means side.
    - need: worry
      tip: The "is a square a rectangle?" debate has a surprising answer, so being "wrong" at first is normal and interesting.
    - need: hands
      tip: The shape explorer on the lesson page turns and flips copies with one tap, so no cutting is needed.
  stretch:
    - Find a quadrilateral with exactly 2 right angles. Which family is it in?
    - Can a trapezoid be turned or flipped onto itself? Try a few and see when it works.
together:
  - problem: b1
    how: Let your child argue Mila’s side first. Then list what a rectangle needs and test a square against it together.
  - problem: d1
    how: Play the clue game with real shapes on the table. Remove the shapes each clue rules out.
