id: factors-primes
subject: math
why: |-
  Numbers have a shape. Some can be arranged many ways and some only one way, and noticing that is the start of thinking about how numbers are built.
hook:
  title: The stubborn number
  time: 5 minutes
  covers: [K1.3, S1.1]
  body: |-
    1. Hand your child 12 coins or buttons and ask them to arrange all of them in a rectangle.
    2. Ask for a different rectangle, then another.
    3. Now hand over 7 and ask for a rectangle that isn’t one long row. **"Why won’t 7 cooperate?"**
activities:
  - title: Rectangle hunt
    time: 15 minutes
    materials: 30 small objects such as buttons or cereal pieces, paper
    covers: [S1.1, S1.2, K1.3, K1.4]
    steps:
      - For each number from 2 to 20, find every rectangle the objects can make. Record the side lengths.
      - Circle the numbers that make only one row. Ask what those numbers have in common.
  - title: Factor bingo
    time: 10 minutes
    materials: Paper, a pencil, two dice
    covers: [K1.1, S1.1]
    steps:
      - Each player writes nine numbers from 1 to 12 in a 3 by 3 grid. Roll two dice and multiply them.
      - Cross off any number on your grid that is a factor of the product. Three in a row wins.
  - title: Party bags
    time: 10 minutes
    materials: Two kinds of small treats or pretend treats
    covers: [S1.4, U1.2]
    steps:
      - Start with 12 of one treat and 18 of another. Make identical bags using everything.
      - Try different numbers of bags, then find the most bags possible. Ask why that number works for both.
questions:
  - How many different rectangles can this number make? How do you know you found them all?
  - Is this number prime or composite? What would convince you?
  - If 6 is a factor of 24, what else do you know?
  - What factors do these two numbers share? Which is the biggest?
  - Why don’t 0 and 1 belong with the primes or the composites?
misconceptions:
  - thought: '"All odd numbers are prime."'
    why: Many small primes are odd, and every even number after 2 is composite, so the pattern feels true.
    tryThis: Build 9, 15 and 21 as rectangles with objects. Ask whether they make more than one row.
  - thought: '"1 is prime, because only 1 and itself divide it."'
    why: The rule "divisible by 1 and itself" seems to fit 1, since 1 and itself are the same number.
    tryThis: Ask how many different factors 1 has. Compare it with 7, which has exactly two.
  - thought: '"Factors and multiples are the same thing."'
    why: Both words come up with multiplication facts, often in the same lesson.
    tryThis: Use "factors fit into a number" and "multiples come out of skip counting". 4 fits into 12, and 12 comes from skip counting by 4.
lookFor:
  - They find factors in pairs, and know they can stop once the pairs start repeating.
  - They test whether a number is prime by looking for a factor, not by whether it is odd.
  - They explain that 0 and 1 are neither prime nor composite.
  - They use a common factor to solve a sharing problem without being told which operation to use.
adapt:
  support:
    - Use real objects to build rectangles before writing any factor lists.
    - Keep a multiplication chart to 12 × 12 nearby for finding factor pairs.
    - Start with numbers under 30, then move up to 100.
  access:
    - need: reading
      tip: Say "factor" and "multiple" aloud with a gesture each, such as hands fitting together and hands moving apart.
    - need: attention
      tip: Make each number a quick round of rectangle building. One number, one discovery, then a break.
    - need: worry
      tip: Treat a number that "won’t cooperate" as a fun discovery, not a failure. Primes are the stubborn numbers.
    - need: hands
      tip: The factor lab on the lesson page builds the rectangles with one slider, so no small objects are needed.
  stretch:
    - Find a number under 50 that has exactly three factors. Then find another. What do they have in common?
    - Find the greatest common factor of two numbers you choose, without listing every factor.
together:
  - problem: b4
    how: Ask your child why Sam’s reasons sounded convincing. Then hunt for a factor together, trying one small number at a time.
  - problem: d1
    how: Use real objects for the stickers and pencils if you can. Try a few numbers of bags before looking for the greatest one.
