id: order-of-operations
subject: math
why: |-
  Math only works if everyone reads an expression the same way. The order of operations is that shared agreement, and it gives every expression exactly one value.
hook:
  title: Two answers, one question
  time: 5 minutes
  covers: [U1.2, K1.2]
  body: |-
    1. Write \(2 + 3 \times 4\) and ask two people to work it out without talking.
    2. If the answers differ, ask: **"Can one question have two right answers?"**
    3. Let your child suggest a rule that would make everyone agree.
activities:
  - title: Expression of the day
    time: 5 minutes
    materials: Paper, a pencil
    covers: [S1.2, U1.1]
    steps:
      - Pick today’s date number, such as 18. Write as many expressions for it as you can in five minutes.
      - Each expression must use at least two different operations. Check each one with the order of operations.
  - title: Dice expressions
    time: 10 minutes
    materials: Three dice, paper
    covers: [S1.1, K1.1, K1.2]
    steps:
      - Roll three dice. Put the numbers in any order with any two operations, such as 4 + 6 × 2.
      - Find the value. The player with the greatest value wins the round.
  - title: Calculator test
    time: 10 minutes
    materials: A basic calculator and a phone calculator, if you have them
    covers: [U1.2, K1.2]
    steps:
      - Type 5 + 3 × 4 = into each calculator. Do they agree?
      - Work it out on paper with the order of operations. Which calculator follows the rule?
questions:
  - Which operation do you do first? Why?
  - What would happen if you went left to right instead?
  - Can you write this number in another way?
  - Does this story need multiplying first, or adding first?
  - How could you check your value?
misconceptions:
  - thought: '"Always go left to right, like reading."'
    why: That is how they read words, and it works for expressions with only adding and subtracting.
    tryThis: Work out 3 + 4 × 2 both ways. Then act it out with 3 single coins and 4 pairs of coins.
  - thought: '"Multiply always comes before divide."'
    why: The rule is often said as "multiply and divide", so multiplying sounds like it comes first.
    tryThis: Work out 18 ÷ 3 × 2 both ways. Then say the rule as "multiply or divide, whichever comes first from the left".
  - thought: '"Add always comes before subtract."'
    why: The same reason. "Add and subtract" sounds like an order.
    tryThis: Try 10 − 3 + 2. Left to right gives 9. Adding first gives 5. Which matches taking 3 away, then getting 2 back?
lookFor:
  - They find every multiplication and division before doing anything else.
  - They go left to right when operations are in the same step.
  - They write more than one expression for the same number.
  - They connect a story to an expression, such as packs of stickers as multiplication.
adapt:
  support:
    - Start with two operations only, such as one multiplication and one addition.
    - Underline or circle the multiplication and division before starting.
    - Use objects, such as groups of coins, to show what multiplying first means.
  access:
    - need: reading
      tip: Read each expression aloud slowly, and point at each number and sign.
    - need: attention
      tip: Rewrite the expression after each step, so there is only one thing to do at a time.
    - need: worry
      tip: The expression game has many right answers. Praise every correct expression, not just the cleverest.
    - need: hands
      tip: The expression stepper on the lesson page does the rewriting, so your child can focus on choosing the next step.
  stretch:
    - Use the numbers 2, 3 and 4 with two operations to make as many different values as you can.
    - Find an expression with three different operations whose value is 0.
together:
  - problem: b1
    how: Ask your child why Leo’s way seemed sensible. Then work out what Leo would need to know to get it right.
  - problem: d1
    how: If you have a basic calculator, try Rory’s keys on it together. Then find the order that makes it agree with the rule.
