id: decimal-place-value
subject: math
why: |-
  A digit’s worth comes from its place, even after the decimal point. Children learn that decimals are not a new kind of number, just smaller and smaller places.
hook:
  title: The shrinking dollar
  time: 5 minutes
  covers: [K1.1, S1.10]
  body: |-
    1. Put a loonie, a dime and a few cents (or paper slips that say 1¢) on the table.
    2. Ask: "How many dimes make a dollar? How many cents make a dime?"
    3. Ask: **"What would come next, something 10 times smaller than a cent?"** Don’t settle it.
activities:
  - title: Dollar store prices
    time: 15 minutes
    materials: Flyers or receipts, paper, a pencil
    covers: [S1.4, S1.8, S1.10, K1.6]
    steps:
      - Cut out five prices under $10. Read each one aloud, saying "and" only at the point.
      - Write each price in cents, such as $3.05 is 305¢.
      - Line the prices up from least to greatest. Ask your child to explain one tricky pair.
  - title: Times-ten slide
    time: 10 minutes
    materials: A strip of paper with columns for thousands to hundredths, digit cards or sticky notes
    covers: [K1.2, S1.2]
    steps:
      - Write the place names across the strip and draw a big dot between ones and tenths.
      - Place digits to make 3.5. Ask what happens if the number becomes 10 times as big.
      - Slide every digit one column left together. Read the new number, then slide back for ÷ 10.
  - title: Round to win
    time: 10 minutes
    materials: Two dice, paper
    covers: [S1.7]
    steps:
      - Roll three times to make a number like 4.62. Round it to the nearest tenth and to the nearest one.
      - Score a point if the two rounded numbers end in the same digit, such as 4.7 and 5. Take turns.
questions:
  - What is this digit worth? How do you know?
  - What would 10 of these make? What would one-tenth of it be?
  - Is 3.4 or 3.38 more? How could you show me with money?
  - Where does the "and" go when you read this number?
  - When would you round a number like this, and to which place?
misconceptions:
  - thought: '"3.38 is bigger than 3.4, because 38 is bigger than 4."'
    why: For whole numbers, more digits always meant a bigger number. They are using a rule that used to work.
    tryThis: Write both with two places, 3.40 and 3.38, or show them as $3.40 and $3.38. Ask which costs more.
  - thought: '"Times 10 means add a zero, so 4.6 × 10 = 4.60."'
    why: Adding a zero worked for every whole number they have multiplied by 10.
    tryThis: Ask whether 4.60 is bigger than 4.6. Then slide the digits on a place value strip and see where they land.
  - thought: '"0.08 and 0.8 are the same, because the 0 doesn’t do anything."'
    why: They learned that a zero at the left of a whole number doesn’t change it, like 08 and 8.
    tryThis: Compare 8 cents and 80 cents, written as $0.08 and $0.80. The zero holds the tenths place open.
lookFor:
  - They say what a digit is worth, such as "7 tenths", not just which place it is in.
  - They read decimals with "and" at the point, and nowhere else.
  - They compare decimals place by place from the left, not by how long the numbers are.
  - They connect cents to hundredths of a dollar without being reminded.
adapt:
  support:
    - Start with money. Dollars, dimes and cents give tenths and hundredths a meaning.
    - Use only tenths at first, then add hundredths once tenths feel easy.
    - Keep a place value strip on the table while your child reads or writes a number.
  access:
    - need: reading
      tip: Read number words aloud together. Cover the number and reveal it one place at a time.
    - need: language
      tip: |-
        - "Tens" and "tenths" sound nearly the same. Write them side by side and stress the "th".
        - A child who learned in French may write a comma for the point. Both are right.
    - need: worry
      tip: Use real coins for comparing. Choosing which pile of money is bigger feels safe and familiar.
    - need: hands
      tip: Your child can say where each digit goes while you write it, or point on the place value strip.
  stretch:
    - Find a number that rounds to the same tenth and the same one, and another where the two roundings end in different digits.
    - Make the greatest and least numbers you can with the digits 3, 0, 7 and 5, using two places after the point.
together:
  - problem: b1
    how: Before working it out, ask your child whether 4.60 cm sounds right for a plant 10 times as tall. Let the size of a real plant argue with the rule.
  - problem: d2
    how: Take turns suggesting a number and checking both roundings out loud. Keep a list of the ones that work and look for what they share.
