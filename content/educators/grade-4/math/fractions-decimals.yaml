id: fractions-decimals
subject: math
why: |-
  Fractions and decimals are not two different topics. They are two ways of writing the same numbers, and switching between them makes both easier.
hook:
  title: Dimes and tenths
  time: 5 minutes
  covers: [K2.1, S2.2]
  body: |-
    1. Lay out 10 dimes and say, "Together these make one dollar."
    2. Slide 3 dimes away and ask: "What fraction of the dollar is this? How would a price tag write it?"
    3. Ask: **"Are 3/10 and $0.30 the same, or different?"**
activities:
  - title: Hundred grid art
    time: 15 minutes
    materials: Grid paper, coloured pencils
    covers: [K2.1, U2.1, S2.2]
    steps:
      - Draw a 10 by 10 square. Colour a simple picture using some of the squares.
      - For each colour, write how much of the grid it covers as a fraction out of 100 and as a decimal.
      - Ask which colours could also be written as tenths.
  - title: Number line clothesline
    time: 10 minutes
    materials: String, paper slips, clothespins
    covers: [S2.1, U2.2]
    steps:
      - Label the ends of the string 0 and 1. Write slips such as 0.3, 3/10, 0.75, 75/100, 0.5 and 5/10.
      - Hang each slip in its place. When two slips share a spot, clip them together and say why.
  - title: Change counter
    time: 10 minutes
    materials: Dimes and cents, or paper coins
    covers: [S2.2, K2.2]
    steps:
      - Grab a handful of dimes and cents under one dollar. Write the amount as a decimal of a dollar.
      - Then write it as a fraction out of 100, and as tenths if you can.
questions:
  - What is this decimal as a fraction? How did you choose the denominator?
  - Why is 0.09 so much smaller than 0.9?
  - Where would this fraction go on the number line? Where would its decimal go?
  - Can this number of hundredths also be written as tenths? How do you know?
  - Which is more, 0.4 or 35/100? What did you have to do first to compare them?
misconceptions:
  - thought: '"0.5 is 1/5, because there is a 5."'
    why: They read the digit as the denominator, without thinking about its place.
    tryThis: Shade 5 columns of a hundred grid. Ask what part of the whole that is, then compare it with 1/5.
  - thought: '"9/100 is 0.9."'
    why: They write the numerator after the point and forget that hundredths need two places.
    tryThis: Use money. 9 cents is $0.09, not $0.90.
  - thought: '"0.4 is less than 35/100, because 4 is less than 35."'
    why: They compare the digits they see, without writing both numbers the same way.
    tryThis: Write 0.4 as 0.40 and 40/100. Then both are hundredths and easy to compare.
lookFor:
  - They choose the denominator from the place of the last digit, not from the digits themselves.
  - They place a fraction and its decimal at the same point on a number line.
  - They rewrite numbers the same way before comparing them.
  - They connect tenths and hundredths to dimes and cents.
adapt:
  support:
    - Use money first. Dimes are tenths and cents are hundredths of a dollar.
    - Start with tenths only, then add hundredths.
    - Keep a hundred grid nearby to shade any amount before writing it.
  access:
    - need: reading
      tip: Read decimals as fractions out loud, such as "0.07 is seven hundredths". The words carry the denominator.
    - need: language
      tip: 'Children who learned in French may write 0,07. Both mean the same.'
    - need: worry
      tip: Let your child check every answer with the hundred grid on the lesson page. Seeing it match builds trust.
    - need: hands
      tip: The hundred grid on the lesson page shades squares with buttons, so no colouring is needed.
  stretch:
    - Find three fractions between 0.2 and 0.3, written as hundredths.
    - Write 1/2, 1/4 and 3/4 as hundredths, then as decimals.
together:
  - problem: b2
    how: Ask your child to show 0.5 on a hundred grid, then 1/5. Let the two pictures settle the argument.
  - problem: d1
    how: Draw the mosaic on grid paper and colour it as you go. Mo’s mistake becomes easy to see.
