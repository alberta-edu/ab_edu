id: graph-scale
subject: math
why: |-
  Graphs are everywhere, from the news to a class vote. Knowing that a symbol can stand for many things, and that the scale changes how a graph looks, helps children read graphs carefully and make honest ones of their own.
hook:
  title: Too many stickers
  time: 5 minutes
  covers: [K2.1, U2.1]
  body: |-
    1. Ask your child to draw one sticker for every person who lives on your street, or in your town.
    2. Watch them realize it would take forever.
    3. Ask: **"What if one sticker stood for 10 people? Or 100?"**
activities:
  - title: Family survey
    time: 20 minutes
    materials: Paper, a pencil, coloured pencils
    covers: [K1.1, S1.1, S2.2]
    steps:
      - Choose a question, such as "What is your favourite season?" Ask family and friends, and tally the answers.
      - Draw a pictograph with a key that fits the numbers. Then talk about what the graph tells you.
  - title: Same data, three graphs
    time: 15 minutes
    materials: The survey data, grid paper
    covers: [K2.2, S2.4, S2.5, U2.2]
    steps:
      - Show the same survey as a pictograph, a bar graph and a dot plot.
      - Ask which one is easiest to read and which one is the most fun. Which would you put on the fridge?
  - title: Scale switch
    time: 10 minutes
    materials: Grid paper
    covers: [S2.1, S2.3]
    steps:
      - Draw a bar graph of the counts 24, 18, 12 and 6, first with a scale of 1, then 2, then 10.
      - Talk about which scale was easiest to draw and read, and why.
questions:
  - What does one symbol stand for in this graph? How do you know?
  - How would the graph change if one symbol stood for 5 instead of 2?
  - Which kind of graph would you choose for this data? Why?
  - Do these two graphs show the same data? How can they look so different?
  - What question does this graph answer?
misconceptions:
  - thought: '"Each symbol is one thing."'
    why: In earlier grades, every symbol or dot stood for exactly one item.
    tryThis: Point to the key first, every time. Ask, "What does one symbol stand for here?"
  - thought: '"A bigger key means more data."'
    why: The numbers in the key get bigger, so it feels like the data grew.
    tryThis: Count the students both ways. The total stays the same when the key changes.
  - thought: '"Any scale is fine."'
    why: Every scale can show the data, so the choice seems unimportant.
    tryThis: Draw the same data with a scale of 1 and of 10. Ask which one you would want to read.
lookFor:
  - They read the key before reading the graph.
  - They work out half symbols correctly, such as half of 4 being 2.
  - They choose a scale that keeps rows short and whole, and explain why.
  - They start with a question and use the graph to answer it.
adapt:
  support:
    - Start with keys of 2 and 10, which are easy to count by.
    - Use real objects, such as one block for every 2 votes, before drawing.
    - Use grid paper for bar graphs so the scale lines up.
  access:
    - need: reading
      tip: Read the graph’s title and key aloud together before anything else.
    - need: attention
      tip: Keep surveys small, with 3 or 4 choices and up to 20 people.
    - need: worry
      tip: Graphs can be redrawn. Trying a scale that doesn’t work is part of finding one that does.
    - need: hands
      tip: The graph tool on the lesson page redraws the graph with a tap, so no drawing is needed.
  stretch:
    - Make a pictograph where one symbol stands for 5. Show a count of 12 with parts of symbols, and explain how you drew it.
    - Find a graph in a newspaper or flyer. What is its scale? Is it a good choice?
together:
  - problem: b4
    how: Ask your child to read the key aloud before answering. Then check Ana’s answer together.
  - problem: d1
    how: Run a real vote at home with the same four choices. Draw the pictograph together with a key you choose.
