id: equivalent-fractions
subject: math
why: |-
  Two fractions can look completely different and still be the same amount. Seeing that builds a flexible idea of what a fraction is, not just a pair of numbers.
hook:
  title: Fair shares
  time: 5 minutes
  covers: [K1.2, S1.1]
  body: |-
    1. Fold a paper strip in half and colour one half. Fold another strip into fourths and colour two fourths.
    2. Ask: "Who got more colour?"
    3. Ask: **"Can you make a third strip that is the same, but with even more pieces?"**
activities:
  - title: Paper strip wall
    time: 15 minutes
    materials: Six paper strips the same length, crayons, scissors
    covers: [S1.1, S1.2, K1.1]
    steps:
      - Fold the strips into halves, thirds, fourths, sixths, eighths and twelfths. Label each part.
      - Line the strips up, one under the other. Find every fraction that ends at the same spot as one half.
      - Repeat for one third and three fourths, and write each family as a list of equal fractions.
  - title: Simplify race
    time: 10 minutes
    materials: Paper, a pencil
    covers: [S1.5, S1.6, K1.6]
    steps:
      - One person writes a fraction like 12/18. Each person simplifies it in their own steps.
      - Compare paths and final answers. Talk about who took the fewest steps, and why.
  - title: Which is bigger?
    time: 10 minutes
    materials: Two dice, paper
    covers: [S1.7]
    steps:
      - Each player rolls twice to make a fraction less than 1, using the smaller number on top.
      - Compare the two fractions by finding equivalent fractions with the same denominator. The bigger fraction scores a point.
questions:
  - How can these two fractions look so different and still be the same?
  - What happens to the size of the parts when you split each one again?
  - Can this fraction be simplified? How do you know?
  - How many fractions are equivalent to one half? Will we ever run out?
  - Which is more? How could you show me on a number line?
misconceptions:
  - thought: '"2/3 = 4/5, because I added 2 to the top and the bottom."'
    why: Doing the same thing to both numbers sounds fair, and it is what they will do with equations later.
    tryThis: Try it with 1/2 and 2/3 on paper strips. The coloured part changes, so adding doesn’t keep the amount.
  - thought: '"4/8 is bigger than 1/2, because 4 and 8 are bigger numbers."'
    why: For whole numbers, bigger digits mean more. They are reading the fraction as two separate numbers.
    tryThis: Line up a strip folded into eighths under one folded in half. Ask which has more colour.
  - thought: '"Simplifying makes the fraction smaller."'
    why: The numbers get smaller, and "simplify" sounds like taking something away.
    tryThis: Show 6/8 and 3/4 on two paper strips. The pieces get bigger and fewer, but the coloured amount is the same.
lookFor:
  - They explain an equivalent fraction as splitting or joining equal parts, not as a trick with numbers.
  - They check for a common factor before saying a fraction is in simplest form.
  - They compare fractions by finding a common denominator, not by looking at the biggest numbers.
  - They place equivalent fractions at the same point on a number line.
adapt:
  support:
    - Start with paper strips and folding before writing any fraction numbers.
    - Use halves, fourths and eighths first, since folding in half again and again is easy.
    - Keep a multiplication chart nearby to spot common factors.
  access:
    - need: reading
      tip: Say fractions in words, such as "three fourths", alongside the numbers.
    - need: language
      tip: '"Equivalent" is a big word. Use "same amount" first, then connect it to the new word.'
    - need: worry
      tip: Show that there are many right equivalent fractions. Any fraction from the family is a good answer.
    - need: hands
      tip: The fraction splitter on the lesson page folds the bar with one tap, so no scissors or folding are needed.
  stretch:
    - Find a fraction between 1/2 and 3/4. Then find another one between your fraction and 3/4.
    - Order five fractions with different denominators, such as 2/3, 5/8, 3/4, 7/12 and 1/2.
together:
  - problem: b3
    how: Ask your child whether Max’s idea sounds fair, then test it with paper strips. Let the strips decide.
  - problem: d1
    how: Have each person take one friend’s path and race to simplest form. Compare where everyone ends up.
