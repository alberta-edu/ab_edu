id: time-duration
subject: math
why: |-
  Children live by the clock: recess, practice, bedtime. Seeing the minute hand sweep out parts of a circle connects time to fractions, and counting on in jumps makes durations easy to reason about.
hook:
  title: How long until?
  time: 5 minutes
  covers: [K1.2, S1.3]
  body: |-
    1. Look at an analog clock together and name something coming up, such as dinner or a favourite show.
    2. Ask: "How long until then? Show me with your finger on the clock."
    3. Ask: **"How much of a full turn will the minute hand make?"**
activities:
  - title: Paper plate clock
    time: 15 minutes
    materials: A paper plate, a paper fastener, card for hands, coloured pencils
    covers: [S1.1, U1.1, K1.1]
    steps:
      - Make a clock with moving hands. Colour the quarter, half and three-quarter turns in different colours.
      - Call out times like quarter past 4 or quarter to 9 and set the clock. Name the fraction of a turn each time.
  - title: Family timetable
    time: 15 minutes
    materials: Paper, a clock or watch
    covers: [S1.3, S1.4, S1.6, S1.7]
    steps:
      - Write the start and end times of three things in your day, such as school, practice and a meal.
      - Find each duration by jumping to the next hour, then whole hours, then the rest. Which lasts longest?
  - title: Seconds challenge
    time: 10 minutes
    materials: A timer
    covers: [S1.5]
    steps:
      - Guess how many times you can do a jumping jack in 1 minute. Then count them while someone times.
      - Ask how many seconds 3 minutes is, and how many minutes 180 seconds is.
questions:
  - What fraction of a full turn does the minute hand make in 15 minutes? In 40 minutes?
  - Why do we say "quarter to" at 45 minutes past?
  - How did you jump from the start time to the end time?
  - Why can’t we subtract times like ordinary numbers?
  - Which lasts longer, 90 minutes or 1 hour 20 minutes? How do you know?
misconceptions:
  - thought: '"From 2:50 to 3:10 is 60 minutes, because 310 − 250 = 60."'
    why: They subtract the times like ordinary numbers, as if an hour had 100 minutes.
    tryThis: Move the minute hand on a real clock from 2:50 to 3:10 and count the minutes as it goes.
  - thought: '"Quarter to 8 is 8:15."'
    why: The 8 is in the name, so the time feels like it should be after 8.
    tryThis: Say "a quarter of an hour to go until 8". Show the minute hand still needing a quarter turn.
  - thought: '"1 h 30 min is 130 minutes."'
    why: They write the hour as 100, in the same way they read 1:30 as one-three-zero.
    tryThis: Count the minute hand’s turns. One full turn is 60 minutes, then add 30.
lookFor:
  - They describe durations of 15, 30 and 45 minutes as fractions of a full turn.
  - They count on in jumps, to the next hour first, instead of subtracting the digits.
  - They change hours to minutes before comparing durations.
  - They name times as quarter past, half past and quarter to.
adapt:
  support:
    - Use a real analog clock with gears, or a paper plate clock, for every problem.
    - Start with durations inside one hour before crossing the hour.
    - Draw a number line with the hours marked, and draw each jump.
  access:
    - need: reading
      tip: Say times aloud as you point to the clock hands, such as "the minute hand is on the 9, so 45 minutes".
    - need: language
      tip: '"Quarter past" and "quarter to" are idioms. Link each to a picture of the clock with a shaded quarter.'
    - need: worry
      tip: Use timetables from your child’s own day. Familiar events make the numbers feel friendly.
    - need: hands
      tip: The clock on the lesson page moves its hands with buttons, so no small clock parts are needed.
  stretch:
    - Plan a 2-hour afternoon with three activities. Write the start and end time of each, with no gaps.
    - Find how many minutes are in a whole school day, from the bell in the morning to the bell at the end.
together:
  - problem: b4
    how: Ask your child to check Sam’s answer on a clock. Then talk about why subtracting the digits gave the wrong answer.
  - problem: d1
    how: Use a real TV guide or pretend schedule. Count on together with your finger on a clock face.
