id: area-tiling
subject: math
why: |-
  Area is counting how many units cover a space. Once children see that, square centimetres and multiplication come later as shortcuts they understand, not rules to memorize.
hook:
  title: Cover the book
  time: 5 minutes
  covers: [K1.1, S1.3, S1.4]
  body: |-
    1. Give your child a picture book and a pile of sticky notes, coins or crackers.
    2. Ask: "How many will it take to cover the cover?"
    3. Try coins, then sticky notes. Ask: **"Which one gives a better answer? Why?"**
activities:
  - title: Cracker tiling
    time: 15 minutes
    materials: Square crackers, round crackers, a placemat or a sheet of paper
    covers: [S1.3, S1.4, K1.1]
    steps:
      - Cover the placemat with square crackers and count them. Then try round crackers.
      - Talk about the gaps. Which crackers give a fair measure of the area?
  - title: Square centimetre hunt
    time: 15 minutes
    materials: Centimetre grid paper, a pencil, small flat objects
    covers: [S1.5, S2.1, S2.2]
    steps:
      - Find something that covers about 1 cm², such as a fingernail or a calculator key.
      - Trace three small objects, such as an eraser or a coin, on the grid paper. Estimate each area, then count squares to check.
  - title: Cut and rearrange
    time: 10 minutes
    materials: Paper squares, scissors, tape
    covers: [U1.3, S1.2]
    steps:
      - Cut a paper square into a few pieces. Tape them into a new shape with no gaps or overlaps.
      - Ask whether the new shape has more, less or the same area. Count grid squares on both to check.
questions:
  - How many units do you think will cover it? Why?
  - Why did the round units give a smaller count than the square ones?
  - If we use bigger tiles, will we need more or fewer?
  - Did cutting and moving the pieces change the area? How do you know?
  - What could you use to picture 1 cm²?
misconceptions:
  - thought: '"A longer shape has more area."'
    why: Length is easy to see, and a long shape looks bigger.
    tryThis: Cut a square into strips and line them up in a row. Count the grid squares before and after.
  - thought: '"Coins are fine for measuring area."'
    why: Coins are easy to count and they lie flat, so they seem like good units.
    tryThis: Look closely at the gaps between the coins. Colour them in to see how much space was missed.
  - thought: '"Different counts mean someone made a mistake."'
    why: In most counting, the same thing always gives the same number.
    tryThis: Measure one book with big and small sticky notes. Talk about why both counts are right.
lookFor:
  - They choose units that leave no gaps or overlaps, and explain why.
  - They predict more units when the unit is smaller.
  - They estimate an area by combining part squares into whole ones.
  - They say that cutting and moving pieces keeps the area the same.
adapt:
  support:
    - Use real square tiles or sticky notes before drawings.
    - Count rows of squares together, touching each one.
    - Use shapes made of whole squares before shapes with part squares.
  access:
    - need: reading
      tip: Use the word "cover" alongside "area". "How much does it cover?" is easier to hold on to.
    - need: attention
      tip: Keep tiling jobs small, such as a sticky note or a coaster, so they finish quickly.
    - need: worry
      tip: Estimating is a skill, not a guess. Praise estimates that are close, and the reasons behind them.
    - need: hands
      tip: The tiling tool on the lesson page covers shapes with one tap, so no small objects are needed.
  stretch:
    - Design a star of your own from paper diamonds or squares, then rearrange the same pieces into a rectangle.
    - Estimate the area of your hand on centimetre grid paper, then compare with a family member’s.
together:
  - problem: b4
    how: Try it with real coins on a notebook. Colour the gaps on paper and talk about how much area was missed.
  - problem: d2
    how: Use paper squares to stand for small tiles and groups of 4 for big tiles. Find as many ways as you can.
