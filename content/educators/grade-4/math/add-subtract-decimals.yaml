id: add-subtract-decimals
subject: math
why: |-
  The same column method children already trust for whole numbers works for decimals too, once the points line up. A quick estimate becomes their own alarm for a wrong answer.
hook:
  title: The wrong receipt
  time: 5 minutes
  covers: [K1.2, S1.2]
  body: |-
    1. Write three prices, such as $4.95, $3.10 and $1.98, with a "total" of $40.03.
    2. Say: "The store says I owe this. Should I pay?"
    3. Let your child find out how they know it is wrong, without adding exactly.
activities:
  - title: Grocery store cashier
    time: 15 minutes
    materials: Price tags on a few items, play money or paper notes, paper
    covers: [S1.1, S1.3]
    steps:
      - Your child is the cashier. Buy two or three items and pay with a $10 or $20 bill.
      - The cashier writes the total and the change in columns, points lined up. Then you swap roles.
      - Check each sale by counting the change back up to what was paid.
  - title: Close but not quite
    time: 10 minutes
    materials: Paper, a pencil, a calculator
    covers: [K1.2, S1.2, S1.1]
    steps:
      - One person writes an addition or subtraction with decimals and a "wrong" answer that is a little or a lot off.
      - The other estimates and says whether the estimate can catch it. Check with a calculator, then swap.
  - title: Road trip log
    time: 10 minutes
    materials: A map or driving app, paper
    covers: [S1.3, S1.1]
    steps:
      - Choose three Alberta towns and find the distances between them in kilometres, with one decimal place.
      - Add the legs of the trip, then find how much farther one route is than another.
questions:
  - About how big should the answer be? How did you decide?
  - Which digits are in the same place? How do you know?
  - Why can we write 7.4 as 7.40 here?
  - Could an estimate catch this mistake? Why or why not?
  - How could you check this answer with the opposite operation?
misconceptions:
  - thought: '"Line up the numbers on the right, like always."'
    why: For whole numbers, lining up on the right does line up the ones, so it always worked before.
    tryThis: Write the problem as money, $24.60 and $5.38. Ask which digits are dollars and which are cents.
  - thought: '"In each column, take the small digit from the big one."'
    why: It avoids the hard part, regrouping, and it gives an answer that looks believable.
    tryThis: Check the answer by adding back. If 7.40 − 2.65 were 5.25, then 5.25 + 2.65 would make 7.40. Does it?
  - thought: '"If my estimate is close, my answer must be right."'
    why: Estimates catch big mistakes so well that it is easy to trust them for small ones too.
    tryThis: Make a deliberate tiny mistake, such as one cent off, and ask whether the estimate notices it.
lookFor:
  - They line up decimal points before they start, and write in zeros for empty places.
  - They estimate first without being asked, and compare at the end.
  - They regroup across a zero, such as in 4 000 − 1 268, and explain the trade.
  - They pick the right operation from the story, not from key words.
adapt:
  support:
    - Begin with money, where dollars and cents make the places feel real.
    - Use grid paper so each digit gets its own box and the points stay in one column.
    - Start with numbers that need no regrouping, then add one regroup at a time.
  access:
    - need: reading
      tip: Read story problems aloud, and ask your child to retell the story before choosing an operation.
    - need: attention
      tip: Do one column at a time and tick it off. The column calculator on the lesson page shows one step at a time too.
    - need: worry
      tip: Praise the estimate as much as the exact answer. A good estimate is real math, not a guess.
    - need: hands
      tip: Your child can say each digit and carry aloud while you write. Grid paper with big squares helps too.
  stretch:
    - Find two decimals that add to exactly 10 with no zero digits, then find a pattern in every pair that works.
    - Make a subtraction with an answer of exactly 1.11, using two numbers that both have hundredths.
together:
  - problem: b3
    how: Ask your child to estimate out loud before anyone touches a pencil. Then decide together what Mei should say to the cashier.
  - problem: d2
    how: Try a pair together and see which rule it breaks. Keep a list of the pairs that work and look at each column’s digits.
