id: angle-pairs-prisms
subject: math
why: |-
  Angles and faces have relationships, not just sizes. Noticing that two angles always fill a corner, or that two faces never meet, is how children start to reason about shapes instead of only naming them.
hook:
  title: The folded corner
  time: 5 minutes
  covers: [K1.2, S1.2]
  body: |-
    1. Take a sheet of paper and fold one corner so the fold starts at the corner.
    2. Ask: "The corner was a right angle. What happened to it?"
    3. Ask: **"If one part is 30°, can you tell me the other part without measuring?"**
activities:
  - title: Angle pair partners
    time: 10 minutes
    materials: Paper, a ruler, a protractor
    covers: [K1.2, K1.3]
    steps:
      - Draw a straight line and a line from one point on it, making two angles. Measure both and add them.
      - Repeat with a square corner. Ask what always stays the same, and name the pairs.
  - title: Box detective
    time: 15 minutes
    materials: A cereal box, a triangular box or a paper model of a triangular prism, sticky notes
    covers: [S1.3]
    steps:
      - Put a sticky note on one face of the cereal box. Find every face parallel to it and every face perpendicular to it.
      - Do the same with the triangular prism. Compare how many parallel pairs each one has.
  - title: Polygon or not?
    time: 10 minutes
    materials: Household objects, paper
    covers: [K2.1, S2.1]
    steps:
      - Collect five objects that look like polygons, such as a book, a cracker or a sign.
      - For each one, check the sides and corners. Sort them into "polygon" and "close, but not quite".
questions:
  - What do these two angles make together? How do you know without measuring both?
  - Is this face parallel or perpendicular to that one? How could you check?
  - Why does a box have more parallel faces than a triangular prism?
  - What makes this shape not quite a polygon?
  - Which angles in this polygon are equal? Which add to 180°?
misconceptions:
  - thought: '"Complementary means the angles are the same."'
    why: The word sounds like "compliment" or "complete", and many examples use 45° and 45°.
    tryThis: Show 30° and 60° filling a square corner. Complementary angles fill 90°, whether or not they match.
  - thought: '"All the faces of a prism come in parallel pairs."'
    why: Boxes are the prisms they see most often, and every box face has a parallel partner.
    tryThis: Look at a triangular prism. Tap or touch each rectangle face and look for a partner.
  - thought: '"A tablet screen is a rectangle."'
    why: It looks like one, and everyone calls it one.
    tryThis: Look closely at the corners. A rectangle needs square corners, so a rounded corner makes it only close.
lookFor:
  - They find a missing angle by subtracting from 90° or 180°.
  - They describe faces of a prism as parallel or perpendicular and check by looking or measuring.
  - They explain why a real object is only a close approximation of a polygon.
  - They notice equal and supplementary angles inside a parallelogram.
adapt:
  support:
    - Use paper corners and folds before numbers.
    - Start with angle pairs that are multiples of 10°.
    - Use real boxes to touch faces that are parallel or perpendicular.
  access:
    - need: reading
      tip: Use a simple memory link. Complementary goes with a Corner (90°), and Supplementary goes with a Straight line (180°).
    - need: language
      tip: The words are long. Show the picture each time you say them, until the meaning sticks.
    - need: worry
      tip: The polygon hunt has no wrong objects. Every object can start a good conversation about sides and corners.
    - need: hands
      tip: The prism explorer on the lesson page turns with buttons, so no boxes need to be handled.
  stretch:
    - Find the supplementary angle and the complementary angle of 40°. What is the difference between them? Try another angle.
    - Find a prism at home whose ends are not triangles or rectangles. How many pairs of parallel faces does it have?
together:
  - problem: b3
    how: Open the prism explorer together. Let your child test Tom’s claim face by face before deciding.
  - problem: d2
    how: Take turns suggesting a pair, then check each rule out loud. Look for the smallest acute angle that still works.
