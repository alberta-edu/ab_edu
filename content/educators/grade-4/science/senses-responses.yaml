id: senses-responses
subject: science
why: Children discover that every living thing is constantly noticing and reacting, even plants that seem to do nothing. Running a small, kind animal investigation shows them how scientists ask a living thing a question.
hook:
  title: Blindfold detective
  time: 5 minutes
  covers: [K2.2, K2.3]
  body: |-
    1. With eyes closed, your child identifies three things by sound, three by smell and three by touch.
    2. Ask: **"Which sense was easiest? Which would help most if you were a rabbit in the forest?"**
    3. Then: **"Do you think plants can sense anything?"** Leave it open.
activities:
  - title: Shoebox maze
    time: 10 minutes to set up, then two weeks
    materials: A shoebox with a lid, cardboard, tape, a potted bean seedling
    covers: [K2.1, S2.1]
    steps:
      - Cut a hole in one end of the box. Tape in two cardboard walls with gaps, to make a simple maze.
      - Put the seedling at the far end, close the lid and set the box near a window, hole facing the light.
      - Peek every two days. Ask, "How does it know which way to grow?"
  - title: Pill bug choice
    time: 20 minutes
    materials: A tray or shallow box, paper towels, water, 6 to 10 pill bugs from under a log
    covers: [S2.3, U2.1, S1.2]
    steps:
      - Wet one paper towel and leave one dry. Lay them side by side in the tray.
      - Gently place the bugs in the middle. After ten minutes, count each side, and record it.
      - Repeat twice. Then return the bugs to their log, and wash hands.
questions:
  - Which of your senses do you use most? Which could you live without most easily?
  - How can a plant know which way is up?
  - Why might a pill bug need damp places?
  - How could you find out what an animal can sense, without hurting it?
  - What sense would help an owl most at night? Why?
misconceptions:
  - thought: '"Plants can’t sense anything because they don’t have eyes or ears."'
    why: Children link sensing with the organs they have themselves.
    tryThis: Grow a seedling near a window and turn the pot each day. Watch it keep turning back toward the light.
  - thought: '"Animals that can’t see must be helpless."'
    why: Sight is the sense children rely on most.
    tryThis: Talk about earthworms sensing light through skin, and owls hunting by sound.
  - thought: '"One test proves it."'
    why: A single clear result feels like the answer.
    tryThis: Repeat the pill bug test. Ask whether the result would convince a friend more after one try or three.
lookFor:
  - They connect a sense organ to what it detects and why that matters for survival.
  - They describe a plant’s growth as a response to something it senses.
  - They handle small animals gently and return them.
adapt:
  support:
    - Start with the five human senses before talking about animals and plants.
    - Use pictures of animals with one sense organ highlighted and ask, "What is it good for?"
  access:
    - need: hands
      tip: Use a spoon and a soft paintbrush to move pill bugs, or let your child direct you.
    - need: worry
      tip: If bugs feel scary, run the virtual experiment first, and let your child watch you handle the real ones.
    - need: language
      tip: Use "senses" and "responds" as a pair. After any reaction, ask "What did it sense? How did it respond?"
    - need: attention
      tip: Make predictions into bets before every count, and celebrate surprises.
  stretch:
    - Plan a choice test for another question, such as whether pill bugs prefer light or dark. Run it three times.
together:
  - problem: d1
    how: If you have a potted plant, act it out. Lay it on its side and ask where the stem will point in a few days.
  - problem: d2
    how: Talk through why each of the other choices wouldn’t convince a scientist.
