id: magnets
subject: science
why: Magnets give children quick, honest feedback. Every idea can be tested in seconds, and the results often surprise them, which is exactly how scientific thinking grows.
hook:
  title: Will it stick?
  time: 5 minutes
  covers: [K1.3, K1.4, S1.3]
  body: |-
    1. Gather ten small things: a spoon, foil, a key, a coin, a paper clip, a pencil, a ring.
    2. Before each test, your child predicts **stick** or **no stick**.
    3. Test with a fridge magnet. Ask: **"Were all the metal things the same? What surprised you?"**
    4. Give no rule yet.
activities:
  - title: Magnet detectives
    time: 20 minutes
    materials: Two fridge or bar magnets, paper clips, a steel nail, tape and a marker
    covers: [K2.1, K2.3, K2.4, S2.1]
    steps:
      - Dip a magnet in paper clips. Ask, "Where do the clips gather? Why might that be?"
      - Bring two magnets together both ways round. Your child names what happens each time.
      - If your magnets have no letters, label one end of a known magnet with tape. Use it to find the poles of the other.
  - title: Make a magnet
    time: 15 minutes
    materials: A strong magnet, a steel nail or large needle (with an adult), paper clips
    covers: [K2.5, S2.2]
    steps:
      - Test the nail first. Does it pick up a clip?
      - Stroke it from head to tip with one end of the magnet, about 20 times, lifting away each time.
      - Test again and count the clips. Then try 40 strokes. Does it pick up more?
questions:
  - Why do you think the clips gather at the ends of a magnet?
  - If something sticks to your magnet, is it another magnet? How could you be sure?
  - Is every metal magnetic? What would make you change your mind?
  - What happens when you turn one magnet around? Why?
  - How could a magnet help sort cans at a recycling plant?
misconceptions:
  - thought: '"Magnets stick to all metals."'
    why: Most magnetic things children meet are metal, like the fridge door and paper clips.
    tryThis: Test foil, a copper wire or an aluminum can. Ask what the magnetic things have in common.
  - thought: '"The north pole is the strong end."'
    why: North sounds important, and it is often painted red.
    tryThis: Count the clips that each end picks up. Then compare the two numbers.
  - thought: '"If it sticks, it must be a magnet."'
    why: Sticking is the most obvious thing magnets do.
    tryThis: Show a plain nail sticking to a magnet. Ask what a test would need to show to prove something is a magnet.
lookFor:
  - They predict with a reason, like "it’s steel, so it has iron".
  - They use repelling, not attracting, to prove something is a magnet.
  - They describe both poles pulling on a paper clip.
adapt:
  support:
    - Use magnets with coloured, labelled ends at first. Hide the labels later.
    - Start with two sorting groups only, sticks and doesn’t stick, before talking about iron, cobalt and nickel.
  access:
    - need: hands
      tip: Large magnets on toy cars or in a shallow tray of water on cork rafts are easy to push and watch.
    - need: language
      tip: Act out attract with a hug and repel with two hands pushing apart. Say the word as you do it.
    - need: attention
      tip: Every test is a quick bet. Say "stick or no stick?" and keep score.
    - need: worry
      tip: A surprising result is the fun part. Cheer when a prediction turns out wrong, and ask what it tells you.
  stretch:
    - Find out how much a magnetized nail can pick up after 10, 20 and 40 strokes. Show it in a table or a bar graph.
together:
  - problem: d1
    how: Use three real objects, two magnets and a plain bar of steel, or act it out with paper bars. Ask what each test does and doesn’t prove.
  - problem: b2
    how: Ask your child to say the pole rules aloud first, then work out what the mystery end must be.
