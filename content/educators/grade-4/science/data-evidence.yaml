id: data-evidence
subject: science
why: Children learn that "I think" becomes "I know" through data. Choosing what to record, and keeping the results they didn’t want, is honest thinking they will use far beyond science.
hook:
  title: Describe it, then measure it
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. Hand your child a fruit, like an orange.
    2. Ask for three words that describe it. Then ask for three numbers about it.
    3. Ask: **"Which tells me more? Does it depend on what I want to know?"**
activities:
  - title: Bounce lab
    time: 20 minutes
    materials: A ball, a metre stick or measuring tape, tape, three floor surfaces
    covers: [S1.1, S1.2, S1.3, S1.4]
    steps:
      - Tape the metre stick to a wall. Drop the ball from 100 cm onto each surface.
      - Record each bounce in words and in centimetres, in a table.
      - Make a bar graph of the heights. Ask, "Which way of showing it was easier to read?"
  - title: Story with numbers
    time: 10 minutes
    materials: A grandparent, neighbour or family friend, and a notebook
    covers: [K1.3, K1.8]
    steps:
      - Ask them about something they noticed in nature long ago, like a big snowfall.
      - Your child listens for numbers and counts in the story, and writes them down.
      - 'Talk about it: "What does this story tell us that a graph might not?"'
questions:
  - Is "the plant is tall" descriptive or measured data? How could you make it measured?
  - Why would leaving out a result be a problem?
  - Which details in your observations could you ignore for this question?
  - Why do scientists all over the world use the same units?
  - Have you ever changed your mind because of new evidence?
misconceptions:
  - thought: '"Measured data is always better than descriptive data."'
    why: Numbers feel more scientific.
    tryThis: Ask what colour a mystery leaf is. A number doesn’t help, but a good description does.
  - thought: '"A result that doesn’t fit is a mistake, so I can leave it out."'
    why: Children want their prediction to be right.
    tryThis: Ask whether the odd result really happened. If it did, it counts. Then wonder together why it happened.
  - thought: '"If scientists change their minds, science must be unreliable."'
    why: Changing your mind can look like being wrong.
    tryThis: Talk about Pluto. Scientists changed their minds because they found new evidence, which is what good thinkers do.
lookFor:
  - They choose measured data when a question asks "how much" or "how many".
  - They keep every relevant result, including surprising ones.
  - They use SI units and their short forms correctly.
adapt:
  support:
    - Practise sorting descriptions and numbers out loud before writing anything.
    - Start with one surface and one ball before comparing.
  access:
    - need: writing
      tip: Let your child draw the bounce heights as bars on paper instead of writing a table.
    - need: reading
      tip: Read tables aloud row by row, pointing with a finger.
    - need: attention
      tip: Each drop is a quick prediction game. Guess, drop, measure, cheer.
    - need: language
      tip: Pair each SI unit with an object, like 1 m as a big step and 1 kg as a bag of flour.
  stretch:
    - Ask a question, choose what data to collect, and show your evidence in two different ways.
together:
  - problem: d1
    how: Cover the colour and price columns first. Then uncover them and ask whether they change the answer.
  - problem: b3
    how: Ask your child to write Leo’s report honestly, with all five throws.
