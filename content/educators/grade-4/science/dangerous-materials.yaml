id: dangerous-materials
subject: science
why: Hazard symbols are a language children can read before they can read the label. Knowing them, and knowing to stop and ask, keeps them and the people around them safe.
hook:
  title: Symbol hunt
  time: 10 minutes
  covers: [K2.2, S2.1]
  body: |-
    1. Walk through the kitchen, bathroom and garage together. You open cupboards. Your child only looks and points.
    2. Ask: **"Which containers have a little picture in a frame? What do you think it is warning about?"**
    3. Leave every container closed and in its place. Give no answers yet.
activities:
  - title: Make a safety map
    time: 20 minutes
    materials: Paper and coloured pencils
    covers: [S2.1, K2.3, S2.2]
    steps:
      - Draw a simple map of your home. Mark each place where you found a hazard symbol.
      - Next to each mark, draw the symbol and write what it warns about.
      - 'Ask: "Is each one stored up high or locked away? Is anything near heat that shouldn’t be?" Fix anything together.'
  - title: Follow the drain
    time: 15 minutes
    materials: A walk around your block
    covers: [U2.1, S2.2]
    steps:
      - Find the storm drains on your street. Some have a painted fish or a message beside them.
      - 'Ask: "Where does the water go from here? What would happen to paint or oil poured in?"'
      - Look up where your town’s household hazardous waste drop-off is.
questions:
  - Why would someone put a symbol on a label, when the words are already there?
  - What is the difference between an octagon frame and a triangle frame?
  - Can something natural be dangerous? Can you think of an example?
  - Why shouldn’t paint go in the garbage, if the garbage goes far away?
  - Why might it be dangerous to put a cleaner in a different bottle?
misconceptions:
  - thought: '"Only things made in factories are dangerous."'
    why: Most warning labels children see are on processed products.
    tryThis: Talk about plants and mushrooms that are poisonous, and why we never eat a wild plant or mushroom without an expert.
  - thought: '"If it doesn’t have a fire symbol, it’s safe."'
    why: Fire is the danger children understand best.
    tryThis: Go through each of the four symbols and say one way each can hurt someone, then which ones have nothing to do with fire.
  - thought: '"Pouring something down the drain makes it go away."'
    why: Once it’s gone from sight, it seems gone for good.
    tryThis: Run the storm drain experiment again, and ask your child to follow the paint with a finger all the way to the river.
lookFor:
  - They stop and tell an adult when they see a hazard symbol, without being reminded.
  - They can say what the frame shape means as well as the picture.
  - They suggest a drop-off for leftover paint or batteries.
adapt:
  support:
    - Start with only two symbols, poison and flammable. Add the others once those feel easy.
    - Use the explorer on screen first, then look for the same symbols at home.
  access:
    - need: reading
      tip: The symbols do the reading. Ask your child to say what each picture shows before you read any words.
    - need: worry
      tip: Keep it calm. These products are safe when adults store and use them properly, and the symbols are there to help.
    - need: language
      tip: Link each hazard word to its picture, and say it out loud with a gesture, like flames with your fingers for flammable.
    - need: attention
      tip: Make the symbol hunt a game with a timer. Each find is a point, but nobody touches anything.
  stretch:
    - Design a poster for your class that shows the four symbols and what to do when you see one.
together:
  - problem: d1
    how: Cover the parts. Ask your child where they would put each product in the garage, and why, before answering.
  - problem: d2
    how: Trace each neighbour’s paint with a finger on a quick drawing of the street, river and landfill.
