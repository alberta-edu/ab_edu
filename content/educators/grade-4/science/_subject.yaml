subject: science
promise: |-
  We hope your child starts asking "How do you know?", and enjoys being surprised.

  - Facts can be looked up in seconds.
  - Predicting, looking closely and changing your mind because of evidence is what science really gives them.
shifts:
  - instead: Explaining the idea first, then showing the experiment.
    tryThis: Getting a prediction first. On the site’s experiments, have your child pick an answer before pressing Run, and say why.
  - instead: Saying "That’s wrong" when a child has a mistaken idea.
    tryThis: 'Asking "What would we see if that were true?" Then look together. Children keep an idea until something they see makes them doubt it.'
  - instead: Treating a surprising result as a failed experiment.
    tryThis: Celebrating it. A result nobody expected is the most interesting thing that can happen, so ask what might explain it.
  - instead: Answering every question they ask.
    tryThis: 'Saying "How could we find out?" It’s also fine to say "I don’t know." It shows that adults keep learning too.'
  - instead: Teaching the vocabulary first.
    tryThis: Letting them see the thing and describe it in their own words. Then give them the science word for what they’ve already noticed.
routines:
  - name: Predict, watch, explain
    time: 5 minutes
    how: |-
      Use it with any on-screen experiment:

      1. Predict, with a reason.
      2. Run it, and say what happened.
      3. Say why.

      A wrong prediction is the best part, so ask what they think now.
  - name: Who’s right?
    time: 5 minutes
    how: |-
      1. Describe two friends who disagree: "Ava says magnets pull on all metals. Sam says only some."
      2. Your child decides who has the better reason, and what test would settle it.
  - name: Count it or describe it?
    time: 5 minutes
    how: |-
      Whenever your child notices something, ask:

      - Can we describe it in words?
      - Can we count or measure it?
      - Which one answers our question better?
  - name: Science walk
    time: 15 minutes
    how: Go outside with one question, such as where the North Star is tonight or what lives in a puddle. Come back with one thing noticed and one thing wondered.
assess:
  - They give a reason with their prediction, not just a guess.
  - They change their mind because of something they saw, and they can say what it was.
  - They ask whether a result would happen again if they tried it twice.
  - They use the science word correctly without being asked, in a new situation.
sources:
  - label: 'TERC Inquiry Project: concept cartoons'
    url: https://inquiryproject.terc.edu/assessment/concept_cartoons.cfm.html
