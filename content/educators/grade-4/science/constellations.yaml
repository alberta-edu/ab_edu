id: constellations
subject: science
why: Finding north from the stars gives children a skill people have used for thousands of years. It also shows them that a shape we see depends on where we look from.
hook:
  title: Connect the dots
  time: 5 minutes
  covers: [K2.1, K2.2]
  body: |-
    1. Scatter about ten coins or buttons on a dark cloth.
    2. Ask your child to find a shape in them, then give it a name and a short story.
    3. Ask: **"Would someone else see the same shape? Would they name it the same?"**
activities:
  - title: North Star hunt
    time: 15 minutes on a clear night
    materials: A clear night away from bright lights, warm clothes
    covers: [K2.5, S2.1, S2.2]
    steps:
      - Find the Big Dipper together. In Alberta it is in the northern sky every clear night of the year.
      - Use the two pointer stars to find Polaris, about five pointer-gaps away.
      - Face Polaris. Your child points north, south, east and west.
  - title: Two-hour star check
    time: 5 minutes, twice in one evening
    materials: A window facing north, a sticky note
    covers: [K2.4, U2.1]
    steps:
      - Stick a note on the window where the Big Dipper’s bowl appears. Note the time.
      - Look again two hours later from the same spot. Where is the bowl now?
      - Ask, "What moved, the stars or us?"
questions:
  - If two stars look close together, are they really close? How could we find out?
  - Why do you think Polaris was so important to travellers long ago?
  - Why can you see Orion in winter but not in summer?
  - What names does your family or community have for stars or star patterns?
  - How could the stars help you tell what time of night it is?
misconceptions:
  - thought: '"The stars in a constellation are right next to each other."'
    why: From Earth they look like dots on a flat sheet.
    tryThis: Use the fly-around visual, or hold up a near finger and a far pencil that line up from one eye.
  - thought: '"The stars move across the sky by themselves."'
    why: That is exactly what it looks like.
    tryThis: Spin slowly in a chair in a room. Ask whether the room is moving or you are.
  - thought: '"The North Star is the brightest star."'
    why: It is famous, so it seems it must be the brightest.
    tryThis: Find Polaris and compare it with nearby stars. It is only medium-bright. Its place, not its brightness, makes it useful.
lookFor:
  - They find Polaris using the pointer stars, and point north.
  - They explain the turning sky with Earth’s rotation.
  - They name more than one source for constellation names, including a First Nations name.
adapt:
  support:
    - Learn the Big Dipper first. Add Orion and Cassiopeia once it is easy to spot.
    - Use a star map or sky app with an adult before going outside.
  access:
    - need: attention
      tip: Keep night viewing short. Find one thing, celebrate, and go back inside.
    - need: worry
      tip: Watch from a porch or a lit window if the dark is uneasy. The Big Dipper is bright enough.
    - need: language
      tip: Act out rotation by spinning, and revolution by walking around a chair that is the Sun.
    - need: hands
      tip: Use a flashlight beam to point at stars together, instead of finger measuring.
  stretch:
    - Ask a family member, Elder or Knowledge Keeper about a local name or story for a star. Share it in your own words.
together:
  - problem: d1
    how: Try the finger measure outside or with the picture held at arm’s length.
  - problem: b4
    how: Walk around a lamp with a picture of Orion taped to one wall. When can you see it with your back to the lamp?
