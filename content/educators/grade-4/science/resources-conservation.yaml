id: resources-conservation
subject: science
why: Children learn that the things they use every day come from nature, and that how much we take decides what is left. It gives them a way to think about fairness to people who come later.
hook:
  title: Where did it come from?
  time: 5 minutes
  covers: [K5.1, U5.1]
  body: |-
    1. Pick up three things in your kitchen, like a pencil, a glass and a spoon.
    2. For each one, ask: **"What was this before it was made? Where in nature did it start?"**
    3. Keep asking "and before that?" until you reach soil, water, rock, trees or animals.
activities:
  - title: Bean pond
    time: 15 minutes
    materials: A bowl, 40 dried beans or buttons, two players
    covers: [U6.2, U6.1, K6.1]
    steps:
      - 'Put 20 beans in the bowl as fish. Each "year", add half as many as are in the bowl, up to 30.'
      - Player 1 takes 5 each year. Next game, take 15 each year. Play five years each time.
      - Compare the bowls. Ask, "Which way could your grandchildren still fish?"
  - title: Home conservation plan
    time: 15 minutes, then a week
    materials: Paper and a pencil
    covers: [K7.1, S7.1, S7.2]
    steps:
      - Your child picks one thing to conserve at home, like electricity or water.
      - Write three actions and a way to check them, like a tally of lights left on.
      - After a week, talk about what worked and one change for next week.
questions:
  - What natural resources did you use today, before lunch?
  - Why might a park close a road at night?
  - Is it fair to use up something that people in the future will need? Why?
  - Which is bigger, what one person can do or what a town can do? Do we need both?
  - What could a park do so that visitors and animals can both enjoy it?
misconceptions:
  - thought: '"Natural resources are only things like oil and gold."'
    why: News stories about resources often mean mining and drilling.
    tryThis: List the seven kinds together, and find one example of each in your home.
  - thought: '"Conservation means not using nature at all."'
    why: Rules like "don’t pick the flowers" make it sound like hands off.
    tryThis: Play the bean pond game. Taking 5 a year is still fishing, and the pond lasts.
  - thought: '"Feeding animals is kind, so it helps conservation."'
    why: Helping animals feels good, and ducks seem to like bread.
    tryThis: Ask what the animal eats in the wild, and what might happen if it learns people give out food.
lookFor:
  - They trace a manufactured object back to a natural resource.
  - They explain conservation as keeping enough for the future, not as never using anything.
  - They suggest both a personal action and a community action.
adapt:
  support:
    - Start with the bean pond game before the screen, so the numbers can be touched.
    - Focus on one resource, like water, before moving to the others.
  access:
    - need: reading
      tip: Use the emoji in the resource table as picture cues, and read each use aloud.
    - need: attention
      tip: Make the bean pond a race between two bowls, with a quick count each year.
    - need: worry
      tip: Keep the focus on what people can do. Every action in the sorting game is a good one.
    - need: language
      tip: Connect conserve with save and keep. Point out the word in labels, like “conservation area”.
  stretch:
    - Find a park near you. Is it local, provincial or national? Find one rule it has and explain what the rule conserves.
together:
  - problem: d1
    how: Use beans or blocks for the woodlot. Act out a few years of each plan.
  - problem: d2
    how: 'Have your child play two roles: a hiker and a nesting duck. What does each one want?'
