id: moon-calendars
subject: science
why: Calendars feel fixed, but they are human inventions built on the sky. Children see why different cultures keep time differently, and that each way is a careful answer to a real puzzle.
hook:
  title: Is a month a Moon?
  time: 5 minutes
  covers: [K3.1, K3.5]
  body: |-
    1. Look at a wall calendar. Ask: **"Why are some months 30 days and some 31? Who decided?"**
    2. Then: **"How do you think people kept track of time before there were paper calendars?"**
    3. Let your child guess. Don’t correct yet.
activities:
  - title: Moon diary
    time: 2 minutes a night for a month
    materials: A calendar page with big boxes, a pencil
    covers: [K3.5, S3.1, S3.2]
    steps:
      - Each clear night, draw the Moon’s shape in that date’s box. Cloudy nights are fine. Mark them with a cloud.
      - Add one thing you notice outside that day, like geese, frost or new leaves.
      - At the end, count the days from one full Moon to the next. Name the Moon after something you noticed.
  - title: Calendar comparison
    time: 15 minutes
    materials: This year’s calendar, and the dates of Ramadan or Lunar New Year for the last few years (look them up together)
    covers: [K3.4, S3.2, K3.3]
    steps:
      - Mark when each holiday fell in each year on the wall calendar.
      - 'Ask: "Does it move? Which way, and by how much?"'
      - Connect it to the 11-day difference between 12 Moon cycles and a 365-day year.
questions:
  - Why don’t full Moons land on the same date every month?
  - What would happen to the seasons if our calendar had only 354 days?
  - Why might people name a Moon after an animal or a plant?
  - Does your family celebrate anything whose date follows the Moon?
  - If you made your own calendar, would you follow the Sun, the Moon or both? Why?
misconceptions:
  - thought: '"Calendar months are the same as Moon cycles."'
    why: The word month comes from moon, and months are about the same length.
    tryThis: Mark full Moons on a wall calendar for a few months and watch them drift earlier.
  - thought: '"Lunar calendars are old-fashioned, and nobody uses them now."'
    why: Children mostly see the international calendar at school.
    tryThis: Look up this year’s dates for Ramadan, Eid or Lunar New Year, and how they are set.
  - thought: '"Holidays that move around are random."'
    why: The pattern only shows over several years.
    tryThis: Line up three years of dates for one holiday, and find the steady jump.
lookFor:
  - They explain why a lunar year and a 365-day year don’t match, using the 11 days.
  - They describe a Moon name as connected to what happens on the land.
  - They speak respectfully about calendars different from their own.
adapt:
  support:
    - Start with the Moon diary for two weeks before talking about years.
    - Use a paper strip of 365 squares and 12 coloured strips of 29 or 30 squares to see the leftover days.
  access:
    - need: reading
      tip: The Cree moon names can be heard and repeated. Say each one slowly and talk about its meaning.
    - need: attention
      tip: Keep the Moon diary to one drawing a night, in under two minutes.
    - need: language
      tip: Link lunar with “Luna”, a name for the Moon in many languages, and compare with your family’s word for Moon.
    - need: writing
      tip: Your child can draw the Moon and stick on a picture instead of writing a note in the calendar.
  stretch:
    - Design a calendar for a made-up planet with a Moon that takes 10 days to cycle. How many Moon cycles fit in its year?
together:
  - problem: d1
    how: Use the paper strips. Slide the 12 Moon strips along the year strip three times and see how far they drift.
  - problem: b2
    how: Count back 11 days from March 1 on a real calendar together.
