id: waste-management
subject: science
why: Children learn that "throwing away" has no real "away". Every bit of waste ends up in the ground, the water or the air, and small daily choices change how much there is.
hook:
  title: The garbage detective
  time: 5 minutes
  covers: [K1.4, K1.3]
  body: |-
    1. Peek into the kitchen garbage together. Wear gloves, and touch nothing sharp.
    2. Ask: **"What is in here? Where will it go after the truck takes it?"**
    3. Then: **"Is any of our waste not in this can at all?"** Think of the drain and the car’s exhaust.
    4. Give no answers yet.
activities:
  - title: One-week waste count
    time: 10 minutes a day for a week
    materials: Paper, a pencil, and your home’s garbage, recycling and compost bins
    covers: [S1.2, K1.2, U1.1]
    steps:
      - Each evening, count the items that went into each bin today, and record the counts in a table.
      - At the end of the week, your child picks the bin with the most items and finds one way to shrink it.
      - 'Try the idea for a week, then count again. Ask: "Did it work? What would you try next?"'
  - title: Repurpose challenge
    time: 20 minutes
    materials: Clean containers from the recycling, such as jars, boxes and egg cartons, plus tape and markers
    covers: [K1.2, S1.1]
    steps:
      - Each person picks one container and gives it a brand-new job, such as a bird feeder or a desk organizer.
      - 'Explain your invention. Ask: "Is this reusing or repurposing? How do you know?"'
      - Talk about which choice kept the most out of the garbage.
questions:
  - When garbage goes to the landfill, is it gone? Where is it now?
  - Why might a family make more waste in December than in March?
  - Which is better, recycling a juice box or never having one? Why?
  - What kinds of waste can’t you see?
  - Why do you think food scraps break down, but a plastic bag doesn’t?
misconceptions:
  - thought: '"Burning garbage makes it disappear."'
    why: The pile really does get smaller, and most of it seems to vanish.
    tryThis: Look at a candle flame from a safe distance and point out the smoke. Ask where the wax is going.
  - thought: '"Recycling is the best you can do."'
    why: Recycling is the way of wasting less that children hear about most, and it has its own bins.
    tryThis: 'Ask: "What happens to the can if you never buy it?" Then compare counting recycled things with counting things you never threw out.'
  - thought: '"Waste is only solid stuff in the garbage can."'
    why: Liquid and gas waste don’t go in a bin, so they’re easy to forget.
    tryThis: List what goes down the drain and out of a car’s tailpipe. Sort it into liquids and gases.
lookFor:
  - They name where a piece of waste will end up, not just that it goes "away".
  - They can tell reusing from repurposing with their own example.
  - They suggest reducing before recycling, without being asked.
adapt:
  support:
    - Start with real objects from your kitchen. Hold each one and decide together which bin it goes in.
    - Learn two of the six ways first, reusing and recycling, before adding the others.
  access:
    - need: reading
      tip: Read the six ways aloud with an object for each one. Your child can point to the object instead of reading the word.
    - need: attention
      tip: Make the waste count a race. Who can find the most things to repurpose in two minutes?
    - need: worry
      tip: This topic isn’t about blame. Celebrate every small change, and keep talk about pollution calm and hopeful.
    - need: language
      tip: Many of the words share a front part, re-. Point out that it means "again", as in reuse, recycle and repair.
  stretch:
    - Find out what your own town does with recycling and compost. Draw the path one item takes, with numbered steps and arrows.
together:
  - problem: d1
    how: |-
      - Before the parts, ask your child to guess which choice is best, and why.
      - After Leo’s idea, ask where the smoke from a campfire goes.
  - problem: d2
    how: Cover the choices. Ask your child to count how many juice boxes each class threw out, then decide who did better.
