id: earth-spheres
subject: science
why: Children learn to see a place as a web, not a list of parts. Following one change through many systems is how they will later make sense of floods, droughts and their own choices.
hook:
  title: Four things out the window
  time: 5 minutes
  covers: [K1.1, U1.1]
  body: |-
    1. Look out a window or stand outside together.
    2. Ask your child to point to something **solid**, something **wet**, something **alive**, and the **air**.
    3. Then ask: **"Can you find something that touches two of them at once?"**
    4. Give no science words yet.
activities:
  - title: Sphere spotting walk
    time: 20 minutes
    materials: Paper folded into four boxes, a pencil
    covers: [K1.1, K1.2, K1.3, K1.4, K1.5, S1.2]
    steps:
      - Label the boxes lithosphere, atmosphere, hydrosphere and biosphere.
      - On a walk, draw or write one thing for each box.
      - At home, draw arrows between things that affect each other, like rain on soil, or a bird drinking from a puddle.
  - title: Mini hillside
    time: 20 minutes
    materials: Two trays, soil, a patch of grass sod or moss, a watering can, two cups
    covers: [K4.1, S4.1, S1.1]
    steps:
      - Do this outside. Fill one tray with bare soil and one with soil covered by sod. Tilt both over a cup.
      - Your child predicts which cup will get muddier water, and why.
      - Pour the same amount of water on each from the same height. Compare the cups.
questions:
  - Can you name something that belongs to two spheres at once?
  - What would happen to a lake if it stopped raining for a year?
  - How could cutting down trees on a hill change a river below it?
  - Why might a small change, like one dam, matter to animals far away?
  - Which sphere do you use the most every day?
misconceptions:
  - thought: '"The spheres are separate layers, like a cake."'
    why: Diagrams often show them as neat bands.
    tryThis: Look at soil together. Find air pockets, water and living things in one handful.
  - thought: '"Only big events, like volcanoes, change Earth’s systems."'
    why: Big events are the ones in the news.
    tryThis: Follow a small change, like a spilled bucket of soapy water, from the driveway to a storm drain to a river.
  - thought: '"The atmosphere is just empty space."'
    why: Air is invisible, so it feels like nothing.
    tryThis: Wave a sheet of cardboard to feel the air push back, and talk about the oxygen we breathe in it.
lookFor:
  - They connect an event to more than one sphere without being asked.
  - They explain an effect as a chain, one step at a time.
  - They use the word interact in their own example.
adapt:
  support:
    - Start with only two spheres, like water and life, and find connections between them.
    - Use the colours from the landscape picture as a code when drawing.
  access:
    - need: reading
      tip: The four word roots help. Lithos is stone, hydor is water, bios is life and atmos is vapour.
    - need: language
      tip: Make four cards with a picture and a word each, and sort household photos onto them.
    - need: attention
      tip: Turn the chains of effects into dominoes. Line up cards and knock them down as you say each step.
    - need: worry
      tip: Pair every harmful change with a helpful one, like replanting a hillside, so the topic stays hopeful.
  stretch:
    - Choose one change in your community, like a new road. Draw how it could affect all four spheres.
together:
  - problem: d1
    how: Draw the island, the river and the deer. Add one arrow for each part before choosing an answer.
  - problem: d2
    how: Ask what a blanket does on a cold night, then compare it with the atmosphere.
