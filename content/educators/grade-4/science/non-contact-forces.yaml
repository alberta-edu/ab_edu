id: non-contact-forces
subject: science
why: Children learn that the most important forces in their lives can’t be seen. They practise trusting evidence of a cause they can only infer from what it does.
hook:
  title: The invisible hand
  time: 5 minutes
  covers: [K1.1, K1.2]
  body: |-
    1. Hold a spoon over a cushion. Ask: **"What will happen when I let go? Why?"**
    2. Let go. Then ask: **"What pulled it? Did anything touch it?"**
    3. If you have a fridge magnet, slide it slowly toward a paper clip until the clip moves.
    4. Ask what both have in common. Give no names yet.
activities:
  - title: How far can it reach?
    time: 15 minutes
    materials: A fridge magnet or bar magnet, a paper clip, a ruler, sheets of paper
    covers: [K1.5, K1.6, S1.1]
    steps:
      - Put the clip at the end of a ruler. Slide the magnet slowly toward it along the ruler.
      - Write down the distance where the clip first jumps. Do it three times.
      - Now stack paper between them and try again. Ask, "Did the paper stop the pull, or just make the gap bigger?"
  - title: Gravity games
    time: 10 minutes
    materials: A soft ball, a sock and a small cushion
    covers: [K1.2, S1.2]
    steps:
      - Drop the ball, toss it up and roll it off a table onto the cushion.
      - 'Each time, your child points the direction gravity is pulling. Ask: "Does it ever point another way?"'
      - Try the sock. Ask, "Did gravity pull it too, even though it fell more slowly?"
questions:
  - How do you know there is a force on something if you can’t see it?
  - When you jump, what brings you back down? Does it stop when you are in the air?
  - Could a magnet pick up a paper clip through your hand? How could you test it safely?
  - Why does a fridge magnet hold one drawing but not a big stack?
  - What would happen to a ball you dropped if gravity stopped working?
misconceptions:
  - thought: '"Gravity only works when something is falling."'
    why: Gravity is easiest to notice when things fall.
    tryThis: Toss a ball up and ask what slowed it down. Then hold it still and ask why your arm feels it pulling down.
  - thought: '"Paper or cardboard blocks a magnet."'
    why: When a stack of paper stops a magnet working, it looks as if the paper got in the way.
    tryThis: Test one sheet first. Then ask what changed as the stack grew, the paper or the distance.
  - thought: '"If nothing is touching it, there’s no force."'
    why: The pushes and pulls children make themselves are all contact forces.
    tryThis: Hang a paper clip just under a magnet. Ask what would happen if you took the magnet away.
lookFor:
  - They point out non-contact forces in everyday life, like a falling leaf.
  - They describe gravity pulling on a ball that is going up.
  - They explain a weaker pull by distance, not by blocking.
adapt:
  support:
    - Start with real objects. Let your child drop and catch things before using words like non-contact.
    - Use one magnet and one clip, and move only the distance, before adding sheets of material.
  access:
    - need: hands
      tip: Tape the clip to a string so it’s easy to hold, and let your child say when to stop moving the magnet.
    - need: language
      tip: Act out "contact" by touching hands, and "non-contact" by moving a magnet near a clip without touching.
    - need: attention
      tip: Make each test a quick prediction game. Say "jump or no jump?" before every try.
    - need: reading
      tip: The card sort can be read aloud. Your child decides by asking one question each time, "Are they touching?"
  stretch:
    - Test which materials a magnet can pull through, at the same distance. Record your results in a table.
together:
  - problem: d1
    how: Before reading the parts, ask your child to say what they notice in the table and what might explain it.
  - problem: d2
    how: Use a ball or orange as Earth and a small toy as a person. Point the gravity arrow from the toy to the ground, wherever it stands.
