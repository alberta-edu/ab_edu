id: design-process
subject: science
why: Design teaches children that a first try is supposed to have problems. A test tells you what to fix next, and a clear set of instructions can turn an idea into something that works.
hook:
  title: Instructions for a robot
  time: 5 minutes
  covers: [K1.3, S1.4]
  body: |-
    1. You play a robot that follows instructions exactly. Your child must get you from the couch to the fridge.
    2. Follow each instruction literally. Bump gently into things if the instructions say so.
    3. Ask: **"What went wrong? How could you fix your instructions?"**
activities:
  - title: Paper bridge challenge
    time: 25 minutes
    materials: Paper, tape, two stacks of books 15 cm apart, coins
    covers: [K1.1, S1.1, S1.3, K1.7]
    steps:
      - Set the need. The bridge must hold 20 coins, using only paper and up to 10 cm of tape.
      - Sketch two ideas, pick one, then build it.
      - Test with coins, one at a time. Analyze why it failed, troubleshoot, and test again.
  - title: Feedback swap
    time: 10 minutes
    materials: Your bridges or another design, and a partner
    covers: [S1.2, K1.2]
    steps:
      - Each person gives feedback with "I notice…", "I wonder…" and "What if…".
      - The designer picks one idea to try, and says why.
questions:
  - Why do designers test things instead of just building them once?
  - What is a need that your design has to meet?
  - What would you do if the best material was too expensive?
  - How is a recipe like an algorithm?
  - What feedback would help you most, and what feedback wouldn’t help?
misconceptions:
  - thought: '"If my design fails a test, I failed."'
    why: Children are used to tests that measure them, not their work.
    tryThis: Celebrate each failed test as information. Ask, "What did the test teach us?"
  - thought: '"The strongest or newest material is always the best."'
    why: Strong sounds better, and new things look exciting.
    tryThis: Set a budget and a time limit. Ask which material meets the need with what you actually have.
  - thought: '"An algorithm has to be on a computer."'
    why: The word is usually heard with apps and games.
    tryThis: Write the algorithm for making a sandwich, then follow it exactly as written.
lookFor:
  - They test their design against the need, not just whether it looks good.
  - They change one thing after a failed test and test again.
  - They give feedback that is kind and specific.
adapt:
  support:
    - Give a single need and two materials. Add cost and more materials later.
    - Write algorithms with arrow cards before using the screen.
  access:
    - need: hands
      tip: Pre-fold paper for the bridge, or let your child direct you while you fold and tape.
    - need: worry
      tip: Build two bridges and expect the first to fail. Treat the collapse as the fun part.
    - need: writing
      tip: Algorithms can be arrow cards laid on the floor instead of written words.
    - need: attention
      tip: Use a timer. Five minutes to build, one minute to test, then talk.
  stretch:
    - Design a paper bridge that holds 30 coins over a wider gap. Record every version and what changed.
together:
  - problem: d2
    how: Use play money. Lay out the $12, then pay for each item as your child plans.
  - problem: b1
    how: Draw the grid on paper and move a coin as your child reads each step aloud.
