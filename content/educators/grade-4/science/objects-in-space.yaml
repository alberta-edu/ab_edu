id: objects-in-space
subject: science
why: The night sky is the biggest thing a child can observe for free. Learning what is up there, how to look safely and what tools reveal helps them place Earth, and themselves, in the universe.
hook:
  title: Where do the stars go?
  time: 5 minutes
  covers: [K1.3]
  body: |-
    1. On a sunny day, ask: **"Are there stars in the sky right now?"**
    2. Let your child argue it either way, with a reason.
    3. Then ask: **"How could we find out?"** Plan to look again tonight.
activities:
  - title: Day and night sky log
    time: 10 minutes, twice in one day
    materials: Paper, a pencil, a clear day and night
    covers: [S1.1, S1.2, K1.3]
    steps:
      - In the daytime, look for the Moon. Never look at the Sun. Record the time and where the Moon is.
      - After dark, go out again. Record the Moon, bright stars and any very bright object that doesn’t twinkle.
      - Compare the two logs. What could you see both times? What only showed up at night?
  - title: Pinhole Sun viewer
    time: 15 minutes
    materials: Two pieces of stiff white card, a pin, aluminum foil, tape
    covers: [K1.5, S1.1]
    steps:
      - Cut a small square in one card, tape foil over it, and poke one tiny pinhole in the foil.
      - Stand with your back to the Sun. Hold the pinhole card up so its light falls on the second card.
      - Look only at the second card. The bright dot is an image of the Sun, viewed safely.
questions:
  - Is the Sun a star? How is it different from the stars we see at night?
  - Why can’t we see stars in the daytime?
  - What would you want to look at with a telescope? Why?
  - Why is it unsafe to look at the Sun, even with sunglasses?
  - What is the biggest thing you can think of? Is it part of the universe?
misconceptions:
  - thought: '"Stars disappear in the daytime."'
    why: You only ever see them at night.
    tryThis: Run the noon-to-night experiment, then look for the first star in the evening and notice where it was all along.
  - thought: '"The Moon only comes out at night."'
    why: Picture books always show the Moon in a night sky.
    tryThis: Check a Moon calendar for a morning when the Moon is up, then go look for it together.
  - thought: '"Sunglasses make it safe to look at the Sun."'
    why: Sunglasses make bright days comfortable, so they seem like protection.
    tryThis: Explain that the Sun can harm eyes without pain, and show the pinhole viewer as the safe way.
lookFor:
  - They name the Sun as a star, and Earth as a planet that has a moon.
  - They explain daytime starlessness by the bright sky, not by stars leaving.
  - They stop a friend from looking at the Sun, and suggest a safe method.
adapt:
  support:
    - Start with just three words, star, planet and moon, before talking about the universe.
    - Use a lamp, a ball and a marble to show a star, a planet and a moon.
  access:
    - need: reading
      tip: The card sort and sky viewer can be done by listening and tapping. Read each card aloud first.
    - need: attention
      tip: Keep night observing short, ten minutes at most, and give your child one thing to find.
    - need: worry
      tip: If the dark is uneasy, watch from a lit window or porch. Bright stars and the Moon still show.
    - need: language
      tip: Draw a simple picture for each new word, and stick them on the fridge as a sky word wall.
  stretch:
    - Visit a planetarium, or use a free sky-chart app with an adult. Find one planet and one of its moons.
together:
  - problem: d1
    how: Use a lamp as the Sun, an orange as Jupiter and a grape as Io. Walk them around each other as you answer.
  - problem: d2
    how: Before reading the choices, ask your child what they think would appear in a dark sky at noon, and why.
