id: sun-and-water
subject: science
why: Sunlight and water are the two things nearly all life depends on. Children learn why the world’s climates differ, and why caring for water is a responsibility shared by everyone.
hook:
  title: Flashlight on the floor
  time: 5 minutes
  covers: [K2.2]
  body: |-
    1. In a dim room, shine a flashlight straight down onto the floor. Trace the bright spot with your finger.
    2. Now tilt it, from the same height. Ask: **"What changed about the spot? Which spot is brighter?"**
    3. Then: **"Where on Earth might the Sun be like the first spot?"**
activities:
  - title: Sun and shade
    time: 15 minutes over a sunny day
    materials: Two identical dark cups of water, a kitchen thermometer if you have one
    covers: [K2.1, U2.1, S2.1]
    steps:
      - Put one cup in the sun and one in the shade. Your child predicts which will be warmer in an hour.
      - Check with a thermometer or a fingertip. Then watch for animals and insects in sun and shade.
      - 'Ask: "Which animals were in the sun? Why might they want its warmth?"'
  - title: A water walk
    time: 20 minutes
    materials: A walk to a creek, pond, river or wetland, and a notebook
    covers: [S3.2, S3.3, K3.2]
    steps:
      - Stay on the path and away from the edge. List every plant and animal you see in or near the water.
      - Pick up any litter you can safely reach, with gloves.
      - At home, talk about who depends on that water, from the smallest bugs to people downstream.
questions:
  - Why do you think it is warm all year near the equator?
  - What would happen to a garden if it got sunshine but no water? Water but no sunshine?
  - How do you know summer sunlight in Alberta is more direct than winter sunlight?
  - Who uses the water in the river nearest you, before and after you?
  - What could your family do this week to show respect for water?
misconceptions:
  - thought: '"The equator is warmer because it is closer to the Sun."'
    why: Being close to a fire makes you warmer, so this seems sensible.
    tryThis: Use the flashlight test. The distance stays the same, yet the slanted spot is dimmer.
  - thought: '"Plants get everything they need from sunlight."'
    why: Children often hear that plants need sun to grow.
    tryThis: Grow two seeds, one watered and one not, in the same sunny window.
  - thought: '"Water is only important for drinking."'
    why: Drinking is the use children know best.
    tryThis: List animals that live, lay eggs or hide in water. Count how many need water as a home, not only a drink.
lookFor:
  - They explain the warmth of the equator with direct light, not distance.
  - They name water as a habitat as well as something to drink.
  - They suggest a real, small action to protect local water.
adapt:
  support:
    - Do the flashlight test first, then the virtual experiment. Hands first, screen second.
    - Talk about one local body of water your child knows before talking about water in general.
  access:
    - need: reading
      tip: Read the comparison cards aloud and let your child point to the matching picture.
    - need: language
      tip: Use your hands to show direct (palm flat under a fist) and slanted (palm tilted). Say each word as you do it.
    - need: hands
      tip: Tape the flashlight to a book at each angle, so your child only has to switch it on.
    - need: worry
      tip: Keep talk about water problems hopeful, and end with something your family will do to help.
  stretch:
    - Find out the names of the river or lake closest to you, and one plant and one animal that live there.
together:
  - problem: d1
    how: Try it with a real flashlight on graph paper first. Count the squares together.
  - problem: d2
    how: 'Ask your child to list everyone and everything that uses the creek. Then ask: "So whose job is it?"'
