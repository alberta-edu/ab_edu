id: structures-functions
subject: science
why: Asking "what is this part for?" turns every plant and animal into a puzzle with clues. Children learn to read a body like evidence, and to treat living things with respect while they look.
hook:
  title: Mystery tools
  time: 5 minutes
  covers: [K1.3, K1.5]
  body: |-
    1. Lay out kitchen tools: tweezers, a spoon, a straw, a nutcracker or pliers.
    2. Ask: **"What job is each one shaped for? How can you tell?"**
    3. Then ask: **"Do animals have body parts like these?"** Leave the question open.
activities:
  - title: Beak buffet
    time: 20 minutes
    materials: Tweezers, a spoon, a straw, clothespins, and "foods" like rice, water in a tall glass and gummy worms in a cup of dry cereal
    covers: [S1.4, K1.5, K1.4]
    steps:
      - Each tool is a beak. Predict which beak will gather the most of each food in 30 seconds.
      - Take turns, then count. Record the results in a table.
      - 'Ask: "Which bird would have a beak like the winner? What would happen if it had to eat something else?"'
  - title: Backyard structure hunt
    time: 20 minutes
    materials: A notebook and a pencil, outside
    covers: [S1.1, S1.2, S1.3, S1.5]
    steps:
      - Find three plants and, if you can, three animals or insects. Watch animals only from a distance.
      - Draw one structure of each and write its job.
      - Sort your drawings two different ways, such as by habitat and by structure.
questions:
  - What do you think this part is for? What makes you think so?
  - Why might a bird that eats seeds have a different beak from one that drinks nectar?
  - How is a rose’s thorn like a porcupine’s quill? How is it different?
  - Can you sort these animals in a different way than I did?
  - How can we look closely at animals without disturbing them?
misconceptions:
  - thought: '"Plants don’t have structures with jobs. They just sit there."'
    why: Plants don’t move around, so they can seem passive.
    tryThis: Look closely at a plant together and name a job for every part you find, from roots to seeds.
  - thought: '"There is only one right way to sort animals."'
    why: Charts and books usually show one fixed set of groups.
    tryThis: Sort the same animal pictures twice, by habitat and by body covering. Ask whether both ways are useful.
  - thought: '"Every animal part is for eating or moving."'
    why: Eating and moving are the jobs children notice most.
    tryThis: Look for parts that protect (shells, quills) and parts that sense (ears, whiskers).
lookFor:
  - They name a function for a structure they haven’t seen before, and give a reason.
  - They notice the same function in a plant and an animal.
  - They watch animals calmly from a distance, without being reminded.
adapt:
  support:
    - Start with the four animal functions only. Bring in plants and reproducing later.
    - Use real objects, like a pine cone, a feather or a leaf, before pictures.
  access:
    - need: reading
      tip: Read the card sort aloud. Your child can act out each structure before choosing.
    - need: hands
      tip: Swap tweezers for larger tongs in the beak buffet, and let your child direct you if gripping is hard.
    - need: language
      tip: Pair structure with "part" and function with "job". Ask "What part? What job?" every time.
    - need: attention
      tip: Treat each animal as a mystery. Give one clue at a time and let your child guess before the next clue.
  stretch:
    - Invent an animal for a made-up habitat, like a sticky swamp. Draw it and label three structures with their jobs.
together:
  - problem: d1
    how: Read one clue at a time and let your child guess the animal after each one. Did they change their mind?
  - problem: d2
    how: Try opening a real pine cone scale with a straw and then with crossed fingers or tweezers.
