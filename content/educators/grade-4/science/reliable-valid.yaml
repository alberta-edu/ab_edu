id: reliable-valid
subject: science
why: Children learn to ask "Would it happen again?" and "Did we measure the right thing?" These two questions protect them from flukes and from claims built on careless measuring.
hook:
  title: Flip it once
  time: 5 minutes
  covers: [K2.1, K2.2]
  body: |-
    1. Flip a coin once. If it lands heads, announce: **"This coin always lands heads!"**
    2. Ask your child whether they believe you. How could they check?
    3. Flip it ten more times together, and talk about what changed their mind.
activities:
  - title: Five trials
    time: 20 minutes
    materials: A toy car, a book for a ramp, a measuring tape
    covers: [S2.1, K2.2, K2.4, S2.3]
    steps:
      - Roll the car down the ramp and measure how far it goes, from the bottom of the ramp.
      - Do it five times the same way. Record every result.
      - Ask, "Are they close? Would one trial have been enough to trust?"
  - title: Measure-off
    time: 15 minutes
    materials: A ruler, a measuring tape, and something to measure, like a table
    covers: [K2.3, K2.4, S2.4, S2.5]
    steps:
      - Each person measures the table, first with hand spans and then with the tape.
      - Compare results. Whose hand spans agreed? Whose tape numbers agreed?
      - Talk about which tool made the data more accurate, and why.
questions:
  - Why do scientists repeat tests instead of doing them once?
  - Can something be measured the same way every time and still be wrong?
  - Which tool would you use to measure how warm the bathwater is? Why?
  - If your friend gets a different result, who is right? How could you find out?
  - How sure can you be after one test? After five?
misconceptions:
  - thought: '"One careful test is enough."'
    why: A careful test feels trustworthy.
    tryThis: Do one trial, then four more. Notice that even careful trials differ a little.
  - thought: '"If results aren’t exactly the same, the experiment failed."'
    why: Children expect science to give one perfect number.
    tryThis: Look at the five car trials. Close but different is normal, and it is still reliable.
  - thought: '"If I get the same number every time, it must be right."'
    why: Consistency feels like correctness.
    tryThis: Measure a plant from the table five times. Same number, still wrong, because it includes the pot.
lookFor:
  - They ask for more trials before trusting a result.
  - They check where a measurement starts and ends.
  - They choose a measuring tool over a guess or a body part.
adapt:
  support:
    - Start with one idea, repeating trials, before talking about validity.
    - Use big, easy-to-read tools, like a metre stick with clear centimetre marks.
  access:
    - need: hands
      tip: Tape the measuring tape to the floor so your child only has to read it.
    - need: reading
      tip: Read results aloud as you record them, and point to each number in the table.
    - need: worry
      tip: Different results are normal. Treat them as clues, not mistakes.
    - need: language
      tip: Reliable means you can rely on it. Valid means it measures what you meant. Link each word to its everyday meaning.
  stretch:
    - Plan a test with three ramp heights and five trials each. Decide how you will check that the data is reliable and valid.
together:
  - problem: d1
    how: Act out Kai’s test with footsteps and with a tape. Compare the two sets of numbers.
  - problem: d2
    how: Cover the conclusions. Ask your child to write the biggest claim the table supports, then compare with the choices.
