id: fur-trade
subject: social-studies
why: This topic shows a child that a trade works when each side gets what it is short of. It also shows that many peoples, and many women, made the fur trade work.
hook:
  title: Swap shop
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    1. Give your child a big pile of one thing, such as 10 crackers. You keep one apple.
    2. Ask: **"How many crackers would you give for my apple?"**
    3. Then swap roles: you have 10 apples, they have one cracker.
    4. Ask: **"Why did the price change?"** Link it to furs in Europe and kettles in North America.
activities:
  - title: Trading post at the table
    time: 15 minutes
    materials: 12 buttons as made beaver, and a few household objects as goods, with price cards
    covers: [S1.1, K1.2]
    steps:
      - Set out the goods with prices in made beaver. Your child is the trapper, with 12 buttons.
      - They choose what to take home. Ask what they had to give up.
      - Open a rival post with lower prices on two goods, and play again.
      - 'Ask: "Which post did you go to? What will the first post do now?"'
  - title: Who did what?
    time: 10 minutes
    materials: Paper and crayons
    covers: [K1.4, K1.5]
    steps:
      - Your child draws four jobs from the fur trade, one in each corner of the page.
      - In the middle, they draw a woman who links two groups, such as Thanadelthur.
      - 'Ask: "Which job could the trade do without? Which could it not?"'
questions:
  - Why is something worth more where there is little of it?
  - What would you want if you lived far from any store?
  - Why would two companies race to build posts farther west?
  - Who knew the land and the languages best, and why did that matter?
  - Is there a place near you that grew from a trading post?
misconceptions:
  - thought: '"Europeans did the real work of the fur trade."'
    why: Many stories focus on the companies and their forts.
    tryThis: Sort the jobs together and ask who did each one. Then talk about guides, interpreters and women go-betweens.
  - thought: '"A trade means one side gets cheated."'
    why: In games, someone usually wins and someone loses.
    tryThis: 'Play the swap shop. After each swap, ask both players: "Are you glad you traded?"'
  - thought: '"Competition is always bad."'
    why: Children hear that sharing is good and competing is selfish.
    tryThis: Play the rival posts game. Ask who got the better deal when two posts competed.
lookFor:
  - They explain that goods moved to where they were scarce.
  - They work out a trade in made beaver, using simple subtraction.
  - They name a role and the people who did it, including women as go-betweens.
adapt:
  support:
    - Use real buttons as made beaver and count each trade out loud.
    - Start with the ocean model before the trading post, so the why comes first.
    - Name just two jobs to begin with, a trapper and a voyageur.
  access:
    - need: reading
      tip: Read the price table and Thanadelthur’s story aloud. The models need almost no reading.
    - need: attention
      tip: Give each visual one mission, such as “buy a kettle and an axe”, before free play.
    - need: language
      tip: Act out barter with real objects. Say “scarce” while holding one thing, and “plenty” while holding many.
    - need: hands
      tip: Your child can tell you which goods to buy while you tap or move the buttons.
  stretch:
    - Find out which First Nations traded at a post near where you live.
    - Look up the Hudson’s Bay Company today. What does it have in common with the old company?
together:
  - problem: d1
    how: Play the two posts with buttons. Let your child be Amelia and choose where to trade, then play the company that has to respond.
  - problem: d2
    how: Read Max’s words in a big, sure voice. Ask your child to be the historian who politely proves him wrong.
