id: loyalists-new-borders
subject: social-studies
why: This topic shows a child that borders are drawn by people, often because of who moves where. Newcomers, from Loyalists to freedom seekers, changed the country, and governments changed in response.
hook:
  title: Who sits where?
  time: 5 minutes
  covers: [S2.2, K2.4]
  body: |-
    1. Set out two chairs for a family vote on dinner. Two people want pasta, one wants soup.
    2. Bring in three “newcomers” (stuffed animals) who all want soup. Vote again.
    3. Ask: **"What changed? Is it fair? Should we split into two tables?"**
    4. Tell your child this is what happened to Quebec when the Loyalists came.
activities:
  - title: Map detective
    time: 10 minutes
    materials: The lesson’s border map and paper
    covers: [S2.1, K2.2, K2.4]
    steps:
      - Your child taps 1774, 1783, 1791 and 1841 in turn.
      - For each change, they write or say one sentence about what moved, split or joined.
      - 'Ask: "Which change was caused by people moving? Which by a war? Which by a rebellion?"'
  - title: A story of freedom
    time: 15 minutes
    materials: The railroad map, and a library book or trusted website about Harriet Tubman, Josiah Henson or Mary Ann Shadd
    covers: [S2.4, K2.7]
    steps:
      - Choose one person from the map together.
      - Read or watch their story. Note where they started, where they went and who helped them.
      - Your child retells the story with a drawn map, in their own words.
      - 'Ask: "What did they bring to the community where they settled?"'
questions:
  - Why would people leave their homes to stay loyal to a king?
  - When lots of new people move in, how might things change for the people already there?
  - Why would groups that disagree fight on the same side?
  - What made Canada a place of freedom for people escaping slavery?
  - Was it fair to give Canada East and Canada West the same number of seats? Why or why not?
misconceptions:
  - thought: '"The Underground Railroad was a train under the ground."'
    why: The name sounds like a real railway or subway.
    tryThis: Explain that it was people and hiding places. Ask why they might have used train words, such as stations and conductors, as a code.
  - thought: '"Canada never had slavery."'
    why: The lesson focuses on Canada as a place of freedom.
    tryThis: Tell your child that slavery was allowed in the British colonies here too, until Britain abolished it in 1833. That is why the date matters.
  - thought: '"Borders never change."'
    why: Today’s map looks fixed, and children rarely see it change.
    tryThis: Play the border map through 1774 to 1841 and count the changes together.
lookFor:
  - They link a group moving in with a change in borders or government.
  - They name at least three groups who fought together in 1812, and why.
  - They retell one Underground Railroad story with a start, a journey and an end.
adapt:
  support:
    - Use only two map years at a time, and name one change.
    - Use toy figures to act out Loyalists arriving and Quebec splitting.
    - Tell one Underground Railroad story only, start to finish.
  access:
    - need: reading
      tip: Read the story cards on the maps aloud. The maps carry the changes with colour.
    - need: writing
      tip: The freedom story can be retold by drawing a map with arrows instead of writing.
    - need: worry
      tip: Slavery and war are hard topics. Focus on the courage of the people and the help they gave each other.
    - need: language
      tip: Keep a picture list of Loyalist, border, rebellion and union, each with a quick sketch.
  stretch:
    - Find out whether Loyalists, Great Migration families or freedom seekers settled near you.
    - Compare the War of 1812 from a First Nations point of view and a British one. What did each hope to gain?
together:
  - problem: d1
    how: Use buttons as people, with 7 on one side and 5 on the other, and give each side the same 3 cups as seats. Ask how many people share each cup.
  - problem: b4
    how: Read the 1850 law aloud first. Then look at the railroad map and trace Harriet Tubman’s route with a finger.
