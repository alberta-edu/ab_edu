id: french-to-british
subject: social-studies
why: This topic shows a child that a decision made far away can change daily life, and that one law can feel fair to one group and unfair to another. It also shows that laws from long ago still matter.
hook:
  title: New rules at breakfast
  time: 5 minutes
  covers: [K1.5, U1.1]
  body: |-
    1. At breakfast, announce: **"From today, a family across the street makes our house rules."**
    2. Read out two new rules: only their cereal, and only their language at the table.
    3. Ask: **"You still live here. What changed? What would you want to keep?"**
    4. Explain that this is close to what French colonists faced after 1763.
activities:
  - title: Three chairs, two laws
    time: 15 minutes
    materials: Three chairs labelled First Nations, French colonists and British colonists
    covers: [K1.8, K1.9]
    steps:
      - Open the law lens on the Royal Proclamation. Your child sits in each chair and reads that group’s cards.
      - In each chair, they give a thumbs up, down or sideways, and say why.
      - Switch to the Quebec Act and do it again.
      - 'Ask: "Which chair changed its thumb the most? Why?"'
  - title: Map flip book
    time: 10 minutes
    materials: Three sheets of paper and crayons
    covers: [S1.4, K1.4]
    steps:
      - Your child traces or sketches the 1713, 1763 and 1774 maps, one per page, colouring French and British areas.
      - Flip through them in order, like a cartoon.
      - 'Ask: "What caused each change: a war, a treaty or an act?"'
questions:
  - If a treaty is signed far away, why would it change life on a farm in Quebec?
  - What would you want to keep if your town got new rulers?
  - Why would a law that pleased French colonists anger people in the Thirteen Colonies?
  - Why do First Nations still talk about a law from 1763?
  - How many languages do you hear in your community? Why might that matter?
misconceptions:
  - thought: '"When Britain took over, the French colonists all left."'
    why: Maps change colour all at once, so it looks as if the people changed too.
    tryThis: Read the farmer’s note in problem b1, and ask what stayed the same for him. Adults may want to know that from 1755, the British forced many Acadians from their homes.
  - thought: '"The Royal Proclamation is just old history."'
    why: Anything from the 1700s sounds finished.
    tryThis: Ask whether any rules from long ago still shape your family, such as a recipe or a holiday. Then talk about treaties today.
  - thought: '"A law is either good or bad."'
    why: Children are used to rules that are simply right or wrong.
    tryThis: Use the law lens to find one law that pleased one group and angered another.
lookFor:
  - They name a treaty or act and what it changed on the map.
  - They describe one law from two groups’ points of view.
  - They link the Quebec Act to French in Canada today.
adapt:
  support:
    - Start with just two years on the map, 1713 and 1763.
    - Use the law lens one group at a time, starting with French colonists.
    - Make a simple cause-and-change chart with two columns.
  access:
    - need: reading
      tip: Read the law lens cards aloud in the voice of each group. The map shows most of the change without words.
    - need: writing
      tip: Your child can point and talk through the flip book instead of writing.
    - need: language
      tip: Keep a word wall of treaty, act, proclamation and Crown, each with a small drawing.
    - need: worry
      tip: Some stories here are about losing power or land. Say that people disagreed, and that their voices still matter today.
  stretch:
    - Find a French place name near you. Who named it, and when?
    - Look up which treaty covers the land where you live.
together:
  - problem: d1
    how: Use the three-chairs activity first, then read each choice aloud and ask which chair would say it.
  - problem: d2
    how: |-
      - Play the company and let your child speak for the First Nation.
      - Ask, "What would the Royal Proclamation say to the company?"
