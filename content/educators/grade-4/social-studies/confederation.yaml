id: confederation
subject: social-studies
why: This topic shows a child that a country is a deal people worked out, with give and take. People can disagree about a plan for good reasons.
hook:
  title: Should we join?
  time: 5 minutes
  covers: [S1.1, S1.2]
  body: |-
    1. Suggest that your family and a neighbour’s family share one car, one garden and one set of rules.
    2. Ask your child for one good reason to join, and one worry.
    3. Ask: **"What would you need in the deal before you said yes?"**
    4. Tell them colonies asked the same questions before 1867.
activities:
  - title: Family election
    time: 15 minutes
    materials: Slips of paper, a bowl and three made-up parties
    covers: [K1.6]
    steps:
      - Split the house into “ridings”, such as the kitchen, the living room and the bedrooms.
      - Each riding votes for one MP from three made-up parties.
      - Count the MPs. The party with the most picks a leader, who becomes prime minister.
      - Someone plays the Governor General and asks the leader to form the government.
  - title: Two voices
    time: 10 minutes
    materials: Two hats or name cards, Cartier and Dorion
    covers: [S1.2]
    steps:
      - Your child wears Cartier’s hat and argues for Confederation.
      - Then they switch to Dorion’s hat and argue against it.
      - 'Ask: "Which hat was easier to wear? Did both have good reasons?"'
questions:
  - Why would small colonies want to join together?
  - What would you want to protect before agreeing to a big deal?
  - Why did some French speakers like Confederation, and others fear it?
  - Who is your MP? What riding do you live in?
  - What in our government today comes from 1867?
misconceptions:
  - thought: '"The prime minister is the boss of the whole country, like a king."'
    why: The prime minister is the face of the government on the news.
    tryThis: Run the family election twice. Show that a different result means a different prime minister, but the Governor General still represents the Crown.
  - thought: '"All French speakers were against Confederation."'
    why: Stories often split history into two sides.
    tryThis: Sort the four leaders in the lesson. Point out that Cartier, a Francophone, helped make it happen.
  - thought: '"Canada had all its provinces in 1867."'
    why: Today’s map is the only one they know.
    tryThis: Compare the 1867 map with a map of Canada today. Count how many provinces and territories joined later.
lookFor:
  - They give a reason the colonies joined, such as defence or a railroad.
  - They describe one Francophone and one Anglophone view.
  - They explain how a prime minister is chosen.
adapt:
  support:
    - Start with the map and just the four provinces of 1867.
    - Play the election visual with your child before reading the roles table.
    - Use two reasons only to begin, defence and the railroad.
  access:
    - need: reading
      tip: Read the four leaders’ cards aloud in different voices. The election visual needs no reading.
    - need: writing
      tip: The family election can be tallied with blocks or buttons instead of writing.
    - need: attention
      tip: Hold several quick elections in a row. Each new result keeps the idea fresh.
    - need: language
      tip: Say the role names with gestures, such as a hand on the heart for MP, a crown for the Governor General and pointing ahead for the prime minister.
  stretch:
    - Find out who your MP is, and what riding you live in.
    - Look up when Alberta joined Canada. What had to happen first?
together:
  - problem: d1
    how: Use 65 red and 116 blue counters, or just draw two bars. Ask which side would win a vote.
  - problem: b2
    how: Wear Dorion’s hat first, then read the question together.
