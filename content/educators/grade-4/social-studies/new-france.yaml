id: new-france
subject: social-studies
why: This topic shows a child that moving to a new place is a mix of hope and hardship, and that newcomers both gain and give. It also asks who benefits when one place makes the rules for another.
hook:
  title: What would you pack?
  time: 5 minutes
  covers: [K1.5, K1.6]
  body: |-
    1. Tell your child: **"You are sailing to New France in 1640. There is no store there. You can bring one trunk."**
    2. They name five things to pack.
    3. Ask: **"Why are you going? What will be hardest?"**
    4. Later, compare their trunk with what the lesson says colonists brought.
activities:
  - title: Ships both ways
    time: 10 minutes
    materials: Two boxes or bowls as ships, and small slips of paper
    covers: [K1.7, S1.3]
    steps:
      - Label one end of the table France and the other New France.
      - Your child writes or draws furs, lumber, wheat, minerals, tools, cloth, settlers and the king’s orders on slips.
      - They load each ship and sail it to the right side.
      - 'Ask: "Which side got richer? Which side made the rules?"'
  - title: The first winter
    time: 10 minutes
    materials: 28 buttons, coins or dried beans
    covers: [S1.1, S1.2]
    steps:
      - Lay out 28 buttons as Champlain’s men at Quebec.
      - Take away 20, one at a time, as you talk about scurvy and the cold.
      - 'Look at the 8 left. Ask: "Would you stay, or go home? What would help next winter?"'
questions:
  - Why do you think settlers chose to live right by the river?
  - What would be hardest about your first winter in New France?
  - If you moved far away, what would you bring that you can’t buy there?
  - Who decided the rules for New France? Was that fair to the colonists?
  - Whose land was New France built on?
misconceptions:
  - thought: '"Everyone came to New France for adventure."'
    why: Adventure is the exciting part of every explorer story.
    tryThis: Read the five reasons in the card sort together. Ask which one a farming family would care about most.
  - thought: '"The colony and France were equals."'
    why: They traded with each other, and trade sounds equal.
    tryThis: 'Ask: "Who could say no to the other?" Then think about the king’s rules.'
  - thought: '"New France was empty land."'
    why: Old maps coloured whole areas as one country.
    tryThis: Point out that Champlain needed allies to survive. Ask whose homes were already there.
lookFor:
  - They name a reason for coming and a challenge that came with it.
  - They sort goods by which way they crossed the ocean.
  - They say the home country made the rules for the colony.
adapt:
  support:
    - Use the settlements map with Play, and name just the four towns in order.
    - Start the card sort with only farmland and adventure, then add the others.
    - Use real objects for furs, lumber and tools in the ships game.
  access:
    - need: reading
      tip: Read the made-up letter and the card-sort cards aloud. The maps and the people figure need no reading.
    - need: attention
      tip: Do the ships game standing up, with your child carrying each slip across the room.
    - need: language
      tip: Point to real things for natural resource, such as wood, a fur hat or a stone, as you say the words.
    - need: hands
      tip: Your child can tell you where each card goes while you tap it on the screen.
    - need: worry
      tip: The first-winter figure is sad. Tell your child that people learned to cure scurvy with fresh food, and the colony grew.
  stretch:
    - Find the oldest building or place near you. Who built it, and why there?
    - Compare New France and the Thirteen Colonies. Why might one have grown faster?
together:
  - problem: d1
    how: |-
      - Play the king, and let your child play a colonist with furs to sell.
      - Say no to the better price, then ask how that feels.
  - problem: b2
    how: Read the letter aloud as the writer. Ask your child what the writer is most proud of.
