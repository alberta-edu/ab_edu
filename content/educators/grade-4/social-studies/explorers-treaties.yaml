id: explorers-treaties
subject: social-studies
why: This topic shows a child that every story has more than one side. A claim made by one side alone is not the same as an agreement, and the people already living on the land had their own view.
hook:
  title: The flag in the sandbox
  time: 5 minutes
  covers: [K1.1, S1.2]
  body: |-
    1. Your child builds something small with blocks or toys on the floor.
    2. You walk up, stick a sticky note on it with your own name, and say, **"I claim this for my kingdom!"**
    3. Wait for the reaction. Ask: **"Does my note make it mine? What would make it fair?"**
    4. Tell them that this is close to what happened when explorers arrived.
activities:
  - title: Two rows on the table
    time: 10 minutes
    materials: Two strips of dark paper, a white tablecloth or sheet, and two small toy boats or cups
    covers: [K1.2, S1.2]
    steps:
      - Lay the two dark strips side by side on the white cloth, with a gap between them.
      - Your child puts one boat on each strip. Each boat gets a name and a few things it carries, such as songs, rules or food.
      - Slide both boats along their strips together. Then try to steer one boat into the other’s strip.
      - 'Ask: "What happened? What would each boat need to promise, to travel in peace?"'
  - title: Explorer detective
    time: 15 minutes
    materials: The lesson map and a sheet of paper
    covers: [S1.3, K1.1]
    steps:
      - Your child chooses one explorer on the map and watches the voyage twice.
      - They answer five questions on paper, with a drawing or words. Who? When? Where? Who did they meet? What happened?
      - 'Add a sixth question together: "Whose record are we reading, and what might it leave out?"'
questions:
  - Why would a king pay for a long, dangerous voyage? What did he hope to get back?
  - If a stranger put a flag in your yard, would the yard become theirs? Why not?
  - What did First Nations people know that the explorers needed?
  - What makes an agreement fair for both sides?
  - Why might the Haudenosaunee record a promise in beads, not on paper?
misconceptions:
  - thought: '"The explorers discovered Canada."'
    why: Older books and some place names tell the story that way.
    tryThis: 'Ask: "Who was already there to meet Cartier at Gaspé?" Then ask what “discover” means if someone already lives there.'
  - thought: '"Explorers only came for gold."'
    why: Treasure is the exciting part of every adventure story.
    tryThis: Sort the reasons together into land, riches and fame. Ask which one a king would brag about at a feast.
  - thought: '"A treaty means one side wins."'
    why: In games, an agreement often ends a fight that someone won.
    tryThis: Play out the Two Row. Ask whether either boat lost anything by travelling side by side.
lookFor:
  - They name territory, resources or prestige as a reason, and give an example.
  - They say that people already lived where the explorers went.
  - They explain the Two Row with their own picture of two boats.
adapt:
  support:
    - Start with one explorer only. Watch the voyage and name just the start and the end.
    - Use three cups labelled land, riches and fame, and drop each reason into a cup.
    - Act out a short trade with real objects before talking about relationships.
  access:
    - need: reading
      tip: Read the clue lists and the Gaspé story aloud. The map and the belt carry most of the ideas without words.
    - need: writing
      tip: For the explorer detective, your child can answer with drawings or tell you the answers while you write.
    - need: attention
      tip: Give the map one job at a time, such as “find where Cartier turned back”, rather than free exploring.
    - need: language
      tip: Words such as territory, prestige and treaty are easier with a gesture. Sweep an arm for land, rub fingers for riches, stand tall for fame.
    - need: worry
      tip: The Gaspé story is about a disagreement, not a fight. Say up front that people still talk about it today.
  stretch:
    - Find out what First Nations lived where you live now. Is there a treaty for your land?
    - Compare two explorers. Which one depended more on First Nations help, and how can you tell?
together:
  - problem: d1
    how: |-
      - Read the Gaspé story in two voices, Cartier’s and Donnacona’s.
      - Before the choices, ask, "What did each man want?"
  - problem: b4
    how: Use the two-boat activity first. Then read the captain’s words and ask your child to answer as the canoe.
