id: rights-responsibilities
subject: social-studies
why: This topic shows a child that rights are not just things you get. They stay safe only when everyone, including them, does their part.
hook:
  title: “It’s my right!”
  time: 5 minutes
  covers: [U1.1, S1.2]
  body: |-
    1. Next time your child says “It’s my right!”, agree: **"You’re right, it is."**
    2. Then ask: **"Does your brother (or friend, or classmate) have the same right?"**
    3. Ask: **"So what do you have to do, to keep that right safe for both of you?"**
    4. Name it together: that is a responsibility.
activities:
  - title: Rights and responsibilities chain
    time: 15 minutes
    materials: Paper strips, tape and two colours of markers
    covers: [S1.1, S1.2]
    steps:
      - In one colour, your child writes or draws rights they have at home, at school and in the community.
      - In the other colour, they write the responsibility that goes with each right.
      - Link each right to its responsibility, and tape the links into a paper chain.
      - 'Ask: "What happens to the chain if one responsibility link breaks?"'
  - title: Fix the rule
    time: 10 minutes
    materials: Paper and a pencil
    covers: [S1.3, K1.1]
    steps:
      - Make up an unfair rule together, such as “Only kids with blue shoes can use the slide.”
      - Your child says which right it breaks, and who is hurt.
      - They rewrite the rule so that everyone is treated equally.
questions:
  - What is one right you have at school? What is the responsibility that goes with it?
  - Why should you care if someone else is treated unfairly?
  - How do you contribute to your community?
  - Why do you think voting is a responsibility, and not just a right?
  - Can you think of a time someone protected your rights?
misconceptions:
  - thought: '"Rights mean I can do whatever I want."'
    why: The word “right” sounds like permission to do anything.
    tryThis: Play the rights scale together. Ask what happens to everyone else’s rights if one person does whatever they want.
  - thought: '"Responsibilities are only for grown-ups."'
    why: Children hear about voting and jobs, which are adult things.
    tryThis: List three responsibilities your child already carries out, such as helping at home or including a classmate.
  - thought: '"If it doesn’t happen to me, it’s not my problem."'
    why: Children naturally think first about themselves.
    tryThis: Work through the hockey team example. Ask who could be left out next time.
lookFor:
  - They pair a right with a responsibility, in their own life.
  - They give a reason to protect someone else’s rights.
  - They name contributing, respecting others’ rights and voting as responsibilities.
adapt:
  support:
    - Start with just one right, being treated equally, and act out a fair and an unfair game.
    - Use the two-colour chain with drawings instead of words.
    - Name responsibilities as “jobs” first, then use the real word.
  access:
    - need: reading
      tip: Read the scale’s choices aloud. Your child can point to their answer.
    - need: writing
      tip: The chain links can be drawings, or words you write as your child tells you.
    - need: worry
      tip: Being left out can be a painful topic. Keep the examples made up, and let your child choose whether to share their own.
    - need: language
      tip: Use two gestures, open hands for “a right I have” and rolling up sleeves for “a responsibility I do”.
  stretch:
    - Ask an adult who votes why they vote, and what they do to learn about the choices.
    - Find one way your family could contribute to your community this month, and do it.
together:
  - problem: d1
    how: |-
      - Read the art club rule aloud, then pause.
      - Ask your child how Sam might feel, and how Maya might feel, before looking at the choices.
  - problem: b1
    how: Act out Arjun talking over everyone, with your child as another student. Then ask what Arjun forgot.
