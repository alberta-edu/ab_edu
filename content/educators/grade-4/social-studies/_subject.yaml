subject: social-studies
promise: |-
  We hope your child comes to see Canada as a story still being written, by many peoples.

  - Dates and names are one search away.
  - Asking whose story this is, and who agreed to it, is a skill for life.
shifts:
  - instead: Telling the story of Canada from one side only.
    tryThis: 'Asking how each group saw the same moment: First Nations, Métis, French colonists, British colonists and newcomers. Who gained? Who lost?'
  - instead: Memorizing the years of treaties and acts.
    tryThis: Looking at what changed on the map, and how daily life changed for real people. A year matters because of what it changed.
  - instead: Saying explorers “discovered” empty land.
    tryThis: Remembering that every place on the map was already home to First Nations or Inuit. Ask what they thought of the newcomers.
  - instead: Treating rights as things you just get.
    tryThis: Pairing every right with the responsibility that protects it, at home, at school and in the community.
routines:
  - name: Whose story is this?
    time: 5 minutes
    how: Read any account together, from a history book, a plaque or the news. Ask who told it, who isn’t in it, and how they might tell it.
  - name: Then the map changed
    time: 10 minutes
    how: |-
      1. Pick two years on the lesson’s border map.
      2. Your child finds what changed.
      3. Ask what changed for a family living there, then for a First Nation living there.
  - name: Same moment, two seats
    time: 10 minutes
    how: |-
      1. Choose an event, such as a treaty or Confederation.
      2. Your child speaks as two different people who were there.
      3. Ask what each one hoped for and feared.
  - name: Right and responsibility
    time: 5 minutes
    how: 'When your child says “It’s my right!”, smile and ask: “And what’s the responsibility that comes with it?”'
assess:
  - They ask who made a claim or a record before they trust it.
  - They describe one event from two groups’ points of view.
  - They explain a change on a map with a cause, such as a war, a treaty or an act.
  - They match a right with a responsibility that protects it.
sources:
  - label: 'Peter Seixas and Tom Morton: The Big Six Historical Thinking Concepts'
    url: https://school.nelson.com/the-big-six-historical-thinking-concepts/
  - label: 'Amy von Heyking: historical thinking in the elementary years'
    url: https://www.thenhier.ca/en/content/von-heyking-amy-%E2%80%9Chistorical-thinking-elementary-years%E2%80%9D-2008-0.html
  - label: 'Library and Archives Canada: Canadian Confederation'
    url: https://www.collectionscanada.gc.ca/confederation/023001-1000-e.html
  - label: 'The Canadian Encyclopedia'
    url: https://www.thecanadianencyclopedia.ca/en
