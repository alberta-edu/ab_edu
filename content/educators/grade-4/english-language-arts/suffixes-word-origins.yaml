id: suffixes-word-origins
subject: english-language-arts
why: A child learns to take an unfamiliar word apart and make a smart guess at its meaning, and finds that every word has a story of where it came from.
hook:
  title: Word surgery
  time: 5 minutes
  covers: [S2.1, S2.3]
  body: |-
    Write **unbreakable** on a sticky note, with no explanation.

    1. Ask: "Can you cut this word into pieces? What does each piece mean?"
    2. Then: "So what does the whole word mean?"
activities:
  - title: Suffix spinner
    time: 15 minutes
    materials: Two paper plates, a split pin, and a marker
    covers: [K2.1, S2.2]
    steps:
      - Write bases on one plate (help, wash, rain, red, cheer) and suffixes on the other (-y, -ish, -able, -ful).
      - Spin, and read the word you make.
      - Decide together if it is a real word, and what it means.
      - Check any you aren’t sure of in a dictionary.
  - title: Kitchen origins
    time: 15 minutes
    materials: Food packages and a dictionary that gives word origins, or an online one
    covers: [K2.2, S2.4]
    steps:
      - Pick five food words, such as hamburger, ketchup, yogurt and pasta.
      - Guess where each came from, then look it up.
      - Sort them into other languages, place names, brand names and so on.
  - title: New word detective
    time: 10 minutes
    materials: Any book
    covers: [S2.3, S2.1]
    steps:
      - When your child meets a new long word, stop.
      - They find the base and the suffix and predict the meaning.
      - Read the sentence again to check if the prediction fits.
questions:
  - What is the base? What does the suffix add?
  - Is that a real word? How could we check?
  - What do you think this new word means, from its parts?
  - Where do you think this word came from?
  - Does its origin explain how it is spelled?
misconceptions:
  - thought: '"Every suffix fits every base."'
    why: Building words feels like a game with no rules.
    tryThis: Build some silly ones together, like *snowish*, and check them. Real words are the ones people use.
  - thought: '"-ish makes a word stronger."'
    why: Children rarely hear *-ish* explained.
    tryThis: Compare *green* and *greenish* paint samples. Greenish is only a little green.
  - thought: '"All English words were always English."'
    why: Words like *kayak* and *moose* feel completely English.
    tryThis: Look up three everyday words together and find their origins.
lookFor:
  - They split a long word into base and suffix without being asked.
  - They predict a new word’s meaning, then check it in the sentence.
  - They notice when a built word isn’t real.
  - They get curious about where a word came from.
adapt:
  support:
    - Use only two suffixes at first, such as -ful and -able.
    - Write bases and suffixes on separate cards, and slide them together.
    - Give the frame "___ means ___, and ___ means ___, so the word means ___."
  access:
    - need: language
      tip: Words from other languages are a great chance to share. Does your child’s home language lend any words to English?
    - need: writing
      tip: Use letter tiles or cards to build words instead of writing them.
    - need: reading
      tip: Read the words aloud, and clap the base and suffix as two parts.
  stretch:
    - Find three words in your house that began as brand names.
    - Build a word with two suffixes, such as *help + ful + ness*, and explain it.
together:
  - problem: d1
    how: Cover the suffix with a finger and read the base. Then uncover it and put the meanings together.
  - problem: d2
    how: 'Ask: "Is the argument about zippers, or about the **word** zipper?" Then look for the fact about the word.'
