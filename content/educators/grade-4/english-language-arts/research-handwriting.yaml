id: research-handwriting
subject: english-language-arts
why: A child learns to find answers fairly, by asking a clear question, choosing trustworthy sources and giving credit, and to present their work with care, by hand or on a keyboard.
hook:
  title: Who said so?
  time: 5 minutes
  covers: [S3.1, S3.4]
  body: |-
    Say a surprising fact, such as "Owls can live underground!"

    1. Ask: "Do you believe me? How could we check?"
    2. Then: "Where would you look, and who would you trust?"
activities:
  - title: Mini research
    time: 30 minutes
    materials: A library book or a trusted website, and paper
    covers: [K3.1, K3.2, K3.4, S3.3]
    steps:
      - Your child picks a focused question about an animal or place they like.
      - They find two facts and write each as a jot note, in their own words.
      - They write the source under each note.
      - They share their answer as a short poster with a picture.
  - title: Cursive warm-up
    time: 10 minutes
    materials: Lined paper and a pencil
    covers: [K4.2, S4.2]
    steps:
      - Draw light slant lines across the page.
      - Your child writes a row of *l*, then *e*, then the word *little*.
      - They check each row. Do the tall letters reach the top line, and do all the letters lean the same way?
  - title: Home-row hunt
    time: 10 minutes a day
    materials: A computer keyboard, or a paper drawing of one
    covers: [K4.3, S4.3]
    steps:
      - Find the bumps on F and J with eyes closed.
      - Type your family’s names, coming back to the home row after each letter.
      - Each day, try one sentence without looking at your fingers.
questions:
  - What exactly do you want to find out?
  - Who wrote this? Why might we trust it, or not?
  - Can you say that fact in your own words?
  - Where did you find it? How will you show that?
  - Did you ask before using that photo or interview?
  - Do all your letters lean the same way?
misconceptions:
  - thought: '"If it’s on the internet, it’s true."'
    why: Websites look official and are easy to find.
    tryThis: Compare a blog and a government or museum page on the same topic. Ask who wrote each one.
  - thought: '"Citing is only for copied sentences."'
    why: Once facts are in their own words, they feel like theirs.
    tryThis: Explain that the idea still came from someone else, so the source still goes in the list.
  - thought: '"Neat handwriting just means writing slowly."'
    why: Slowing down sometimes helps, so it seems like the only fix.
    tryThis: Look at the four checks in the lesson. Size, proportion and slant can each be practised on their own.
lookFor:
  - They narrow a big topic into a question they can answer.
  - They choose a source that fits the question, and say why.
  - They take short notes in their own words and list their sources.
  - Their cursive letters have the same slant and size, and they return to the home row when typing.
adapt:
  support:
    - Give two possible questions and choose the more focused one together.
    - Provide a note-taking sheet with spaces for the fact and the source.
    - Practise one cursive letter family at a time.
  access:
    - need: hands
      tip: Keyboarding or voice-typing can replace handwriting for research notes. Short cursive practice can still be done with a thick pencil.
    - need: reading
      tip: Use read-aloud sources, videos from trusted museums, or interviews with a family member.
    - need: writing
      tip: Notes can be drawn as small labelled sketches with the source written underneath.
    - need: attention
      tip: Break research into steps on separate days, such as the question, then sources, then notes.
  stretch:
    - Interview someone with permission, take notes, and present what you learned with a citation.
    - Type a short report, and add a picture with a caption that cites where it came from.
together:
  - problem: d1
    how: Read the book sentence aloud, then close the book and ask your child to say the fact in their own words.
  - problem: d2
    how: Ask, "Who wrote each source? Who would check the facts?" before choosing.
