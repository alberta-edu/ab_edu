id: oral-traditions-listening
subject: english-language-arts
why: A child learns that spoken stories carry knowledge from one generation to the next, that sharing them takes respect, and that real listening is active work.
hook:
  title: The family story
  time: 5 minutes
  covers: [K1.1, U1.1]
  body: |-
    Tell your child a short true story from your own childhood, one they haven’t heard.

    1. Ask: "Who told me stories like this when I was little?"
    2. Then: "What could this story teach you, now?"
activities:
  - title: Story keeper
    time: 20 minutes
    materials: A relative or family friend, and a phone or notebook
    covers: [K1.3, S1.2, K3.1]
    steps:
      - Your child asks the person for a story from when they were young.
      - First, they ask permission to remember it, record it or share it.
      - While listening, they jot two key points.
      - Afterwards, they restate the story in their own words, and check that they got it right.
  - title: Say it back
    time: 10 minutes
    materials: Nothing
    covers: [K3.1, S3.2]
    steps:
      - Take turns telling about your day in a few sentences.
      - The listener restates the key point, starting with "So you’re saying…"
      - The speaker says if that was right.
      - Then the listener adds one connection to their own life.
  - title: Who thinks what?
    time: 10 minutes
    materials: A short family discussion, such as what to cook on the weekend
    covers: [S2.2, K2.1]
    steps:
      - Everyone gives an opinion with a reason.
      - Your child restates each person’s point of view.
      - Together, find a plan that respects everyone’s reasons.
questions:
  - Who first told this story? Who told it to you?
  - What does this story connect you to?
  - Whose story is it? Do we need to ask before we share it?
  - What was the speaker’s key point?
  - What does that remind you of in your own life?
  - What does each person think, and why?
misconceptions:
  - thought: '"If I heard a story, I can share it anywhere."'
    why: Stories seem free once they have been told aloud.
    tryThis: 'Ask: "Whose story is it?" Explain that some communities, such as the Blackfoot Elders who gave permission for a book of Napi stories, decide how their stories are shared.'
  - thought: '"Listening means being quiet."'
    why: Children are often told to be quiet and listen.
    tryThis: Play Say it back. Show that listening is active. It includes restating and asking questions.
  - thought: '"Disagreeing is rude."'
    why: They want to keep friends happy.
    tryThis: Practise disagreeing kindly, with "I see it differently, because…"
lookFor:
  - They ask before they retell someone else’s story.
  - They restate a speaker’s key point accurately.
  - They make connections that help them understand, then come back to the speaker.
  - They name another person’s point of view before giving their own.
adapt:
  support:
    - Use very short stories, three or four sentences, for restating.
    - Give the frame "So you’re saying…" and "That reminds me of…, because…"
    - Practise respectful replies with puppets or toys before real group work.
  access:
    - need: reading
      tip: “The Grey Ice” is a spoken story. Read it aloud, as a grandparent would, and let your child listen without the text.
    - need: language
      tip: Invite family stories in your child’s home language. Listening and restating work in any language.
    - need: worry
      tip: Restating is a safe start. It asks a child to repeat, not to invent. Praise good listening as much as good talking.
  stretch:
    - Record a family story with permission, and add a short introduction about who told it and why it matters.
    - Listen to a podcast or radio story. Write down two points of view you heard.
together:
  - problem: d1
    how: Read the three lines aloud in different voices. After each one, ask, "What does this person think, and why?"
  - problem: b2
    how: Talk about a story from your own family that you would want someone to ask about before sharing.
