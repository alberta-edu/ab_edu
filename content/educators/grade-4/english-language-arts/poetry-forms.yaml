id: poetry-forms
subject: english-language-arts
why: A child learns that a poem’s form is a choice. A beat, a broken line or a shape on the page can all change how a poem makes you feel.
hook:
  title: Clap it, then break it
  time: 5 minutes
  covers: [K5.3, K5.4]
  body: |-
    Clap a nursery rhyme together, like "Twinkle, Twinkle, Little Star."

    1. Ask: "What makes it bouncy?"
    2. Then say the same idea with no beat: "Star. Tiny. Shining up there all night." Ask, "Is this still a poem?"
activities:
  - title: Shape a poem
    time: 20 minutes
    materials: Paper, a pencil and a coloured marker
    covers: [K5.5, S5.3]
    steps:
      - Pick a thing with a clear shape, like a raindrop, a kite or a slide.
      - Lightly draw its outline.
      - Write words about it along the outline, or inside it.
      - Erase the outline. Can someone guess the topic from the shape?
  - title: Verse to free verse
    time: 15 minutes
    materials: A short rhyming poem
    covers: [K5.3, K5.4, S5.2]
    steps:
      - Read the rhyming poem aloud and clap the beat.
      - Together, rewrite it with no rhymes, breaking the lines wherever you want a pause.
      - Read both aloud. Ask, "How does each one make you feel?"
  - title: Poem from a window
    time: 10 minutes
    materials: A window and a notebook
    covers: [K5.1, S5.1]
    steps:
      - Look out for one minute and name five things you see.
      - Pick one, and say what it is like, using *like* or *as*.
      - Turn your best comparison into a three-line free verse poem.
questions:
  - Does this poem rhyme? Can you clap a steady beat?
  - Why do you think the poet broke the line here?
  - What picture does this comparison put in your head?
  - How would this poem feel if it were a different form?
  - Does this poem remind you of a person or a place?
misconceptions:
  - thought: '"A poem has to rhyme."'
    why: Most poems for young children are rhyming verse.
    tryThis: Read “Toboggan Run” aloud, then ask what it does that a rhyme couldn’t.
  - thought: '"A concrete poem is a poem with a picture drawn beside it."'
    why: Many poems in books come with pictures.
    tryThis: Show that in a concrete poem, the **words themselves** make the picture.
  - thought: '"Free verse means you can write anything, any way."'
    why: The name sounds like there are no choices to make.
    tryThis: Ask why the poet made one line very short. Every break in free verse is a choice.
lookFor:
  - They clap or tap the beat of a verse.
  - They name the form of a poem and give a reason.
  - They talk about how a comparison makes them feel, not just what it means.
  - They try a new form when they write.
adapt:
  support:
    - Start with verse. Clapping the beat and finding rhymes are the easiest way in.
    - Give word banks of rhyming pairs before writing verse.
    - Draw the shape first for concrete poems, then add words.
  access:
    - need: reading
      tip: Read every poem aloud first. Poems are made to be heard.
    - need: writing
      tip: Your child can say a poem while you write it, or arrange cut-out word cards into a shape.
    - need: hands
      tip: For concrete poems, type the words and print them, then cut and glue them along a drawn shape.
  stretch:
    - Write a verse and a free verse poem about the same thing. Ask someone which one they like better, and why.
    - Make a concrete poem where the shape adds a joke that the words don’t say.
together:
  - problem: d1
    how: Clap each line together before choosing. Count the da-DUMs on your fingers.
  - problem: d2
    how: |-
      - First find the rhyming pairs together.
      - Then ask, "Which has to happen first, one thread or ten more?"
