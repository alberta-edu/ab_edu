id: fluent-reading
subject: english-language-arts
why: A child learns that reading aloud well shows understanding, and that getting confused is normal. Good readers notice it and know what to try.
hook:
  title: The robot reader
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    Read a page of a favourite story like a robot: flat, one word at a time.

    1. Ask: "Did you understand the story? What was wrong with my reading?"
    2. Then read it again with expression, and ask what changed.
activities:
  - title: Readers’ theatre
    time: 20 minutes
    materials: A story or comic with lots of dialogue
    covers: [S1.2, S1.1]
    steps:
      - Each person takes a character. One person reads the narrator.
      - Before reading, find the clue words for each line, like *whispered* or *groaned*.
      - Read it aloud like a play. Then swap characters and read it again.
  - title: Punctuation party
    time: 10 minutes
    materials: Index cards
    covers: [S1.1]
    steps:
      - Write one short sentence, like *We have a dog*, three times.
      - End one with a period, one with a question mark and one with an exclamation mark.
      - Shuffle the cards. Your child reads one, and you guess which mark it ends with.
  - title: Stuck-o-meter
    time: 15 minutes
    materials: A book that is a little challenging, and sticky notes
    covers: ['LANENG4-OI7-GQ1-LO1#S6.1', 'LANENG4-OI7-GQ1-LO1#K6.3', 'LANENG4-OI7-GQ1-LO1#S6.3']
    steps:
      - Your child reads and puts a sticky note wherever they get confused.
      - At each note, they say what kind of problem it is, and try a strategy.
      - They draw a smile or frown on the note to show if it worked.
      - At the end, ask which strategy worked best for them.
questions:
  - How should this line sound? What clue tells you?
  - What does this punctuation mark tell your voice to do?
  - Where did it stop making sense? What could you try?
  - Is this a word problem, a sentence problem or a whole-story problem?
  - Which strategy worked for you? Why do you think it did?
misconceptions:
  - thought: '"Fluent means fast."'
    why: Reading speed is often timed and praised.
    tryThis: Read a sentence super fast with no pauses. Ask if it made sense. Fluency means smooth and meaningful, not rushed.
  - thought: '"If I can read all the words, I understood it."'
    why: Sounding out words takes a lot of effort, so it feels like the job is done.
    tryThis: After a page, ask for a two-sentence retelling. If they can’t, show them how to ask questions and reread.
  - thought: '"Good readers never get confused."'
    why: Children rarely see adults struggle with reading.
    tryThis: Think aloud when you get stuck reading a form or a recipe, and show what you try.
lookFor:
  - They raise their voice at a question mark and pause at commas without being told.
  - They read characters’ lines with feelings that fit the story.
  - They notice out loud when something doesn’t make sense.
  - They choose a strategy that fits the problem, and say whether it worked.
adapt:
  support:
    - Echo read. You read a sentence with expression, and your child reads it back.
    - Practise one short passage several times. Fluency grows with repeat reading.
    - Keep a strategy bookmark with five pictures, one for each fix-up strategy.
  access:
    - need: reading
      tip: Choose easy texts for fluency practice. Expression is easier when the words are easy.
    - need: worry
      tip: Read together in unison first, so your child isn’t alone. Praise expression as much as accuracy.
    - need: language
      tip: Dialogue is a great way to practise English rhythm. Act out lines together before reading them.
    - need: attention
      tip: Short, lively texts, like comics, poems and jokes, make fluency practice fun.
  stretch:
    - Record a reading, listen back, and pick one line to make more expressive.
    - Read a picture book aloud to a younger child, using a different voice for each character.
together:
  - problem: d1
    how: Read Ana’s words aloud in a confused voice. Ask, "What exactly is she lost about?" before looking at strategies.
  - problem: b2
    how: Read the line three ways, as a shout, a whisper and a hiss. Ask which one the word *hissed* tells you to use.
