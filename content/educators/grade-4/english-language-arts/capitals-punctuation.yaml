id: capitals-punctuation
subject: english-language-arts
why: A child learns that small marks do big jobs. A comma or an apostrophe can change what a sentence means, so careful punctuation is kindness to the reader.
hook:
  title: Let’s eat Grandma
  time: 5 minutes
  covers: [K1.3, K1.4]
  body: |-
    Write *Let’s eat Grandma!* on paper. Read it aloud, very seriously.

    1. Ask: "Should Grandma be worried?"
    2. Then: "What one mark would save her?"
activities:
  - title: Comma hunt
    time: 10 minutes
    materials: A recipe, a comic or a book
    covers: [K1.4, S1.3]
    steps:
      - Find five commas together.
      - For each one, decide its job. Is it a pause, a list or after a transition word?
      - Write one sentence of your own for each job.
  - title: Address book
    time: 10 minutes
    materials: Envelopes or paper
    covers: [K1.1, K1.2, S1.1]
    steps:
      - Your child writes your address and a relative’s address.
      - They use abbreviations like St., Rd. and AB.
      - Check that each abbreviation starts with a capital letter.
  - title: Apostrophe sort
    time: 10 minutes
    materials: Index cards
    covers: [S1.5]
    steps:
      - Write words like *don’t*, *dog’s*, *dogs*, *we’re* and *its*.
      - Sort them into piles for missing letters, ownership and no apostrophe needed.
      - Explain each one out loud.
questions:
  - What does this abbreviation stand for?
  - Is this sentence telling, asking or exclaiming?
  - Where would you pause if you read this aloud?
  - Who is speaking? Which words did they really say?
  - Does this apostrophe show missing letters, or who owns something?
misconceptions:
  - thought: '"Put an apostrophe before every s."'
    why: Many words with apostrophes end in s.
    tryThis: Ask two questions. Are letters missing? Does someone own something? If neither, no apostrophe.
  - thought: '"A comma goes wherever you take a breath."'
    why: The pause rule is often taught first and alone.
    tryThis: Teach the three jobs, a pause between parts, a list and after a transition word, and check each comma against them.
  - thought: '"its and it’s are the same."'
    why: Both sound the same, and *it’s* looks like it shows ownership.
    tryThis: Read *it’s* as *it is*. If the sentence breaks, use *its*.
lookFor:
  - They capitalize abbreviations like Dr., St. and AB.
  - They choose end marks to fit what a sentence does.
  - They place commas in lists and after transition words.
  - They use apostrophes only for contractions and possession.
adapt:
  support:
    - Focus on one mark per week.
    - Read sentences aloud, and listen together for pauses and feelings.
    - Keep a small chart of the comma jobs and apostrophe jobs.
  access:
    - need: writing
      tip: Practise punctuation by pointing and tapping, like the comma game in the lesson, before writing.
    - need: language
      tip: Punctuation differs across languages. Compare an English quotation with one in your home language.
    - need: hands
      tip: Use punctuation cards to place on printed sentences instead of writing the marks.
  stretch:
    - Write a sentence that means two different things with and without a comma.
    - Punctuate a short comic strip as a story with dialogue.
together:
  - problem: d1
    how: Ask, "Which words came out of Mia’s mouth?" Then, "Whose puppy is it?"
  - problem: d2
    how: Read the sentence both ways, saying *it is* aloud for *it’s*. Laugh at the one that breaks.
