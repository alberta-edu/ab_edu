id: figurative-vocabulary
subject: english-language-arts
why: A child learns to choose the exact word, and to read past the literal words of an idiom or personification to what the writer really means.
hook:
  title: Raining cats and dogs
  time: 5 minutes
  covers: [K1.4, S1.8]
  body: |-
    Say, very seriously: "Wow, it’s raining cats and dogs!" Then ask your child to draw exactly what you said.

    1. Laugh at the drawing together.
    2. Then ask: "What did I really mean?"
activities:
  - title: Idiom charades
    time: 15 minutes
    materials: Slips of paper with idioms, such as *a piece of cake*, *break the ice* and *spill the beans*
    covers: [K1.4, S1.8]
    steps:
      - One person acts out an idiom literally, with no words.
      - The others guess the idiom.
      - Then everyone says what it really means, and when you might use it.
  - title: Talking things
    time: 10 minutes
    materials: Objects around the house
    covers: [K1.2, S1.8]
    steps:
      - Pick an object, such as a kettle or a vacuum.
      - Your child says one sentence where it acts like a person. *The kettle screamed.*
      - 'Ask: "What does that make us picture or feel?"'
  - title: Word hunt
    time: 15 minutes
    materials: A notebook and any book or science article
    covers: [S1.2, S1.3, S1.4, S1.5]
    steps:
      - Your child hunts for one power word (useful anywhere) and one subject word.
      - They make a word map for each, with a meaning, a picture, a sentence and related words.
      - They check the meaning in a dictionary.
      - Use each word at dinner this week.
questions:
  - What does this phrase say exactly? What does it really mean?
  - What human thing is this object doing? How does that make you feel?
  - What do these two things have in common, even though they are different?
  - Is there a more precise word than this one?
  - Where else could you use this new word?
  - How could you check what this word means?
misconceptions:
  - thought: '"An idiom is a mistake, because it doesn’t make sense."'
    why: Read literally, idioms are silly.
    tryThis: Treat each idiom like a new word with its own meaning. Keep a list of the ones you hear.
  - thought: '"Any comparison is a good analogy."'
    why: Most things share something, like being small or being brown.
    tryThis: 'Ask: "What is the one thing you want them to understand? Does the comparison show it?"'
  - thought: '"A longer word is always a better word."'
    why: Long words sound grown-up.
    tryThis: Try the word in the sentence and check its meaning. *Virtuous pizza* is long but wrong.
lookFor:
  - They explain an idiom’s meaning, not just its words.
  - They spot personification and say what it makes them picture.
  - They swap a plain word for a more precise one in their own writing.
  - They use a new word in a different subject or setting.
adapt:
  support:
    - Start with idioms your family uses often, and draw their literal pictures.
    - Give analogy frames, such as "___ is to ___ as ___ is to ___."
    - Offer three precise words to choose from, instead of finding their own.
  access:
    - need: language
      tip: |-
        - Idioms are hard for children who are new to English.
        - Ask about idioms in their home language. Many languages have one for very heavy rain!
    - need: writing
      tip: Word maps can be drawn or spoken. Your child can record a word in a voice note with a picture.
    - need: reading
      tip: Read the figurative sentences aloud, and let your child focus on the meaning.
  stretch:
    - Invent a new idiom and its meaning, and see if a friend can work it out from a story.
    - Write a short paragraph where the weather acts like a person.
together:
  - problem: d1
    how: Read the sentences dramatically, coughing and groaning like the truck. Then ask what the truck seems like.
  - problem: d2
    how: First agree on the one thing the brother needs to understand. Then test each comparison against it.
