id: sentence-grammar
subject: english-language-arts
why: A child learns how sentences work, who does what, when it happens and how things compare, so that their own sentences say exactly what they mean.
hook:
  title: Who did what?
  time: 5 minutes
  covers: [K2.4, K2.5]
  body: |-
    Say: "The cat chased the dog." Then: "The dog chased the cat."

    1. Ask: "Same words. What changed?"
    2. Then: "Who is doing the chasing in each one?"
activities:
  - title: Time machine
    time: 10 minutes
    materials: Nothing
    covers: [K2.1, K2.2, K2.3, S2.2]
    steps:
      - Say a sentence about today, like "I eat cereal."
      - Your child "time travels" it to yesterday and tomorrow.
      - Swap. Make it silly, like "The moose eats cereal."
  - title: Biggest, bigger, big
    time: 10 minutes
    materials: Three toys or fruits of different sizes
    covers: [K2.9, K2.10, S2.6]
    steps:
      - Hold up two. Your child compares them with -er or more.
      - Add the third. Now they use -est or most.
      - Try other adjectives, like heavy, soft or colourful.
  - title: Pronoun swap
    time: 10 minutes
    materials: A short paragraph your child wrote
    covers: [K2.7, K2.8, S2.3, S2.5]
    steps:
      - Underline a name that repeats many times.
      - Swap some for subject pronouns, like *she* or *they*.
      - Swap owners like *Raj’s* for possessive adjectives, like *his*.
      - Read it aloud. Is it still clear who is who?
questions:
  - What kind of sentence is this? How can you tell?
  - When does this happen? Which word tells you?
  - Who is doing the action? Who or what receives it?
  - How many things are being compared?
  - Is the subject one thing or more than one? Does the verb match?
misconceptions:
  - thought: '"The subject is always the first word."'
    why: In many simple sentences it is.
    tryThis: Try "After lunch, the bear slept." Ask who did the sleeping.
  - thought: '"More taller is extra correct."'
    why: Both ways of comparing feel like they make it stronger.
    tryThis: Practise "-er or more, never both" with silly examples, like "more funnier."
  - thought: '"-est means very."'
    why: '"The best" can sound like "really good."'
    tryThis: Line up two things, then three. Show that -est needs at least three to compare.
lookFor:
  - They name the tense from clue words like *will* and *yesterday*.
  - They find the subject and object in a sentence.
  - They use -er for two things and -est for three or more.
  - Their subjects and verbs agree in their own writing.
adapt:
  support:
    - Act sentences out. The subject does the action, and the object receives it.
    - Use colour. Circle subjects in one colour and objects in another.
    - Practise one skill per day, like tense on Monday and comparing on Tuesday.
  access:
    - need: language
      tip: Subject-verb agreement and -er/-est work differently in many languages. Practise them in short spoken sentences before writing.
    - need: writing
      tip: Most of these skills can be practised by talking. Say the sentences aloud before writing any.
    - need: attention
      tip: Use toys or real objects for comparing. Moving things around keeps it active.
  stretch:
    - Write three sentences about the same event, in past, present and future tense.
    - Find a long adjective that uses *more* and *most*, and a short one that uses -er and -est. Can you find one that can do both?
together:
  - problem: d1
    how: Read Ana’s story aloud. After each fix, read the sentence again and ask if it sounds better.
  - problem: d2
    how: Use two real objects, then add a third. Say the sentence each time.
