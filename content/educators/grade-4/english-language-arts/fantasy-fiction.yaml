id: fantasy-fiction
subject: english-language-arts
why: A child learns to see how a story is put together, who is telling it and why, so that they can follow a twisty plot and imagine it through someone else’s eyes.
hook:
  title: What if?
  time: 5 minutes
  covers: [K3.2, U3.1]
  body: |-
    Pick an ordinary object, like a sock or a spoon.

    1. Ask: "What if this could talk? What would it say about our house?"
    2. Then: "Is that a story that could really happen? What kind of story is it?"
activities:
  - title: Back in time
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K3.4, S3.2]
    steps:
      - Your child tells a short story about today, such as getting ready for school.
      - Stop them in the middle and say, "Now remember something from when you were little."
      - They add the memory, starting with a phrase like *Then I remembered*.
      - Ask how the memory changes the story about today.
  - title: Who says I?
    time: 10 minutes
    materials: Any two novels or picture books
    covers: [K3.8, K3.9, S3.6]
    steps:
      - Open each book to any page.
      - Your child hunts for *I* outside quotation marks.
      - If they find it, the narrator is a character. If not, someone outside the story is telling it.
      - Read one page aloud swapping the point of view. *She ran* becomes *I ran*.
  - title: Act the minor character
    time: 15 minutes
    materials: A story you both know
    covers: [S3.5, K3.6]
    steps:
      - Pick a minor character, like a shopkeeper or a bus driver.
      - Your child acts one scene as that character, saying *I*.
      - 'Ask: "What could this character know? What couldn’t they know?"'
questions:
  - What in this story could never really happen?
  - Is there a smaller story running beside the big one?
  - Did the story jump back in time? Which words told you?
  - Who is telling this story? How do you know?
  - Who is the story mostly about? Who only shows up once?
  - How would this part sound if another character told it?
misconceptions:
  - thought: '"Any story with an animal or a kid in it is fantasy."'
    why: Many picture books for young children are fantasy.
    tryThis: 'Ask: "Could this really happen?" A dog who saves a family is realistic. A dog who flies is fantasy.'
  - thought: '"If someone in the story says I, it’s first person."'
    why: Characters use *I* when they talk, inside quotation marks.
    tryThis: Cover the words inside quotation marks with a finger. If *I* is still there, the narrator is in the story.
  - thought: '"A character who helps solve the problem is a major character."'
    why: Helpful moments feel important.
    tryThis: Ask who the story follows from start to end, and how much we learn about each person.
lookFor:
  - They name the unreal element that makes a story fantasy.
  - They spot a flashback and say where the story returns to the present.
  - They check for *I* outside quotation marks to find the narrator.
  - They retell a moment as another character and keep to what that character could know.
adapt:
  support:
    - Use a picture book first. Flashbacks and subplots are easier to see with pictures.
    - Draw the main plot and the subplot as two coloured lines on paper, adding a dot for each event.
    - Give the frame "This is a fantasy because ___ could never really happen."
  access:
    - need: reading
      tip: Read “The Whispering Boots” aloud. Your child can put up a hand when the story jumps back in time.
    - need: language
      tip: Words like *subplot* and *flashback* are new. Act them out. Step back for a flashback, and walk beside a friend for a subplot.
    - need: worry
      tip: Telling major from minor characters can feel like a test. Say that some characters are in between, and that a good reason matters most.
  stretch:
    - Write a short fantasy with one flashback, and tell it in the first person.
    - Find a book with a subplot. Draw where it meets the main plot.
together:
  - problem: d1
    how: |-
      - Change the story out loud, one step at a time.
      - After each change, ask, "Could this happen now? Then what kind of story is it?"
  - problem: d2
    how: |-
      - Agree first with what Kai noticed: Mrs. Kaur does help.
      - Then ask, "Who is the story about from start to end?"
