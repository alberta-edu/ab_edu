id: speaking-presenting
subject: english-language-arts
why: A child learns that speaking well is a set of choices, from where to pause to what to hold up, and that the audience is the reason for every one.
hook:
  title: The robot announcer
  time: 5 minutes
  covers: [K2.2, S2.3]
  body: |-
    Read a cereal box aloud like a robot, one flat word at a time. Then read it like a game-show host, with pauses and big words.

    1. Ask: "Which one did you want to keep listening to?"
    2. Then: "What did I change?"
activities:
  - title: Back-row challenge
    time: 10 minutes
    materials: A long hallway or a yard
    covers: [K2.3, K2.4, S2.4]
    steps:
      - Stand at one end. Your child stands at the other.
      - Say a sentence quietly, then with a big breath, then clearly, then aimed right at them.
      - They raise a hand when every word comes through.
      - Swap places, and name the part that made the difference.
  - title: One-minute talk
    time: 25 minutes
    materials: An index card, and one object or drawing
    covers: [K5.1, K5.2, S5.1, S5.4]
    steps:
      - Your child picks a topic they love, like a pet or a game.
      - They write a speaking card with a question to start, three key points and an ending.
      - They choose one visual aid and decide when to show it.
      - They present to the family, who practise being a great audience.
  - title: Poem by heart
    time: 10 minutes a day for a week
    materials: A short poem they like
    covers: [S5.3, K2.2]
    steps:
      - Read it aloud together, marking the pauses with a pencil.
      - Each day, cover one more line with a sticky note.
      - At the end of the week, perform it with pauses and stress.
questions:
  - Where would you pause in this sentence? Why there?
  - Who are you talking to? How loud should you be?
  - What will your audience see while you talk?
  - Which words will you put on your speaking card?
  - How would you say this to a Grade 1 class? To the principal?
  - What did you like about that speaker’s style?
misconceptions:
  - thought: '"Projecting means shouting."'
    why: Louder seems like the only way to be heard.
    tryThis: Try the Back-row challenge. Shouting without clarity or aim still loses words.
  - thought: '"A good speaking card has the whole speech on it."'
    why: Writing everything down feels safer.
    tryThis: Practise with a card of five jot notes. Notice how much more often they look up at the audience.
  - thought: '"Pausing means I forgot what to say."'
    why: Silence in a talk can feel like a mistake.
    tryThis: Play a pause on purpose, like "And the winner is…", and talk about how it made the listener feel.
lookFor:
  - They pause between phrases, not in the middle of them.
  - They adjust their volume to the room and listener.
  - They plan a talk with an introduction, key points and a conclusion.
  - They say something specific and kind after someone else presents.
adapt:
  support:
    - Mark pauses with slashes on a printed text before reading aloud.
    - Present to one person, then to a small group, before a whole class.
    - Give a speaking card template with spaces for a start, three points and an end.
  access:
    - need: worry
      tip: Let your child present sitting down, to a pet or a stuffed animal, or as a recording first.
    - need: language
      tip: Practise the talk in the home language first, then in English. The planning skills carry across.
    - need: reading
      tip: Use picture cues on the speaking card instead of words.
    - need: hands
      tip: Choose a digital visual aid that can be clicked, or ask a helper to hold up the object.
  stretch:
    - Give the same one-minute talk twice, once to entertain and once to persuade. What changed?
    - Learn a poem with two voices, and perform it with a partner.
together:
  - problem: d1
    how: Before each part, ask, "What would a seven-year-old need here?" Then look at the choices.
  - problem: b2
    how: Act it out. Say "Th’bakesale’snoon" across the room, then say it clearly, and ask which part of projection fixed it.
