id: spelling-patterns
subject: english-language-arts
why: A child who sees spelling as patterns, not a list of random words, can spell words they’ve never written. That frees their mind for ideas.
hook:
  title: One word, many words
  time: 5 minutes
  covers: [S3.2, U3.1]
  body: |-
    Write *each* on paper.

    1. Ask: "How many words can you spell by changing the first letter or two?"
    2. Race to list them: *beach, reach, teach, peach*.
    3. Ask: "How did knowing *each* help?"
activities:
  - title: Pattern hunt
    time: 10 minutes
    materials: A book or a cereal box
    covers: [K3.1, S3.1]
    steps:
      - Pick one pattern, such as VCCC (*trench*).
      - Hunt for words with that pattern. Read them aloud.
      - Code each one by writing V, C or e under its letters.
  - title: Homophone pictures
    time: 10 minutes
    materials: Paper and crayons
    covers: [K4.1, S4.1]
    steps:
      - Choose a pair, such as *pear* and *pair*.
      - Draw a funny picture that uses both, like a pear wearing a pair of socks.
      - Label each one with the right spelling.
  - title: Spell-check detective
    time: 10 minutes
    materials: A computer or tablet
    covers: [K4.2, S4.3]
    steps:
      - Type a sentence with a homophone mistake, such as *I can here the bell*.
      - See whether spell-check finds it.
      - Talk about why it didn’t, and fix it together.
questions:
  - Which word you know sounds like this one?
  - Does the suffix start with a vowel or a consonant?
  - Which spelling matches the meaning you want?
  - Is this a pattern word or a tricky word?
  - How could you check this spelling?
misconceptions:
  - thought: '"Spell it the way it sounds."'
    why: Sounding out works for many words, so children use it for all of them.
    tryThis: Sort words into pattern words and tricky words, like *said* and *friend*. Learn the tricky ones by heart.
  - thought: '"Spell-check will catch it."'
    why: Spell-check underlines so many mistakes that it seems to know everything.
    tryThis: Type a homophone mistake together, and watch spell-check miss it.
  - thought: '"Misspell only needs one s."'
    why: Two of the same letter side by side looks wrong.
    tryThis: Pull the word apart. Keep every letter of the prefix and every letter of the base.
lookFor:
  - They code a word’s pattern and use it to spell new words.
  - They keep prefixes and suffixes spelled the same in every word.
  - They pick the homophone that fits the meaning.
  - They check tricky words with a dictionary or spell-check.
adapt:
  support:
    - Work on one pattern at a time.
    - Keep a list of tricky words they use often.
    - Say words slowly together before writing them.
  access:
    - need: writing
      tip: Build words with letter tiles or magnets before writing them.
    - need: language
      tip: Homophones can be extra confusing in a new language. Draw a picture beside each one.
    - need: attention
      tip: Use the pattern game in the lesson for a few words at a time, then take a break.
  stretch:
    - Find a word for each of the six patterns in a favourite book.
    - Write a silly sentence with three homophones, like *Their pair of pears is over there.*
together:
  - problem: d1
    how: Ask, "What word do you know that rhymes?" Then, "Does *said* follow the pattern of *bed*?"
  - problem: d2
    how: Read the *thare* note aloud, then silently. Ask which is harder to understand.
