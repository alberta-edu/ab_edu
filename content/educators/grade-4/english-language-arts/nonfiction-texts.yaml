id: nonfiction-texts
subject: english-language-arts
why: A child learns that true texts come in many forms, from a recipe to a riverbank, and that even a true text can carry someone’s opinion.
hook:
  title: Fact or opinion?
  time: 5 minutes
  covers: [K4.4, S4.2]
  body: |-
    Say three sentences about dinner: "We had pasta. It was the best pasta ever. You should eat pasta every day."

    1. Ask: "Which of these could we prove?"
    2. Then: "Which one could someone argue with?"
activities:
  - title: Read the land
    time: 20 minutes
    materials: A walk outside, in a park, yard or schoolyard
    covers: [K4.1, U4.1]
    steps:
      - Look for marks that tell a true story, like tracks, a worn path or a broken branch.
      - Your child says what the land shows, using only what they can see.
      - Then they say what they think happened, and how sure they are.
  - title: Kitchen manual
    time: 20 minutes
    materials: A simple recipe or the manual for a toy or appliance
    covers: [K4.2, S4.1]
    steps:
      - Read the procedural text together, and follow it.
      - 'Ask: "What would happen if we did step 3 before step 2?"'
      - Your child writes a 4-step procedure for something they know, like making toast.
      - Someone else follows it exactly. Fix any step that went wrong.
  - title: Life story timeline
    time: 20 minutes
    materials: Paper, a pencil and a few family photos
    covers: [K4.1, K4.3]
    steps:
      - Your child picks 4 events from their life and puts them in time order.
      - They write one sentence for each, saying *I*.
      - They add a first sentence that introduces them, and a last one that sums up.
questions:
  - Is this a fact or an opinion? How could we check it?
  - What is the main idea? Which details hold it up?
  - How is this text built? Why did the writer build it that way?
  - What is the same about these two things? What is different?
  - What does the land here tell us? What can’t it tell us?
misconceptions:
  - thought: '"Non-fiction only has facts in it."'
    why: Non-fiction is usually described as true, factual writing.
    tryThis: Hunt for words like *best*, *should* and *amazing* in a real information book or travel page.
  - thought: '"An opinion is a wrong fact."'
    why: Opinions are often talked about as less trustworthy.
    tryThis: Point out that an opinion isn’t wrong. It is what someone thinks, and others may think something different.
  - thought: '"The main idea is the first sentence."'
    why: Many paragraphs do start with it.
    tryThis: Use “Chinooks” in the lesson. The first sentence is the introduction, and the main idea comes second.
lookFor:
  - They ask “Could we check that?” about a sentence.
  - They find the main idea by asking what all the details have in common.
  - They follow and write procedural steps in order.
  - They talk about the land with respect, and keep what it shows apart from their guesses.
adapt:
  support:
    - Sort single sentences into fact and opinion before reading whole texts.
    - Use the frame "The main idea is ___. One detail that holds it up is ___."
    - Do the Kitchen manual activity before reading the lesson’s texts.
  access:
    - need: reading
      tip: Read “My Life So Far” aloud. Your child holds up a thumb for a fact and waves a hand for an opinion.
    - need: language
      tip: Show a real recipe and a real manual side by side. Point to the list of things you need and to the numbered steps.
    - need: attention
      tip: Do Read the land outdoors. Short walks with one thing to find keep focus high.
  stretch:
    - Read a short real autobiography for children. Mark one sentence that mixes a fact and an opinion.
    - Learn about Áísínai’pi from Alberta Parks, and share one way the park asks visitors to show respect.
together:
  - problem: d1
    how: Look at the picture together. Ask, "What can we see for sure?" before talking about why the animal went into the hole.
  - problem: d2
    how: |-
      - Read each sentence and ask, "Could we check this?"
      - Then ask, "Is there any part someone could disagree with?"
