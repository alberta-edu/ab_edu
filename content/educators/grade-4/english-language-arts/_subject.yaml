subject: english-language-arts
promise: |-
  We hope your child finds out that words can do things: make a friend laugh, change a mind or carry a story across a hundred years.

  - A machine can turn out tidy sentences.
  - Noticing how a writer did it, and having something of your own to say, is still up to them.
shifts:
  - instead: Asking questions that check whether they read it.
    tryThis: 'Asking questions that send them back to the page: "Where does it say that? What makes you think so?"'
  - instead: Teaching a grammar rule, then doing a worksheet.
    tryThis: Playing with one real sentence. Change a word, a tense or a comma, then ask what changed.
  - instead: Correcting every mistake in their writing.
    tryThis: Answering what they said first. Then pick one thing to fix, the one that helps the reader most.
  - instead: Choosing all their reading for them.
    tryThis: Letting them choose often, including comics, guides and magazines. Reading they want to do builds stamina.
  - instead: Having them read aloud only to check the words.
    tryThis: Reading aloud together like actors. Pausing, phrasing and voices show what they understand.
routines:
  - name: What makes you say that?
    time: 3 minutes
    how: When your child says something about a book or show, ask this one question with real curiosity. It turns an opinion into an answer backed by the text.
  - name: Read it like an actor
    time: 5 minutes
    how: |-
      1. Pick one line of dialogue.
      2. Read it three ways: excited, grumpy and scared.
      3. Ask which fits the story, and which words told you.
  - name: Word of the day
    time: 3 minutes
    how: Pick one interesting word from a book or sign. Pull it apart into base and suffix, and use it in a silly sentence at dinner.
  - name: Two-sentence story
    time: 5 minutes
    how: Take turns making a two-sentence story with a rule, such as it must start with a sound, or end with a question. Short pieces make it easy to try things.
assess:
  - They point to a word or a line when they explain an idea.
  - They read aloud with pauses and expression that match the meaning.
  - They change their own writing because of how a reader would take it.
  - They use word parts and patterns to work out new words.
sources:
  - label: 'Alberta Education: English Language Arts and Literature K–6 curriculum'
    url: https://curriculum.learnalberta.ca/curriculum/en/s/laneng
  - label: 'Achieve the Core: guide to creating text-dependent questions'
    url: https://achievethecore.org/file/353
  - label: 'Reading Rockets: fluency'
    url: https://www.readingrockets.org/topics/fluency
