id: writers-craft
subject: english-language-arts
why: A child learns that writers make choices on purpose, from the first word to the last, and that a few small choices can turn a plain story into one people want to read.
hook:
  title: Boring story, better story
  time: 5 minutes
  covers: [S2.4, S2.3]
  body: |-
    Tell a very boring story: "I went to the store. I bought milk. I went home."

    1. Ask: "Was that a good story? Why not?"
    2. Then retell it with a hook: "*Crash!* The milk hit the floor." Ask what changed.
activities:
  - title: Hook swap
    time: 15 minutes
    materials: Three favourite books
    covers: [S2.4, K2.1]
    steps:
      - Read only the first sentence of each book.
      - Name the kind of hook each author used, such as a sound, a question, dialogue or action.
      - Your child rewrites the start of their own story using one of those hooks.
  - title: Five-senses walk
    time: 15 minutes
    materials: A notebook, outdoors or in a busy room
    covers: [S2.5, K2.4]
    steps:
      - Stop in one spot for two minutes.
      - Your child notes one thing for each sense.
      - They turn their two best notes into one sentence, adding a comparison with *like* or *as* if they want.
  - title: Ending remix
    time: 10 minutes
    materials: A short story or fable you both know
    covers: [S2.8]
    steps:
      - Read it, then cover the ending.
      - Your child writes two new endings, one that ties it up and one that leaves readers wondering.
      - Read both aloud and vote on your favourite.
questions:
  - How did this author grab your attention?
  - What can you see, hear or smell in this part?
  - What does this line of dialogue show about the character?
  - Why do you think the author used this punctuation here?
  - Does your ending tie things up, or leave a question?
  - Who will read this? How should it sound for them?
misconceptions:
  - thought: '"More describing words make writing better."'
    why: Children are often praised for adding adjectives.
    tryThis: Choose the two or three details that matter most. Compare a sentence stuffed with adjectives and a sentence with one perfect detail.
  - thought: '"Dialogue is just characters chatting."'
    why: Much of the talk children hear has no purpose.
    tryThis: For each line of dialogue, ask, "What job is this line doing?"
  - thought: '"Feedback means my writing is bad."'
    why: Criticism can feel personal.
    tryThis: Share how real authors revise many times. Ask for one specific suggestion at a time.
lookFor:
  - They try different hooks and choose the strongest.
  - They add sensory details that help the reader picture the scene.
  - Their dialogue shows feelings or moves the plot forward.
  - Their endings are planned, not just “The end.”
adapt:
  support:
    - Work on one craft move at a time, such as only the hook this week.
    - Offer a bank of sound words and hook starters.
    - Revise an adult’s plain story before revising their own.
  access:
    - need: writing
      tip: Your child can say their crafted sentences aloud while you write them.
    - need: language
      tip: Sound words and sensory words differ across languages. Invite your child to try ones from their home language too.
    - need: worry
      tip: 'Give feedback as "one star and one wish": one thing that works, and one thing to try.'
  stretch:
    - Write the same short story twice, once to make readers laugh and once to make them nervous.
    - Study a favourite author’s dialogue, then write a scene using the same tricks.
together:
  - problem: d1
    how: Read the plain story aloud in a flat voice, then read your child’s crafted version with feeling. Ask what each change did.
  - problem: d2
    how: Ask, "What is a mirror like? What sound does a whisper make?" before looking at the choices.
