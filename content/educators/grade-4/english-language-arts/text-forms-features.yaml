id: text-forms-features
subject: english-language-arts
why: A child learns to ask why a text was made and how it is built, so that they can read it the right way and find what they need fast.
hook:
  title: What is this for?
  time: 5 minutes
  covers: [K1.1, S1.1]
  body: |-
    Lay out three things from around the house: a flyer, a recipe and a comic.

    1. Ask: "Which one wants you to **do** something? Which one **teaches** you? Which one is just **fun**?"
    2. Then: "What words told you?" Let them point.
activities:
  - title: Index detectives
    time: 15 minutes
    materials: Any information book with an index
    covers: [K2.1, S2.1]
    steps:
      - Ask a question the book can answer, such as "What do frogs eat?"
      - Your child finds the topic in the index and turns to every page listed.
      - 'Ask: "Did a picture or caption help, or only the main text?"'
      - Swap. They ask you a question, and time how fast you find it.
  - title: Story shape walk
    time: 10 minutes
    materials: A favourite picture book or a family story
    covers: [K1.6, S1.4]
    steps:
      - Tell or read the story together.
      - Your child takes five steps across the room, one for each part. Beginning, problem, events, solution, ending.
      - At each step, they say what happens in that part.
      - Try it with a true family story, such as the day someone got lost.
  - title: Journal or news?
    time: 15 minutes
    materials: Paper and a pencil
    covers: [K1.4, S1.3]
    steps:
      - Pick something that happened today, such as a rainstorm or a visit.
      - Your child writes two sentences as a news report, with just the facts.
      - Then they write two sentences as a journal entry, with the date and their feelings.
      - 'Ask: "What could only go in the journal?"'
questions:
  - Why do you think someone made this? What words tell you?
  - Is this fiction or non-fiction? How can you tell?
  - What is the problem in this story? What tries to fix it?
  - Where would you look in this book to find one fact quickly?
  - What does this picture tell you that the words don’t?
  - What kind of book do you like best? What does it do for you?
misconceptions:
  - thought: '"If a text has facts in it, its purpose is to inform."'
    why: Ads and posters often include facts, like a date or a price.
    tryThis: 'Ask: "What does it want you to **do** after you read it?" Point out words like *Don’t miss out!*'
  - thought: '"The table of contents and the index are the same thing."'
    why: Both list topics with page numbers.
    tryThis: Look at both in one book. The contents page lists chapters in order, and the index lists small topics in ABC order.
  - thought: '"Pictures are just decoration."'
    why: Young children’s books often use pictures to make the page look nice.
    tryThis: Cover a diagram or caption and ask what is now missing. Many captions hold facts that the main text never says.
lookFor:
  - They name a purpose and point to a word that proves it.
  - They use an index on their own to find a topic.
  - They can find the problem and the solution in a story.
  - They read captions and diagrams, not just the main text.
adapt:
  support:
    - Start with real objects, like a cereal box or a bus schedule, before reading long texts.
    - Use only two purposes at first, such as inform and enjoy, then add persuade.
    - Give the frame "I think it was made to ___, because it says ___."
  access:
    - need: reading
      tip: Read “Hail Day” aloud together. Your child can point to the sentences while you read.
    - need: writing
      tip: For the journal activity, your child can say their sentences while you write them, or record a voice note.
    - need: language
      tip: Words like *index*, *genre* and *media* are new. Show a real index, a real journal and a real video, and name each one.
    - need: attention
      tip: Do the Story shape walk standing up. Moving one step per story part helps the shape stick.
  stretch:
    - Make a four-page mini book about a hobby, with a picture, a caption and an index at the back.
    - Find a text that tries to persuade without saying “you should.” How does it do it?
together:
  - problem: d1
    how: |-
      - Read Jun’s plan aloud and ask, "Why would he look under a porch?"
      - Let your child find the missing problem before you look at the choices.
  - problem: b3
    how: Read the caption on its own and ask, "What did you just learn about coyotes?" Then ask if page 9 belongs in the index.
