id: connect-predict-infer
subject: english-language-arts
why: A child learns to read like a detective, using clues and what they know to work out what the author leaves unsaid, and to change their mind when the evidence changes.
hook:
  title: Mystery bag
  time: 5 minutes
  covers: [K3.1, S3.1]
  body: |-
    Put three small objects from one activity in a bag, such as a sock, a towel and goggles.

    1. Pull them out one at a time. After each, your child predicts where you are going.
    2. Ask: "Which clue changed your mind?"
activities:
  - title: Prediction tracker
    time: 20 minutes
    materials: A chapter book or long picture book, and paper
    covers: [S3.1, S3.2]
    steps:
      - Stop at three good moments. Your child writes or says a prediction, and the clue behind it.
      - Read on. At each stop, they mark it confirmed or revised.
      - At the end, ask which clue was the most useful.
  - title: Two-source detective
    time: 15 minutes
    materials: A story with an animal in it, and an information book or website about that animal
    covers: [S4.3, S4.2]
    steps:
      - Read the story. Ask a question the story doesn’t answer, like "Why did the bear sleep so long?"
      - Look in the information source for a fact that helps.
      - Your child combines the two to draw a conclusion.
  - title: Summary in a tweet
    time: 10 minutes
    materials: A story you just read together
    covers: [K5.1, S5.1]
    steps:
      - Your child tells the whole story in three sentences, in order, in their own words.
      - Cut any detail the story could live without.
      - Then add one sentence of their own response.
questions:
  - What do you think will happen next? What clue makes you think so?
  - Did anything just change your prediction?
  - The author didn’t say that. How did you know?
  - What caused this to happen?
  - What does this remind you of, in your life, in another book or in the world?
  - How would you tell this story in three sentences?
misconceptions:
  - thought: '"If my prediction was wrong, I read badly."'
    why: Being right is often rewarded.
    tryThis: Praise revised predictions that come with a new clue. Changing your mind is what good readers do.
  - thought: '"A summary is retelling everything."'
    why: Children want to include every part they enjoyed.
    tryThis: Limit the summary to three sentences, and ask which details the story could live without.
  - thought: '"Any connection is a good connection."'
    why: Children are asked to make connections often.
    tryThis: 'Ask: "Does this connection help you understand the story better?"'
lookFor:
  - They give a reason for each prediction.
  - They revise a prediction calmly when new information appears.
  - They infer causes that the text doesn’t state.
  - They summarize briefly, in order, in their own words.
adapt:
  support:
    - Use pictures or short videos for predicting and inferring before long texts.
    - Use the frame "The text says ___. I know ___. So I think ___."
    - Give three possible summaries and choose the best one together.
  access:
    - need: reading
      tip: Read “The Empty Feeder” aloud, stopping after paragraphs 3 and 5 to predict.
    - need: language
      tip: Background knowledge differs. If your child hasn’t seen squirrels or bird feeders, show pictures first.
    - need: writing
      tip: Summaries and predictions can be spoken or drawn as a three-box comic.
  stretch:
    - Write a short mystery where the clues point one way at first, then another.
    - Find a news story and a story about the same topic. Compare what each one tells you.
together:
  - problem: d1
    how: Act out Dad and Maya. Dad points and blames. Maya kneels and studies the snow. Then ask what lesson the story teaches.
  - problem: b2
    how: Read the fact card aloud, then reread paragraph 4. Ask, "Which line on the card matches the story?"
