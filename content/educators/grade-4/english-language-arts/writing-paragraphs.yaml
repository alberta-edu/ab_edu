id: writing-paragraphs
subject: english-language-arts
why: A child learns that good writing is built in stages, and that a clear paragraph and varied sentences make it easy for a reader to follow and enjoy.
hook:
  title: The messy first try
  time: 5 minutes
  covers: [K1.1, K1.8]
  body: |-
    Show your child something you wrote with crossings-out, like a shopping list or a card draft. If you don’t have one, write a quick messy draft together.

    1. Ask: "Do you think grown-up writers get it right the first time?"
    2. Then: "What did I change, and why?"
activities:
  - title: Paragraph sandwich
    time: 15 minutes
    materials: Paper cut into bread and filling shapes
    covers: [K1.4, K1.5, K1.6, S1.7]
    steps:
      - Pick a topic, like the best season.
      - Write the topic sentence on the top bread, and the concluding sentence on the bottom bread.
      - Write three details on the fillings.
      - Stack it, then read it aloud. Does every filling belong in this sandwich?
  - title: Read it to the dog
    time: 10 minutes
    materials: Something your child wrote, and a pet or stuffed animal
    covers: [K1.7, S1.8, S1.9]
    steps:
      - Your child reads their writing aloud to the pet.
      - Wherever they stumble or it sounds bumpy, they make a pencil mark.
      - They revise one marked spot by joining, cutting or changing a sentence start.
  - title: Sentence starter jar
    time: 10 minutes
    materials: A jar and slips of paper
    covers: [K1.3, S1.5]
    steps:
      - Fill a jar with starters, like *Suddenly*, *After dinner*, *Splash!* and *Have you ever*.
      - Pull one out and say a sentence about your day that begins with it.
      - Use two in the next piece of writing.
questions:
  - Who is going to read this? What do you want them to do or feel?
  - What is this paragraph about? Which sentence tells me?
  - Does every sentence belong here?
  - How could you start this sentence differently?
  - Does your ending wrap things up, or start something new?
  - What text feature could help your reader?
misconceptions:
  - thought: '"Revising means fixing spelling."'
    why: Corrections are what children see most on returned work.
    tryThis: Separate the stages. Revise for ideas first, by adding and cutting sentences. Edit for spelling last.
  - thought: '"A concluding sentence is where you add one more thing."'
    why: They want to squeeze in every idea.
    tryThis: Ask, "Does your last sentence wrap up the main idea, or start a new one?"
  - thought: '"Longer sentences are always better."'
    why: Long sentences can seem more grown-up.
    tryThis: Use the bars in the lesson. A mix of long and short sentences reads best.
lookFor:
  - They plan with a list or a picture before writing.
  - Their paragraphs open with a topic sentence and stay on topic.
  - They cut or add sentences when revising, not only fix spelling.
  - They start sentences in different ways.
adapt:
  support:
    - Plan by talking first. Your child says their ideas while you jot a list.
    - Give a paragraph frame with labelled boxes for each part.
    - Focus on one stage per day.
  access:
    - need: writing
      tip: Your child can draft by voice-typing or by telling you, then revise the printed text with a coloured pen.
    - need: hands
      tip: Use sentence strips that can be moved, cut and reordered, instead of rewriting.
    - need: attention
      tip: Keep drafts short. A strong paragraph is better than a long story that never gets finished.
    - need: worry
      tip: Call the first draft a "messy copy." Celebrate crossings-out as signs of good revising.
  stretch:
    - Write the same paragraph for two audiences, a friend and the principal, and compare them.
    - Publish a short report with a graph, a picture and a caption.
together:
  - problem: d1
    how: Read Kai’s paragraph aloud and pause after sentence 4. Ask, "Who is this sentence about?"
  - problem: d2
    how: Read Version A in a robot voice and Version B naturally, then count the words in each sentence together.
