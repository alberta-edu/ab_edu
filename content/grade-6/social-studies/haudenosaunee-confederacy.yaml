id: haudenosaunee-confederacy
grade: 6
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [0LESAYIP8UKL5ECn4gOmiw]
order: 4
title: The Haudenosaunee Confederacy
shortTitle: Haudenosaunee Confederacy
summary: >-
  Pass a matter across the fire of the Haudenosaunee Grand Council, meet the Chiefs and Clan Mothers, and
  see how the Great Law of Peace guides decisions by consensus.

bigIdea: |-
  - In the **Haudenosaunee Confederacy**, several Nations still come together to make decisions by **consensus**.
  - At the **Grand Council**, Chiefs speak for the voice of each Nation.
  - **Clan Mothers** choose the Chiefs, watch over them and can remove them.
  - The **Great Law of Peace** sets out roles, how decisions are made and the people’s rights.

lesson:
  - title: Nations that decide together
    blocks:
      - type: visual
        covers: [K1.17, K1.18]
        component: democracy-globe
        props: { focus: onondaga }
        caption: The Grand Council meets on Onondaga territory. Today, Haudenosaunee communities are in Ontario, Quebec and New York State.
      - type: table
        covers: [K1.17, K1.18]
        caption: The Nations of the Haudenosaunee Confederacy, from the Onondaga Nation
        headers: [Nation, Chiefs in the Grand Council]
        rows:
          - ['**Mohawk**', '9']
          - ['**Oneida**', '9']
          - ['**Onondaga**', '14']
          - ['**Cayuga**', '10']
          - ['**Seneca**', '8']
          - ['**Tuscarora**', 'Joined in the 1700s. Their voice comes with the Oneida and Cayuga.']

  - title: The Great Law of Peace
    blocks:
      - type: compare
        covers: [K1.20]
        columns:
          - title: 🧑‍🤝‍🧑 Roles
            body: Who does what, from each Nation to each Chief and Clan Mother.
          - title: 🔥 How to decide
            body: How a matter passes around the council until everyone agrees.
          - title: 🤝 Collective rights
            body: Rights that the people hold **together**, as Nations and clans.
      - type: callout
        variant: tip
        covers: [K1.20, K1.17]
        title: A binding agreement
        body: |-
          - The Haudenosaunee Confederacy says it was founded by the **Peacemaker**, working with **Aionwatha** (Hiawatha).
          - The Great Law of Peace is **binding**: every Nation agreed to follow it, and it still guides the Confederacy today.

  - title: Around the council fire
    blocks:
      - type: visual
        covers: [K1.18, K1.17, S1.5]
        component: grand-council
        caption: Press the button and follow the matter. Then tick the box and run it again.
      - type: compare
        covers: [K1.17, U1.4]
        columns:
          - title: ✋ Majority rule
            body: The side with more votes wins. The others must go along.
          - title: 🔥 Consensus
            body: The talking goes on until everyone is of **one mind**. No Nation is outvoted.

  - title: Chiefs and Clan Mothers
    blocks:
      - type: example
        covers: [K1.19, S1.5, K1.18]
        title: How a Chief is chosen
        problem: The Haudenosaunee Confederacy describes these steps.
        steps:
          - Each clan has a **Clan Mother**. When a Chief’s place is empty, she chooses the person to fill it.
          - The brother Nation and the Grand Council must agree to her choice.
          - A ceremony raises up the new **Chief**. He speaks for the people of his Nation in council.
          - The Clan Mother watches over him. If he keeps ignoring the Great Law after warnings, she can **remove** him.
      - type: compare
        covers: [S1.5, K1.18, K1.19]
        columns:
          - title: 🗣️ Chiefs
            body: |-
              - Represent the voice of their Nation at the Grand Council
              - Talk matters over until they are of one mind
          - title: 🌾 Clan Mothers
            body: |-
              - Choose the Chiefs
              - Make sure they follow the Great Law
              - Can remove a Chief who doesn’t

  - title: Democratic principles
    blocks:
      - type: table
        covers: [U1.4, K1.2]
        caption: Principles of democracy in the Haudenosaunee Confederacy
        headers: [Principle, In the Haudenosaunee Confederacy]
        rows:
          - ['🙋 **Representation**', 'Chiefs speak for the voice of each Nation. Every council needs every Nation there.']
          - ['⚖️ **Equality**', 'Under consensus, a Nation with fewer Chiefs can’t be outvoted.']
          - ['🧑‍⚖️ **Justice**', 'Clan Mothers can remove a Chief who doesn’t follow the Great Law.']
          - ['🕊️ **Freedom**', 'Each Nation keeps its own council for its own matters.']

keyTerms:
  - term: Haudenosaunee Confederacy
    covers: [K1.17]
    definition: A union of First Nations that make decisions together, guided by the Great Law of Peace.
  - term: Consensus
    covers: [K1.17]
    definition: A decision that everyone agrees to, reached by talking until all are of one mind.
  - term: Grand Council
    covers: [K1.18]
    definition: The meeting of the Haudenosaunee Confederacy, where Chiefs represent the voice of each Nation.
  - term: Clan Mother
    covers: [K1.19]
    definition: A woman who leads a clan. She chooses its Chief, watches over him and can remove him.
  - term: Great Law of Peace
    covers: [K1.20]
    definition: The binding agreement that guides the Haudenosaunee Confederacy’s roles, decisions and collective rights.
  - term: Collective rights
    covers: [K1.20]
    definition: Rights that a group of people hold together.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.18]
    type: mc
    prompt: What is the **Grand Council**?
    choices:
      - The meeting where Chiefs represent the voice of each Haudenosaunee Nation
      - The assembly where every Haudenosaunee person votes on each law
      - A court where judges decide cases for the Haudenosaunee
      - A group of Clan Mothers who make every decision alone
    answer: 0
    feedback:
      '1': That would be direct democracy, like Athens. Who speaks at the Grand Council?
      '2': The Grand Council makes decisions together. Is it a court?
      '3': Clan Mothers have an important role. But who sits in the Grand Council?
    hints:
      - Who speaks at the Grand Council, and for whom?
    solution:
      - The Grand Council is where **Chiefs** represent the voices of their **Nations** and make decisions together.

  - id: w2
    level: 1
    thinking: apply
    covers: [K1.17]
    type: mc
    prompt: A club of 10 friends is choosing a name. 7 like "Prairie Hawks" and 3 don’t. The club decides by **consensus**. What happens now?
    choices:
      - They keep talking until all 10 agree on a name.
      - '"Prairie Hawks" wins, because 7 is more than 3.'
      - The 3 who disagree must leave the club.
      - They pick a name out of a hat.
    answer: 0
    feedback:
      '1': That is majority rule. What does consensus need?
      '2': Consensus doesn’t push anyone out. What does it ask of everyone?
      '3': A draw is a lottery. How is consensus reached?
    hints:
      - Consensus means everyone is of one mind. Is everyone there yet?
    solution:
      - Consensus means **everyone** agrees. With 3 still unsure, the club keeps talking. Maybe they find a name all 10 like.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.19, S1.5]
    type: mc
    prompt: In the Haudenosaunee Confederacy, who chooses a new Chief?
    choices:
      - The Clan Mother of his clan
      - Every person in the Nation, by vote
      - The Chief with the most years in council
      - A lottery among all the men
    answer: 0
    feedback:
      '1': That is how many elections work. Who chooses a Chief here?
      '2': The Grand Council agrees to the choice. But who makes it?
      '3': Athens used lotteries. Who chooses a Haudenosaunee Chief?
    hints:
      - Look at the first step of "How a Chief is chosen".
    solution:
      - The **Clan Mother** chooses the Chief. Then the brother Nation and the Grand Council must agree.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.18, K1.17]
    type: order
    prompt: Put the steps of a Grand Council decision in order.
    items:
      - The Onondaga Firekeepers bring a matter to the council.
      - The Mohawk and Seneca Chiefs talk it over until they agree.
      - They pass it across the fire to the Oneida and Cayuga Chiefs.
      - The Oneida and Cayuga agree and pass it back.
      - The Firekeepers confirm that the council is of one mind.
    hints:
      - Run the council visual once and watch where the matter goes.
    solution:
      - The Firekeepers start it. The Elder Brothers talk first, then the Younger Brothers, across the fire.
      - When both sides agree, the Firekeepers confirm it. That is **consensus**.

  - id: b2
    level: 2
    thinking: flaw
    covers: [K1.19, S1.5]
    type: mc
    prompt: 'Ben reads that the Chiefs in the Grand Council are men. He says, "So women had no power in the Haudenosaunee Confederacy." What did Ben miss?'
    choices:
      - Clan Mothers choose the Chiefs, watch over them and can remove them.
      - Women sit in the Grand Council and vote on every matter.
      - Women run the Grand Council, and Chiefs only carry messages.
      - Nothing. Women had no role in decisions.
    answer: 0
    feedback:
      '1': The Chiefs in the council are men. Where does women’s power come in?
      '2': Chiefs really do speak and decide in council. But who puts them there?
      '3': Look again at "How a Chief is chosen". Who chooses, and who can remove?
    hints:
      - Who decides who becomes a Chief, and who can take that away?
    solution:
      - Ben looked only at who sits in the council. **Clan Mothers** choose the Chiefs, make sure they follow the Great Law, and can remove them.
      - So women shape every decision, by choosing who makes it.

  - id: b3
    level: 2
    thinking: why
    covers: [K1.20, K1.18]
    type: mc
    prompt: A matter is urgent. Someone suggests, "Let’s skip the Younger Brothers this time, to save a day." Why would the Grand Council most likely say no?
    choices:
      - The Great Law of Peace sets how decisions are made, and every Nation agreed to follow it.
      - The Younger Brothers have the most Chiefs, so their vote always wins.
      - The Firekeepers are not allowed to speak until the Younger Brothers have.
      - Matters can only be decided once a year, on a set day.
    answer: 0
    feedback:
      '1': Check the table. Do the Oneida and Cayuga have the most Chiefs? And is it about votes?
      '2': The Firekeepers bring the matter at the start. What really sets the order?
      '3': Nothing in the lesson says that. What guides how decisions are made?
    hints:
      - What does the Great Law of Peace set out? Is it something you can skip?
    solution:
      - The Great Law of Peace is a **binding agreement**. It sets out the decision-making procedure.
      - Skipping a Nation would leave its voice out, and break the agreement that holds the Confederacy together.

  - id: b4
    level: 2
    thinking: connect
    covers: [U1.4, K1.19]
    type: mc
    prompt: Which is a real difference between Athens’s democracy and the Haudenosaunee Confederacy?
    choices:
      - In Athens, women had no role in government. Haudenosaunee Clan Mothers choose the Chiefs.
      - Athens decided by consensus, but the Haudenosaunee use majority rule.
      - Athens chose its Chiefs by lottery, but the Haudenosaunee elect theirs.
      - Athens had no representatives at all, and neither do the Haudenosaunee.
    answer: 0
    feedback:
      '1': It is the other way around. Who used majority rule?
      '2': Athens had no Chiefs, and Haudenosaunee Chiefs are not elected. Who chooses them?
      '3': Haudenosaunee Chiefs represent their Nations. Is that "no representatives"?
    hints:
      - Think about who had a role in each system, and how decisions were made.
    solution:
      - In Athens, women could not take part in government. In the Haudenosaunee Confederacy, **Clan Mothers** choose the Chiefs and can remove them.
      - Athens used **majority rule**. The Grand Council decides by **consensus**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.18, K1.17, U1.4]
    type: investigation
    prompt: |-
      The Grand Council has **50** Chiefs. The Onondaga have 14, the Mohawk 9, the Oneida 9 and the Seneca 8. The rest are Cayuga.
    parts:
      - type: number
        prompt: How many Cayuga Chiefs are there?
        answer: 10
        verify: 50 - 14 - 9 - 9 - 8
        unit: Chiefs
        hints: [Add up the Chiefs you know. How many are left out of 50?]
        solution: ['\(14 + 9 + 9 + 8 = 40\), and \(50 - 40 = 10\) Cayuga Chiefs.']
      - type: mc
        prompt: Imagine the council counted every Chief’s vote, and the majority won. Which Nation would find it **easiest to outvote**?
        choices:
          - The Seneca, because they have the fewest Chiefs.
          - The Onondaga, because they have the most Chiefs.
          - The Cayuga, because they joined the council last.
          - No Nation, because every Nation has the same number of Chiefs.
        answer: 0
        feedback:
          '1': With the most Chiefs, would they be easy or hard to outvote?
          '2': Check the table. Who joined later? And is that about votes?
          '3': Look at the numbers again. Are they all the same?
        hints: [Under majority rule, a smaller group is easier to outvote.]
        solution: ['With only 8 Chiefs, the Seneca could be outvoted most easily if every Chief’s vote were counted.']
      - type: mc
        prompt: The real Grand Council decides by **consensus**. What does that mean for the Seneca?
        choices:
          - No decision is made until they agree too, so their voice counts as much as anyone’s.
          - They must accept what the bigger Nations decide.
          - They can only speak after the Onondaga have voted.
          - They get extra votes, to make up for having fewer Chiefs.
        answer: 0
        feedback:
          '1': That is majority rule. Does consensus let anyone be outvoted?
          '2': The matter goes to the Elder Brothers first. What happens if they don’t agree?
          '3': Consensus isn’t about counting votes at all. What does it need?
        hints: [Consensus needs everyone to be of one mind. Does that include the Seneca?]
        solution: ['Under consensus, everyone must agree. A smaller Nation can’t be outvoted, so every Nation is **represented** equally.']
    wrapUp: Counting votes would let bigger groups win. Consensus means every Nation’s voice counts, whatever its size. That is one way the Confederacy shows democratic principles.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: whatif
    covers: [K1.17, U1.4]
    type: mc
    prompt: Room 8 usually votes on everything, and the majority wins. The teacher says, "This time, let’s use consensus to plan our year-end celebration." What is most likely to change?
    choices:
      - It may take longer, but everyone will be able to live with the plan.
      - It will be faster, because no one has to count votes.
      - The loudest students will get their way more often.
      - Nothing will change, because consensus is just another name for voting.
    answer: 0
    feedback:
      '1': Does talking until everyone agrees sound faster than a quick vote?
      '2': Under consensus, can anyone be ignored? Who has to agree?
      '3': In a vote, the losers still lose. What is different about consensus?
    hints:
      - What does consensus need that a vote doesn’t? What does that cost, and what does it give?
    solution:
      - Consensus needs **everyone** to agree, so the talking can take longer.
      - But no one is outvoted, so the whole class can stand behind the plan.
      - Majority rule is faster. Consensus includes every voice. Each has a cost.
