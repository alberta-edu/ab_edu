id: charter-rights
grade: 6
subject: social-studies
organizingIdea: mHPvaWAVOU-k7Fefv9hAWw
outcomes: [CYaAx2qY8U6xcG-pEKyXhA]
order: 6
title: The Canadian Charter of Rights and Freedoms
shortTitle: The Charter
summary: >-
  Find out who each Charter right protects, sort freedoms from individual and collective rights, and see
  how people use the Charter to challenge unfair rules.

bigIdea: |-
  - Since 1982, the **Charter of Rights and Freedoms** has been part of Canada’s Constitution.
  - **Fundamental freedoms** belong to everyone in Canada. **Individual rights** protect each person, and **collective rights** protect groups.
  - Rights have **reasonable limits**, to protect other people.
  - People use the Charter to challenge unfair rules, because discrimination still happens.

lesson:
  - title: Who does it protect?
    blocks:
      - type: visual
        covers: [K1.2, K1.3, K1.9]
        component: charter-check
        caption: Tap each right. Watch who it protects.
      - type: compare
        covers: [K1.1, U1.1]
        columns:
          - title: 📜 1982
            body: The Charter was **entrenched** in Canada’s Constitution. That makes it very hard to change, and every government must follow it.
          - title: 🍁 Why
            body: To reflect the **values and principles of democracy**, and to recognize Canada’s **diverse heritage**.

  - title: Freedoms and rights
    blocks:
      - type: visual
        covers: [K1.2, K1.3, K1.5, K1.6, K1.7, K1.8]
        component: card-sort
        props:
          bins:
            - { id: freedom, label: Fundamental freedom, icon: 🕊️ }
            - { id: individual, label: Individual right, icon: 🙋 }
            - { id: collective, label: Collective right, icon: 🤝 }
          cards:
            - { text: Freedom of expression, bin: freedom, why: 'Section 2 lists it. Everyone in Canada has it.' }
            - { text: Freedom of religion, bin: freedom, why: 'Section 2 lists it. Everyone has it, citizen or not.' }
            - { text: Equal treatment without discrimination, bin: individual, why: 'Equality rights belong to every individual.' }
            - { text: A fair trial if charged with a crime, bin: individual, why: 'Legal rights protect each person.' }
            - { text: Aboriginal and treaty rights, bin: collective, why: 'Section 25 protects rights that First Nations, Métis and Inuit hold as peoples.' }
            - { text: 'School in French for Francophone children in Alberta', bin: collective, why: 'Section 23 protects the education rights of language minorities.' }
            - { text: Catholic schools paid for by the public, bin: collective, why: 'Section 29 affirms the rights of religious schools.' }
        caption: Sort each card. Who holds it, one person or a group?
      - type: compare
        covers: [K1.2, K1.3, K1.5]
        columns:
          - title: 🕊️ Fundamental freedoms
            body: Guaranteed to **everyone** in Canada, citizen or not.
          - title: 🙋 Individual rights
            body: Belong to **each person**, such as equality rights, legal rights and religious rights.
          - title: 🤝 Collective rights
            body: Belong to a **group**, so that the group and its way of life can last.

  - title: Rights for groups
    blocks:
      - type: table
        covers: [K1.5, K1.6, K1.7, K1.8]
        caption: Collective rights in the Charter
        headers: [Section, What it does, In Alberta]
        rows:
          - ['**25**', 'Protects the Aboriginal and treaty rights of First Nations, Métis and Inuit.', 'Treaties 6, 7 and 8, and small parts of Treaties 4 and 10, cover Alberta.']
          - ['**16**', 'Makes **French and English** the official languages of Canada.', 'Federal services are offered in both languages.']
          - ['**23**', 'Francophones and Anglophones in **minority settings** can have their children taught in their language.', 'Francophone schools serve French-speaking families.']
          - ['**29**', 'Affirms the right to publicly funded **religious schools**, first set out in the British North America Act.', 'Catholic schools are publicly funded.']

  - title: Limits that protect others
    blocks:
      - type: compare
        covers: [K1.10, K1.4]
        columns:
          - title: 🗣️ A freedom
            body: Freedom of expression lets you say what you think, even to criticize the government.
          - title: 🛑 A reasonable limit
            body: It does **not** protect spreading hatred against a group. In 1990, the Supreme Court agreed that a law against promoting hatred is a reasonable limit.
      - type: callout
        variant: tip
        covers: [K1.4, K1.10]
        title: The rule of law
        body: |-
          - The Charter promotes **equal treatment under the law**. The same rules apply to everyone, including governments.
          - A limit on a right must be set by law, and it must be fair in a free and democratic society.

  - title: Putting the Charter to work
    blocks:
      - type: example
        covers: [K1.9, K1.7]
        title: Francophone parents in Edmonton
        problem: In the 1980s, French-speaking parents in Edmonton felt that Alberta was not giving their children the schools that section 23 promised.
        steps:
          - Three parents took the Government of Alberta to court. The case is called **Mahé v. Alberta**.
          - The case went all the way to the **Supreme Court of Canada**.
          - In 1990, the court agreed. Section 23 gives minority-language parents a say in running their children’s schools.
          - In 1993, Alberta passed a law letting Francophone parents govern their own schools.
        answer: The Charter **protects all Canadians**, **applies to every level of government**, and can be used to **challenge unjust policies** and **push for change**.
      - type: callout
        variant: tip
        covers: [S1.1, S1.3, S1.4]
        title: Your turn to think
        body: |-
          - Which freedom or right matters most in **your** life? Why?
          - What new **freedom** should all Canadians enjoy? What limits would it need?
          - What new **responsibility** should all Canadians take on?

  - title: Rights documents around the world
    blocks:
      - type: table
        covers: [S1.2, K1.10]
        caption: Canada’s Charter, the United States Bill of Rights and South Africa’s Bill of Rights
        headers: ['', 'Canada, 1982', 'U.S., 1791', 'South Africa, 1996']
        rows:
          - ['Religion and expression', '✅', '✅', '✅']
          - ['Reasonable limits', '✅ s. 1', '❌', '✅ s. 36']
          - ['Language rights', '✅', '❌', '✅']
          - ['Rights just for children', '❌', '❌', '✅ s. 28']

  - title: Discrimination still happens
    blocks:
      - type: compare
        covers: [K1.11, K1.12, S1.5]
        columns:
          - title: ✡️ Antisemitism
            body: Hatred of, or discrimination against, **Jewish** people.
          - title: ☪️ Islamophobia
            body: Hatred of, fear of, or discrimination against **Muslim** people.
      - type: table
        covers: [K1.12, K1.11, S1.5]
        caption: 'Police-reported hate crimes in Canada, 2024 (Statistics Canada)'
        headers: [Fact, Number]
        rows:
          - ['Hate crimes that targeted a religion', '1,342']
          - ['Share that targeted Jewish people', 'about 7 in 10']
          - ['Share that targeted Muslim people', 'about 1 in 6']
          - ['Incidents that people reported to police', 'only about 1 in 5']
      - type: callout
        variant: tip
        covers: [K1.11, K1.9]
        title: Many communities face it
        body: Many cultural communities in Canada still face **racism** and **discrimination**. The Charter’s equality rights, and people who speak up, help push back.

keyTerms:
  - term: Charter of Rights and Freedoms
    covers: [K1.1]
    definition: The part of Canada’s Constitution, since 1982, that lists the rights and freedoms of people in Canada.
  - term: Entrenched
    covers: [K1.1]
    definition: Built into the Constitution, so it is very hard to change and every government must follow it.
  - term: Fundamental freedoms
    covers: [K1.2]
    definition: Basic freedoms, such as religion and expression, guaranteed to everyone in Canada.
  - term: Collective rights
    covers: [K1.5, K1.7]
    definition: Rights held by a group, such as Aboriginal and treaty rights or minority language education rights.
  - term: Reasonable limit
    covers: [K1.10]
    definition: A limit on a right, set by law, that is fair in a free and democratic society and protects others.
  - term: Discrimination
    covers: [K1.11]
    definition: Treating a person or group unfairly because of who they are, such as their religion or culture.
  - term: Antisemitism
    covers: [K1.12]
    definition: Hatred of, or discrimination against, Jewish people.
  - term: Islamophobia
    covers: [K1.12]
    definition: Hatred of, fear of, or discrimination against Muslim people.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.2]
    type: mc
    prompt: Lucy is a tourist from Australia. She joins a peaceful march in Calgary. Does the Charter protect her **freedom of peaceful assembly**?
    choices:
      - Yes, because fundamental freedoms are guaranteed to everyone in Canada.
      - No, because only Canadian citizens have Charter freedoms.
      - No, because tourists can only use the rights of their own country.
      - Yes, but only if she has lived in Canada for a year.
    answer: 0
    feedback:
      '1': Some rights are for citizens only, like voting. Is peaceful assembly one of them?
      '2': While Lucy is in Canada, which rules protect her?
      '3': Section 2 says "Everyone has". Does it mention a year?
    hints:
      - Look back at the "Who does it protect?" visual. Who does section 2 protect?
    solution:
      - Section 2 says "**Everyone** has" these freedoms. That includes Lucy, even though she is not a citizen.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.6]
    type: mc
    prompt: Which languages does the Charter recognize as the **official languages** of Canada?
    choices:
      - French and English
      - English only
      - French, English and Cree
      - Every language spoken in Canada
    answer: 0
    feedback:
      '1': Section 16 names two languages. What is the other one?
      '2': Cree is an important First Nations language, but section 16 names only two official languages.
      '3': Canada has many languages, but how many does section 16 name as official?
    hints:
      - Think about section 16.
    solution:
      - Section 16 makes **French and English** the official languages of Canada.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.12]
    type: mc
    prompt: Someone sprays hateful graffiti on a synagogue, a place where Jewish people worship. What is this an example of?
    choices:
      - Antisemitism
      - Islamophobia
      - A reasonable limit
      - A collective right
    answer: 0
    feedback:
      '1': Islamophobia targets Muslim people. Who is targeted here?
      '2': A reasonable limit is a fair law that protects others. Is this a law?
      '3': A collective right protects a group. What is happening to this group?
    hints:
      - Which group is being targeted?
    solution:
      - Hatred aimed at Jewish people is **antisemitism**. It is a form of discrimination that communities in Canada still face.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.3, K1.5, K1.7, K1.8]
    type: multi
    prompt: Which of these are **collective** rights? Choose all that apply.
    choices:
      - Aboriginal and treaty rights
      - The right of Francophones in Alberta to French schools
      - The right to publicly funded Catholic schools
      - The right to a fair trial
      - Freedom of expression
    answer: [0, 1, 2]
    feedback:
      '3': Who holds this right, a group or each person charged with a crime?
      '4': This is a fundamental freedom that each person has. Is it held by a group?
    hints:
      - For each one, ask, "Does a group hold this together, or does each person hold it alone?"
    solution:
      - Aboriginal and treaty rights, minority language school rights and religious school rights belong to **groups**. They help each group’s way of life last.
      - A fair trial and freedom of expression belong to each person.

  - id: b2
    level: 2
    thinking: evidence
    covers: [K1.10, K1.2]
    type: mc
    prompt: Four made-up laws limit freedoms. Which one is most likely a **reasonable limit**?
    choices:
      - It is against the law to spread hatred against a religious group.
      - It is against the law to criticize the premier.
      - Only one religion may be practised in the province.
      - No one may hold a protest, ever.
    answer: 0
    feedback:
      '1': Criticizing leaders is a big part of democracy. Who would this limit protect?
      '2': Section 2 gives everyone freedom of religion. Does this protect anyone?
      '3': Is banning every peaceful protest fair in a free and democratic society?
    hints:
      - A reasonable limit protects other people. Which law protects someone?
    solution:
      - A law against spreading hatred protects a group from harm. The Supreme Court has agreed that it is a **reasonable limit**.
      - The other three take away freedoms without protecting anyone. They would not be fair in a free and democratic society.

  - id: b3
    level: 2
    thinking: connect
    covers: [K1.9, K1.3, K1.4]
    type: mc
    prompt: The made-up Town of Elmvale makes a rule. No one older than 65 may swim in the town pool. Rosa’s grandmother is 70, and she swims there every morning. What could she do?
    choices:
      - Challenge the rule, because the Charter applies to every level of government, including towns.
      - Nothing, because the Charter only applies to the federal government.
      - Nothing, because the town council was elected.
      - Swim in another town, because the Charter can’t help.
    answer: 0
    feedback:
      '1': The Charter applies to all levels of government. Is a town one of them?
      '2': Being elected doesn’t put a government above the Charter. Who must follow it?
      '3': The Charter protects all Canadians. How could Rosa’s grandmother use it?
    hints:
      - Which governments does the Charter apply to? Think about the Mahé case.
    solution:
      - The Charter **applies to all levels of government** and can be used to **challenge unjust policies**.
      - Equality rights in section 15 protect people from discrimination based on **age**. Rosa’s grandmother could challenge the rule with the town council, or in court.

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.2]
    type: mc
    prompt: Use the table of three countries’ rights documents. Which is true?
    choices:
      - Canada and South Africa say rights can have reasonable limits. The United States document doesn’t say so.
      - All three documents give special rights just for children.
      - Only Canada protects freedom of religion and expression.
      - The United States Bill of Rights makes French and English official.
    answer: 0
    feedback:
      '1': Check the last row. How many ✅ are there?
      '2': Check the first row. Is Canada the only ✅?
      '3': Check the language row for the United States.
    hints:
      - Read one row at a time, across all three countries.
    solution:
      - Canada (section 1) and South Africa (section 36) both say rights can have reasonable limits. The United States Bill of Rights has no such section.
      - All three protect freedom of religion and expression. Only South Africa lists rights just for children.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [K1.11, K1.12, K1.9, S1.5, K1.4]
    type: investigation
    prompt: |-
      A made-up city runs a free after-school soccer league. A new city rule says: "No player may wear a head covering." Amira is Muslim, and she wears a hijab. Under the rule, she can’t play.
    parts:
      - type: mc
        prompt: How might this rule feel to Amira?
        choices:
          - Unfair, because she has to choose between her religion and playing soccer.
          - Fine, because she can just play a different sport.
          - Fair, because the rule is the same for every player.
        fixedOrder: true
        answer: 0
        feedback:
          '1': Should Amira have to give up the free city league? How would you feel?
          '2': The words are the same for everyone. But who does the rule actually keep out?
        hints: [Imagine you had to give up something important to you, just to play.]
        solution: ['Amira would have to choose between her faith and the team. A rule can look the same for everyone and still shut some people out.']
      - type: mc
        prompt: Which parts of the Charter could Amira’s family use?
        choices:
          - Freedom of religion and equality rights
          - Official languages and minority language education rights
          - Aboriginal and treaty rights
          - The right to vote
        answer: 0
        feedback:
          '1': Is this rule about language? What is it really about?
          '2': These protect First Nations, Métis and Inuit. What is Amira’s situation about?
          '3': Is Amira being kept from voting?
        hints: [What is the rule stopping Amira from doing, and why?]
        solution: ['The rule affects her **religion**, and it treats her **unequally**. Section 2 protects freedom of religion, and section 15 protects equal treatment.']
      - type: mc
        prompt: The rule was made by a city. Can the Charter still help?
        choices:
          - Yes. The Charter applies to every level of government, and it can be used to challenge unjust rules.
          - No. The Charter only applies to Parliament in Ottawa.
          - No. A city can make any rule it wants for its own league.
        fixedOrder: true
        answer: 0
        feedback:
          '1': Think about Rosa and the Town of Elmvale. Which governments must follow the Charter?
          '2': Is a city above the Charter? Remember the rule of law.
        hints: [Which governments must follow the Charter?]
        solution: ['The Charter **applies to all levels of government**. Amira’s family, and the people who support them, can challenge the rule and push for change.']
    wrapUp: A rule can seem equal and still discriminate. Seeing it from Amira’s side shows the problem, and the Charter gives people a way to fix it.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: decide
    covers: [S1.4, K1.10]
    type: mc
    prompt: 'Jae’s class is inventing new freedoms for all Canadians. Jae suggests: "Everyone is free to fly a drone anywhere, at any time." What is the strongest point to raise?'
    choices:
      - It would need reasonable limits, such as near airports and over people’s yards, to protect others.
      - It can’t be a freedom, because drones weren’t invented in 1982.
      - It is fine as it is, because freedoms should never have limits.
      - It should only be for citizens, because tourists might crash their drones.
    answer: 0
    feedback:
      '1': The Charter can grow and change. What problem would this freedom cause for other people?
      '2': Every Charter right has reasonable limits. Who could a drone harm?
      '3': Citizens can crash drones too. What is the real problem?
    hints:
      - Who else could be affected if anyone could fly a drone anywhere?
    solution:
      - A new freedom has to work for everyone, including the people it might harm.
      - Drones near airports or over yards could put safety and privacy at risk. So any new freedom would need **reasonable limits**, just like the freedoms in the Charter.
