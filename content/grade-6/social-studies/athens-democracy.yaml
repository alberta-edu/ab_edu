id: athens-democracy
grade: 6
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [0LESAYIP8UKL5ECn4gOmiw]
order: 1
title: Democracy Begins in Athens
shortTitle: Democracy in Athens
summary: >-
  Fly to ancient Athens on a 3D globe, run its Assembly vote, Council lottery and secret jury ballot,
  and find out who could take part in the first democracy.

bigIdea: |-
  - **Democracy** began in ancient Athens, as an answer to rule by tyrants.
  - It was a **direct democracy**: male citizens met, debated and voted on the laws themselves.
  - A small land made that possible, but **metics**, **slaves** and **women** had no vote.
  - Democracies share four principles: **equality under law**, **justice**, **freedom** and **representation**.

lesson:
  - title: Where democracy began
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: democracy-globe
        props: { focus: athens }
        caption: Democracy has a story that travels the world. It starts in Athens. Press **Play the journey**, or tap any stop.
      - type: compare
        covers: [K1.1, K1.3]
        columns:
          - title: 👑 Before 510 BCE
            body: |-
              **Tyrants** ruled Athens. One man held the power, and the people had no say.

              That is **authoritarian rule**.
          - title: 🗳️ From 508 BCE
            body: |-
              Athenians drove out the last tyrant. Now the **people** held the power.

              In Greek, **dēmos** means people and **kratos** means power. Together: **democracy**.
      - type: callout
        variant: remember
        covers: ['_qCBFNsjyUuxF_UmZ0xkwg#K1.1']
        title: Remember from Grade 5
        body: In an **authoritarian** government, one leader or a small group holds all the power.

  - title: Laws everyone can see
    blocks:
      - type: table
        covers: [K1.1, K1.7, S1.1]
        caption: The road to democracy in Athens
        headers: [When, What happened]
        rows:
          - ['Before 621 BCE', 'The laws are not written down. Only a few powerful families know them, and they decide what the laws mean.']
          - ['621 BCE', 'A lawmaker named **Draco** writes the laws down and puts them up on tablets for everyone to read. This is the **Draconian constitution**.']
          - ['Until 510 BCE', 'Tyrants rule Athens for many years.']
          - ['508 BCE', 'A leader named **Cleisthenes** helps Athens set up a **democracy**.']
      - type: callout
        variant: tip
        covers: [K1.7]
        title: Written, but harsh
        body: |-
          - Draco’s laws punished even small crimes with death. English still calls a very harsh rule **draconian**.
          - But for the first time, everyone could read the law.

  - title: Mountains, sea and a small land
    blocks:
      - type: visual
        covers: [K1.4]
        component: democracy-map
        props: { view: greece }
        caption: The land helped shape the government.
      - type: callout
        variant: tip
        covers: [K1.4, K1.3]
        title: Geography shapes government
        body: The **size** of a land and its **terrain**, such as mountains, can shape how it is governed. A small city-state could gather all its citizens in one place.

  - title: Who could take part?
    blocks:
      - type: compare
        covers: [K1.5, K1.6]
        columns:
          - title: 🏛️ Citizens
            body: |-
              Born to Athenian parents.

              - **Men** could vote, speak in the Assembly and serve as jurors. They had to serve in the army.
              - **Women** could not vote or take part in government.
          - title: 🧳 Metics
            body: |-
              Free people from other places who lived and worked in Athens.

              - Paid a **special tax** and served in the army.
              - Could **not** vote or own land.
          - title: ⛓️ Slaves
            body: |-
              Owned by other people. They worked in homes, on farms and in mines.

              - Had **no** rights in government.
      - type: callout
        variant: mistake
        covers: [K1.5, K1.6, K1.3]
        title: Democracy, but not for everyone
        body: Your **social class** decided whether you were a citizen. Only adult male citizens had a say, so most people living in Athens were left out.

  - title: How Athens decided
    blocks:
      - type: visual
        covers: [K1.7, K1.3]
        component: athens-assembly
        caption: Athens had three separate government bodies. Run each one and watch how it works.
      - type: compare
        covers: [K1.7, K1.3]
        columns:
          - title: 🗣️ Equal political rights
            body: Every male citizen had the same **freedom of speech** in the Assembly. A herald opened each debate by asking, "Who wishes to speak?"
          - title: 🟥 Taking part was a duty
            body: |-
              All male citizens were **expected to take part**.

              - Officials swept people from the market toward the Assembly with a rope dipped in red dye.
              - Anyone marked red was fined.

  - title: Ideas that still matter
    blocks:
      - type: compare
        covers: [K1.2]
        columns:
          - title: ⚖️ Equality under law
            body: The same laws apply to everyone, rich or poor.
          - title: 🧑‍⚖️ Justice
            body: Fair treatment, and fair ways to settle wrongs, such as a trial.
          - title: 🕊️ Freedom
            body: People can speak, believe and meet as they choose, within the law.
          - title: 🙋 Representation
            body: People have a voice in decisions, either themselves or through someone they choose.
      - type: table
        covers: [U1.2, K1.7]
        caption: From Athens to Canada today
        headers: [In Athens, In Canada today]
        rows:
          - ['Citizens vote, and the **majority** decides', 'Citizens vote in elections, and the most votes wins']
          - ['A **secret ballot** in the courts', 'You vote alone behind a screen, so no one sees your choice']
          - ['Jurors chosen by **lottery**', 'Jurors are still chosen at random from a list of citizens']
          - ['Citizens are **expected to take part**', 'Citizens are asked to vote and to serve on juries']

keyTerms:
  - term: Democracy
    covers: [K1.1]
    definition: A government in which the people hold the power. From the Greek words dēmos (people) and kratos (power).
  - term: Direct democracy
    covers: [K1.3]
    definition: A democracy in which citizens vote on the laws themselves, not through someone else.
  - term: Metic
    covers: [K1.5]
    definition: A free person from another place who lived and worked in ancient Athens, but was not a citizen.
  - term: Lottery
    covers: [K1.7]
    definition: Choosing people by chance, so every person has the same chance of being picked.
  - term: Majority rule
    covers: [K1.7]
    definition: The choice with more than half of the votes wins.
  - term: Secret ballot
    covers: [K1.7]
    definition: A way of voting so that no one else can see how you voted.
  - term: Draconian constitution
    covers: [K1.7]
    definition: The first written laws of Athens, set down by Draco in 621 BCE. They were known for harsh punishments.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.5, K1.6]
    type: mc
    prompt: |-
      Athens, about 400 BCE.

      - **Nikias** is 25. His mother and father were both born in Athens.
      - **Lysias** is 40. His family came from the city of Syracuse and has run a shield workshop in Athens for 30 years.

      Who can vote in the Assembly?
    choices:
      - Only Nikias
      - Only Lysias
      - Both of them
      - Neither of them
    fixedOrder: true
    answer: 0
    feedback:
      '1': Lysias has lived and worked in Athens for a long time. But what makes someone a citizen?
      '2': Living in Athens for 30 years didn’t make you a citizen. What class is Lysias in?
      '3': One of them was born to Athenian parents. What does that make him?
    hints:
      - Which of them is a citizen, and which is a metic?
    solution:
      - Nikias was born to Athenian parents, so he is a **citizen**. As an adult man, he can vote.
      - Lysias is a **metic**, a free person from another place. He pays a special tax, but he can’t vote, however long he has lived there.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.7]
    type: mc
    prompt: Each year, Athens needed 500 citizens for its Council. No one campaigned, and no one voted. Every man in the pool had the same chance of being picked. How were they chosen?
    choices:
      - By lottery
      - By majority rule
      - By secret ballot
      - By the tyrant
    answer: 0
    feedback:
      '1': Majority rule means the choice with the most votes wins. But no one voted here.
      '2': A secret ballot is a way of voting. Was there a vote?
      '3': Athens had driven out its tyrants by then. What gives everyone the same chance?
    hints:
      - What way of choosing gives every person the same chance, with no votes?
    solution:
      - Choosing by chance, where everyone has the same chance, is a **lottery**.
      - Athens used a lottery for its Council of 500 and for its juries.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.3]
    type: mc
    prompt: Which of these is a **direct democracy**?
    choices:
      - Every citizen comes to the meeting and votes on each new law.
      - Citizens hand their vote to a friend, who votes for them.
      - One leader makes the laws, and citizens obey.
      - A few rich families meet and decide the laws.
    answer: 0
    feedback:
      '1': The friend votes, not the citizen. Is that the citizen voting directly?
      '2': One leader holding the power is authoritarian rule. Who has the power in a democracy?
      '3': A small group holding the power is not a democracy. Who votes in a direct democracy?
    hints:
      - In a **direct** democracy, who votes on the law?
    solution:
      - In a direct democracy, citizens vote on the laws **themselves**. That is how the Assembly of Athens worked.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [K1.4, K1.3]
    type: mc
    prompt: |-
      Two made-up lands want a democracy like the one in Athens, where every citizen votes on every law at one meeting.

      | | Pella Isle | Vorn |
      |---|---|---|
      | Size | Small island | Many valleys |
      | Terrain | Flat | High mountains between valleys |
      | Walk to the capital | Half a day at most | Up to 3 weeks |

      Which land could run it more easily?
    choices:
      - Pella Isle, because every citizen could get to the meeting.
      - Vorn, because more valleys mean more citizens to vote.
      - Vorn, because mountains keep enemies away from the meeting.
      - Both just as easily, because geography doesn’t change government.
    answer: 0
    feedback:
      '1': More voters is fine, but think about the meeting. How would they all get there?
      '2': Mountains can protect a land. But do they help citizens reach a meeting?
      '3': Look at the last row. Would a three-week walk change who comes to vote?
    hints:
      - In this kind of democracy, every citizen has to be at the meeting. What would that take in each land?
    solution:
      - Direct democracy needs citizens to come together, again and again.
      - On small, flat Pella Isle, everyone can reach the meeting. In Vorn, a citizen could spend six weeks just walking there and back.
      - That is why the **size** and **terrain** of a land can shape its government.

  - id: b2
    level: 2
    thinking: connect
    covers: [U1.2, K1.7]
    type: multi
    prompt: Which of these things in Canada today work like a feature of Athens’s democracy? Choose all that apply.
    choices:
      - People called for jury duty are picked at random from a list.
      - Voters mark their ballot alone, behind a screen.
      - In a class vote between two choices, the one with more votes wins.
      - The principal sets the school rules without asking anyone.
    answer: [0, 1, 2]
    feedback:
      '3': One person deciding for everyone, with no vote, is not like the Assembly. Which Athens feature would it be like?
    hints:
      - Match each one to lottery, secret ballot or majority rule. Does one match nothing?
    solution:
      - Jurors picked at random is a **lottery**. Voting behind a screen is a **secret ballot**. More votes winning is **majority rule**.
      - The principal deciding alone is none of these.

  - id: b3
    level: 2
    thinking: notice
    covers: [K1.5, K1.6, K1.3]
    type: number
    prompt: |-
      A made-up household in Athens, 400 BCE:

      - **Demos**, 45, a citizen, and his wife **Kleo**
      - Their son **Philon**, 24, and their daughter **Ione**, 16
      - **Timon**, a metic friend who lives with them
      - **3 slaves** who work on the family farm

      How many people in this house can vote in the Assembly?
    answer: 2
    verify: 1 + 1
    unit: people
    hints:
      - Check each person. Are they a citizen? Are they a man? Are they an adult?
    solution:
      - Demos and Philon are adult male citizens, so they can vote.
      - Kleo and Ione are from a citizen family, but women had no vote. Timon is a metic. The slaves had no rights in government.
      - So **2** of the 8 people can vote. Athens was a democracy, but only for some.

  - id: b4
    level: 2
    thinking: perspective
    covers: [K1.5, K1.2]
    type: mc
    prompt: The Assembly will vote on raising the special tax that **metics** pay. Lysias, a metic who has made shields in Athens for 30 years, hears the news. What is the biggest problem from where he stands?
    choices:
      - He will have to pay, but he gets no vote on it.
      - He will be sent away from Athens if the tax passes.
      - He is not allowed to know what the Assembly decides.
      - He must vote on it, even though he doesn’t want to.
    answer: 0
    feedback:
      '1': Nothing in the story says he would be sent away. What can’t he do about the tax?
      '2': Laws in Athens were public. What is he missing?
      '3': Can a metic vote in the Assembly at all?
    hints:
      - What does Lysias have to do, and what is he not allowed to do?
    solution:
      - Lysias pays the tax and serves in the army, but he can’t vote.
      - So a law that costs him money is decided without him. That is a lack of **representation**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.7, K1.3]
    type: investigation
    prompt: |-
      A powerful general is on trial in Athens for stealing money. A jury of **501** citizens will decide. Each juror has a hollow bronze ballot for **guilty** and a solid one for **not guilty**.
    parts:
      - type: number
        prompt: '**251** jurors drop in a hollow ballot. How many vote **not guilty**?'
        answer: 250
        verify: 501 - 251
        unit: jurors
        hints: [Everyone votes once. How many jurors are there in all?]
        solution: ['\(501 - 251 = 250\) vote not guilty.', 'So the general is found guilty by just one vote.']
      - type: mc
        prompt: Why do you think Athens used juries of 201 or 501, instead of 200 or 500?
        choices:
          - With an odd number of jurors, the vote can never be a tie.
          - Odd numbers are lucky, so the trial is more likely to be fair.
          - It leaves one extra juror, who decides if the others can’t agree.
          - It is easier to split 501 jurors into equal groups.
        answer: 0
        feedback:
          '1': Luck isn’t a reason the jury vote works. What could go wrong with 500?
          '2': Every juror votes the same way here, by dropping one ballot. Is there a special juror?
          '3': Can 501 be split into two equal halves? Is that the point?
        hints: [What could happen with 250 votes each way?]
        solution: ['With 500 jurors, the vote could end 250 to 250. With 501, one side always has more.']
      - type: mc
        prompt: Why would a **secret** ballot matter most in a trial like this one?
        choices:
          - Jurors can vote honestly, without fear of what the general’s friends might do.
          - It makes the trial finish faster, because no one has to explain their vote.
          - The general can’t see the ballots, so he can’t count them himself.
          - It means the jurors don’t have to listen to the speeches in the trial.
        answer: 0
        feedback:
          '1': It might be quicker, but is speed what keeps this trial fair?
          '2': Officials counted the ballots. Who might want to know how each juror voted?
          '3': Jurors still heard both sides. When does secrecy matter?
        hints: [Who might be angry at a juror who votes guilty?]
        solution: ['A powerful man might punish jurors who voted against him. If no one can see your vote, you can vote for what you think is true.']
    wrapUp: Each feature had a job. A large jury was hard to bribe or bully, an odd number meant a clear result, and a secret ballot let each juror vote without fear.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: why
    covers: [K1.7, K1.2]
    type: mc
    prompt: |-
      Athens chose its Council and its juries by **lottery**, not by election.

      Ari says, "That’s silly. With a vote, people would choose the smartest, most famous citizens!" What would an Athenian most likely answer?
    choices:
      - Then the rich and famous would win every time. A lottery gives every citizen an equal chance.
      - A lottery is quicker than counting votes, and Athens had no time to lose.
      - Voting had not been invented yet, so a lottery was the only way.
      - The gods choose who wins a lottery, so it always picks the smartest citizen.
    answer: 0
    feedback:
      '1': A lottery might be quick. But the Assembly voted all the time. What does a lottery protect?
      '2': Athens voted in the Assembly all the time. So why not vote for the Council?
      '3': Can a lottery tell who is smartest? What does it do instead?
    hints:
      - Who usually wins elections? Who might never get a turn?
      - Think about equality. What does a lottery give everyone?
    solution:
      - In an election, the best-known and richest people often win, again and again.
      - A lottery gives every male citizen the same chance to serve, whether he is rich or poor. That is equal political rights in action.
      - Ari has a point too. A lottery can pick someone who isn’t good at the job. Athenians accepted that, for the sake of equality.
