id: england-rights
grade: 6
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [0LESAYIP8UKL5ECn4gOmiw]
order: 3
title: Magna Carta, Habeas Corpus and the Bill of Rights
shortTitle: Rights in England
summary: >-
  Watch power tip from England's monarch to Parliament as the Magna Carta, the Habeas Corpus Act and the
  Bill of Rights limit the Crown and protect people's rights.

bigIdea: |-
  - The **Magna Carta** (1215) limited the monarch: even the king had to follow the law.
  - The **Habeas Corpus Act** (1679) protected people from being jailed without a lawful reason.
  - The **Bill of Rights** (1689) gave Parliament power, free elections and free speech in debates.
  - These events in England shaped democracy, including Canada’s.

lesson:
  - title: Power on the balance
    blocks:
      - type: visual
        covers: [K1.12, K1.13, K1.14, K1.15, S1.4]
        component: crown-balance
        caption: Tap each date. Watch where the power goes, and which principles move forward.
      - type: callout
        variant: tip
        covers: [K1.12]
        title: Absolute monarchy
        body: An **absolute monarch** holds all the power. No law, council or court can stop them. That is how England was ruled before 1215.

  - title: Magna Carta, 1215
    blocks:
      - type: compare
        covers: [K1.12, K1.13, K1.14]
        columns:
          - title: 👑 The king under the law
            body: The monarch has to follow the law, like everyone else. This **limited** the power of the monarch.
          - title: 🛡️ Legal protection
            body: No free man can be jailed or punished, except by the **law of the land**. Justice can’t be sold, refused or delayed.
          - title: 🗣️ Accountability
            body: For some taxes, the king must first **consult a council** of barons and church leaders.
      - type: callout
        variant: mistake
        covers: [K1.13]
        title: Not for everyone, yet
        body: |-
          - Magna Carta protected **free men**. Many people in England then were not free, so at first it did not protect them.
          - Later, people used its ideas to claim rights for everyone.

  - title: Habeas Corpus Act, 1679
    blocks:
      - type: example
        covers: [K1.13]
        title: What if you were jailed for no reason?
        problem: In 1680, a guard locks Thomas in jail. No one tells him why.
        steps:
          - Thomas’s friend asks a judge for a **writ of habeas corpus**, an order from the court.
          - The jailer must bring Thomas, in person, before the judge.
          - The judge asks, "What is the lawful reason for holding him?"
          - If there is none, Thomas goes free.
        answer: '**Habeas corpus** is Latin for "you shall have the body". The person held must be brought to court.'
      - type: callout
        variant: tip
        covers: [K1.13, K1.2]
        title: An individual legal right
        body: Habeas corpus belongs to **each person**, rich or poor. It protects **freedom** and **justice** against anyone who would lock people away unfairly.

  - title: Bill of Rights, 1689
    blocks:
      - type: table
        covers: [K1.14, K1.15]
        caption: Some of the rights in the Bill of Rights
        headers: [The Bill of Rights says, What it means]
        rows:
          - ['The monarch can’t set aside laws or raise taxes without Parliament.', '**Parliament** has the authority to decide.']
          - ['Elections to Parliament ought to be free.', '**Free elections**']
          - ['Parliament ought to meet often.', '**Meetings of parliament**']
          - ['Speech and debates in Parliament can’t be questioned in any court.', '**Free speech in parliament**']
      - type: callout
        variant: tip
        covers: [K1.15, K1.14]
        title: Written down, made formal
        body: The Bill of Rights turned these rights into **law**. Parliament, not the monarch, now held the authority to decide.

  - title: Still with us today
    blocks:
      - type: table
        covers: [K1.16, U1.1, S1.4]
        caption: From England to Canada
        headers: [In England, In Canada today]
        rows:
          - ['Magna Carta: even the king follows the law', 'Everyone must follow the law, including governments.']
          - ['Habeas Corpus Act: no jail without a lawful reason', 'A person who is held can ask a court to check the reason.']
          - ['Bill of Rights: free speech in Parliament', 'MPs and MLAs can debate freely. They can’t be taken to court for what they say in a debate.']
          - ['Bill of Rights: free elections', 'Canadians elect their governments in free elections.']
      - type: visual
        covers: [U1.1, K1.16]
        component: democracy-globe
        props: { focus: westminster }
        caption: Follow the journey from England to Canada. Canada’s Parliament was built on the British parliamentary system.

keyTerms:
  - term: Absolute monarchy
    covers: [K1.12]
    definition: Rule by a king or queen who holds all the power, with no law or council to limit them.
  - term: Magna Carta
    covers: [K1.12]
    definition: The "Great Charter" of 1215, which limited the power of England’s king.
  - term: Habeas corpus
    covers: [K1.13]
    definition: The right of a person who is held to be brought before a judge, who checks that there is a lawful reason. Latin for "you shall have the body".
  - term: Bill of Rights
    covers: [K1.15]
    definition: The English law of 1689 that formalized the rights of Parliament, such as free elections and free speech in debates.
  - term: Parliament
    covers: [K1.14]
    definition: An assembly of elected representatives that makes laws.
  - term: Accountability
    covers: [K1.14]
    definition: Having to explain your decisions to others, and answer for them.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.12]
    type: mc
    prompt: What did the Magna Carta change about the power of England’s king?
    choices:
      - It limited his power, because even the king had to follow the law.
      - It removed the king, so Parliament ruled England from then on.
      - It gave the king more power over the barons.
      - It let every person in England vote for the king.
    answer: 0
    feedback:
      '1': King John stayed king. What did the barons make him agree to?
      '2': The barons were angry with John. Would they hand him more power?
      '3': Votes for everyone came much later. Who forced John to seal it?
    hints:
      - Before 1215, England had an absolute monarch. What did the Magna Carta do to that?
    solution:
      - The Magna Carta **limited** the power of the monarch. The king had to follow the law.

  - id: w2
    level: 1
    thinking: apply
    covers: [K1.13]
    type: mc
    prompt: London, 1685. A sheriff locks Ellen in jail. He won’t say why. Which law gives Ellen a way to be brought before a judge?
    choices:
      - The Habeas Corpus Act
      - The Bill of Rights
      - The Draconian constitution
      - The law of the Roman Republic
    answer: 0
    feedback:
      '1': The Bill of Rights came 4 years later, in 1689. And which law is about being held in jail?
      '2': Draco’s laws were for Athens, about 2,300 years earlier.
      '3': Rome’s laws didn’t apply in England. Which English law is about jail?
    hints:
      - Which law says the person held must be brought to court?
    solution:
      - The **Habeas Corpus Act** of 1679 lets Ellen demand to be brought before a judge. If there is no lawful reason to hold her, she goes free.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.12, K1.13, K1.15]
    type: order
    prompt: Put these events in order, from first to last.
    items:
      - Draco writes down the laws of Athens.
      - Barons make King John seal the Magna Carta.
      - Parliament passes the Habeas Corpus Act.
      - William and Mary accept the Bill of Rights.
    hints:
      - Which one happened before the year 1? Then use 1215, 1679 and 1689.
    solution:
      - 'Draco: 621 BCE. Magna Carta: 1215. Habeas Corpus Act: 1679. Bill of Rights: 1689.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.15, K1.14]
    type: multi
    prompt: |-
      A made-up queen of England keeps a diary in 1700. Which of her plans would break the **Bill of Rights**? Choose all that apply.
    choices:
      - '"I shall put a new tax on wool. No need to ask Parliament."'
      - '"That member spoke against me in Parliament. Arrest him!"'
      - '"Parliament annoys me. It won’t meet for the next 10 years."'
      - '"I shall ask Parliament to approve money for a new navy."'
    answer: [0, 1, 2]
    feedback:
      '3': Asking Parliament first is exactly what the Bill of Rights wants. Who decides about money now?
    hints:
      - Check each plan against the rows of the Bill of Rights table.
    solution:
      - A tax without Parliament breaks the rule on raising money.
      - Arresting a member for a speech breaks **free speech in Parliament**.
      - Not meeting for 10 years breaks the rule that Parliament **meets often**.
      - Asking Parliament for money follows the Bill of Rights.

  - id: b2
    level: 2
    thinking: perspective
    covers: [K1.13, K1.12]
    type: mc
    prompt: |-
      England, 1216. Two people hear about the Magna Carta.

      - **Lord Hugh** is a baron who owns land.
      - **Agnes** is not free. She must work her lord’s land and can’t leave it.

      How would each of them most likely see it?
    choices:
      - Hugh gains protection from the king. Agnes gains little, because it protects free men.
      - Both gain the same, because the Magna Carta protects everyone in England.
      - Agnes gains the most, because the Magna Carta was written for poor people.
      - Neither gains anything, because the king can ignore it.
    answer: 0
    feedback:
      '1': Read the words again. Who can’t be jailed except by the law of the land?
      '2': Who forced King John to seal it? Whose problems did they want fixed?
      '3': The king had to follow it. But was it written with Agnes in mind?
    hints:
      - Who wrote the Magna Carta’s demands? Who does it name, "free men" or "all people"?
    solution:
      - The barons forced the Magna Carta on the king, and it protected **free men**, like Hugh.
      - Many people, like Agnes, were not free. At first, it did little for them.
      - The same event can look very different, depending on where you stand.

  - id: b3
    level: 2
    thinking: why
    covers: [K1.13, K1.2]
    type: mc
    prompt: 'Jun says, "Habeas corpus only matters to people who did something wrong. I’d never be jailed." What is the best reply?'
    choices:
      - It protects anyone who is held, even by mistake or for no good reason.
      - It only matters to judges, because they are the ones who use it.
      - You’re right. People who follow the rules never need any legal rights.
      - It matters because it lets people leave jail whenever they want.
    answer: 0
    feedback:
      '1': Judges use it, but whose freedom is it protecting?
      '2': Ellen and Thomas in this lesson did nothing wrong, as far as we know. Who held them?
      '3': The judge decides. When does a person held have to be let go?
    hints:
      - Think of Thomas in the worked example. What had he done?
    solution:
      - Habeas corpus protects **everyone**, including people held by mistake, or by someone with too much power.
      - Without it, anyone could be locked away and forgotten. That’s why it is an **individual legal right**.

  - id: b4
    level: 2
    thinking: connect
    covers: [K1.16, K1.15]
    type: mc
    prompt: 'In Alberta’s Legislature, an MLA says in a debate that a company is polluting a river. The company wants to take the MLA to court for saying it. Which idea protects the MLA?'
    choices:
      - Free speech in parliament, from the Bill of Rights
      - Habeas corpus, from the Habeas Corpus Act
      - A lottery, from the democracy of Athens
      - The two consuls, from the Roman Republic
    answer: 0
    feedback:
      '1': Habeas corpus is about being held in jail. Is the MLA in jail?
      '2': A lottery is a way of choosing people. Does it protect what someone says?
      '3': Consuls could block each other. Do they have anything to do with speech?
    hints:
      - Where did the MLA speak? Which right is about speaking there?
    solution:
      - The Bill of Rights said that speech and debates in Parliament can’t be questioned in any court.
      - Its **legacy** is free debate in parliaments and legislatures, including Alberta’s, so members can raise hard issues.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: evidence
    covers: [K1.12, K1.13, U1.1]
    type: investigation
    prompt: |-
      **June 1215:** King John seals the Magna Carta.
      **August 1215:** At John’s request, the Pope cancels it. War breaks out between John and the barons.
      **1216:** John dies. His son, Henry, is 9 years old. Henry’s advisers issue the Magna Carta again, and again in 1217 and 1225.
      **1679:** The Habeas Corpus Act builds on the Magna Carta’s idea that no one can be jailed except by the law of the land.
    parts:
      - type: mc
        prompt: Did the Magna Carta stop King John from ruling however he liked?
        choices:
          - No. Within months it was cancelled, and John fought on.
          - Yes. From June 1215, John always followed the law.
          - Yes. The Pope made John obey it.
        fixedOrder: true
        answer: 0
        feedback:
          '1': Read the August 1215 line again. What happened to the charter?
          '2': Who asked the Pope to step in, and what did the Pope do?
        hints: [Look at what happened just two months later.]
        solution: ['The Pope cancelled it at John’s request, and war broke out. In 1215, it changed very little.']
      - type: mc
        prompt: Henry’s advisers issued it again and again. What does that suggest?
        choices:
          - People still wanted the king to be limited by law, so it was worth bringing back.
          - Henry wanted more power for himself than his father had.
          - The first copies had all been lost or destroyed.
          - The barons had forgotten what the Magna Carta said.
        answer: 0
        feedback:
          '1': Would a king who wanted more power bring back a charter that limits him?
          '2': Nothing in the timeline says the copies were lost. Why bring it back three times?
          '3': If the barons forgot it, would bringing it back win their support?
        hints: [Why would a 9-year-old king’s advisers bring back a charter that limits the king?]
        solution: ['The ideas still mattered to the barons. Reissuing the charter helped the young king’s side win their support.']
      - type: mc
        prompt: So why do historians call the Magna Carta a **foundation** for rights, if it failed in 1215?
        choices:
          - Later people kept building on its ideas, such as the Habeas Corpus Act.
          - It was the first law ever written down anywhere in the world.
          - It gave every person in England the right to vote.
          - It ended the monarchy in England for good.
        answer: 0
        feedback:
          '1': Draco wrote down the laws of Athens much earlier. What did later people do with the Magna Carta?
          '2': Votes for everyone came centuries later. What did the charter actually promise?
          '3': England still had kings and queens. What did later laws build on?
        hints: [Look at the 1679 line.]
        solution: ['A foundation is something you build on. Its importance grew over time, as later laws built on its ideas.']
    wrapUp: The Magna Carta failed at first, but its ideas lasted. An event can matter less for what it did that day than for what people built on it later.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: flaw
    covers: [K1.12, K1.14, K1.15, U1.1]
    type: mc
    prompt: 'Sam writes, "In 1215, the Magna Carta turned England into a democracy." What is wrong with Sam’s sentence?'
    choices:
      - It limited the king, but most people still had no say. Parliament’s power and free elections came much later.
      - Nothing. Once the king had to follow the law, England was a full democracy.
      - The Magna Carta made England an absolute monarchy instead.
      - The Magna Carta was about Athens, not about England.
    answer: 0
    feedback:
      '1': Who got to choose England’s government in 1215? Did ordinary people vote?
      '2': An absolute monarch has no limits. What did the Magna Carta do to the king?
      '3': It was sealed at Runnymede, in England. What did it really change?
    hints:
      - What does a democracy need? Did England have it in 1215?
      - When did Parliament get the authority to decide, and free elections?
    solution:
      - The Magna Carta was a start. It limited the king and protected free men.
      - But most people had no voice. Parliament gained authority, and free elections, in the Bill of Rights of 1689.
      - Democracy grew step by step over centuries. Sam’s sentence squeezes that long story into one moment.
