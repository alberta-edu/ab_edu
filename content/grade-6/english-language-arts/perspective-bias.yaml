id: perspective-bias
grade: 6
subject: english-language-arts
organizingIdea: LANENG-OI7
outcomes: [LANENG6-OI7-GQ1-LO1]
order: 8
title: Perspective, Bias and Context
shortTitle: Perspective, bias & context
summary: >-
  Spot loaded words and bias, watch a character’s perspective change, read texts and artifacts in
  their context, and see how ads and posts try to influence you.

bigIdea: |-
  - Authors share **perspectives**, sometimes openly and sometimes through word choice.
  - **Bias** favours one side unfairly. Loaded words are a clue.
  - Perspectives change with time, experience, context and new information. Seeing another side builds **empathy**.
  - Every text, and every artifact, comes from a **context**: a time, a place and people’s beliefs.

lesson:
  - title: Same event, different slant
    blocks:
      - type: visual
        covers: [K4.3, K4.4, S4.6, K5.7, S5.5]
        component: slant-meter
        props:
          event: The town council voted to turn the empty lot on Pine Street into a skatepark.
          reports:
            - label: Town website
              source: Town of Cedar Hills website
              text: On Monday, council voted 5 to 2 to build a skatepark on the empty lot on Pine Street. Building starts in the spring.
              leans: It gives the facts and favours no side.
            - label: A skater’s post
              source: A post by a local skater
              text: '[[FINALLY!|On Monday,]] council [[did the right thing|voted]] and we’re getting an [[awesome|new]] skatepark on Pine. The [[haters|people who disagreed]] lost 5 to 2!'
              leans: It favours the skatepark, and it is unfair to people who disagreed.
            - label: A neighbour’s letter
              source: A letter to the newspaper from a Pine Street neighbour
              text: 'Council [[rushed through|approved]] a [[noisy|new]] skatepark on Pine Street, [[right on top of|beside]] our homes.'
              leans: It favours the neighbours who didn’t want the skatepark.
            - label: An ad
              source: An ad from a made-up sports store
              text: '[[Every cool kid|Lots of skaters]] [[will be|might be]] at the new park. Don’t be the [[only one|person]] without a new board!'
              leans: It wants you to buy something, and tries to make you feel left out.
        caption: Read each text. Then **show the slant**, and **make it fair**. What changes?
      - type: callout
        variant: tip
        covers: [K4.3, S4.6]
        title: Ask three questions
        body: |-
          1. Who made this?
          2. Which side do the words favour?
          3. What do they want me to think, feel or do?

  - title: Read the story
    blocks:
      - type: passage
        id: shortcut
        title: The Shortcut
        form: Realistic fiction
        paragraphs:
          - For two years, everyone on Larch Crescent had cut through Mr. Petrov’s side yard to get to the park. Then, one morning in May, he was standing in the gap between the fences with his arms crossed.
          - “Go around!” he called to Ava and her brother Jonah. “Not through here. Not this month.”
          - Going around took six extra minutes. Ava timed it every day, and told anyone who would listen. “He’s just grumpy,” she said. “He doesn’t like kids.”
          - On Saturday, Ava’s ball rolled through the gap. When she ran in after it, a brown-and-white bird burst out of the gravel and flopped across the ground, dragging one wing as if it were broken.
          - “Stop! Don’t move,” said Mr. Petrov, hurrying around the shed. He didn’t sound angry this time. He pointed at the gravel beside her sneaker. Four speckled eggs lay in a shallow dip, so much like the stones around them that Ava had almost stepped on them.
          - “Killdeer,” he said quietly. “The mother pretends to be hurt, so you’ll follow her away from the nest. Clever, eh?”
          - Ava looked at the eggs for a long time. Then she looked at Mr. Petrov. For the next three weeks, she took the long way around without being asked. She even made a sign for the end of the street. It said, “Killdeer nesting, please go around.”
          - In June, the gap was open again. The chicks had hatched and run off with their parents. Mr. Petrov waved from his steps as Ava and Jonah came through. “Shortcut’s open,” he called. Ava grinned. “Thanks, Mr. Petrov. Say hi to the killdeer for us.”
        note: An original story written for Alberta Edu. Killdeer really do nest on bare gravel and pretend to have a broken wing. Paragraph numbers help you point to evidence.

  - title: Why perspectives change
    blocks:
      - type: table
        covers: [K4.1, S4.2, S5.3]
        caption: Ava’s view of Mr. Petrov changes. So does what he does. Why?
        headers: [Reason, In “The Shortcut”]
        rows:
          - ['**New information**', 'Ava learns there is a nest in the gravel.']
          - ['**Experience**', 'She sees the mother killdeer pretend to be hurt, and almost steps on the eggs.']
          - ['**Context**', 'It is nesting season. Mr. Petrov closes the gap in May, while the eggs are there.']
          - ['**Passage of time**', 'By June the chicks are gone, so he opens the gap again.']
      - type: callout
        variant: tip
        covers: [K4.2, S4.5, U4.1]
        title: From grumpy to kind
        body: Ava stopped judging Mr. Petrov once she saw things from where he stood. Thinking about someone else’s reasons is how **empathy** grows.

  - title: Your view and the text’s
    blocks:
      - type: compare
        covers: [S4.1, S4.3, S4.4]
        columns:
          - title: 🙋 Connect it to you
            body: Have you ever judged someone, then found out their reason? That memory helps you understand Ava.
          - title: ⚖️ Compare views
            body: 'You might side with Ava at first. Six minutes is a long detour! Then compare your view with Mr. Petrov’s.'
          - title: 🔎 Pick the right support
            body: 'To argue “Mr. Petrov is kind,” choose details that show it, such as how quietly he speaks once she sees the nest.'

  - title: Texts come from a context
    blocks:
      - type: table
        covers: [K5.1, K5.2, K5.3, K5.4, K5.5, S5.1, S5.2, U5.1]
        caption: A science book from 1990 says, “Our solar system has nine planets. The smallest is Pluto.”
        headers: [Context, What it tells us]
        rows:
          - ['**Time**', 'In 1990, scientists counted Pluto as a planet.']
          - ['**Place**', 'A science book for students, written to inform them.']
          - ['**Beliefs**', 'It shows what scientists believed then, based on what they knew.']
          - ['**Context changed**', 'In 2006, astronomers decided Pluto is a dwarf planet. The book wasn’t lying. Its context changed.']
      - type: callout
        variant: tip
        covers: [K5.5, S5.2]
        title: Look for clues of change
        body: Words like *back then*, *now*, or a date can show the context has changed. So can a new law, a new tool or a new idea in the story.

  - title: Artifacts are texts
    blocks:
      - type: figure
        covers: [K5.6, S5.4]
        figure: >-
          <svg viewBox="0 0 320 200" class="fig-svg" role="img" aria-label="A drawing of a cassette tape. Its handwritten label says: Songs for Mom, taped off the radio, December 1987.">
          <rect x="20" y="20" width="280" height="160" rx="12" fill="#3a3a46" stroke="#1c1b24" stroke-width="3"/>
          <rect x="40" y="34" width="240" height="56" rx="4" fill="#f4ecd6"/>
          <text x="160" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1b24" font-style="italic">Songs for Mom</text>
          <text x="160" y="80" text-anchor="middle" font-size="13" fill="#4a4858" font-style="italic">taped off the radio, Dec. 1987</text>
          <rect x="70" y="102" width="180" height="48" rx="24" fill="#24232e" stroke="#8a8796" stroke-width="2"/>
          <circle cx="110" cy="126" r="16" fill="#f4ecd6"/><circle cx="210" cy="126" r="16" fill="#f4ecd6"/>
          <circle cx="110" cy="126" r="6" fill="#24232e"/><circle cx="210" cy="126" r="6" fill="#24232e"/>
          <rect x="128" y="118" width="64" height="16" fill="#5b4636"/>
          </svg>
        caption: An **artifact** found in a family’s basement. What can it tell you?
      - type: table
        covers: [K5.6, S5.4, S5.1]
        caption: Reading the artifact like a text
        headers: [Clue, 'What it suggests about people, time or place']
        rows:
          - ['“Taped off the radio”', 'In 1987, people recorded songs from the radio to keep them.']
          - ['Handwritten label', 'It was made by hand, for one person.']
          - ['“Songs for Mom”', 'It was a gift, and music mattered in this family.']
          - ['A cassette tape', 'Music was stored on tape, not on phones.']

keyTerms:
  - term: Perspective
    covers: [K4.1, K4.3]
    definition: The way a person sees and thinks about something.
  - term: Bias
    covers: [K4.4]
    definition: Favouring one thing, person or group over another, usually in an unfair way.
  - term: Loaded word
    covers: [K4.4, S4.6]
    definition: A word chosen to make readers feel a certain way, such as noisy instead of new.
  - term: Empathy
    covers: [K4.2]
    definition: Understanding and sharing the feelings of another person.
  - term: Context
    covers: [K5.1, K5.3, K5.4]
    definition: The time, place and beliefs that a text comes from.
  - term: Artifact
    covers: [K5.6]
    definition: An object made by people that can tell us about a time, a place or the people who made it.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K4.4, S4.6]
    type: mc
    prompt: All four sentences report the same school event. Which one shows **bias**?
    choices:
      - The lazy Grade 5s lost the tug-of-war to the mighty Grade 6s.
      - The Grade 6s won the tug-of-war against the Grade 5s.
      - In the tug-of-war, the Grade 5s finished second.
      - The tug-of-war ended in a win for the Grade 6 team.
    answer: 0
    feedback:
      '1': This gives the result, and favours nobody.
      '2': This says who came second, without judging anyone.
      '3': This reports the winner, with no loaded words.
    hints:
      - Look for words that judge a team, not just report what happened.
    solution:
      - '*Lazy* and *mighty* are **loaded words**. They make one team look bad and the other look great.'
      - The facts are the same in every sentence. Only the first one takes a side.

  - id: w2
    level: 1
    thinking: recall
    covers: [K4.1, S4.2]
    type: mc
    prompt: In “The Shortcut,” what **first** changes Ava’s view of Mr. Petrov?
    choices:
      - New information, when she finds out there is a nest in the gravel.
      - Her brother Jonah tells her to stop being rude to him.
      - Mr. Petrov gives her a gift to say sorry for yelling.
      - She gets tired of timing the long way around each day.
    answer: 0
    feedback:
      '1': Jonah never says that. What happens on Saturday?
      '2': There is no gift. What does he show her?
      '3': She is still timing it and complaining in paragraph 3. What changes on Saturday?
    hints:
      - Look at paragraphs 4 to 6. What does Ava learn?
    solution:
      - On Saturday she finds the killdeer nest. That **new information** explains why he closed the gap.

  - id: w3
    level: 1
    thinking: apply
    covers: [K5.6, S5.4]
    type: mc
    prompt: The cassette label says “taped off the radio, Dec. 1987.” What does that clue suggest about **1987**?
    choices:
      - People recorded songs from the radio to keep and share them.
      - People only listened to music on the radio, never on tapes.
      - Radios were brand new in 1987, so everyone wanted one.
      - Mom recorded the songs herself, on her own radio show.
    answer: 0
    feedback:
      '1': The songs ended up on a tape, so tapes were used too.
      '2': Nothing on the label says radios were new. What is the clue really about?
      '3': '“Taped off the radio” means recorded from it. Is there a clue that Mom had a show?'
    hints:
      - What does “taped off” mean?
    solution:
      - Someone recorded songs as the radio played them, to make a gift. The artifact gives a peek at how people kept music then.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: evidence
    covers: [S4.2, K4.1]
    type: evidence
    prompt: Tap the sentence that best shows Ava’s perspective has **changed**, through what she does.
    passage: shortcut
    paragraphs: [3, 7]
    answer: [p7s3, p7s4]
    feedback:
      p3s1: This is the detour, while she still resents it.
      p3s2: She is still complaining here.
      p3s3: This is her old view. Look for what she does later.
      p3s4: This is her old view. Look for what she does later.
      p7s1: She is thinking, but what does she **do**?
      p7s2: She looks at him, but we don’t know yet what she thinks. What does she do next?
      p7s5: This is the sign’s message. Which sentence shows Ava choosing to act?
    hints:
      - Compare what Ava does in paragraph 3 with what she does in paragraph 7.
    solution:
      - '“For the next three weeks, she took the long way around without being asked.” or “She even made a sign for the end of the street.”'
      - The girl who timed the detour to complain now takes it willingly, and asks others to as well. Her actions show her new perspective.

  - id: b2
    level: 2
    thinking: perspective
    covers: [K4.3, S4.6]
    type: mc
    prompt: |-
      A newsletter says:

      > Our beautiful new library finally replaces that cramped, gloomy old building.

      The writer never says, “I like the new library.” How do we know the writer’s perspective?
    choices:
      - From the word choice, *beautiful* for the new and *cramped, gloomy* for the old.
      - From the facts, because the new library has more books than the old one.
      - We can’t know, because the writer never says “I think” in the sentence.
      - From the length, because the writer uses more words about the old building.
    answer: 0
    feedback:
      '1': The sentence gives no facts about books. What else could show the writer’s view?
      '2': Authors can share a perspective **implicitly**, without saying “I think.”
      '3': Counting words won’t tell you much. Which words carry a feeling?
    hints:
      - Which words judge the buildings, rather than describe them?
    solution:
      - '*Beautiful*, *cramped*, *gloomy* and *finally* all lean one way. The perspective is shared **implicitly**, through word choice.'

  - id: b3
    level: 2
    thinking: why
    covers: [K5.5, S5.2, K5.3]
    type: mc
    prompt: You find a science book from 1990 that says there are nine planets. Today, we count eight. How should you read the old book?
    choices:
      - It was accurate for its time. The context changed when scientists learned more.
      - It was always wrong, so nothing else in the book can be trusted.
      - It is right, and today’s books are the ones that made a mistake.
      - It must have been written as a joke, since planets can’t change.
    answer: 0
    feedback:
      '1': It matched what scientists knew in 1990. Should one change make the whole book useless?
      '2': Scientists decided Pluto is a dwarf planet in 2006, based on new information.
      '3': The planets didn’t change. What changed was how people understood them.
    hints:
      - What changed between 1990 and today, Pluto or what we know?
    solution:
      - The book matched what scientists believed in 1990. In 2006, new information changed how Pluto is classed.
      - Read old texts in their **context**. Ask what people knew and believed then.

  - id: b4
    level: 2
    thinking: evidence
    covers: [S4.4]
    type: multi
    prompt: You want to argue, “**Mr. Petrov cares about others.**” Which details from the story support your perspective? Choose every one.
    choices:
      - He didn’t sound angry once Ava was near the nest.
      - He closed the gap only while the eggs were there.
      - He waved and opened the shortcut again in June.
      - He stood in the gap with his arms crossed.
      - He called out, “Go around! Not through here.”
    answer: [0, 1, 2]
    feedback:
      '3': This made him look unfriendly at first. Does it support your point, or the opposite view?
      '4': Out of context, this sounds rude. Which details show his care?
    hints:
      - Pick details that show his care, not ones that make him seem grumpy.
    solution:
      - His quiet voice, his reason for closing the gap, and his wave in June all show care.
      - Selecting the information that supports a perspective is how you build a strong argument. Be ready for the other side’s details too.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: evidence
    covers: [K5.7, S5.5, S4.6]
    type: investigation
    prompt: |-
      A famous skateboarder posts a video:

      > I only ride **SpeedyDeck** boards. Every real skater does. 🔥 #SpeedyDeckTeam #ad

      SpeedyDeck is a made-up company.
    parts:
      - type: mc
        prompt: What does **#ad** tell you?
        choices:
          - The company paid for the post, so its goal is to sell boards.
          - The post is about adding more tricks to your skating.
          - The skater is sharing a review that nobody asked for.
          - The video was made by a school to teach skating safety.
        answer: 0
        feedback:
          '1': '*#ad* is short for advertisement. Who would pay for that?'
          '2': If it was paid for, is it just a review? Who gains?
          '3': Nothing points to a school. Look at the hashtags.
        hints:
          - What is *ad* short for?
        solution:
          - '*#ad* means it is an advertisement. The company paid, and the post is there to sell boards.'
      - type: mc
        prompt: Which words try hardest to **influence** you?
        choices:
          - Every real skater does.
          - I only ride
          - SpeedyDeck boards
          - '#SpeedyDeckTeam'
        answer: 0
        feedback:
          '1': This tells you what the skater rides. What do the next words say about **you**?
          '2': This names the product. Which words make you worry about yourself?
          '3': This is a team name. Which words make a claim about all skaters?
        hints:
          - Which words would make someone without the board feel left out?
        solution:
          - '“Every real skater does” suggests that if you don’t ride one, you aren’t a real skater. It plays on wanting to belong.'
      - type: mc
        prompt: What is the best way to respond?
        choices:
          - Enjoy the tricks, but compare boards from other sources before deciding.
          - Buy the board, since a famous skater wouldn’t say it if it weren’t true.
          - Report the skater, since paid posts are against the rules everywhere.
          - Stop skating, since all skating videos are just ads in disguise.
        answer: 0
        feedback:
          '1': The skater was paid. Does that make the claim more trustworthy, or less?
          '2': A paid post can be honest about being an ad. Here, it says *#ad*. What should you do with it?
          '3': Some videos are ads, and some aren’t. The skill is telling them apart.
        hints:
          - Is the post trying to inform you or to influence you? What would a careful buyer do?
        solution:
          - Enjoy the video, but know it is meant to influence. Check other sources before you decide.
    wrapUp: Ads and posts can be fun and still be designed to influence you. Ask who made it, who paid, and which words are pushing you.

  - id: d2
    level: 3
    thinking: perspective
    covers: [K4.2, S4.5, S4.3]
    type: mc
    prompt: Imagine paragraph 2 from **Mr. Petrov’s** perspective. Which thought fits him best as he calls, “Go around!”?
    choices:
      - “If they run through now, someone will step on those eggs. I have to stop them.”
      - “These kids are so noisy. I want my yard back to myself for good.”
      - “I hope they go around, because the park is closed this month.”
      - “Maybe if I’m grumpy enough, they’ll stop playing in the park.”
    answer: 0
    feedback:
      '1': That is how Ava saw him. Does it fit what he does in June?
      '2': The park isn’t closed. What is in his yard?
      '3': He waves them through in June. Does he want them to stop going to the park?
    hints:
      - What did Mr. Petrov know in May that Ava didn’t?
      - Check your answer against what he does in June.
    solution:
      - He knew about the nest. His sharp words were about the eggs, not about the kids.
      - Ava couldn’t see that at first. Imagining his side is what builds **empathy**, and it fits everything he does later.
