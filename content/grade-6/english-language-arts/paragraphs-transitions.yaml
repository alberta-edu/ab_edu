id: paragraphs-transitions
grade: 6
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG6-OI8-GQ1-LO1]
order: 9
title: Planning, Revising and Linking Paragraphs
shortTitle: Paragraphs & transitions
summary: >-
  Take an opinion piece from plan to publication, build paragraphs around a position, link them
  with transitions, and choose a writing tool.

bigIdea: |-
  - Writers **plan** for an audience, purpose and form, then draft, revise, edit and publish.
  - Strong writing has a **lead**, details in a clear order, **transitions** and a **conclusion**.
  - Revising means adding, deleting, moving and restructuring, until the writing is clear and focused.
  - Choose printing, cursive or keyboarding to fit the job.

lesson:
  - title: From plan to published
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.6, K1.7, S1.1, S1.3, S1.9, S1.10, S1.11, U1.1]
        component: writing-path
        props:
          stages:
            - icon: 🗺️
              label: Plan
              job: Choose your audience, purpose and form. Generate ideas, then narrow the topic.
              page: |-
                **Audience:** the principal and the school council. **Purpose:** to persuade. **Form:** an opinion letter.

                **Ideas:** longer recess? a games library? a reading nook?

                **Narrowed topic:** a lending library of board games for indoor recess
            - icon: ✏️
              label: Draft
              job: Get your ideas down in paragraphs. Don’t stop to fix things yet.
              page: |-
                we should have a board game library. Indoor recess is boring. games are fun. My cousin has a game library at her school in Red Deer.

                Kids who dont know each other can play together. It would help new kids.
            - icon: 🔧
              label: Revise
              job: 'Add, delete, move or restructure, so it is clear, focused and engaging.'
              page: |-
                ++What do 300 students do when it’s minus 30 outside?++ we should have a board game library. Indoor recess is boring. ~~games are fun.~~ ++Last week, my whole class just stared at the clock.++

                ++Most importantly,++ kids who dont know each other can play together. It would help new kids ++make friends in their first week++.
            - icon: 🔍
              label: Edit
              job: Fix spelling, punctuation and grammar.
              page: |-
                What do 300 students do when it’s minus 30 outside? ~~we~~ ++We++ should have a board game library. …

                Most importantly, kids who ~~dont~~ ++don’t++ know each other can play together. …
            - icon: 🚀
              label: Publish
              job: Choose a final form, and add text features that help.
              page: |-
                A typed letter with a heading, and a **chart** of how many indoor recesses we had last winter, with a **caption**.
        caption: Follow one opinion letter through the writing process. Watch what gets cut, added and moved.

  - title: Build the structure
    blocks:
      - type: visual
        covers: [K1.3, S1.5, S1.6, S1.7, S1.2]
        component: text-xray
        props:
          button: Show the structure
          pages:
            - label: The finished letter
              note: Several paragraphs, each with a job, all organized around one **position**.
              parts:
                - { style: text, text: 'What do 300 students do when it’s minus 30 outside? Right now, not much. Our school should start a lending library of board games for indoor recess.', tag: Lead and position, job: 'Hooks the reader, then states the position clearly.' }
                - { style: text, text: 'To begin with, indoor recess is long and dull. Last week, my class spent twenty minutes staring at the clock.', tag: Reason 1 with an example, job: 'Supports the position with an example.' }
                - { style: text, text: 'Even more important, games bring people together. A new student who doesn’t know anyone can still join a game of checkers.', tag: 'Reason 2, the strongest', job: 'Details in order of importance, saving the best for last.' }
                - { style: text, text: 'In the end, a shelf of games costs little and gives a lot. Please let us start our games library this winter.', tag: Conclusion, job: 'Sums up and tells the reader what to do.' }
        caption: Switch on the X-ray. Notice the **transitions** that start each paragraph.

  - title: Transitions link ideas
    blocks:
      - type: visual
        covers: [K1.3, S1.8]
        component: card-sort
        props:
          bins:
            - { id: time, label: Time order, icon: ⏱️ }
            - { id: importance, label: Importance, icon: ⭐ }
            - { id: contrast, label: A turn, icon: ↩️ }
            - { id: example, label: An example, icon: 🔎 }
          cards:
            - { text: First, bin: time, why: 'Starts a sequence.' }
            - { text: After that, bin: time, why: 'Moves to the next event.' }
            - { text: Most importantly, bin: importance, why: 'Signals the strongest point.' }
            - { text: Even more important, bin: importance, why: 'Climbs to a bigger point.' }
            - { text: On the other hand, bin: contrast, why: 'Turns to another side.' }
            - { text: However, bin: contrast, why: 'Signals a change of direction.' }
            - { text: For example, bin: example, why: 'Brings in a specific case.' }
        caption: Sort each transition by its job. A transition tells the reader how the next idea is connected to the last one.

  - title: Vary your sentences
    blocks:
      - type: visual
        covers: [K1.4, K1.5]
        component: sentence-rhythm
        props:
          examples:
            - label: Choppy
              text: Indoor recess is long. We sit at our desks. We stare at the clock. Nobody talks much. It is very boring.
            - label: Varied
              text: Indoor recess is long. We sit at our desks and stare at the clock while the minutes crawl by. Nobody talks. It is, honestly, the longest twenty minutes of the day.
        caption: Each bar is one sentence. Read both aloud. Which one is easier to read with expression?

  - title: Four ways to revise
    blocks:
      - type: table
        covers: [K1.6, K1.7, S1.9]
        caption: Revising makes writing clear, focused, informative and engaging.
        headers: [Move, Before, After]
        rows:
          - ['**Add**', 'Indoor recess is boring.', 'Indoor recess is boring. **Last week, my class stared at the clock for twenty minutes.**']
          - ['**Delete**', 'Games are fun. ~~My dog likes games too.~~', 'Games are fun.']
          - ['**Move**', 'The strongest reason came first.', 'The strongest reason moved to last, so the letter builds.']
          - ['**Restructure**', 'Games. They help new kids. Make friends.', 'Games help new kids make friends.']
      - type: callout
        variant: tip
        covers: [S1.4, S1.9]
        title: Check it against your plan
        body: 'Ask: does every sentence fit my **audience**, my **purpose** and my **form**? If not, revise it or cut it.'

  - title: Choose your writing tool
    blocks:
      - type: visual
        covers: [K4.1, K4.2, S4.2, U4.1]
        component: card-sort
        props:
          bins:
            - { id: print, label: Printing, icon: ✏️ }
            - { id: cursive, label: Cursive, icon: ✒️ }
            - { id: keys, label: Keyboarding, icon: ⌨️ }
          cards:
            - { text: A big sign for your lemonade stand, bin: print, why: 'Clear printed letters can be read from far away.' }
            - { text: Labels on a science diagram, bin: print, why: 'Small printed labels are neat and easy to read.' }
            - { text: A thank-you card to Grandma, bin: cursive, why: 'Joined-up handwriting feels personal and shows care.' }
            - { text: Quick notes while a speaker is talking, bin: cursive, why: 'Joined letters can flow quickly from one to the next.' }
            - { text: A three-page report with a chart, bin: keys, why: 'Typing makes long work easy to revise, and adds charts.' }
            - { text: The class newsletter for the website, bin: keys, why: 'It is going online, so a typed version makes sense.' }
        caption: Sort each job by the best tool. Sometimes more than one could work. Pick the best fit.
      - type: callout
        variant: tip
        covers: [S4.1, S4.3]
        title: Make it readable, and keep it flowing
        body: Whatever the tool, your reader has to read it. Practise until your writing is **legible** and **fluent**, neat enough to read and quick enough to keep up with your ideas.

keyTerms:
  - term: Lead
    covers: [K1.3]
    definition: The opening of a piece of writing, which hooks the reader.
  - term: Position
    covers: [S1.6]
    definition: The opinion a piece of writing argues for, supported by examples and evidence.
  - term: Transition
    covers: [K1.3, S1.8]
    definition: A word or phrase that links one idea or paragraph to the next, such as however or most importantly.
  - term: Conclusion
    covers: [K1.3]
    definition: The ending of a piece of writing, which sums up and leaves the reader with something to think or do.
  - term: Revising
    covers: [K1.6]
    definition: Improving writing by adding, deleting, moving or restructuring parts.
  - term: Editing
    covers: [K1.1, S1.10]
    definition: Fixing spelling, punctuation and grammar.
  - term: Legible
    covers: [S4.3]
    definition: Clear enough to be read easily.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.3, S1.8]
    type: mc
    prompt: Maya’s next paragraph gives her **strongest** reason. Which transition should start it?
    choices: ['Most importantly,', 'For example,', 'After that,', 'On the other hand,']
    fixedOrder: true
    answer: 0
    feedback:
      '1': '*For example* brings in a specific case. Is she giving an example?'
      '2': '*After that* shows time order. Is she telling events in order?'
      '3': '*On the other hand* turns to another side. Is she changing direction?'
    hints:
      - Which transition tells the reader, “This is the big one”?
    solution:
      - '**Most importantly** signals the strongest point. It prepares the reader to pay attention.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.2]
    type: mc
    prompt: Kofi wants to write about hockey. Which topic is **narrowed** the most, so he can write about it well in a few paragraphs?
    choices:
      - How my team learned to win face-offs this season
      - Hockey
      - The history of hockey in Canada
      - Winter sports
    answer: 0
    feedback:
      '1': Hockey is huge. Where would he even start?
      '2': That could fill a whole book. Can it fit in a few paragraphs?
      '3': This is even wider than hockey.
    hints:
      - Which topic could he really cover in three or four paragraphs?
    solution:
      - '“How my team learned to win face-offs this season” is small enough to cover well, with real details.'
      - The others are too big for a few paragraphs.

  - id: w3
    level: 1
    thinking: recall
    covers: [K4.1, K4.2, S4.2]
    type: mc
    prompt: Nadia is making a three-page report with a chart, to post on the class website. Which tool fits best?
    choices: [Keyboarding, Cursive, Printing, Any of them equally]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Cursive is personal and quick for notes. Is it the best way to post a long report online?
      '2': Printing is clear for signs and labels. Is it the easiest for three pages going online?
      '3': They can all work, but one fits this job much better. What does the job need?
    hints:
      - It is long, has a chart, and is going online.
    solution:
      - Keyboarding makes long work easy to revise, adds a chart, and is ready to post online.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.6, S1.9]
    type: mc
    prompt: |-
      Draft:
      > Games help new kids make friends. Indoor recess is long and dull. A games library would fix both problems.

      Revision:
      > Indoor recess is long and dull. Games help new kids make friends. A games library would fix both problems.

      What kind of revision did the writer make?
    choices:
      - Moving
      - Adding
      - Deleting
      - Editing
    fixedOrder: true
    answer: 0
    feedback:
      '1': Are there any new words?
      '2': Is anything missing from the revision?
      '3': Editing fixes spelling, punctuation and grammar. Were any mistakes fixed?
    hints:
      - Compare the sentences one at a time. What changed?
    solution:
      - The same three sentences are there, in a new order. That is **moving**.
      - The writer put the smaller problem first, so the friendship point comes later and lands harder.

  - id: b2
    level: 2
    thinking: flaw
    covers: [S1.6, S1.9, K1.7]
    type: mc
    prompt: |-
      Liam’s position: **Our school needs a bike rack by the front door.**

      > (1) Right now, bikes lean against the fence and fall over. (2) Last month, two bikes were scratched. (3) My bike is blue and has eighteen gears. (4) A rack would keep bikes safe and tidy.

      Which sentence should Liam **delete** to keep the paragraph focused?
    choices: [Sentence 3, Sentence 1, Sentence 2, Sentence 4]
    fixedOrder: true
    answer: 0
    feedback:
      '1': This shows the problem the rack would fix. Does it support the position?
      '2': This is evidence that bikes get damaged. Does it support the position?
      '3': This explains what a rack would do. Does it support the position?
    hints:
      - Which sentence doesn’t help prove that the school needs a rack?
    solution:
      - Sentence 3 is about Liam’s bike, not about why the school needs a rack. It doesn’t support his position.
      - Revising for **focus** means cutting what doesn’t serve the main idea, even if it is true.

  - id: b3
    level: 2
    thinking: breakdown
    covers: [K1.3, S1.5, S1.7, S1.8]
    type: order
    prompt: Put Jordan’s opinion piece about a school garden in the best order.
    items:
      - Imagine eating a carrot you grew yourself. Our school should plant a garden.
      - To begin with, a garden would teach us how food grows.
      - Even more important, it would give everyone a calm place to go at recess.
      - In the end, a garden would feed our bodies and our minds. Let’s dig in this spring!
    hints:
      - Find the lead first, then the conclusion. The transitions show the middle order.
    solution:
      - The lead hooks the reader and states the position. *To begin with* starts the first reason. *Even more important* climbs to the strongest one. *In the end* concludes.
      - Transitions are like signposts. They show readers how the paragraphs connect.

  - id: b4
    level: 2
    thinking: why
    covers: [K1.4, K1.5]
    type: mc
    prompt: |-
      > We went to the lake. It was cold. We swam anyway. It was fun.

      Which revision would be **easiest to read aloud with expression**?
    choices:
      - We went to the lake. The water was so cold that our teeth chattered, but we swam anyway. It was the best day of the summer.
      - We went to the lake. It was very cold. We swam in it anyway. It was very fun.
      - We went to the lake and it was cold and we swam anyway and it was fun.
      - The lake. Cold. Swimming anyway. Fun.
    answer: 0
    feedback:
      '1': The sentences are still all the same short length. Does it sound any less choppy?
      '2': One long run-on is as flat as four short ones. Where would a reader take a breath?
      '3': Even shorter pieces sound choppier still.
    hints:
      - Read each one aloud. Which one changes pace?
    solution:
      - The first revision mixes short and long sentences. The voice can slow down for the cold, then lift for the best day.
      - Variety in sentence length makes writing **fluent**, and fluent writing invites expressive reading.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [S1.4, S1.9, K1.2, S1.11]
    type: investigation
    prompt: |-
      Priya wrote this to ask the **town council** for a crosswalk near the school:

      > hey!! the corner by our school is SO sketchy. cars go like a million km an hour. pls fix it 🙏
    parts:
      - type: mc
        prompt: What is the biggest problem with Priya’s draft?
        choices:
          - Its style fits a text to a friend, not a letter to the council.
          - It is too long, so the council won’t read it all.
          - It doesn’t say what she wants the council to do.
          - It uses the word *corner* instead of the street’s name.
        answer: 0
        feedback:
          '1': It is very short. What else is off?
          '2': “Pls fix it” does ask for something. Is the way she asks right for this audience?
          '3': A street name would help. But is it the biggest problem?
        hints:
          - Who is the audience? Would they write to each other like this?
        solution:
          - Slang, emojis and no capitals fit a friend. The council is an official audience, so the **style** doesn’t match.
      - type: mc
        prompt: Which revised opening fits her audience, purpose and form?
        choices:
          - Dear councillors, I am writing to ask for a crosswalk at the corner of Elm Street and 3rd Avenue, beside our school.
          - Dear councillors, the corner is SO dangerous, like seriously the worst corner in the world.
          - To whom it may concern, crosswalks are a type of road marking used in many countries.
          - Hi council! Hope you’re having a great week! Anyway, crosswalks are cool.
        answer: 0
        feedback:
          '1': It starts politely, but the exaggeration and capitals still sound like a text to a friend.
          '2': This is formal, but it gives facts about crosswalks instead of making her request. What is her purpose?
          '3': Friendly, but too casual, and it doesn’t say what she wants.
        hints:
          - It should be polite, clear, and say what she wants and where.
        solution:
          - The first opening is polite, names the exact place, and states the request at once.
      - type: mc
        prompt: To **publish** her letter, which text feature would help most?
        choices:
          - A map of the corner, with a caption showing where children cross
          - A drawing of her favourite car, to make the letter more fun
          - A glossary that explains the word *crosswalk*
          - Bold capital letters on every sentence, to show it matters
        answer: 0
        feedback:
          '1': Would a favourite car help the council decide?
          '2': The council knows what a crosswalk is. Who is the glossary for?
          '3': If everything is bold, nothing stands out.
        hints:
          - Which feature helps the council understand the problem?
        solution:
          - A labelled map, with a caption, shows the council exactly where the danger is. Features should serve the audience.
    wrapUp: Every choice, from style to features, should fit the audience, purpose and form you planned at the start.

  - id: d2
    level: 3
    thinking: design
    covers: [S1.8, S1.5, S1.6]
    type: open
    prompt: |-
      Paragraph 2 of Ali’s opinion piece ends:

      > …so a reading buddy program would help younger students read more.

      Paragraph 3 is about how it would **also** help the older buddies. Write the **first sentence** of paragraph 3. Use a transition that links the two paragraphs.
    modelAnswer: Even more important, the older buddies would learn too, because explaining a story to someone else helps you understand it better.
    rubric:
      - My sentence starts with a transition, such as *Even more important* or *On top of that*.
      - It links back to paragraph 2, so the reader sees the connection.
      - It introduces the new idea, how the older buddies benefit.
      - It supports Ali’s position that the program is a good idea.
    hints:
      - Is the new reason bigger, or just another one? Pick a transition to match.
      - Mention the younger students, then turn to the older ones.
