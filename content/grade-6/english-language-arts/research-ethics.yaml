id: research-ethics
grade: 6
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG6-OI8-GQ1-LO1]
order: 11
title: Research, Reliable Sources and Permission
shortTitle: Research & permission
summary: >-
  Research the Métis Red River cart: narrow a question, weigh sources, organize notes, share
  findings in a table, and ask permission before sharing a story.

bigIdea: |-
  - Research means **questioning, gathering, organizing and recording**, using more than one source.
  - Weigh every source. Is it **valid** (true and on topic) and **reliable** (trustworthy)?
  - Share findings in a form that fits, such as a report, a table or a chart.
  - Use information ethically. **Ask permission**, cite your sources, and represent people fairly.

lesson:
  - title: Narrow the question
    blocks:
      - type: visual
        covers: [S3.2, K3.1]
        component: topic-funnel
        props:
          levels:
            - { topic: Transportation, note: 'Far too broad. Trains, planes, canoes… where would you start?' }
            - { topic: Transportation on the Prairies long ago, note: 'Narrower, but still enough for a whole book.' }
            - { topic: The Red River cart, note: 'A clear topic. Now ask one question about it.' }
            - { topic: Why did Red River carts squeal so loudly?, note: 'Just right. A clear, well-defined question you can answer from a few good sources.' }
        caption: Press the button to drop the topic down the funnel. A narrow question leads to a focused report.
      - type: callout
        variant: remember
        covers: [LANENG5-OI8-GQ1-LO1#K1.1]
        title: Remember from Grade 5
        body: Breaking a big job into steps lets you focus on doing each one well.

  - title: Weigh your sources
    blocks:
      - type: visual
        covers: [S3.5, K3.2, S3.3]
        component: card-sort
        props:
          bins:
            - { id: strong, label: Valid and reliable, icon: ✅ }
            - { id: weak, label: Check it or skip it, icon: ⚠️ }
          cards:
            - { text: 'A Métis museum’s web page about Red River carts', bin: strong, why: 'Made by people who study and keep this history. On topic and trustworthy.' }
            - { text: 'A library book on the fur trade, by a historian', bin: strong, why: 'An expert wrote it, and a publisher checked it.' }
            - { text: 'A comment on a video: “carts were made of plastic lol”', bin: weak, why: 'No name and no evidence, and it is clearly not accurate.' }
            - { text: 'A toy store page selling a model cart', bin: weak, why: 'It wants to sell something. It might be right, but check it elsewhere.' }
            - { text: 'An encyclopedia article about Red River carts', bin: strong, why: 'Edited and checked. Good for confirming facts from your other sources.' }
            - { text: 'A website about modern pickup trucks', bin: weak, why: 'It may be reliable, but it isn’t **valid** for your question. It is off topic.' }
        caption: Sort each source. A source is **valid** if it fits your topic and is accurate, and **reliable** if you can trust who made it.

  - title: Record and organize
    blocks:
      - type: table
        covers: [K3.1, K3.5, S3.4, K3.7]
        caption: A note organizer for “Why did Red River carts squeal so loudly?”
        headers: [Fact, Source]
        rows:
          - ['The carts were made of wood and bison hide, with no metal.', 'Encyclopedia article, “Red River cart”']
          - ['The wooden axles were not greased, because grease picked up dust that wore them down.', 'Encyclopedia article, “Red River cart”']
          - ['The squeal earned the cart the nickname “the North West fiddle.”', 'Encyclopedia article, “Red River cart”']
          - ['The Métis built the carts and used them to carry furs and trade goods.', 'Library book on the fur trade']
      - type: compare
        covers: [K3.5, S3.4, S3.3]
        columns:
          - title: 📝 Record
            body: Write each fact in your own words, with its source beside it.
          - title: 🗂️ Organize
            body: Group the facts under headings, such as **What carts were made of** and **Why they squealed**.
          - title: 🔗 Combine
            body: A strong report uses facts, details and examples from **more than one** source.

  - title: Share what you found
    blocks:
      - type: table
        covers: [K3.6, S3.1]
        caption: 'Findings shared as a table: why each part of the cart was made that way'
        headers: [Part, Made of, Why]
        rows:
          - ['Wheels and frame', 'Wood', 'Iron was scarce and costly. Wood could be fixed on the trail.']
          - ['Ties', 'Bison hide', 'It tightens as it dries, holding the parts together.']
          - ['Axle', 'Ungreased wood', 'Grease would collect dust. That is why it squealed.']
      - type: callout
        variant: tip
        covers: [K3.6, S3.1, U3.1]
        title: Pick the form that fits
        body: Use a **table** to compare, a **graph** to show change or amounts, and paragraphs to explain. Your purpose and your audience decide.

  - title: Ask first
    blocks:
      - type: visual
        covers: [K3.3, K3.4, K3.7, S3.6]
        component: text-xray
        props:
          button: Show the ethical steps
          pages:
            - label: A family story
              note: Stories and histories belong to the people they come from. Protocols for sharing them can differ between families, communities and cultures.
              parts:
                - { style: text, text: 'Your friend Céline says her great-great-grandfather drove a Red River cart in a Métis trade caravan. Her grandmother tells the family story.', tag: Whose is it?, job: 'The story belongs to Céline’s family.' }
                - { style: text, text: 'You ask, “May I tell this story in my report? May I use the photo?” Her grandmother says yes to the story, but no to the photo.', tag: Ask permission, job: 'Ask the original owner before you use, share or store it.' }
                - { style: text, text: 'You tell the story as she told it, and you leave the photo out.', tag: Represent it fairly, job: 'Accurate, with nothing added or changed.' }
                - { style: text, text: 'Source, “Story told by Rose Lavallée, Céline’s grandmother, March 2026.”', tag: Cite it, job: 'Give basic information about where it came from.' }
        caption: Switch on the X-ray to see each ethical step.
      - type: callout
        variant: tip
        covers: [K3.3, K3.4]
        title: Protocols differ
        body: Some First Nations, Métis and Inuit communities have their own protocols for sharing stories. Ask a teacher, an Elder or a knowledge keeper how to ask in a respectful way.

keyTerms:
  - term: Research question
    covers: [S3.2]
    definition: A clear, narrow question that your research will answer.
  - term: Valid
    covers: [S3.5]
    definition: Fits your topic and is accurate.
  - term: Reliable
    covers: [S3.5]
    definition: From a source you can trust, such as an expert or a checked reference.
  - term: Cite
    covers: [K3.7]
    definition: To give basic information about where you got something, such as the title and who made it.
  - term: Permission
    covers: [K3.4, K3.7]
    definition: Agreement from the owner of a story, picture or piece of information before you use or share it.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S3.2]
    type: mc
    prompt: Which is the best **research question** for a short report?
    choices:
      - How did Red River carts cross rivers?
      - Canada’s history
      - Everything about the fur trade
      - Carts
    answer: 0
    feedback:
      '1': That would fill many books. Can you answer it in a few paragraphs?
      '2': Still far too big. What one thing do you want to know?
      '3': A topic, but not a question. What do you want to find out about carts?
    hints:
      - Which one could you really answer from a few good sources?
    solution:
      - It is narrow, clear, and a real question. You can answer it in a few paragraphs.

  - id: w2
    level: 1
    thinking: recall
    covers: [K3.7]
    type: multi
    prompt: You quote a fact from a book in your report. Which **basic information** should your citation include? Choose every one.
    choices:
      - The title of the book
      - The author’s name
      - The colour of the book’s cover
      - How long it took you to read
    answer: [0, 1]
    feedback:
      '2': Would that help a reader find the book?
      '3': That’s about you, not the source. What would help a reader find it?
    hints:
      - A citation helps readers find your source and know who made it.
    solution:
      - The **title** and the **author** let readers find the source and give credit to the person who wrote it.

  - id: w3
    level: 1
    thinking: apply
    covers: [K3.1, K3.5]
    type: mc
    prompt: Jae has a pile of notes. He sorts them under three headings, “Materials,” “Uses” and “Travel.” Which part of research is he doing?
    choices: [Organizing, Questioning, Gathering, Citing]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Questioning is deciding what to find out. He already has his notes.
      '2': Gathering is finding information. He is working with notes he already has.
      '3': Citing is saying where information came from. Is he naming sources?
    hints:
      - What is he doing with the notes?
    solution:
      - Sorting notes into groups is **organizing**. It makes the report easier to write.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: evidence
    covers: [S3.5, K3.2]
    type: multi
    prompt: For the question “How did Métis cart caravans cross rivers?”, which sources are **valid and reliable**? Choose every one.
    choices:
      - A museum page on Red River carts, written by historians
      - An encyclopedia article on the Red River Trails
      - A video called “10 Funny Cart Fails,” with no names
      - A web page about building a raft for a summer camp
    answer: [0, 1]
    feedback:
      '2': Who made it, and is it about Métis caravans at all?
      '3': Rafts are about crossing water, but is this page about Métis carts?
    hints:
      - Ask two questions about each one. Is it on my topic? Can I trust who made it?
    solution:
      - The museum page and the encyclopedia are on topic and made by people who check facts.
      - The video isn’t trustworthy, and the raft page is off topic, so it isn’t valid for this question.

  - id: b2
    level: 2
    thinking: decide
    covers: [K3.3, K3.4, S3.6]
    type: mc
    prompt: An Elder visits your class and tells a story. You want to post it on the class blog. What should you do first?
    choices:
      - Ask the Elder whether the story may be shared, and how.
      - Post it right away, since it was told in a public classroom.
      - Post it, but change some details so it isn’t a copy.
      - Post it with your own name on it, since you wrote it down.
    answer: 0
    feedback:
      '1': Hearing a story isn’t the same as having permission to share it. Whose story is it?
      '2': Changing it makes it inaccurate, and it still isn’t yours to share.
      '3': Writing it down doesn’t make it yours. Who should get the credit?
    hints:
      - Who owns the story?
    solution:
      - The story belongs to the Elder and their community. **Ask permission** first, and follow their protocol.
      - If they say yes, share it accurately and credit them.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K3.7, S3.6]
    type: mc
    prompt: |-
      A museum guide told Mateo, “**Most** carts carried spare axles, because axles often broke.”

      Mateo writes, “The guide said carts **never** broke down.” What is wrong?
    choices:
      - He changed what the guide said, so it isn’t a fair or accurate representation.
      - Nothing, because he gave the guide credit in his report.
      - He should have used a direct quote, so the facts don’t matter.
      - He should have asked permission before talking to the guide.
    answer: 0
    feedback:
      '1': Credit is good, but the words he credited aren’t what she said.
      '2': Quoting is good, but his sentence must still match what she said.
      '3': Talking to a museum guide is how you gather information. What went wrong in the writing?
    hints:
      - Put the two sentences side by side. Do they say the same thing?
    solution:
      - The guide said axles often broke. Mateo wrote the opposite. That misrepresents her.
      - Ethical research means **fair and accurate** representation of people and information.

  - id: b4
    level: 2
    thinking: connect
    covers: [K3.6, S3.1]
    type: mc
    prompt: Ana surveyed her class, “Which history topic would you most like to research?” 12 chose Red River carts, 8 chose canoes and 5 chose trains. What is the clearest way to **share** these findings?
    choices:
      - A bar graph with one bar for each topic
      - A long paragraph that lists every student’s answer
      - A poem about her favourite topic
      - A map of where each student lives
    answer: 0
    feedback:
      '1': Every answer, one by one, would bury the totals. Which form shows amounts at a glance?
      '2': A poem is creative, but would it show how many chose each topic?
      '3': Where students live has nothing to do with these findings.
    hints:
      - She wants to show **how many** chose each topic, and compare them.
    solution:
      - A **bar graph** shows the amounts at a glance, and you can compare the bars.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: evidence
    covers: [S3.3, S3.4, S3.5]
    type: investigation
    prompt: |-
      Kiran found two sources that disagree.

      - **A blog with no author:** “Red River carts were greased with bear fat to keep them quiet.”
      - **An encyclopedia:** “The axles were left ungreased, because grease collected dust that ground the axle down.”
    parts:
      - type: mc
        prompt: Which source is more **reliable**, and why?
        choices:
          - The encyclopedia, because it is checked, and it explains its reason.
          - The blog, because bear fat is a more interesting detail.
          - The blog, because it is newer than most encyclopedias.
          - Neither, because two sources that disagree are both useless.
        answer: 0
        feedback:
          '1': Interesting isn’t the same as true. Who wrote the blog?
          '2': We don’t know when either was written. What do we know about who made them?
          '3': Disagreement means you need to check, not give up.
        hints:
          - Who made each source? Does each give a reason?
        solution:
          - The encyclopedia is edited and checked, and it gives a reason. The blog has no author and no reason.
      - type: mc
        prompt: Which **third source** would best help Kiran decide?
        choices:
          - A Métis museum’s page about Red River carts
          - Another blog with no author
          - A page about how to grease a bicycle chain
          - A friend who thinks carts were probably greased
        answer: 0
        feedback:
          '1': Another unknown author doesn’t help you judge.
          '2': That’s about bicycles, not Red River carts. Is it valid here?
          '3': A guess isn’t evidence.
        hints:
          - Look for a source that is on topic and made by people who know this history.
        solution:
          - A Métis museum is valid and reliable. If it agrees with the encyclopedia, Kiran can be confident.
      - type: mc
        prompt: The museum agrees with the encyclopedia. Which sentence should Kiran write?
        choices:
          - Red River cart axles were left ungreased, because grease collected dust that wore them down.
          - Red River carts were greased with bear fat, according to some sources.
          - Some say carts were greased and some say not, so nobody will ever know.
          - Red River carts were quiet, because they were greased so carefully.
        answer: 0
        feedback:
          '1': Two reliable sources say otherwise. Is it fair to report the blog’s claim as a fact?
          '2': Two reliable sources agree, so we can know.
          '3': This repeats the blog’s mistake, and the carts were famous for being loud.
        hints:
          - What do the reliable sources agree on?
        solution:
          - Two reliable sources agree. Kiran reports what they say, and cites them.
    wrapUp: When sources disagree, weigh who made each one, look for a reason, and confirm with another reliable source.

  - id: d2
    level: 3
    thinking: design
    covers: [S3.1, S3.3, K3.7]
    type: open
    prompt: |-
      Use these two notes to write **one or two sentences** for a report that **explains** why Red River carts squealed. Cite both sources at the end, in brackets.

      - *Encyclopedia, “Red River cart”:* axles were wooden and not greased.
      - *Library book on the fur trade:* grease would have picked up prairie dust.
    modelAnswer: Red River carts squealed because their wooden axles were not greased. Grease would have picked up prairie dust and worn the axles down. (Encyclopedia, “Red River cart”; library book on the fur trade)
    rubric:
      - My sentences explain **why** the carts squealed.
      - I used facts from both notes, in my own words.
      - I cited both sources.
      - I didn’t add facts that the notes don’t give.
    hints:
      - Start with what happened, then explain why.
