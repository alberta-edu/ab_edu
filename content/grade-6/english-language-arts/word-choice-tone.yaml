id: word-choice-tone
grade: 6
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG6-OI8-GQ1-LO1]
order: 10
title: Word Choice, Voice and Tone
shortTitle: Word choice & tone
summary: >-
  Choose words for clarity, colour and precision, match word choice to the kind of text, hear tone,
  learn from L. M. Montgomery, and build suspense in your own stories.

bigIdea: |-
  - Every word choice creates an **effect**: simple, clear, colourful, precise or appealing.
  - Different texts call for different words, from a brief recipe to a free-flying poem.
  - **Tone** is the writer’s attitude toward the topic and the reader, and you hear it in the words.
  - Creative writing means experimenting, judging what works, adapting and not giving up.

lesson:
  - title: Words with effects
    blocks:
      - type: visual
        covers: [K2.3, S2.5]
        component: text-xray
        props:
          button: Show the effect
          pages:
            - label: Plain
              note: Nothing wrong with it, but it doesn’t do much.
              parts:
                - { style: text, text: 'A dog ran across the field.', tag: Plain, job: 'You get the idea, but not a picture.' }
            - label: Precise
              note: Exact words tell the reader exactly what happened.
              parts:
                - { style: text, text: 'A muddy golden retriever galloped across the soccer field.', tag: Precision, job: 'Which dog? Which field? How did it run? Now you know.' }
            - label: Colourful
              note: Lively words paint a picture and add feeling.
              parts:
                - { style: text, text: 'A mud-splattered retriever thundered across the field like a runaway freight train.', tag: Colourfulness, job: 'Vivid words and a simile make the scene leap off the page.' }
            - label: Simple and clear
              note: For instructions, fewer and plainer words work best.
              parts:
                - { style: text, text: 'Keep dogs on a leash in the field.', tag: Simplicity and clarity, job: 'Short and plain, so nobody can miss it.' }
            - label: Appealing
              note: Some words are chosen to make you want something.
              parts:
                - { style: text, text: 'Give your happy, muddy pup a fresh start at Sudsy Paws Dog Wash!', tag: Appeal, job: 'Warm, inviting words pull you in.' }
        caption: One topic, five effects. Tap each version, then switch on the X-ray.

  - title: Match the words to the text
    blocks:
      - type: visual
        covers: [K2.4]
        component: card-sort
        props:
          bins:
            - { id: brief, label: 'Brief and clear', icon: 📋 }
            - { id: special, label: 'Specialized words', icon: 🔬 }
            - { id: free, label: 'Free and unexpected', icon: 🎨 }
            - { id: opinion, label: 'Expressing opinions', icon: 📣 }
          cards:
            - { text: 'A recipe: “Stir in 2 cups of flour. Bake for 20 minutes.”', bin: brief, why: 'A recipe needs short, clear steps.' }
            - { text: 'A business letter: “Please send the invoice by Friday.”', bin: brief, why: 'Business letters get to the point.' }
            - { text: 'A research report: “The **larva** spins a **cocoon**.”', bin: special, why: 'Reports use the exact words of the subject.' }
            - { text: 'A poem: “The moon is a fingernail clipping on the dark.”', bin: free, why: 'Poems are free to use surprising words and images.' }
            - { text: 'An ad: “Taste the crunch-tastic crunch!”', bin: free, why: 'Ads can even invent words to catch you.' }
            - { text: 'A speech: “I believe every child deserves a library card.”', bin: opinion, why: 'Speeches and opinion pieces use words that take a stand.' }
        caption: Sort each example by the kind of word choice it uses. Word choice shows a writer’s **voice** and **style**.

  - title: Hear the tone
    blocks:
      - type: visual
        covers: [K2.5, S2.6]
        component: text-xray
        props:
          button: Show the tone words
          pages:
            - label: Disappointed
              icon: 😞
              note: 'The writer feels let down, and wants you to feel it too.'
              parts:
                - { style: text, text: 'Sadly, our field trip to the science centre has been cancelled. We had been looking forward to it for weeks.', tag: Tone words, job: '*Sadly* and *looking forward to it for weeks* show disappointment.' }
            - label: Cheerful
              icon: 😄
              note: The writer stays positive, and wants readers to as well.
              parts:
                - { style: text, text: 'Good news! Our science centre trip is moving to May, when the new space exhibit opens. Even better!', tag: Tone words, job: '*Good news* and *Even better!* turn the same change into something to cheer about.' }
            - label: Annoyed
              icon: 😠
              note: The writer is frustrated with whoever made the decision.
              parts:
                - { style: text, text: 'Once again, the science centre trip has been cancelled, just two days before we were supposed to go.', tag: Tone words, job: '*Once again* and *just two days before* sound fed up.' }
        caption: The same news, in three tones. **Tone** is the writer’s attitude toward the topic and the reader.
      - type: callout
        variant: tip
        covers: [S2.6]
        title: Point of view shapes tone
        body: 'A first-person narrator says *I* and *we*, so you hear their feelings directly. Ask: “Who is telling this, and how do they feel about it?”'

  - title: Learn from a professional author
    blocks:
      - type: passage
        id: avenue
        title: The Avenue, from Anne of Green Gables
        form: Novel, 1908
        paragraphs:
          - The “Avenue,” so called by the Newbridge people, was a stretch of road four or five hundred yards long, completely arched over with huge, wide-spreading apple-trees, planted years ago by an eccentric old farmer. Overhead was one long canopy of snowy fragrant bloom. Below the boughs the air was full of a purple twilight and far ahead a glimpse of painted sunset sky shone like a great rose window at the end of a cathedral aisle.
          - “Well now, you must mean the Avenue,” said Matthew after a few moments’ profound reflection. “It is a kind of pretty place.”
          - “Pretty? Oh, pretty doesn’t seem the right word to use. Nor beautiful, either. They don’t go far enough. Oh, it was wonderful—wonderful.”
        note: 'From *Anne of Green Gables* by L. M. Montgomery (1908), set on Prince Edward Island. The book is in the public domain. Paragraph 1 is the narrator, paragraph 2 is Matthew, and paragraph 3 is Anne. Words to know: a *canopy* is a covering overhead, *boughs* are big branches, and a *rose window* is a round stained-glass window.'
      - type: table
        covers: [S2.2, K2.3, S2.5]
        caption: What Montgomery’s word choices do
        headers: [Words, Effect]
        rows:
          - ['“snowy fragrant bloom”', '**Colourful.** You can see and smell the blossoms.']
          - ['“a purple twilight”', 'An unexpected colour makes the shade feel magical.']
          - ['“like a great rose window at the end of a cathedral aisle”', 'A simile that makes a road feel grand, almost holy.']
          - ['Matthew: “a kind of pretty place.”', '**Simple.** It shows he is a man of few words.']
          - ['Anne: “*pretty* doesn’t seem the right word”', 'Anne cares about **precision**. She wants the word that goes far enough.']

  - title: Build suspense
    blocks:
      - type: visual
        covers: [S2.4, S2.3]
        component: text-xray
        props:
          button: Show the suspense tools
          pages:
            - label: Calm
              icon: 🙂
              note: The same setting and character, told calmly. Nothing makes you wait.
              parts:
                - { style: text, text: 'Mina waited backstage for the talent show to start. Through the curtain, she could see her family waving. Her violin felt light in her hands.', tag: Setting and character, job: 'Clear and pleasant, but no tension.' }
            - label: Suspense
              icon: 😬
              note: The same moment, slowed down. Now you want to know what happens.
              parts:
                - { style: text, text: 'The curtain twitched. Then it went still.', tag: Short sentences, job: 'Quick, short sentences make the reader hold their breath.' }
                - { style: text, text: 'Silence. Then the announcer’s voice: “Our next performer…”', tag: Dialogue that stops partway, job: 'The reader has to wait for the rest.' }
                - { style: text, text: 'Mina’s bow trembled. Was a string loose? There was no time to check.', tag: A question, job: 'A worry the reader can’t answer yet.' }
        caption: Read both versions of the moment, then switch on the X-ray. Which details slow time down?

  - title: The creative process
    blocks:
      - type: visual
        covers: [K2.1, S2.1, U2.1, K2.2]
        component: writing-path
        props:
          stages:
            - icon: 🎯
              label: Intent
              job: Decide what effect you want, and for whom.
              page: 'I want my poster to make **Grade 2s** excited about our reading buddy program.'
            - icon: 🧪
              label: Try
              job: Experiment with many versions. Play with words and details.
              page: |-
                - Reading Buddies Program: sign up now.
                - Got a story? Get a buddy!
                - Big kids + little kids + books = fun!
            - icon: ⚖️
              label: Judge
              job: Evaluate each version against your intent.
              page: 'The first is clear but dull. The second **rhymes** and is short. Grade 2s will remember it.'
            - icon: 🔄
              label: Adapt
              job: Change your plan when things change.
              page: 'The Grade 2 teacher says some of her students can’t read yet. ~~Got a story? Get a buddy!~~ ++Add a big picture of two kids reading together.++'
            - icon: 💪
              label: Keep going
              job: Be determined to get the effect you want.
              page: The first poster didn’t get many sign-ups. Try a new picture. Ask a Grade 2 which one they like.
        caption: Follow one poster through the creative process. Different readers may take a text differently, so test it on your audience.
      - type: example
        covers: [S2.7, S2.5]
        title: Find a better word
        problem: '“The tired hikers **walked** up the last hill.” Find a word that shows how tired they were.'
        steps:
          - '**Look it up:** a thesaurus lists *strolled, marched, trudged, wandered* for *walked*.'
          - '**Test each one:** *strolled* is relaxed, *marched* is strong, *wandered* has no goal.'
          - '**Choose by effect:** *trudged* means walked slowly and heavily. That shows tired legs.'
        answer: '“The tired hikers **trudged** up the last hill.”'

keyTerms:
  - term: Word choice
    covers: [K2.3, K2.4]
    definition: The words a writer picks to create an effect and show their voice.
  - term: Tone
    covers: [K2.5]
    definition: A writer’s attitude toward the topic and the audience, shown through their words.
  - term: Voice
    covers: [K2.4]
    definition: The way a writer’s personality and style come through in their words.
  - term: Precision
    covers: [K2.3]
    definition: Using exact words, so the reader knows exactly what you mean.
  - term: Suspense
    covers: [S2.4]
    definition: The feeling of waiting anxiously to find out what happens next.
  - term: Thesaurus
    covers: [S2.7]
    definition: A book or tool that lists words with similar or opposite meanings.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K2.5, S2.6]
    type: mc
    prompt: '“Thanks a lot for leaving the gate open. Now the goats are in the garden.” What is the writer’s **tone**?'
    choices: [Annoyed, Grateful, Cheerful, Curious]
    fixedOrder: true
    answer: 0
    feedback:
      '1': The writer says “thanks,” but read the second sentence. Is the writer really thankful?
      '2': Goats in the garden is bad news here. Does the writer sound happy?
      '3': The writer isn’t asking anything. What feeling comes through?
    hints:
      - Read it aloud. Does “thanks a lot” mean thanks here?
    solution:
      - The goats are in the garden because of the open gate. “Thanks a lot” is sarcastic. The tone is **annoyed**.
      - Tone comes from the words together, not one word alone.

  - id: w2
    level: 1
    thinking: apply
    covers: [K2.4]
    type: mc
    prompt: Which sentence fits a **recipe** best?
    choices:
      - Mix the eggs and sugar for two minutes.
      - Whirl the golden eggs into a sweet, swirling storm!
      - I believe mixing is the most important step of all.
      - Mixing combines ingredients through mechanical agitation.
    answer: 0
    feedback:
      '1': That is colourful, like a poem or an ad. Would a cook want it in a recipe?
      '2': That is an opinion, like a speech. Does a recipe need it?
      '3': That uses specialized words, like a research report. Is it clear and brief for a cook?
    hints:
      - A cook needs to know exactly what to do, quickly.
    solution:
      - '“Mix the eggs and sugar for two minutes” is **brief and clear**. That is what a recipe needs.'

  - id: w3
    level: 1
    thinking: recall
    covers: [K2.3, S2.5]
    type: mc
    prompt: '“a bird” became “a red-winged blackbird.” Which effect did the writer add?'
    choices: [Precision, Simplicity, Appeal, Rhyme]
    fixedOrder: true
    answer: 0
    feedback:
      '1': The new words are longer, not simpler. What do they tell us?
      '2': Is the writer trying to make us want something?
      '3': Nothing rhymes here. What do the new words do?
    hints:
      - What do you know now that you didn’t before?
    solution:
      - The reader now knows **exactly** which bird. That is **precision**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: decide
    covers: [S2.7, S2.5]
    type: mc
    prompt: |-
      “When Jun heard he had won, he **walked** to the stage.”

      A thesaurus lists these words for *walked*. Which one best shows how Jun felt?
    choices: [bounded, trudged, crept, wandered]
    fixedOrder: true
    answer: 0
    feedback:
      '1': '*Trudged* means walking slowly and heavily. Does a winner feel like that?'
      '2': '*Crept* means moving quietly, trying not to be seen. Would a winner?'
      '3': '*Wandered* means walking with no goal. Does Jun have a goal?'
    hints:
      - How does someone feel when they have just won? How would they move?
    solution:
      - '*Bounded* means leaping with energy. It shows Jun’s joy without saying “happy.”'
      - A thesaurus gives choices. You still choose by the effect you want.

  - id: b2
    level: 2
    thinking: evidence
    covers: [S2.2, K2.3]
    type: evidence
    prompt: Tap the sentence from Montgomery that paints the most **colourful** picture.
    passage: avenue
    paragraphs: [1, 2]
    answer: [p1s2, p1s3]
    feedback:
      p1s1: This sets the scene with facts, like the road’s length. Where does the colour come in?
      p2s1: This tells you Matthew took a while to answer. Does it paint a picture?
      p2s2: Matthew uses a plain word, *pretty*. Find where the narrator paints a picture.
    hints:
      - Look for colours, smells and comparisons.
    solution:
      - '“Overhead was one long canopy of snowy fragrant bloom.” or the sentence with the purple twilight and the rose window.'
      - Colours, a smell and a simile make you see and feel the Avenue. Writers study passages like this as models.

  - id: b3
    level: 2
    thinking: why
    covers: [S2.2, S2.6, K2.4]
    type: mc
    prompt: Matthew calls the Avenue “a kind of pretty place.” Anne says *pretty* and *beautiful* “don’t go far enough.” Why might Montgomery give them such different words?
    choices:
      - Their word choices show their different voices, quiet Matthew and wordy, dreamy Anne.
      - Matthew didn’t see the trees, so he doesn’t know what the Avenue looks like.
      - Montgomery wanted to teach readers the meaning of the word *pretty*.
      - Anne is correcting Matthew because he used the word wrong.
    answer: 0
    feedback:
      '1': They drove through it together. Is this about what he saw, or how he talks?
      '2': The point isn’t the dictionary meaning. What do the two ways of talking show about the characters?
      '3': '*Pretty* isn’t wrong. Why is it not enough for **Anne**?'
    hints:
      - What does each character’s word choice tell you about them?
    solution:
      - Matthew says little. Anne searches for a word big enough for her feelings.
      - Word choice shows **voice**, for characters as well as for writers.

  - id: b4
    level: 2
    thinking: whatif
    covers: [S2.4, S2.3]
    type: mc
    prompt: |-
      > The judge opened the envelope and read the winner’s name. It was Dev.

      Which revision builds the most **suspense**?
    choices:
      - The judge tore open the envelope. She frowned. She smiled. “And the winner is…” Dev held his breath.
      - The judge opened the envelope happily and quickly read out that Dev was the winner of the contest.
      - Dev won the contest. The judge opened the envelope and read his name, and everyone clapped.
      - The judge, who was wearing a blue dress, opened the envelope and read Dev’s name.
    answer: 0
    feedback:
      '1': The answer comes right away. Is there any waiting?
      '2': This gives away the ending in the first three words.
      '3': A new detail, but it doesn’t make us wait or wonder.
    hints:
      - Suspense makes the reader wait. Which version holds back the answer?
    solution:
      - Short sentences, a frown then a smile, and dialogue that stops partway all make the reader wait. That is **suspense**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [K2.1, K2.2, S2.1]
    type: investigation
    prompt: |-
      Theo is making a poster for the school’s **pancake breakfast**. His intent: get families to come.

      His first idea: **PANCAKE BREAKFAST. SATURDAY. GYM.**
    parts:
      - type: mc
        prompt: Theo tries more versions. Which one best fits his intent?
        choices:
          - 'Fluffy pancakes, warm syrup, and your whole family at one table. Saturday, 8 a.m., in the gym!'
          - 'Pancakes contain flour, eggs and milk, and are cooked on a hot griddle.'
          - 'The pancake breakfast is happening, whether you come or not.'
          - 'PANCAKES!!!!!!!!!!'
        answer: 0
        feedback:
          '1': That informs, like a report. Does it make families want to come, or tell them when?
          '2': That tone sounds like he doesn’t care. Would it invite families?
          '3': It is loud, but where and when? Families couldn’t come even if they wanted to.
        hints:
          - Judge each one against his intent. Does it make families want to come, and tell them how?
        solution:
          - The first version **appeals** to families with sensory words and gives the time and place.
      - type: mc
        prompt: 'A parent says, “I thought *your whole family at one table* meant we’d have to sit with strangers.” What should Theo learn?'
        choices:
          - Readers can take words differently, so test the poster on real readers.
          - The parent read it wrong, so Theo should leave it as it is.
          - Posters should never use more than three words.
          - Theo should give up on posters and make an announcement.
        answer: 0
        feedback:
          '1': Maybe. But if one reader took it that way, others might too. Whose job is it to be clear?
          '2': Short isn’t always better. His three-word version didn’t appeal to anyone.
          '3': Being determined means fixing it, not quitting.
        hints:
          - Different people read with different perspectives.
        solution:
          - People bring their own perspectives. The fix is to test on real readers and adapt.
      - type: mc
        prompt: On Friday, the gym floor is being repaired, so the breakfast moves to the library. What should Theo do?
        choices:
          - Change the place on the poster and make sure it stands out.
          - Keep the poster, since people will find the library anyway.
          - Cancel the poster, since the plan has already changed once.
          - Add a note saying the gym is broken, and leave the rest.
        answer: 0
        feedback:
          '1': Some families will walk straight to the gym. Is that the effect he wants?
          '2': A change in plans is a reason to adapt, not to stop.
          '3': That tells people where **not** to go. Where should they go?
        hints:
          - The conditions changed. What part of the poster no longer works?
        solution:
          - Creative thinking means **adapting** to new conditions. Update the poster so the change is clear.
    wrapUp: Creative work is a loop. Know your intent, experiment, evaluate, adapt, and keep going until it has the effect you want.

  - id: d2
    level: 3
    thinking: design
    covers: [S2.3, S2.5, S2.4]
    type: open
    prompt: |-
      Write **two or three sentences** that open a story set in a hockey arena just before the final shot of a shootout.

      Use word choice to build **suspense**.
    modelAnswer: The arena went silent. Amira skated toward the puck, slow and steady, her blade scraping the ice. The goalie crouched. Left or right? She had one second to decide.
    rubric:
      - My sentences create suspense, so the reader wants to know what happens.
      - I used at least one precise or colourful word instead of a plain one.
      - I mixed short and longer sentences, or used a question, to slow time down.
      - I included a detail of the setting, such as a sound or something the character sees.
    hints:
      - Slow the moment down. What can the character hear and see?
      - Try one very short sentence for impact.
