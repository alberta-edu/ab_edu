id: speaking-styles-oration
grade: 6
subject: english-language-arts
organizingIdea: LANENG-OI2
outcomes: [LANENG6-OI2-GQ1-LO1]
order: 4
title: Speaking Styles, Dialogue and Oration
shortTitle: Speaking styles & oration
summary: >-
  Match words, body and voice, choose a formal or informal style, share in a talking circle, solve
  problems through dialogue, and plan an oration in five steps.

bigIdea: |-
  - Strong speakers make their **words, body and voice** say the same thing.
  - They choose a **style**, from formal to slang, to fit the listener and the moment.
  - Protocols like **talking circles** build trust and keep shared knowledge alive.
  - An **oration** is planned in five steps, from finding ideas to giving the speech.

lesson:
  - title: Words, body and voice together
    blocks:
      - type: visual
        covers: [K2.1, S2.1, U2.1]
        component: script-stage
        props:
          characters: [Noor, Mr. Haddad]
          lines:
            - { who: 0, say: 'Mr. Haddad, could I ask you something about the garden club?', body: 'Stands up straight and looks at him.', voice: 'Clear and polite, at a steady pace.', pose: still }
            - { who: 1, say: 'Of course. What is it?', body: 'Turns toward her and puts down his pen.', voice: 'Warm and calm.', pose: lean }
            - { who: 0, say: 'Twenty students signed up. We only need one table in the lunchroom.', body: 'Holds up the sign-up sheet.', voice: 'Stress on **twenty**, so the number stands out.', pose: up }
            - { who: 1, say: 'Twenty? I had no idea it was that many.', body: 'Raises his eyebrows and takes the sheet.', voice: 'Rising pitch. He is surprised.', pose: lean }
            - { who: 0, say: 'So may we have the table on Fridays?', body: 'Smiles and waits.', voice: 'Rising at the end, because it is a real question.', pose: still }
            - { who: 1, say: 'Fridays it is.', body: 'Nods and hands back the sheet.', voice: 'Friendly and firm.', pose: lean }
        caption: Step through the scene. Watch the **verbal** (words), **non-verbal** (body) and **paraverbal** (voice) parts work together.
      - type: callout
        variant: remember
        covers: [LANENG5-OI2-GQ1-LO1#K2.4]
        title: Remember from Grade 5
        body: Paraverbal language is how a message is delivered, including stress, pace, pitch and tone.

  - title: Choose your style
    blocks:
      - type: visual
        covers: [K2.2, K2.3, S2.2]
        component: card-sort
        props:
          bins:
            - { id: formal, label: Formal, icon: 🎩 }
            - { id: informal, label: Informal, icon: 🙂 }
            - { id: colloquial, label: Colloquial, icon: 🗨️ }
            - { id: slang, label: Slang, icon: 😎 }
          cards:
            - { text: '“Good evening, honoured guests. Thank you for joining us.”', bin: formal, why: 'Careful, complete and polite. It fits a ceremony.' }
            - { text: '“Hi, Grandma! Thanks for coming to my game.”', bin: informal, why: 'Relaxed and friendly, but still complete sentences.' }
            - { text: '“You bet. We’ll grab a bite after practice.”', bin: colloquial, why: '*You bet* and *grab a bite* are everyday spoken expressions.' }
            - { text: '“That trick shot was sick!”', bin: slang, why: 'Here *sick* means amazing. Slang words belong to a group and change fast.' }
            - { text: '“I would like to present our findings to the council.”', bin: formal, why: 'Careful words for an official audience.' }
            - { text: '“How’s it going? Want to come over later?”', bin: colloquial, why: 'Short, everyday ways of talking, the way people speak and rarely write.' }
        caption: 'Sort each line by style. Then ask: who would I say this to?'
      - type: compare
        covers: [K2.2, S2.2]
        columns:
          - title: 🎤 Speaking at Remembrance Day
            body: '**Formal.** The moment is serious, and the audience is the whole community.'
          - title: 🛝 Telling a friend at recess
            body: '**Informal**, colloquial, maybe a little slang. Your friend shares your words.'

  - title: Talking circles
    blocks:
      - type: visual
        covers: [K1.1, K1.2, S1.1]
        component: sharing-circle
        props:
          question: How can we make our classroom feel welcoming for new students?
          people:
            - { name: Aiyana, says: 'I remember my first day. Nobody knew my name. Maybe new students could get a buddy.' }
            - { name: Ben, says: '(Ben passes the stone without speaking. That is allowed.)' }
            - { name: Carmen, says: 'I like the buddy idea. Buddies could show them where the library and the gym are.' }
            - { name: Dev, says: 'I was nervous about lunch. A buddy could sit with them for the first week.' }
            - { name: Elise, says: 'Building on Aiyana’s idea, we could make a welcome card with everyone’s name.' }
          ending: 'Everyone agrees: a buddy for the first week, and a welcome card. That is **consensus**. Every voice was heard, and the group remembers the plan together.'
        caption: Press **Pass the stone**. Only the person holding it speaks. Notice what the others do.
      - type: table
        covers: [K1.2, S1.2, U1.1]
        caption: Protocols in First Nations, Métis and Inuit communication. Different Nations have their own protocols. Learn the ones in your area from an Elder or knowledge keeper.
        headers: [Protocol, What it looks like]
        rows:
          - ['**Sharing circles**', 'People sit in a circle so everyone is equal, and an object passes from speaker to speaker.']
          - ['**Waiting to take turns**', 'Only the person holding the object speaks. Anyone may pass.']
          - ['**Active listening**', 'Eyes and mind on the speaker. No planning your answer while they talk.']
          - ['**Acknowledging all voices**', 'Every person gets a turn, and every turn is respected.']
          - ['**Focusing on the idea**', 'You talk about the idea, not about who said it.']
          - ['**Ongoing conversations**', 'A circle can meet again and again, so knowledge keeps growing.']
          - ['**Ending with consensus**', 'The group finishes with an agreement everyone can accept.']
      - type: callout
        variant: tip
        covers: [S1.2, U1.1]
        title: Why it keeps knowledge alive
        body: When everyone hears every voice and agrees together, the whole group remembers what was decided. Source for talking circles, Alberta Education’s *Walking Together*.

  - title: Think it through together
    blocks:
      - type: visual
        covers: [K4.1, K4.2, K4.3, K4.4, S4.1, S4.2, U4.1]
        component: talk-it-out
        props:
          turns:
            - speaker: Jae
              says: We need $200 for the class trip. I say we sell popcorn at the school dance.
              choices:
                - { text: 'Popcorn is boring. Next idea.', good: false, reply: 'Jae shrugs and goes quiet.', why: 'This shuts the idea down without a reason. Give relevant information and logical reasoning instead.' }
                - { text: 'Last year the Grade 5s sold popcorn at the dance and made about $150. So it could get us most of the way.', good: true, reply: 'Jae grins. “Then we just need $50 more!”', why: 'You added **relevant information** and **logical reasoning**. Now the group can build on it.' }
            - speaker: Rosa
              says: Ugh, that’s Mateo’s idea again. He always picks popcorn.
              choices:
                - { text: 'Let’s look at the idea, not who said it. Does popcorn get us closer to $200?', good: true, reply: 'Rosa thinks. “OK, fair. It does.”', why: 'You **focused on the idea rather than on who gave it**. That keeps trust in the group.' }
                - { text: 'Yeah, Mateo always does that.', good: false, reply: 'Mateo looks down and stops sharing.', why: 'Talking about the person instead of the idea hurts trust, and people stop sharing.' }
            - speaker: Mateo
              says: What if we sell popcorn and also run a guess-the-number-of-kernels jar? The winner gets the jar.
              choices:
                - { text: 'Ha! Whoever wins that jar is eating popcorn for a month. I love it. Are we all in?', good: true, reply: 'Everyone laughs and nods. “We’re in!”', why: 'Friendly **humour** and checking with everyone moved the group to **consensus**, with a new idea nobody had at the start.' }
                - { text: 'Too complicated. Let’s just vote and get it over with.', good: false, reply: 'Two people shrug. The new idea is dropped.', why: 'Rushing past a new idea loses it. Dialogue is how groups find innovative ideas together.' }
          ending: Together, the group found a plan better than anyone’s first idea. Each person can say what they learned from the others.
        caption: Choose what to say. Watch how the group’s trust changes.
      - type: callout
        variant: tip
        covers: [S4.3, U4.1]
        title: After the talk
        body: 'Ask yourself: “What do I think now that I didn’t think before? Whose idea changed my mind?” Then share it.'

  - title: Plan for your audience
    blocks:
      - type: table
        covers: [K3.2, S3.1, S3.2, U3.1]
        caption: 'One topic, three audiences: our class’s food bank drive'
        headers: [Audience, What they know or want, So I…]
        rows:
          - ['Grade 1 class', 'May not know what a food bank is. Like stories.', 'Explain it simply. Show a real can and a picture of a full shelf.']
          - ['Parent council', 'Know the community. Want the plan.', 'Give dates, numbers and ways to help, with a chart on a slide.']
          - ['Grocery store manager', 'Busy. Care about the store and the town.', 'Send a short letter that asks for one thing, a donation bin.']
      - type: compare
        covers: [K3.1, S3.3]
        columns:
          - title: 📋 Before
            body: Organize your ideas in order, and practise out loud. Preparation builds **confidence**.
          - title: 🔁 After
            body: 'Reflect. What worked? Where did listeners lose interest? What will I change next time?'

  - title: Five elements of public speaking
    blocks:
      - type: visual
        covers: [K5.4, S5.3]
        component: writing-path
        props:
          stages:
            - icon: 💡
              label: Invent
              job: Invention means finding what to say. Gather ideas that fit your purpose and audience.
              page: |-
                **Occasion:** our school’s 100th birthday. **Purpose:** to celebrate, and to inspire.

                **Ideas:** one room in 1926 · walking through snow · 14 classrooms now · the time capsule · ~~our new school colours~~
            - icon: 🧩
              label: Arrange
              job: Arrangement means putting your ideas in the best order.
              page: |-
                1. Greet and thank the guests
                2. Then: one room, twelve students
                3. Now: what has changed, and what hasn’t
                4. The time capsule
                5. My wish
                6. A strong last line
            - icon: 🎨
              label: Style
              job: Style means choosing words, and giving them rhythm.
              page: ~~Students came from far away in bad weather.~~ ++They walked here through snow. They walked here through mud.++
            - icon: 🧠
              label: Memory
              job: Memory means learning it well enough to look at your audience, not your page.
              page: |-
                **Cue card:** greet → one room → snow, mud → today → capsule → wish → “the next hundred years start now”
            - icon: 🎤
              label: Deliver
              job: Delivery means giving it with your voice and body.
              page: |-
                Pause after “twelve students.” Look up at the families. Slow down for the last line.
        caption: Follow one speech through the five elements. Tap each step.

  - title: An oration
    blocks:
      - type: passage
        id: hundred
        title: One Hundred Years
        form: Oration for a school’s 100th birthday
        paragraphs:
          - Good afternoon, Elders, families, teachers and friends. Thank you for joining us to celebrate one hundred years of Prairie Rose School.
          - One hundred years ago, this school was one room. It had one stove, one teacher and twelve students. They walked here through snow. They walked here through mud. They walked here because they wanted to learn.
          - Today we have fourteen classrooms, a gym and a library. But some things have not changed. We still learn to read. We still learn to share. And yes, we still walk through snow!
          - In a moment, we will seal our time capsule. Inside are letters from every class, to be opened in fifty years.
          - 'So here is my wish. Write something today that you would be proud for those students to read. Leave this school a little better than you found it, just as those twelve students did for us.'
          - One room became fourteen. Twelve students became three hundred. And the next hundred years start now.
        note: An original speech written for Alberta Edu. The school is made up.
      - type: table
        covers: [K5.1, K5.2, K5.3, S5.2, U5.1]
        caption: What makes it an **oration**, a formal speech for a special occasion
        headers: [The orator…, Where]
        rows:
          - ['**Shares** information', 'Paragraph 2: the one-room school']
          - ['**Persuades** and asks for change', 'Paragraph 5: “Leave this school a little better than you found it.”']
          - ['Uses **rhythm**, like music', '“They walked here through snow. They walked here through mud.”']
          - ['Ends on a line people remember', '“And the next hundred years start now.”']
      - type: callout
        variant: tip
        covers: [S5.1, K5.2]
        title: Not only on stage
        body: You use the same skills to ask for a later bedtime, welcome a new student or settle an argument. Good speaking changes things every day.

keyTerms:
  - term: Paraverbal
    covers: [K2.1]
    definition: How a message is delivered by the voice, such as stress, pace, pitch and tone.
  - term: Formal style
    covers: [K2.3]
    definition: Careful, complete and polite speech for serious or official moments.
  - term: Colloquial
    covers: [K2.3]
    definition: Everyday spoken expressions, such as “You bet!”
  - term: Slang
    covers: [K2.3]
    definition: Very casual words used by a group, which change quickly, such as “sick” for amazing.
  - term: Sharing circle
    covers: [K1.2]
    definition: A circle where people take turns to speak, often holding an object, while everyone else listens.
  - term: Consensus
    covers: [K1.2, K4.2]
    definition: An agreement that everyone in a group can accept.
  - term: Collaborative dialogue
    covers: [K4.1, K4.2]
    definition: Talking with others to share ideas, consider perspectives and solve problems together.
  - term: Oration
    covers: [K5.1]
    definition: A formal speech given by an orator on a special occasion.
  - term: Rhetoric
    covers: [K5.2]
    definition: The art of effective speaking, to share understandings, influence change or persuade.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K2.2, K2.3, S2.2]
    type: mc
    prompt: Kalani is chosen to welcome the mayor to the school’s new library opening. Which style should she choose?
    choices:
      - Formal, because the occasion is official and the audience is a guest of honour.
      - Slang, because it will make the mayor feel young and cool.
      - Colloquial, because everyday expressions sound friendlier than anything else.
      - It doesn’t matter, because the words are what count, not the style.
    answer: 0
    feedback:
      '1': Slang belongs to a group, and the mayor may not share it. It could also sound disrespectful at an official event.
      '2': Friendly is good, but this is a ceremony with a guest of honour. Which style fits that?
      '3': The same words can land well or badly depending on style. Who is listening, and what is the occasion?
    hints:
      - Who is listening? What kind of event is it?
    solution:
      - An official opening and a guest of honour call for a **formal** style.
      - She can still be warm. Formal means careful and polite, not cold.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.1, K1.2]
    type: mc
    prompt: In a talking circle, Ben has the talking stone. What should everyone else be doing?
    choices:
      - Listening to Ben, and waiting for their own turn.
      - Raising their hands, so they can speak next.
      - Planning what to say, so they are ready.
      - Whispering ideas to the person beside them.
    answer: 0
    feedback:
      '1': The stone decides whose turn it is, and it goes around the circle. Is there a need to raise a hand?
      '2': Planning while Ben speaks means you aren’t really listening to him.
      '3': Only the person holding the stone speaks.
    hints:
      - Who is allowed to speak? What does everyone else give the speaker?
    solution:
      - Only the person holding the stone speaks. Everyone else **listens actively** and **waits for their turn**.
      - That respect for every voice builds trust in the group.

  - id: w3
    level: 1
    thinking: notice
    covers: [K5.4]
    type: mc
    prompt: Leila practises her speech in the car, at dinner and in the bathtub, until she can say it without reading. Which element of public speaking is she working on?
    choices: [Memory, Invention, Arrangement, Style]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Invention is finding what to say. Leila already knows what she’ll say.
      '2': Arrangement is putting ideas in order. She isn’t moving anything around.
      '3': Style is choosing words and rhythm. She isn’t changing any words.
    hints:
      - She isn’t changing the speech. What is she doing with it?
    solution:
      - She is learning it well enough to say it without her page. That is **memory**.
      - It frees her eyes to look at her audience during delivery.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: why
    covers: [K2.1, S2.1, U2.1]
    type: mc
    prompt: Sam starts his class speech by saying, “I’m really excited to be here,” in a flat voice, while staring at the floor. What will most listeners believe, and why?
    choices:
      - That Sam isn’t excited, because his body and voice say something different from his words.
      - That Sam is excited, because he said so, and words are the clearest message.
      - That Sam is excited but shy, so his body and voice can be ignored.
      - Nothing, because listeners only notice the words in a speech.
    answer: 0
    feedback:
      '1': He did say it. But what are his eyes and voice saying at the same time?
      '2': Some listeners might guess that. But can you ignore half of a message? What would help him be believed?
      '3': Listeners take in body and voice too, often without noticing.
    hints:
      - List the three parts of Sam’s message. Do they agree?
    solution:
      - The words say “excited.” The flat voice and lowered eyes say “not excited.”
      - When they don’t match, listeners usually believe the body and voice. Effective speakers make all three agree.

  - id: b2
    level: 2
    thinking: perspective
    covers: [S3.2, U3.1, S3.1]
    type: mc
    prompt: |-
      Omar is presenting the class’s new recycling plan to two audiences, a Grade 1 class and the school’s caretakers.

      Which change fits the **caretakers** best?
    choices:
      - Explain which bins go where, and how it changes their work.
      - Add a puppet that tells a funny story about a sad pop can.
      - Explain from the start what the word *recycling* means.
      - Make it longer, with more slides, since adults like detail.
    answer: 0
    feedback:
      '1': A puppet suits the Grade 1s. What do the caretakers need to know?
      '2': The caretakers already know what recycling is. Who might need that explained?
      '3': Longer isn’t better. The caretakers are busy. What do they actually need?
    hints:
      - What do the caretakers already know? What will the plan change for them?
    solution:
      - The caretakers know recycling well, and the plan changes their work. They need **where the bins go and what changes for them**.
      - The puppet and the definition belong in the Grade 1 version. Adjust the content to the audience’s background and interests.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K1.2, K4.3, S4.2]
    type: mc
    prompt: |-
      A group is planning the class garden. Taylor says, “Let’s plant pumpkins.”

      Ali answers, “We can’t do that. Taylor’s ideas never work.”

      Which protocol has Ali forgotten?
    choices:
      - Focusing on the idea rather than on who gave it.
      - Waiting to take turns before speaking.
      - Ending the discussion with consensus.
      - Choosing a formal style of speaking.
    answer: 0
    feedback:
      '1': Ali waited until Taylor finished. What is his answer really about?
      '2': The group hasn’t reached the end yet. What went wrong right here?
      '3': Formal or not, the problem is what Ali’s words are about.
    hints:
      - Is Ali talking about pumpkins, or about Taylor?
    solution:
      - Ali judged the **person**, not the **idea**. Nothing was said about pumpkins at all.
      - This hurts trust. A better answer is, “Pumpkins need a lot of space. Do we have room?”

  - id: b4
    level: 2
    thinking: evidence
    covers: [K5.3, S5.2]
    type: evidence
    prompt: Orators use rhythm, like music, to make words stick. Tap a sentence where the speaker **repeats a pattern** to create rhythm.
    passage: hundred
    paragraphs: [2, 3]
    answer: [p2s3, p2s4, p2s5, p3s3, p3s4, p3s5]
    feedback:
      p2s1: This gives a fact. Is there a pattern of repeated words?
      p2s2: The *one … one* starts a pattern, but look for whole sentences that repeat a pattern.
      p3s1: This is a list, but the sentence isn’t repeated.
      p3s2: This sets up a pattern. Which sentences follow it?
    hints:
      - Look for sentences that start with the same words.
    solution:
      - '“They walked here through snow. They walked here through mud. They walked here because…” Each sentence starts the same way. So do “We still learn to read. We still learn to share.”'
      - The repeated beat is like a drum. Listeners can feel it, and they remember it.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K5.4, S5.3, K5.2]
    type: investigation
    prompt: |-
      Priya will give a short **oration** at her town’s new skatepark opening. Her purpose is to thank the people who built it, and to ask everyone to keep it clean.

      Let’s plan it with the elements of public speaking.
    parts:
      - type: multi
        prompt: '**Invention.** Which ideas fit her purpose? Choose every one.'
        choices:
          - The volunteers who poured the concrete on weekends
          - The fact that the old park had no ramps at all
          - A request to use the garbage bins at the gate
          - Her favourite flavour of slushie
          - The history of the skateboard since the 1950s
        answer: [0, 1, 2]
        feedback:
          '3': It’s fun, but does it help her thank people or ask them to keep it clean?
          '4': Interesting, but long, and not about this park. Does it serve her purpose?
        hints:
          - Her purpose has two parts, thanking and asking. Does each idea help with one?
        solution:
          - The volunteers and the missing ramps help her **thank**. The bins help her **ask**. The others don’t serve the purpose.
      - type: mc
        prompt: '**Arrangement.** Which order would work best?'
        choices:
          - Greet, show what was missing, thank the volunteers, then ask everyone to keep it clean.
          - Ask everyone to keep it clean, then greet, then thank the volunteers.
          - Thank the volunteers, ask about the bins, then greet everyone at the end.
          - Greet, then ask, then thank, then say again what was missing.
        answer: 0
        feedback:
          '1': Starting with a request before saying hello can feel rude. What should come first?
          '2': A greeting at the end comes too late. Listeners need it first.
          '3': Thanks make more sense once people know what was missing. What order builds up to the request?
        hints:
          - Start by greeting. End on what you want people to do.
        solution:
          - Greet first. Show what was missing, so the thanks mean more. End with the request, so it is the last thing people hear.
      - type: mc
        prompt: '**Style.** Which last line has the most rhythm?'
        choices:
          - They built it with their hands. Let’s keep it clean with ours.
          - In conclusion, please remember to keep the park clean at all times.
          - So yeah, don’t leave your garbage around, OK? Thanks.
          - It would be appreciated if litter could be placed in the bins.
        answer: 0
        feedback:
          '1': Clear, but flat. Is there a pattern listeners can feel?
          '2': Slang-y and casual for an official opening. Is there a rhythm?
          '3': Very formal, but it sounds like a sign, not a speaker. Is there a beat?
        hints:
          - Read each one aloud. Which has two halves that echo each other?
        solution:
          - '“They built it with their hands. Let’s keep it clean with ours.” The two halves echo, so it has rhythm and sticks in the mind.'
    wrapUp: Invention finds the ideas, arrangement orders them, and style makes them memorable. Then memory and delivery bring it to life.

  - id: d2
    level: 3
    thinking: perspective
    covers: [K4.4, S4.2, K1.2]
    type: mc
    prompt: |-
      A group can’t agree. Half want a movie day and half want a games day. Everyone is getting cross.

      Which move is most likely to lead to **consensus**?
    choices:
      - '“OK, I’m laughing at us. We’re fighting about having fun! What if we watch a short movie, then play games?”'
      - '“Let’s vote. The bigger half wins, and the other half has to go along with it.”'
      - '“Fine. Do whatever you want. I don’t care any more.”'
      - '“The teacher likes games better, so we should just pick games.”'
    answer: 0
    feedback:
      '1': A vote gives a decision. But will the losing half accept it? Is that consensus?
      '2': Giving up ends the talk, but not with agreement. One voice has left the circle.
      '3': This is about who likes what, not about the ideas. Would the movie half agree?
    hints:
      - Consensus means everyone can accept the plan. Which choice looks after both halves?
      - What does a little humour do when people are cross?
    solution:
      - Gentle **humour** lowers the tension, and the new idea takes in **both** perspectives.
      - A vote leaves half the group unhappy. Consensus finds something everyone can accept.
