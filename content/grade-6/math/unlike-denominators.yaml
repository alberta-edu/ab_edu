id: unlike-denominators
grade: 6
subject: math
organizingIdea: MAT-OI1
outcomes: [eVwjDHYcXUuWmBMwi-XVjg]
order: 7
title: Adding and Subtracting Fractions with Different Denominators
shortTitle: Unlike denominators
summary: >-
  Spot related denominators, find the factor between them, rewrite fractions with a common
  denominator, and add and subtract them to solve problems.

bigIdea: |-
  - You can only add or subtract things that have the **same unit**.
  - For fractions, the unit is the **denominator**. Make them match first.
  - **Related** denominators: multiply the smaller one by the factor that makes the bigger one.
  - **Not related**: multiply the two denominators together.

lesson:
  - title: Pieces of different sizes
    blocks:
      - type: visual
        covers: [K1.1, U1.1, U1.2, S1.3, S1.4]
        component: common-denominators
        props:
          examples:
            - { a: '1/3', op: '+', b: '1/6' }
            - { a: '3/8', op: '−', b: '1/4' }
            - { a: '2/3', op: '+', b: '1/4' }
        caption: Press **Next step**. Split the pieces until they are the same size, then count them.
      - type: callout
        variant: remember
        covers: [h9k9LsDzCEGrqR92bPiBog#U1.1, MAT4-OI1-GQ5-LO1#K1.3]
        title: Remember from Grades 4 and 5
        body: 'Fractions with the same denominator are made of the **same unit fraction**, so you add the numerators. Multiplying the top and bottom by the same number gives an **equivalent** fraction.'

  - title: Related denominators
    blocks:
      - type: table
        covers: [K1.2, S1.1, S1.2]
        headers: [Denominators, Related?, Factor]
        rows:
          - ['3 and 6', 'yes: \(3 \times 2 = 6\)', '2']
          - ['4 and 12', 'yes: \(4 \times 3 = 12\)', '3']
          - ['10 and 100', 'yes: \(10 \times 10 = 100\)', '10']
          - ['4 and 6', 'no: 6 is not a multiple of 4', '—']
      - type: example
        covers: [K1.3, S1.3, S1.4]
        title: Related denominators
        problem: '\(\frac{3}{4} + \frac{5}{12}\)'
        steps:
          - '12 is a multiple of 4: \(4 \times 3 = 12\). The factor is **3**.'
          - 'Multiply the top and bottom of \(\frac{3}{4}\) by 3: \(\frac{3}{4} = \frac{9}{12}\).'
          - 'Add the twelfths: \(\frac{9}{12} + \frac{5}{12} = \frac{14}{12}\).'
        answer: '\(\frac{3}{4} + \frac{5}{12} = \frac{14}{12} = 1\frac{2}{12}\)'

  - title: Denominators that aren’t related
    blocks:
      - type: example
        covers: [K1.4, S1.3, S1.4]
        title: Multiply the denominators
        problem: '\(\frac{2}{3} - \frac{1}{5}\)'
        steps:
          - '3 and 5 are not related. Their product, \(3 \times 5 = 15\), is a common denominator.'
          - '\(\frac{2}{3} = \frac{10}{15}\) (times 5), and \(\frac{1}{5} = \frac{3}{15}\) (times 3).'
          - 'Subtract the fifteenths: \(\frac{10}{15} - \frac{3}{15} = \frac{7}{15}\).'
        answer: '\(\frac{2}{3} - \frac{1}{5} = \frac{7}{15}\)'
      - type: callout
        variant: mistake
        covers: [U1.1, K1.1]
        title: Don’t add the denominators
        body: '\(\frac{1}{3} + \frac{1}{4}\) is **not** \(\frac{2}{7}\). That would be less than \(\frac{1}{3}\) alone! The denominator names the unit, and adding doesn’t change the unit.'

  - title: Fractions in stories
    blocks:
      - type: example
        covers: [S1.5, U1.2]
        title: Pancake batter
        problem: 'A recipe needs \(\frac{3}{4}\) cup of milk and \(\frac{2}{3}\) cup of water. Will it all fit in a 1-cup measure?'
        steps:
          - '4 and 3 are not related, so use \(4 \times 3 = 12\).'
          - '\(\frac{3}{4} = \frac{9}{12}\) and \(\frac{2}{3} = \frac{8}{12}\).'
          - '\(\frac{9}{12} + \frac{8}{12} = \frac{17}{12}\). That is more than \(\frac{12}{12}\), which is 1 cup.'
        answer: 'No. There is \(1\frac{5}{12}\) cups of liquid, so it won’t fit.'

keyTerms:
  - term: Common denominator
    covers: [K1.1, S1.3]
    definition: 'A denominator two fractions share, so they count the same unit, like twelfths.'
  - term: Related denominators
    covers: [K1.2]
    definition: 'Denominators where one is a multiple of the other, like 4 and 12.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K1.2, S1.1]
    type: multi
    prompt: Which pairs of denominators are **related**? Choose all of them.
    choices: ['4 and 12', '3 and 9', '6 and 8', '5 and 20', '10 and 15']
    answer: [0, 1, 3]
    feedback:
      '2': '8 is not a multiple of 6. \(6 \times 1 = 6\) and \(6 \times 2 = 12\) skip right past it.'
      '4': '15 is not a multiple of 10. They share a factor, but that isn’t the same as related.'
    hints:
      - Related means one denominator is a multiple of the other. Can you multiply the smaller one to reach the bigger one?
    solution:
      - '\(4 \times 3 = 12\), \(3 \times 3 = 9\) and \(5 \times 4 = 20\). Those pairs are related.'
      - '8 is not a multiple of 6, and 15 is not a multiple of 10.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.4, K1.3, S1.2]
    type: fraction
    prompt: '\(\frac{1}{2} + \frac{3}{8}\) = ?'
    answer: 7/8
    verify: 1/2 + 3/8
    hints:
      - '8 is a multiple of 2. What do you multiply 2 by to get 8?'
    solution:
      - '\(2 \times 4 = 8\), so \(\frac{1}{2} = \frac{4}{8}\).'
      - '\(\frac{4}{8} + \frac{3}{8} = \frac{7}{8}\).'

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.4, S1.3, K1.1]
    type: multi
    prompt: 'You want to work out \(\frac{5}{6} - \frac{1}{4}\). Which numbers could be a **common denominator**? Choose all of them.'
    choices: ['24', '12', '10', '6', '48']
    answer: [0, 1, 4]
    feedback:
      '2': '10 is \(6 + 4\). A common denominator has to be a multiple of 6 **and** of 4.'
      '3': 'Sixths work for \(\frac{5}{6}\), but can fourths be written as sixths?'
    hints:
      - A common denominator must be a multiple of both 6 and 4.
      - 'The product \(6 \times 4\) always works. Are there others?'
    solution:
      - '\(6 \times 4 = 24\) always works. 12 and 48 are also multiples of both 6 and 4.'
      - 'Using 12: \(\frac{10}{12} - \frac{3}{12} = \frac{7}{12}\).'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.5, S1.4]
    type: fraction
    prompt: 'Lia walks \(\frac{3}{4}\) km to the library, then \(\frac{2}{3}\) km to the park. How far does she walk in all?'
    answer: 1 5/12
    verify: 3/4 + 2/3
    hints:
      - Is this story putting together or taking away?
      - '4 and 3 are not related. Try twelfths.'
    solution:
      - 'The two walks join, so add: \(\frac{3}{4} + \frac{2}{3}\).'
      - '\(\frac{9}{12} + \frac{8}{12} = \frac{17}{12} = 1\frac{5}{12}\) km.'

  - id: b2
    level: 2
    thinking: flaw
    covers: [U1.1, K1.1, U1.2]
    type: mc
    prompt: 'Omar says \(\frac{1}{3} + \frac{1}{4} = \frac{2}{7}\). How can you tell he is wrong, even before working it out?'
    choices:
      - '\(\frac{2}{7}\) is less than \(\frac{1}{3}\), but adding \(\frac{1}{4}\) should make it bigger.'
      - 'The answer must have a denominator of 3 or 4.'
      - 'Fractions with different denominators can’t be added at all.'
      - 'You should multiply the numerators instead: \(1 \times 1 = 1\).'
    answer: 0
    feedback:
      '1': 'The answer can be in twelfths, which is neither. Look at the size of his answer.'
      '2': 'They can be added, once the pieces are the same size.'
      '3': 'Multiplying isn’t adding. Check the size of his answer.'
    hints:
      - Compare \(\frac{2}{7}\) with \(\frac{1}{3}\). Which is bigger?
    solution:
      - '\(\frac{1}{3}\) is about 0.33 and \(\frac{2}{7}\) is about 0.29. His answer is smaller than one of the parts.'
      - 'He added the denominators, but thirds and fourths must become twelfths: \(\frac{4}{12} + \frac{3}{12} = \frac{7}{12}\).'

  - id: b3
    level: 2
    thinking: backwards
    covers: [S1.5, S1.4, S1.3]
    type: fraction
    prompt: 'A **1 L** jug is full of juice. Ana pours \(\frac{3}{8}\) L, then Ben pours some. Now \(\frac{1}{4}\) L is left. How much did Ben pour?'
    answer: 3/8
    verify: 1 - 3/8 - 1/4
    hints:
      - 'Ana’s pour + Ben’s pour + what is left = 1 whole litre.'
      - 'Write 1 and \(\frac{1}{4}\) in eighths.'
    solution:
      - '1 L is \(\frac{8}{8}\), and \(\frac{1}{4} = \frac{2}{8}\).'
      - 'Ben poured \(\frac{8}{8} - \frac{3}{8} - \frac{2}{8} = \frac{3}{8}\) L.'
      - 'Check: \(\frac{3}{8} + \frac{3}{8} + \frac{2}{8} = 1\) ✓'

  - id: b4
    level: 2
    thinking: connect
    covers: [U1.2, S1.3, S1.1]
    type: mc
    prompt: 'For a fundraiser, Class A has raised \(\frac{3}{5}\) of its goal. Class B has raised \(\frac{7}{12}\) of its goal. Which class is closer to its goal?'
    choices: ['Class A', 'Class B', 'They are the same']
    fixedOrder: true
    answer: 0
    feedback:
      '1': '7 is a bigger numerator, but twelfths are smaller pieces than fifths. Put both in the same unit.'
      '2': 'Write both with a common denominator, such as 60. Are the numerators equal?'
    hints:
      - To compare, give them the same unit. 5 and 12 are not related.
    solution:
      - 'Use \(5 \times 12 = 60\): \(\frac{3}{5} = \frac{36}{60}\) and \(\frac{7}{12} = \frac{35}{60}\).'
      - '36 sixtieths is more than 35 sixtieths, so **Class A** is closer, just barely.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.5, S1.3, K1.4, S1.4]
    type: investigation
    prompt: |-
      A community garden plot is planted with carrots in \(\frac{1}{3}\) of it, beans in \(\frac{1}{4}\) and peas in \(\frac{1}{6}\). Flowers fill the rest.
    parts:
      - type: multi
        prompt: 'Which of these could be a common denominator for \(\frac{1}{3}\), \(\frac{1}{4}\) and \(\frac{1}{6}\) all at once? Choose all of them.'
        choices: ['12', '24', '72', '6', '13']
        answer: [0, 1, 2]
        feedback:
          '3': '6 works for thirds and sixths, but can fourths become sixths?'
          '4': '13 adds up 3, 4 and 6. A common denominator must be a multiple of each one.'
        hints:
          - A common denominator must be a multiple of 3, of 4 and of 6.
        solution:
          - '12, 24 and 72 are all multiples of 3, 4 and 6. 12 is the smallest.'
      - type: fraction
        prompt: What fraction of the plot has vegetables?
        answer: 3/4
        verify: 1/3 + 1/4 + 1/6
        hints:
          - Write each fraction in twelfths, then add.
        solution:
          - '\(\frac{4}{12} + \frac{3}{12} + \frac{2}{12} = \frac{9}{12}\), which equals \(\frac{3}{4}\).'
      - type: fraction
        prompt: What fraction of the plot has flowers?
        answer: 1/4
        verify: 1 - 3/4
        hints:
          - The whole plot is \(\frac{12}{12}\).
        solution:
          - '\(\frac{12}{12} - \frac{9}{12} = \frac{3}{12}\), which equals \(\frac{1}{4}\). The flowers take the same space as the beans.'
    wrapUp: 'With three different denominators, find one unit that all of them can become. Then the whole plot is just counting twelfths.'

  - id: d2
    level: 3
    thinking: design
    covers: [S1.3, S1.4, K1.2, U1.1]
    type: build
    prompt: |-
      Find two fractions that add to **exactly 1**. Each is less than 1, and their denominators are **not related**: neither is a multiple of the other.
    fields:
      - { name: a, label: 'First numerator' }
      - { name: b, label: 'First denominator' }
      - { name: c, label: 'Second numerator' }
      - { name: d, label: 'Second denominator' }
    rules:
      - { test: 'a % 1 == 0 && b % 1 == 0 && c % 1 == 0 && d % 1 == 0 && a >= 1 && c >= 1 && b <= 100 && d <= 100', fail: 'Use whole numbers, with numerators of at least 1 and denominators up to 100.' }
      - { test: 'a < b && c < d', fail: 'Each fraction must be less than 1, so each numerator must be smaller than its denominator.' }
      - { test: 'b % d != 0 && d % b != 0', fail: 'Those denominators are related, because one is a multiple of the other. Find two that aren’t.' }
      - { test: 'a / b + c / d == 1', fail: 'Find a common denominator and add. Your two fractions don’t make exactly 1.' }
    examples:
      - { a: 2, b: 6, c: 6, d: 9 }
      - { a: 3, b: 6, c: 4, d: 8 }
      - { a: 4, b: 10, c: 9, d: 15 }
    counterexamples:
      - { a: 1, b: 3, c: 2, d: 3 }
      - { a: 1, b: 3, c: 1, d: 4 }
      - { a: 1, b: 4, c: 6, d: 8 }
    hints:
      - 'Start with an easy pair that makes 1, like \(\frac{1}{3} + \frac{2}{3}\). Their denominators are the same.'
      - 'Now write each one as an equivalent fraction, using a different multiplier for each.'
      - '\(\frac{1}{3} = \frac{2}{6}\) and \(\frac{2}{3} = \frac{6}{9}\). Are 6 and 9 related?'
    solution:
      - '\(\frac{2}{6} + \frac{6}{9}\): 6 and 9 are not related. Using 18: \(\frac{6}{18} + \frac{12}{18} = \frac{18}{18} = 1\) ✓'
      - '\(\frac{3}{6} + \frac{4}{8}\) is \(\frac{1}{2} + \frac{1}{2}\) in disguise, and 6 and 8 are not related.'
      - 'The trick: equivalent fractions can hide a simple pair behind different denominators.'
