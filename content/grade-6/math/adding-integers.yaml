id: adding-integers
grade: 6
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT6-OI1-GQ1-LO1]
order: 2
title: Adding and Subtracting Integers
shortTitle: Adding integers
summary: >-
  Model sums of integers with zero pairs and number line arrows, write zero many ways, and turn
  every subtraction into adding the opposite.

bigIdea: |-
  - A number plus its **opposite** is **zero**: a **zero pair**.
  - Two positives add to a **positive**. Two negatives add to a **negative**.
  - A positive plus a negative: take away the zero pairs, and **what is left** is the sum.
  - **Subtracting** a number is the same as **adding its opposite**.

lesson:
  - title: Zero pairs
    blocks:
      - type: visual
        covers: [K2.2, S2.1, S2.3, S2.4, S2.5]
        component: zero-pairs
        props: { a: 3, b: -3, op: '+' }
        caption: |-
          - Press **Next step** to add 3 and −3.
          - Then change the numbers. Can you make zero another way?

  - title: Many ways to make zero
    blocks:
      - type: table
        covers: [S2.2, K2.2, U2.1]
        headers: [Sum, Zero pairs, Value]
        rows:
          - ['\(4 + (-4)\)', '4 pairs', '0']
          - ['\((-7) + 7\)', '7 pairs', '0']
          - ['\(2 + 3 + (-5)\)', '5 pairs', '0']
          - ['\((-1) + (-1) + 2\)', '2 pairs', '0']
      - type: text
        covers: [K2.1, U2.1]
        body: The **integers** are the natural numbers, their opposites and zero. You can write **any** integer as a sum in endless ways. For example, \(3 = 1 + 2 = 5 + (-2) = 10 + (-7)\).

  - title: Same signs
    blocks:
      - type: compare
        covers: [K2.3, K2.4, S2.3, S2.4]
        columns:
          - title: Two positives
            figure: { kind: int-line, min: -7, max: 7, jumps: [{ from: 0, to: 4 }, { from: 4, to: 6 }], points: [{ v: 6, label: '6' }] }
            body: '\(4 + 2 = 6\). Both arrows go right, so the sum is **positive**.'
          - title: Two negatives
            figure: { kind: int-line, min: -7, max: 7, jumps: [{ from: 0, to: -4 }, { from: -4, to: -6 }], points: [{ v: -6, label: '−6' }] }
            body: '\((-4) + (-2) = -6\). Both arrows go left, so the sum is **negative**.'

  - title: Different signs
    blocks:
      - type: figure
        covers: [K2.5, S2.5]
        figure: { kind: int-line, min: -7, max: 7, jumps: [{ from: 0, to: 5 }, { from: 5, to: 2 }], points: [{ v: 2, label: '2' }] }
        caption: 'For \(5 + (-3)\), go 5 right, then 3 back. You land on **2**.'
      - type: example
        covers: [K2.5, S2.5]
        title: Zero plus what is left
        problem: '\(5 + (-3)\)'
        steps:
          - 'Split 5 into \(3 + 2\), so the sum is \(2 + 3 + (-3)\).'
          - '\(3 + (-3)\) is a zero pair. It is worth **0**.'
          - 'So the sum is \(2 + 0 = 2\).'
        answer: '\(5 + (-3) = 2\)'

  - title: Subtracting is adding the opposite
    blocks:
      - type: visual
        covers: [K3.1, S3.1, U3.1]
        component: zero-pairs
        props: { a: 2, b: 5, op: '−' }
        caption: Press **Next step**. Taking away 5 turns into **adding −5**.
      - type: table
        covers: [S3.1, K3.1, U3.1]
        headers: [Difference, As a sum, Value]
        rows:
          - ['\(2 - 5\)', '\(2 + (-5)\)', '−3']
          - ['\((-4) - 3\)', '\((-4) + (-3)\)', '−7']
          - ['\(1 - (-6)\)', '\(1 + 6\)', '7']

keyTerms:
  - term: Integers
    covers: [K2.1]
    definition: 'The natural numbers, their opposites and zero: … −3, −2, −1, 0, 1, 2, 3 …'
  - term: Zero pair
    covers: [K2.2]
    definition: 'A number and its opposite, like 4 and −4. Together they add to zero.'
  - term: Adding the opposite
    covers: [K3.1, S3.1]
    definition: 'Subtracting a number gives the same answer as adding its opposite: \(2 - 5 = 2 + (-5)\).'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S2.4, K2.4]
    type: number
    prompt: '\((-6) + (-3)\) = ?'
    answer: -9
    verify: (0 - 6) + (0 - 3)
    hints:
      - Both numbers are negative. Which way does each arrow go?
    solution:
      - 'Start at 0. Go 6 left to −6, then 3 more left to −9.'
      - 'Two negatives add to a negative: \((-6) + (-3) = -9\).'

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.2, S2.2, S2.1]
    type: multi
    prompt: Which of these sums are equal to **zero**? Choose all of them.
    choices:
      - '\(8 + (-8)\)'
      - '\((-5) + 5\)'
      - '\(4 + (-4) + 3\)'
      - '\(2 + 3 + (-5)\)'
      - '\((-6) + (-6)\)'
    answer: [0, 1, 3]
    feedback:
      '2': '\(4 + (-4)\) is zero, but then there is still 3 more.'
      '4': 'Two negatives make a negative. These are not opposites.'
    hints:
      - Look for a number and its opposite. Is anything left over?
    solution:
      - '\(8 + (-8)\) and \((-5) + 5\) are zero pairs.'
      - '\(2 + 3 = 5\), and \(5 + (-5) = 0\). So that sum is zero too.'
      - '\(4 + (-4) + 3 = 3\), and \((-6) + (-6) = -12\).'

  - id: w3
    level: 1
    thinking: recall
    covers: [K3.1, S3.1]
    type: mc
    prompt: 'Which sum has the same value as \(4 - 9\)?'
    choices: ['\(4 + (-9)\)', '\((-4) + 9\)', '\(4 + 9\)', '\(9 + (-4)\)']
    answer: 0
    feedback:
      '1': 'The 4 stays as it is. It is the 9 you are taking away that changes.'
      '2': 'Subtracting 9 and adding 9 move in opposite directions. What do you add instead of taking away 9?'
      '3': 'That is \(9 - 4\), which is 5. Is \(4 - 9\) the same as \(9 - 4\)?'
    hints:
      - Subtracting a number is the same as adding its …?
    solution:
      - 'Subtracting 9 is the same as adding its opposite, −9.'
      - 'So \(4 - 9 = 4 + (-9) = -5\).'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S2.5, K2.5, K1.5]
    type: number
    prompt: One winter morning at 6 a.m., it was **−8 °C**. Then a Chinook wind blew in, and by noon it was **13 degrees warmer**. What was the temperature at noon?
    answer: 5
    unit: °C
    verify: (0 - 8) + 13
    hints:
      - Warmer means adding. Which sum matches the story?
      - '\((-8) + 13\). How many of the 13 cancel out the −8?'
    solution:
      - 'The story is the sum \((-8) + 13\).'
      - 'Split 13 into \(8 + 5\). Then \((-8) + 8\) is a zero pair, and 5 is left.'
      - 'At noon it was **5 °C**. Check on a thermometer: 8 up to zero, then 5 more.'

  - id: b2
    level: 2
    thinking: flaw
    covers: [K2.5, S2.5, K2.4]
    type: mc
    prompt: |-
      Leo works out \((-7) + 4\) like this:

      "7 and 4 make 11. The 7 was negative, so the answer is −11."

      Where did Leo go wrong?
    choices:
      - The 4 is positive, so it should cancel some of the −7, not add to it.
      - He should have made the answer positive, because 4 is positive.
      - He should have subtracted 7 from 4 to get 3.
      - Nothing. Leo’s answer, −11, is correct.
    answer: 0
    feedback:
      '1': 'Check with counters: 7 negatives and 4 positives. Are there more negatives or more positives left over?'
      '2': 'That gives 3, but is the answer positive? Which kind of counter is left over?'
      '3': 'Try it on a number line: start at −7 and go 4 to the right. Do you reach −11?'
    hints:
      - Draw 7 negative counters and 4 positive counters. What happens to the pairs?
    solution:
      - 'Adding the magnitudes works only when both numbers have the **same** sign.'
      - 'Here, 4 positives pair up with 4 of the negatives to make zero. That leaves **3 negatives**.'
      - 'So \((-7) + 4 = -3\). On a number line: start at −7 and go 4 right.'

  - id: b3
    level: 2
    thinking: backwards
    covers: [S2.5, U3.1, K2.5]
    type: number
    prompt: In a video game, Oskar falls into a trap, and his score changes by **−6** points. His score is now **−2**. What was his score before the trap?
    answer: 4
    verify: (0 - 2) + 6
    hints:
      - 'Something + (−6) = −2. Can you undo the −6?'
      - The opposite of −6 is 6. Add it back.
    solution:
      - 'The story is: score \(+ (-6) = -2\).'
      - 'To undo adding −6, add its opposite: \(-2 + 6 = 4\).'
      - 'Check: \(4 + (-6) = -2\) ✓'

  - id: b4
    level: 2
    thinking: estimate
    covers: [K2.3, K2.4, K2.5, K2.2]
    type: multi
    prompt: '**Without** working them out, which of these sums are **negative**? Choose all of them.'
    choices:
      - '\((-23) + (-14)\)'
      - '\((-50) + 31\)'
      - '\((-18) + 42\)'
      - '\(27 + (-27)\)'
      - '\(36 + 15\)'
    answer: [0, 1]
    feedback:
      '2': 'There are 42 positives and only 18 negatives. Which kind is left after the zero pairs go?'
      '3': 'A number plus its opposite is zero, and zero is not negative.'
      '4': 'Two positive numbers always add to a positive number.'
    hints:
      - When the signs are different, which kind of counter is left after the zero pairs go?
    solution:
      - 'Two negatives make a negative: \((-23) + (-14)\).'
      - 'With different signs, the number with the greater magnitude wins. In \((-50) + 31\), there are more negatives, so the sum is negative.'
      - 'In \((-18) + 42\) there are more positives. \(27 + (-27)\) is zero, which is neither.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: design
    covers: [S2.2, U2.1, K2.2]
    type: build
    prompt: |-
      Make a **zero puzzle** for a friend. Choose **two different positive** integers and **two different negative** integers that add up to zero.
      To make it tricky, no positive number can be the opposite of a negative one.
    fields:
      - { name: a, label: 'First positive' }
      - { name: b, label: 'Second positive' }
      - { name: c, label: 'First negative' }
      - { name: d, label: 'Second negative' }
    rules:
      - { test: 'a % 1 == 0 && b % 1 == 0 && c % 1 == 0 && d % 1 == 0', fail: 'Use integers only, with no fractions or decimals.' }
      - { test: 'a > 0 && b > 0 && a != b', fail: 'The first two boxes need two different positive numbers.' }
      - { test: 'c < 0 && d < 0 && c != d', fail: 'The last two boxes need two different negative numbers, with a − sign.' }
      - { test: 'a + c != 0 && a + d != 0 && b + c != 0 && b + d != 0', fail: 'One of your positives is the opposite of one of your negatives. That makes the puzzle too easy!' }
      - { test: 'a + b + c + d == 0', fail: 'Add all four. The positives and the negatives need to cancel out exactly.' }
    examples:
      - { a: 1, b: 4, c: -2, d: -3 }
      - { a: 6, b: 4, c: -7, d: -3 }
      - { a: 10, b: 2, c: -5, d: -7 }
    counterexamples:
      - { a: 3, b: 4, c: -3, d: -4 }
      - { a: 5, b: 4, c: -2, d: -3 }
      - { a: 2, b: 2, c: -1, d: -3 }
    hints:
      - The two positives make some total. What must the two negatives make?
      - 'Pick the positives first, like 1 and 4. They make 5. Now split −5 into two negatives.'
      - Watch out for opposites. If you split −5 into −1 and −4, the 1 and −1 are opposites.
    solution:
      - 'The positives and the negatives must have the same total magnitude, so they cancel out.'
      - '1 and 4 make 5. Split −5 into −2 and −3: \(1 + 4 + (-2) + (-3) = 0\). No two of these are opposites.'
      - '6 and 4 make 10, and −7 and −3 make −10. That works too.'
      - 'Zero can be written as a sum in endless ways.'

  - id: d2
    level: 3
    thinking: breakdown
    covers: [K3.1, S3.1, U3.1]
    type: investigation
    figure: { kind: int-line, min: -20, max: 10, view: thermometer, points: [{ v: 5, label: cabin }, { v: -12, label: outside }] }
    prompt: |-
      At a winter camp, the cabin is **5 °C** and it is **−12 °C** outside. The difference between two temperatures is the warmer one **minus** the colder one.
    parts:
      - type: mc
        prompt: Which expression gives the difference between the two temperatures?
        choices: ['\(5 - (-12)\)', '\(5 - 12\)', '\((-12) - 5\)', '\(5 + (-12)\)']
        answer: 0
        feedback:
          '1': 'The outside temperature is −12, not 12. Which number do you subtract?'
          '2': 'That is the colder one minus the warmer one. The problem says warmer minus colder.'
          '3': 'That adds −12. The difference subtracts the colder temperature.'
        hints:
          - Warmer minus colder. Which is warmer?
        solution:
          - 'The cabin is warmer, so the difference is \(5 - (-12)\).'
      - type: number
        prompt: 'Write \(5 - (-12)\) as a sum, then find its value. How many degrees warmer is the cabin?'
        answer: 17
        unit: degrees
        verify: 5 + 12
        hints:
          - Subtracting a number is adding its opposite. What is the opposite of −12?
          - 'Check on the thermometer: count from −12 up to 0, then up to 5.'
        solution:
          - 'Subtracting −12 is the same as adding 12: \(5 - (-12) = 5 + 12 = 17\).'
          - 'On the thermometer, it is 12 degrees from −12 up to 0, and 5 more up to 5. That makes **17**.'
      - type: number
        prompt: Overnight it gets **6 degrees colder** outside, but the cabin stays at 5 °C. What is the difference now?
        answer: 23
        unit: degrees
        verify: 5 - (0 - 12 - 6)
        hints:
          - What is the outside temperature now? Is it farther from the cabin, or closer?
        solution:
          - 'Outside is now \((-12) + (-6) = -18\) °C.'
          - 'The difference is \(5 - (-18) = 5 + 18 = 23\) degrees. It grew by 6, because the outside moved 6 degrees farther away.'
    wrapUp: 'Subtracting a negative number is adding a positive one. On a thermometer, that is just the distance between the two temperatures.'
