id: fraction-times-whole
grade: 6
subject: math
organizingIdea: MAT-OI1
outcomes: [sAJrul14WkyWyL8gNRW3rw]
order: 8
title: Multiplying Fractions and Natural Numbers
shortTitle: Fraction × whole number
summary: >-
  Multiply natural numbers by fractions as repeated addition, find a fraction of a number by
  sharing then taking parts, and see why a product can be smaller.

bigIdea: |-
  - \(4 \times \frac{2}{3}\) is **4 groups** of \(\frac{2}{3}\): multiply the numerator, keep the denominator.
  - \(\frac{3}{4} \times 12\) is **three-fourths of 12**: divide by 4, then take 3 parts.
  - Multiplying by a **unit fraction** is dividing: \(12 \times \frac{1}{4} = 12 \div 4\).
  - Multiplying by a fraction less than 1 gives a **smaller** number.

lesson:
  - title: Groups of a fraction
    blocks:
      - type: visual
        covers: [U1.2, S1.1, K1.2, S1.2]
        component: fraction-times
        props: { mode: groups, n: 4, a: 2, b: 3 }
        caption: |-
          - Each jump is \(\frac{2}{3}\). Count the jumps and the thirds.
          - Change the number of groups. What happens to the numerator?

  - title: Multiply the numerator
    blocks:
      - type: table
        covers: [K1.1, K1.2, K1.5, S1.2]
        headers: [Product, Repeated addition, Answer]
        rows:
          - ['\(3 \times \frac{2}{5}\)', '\(\frac{2}{5} + \frac{2}{5} + \frac{2}{5}\)', '\(\frac{3 \times 2}{5} = \frac{6}{5}\)']
          - ['\(4 \times \frac{3}{8}\)', '\(\frac{3}{8} + \frac{3}{8} + \frac{3}{8} + \frac{3}{8}\)', '\(\frac{4 \times 3}{8} = \frac{12}{8}\)']
          - ['\(a \times \frac{b}{c}\)', '\(a\) groups of \(\frac{b}{c}\)', '\(\frac{ab}{c}\)']
      - type: callout
        variant: tip
        covers: [K1.3, K1.4, S1.3, S1.4]
        title: A unit fraction divides
        body: '\(12 \times \frac{1}{4} = \frac{12}{4} = 12 \div 4 = 3\). Multiplying by \(\frac{1}{4}\) is the same as dividing by 4.'

  - title: A fraction of a number
    blocks:
      - type: visual
        covers: [U1.3, S1.5, K1.6, S1.6]
        component: fraction-times
        props: { mode: part, n: 12, a: 3, b: 4 }
        caption: |-
          - Split 12 into 4 equal parts, then take 3 of them.
          - Try other numbers. When are the parts not whole numbers?
      - type: example
        covers: [K1.6, S1.6, K1.1]
        title: Three-fourths of 12
        problem: '\(\frac{3}{4} \times 12\)'
        steps:
          - 'Divide by the denominator: \(12 \div 4 = 3\) in each fourth.'
          - 'Multiply by the numerator: \(3 \times 3 = 9\).'
          - 'Or multiply first: \(\frac{3 \times 12}{4} = \frac{36}{4} = 9\). Same answer.'
        answer: '\(\frac{3}{4} \times 12 = 9\)'

  - title: Can multiplying make it smaller?
    blocks:
      - type: compare
        covers: [U1.1]
        columns:
          - title: Less than 1
            figure: { kind: fraction-bars, n: 3, d: 4, wholes: 1 }
            body: '\(12 \times \frac{3}{4} = 9\). Less than 12.'
          - title: More than 1
            figure: { kind: fraction-bars, n: 5, d: 4, wholes: 2 }
            body: '\(12 \times \frac{5}{4} = 15\). More than 12.'
      - type: callout
        variant: mistake
        covers: [U1.1]
        title: Multiplying doesn’t always make bigger
        body: Taking **part** of a number gives less than the number. It is only bigger when the fraction is more than 1.

  - title: Fractions in stories
    blocks:
      - type: example
        covers: [S1.7, S1.6]
        title: Walking to school
        problem: 'A class has **24** students. \(\frac{2}{3}\) of them walk to school. How many walk?'
        steps:
          - '"\(\frac{2}{3}\) of 24" means \(\frac{2}{3} \times 24\).'
          - 'One-third of 24 is \(24 \div 3 = 8\).'
          - 'Two-thirds is \(2 \times 8 = 16\).'
        answer: '**16** students walk to school.'

keyTerms:
  - term: Unit fraction
    covers: [K1.3]
    definition: 'A fraction with a numerator of 1, like \(\frac{1}{4}\). Multiplying by it divides by its denominator.'
  - term: Fraction of a number
    covers: [U1.3, S1.5]
    definition: 'Part of an amount. \(\frac{3}{4}\) of 12 means \(\frac{3}{4} \times 12 = 9\).'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S1.2, K1.2]
    type: fraction
    prompt: '\(4 \times \frac{2}{3}\) = ?'
    answer: 8/3
    verify: 4 * 2 / 3
    hints:
      - Four groups of two-thirds. How many thirds is that?
    solution:
      - '\(4 \times \frac{2}{3} = \frac{4 \times 2}{3} = \frac{8}{3}\), or \(2\frac{2}{3}\).'

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.3, S1.3, S1.4]
    type: mc
    prompt: 'Which is the same as \(6 \times \frac{1}{3}\)?'
    choices: ['\(6 \div 3\)', '\(3 \div 6\)', '\(6 + \frac{1}{3}\)', '\(\frac{1}{18}\)']
    answer: 0
    feedback:
      '1': 'That is \(\frac{3}{6}\), which is a half. Six groups of a third make more than 1.'
      '2': 'That adds a third once. Multiplying means six groups of a third.'
      '3': 'The denominator doesn’t change when you multiply by a natural number.'
    hints:
      - Six groups of \(\frac{1}{3}\) is \(\frac{6}{3}\). What division is that?
    solution:
      - '\(6 \times \frac{1}{3} = \frac{6}{3} = 6 \div 3 = 2\).'

  - id: w3
    level: 1
    thinking: notice
    covers: [U1.1, K1.5]
    type: mc
    prompt: Which of these products is **less than 10**?
    choices: ['\(10 \times \frac{3}{4}\)', '\(10 \times \frac{5}{4}\)', '\(10 \times 2\)', '\(10 \times \frac{4}{4}\)']
    answer: 0
    feedback:
      '1': '\(\frac{5}{4}\) is more than 1 whole, so the product is more than 10.'
      '2': 'Two groups of 10 is 20.'
      '3': '\(\frac{4}{4}\) is 1 whole, so the product is exactly 10.'
    hints:
      - Is each fraction less than 1, equal to 1, or more than 1?
    solution:
      - '\(\frac{3}{4}\) is less than 1, so \(10 \times \frac{3}{4}\) is less than 10. It is 7.5.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.7, S1.6, U1.3]
    type: number
    prompt: 'A class has **28** students. \(\frac{3}{4}\) of them signed up for the science fair. How many students signed up?'
    answer: 21
    unit: students
    verify: 3 / 4 * 28
    hints:
      - '"\(\frac{3}{4}\) of 28" means \(\frac{3}{4} \times 28\).'
      - What is one-fourth of 28?
    solution:
      - 'One-fourth of 28 is \(28 \div 4 = 7\).'
      - 'Three-fourths is \(3 \times 7 = 21\) students.'

  - id: b2
    level: 2
    thinking: connect
    covers: [S1.1, S1.2, U1.2]
    type: number
    prompt: 'A pancake batch needs \(\frac{2}{3}\) cup of flour. You are making **5** batches, but your only scoop holds \(\frac{1}{3}\) cup. How many scoops do you need?'
    answer: 10
    unit: scoops
    verify: 5 * 2
    hints:
      - How much flour do 5 batches need, in thirds?
    solution:
      - '\(5 \times \frac{2}{3} = \frac{10}{3}\) cups.'
      - 'That is 10 thirds, so you need **10** scoops of \(\frac{1}{3}\) cup.'

  - id: b3
    level: 2
    thinking: flaw
    covers: [K1.5, K1.6, S1.6]
    type: mc
    prompt: 'Tina works out \(\frac{2}{5} \times 15\) and writes \(\frac{30}{75}\). What did she do wrong?'
    choices:
      - She multiplied the denominator by 15 too. Only the numerator is multiplied.
      - She should have added 15 to the numerator.
      - She should have multiplied 5 by 15 and left the 2 alone.
      - Nothing. \(\frac{30}{75}\) is the right answer.
    answer: 0
    feedback:
      '1': 'Adding isn’t multiplying. Think of it as 15 groups of \(\frac{2}{5}\).'
      '2': 'That gives \(\frac{2}{75}\), which is tiny. Two-fifths of 15 should be a good part of 15.'
      '3': '\(\frac{30}{75} = \frac{2}{5}\). Her answer is the fraction she started with!'
    hints:
      - 'Two-fifths of 15: what is one-fifth of 15?'
    solution:
      - 'The denominator names the unit, fifths. Multiplying by 15 changes how many fifths, not their size.'
      - '\(\frac{2 \times 15}{5} = \frac{30}{5} = 6\). Check: one-fifth of 15 is 3, and two-fifths is 6 ✓'

  - id: b4
    level: 2
    thinking: backwards
    covers: [S1.5, S1.7, U1.3]
    type: number
    prompt: '\(\frac{3}{8}\) of the marbles in a bag are blue. There are **15** blue marbles. How many marbles are in the bag?'
    answer: 40
    unit: marbles
    verify: 15 / 3 * 8
    hints:
      - 3 of the 8 equal parts make 15 marbles. How many marbles are in one part?
    solution:
      - 'Three-eighths is 15 marbles, so one-eighth is \(15 \div 3 = 5\).'
      - 'The whole bag is 8 eighths: \(8 \times 5 = 40\) marbles.'
      - 'Check: \(\frac{3}{8} \times 40 = \frac{120}{8} = 15\) ✓'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.7, S1.6, S1.5]
    type: investigation
    prompt: |-
      A hiking trail is **12 km** long. On day 1, a family hikes \(\frac{1}{3}\) of the trail. On day 2, they hike \(\frac{3}{4}\) of the distance that is **left**.
    parts:
      - type: number
        prompt: How many kilometres are left after day 1?
        answer: 8
        unit: km
        verify: 12 - 12 / 3
        hints:
          - 'Find \(\frac{1}{3}\) of 12 first.'
        solution:
          - 'Day 1: \(\frac{1}{3} \times 12 = 4\) km. Left: \(12 - 4 = 8\) km.'
      - type: number
        prompt: How many kilometres do they hike on day 2?
        answer: 6
        unit: km
        verify: 3 / 4 * 8
        hints:
          - 'Three-fourths of what is left, not of the whole trail.'
        solution:
          - '\(\frac{3}{4} \times 8 = 6\) km.'
      - type: fraction
        prompt: What fraction of the **whole trail** is still left after day 2?
        answer: 1/6
        verify: (12 - 4 - 6) / 12
        hints:
          - How many kilometres are left? Out of how many?
        solution:
          - '\(12 - 4 - 6 = 2\) km are left. That is \(\frac{2}{12}\), or \(\frac{1}{6}\), of the trail.'
    wrapUp: 'A fraction is always a fraction **of** something. "Three-fourths of what is left" is a smaller amount than three-fourths of the whole trail.'

  - id: d2
    level: 3
    thinking: why
    covers: [U1.1, U1.3, K1.5]
    type: mc
    prompt: 'Is this claim always true, sometimes true or never true? "When you multiply a natural number by a fraction, the answer is smaller than the natural number."'
    choices: [Always true, Sometimes true, Never true]
    fixedOrder: true
    answer: 1
    feedback:
      '0': 'Try \(8 \times \frac{3}{2}\). Is the answer smaller than 8?'
      '2': 'Try \(8 \times \frac{1}{2}\). Is the answer smaller than 8?'
    hints:
      - Test a fraction less than 1, one equal to 1 and one more than 1.
    solution:
      - '\(8 \times \frac{1}{2} = 4\), which is smaller than 8.'
      - '\(8 \times \frac{2}{2} = 8\), the same. \(8 \times \frac{3}{2} = 12\), which is bigger.'
      - 'So it is **sometimes** true: only when the fraction is less than 1.'
