id: climate-change-effects
grade: 6
subject: science
organizingIdea: SCI-OI3
outcomes: [SCI6-OI3-GQ1-LO1]
order: 7
title: Effects of Climate Change
shortTitle: Effects of climate change
summary: >-
  Watch melting land ice raise the sea, explore how climate change affects farms, forests and northern
  communities, and compare theories about the dinosaurs.

bigIdea: |-
  - Climate change can affect **weather**, **animal migrations**, **water resources** and how often **forest fires** happen.
  - Farmers adjust what they plant, when they harvest, how they water and how they manage pests.
  - First Nations, Métis and Inuit ways of living off the land are affected, from **rising seas** to **changing migrations**.
  - Climate change in the past may help explain why the **dinosaurs** died out.

lesson:
  - title: 'Virtual experiment: when land ice melts'
    blocks:
      - type: experiment
        covers: [K2.3, K2.1, S2.1, U2.1]
        title: Watch a coastal town over the decades
        question: |-
          - A town sits on a gentle shore. Ice covers the hill behind it.
          - The climate warms for many years.
        animation: g6-sea-rise
        predict:
          choices:
            - The sea rises and the beach gets smaller.
            - The sea drops and the beach gets bigger.
            - The sea stays the same, because the ice is on land.
          answer: 0
        observe: |-
          - The ice on the hill **melted** and the water ran into the ocean.
          - The **sea level rose** above the dashed line, and the beach got smaller.
          - Waves reached the **houses** on the shore.
        explain: |-
          - Melted land ice adds water to the ocean, so the sea level rises. Ocean water also expands as it warms.
          - Rising seas cover beaches and wear away the shore, putting coastal homes and land at risk.

  - title: Effects on land, plants, people and animals
    blocks:
      - type: table
        covers: [K2.1, S2.1, U2.1]
        headers: [Climate change can affect…, For example]
        rows:
          - ['⛈️ **Weather and extreme weather**', 'Heavier storms in some places and longer droughts in others.']
          - ['🦆 **Migration patterns**', 'Birds may arrive in spring earlier or later than they used to.']
          - ['💧 **Water resources**', 'Smaller mountain glaciers send less water into Alberta’s rivers in late summer.']
          - ['🔥 **Frequency of forest fires**', 'Hotter, drier summers dry out forests, so fires can happen more often.']
      - type: callout
        variant: remember
        covers: [SCI3-OI3-GQ1-LO1#K2.3]
        title: Remember from Grade 3
        body: Melting glacier ice creates runoff that forms and keeps up many of Alberta’s major rivers.

  - title: Farming in a changing climate
    blocks:
      - type: table
        covers: [K2.2, S2.2]
        headers: [Farm practice, How climate change can affect it]
        rows:
          - ['🌱 **Crop selection**', 'A longer, warmer season may let farmers try crops that need more time to grow.']
          - ['🌾 **Crop production**', 'A drought or a hailstorm can shrink a harvest.']
          - ['📅 **Harvesting periods and yields**', 'Harvest may come earlier or later, and the amount grown may change.']
          - ['🚿 **Irrigation**', 'Drier summers mean more watering, from rivers that may carry less water.']
          - ['🐛 **Pest management**', 'Milder winters let more insects survive, so farmers may need to protect crops more.']
      - type: callout
        variant: remember
        covers: [SCI5-OI3-GQ1-LO1#K4.1]
        title: Remember from Grade 5
        body: Climate and weather events affect crop type, crop production, animal populations, soil quality and water access.

  - title: Traditional ways of living off the land
    blocks:
      - type: compare
        covers: [K2.3, S2.3, S2.4]
        columns:
          - title: Rising sea levels in coastal areas
            body: |-
              - **Tuktoyaktuk**, an Inuvialuit community on the Arctic coast in the Northwest Territories, is losing shoreline to erosion.
              - Rising seas, stronger storms and thawing frozen ground wear the land away. Some houses have been moved inland.
          - title: Access to hunting, harvesting and fishing
            body: |-
              - In **Nain**, Nunatsiavut, Inuit travel over sea ice to hunt and fish.
              - Thinner, less predictable ice makes some routes unsafe, so travel takes more care.
      - type: table
        covers: [K2.3, S2.4, U2.1]
        headers: [Change, Effect on living off the land]
        rows:
          - ['**Changing migration patterns**', 'Animals that hunters rely on may come at different times or by different routes.']
          - ['**Changing ice and weather**', 'Knowledge passed down about when and where it is safe to travel may no longer match conditions.']

  - title: What ended the dinosaurs?
    blocks:
      - type: compare
        covers: [K2.4, S2.5]
        columns:
          - title: ☄️ Meteoric event
            body: About 66 million years ago, a giant object from space hit what is now Mexico. Its dust and smoke could have blocked sunlight.
          - title: 🌋 Volcanic activity
            body: Around the same time, huge volcanic eruptions in what is now India poured out lava and gases for thousands of years.
          - title: 🌡️ Worldwide climate change
            body: Both events could have changed the climate around the world faster than many animals could survive.
      - type: callout
        variant: tip
        covers: [S2.5, K2.4]
        title: Comparing theories
        body: Many scientists think the impact was the main cause, and some think the volcanoes played a part. New evidence keeps the comparison going.

keyTerms:
  - term: Sea level
    covers: [K2.3]
    definition: The height of the ocean’s surface. It rises when melted land ice flows into the sea.
  - term: Migration
    covers: [K2.1]
    definition: When animals travel from one place to another, often with the seasons.
  - term: Irrigation
    covers: [K2.2]
    definition: Watering crops with water brought from rivers, lakes or wells.
  - term: Pest management
    covers: [K2.2]
    definition: Protecting crops from insects and other pests.
  - term: Extinction
    covers: [K2.4]
    definition: When a kind of living thing dies out completely, like the dinosaurs.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K2.1]
    type: multi
    prompt: Select **all** the things the lesson says climate change can affect.
    choices:
      - How often forest fires happen
      - When and where animals migrate
      - How much water rivers carry
      - The number of days in a year
      - How far Earth is from the Moon
    answer: [0, 1, 2]
    feedback:
      '3': A year is one trip around the Sun. Does climate change that?
      '4': Climate is about weather patterns on Earth. Does it move the Moon?
    hints:
      - Climate change is about long-term weather. Which of these depend on weather?
    solution:
      - Forest fires, migrations and water resources all depend on temperature and precipitation, so climate change can affect them.
      - The length of a year and the distance to the Moon don’t depend on Earth’s climate.

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.2, S2.2]
    type: mc
    prompt: A farmer near Lethbridge starts growing a crop that needs a longer, warmer summer than her old crop. Which practice is she changing?
    choices: [Crop selection, Irrigation, Pest management, Harvesting period]
    answer: 0
    feedback:
      '1': Irrigation is about watering. Is she changing how she waters?
      '2': Is she dealing with insects?
      '3': Her harvest time may change too, but what did she actually decide?
    hints:
      - What did she choose differently?
    solution:
      - She chose a different crop to grow. That is **crop selection**.

  - id: w3
    level: 1
    thinking: recall
    covers: [K2.4, S2.5]
    type: multi
    prompt: Select **all** the theories scientists have about why the dinosaurs died out.
    choices:
      - A catastrophic meteoric event
      - Volcanic activity
      - Worldwide climate change
      - Early humans hunted them all
    answer: [0, 1, 2]
    feedback:
      '3': The dinosaurs died out about 66 million years ago. Were there humans then?
    hints:
      - Three of these are in the lesson. One is a common myth.
    solution:
      - The three theories are a meteoric event, volcanic activity and worldwide climate change.
      - Humans appeared tens of millions of years after the dinosaurs were gone.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K2.1, S2.1, K2.2]
    type: mc
    prompt: |-
      The Bow River starts at glaciers in the Rockies. Farmers downstream use its water for irrigation. If the
      glaciers keep shrinking, what could happen in late summer, many years from now?
    choices:
      - Less meltwater reaches the river, so there may be less water for crops.
      - More meltwater reaches the river forever, so farms get extra water.
      - Nothing changes, because rain is the only thing that fills rivers.
      - The river freezes in summer, because the glaciers are melting.
    answer: 0
    feedback:
      '1': Melting glaciers do add water for a while. But what happens when there is less glacier left?
      '2': Remember from Grade 3. What helps keep many of Alberta’s rivers flowing?
      '3': Melting means warming. Would that freeze a river?
    hints:
      - Where does the river’s water come from in late summer, after the snow is gone?
    solution:
      - In late summer, much of the Bow’s water comes from melting glaciers.
      - Smaller glaciers mean less meltwater over time, so there may be less water for irrigation. That links water resources and farming.

  - id: b2
    level: 2
    thinking: perspective
    covers: [K2.3, S2.4, S2.3]
    type: mc
    prompt: |-
      An Elder in Nain, Nunatsiavut, has travelled the same sea-ice route to fishing spots for many winters. Lately the
      ice forms later and is thinner in places. What is the biggest effect on this way of living off the land?
    choices:
      - The old route may no longer be safe, so reaching fishing spots is harder.
      - Thinner ice means fishing holes are easier to cut, so fishing improves.
      - The fish move onto the ice, so nobody needs to travel anymore.
      - Nothing changes, because the route has been used for many years.
    answer: 0
    feedback:
      '1': Cutting a hole may be easier, but what about travelling to the spot?
      '2': Fish live in the water under the ice. What has changed is the ice itself.
      '3': A route being old doesn’t keep the ice the same. What did the story say changed?
    hints:
      - The ice is the road. What happens if the road gets weaker?
    solution:
      - The sea ice is how people reach hunting and fishing spots. Thinner, later ice can make a trusted route unsafe.
      - That affects **access to hunting, harvesting and fishing**, one of the effects named in the lesson.

  - id: b3
    level: 2
    thinking: evidence
    covers: [S2.5, K2.4]
    type: mc
    prompt: |-
      Scientists found a thin layer of a metal called **iridium** in rocks from 66 million years ago, all around
      the world. Iridium is rare on Earth but common in objects from space. Which theory does this clue support most?
    choices:
      - A catastrophic meteoric event
      - Volcanic activity in India
      - Worldwide cooling from the Sun
      - Early humans hunting dinosaurs
    answer: 0
    feedback:
      '1': The clue says where iridium is common. Is that inside volcanoes?
      '2': Is there anything in the clue about the Sun?
      '3': Were there humans 66 million years ago?
    hints:
      - Where is iridium common, according to the clue?
    solution:
      - Iridium is common in objects from space. A layer of it all over the world fits a huge object hitting Earth and spreading its dust.
      - One clue supports a theory. It doesn’t rule out the others, which is why scientists keep comparing them.

  - id: b4
    level: 2
    thinking: whatif
    covers: [K2.2, S2.2]
    type: mc
    prompt: A string of very mild prairie winters means fewer insects die over the cold months. What might farmers need to change?
    choices:
      - Pest management, because more insects may attack the crops in spring.
      - Irrigation, because the insects drink the water.
      - Crop selection, because insects only eat one kind of plant.
      - Nothing, because insects can’t live through any winter.
    answer: 0
    feedback:
      '1': Do insects use up the river water farmers rely on?
      '2': Many insects eat several kinds of plants. What is the most direct change?
      '3': The story says fewer insects die. So do some survive?
    hints:
      - What does a cold winter usually do to insects?
    solution:
      - Cold winters kill many insects. Milder winters let more survive to spring.
      - More pests means farmers may need to protect crops more, which is **pest management**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.1, K2.2, S2.1, S2.2, U2.1]
    type: investigation
    prompt: |-
      Imagine a prairie region where, over many years, summers become **longer, hotter and drier**. Follow one change
      to the next.
    parts:
      - type: mc
        prompt: Hotter, drier summers dry out the grass and nearby forests. What could happen more often?
        choices: [Wildfires, Blizzards, Floods from snowmelt]
        answer: 0
        feedback:
          '1': Blizzards need snow and cold. What do dry summers make easier?
          '2': Would a drier summer cause more flooding?
        hints:
          - What burns easily, dry grass or wet grass?
        solution:
          - Dry grass and trees burn easily, so **forest and grass fires** can happen more often.
      - type: mc
        prompt: Crops need more water in the dry heat. Which farm practice grows in importance?
        choices: [Irrigation, Pest management, Harvest timing]
        answer: 0
        feedback:
          '1': Pests matter too, but which practice brings water to crops?
          '2': Harvest timing may change, but which practice supplies water?
        hints:
          - How do farmers get water to crops when it doesn’t rain enough?
        solution:
          - Farmers bring water to crops from rivers or wells. That is **irrigation**.
      - type: text
        prompt: More irrigation takes more water from rivers. Name the effect of climate change from the lesson that this connects to.
        accept: [water resources, water, less water, water supply, rivers, water resource]
        hints:
          - Look at the first table in the lesson. Which row is about rivers?
        solution:
          - It connects to **water resources**. More farms need river water just as warmer weather may leave less of it.
    wrapUp: Climate change effects are linked. A drier climate can mean more fires, more watering and more pressure on rivers, all at once.

  - id: d2
    level: 3
    thinking: flaw
    covers: [U2.1, K2.1, S2.1]
    type: mc
    prompt: |-
      After a freezing week in January, Sam says, “It was −35 °C in Edmonton last week. That proves climate change
      isn’t happening.” What is the flaw in Sam’s thinking?
    choices:
      - One cold week is weather. Climate change shows up in patterns over many years.
      - Climate change only happens in summer, so a winter week can’t tell you anything.
      - Climate change makes every single day warmer, so one cold day proves Sam is right.
      - Edmonton is too far north to be affected by climate change.
    answer: 0
    feedback:
      '1': Climate change affects every season. What is the real problem with using one week?
      '2': If that were true, a single cold day would disprove it. Is climate about single days?
      '3': The lesson showed effects all over Canada, including in the Arctic. Does distance from the equator protect a place?
    hints:
      - Remember from Grade 5. What is the difference between weather and climate?
      - How long a time does climate describe?
    solution:
      - Weather is short-term. **Climate** is the pattern over at least 30 years.
      - A warming climate still has cold weeks. To see climate change, scientists compare many years of measurements, not one week.
      - Sam’s idea feels right because the cold was real. But one week is too short to show a climate pattern.
