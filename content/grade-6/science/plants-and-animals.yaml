id: plants-and-animals
grade: 6
subject: science
organizingIdea: SCI-OI4
outcomes: [SCI6-OI4-GQ1-LO1]
order: 11
title: How Plants and Animals Rely on Each Other
shortTitle: Plants and animals rely on each other
summary: >-
  Seal a snail and a water plant in jars to watch them trade gases, explore the many roles plants play, and
  learn about plants sacred to First Nations and Métis.

bigIdea: |-
  - Plants play many roles in an ecosystem: they **photosynthesize**, **clean water**, **hold soil** and give animals **food and shelter**.
  - Humans and other animals depend on plants for the **oxygen** they use in respiration.
  - Plants benefit from the **carbon dioxide** animals, including humans, give off.
  - Sage, sweetgrass, cedar and tobacco are **sacred** to many First Nations and Métis.

lesson:
  - title: 'Virtual experiment: three sealed jars'
    blocks:
      - type: experiment
        covers: [K3.2, K3.4, U3.1, S3.1]
        title: A snail, a plant, or both, sealed in the light
        question: |-
          - Three jars of pond water are sealed and left in the light for a day.
          - One holds a snail, one holds a water plant, and one holds both. The bars show the gases in each jar.
        animation: g6-sealed-jars
        predict:
          choices:
            - The jar with both keeps its gases most balanced.
            - The snail jar keeps its gases most balanced.
            - The plant jar keeps its gases most balanced.
            - All three stay exactly the same.
          answer: 0
        observe: |-
          - **Snail jar:** oxygen went **down** and carbon dioxide went **up**.
          - **Plant jar:** oxygen went **up** and carbon dioxide went **down**.
          - **Snail and plant:** the gases stayed **about the same**.
        explain: |-
          - The snail uses oxygen for respiration and gives off carbon dioxide.
          - In the light, the plant uses carbon dioxide for photosynthesis and releases oxygen.
          - Together, each one supplies what the other needs.

  - title: The roles plants play
    blocks:
      - type: table
        covers: [K3.1, U3.1]
        headers: [Role, Example]
        rows:
          - ['☀️ **Photosynthesizing**', 'Making the sugar and oxygen that feed the ecosystem.']
          - ['💧 **Cleaning and filtering water**', 'Cattails and sedges in a wetland trap mud and take up some pollution as water flows through.']
          - ['🪨 **Reducing soil erosion**', 'Roots hold soil in place, so rain and wind don’t wash or blow it away.']
          - ['🏠 **Food and shelter for animals**', 'Moose browse willows, and birds nest in spruce trees.']
      - type: callout
        variant: remember
        covers: [SCI3-OI4-GQ1-LO1#S4.3]
        title: Remember from Grade 3
        body: Plants depend on animals, and animals depend on plants. The connections go both ways.

  - title: How humans rely on plants
    blocks:
      - type: table
        covers: [K3.2, K3.3]
        headers: [Need, Plants that help]
        rows:
          - ['🫁 **Oxygen** for respiration', 'Every plant that photosynthesizes']
          - ['🥖 **Food**', 'Wheat, canola, potatoes, berries']
          - ['👕 **Clothing**', 'Cotton, and linen made from flax']
          - ['📄 **Paper**', 'Wood from trees']
          - ['🏡 **Building materials**', 'Lumber from spruce and pine']
          - ['💊 **Medicine**', 'Some medicines first came from plants. Willow bark led to the discovery of aspirin.']
          - ['🔥 **Fuel**', 'Firewood, and biofuel made from crops']

  - title: How animals help plants
    blocks:
      - type: compare
        covers: [K3.4, S3.1, U3.1]
        columns:
          - title: Carbon dioxide
            body: Animals, including humans, give off **carbon dioxide** when they breathe out. Plants need it to photosynthesize and survive.
          - title: Other help
            body: Bees carry pollen between canola flowers so seeds can form. Birds eat berries and drop the seeds far away.
      - type: callout
        variant: mistake
        covers: [K3.4, K3.2]
        title: Watch out for this
        body: Plants need oxygen for respiration too. In the light, they make more oxygen than they use, so they release the extra.

  - title: Plants that are sacred
    blocks:
      - type: compare
        covers: [K3.5, S3.2]
        columns:
          - title: 🌿 Sage
            body: Used in ceremony, including smudging, to cleanse.
          - title: 🌾 Sweetgrass
            body: Braided and used in ceremony and prayer.
          - title: 🌲 Cedar
            body: Used in ceremony and for protection.
          - title: 🍂 Tobacco
            body: Offered first, before the other medicines.
      - type: text
        covers: [K3.5, S3.2]
        body: |-
          - Many First Nations, including Anishinaabe peoples, call these the **four sacred medicines**. They are also sacred to many Métis.
          - Teachings differ from Nation to Nation. Local Elders and Knowledge Keepers share the fuller teachings.
      - type: table
        covers: [K3.6, S3.2]
        caption: What offering tobacco signifies
        headers: [Meaning, What it shows]
        rows:
          - ['⚖️ **Balance and harmony**', 'Living in balance with the land and everything on it.']
          - ['🎁 **Giving back to the land**', 'Giving something before taking something.']
          - ['🙏 **Respect for the plant**', 'Asking and thanking, for example before harvesting sage.']
          - ['🔄 **A sustainable relationship**', 'Taking care so the plants keep growing for future generations.']
      - type: callout
        variant: tip
        covers: [K3.5, K3.6]
        title: Two kinds of tobacco
        body: Tobacco used in ceremony and offerings is sacred. It is different from tobacco in cigarettes, which harms people’s health.

keyTerms:
  - term: Soil erosion
    covers: [K3.1]
    definition: When wind or water carries soil away. Plant roots help hold soil in place.
  - term: Respiration
    covers: [K3.2]
    definition: The process plants and animals use oxygen for. It gives off carbon dioxide.
  - term: Sacred
    covers: [K3.5]
    definition: Deeply respected and important in spiritual life.
  - term: Offering
    covers: [K3.6]
    definition: Something given to show respect and thanks.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K3.4]
    type: mc
    prompt: Which gas do animals, including you, give off that plants need to survive?
    choices: [Carbon dioxide, Oxygen, Water vapour from rain, Steam]
    answer: 0
    feedback:
      '1': Animals use oxygen. Which gas do they breathe out?
      '2': Rain isn’t something animals give off. What do you breathe out?
      '3': Steam is water as a gas from boiling. What do animals breathe out?
    hints:
      - What gas do you breathe out? Which ingredient of photosynthesis is it?
    solution:
      - Animals give off **carbon dioxide**, and plants use it for photosynthesis.

  - id: w2
    level: 1
    thinking: apply
    covers: [K3.3]
    type: multi
    prompt: Select **all** the ways **you** might rely on plants before lunch today.
    choices:
      - A cotton T-shirt
      - Toast made from wheat
      - A paper notebook
      - A metal spoon
      - A plastic water bottle
    answer: [0, 1, 2]
    feedback:
      '3': Metal is mined from rocks. Is it made from a plant?
      '4': Plastic is usually made from oil. Is that a plant you can grow?
    hints:
      - For each thing, ask what it is made from.
    solution:
      - Cotton is clothing, wheat is food and paper comes from trees.
      - Metal comes from rocks, and plastic is usually made from oil.

  - id: w3
    level: 1
    thinking: notice
    covers: [K3.1]
    type: mc
    prompt: A farmer leaves a strip of grass and shrubs along a creek. When heavy rain comes, the creek’s banks stay put. Which role are the plants playing?
    choices:
      - Reducing soil erosion
      - Providing shelter for animals
      - Photosynthesizing
      - Making medicine
    answer: 0
    feedback:
      '1': They may shelter animals too, but what kept the banks from washing away?
      '2': They do photosynthesize, but which role protects the creek banks?
      '3': Is anything in the story about medicine?
    hints:
      - What would happen to bare soil in heavy rain?
    solution:
      - Roots hold the soil in place, so the rain doesn’t wash the banks away. That is **reducing soil erosion**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K3.1, U3.1]
    type: mc
    prompt: |-
      A town fills in the wetland where a stream flows in, so the stream now runs straight into a lake. A year later,
      the lake water is muddier. What best explains this?
    choices:
      - Wetland plants used to trap mud and filter the water before it reached the lake.
      - Wetland plants used to make the mud, so the lake should be cleaner now.
      - Lakes always get muddier over time, so the wetland didn’t matter.
      - The wetland plants were using up all the lake’s water.
    answer: 0
    feedback:
      '1': If the plants made the mud, would the lake be muddier now that they are gone?
      '2': It changed after the wetland was filled. What job did the wetland plants do?
      '3': Is the problem too little water, or dirtier water?
    hints:
      - What did the wetland do to water flowing through it?
    solution:
      - Wetland plants **clean and filter water**, trapping mud as it flows through.
      - Without them, the mud flows straight into the lake.

  - id: b2
    level: 2
    thinking: evidence
    covers: [K3.2, K3.4, S3.1]
    type: mc
    prompt: |-
      A class repeats the jar experiment and measures oxygen in the morning and at night, after a day in the light.

      | Jar | Morning | Night |
      |---|---|---|
      | A | 8 units | 5 units |
      | B | 8 units | 11 units |
      | C | 8 units | 8 units |

      Which jar holds **only a plant**?
    choices: [Jar B, Jar A, Jar C]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Oxygen went down in Jar A. What uses oxygen without making any?
      '2': Oxygen stayed the same in Jar C. Which jar had something using oxygen and something making it?
    hints:
      - In the light, a plant alone releases oxygen. Which jar gained oxygen?
    solution:
      - In Jar B, oxygen went **up**. A plant in the light releases oxygen, so Jar B holds only a plant.
      - Jar A lost oxygen, so it holds only the snail. Jar C stayed balanced, so it holds both.

  - id: b3
    level: 2
    thinking: perspective
    covers: [K3.6, S3.2]
    type: mc
    prompt: Before picking sage, a Cree Knowledge Keeper places an offering of tobacco on the ground. What does the offering show?
    choices:
      - Respect for the plant and giving back to the land before taking from it
      - Payment, because sage must be bought from the landowner
      - A way to make the sage grow back faster, like fertilizer
      - A way to mark which plants have already been picked
    answer: 0
    feedback:
      '1': The offering is to the land and the plant. Is it about money?
      '2': It is about the relationship with the plant, not feeding the soil. What does it signify?
      '3': Look at the meanings table. Is marking plants one of them?
    hints:
      - Look at the table of what offering tobacco signifies.
    solution:
      - Offering tobacco shows **respect for the plant**, **giving back to the land**, **balance and harmony**, and a **sustainable relationship**.

  - id: b4
    level: 2
    thinking: whatif
    covers: [K3.1, K3.2, K3.3, U3.1]
    type: multi
    prompt: Imagine every plant in a meadow disappeared. Select **all** the things that would follow.
    choices:
      - Rabbits that eat the grass would lose their food.
      - Rain could wash away more of the soil.
      - Birds that nest in the shrubs would lose their shelter.
      - Snow would stop falling on the meadow.
    answer: [0, 1, 2]
    feedback:
      '3': Snow comes from clouds. Does it depend on plants in a meadow?
    hints:
      - Go through the roles plants play, one at a time.
    solution:
      - Plants give food and shelter, and their roots reduce soil erosion. All three would be lost.
      - Snow comes from the weather, not from the plants.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: whatif
    covers: [K3.2, K3.4, U3.1, S3.1]
    type: investigation
    prompt: |-
      Sami’s sealed jar holds a snail and a water plant. In the light, the oxygen and carbon dioxide stayed balanced
      for a week. Then Sami moves the jar into a dark closet.
    parts:
      - type: mc
        prompt: In the dark, can the plant photosynthesize?
        choices:
          - No, because photosynthesis needs light.
          - Yes, because it still has water and carbon dioxide.
          - Yes, but only at night.
        answer: 0
        feedback:
          '1': It has two of the three things it needs. Which one is missing?
          '2': Is a closet different from night? What is missing in both?
        hints:
          - What three things does photosynthesis use?
        solution:
          - Photosynthesis uses light, water and carbon dioxide. In the dark, there is no light, so it stops.
      - type: mc
        prompt: What happens to the **oxygen** in the jar over the next few days?
        choices:
          - It goes down, because the snail and the plant both use it and nothing makes more.
          - It goes up, because the plant keeps releasing oxygen.
          - It stays the same, because the jar is sealed.
        answer: 0
        feedback:
          '1': The plant needs light to release oxygen. Does it have any?
          '2': Sealed means no gas gets in or out. But is any oxygen being used up inside?
        hints:
          - Who uses oxygen for respiration? Remember that plants do too.
        solution:
          - The snail and the plant both use oxygen for respiration. In the dark, nothing makes more, so it goes **down**.
      - type: text
        prompt: What should Sami do to bring the jar back into balance?
        accept: [put it back in the light, move it back to the light, light, put it in the light, give it light, move it to the light, back in the light]
        hints:
          - What is missing in the closet?
        solution:
          - Put the jar back **in the light**. The plant photosynthesizes again, and oxygen and carbon dioxide balance out.
    wrapUp: The snail and the plant rely on each other, but the plant can only do its part in the light. An ecosystem needs its abiotic parts too.

  - id: d2
    level: 3
    thinking: connect
    covers: [K3.6, S3.2, K3.1]
    type: mc
    prompt: |-
      A family has picked sweetgrass in the same meadow every summer for many years, and there is still plenty. Which
      habit best fits the **sustainable relationship** that a tobacco offering represents?
    choices:
      - They take only what they need and leave plenty so the patch grows back.
      - They pick all the sweetgrass each summer, so none goes to waste.
      - They pick in a new meadow every year, so they never return.
      - They dig up the roots and replant them in their own garden.
    answer: 0
    feedback:
      '1': If they took all of it, would there be plenty left year after year?
      '2': They return to the same meadow every year. What lets them keep doing that?
      '3': Would the meadow still have plenty of sweetgrass then?
    hints:
      - What would let the same meadow keep giving sweetgrass for many years?
    solution:
      - Taking only what is needed and leaving plenty lets the patch keep growing.
      - That is what makes the relationship **sustainable**, for the plants and for future generations.
