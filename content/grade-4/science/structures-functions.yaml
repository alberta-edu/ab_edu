id: structures-functions
grade: 4
subject: science
organizingIdea: SCI-OI4
outcomes: [SCI4-OI4-GQ1-LO1]
order: 8
title: Structures and What They Do
shortTitle: Structures and functions
summary: >-
  Classify Alberta animals, find the jobs of a wild rose's parts, and test which bird beak can reach
  nectar or crack a seed.

bigIdea: |-
  - **Organisms** are living things that respond to the world around them: plants, humans and other animals.
  - **Structures** are body parts and other features. Each one has a **function**, a job.
  - Structures help organisms eat, move, protect themselves, sense and reproduce.
  - Scientists classify organisms by appearance, habitat and structures.

lesson:
  - title: What is an organism?
    blocks:
      - type: compare
        covers: [K1.1]
        columns:
          - title: 🌻 A sunflower
            body: Turns toward the light. It **responds**, so it is an organism.
          - title: 🐕 A dog
            body: Runs to its bowl when it hears food. It **responds**, so it is an organism.
          - title: 🪨 A rock
            body: Does nothing when the light or sound changes. It is **not** a living thing.
      - type: callout
        variant: remember
        covers: ['SCI3-OI4-GQ1-LO1#K3.1']
        title: From Grade 3
        body: Plants and animals use their senses to respond to water, food, temperature and light.

  - title: Sort Alberta’s animals
    blocks:
      - type: visual
        covers: [K1.2, S1.1, U1.1]
        component: card-sort
        props:
          bins:
            - { id: fur, label: Fur, icon: 🦊 }
            - { id: feathers, label: Feathers, icon: 🪶 }
            - { id: scales, label: Scales, icon: 🐍 }
          cards:
            - { text: Bighorn sheep, bin: fur, why: Alberta’s provincial mammal has a thick coat of fur. }
            - { text: Great horned owl, bin: feathers, why: Alberta’s provincial bird is covered in feathers. }
            - { text: Northern pike, bin: scales, why: Fish like the pike are covered in scales. }
            - { text: Red fox, bin: fur, why: Its bushy fur keeps it warm all winter. }
            - { text: Plains garter snake, bin: scales, why: Snakes are covered in dry scales. }
            - { text: Black-capped chickadee, bin: feathers, why: All birds have feathers. }
        caption: This sort uses one **structure**, body covering. You could also sort by **appearance** or **habitat**.

  - title: Plant structures
    blocks:
      - type: figure
        covers: [K1.3, K1.4, S1.3, K1.5]
        figure: >-
          <svg viewBox="0 0 440 300" class="fig-svg" role="img" aria-label="A wild rose plant with labels: flower at the top, leaves, red rose hips (the fruit), thorns on the stem, and roots under the soil.">
