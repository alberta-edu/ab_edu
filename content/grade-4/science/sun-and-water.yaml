id: sun-and-water
grade: 4
subject: science
organizingIdea: SCI-OI3
outcomes: [SCI4-OI3-GQ1-LO1]
order: 6
title: Sunlight and Water for Life
shortTitle: Sunlight and water
summary: >-
  Shine sunlight straight down and at a slant to see why the equator is warmer than the poles, watch a
  thirsty bean plant wilt, and learn why water is honoured as sacred.

bigIdea: |-
  - The Sun warms Earth’s surface. Most living things need its **warmth and energy**.
  - Sunlight is **more direct** at the equator than at the poles, so the equator is warmer.
  - In Alberta, summer sunlight is more direct and the days are longer than in winter.
  - **Water** is a basic need and a home for many living things, so caring for it is everyone’s job.

lesson:
  - title: Warmth and energy from the Sun
    blocks:
      - type: compare
        covers: [K2.1, S2.1, U2.1]
        columns:
          - title: 🌱 Plants
            body: Need **sunlight** to grow. Alberta crops do most of their growing in the long, sunny summer.
          - title: 🐍 Garter snakes
            body: Lie on warm rocks in the Sun. They need that **warmth** before they can move quickly.
          - title: 🐝 Bees
            body: Fly and gather food on warm, sunny days. On cold days they stay in the hive.
      - type: callout
        variant: tip
        covers: [U2.1]
        title: Earth’s heater
        body: The Sun warms Earth’s surface. Without that warmth, Earth would be too cold for life.

  - title: 'Virtual experiment: straight or slanted'
    blocks:
      - type: experiment
        covers: [K2.2, K2.3, U2.1]
        title: Shine the same sunlight straight down and at a slant
        question: |-
          The same amount of sunlight reaches the ground in two places:

          - at the **equator**, it comes **straight down**
          - near a **pole**, it comes in **at a slant**

          A thermometer sits in each patch of sunlight.
        animation: g4-sun-angle
        predict:
          choices:
            - The thermometer at the equator warms more.
            - The thermometer near the pole warms more.
            - They warm the same, because it is the same sunlight.
          answer: 0
        observe: |-
          - Straight down, the light landed on a **small, bright** patch. That thermometer rose high.
          - At a slant, the same light spread over a **bigger, dimmer** patch. That thermometer rose much less.
        explain: |-
          - Sunlight is **more direct** at the equator than at the poles.
          - Direct light packs its warmth into less ground, so the ground warms more.
          - That is why, year after year, the equator is **warmer** than the poles.
      # Singapore: Meteorological Service Singapore, long-term mean about 27.5 °C. Edmonton (Blatchford) and
      # Alert: Environment and Climate Change Canada normals (Alert -18.0 °C, 1971-2000, via Statistics Canada).
      - type: table
        covers: [K2.3]
        caption: Average temperature over a whole year
        headers: [Place, Where, Average for the year]
        rows:
          - ['Singapore', 'Close to the equator', 'About 28 °C']
          - ['Edmonton, Alberta', 'Halfway between', 'About 4 °C']
          - ['Alert, Nunavut', 'Close to the North Pole', 'About −18 °C']

  - title: Summer and winter in Alberta
    blocks:
      - type: figure
        covers: [K2.4]
        figure: >-
          <svg viewBox="0 0 440 220" class="fig-svg" role="img" aria-label="The Sun’s path across the sky in Edmonton. In June the path is a high, long arc and the noon Sun is high. In December the path is a low, short arc and the noon Sun is low.">
          <rect class="sci-ground" x="0" y="170" width="440" height="50"/>
          <path d="M40,170 Q220,-70 400,170" style="fill:none;stroke:#f2b01e;stroke-width:4;stroke-dasharray:8 6"/>
          <path d="M130,170 Q220,110 310,170" style="fill:none;stroke:#7fb2e5;stroke-width:4;stroke-dasharray:8 6"/>
          <circle cx="220" cy="51" r="16" style="fill:#ffcf3d;stroke:#e0a400;stroke-width:2"/>
          <circle cx="220" cy="140" r="12" style="fill:#ffcf3d;stroke:#e0a400;stroke-width:2"/>
          <text class="fig-label" x="246" y="50">June: high Sun</text><text class="fig-label" x="246" y="136">December: low Sun</text>
          <text class="fig-small" x="220" y="196" text-anchor="middle">Edmonton, at noon</text>
          </svg>
        caption: The Sun’s path across the sky in Edmonton. The June path is high and long. The December path is low and short.
      - type: compare
        covers: [K2.4]
        columns:
          - title: ☀️ Summer
            body: |-
              - Sunlight is **more direct**, so it warms more.
              - About **17 hours** of daylight in Edmonton in late June.
          - title: ❄️ Winter
            body: |-
              - Sunlight comes in **at a slant**, so it warms less.
              - About **7 hours** of daylight in Edmonton in late December.

  - title: Water for life
    blocks:
      - type: experiment
        covers: [K3.1, S3.1]
        title: Water one bean plant, but not the other
        question: |-
          Two bean plants sit in the same sunny window. One is **watered every day**. The other gets **no water**.

          What will they look like after ten days?
        animation: g4-thirsty-plant
        predict:
          choices:
            - The plant with no water droops and turns yellow.
            - Both stay healthy, because both get sunlight.
            - The plant with no water grows taller.
          answer: 0
        observe: |-
          - The watered plant stood **tall**, with green leaves.
          - The plant with no water **drooped**, and its leaves turned yellow and brown.
        explain: |-
          - Water is a **basic need** for plants. Sunlight alone isn’t enough.
          - Plants take in water through their roots, and it helps keep them upright.
      - type: table
        covers: [S3.1, K3.1, K3.2]
        headers: [Living thing, How it uses water]
        rows:
          - ['🦫 Beaver', 'Builds its home in a pond, and swims to escape danger.']
          - ['🦌 Moose', 'Drinks it, and eats water plants in the summer.']
          - ['🌾 Wheat', 'Takes it in through its roots to grow.']
          - ['🐸 Wood frog', 'Lays its eggs in ponds, where the tadpoles grow.']

  - title: "Life in Alberta's waters"
    blocks:
      - type: visual
        covers: [S3.2, K3.2]
        component: card-sort
        props:
          bins:
            - { id: river, label: River, icon: 🏞️ }
            - { id: lake, label: Lake, icon: 🌊 }
            - { id: wetland, label: Wetland, icon: 🌾 }
          cards:
            - { text: Rainbow trout, bin: river, why: They live in cold mountain rivers like the Bow River. }
            - { text: Common loon, bin: lake, why: Loons dive for fish in deep northern lakes. }
            - { text: Cattails, bin: wetland, why: They grow with their roots in the shallow water of marshes and sloughs. }
            - { text: Northern pike, bin: lake, why: Pike hunt among the weeds of Alberta’s lakes. }
            - { text: Muskrat, bin: wetland, why: Muskrats build homes from cattails in marshes. }
            - { text: Mountain whitefish, bin: river, why: They live in cool rivers that flow from the Rockies. }
        caption: Where would you find each one? Water gives each of them a **habitat**.

  - title: Water is sacred
    blocks:
      - type: compare
        covers: [K3.3, K3.4, K3.5, S3.4]
        columns:
          - title: 💧 Water sustains life
            body: |-
              - First Nations, Métis and Inuit laws of nature honour water as **sacred**, because water gives life.
              - In Plains Cree, water is **nipiy**.
          - title: 🚶‍♀️ The Water Walkers
            body: |-
              - Josephine Mandamin was an Anishinaabe grandmother.
              - Starting in 2003, she walked around the Great Lakes carrying a copper pail of water, to remind people to protect it.
          - title: 🌿 Gifts of life
            body: |-
              - These laws of nature teach that nature gives **gifts of life**, like water, plants and animals.
              - People have a responsibility to live **in harmony** with the land.
      - type: table
        covers: [S3.3, U3.1, K3.4]
        caption: Caring for water is everyone’s job.
        headers: [Respect for water, Looks like]
        rows:
          - ['Keep it clean', 'Pick up litter near creeks, ponds and storm drains.']
          - ['Use only what you need', 'Turn off the tap while you brush your teeth.']
          - ['Protect water homes', 'Stay on the path near wetlands and riverbanks.']

keyTerms:
  - term: Direct sunlight
    covers: [K2.2]
    definition: Sunlight that comes from high in the sky, almost straight down. It warms the ground more.
  - term: Equator
    covers: [K2.2, K2.3]
    definition: The imaginary line around the middle of Earth, halfway between the North and South Poles.
  - term: Basic need
    covers: [K3.1]
    definition: Something a living thing must have to stay alive, like water.
  - term: Habitat
    covers: [K3.2]
    definition: The place where a plant or animal lives and finds what it needs.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K2.2, K2.3]
    type: mc
    prompt: Where is the sunlight **most direct**, and the temperature warmest over a whole year?
    choices: [At the equator, At the North Pole, At the South Pole, The same everywhere]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Near the poles, sunlight comes in at a slant. Does that warm more or less?
      '2': Near the poles, sunlight comes in at a slant. Does that warm more or less?
      '3': In the experiment, did the straight and slanted light warm the ground the same?
    hints:
      - Where does sunlight come almost straight down?
    solution:
      - Sunlight is most direct at the **equator**, so it is warmest there year after year.

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.4]
    type: mc
    prompt: In Alberta, how is a day in **June** different from a day in **December**?
    choices:
      - More direct sunlight and more hours of daylight
      - More direct sunlight but fewer hours of daylight
      - Less direct sunlight and more hours of daylight
      - The same sunlight and the same hours of daylight
    answer: 0
    feedback:
      '1': Think of a June evening in Alberta. Is it still light at bedtime?
      '2': Look at the Sun’s path in June. Is the noon Sun high or low?
      '3': Look at the two paths in the picture. Are they the same?
    hints:
      - Look at the June and December paths of the Sun. Which is higher, and which is longer?
    solution:
      - In June the noon Sun is **high**, so the light is more direct.
      - The June path is also **longer**, so there are more hours of daylight.

  - id: w3
    level: 1
    thinking: apply
    covers: [K3.2, S3.2]
    type: multi
    prompt: Select **every** living thing that makes its home in or near water.
    choices:
      - Beaver
      - Cattail
      - Northern pike
      - Prairie crocus
      - Gopher
    answer: [0, 1, 2]
    feedback:
      '3': The crocus grows on dry, open grassland. Is that a water habitat?
      '4': Gophers dig burrows in dry fields. Is that a water habitat?
    hints:
      - Which ones need a pond, lake, river or wetland to live?
    solution:
      - Beavers live in ponds, cattails grow in wetlands and pike live in lakes. Water is their **habitat**.
      - Prairie crocuses and gophers live on dry land.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K2.1, S2.1, U2.1]
    type: mc
    prompt: On a cold spring morning, a garter snake lies still on a rock. By noon, after hours in the sunshine, it slides away quickly. What changed?
    choices:
      - The Sun warmed the snake, so it could move.
      - The rock pushed the snake along.
      - The snake ate the rock’s energy.
      - Snakes can only move at noon.
    answer: 0
    feedback:
      '1': Rocks don’t push. What did the snake get from lying there all morning?
      '2': The snake didn’t eat anything. What reached it from the sky?
      '3': Snakes move at other times too. What was different by noon?
    hints:
      - What did the morning sunshine give the snake?
    solution:
      - Most living things need **warmth and energy** from the Sun to live and move.
      - A garter snake needs the Sun’s warmth before it can move quickly.

  - id: b2
    level: 2
    thinking: estimate
    covers: [K2.4]
    type: number
    prompt: |-
      In Edmonton, there are about **17 hours** of daylight in late June. In late December, there are about
      **7 hours**. About how many **more** hours of daylight are there in June?
    answer: 10
    verify: 17 - 7
    unit: hours
    hints:
      - Compare the two numbers. How far is it from 7 to 17?
    solution:
      - \(17 - 7 = 10\). There are about **10 more hours** of daylight in June.
      - That is a lot of extra time for plants to soak up sunlight.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K2.2, K2.3]
    type: mc
    prompt: 'Sam says, “The North Pole is cold because it gets less sunlight. The Sun shines on it less.” His sister says the slant of the light matters too. Who is right about the slant?'
    choices:
      - His sister. Slanted light spreads over more ground, so it warms each bit less.
      - Sam. The slant doesn’t matter, only how much light arrives.
      - Neither. The North Pole is cold because it is covered in ice.
    answer: 0
    feedback:
      '1': In the experiment, the same amount of light arrived in both places. Did both warm the same?
      '2': Ice is part of the story, but why is it icy in the first place?
    hints:
      - Remember the two thermometers. The same light arrived at both. Why did one warm less?
    solution:
      - In the experiment, the **same** sunlight reached both places.
      - At a slant, it spread over a **bigger patch**, so each bit of ground warmed less.
      - So the slant matters. Sunlight is **less direct** near the poles.

  - id: b4
    level: 2
    thinking: evidence
    covers: [K3.1, S3.1]
    type: mc
    prompt: |-
      Lena grew two bean plants. She watered plant A every day and plant B once a week.

      | Day | Plant A | Plant B |
      |---|---|---|
      | 1 | 5 cm, green | 5 cm, green |
      | 7 | 9 cm, green | 6 cm, droopy |
      | 14 | 13 cm, green | 6 cm, yellow leaves |

      What does her data show?
    choices:
      - Bean plants need enough water to grow and stay healthy.
      - Plant B needed more sunlight.
      - Watering makes the soil heavier, so plants grow taller.
      - Plant B was just a weaker seed.
    answer: 0
    feedback:
      '1': The story doesn’t say anything changed about the sunlight. What was different?
      '2': Heavy soil doesn’t make plants grow. What does the plant take in?
      '3': Both started the same, 5 cm and green. When did they start to differ?
    hints:
      - What was the only difference between how Lena treated the two plants?
    solution:
      - The plants started the same, and only the **water** was different.
      - Plant B, with little water, stopped growing and turned yellow. Water is a **basic need**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.2, K2.4, U2.1, S2.1]
    type: investigation
    prompt: |-
      Mateo shines a flashlight onto graph paper from the same distance. First he holds it **straight down**, then
      **at a slant**. He counts how many squares the light covers.

      | How he holds it | Squares lit |
      |---|---|
      | Straight down | 8 |
      | At a slant | 16 |
    parts:
      - type: number
        prompt: The light at a slant covers how many **times** as many squares?
        answer: 2
        verify: 16 / 8
        unit: times
        hints:
          - How many groups of 8 make 16?
        solution:
          - \(16 \div 8 = 2\). The slanted light covers **twice** as many squares.
      - type: mc
        prompt: It is the same flashlight both times. So which patch of squares gets **brighter** light?
        choices:
          - The straight-down patch, because the same light is packed into fewer squares.
          - The slanted patch, because it covers more squares.
          - Both get the same, because it is the same flashlight.
        answer: 0
        feedback:
          '1': A bigger patch from the same light. Is each square brighter or dimmer?
          '2': The total light is the same. Is it shared among the same number of squares?
        hints:
          - Imagine sharing one pizza among 8 friends, then among 16 friends. Who gets bigger slices?
        solution:
          - The same light shared over **8** squares is brighter than over **16** squares.
          - Straight-down light is more **direct**, and it warms more.
      - type: mc
        prompt: Which is most like the **slanted** flashlight?
        choices:
          - The noon Sun in Alberta in December
          - The noon Sun in Alberta in June
          - The noon Sun at the equator
        answer: 0
        feedback:
          '1': In June, the noon Sun is high in the sky. Is that straight or slanted?
          '2': At the equator, sunlight is the most direct. Is that straight or slanted?
        hints:
          - When is the noon Sun lowest in Alberta’s sky?
        solution:
          - In December the noon Sun is **low**, so its light comes in at a slant and spreads out.
          - That is part of why Alberta winters are cold.
    wrapUp: The same light warms more when it comes straight down, because it is packed into less ground.

  - id: d2
    level: 3
    thinking: perspective
    covers: [K3.3, K3.4, U3.1, S3.3]
    type: mc
    prompt: 'A class is planning a cleanup of the creek behind the school. Ty says, “It’s not our job. Nobody in our class owns the creek.” Which reply best shows that caring for water is a **shared** responsibility?'
    choices:
      - Everyone uses water and every living thing needs it, so everyone can help protect it.
      - Only the person who owns the land should clean a creek.
      - Only scientists know how to care for water.
      - The creek will clean itself, so no one needs to help.
    answer: 0
    feedback:
      '1': Water flows past many people’s land. Who needs that water downstream?
      '2': Is there anything a Grade 4 class could do to protect a creek?
      '3': Litter and spills don’t wash away safely. Where would they go?
    hints:
      - Who and what depends on the water in that creek?
    solution:
      - Water sustains **all** life, and it flows from place to place.
      - So caring for it is a **shared responsibility**. First Nations, Métis and Inuit laws of nature teach a responsibility to protect water and its sources.
