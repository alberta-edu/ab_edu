id: figurative-vocabulary
grade: 4
subject: english-language-arts
organizingIdea: LANENG-OI3
outcomes: [LANENG4-OI3-GQ1-LO1]
order: 7
title: Personification, Analogies, Idioms and Precise Words
shortTitle: Figurative language & words
summary: >-
  Swap plain words for precise ones, read personification and idioms two ways, build analogies, and
  learn power words and subject words that you can use everywhere.

bigIdea: |-
  - The more words you know, the more clearly you can say exactly what you mean.
  - **Personification**, **analogies** and **idioms** are figurative language. They don’t mean exactly what the words say.
  - Writers choose them to help readers see, feel and understand.

lesson:
  - title: Say it precisely
    blocks:
      - type: visual
        covers: [S1.1, U1.1]
        component: word-shades
        props:
          sets:
            - plain: walked
              sentence: The cat ___ across the kitchen.
              icon: 🐈
              words:
                - { word: tiptoed, move: tiptoe, note: 'Quiet, careful steps. Is the cat sneaking up on something?' }
                - { word: strolled, size: 1, note: 'Slow and relaxed, in no hurry at all.' }
                - { word: raced, move: bounce, note: 'Very fast. Something exciting is happening!' }
            - plain: big
              sentence: A ___ dog jumped onto the couch.
              icon: 🐕
              words:
                - { word: large, size: 1.4, note: 'Bigger than most dogs.' }
                - { word: huge, size: 1.9, note: 'Much bigger than most dogs.' }
                - { word: enormous, size: 2.4, note: 'So big that the couch might not hold it!' }
            - plain: said
              sentence: '“There’s a bear!” Sam ___.'
              icon: 🗣️
              words:
                - { word: whispered, size: 0.7, note: 'Very quietly. Maybe Sam doesn’t want the bear to hear.' }
                - { word: gasped, move: shake, note: 'With a quick, surprised breath.' }
                - { word: shouted, size: 1.6, move: shake, note: 'Loudly, so that everyone hears.' }
        caption: Pick a plain word, then slide. How does each **precise** word change the picture?
      - type: callout
        variant: remember
        covers: ['LANENG3-OI3-GQ1-LO1#K1.2']
        title: Remember from Grade 3
        body: Language has **literal** meanings, what the words say exactly, and **figurative** meanings, what the writer really means.

  - title: Personification and idioms
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.4, S1.8]
        component: figure-lens
        props:
          items:
            - { phrase: The old house groaned in the wind., kind: Personification, picture: 🏠😩, literally: 'A house making a tired, sad sound, like a person with a sore back.', means: 'The house creaked loudly in the wind.', because: 'Houses can’t groan. Giving the house a human action helps you hear the scene.' }
            - { phrase: The sun smiled down on our picnic., kind: Personification, picture: 🌞🧺, literally: 'The sun has a face, and it is smiling at you.', means: 'It was a warm, sunny, happy day for a picnic.', because: 'Only people smile. It makes the sun seem friendly.' }
            - { phrase: It’s raining cats and dogs!, kind: Idiom, picture: 🐈🐕☔, literally: 'Cats and dogs are falling out of the sky.', means: 'It is raining very hard.', because: 'An idiom means something different from its words. You have to learn it, like a new word.' }
            - { phrase: Let’s play a game to break the ice., kind: Idiom, picture: 🧊🔨, literally: 'Someone smashes a block of ice with a hammer.', means: 'Do something to help people who don’t know each other start talking.', because: 'Nobody touches any ice. The whole phrase has its own meaning.' }
            - { phrase: I’m feeling under the weather., kind: Idiom, picture: 🌧️🧍, literally: 'Someone is standing underneath a rain cloud.', means: 'I’m feeling a bit sick.', because: 'The words are about weather, but the idiom is about how you feel.' }
        caption: Read each phrase literally first. Then switch to what it means.
      - type: compare
        covers: [K1.2, K1.4]
        columns:
          - title: 🎭 Personification
            body: An animal or object is given **human** qualities or abilities. *The wind whispered.*
          - title: 🧩 Idiom
            body: A phrase that means something **different** from its words. *That test was a piece of cake.*

  - title: Analogies compare
    blocks:
      - type: compare
        covers: [K1.3, S1.7]
        columns:
          - title: 🧤 A is to B as C is to D
            body: |-
              > A **glove** is to a **hand** as a **sock** is to a **foot**.

              A glove and a sock are mostly different, but both cover a body part to keep it warm.
          - title: 🪺 Explain with an analogy
            body: |-
              > A bird’s nest is like a crib.

              They are made of different things, but both are safe places where babies sleep.
      - type: example
        covers: [S1.7, K1.3]
        title: Build your own analogy
        problem: Help a younger child understand what a beaver dam does.
        steps:
          - '**Think of something familiar** that is mostly different, but has one thing in common.'
          - '**Find what they share:** a beaver dam holds back water. So does the plug in a bathtub.'
          - '**Say it:** “A beaver dam is like the plug in a bathtub. It keeps the water from running away.”'
        answer: The two things are mostly different, but they share one important job.

  - title: Power words and subject words
    blocks:
      - type: table
        covers: [S1.3, S1.4, S1.6]
        caption: Two kinds of words worth collecting
        headers: [Kind of word, What it is, Examples]
        rows:
          - ['**Tier 2** (power words)', 'Useful words you meet in many subjects and books', '*compare, predict, describe, fortunate, enormous*']
          - ['**Tier 3** (subject words)', 'Words that belong to one subject', '*habitat* in science, *denominator* in math, *autobiography* in ELA']
      - type: callout
        variant: tip
        covers: [S1.6, S1.3]
        title: Take your words everywhere
        body: You learned to **predict** in reading. Use it in science, too. “I predict the ice will melt faster in the sun.”

  - title: Keep track of words
    blocks:
      - type: compare
        covers: [S1.2]
        columns:
          - title: 📖 Meaning
            body: '**habitat**: the natural home of an animal or plant'
          - title: 🖼️ Picture
            body: 🐸 A frog sitting on a lily pad in a pond.
          - title: ✏️ Sentence
            body: A pond is a good habitat for frogs.
          - title: 🔗 Related words
            body: home, nest, pond, forest
      - type: callout
        variant: tip
        covers: [S1.5, S1.2]
        title: Record it, then check it
        body: |-
          - Record words in a word map, a word wall or your own word book.
          - Check meaning and spelling in a print or online dictionary, or ask an adult.

keyTerms:
  - term: Personification
    covers: [K1.2]
    definition: Giving an animal or object qualities or abilities that a human can have.
  - term: Analogy
    covers: [K1.3]
    definition: A comparison of two things that are mostly different but have some things in common.
  - term: Idiom
    covers: [K1.4]
    definition: A phrase that means something different from the literal meaning of its words.
  - term: Tier 2 word
    covers: [S1.3]
    definition: A useful word that you can use in many subjects, such as compare or describe.
  - term: Tier 3 word
    covers: [S1.4]
    definition: A word that belongs to one subject, such as habitat in science.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.2, K1.1]
    type: mc
    prompt: Which sentence uses **personification**?
    choices:
      - The hungry fridge hummed a sleepy song all night.
      - The fridge in our kitchen is white and very tall.
      - The fridge is as cold as the North Pole in winter.
      - Our fridge weighs about a thousand tonnes.
    answer: 0
    feedback:
      '1': This describes the fridge exactly as it is. Does the fridge do anything human?
      '2': This compares the fridge with the North Pole, using *as*. That is a simile.
      '3': This is a huge exaggeration. That is hyperbole. Does the fridge do anything a person does?
    hints:
      - Which fridge does something only a person can do?
    solution:
      - A fridge can’t be hungry or sleepy, or sing a song. Giving it these human qualities is **personification**.

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.4, S1.8]
    type: mc
    prompt: |-
      Ravi can’t come to the rink. His mom says:

      > Ravi is feeling a bit **under the weather** today.

      What does she mean?
    choices:
      - Ravi is feeling a little sick.
      - Ravi is standing outside in the rain.
      - Ravi is sad because the weather is bad.
      - Ravi is hiding under a blanket.
    answer: 0
    feedback:
      '1': That is the literal meaning of the words. What does the whole phrase mean?
      '2': The idiom isn’t really about weather. Why can’t Ravi come?
      '3': Read the words exactly as they are. Is a blanket in them?
    hints:
      - Why would someone miss the rink today?
    solution:
      - '*Under the weather* is an **idiom**. It means feeling a bit sick.'
      - The meaning of an idiom is different from the meaning of its words.

  - id: w3
    level: 1
    thinking: apply
    covers: [S1.1]
    type: mc
    prompt: |-
      > “Shh, the baby is sleeping,” Dad **said**.

      Which word is more **precise** than *said*?
    choices:
      - whispered
      - shouted
      - talked
      - told
    answer: 0
    feedback:
      '1': Would Dad shout while the baby sleeps?
      '2': '*Talked* is about as plain as *said*. How is Dad speaking?'
      '3': '*Told* needs someone to tell, and it doesn’t show how he spoke.'
    hints:
      - How would you speak if a baby were sleeping?
    solution:
      - '**Whispered** shows exactly how Dad spoke, quietly, so that the baby stays asleep.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: pattern
    covers: [S1.7, K1.3]
    type: text
    prompt: |-
      Finish the analogy with one word.

      > A **bird** is to a **nest** as a **bee** is to a ___.
    accept: [hive, beehive]
    hints:
      - What is a nest to a bird?
      - Where does a bee live?
    solution:
      - A nest is a bird’s home. So the missing word is the bee’s home, a **hive**.
      - Find how the first pair is linked, then use the same link for the second pair.

  - id: b2
    level: 2
    thinking: notice
    covers: [S1.8, K1.4]
    type: mc
    prompt: |-
      Jada says, “I’ll win the art contest for sure!” Her grandpa smiles.

      > Don’t count your chickens before they hatch.

      Jada’s family doesn’t have any chickens. What does Grandpa mean?
    choices:
      - Don’t be sure of something good before it really happens.
      - Don’t enter the contest, because you might lose.
      - Draw some chickens if you want to win the contest.
      - Count carefully, so that you don’t make a mistake.
    answer: 0
    feedback:
      '1': Does Grandpa tell her not to try? Look at the word *before*.
      '2': That reads the idiom literally. What is it really about?
      '3': Nobody is counting anything here. What is Jada sure of?
    hints:
      - What is Jada sure of? Has the contest happened yet?
    solution:
      - An egg might not hatch, so you can’t count it as a chicken yet.
      - The **idiom** means don’t be sure of a good result before it happens. Jada is sure she’ll win, before the contest.

  - id: b3
    level: 2
    thinking: decide
    covers: [S1.4, S1.1]
    type: mc
    prompt: |-
      Kenji’s science report says:

      > The pond is the place where the frogs live and get food and are safe.

      Which change uses a **subject word** to say this clearly and precisely?
    choices:
      - The pond is the frogs’ habitat.
      - The pond is the frogs’ thing.
      - The pond is a nice spot for frogs.
      - The pond is where frogs hang out.
    answer: 0
    feedback:
      '1': '*Thing* is the least precise word there is. What is the science word?'
      '2': '*Nice spot* is friendly but vague. Which word does a scientist use?'
      '3': '*Hang out* is how you might talk with friends. Which word fits a science report?'
    hints:
      - Which word from science means “the natural home of an animal”?
    solution:
      - '**Habitat** is a tier 3 word, used in science. It means the natural home of an animal or plant, and it says it all in one word.'

  - id: b4
    level: 2
    thinking: flaw
    covers: [S1.5, S1.1]
    type: mc
    prompt: |-
      Ivy wants a stronger word than *good* for her pizza review. She finds **virtuous** in a word list, and writes:

      > This pizza is very virtuous.

      Her friends laugh. *Virtuous* means “behaving in a good and honest way.” What should Ivy have done?
    choices:
      - Checked the meaning in a dictionary to see if it fits the pizza.
      - Used a longer word, because longer words always sound better.
      - Kept *good*, because you should never change a plain word.
      - Asked her friends not to laugh at her new word.
    answer: 0
    feedback:
      '1': '*Virtuous* is already long. Does it fit a pizza?'
      '2': Ivy was right to look for a stronger word. What went wrong?
      '3': They laughed for a reason. Can a pizza be honest?
    hints:
      - Can a pizza behave in an honest way?
    solution:
      - A new word must **fit**. Ivy should confirm the meaning in a dictionary before she uses it.
      - A word like **delicious** or **cheesy** would have fit.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.2, K1.4, S1.8, K1.1]
    type: investigation
    prompt: |-
      > The old truck coughed, groaned, and finally gave up halfway up the hill.
      >
      > “Well,” said Dad, “now we’re in **hot water**.”
    parts:
      - type: multi
        prompt: Which words give the truck **human** qualities?
        choices:
          - coughed
          - groaned
          - gave up
          - halfway
          - hill
        answer: [0, 1, 2]
        feedback:
          '3': '*Halfway* tells where the truck stopped. Is it something a person does?'
          '4': A hill is a place. Does the truck do it like a person?
        hints:
          - Which of these can a person do?
        solution:
          - People cough, groan and give up. Here, the truck does. That is **personification**.
      - type: mc
        prompt: Dad says, “now we’re in **hot water**.” What does he mean?
        choices:
          - We are in trouble.
          - The truck’s engine is boiling.
          - We need to find a hot spring.
          - It’s time for a warm bath.
        answer: 0
        feedback:
          '1': That reads the words literally. Is Dad talking about water at all?
          '2': Is anyone looking for a hot spring? What is their problem?
          '3': That’s the literal meaning. What is their real problem?
        hints:
          - What just happened to the family?
        solution:
          - The truck broke down on a hill. *In hot water* is an **idiom** that means in trouble.
      - type: mc
        prompt: What if the writer had written *The truck stopped.* instead? What would we lose?
        choices:
          - The feeling that the old truck tried hard and was worn out, like a tired person.
          - The fact that the truck stopped partway up the hill.
          - The information about who was driving the truck.
          - Nothing, because *stopped* says the same thing in fewer words.
        answer: 0
        feedback:
          '1': '*The truck stopped* still tells us it stopped. What else did the long version give us?'
          '2': Is the driver named in either version?
          '3': Picture both versions. Which one makes you feel sorry for the truck?
        hints:
          - How does the truck seem in the first version? How about in the second?
        solution:
          - Coughing and groaning make us picture an old truck struggling, like a tired person. *Stopped* gives only the fact.
    wrapUp: Personification and idioms carry feelings and pictures that plain words don’t. To read them, look past the literal words.

  - id: d2
    level: 3
    thinking: why
    covers: [S1.7, K1.3]
    type: mc
    prompt: Nadia wants to help her little brother understand what a seed carries inside it. A seed holds food that the baby plant uses when it starts to grow. Which **analogy** would help him most?
    choices:
      - A seed is like a backpack with a packed lunch, for the baby plant’s trip.
      - A seed is like a rock, because both are small and hard.
      - A seed is like a flower, because both are parts of a plant.
      - A seed is small and round, and it is usually brown.
    answer: 0
    feedback:
      '1': A seed and a rock do share something. But does it help him understand what a seed carries?
      '2': A seed and a flower are both plant parts. An analogy compares things that are mostly different. What does a seed do?
      '3': This describes a seed. Does it compare it with anything?
    hints:
      - What is the one thing you want him to understand? Which comparison shows it?
    solution:
      - A backpack and a seed are mostly different, but both carry food for a trip. That shared job is the point.
      - A good analogy shares the **important** thing, not just any thing.
