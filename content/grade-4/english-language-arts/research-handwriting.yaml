id: research-handwriting
grade: 4
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG4-OI8-GQ1-LO1]
order: 13
title: Research, Citing, Cursive and Keyboarding
shortTitle: Research & writing tools
summary: >-
  Ask a focused research question, choose good sources, take notes, use information fairly and cite it,
  then write in cursive and type with your fingers on the home row.

bigIdea: |-
  - Research starts with a good **question**. Then you find, organize and share what you learn.
  - Using information **ethically** means asking permission, citing your sources, and being fair and accurate.
  - **Cursive** and **keyboarding** are tools that help you write well, and make your work look its best.

lesson:
  - title: Start with a question
    blocks:
      - type: compare
        covers: [K3.1, U3.1]
        columns:
          - title: 🌫️ Too big
            body: '*Owls?* There are hundreds of kinds. Where would you even start?'
          - title: 🎯 Focused
            body: '*What do burrowing owls eat, and where do they nest?* Now you know what to look for.'
      - type: callout
        variant: remember
        covers: ['LANENG3-OI8-GQ1-LO1#K3.1', 'LANENG3-OI8-GQ1-LO1#K3.6']
        title: Remember from Grade 3
        body: Questions help focus your research. The information and ideas of others need to be listed, or **cited**.

  - title: Choose good sources
    blocks:
      - type: visual
        covers: [S3.1, S3.4]
        component: card-sort
        props:
          bins:
            - { id: good, label: Good for this question, icon: ✅ }
            - { id: not, label: Not a good choice, icon: ❌ }
          cards:
            - { text: A library book called *Prairie Birds*, bin: good, why: 'It is about the topic, and a library chose it.' }
            - { text: A government wildlife website about burrowing owls, bin: good, why: 'It is about the exact topic, from a trusted source.' }
            - { text: An interview with a park ranger who studies owls (with permission), bin: good, why: 'People can be great sources too.' }
            - { text: A funny cartoon of an owl wearing glasses, bin: not, why: 'It is made to entertain, not to give facts.' }
            - { text: Your cousin’s guess about what owls eat, bin: not, why: 'A guess isn’t information. Check it in a trusted source.' }
            - { text: A web page about snowy owls in the Arctic, bin: not, why: 'It is about a different owl, so it doesn’t answer your question.' }
        caption: 'Your question: What do burrowing owls eat, and where do they nest? Which sources would help?'

  - title: Organize what you find
    blocks:
      - type: compare
        covers: [K3.2]
        columns:
          - title: 📝 Note taking
            body: |-
              Jot notes in your own words:

              - eat insects, mice
              - nest in old burrows
          - title: 🕸️ Graphic organizer
            body: A web with **burrowing owls** in the middle, and branches for *food*, *home* and *babies*.
          - title: 📋 List
            body: A list of your sources, so you can cite them later.

  - title: Use information fairly
    blocks:
      - type: table
        covers: [K3.4, S3.2, S3.3]
        caption: Ethical use of information
        headers: [Do this, Example]
        rows:
          - ['**Ask permission** to use, share or keep information', 'Ask the park ranger before you record the interview or post her photo.']
          - ['**Cite** where your information came from', '*Source: Prairie Birds, a library book.* Put the source at the end of your report.']
          - ['**Be fair and accurate**', 'Report what the ranger really said. Don’t change her words to make them more exciting.']
      - type: callout
        variant: mistake
        covers: [K3.4, S3.3]
        title: Copying isn’t researching
        body: Put facts in your own words, and cite where they came from. Copying someone’s sentences without saying so isn’t fair to them.

  - title: Share what you found
    blocks:
      - type: compare
        covers: [K3.3, S3.3]
        columns:
          - title: 📄 A report
            body: Paragraphs of information, with headings and a list of sources.
          - title: 🎤 A presentation
            body: A talk, with speaking cards and visual aids.
          - title: 🖼️ A visual representation
            body: A poster, a labelled diagram or a model of a burrow.

  - title: Cursive handwriting
    blocks:
      - type: visual
        covers: [K4.2, S4.2, K4.1, S4.1, U4.1]
        component: handwriting-lab
        props:
          mode: cursive
          word: little
        caption: Watch the word write itself. Then switch on the slant lines, and try **Messy**. What changes?
      - type: callout
        variant: remember
        covers: ['LANENG3-OI8-GQ1-LO1#K4.2']
        title: Remember from Grade 3
        body: Cursive handwriting involves **letter formation, size, proportion and slant**.

  - title: Keyboarding
    blocks:
      - type: visual
        covers: [K4.3, S4.3, K4.1]
        component: handwriting-lab
        props:
          mode: keys
        caption: Each colour is one finger’s keys. Feel for the bumps on F and J to find home without looking.
      - type: callout
        variant: tip
        covers: [K4.3, S4.3, U4.1]
        title: Practice makes it automatic
        body: |-
          - Keep your fingers on the home row.
          - Reach for a key, tap it, and come back home.
          - Look at the screen, not your fingers.

keyTerms:
  - term: Research question
    covers: [K3.1]
    definition: A focused question that guides what you look for when you research.
  - term: Source
    covers: [S3.1, S3.4]
    definition: Where information comes from, such as a book, a website or a person.
  - term: Cite
    covers: [K3.4]
    definition: To say where your information came from.
  - term: Graphic organizer
    covers: [K3.2]
    definition: A chart or web that helps you sort and organize information.
  - term: Slant
    covers: [K4.2]
    definition: The way letters in handwriting lean. In neat cursive, all letters lean the same way.
  - term: Home row
    covers: [K4.3]
    definition: The middle row of a keyboard, where your fingers rest between keystrokes.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K3.1]
    type: mc
    prompt: Which is the best question to **focus** a research project?
    choices:
      - How do beavers build their lodges?
      - Animals?
      - What is everything about Canada?
      - Do you like beavers?
    answer: 0
    feedback:
      '1': There are millions of animals. Where would you start?
      '2': That could fill a library! Is it focused?
      '3': This asks for an opinion. Could research answer it?
    hints:
      - Which question is small enough to answer, and can be answered with facts?
    solution:
      - '*How do beavers build their lodges?* is focused. It tells you exactly what to look for.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K4.2, S4.2]
    type: mc
    figure: |-
      <svg viewBox="0 0 360 120" class="fig-svg" role="img" aria-label="Two rows of tall letter strokes. In sample A, all five strokes lean to the right by the same amount. In sample B, the strokes lean in different directions: some right, some left, one straight up.">
        <text class="fig-label" x="10" y="30">A</text>
        <g stroke="currentColor" stroke-width="4" stroke-linecap="round" class="fig-ink">
          <line x1="40" y1="100" x2="55" y2="40"/><line x1="70" y1="100" x2="85" y2="40"/><line x1="100" y1="100" x2="115" y2="40"/><line x1="130" y1="100" x2="145" y2="40"/><line x1="160" y1="100" x2="175" y2="40"/>
        </g>
        <text class="fig-label" x="200" y="30">B</text>
        <g stroke="currentColor" stroke-width="4" stroke-linecap="round" class="fig-ink">
          <line x1="225" y1="100" x2="245" y2="40"/><line x1="260" y1="100" x2="250" y2="40"/><line x1="285" y1="100" x2="285" y2="40"/><line x1="310" y1="100" x2="330" y2="40"/><line x1="345" y1="100" x2="333" y2="40"/>
        </g>
      </svg>
    prompt: Two students wrote the same tall letters in cursive. Which part of cursive does **sample B** most need to work on?
    choices:
      - Slant
      - Size
      - Keyboarding
      - Citing
    fixedOrder: true
    answer: 0
    feedback:
      '1': Are B’s strokes different heights? Look at which way each one leans.
      '2': Keyboarding is typing. These are handwritten letters.
      '3': Citing is for sources in research. Look at the letters.
    hints:
      - Which way does each stroke lean in A? In B?
    solution:
      - In A, every stroke leans the same way. In B, they lean in different directions.
      - Sample B needs to work on **slant**.

  - id: w3
    level: 1
    thinking: apply
    covers: [K4.3, S4.3]
    type: mc
    prompt: When you are keyboarding, where should your fingers **rest** between keys?
    choices:
      - On the home row, on A S D F and J K L ;
      - On the top row, on Q W E R and U I O P
      - On the space bar, all eight fingers together
      - In your lap, until you find the next key
    answer: 0
    feedback:
      '1': The top row is for reaching up to. Where do your fingers come back to?
      '2': Only your thumbs use the space bar.
      '3': If your hands leave the keyboard, you have to look every time.
    hints:
      - Which row has the little bumps on F and J?
    solution:
      - Fingers rest on the **home row**. They reach for a key, tap it, and come back home.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: decide
    covers: [S3.4, S3.1]
    type: mc
    prompt: Rafi’s question is “Where do burrowing owls nest in Alberta?” Which source should he **choose** first?
    choices:
      - A government wildlife website about burrowing owls in Alberta
      - A cartoon video about a talking owl who goes to school
      - His best friend, who thinks owls live in trees
      - A book about owls in the rainforests of Brazil
    answer: 0
    feedback:
      '1': A cartoon is made to entertain. Will it have true facts about nests?
      '2': His friend is guessing. Is that information?
      '3': It is about owls, but does it fit Rafi’s question?
    hints:
      - Which source is about his exact topic, and trustworthy?
    solution:
      - A government wildlife website is about the **exact** topic and comes from experts. It is an appropriate source.

  - id: b2
    level: 2
    thinking: flaw
    covers: [K3.4, S3.3, S3.2]
    type: mc
    prompt: Mia copies a whole paragraph from a website into her report about beavers. She doesn’t say where it came from. What is wrong?
    choices:
      - She used someone else’s words without citing them, and didn’t put the ideas in her own words.
      - Nothing, because anything on a website is free to use.
      - She should have copied two paragraphs, to make her report longer.
      - Websites are never good sources, so she shouldn’t use any facts from them.
    answer: 0
    feedback:
      '1': Being easy to find doesn’t make it hers. Who wrote it?
      '2': Is a longer copied report a better report?
      '3': Good websites can be great sources. The problem is how she used it.
    hints:
      - Whose words are in her report? Does her reader know?
    solution:
      - Mia should **paraphrase** the facts in her own words and **cite** the website.
      - That is fair to the writer, and it lets readers check her facts.

  - id: b3
    level: 2
    thinking: perspective
    covers: [K3.4, S3.2]
    type: mc
    prompt: For a class web page about community helpers, Leo takes a photo of the school crossing guard. What should he do **before** he posts it?
    choices:
      - Ask the crossing guard if it is OK to share the photo.
      - Post it right away, because the crossing guard works outside.
      - Crop out the guard’s face, then post it without asking.
      - Ask a friend if the photo looks good.
    answer: 0
    feedback:
      '1': Working outside doesn’t mean someone agrees to be online. How would you feel?
      '2': It is still a photo of the guard. Who should decide?
      '3': A friend can’t give permission for someone else.
    hints:
      - Imagine you were the crossing guard. What would you want?
    solution:
      - Ethical use of information includes **asking permission** to share information about someone.

  - id: b4
    level: 2
    thinking: model
    covers: [K3.2, K3.3]
    type: mc
    prompt: Rafi has notes about owls’ **food**, **homes** and **babies**, all mixed up on one page. Which tool would help him organize them best?
    choices:
      - A graphic organizer web, with one branch for each topic
      - One long sentence with every note in it
      - A list of his favourite owl pictures
      - A new page, copying the notes in the same mixed-up order
    answer: 0
    feedback:
      '1': Would one long sentence be easier to sort?
      '2': Pictures are nice, but would they sort his notes?
      '3': Copying them in the same order keeps them mixed up.
    hints:
      - He has three topics. What tool has a place for each?
    solution:
      - A **graphic organizer** gives each topic its own branch. Then each branch can become a paragraph in his report.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K3.1, K3.2, K3.4, S3.3, S3.4]
    type: investigation
    prompt: |-
      Jada is researching chinooks. In a library book called *Alberta Weather*, she reads:

      > A chinook is a warm, dry wind that can melt snow very quickly in winter.
    parts:
      - type: mc
        prompt: Which is the best **jot note** for this sentence?
        choices:
          - chinook = warm, dry wind → melts snow fast
          - A chinook is a warm, dry wind that can melt snow very quickly in winter.
          - weather
          - I like chinooks because I hate the cold
        answer: 0
        feedback:
          '1': This copies every word. Jot notes are short, in your own words.
          '2': One word won’t remind her of the fact.
          '3': This is her opinion, not a note about the information.
        hints:
          - Jot notes are short and in your own words.
        solution:
          - A good jot note keeps the key facts in a few of your own words.
      - type: mc
        prompt: In her report, Jada writes, “Chinooks can melt snow quickly.” What else should she include, to use the information ethically?
        choices:
          - The source, *Alberta Weather*, in her list of sources
          - The exact sentence copied from the book, in bold
          - A made-up number, to make the fact more exciting
          - Nothing, because she put it in her own words
        answer: 0
        feedback:
          '1': She has already put it in her own words. What does a reader still need to know?
          '2': Is a made-up number fair and accurate?
          '3': Her own words are good. But whose information is it?
        hints:
          - Where did the information come from?
        solution:
          - Even in her own words, the information came from the book. She should **cite** it.
    wrapUp: Research is a chain. A focused question leads to good sources, short notes in your own words, and a cited, accurate report.

  - id: d2
    level: 3
    thinking: evidence
    covers: [S3.1, S3.4, K3.4]
    type: mc
    prompt: |-
      Ivan finds two sources that disagree.

      - A blog by someone called *OwlFan99* says burrowing owls eat **only** mice.
      - A government wildlife website says they eat **insects and small animals, like mice**.

      What should Ivan do?
    choices:
      - Trust the wildlife website more, and check a third trusted source, like a library book.
      - Write whichever fact sounds more exciting.
      - Write both facts, and let the reader decide.
      - Give up on the question, because sources disagree.
    answer: 0
    feedback:
      '1': Is “exciting” the same as “true”? Being accurate matters.
      '2': Would that be accurate? One source is likely wrong.
      '3': Sources sometimes disagree. How could he find out which is right?
    hints:
      - Who wrote each source? Which is more likely to be checked by experts?
    solution:
      - A government wildlife website is written by experts. A blog by *OwlFan99* might be a guess.
      - Checking a third trusted source helps Ivan answer the question **critically**, and report it accurately.
