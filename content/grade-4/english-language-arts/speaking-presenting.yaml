id: speaking-presenting
grade: 4
subject: english-language-arts
organizingIdea: LANENG-OI2
outcomes: [LANENG4-OI2-GQ1-LO1]
order: 6
title: Speaking Clearly and Presenting
shortTitle: Speaking & presenting
summary: >-
  Group your words into phrases, pause for effect, project your voice to the back row, plan a talk with
  speaking cards and visual aids, and share a poem from memory.

bigIdea: |-
  - **Phrasing and pausing** help listeners follow your ideas, and make the important parts stand out.
  - **Projection** sends your voice where you want it, with breath, clarity and intention.
  - A great presentation is **planned**: notes, visual aids, and words chosen for the audience.

lesson:
  - title: Phrases and pauses
    blocks:
      - type: callout
        variant: remember
        covers: ['LANENG3-OI2-GQ1-LO1#K2.3', 'LANENG3-OI2-GQ1-LO1#K2.4']
        title: Remember from Grade 3
        body: Speakers group words into **phrases** and separate them with **pauses**. A pause can support meaning or create emphasis.
      - type: visual
        covers: [K2.2, S2.3]
        component: phrase-reader
        props:
          title: Morning announcement
          lines:
            - Good morning, / Room 12! //
            - Today / is our class trip / to the *dinosaur* museum. //
            - Please bring / a *lunch*, / a water bottle, / and your *best* dinosaur questions!
        caption: Press **Read it** in both modes. Which one is easier to follow?
      - type: table
        covers: [K2.2]
        caption: What phrasing and pausing do
        headers: [They…, Example]
        rows:
          - ['**Support the flow** of your ideas', 'Good morning, | Room 12!']
          - ['**Support the meaning**', 'a lunch, | a water bottle, | and your best questions (three separate things)']
          - ['**Create emphasis**', 'And the winner is… ‖ **Room 12!**']

  - title: Project your voice
    blocks:
      - type: visual
        covers: [K2.3, K2.4, S2.4]
        component: voice-aim
        props:
          line: The bake sale starts at noon!
          target: Mr. Diaz
        caption: '**Projection** is directing your voice to the person you want to reach. Switch on all three parts.'
      - type: callout
        variant: tip
        covers: [S2.4, S2.3]
        title: Fit the room and the listeners
        body: |-
          - In the library, reading to a buddy: a soft voice.
          - In the gym, at an assembly: project to the back row.

  - title: Words and body together
    blocks:
      - type: compare
        covers: [K4.1, S4.1, U4.1]
        columns:
          - title: 🗣️ Verbal language
            body: The **words** you say.
          - title: 🙌 Non-verbal language
            body: Your **face, hands and body**. A smile, eye contact, or pointing at a picture.
      - type: table
        covers: [K4.1, S4.1]
        caption: Put them together.
        headers: [You want to…, Say…, And do…]
        rows:
          - ['Make it **clear**', '“The burrow goes **down** under the grass.”', 'Trace the path down on your diagram.']
          - ['Make it **funny**', '“Then the snake said… nothing. Snakes can’t talk.”', 'Pause, and shrug.']
          - ['Make it **exciting**', '“And then… the ice cracked!”', 'Lean forward and open your eyes wide.']

  - title: Plan your presentation
    blocks:
      - type: compare
        covers: [K5.1, K5.2, S5.1]
        columns:
          - title: 🗂️ A speaking card
            body: |-
              **Burrowing owls**

              - Start: “Have you ever seen an owl underground?”
              - Live in old burrows
              - Stand on one leg by the door
              - Hunt insects and mice
              - End: “Next time you see a hole in the prairie, look for eyes!”
          - title: ✅ Why it works
            body: |-
              - **Jot notes**, not whole sentences. A glance is enough.
              - Key points in a **logical order**.
              - A clear **introduction** and **conclusion**.
      - type: callout
        variant: mistake
        covers: [K5.2]
        title: Don’t write the whole speech
        body: If your card has every word, you will read it instead of talking to your audience. Speaking cards hold only the **key points**.

  - title: Visual aids
    blocks:
      - type: visual
        covers: [K5.3, S5.4, K5.1]
        component: card-sort
        props:
          bins:
            - { id: object, label: Object, icon: 🪺 }
            - { id: diagram, label: Diagram, icon: 📐 }
            - { id: image, label: Image, icon: 🖼️ }
            - { id: text, label: Text, icon: 🔤 }
          cards:
            - { text: An old bird’s nest that the class can pass around, bin: object, why: 'A real thing you can hold is an object.' }
            - { text: A drawing of a burrow with labels for each part, bin: diagram, why: 'A labelled drawing that shows how something works is a diagram.' }
            - { text: A photo of a burrowing owl on a fence post, bin: image, why: 'A photo or picture is an image.' }
            - { text: 'A slide that shows three key words: burrow, insects, prairie', bin: text, why: 'Key words on a slide or poster are text.' }
        caption: Sort these visual aids for a talk about owls. Some are digital, like a slide, and some are not.
      - type: callout
        variant: tip
        covers: [S5.4, K5.1]
        title: Aids should help, not distract
        body: Show each aid when you talk about it, then put it away. Choose digital or non-digital tools that fit your room and your audience.

  - title: Deliver it well
    blocks:
      - type: table
        covers: [K5.4, S5.2, U5.1]
        caption: Good delivery
        headers: [Remember, What it means]
        rows:
          - ['**Clear enunciation**', 'Say every sound, so “wanna” becomes “want to.”']
          - ['**Tone and pace**', 'Sound friendly. Not too fast, and slow down for key points.']
          - ['**Correct grammar**', '“We were ready,” not “We was ready.”']
          - ['**Word choice**', 'Choose words that fit your audience and your purpose: to engage, inform, persuade or entertain.']
      - type: compare
        covers: [S5.5, K5.5]
        columns:
          - title: 👧 For Grade 1 buddies
            body: “Owls can turn their heads almost all the way around. Try it! You can’t!”
          - title: 🧑‍🏫 For the principal
            body: “Our class learned how owls hunt. We would like to put an owl box in the schoolyard.”
      - type: callout
        variant: tip
        covers: [K5.5]
        title: Everyone has a style
        body: Some speakers are calm and some are bouncy. Both can work, if the audience can follow.

  - title: Share a poem from memory
    blocks:
      - type: visual
        covers: [S5.3, K2.2]
        component: phrase-reader
        props:
          title: Chinook
          memorize: true
          lines:
            - Over the mountains / the *warm* wind comes, //
            - tapping the windows / like fingers on drums. //
            - The snowbanks *shrink*, / the icicles *drip*, //
            - and winter lets go / of its *cold*, / tight grip.
        caption: Read it in phrases. Then choose **Learn by heart**, and hide more words each time you can say it.
      - type: callout
        variant: tip
        covers: [S5.6]
        title: Be a great audience
        body: |-
          - Look at the speaker and stay quiet.
          - Clap at the end.
          - Say one thing you liked, such as “Your pause before *tight grip* was great!”

keyTerms:
  - term: Phrasing
    covers: [K2.2]
    definition: Grouping words together when you speak or read, so ideas flow and make sense.
  - term: Projection
    covers: [K2.3, K2.4]
    definition: Directing your voice toward the listener you want to reach, using breath, clarity and intention.
  - term: Speaking card
    covers: [K5.2]
    definition: A cue card with jot notes of your key points, to help you while you speak.
  - term: Visual aid
    covers: [K5.3]
    definition: Something your audience can see that supports your talk, such as an object, a diagram, an image or text.
  - term: Enunciation
    covers: [K5.4]
    definition: Saying every sound in your words clearly.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K2.2, S2.3]
    type: mc
    prompt: You are reading this sentence aloud. Where does a pause **support the meaning**?
    choices:
      - After the game, | we went out for pizza.
      - After the | game we went out | for pizza.
      - After the game we | went out for | pizza.
      - After | the | game | we | went | out | for | pizza.
    fixedOrder: true
    answer: 0
    feedback:
      '1': Read it aloud with these pauses. Does “game we went out” sound like one idea?
      '2': Does “we | went out for” keep each idea together?
      '3': Pausing after every word sounds like a robot. Which groups of words belong together?
    hints:
      - Find the two ideas in the sentence. Where does one end and the next begin?
    solution:
      - '*After the game* is one idea. *we went out for pizza* is another. The comma shows where to pause.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K5.2, K5.1]
    type: mc
    prompt: Which is the best **speaking card** for a talk about honeybees?
    choices:
      - '“Bees dance / Make honey from nectar / Live in hives / End: thank a bee!”'
      - The whole talk, written out word for word, in small printing on the back too
      - 'One word: “Bees”'
      - A list of every fact about bees from a whole library book
    answer: 0
    feedback:
      '1': If you write every word, you will read instead of talking to your audience.
      '2': One word won’t remind you of your key points. What would you say next?
      '3': Too many facts on one card are hard to read at a glance. What are the **key** points?
    hints:
      - A speaking card holds jot notes of the key points. Which one could you read at a glance?
    solution:
      - Short jot notes of the key points, in order, with an ending. That is a useful **speaking card**.

  - id: w3
    level: 1
    thinking: apply
    covers: [K5.3, S5.4]
    type: mc
    prompt: In her talk about hockey, Zara passes around a real skate blade for everyone to hold. What kind of visual aid is it?
    choices:
      - An object
      - A diagram
      - An image
      - Text
    fixedOrder: true
    answer: 0
    feedback:
      '1': A diagram is a drawing with labels. Is a skate blade a drawing?
      '2': An image is a picture or photo. Can you hold this one?
      '3': Text is words, like on a slide. Is the blade made of words?
    hints:
      - Can you hold it in your hand?
    solution:
      - A real thing you can hold is an **object**. Objects are great when the audience can see or touch them.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: whatif
    covers: [K2.2, S2.3]
    type: mc
    prompt: |-
      At the assembly, Ms. Ali says:

      > And the winner of this year’s science fair is… ‖ Room 12!

      What if she said it all in one breath, with **no pause**?
    choices:
      - The name would not stand out, and the moment would lose its excitement.
      - The audience could not hear her at all, even in the front row.
      - The meaning would change, so a different class would win.
      - Nothing, because pauses are only for taking a breath.
    answer: 0
    feedback:
      '1': A pause doesn’t change how loud she is. What does it change?
      '2': Would the winner be different? What would be different?
      '3': Pauses do let you breathe, but they also do a job for listeners. What is it here?
    hints:
      - What happens in the audience during that pause?
    solution:
      - The pause makes everyone wait and wonder. Then *Room 12!* lands with extra force.
      - Pausing can **create emphasis**. Without it, the big news slips by.

  - id: b2
    level: 2
    thinking: flaw
    covers: [K2.3, K2.4, S2.4]
    type: mc
    prompt: Kai gives the morning announcement in the gym. He takes a big breath and looks right at the back row. But the back row hears, “Th’bakesale’snoon.” What part of projection is Kai missing?
    choices:
      - Clarity
      - Breath
      - Intention
    fixedOrder: true
    answer: 0
    feedback:
      '1': He takes a big breath, and the sound does reach the back row. What is wrong with the words?
      '2': He looks at the back row, so he has a target. What is wrong with the words they hear?
    hints:
      - The sound gets to the back. What is wrong with **how** the words sound?
    solution:
      - The sound reaches them, so breath and intention are working. But the words run together, so the message is lost.
      - 'Kai needs **clarity**: say every sound clearly. Projection needs all three.'

  - id: b3
    level: 2
    thinking: connect
    covers: [S5.5, U5.1]
    type: mc
    prompt: Mateo presents his science fair project to the **Grade 1** class. Which opening best fits his audience?
    choices:
      - “Have you ever wondered why ice floats? Watch this!”
      - “Today I will discuss the density of frozen water.”
      - “Ice floats. That is my project. Any questions?”
      - “Good afternoon, members of the science fair committee.”
    answer: 0
    feedback:
      '1': Would six-year-olds know the word *density*?
      '2': This is very short. Would it make Grade 1s curious?
      '3': Is the audience a committee, or Grade 1 students?
    hints:
      - Which opening uses words a six-year-old knows, and gets them excited?
    solution:
      - A question and *Watch this!* use simple words and engage young listeners. Word choice should appeal to the audience.

  - id: b4
    level: 2
    thinking: model
    covers: [S5.1, K5.1]
    type: order
    prompt: Ella is planning a talk called “Our School Needs a Bike Rack.” Put her plan in a logical order.
    items:
      - 'Introduction: “How many of you ride a bike to school?”'
      - 'Key point: bikes are piling up against the fence.'
      - 'Key point: a rack would keep bikes safe and tidy.'
      - 'Conclusion: “Let’s ask the principal for a bike rack!”'
    hints:
      - What hooks the audience? What should come last?
      - Which key point shows the problem? Which shows the fix?
    solution:
      - The **introduction** hooks the audience with a question.
      - The problem comes before the fix, so the listeners understand why a rack matters.
      - The **conclusion** tells the audience what to do.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K5.1, K5.3, S5.4, S5.1, S5.2]
    type: investigation
    prompt: You have **one minute** to teach the Grade 2 class how a burrowing owl’s home works. Let’s plan it, one choice at a time.
    parts:
      - type: mc
        prompt: Which visual aid would help the Grade 2s most?
        choices:
          - A big labelled diagram of a burrow under the grass, with an owl inside
          - A slide covered with a full page of facts about owls
          - Nothing, because visual aids take time away from talking
          - A photo of a snowy owl flying over the Arctic
        answer: 0
        feedback:
          '1': Grade 2 students can’t read a full page in a minute. What would they understand at a glance?
          '2': Your topic is a home they can’t see underground. What would help them picture it?
          '3': A snowy owl doesn’t live in a burrow. Does this show your topic?
        hints:
          - What is hard to picture about a burrow? What would show it?
        solution:
          - A home underground is hard to imagine. A labelled **diagram** shows it at a glance.
      - type: mc
        prompt: Which opening will engage the Grade 2s?
        choices:
          - “Did you know some owls live underground, like rabbits?”
          - “Burrowing owls belong to the family Strigidae.”
          - “Um, OK, so, I’m going to talk about owls I guess.”
          - “This talk will be one minute long.”
        answer: 0
        feedback:
          '1': Would seven-year-olds know that word? Would it make them curious?
          '2': This sounds unsure. How would the audience feel?
          '3': It is true, but would it make them want to listen?
        hints:
          - Which opening gives them a surprise or a question?
        solution:
          - A surprising question pulls the audience in, and uses words they know.
      - type: mc
        prompt: Where should you hold up the diagram?
        choices:
          - While you explain how the burrow works, then put it down
          - Before you say anything, and keep it up the whole time
          - At the very end, after you say goodbye
          - Never, so that the audience looks only at you
        answer: 0
        feedback:
          '1': If it is up the whole time, will they listen to your opening, or stare at the picture?
          '2': If they see it after you finish, can it help them understand?
          '3': Then why make it? When would it help most?
        hints:
          - When does the audience need to see it?
        solution:
          - Show an aid **when** you talk about it. That way it helps, and doesn’t distract.
    wrapUp: A good presentation is a set of small choices. For each one, ask, “What will help **this** audience understand?”

  - id: d2
    level: 3
    thinking: perspective
    covers: [K5.5, S5.6, U5.1]
    type: mc
    prompt: |-
      Two classmates present on volcanoes.

      - **Mo** tells jokes and acts out an eruption.
      - **Ana** speaks calmly and points to a clear diagram.

      Lee says, “Only one of them can be doing it right.” What would you tell Lee?
    choices:
      - Speakers have different styles. Both can work if the audience learns and stays engaged.
      - Mo is right, because a presentation always has to be funny to keep people listening.
      - Ana is right, because jokes never belong in a presentation that informs.
      - Neither is right, because a speaker should only read the facts aloud.
    answer: 0
    feedback:
      '1': Could a calm, clear talk with a diagram also keep an audience interested?
      '2': Can a joke help an audience remember a fact?
      '3': Would just reading facts aloud engage an audience?
    hints:
      - Think about the audience. What do they need from each talk?
    solution:
      - Communication styles **differ from speaker to speaker**.
      - Mo entertains while he informs, and Ana informs with a clear aid. Both can work.
      - A respectful audience member judges whether the talk helped, not whether it matched their own style.
