id: nonfiction-texts
grade: 4
subject: english-language-arts
organizingIdea: LANENG-OI1
outcomes: [LANENG4-OI1-GQ1-LO1]
order: 3
title: 'Non-fiction: Life Stories, Instructions and the Land'
shortTitle: Non-fiction texts
summary: >-
  Read an autobiography, follow procedural texts like recipes and manuals, read the land, see how
  non-fiction is built, and tell facts from opinions.

bigIdea: |-
  - Non-fiction comes in many forms: **autobiographies**, **procedural texts**, and even **the land**.
  - Non-fiction is built in a clear way: an **introduction**, a **main idea**, **supporting details** and a **conclusion**.
  - Non-fiction can share **opinions** as well as facts, so read carefully.

lesson:
  - title: Three kinds of non-fiction
    blocks:
      - type: compare
        covers: [K4.1, K4.2]
        columns:
          - title: 📔 Autobiography
            body: The true story of a person’s life, **written by that person**. The writer says *I*.
          - title: 🧾 Procedural text
            body: A text that tells you **how to do something**, step by step. **Recipes** and **instruction manuals** are procedural texts.
          - title: 🏞️ The land
            body: The land holds true information that people can learn to read, like tracks, trails and landmarks.
      - type: callout
        variant: remember
        covers: ['LANENG3-OI1-GQ1-LO1#K4.1']
        title: Remember from Grade 3
        body: A **biography** is a life story written by someone else. An **autobiography** is written by the person themselves.

  - title: Read an autobiography
    blocks:
      - type: passage
        id: amira
        title: My Life So Far
        form: Autobiography, from a class book
        paragraphs:
          - My name is Amira, and I was born in Edmonton on a snowy day in March. I am nine years old, and this is the story of my life so far.
          - When I was four, my family moved to Grande Prairie. My dad got a job at the hospital there. I cried the whole drive, because I missed my cousins.
          - The best thing that ever happened to me was learning to swim when I was six. At first, I was scared to put my face in the water. My coach, Ms. Lee, taught me to blow bubbles, and by summer I could swim the whole length of the pool.
          - Now I swim on a team three mornings a week. Swimming is the greatest sport in the world. I am proud of how far I have come, from a girl who was afraid of the water to a girl who can’t stay out of it.
        note: An original autobiography by a made-up student, written for Alberta Edu. Paragraph numbers help you point to evidence.
      - type: callout
        variant: tip
        covers: [K4.1, S4.1]
        title: An autobiography is told in time order
        body: Amira starts with when she was born and moves forward, one important event at a time, to now.

  - title: How information is built
    blocks:
      - type: visual
        covers: [K4.3, S4.1]
        component: text-parts
        props:
          title: Chinooks
          parts:
            - { id: intro, label: Introduction, icon: 👋, note: 'The **introduction** pulls you in and says what the text is about.' }
            - { id: main, label: Main idea, icon: 🎯, note: 'The **main idea** is the most important thing the writer wants you to know.' }
            - { id: detail, label: Supporting details, icon: 🧱, note: '**Supporting details** are facts that hold up the main idea.' }
            - { id: end, label: Conclusion, icon: 🏁, note: 'The **conclusion** wraps it up without adding anything new.' }
          sentences:
            - { text: 'If you live in southern Alberta, you may have felt a chinook in the middle of winter.', part: intro }
            - { text: 'A chinook is a warm, dry wind that blows down from the Rocky Mountains.', part: main }
            - { text: 'It can melt snow fast, and in a few hours the air may feel like spring.', part: detail }
            - { text: 'A band of clear sky, called a chinook arch, often stretches over the mountains.', part: detail }
            - { text: 'So the next time the snow melts in January, you will know what to thank.', part: end }
          breaks: [2, 5]
        caption: Tap each part. What job does each sentence do?
      - type: table
        covers: [K4.3, K4.2, S4.1]
        caption: '**Compare and contrast** is another way to build non-fiction. It shows how two things are alike and different.'
        headers: ['', Recipe, Instruction manual]
        rows:
          - ['**Both**', 'What you need, then steps in order', 'What you need, then steps in order']
          - ['**Different**', 'Makes **food**: flour, eggs, an oven', 'Builds or fixes **things**: parts, tools, a screwdriver']

  - title: Facts and opinions
    blocks:
      - type: visual
        covers: [K4.4, S4.2]
        component: text-parts
        props:
          title: A Day at Elk Island National Park
          parts:
            - { id: fact, label: Fact, icon: ✅, note: 'A **fact** can be checked. You could look it up or see it for yourself.' }
            - { id: opinion, label: Opinion, icon: 💭, note: 'An **opinion** is what someone thinks or feels. Others may disagree.' }
          sentences:
            - { text: 'Elk Island National Park is east of Edmonton.', part: fact }
            - { text: 'Herds of plains bison live in the park.', part: fact }
            - { text: 'Watching the bison is the most exciting thing you can do in Alberta.', part: opinion }
            - { text: 'The park is a dark-sky preserve, so there are very few lights at night.', part: fact }
            - { text: 'Everyone should camp there at least once.', part: opinion }
        caption: This travel page shares facts **and** opinions. Tap each one.
      - type: callout
        variant: tip
        covers: [S4.2, K4.4]
        title: Ask, “Could I check it?”
        body: |-
          - **Fact:** you could prove it.
          - **Opinion:** watch for words like *best*, *most exciting* and *should*.

  - title: Reading the land
    blocks:
      - type: figure
        covers: [K4.1, S4.1]
        figure: |-
          <svg viewBox="0 0 400 130" class="fig-svg" role="img" aria-label="Tracks in fresh snow. Pairs of small paw prints lead from a spruce tree on the left to a small hole in the snow on the right, where they stop.">
            <rect width="400" height="130" fill="#eef4fb"/>
            <polygon points="30,100 55,20 80,100" fill="#2f6b4a"/><rect x="51" y="100" width="8" height="16" fill="#6b4a2f"/>
            <g fill="#7a8796">
              <ellipse cx="105" cy="92" rx="4" ry="6"/><ellipse cx="115" cy="88" rx="4" ry="6"/>
              <ellipse cx="150" cy="90" rx="4" ry="6"/><ellipse cx="160" cy="86" rx="4" ry="6"/>
              <ellipse cx="195" cy="88" rx="4" ry="6"/><ellipse cx="205" cy="84" rx="4" ry="6"/>
              <ellipse cx="240" cy="86" rx="4" ry="6"/><ellipse cx="250" cy="82" rx="4" ry="6"/>
              <ellipse cx="285" cy="84" rx="4" ry="6"/><ellipse cx="295" cy="80" rx="4" ry="6"/>
            </g>
            <ellipse cx="340" cy="80" rx="14" ry="9" fill="#3a4250"/>
            <text class="fig-small" x="200" y="122" text-anchor="middle">Tracks in fresh snow</text>
          </svg>
        caption: The land holds true information. These tracks tell you that a small animal went from the tree to the hole, after the snow fell.
      - type: compare
        covers: [K4.1, U4.1]
        columns:
          - title: 🪨 Áísínai’pi
            body: In southern Alberta, carvings and paintings cover the sandstone cliffs at Áísínai’pi (Writing-on-Stone). It is a sacred place for the **Blackfoot** people, where they hold ceremonies and protect sacred sites and stories.
          - title: 🌍 Opening minds
            body: In 2019, Áísínai’pi became a UNESCO World Heritage Site. Learning to read the land can change how you see a place.
      - type: callout
        variant: tip
        covers: [U4.1]
        title: Respect the land you read
        body: Alberta Parks asks visitors to respect Áísínai’pi as a sacred place, and never to leave marks on the rocks.

keyTerms:
  - term: Autobiography
    covers: [K4.1]
    definition: The true story of a person’s life, written by that person.
  - term: Procedural text
    covers: [K4.1, K4.2]
    definition: A text that tells how to do something, step by step, such as a recipe or an instruction manual.
  - term: Main idea
    covers: [K4.3]
    definition: The most important thing a writer wants you to know about the topic.
  - term: Supporting details
    covers: [K4.3]
    definition: Facts and examples that hold up the main idea.
  - term: Compare and contrast
    covers: [K4.3]
    definition: A way to organize non-fiction that shows how two things are alike and different.
  - term: Opinion
    covers: [K4.4]
    definition: What someone thinks or feels about something. It can’t be proven true or false.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K4.1, K4.2]
    type: mc
    prompt: Which of these is a **procedural text**?
    choices:
      - A booklet that shows how to set up a tent, step by step
      - A book in which a hockey player tells the story of her own life
      - A poem about the sound of rain on a tent at night
      - A newspaper report about a campground that just opened
    answer: 0
    feedback:
      '1': A person telling their own life story is writing an autobiography. Does it tell you how to do something?
      '2': A poem can be about camping. Does it tell you how to do something, in steps?
      '3': A report gives news. Would you follow it step by step?
    hints:
      - Which text would you follow, one step at a time?
    solution:
      - A booklet with steps for setting up a tent is an **instruction manual**. Manuals and recipes are **procedural texts**.

  - id: w2
    level: 1
    thinking: notice
    covers: [K4.4, S4.2]
    type: mc
    prompt: Which sentence from “My Life So Far” is an **opinion**?
    choices:
      - Swimming is the greatest sport in the world.
      - Now I swim on a team three mornings a week.
      - My family moved to Grande Prairie when I was four.
      - My dad got a job at the hospital there.
    answer: 0
    feedback:
      '1': Her coach or team could tell you if this is true. Could you check it?
      '2': You could check this with her family or old school records.
      '3': You could check this too. Is it what someone thinks, or what happened?
    hints:
      - Which sentence could someone disagree with, and still be right?
    solution:
      - A hockey fan might say hockey is the greatest sport. Neither can be proven, so it is an **opinion**.
      - The other sentences tell what happened. They could be checked, so they are facts.

  - id: w3
    level: 1
    thinking: apply
    covers: [K4.2, S4.1]
    type: order
    prompt: These are the steps of a procedural text called “How to Make a Paper Snowflake.” Put them in order.
    items:
      - Fold a square of paper in half to make a triangle.
      - Fold the triangle in half again.
      - Cut small shapes out of the edges.
      - Unfold the paper carefully to see your snowflake.
    hints:
      - What do you have to do before you can cut?
    solution:
      - Fold first, then fold again, so that one cut makes many shapes.
      - Cut, then unfold last. In a procedural text, the order of the steps matters.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: evidence
    covers: [K4.3, S4.1, K4.1]
    type: evidence
    prompt: An autobiography often ends with a **conclusion** that sums up the writer’s life so far. Tap Amira’s concluding sentence.
    passage: amira
    paragraphs: [1, 4]
    answer: [p4s3]
    feedback:
      p1s1: This is the start of her story, where she introduces herself.
      p1s2: This is part of the introduction. It tells you what the text will be about.
      p4s1: This tells what she does now. Does it sum up her whole life so far?
      p4s2: This is her opinion about swimming. Does it look back over her life?
    hints:
      - Which sentence looks back over everything, from the start to now?
    solution:
      - '“I am proud of how far I have come, from a girl who was afraid of the water to a girl who can’t stay out of it.”'
      - It ties the beginning (afraid) to now (can’t stay out), without adding a new event. That is a **conclusion**.

  - id: b2
    level: 2
    thinking: connect
    covers: [K4.3, K4.2]
    type: mc
    prompt: Lin makes a chart to **compare and contrast** a recipe for pancakes and an instruction manual for a bike. Which fact belongs in the **Both** column?
    choices:
      - It has steps that must be done in order.
      - It tells you how long to cook something.
      - It shows how to tighten the bolts.
      - It lists eggs, milk and flour.
    answer: 0
    feedback:
      '1': Would a bike manual tell you to cook anything?
      '2': Would a pancake recipe tell you about bolts?
      '3': These are ingredients. Would a bike manual list them?
    hints:
      - Check each fact. Is it true for the recipe? Is it true for the manual?
    solution:
      - Both are **procedural texts**, so both give steps in order.
      - The other facts are true of only one, so they go in the **different** part of the chart.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K4.4, S4.2]
    type: mc
    prompt: |-
      A non-fiction book about Alberta says:

      > Banff is the most beautiful town in Canada.

      Ana says, “That must be a fact, because it’s in a non-fiction book.” What is wrong with Ana’s thinking?
    choices:
      - Non-fiction can share opinions too, and “most beautiful” can’t be proven.
      - Nothing, because every sentence in a non-fiction book must be a fact.
      - Banff is not a real town, so the sentence is made up and must be fiction.
      - It is a fact only if the writer of the book has been to Banff.
    answer: 0
    feedback:
      '1': Non-fiction writers can share what they think about information too. Could you prove “most beautiful”?
      '2': Banff is a real town in Alberta. Is “most beautiful” something you can check?
      '3': Even after a visit, “most beautiful” is still what the writer thinks. Could someone else disagree?
    hints:
      - Which words in the sentence are what someone **thinks**?
    solution:
      - '*Most beautiful* is a judgement. Someone who loves Jasper might disagree.'
      - Non-fiction texts can share **opinions** about information. Being in a true book doesn’t turn an opinion into a fact.

  - id: b4
    level: 2
    thinking: model
    covers: [K4.3, S4.1]
    type: mc
    prompt: |-
      Leah is writing a report about burrowing owls. She has these supporting details:

      - They nest in old burrows dug by other animals.
      - They hunt insects and mice.
      - They often stand on one leg by the door of the burrow.

      Which sentence would make the best **main idea** for this paragraph?
    choices:
      - Burrowing owls live a very different life from most owls.
      - Owls are birds, and there are many kinds of birds.
      - I saw a burrowing owl once at the zoo last summer.
      - Burrowing owls stand on one leg by the door of the burrow.
    answer: 0
    feedback:
      '1': This is true, but it is too big. Leah’s details are all about one kind of owl.
      '2': This is a personal story. Do her details hold it up?
      '3': This is already one of her details. A main idea is bigger than one detail.
    hints:
      - Which sentence could all three details hold up?
    solution:
      - A main idea is what all the details have in common. Living in burrows and standing by the door are unusual for an owl.
      - So “Burrowing owls live a very different life from most owls” is held up by every detail.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K4.1, K4.4, S4.2, U4.1]
    type: investigation
    figure: |-
      <svg viewBox="0 0 400 130" class="fig-svg" role="img" aria-label="Tracks in fresh snow. Pairs of small paw prints lead from a spruce tree on the left to a small hole in the snow on the right, where they stop.">
        <rect width="400" height="130" fill="#eef4fb"/>
        <polygon points="30,100 55,20 80,100" fill="#2f6b4a"/><rect x="51" y="100" width="8" height="16" fill="#6b4a2f"/>
        <g fill="#7a8796">
          <ellipse cx="105" cy="92" rx="4" ry="6"/><ellipse cx="115" cy="88" rx="4" ry="6"/>
          <ellipse cx="150" cy="90" rx="4" ry="6"/><ellipse cx="160" cy="86" rx="4" ry="6"/>
          <ellipse cx="195" cy="88" rx="4" ry="6"/><ellipse cx="205" cy="84" rx="4" ry="6"/>
          <ellipse cx="240" cy="86" rx="4" ry="6"/><ellipse cx="250" cy="82" rx="4" ry="6"/>
          <ellipse cx="285" cy="84" rx="4" ry="6"/><ellipse cx="295" cy="80" rx="4" ry="6"/>
        </g>
        <ellipse cx="340" cy="80" rx="14" ry="9" fill="#3a4250"/>
      </svg>
    prompt: Mila and her uncle find these tracks in snow that fell last night. They try to **read the land**.
    parts:
      - type: mc
        prompt: What true information do the tracks give?
        choices:
          - A small animal went from the tree to the hole after the snow fell.
          - A fox chased a small animal from the tree to the hole.
          - A small animal went from the hole to the tree last week.
          - A small animal was hungry and went to the hole to eat.
        answer: 0
        feedback:
          '1': Do you see any other tracks? Only one set of prints is in the snow.
          '2': The snow fell last night, so could the tracks be from last week? Which end do the tracks stop at?
          '3': The tracks show where it went. Do they show how it felt?
        hints:
          - Read only what is there. Where do the tracks start and stop? When did the snow fall?
        solution:
          - The tracks start at the tree and stop at the hole. They are in new snow, so they were made after it fell.
      - type: mc
        prompt: 'Mila says, “The animal was scared, so it hid in the hole.” What is this?'
        choices:
          - An opinion about the information, because the tracks can’t show feelings.
          - A fact, because Mila saw the tracks with her own eyes.
          - A fact, because the tracks really do stop at the hole.
          - An opinion, because Mila could not see the tracks clearly.
        answer: 0
        feedback:
          '1': Mila did see the tracks. But did she see the animal feel scared?
          '2': The tracks stopping is a fact. Is “it was scared” the same thing?
          '3': The tracks are easy to see. The problem is a different part of what she said.
        hints:
          - Which part could the tracks prove? Which part is Mila’s idea?
        solution:
          - That it went into the hole is a fact the land shows. That it was **scared** is Mila’s idea about the information.
    wrapUp: The land is a text that holds true information. Careful readers keep what it shows separate from what they think about it.

  - id: d2
    level: 3
    thinking: evidence
    covers: [K4.4, S4.2, K4.1]
    type: evidence
    prompt: One sentence in Amira’s autobiography **mixes a fact and an opinion together**. Tap it.
    passage: amira
    paragraphs: [2, 3]
    answer: [p3s1]
    feedback:
      p2s1: This tells what happened. Could you check it? Is there any opinion in it?
      p2s2: This could be checked with her family. Is there any opinion in it?
      p2s3: This tells what she did and why. Is there a judgement someone could disagree with?
      p3s2: This tells how she felt at the time. That happened to her. Is there a judgement in it?
      p3s3: Her coach could check this. Where is the opinion?
    hints:
      - Look for a sentence with a fact you could check **and** a word like *best*.
    solution:
      - '“The best thing that ever happened to me was learning to swim when I was six.”'
      - '**Fact:** she learned to swim at six. Her family could check that.'
      - '**Opinion:** that it was the best thing ever. That is what Amira thinks.'
      - Writers often mix the two in one sentence, so read every part.
