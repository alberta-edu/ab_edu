id: writers-craft
grade: 4
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG4-OI8-GQ1-LO1]
order: 12
title: 'Writer’s Craft: Beginnings, Dialogue and Endings'
shortTitle: Writer’s craft
summary: >-
  Turn a plain story into one people want to read: hook readers at the start, add sensory details and
  dialogue, use punctuation for effect, and write a strong ending.

bigIdea: |-
  - Writing is a **craft**. Writers choose how to organize, which words to use and how to present them.
  - A great beginning hooks readers. Senses, figurative language and dialogue keep them reading.
  - A strong ending ties things up, or leaves readers wondering.

lesson:
  - title: Craft a plain story
    blocks:
      - type: visual
        covers: [K2.2, K2.3, S2.1, S2.3]
        component: craft-toggles
        props:
          parts:
            - { id: hook, label: Hook, icon: 🎣, plain: 'This is a story about pancakes.', crafted: '*Flip!* The pancake sailed up, up, up… and didn’t come down.', why: 'A sound and a surprise make you want to know what happens. That is a **hook**.' }
            - { id: senses, label: Senses, icon: 👃, plain: 'It was stuck on the ceiling.', crafted: 'Golden and steaming, it stuck to the ceiling like a soft yellow hat.', why: '**Sensory details** and a simile help you see and feel the pancake.' }
            - { id: dialogue, label: Dialogue, icon: 💬, plain: 'Dad was surprised and asked who did it.', crafted: '“Whose idea was the triple flip?” Dad asked, staring up.', why: '**Dialogue** lets us hear Dad, and moves the story along.' }
            - { id: punct, label: Punctuation, icon: ❗, plain: 'I said it was me.', crafted: '“Mine,” I whispered. “Sorry…”', why: 'The trailing dots make the words fade away, so you can tell how sorry the narrator feels.' }
            - { id: ending, label: Ending, icon: 🏁, plain: 'Then we ate breakfast. The end.', crafted: 'We never did get that pancake down. I think it’s still up there, waiting for someone tall enough.', why: 'This ending leaves you **wondering**, and smiling.' }
        caption: Switch on one craft move at a time. Then try **All of them**.
      - type: callout
        variant: tip
        covers: [K2.3, K2.2]
        title: Your voice
        body: The details you choose, and how you present them, make your writing sound like **you**. That is your **voice**.

  - title: Beginnings that hook
    blocks:
      - type: visual
        covers: [S2.4]
        component: card-sort
        props:
          bins:
            - { id: sound, label: A sound, icon: 🔊 }
            - { id: question, label: A question, icon: ❓ }
            - { id: talk, label: Dialogue, icon: 💬 }
            - { id: action, label: Action, icon: 🏃 }
          cards:
            - { text: '*Crack!* The ice on the pond split right under my skates.', bin: sound, why: 'A sound word grabs your ears first.' }
            - { text: Have you ever lost something that was right in your hand?, bin: question, why: 'A question makes readers think of their own answer.' }
            - { text: '“Don’t open that box,” Grandma said. Too late.', bin: talk, why: 'Dialogue drops you into the middle of the moment.' }
            - { text: I leapt over the fence just as the bull turned around., bin: action, why: 'Action starts the story at full speed.' }
        caption: What kind of hook does each beginning use?

  - title: Senses and figurative language
    blocks:
      - type: compare
        covers: [S2.5, K2.4]
        columns:
          - title: 😐 Plain
            body: We went to the fair. It was fun.
          - title: 🎡 With senses
            body: The smell of mini doughnuts floated past the Ferris wheel. Music thumped, lights blinked, and my sticky fingers held the last bite of candy floss.
          - title: ✨ With figurative language
            body: The Ferris wheel was a giant glowing bracelet, and it lifted us into the stars.
      - type: callout
        variant: tip
        covers: [S2.5, K2.4]
        title: Ask your five senses
        body: What would I **see**, **hear**, **smell**, **taste** and **touch** here? Pick the two or three details that matter most.

  - title: Dialogue does work
    blocks:
      - type: table
        covers: [K2.5, S2.6]
        caption: Dialogue can do three jobs.
        headers: [Job, Example]
        rows:
          - ['**Add variety**, so it isn’t all telling', '“Ready?” “Ready!” And we jumped.']
          - ['**Move the plot forward**', '“The bridge is out,” said the ranger. “You’ll have to go around.”']
          - ['**Show thoughts or feelings**', '“I’m f-fine,” Leo said, gripping the rail.']
      - type: callout
        variant: tip
        covers: [S2.6, K2.3]
        title: Give each character a voice
        body: A little brother, a grandma and a coach shouldn’t sound the same. Choose words that fit each one.

  - title: Punctuation for effect
    blocks:
      - type: visual
        covers: [S2.7]
        component: punct-lab
        props:
          mode: effect
          versions:
            - { text: 'The door opened.', effect: 'A period is calm. Nothing special is happening.' }
            - { text: 'The door opened!', effect: 'An exclamation mark adds excitement or surprise.' }
            - { text: 'The door opened…', effect: 'Trailing dots build suspense. What is behind it?' }
            - { text: 'The door opened. Slowly. Very slowly.', effect: 'Short pieces with periods slow the reader down, step by step.' }
        caption: Same words, different punctuation. How does each one make you feel?

  - title: Strong endings
    blocks:
      - type: compare
        covers: [S2.8]
        columns:
          - title: 🎀 Tie it up
            body: |-
              > Maple swam back to the dock, dropped the stick at my feet and shook water all over me. Best. Day. Ever.

              The problem is solved, and the story feels finished.
          - title: 🤔 Leave them wondering
            body: |-
              > As we drove away, I looked back at the lake. Something big was swimming toward the dock, and it wasn’t Maple.

              Readers keep thinking after the last line.
      - type: callout
        variant: mistake
        covers: [S2.8]
        title: Avoid “The end”
        body: Endings like *Then I went home. The end.* stop the story without finishing it. Tie it up, or leave a question on purpose.

  - title: Think like a creator
    blocks:
      - type: example
        covers: [K2.1, S2.1, U2.1]
        title: How Sara improved her story
        problem: Sara’s story about a lost mitten feels flat.
        steps:
          - '**Review her ideas:** “My beginning is boring.”'
          - '**Look at other creators:** “My favourite author starts with a sound.”'
          - '**Try a model:** she drafts three different beginnings, and picks the best.'
          - '**Apply feedback:** her friend says the middle is confusing, so she adds one line of dialogue to explain.'
      - type: callout
        variant: tip
        covers: [S2.2, S2.9]
        title: Fit the audience and the form
        body: |-
          - A scary story for Grade 1s needs a gentle ending.
          - To share your view on a topic, choose a form that fits, like a comic, a poster or a letter.

keyTerms:
  - term: Hook
    covers: [S2.4]
    definition: A beginning that catches the reader’s attention, such as a sound, a question, dialogue or action.
  - term: Sensory details
    covers: [S2.5]
    definition: Details that tell what you would see, hear, smell, taste or touch.
  - term: Dialogue
    covers: [K2.5]
    definition: The words characters say to each other, shown inside quotation marks.
  - term: Voice
    covers: [K2.3]
    definition: The way a writer’s choice of words and details makes the writing sound like them.
  - term: Feedback
    covers: [K2.1]
    definition: Comments from a reader that help a writer improve their work.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S2.4]
    type: mc
    prompt: Which beginning is most likely to **hook** a reader?
    choices:
      - “Get off my lunch!” I yelled at the seagull.
      - This story is about a day at the beach.
      - One day I went to the beach and it was a day.
      - My name is Jo and I am going to tell you a story.
    answer: 0
    feedback:
      '1': This tells the topic, but does it make you curious?
      '2': Does anything happen in this sentence that you want to know more about?
      '3': This introduces the writer. Does anything exciting happen?
    hints:
      - Which one drops you right into something happening?
    solution:
      - Yelling at a seagull drops you into the action, with dialogue. You want to know what happens next.

  - id: w2
    level: 1
    thinking: notice
    covers: [S2.5]
    type: mc
    prompt: Which sentence uses the most **sensory details**?
    choices:
      - Crunchy leaves snapped under my boots, and the cold air smelled like smoke.
      - It was a nice fall day, and we went for a walk.
      - Fall is my favourite season of the whole year.
      - We walked for a while, and then we went home.
    answer: 0
    feedback:
      '1': Can you see, hear or smell anything in *nice*?
      '2': This is an opinion. Which senses does it use?
      '3': This tells what happened. What can you hear or smell?
    hints:
      - Which sentence lets you hear, smell or feel something?
    solution:
      - '*Crunchy* and *snapped* are sounds. *Cold* is touch. *Smelled like smoke* is smell. You can almost be there.'

  - id: w3
    level: 1
    thinking: apply
    covers: [K2.5, S2.6]
    type: mc
    prompt: Which line of dialogue shows that Maya is **nervous**, without saying the word?
    choices:
      - '“Is it m-my turn already?” Maya asked, twisting her sleeve.'
      - '“I am nervous,” said Maya.'
      - '“Hello,” said Maya.'
      - '“Let’s go!” Maya shouted, and ran to the stage.'
    answer: 0
    feedback:
      '1': This works, but it **says** the word. Which line shows it instead?
      '2': Does *Hello* show any feeling?
      '3': Shouting and running sound excited, not nervous.
    hints:
      - Look for what she says **and** how she says it.
    solution:
      - The stutter and twisting her sleeve show her feelings. Dialogue can reveal what a character feels.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: whatif
    covers: [S2.7]
    type: mc
    prompt: |-
      A writer changes

      > The basement light flickered.

      to

      > The basement light flickered…

      What does the change do?
    choices:
      - It builds suspense, as if something is about to happen.
      - It shows that the sentence is a question.
      - It makes the reader laugh at a joke.
      - It shows that someone is shouting.
    answer: 0
    feedback:
      '1': Which mark shows a question?
      '2': Is there a joke in the sentence?
      '3': Which mark usually shows shouting?
    hints:
      - Read both aloud. What does your voice do at the trailing dots?
    solution:
      - The trailing dots make the sentence trail off. The reader waits and wonders. That builds **suspense**.

  - id: b2
    level: 2
    thinking: flaw
    covers: [S2.8]
    type: mc
    prompt: |-
      Ben’s story is about a puppy that runs away during a storm. His ending is:

      > Then I went to bed. The end.

      What is wrong with this ending?
    choices:
      - It doesn’t tell us if the puppy came back, and it isn’t a question on purpose.
      - It is too short, because endings must be at least a paragraph long.
      - It uses the word *I*, and endings can never use *I*.
      - Nothing, because every story should end with *The end*.
    answer: 0
    feedback:
      '1': Short endings can be strong. What is missing from this one?
      '2': Plenty of great endings use *I*. What about the puppy?
      '3': Does the reader know what happened to the puppy?
    hints:
      - What was the story’s problem? Is it solved?
    solution:
      - The story was about the lost puppy, but the ending never says what happened to it.
      - Ben could tie it up (the puppy comes back) or leave readers wondering on purpose (a scratch at the door…).

  - id: b3
    level: 2
    thinking: decide
    covers: [S2.2, K2.3]
    type: mc
    prompt: Kai’s class won the science fair. Which version fits a **message to the whole school**, in the school newsletter?
    choices:
      - Congratulations to Room 9, who won first prize at this year’s science fair!
      - omg we WON!!! best day ever lol
      - We won. That’s all.
      - Room 9 won something at some fair, I think.
    answer: 0
    feedback:
      '1': This might fit a text to a friend. Does it fit a newsletter for the whole school?
      '2': Does this tell readers who won, and what?
      '3': Is this clear? Would readers trust it?
    hints:
      - Who reads a newsletter? What do they need to know?
    solution:
      - A newsletter goes to everyone, so it needs clear, complete words. The audience and the form shape the word choice.

  - id: b4
    level: 2
    thinking: model
    covers: [K2.1, S2.1]
    type: mc
    prompt: A friend reads Zoe’s story and says, “I got lost in the middle. I didn’t know why the dog was in the tree.” What is the best way for Zoe to **apply this feedback**?
    choices:
      - Add a sentence in the middle that shows how the dog got into the tree.
      - Delete the dog from the story completely.
      - Keep the story the same, because it’s her story.
      - Make the beginning longer, so the middle is easier.
    answer: 0
    feedback:
      '1': The dog might be the best part. Is there a smaller fix?
      '2': Feedback helps a writer see what readers need. Should she ignore it?
      '3': The problem is in the middle. Would a longer beginning fix it?
    hints:
      - What exactly confused the reader? What would fix just that?
    solution:
      - The feedback points to one spot. Adding one clear sentence there fixes the problem and keeps her story.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: design
    covers: [S2.4, S2.6, S2.8, K2.5]
    type: investigation
    prompt: |-
      Here is a plain story. Let’s craft it.

      > I went camping. A raccoon took our food. My sister was mad. We ate crackers instead.
    parts:
      - type: mc
        prompt: Which beginning makes the best **hook**?
        choices:
          - 'Rustle. Rustle. Something was in our cooler.'
          - I went camping with my family last summer.
          - This is a story about camping.
          - Camping is something that many families do.
        answer: 0
        feedback:
          '1': It is true, but does it make you curious?
          '2': This tells the topic. Is anything happening yet?
          '3': This is a fact about families. Where is the story?
        hints:
          - Which one starts with a sound or action?
        solution:
          - A sound and a mystery pull readers in right away.
      - type: mc
        prompt: Which line of dialogue best shows that the sister is **mad** and moves the story forward?
        choices:
          - '“That raccoon stole my marshmallows!” my sister growled. “Now what do we eat?”'
          - '“I am mad,” said my sister.'
          - '“Hi,” said my sister.'
          - '“Look at the stars,” said my sister.'
        answer: 0
        feedback:
          '1': It tells the feeling, but does it show it, or move the story?
          '2': Does *Hi* show a feeling?
          '3': It’s a nice line, but is she mad? Does it lead to the crackers?
        hints:
          - Which line shows the feeling **and** leads to what happens next?
        solution:
          - '*Growled* shows she’s mad, and her question leads to the crackers. The dialogue does two jobs.'
      - type: open
        prompt: Write a new **ending** that leaves readers wondering, instead of “We ate crackers instead.”
        modelAnswer: We ate crackers by the fire. Then, from the dark trees, came a tiny crunch… crunch… crunch.
        rubric:
          - My ending finishes the camping story.
          - It leaves readers with a question or a surprise.
          - It doesn’t end with “The end.”
    wrapUp: The events didn’t change. The craft did. A hook, a living line of dialogue and a strong ending make readers care.

  - id: d2
    level: 3
    thinking: why
    covers: [S2.3, K2.4, S2.5]
    type: mc
    prompt: |-
      An author writes:

      > The rink was a frozen mirror. My skates whispered across it.

      Why is this writing effective?
    choices:
      - The comparisons help you see how smooth the ice is and hear how quietly you glide.
      - It tells you exactly how many people were at the rink that day.
      - It uses lots of long words, and long words always make writing better.
      - It gives instructions for how to skate safely on a rink.
    answer: 0
    feedback:
      '1': Is there a number anywhere in it?
      '2': Count the long words. Are there many? What really makes it work?
      '3': Does it tell you what to do?
    hints:
      - What does *frozen mirror* make you see? What does *whispered* make you hear?
    solution:
      - A mirror is smooth and shiny, so you picture glassy ice. Skates can’t really whisper, so you hear a soft, quiet glide.
      - Figurative language makes a reader see and hear the moment. That is why it works.
