id: area-tiling
grade: 4
subject: math
organizingIdea: MAT-OI5
outcomes: [MAT4-OI5-GQ1-LO1]
order: 13
title: Measuring Area by Tiling
shortTitle: Area by tiling
summary: >-
  Measure area by covering a shape with units, with no gaps or overlaps. Use square centimetres,
  see that moving pieces keeps the area, and estimate areas.

bigIdea: |-
  - **Area** is the amount of flat space inside a shape.
  - To measure it, **tile** the shape with equal units, with **no gaps** and **no overlaps**, and count them.
  - The **square centimetre** (cm²) is a standard unit. Cutting and moving the pieces doesn’t change the area.

lesson:
  - title: Cover it with tiles
    blocks:
      - type: visual
        covers: [K1.1, S1.3, S1.4, U1.1, K1.3]
        component: tile-cover
        props: { mode: tile }
        caption: |-
          1. Pick a unit and press **Cover it**.
          2. Try every unit. Which ones leave gaps?
      - type: callout
        variant: remember
        covers: [MAT3-OI5-GQ1-LO1#K2.1]
        title: Remember from Grade 3
        body: The **perimeter** is the length all the way **around** a shape. Area is different. It measures the space **inside**.

  - title: The unit changes the count
    blocks:
      - type: table
        covers: [K1.2, U1.4, K1.3]
        caption: The same rectangle, covered with different units.
        headers: [Unit, How many cover it]
        rows:
          - ['Big squares', '6']
          - ['Rectangles', '12']
          - ['Small squares', '24']
          - ['Triangles', '48']
      - type: callout
        variant: tip
        covers: [U1.4, K1.2]
        title: Smaller unit, bigger number
        body: |-
          - A unit doesn’t have to look like the shape. Triangles can measure a rectangle.
          - Pick a unit that fits the size of the area.

  - title: Square centimetres
    blocks:
      - type: figure
        covers: [S1.5, K1.3]
        figure: |-
          <svg viewBox="0 0 220 150" class="fig-svg fig-svg--square" role="img" aria-label="A shape drawn on a grid of 1 cm squares. The bottom two rows are 4 squares long, and the top row is 2 squares long."><rect class="fig-rect" style="stroke:none" x="20" y="20" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="20" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="20" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="92" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="128" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="20" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="92" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="128" y="92" width="36" height="36"/><line class="fig-grid" x1="20" y1="20" x2="20" y2="128"/><line class="fig-grid" x1="56" y1="20" x2="56" y2="128"/><line class="fig-grid" x1="92" y1="20" x2="92" y2="128"/><line class="fig-grid" x1="128" y1="20" x2="128" y2="128"/><line class="fig-grid" x1="164" y1="20" x2="164" y2="128"/><line class="fig-grid" x1="200" y1="20" x2="200" y2="128"/><line class="fig-grid" x1="20" y1="20" x2="200" y2="20"/><line class="fig-grid" x1="20" y1="56" x2="200" y2="56"/><line class="fig-grid" x1="20" y1="92" x2="200" y2="92"/><line class="fig-grid" x1="20" y1="128" x2="200" y2="128"/><path style="fill:none;stroke:var(--ink);stroke-width:3" d="M20 20 L92 20 L92 56 L164 56 L164 128 L20 128 Z"/><rect class="fig-hl" x="170" y="98" width="24" height="24"/><text class="fig-small" x="182" y="144" text-anchor="middle">1 cm²</text></svg>
        caption: Each square is **1 square centimetre** (1 cm²), a square 1 cm by 1 cm. Count the squares. This shape covers **10 cm²**.
      - type: compare
        covers: [K2.1, S2.1]
        columns:
          - title: A referent for 1 cm²
            body: The nail on your **little finger** covers about 1 cm².
          - title: Another referent
            body: A **key** on a calculator covers about 1 cm².

  - title: Move the pieces, keep the area
    blocks:
      - type: visual
        covers: [U1.3, S1.2]
        component: tile-cover
        props: { mode: star }
        caption: |-
          - **Star blankets** are made and given as gifts of honour by Plains First Nations, including the Lakota, Dakota and Nakota peoples.
          - The eight-point star is sewn from many small diamonds. Press the button to slide them into a strip.

  - title: Estimate the area
    blocks:
      - type: figure
        covers: [S2.2, S2.3, U2.1]
        figure: |-
          <svg viewBox="0 0 300 200" class="fig-svg" role="img" aria-label="A leaf shape drawn on a grid of 1 cm squares. It covers some squares fully and many squares partly."><path class="cg-poly" d="M30 100 C 70 30, 200 20, 270 100 C 200 180, 70 170, 30 100 Z"/><line class="fig-grid" x1="6" y1="4" x2="6" y2="196"/><line class="fig-grid" x1="38" y1="4" x2="38" y2="196"/><line class="fig-grid" x1="70" y1="4" x2="70" y2="196"/><line class="fig-grid" x1="102" y1="4" x2="102" y2="196"/><line class="fig-grid" x1="134" y1="4" x2="134" y2="196"/><line class="fig-grid" x1="166" y1="4" x2="166" y2="196"/><line class="fig-grid" x1="198" y1="4" x2="198" y2="196"/><line class="fig-grid" x1="230" y1="4" x2="230" y2="196"/><line class="fig-grid" x1="262" y1="4" x2="262" y2="196"/><line class="fig-grid" x1="294" y1="4" x2="294" y2="196"/><line class="fig-grid" x1="6" y1="4" x2="294" y2="4"/><line class="fig-grid" x1="6" y1="36" x2="294" y2="36"/><line class="fig-grid" x1="6" y1="68" x2="294" y2="68"/><line class="fig-grid" x1="6" y1="100" x2="294" y2="100"/><line class="fig-grid" x1="6" y1="132" x2="294" y2="132"/><line class="fig-grid" x1="6" y1="164" x2="294" y2="164"/><line class="fig-grid" x1="6" y1="196" x2="294" y2="196"/></svg>
        caption: |-
          1. Count the squares that are **full**: about 10.
          2. Pair up the **part** squares. Two parts make about one whole: 22 parts make about 11.
          3. The leaf covers about \(10 + 11 = 21\) cm². That is close enough when you only need an estimate.

keyTerms:
  - term: Area
    covers: [U1.1]
    definition: The amount of flat space inside a shape.
  - term: Tiling
    covers: [K1.1]
    definition: Covering a shape with copies of one unit, with no gaps and no overlaps.
  - term: Square centimetre (cm²)
    covers: [S1.5, K2.1]
    definition: The area of a square 1 cm by 1 cm.
  - term: Referent
    covers: [S2.1]
    definition: Something familiar you use to picture a unit, like a fingernail for 1 cm².

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.1, S1.3]
    type: multi
    prompt: Select **all** the units that could measure the area of a rectangle with **no gaps and no overlaps**.
    choices: ['Equal squares', 'Equal triangles cut from squares', 'Equal rectangles', 'Equal circles', 'Equal ovals']
    answer: [0, 1, 2]
    feedback:
      '3': 'Circles touch only at points. The spaces between them are part of the area, but they wouldn’t be counted.'
      '4': 'Ovals have curved sides, so they leave gaps when they are placed side by side.'
    hints:
      - Picture placing the units side by side. Do any leave spaces?
    solution:
      - 'Squares, triangles cut from squares and rectangles fit together with **no gaps**, so they can tile.'
      - 'Circles and ovals leave gaps, so they don’t measure area well.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.5, S1.4]
    type: number
    figure: |-
      <svg viewBox="0 0 220 150" class="fig-svg fig-svg--square" role="img" aria-label="A shape drawn on a grid of 1 cm squares. The bottom two rows are 4 squares long, and the top row is 2 squares long."><rect class="fig-rect" style="stroke:none" x="20" y="20" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="20" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="20" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="92" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="128" y="56" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="20" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="56" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="92" y="92" width="36" height="36"/><rect class="fig-rect" style="stroke:none" x="128" y="92" width="36" height="36"/><line class="fig-grid" x1="20" y1="20" x2="20" y2="128"/><line class="fig-grid" x1="56" y1="20" x2="56" y2="128"/><line class="fig-grid" x1="92" y1="20" x2="92" y2="128"/><line class="fig-grid" x1="128" y1="20" x2="128" y2="128"/><line class="fig-grid" x1="164" y1="20" x2="164" y2="128"/><line class="fig-grid" x1="200" y1="20" x2="200" y2="128"/><line class="fig-grid" x1="20" y1="20" x2="200" y2="20"/><line class="fig-grid" x1="20" y1="56" x2="200" y2="56"/><line class="fig-grid" x1="20" y1="92" x2="200" y2="92"/><line class="fig-grid" x1="20" y1="128" x2="200" y2="128"/><path style="fill:none;stroke:var(--ink);stroke-width:3" d="M20 20 L92 20 L92 56 L164 56 L164 128 L20 128 Z"/><rect class="fig-hl" x="170" y="98" width="24" height="24"/><text class="fig-small" x="182" y="144" text-anchor="middle">1 cm²</text></svg>
    prompt: Each small square is **1 cm²**. What is the area of the shape?
    unit: cm²
    answer: 10
    verify: 4 + 4 + 2
    hints:
      - Count the squares row by row.
    solution:
      - 'The bottom two rows have 4 squares each, and the top row has 2.'
      - '\(4 + 4 + 2 = 10\), so the area is **10 cm²**.'

  - id: w3
    level: 1
    thinking: notice
    covers: [K1.2, U1.4]
    type: mc
    prompt: Ana covers a table with **12** big tiles. Ben covers the same table with **48** small tiles. Why are their numbers different?
    choices:
      - Ben’s tiles are smaller, so more of them fit.
      - One of them must have counted wrong.
      - Ben’s table has a bigger area.
      - The area changes with the kind of tile.
    answer: 0
    feedback:
      '1': 'Both could be right. Compare the size of their tiles.'
      '2': 'It is the same table, so it has the same area.'
      '3': 'The table doesn’t change. Only the number of tiles does.'
    hints:
      - Is it the same table? What is different about the tiles?
    solution:
      - 'The table’s area is the same. Ben used **smaller** tiles, so it took more of them.'
      - 'Each big tile covers the same space as 4 small tiles, since \(12 \times 4 = 48\).'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [S2.2, K2.1, S2.1]
    type: mc
    prompt: The nail on your little finger covers about **1 cm²**. About how many little fingernails would cover a playing card?
    choices: ['About 50', 'About 5', 'About 500', 'About 5 000']
    answer: 0
    feedback:
      '1': 'Picture fingernails along the short side of a card. More than 5 fit in just one row.'
      '2': 'A card fits in your hand. Picture how many fingernails fit in one row, and how many rows.'
      '3': 'That would cover a whole table. A card is much smaller.'
    hints:
      - About how many fingernails fit along the short side? Along the long side?
      - A card is about 6 cm by 9 cm.
    solution:
      - 'About 6 fingernails fit along the short side and about 9 along the long side.'
      - 'That is about 9 rows of 6, or about **50** fingernails, so the card is about 50 cm².'

  - id: b2
    level: 2
    thinking: estimate
    covers: [S2.3, U2.1]
    type: number
    figure: |-
      <svg viewBox="0 0 300 200" class="fig-svg" role="img" aria-label="A leaf shape drawn on a grid of 1 cm squares. It covers some squares fully and many squares partly."><path class="cg-poly" d="M30 100 C 70 30, 200 20, 270 100 C 200 180, 70 170, 30 100 Z"/><line class="fig-grid" x1="6" y1="4" x2="6" y2="196"/><line class="fig-grid" x1="38" y1="4" x2="38" y2="196"/><line class="fig-grid" x1="70" y1="4" x2="70" y2="196"/><line class="fig-grid" x1="102" y1="4" x2="102" y2="196"/><line class="fig-grid" x1="134" y1="4" x2="134" y2="196"/><line class="fig-grid" x1="166" y1="4" x2="166" y2="196"/><line class="fig-grid" x1="198" y1="4" x2="198" y2="196"/><line class="fig-grid" x1="230" y1="4" x2="230" y2="196"/><line class="fig-grid" x1="262" y1="4" x2="262" y2="196"/><line class="fig-grid" x1="294" y1="4" x2="294" y2="196"/><line class="fig-grid" x1="6" y1="4" x2="294" y2="4"/><line class="fig-grid" x1="6" y1="36" x2="294" y2="36"/><line class="fig-grid" x1="6" y1="68" x2="294" y2="68"/><line class="fig-grid" x1="6" y1="100" x2="294" y2="100"/><line class="fig-grid" x1="6" y1="132" x2="294" y2="132"/><line class="fig-grid" x1="6" y1="164" x2="294" y2="164"/><line class="fig-grid" x1="6" y1="196" x2="294" y2="196"/></svg>
    prompt: Each square is **1 cm²**. Estimate the area of this leaf. A close estimate counts.
    unit: cm²
    answer: 19
    tolerance: 3
    verify: 10 + 9
    hints:
      - Count the squares that are completely inside the leaf.
      - Now look at the part squares. Two parts make about one whole.
    solution:
      - 'About 10 squares are fully inside the leaf.'
      - 'About 22 squares are partly inside. Many are only slivers, so they make about 8 to 11 whole squares.'
      - 'The leaf is about **19 cm²**. Anything from 16 to 22 is a fair estimate.'

  - id: b3
    level: 2
    thinking: why
    covers: [U1.3]
    type: mc
    prompt: Leo cuts a paper square into 4 triangles and tapes them into a long, thin shape. Mo says, "The new shape is longer, so it has **more** area." What do you tell Mo?
    choices:
      - The area is the same. The same pieces cover the same amount of space.
      - Mo is right. Longer shapes always have more area.
      - The new shape has less area, because it has gaps.
      - The area is the same, but only because there are 4 pieces.
    answer: 0
    feedback:
      '1': 'Count the pieces. Was anything added?'
      '2': 'Leo taped the pieces edge to edge. Is any paper missing?'
      '3': 'Any number of pieces works. What matters is that no piece was added or taken away.'
    hints:
      - Was any paper added or taken away?
    solution:
      - 'Leo used exactly the same paper, with no gaps or overlaps.'
      - 'So the area is **the same**. The shape changed, but the space it covers didn’t.'

  - id: b4
    level: 2
    thinking: flaw
    covers: [S1.3, K1.1]
    type: mc
    prompt: Kira measures her notebook cover with coins. 20 coins fit, so she says, "The area is exactly 20 coins." What is the problem?
    choices:
      - Round coins leave gaps, and the gaps are part of the area.
      - Coins are too small to measure a notebook.
      - She should have counted the coins around the edge.
      - Coins are not a standard unit, so they can’t be used at all.
    answer: 0
    feedback:
      '1': 'Small units can measure areas. They just take longer to count. Look at what happens between the coins.'
      '2': 'Counting around the edge measures something like the perimeter, not the area.'
      '3': 'Non-standard units can measure area. The problem is their shape.'
    hints:
      - Picture the coins side by side. What do you see between them?
    solution:
      - 'Round coins leave **gaps**. The gaps are part of the cover, but they aren’t counted.'
      - 'So 20 coins is less than the real area. Units that tile, such as squares, measure it properly.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: connect
    covers: [K1.2, U1.4, S1.4]
    type: investigation
    prompt: |-
      The school hall stage is covered exactly by **6** big square mats. Each big mat could be swapped for **4** small square mats.
    parts:
      - type: number
        prompt: How many small mats would cover the stage?
        unit: small mats
        answer: 24
        verify: 6 * 4
        hints:
          - Each big mat is the same as 4 small mats.
        solution:
          - '\(6 \times 4 = 24\) small mats.'
      - type: number
        prompt: Each small mat can be cut into **2** triangles. How many triangles would cover the stage?
        unit: triangles
        answer: 48
        verify: 24 * 2
        hints:
          - Each small mat becomes 2 triangles.
        solution:
          - '\(24 \times 2 = 48\) triangles.'
      - type: mc
        prompt: The stage was measured as 6, 24 and 48. What stays the same every time?
        choices: ['The area of the stage', 'The number of units', 'The size of each unit', 'The shape of each unit']
        answer: 0
        feedback:
          '1': 'The numbers were 6, 24 and 48. Did the count stay the same?'
          '2': 'The units got smaller each time.'
          '3': 'The units went from squares to triangles.'
        hints:
          - What didn’t change at all while you swapped mats?
        solution:
          - 'The stage never changed, so its **area** stayed the same.'
          - 'The smaller the unit, the more of them it takes.'
    wrapUp: An area can be described with many different numbers, depending on the unit. That is why everyone agrees on standard units, such as the square centimetre.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: design
    covers: [K1.1, K1.2, S1.4]
    type: build
    prompt: |-
      A floor is exactly covered by **24** small square tiles. Ms. Lam wants to use **big** tiles too. One big tile covers the same space as **4** small tiles.

      How many of each could she use? Use at least one of each kind.
    fields:
      - { name: b, label: 'Big tiles' }
      - { name: s, label: 'Small tiles' }
    rules:
      - { test: 'b % 1 == 0 && s % 1 == 0 && b > 0 && s > 0', fail: 'Use at least one of each kind, and whole tiles.' }
      - { test: '4 * b + s == 24', fail: 'Count everything in small tiles. Each big tile counts as 4. Does it make 24?' }
    examples:
      - { b: 1, s: 20 }
      - { b: 3, s: 12 }
      - { b: 5, s: 4 }
    counterexamples:
      - { b: 6, s: 0 }
      - { b: 2, s: 20 }
      - { b: 4, s: 4 }
    hints:
      - Each big tile takes the place of 4 small tiles.
      - 'Try 2 big tiles. How much space do they cover, counted in small tiles? How many small tiles are left?'
    solution:
      - 'Each big tile covers 4 small-tile spaces. The rest gets small tiles.'
      - '1 big and 20 small, 3 big and 12 small, and 5 big and 4 small all work. So do 2 and 16, and 4 and 8.'
      - 'Each one covers the same 24 small-tile spaces, with no gaps and no overlaps.'
