id: explorers-treaties
grade: 4
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [XiuhdUoB8EacTXvZQi9Djw]
order: 1
title: Explorers and the First Treaties
shortTitle: Explorers & first treaties
summary: >-
  Sail with Caboto, Cartier, de Monts and Champlain, find out why Europe sent explorers, and see how the Two
  Row Wampum set out a way to live side by side.

bigIdea: |-
  - European countries sent **explorers** across the ocean to gain **territory**, **resources** and **prestige**. This is called **expansionism**.
  - Caboto, Cartier, de Monts and Champlain sailed to the land now known as Canada.
  - First Nations and Europeans built relationships through trade, guiding, sharing knowledge and **treaties**.
  - The **Two Row Wampum** shows two peoples travelling side by side. Neither one steers the other.

lesson:
  - title: Why cross an ocean?
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: card-sort
        props:
          bins:
            - { id: territory, label: Territory, icon: 🗺️ }
            - { id: resources, label: Resources, icon: 💰 }
            - { id: prestige, label: Prestige, icon: 👑 }
          cards:
            - { text: Plant a flag and claim the land for the king., bin: territory, why: 'Claiming land makes a country bigger. That is territory.' }
            - { text: Look for gold to bring home., bin: resources, why: 'Gold is a useful, valuable thing from the land. That is a resource.' }
            - { text: Fill ships with cod from the rich fishing grounds., bin: resources, why: 'Fish could be eaten and sold. That makes it a resource.' }
            - { text: Be famous as the first to sail somewhere new., bin: prestige, why: 'Being first wins fame and respect. That is prestige.' }
            - { text: Show the other kings of Europe how powerful your country is., bin: prestige, why: 'Being admired by other countries is prestige.' }
            - { text: Start a colony so the land stays yours., bin: territory, why: 'Settlers on the land help a country hold it. That is about territory.' }
        caption: Kings and queens paid for voyages for three big reasons. Sort each goal.
      - type: compare
        covers: [K1.1, S1.1]
        columns:
          - title: 🧭 Exploring
            body: Explorers sailed out to **look**, make maps and **claim** land.
          - title: 🏘️ Starting a colony
            body: A **colony** sends settlers to **stay**. They build homes, farm and trade, so the home country can hold the land.
          - title: 🌍 Around the world
            body: European countries did both in many places, in Africa, Asia and the Americas. Wanting more land and riches is called **expansionism**.

  - title: Follow the explorers
    blocks:
      - type: visual
        covers: [K1.1, S1.3]
        component: canada-map
        props: { mode: explorers }
        caption: Choose an explorer and watch the voyage. Who sent them? Why did they come?
      - type: table
        covers: [K1.1, S1.3]
        caption: Four explorers in the curriculum
        headers: [Explorer, Sailed for, First reached]
        rows:
          - ['**Giovanni Caboto**', 'England', '1497, Newfoundland or Cape Breton']
          - ['**Jacques Cartier**', 'France', '1534, Gaspé']
          - ['**Pierre Du Gua de Monts**', 'France', '1604, Île Sainte-Croix']
          - ['**Samuel de Champlain**', 'France', '1608, Quebec']

  - title: How to investigate a voyage
    blocks:
      - type: example
        covers: [S1.3, K1.1]
        title: Cartier’s second voyage
        problem: How can you find out what really happened on an explorer’s travels?
        steps:
          - '**Who and when?** Jacques Cartier, in 1535, sent by King Francis I of France.'
          - '**Where?** Up the St. Lawrence River to Stadacona, then on to Hochelaga.'
          - '**Who did he meet?** The Stadaconans. Domagaya and Taignoagny, sons of Donnacona, guided him.'
          - '**What happened?** Rapids stopped his ships. There was no way through to Asia.'
          - '**Check the source.** Most of what we know comes from Cartier’s own record. What might it leave out?'
        answer: Ask who, when, where, who they met and what happened. Then ask whose story you are reading.

  - title: Building relationships
    blocks:
      - type: compare
        covers: [S1.2]
        columns:
          - title: 🤝 Trading
            body: First Nations traded furs for metal pots, knives and cloth.
          - title: 🧭 Guiding
            body: First Nations guides showed explorers the rivers and the way inland.
          - title: 🌲 Sharing knowledge
            body: In the winter of 1535, Domagaya showed Cartier’s sick crew how to make a cure from a tree.
          - title: 📜 Making agreements
            body: '**Treaties** set out how peoples would treat each other.'
      - type: callout
        variant: mistake
        covers: [S1.2, K1.1]
        title: Explorers didn’t find empty land
        body: Every place the explorers reached was already home to First Nations or Inuit. A claim made by a king far away didn’t make the people living there agree.

  - title: The Two Row Wampum
    blocks:
      - type: visual
        covers: [K1.2, S1.2]
        component: two-row
        caption: |-
          Press both buttons. What does each row of beads stand for?

          *The Haudenosaunee and the Dutch made this agreement. The meaning shown is as the Onondaga Nation, one of the Haudenosaunee nations, describes it.*
      - type: compare
        covers: [K1.2]
        columns:
          - title: 🪶 Wampum
            body: Beads made from shells. A **wampum belt** records an agreement, so it can be remembered and retold.
          - title: 🛶⛵ Gaswéñdah
            body: The **Two Row Wampum**. The Haudenosaunee say it was made in 1613, to start a relationship of living **side by side**.

keyTerms:
  - term: Explorer
    covers: [K1.1]
    definition: A person who travels to places that are new to them, to learn about them and often to claim them.
  - term: Expansionism
    covers: [K1.1]
    definition: When a country tries to gain more territory, resources and prestige.
  - term: Prestige
    covers: [K1.1]
    definition: Fame and respect, such as being admired by other countries.
  - term: Colony
    covers: [S1.1]
    definition: A place settled and ruled by a country far away.
  - term: Treaty
    covers: [K1.2]
    definition: An agreement between nations about how they will treat each other.
  - term: Two Row Wampum
    covers: [K1.2]
    definition: A Haudenosaunee wampum belt, also called Gaswéñdah, that records an agreement to live side by side.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.1]
    type: mc
    prompt: A king says, “If our ships reach the new land first, every kingdom in Europe will look up to us.” Which reason for exploring is the king talking about?
    choices:
      - Prestige
      - Resources
      - Territory
      - Trade
    answer: 0
    feedback:
      '1': Resources are useful things, such as gold or fish. Is the king talking about things he wants to bring home?
      '2': Territory is land a country claims. Is the king talking about the land itself?
      '3': Trade is swapping goods. Look at what the king hopes other kingdoms will do.
    hints:
      - What does the king want the other kingdoms to feel?
    solution:
      - The king wants to be **admired** by the other kingdoms.
      - Fame and respect is **prestige**.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.1, S1.3]
    type: order
    prompt: Put the explorers in order, from the first to reach the land now known as Canada to the last.
    items:
      - Giovanni Caboto
      - Jacques Cartier
      - Pierre Du Gua de Monts
      - Samuel de Champlain
    hints:
      - Look at the years in the table, or on the map.
      - Caboto came in the 1400s. The others came in the 1500s and 1600s.
    solution:
      - Caboto 1497, Cartier 1534, de Monts 1604, Champlain 1608.
      - Champlain sailed with de Monts in 1604, and later came back to found Quebec.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.2]
    type: mc
    prompt: The Haudenosaunee made the Two Row Wampum with beads. What is a belt like this **for**?
    choices:
      - Recording an agreement, so it is remembered
      - Paying for furs at a trading post
      - Marking the edge of a colony on a map
      - Decorating a canoe for a long voyage
    answer: 0
    feedback:
      '1': Wampum has many uses, but this belt holds something much bigger than a price.
      '2': The belt isn’t a map. Look at what its two rows of boats show.
      '3': The belt shows a canoe and a ship. Is it about decorating them, or about how they travel?
    hints:
      - What do the canoe and the ship on the belt do?
    solution:
      - The belt shows two vessels travelling side by side.
      - It **records an agreement**, so that people can remember it and retell it.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: evidence
    covers: [S1.3, K1.1]
    type: mc
    prompt: |-
      Here are three clues about one explorer’s travels.

      - The king of France gave him the only right to trade for furs, if he brought settlers.
      - His first winter was on a small island. Many of his men died of scurvy.
      - Next summer, he moved everyone across the bay to a sheltered harbour.

      Which explorer is it?
    choices:
      - Pierre Du Gua de Monts
      - Samuel de Champlain
      - Jacques Cartier
      - Giovanni Caboto
    answer: 0
    feedback:
      '1': Champlain was there that winter too. But who did the king give the fur trade to?
      '2': Cartier’s men were sick with scurvy too. But did Cartier bring settlers, or winter on a small island?
      '3': Caboto sailed for the king of England. Check the first clue.
    hints:
      - Which explorers sailed for France?
      - Where did the first winter happen? Find it on the map.
    solution:
      - The king of France rules out Caboto.
      - The island is Île Sainte-Croix, in 1604. The harbour is Port-Royal, in 1605.
      - The man with the fur trade rights was **de Monts**. Champlain went with him.
      - 'What we learned: one clue can fit two explorers. Use every clue.'

  - id: b2
    level: 2
    thinking: why
    covers: [S1.1, K1.1]
    type: mc
    prompt: The king of France let de Monts be the only one to trade for furs. But there was a rule. De Monts had to bring **settlers**. Why would the king want settlers, not just furs?
    choices:
      - Settlers would stay and build a colony, so France could hold the land.
      - Settlers could carry more furs home on each ship than sailors could.
      - Settlers would make the voyage faster, because more people could row.
      - Settlers were needed to find a way to Asia, because explorers had failed.
    answer: 0
    feedback:
      '1': Settlers came to stay, not to sail home. What would people staying on the land do for France?
      '2': Ships with sails don’t go faster with more rowers. What do settlers do once they arrive?
      '3': Settlers built homes and farms. Were they there to explore?
    hints:
      - What is the difference between visiting a place and staying there?
      - Which of the three reasons for exploring is about land?
    solution:
      - Furs are a **resource**. But furs alone don’t hold land.
      - Settlers stay, build homes and farm. A **colony** helps France keep the **territory**.

  - id: b3
    level: 2
    thinking: notice
    covers: [S1.2]
    type: multi
    prompt: Which of these helped **build a relationship** between First Nations and Europeans? Choose all that fit.
    choices:
      - Domagaya showed Cartier’s sick crew how to make a cure from a tree.
      - First Nations traders swapped furs for metal pots and knives.
      - Two sons of Donnacona guided Cartier up the river to Hochelaga.
      - Cartier raised a cross at Gaspé and claimed the land for France.
      - A king in Europe drew the new land on his map as his own.
    answer: [0, 1, 2]
    feedback:
      '3': A claim is one side deciding alone. Did the people living at Gaspé agree to it?
      '4': This happened far away in Europe. Did it bring the two peoples closer together?
    hints:
      - In a relationship, both sides take part. Which of these had both sides taking part?
    solution:
      - Sharing knowledge, trading and guiding all had both peoples working together.
      - Raising a cross and drawing a map were one side claiming land on its own.

  - id: b4
    level: 2
    thinking: perspective
    covers: [K1.2, S1.2]
    type: mc
    prompt: In a made-up story, a ship’s captain tells the people in a canoe, “Follow our laws and paddle where we say.” Would the people who made the Two Row Wampum say this fits their agreement?
    choices:
      - No. Each people steers its own vessel and keeps its own laws.
      - Yes. The ship is bigger, so it should lead the way.
      - Yes. The two vessels travel together, so they need one set of laws.
      - No. The canoe and the ship were never meant to meet.
    answer: 0
    feedback:
      '1': The two rows on the belt are the same size. Does the belt show one vessel leading?
      '2': They travel side by side, but in separate rows. Does that mean sharing one set of laws?
      '3': They share the same river and travel together in peace. They just don’t steer each other.
    hints:
      - Look at the belt. Does one row cross into the other?
      - Try the “What if” button.
    solution:
      - On the belt, the two rows never cross. Each vessel carries its own people, laws and ways of life.
      - Telling the canoe where to go is steering it. That breaks the agreement.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [K1.1, S1.2, S1.3]
    type: investigation
    prompt: |-
      In July 1534, at Gaspé, Cartier’s men raised a tall cross. It said “Long live the King of France”.

      Cartier wrote down what happened next. Donnacona paddled up and gave a long speech. He pointed to the cross, then to all the land around.
    parts:
      - type: mc
        prompt: What did the cross mean to **Cartier**?
        choices:
          - He was claiming the land for France.
          - He was thanking Donnacona’s people for their help.
          - He was marking where his crew had buried a friend.
          - He was showing ships where to find good fishing.
        answer: 0
        feedback:
          '1': Read the words on the cross again. Who are they about?
          '2': The cross named the King of France. What do explorers do for their king?
          '3': Fish were a resource, but the cross names a king. What did explorers claim for kings?
        hints:
          - Whose name is on the cross?
        solution:
          - The cross named the King of France. Cartier was claiming **territory**.
      - type: mc
        prompt: Cartier wrote that Donnacona pointed to the cross, then to the land. What was Donnacona most likely saying?
        choices:
          - This land is ours, and you didn’t ask us.
          - Thank you for the beautiful cross.
          - Please take the land, we don’t need it.
          - The cross is in the wrong place for ships.
        answer: 0
        feedback:
          '1': Would someone give a long, strong speech to say thank you?
          '2': Donnacona’s people had come to Gaspé to fish. Would they give their fishing place away?
          '3': Why would he point to all the land around, if he was talking about ships?
        hints:
          - He pointed at the cross, then at all the land. What links the two?
        solution:
          - Pointing from the cross to the land connects the two. Donnacona was talking about who the land belonged to.
          - Cartier himself wrote that it seemed Donnacona was saying the land was his, and the cross needed his permission.
      - type: mc
        prompt: Cartier told Donnacona the cross was only a sign to guide ships. What does this tell you about this first meeting?
        choices:
          - Cartier hid his real plan, so this was not a fair agreement.
          - Both sides agreed to share the land, like a treaty.
          - Donnacona agreed that France now owned the land.
          - Cartier was right, because the cross was only a sign.
        answer: 0
        feedback:
          '1': A treaty needs both sides to agree to the same thing. Did they?
          '2': Donnacona was told the cross was for ships. Could he have agreed to something he wasn’t told?
          '3': Look back at part 1. What did the words on the cross say?
        hints:
          - What did Cartier really mean by the cross? What did he tell Donnacona?
        solution:
          - Cartier meant to claim the land, but said it was only for ships.
          - One side didn’t know the real plan. That isn’t a fair agreement.
    wrapUp: A claim is one side deciding. A treaty, like the Two Row Wampum, needs both sides to agree to the same thing. Even Cartier’s own record shows Donnacona didn’t agree.

  - id: d2
    level: 3
    thinking: decide
    covers: [S1.1, K1.1]
    type: multi
    prompt: |-
      Mila says, “Explorers only came for one reason: riches.” Which facts show that Mila is **missing** something? Choose all that do.
    choices:
      - Cartier raised a cross to claim the land for France.
      - Caboto’s king wanted England to be as famous as Spain and Portugal.
      - De Monts had to bring settlers to start a colony.
      - Caboto reported seas full of cod.
      - Cartier hoped to find gold.
    answer: [0, 1, 2]
    feedback:
      '3': Cod was something to eat and sell. Does that show a reason Mila left out?
      '4': Gold is riches. That fits what Mila already said.
    hints:
      - Mila named only one of the three reasons. Which two did she leave out?
      - For each fact, ask if it is about land, about riches, or about fame.
    solution:
      - Cod and gold are **resources**, which is what Mila meant by riches.
      - Claiming land and starting a colony are about **territory**. Being as famous as Spain and Portugal is about **prestige**.
      - Mila is partly right. Riches mattered, but so did land and fame.
