id: new-france
grade: 4
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [0wljZtRYSEWZJy95aOsmxg]
order: 2
title: New France and the First Colonies
shortTitle: New France & first colonies
summary: >-
  Watch Port-Royal, Quebec, Trois-Rivières and Montreal appear, meet the people who came to New France, and
  see what flowed between colonies and home countries.

bigIdea: |-
  - France founded **Acadia**, **New France** and **Louisiana**. Britain founded the **Thirteen Colonies**. New France began European colonization of Canada.
  - Kings claimed land where Indigenous peoples already lived, around the world. This is called **imperialism**.
  - Colonists came for farmland, business, religious freedom, a better life and adventure. They faced cold winters, sickness and war.
  - Colonies sent furs, lumber, crops and minerals home. Home countries sent settlers, goods and rules.

lesson:
  - title: The first colonies
    blocks:
      - type: visual
        covers: [K1.3, U1.1]
        component: canada-map
        props: { mode: colonies }
        caption: Tap each colony. Which country founded it?
      - type: compare
        covers: [K1.4, U1.1]
        columns:
          - title: 👑 Imperialism
            body: Kings and queens of Europe made their **empires** bigger by claiming land and starting colonies, all around the world.
          - title: 🏕️ Already home
            body: The land was already home to Indigenous peoples. In North America, that meant First Nations and Inuit.
          - title: ⚜️ New France first
            body: France’s colony on the St. Lawrence began European **colonization** of Canada.

  - title: Settlements along the river
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: canada-map
        props: { mode: dots, set: settlements }
        caption: Press Play. Where did each new settlement grow?
      - type: callout
        variant: tip
        covers: [K1.1, S1.1]
        title: The river was the road
        body: Quebec, Trois-Rivières and Montreal are all on the **St. Lawrence River**. Ships from France and canoes full of furs travelled on it.
      - type: compare
        covers: [K1.2]
        columns:
          - title: 🏰 Founder
            body: '**Samuel de Champlain** built Quebec in 1608.'
          - title: 📜 Governor
            body: He became the **governor** of New France, ruling it for the king.
          - title: 🤝 Allies
            body: He made **alliances** with the Innu, Algonquin and Wendat, who traded furs with the French.

  - title: Hard times in a new land
    blocks:
      - type: figure
        covers: [S1.1, S1.2]
        figure: |-
          <svg viewBox="0 0 420 200" class="fig-svg" role="img" aria-label="28 people. 8 are coloured in: the men who lived through the first winter at Quebec. The other 20 are outlines."><g class="fig-hl"><circle cx="40" cy="22" r="7"/><path d="M29 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="97" cy="22" r="7"/><path d="M86 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="154" cy="22" r="7"/><path d="M143 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="211" cy="22" r="7"/><path d="M200 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="268" cy="22" r="7"/><path d="M257 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="325" cy="22" r="7"/><path d="M314 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="382" cy="22" r="7"/><path d="M371 42q11-18 22 0z"/></g><g class="fig-hl"><circle cx="40" cy="64" r="7"/><path d="M29 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="97" cy="64" r="7"/><path d="M86 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="154" cy="64" r="7"/><path d="M143 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="211" cy="64" r="7"/><path d="M200 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="268" cy="64" r="7"/><path d="M257 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="325" cy="64" r="7"/><path d="M314 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="382" cy="64" r="7"/><path d="M371 84q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="40" cy="106" r="7"/><path d="M29 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="97" cy="106" r="7"/><path d="M86 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="154" cy="106" r="7"/><path d="M143 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="211" cy="106" r="7"/><path d="M200 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="268" cy="106" r="7"/><path d="M257 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="325" cy="106" r="7"/><path d="M314 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="382" cy="106" r="7"/><path d="M371 126q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="40" cy="148" r="7"/><path d="M29 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="97" cy="148" r="7"/><path d="M86 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="154" cy="148" r="7"/><path d="M143 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="211" cy="148" r="7"/><path d="M200 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="268" cy="148" r="7"/><path d="M257 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="325" cy="148" r="7"/><path d="M314 168q11-18 22 0z"/></g><g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"><circle cx="382" cy="148" r="7"/><path d="M371 168q11-18 22 0z"/></g></svg>
        caption: 'Champlain wrote that of his 28 men, only 8 lived through the first winter at Quebec. Most died of **scurvy**, a sickness from not eating fresh food.'
      - type: table
        covers: [S1.1, S1.2]
        caption: Challenges of building settlements
        headers: [Challenge, What it meant]
        rows:
          - ['❄️ **Long, cold winters**', 'Rivers froze, so no ships could come from France until spring.']
          - ['🤒 **Sickness**', 'Scurvy and other sicknesses killed many newcomers.']
          - ['👥 **Few settlers**', 'In 1666, the first census counted only 3,215 people in New France.']
          - ['⚔️ **War**', 'The French and their allies were at war with the Haudenosaunee, so Montreal was often attacked.']

  - title: Why people came
    blocks:
      - type: visual
        covers: [K1.5, S1.2]
        component: card-sort
        props:
          bins:
            - { id: farm, label: Farmland, icon: 🌾 }
            - { id: business, label: Business, icon: 💼 }
            - { id: religion, label: Religious freedom, icon: ⛪ }
            - { id: life, label: Quality of life, icon: 🏡 }
            - { id: adventure, label: Adventure, icon: 🧭 }
          cards:
            - { text: 'Louis Hébert and his family came to Quebec in 1617 to clear land and grow crops.', bin: farm, why: 'They wanted land of their own to farm.' }
            - { text: 'Merchants came to buy furs and sell goods, hoping to get rich.', bin: business, why: 'Buying and selling to make money is business.' }
            - { text: 'In 1620, the Pilgrims sailed to Plymouth, in what became the Thirteen Colonies, to worship in their own way.', bin: religion, why: 'They wanted to follow their beliefs without being punished.' }
            - { text: 'About 800 young women, the filles du roi, came from France to start new families.', bin: life, why: 'Many hoped for a better life, with land and a home.' }
            - { text: 'Young Étienne Brûlé came with Champlain and went to live among the Wendat.', bin: adventure, why: 'He wanted to see new places and live a new kind of life.' }
        caption: Colonists came for many reasons. Sort each person or group.
      - type: table
        covers: [K1.6, S1.2]
        caption: What colonists brought with them
        headers: [They brought, In New France]
        rows:
          - ['⛪ **Religion**', 'Catholic priests and nuns built churches and taught their faith.']
          - ['📜 **Leadership**', 'A governor ruled for the king of France.']
          - ['📚 **Education**', 'In 1639, Marie de l’Incarnation started a school for girls in Quebec.']
          - ['🏥 **Health care**', 'Jeanne Mance helped found Montreal and started its first hospital.']

  - title: Colony and home country
    blocks:
      - type: visual
        covers: [K1.7, S1.3]
        component: card-sort
        props:
          bins:
            - { id: home, label: To the home country, icon: '🚢➡️' }
            - { id: colony, label: To the colony, icon: '⬅️🚢' }
          cards:
            - { text: Beaver furs, bin: home, why: 'Furs were the colony’s most valuable natural resource.' }
            - { text: Tall trees cut into lumber, bin: home, why: 'Lumber was a natural resource, used to build ships and houses in Europe.' }
            - { text: Metal tools and cloth, bin: colony, why: 'These were made in Europe and shipped to the colonies.' }
            - { text: New settlers, bin: colony, why: 'The home country sent people to live in the colony.' }
            - { text: Grain and tobacco from the farms, bin: home, why: 'Agricultural products were shipped from the colonies to Europe.' }
            - { text: 'Orders from the king', bin: colony, why: 'The king and his officials made the rules the colony had to follow.' }
            - { text: Minerals dug from the ground, bin: home, why: 'Minerals such as iron were natural resources the colonies sent home.' }
        caption: Ships crossed the ocean both ways. Which way did each thing go?
      - type: compare
        covers: [S1.3]
        columns:
          - title: 🏛️ The home country got
            body: Natural resources, such as **furs**, **lumber**, **agricultural products** and **minerals**, and more land for its empire.
          - title: ⚜️ The colony got
            body: Settlers, goods made in Europe and soldiers. But it had to follow the **king’s rules**.

keyTerms:
  - term: Colony
    covers: [K1.3]
    definition: A settlement or area ruled by a country far away, called its home country.
  - term: Colonization
    covers: [U1.1, K1.4]
    definition: When a country sends settlers to take over and rule land far away.
  - term: Imperialism
    covers: [K1.4]
    definition: When kings and queens make their empires bigger by claiming land where other peoples already live.
  - term: Governor
    covers: [K1.2]
    definition: The person who ruled a colony for the king.
  - term: Alliance
    covers: [K1.2]
    definition: An agreement between groups to help each other, in trade or in war.
  - term: Natural resource
    covers: [K1.7]
    definition: Something useful from nature, such as furs, trees or minerals.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.1]
    type: number
    prompt: Champlain founded Quebec in **1608**. Montreal was founded in **1642**. How many years later was Montreal founded?
    answer: 34
    unit: years
    verify: 1642 - 1608
    hints:
      - Which year is later? Start from that one.
      - Take the earlier year away from the later year.
    solution:
      - '\(1642 - 1608 = 34\)'
      - Montreal was founded 34 years after Quebec.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.3]
    type: multi
    prompt: Which colonies did **France** found? Choose all of them.
    choices:
      - Acadia
      - New France
      - Louisiana
      - The Thirteen Colonies
    answer: [0, 1, 2]
    feedback:
      '3': The Thirteen Colonies were founded by Britain, along the Atlantic coast.
    hints:
      - Look at the colours on the colonies map.
    solution:
      - France founded **Acadia**, **New France** and **Louisiana**.
      - Britain founded the **Thirteen Colonies**.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.6]
    type: mc
    prompt: In 1639, Marie de l’Incarnation came to Quebec and opened a school for girls. What did she bring to the colony?
    choices:
      - Education
      - Health care
      - Leadership
      - Farmland
    answer: 0
    feedback:
      '1': Health care is about helping sick people, such as in a hospital. What happens in a school?
      '2': Leadership is about ruling the colony, as a governor did. Did she rule?
      '3': Farmland is a reason people came, not something they brought. What did her school give?
    hints:
      - What do children do at school?
    solution:
      - A school teaches children. Marie de l’Incarnation brought **education**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: why
    covers: [K1.1, S1.1]
    type: mc
    prompt: Quebec, Trois-Rivières and Montreal were all built on the St. Lawrence River. Why would settlers choose the riverbank?
    choices:
      - Ships from France and canoes with furs could reach them by water.
      - The river kept the settlements warm, so winters were mild.
      - Nobody else lived near the river, so the land was empty.
      - The river was the border between New France and Acadia.
    answer: 0
    feedback:
      '1': The winters were long and cold, and the river froze. What did the river help with in summer?
      '2': First Nations lived and travelled along the river long before the French came.
      '3': Look at the colonies map. Is Acadia across the river from Quebec?
    hints:
      - How did people and goods travel before there were roads?
    solution:
      - The river was the road. Ships brought settlers and supplies, and canoes brought furs to trade.
      - A town on the river could be reached by water.

  - id: b2
    level: 2
    thinking: evidence
    covers: [K1.5, S1.2]
    type: mc
    prompt: |-
      Here is part of a made-up letter, written in New France in 1667.

      *“Dear sister, in France we had no land of our own. Here, my husband and I were given land by the river. We cleared the trees ourselves. Next year we will plant wheat.”*

      Which reason for coming does the letter show **best**?
    choices:
      - Farmland
      - Business
      - Religious freedom
      - Adventure
    answer: 0
    feedback:
      '1': Business is about buying and selling to make money. What is the writer planning to do with the land?
      '2': The letter doesn’t say anything about worship or beliefs.
      '3': Moving far away can be an adventure. But what does the writer keep talking about?
    hints:
      - What did the writer not have in France? What do they have now?
    solution:
      - The writer had no land in France. In New France, they got land, cleared it and planned to plant wheat.
      - That is **farmland**.

  - id: b3
    level: 2
    thinking: connect
    covers: [K1.7, S1.3]
    type: mc
    prompt: A ship leaves Quebec full of beaver furs. Months later, it comes back with cloth, tools and new settlers. What does this show about the colony and France?
    choices:
      - Each needed something from the other.
      - The colony didn’t need France at all.
      - France sent everything and got nothing back.
      - The colony and France traded only furs for furs.
    answer: 0
    feedback:
      '1': Where did the cloth, tools and new settlers come from?
      '2': What did the ship carry when it left Quebec?
      '3': Look at what came back. Was it more furs?
    hints:
      - What went to France? What came back?
    solution:
      - France got **furs**, a natural resource. The colony got goods made in Europe, and more people.
      - Each one needed something from the other. That is how home countries and colonies were linked.

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.2, K1.6]
    type: multi
    prompt: Immigrants faced **challenges** and made **contributions**. Choose every **contribution**.
    choices:
      - Jeanne Mance started Montreal’s first hospital.
      - Louis Hébert’s family cleared land and grew food.
      - Many filles du roi raised families. Many French Canadians today are their descendants.
      - Many settlers died of scurvy in their first winter.
      - Ships from France couldn’t come while the river was frozen.
    answer: [0, 1, 2]
    feedback:
      '3': This was a hard thing that happened to settlers. Did it give something to the colony?
      '4': This made life harder for settlers. Is it something they gave?
    hints:
      - A contribution is something a person gives or builds that helps others.
      - Which of these were done by the immigrants? Which happened to them?
    solution:
      - A hospital, food and families helped the colony grow. Those are **contributions**.
      - Scurvy and frozen rivers made life hard. Those are **challenges**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: decide
    covers: [S1.3, K1.7]
    type: investigation
    prompt: |-
      In a made-up year, traders from the Thirteen Colonies offer the people of New France more for their furs than French merchants pay. The colonists want to sell to them. But the king of France says no. Furs from New France must go to France.
    parts:
      - type: mc
        prompt: Why would the king say no?
        choices:
          - He wanted the colony’s furs to make France rich.
          - He wanted to keep the colonists from getting cold.
          - He thought the furs were too poor for Britain.
          - He wanted the Thirteen Colonies to grow.
        answer: 0
        feedback:
          '1': The colonists were selling these furs, not wearing them. Who gets the furs if the king says no?
          '2': The traders offered more. Would they offer more for poor furs?
          '3': The Thirteen Colonies belonged to Britain, France’s rival. Would France want to help them?
        hints:
          - Who gets the furs if the king says no?
        solution:
          - Colonies sent natural resources home. The king wanted that wealth for **France**.
      - type: mc
        prompt: Who gains from the king’s rule, and who loses?
        choices:
          - France gains, and the colonists lose the better price.
          - The colonists gain, and France loses its furs.
          - Both gain the same, because the rule is fair.
          - Nobody gains or loses, because furs are only furs.
        answer: 0
        feedback:
          '1': Under the rule, where do the furs go? Do the colonists get the higher price?
          '2': The colonists wanted the higher price. Did they get it?
          '3': The furs had real value. Someone gets that value.
        hints:
          - Where do the furs go? Who got the lower price?
        solution:
          - France keeps the furs. The colonists have to take a lower price.
      - type: mc
        prompt: Which sentence best describes the relationship between France and New France?
        choices:
          - They needed each other, but France made the rules.
          - They were equals, and each made its own rules.
          - The colony ruled France from across the ocean.
          - France gave the colony everything and asked nothing.
        answer: 0
        feedback:
          '1': Who decided where the furs could be sold?
          '2': Did the colony get to tell the king what to do?
          '3': Think of the furs and the king’s rule. Did France ask for something?
        hints:
          - What did each side give? Who had the last word?
        solution:
          - France sent settlers and goods. New France sent furs and other resources.
          - But the king had the last word. The relationship wasn’t equal.
    wrapUp: A colony and its home country needed each other. But the home country made the rules, and its rules were made to help the home country first.

  - id: d2
    level: 3
    thinking: whatif
    covers: [K1.2, S1.1]
    type: mc
    prompt: Champlain made alliances with the Innu, Algonquin and Wendat. What if he had **not** made those alliances? What would most likely happen to the young colony?
    choices:
      - It would get far fewer furs and less help, and might not survive.
      - It would grow faster, because it would not have to share anything.
      - Nothing would change, because the colonists did all the trapping.
      - It would get more settlers, because France would be proud of it.
    answer: 0
    feedback:
      '1': Who brought furs to the French, and showed them the way inland?
      '2': Where did the furs come from? Who did the trapping and trading?
      '3': Without furs, what would the colony have to send home?
    hints:
      - What did the allies bring to the French?
      - Look back at the hard times. Could the colony manage alone?
    solution:
      - The allies brought furs to trade, and knew the land and rivers.
      - Furs were what made the colony worth keeping. The settlers were few and winters were hard.
      - Without allies, the colony would have had few furs and little help. It might not have survived.
