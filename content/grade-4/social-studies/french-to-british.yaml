id: french-to-british
grade: 4
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [XiuhdUoB8EacTXvZQi9Djw]
order: 4
title: From New France to British Rule
shortTitle: From New France to British rule
summary: >-
  Watch Acadia and New France pass to Britain, and see how the Royal Proclamation and the Quebec Act changed
  life for three groups of people.

bigIdea: |-
  - Wars and treaties in Europe moved **Acadia** (1713) and **New France** (1763) from France to Britain. French colonists stayed on the land.
  - Britain passed **acts** to rule its colonies. They set foundations for Canada.
  - The **Royal Proclamation** (1763) still matters to First Nations today.
  - The **Quebec Act** (1774) recognized French language and religious rights, a foundation for **bilingualism** in Canada.

lesson:
  - title: The map changes hands
    blocks:
      - type: visual
        covers: [K1.3, K1.4, S1.4]
        component: canada-map
        props: { mode: borders, eras: ['1713', '1763', '1774'] }
        caption: Press Play, then tap each year. Which colours change? Who controls each colony?
      - type: table
        covers: [K1.4, S1.4]
        caption: Two treaties between Britain and France
        headers: [Year, Treaty, What Britain gained]
        rows:
          - ['1713', '**Treaty of Utrecht**', 'Acadia']
          - ['1763', '**Treaty of Paris**', 'New France']

  - title: Wars far away
    blocks:
      - type: example
        covers: [U1.1, K1.3, K1.4]
        title: How a war in Europe reached Quebec
        problem: France and Britain were rivals. How did their wars change life in the colonies?
        steps:
          - '**1756.** Britain and France go to war in Europe. The fighting spreads to their colonies.'
          - '**1759.** British soldiers win a battle on the Plains of Abraham, beside Quebec.'
          - '**1760.** Montreal surrenders. British soldiers now control New France.'
          - '**1763.** The Treaty of Paris, signed in Europe, gives New France to Britain.'
        answer: Wars, rivalries and treaties in Europe changed who ruled the colonies, and how people there lived.
      - type: callout
        variant: tip
        covers: [K1.5]
        title: The people stayed
        body: A treaty changed who ruled the land. But French colonists stayed on their farms in Acadia and New France, now under British rule.

  - title: The Royal Proclamation, 1763
    blocks:
      - type: compare
        covers: [K1.7, S1.5]
        columns:
          - title: 🏞️ First peoples
            body: It recognized First Nations as the **original inhabitants** of North America.
          - title: 🏛️ Self-government
            body: It recognized the right of First Nations to **govern themselves**.
          - title: 🤝 Nation to nation
            body: Land could only be shared through **treaties**, made between nations at public meetings.
          - title: 👑 The Crown
            body: It set up the relationship between First Nations and the **Crown**, the king or queen.
      - type: callout
        variant: tip
        covers: [K1.7, S1.5, U1.2]
        title: Still important today
        body: First Nations still point to the Royal Proclamation when they talk about their lands, treaties and right to govern themselves.

  - title: Two laws, three peoples
    blocks:
      - type: visual
        covers: [K1.8, K1.9, K1.6]
        component: law-lens
        caption: Choose a law, then a group. How did each law change their way of life?
      - type: callout
        variant: mistake
        covers: [K1.8, K1.9]
        title: The same law, different feelings
        body: One law could please one group and anger another. Always ask, “Better for whom?”

  - title: The Quebec Act and French rights
    blocks:
      - type: table
        covers: [K1.10, S1.6, U1.2]
        caption: From 1774 to today
        headers: [When, What happened]
        rows:
          - ['**1763**', 'British laws replaced French laws. Catholics couldn’t hold government jobs.']
          - ['**1774**', 'The Quebec Act recognized French language and religious rights in Quebec.']
          - ['**Today**', 'Canada has two official languages, English and French. This is called **bilingualism**.']
      - type: callout
        variant: tip
        covers: [S1.6, K1.10]
        title: A foundation
        body: |-
          - The Quebec Act didn’t make Canada bilingual. It was a first step.
          - It showed that French speakers could keep their language and faith under British rule.

keyTerms:
  - term: Treaty
    covers: [K1.3, K1.4]
    definition: A formal agreement between countries or nations, such as one that ends a war.
  - term: Act
    covers: [K1.6, U1.2]
    definition: A law passed by a government.
  - term: Royal Proclamation
    covers: [K1.7]
    definition: A 1763 order from the British king that set rules for the colonies and recognized First Nations rights.
  - term: Quebec Act
    covers: [K1.10]
    definition: A 1774 British law that recognized French language and religious rights in Quebec.
  - term: Bilingualism
    covers: [K1.10, S1.6]
    definition: Using two languages. Canada’s two official languages are English and French.
  - term: The Crown
    covers: [K1.7]
    definition: The king or queen, and the government that acts for them.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.3, K1.4, S1.4]
    type: order
    prompt: Put these events in order, from first to last.
    items:
      - The Treaty of Utrecht gives Acadia to Britain.
      - British soldiers win the battle on the Plains of Abraham.
      - The Treaty of Paris gives New France to Britain.
      - The Quebec Act makes Quebec much bigger.
    hints:
      - Look at the years on the map and in the war example.
    solution:
      - 1713, Treaty of Utrecht. 1759, Plains of Abraham. 1763, Treaty of Paris. 1774, Quebec Act.

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.7]
    type: multi
    prompt: What did the Royal Proclamation recognize or set up for First Nations? Choose all that fit.
    choices:
      - That First Nations were the original inhabitants of North America
      - The right of First Nations to govern themselves
      - Treaties made between nations
      - A relationship with the Crown
      - That settlers could buy First Nations land on their own
    answer: [0, 1, 2, 3]
    feedback:
      '4': Look at the land rule again. Who was the only one allowed to get land from First Nations?
    hints:
      - There are four big ideas in the lesson cards. One choice says the opposite of a rule.
    solution:
      - The Royal Proclamation recognized First Nations as the **original inhabitants**, and their right to **self-government**.
      - It set up **nation-to-nation treaties** and the relationship with the **Crown**.
      - Settlers couldn’t buy First Nations land. Only the Crown could, through a treaty.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.10]
    type: mc
    prompt: Marie-Anne lives near Quebec City in 1775. She speaks French and goes to a Catholic church. How did the Quebec Act help her?
    choices:
      - It recognized her language and her religion.
      - It gave her a vote for an assembly.
      - It moved her family to Upper Canada.
      - It made English her only language at church.
    answer: 0
    feedback:
      '1': The Quebec Act gave Quebec no assembly. A governor and a council ruled.
      '2': There was no Upper Canada yet in 1775. Check the map.
      '3': The Quebec Act did the opposite for French speakers. What did it recognize?
    hints:
      - What two things about Marie-Anne does the story tell you?
    solution:
      - Marie-Anne speaks French and is Catholic.
      - The Quebec Act recognized **French language and religious rights** in Quebec.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: perspective
    covers: [K1.5, U1.1, S1.4]
    type: mc
    prompt: |-
      A made-up farmer near Trois-Rivières writes in 1764:

      *“My fields are the same. My church is the same. My neighbours are the same. But nothing feels the same.”*

      What most likely changed for him?
    choices:
      - Britain now ruled, with a British governor and British laws.
      - His family had to move to France after the treaty.
      - The Catholic church near his farm had been closed.
      - His farm had been given to a family from Britain.
    answer: 0
    feedback:
      '1': He says his neighbours are the same. Did the French colonists leave?
      '2': He says his church is the same. Read his words again.
      '3': He says his fields are the same. Who still farms them?
    hints:
      - He lists what stayed the same. What isn’t on his list?
    solution:
      - He still has his farm, his church and his neighbours. French colonists **stayed on the land**.
      - What changed was who ruled. A treaty signed in Europe put him under a **British governor** and **British laws**.

  - id: b2
    level: 2
    thinking: model
    covers: [K1.7, K1.9, S1.5]
    type: mc
    prompt: It is 1765. A settler wants land that belongs to a First Nation. Under the Royal Proclamation, how could that land ever be shared?
    choices:
      - The Crown makes a treaty with the First Nation at a public meeting.
      - The settler pays the First Nation’s chief in secret.
      - The settler builds a fence around the land and starts to farm.
      - A colony’s governor gives the land away, without asking.
    answer: 0
    feedback:
      '1': The Royal Proclamation said settlers could not buy First Nations land on their own.
      '2': Moving onto land doesn’t make it yours. What did the Royal Proclamation require first?
      '3': Would giving land away without asking fit “nation to nation”?
    hints:
      - Who was allowed to deal with First Nations about land?
      - Was it done in secret or in public?
    solution:
      - Only the **Crown** could make an agreement about First Nations land.
      - It had to be a **treaty**, agreed at a public meeting, nation to nation.

  - id: b3
    level: 2
    thinking: connect
    covers: [S1.6, K1.10]
    type: mc
    prompt: Today, you can get help from Canada’s government in English or in French. Which event from the 1700s is one of the foundations of this?
    choices:
      - The Quebec Act recognized French language rights in Quebec.
      - The Treaty of Utrecht gave Acadia to Britain.
      - The Royal Proclamation made Quebec a small province.
      - British soldiers won the battle on the Plains of Abraham.
    answer: 0
    feedback:
      '1': This gave Acadia to Britain. Did it protect French?
      '2': The Royal Proclamation replaced French laws with British laws. Did that help French?
      '3': The battle led to British rule. What later recognized French speakers’ rights?
    hints:
      - Which event was about language?
    solution:
      - The Quebec Act recognized **French language and religious rights**.
      - It was a foundation for **bilingualism**, Canada’s two official languages.

  - id: b4
    level: 2
    thinking: flaw
    covers: [S1.4, K1.9]
    type: mc
    prompt: Lucas compares the 1763 and 1774 maps. He says, “The Quebec Act made Quebec smaller.” What is wrong with what Lucas said?
    choices:
      - Quebec grew. It now reached the Great Lakes and the Ohio River.
      - Quebec stayed the same size. Only its name changed.
      - Quebec disappeared. It joined the Thirteen Colonies.
      - Quebec shrank, but only in the north.
    answer: 0
    feedback:
      '1': Tap 1763, then 1774. Does the coloured area stay the same?
      '2': Quebec is still on the 1774 map. Is it part of the Thirteen Colonies?
      '3': Look at the north and the south. Did any side get smaller?
    hints:
      - Tap 1763, then 1774, on the map. Watch the shape of Quebec.
    solution:
      - In 1763, Quebec was a small area along the St. Lawrence.
      - In 1774, it stretched to the Great Lakes, the Ohio River and Labrador. Lucas had it backwards.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [K1.8, K1.9, S1.6]
    type: multi
    prompt: |-
      The Quebec Act pleased some people and angered others. Which of these are **true**? Choose all that are.
    choices:
      - British colonists in Quebec were unhappy that Quebec got no assembly.
      - People in the Thirteen Colonies were angry that the western lands went to Quebec.
      - French colonists were glad their language and religion were recognized.
      - French colonists were angry that French laws were taken away.
      - British colonists in Quebec were happy that they could finally vote.
    answer: [0, 1, 2]
    feedback:
      '3': Check the law lens for French colonists in 1774. Were French laws taken away, or brought back?
      '4': Check the law lens for British colonists in 1774. Was there an assembly to vote for?
    hints:
      - Open the law lens. Choose the Quebec Act, then look at each group in turn.
      - For each group, ask what they gained and what they lost.
    solution:
      - French colonists gained the most. Their language, religion and laws were recognized.
      - British colonists in Quebec wanted an assembly and didn’t get one. In the Thirteen Colonies, people wanted the western lands.
      - One law, three groups, three different feelings.

  - id: d2
    level: 3
    thinking: why
    covers: [K1.7, S1.5, U1.2]
    type: investigation
    prompt: |-
      A made-up First Nation says, “This valley is ours. No treaty ever gave it away.” A company wants to build a road through the valley.
    parts:
      - type: mc
        prompt: Under the Royal Proclamation, who would have to make an agreement with the First Nation before the land could be shared?
        choices:
          - The Crown, through a treaty
          - The company, by paying a fair price
          - Anyone, as long as they ask first
          - Nobody, because roads don’t need land
        answer: 0
        feedback:
          '1': The Royal Proclamation said only one party could get First Nations land. Who?
          '2': Asking is good, but the Royal Proclamation named who must make the agreement.
          '3': A road runs across land. Whose land is it on?
        hints:
          - Who could make treaties with First Nations?
        solution:
          - Only the **Crown** could make an agreement about First Nations land, through a **treaty**.
      - type: mc
        prompt: Why does the First Nation say “No treaty ever gave it away”?
        choices:
          - Without a treaty, the land was never shared, so it is still theirs.
          - Treaties are old, so they no longer matter today.
          - A treaty would have given the land to the company.
          - Roads can only be built where there is a treaty about roads.
        answer: 0
        feedback:
          '1': First Nations still point to treaties today. Do they still matter?
          '2': Treaties were made between nations and the Crown, not companies.
          '3': This isn’t about roads only. What does a missing treaty mean for the land?
        hints:
          - What did a treaty do with land, under the Royal Proclamation?
        solution:
          - A treaty was the only way land could be shared. No treaty means the land was never given up.
      - type: mc
        prompt: What does this show about the Royal Proclamation?
        choices:
          - A law from 1763 can still matter today.
          - Laws stop mattering after 100 years.
          - It only mattered to British colonists.
          - It was replaced by the Quebec Act.
        answer: 0
        feedback:
          '1': The First Nation is using the same idea today. Has the law stopped mattering?
          '2': Who does the Royal Proclamation protect?
          '3': The Quebec Act changed some things in Quebec. Does the First Nation’s claim depend on it?
        hints:
          - What year is the law from? When is the valley story happening?
        solution:
          - The First Nation uses the Royal Proclamation’s idea today.
          - Laws like this **set foundations** that still shape Canada.
    wrapUp: The Royal Proclamation is over 250 years old, but First Nations still point to it. It recognized them as nations with rights to their land and to govern themselves.
