id: confederation
grade: 4
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [RImgfrrzskGqH3G573n4Sw]
order: 6
title: Confederation and the Federal Government
shortTitle: Confederation & government
summary: >-
  Follow the talks from Charlottetown to London, hear Francophone and Anglophone views, watch four provinces
  form Canada in 1867, and run an election for Parliament.

bigIdea: |-
  - The colonies talked for several years, at the **Charlottetown**, **Quebec** and **London** conferences.
  - They debated the danger of **American expansion** and building a **railroad**.
  - The **Fathers of Confederation**, Anglophone and Francophone, worked out the **BNA Act**. In 1867, it joined Ontario, Quebec, New Brunswick and Nova Scotia into the **Dominion of Canada**.
  - The BNA Act set up a **parliamentary system** like Britain’s, with MPs, a prime minister and a Governor General. We still use it today.

lesson:
  - title: Three conferences
    blocks:
      - type: table
        covers: [K1.2]
        caption: The road to Confederation
        headers: [When, Where, What happened]
        rows:
          - ['**September 1864**', 'Charlottetown', 'Leaders from the colonies met to talk about joining together.']
          - ['**October 1864**', 'Quebec City', 'They wrote 72 plans, called resolutions, for a new country.']
          - ['**December 1866**', 'London, England', 'They finished the plan with Britain. It became the BNA Act.']
      - type: compare
        covers: [K1.4]
        columns:
          - title: 🎩 Fathers of Confederation
            body: The politicians who worked out the deal. They included **Anglophones** (English speakers) and **Francophones** (French speakers).
          - title: 🤝 Two leaders
            body: '**John A. Macdonald**, an Anglophone, and **George-Étienne Cartier**, a Francophone, worked together to make it happen.'

  - title: Why join together?
    blocks:
      - type: compare
        covers: [K1.3, S1.1]
        columns:
          - title: 🦅 American expansion
            body: |-
              - The United States had a huge army after its Civil War.
              - In 1866, armed raiders from the United States attacked the colonies.
              - Joined together, the colonies could defend themselves better.
          - title: 🚂 A railroad
            body: The colonies wanted a **railroad** to link the Maritimes with the Province of Canada, for trade all year round.
          - title: ⚖️ Stuck government
            body: With equal seats, Canada East and Canada West kept blocking each other. A new plan could break the deadlock.
      - type: callout
        variant: tip
        covers: [S1.1]
        title: Back to the Act of Union
        body: In 1841, Canada East and Canada West got the same number of seats in one government. By the 1860s, that made it hard to get anything done.

  - title: Two voices, two views
    blocks:
      - type: visual
        covers: [S1.2]
        component: card-sort
        props:
          bins:
            - { id: for, label: For Confederation, icon: 👍 }
            - { id: against, label: Against Confederation, icon: 👎 }
          cards:
            - { text: '**George-Étienne Cartier** (Francophone): “Quebec will have its own government to protect our language, faith and laws.”', bin: for, why: 'Cartier believed a province of its own would protect French Canadians.' }
            - { text: '**Antoine-Aimé Dorion** (Francophone): “In the new country, French speakers will be outnumbered.”', bin: against, why: 'Dorion feared French speakers would lose their voice in the new Parliament.' }
            - { text: '**George Brown** (Anglophone): “At last, seats will be based on how many people live in each place.”', bin: for, why: 'Brown wanted seats by population, which would give Canada West more say.' }
            - { text: '**Joseph Howe** (Anglophone, Nova Scotia): “Our little province will be swallowed up by Canada.”', bin: against, why: 'Howe feared Nova Scotia would lose control over its own affairs.' }
        caption: Leaders didn’t all agree. Read each one and decide where they stood.
      - type: callout
        variant: mistake
        covers: [S1.2]
        title: Not English against French
        body: There were Francophones and Anglophones on **both** sides. Each person’s view depended on what they hoped to protect.

  - title: Canada is born, 1867
    blocks:
      - type: visual
        covers: [K1.5]
        component: canada-map
        props: { mode: borders, eras: ['1841', '1867'] }
        caption: Tap 1841, then 1867. Which colonies joined? What new names appeared?
      - type: compare
        covers: [K1.5, K1.4, S1.3]
        columns:
          - title: 📜 The BNA Act
            body: The **British North America Act**, passed in 1867. Today it is called the **Constitution Act, 1867**.
          - title: 🍁 July 1, 1867
            body: The Province of Canada split into **Ontario** and **Quebec**. With **New Brunswick** and **Nova Scotia**, they became the **Dominion of Canada**.

  - title: How Parliament works
    blocks:
      - type: visual
        covers: [K1.6, U1.1]
        component: parliament
        caption: Hold an election. Who becomes prime minister? Then hold another one. What changes?
      - type: table
        covers: [K1.6, K1.1, U1.1, S1.3]
        caption: Set up in 1867, still here today
        headers: [Role, What they do]
        rows:
          - ['🗳️ **Members of Parliament (MPs)**', 'Each is elected to represent the people of one area, called a riding.']
          - ['🎩 **Prime minister**', 'Leads the government. Usually the leader of the party with the most MPs.']
          - ['👑 **Governor General**', 'Represents the Crown, the King or Queen, in Canada.']
      - type: callout
        variant: tip
        covers: [K1.1, U1.1]
        title: A British-style government
        body: Canada’s government grew from Britain’s, step by step, through acts like the Act of Union and the BNA Act. That is why we still have a Crown and a Parliament.

keyTerms:
  - term: Confederation
    covers: [K1.5]
    definition: The joining of colonies into one country, Canada, in 1867.
  - term: Fathers of Confederation
    covers: [K1.4]
    definition: The politicians who negotiated the British North America Act.
  - term: BNA Act
    covers: [K1.4, S1.3]
    definition: The British North America Act of 1867, which created Canada. Today it is called the Constitution Act, 1867.
  - term: Member of Parliament (MP)
    covers: [K1.6]
    definition: A person elected to represent a riding in the House of Commons.
  - term: Prime minister
    covers: [K1.6]
    definition: The leader of Canada’s government.
  - term: Governor General
    covers: [K1.6]
    definition: The person who represents the Crown in Canada.
  - term: Francophone
    covers: [S1.2, K1.4]
    definition: A person whose first language is French. An Anglophone’s first language is English.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.2]
    type: order
    prompt: Put the conferences in order, from first to last.
    items:
      - Charlottetown Conference
      - Quebec Conference
      - London Conference
    hints:
      - Two were in 1864. One was in 1866.
    solution:
      - Charlottetown (September 1864), Quebec (October 1864), then London (December 1866).

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.5]
    type: multi
    prompt: Which provinces formed the Dominion of Canada on July 1, 1867? Choose all of them.
    choices:
      - Ontario
      - Quebec
      - New Brunswick
      - Nova Scotia
      - Prince Edward Island
      - Newfoundland
    answer: [0, 1, 2, 3]
    feedback:
      '4': Prince Edward Island hosted the first conference, but it didn’t join in 1867. Check the map.
      '5': Look at the 1867 map. What colour is Newfoundland?
    hints:
      - Tap 1867 on the map. Which areas have the Canada colour?
    solution:
      - '**Ontario**, **Quebec**, **New Brunswick** and **Nova Scotia** formed Canada in 1867.'
      - Prince Edward Island and Newfoundland stayed separate colonies for now.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.6]
    type: mc
    prompt: Who represents the Crown, the King or Queen, in Canada?
    choices:
      - The Governor General
      - The prime minister
      - A Member of Parliament
      - A Father of Confederation
    answer: 0
    feedback:
      '1': The prime minister leads the government. Who stands in for the King or Queen?
      '2': An MP represents the people of one riding. Who represents the Crown?
      '3': The Fathers of Confederation negotiated the BNA Act. Who represents the Crown today?
    hints:
      - Look at the roles table in the lesson.
    solution:
      - The **Governor General** represents the Crown in Canada.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [K1.6]
    type: mc
    prompt: |-
      In a made-up election with 9 ridings, the results are:

      | Party | MPs |
      |---|---|
      | Sun Party | 3 |
      | Moon Party | 4 |
      | Star Party | 2 |

      Who will most likely become prime minister?
    choices:
      - The Moon Party’s leader
      - The Sun Party’s leader
      - The Star Party’s leader
      - The Governor General
    answer: 0
    feedback:
      '1': The Sun Party has 3 MPs. Is that the most?
      '2': The Star Party has the fewest MPs. Who has the most?
      '3': The Governor General represents the Crown. Who leads the government?
    hints:
      - Which party has the most MPs?
    solution:
      - The Moon Party has 4 MPs, more than any other party.
      - Its leader usually becomes **prime minister**.

  - id: b2
    level: 2
    thinking: perspective
    covers: [S1.2]
    type: mc
    prompt: In the new Parliament, more seats would go to places with more people. Most people in Canada would speak English. Why might a **Francophone** leader worry about Confederation?
    choices:
      - French speakers would be outnumbered in Parliament.
      - French speakers would get more seats than English speakers.
      - There would be no Parliament at all for French speakers.
      - French speakers would have to move to Ontario.
    answer: 0
    feedback:
      '1': Most people would speak English, and seats followed population. Who would have more seats?
      '2': Quebec would still send MPs. Was there no place for them?
      '3': Nobody had to move. What was the worry about Parliament?
    hints:
      - Seats followed population. Which language group was bigger?
    solution:
      - Seats were based on population, and most Canadians would speak English.
      - So French-speaking MPs would be fewer. That is what **Antoine-Aimé Dorion** feared.

  - id: b3
    level: 2
    thinking: why
    covers: [S1.1, K1.3]
    type: mc
    prompt: In 1866, armed raiders crossed from the United States into the colonies. How might this push the colonies to join together?
    choices:
      - Together they could defend themselves better than each colony alone.
      - The raiders asked the colonies to join together first.
      - Joining together would make the colonies part of the United States.
      - The raiders were bringing goods for a new railroad.
    answer: 0
    feedback:
      '1': The raiders were attacking. Would they be asking for anything?
      '2': The colonies wanted to stay separate from the United States. Why join each other?
      '3': They were armed raiders. Were they there to trade?
    hints:
      - Is it easier to be safe alone, or with others?
    solution:
      - Small colonies on their own were easier to attack.
      - Joined together, they could share the cost of defending themselves. Fear of **American expansion** was a reason for Confederation.

  - id: b4
    level: 2
    thinking: connect
    covers: [S1.3, U1.1]
    type: mc
    prompt: Every few years, Canadians vote to choose their MP. Which law first set up this way of choosing representatives for all of Canada?
    choices:
      - The BNA Act, in 1867
      - The Royal Proclamation, in 1763
      - The Quebec Act, in 1774
      - The Act of Union, in 1841
    answer: 0
    feedback:
      '1': There was no Canada yet in 1763. When was Canada created?
      '2': The Quebec Act gave Quebec no assembly at all. Which law created Canada?
      '3': The Act of Union made one Province of Canada, not the country. Which law created the country?
    hints:
      - Which law created the country of Canada?
    solution:
      - The **BNA Act** created Canada in 1867, with a Parliament of elected MPs.
      - It still matters today. It is part of our constitution, as the Constitution Act, 1867.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.2, S1.1, K1.5]
    type: investigation
    prompt: |-
      In 1867, the House of Commons had **181** seats. Quebec had **65** of them. Most of Quebec’s people spoke French. Most people in the other three provinces spoke English.
    parts:
      - type: mc
        prompt: Cartier said Quebec would have its own **provincial** government too. Why did he think this would help French Canadians?
        choices:
          - Quebec could make its own laws about things like language and faith.
          - Quebec would get to choose the prime minister by itself.
          - Quebec would not have to send any MPs to Parliament.
          - Quebec would be able to leave Canada at any time.
        answer: 0
        feedback:
          '1': The prime minister leads the party with the most MPs in Parliament. Can one province choose by itself?
          '2': Quebec still sent 65 MPs. What would its own government do?
          '3': That isn’t part of the plan. What could a provincial government protect?
        hints:
          - What did Cartier want to protect?
        solution:
          - A provincial government in Quebec, where most people spoke French, could protect their **language, faith and laws**.
      - type: number
        prompt: How many seats did the **other three provinces** have together?
        answer: 116
        unit: seats
        verify: 181 - 65
        hints:
          - Take Quebec’s seats away from all the seats.
        solution:
          - '\(181 - 65 = 116\) seats.'
      - type: mc
        prompt: Compare 65 and 116. What does this show about Dorion’s worry?
        choices:
          - It made sense. French-speaking MPs could be outvoted in Parliament.
          - It made no sense. Quebec had more seats than the others together.
          - It made no sense. Every province had the same number of seats.
          - It made sense. Quebec had no seats at all in Parliament.
        answer: 0
        feedback:
          '1': Which is bigger, 65 or 116?
          '2': Look at the numbers again. Were the seats equal?
          '3': Quebec had 65 seats. Was that none?
        hints:
          - Which number is bigger? What happens in a vote?
        solution:
          - 116 is much more than 65. In a vote, the other provinces’ MPs could outvote Quebec’s.
          - So Dorion’s worry made sense. Cartier’s answer was a provincial government to protect what mattered most.
    wrapUp: Cartier and Dorion looked at the same plan and saw different things. Cartier saw a provincial government that could protect French Canadians. Dorion saw a Parliament where they would be outnumbered. Both had reasons.

  - id: d2
    level: 3
    thinking: flaw
    covers: [U1.1, S1.3, K1.1]
    type: multi
    prompt: |-
      Ella says, “Our government today has nothing to do with 1867.”

      Which facts show that Ella is **wrong**? Choose all that do.
    choices:
      - We still elect MPs to represent our ridings.
      - A prime minister still leads the government.
      - A Governor General still represents the Crown.
      - The BNA Act is still part of our constitution.
      - Today there are more MPs than in 1867.
    answer: [0, 1, 2, 3]
    feedback:
      '4': That is true, but it shows a change. Does it show a link to 1867?
    hints:
      - Ella says there is no link. Look for things that were set up in 1867 and are still here.
    solution:
      - MPs, a prime minister, a Governor General and the BNA Act itself all come from 1867, and are still here.
      - More MPs is a change, not a link. A government can change and still keep its roots.
