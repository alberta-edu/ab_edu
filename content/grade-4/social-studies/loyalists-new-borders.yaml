id: loyalists-new-borders
grade: 4
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [XiuhdUoB8EacTXvZQi9Djw]
order: 5
title: Loyalists, War and New Borders
shortTitle: Loyalists, war & new borders
summary: >-
  Follow the Loyalists north, watch Quebec split and join again, see who fought together in 1812, and
  hear stories of people who came to Canada for freedom.

bigIdea: |-
  - The **United States** became its own country. A new border was drawn, and **Loyalists** moved north.
  - Newcomers changed the **balance of power**, so governments changed the borders: Upper and Lower Canada (1791), then one Province of Canada (1841).
  - In the **War of 1812**, British colonists, French colonists, First Nations and Métis worked together to resist American expansion.
  - **Immigrants**, from Britain and Ireland and from slavery in the United States, helped build Canada.

lesson:
  - title: A new country, a new border
    blocks:
      - type: visual
        covers: [K2.1, K2.2, S2.1]
        component: canada-map
        props: { mode: borders, eras: ['1774', '1783'] }
        caption: Tap 1774, then 1783. Where did the new border go?
      - type: compare
        covers: [K2.1, K2.2]
        columns:
          - title: 🦅 1776
            body: The **Thirteen Colonies** fought Britain for their freedom, in the **American Revolution**. They formed the **United States of America**.
          - title: 📜 1783
            body: The **Treaty of Paris** drew a **border** between the United States and the British colonies to the north, called **British North America**.

  - title: The Loyalists arrive
    blocks:
      - type: visual
        covers: [K2.3, U2.1]
        component: canada-map
        props: { mode: dots, set: loyalists }
        caption: Press Play. Where did the Loyalists go?
      - type: compare
        covers: [K2.3, U2.1]
        columns:
          - title: 👑 Who were they?
            body: People in the Thirteen Colonies who stayed loyal to Britain. They are called **United Empire Loyalists**.
          - title: 🧳 Who came?
            body: Farmers and merchants, about 3,500 **Black Loyalists**, and Haudenosaunee who had fought beside Britain.
          - title: 🏗️ What they built
            body: Farms, towns and a new colony, **New Brunswick**, made for them in 1784.

  - title: Quebec splits in two
    blocks:
      - type: visual
        covers: [K2.4, S2.1]
        component: canada-map
        props: { mode: borders, eras: ['1783', '1791'] }
        caption: Tap 1783, then 1791. What happened to Quebec?
      - type: compare
        covers: [K2.4, S2.2]
        columns:
          - title: ⬅️ Upper Canada
            body: Up the river, to the west. Mostly **English-speaking** Loyalists, with British laws.
          - title: ➡️ Lower Canada
            body: Down the river, to the east. Mostly **French-speaking** colonists, keeping French laws for daily life.
      - type: callout
        variant: tip
        covers: [S2.2, U2.2]
        title: Balance of power
        body: The Loyalists wanted British laws. So in 1791, the **Constitution Act** split Quebec, giving each group a colony where it was the larger group.

  - title: The War of 1812
    blocks:
      - type: compare
        covers: [K2.5, S2.3]
        columns:
          - title: 👑 British colonists
            body: British soldiers and colonists, led by Isaac Brock, defended Upper Canada.
          - title: ⚜️ French colonists
            body: French-speaking soldiers, led by Charles de Salaberry, stopped an American army at Châteauguay in 1813.
          - title: 🪶 First Nations
            body: The Shawnee leader **Tecumseh** and his warriors fought beside Brock to take Detroit in 1812.
          - title: 🛶 Métis
            body: Métis voyageurs helped capture Fort Michilimackinac in 1812, with First Nations warriors.
      - type: callout
        variant: tip
        covers: [S2.3, K2.5]
        title: A shared purpose
        body: These groups didn’t always agree. But they all wanted to stop the United States from taking over their lands and trade.

  - title: Newcomers seeking a new life
    blocks:
      - type: visual
        covers: [K2.7, S2.4]
        component: canada-map
        props: { mode: dots, set: railroad }
        caption: Press Play. Read each story of a person who came on the Underground Railroad.
      - type: compare
        covers: [K2.6, K2.7, U2.1]
        columns:
          - title: 🚂 The Underground Railroad
            body: Not a real railway, but a secret network of people and safe houses. After Britain **abolished slavery** in 1833, it helped enslaved Black people from the United States reach freedom here.
          - title: 🚢 The Great Migration
            body: After the War of 1812, Britain encouraged people from **England, Scotland, Wales and Ireland** to come. Many thousands arrived between 1815 and 1850.

  - title: Rebellion and union
    blocks:
      - type: visual
        covers: [K2.8, S2.1]
        component: canada-map
        props: { mode: borders, eras: ['1791', '1841'] }
        caption: Tap 1791, then 1841. What happened to the line between Upper and Lower Canada?
      - type: example
        covers: [K2.8, U2.2]
        title: From rebellion to the Province of Canada
        problem: Many people felt the balance of power between English speakers and French speakers was unfair. What happened?
        steps:
          - '**1837–38.** Rebels rose up in Upper Canada and in Lower Canada. The rebellions failed.'
          - '**1839.** Lord Durham wrote a report for Britain. He said: unite the two Canadas under one government that answers to the voters.'
          - '**1841.** The **Act of Union** made one **Province of Canada**.'
        answer: The government changed because of what the people did.
      - type: table
        covers: [K2.8, S2.2]
        caption: What the Act of Union did
        headers: [Change, What it meant]
        rows:
          - ['🧩 **Unification**', 'Upper and Lower Canada became one province, with parts called Canada West and Canada East.']
          - ['⚖️ **Equal seats**', 'Canada East and Canada West got the same number of seats in one government.']
          - ['🔤 **English only**', 'English became the official language of the government.']
          - ['🎯 **Assimilation**', 'Its plans aimed to make French speakers become more like English speakers.']

keyTerms:
  - term: American Revolution
    covers: [K2.1]
    definition: The war in which the Thirteen Colonies won independence from Britain and became the United States.
  - term: Loyalist
    covers: [K2.3]
    definition: A person in the Thirteen Colonies who stayed loyal to Britain. Many moved north to British colonies.
  - term: Border
    covers: [K2.2, S2.1]
    definition: A line that separates two countries or colonies.
  - term: Balance of power
    covers: [S2.2, K2.8]
    definition: How power is shared between groups. When one group grows, the balance can change.
  - term: Underground Railroad
    covers: [K2.7, S2.4]
    definition: A secret network of people who helped enslaved people escape to freedom.
  - term: Rebellion
    covers: [K2.8]
    definition: When people fight against their own government.
  - term: Assimilate
    covers: [K2.8]
    definition: To make a group give up its own language and ways and take on another group’s.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K2.1, K2.4, K2.5, K2.8]
    type: order
    prompt: Put these events in order, from first to last.
    items:
      - The Thirteen Colonies become the United States.
      - Quebec is split into Upper Canada and Lower Canada.
      - The War of 1812 begins.
      - Rebellions break out in Upper and Lower Canada.
      - The Act of Union makes one Province of Canada.
    hints:
      - Some of the events have a year in their name. Find the years for the others in the lesson.
    solution:
      - 1776, the United States. 1791, Upper and Lower Canada. 1812, the war. 1837, the rebellions. 1841, the Province of Canada.

  - id: w2
    level: 1
    thinking: apply
    covers: [K2.7]
    type: mc
    prompt: In 1840, a family escaping slavery in the United States crosses into Upper Canada. Why would they be **free** there?
    choices:
      - Britain had abolished slavery in 1833.
      - Upper Canada had joined the United States.
      - The War of 1812 had ended slavery everywhere.
      - The family had bought land in Upper Canada.
    answer: 0
    feedback:
      '1': Look at the map. Was Upper Canada part of the United States?
      '2': The war ended in 1814. Did it end slavery in the United States?
      '3': Buying land doesn’t make a person free. What was the law in British colonies?
    hints:
      - Upper Canada was a British colony. What had Britain done about slavery?
    solution:
      - Upper Canada was British. Britain had **abolished slavery** in 1833.
      - So a person who reached Upper Canada could live there free.

  - id: w3
    level: 1
    thinking: notice
    covers: [K2.6]
    type: multi
    prompt: During the Great Migration (1815–1850), Britain encouraged people to come from which places? Choose all of them.
    choices:
      - England
      - Scotland
      - Wales
      - Ireland
      - France
      - The United States
    answer: [0, 1, 2, 3]
    feedback:
      '4': Britain encouraged people from its own lands. Was France part of Britain?
      '5': Britain had just fought a war against the United States. Who did it want to bring in?
    hints:
      - Britain encouraged people from its own lands to come.
    solution:
      - The Great Migration brought people from **England**, **Scotland**, **Wales** and **Ireland**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: why
    covers: [S2.2, K2.4, K2.3]
    type: mc
    prompt: Thousands of English-speaking Loyalists settled west of Montreal. Most people in Quebec spoke French and followed French laws. Why would the Crown split Quebec in two in 1791?
    choices:
      - So each group could have a colony where it was the larger group.
      - So the Loyalists would have to learn French laws.
      - So French speakers would have to move west.
      - So the United States could take one of the parts.
    answer: 0
    feedback:
      '1': The Loyalists wanted British laws. Would the Crown force French laws on them?
      '2': French colonists stayed on their farms. Did anyone have to move?
      '3': Both parts stayed British. Look at the 1791 map.
    hints:
      - What did the Loyalists want? What did the French colonists want to keep?
    solution:
      - The Loyalists wanted British laws. French colonists wanted to keep their own ways.
      - Splitting Quebec gave each group a colony where it had more power. Migration changed the **balance of power**.

  - id: b2
    level: 2
    thinking: notice
    covers: [S2.1, K2.8]
    type: mc
    prompt: Compare the 1791 map and the 1841 map. What changed?
    choices:
      - The line between Upper and Lower Canada was gone. They were one province.
      - Upper Canada joined the United States.
      - Lower Canada got bigger and took over Upper Canada.
      - Nothing changed. Only the names were different.
    answer: 0
    feedback:
      '1': Look at the United States border. Did it move?
      '2': Both parts kept their size. What happened to the line between them?
      '3': Look for the line along the Ottawa River. Is it still there?
    hints:
      - Tap 1791, then 1841. Look at the Ottawa River.
    solution:
      - In 1791, a border ran along the Ottawa River. In 1841, the two colonies were joined into one **Province of Canada**.
      - The two parts kept new names, Canada West and Canada East.

  - id: b3
    level: 2
    thinking: perspective
    covers: [S2.3, K2.5]
    type: mc
    prompt: In 1812, Tecumseh and his warriors fought beside British soldiers. French-speaking soldiers fought too. Why would such different groups fight on the same side?
    choices:
      - They all wanted to stop the United States from taking their lands and trade.
      - They all spoke the same language and followed the same laws.
      - They had all come to North America as Loyalists.
      - They all wanted to join the United States after the war.
    answer: 0
    feedback:
      '1': They spoke English, French and First Nations languages. What did they share instead?
      '2': The Loyalists came from the Thirteen Colonies. Did Tecumseh or de Salaberry?
      '3': Then why would they fight against the United States?
    hints:
      - What was each group afraid of losing?
    solution:
      - Each group had something to lose if the United States took over. First Nations had their lands. Colonists had their homes and trade.
      - A **shared purpose** brought them together, even though they were different.

  - id: b4
    level: 2
    thinking: evidence
    covers: [S2.4, K2.7]
    type: mc
    prompt: |-
      In 1850, a new law in the United States said that people who escaped slavery could be caught in the northern states too, and sent back.

      Harriet Tubman then guided freedom seekers all the way to St. Catharines, in Canada. Why there?
    choices:
      - In a British colony, slavery was against the law, so they couldn’t be sent back.
      - St. Catharines was the biggest city in North America.
      - The trip to Canada was shorter than to the northern states.
      - Canada paid every newcomer to come and live there.
    answer: 0
    feedback:
      '1': Look at the map. Was St. Catharines a big city? What made it safe?
      '2': Canada is past the northern states. Was it shorter?
      '3': The lesson doesn’t say that. What made Canada different from the northern states?
    hints:
      - What did the new law change in the northern states?
      - What was the law about slavery in British colonies?
    solution:
      - After 1850, the northern states were no longer safe. People could be caught there and sent back.
      - Britain had abolished slavery in 1833. In Canada, freedom seekers were free, and safe.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.8, S2.2, U2.2]
    type: investigation
    prompt: |-
      In the early 1840s, Canada East had about **700,000** people. Canada West had about **490,000**.

      The Act of Union gave each part the **same number of seats** in the government.
    parts:
      - type: mc
        prompt: In which part did each seat speak for **more** people?
        choices:
          - Canada East
          - Canada West
          - Both the same
        answer: 0
        fixedOrder: true
        feedback:
          '1': Same seats, but which part has more people sharing them?
          '2': The seats were equal. Were the people equal?
        hints:
          - Both parts had the same seats. Which had more people?
        solution:
          - Canada East had more people sharing the same number of seats. So each seat stood for more people.
      - type: mc
        prompt: Most people in Canada East spoke French. What did equal seats do to their voice in the government?
        choices:
          - Their voice was weaker than their numbers.
          - Their voice was stronger than their numbers.
          - It made no difference to their voice.
        answer: 0
        fixedOrder: true
        feedback:
          '1': They had more people, but did they get more seats?
          '2': If a group is bigger but gets the same seats, is that the same as before?
        hints:
          - Think of it as a class vote where the bigger group gets the same votes as the smaller one.
        solution:
          - French speakers were the bigger group, but got only half the seats. Their voice was weaker than their numbers.
          - Together with English as the only official language, this fit the plan to **assimilate** French speakers.
      - type: mc
        prompt: Ten years later, Canada West had **more** people than Canada East. What would people in Canada West most likely ask for now?
        choices:
          - Seats based on how many people live in each part
          - Keeping the seats equal, just as they are
          - Giving Canada East more seats than now
          - Closing the government for good
        answer: 0
        feedback:
          '1': Now Canada West is the bigger group. Is “equal” still good for it?
          '2': Would the bigger group ask for the smaller group to get more?
          '3': They wanted a say, not no government at all.
        hints:
          - Now flip part 2. Who is the bigger group?
        solution:
          - Now Canada West was bigger but had only half the seats. It would want seats by population.
          - The same rule felt fair or unfair, depending on which group was bigger.
    wrapUp: Who gets how many seats decides whose voice is loudest. As people moved in and populations changed, the balance of power changed, and so did what each group asked the government for.

  - id: d2
    level: 3
    thinking: pattern
    covers: [U2.2, K2.4, K2.8]
    type: multi
    prompt: '“Governments can make changes because of what the people do.” Which pairs show this? Choose all that do.'
    choices:
      - 'Loyalists settle west of Montreal → the Crown splits Quebec (1791).'
      - 'Rebellions break out (1837–38) → Lord Durham’s report and the Act of Union.'
      - 'So many Loyalists come to Nova Scotia → Britain makes New Brunswick (1784).'
      - 'Britain wants more settlers → people come from Britain and Ireland (1815–1850).'
      - 'The Thirteen Colonies become independent → First Nations lands move to Quebec (1774).'
    answer: [0, 1, 2]
    feedback:
      '3': This is true, but look at the arrow. Who acted first, the government or the people?
      '4': Check the order. Did the Quebec Act come before or after independence?
    hints:
      - In each pair, ask who acted first, the people or the government.
      - Check the years. A change can’t come before its cause.
    solution:
      - In the first three pairs, people acted first and the government responded.
      - In the fourth, the government acted first. In the fifth, the Quebec Act (1774) came before independence (1776).
