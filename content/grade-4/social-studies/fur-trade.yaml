id: fur-trade
grade: 4
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [62cWIAWFL0yWuJLj3f202w]
order: 3
title: The Fur Trade
shortTitle: The fur trade
summary: >-
  Sail furs to Europe and goods back, barter at a trading post, race the Hudson’s Bay and North West
  companies west, and meet the people who made the fur trade work.

bigIdea: |-
  - Furs went to **Europe**, where they were scarce. Metal goods came to **North America**, where people wanted them.
  - The **Hudson’s Bay Company** and the **North West Company** competed, building posts farther north and west.
  - First Nations, Métis and Europeans all had jobs in the trade. **First Nations and Métis women** linked traders and communities.
  - Trade changed how people lived and worked.

lesson:
  - title: Furs east, goods west
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: fur-trade
        props: { mode: ocean }
        caption: Press Sail. What does each side have plenty of? What is each side short of?
      - type: compare
        covers: [K1.1]
        columns:
          - title: 🏰 In Europe
            body: Hunters had trapped most of the beavers. Beaver fur was **scarce**, and people wanted it for hats.
          - title: 🌲 In North America
            body: Beavers were plentiful. First Nations wanted **manufactured goods**, such as kettles, axes and cloth.

  - title: Trade at the post
    blocks:
      - type: visual
        covers: [S1.1, K1.2]
        component: fur-trade
        props: { mode: post }
        caption: Trade your furs. Then switch to two rival posts. What changes?
      - type: callout
        variant: tip
        covers: [S1.1]
        title: The made beaver
        body: |-
          - The Hudson’s Bay Company priced every good in **made beaver**: one good beaver pelt.
          - Swapping goods without money is called **bartering**.

  - title: Racing north and west
    blocks:
      - type: visual
        covers: [K1.2]
        component: canada-map
        props: { mode: dots, set: posts }
        caption: Press Play. Watch the two companies build posts farther and farther from the bay and from Montreal.
      - type: compare
        covers: [K1.2]
        columns:
          - title: 🔴 Hudson’s Bay Company
            body: Began in **1670**. It built posts on Hudson Bay and waited for traders to come to it.
          - title: 🔵 North West Company
            body: Began in **Montreal** in 1779. Its traders paddled inland to meet trappers first.
          - title: 🏁 The race
            body: To win the furs, both built more **trading posts and forts**, farther north and west, into what is now Alberta.

  - title: Inside a trading post
    blocks:
      - type: visual
        covers: [K1.3]
        component: fur-trade
        props: { mode: fort }
        caption: Tap each part of the post. What happened there?
      - type: callout
        variant: tip
        covers: [K1.3, S1.2]
        title: More than a store
        body: A post was a place to **meet and barter**, a **warehouse** for goods, supplies and medicines, and a place to **sleep**, far from any town.

  - title: Who did the work?
    blocks:
      - type: visual
        covers: [K1.4, S1.2]
        component: card-sort
        props:
          bins:
            - { id: hunt, label: Hunters and trappers, icon: 🦫 }
            - { id: guide, label: Interpreters and guides, icon: 🗣️ }
            - { id: clerk, label: Clerks, icon: 📒 }
            - { id: paddle, label: Coureurs des bois and voyageurs, icon: 🛶 }
          cards:
            - { text: Sets traps along a frozen creek all winter., bin: hunt, why: 'Trapping the animals was the start of the whole trade.' }
            - { text: 'Speaks Cree and English, so a trader and a hunter can talk.', bin: guide, why: 'Turning one language into another is what an interpreter does.' }
            - { text: Shows a canoe brigade the safest way around the rapids., bin: guide, why: 'A guide knows the land and the rivers.' }
            - { text: Writes down every pelt and kettle in the post’s books., bin: clerk, why: 'Clerks kept the records at a post.' }
            - { text: Paddles a big canoe of goods from Montreal for months., bin: paddle, why: 'Voyageurs were hired paddlers who carried goods and furs.' }
            - { text: 'Travels deep into the forest to trade, without a licence.', bin: paddle, why: 'Coureurs des bois were French traders who went inland on their own.' }
        caption: First Nations, Métis and European people all had roles. Sort each job.
      - type: compare
        covers: [K1.5, S1.3]
        columns:
          - title: 👩 Go-betweens
            body: '**First Nations and Métis women** knew two worlds. They spoke the languages, explained customs and linked traders with their families’ communities.'
          - title: 🕊️ Thanadelthur
            body: A **Dene** woman. In 1715–16 she travelled with a Hudson’s Bay Company party and helped make peace between the Dene and the Cree, so both could trade at York Factory.

  - title: Trade changes lives
    blocks:
      - type: table
        covers: [U1.1, S1.2]
        caption: How the fur trade brought change
        headers: [Change, Example]
        rows:
          - ['💰 **Economic**', 'Metal kettles, axes and needles changed daily work. Many people now trapped furs to trade.']
          - ['🏘️ **New places**', 'Posts became towns. Fort Edmonton, built in 1795, grew into the city of Edmonton.']
          - ['👪 **Social**', 'First Nations and European families joined. The Métis Nation grew in the fur-trade country of the Northwest.']
          - ['🤝 **New ties**', 'Peoples who had never met now traded, worked and travelled together.']

keyTerms:
  - term: Fur trade
    covers: [K1.1]
    definition: Trading animal furs from North America for goods made in Europe.
  - term: Barter
    covers: [S1.1, K1.3]
    definition: To swap goods for other goods, without using money.
  - term: Made beaver
    covers: [S1.1]
    definition: The Hudson’s Bay Company’s unit of value, equal to one good beaver pelt.
  - term: Trading post
    covers: [K1.3]
    definition: A building or fort where people met to trade, store goods and stay overnight.
  - term: Voyageur
    covers: [K1.4]
    definition: A paddler hired to carry goods and furs by canoe.
  - term: Coureur des bois
    covers: [K1.4]
    definition: A French trader who went into the forest to trade, often without a licence.
  - term: Intermediary
    covers: [K1.5]
    definition: A go-between who helps two groups understand each other.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.1]
    type: mc
    prompt: Why did ships carry beaver furs from North America **to Europe**?
    choices:
      - Beavers were scarce in Europe, so people there wanted the furs.
      - Europe had plenty of beavers, so it wanted even more of them.
      - First Nations had no use for any of the goods made in Europe.
      - Beaver furs were needed to build the ships that sailed home.
    answer: 0
    feedback:
      '1': If Europe had plenty, would people pay a lot for more?
      '2': First Nations traded furs for kettles, axes and cloth. Did they want those goods?
      '3': Ships were built from wood. What were the furs used for in Europe?
    hints:
      - What did Europe have little of?
    solution:
      - Most of Europe’s beavers had been trapped. Fur was **scarce**, so people wanted it.
      - Goods travel to where they are short and wanted.

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.3]
    type: multi
    prompt: Which of these happened at a trading post? Choose all that fit.
    choices:
      - People met and bartered furs for goods.
      - Goods, supplies and medicines were stored.
      - Travellers and workers slept there.
      - Beaver furs were made into hats.
    answer: [0, 1, 2]
    feedback:
      '3': Where were most fur hats made? Think about where the ships took the furs.
    hints:
      - Tap each part of the post in the lesson again.
    solution:
      - A post was a place to **meet and barter**, a **warehouse** and a place to **sleep**.
      - The furs were made into hats in Europe, after the ships took them there.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.4]
    type: mc
    prompt: Jean-Baptiste is hired to paddle a heavy canoe full of trade goods from Montreal to the west. Which role does he have?
    choices:
      - Voyageur
      - Clerk
      - Interpreter
      - Trapper
    answer: 0
    feedback:
      '1': A clerk keeps the records at a post. Is Jean-Baptiste writing in a book?
      '2': An interpreter helps people who speak different languages. What is Jean-Baptiste hired to do?
      '3': A trapper catches the animals. What is Jean-Baptiste carrying?
    hints:
      - What is Jean-Baptiste doing with his arms all day?
    solution:
      - He is hired to paddle goods by canoe. That makes him a **voyageur**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.1]
    type: number
    prompt: |-
      At a made-up post, a trapper brings **12 made beaver** of furs. She trades for a kettle and a wool blanket.

      | Good | Price |
      |---|---|
      | Kettle | 5 made beaver |
      | Wool blanket | 6 made beaver |
      | Axe | 3 made beaver |

      How many made beaver does she have left to trade?
    answer: 1
    unit: made beaver
    verify: 12 - 5 - 6
    hints:
      - Which two goods did she choose? What do they cost?
      - Take both prices away from what she brought.
    solution:
      - 'She pays 5 for the kettle and 6 for the blanket: \(5 + 6 = 11\).'
      - '\(12 - 11 = 1\) made beaver left. That isn’t enough for the axe.'

  - id: b2
    level: 2
    thinking: why
    covers: [K1.2]
    type: mc
    prompt: For about 100 years, the Hudson’s Bay Company waited at its posts on the bay. Then in 1774, it built Cumberland House far inland. Why build so far from the bay?
    choices:
      - Traders from Montreal were reaching the trappers first and getting the furs.
      - The posts on the bay had been closed for the winter and couldn’t open again.
      - There were no more beavers anywhere near Cumberland House.
      - The company wanted to build its posts as far as possible from rivers.
    answer: 0
    feedback:
      '1': Posts on the bay stayed open for many more years. What else was happening inland?
      '2': If there were no beavers there, would a fur company build a post there?
      '3': Look at the posts map. Where are the posts? What did traders travel on?
    hints:
      - Who else wanted the same furs? Where were they coming from?
    solution:
      - Montreal traders paddled inland and met trappers before they reached the bay.
      - To get the furs first, the company had to move inland too. Competition pushed the trade farther **west**.

  - id: b3
    level: 2
    thinking: evidence
    covers: [K1.5, S1.3]
    type: mc
    prompt: |-
      In 1715, the governor at York Factory wanted the Dene to come and trade. But the Dene and the Cree were enemies. Thanadelthur, a Dene woman, travelled with the company’s party and helped make peace.

      Why was **Thanadelthur** the right person for this job?
    choices:
      - She knew the Dene and could speak for them, so both sides would listen.
      - She worked as a clerk who kept the post’s trading books in order.
      - She was a voyageur who could paddle faster than anyone at the post.
      - She owned the York Factory post, so everyone had to do what she said.
    answer: 0
    feedback:
      '1': Keeping books happens at the post. This job meant travelling and talking with two peoples.
      '2': Paddling helps a journey, but peace needs something else. What did she know?
      '3': The company owned the post. Why would people listen to her?
    hints:
      - What did she know that the governor and his men didn’t?
    solution:
      - Thanadelthur was Dene. She knew her people and their language.
      - She was a **go-between**. Because of her, the Dene and the Cree made peace, and both could trade.

  - id: b4
    level: 2
    thinking: connect
    covers: [U1.1, S1.2]
    type: mc
    prompt: Fort Edmonton began as a fur-trade post in 1795. Today, Edmonton is a big city. What does this show about trade?
    choices:
      - Trade can change places for good, long after it ends.
      - Trade only matters for as long as it keeps going.
      - Cities only grow in places where there was no trade.
      - Trade changes goods, but it never changes places.
    answer: 0
    feedback:
      '1': The fur trade at Fort Edmonton ended long ago. Is the city still there?
      '2': Edmonton began as a trading post. Does that fit?
      '3': A post became a city. Did the place change?
    hints:
      - Was Edmonton there before the post? Is it there now?
    solution:
      - People gathered at the post to trade. A town grew around it, and then a city.
      - Trade can bring **social and economic change** that lasts.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.1, K1.2, U1.1]
    type: investigation
    prompt: |-
      A made-up river has one Hudson’s Bay Company post. There, a wool blanket costs **6 made beaver**. Then the North West Company builds a post across the river. Its blanket costs **5 made beaver**.

      Amelia, a Métis trapper, has **10 made beaver** of furs.
    parts:
      - type: number
        prompt: How many blankets can Amelia get at the **new** post?
        answer: 2
        unit: blankets
        verify: 10 / 5
        hints:
          - How many groups of 5 are in 10?
        solution:
          - '5 + 5 = 10, so she can get **2** blankets. At the old price of 6, she could get only 1.'
      - type: mc
        prompt: What will the Hudson’s Bay Company post most likely do next?
        choices:
          - Lower its blanket price to keep its trappers coming.
          - Raise its blanket price, since it now gets fewer furs.
          - Keep the price the same, since its blankets are better.
          - Close at once, since one post always beats the other.
        answer: 0
        feedback:
          '1': If its blankets cost more than next door, where would Amelia take her furs?
          '2': The story doesn’t say its blankets are better. Would trappers pay more for the same thing?
          '3': The companies competed for many years. Try the two rival posts in the lesson.
        hints:
          - Where will trappers take their furs now?
        solution:
          - Trappers will take their furs where they get more. To win them back, the old post must lower its price.
      - type: mc
        prompt: Who gains the most from the two posts competing?
        choices:
          - Trappers like Amelia, who get more goods for their furs.
          - The Hudson’s Bay Company, which now sells fewer blankets.
          - The North West Company, which has to sell for less.
          - Nobody, because the furs and blankets stay the same.
        answer: 0
        feedback:
          '1': It has to lower its price or lose furs. Is that a gain?
          '2': It gets furs, but it had to cut its price to do it. Who got the better deal?
          '3': The goods are the same, but the price changed. Who pays less now?
        hints:
          - Who gets more for the same furs?
        solution:
          - The companies each have to offer more to win the furs. The trappers get more goods for the same work.
    wrapUp: Competition between the two companies changed prices, pushed posts farther west, and gave First Nations and Métis trappers more choice. That is how trade brings economic change.

  - id: d2
    level: 3
    thinking: flaw
    covers: [K1.4, K1.5, S1.2]
    type: multi
    prompt: |-
      Max says, “The fur trade was Europeans doing all the work. First Nations and Métis people just sold them furs.”

      Which facts show that Max is wrong? Choose all that do.
    choices:
      - First Nations and Métis guides showed traders the rivers and portages.
      - First Nations and Métis women were go-betweens who linked traders and communities.
      - Interpreters helped traders and hunters understand each other.
      - Ships sailed the furs across the ocean to Europe.
      - Clerks at the posts wrote down every trade.
    answer: [0, 1, 2]
    feedback:
      '3': That is true, but it is about the ocean voyage. Does it show First Nations or Métis people doing other work?
      '4': That is true, but it doesn’t say who the clerks were. Does it answer Max?
    hints:
      - Max says First Nations and Métis people only sold furs. Which facts show other jobs they did?
    solution:
      - Guiding, interpreting and being go-betweens were jobs First Nations and Métis people did. The trade couldn’t work without them.
      - Ships and clerks were part of the trade too, but they don’t show the flaw in what Max said.
