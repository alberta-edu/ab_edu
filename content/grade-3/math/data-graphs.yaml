# Sources checked 2026-11-21:
# - Canada at Paris 2024 (9 gold, 7 silver, 11 bronze): Canadian Olympic Committee press release,
#   https://olympic.ca/press/paris-2024-team-canada-brings-home-historic-medal-haul/
# - Winter counts kept by Plains peoples including the Blackfoot and Lakota, one picture a year,
#   painted by a keeper on hide or muslin: https://en.wikipedia.org/wiki/Winter_count and
#   https://www.ndstudies.gov/gr8/node/111
# - Many winter counts show the 1833 Leonid meteor shower as a cluster of stars:
#   https://www.ndstudies.gov/gr8/node/111 (State Historical Society of North Dakota)
id: data-graphs
grade: 3
subject: math
organizingIdea: MAT-OI8
outcomes: [MAT3-OI8-GQ1-LO1]
order: 20
title: Questions, Dot Plots and Bar Graphs
shortTitle: Data and graphs
summary: >-
  Ask a question you answer with data, guess, collect first-hand data, show it in a dot plot or bar
  graph, read second-hand data and its story, and look at winter counts.

bigIdea: |-
  - A **statistical question** is answered by collecting data.
  - A dot plot or a bar graph shows the data. One dot, or one square, stands for one.
  - Every graph tells a story about one time and place.

lesson:
  - title: Questions with data
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: card-sort
        props:
          bins:
            - { id: 'data', label: 'Collect data', icon: '📊' }
            - { id: 'one', label: 'One answer', icon: '☝️' }
          cards:
            - { text: 'Which fruit does our class like best?', bin: 'data', why: 'Ask each kid, then count the answers.' }
            - { text: 'How old am I?', bin: 'one', why: 'You already know. There is nothing to collect.' }
            - { text: 'How do kids in our class get to school?', bin: 'data', why: 'Kids get there in different ways. Ask and count.' }
            - { text: 'What is 5 + 3?', bin: 'one', why: 'It has one answer, 8. No one to ask.' }
            - { text: 'Which pet do our neighbours have most?', bin: 'data', why: 'Ask each neighbour, then count.' }
        caption: A **statistical question** is one you answer by collecting data.

  - title: Guess, then ask
    blocks:
      - type: visual
        covers: [S1.2, S2.1, K2.1, S2.2, S2.5]
        component: g3-graph
        props: { mode: collect, views: [dots] }
        caption: |-
          1. Guess the answer first.
          2. Ask each kid. This is **first-hand data**: you collect it yourself.
          3. Watch one dot appear for each kid.
      - type: callout
        covers: [MAT2-OI8-GQ1-LO1#K2.1]
        variant: remember
        title: Remember from Grade 2
        body: You can record data with tally marks, words or counts.

  - title: Dot plot or bar graph
    blocks:
      - type: visual
        covers: [S2.2, U1.1, S2.3]
        component: g3-graph
        props:
          mode: show
          views: [dots, bars]
          spec:
            title: How we get to school
            axis: Way to school
            count: Number of kids
            cats:
              - { label: 'Walk', icon: '🚶' }
              - { label: 'Bus', icon: '🚌' }
              - { label: 'Car', icon: '🚗' }
              - { label: 'Bike', icon: '🚲' }
            data: [5, 7, 4, 2]
        caption: |-
          - Switch between the two graphs. Each dot, or each square of a bar, is 1 kid.
          - Both answer the question: most kids take the bus.

  - title: Data from others
    blocks:
      - type: visual
        covers: [K2.2, U2.1, U2.2, S2.3, S2.2]
        component: g3-graph
        props:
          mode: show
          views: [bars, dots]
          unit: medals
          source: Canadian Olympic Committee, olympic.ca
          spec:
            title: Canada’s medals, Paris 2024
            axis: Medal
            count: Number of medals
            cats:
              - { label: 'Gold', icon: '🥇' }
              - { label: 'Silver', icon: '🥈' }
              - { label: 'Bronze', icon: '🥉' }
            data: [9, 7, 11]
        caption: |-
          - This is **second-hand data**. Others collected it, and we found it on a website.
          - It is about one time and place: Paris, in 2024.
          - Its story: Canada won more bronze medals than gold or silver.

  - title: A winter count
    blocks:
      - type: visual
        covers: [S2.4]
        component: g3-graph
        props: { mode: winter }
        caption: |-
          - Plains First Nations, like the **Lakota** and the **Blackfoot**, kept **winter counts**.
          - A keeper painted one picture for each winter on a hide or cloth. One picture, one winter.
          - These pictures are pretend. Press **Add a winter** and count.
      - type: callout
        covers: [S2.4]
        variant: tip
        title: The winter the stars fell
        body: Many winter counts show 1833 as the winter the stars fell. The sky was full of shooting stars.

keyTerms:
  - term: Statistical question
    covers: [K1.1]
    definition: 'A question you answer by collecting data.'
  - term: First-hand data
    covers: [K2.1]
    definition: 'Data you collect yourself.'
  - term: Second-hand data
    covers: [K2.2]
    definition: 'Data that others collected, like data from a website.'
  - term: Dot plot
    covers: [S2.2]
    definition: 'A graph with one dot for each thing counted.'
  - term: Bar graph
    covers: [S2.2]
    definition: 'A graph with bars. Each bar is as tall as its count.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.1, S1.1]
    type: mc
    prompt: Which is a **statistical question**?
    choices: ['Which snack does our class like best?', 'How many legs does a cat have?', 'What is 10 + 10?']
    answer: 0
    feedback:
      '1': 'Every cat has 4 legs. You don’t need to collect data.'
      '2': 'It has one answer, 20. There is no one to ask.'
    hints:
      - Which question needs you to ask lots of people?
    solution:
      - 'Kids like different snacks, so you ask each one and count.'
      - '**Which snack does our class like best?** is answered with data.'

  - id: w2
    level: 1
    thinking: apply
    covers: [K2.1, K2.2]
    type: mc
    prompt: Jo asks each kid in her class to name a favourite colour. What kind of data does Jo get?
    choices: ['First-hand', 'Second-hand']
    fixedOrder: true
    answer: 0
    feedback:
      '1': 'Second-hand data was collected by others. Who collected this data?'
    hints:
      - Did Jo collect it herself, or did she find it?
    solution:
      - 'Jo collected the data herself, so it is **first-hand** data.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [S2.2, S2.3]
    type: number
    figure: |-
      <svg viewBox="0 0 400 222" class="fig-svg" role="img" aria-label="Bar graph: Pets at home. Dog 6, Cat 4, Fish 2, Rabbit 1."><text x="200" y="22" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:16px;font-weight:700">Pets at home</text><line x1="52" y1="152" x2="392" y2="152" style="stroke:var(--line-strong);stroke-width:0"/><text x="45" y="152" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">0</text><line x1="52" y1="134" x2="392" y2="134" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="134" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">1</text><line x1="52" y1="116" x2="392" y2="116" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="116" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">2</text><line x1="52" y1="98" x2="392" y2="98" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="98" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">3</text><line x1="52" y1="80" x2="392" y2="80" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="80" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">4</text><line x1="52" y1="62" x2="392" y2="62" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="62" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">5</text><line x1="52" y1="44" x2="392" y2="44" style="stroke:var(--line-strong);stroke-width:1"/><text x="45" y="44" text-anchor="end" dominant-baseline="central" style="fill:var(--ink);font-family:var(--font);font-size:12px">6</text><line x1="52" y1="38" x2="52" y2="152" style="stroke:var(--ink);stroke-width:2"/><text x="14" y="98" text-anchor="middle" transform="rotate(-90 14 98)" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">Number of kids</text><line x1="52" y1="152" x2="392" y2="152" style="stroke:var(--ink);stroke-width:2"/><g data-cat="0"><rect x="72" y="44" width="44" height="108" rx="3" style="fill:var(--accent)"/><rect x="52" y="34" width="84" height="148" style="fill:transparent"/><text x="94" y="172" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🐶 Dog</text></g><g data-cat="1"><rect x="156" y="80" width="44" height="72" rx="3" style="fill:var(--accent)"/><rect x="136" y="34" width="84" height="148" style="fill:transparent"/><text x="178" y="172" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🐱 Cat</text></g><g data-cat="2"><rect x="240" y="116" width="44" height="36" rx="3" style="fill:var(--accent)"/><rect x="220" y="34" width="84" height="148" style="fill:transparent"/><text x="262" y="172" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🐟 Fish</text></g><g data-cat="3"><rect x="324" y="134" width="44" height="18" rx="3" style="fill:var(--accent)"/><rect x="304" y="34" width="84" height="148" style="fill:transparent"/><text x="346" y="172" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🐰 Rabbit</text></g><text x="222" y="198" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">Pet</text></svg>
    prompt: How many more kids have a 🐶 dog than a 🐱 cat?
    answer: 2
    verify: 6 - 4
    hints:
      - Read the top of each bar on the side numbers.
    solution:
      - 'The dog bar is at 6. The cat bar is at 4.'
      - '6 − 4 = **2** more kids have a dog.'

  - id: b2
    level: 2
    thinking: evidence
    covers: [S1.2, S2.5, S2.3]
    type: mc
    figure: |-
      <svg viewBox="0 0 364 204" class="fig-svg" role="img" aria-label="Dot plot: Favourite snack. Popcorn 3, Carrots 2, Cheese 5, Cookies 4."><text x="182" y="22" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:16px;font-weight:700">Favourite snack</text><line x1="16" y1="134" x2="356" y2="134" style="stroke:var(--ink);stroke-width:2"/><g data-cat="0"><circle cx="58" cy="125" r="7" style="fill:var(--accent)"/><circle cx="58" cy="107" r="7" style="fill:var(--accent)"/><circle cx="58" cy="89" r="7" style="fill:var(--accent)"/><rect x="16" y="34" width="84" height="130" style="fill:transparent"/><text x="58" y="154" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🍿 Popcorn</text></g><g data-cat="1"><circle cx="142" cy="125" r="7" style="fill:var(--accent)"/><circle cx="142" cy="107" r="7" style="fill:var(--accent)"/><rect x="100" y="34" width="84" height="130" style="fill:transparent"/><text x="142" y="154" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🥕 Carrots</text></g><g data-cat="2"><circle cx="226" cy="125" r="7" style="fill:var(--accent)"/><circle cx="226" cy="107" r="7" style="fill:var(--accent)"/><circle cx="226" cy="89" r="7" style="fill:var(--accent)"/><circle cx="226" cy="71" r="7" style="fill:var(--accent)"/><circle cx="226" cy="53" r="7" style="fill:var(--accent)"/><rect x="184" y="34" width="84" height="130" style="fill:transparent"/><text x="226" y="154" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🧀 Cheese</text></g><g data-cat="3"><circle cx="310" cy="125" r="7" style="fill:var(--accent)"/><circle cx="310" cy="107" r="7" style="fill:var(--accent)"/><circle cx="310" cy="89" r="7" style="fill:var(--accent)"/><circle cx="310" cy="71" r="7" style="fill:var(--accent)"/><rect x="268" y="34" width="84" height="130" style="fill:transparent"/><text x="310" y="154" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🍪 Cookies</text></g><text x="186" y="180" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">Snack</text></svg>
    prompt: Sam guessed most kids like 🍪 cookies best. Then he made this dot plot. What does the data say?
    choices: ['Most like 🧀', 'Most like 🍪', 'Most like 🍿']
    answer: 0
    feedback:
      '1': 'That was Sam’s guess. Count the dots: is the cookie column the tallest?'
      '2': 'Popcorn has 3 dots. Which column has more?'
    hints:
      - Find the tallest column of dots.
    solution:
      - 'Cheese has 5 dots, the most. Cookies has 4.'
      - 'Sam’s guess was close, but the data says **most like 🧀 cheese**.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: why
    covers: [S2.2, U2.1, U2.2]
    type: investigation
    figure: |-
      <svg viewBox="0 0 364 258" class="fig-svg" role="img" aria-label="Dot plot: Favourite season, Ms. Roy’s class. Winter 3, Spring 5, Summer 8, Fall 4."><text x="182" y="22" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:16px;font-weight:700">Favourite season, Ms. Roy’s class</text><line x1="16" y1="188" x2="356" y2="188" style="stroke:var(--ink);stroke-width:2"/><g data-cat="0"><circle cx="58" cy="179" r="7" style="fill:var(--accent)"/><circle cx="58" cy="161" r="7" style="fill:var(--accent)"/><circle cx="58" cy="143" r="7" style="fill:var(--accent)"/><rect x="16" y="34" width="84" height="184" style="fill:transparent"/><text x="58" y="208" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">❄️ Winter</text></g><g data-cat="1"><circle cx="142" cy="179" r="7" style="fill:var(--accent)"/><circle cx="142" cy="161" r="7" style="fill:var(--accent)"/><circle cx="142" cy="143" r="7" style="fill:var(--accent)"/><circle cx="142" cy="125" r="7" style="fill:var(--accent)"/><circle cx="142" cy="107" r="7" style="fill:var(--accent)"/><rect x="100" y="34" width="84" height="184" style="fill:transparent"/><text x="142" y="208" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🌷 Spring</text></g><g data-cat="2"><circle cx="226" cy="179" r="7" style="fill:var(--accent)"/><circle cx="226" cy="161" r="7" style="fill:var(--accent)"/><circle cx="226" cy="143" r="7" style="fill:var(--accent)"/><circle cx="226" cy="125" r="7" style="fill:var(--accent)"/><circle cx="226" cy="107" r="7" style="fill:var(--accent)"/><circle cx="226" cy="89" r="7" style="fill:var(--accent)"/><circle cx="226" cy="71" r="7" style="fill:var(--accent)"/><circle cx="226" cy="53" r="7" style="fill:var(--accent)"/><rect x="184" y="34" width="84" height="184" style="fill:transparent"/><text x="226" y="208" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">☀️ Summer</text></g><g data-cat="3"><circle cx="310" cy="179" r="7" style="fill:var(--accent)"/><circle cx="310" cy="161" r="7" style="fill:var(--accent)"/><circle cx="310" cy="143" r="7" style="fill:var(--accent)"/><circle cx="310" cy="125" r="7" style="fill:var(--accent)"/><rect x="268" y="34" width="84" height="184" style="fill:transparent"/><text x="310" y="208" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">🍂 Fall</text></g><text x="186" y="234" text-anchor="middle" style="fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:600">Season</text></svg>
    prompt: Each kid in Ms. Roy’s class picked one favourite season.
    parts:
      - type: number
        prompt: How many kids are in the class?
        unit: kids
        answer: 20
        verify: 3 + 5 + 8 + 4
        hints:
          - One dot is one kid. Count all the dots.
        solution:
          - '3 + 5 + 8 + 4 = **20** kids.'
      - type: mc
        prompt: A class in another town asks the same question. Will their dot plot be the same?
        choices: ['Maybe not', 'Yes, always']
        fixedOrder: true
        answer: 0
        feedback:
          '1': 'Ms. Roy’s graph is about her class only. Other kids might like other seasons.'
        hints:
          - Whose answers are in Ms. Roy’s dot plot?
        solution:
          - 'The dot plot shows one class, at one time and place.'
          - 'Other kids may answer differently, so **maybe not**.'
    wrapUp: A graph tells the story of one group, at one time and place.

  - id: d2
    level: 3
    thinking: design
    covers: [S2.2, U1.1, S2.5]
    type: build
    prompt: '12 kids answer “Dog, cat or fish?” Make a dot plot where **dog** gets the most dots and **fish** gets the fewest. Every pet gets at least 1 dot.'
    fields:
      - { name: dog, label: '🐶 Dog dots' }
      - { name: cat, label: '🐱 Cat dots' }
      - { name: fish, label: '🐟 Fish dots' }
    rules:
      - { test: 'dog % 1 == 0 && cat % 1 == 0 && fish % 1 == 0 && fish >= 1', fail: 'Use whole numbers, and give every pet at least 1 dot.' }
      - { test: 'dog + cat + fish == 12', fail: 'There is 1 dot for each kid. Do your dots add up to 12?' }
      - { test: 'dog > cat && dog > fish', fail: 'Dog must have more dots than cat and fish.' }
      - { test: 'fish < cat', fail: 'Fish must have fewer dots than cat.' }
    examples:
      - { dog: 6, cat: 4, fish: 2 }
      - { dog: 5, cat: 4, fish: 3 }
      - { dog: 9, cat: 2, fish: 1 }
    counterexamples:
      - { dog: 4, cat: 4, fish: 4 }
      - { dog: 6, cat: 5, fish: 2 }
      - { dog: 3, cat: 6, fish: 3 }
      - { dog: 8, cat: 4, fish: 0 }
    hints:
      - The three numbers must add up to 12.
      - Put the biggest number on dog and the smallest on fish.
    solution:
      - 'One way: dog 6, cat 4, fish 2. 6 + 4 + 2 = 12.'
      - '6 is the most and 2 is the fewest. Other answers work too, like **5, 4 and 3**.'
