id: measuring-length
grade: 3
subject: math
organizingIdea: MAT-OI5
outcomes: [MAT3-OI5-GQ1-LO1]
order: 14
title: Metres, Centimetres and Millimetres
shortTitle: Metric length
summary: >-
  Zoom into a metre to see decimetres, centimetres and millimetres, measure from 0 on a ruler,
  straighten a curve to measure it, and pick the best unit.

bigIdea: |-
  - The **metre** is the main unit of length. 1 m = 100 cm = 1000 mm.
  - A ruler counts units from **0**. Line up one end at 0.
  - Pick the unit that fits: mm for tiny things, cm for small, m for big.

lesson:
  - title: Zoom into a metre
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.3, S1.1]
        component: g3-ruler
        props: { mode: zoom }
        caption: Press **Zoom in** to look inside one piece. What is inside a centimetre?
      - type: callout
        covers: [MAT2-OI5-GQ1-LO1#S1.4]
        variant: remember
        title: Remember from Grade 2
        body: You measured with **centimetres**, laying them end to end with no gaps.

  - title: Start at zero
    blocks:
      - type: visual
        covers: [K1.4, S1.4]
        component: g3-ruler
        props: { mode: measure, things: [pencil, crayon, leaf] }
        caption: The ruler counts centimetres from 0. Press **Line up at 0**, then read the other end.
      - type: callout
        covers: [K1.4]
        variant: mistake
        title: Not from the edge
        body: The 0 is often a little in from the ruler’s edge. Line up with **0**, not the edge.

  - title: Measure a curve
    blocks:
      - type: visual
        covers: [S1.4]
        component: g3-ruler
        props: { mode: measure, things: [worm] }
        caption: |-
          1. A curvy worm won’t lie along a ruler.
          2. Straighten it, like a piece of string. Then line it up at 0.

  - title: Which unit?
    blocks:
      - type: visual
        covers: [S1.3, U1.2]
        component: card-sort
        props:
          bins:
            - { id: 'mm', label: 'mm', icon: '🐜' }
            - { id: 'cm', label: 'cm', icon: '✏️' }
            - { id: 'm', label: 'm', icon: '🏫' }
          cards:
            - { text: 'An ant', bin: 'mm', why: 'An ant is only a few millimetres long.' }
            - { text: 'A book', bin: 'cm', why: 'A book is about 25 cm. Metres are too big.' }
            - { text: 'The hallway', bin: 'm', why: 'In cm the number would be huge. Metres fit.' }
            - { text: 'A ladybug', bin: 'mm', why: 'A ladybug is smaller than a centimetre.' }
            - { text: 'A soccer field', bin: 'm', why: 'A soccer field is about 100 m long.' }
            - { text: 'Your hand', bin: 'cm', why: 'A hand is about 15 cm long.' }
        caption: Small units for small things, big units for big things.

keyTerms:
  - term: Metre (m)
    covers: [K1.1, K1.3]
    definition: 'The main unit of length. 1 m = 100 cm.'
  - term: Decimetre (dm)
    covers: [K1.2, K1.3]
    definition: '10 decimetres make 1 metre. 1 dm = 10 cm.'
  - term: Centimetre (cm)
    covers: [K1.2, K1.3]
    definition: '100 centimetres make 1 metre.'
  - term: Millimetre (mm)
    covers: [K1.2, K1.3]
    definition: 'The tiny lines on a ruler. 10 mm = 1 cm, and 1000 mm = 1 m.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [S1.1, K1.2]
    type: number
    prompt: How many **centimetres** are in 1 metre?
    unit: cm
    answer: 100
    verify: 10 * 10
    hints:
      - 1 m is 10 dm, and each decimetre is 10 cm.
    solution:
      - '10 decimetres make a metre, and each one is 10 cm.'
      - '10 groups of 10 is **100 cm**.'

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.3]
    type: mc
    prompt: Which is the short way to write **millimetre**?
    choices: ['mm', 'm', 'cm', 'dm']
    answer: 0
    feedback:
      '1': '**m** is short for metre, the big unit.'
      '2': '**cm** is short for centimetre.'
      '3': '**dm** is short for decimetre.'
    hints:
      - Milli starts with m. So does metre.
    solution:
      - '**mm**: the first m is for milli, the second for metre.'

  # ---------------------------------------------------------------- Level 2: Build
