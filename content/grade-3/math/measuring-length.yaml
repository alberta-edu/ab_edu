(--ink);stroke-width:1" x1="359.2" y1="62" x2="359.2" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="362.4" y1="62" x2="362.4" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="365.6" y1="62" x2="365.6" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="368.8" y1="62" x2="368.8" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="372" y1="62" x2="372" y2="76"/><text class="fig-small" x="372" y="93" text-anchor="middle">11</text><line style="stroke:var(--ink);stroke-width:1" x1="375.2" y1="62" x2="375.2" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="378.4" y1="62" x2="378.4" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="381.6" y1="62" x2="381.6" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="384.8" y1="62" x2="384.8" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="388" y1="62" x2="388" y2="72"/><line style="stroke:var(--ink);stroke-width:1" x1="391.2" y1="62" x2="391.2" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="394.4" y1="62" x2="394.4" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="397.6" y1="62" x2="397.6" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="400.8" y1="62" x2="400.8" y2="68"/><line style="stroke:var(--ink);stroke-width:1" x1="404" y1="62" x2="404" y2="76"/><text class="fig-small" x="404" y="93" text-anchor="middle">12</text><text class="fig-small" x="408" y="114" text-anchor="end">cm</text><path class="fig-hl" d="M116,38 L308,38 L340,48 L308,58 L116,58 Z"/><line class="fig-arrow" x1="116" y1="58" x2="116" y2="62"/><line class="fig-arrow" x1="340" y1="48" x2="340" y2="62"/></svg>
    prompt: How long is the crayon?
    unit: cm
    answer: 7
    verify: 10 - 3
    hints:
      - Does the crayon start at 0?
      - Count the centimetres from one end to the other.
    solution:
      - 'The crayon starts at 3, not 0. Reading 10 would be wrong.'
      - 'From 3 to 10 is **7 cm**. Or: 10 − 3 = 7.'

  - id: b2
    level: 2
    thinking: connect
    covers: [U1.2, S1.3]
    type: mc
    prompt: Zoe’s bead is longer than 1 cm but shorter than 2 cm. How can she say its length more exactly?
    choices: ['Measure it in mm', 'Measure it in m', 'Call it 2 cm']
    answer: 0
    feedback:
      '1': 'A metre is far bigger than a bead. The number would be tiny.'
      '2': 'It is shorter than 2 cm, so 2 cm is not exact.'
    hints:
      - Which unit is smaller than a centimetre?
    solution:
      - 'Millimetres are smaller than centimetres, so they fit between the cm marks.'
      - 'She might find it is **14 mm** long.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: flaw
    covers: [S1.1, K1.4, U1.2]
    type: investigation
    prompt: Three friends measure the **same** pencil. Ali says **12 cm**. Bo says **120 mm**. Cy says **13 cm**.
    parts:
      - type: mc
        prompt: Can Ali and Bo **both** be right?
        choices: ['Yes', 'No']
        fixedOrder: true
        answer: 0
        feedback:
          '1': 'How many millimetres are in 1 cm? So how many are in 12 cm?'
        hints:
          - 1 cm is 10 mm.
        solution:
          - '1 cm = 10 mm, so 12 cm = 120 mm.'
          - 'They gave the **same** length in different units.'
      - type: mc
        prompt: Cy lined up the pencil with the **1** on his ruler. What length should he say?
        choices: ['12 cm', '13 cm', '14 cm']
        fixedOrder: true
        answer: 0
        feedback:
          '1': 'That is the number at the end. But Cy started at 1, not 0.'
          '2': 'Starting at 1 adds a centimetre. Should we add or take away?'
        hints:
          - From 1 to 13, how many centimetres are there?
        solution:
          - 'Cy counted from 1, so the first centimetre was skipped. 13 − 1 = **12 cm**.'
    wrapUp: The same length can have different numbers in different units. And a ruler counts from 0.

  - id: d2
    level: 3
    thinking: design
    covers: [S1.1, K1.2]
    type: build
    prompt: Two sticks lie end to end, exactly **1 m** long in all. One is measured in **cm**, the other in **mm**. How long could each be?
    fields:
      - { name: c, label: 'Stick 1', unit: cm }
      - { name: m, label: 'Stick 2', unit: mm }
    rules:
      - { test: 'c % 1 == 0 && m % 1 == 0 && c >= 1 && m >= 1', fail: 'Use whole numbers, and give both sticks some length.' }
      - { test: 'c * 10 + m == 1000', fail: 'Together they are not 1 m yet. How many mm is your cm stick?' }
    examples:
      - { c: 50, m: 500 }
      - { c: 30, m: 700 }
      - { c: 99, m: 10 }
    counterexamples:
      - { c: 50, m: 50 }
      - { c: 100, m: 0 }
    hints:
      - 1 m is 1000 mm. How many mm is your cm stick?
      - Try 50 cm for stick 1. That is 500 mm.
    solution:
      - '50 cm is 500 mm. 500 mm + **500 mm** = 1000 mm = 1 m.'
      - '**30 cm and 700 mm** works too: 300 + 700 = 1000.'
