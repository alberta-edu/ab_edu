id: telling-time
grade: 3
subject: math
organizingIdea: MAT-OI7
outcomes: [MAT3-OI7-GQ1-LO1]
order: 19
title: Telling Time on Clocks
shortTitle: Telling time
summary: >-
  Watch 60 seconds make a minute and 60 minutes make an hour, tell time on analog and digital
  clocks, and name times of day with a.m., p.m. and the 24-hour clock.

bigIdea: |-
  - 60 **seconds** make 1 minute. 60 **minutes** make 1 hour.
  - Analog and digital clocks both tell the time of day.
  - A day is two 12-hour cycles, **a.m.** and **p.m.**, or one 24-hour cycle.

lesson:
  - title: Tick, tick, tick
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.3, K1.4, S1.1]
        component: g3-clock
        props: { mode: tick }
        caption: |-
          1. Press **Run**. Each tick of the red hand is 1 **second**, 1/60 of a minute.
          2. Try **Fast**. 60 seconds make 1 **minute**.
          3. Try **Super fast**. 60 minutes make 1 **hour**.
      - type: callout
        covers: [MAT2-OI7-GQ1-LO1#S2.1]
        variant: remember
        title: Remember from Grade 2
        body: Days, weeks, months and years are units of time too.

  - title: Make the time
    blocks:
      - type: visual
        covers: [K1.5, S1.4, U1.1]
        component: g3-clock
        props: { mode: set, goals: ['4:35', '9:10', '11:50'] }
        caption: |-
          - The short hand shows the **hour**. The long hand shows the **minutes**.
          - The digital clock shows the same time with numbers.
      - type: callout
        covers: [S1.4]
        variant: tip
        title: Count by 5
        body: The long hand moves 5 minutes from one number to the next. Skip count by 5 to read it.

  - title: Minutes past, minutes until
    blocks:
      - type: visual
        covers: [S1.2, K1.4]
        component: g3-clock
        props: { mode: past, start: '3:20' }
        caption: Move the minute hand. Minutes **past** 3 and minutes **until** 4 always make 60.

  - title: a.m. and p.m.
    blocks:
      - type: visual
        covers: [K1.6, S1.3, K1.5]
        component: g3-clock
        props: { mode: day, start: '7:00' }
        caption: |-
          - A day has two 12-hour cycles. The hour hand goes around twice.
          - **a.m.** times count from 12:00 midnight. **p.m.** times count from 12:00 noon.

  - title: The 24-hour clock
    blocks:
      - type: visual
        covers: [K1.7, S1.5]
        component: g3-clock
        props: { mode: day, start: '15:20', show24: true }
        caption: |-
          - A **24-hour clock** counts every hour of the day from 0:00, midnight.
          - After noon it keeps counting: 1:00 p.m. is 13:00.
          - In French, people often use it. 15 h 20 means 3:20 p.m.

keyTerms:
  - term: Second
    covers: [K1.2, K1.3]
    definition: 'The basic unit of time. 60 seconds make 1 minute.'
  - term: Minute
    covers: [K1.4, K1.1]
    definition: '60 seconds. 60 minutes make 1 hour.'
  - term: a.m.
    covers: [S1.3, K1.6]
    definition: 'The 12 hours from midnight to noon.'
  - term: p.m.
    covers: [S1.3, K1.6]
    definition: 'The 12 hours from noon to midnight.'
  - term: 24-hour clock
    covers: [K1.7, S1.5]
    definition: 'Counts the hours of a day from 0:00 to 23:59.'

problems:
