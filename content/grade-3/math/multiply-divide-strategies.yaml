id: multiply-divide-strategies
grade: 3
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT3-OI1-GQ3-LO1]
order: 7
title: Strategies for Multiplying and Dividing
shortTitle: Times & divide tricks
summary: >-
  Multiply and divide within 100 by splitting numbers into easier parts, using a nearby fact, and
  finding a missing number in a multiplication or division.

bigIdea: |-
  - A hard fact can be **split** into two easier facts.
  - A nearby fact helps: **9 × 6** is 10 × 6 take away 6.
  - A missing number can be found with the **opposite** operation.

lesson:
  - title: Multiply in parts
    blocks:
      - type: visual
        covers: [K2.1, K2.2, S2.1, S2.2]
        component: g3-groups
        props: { mode: split, a: 7, b: 8 }
        caption: |-
          1. Slide the red cut. 7 × 8 splits into two smaller facts.
          2. Add the two parts. The total never changes.

  - title: Use a nearby fact
    blocks:
      - type: figure
        covers: [K2.2, U2.2]
        figure: |-
          <svg viewBox="0 0 330 250" class="fig-svg" style="max-width:340px" role="img" aria-label="10 rows of 6 dots with the last row crossed out. 10 × 6 = 60, take away 6, so 9 × 6 = 54."><circle cx="40" cy="14" r="8" style="fill:var(--accent)"/><circle cx="64" cy="14" r="8" style="fill:var(--accent)"/><circle cx="88" cy="14" r="8" style="fill:var(--accent)"/><circle cx="112" cy="14" r="8" style="fill:var(--accent)"/><circle cx="136" cy="14" r="8" style="fill:var(--accent)"/><circle cx="160" cy="14" r="8" style="fill:var(--accent)"/><circle cx="40" cy="38" r="8" style="fill:var(--accent)"/><circle cx="64" cy="38" r="8" style="fill:var(--accent)"/><circle cx="88" cy="38" r="8" style="fill:var(--accent)"/><circle cx="112" cy="38" r="8" style="fill:var(--accent)"/><circle cx="136" cy="38" r="8" style="fill:var(--accent)"/><circle cx="160" cy="38" r="8" style="fill:var(--accent)"/><circle cx="40" cy="62" r="8" style="fill:var(--accent)"/><circle cx="64" cy="62" r="8" style="fill:var(--accent)"/><circle cx="88" cy="62" r="8" style="fill:var(--accent)"/><circle cx="112" cy="62" r="8" style="fill:var(--accent)"/><circle cx="136" cy="62" r="8" style="fill:var(--accent)"/><circle cx="160" cy="62" r="8" style="fill:var(--accent)"/><circle cx="40" cy="86" r="8" style="fill:var(--accent)"/><circle cx="64" cy="86" r="8" style="fill:var(--accent)"/><circle cx="88" cy="86" r="8" style="fill:var(--accent)"/><circle cx="112" cy="86" r="8" style="fill:var(--accent)"/><circle cx="136" cy="86" r="8" style="fill:var(--accent)"/><circle cx="160" cy="86" r="8" style="fill:var(--accent)"/><circle cx="40" cy="110" r="8" style="fill:var(--accent)"/><circle cx="64" cy="110" r="8" style="fill:var(--accent)"/><circle cx="88" cy="110" r="8" style="fill:var(--accent)"/><circle cx="112" cy="110" r="8" style="fill:var(--accent)"/><circle cx="136" cy="110" r="8" style="fill:var(--accent)"/><circle cx="160" cy="110" r="8" style="fill:var(--accent)"/><circle cx="40" cy="134" r="8" style="fill:var(--accent)"/><circle cx="64" cy="134" r="8" style="fill:var(--accent)"/><circle cx="88" cy="134" r="8" style="fill:var(--accent)"/><circle cx="112" cy="134" r="8" style="fill:var(--accent)"/><circle cx="136" cy="134" r="8" style="fill:var(--accent)"/><circle cx="160" cy="134" r="8" style="fill:var(--accent)"/><circle cx="40" cy="158" r="8" style="fill:var(--accent)"/><circle cx="64" cy="158" r="8" style="fill:var(--accent)"/><circle cx="88" cy="158" r="8" style="fill:var(--accent)"/><circle cx="112" cy="158" r="8" style="fill:var(--accent)"/><circle cx="136" cy="158" r="8" style="fill:var(--accent)"/><circle cx="160" cy="158" r="8" style="fill:var(--accent)"/><circle cx="40" cy="182" r="8" style="fill:var(--accent)"/><circle cx="64" cy="182" r="8" style="fill:var(--accent)"/><circle cx="88" cy="182" r="8" style="fill:var(--accent)"/><circle cx="112" cy="182" r="8" style="fill:var(--accent)"/><circle cx="136" cy="182" r="8" style="fill:var(--accent)"/><circle cx="160" cy="182" r="8" style="fill:var(--accent)"/><circle cx="40" cy="206" r="8" style="fill:var(--accent)"/><circle cx="64" cy="206" r="8" style="fill:var(--accent)"/><circle cx="88" cy="206" r="8" style="fill:var(--accent)"/><circle cx="112" cy="206" r="8" style="fill:var(--accent)"/><circle cx="136" cy="206" r="8" style="fill:var(--accent)"/><circle cx="160" cy="206" r="8" style="fill:var(--accent)"/><circle cx="40" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><circle cx="64" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><circle cx="88" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><circle cx="112" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><circle cx="136" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><circle cx="160" cy="230" r="8" style="fill:var(--bad)" opacity="0.35"/><line x1="22" y1="230" x2="178" y2="230" style="stroke:var(--bad);stroke-width:3"/><text x="200" y="110" font-size="17" font-weight="700" style="fill:var(--accent)">10 × 6 = 60</text><text x="200" y="140" font-size="17" font-weight="700" style="fill:var(--bad)">− 6</text><text x="200" y="170" font-size="17" font-weight="700" style="fill:var(--ok)">9 × 6 = 54</text></svg>
        caption: '9 rows of 6 is one row less than 10 rows of 6. So 9 × 6 = 60 − 6 = 54.'

  - title: Divide in parts
    blocks:
      - type: figure
        covers: [K2.3, K2.1, S2.2]
        figure: |-
          <svg viewBox="0 0 330 170" class="fig-svg" style="max-width:340px" role="img" aria-label="48 shared by 4: each plate gets 1 ten and 2 ones, so 12."><circle cx="45" cy="70" r="34" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2"/><rect x="29" y="45" width="9" height="50" rx="2" style="fill:var(--accent)"/><rect x="47" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><rect x="59" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><circle cx="125" cy="70" r="34" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2"/><rect x="109" y="45" width="9" height="50" rx="2" style="fill:var(--accent)"/><rect x="127" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><rect x="139" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><circle cx="205" cy="70" r="34" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2"/><rect x="189" y="45" width="9" height="50" rx="2" style="fill:var(--accent)"/><rect x="207" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><rect x="219" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><circle cx="285" cy="70" r="34" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2"/><rect x="269" y="45" width="9" height="50" rx="2" style="fill:var(--accent)"/><rect x="287" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><rect x="299" y="65" width="9" height="9" rx="2" style="fill:var(--sun)"/><text x="165" y="135" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--ink)">40 ÷ 4 = 10 and 8 ÷ 4 = 2</text><text x="165" y="160" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--ok)">48 ÷ 4 = 10 + 2 = 12</text></svg>
        caption: |-
          1. Split 48 into **40** and **8**.
          2. Share each part by 4, then add.
      - type: callout
        variant: tip
        covers: [K2.3, U2.2]
        title: Or take away again and again
        body: '48 − 12 − 12 − 12 − 12 = 0. Four jumps of 12, so 48 ÷ 4 = 12.'

  - title: Find the missing number
    blocks:
      - type: visual
        covers: [K2.6, S2.4]
        component: card-sort
        props:
          bins:
            - { id: '5', label: '5' }
            - { id: '6', label: '6' }
            - { id: '7', label: '7' }
          cards:
            - { text: '4 × ☐ = 20', bin: '5', why: '4 × 5 = 20.' }
            - { text: '☐ × 7 = 42', bin: '6', why: '6 × 7 = 42.' }
            - { text: '35 ÷ ☐ = 5', bin: '7', why: '35 shared by 7 is 5. Check: 7 × 5 = 35.' }
            - { text: '☐ ÷ 6 = 1', bin: '6', why: '6 ÷ 6 = 1.' }
            - { text: '30 ÷ 6 = ☐', bin: '5', why: '6 × 5 = 30, so 30 ÷ 6 = 5.' }
        caption: Which number hides in each box? The box can be anywhere.

keyTerms:
  - term: Multiply in parts
    covers: [K2.1, K2.2]
    definition: 'Split a factor into two parts, multiply each part, then add. 7 × 8 = 7 × 5 + 7 × 3.'
  - term: Missing number
    covers: [K2.6]
    definition: 'A box or symbol that stands for a number you need to find, like 4 × ☐ = 20.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S2.4, K2.6]
    type: number
    prompt: '\(6 \times \square = 48\). What number goes in the box?'
    answer: 8
    verify: 48 / 6
    hints:
      - Count by 6s until you reach 48. How many jumps?
    solution:
      - '6, 12, 18, 24, 30, 36, 42, 48. That is 8 jumps.'
      - 'So \(6 \times 8 = 48\). The box is **8**.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.1, S2.1]
    type: mc
    prompt: Kim splits **6 × 7** into two easier facts. Which split works?
    choices: ['6 × 5 + 6 × 2', '6 × 5 + 2', '6 × 3 + 6 × 3']
    answer: 0
    feedback:
      '1': 'The 2 is 2 more groups of 6, not just 2. How should you write that?'
      '2': '3 + 3 makes 6, but we need 7 groups. Check the parts add to 7.'
    hints:
      - 7 groups of 6 split into 5 groups and 2 groups. What does each part make?
    solution:
      - '7 = 5 + 2, so 6 × 7 = 6 × 5 + 6 × 2.'
      - '30 + 12 = 42.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: ways
    covers: [K2.2, U2.2, S2.2]
    type: number
    prompt: Movie tickets cost **$9** each. Mom buys **7** tickets. How much does she pay? Try $10 tickets first.
    unit: $
    answer: 63
    verify: 7 * 10 - 7
    hints:
      - 7 tickets at $10 would cost $70.
      - Each ticket really costs $1 less. How much too much is $70?
    solution:
      - '7 × 10 = 70. That is $1 too much for each of the 7 tickets.'
      - '70 − 7 = **63**. So 7 × 9 = 63.'

  - id: b2
    level: 2
    thinking: notice
    covers: [K2.3, S2.1]
    type: multi
    prompt: 'To find \(56 \div 4\), split 56 into two parts that are easy to share by 4. Choose **all** splits that work.'
    choices: ['40 and 16', '28 and 28', '50 and 6', '30 and 26']
    answer: [0, 1]
    feedback:
      '2': '50 can’t be shared by 4 without a leftover. Try a part you know, like 40.'
      '3': 'Count by 4s. Do you land on 30 or 26?'
    hints:
      - Which numbers do you land on when you count by 4s?
    solution:
      - '40 ÷ 4 = 10 and 16 ÷ 4 = 4. 10 + 4 = 14.'
      - '28 ÷ 4 = 7, twice. 7 + 7 = 14. Both splits give **56 ÷ 4 = 14**.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: backwards
    covers: [K2.6, S2.4, S2.3]
    type: investigation
    prompt: Two friends play a mystery number game.
    parts:
      - type: number
        prompt: 'Max thinks of a number and multiplies it by 4. He gets **36**. What was his number?'
        answer: 9
        verify: 36 / 4
        hints:
          - Write it as ☐ × 4 = 36. What undoes × 4?
        solution:
          - '☐ × 4 = 36, so ☐ = 36 ÷ 4 = **9**. Check: 9 × 4 = 36.'
      - type: number
        prompt: 'Lily divides **48** by her number. She gets **6**. What was her number?'
        answer: 8
        verify: 48 / 6
        hints:
          - Write it as 48 ÷ ☐ = 6. How many groups of 6 make 48?
        solution:
          - '48 ÷ ☐ = 6 means ☐ groups of 6 make 48.'
          - '6 × 8 = 48, so her number is **8**.'
    wrapUp: The box can be anywhere. Turn the fact around with the opposite operation to find it.

  - id: d2
    level: 3
    thinking: design
    covers: [K2.1, K2.2, S2.1]
    type: build
    prompt: |-
      Split **8 × 7** into two easier facts: 8 × ☐ + 8 × ☆.
      Pick the two numbers. Each must be at least 1.
    fields:
      - { name: a, label: '☐' }
      - { name: b, label: '☆' }
    rules:
      - { test: 'a % 1 == 0 && b % 1 == 0 && a >= 1 && b >= 1', fail: 'Use whole numbers, 1 or more.' }
      - { test: 'a + b == 7', fail: 'Together, the parts must make 7 groups of 8. Do ☐ and ☆ add to 7?' }
    examples:
      - { a: 5, b: 2 }
      - { a: 4, b: 3 }
      - { a: 1, b: 6 }
    counterexamples:
      - { a: 5, b: 3 }
      - { a: 0, b: 7 }
    hints:
      - 8 × 7 is 7 groups of 8. Split the 7 groups into two piles.
    solution:
      - '**5 + 2**: 8 × 5 + 8 × 2 = 40 + 16 = 56.'
      - '**4 + 3**: 8 × 4 + 8 × 3 = 32 + 24 = 56.'
      - 'Any two numbers that add to 7 work. Pick facts you already know.'
