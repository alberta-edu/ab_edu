id: imagery-similes
grade: 3
subject: english-language-arts
organizingIdea: LANENG-OI3
outcomes: [LANENG3-OI3-GQ1-LO1]
order: 10
title: Imagery, Hyperbole and Similes
shortTitle: Imagery & similes
summary: >-
  Tell words that mean just what they say from words that paint a picture. Add imagery, stretch the
  truth with hyperbole, and compare with like or as.

bigIdea: |-
  - **Literal** words mean just what they say. **Figurative** words paint a picture.
  - **Imagery** helps you see it. **Hyperbole** stretches the truth.
  - A **simile** compares two unlike things with **like** or **as**.

lesson:
  - title: Really true?
    blocks:
      - type: visual
        covers: [K1.2, S1.5]
        component: card-sort
        props:
          bins:
            - { id: lit, label: Means just what it says, icon: 📏 }
            - { id: fig, label: Paints a picture, icon: 🎨 }
          cards:
            - { text: My hands are cold., bin: lit, why: 'It means just what it says.' }
            - { text: My hands are as cold as ice!, bin: fig, why: 'Hands are not ice. The words help you feel how cold.' }
            - { text: The dog ran fast., bin: lit, why: 'It means just what it says.' }
            - { text: The dog ran like the wind!, bin: fig, why: 'A dog is not wind. It paints a picture of a fast dog.' }
            - { text: I’m so hungry I could eat a horse!, bin: fig, why: 'Nobody eats a horse! It shows how hungry you are.' }
        caption: Some words mean just what they say. That’s **literal**. Some paint a picture. That’s **figurative**.

  - title: Pictures in words
    blocks:
      - type: visual
        covers: [K1.3, K1.4, S1.5]
        component: g3e-picture-words
        props:
          sets:
            - label: Snowman
              picture: ⛄
              sentence: 'A {tall} snowman {in a red scarf|🧣} stood {by our front door|🚪}.'
            - label: Frog
              picture: 🐸
              sentence: 'A {fat, spotted} frog sat {on a floating lily pad|🪷} {under the bright full moon|🌕}.'
        caption: Tap each word button. Watch the picture get clearer.

  - title: Stretch the truth
    blocks:
      - type: visual
        covers: [K1.5, K1.2, S1.5]
        component: figure-lens
        props:
          items:
            - { phrase: My backpack weighs a ton!, kind: Hyperbole, picture: 🎒🐘, literally: 'Your backpack is as heavy as an elephant.', means: 'My backpack is very heavy.', because: 'It **exaggerates** to show how heavy it feels.' }
            - { phrase: I’ve told you a million times!, kind: Hyperbole, picture: 🗣️💯, literally: 'Someone counted to one million.', means: 'I have told you many times.', because: 'Nobody says anything a million times.' }
            - { phrase: This line is taking forever!, kind: Hyperbole, picture: 🧍🧍🧍⏳, literally: 'The line will never, ever end.', means: 'This line is very slow.', because: 'It makes the wait sound even longer.' }
        caption: '**Hyperbole** stretches the truth. Read each one **literally**. Then tap **What it means**.'

  - title: Like or as
    blocks:
      - type: visual
        covers: [K1.6, S1.5]
        component: figure-lens
        props:
          items:
            - { phrase: The pond was as smooth as glass., kind: Simile, picture: 🪞🦆, literally: 'The pond is made of glass. Ducks slide on it!', means: 'The water was flat and shiny.', because: 'It compares a pond and glass with **as**.' }
            - { phrase: Mo swims like a fish., kind: Simile, picture: 🧒🐟, literally: 'Mo has fins and a tail.', means: 'Mo swims very well.', because: 'It compares Mo and a fish with **like**.' }
            - { phrase: Her eyes sparkled like stars., kind: Simile, picture: 👀✨, literally: 'Her eyes are tiny stars, far up in the sky.', means: 'Her eyes were bright and happy.', because: 'It compares eyes and stars with **like**.' }
        caption: A **simile** compares two things that are not alike, using **like** or **as**.

  - title: Make a simile
    blocks:
      - type: visual
        covers: [K1.6, S1.5]
        component: card-sort
        props:
          bins:
            - { id: yes, label: Simile, icon: ✅ }
            - { id: no, label: Not a simile, icon: ❌ }
          cards:
            - { text: The bun was as soft as a pillow., bin: yes, why: 'It compares a bun and a pillow, two unlike things.' }
            - { text: I like hot chocolate., bin: no, why: 'Here *like* means enjoy. Nothing is compared.' }
            - { text: The sun was as round as a coin., bin: yes, why: 'A sun and a coin are not alike, but both are round.' }
            - { text: We like to skate., bin: no, why: '*Like* means enjoy here. No comparison.' }
        caption: Careful! Not every **like** makes a simile.
      - type: example
        covers: [S1.5, K1.6]
        title: Build your own simile
        problem: Describe your puppy.
        steps:
          - 'Pick one thing about it: *soft*.'
          - 'Think of something **unlike** a puppy that is also soft: *a cloud*.'
          - 'Join them with *as*: **My puppy is as soft as a cloud.**'

keyTerms:
  - term: Literal
    covers: [K1.2]
    definition: Meaning just what the words say.
  - term: Figurative language
    covers: [K1.2, K1.3]
    definition: Words used in a new way to paint a picture, like imagery, hyperbole and similes.
  - term: Imagery
    covers: [K1.4]
    definition: Words that help you see a picture in your mind.
  - term: Hyperbole
    covers: [K1.5]
    definition: Stretching the truth a lot, to make a point. Say it *hy-PER-bo-lee*.
  - term: Simile
    covers: [K1.6]
    definition: Comparing two unlike things using **like** or **as**. *As soft as a cloud.*

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.6, K1.3]
    type: mc
    prompt: Which one is a **simile**?
    choices:
      - Her hands were as cold as ice.
      - Her hands were very cold.
      - Her hands were colder than the North Pole!
    answer: 0
    feedback:
      '1': This means just what it says. Is anything being compared?
      '2': This stretches the truth. That is hyperbole. Look for **like** or **as**.
    hints:
      - A simile uses **like** or **as** to compare.
    solution:
      - '*As cold as ice* compares hands and ice with **as**. It is a **simile**.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.2, K1.5]
    type: mc
    prompt: 'Dad says, “I’m so tired I could sleep for a year!” What does he mean?'
    choices:
      - He is very tired.
      - He will sleep for a whole year.
      - He is not tired at all.
    answer: 0
    feedback:
      '1': Can a person really sleep for a year? Read it as a picture, not a fact.
      '2': He said *so tired*. Look at those words again.
    hints:
      - Is this **literal**, or is Dad stretching the truth?
    solution:
      - Dad is using **hyperbole**. He stretches the truth to show he is **very tired**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.4, S1.5]
    type: multi
    prompt: Lin wrote about a picnic. Tap **every** sentence with **imagery** that helps you **see** it.
    choices:
      - We sat on a red blanket with white squares.
      - We had a picnic.
      - Pink juice dripped from my watermelon.
      - It was a good day.
    answer: [0, 2]
    feedback:
      '1': Can you see what the picnic looked like from these words?
      '3': Do you know what made it good? Can you picture it?
    hints:
      - Close your eyes. Which sentences make a picture?
      - Look for colours and details.
    solution:
      - '*Red blanket with white squares* and *pink juice dripped* help you **see** the picnic.'
      - '*We had a picnic* and *a good day* tell you, but don’t paint a picture.'

  - id: b2
    level: 2
    thinking: why
    covers: [K1.6, S1.5]
    type: mc
    prompt: 'Sam wrote, “I like my soft kitten.” Ava wrote, “My kitten is soft like a cloud.” Who wrote a **simile**?'
    choices:
      - Ava
      - Sam
      - Both, because both use *like*
    answer: 0
    feedback:
      '1': In Sam’s sentence, *like* means *enjoy*. Is anything compared?
      '2': Is a comparison made in **both** sentences?
    hints:
      - A simile compares two things. What is each sentence comparing?
    solution:
      - Ava compares a kitten and a cloud with **like**. That is a **simile**.
      - In Sam’s sentence, *like* means *enjoy*. Nothing is compared.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: whatif
    covers: [K1.6, K1.4, S1.5]
    type: mc
    prompt: 'A writer wrote, “The pond was as smooth as glass.” What if she just wrote, “The pond was smooth”? What would we **lose**?'
    choices:
      - The picture of a flat, shiny pond
      - The fact that it is a pond
      - Nothing. They say the same thing.
    answer: 0
    feedback:
      '1': Both sentences say *pond*. What is only in the first one?
      '2': Picture both. Do you see the same thing?
    hints:
      - Close your eyes and picture glass. What is it like?
    solution:
      - Glass is flat, smooth and shiny. The simile makes you **see** the pond that way.
      - Without it, the pond is smooth, but you don’t picture it as well.

  - id: d2
    level: 3
    thinking: flaw
    covers: [K1.6, S1.5]
    type: text
    prompt: 'Leo wrote, “The rink shone like ice.” But a rink **is** ice, so it is not a simile! Fix it: *The rink shone like ___.*'
    accept: [a mirror, mirror, mirrors, glass, a diamond, diamond, diamonds, a star, star, stars, the stars, the sun, sun, the moon, moon, gold, silver, a jewel, jewel, jewels, a gem, gem, gems, a crystal, crystal, glitter, a window, window, a coin, coin, coins, a new coin, a lamp, lamp, a light, light, lights, a lightbulb, lightbulb, a pearl, pearl, a spoon, spoon, a sparkler, a crown, a ring, a trophy, a necklace, a polished car, metal, foil]
    hints:
      - A simile compares two **unlike** things. What else shines?
      - Think of things that sparkle, but are not ice.
    solution:
      - A rink and ice are the same thing, so nothing new is compared.
      - 'Pick something **unlike** a rink that also shines: *The rink shone like a mirror.*'
      - '*Like a diamond*, *like the sun* and *like glass* work too.'
