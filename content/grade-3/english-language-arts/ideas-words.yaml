id: ideas-words
grade: 3
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG3-OI8-GQ1-LO1]
order: 18
title: Finding Ideas and Choosing Words
shortTitle: Ideas & words
summary: >-
  Find ideas in your life, your imagination and books. Bring writing alive with your senses, exact
  words and sentences that start in new ways.

bigIdea: |-
  - Ideas come from your **life**, what you **know**, your **imagination** and **books**.
  - **Sensory details** and **exact words** help readers see and feel.
  - Start sentences in different ways. Let your writing sound like **you**.

lesson:
  - title: Where ideas come from
    blocks:
      - type: visual
        covers: [K2.3, S2.3]
        component: card-sort
        props:
          bins:
            - { id: life, label: My life, icon: 🏠 }
            - { id: know, label: What I know, icon: 🧠 }
            - { id: imagine, label: My imagination, icon: 🦄 }
            - { id: book, label: A book I read, icon: 📚 }
          cards:
            - { text: The day I lost a tooth at the rink, bin: life, why: 'It really happened to you.' }
            - { text: How bees make honey, bin: know, why: 'Facts you have learned.' }
            - { text: A dragon who is scared of the dark, bin: imagine, why: 'You made it up!' }
            - { text: A new ending for my favourite book, bin: book, why: 'A book gave you the idea.' }
        caption: Writers find ideas everywhere. Where did each idea come from?
      - type: callout
        variant: tip
        covers: [K2.1, S2.11]
        title: Brainstorm, then keep going
        body: |-
          1. List lots of ideas, fast. No idea is silly.
          2. Pick the one you care about most.
          3. Stuck? Talk it out, draw it, or take a break. Then try again.

  - title: Use your senses
    blocks:
      - type: visual
        covers: [K2.6, S2.6, S2.2, K2.5]
        component: craft-toggles
        props:
          parts:
            - { id: see, label: See, icon: 👀, plain: 'We had a campfire.', crafted: 'Orange flames leapt up into the dark sky.', why: 'Now you can **see** it.' }
            - { id: hear, label: Hear, icon: 👂, plain: 'It made noise.', crafted: 'The logs crackled and popped.', why: 'Now you can **hear** it.' }
            - { id: smell, label: Smell, icon: 👃, plain: 'It smelled good.', crafted: 'The air smelled of smoke and toasted marshmallows.', why: 'Now you can **smell** it.' }
            - { id: touch, label: Touch, icon: ✋, plain: 'I was warm.', crafted: 'The heat made my cold cheeks tingle.', why: 'Now you can **feel** it.' }
            - { id: taste, label: Taste, icon: 👅, plain: 'I ate a s’more.', crafted: 'My s’more was gooey, sweet and crunchy.', why: 'Now you can **taste** it.' }
        caption: Switch on one sense at a time. Then try **All of them**.

  - title: Pick the exact word
    blocks:
      - type: visual
        covers: [K2.6, S2.6, K2.5]
        component: word-shades
        props:
          sets:
            - plain: walked
              sentence: The cat ___ across the floor.
              icon: 🐈
              words:
                - { word: tiptoed, size: 0.8, note: 'Quiet, careful little steps.' }
                - { word: strolled, note: 'Slow and relaxed.' }
                - { word: stomped, move: bounce, size: 1.3, note: 'Loud, heavy steps. Is the cat grumpy?' }
            - plain: said
              sentence: '“Look at the moose!” Sam ___.'
              icon: 🫎
              words:
                - { word: whispered, size: 0.8, note: 'Very quietly, so the moose won’t run.' }
                - { word: called, size: 1.3, note: 'Loud enough for others to hear.' }
                - { word: shouted, move: bounce, size: 1.7, note: 'Very loud and excited!' }
        caption: Slide to swap the plain word. Each one paints a different picture.
      - type: callout
        variant: tip
        covers: [K2.6]
        title: Opposites make a big change
        body: 'Use **antonyms** to show a change: *The **tiny** seed grew into a **giant** sunflower.*'

  - title: Start in different ways
    blocks:
      - type: visual
        covers: [K1.5, S1.5]
        component: craft-toggles
        props:
          parts:
            - { id: time, label: When, icon: ⏰, plain: 'I went to the pool.', crafted: 'On Saturday, I went to the pool.', why: 'Start with **when** it happened.' }
            - { id: sound, label: Sound, icon: 💦, plain: 'I jumped in.', crafted: 'Splash! I jumped in.', why: 'Start with a **sound**.' }
            - { id: how, label: How, icon: 🏊, plain: 'I swam to the end.', crafted: 'Kicking hard, I swam to the end.', why: 'Start with **how** you did it.' }
            - { id: ask, label: Question, icon: ❓, plain: 'I was tired.', crafted: 'Was I tired? You bet!', why: 'A **question** changes the kind of sentence.' }
        caption: Every sentence starts with *I*. Switch on each new start. Which version is more fun to read?

  - title: Your form, your voice
    blocks:
      - type: visual
        covers: [S2.4, S2.1, U2.1]
        component: card-sort
        props:
          bins:
            - { id: letter, label: Letter, icon: ✉️ }
            - { id: journal, label: Journal, icon: 📓 }
            - { id: poem, label: Poem, icon: 🎨 }
          cards:
            - { text: You miss your cousin who moved away., bin: letter, why: 'A letter tells your cousin how you feel.' }
            - { text: You want to remember your first day at the lake., bin: journal, why: 'A journal keeps your own memories.' }
            - { text: The first snow makes you feel amazed., bin: poem, why: 'A poem can paint a feeling in a few words.' }
        caption: Choose a form that fits your feeling, and your reader. Which form fits best?
      - type: callout
        variant: tip
        covers: [K2.4, K2.2]
        title: Sound like you
        body: The ideas you pick, the words you choose and how you show them make your writing sound like **you**. That is your **voice**.

keyTerms:
  - term: Brainstorm
    covers: [K2.1]
    definition: To list lots of ideas quickly, before choosing one.
  - term: Sensory details
    covers: [K2.6]
    definition: Words about what you see, hear, smell, taste and touch.
  - term: Specific word
    covers: [K2.6]
    definition: An exact word that says just what you mean, like *tiptoed* instead of *walked*.
  - term: Voice
    covers: [K2.4]
    definition: The way your writing sounds like you, so readers can picture and feel it.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K2.6]
    type: mc
    prompt: 'Which **sense** does this detail use? *The bacon sizzled in the pan.*'
    choices:
      - Hearing
      - Sight
      - Taste
    answer: 0
    feedback:
      '1': Can you see a sizzle, or do you hear it?
      '2': The bacon might taste great. But what does *sizzled* tell you?
    hints:
      - What does *sizzle* sound like?
    solution:
      - '*Sizzled* is a sound. It uses **hearing**.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.6, S2.6]
    type: mc
    prompt: Which word is the most **specific**?
    choices:
      - tulip
      - flower
      - plant
    answer: 0
    feedback:
      '1': There are many kinds of flowers. Which word names just one kind?
      '2': A plant could be a tree, grass or a flower. Which word is most exact?
    hints:
      - Which word lets you picture exactly one thing?
    solution:
      - A **tulip** is one exact kind of flower. It’s the most specific.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: decide
    covers: [S2.4, S2.1]
    type: mc
    prompt: Jun wants to tell his grandma, far away in Korea, how much he misses her. Which form fits best?
    choices:
      - A letter to his grandma
      - A list of steps
      - A fact report about Korea
    answer: 0
    feedback:
      '1': Steps teach how to do something. Do they share a feeling?
      '2': A report gives facts. Does it say how Jun feels?
    hints:
      - Who will read it? What does Jun want to share?
    solution:
      - A **letter** speaks right to Grandma, and shares Jun’s feelings.

  - id: b2
    level: 2
    thinking: notice
    covers: [S2.2, K2.6]
    type: mc
    prompt: Which sentence uses **two** senses?
    choices:
      - The cold, salty waves crashed on the rocks.
      - The waves were nice.
      - We went to the beach.
    answer: 0
    feedback:
      '1': Can you see, hear, smell, taste or touch anything in *nice*?
      '2': Is there a sound, a smell or a feeling here?
    hints:
      - Look for words you can feel, taste or hear.
    solution:
      - '*Cold* is touch. *Salty* is taste. *Crashed* is sound. That’s more than two!'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: decide
    covers: [S2.6, K2.5, K2.6]
    type: mc
    prompt: 'Max wrote, “It was a good day. The food was good. The game was good.” Which revision keeps readers most **interested**?'
    choices:
      - The hot dogs sizzled, and our team scored three goals!
      - It was a very, very, very good day.
      - It was a good day, and good, and good.
    answer: 0
    feedback:
      '1': Does adding *very* help you picture the day?
      '2': Is *good* still repeated?
    hints:
      - Which one uses a sense and exact words?
    solution:
      - '*Good* doesn’t paint a picture. *Sizzled* is a sound, and *scored three goals* is exact.'
      - Sensory details and exact words keep readers interested.

  - id: d2
    level: 3
    thinking: design
    covers: [S2.6, K2.6, S1.5]
    type: open
    prompt: Write two sentences about your favourite food. Use at least **two senses**, and start each sentence a different way.
    modelAnswer: |-
      Crunch! The crispy apple squirted sweet juice on my chin. After lunch, my fingers still smelled like apples.
    rubric:
      - It names a food.
      - It uses at least two senses, like taste and smell.
      - It uses exact words, not *good* or *nice*.
      - The two sentences start in different ways.
