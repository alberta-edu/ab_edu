id: plurals-endings
grade: 3
subject: english-language-arts
organizingIdea: LANENG-OI9
outcomes: [LANENG3-OI9-GQ1-LO1]
order: 25
title: Plurals and Word Endings
shortTitle: Plurals & endings
summary: >-
  Change y to i and f to v to make plurals, meet plurals that break the rules, add endings that do jobs,
  drop an e or double a letter, and compare with -er and -est.

bigIdea: |-
  - Some plurals change letters: *pony* → *ponies*, *leaf* → *leaves*. Some don’t follow a pattern at all.
  - **Endings** like -s, -ed, -’s and -er change what a word tells you.
  - Before -ing or -ed, you may **drop an e** or **double a letter**.

lesson:
  - title: Change the y, change the f
    blocks:
      - type: visual
        covers: [K3.1, S5.6, S3.1]
        component: suffix-builder
        props:
          spelling: true
          suffixes:
            - suffix: es
              meaning: '“more than one”'
              words:
                - { base: pony, word: ponies, means: 'more than one pony' }
                - { base: berry, word: berries, means: 'more than one berry' }
                - { base: leaf, word: leaves, means: 'more than one leaf' }
                - { base: wolf, word: wolves, means: 'more than one wolf' }
                - { base: knife, word: knives, means: 'more than one knife' }
        caption: Watch the last letters change before **-es** joins on.
      - type: callout
        variant: tip
        covers: [K3.1]
        title: Two patterns
        body: |-
          - Ends in **y**? Change *y* to *i*, add **es**.
          - Ends in **f** or **fe**? Change it to *v*, add **es**.

  - title: Same word, or a new word?
    blocks:
      - type: visual
        covers: [K3.2, S3.3, S5.6]
        component: card-sort
        props:
          bins:
            - { id: same, label: Stays the same, icon: 🟰 }
            - { id: new, label: Changes, icon: 🔄 }
          cards:
            - { text: 'one moose, two **moose**', bin: same, why: '*Moose* is the same for one or many.' }
            - { text: 'one person, two **people**', bin: new, why: '*Person* becomes a new word, *people*.' }
            - { text: 'one sheep, ten **sheep**', bin: same, why: '*Sheep* stays the same.' }
            - { text: 'one mouse, three **mice**', bin: new, why: '*Mouse* changes to *mice*.' }
            - { text: 'one child, two **children**', bin: new, why: '*Child* changes to *children*.' }
        caption: These plurals don’t just add -s. Does the word stay the same, or change?

  - title: Endings that do jobs
    blocks:
      - type: visual
        covers: [K5.3, S5.3, U5.1]
        component: suffix-builder
        props:
          suffixes:
            - suffix: s
              meaning: '**more than one**'
              words:
                - { base: cat, word: cats, means: 'more than one cat' }
                - { base: book, word: books, means: 'more than one book' }
            - suffix: ed
              meaning: '**in the past** (tense)'
              words:
                - { base: jump, word: jumped, means: 'jumped before now' }
                - { base: play, word: played, means: 'played before now' }
            - suffix: ’s
              meaning: '**belongs to** (possession)'
              words:
                - { base: dog, word: dog’s, means: 'belongs to the dog' }
                - { base: Mia, word: Mia’s, means: 'belongs to Mia' }
            - suffix: er
              meaning: '**more** (comparing two)'
              words:
                - { base: short, word: shorter, means: 'more short' }
                - { base: warm, word: warmer, means: 'more warm' }
        caption: Tap each ending. What job does it do?

  - title: Drop the e, double the letter
    blocks:
      - type: visual
        covers: [K5.4, S5.8, S5.3]
        component: suffix-builder
        props:
          spelling: true
          suffixes:
            - suffix: ing
              meaning: '**happening now**'
              words:
                - { base: bake, word: baking, means: 'making a cake right now' }
                - { base: ride, word: riding, means: 'on a bike right now' }
                - { base: run, word: running, means: 'running right now' }
                - { base: swim, word: swimming, means: 'in the pool right now' }
            - suffix: ed
              meaning: '**in the past**'
              words:
                - { base: hop, word: hopped, means: 'hopped before now' }
                - { base: stop, word: stopped, means: 'stopped before now' }
        caption: Watch the **e** drop, or the last letter double.
      - type: callout
        variant: tip
        covers: [K5.4, S5.8]
        title: Two helpful rules
        body: |-
          - Ends in a silent **e**? Drop it, then add **ing**.
          - Short words like *run* and *hop* often **double** the last letter.

  - title: Bigger and biggest
    blocks:
      - type: visual
        covers: [S5.7, K5.3]
        component: compare-scale
        props:
          sets:
            - adjective: big
              er: bigger
              est: biggest
              items:
                - { name: The mouse, icon: 🐭, size: 0.7 }
                - { name: The dog, icon: 🐕, size: 1.3 }
                - { name: The bear, icon: 🐻, size: 2.1 }
            - adjective: heavy
              er: heavier
              est: heaviest
              items:
                - { name: The cat, icon: 🐈, size: 0.8 }
                - { name: The pig, icon: 🐖, size: 1.4 }
                - { name: The elephant, icon: 🐘, size: 2.2 }
        caption: Compare **2** things with **-er**. Compare **3** with **-est**.

keyTerms:
  - term: Plural
    covers: [K3.1, K3.2]
    definition: A word for more than one, like *ponies* or *people*.
  - term: Ending
    covers: [K5.3]
    definition: Letters like -s, -ed, -ing or -er added to the end of a base word.
  - term: -er and -est
    covers: [S5.7]
    definition: Endings that compare. Use -er for two things and -est for three or more.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K3.1, S5.6]
    type: mc
    prompt: How do you spell more than one **pony**?
    choices:
      - ponies
      - ponys
      - ponyes
    answer: 0
    feedback:
      '1': '*Pony* ends in *y*. What happens to the *y*?'
      '2': The *y* doesn’t stay. What does it change to?
    hints:
      - Change the *y* to *i*, then add **es**.
    solution:
      - '*Pony* ends in *y*. Change it to *i* and add *es*: **ponies**.'

  - id: w2
    level: 1
    thinking: recall
    covers: [K3.2, S3.3]
    type: mc
    prompt: 'One moose, two ___?'
    choices:
      - moose
      - mooses
      - meese
    answer: 0
    feedback:
      '1': It sounds right for most words, but not this one!
      '2': '*Goose* becomes *geese*. Does *moose* change too?'
    hints:
      - Some plurals stay exactly the same.
    solution:
      - '**Moose** is the same for one or many.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: apply
    covers: [K5.4, S5.3, S5.8]
    type: text
    prompt: Add **-ing** to **ride**. Type the new word.
    accept: [riding]
    hints:
      - Does *ride* end in a silent *e*?
    solution:
      - 'Drop the silent *e*, then add *ing*: **riding**.'

  - id: b2
    level: 2
    thinking: notice
    covers: [S5.7, K5.3]
    type: mc
    prompt: 'Which word finishes it? *Today is the ___ day of the whole year!*'
    choices:
      - coldest
      - colder
      - cold
    fixedOrder: true
    answer: 0
    feedback:
      '1': '*Colder* compares two days. How many days are in the year?'
      '2': '*The cold day of the whole year* sounds odd. It needs an ending.'
    hints:
      - Is it comparing two days, or every day of the year?
    solution:
      - 'It compares more than two days, so use **-est**: **coldest**.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: pattern
    covers: [K3.1, S5.6, S3.2]
    type: text
    prompt: '*Leaf* becomes *leaves*. Use the same pattern: one **shelf**, two ___?'
    accept: [shelves]
    hints:
      - What happens to the *f* in *leaf*?
      - Change the *f* to *v*, then add *es*.
    solution:
      - '*Leaf* → *leaves*, so *shelf* → **shelves**.'

  - id: d2
    level: 3
    thinking: flaw
    covers: [K5.4, S5.8]
    type: mc
    prompt: |-
      Max wrote:

      > We were runing to the bus.

      What is wrong?
    choices:
      - '*Run* doubles the *n*: *running*.'
      - It should be *runned*.
      - Nothing is wrong.
    answer: 0
    feedback:
      '1': '*Runned* isn’t a word. Look at how *runing* is spelled.'
      '2': Look closely at *runing*. How many *n*s?
    hints:
      - Short words like *run* often double the last letter before *ing*.
    solution:
      - '*Run* doubles its last letter before *ing*: **running**.'
