nton</text></g><g transform="translate(160.9 367.5)"><circle r="3.5" fill="#1c1b24"/><text x="6" y="4" font-size="11" font-weight="700" fill="#1c1b24" stroke="#fff" stroke-width="3" paint-order="stroke">Calgary</text></g></svg>
