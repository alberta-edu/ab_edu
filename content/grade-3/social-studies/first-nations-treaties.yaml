id: first-nations-treaties
grade: 3
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [tEnI7u83hUui8ILilKfYZA]
order: 2
title: First Nations and the Treaties
shortTitle: First Nations & treaties
summary: >-
  First Nations were the first people in Alberta. Walk through time to the treaties, find Treaties 4, 6,
  7, 8 and 10 on a map, and sort why each side signed.

bigIdea: |-
  - First Nations have lived on this land **since time immemorial**.
  - Alberta has five numbered **treaties**: 4, 6, 7, 8 and 10.
  - First Nations signed for peace and to keep living on the land. Canada signed to get land and resources.

lesson:
  - title: The first people here
    blocks:
      - type: visual
        covers: [K1.1, U1.1, K1.2]
        component: g3ss-story-steps
        props:
          walker: 🦬
          steps:
            - { icon: 🏕️, when: Long ago, text: 'Many **First Nations** live on this land. It is their **traditional territory**.' }
            - { icon: 📜, when: 1874 to 1877, text: 'First Nations and the Government of Canada sign **Treaties 4, 6 and 7**.' }
            - { icon: 📜, when: '1899', text: 'They sign **Treaty 8**, in the north.' }
            - { icon: ⭐, when: '1905', text: 'Alberta becomes a province.' }
            - { icon: 📜, when: '1906', text: 'They sign **Treaty 10**.' }
        caption: Press ▶ and walk through time. Who was here first?
      - type: callout
        variant: tip
        covers: [K1.1, U1.1]
        title: Since time immemorial
        body: This means for longer than anyone can remember. First Nations were the **first people** to live in what is now Alberta.

  - title: Five treaties
    blocks:
      - type: visual
        covers: [K1.2, S1.1]
        component: g3ss-alberta-map
        props:
          layer: treaties
          cities: [edmonton, calgary]
          items:
            - { id: t8, text: 'Signed in 1899. It is the biggest treaty area in Alberta. Cree, Dene and other First Nations signed it.' }
            - { id: t6, text: 'Signed in 1876. Edmonton is here. Cree and other First Nations signed it.' }
            - { id: t7, text: 'Signed in 1877 at Blackfoot Crossing. Calgary is here. The Siksika, Kainai, Piikani, Stoney Nakoda and Tsuut’ina signed it.' }
            - { id: t4, text: 'Signed in 1874. Only a small corner is in Alberta. Most of it is in Saskatchewan.' }
            - { id: t10, text: 'Signed in 1906. Only a small part is in Alberta. Most of it is in Saskatchewan.' }
        caption: Tap each treaty. A **treaty** is an agreement between nations.

  - title: Why sign a treaty?
    blocks:
      - type: visual
        covers: [K1.3, K1.4, S1.2]
        component: card-sort
        props:
          bins:
            - { id: fn, label: First Nations, icon: 🪶 }
            - { id: gov, label: Government of Canada, icon: 🏛️ }
          cards:
            - { text: 'We want peace between our peoples.', bin: fn, why: 'First Nations signed treaties to **keep the peace**.' }
            - { text: 'We want to keep living on this land, as our families always have.', bin: fn, why: 'First Nations signed to **continue living on the land**.' }
            - { text: 'We want land where settlers can come and farm.', bin: gov, why: 'Canada wanted land for **settlement**.' }
            - { text: 'We want to use the coal, wood and other natural resources here.', bin: gov, why: 'Canada wanted to reach **natural resources**.' }
        caption: Who would say each one? Tap the side that fits.
      - type: figure
        covers: [K1.3, K1.4]
        figure: |-
          <svg viewBox="0 0 300 90" class="fig-svg" role="img" aria-label="Two groups shake hands over a treaty paper.">
            <rect x="0" y="0" width="300" height="90" rx="10" fill="#fcefe0"/>
            <text x="60" y="58" font-size="40" text-anchor="middle">🪶</text>
            <text x="150" y="58" font-size="40" text-anchor="middle">🤝</text>
            <text x="240" y="58" font-size="40" text-anchor="middle">🏛️</text>
            <text x="150" y="82" font-size="12" text-anchor="middle" fill="#1c1b24">Each side had its own reasons.</text>
          </svg>
        caption: A treaty is an agreement. Both sides signed it.

  - title: Find the treaties
    blocks:
      - type: visual
        covers: [S1.1, K1.2]
        component: g3ss-alberta-map
        props:
          layer: treaties
          find: true
          cities: [edmonton, calgary]
          items:
            - { id: t7, text: 'Treaty 7 is in the south-west, around Calgary.' }
            - { id: t6, text: 'Treaty 6 is in the middle, around Edmonton.' }
            - { id: t8, text: 'Treaty 8 covers the north.' }
            - { id: t4, text: 'Treaty 4 is a small corner in the south-east.' }
            - { id: t10, text: 'Treaty 10 is a small part on the east side.' }
        caption: Play the game. Tap the treaty the map asks for.

keyTerms:
  - term: Treaty
    covers: [K1.2, K1.3]
    definition: An agreement between nations. In Alberta, First Nations and the Government of Canada signed treaties.
  - term: Traditional territory
    covers: [K1.1]
    definition: Land where a First Nation has lived and cared for the land for a very long time.
  - term: Since time immemorial
    covers: [K1.1, U1.1]
    definition: For longer than anyone can remember.

problems:
