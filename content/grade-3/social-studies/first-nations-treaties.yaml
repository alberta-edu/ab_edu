  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: flaw
    covers: [K1.1, U1.1]
    type: mc
    prompt: 'Sam says, "Before the treaties, nobody lived in Alberta." What is wrong with Sam’s idea?'
    choices:
      - First Nations lived here long before the treaties. They signed them.
      - Nothing. People only came here after the treaties were signed.
      - Settlers lived here first, and First Nations came after the treaties.
    answer: 0
    feedback:
      '1': Who signed the treaties with the government? Where did they live?
      '2': Who were the first people to live in what is now Alberta?
    hints:
      - A treaty needs two sides. Who was the other side?
    solution:
      - First Nations have lived on this land **since time immemorial**.
      - They were here to sign the treaties, so people lived here long before.

  - id: d2
    level: 3
    thinking: connect
    covers: [K1.2, K1.1, S1.1]
    type: order
    prompt: Put these in order, from first to last. You know when Alberta became a province!
    items:
      - Many First Nations live on this land.
      - Treaty 7 is signed (1877).
      - Alberta becomes a province.
      - Treaty 10 is signed (1906).
    hints:
      - Who was here first of all?
      - In what year did Alberta become a province? Compare it with 1877 and 1906.
    solution:
      - First Nations lived here first, since time immemorial.
      - 'Then the years: 1877, then **1905**, when Alberta became a province, then 1906.'
      - So Treaty 10 was signed **after** Alberta became a province.
