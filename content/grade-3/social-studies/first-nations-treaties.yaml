  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: perspective
    covers: [K1.3, K1.4, S1.2]
    type: mc
    prompt: 'At a treaty meeting long ago, someone says, "We want our children to keep hunting and living on this land." Who most likely said it?'
    choices: [🪶 A First Nations leader, 🏛️ A Government of Canada official]
    fixedOrder: true
    answer: 0
    feedback:
      '1': The government wanted land for settlers and resources. Whose families had always lived on this land?
    hints:
      - Whose families had always lived on this land?
    solution:
      - First Nations signed treaties so they could **keep living on the land**, as they always had.
      - The government wanted land for settlers and natural resources.

