    level: 1
    thinking: recall
    covers: [K1.2]
    type: number
    prompt: How many numbered treaties are there in Alberta?
    answer: 5
    verify: '5'
    unit: treaties
    hints:
      - 'Count them on the map: Treaty 4, Treaty 6, and so on.'
    solution:
      - 'There are **5**: Treaties 4, 6, 7, 8 and 10.'

