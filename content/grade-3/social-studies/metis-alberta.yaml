id: metis-alberta
grade: 3
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [C_WNkKO6SkOOEOWyK5nq7g]
order: 5
title: Métis Culture and Settlements
shortTitle: Métis culture & Settlements
summary: >-
  Watch First Nations and European ways blend into Métis culture, flip cards for the sash and the Red
  River cart, and find Alberta's eight Métis Settlements.

bigIdea: |-
  - The **Métis** have their own culture. It blends First Nations and European ways.
  - The **sash** and the **Red River cart** are Métis symbols. Many Métis speak **Michif**.
  - In Alberta's eight **Métis Settlements**, Métis people govern themselves.

lesson:
  - title: A blended way of life
    blocks:
      - type: visual
        covers: [K1.9, K1.7, U1.2]
        component: g3ss-blend
        props:
          left: { icon: 🪶, label: First Nations ways, items: ['Hunting and trapping', 'The Cree language'] }
          right: { icon: ⛵, label: European ways, items: ['Farming', 'The French language'] }
          middle: { icon: ♾️, label: Métis ways, items: ['Farming, hunting and trapping', '**Michif**, a language that mixes Cree and French'] }
        caption: Press ▶ and watch two ways of life blend into something new.
      - type: callout
        variant: remember
        covers: [gYX2AoeJmEOgIv0JRUC3Cg#K1.3]
        title: From Grade 2
        body: Métis traditions and languages, such as Michif, have both **First Nations** and **European** roots.

  - title: Métis symbols
    blocks:
      - type: visual
        covers: [K1.8, S1.2, S1.4]
        component: g3ss-symbol-cards
        props:
          cards:
            - { art: sash, title: The sash, text: 'A bright belt, woven by hand. It could also be a rope or a strap. It blends First Nations and European weaving.' }
            - { art: red-river-cart, title: Red River cart, text: 'Made of wood and rawhide, with no metal. Métis families used it to carry goods across the prairie.' }
        caption: Two symbols of Métis culture. What does each one tell you?
      - type: callout
        variant: tip
        covers: [U1.2, K1.8]
        title: A distinct culture
        body: Métis culture is not First Nations and not European. It is its own, with its own history.

  - title: Métis Settlements
    blocks:
      - type: visual
        covers: [K1.6, S1.3]
        component: g3ss-alberta-map
        props:
          layer: metis
          cities: [edmonton]
          items:
            - { id: paddle-prairie, text: 'The farthest north of the eight Settlements.' }
            - { id: peavine, text: 'In the north-west, near High Prairie.' }
            - { id: gift-lake, text: 'In the north, east of Peavine.' }
            - { id: east-prairie, text: 'South of the town of High Prairie.' }
            - { id: buffalo-lake, text: 'North-east of Edmonton.' }
            - { id: kikino, text: 'Right beside Buffalo Lake Settlement.' }
            - { id: fishing-lake, text: 'Near the Saskatchewan border.' }
            - { id: elizabeth, text: 'Also near the Saskatchewan border.' }
        caption: Tap each purple dot. Alberta is the only province with Métis Settlements.
      - type: callout
        variant: tip
        covers: [K1.6]
        title: Self-government
        body: People in each Settlement elect their own council. The council makes decisions for the community.

  - title: Find the Settlements
    blocks:
      - type: visual
        covers: [S1.3]
        component: g3ss-alberta-map
        props:
          layer: metis
          find: true
          cities: [edmonton]
          items:
            - { id: paddle-prairie, text: 'The farthest north.' }
            - { id: buffalo-lake, text: 'North-east of Edmonton.' }
            - { id: east-prairie, text: 'The one farthest south in the west.' }
            - { id: elizabeth, text: 'On the east side, near Saskatchewan.' }
        caption: Play the game. Tap the Settlement the map asks for.

keyTerms:
  - term: Métis
    covers: [K1.9, U1.2]
    definition: A people with their own culture that blends First Nations and European ways.
  - term: Michif
    covers: [K1.7]
    definition: A Métis language that mixes Cree and French.
  - term: Métis Settlement
    covers: [K1.6]
    definition: A community in Alberta where Métis people govern themselves.
  - term: Self-government
    covers: [K1.6]
    definition: When a community makes its own decisions and chooses its own leaders.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.7]
    type: mc
    prompt: Which Métis language mixes Cree and French?
    choices: [Michif, Blackfoot, Dene]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Blackfoot is a First Nations language. Does it mix in French?
      '2': Dene is a First Nations language. Does it mix in French?
    hints:
      - Look back at the middle circle in the lesson.
    solution:
      - '**Michif** mixes Cree and French. It is a Métis language.'

  - id: w2
    level: 1
    thinking: notice
    covers: [S1.3, K1.6]
    type: mc
    prompt: Look at the map. Each purple dot is a Métis Settlement. Where are they?
