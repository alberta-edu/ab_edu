id: alberta-symbols
grade: 3
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [_XseQ8wNwUa9Ay2CnSzd2w, C_WNkKO6SkOOEOWyK5nq7g]
order: 13
title: Alberta's Symbols
shortTitle: Alberta's symbols
summary: >-
  Flip cards for Alberta's official symbols, build the shield from the flag one part at a time, and
  sort what each symbol says about Alberta's land and people.

bigIdea: |-
  - Alberta’s government has official **symbols**: a flag, colours, a coat of arms, a flower, a mammal and a motto.
  - The shield shows Alberta’s **land**, from mountains to wheat fields.
  - Symbols show Alberta’s **heritage** and **identity**.

lesson:
  - title: Alberta’s symbols
    blocks:
      - type: visual
        covers: [K1.10, S1.3]
        component: g3ss-symbol-cards
        props:
          cards:
            - { art: ab-flag, title: Flag of Alberta, text: 'Alberta’s shield on a blue background. It became the flag in 1968.' }
            - { art: blue-gold, title: Blue and gold, text: 'Alberta’s colours. Blue is for the sky, and gold is for the prairies.' }
            - { art: shield, title: Coat of arms, text: 'The shield, with a beaver and a crown on top. A lion and a pronghorn stand at the sides.' }
            - { art: wild-rose, title: Wild rose, text: 'Alberta’s flower. It grows almost everywhere in Alberta.' }
            - { art: 🐏, title: Bighorn sheep, text: 'Alberta’s mammal, the **Rocky Mountain bighorn sheep**. It lives mostly in the mountains.' }
            - { art: motto, title: Fortis et liber, text: 'Alberta’s motto. In Latin, it means **strong and free**.' }
        caption: Flip all six. Which one have you seen before?

  - title: Build the shield
    blocks:
      - type: visual
        covers: [K1.10, C_WNkKO6SkOOEOWyK5nq7g#K1.19]
        component: g3ss-shield-build
        props:
          parts:
            - { id: cross, text: 'The red cross of St. George. It is on England’s flag too.' }
            - { id: mountains, text: 'Snowy Rocky Mountains under a blue sky.' }
            - { id: hills, text: 'Green, rolling foothills.' }
            - { id: prairie, text: 'Flat prairie land.' }
            - { id: wheat, text: 'A field of wheat, for Alberta’s farms.' }
          done: 'This shield is on Alberta’s **flag** and **coat of arms**.'
        caption: Press ▶ to add each part. What does the shield show?

  - title: What do they say?
    blocks:
      - type: visual
        covers: [C_WNkKO6SkOOEOWyK5nq7g#K1.19, S1.3, K1.10]
        component: card-sort
        props:
          bins:
            - { id: land, label: Land and nature, icon: 🌄 }
            - { id: people, label: People and history, icon: 📜 }
          cards:
            - { text: '🏔️ The mountains on the shield', bin: land, why: 'They show the **Rocky Mountains**, part of Alberta’s land.' }
            - { text: '🌹 The wild rose', bin: land, why: 'A flower that grows **all over Alberta**.' }
            - { text: '➕ The red cross from England’s flag', bin: people, why: 'It links Alberta to its **British heritage**.' }
            - { text: '👑 The crown on top of the coat of arms', bin: people, why: 'It stands for the **Crown**, the King, and Alberta’s history.' }
            - { text: '🐏 The bighorn sheep', bin: land, why: 'An animal of Alberta’s **mountains**.' }
            - { text: '💪 Strong and free, the motto', bin: people, why: 'It tells how Albertans want to **be**.' }
        caption: Does each symbol tell about Alberta’s land, or its people and history?
      - type: callout
        variant: tip
        covers: [C_WNkKO6SkOOEOWyK5nq7g#K1.19]
        title: Heritage and identity
        body: |-
          - **Heritage** is what we get from the past.
          - **Identity** is who we are.

keyTerms:
  - term: Symbol
    covers: [K1.10]
    definition: A picture or object that stands for something bigger.
  - term: Coat of arms
    covers: [K1.10]
    definition: A special design with a shield. It stands for a province or country.
  - term: Motto
    covers: [K1.10]
    definition: A short saying that tells what a group believes. Alberta’s is fortis et liber.
  - term: Heritage
    covers: [C_WNkKO6SkOOEOWyK5nq7g#K1.19]
    definition: The traditions, stories and history we get from the past.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.10]
    type: mc
    prompt: What does Alberta’s motto, *fortis et liber*, mean?
    choices: [💪 Strong and free, 🌄 Mountains and prairie, 🤝 Friends together]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Mountains and prairie are on the shield. What do the motto’s words mean?
      '2': Flip the motto card again. What did it say?
    hints:
      - The motto is in Latin. Flip its card to read what it means.
    solution:
      - '*Fortis et liber* means **strong and free**.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.10, S1.3]
    type: mc
    prompt: What is in the middle of Alberta’s flag?
    figure: |-
      <svg viewBox="0 0 200 100" class="fig-svg" role="img" aria-label="A blue flag with a picture in the middle.">
        <rect width="200" height="100" fill="#1f3f8f"/>
