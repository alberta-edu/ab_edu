        <g clip-path="url(#g3ss-w2-clip)">
          <rect x="70" y="15" width="60" height="14" fill="#fff"/><rect x="96" y="15" width="8" height="14" fill="#c8102e"/><rect x="70" y="20" width="60" height="4" fill="#c8102e"/>
          <rect x="70" y="29" width="60" height="31" fill="#5aa7e0"/>
