      - The flag has **Alberta’s shield** on a blue background.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K1.10, S1.3]
    type: mc
    prompt: A school team picks blue and gold jerseys to show they are from Alberta. What do those colours stand for?
    choices:
      - 🔵🟡 The sky and the prairies
      - 🔵🟡 Water and the sun
      - 🔵🟡 Ice and gold coins
    fixedOrder: true
    answer: 0
    feedback:
      '1': Water and sun are good guesses. What did the blue and gold card say?
      '2': Flip the blue and gold card again. What does gold stand for?
    hints:
      - Blue and gold are Alberta’s official colours. Flip their card again.
    solution:
      - Blue is for the **sky**, and gold is for the **prairies**. The team is using Alberta’s colours.

  - id: b2
    level: 2
    thinking: why
    covers: [C_WNkKO6SkOOEOWyK5nq7g#K1.19, K1.10]
    type: mc
    prompt: Why might Alberta put a wheat field on its shield?
    choices:
      - Farming is an important part of Alberta.
      - Wheat is Alberta’s official flower.
      - Wheat grows only in Edmonton.
    answer: 0
    feedback:
      '1': Which flower is Alberta’s official flower?
      '2': Where do wheat farms grow? In a city?
    hints:
      - The shield shows Alberta’s land. What do many people grow on that land?
    solution:
      - Wheat farms cover much of the prairie. The wheat field shows that **farming** is part of who Albertans are.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: perspective
    covers: [C_WNkKO6SkOOEOWyK5nq7g#K1.19, K1.10]
    type: mc
    prompt: The red cross on the shield comes from England. Does the shield tell the story of every family in Alberta?
    choices:
      - It shows the land we share, but only part of our history.
      - Yes, it tells every family’s whole story.
      - No, the shield has nothing to do with Alberta.
    answer: 0
    feedback:
      '1': Think of the Métis sash and the Blackfoot tipi ring. Are they on the shield?
      '2': What do the mountains, prairie and wheat show?
    hints:
      - Which parts of the shield show the land? Which part shows history?
    solution:
      - The mountains, prairie and wheat are land that all Albertans share.
      - The cross shows British heritage. Other communities, like the Métis and the Blackfoot, have their own symbols too.

  - id: d2
    level: 3
    thinking: breakdown
    covers: [K1.10, S1.3]
    type: investigation
    prompt: |-
      Solve the mystery symbol:

      - It is an animal.
      - It lives mostly in the Rocky Mountains.
      - It has big, curled horns.
    parts:
      - type: mc
        prompt: Which symbol is it?
        choices: [🐏 Bighorn sheep, 🦫 Beaver, 🦁 Lion]
        fixedOrder: true
        answer: 0
        feedback:
          '1': The beaver is on the coat of arms. Does a beaver have curled horns?
          '2': The lion is on the coat of arms too. Does it live in the Rockies?
        hints:
          - Which clue only fits one animal?
        solution:
          - Curled horns and mountains point to the **Rocky Mountain bighorn sheep**.
      - type: mc
        prompt: Which other symbol shows the same part of Alberta as the sheep?
        choices: [🛡️ The shield, 🌹 The wild rose, 🔵🟡 Blue and gold]
        fixedOrder: true
        answer: 0
        feedback:
          '1': The wild rose is Alberta’s flower. Does it show the mountains?
          '2': Blue is for the sky and gold is for the prairies. Which symbol shows mountains?
        hints:
          - Where does the bighorn sheep live? Which symbol shows that land too?
        solution:
          - The sheep lives in the **Rocky Mountains**. The shield shows the Rocky Mountains too.
    wrapUp: Two symbols can tell the same story. The sheep and the shield both say that the mountains matter to Alberta.
    hints: []
    solution: []
