id: ratios-percentages
grade: 5
subject: math
organizingIdea: MAT-OI1
outcomes: [_tTreLA_0Ey9KlNK1XSxIA]
order: 7
title: Ratios and Percentages
shortTitle: Ratios & percentages
summary: >-
  Use ratios to compare quantities, part to part and part to whole, and show the same part-whole
  relationship as a ratio, a fraction, a decimal and a percentage.

bigIdea: |-
  - A **ratio** compares two quantities in a situation.
  - It can compare **part to part** (red to blue) or **part to whole** (red to all).
  - Write it with a **colon** (3 : 5) or as a **fraction**.
  - A **percentage** is a part-whole ratio out of **100**.

lesson:
  - title: Comparing with ratios
    blocks:
      - type: visual
        covers: [K1.1, U1.1, S1.1]
        component: ratio-explorer
        props: { start: set, a: 3, b: 5, labelA: red, labelB: blue }
        caption: Change the number of red and blue counters. Watch the part-part and part-whole ratios change.
      - type: compare
        covers: [K1.1, S1.1]
        columns:
          - title: Part to part
            body: |-
              red : blue
              \[3 : 5\]
              Compares one part with **another part**.
          - title: Part to whole
            body: |-
              red : all counters
              \[3 : 8\]
              Compares one part with the **whole**.

  - title: Writing ratios
    blocks:
      - type: table
        covers: [K1.2, S1.1]
        caption: A bag has 3 red and 5 blue counters.
        headers: [Compare, With a colon, As a fraction]
        rows:
          - ['red to blue', '3 : 5', '\(\frac{3}{5}\)']
          - ['blue to red', '5 : 3', '\(\frac{5}{3}\)']
          - ['red to all counters', '3 : 8', '\(\frac{3}{8}\)']
      - type: callout
        variant: mistake
        covers: [U1.1]
        title: Order matters
        body: '"Red to blue" is **3 : 5**, but "blue to red" is **5 : 3**. Write the numbers in the same order as the words.'

  - title: Percent means out of 100
    blocks:
      - type: visual
        covers: [K1.3, U1.2, S1.2]
        component: ratio-explorer
        props: { start: grid, shaded: 35 }
        caption: Slide to shade squares. The ratio, fraction, decimal and percentage all describe the **same** shaded part.
      - type: callout
        variant: remember
        covers: [0zWkCgBoa02WpE4F9KEh7Q#K1.4, 0zWkCgBoa02WpE4F9KEh7Q#K1.2]
        title: Remember from Grade 4
        body: '**1%** is one hundredth of a whole. To write a decimal as a percentage, multiply by 100: \(0.35 = 35\%\).'

  - title: Four ways, one relationship
    blocks:
      - type: table
        covers: [U1.2, S1.2]
        headers: [Situation, Ratio, Fraction, Decimal, Percentage]
        rows:
          - ['25 of 100 squares shaded', '25 : 100', '\(\frac{25}{100}\)', '0.25', '25%']
          - ['7 of 10 students walk', '7 : 10', '\(\frac{7}{10} = \frac{70}{100}\)', '0.7', '70%']
          - ['3 of 5 counters are green', '3 : 5', '\(\frac{3}{5} = \frac{60}{100}\)', '0.6', '60%']
      - type: example
        covers: [S1.1, S1.2]
        title: A class survey
        problem: In a class of **20** students, **9** walk to school and the rest don't.
        steps:
          - 'Part to part, walkers to non-walkers: **9 : 11**.'
          - 'Part to whole, walkers to the class: **9 : 20**, or \(\frac{9}{20}\).'
          - '\(\frac{9}{20} = \frac{45}{100}\), so as a decimal it is **0.45**, and as a percentage **45%**.'
        answer: '9 : 20 = \(\frac{9}{20}\) = 0.45 = 45% of the class walks.'

keyTerms:
  - term: Ratio
    covers: [U1.1, K1.2]
    definition: 'A comparison of two quantities in a situation, like 3 : 5.'
  - term: Part-part ratio
    covers: [K1.1]
    definition: Compares one part of a whole with another part.
  - term: Part-whole ratio
    covers: [K1.1]
    definition: Compares one part with the whole.
  - term: Percentage
    covers: [K1.3]
    definition: 'A part-whole ratio that compares a quantity to 100. 35% means 35 out of 100.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.1, K1.2, S1.1]
    type: text
    prompt: 'A pet shelter has **4 cats** and **9 dogs**. Write the ratio of **dogs to cats** with a colon.'
    accept: ['9 : 4', '9:4']
    hints:
      - Which animal comes first in the question? It comes first in the ratio.
    solution:
      - 'Dogs come first in the words, so they come first in the ratio: **9 : 4**.'

  - id: w3
    level: 1
    thinking: notice
    covers: [K1.3, S1.2]
    type: number
    figure: |-
      <svg viewBox="-4 -4 208 208" class="fig-svg fig-svg--square" role="img" aria-label="A ten by ten grid. The top four rows and two more squares are shaded."><rect class="fig-rect" x="0" y="0" width="200" height="200"/><rect class="fig-hl" x="0" y="0" width="200" height="80"/><rect class="fig-hl" x="0" y="80" width="40" height="20"/><line class="fig-grid" x1="20" y1="0" x2="20" y2="200"/><line class="fig-grid" x1="0" y1="20" x2="200" y2="20"/><line class="fig-grid" x1="40" y1="0" x2="40" y2="200"/><line class="fig-grid" x1="0" y1="40" x2="200" y2="40"/><line class="fig-grid" x1="60" y1="0" x2="60" y2="200"/><line class="fig-grid" x1="0" y1="60" x2="200" y2="60"/><line class="fig-grid" x1="80" y1="0" x2="80" y2="200"/><line class="fig-grid" x1="0" y1="80" x2="200" y2="80"/><line class="fig-grid" x1="100" y1="0" x2="100" y2="200"/><line class="fig-grid" x1="0" y1="100" x2="200" y2="100"/><line class="fig-grid" x1="120" y1="0" x2="120" y2="200"/><line class="fig-grid" x1="0" y1="120" x2="200" y2="120"/><line class="fig-grid" x1="140" y1="0" x2="140" y2="200"/><line class="fig-grid" x1="0" y1="140" x2="200" y2="140"/><line class="fig-grid" x1="160" y1="0" x2="160" y2="200"/><line class="fig-grid" x1="0" y1="160" x2="200" y2="160"/><line class="fig-grid" x1="180" y1="0" x2="180" y2="200"/><line class="fig-grid" x1="0" y1="180" x2="200" y2="180"/></svg>
    prompt: This grid has **100** equal squares. What **percentage** of the grid is shaded?
    answer: 42
    unit: '%'
    verify: 40 + 2
    hints:
      - How many squares are in each row? How many full rows are shaded?
    solution:
      - '4 full rows are 40 squares, and 2 more make 42 squares out of 100.'
      - 'Percent means out of 100, so that is **42%**.'

  - id: w4
    level: 1
    thinking: apply
    covers: [S1.2, U1.2]
    type: number
    prompt: 'Write \(0.7\) as a **percentage**.'
    answer: 70
    unit: '%'
    verify: 7 * 10
    hints:
      - '0.7 is 7 tenths. How many hundredths is that?'
    solution:
      - '\(0.7 = \frac{7}{10} = \frac{70}{100}\), so it is **70%**. It isn’t 7%, because 7% is only 0.07.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [K1.3, S1.1, S1.2]
    type: number
    prompt: 'A game character starts with **20** hearts. A very rude goose attacks, and she loses **7** of them. What **percentage** of her hearts does she still have?'
    answer: 65
    unit: '%'
    verify: 13 * 5
    hints:
      - The question is about the hearts she still has. How many is that?
      - 'To get a percentage, you need a fraction out of 100. What can you multiply 20 by to get 100?'
    solution:
      - 'She still has \(20 - 7 = 13\) hearts, so the ratio is 13 : 20, or \(\frac{13}{20}\).'
      - '\(\frac{13}{20} = \frac{65}{100}\), so she has **65%** of her hearts.'
      - 'The 7 lost hearts are 35%. Together the two parts make 100%, which is all of the hearts.'

  - id: b2
    level: 2
    thinking: flaw
    covers: [K1.1, S1.1, S1.2]
    type: number
    prompt: |-
      Sami’s cereal bowl has **5** marshmallows and **20** oat bits. "This bowl is 25% marshmallows," says Sami, "because \(\frac{5}{20} = \frac{25}{100}\)."
      The fractions are equal, but the claim is wrong. What percentage of the bowl is really marshmallows?
    answer: 20
    unit: '%'
    verify: 5 * 4
    hints:
      - 'What does \(\frac{5}{20}\) compare: marshmallows to what?'
      - A percentage is part to **whole**. How many pieces are in the whole bowl?
    solution:
      - '\(\frac{5}{20}\) compares marshmallows to oat bits. That is a part-part ratio.'
      - 'The whole bowl has \(5 + 20 = 25\) pieces. So the part-whole ratio is 5 : 25, and \(\frac{5}{25} = \frac{20}{100}\), which is **20%**.'

  - id: b3
    level: 2
    thinking: connect
    covers: [S1.2, U1.2, K1.2]
    type: multi
    prompt: A game’s loading bar has **4** equal sections, and **3** are filled. Which of these describe the filled part of the **whole bar**? Choose all that do.
    choices:
      - '3 : 4'
      - '0.75'
      - '75%'
      - '\(\frac{75}{100}\)'
      - '0.34'
      - '34%'
      - '3 : 1'
    answer: [0, 1, 2, 3]
    feedback:
      '4': 'That just puts the digits 3 and 4 after a decimal point. Is 3 out of 4 really only about a third of the bar?'
      '5': 'That just glues the digits together. Is the bar filled to about a third, or to much more?'
      '6': 'That compares the filled part with the empty part. It’s a true ratio, but it’s part to part, not part to whole.'
    hints:
      - Start with the part-whole ratio. What is the part, and what is the whole?
      - 'What fraction out of 100 is the same as \(\frac{3}{4}\)?'
    solution:
      - 'Filled to the whole bar is 3 : 4, or \(\frac{3}{4}\).'
      - '\(\frac{3}{4} = \frac{75}{100}\), which is 0.75 and 75%. All of these name the same part of the same whole.'
      - '3 : 1 is also true of this bar, but it compares filled to empty.'

  - id: b4
    level: 2
    thinking: backwards
    covers: [K1.1, S1.1, U1.1]
    type: text
    prompt: 'A sign on a tank of **8** fish says "goldfish : all fish = 3 : 8". The rest of the fish are guppies. Write the ratio of **goldfish to guppies** with a colon.'
    accept: ['3 : 5', '3:5']
    hints:
      - How many goldfish are in the tank? How many fish are not goldfish?
    solution:
      - 'The sign says 3 goldfish out of 8 fish.'
      - 'So there are \(8 - 3 = 5\) guppies, and goldfish to guppies is **3 : 5**.'
      - 'Both ratios describe the same tank, comparing different things.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d2
    level: 3
    thinking: design
    covers: [S1.2, K1.3, U1.1]
    type: build
    prompt: |-
      Two classes count their broccoli fans. Room A has **more** fans than Room B, but Room B has the **greater percentage** of fans.
      Invent numbers that make this true. Class sizes like 10, 20, 25 or 50 are easiest to check.
    fields:
      - { name: a, label: 'Fans in Room A' }
      - { name: x, label: 'Students in Room A' }
      - { name: b, label: 'Fans in Room B' }
      - { name: y, label: 'Students in Room B' }
    rules:
      - { test: 'a > 0 && b > 0 && a % 1 == 0 && b % 1 == 0 && x % 1 == 0 && y % 1 == 0', fail: 'Use whole numbers, with at least 1 fan in each room.' }
      - { test: 'a <= x && b <= y', fail: 'A room can’t have more fans than students.' }
      - { test: 'a > b', fail: 'Room A needs more fans than Room B.' }
      - { test: 'a / x < b / y', fail: 'Room A has more fans, but check the percentages: Room B’s must be greater. Which room should be the bigger one?' }
    examples:
      - { a: 10, x: 50, b: 5, y: 10 }
      - { a: 8, x: 20, b: 5, y: 10 }
      - { a: 5, x: 25, b: 4, y: 10 }
    counterexamples:
      - { a: 8, x: 10, b: 5, y: 10 }
      - { a: 5, x: 20, b: 8, y: 10 }
      - { a: 12, x: 10, b: 5, y: 10 }
    hints:
      - Can a small class have a big percentage with only a few fans?
      - 'Make Room A big and Room B small. Try Room B with 5 fans out of 10.'
    solution:
      - 'Room B: 5 fans out of 10 is 50%. Room A: 10 fans out of 50 is \(\frac{20}{100}\), which is 20%. Room A has more fans, but Room B has the greater percentage.'
      - 'Room A with 8 out of 20 (40%) works too, against the same Room B.'
      - 'A percentage compares a part to its **own** whole. So a percentage alone can’t tell you how many.'

  - id: d3
    level: 3
    thinking: evidence
    covers: [K1.3, U1.1]
    type: mc
    prompt: |-
      Every student in a class answers two polls. **Poll A:** "Pick your **one** favourite snack." It reports 60% chose popcorn and 50% chose grapes.
      **Poll B:** "Tick **every** snack you like." It reports 60% ticked popcorn and 50% ticked grapes. One report must have a mistake. Which one?
    choices:
      - 'Poll A, because with one favourite each, the parts can’t add to more than 100%.'
      - 'Poll B, because the same student can’t be counted two times in the same poll.'
      - 'Both polls, because 60% and 50% add to more than 100% in each of the two polls.'
      - 'Neither poll, because percentages from one class can add up to any number at all.'
    answer: 0
    feedback:
      '1': 'Poll B lets a student tick both snacks. So what happens to a student who likes popcorn and grapes?'
      '2': 'They add up the same, but do the two polls ask the same question? Can a student be in both groups in Poll B?'
      '3': 'Think about Poll A. If every student is in only one group, what do all the groups add up to?'
    hints:
      - In which poll can one student be in both groups?
      - '100% means the whole class. What does 60% + 50% add up to?'
    solution:
      - '\(60 + 50 = 110\), which is more than 100%, the whole class.'
      - 'In Poll A each student is in only one group, so the groups can’t add up to more than the whole class. That report has a mistake.'
      - 'In Poll B a student can tick both, so some students are counted in both groups. Those parts can overlap, so the report could be true.'
