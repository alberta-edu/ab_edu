id: multiply-divide-algorithms
grade: 5
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT5-OI1-GQ4-LO1]
order: 4
title: Multiplying and Dividing with Standard Algorithms
shortTitle: Multiplying & dividing
summary: >-
  Multiply 3-digit by 2-digit numbers and divide 3-digit by 1-digit numbers with standard algorithms,
  handle remainders, and estimate to check.

bigIdea: |-
  - The **standard algorithms** break a big multiplication or division into small steps by **place value**.
  - \(347 \times 26\) is really \(347 \times 6 + 347 \times 20\).
  - Long division shares out the hundreds, then the tens, then the ones.
  - **Estimate** to check, and let the **situation** decide what a remainder means.

lesson:
  - title: Why the multiplication algorithm works
    blocks:
      - type: figure
        covers: [S1.1, U1.1]
        figure: { kind: area-model, a: 347, b: 26 }
        caption: '\(347 \times 26\) split by place value. The top row adds to \(347 \times 20 = 6\,940\), the bottom row to \(347 \times 6 = 2\,082\).'
      - type: text
        covers: [S1.1]
        body: The algorithm finds the same two **partial products**, one row at a time, and adds them. \(2\,082 + 6\,940 = 9\,022\).

  - title: Multiplying, step by step
    blocks:
      - type: visual
        covers: [S1.1, S1.2, K1.1]
        component: column-calc
        props:
          examples:
            - { op: '×', a: '347', b: '26' }
            - { op: '×', a: '250', b: '12' }
            - { op: '×', a: '999', b: '99' }
        caption: Watch the **0** placeholder in the second row. It's there because the 2 in 26 is worth **20**.
      - type: callout
        variant: remember
        covers: [MAT4-OI1-GQ4-LO1#S1.5]
        title: Remember from Grade 4
        body: You multiplied and divided 3-digit numbers by 1-digit numbers. Now the second factor can have **2 digits**.

  - title: Why the division algorithm works
    blocks:
      - type: visual
        covers: [S1.1, S1.3, U1.1]
        component: share-blocks
        caption: Press **Next step** to share the blocks among 6 groups, starting with the hundreds.
      - type: text
        covers: [S1.1]
        body: |-
          The algorithm does the same sharing on paper, one place at a time:
          - **Divide** tells how many each group gets.
          - **Multiply and subtract** show how many are left.
          - **Bring down** trades the leftovers for the next place.

  - title: Dividing, step by step
    blocks:
      - type: visual
        covers: [S1.1, S1.3, K1.1]
        component: column-calc
        props:
          examples:
            - { op: '÷', a: '745', b: '6' }
            - { op: '÷', a: '612', b: '6' }
            - { op: '÷', a: '245', b: '6' }
        caption: 'Divide, multiply, subtract, bring down, and repeat for each place.'

  - title: What does the remainder mean?
    blocks:
      - type: compare
        covers: [S1.4]
        columns:
          - title: 🚐 Round up
            body: |-
              185 students, vans hold 8.
              \[185 \div 8 = 23 \text{ R } 1\]
              The last student still needs a ride: **24 vans**.
          - title: 📦 Leave it out
            body: |-
              653 eggs, cartons hold 6.
              \[653 \div 6 = 108 \text{ R } 5\]
              Only full cartons count: **108 cartons**.
          - title: 🍪 Report it
            body: |-
              100 stickers shared by 7 friends.
              \[100 \div 7 = 14 \text{ R } 2\]
              **14 each, with 2 left over.**

  - title: Estimate to check
    blocks:
      - type: table
        covers: [S1.5]
        headers: [Calculation, Estimate, Exact, Reasonable?]
        rows:
          - ['347 × 26', '350 × 25 = 8 750', '9 022', '✅ close']
          - ['745 ÷ 6', '720 ÷ 6 = 120', '124 R 1', '✅ close']
          - ['489 × 31', '500 × 30 = 15 000', '1 659 ❌', '❌ far off, so check again']

keyTerms:
  - term: Partial product
    covers: [S1.1]
    definition: 'The product of one part of a number, like 347 × 20, in a multiplication.'
  - term: Quotient
    covers: [S1.4]
    definition: The answer to a division.
  - term: Remainder
    covers: [S1.4]
    definition: The amount left over when a number doesn't divide exactly.
  - term: Standard algorithm
    covers: [K1.1, U1.1]
    definition: An efficient step-by-step method, done by place value.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S1.1]
    type: mc
    figure: { kind: area-model, a: 238, b: 34 }
    prompt: 'This picture shows \(238 \times 34\). The **top row** adds up to \(7\,140\). Which multiplication does the top row stand for?'
    choices:
      - '\(238 \times 30\)'
      - '\(238 \times 3\)'
      - '\(238 \times 4\)'
      - '\(200 \times 34\)'
    answer: 0
    feedback:
      '1': 'Look at the label beside the top row. The 3 in 34 is in the tens place, so it is worth more than 3.'
      '2': 'That one is the bottom row. Check the label beside the top row.'
      '3': 'That is the left column, going down. The question is about the row going across.'
    hints:
      - Look at the number written at the left of the top row.
      - Every box in that row is one part of 238 multiplied by that number.
    solution:
      - 'The top row is labelled 30, and its boxes are \(200 \times 30\), \(30 \times 30\) and \(8 \times 30\).'
      - 'Together they make \(238 \times 30 = 7\,140\). That is the second row of the algorithm, the one with the 0 placeholder.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.2]
    type: number
    prompt: '\(406 \times 23\) = ?'
    answer: 9338
    verify: 406 * 23
    hints:
      - 'Which two rows will you need? The 2 in 23 is worth 20.'
      - 'First find \(406 \times 3\), then \(406 \times 20\). What does the 0 in 406 do?'
    solution:
      - '\(406 \times 3 = 1\,218\)'
      - '\(406 \times 20 = 8\,120\)'
      - '\(1\,218 + 8\,120 = 9\,338\)'

  - id: w3
    level: 1
    thinking: apply
    covers: [S1.3]
    type: number
    prompt: '\(738 \div 6\) = ?'
    answer: 123
    verify: 738 / 6
    hints:
      - 'Start with the hundreds. How many groups of 6 fit in 7?'
      - 'After the hundreds, 1 is left. Bring down the 3 to make 13.'
    solution:
      - '7 hundreds ÷ 6 = 1 hundred, with 1 hundred left over.'
      - '13 tens ÷ 6 = 2 tens, with 1 ten left over.'
      - '18 ones ÷ 6 = 3 ones. So \(738 \div 6 = 123\).'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.4, S1.3, S1.6]
    type: investigation
    prompt: |-
      A bakery bakes **230** cinnamon buns for the fall fair and packs them into boxes of **6**.
      One division, three questions. Watch how the answers change.
    parts:
      - type: number
        prompt: How many **full** boxes can go on the sale table?
        answer: 38
        verify: (230 - 2) / 6
        hints:
          - 'Work out \(230 \div 6\). What is the quotient, and what is the remainder?'
        solution:
          - '\(230 \div 6 = 38 \text{ R } 2\). Only full boxes count, so **38**.'
      - type: number
        prompt: The driver has to carry **every** bun to the fair in a box, even if a box isn’t full. How many boxes does the driver need?
        answer: 39
        verify: 38 + 1
        hints:
          - Where do the 2 leftover buns ride?
        solution:
          - 'The 2 extra buns still need a box, so 38 + 1 = **39**.'
      - type: number
        prompt: The baker gets to eat any buns that can’t make a full box. How many buns does the baker eat?
        answer: 2
        verify: 230 - 38 * 6
        hints:
          - Which part of the division answer is this question about?
        solution:
          - 'This question asks for the remainder itself: **2** buns.'
    wrapUp: One division can give three different answers. The numbers don’t decide what the remainder means. The story does.

  - id: b3
    level: 2
    thinking: estimate
    covers: [S1.5, S1.2]
    type: mc
    prompt: |-
      Ayo’s calculator has a strange fault: it **never shows any zeros**. For \(405 \times 24\), its screen says **972**.
      Use an estimate. Which of these could the real answer be?
    choices:
      - '9 720'
      - '972'
      - '97 200'
      - '972 000'
    answer: 0
    feedback:
      '1': 'That is what the screen shows, but the screen leaves out zeros. Round 405 and 24 to friendly numbers and see how big the answer should be.'
      '2': 'Try \(400 \times 25\). Is the answer really close to 100 000?'
      '3': 'Even \(1\,000 \times 100\) is only 100 000, and 405 and 24 are far smaller than those.'
    hints:
      - What friendly numbers are close to 405 and 24?
      - 'Work out \(400 \times 25\). Which choice is closest?'
    solution:
      - '405 is about 400 and 24 is about 25, and \(400 \times 25 = 10\,000\).'
      - 'Only **9 720** is close to 10 000. The real product is \(405 \times 24 = 9\,720\), so the calculator hid the last zero.'
      - 'An estimate can’t tell you every digit, but it does tell you how big the answer must be.'

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.3, S1.4]
    type: mc
    prompt: |-
      **7** raccoons share **236** grapes. Dee says, "32 grapes each, with 12 left over." She checks it:
      \(32 \times 7 + 12 = 236\). It works! But all 7 raccoons are staring at the 12 leftover grapes. What is wrong with Dee’s answer?
    choices:
      - The 12 left over can still go around, so the sharing isn’t finished.
      - The check is wrong, because 32 × 7 + 12 does not make 236.
      - There should be nothing left over when you share things out fairly.
      - Each raccoon should get 12 more grapes, so each one gets 44.
    answer: 0
    feedback:
      '1': 'Work it out: \(32 \times 7 = 224\), and \(224 + 12 = 236\). The check is fine, so the trouble is somewhere else.'
      '2': 'Leftovers are fine when there are too few to go around. Could these 12 grapes go around?'
      '3': 'That would take \(12 \times 7 = 84\) grapes, and there are only 12 left.'
    hints:
      - Picture the 12 grapes and the 7 raccoons. What could happen next?
      - Could every raccoon get one more grape?
      - 'Compare the leftovers with the number of raccoons. Which is bigger?'
    solution:
      - '12 grapes are enough to give all 7 raccoons one more, with 5 still left.'
      - 'So the fair share is **33 grapes each, with 5 left over**: \(236 \div 7 = 33 \text{ R } 5\).'
      - 'What we learned: a remainder must be smaller than the number you divide by. If it isn’t, keep sharing.'

  - id: b5
    level: 2
    thinking: ways
    covers: [S1.2, S1.6]
    type: number
    prompt: |-
      A sticker sheet should hold **200** stickers, but the printer missed one spot, so every sheet has **199**.
      Oma has **23** sheets. She works out the total in her head: "First I picture full sheets. Then I think about what’s missing."
      How many stickers does Oma have?
    answer: 4577
    verify: 200 * 23 - 23
    hints:
      - 'If every sheet were full, how many stickers would there be?'
      - 'How many stickers are missing altogether: one from each of how many sheets?'
    solution:
      - 'Full sheets would hold \(200 \times 23 = 4\,600\) stickers.'
      - 'Each of the 23 sheets is missing 1, so 23 are missing. \(4\,600 - 23 = 4\,577\).'
      - 'The algorithm agrees: \(199 \times 3 = 597\) and \(199 \times 20 = 3\,980\), which add to \(4\,577\). It works for any numbers, but look at the numbers first. Sometimes there is a faster way.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: flaw
    covers: [S1.1, S1.3, S1.5]
    type: investigation
    prompt: |-
      A factory sends **824** socks to an octopus school. Every octopus wears **8** socks.
      Milo works it out: "\(824 \div 8 = 13\). So there are enough socks for 13 octopuses."
      The 13 octopuses get dressed, and a giant pile of socks is still on the floor.
    parts:
      - type: number
        prompt: How many socks are the 13 octopuses wearing?
        answer: 104
        verify: 13 * 8
        hints:
          - 13 octopuses, 8 socks each.
        solution:
          - '\(13 \times 8 = 104\). That is nowhere near 824, so 13 can’t be right.'
      - type: mc
        prompt: |-
          Here is what Milo did. 8 ÷ 8 = 1. Then he looked at the 2 and said, "8 doesn’t go into 2, so skip it." He brought down the 4 to make 24, and 24 ÷ 8 = 3. He wrote 1 and 3 side by side: 13. What went wrong?
        choices:
          - He needed a 0 in the tens place of his answer, because no tens could be shared.
          - He should have rounded 13 up to 14, because some of the socks were left over.
          - He should have started with the ones, because 4 is the digit easiest to look at.
          - He should have written 10 instead of 1 for the first step, because 8 ÷ 8 is too small.
        answer: 0
        feedback:
          '1': 'Rounding up deals with a small leftover. Here more than 700 socks are left, so something bigger went wrong.'
          '2': 'Long division starts with the greatest place, as Milo did. His trouble came later.'
          '3': 'The 1 is correct: 8 hundreds ÷ 8 is 1 **hundred**. But in the answer 13, what is that 1 worth?'
        hints:
          - In the answer 13, what is the 1 worth? What should it be worth?
          - 'The 8 in 824 means 8 hundreds. What happens when the 2 tens are shared by 8?'
        solution:
          - '8 hundreds ÷ 8 = 1 hundred. 2 tens can’t be shared by 8, so that is **0 tens**, and the 0 must be written down.'
          - 'Without the 0, the 1 slides over and looks like 1 ten instead of 1 hundred.'
      - type: number
        prompt: So how many octopuses can really get dressed?
        answer: 103
        verify: 824 / 8
        hints:
          - 1 hundred, 0 tens and how many ones?
        solution:
          - '1 hundred, 0 tens, 3 ones: **103** octopuses. Check: \(103 \times 8 = 824\).'
    wrapUp: A 0 in an answer isn’t nothing. It holds a place, so every other digit keeps its value. An estimate is what warned us that something was missing.

  - id: d3
    level: 3
    thinking: connect
    covers: [S1.3, S1.4, S1.6]
    type: investigation
    prompt: |-
      Your birthday is on a **Tuesday** this year. Next year it comes **365** days later.
      The days of the week repeat every **7** days. So what will happen?
    parts:
      - type: text
        prompt: On which day of the week is your birthday next year?
        accept: [Wednesday, Wed]
        hints:
          - Divide 365 by 7. How many days are left over after the whole weeks?
          - A whole week always lands back on Tuesday. What do the left-over days do?
        solution:
          - '\(365 \div 7 = 52\) R1, so 365 days are 52 whole weeks and 1 extra day.'
          - 'Whole weeks land back on Tuesday. The 1 extra day moves it to **Wednesday**.'
      - type: text
        prompt: 'The Sloth Post promises delivery in exactly **500** days. You mail a letter on a **Monday**. On which day does it arrive?'
        accept: [Thursday, Thu, Thurs]
        hints:
          - 'Do what you did for the birthday: find the whole weeks and the extra days.'
          - Count forward from Monday, one step for each extra day.
        solution:
          - '\(500 \div 7 = 71 \text{ R } 3\). The 71 weeks land back on Monday.'
          - 'Three extra days: Tuesday, Wednesday, **Thursday**.'
    wrapUp: Here the remainder is the whole answer. The number of weeks doesn’t matter at all, because only the extra days move the weekday.
