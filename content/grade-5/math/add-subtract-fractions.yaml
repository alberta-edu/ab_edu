    hints:
      - 'How many fifths is \(2\frac{3}{5}\)? Your two numbers must be that many fifths apart.'
      - 'Start with the second number, say \(1\frac{4}{5}\). Add \(2\frac{3}{5}\) to find the first.'
      - 'Check it: is the first numerator smaller than the second?'
    solution:
      - '\(2\frac{3}{5}\) is 13 fifths, so the first number must be 13 fifths more than the second. Choose the second number, then add back.'
      - '\(5\frac{1}{5} - 2\frac{3}{5}\) is a trap. Regroup to \(4\frac{6}{5} - 2\frac{3}{5} = 2\frac{3}{5}\). In improper fractions, \(\frac{26}{5} - \frac{13}{5} = \frac{13}{5}\).'
      - '\(6\frac{2}{5} - 3\frac{4}{5}\) works too, because \(\frac{32}{5} - \frac{19}{5} = \frac{13}{5}\). The improper-fraction way never falls into the trap, because there is nothing to regroup.'
