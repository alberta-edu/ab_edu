id: symmetry
grade: 5
subject: math
organizingIdea: MAT-OI3
outcomes: [MAT5-OI3-GQ1-LO1]
order: 11
title: Reflection and Rotation Symmetry
shortTitle: Symmetry
summary: >-
  Find lines of reflection symmetry and the order of rotation symmetry in 2-D shapes, explore symmetry in
  3-D shapes, nature and First Nations, Métis and Inuit designs.

bigIdea: |-
  - **Reflection symmetry**: a line splits the shape into two halves that match exactly.
  - **Rotation symmetry**: the shape matches itself as it turns.
  - Symmetry is a **property of shapes**. Find it in **nature**, in buildings, and in **First Nations, Métis and Inuit designs**.

lesson:
  - title: Lines of symmetry
    blocks:
      - type: visual
        covers: [K1.1, S1.3, S1.4, U1.1]
        component: symmetry-explorer
        props: { start: square }
        caption: Choose a shape and press **Show lines of symmetry**. Each dashed line splits the shape into two halves that match exactly.

  - title: Rotation symmetry
    blocks:
      - type: visual
        covers: [K1.3, K1.4, K1.5, S1.5]
        component: symmetry-explorer
        props: { start: parallelogram }
        caption: Press **Rotate 360°**. The yellow dot shows the turning. Count how many times the shape lands exactly on its dashed outline.
      - type: compare
        covers: [K1.3, K1.4, K1.5]
        columns:
          - title: Order of rotation symmetry
            body: The number of times a shape matches itself in one full turn (360°). A square matches 4 times, so its order is **4**.
          - title: Central symmetry
            body: Rotation symmetry by a **half turn (180°)**. A parallelogram has it, but no lines of symmetry!

  - title: Central symmetry up close
    blocks:
      - type: figure
        covers: [K1.6]
        figure: >-
          <svg viewBox="-150 -100 300 200" class="fig-svg" role="img" aria-label="A parallelogram. Point P and its image P prime after a half turn are joined by a line through the centre.">
          <path class="sy-shape" d="M-110 55 L-40 -55 L110 -55 L40 55 Z"/>
          <line class="sy-line" x1="-110" y1="55" x2="110" y2="-55"/>
          <circle cx="0" cy="0" r="6" class="fig-hl"/>
          <circle cx="-110" cy="55" r="7" class="cg-pt"/><circle cx="110" cy="-55" r="7" class="cg-pt"/>
          <text class="fig-label" x="-130" y="80">P</text><text class="fig-label" x="112" y="-66">P′</text>
          <text class="fig-small" x="10" y="20">centre</text></svg>
        caption: 'After a half turn, point **P** lands on **P′**. The straight line joining a point to its image always passes through the **centre of rotation**.'

  - title: Regular polygons and circles
    blocks:
      - type: table
        covers: [K2.1, K2.2, S2.1, S2.2, U2.1]
        headers: [Shape, Equal sides and angles, Lines of symmetry, Order of rotation]
        rows:
          - ['Equilateral triangle', '3 and 3', '3', '3']
          - ['Square', '4 and 4', '4', '4']
          - ['Regular pentagon', '5 and 5', '5', '5']
          - ['Regular hexagon', '6 and 6', '6', '6']
          - ['Rectangle (not regular)', 'only opposite sides', '2', '2']
          - ['Circle', '(no sides)', 'infinitely many', 'infinitely many']
      - type: callout
        variant: tip
        covers: [K2.1]
        title: The regular polygon rule
        body: In a **regular polygon**, the number of sides = the number of lines of symmetry = the order of rotation symmetry.

  - title: Symmetry in 3-D, in nature and in designs
    blocks:
      - type: figure
        covers: [K1.2, S1.3]
        figure: >-
          <svg viewBox="-20 -20 280 230" class="fig-svg" role="img" aria-label="A cube cut by a flat plane through its middle into two matching halves.">
          <path class="fig-rect" d="M40 60 L140 60 L140 160 L40 160 Z"/>
          <path class="fig-rect" d="M40 60 L90 20 L190 20 L140 60 Z"/>
          <path class="fig-rect" d="M140 60 L190 20 L190 120 L140 160 Z"/>
          <path d="M90 60 L140 20 L140 120 L90 160 Z" style="fill:var(--sun);fill-opacity:0.45;stroke:var(--bad);stroke-width:3;stroke-dasharray:7 5"/>
          <text class="fig-small" x="150" y="190">plane of symmetry</text></svg>
        caption: A **3-D shape** has reflection symmetry when a flat **plane** splits it into two halves that match exactly.
      - type: compare
        covers: [K1.7, S1.1, S1.2, U1.2]
        columns:
          - title: 🦋 In nature
            body: A butterfly has **1 line** of symmetry. An ideal snowflake has **6 lines** and rotation symmetry of order **6**.
          - title: ⭐ Star quilts
            body: The eight-pointed star on star quilts made by many Plains First Nations has **8 lines** of symmetry and order **8**.
          - title: 🌸 Beadwork and buildings
            body: Métis floral beadwork, Inuit beadwork, wampum belts, basket weaving, and buildings like tipis and longhouses all use symmetry.

keyTerms:
  - term: Line of symmetry
    covers: [K1.1]
    definition: A line that splits a shape into two halves that match exactly when reflected.
  - term: Rotation symmetry
    covers: [K1.3]
    definition: A shape has it when it matches itself during a turn of less than 360° around its centre.
  - term: Order of rotation symmetry
    covers: [K1.4]
    definition: How many times a shape matches itself in one full turn.
  - term: Central symmetry
    covers: [K1.5]
    definition: Rotation symmetry by a half turn (180°).
  - term: Regular polygon
    covers: [K2.1]
    definition: A polygon with all sides equal and all angles equal.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S1.4, K1.1, K2.1]
    type: number
    figure: { kind: shape, shape: pentagon }
    prompt: This is a **regular pentagon**. How many lines of symmetry does it have?
    answer: 5
    verify: '5'
    hints:
      - Picture a fold from one corner to the middle of the opposite side. How many corners could you start from?
    solution:
      - 'Each of the 5 corners has one line, going to the middle of the opposite side. That makes **5** lines.'
      - 'It fits the regular polygon rule: 5 sides, 5 lines of symmetry.'

  - id: w2
    level: 1
    thinking: notice
    covers: [S1.5, K1.3, K1.4]
    type: mc
    figure: { kind: shape, shape: rectangle }
    prompt: 'What is the **order of rotation symmetry** of this rectangle? (It isn’t a square.)'
    choices: ['2', '4', '1', '0']
    answer: 0
    feedback:
      '1': 'A rectangle has 4 sides, but after a quarter turn, the long sides stand up. Does it match its outline then?'
      '2': 'Order 1 means it matches only at the full turn. Try a half turn.'
      '3': 'Every shape matches itself at least once, at the end of a full turn.'
    hints:
      - Imagine turning it slowly through one full turn. When does it land exactly on its outline?
    solution:
      - It matches after a half turn and again after the full turn. That is 2 matches, so its order is **2**.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.5, S2.2]
    type: multi
    prompt: Which shapes have **central symmetry**? Select all that do.
    choices:
      - Square
      - Rectangle
      - Parallelogram
      - Equilateral triangle
      - Isosceles triangle
    answer: [0, 1, 2]
    feedback:
      '3': 'After a half turn, its point faces down. It matches at a third of a turn, but not at a half turn.'
      '4': 'After a half turn, its point faces down, so it doesn’t land on its outline.'
    hints:
      - Central symmetry means matching itself after a half turn (180°). Picture each shape upside down.
    solution:
      - The square, the rectangle and the parallelogram all land on their outlines after a half turn.
      - A triangle that has been given a half turn points the opposite way, so neither triangle matches.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [U1.2, K1.1, S1.3]
    type: mc
    figure: >-
      <svg viewBox="0 0 400 130" class="fig-svg" role="img" aria-label="A square of paper, then the same paper folded in half, then folded in half again the other way into a small square with one round hole punched through it.">
      <rect class="fig-rect" x="10" y="20" width="90" height="90"/>
      <path class="fig-arrow" d="M108 65 L142 65"/>
      <rect class="fig-rect" x="150" y="20" width="45" height="90"/>
      <path class="fig-arrow" d="M203 65 L237 65"/>
      <rect class="fig-rect" x="245" y="42" width="45" height="45"/>
      <circle class="fig-hl" cx="267" cy="65" r="7"/>
      </svg>
    prompt: |-
      Yasmin folds a square of paper in half, then in half the other way. She punches **one** hole through the
      folded stack, away from the edges. What will she see when she unfolds it?
    choices:
      - '4 holes, and each fold is a line of symmetry'
      - '2 holes, and each fold is a line of symmetry'
      - '4 holes, but no line of symmetry at all'
      - '1 hole, right where the two folds meet'
    answer: 0
    feedback:
      '1': 'How many layers of paper did the hole punch go through?'
      '2': 'Each hole has a partner on the other side of a fold. Fold the paper again, and where do they land?'
      '3': 'The hole is away from the edges, so it isn’t on a fold. How many layers did it go through?'
    hints:
      - How many layers thick is the folded stack?
      - When you fold the open paper along a fold line, do the holes land on each other?
    solution:
      - 'Two folds make 4 layers, so one punch makes **4** holes.'
      - 'Fold the open paper along either fold, and the holes land on each other. So each fold is a line of symmetry. Folding and cutting is one way to create symmetry.'

  - id: b2
    level: 2
    thinking: notice
    covers: [K1.2, S1.3, U1.1]
    type: mc
    figure: >-
      <svg viewBox="0 0 300 180" class="fig-svg fig-svg--square" role="img" aria-label="A mug seen from the side, with a handle on its right side, set higher than the middle of the mug.">
      <path d="M190 40 C 255 40, 255 108, 190 108" style="fill:none;stroke:var(--ink);stroke-width:9"/>
      <rect class="fig-rect" x="70" y="25" width="120" height="135" rx="6"/>
      </svg>
    prompt: A giant flat blade slices this real mug, with its floor at the bottom and its open top, into two halves that match like mirror images. Where does the blade go?
    choices:
      - From top to bottom, right through the handle
      - From top to bottom, with the handle on one side
      - Straight across, halfway up the mug
      - Nowhere, because the handle gets in the way
    answer: 0
    feedback:
      '1': 'Then one half gets the whole handle and the other half gets none. Would they match?'
      '2': 'The bottom half has the floor, and the top half is open. The handle sits higher up too. Would they match?'
      '3': 'The handle only spoils the match if the blade misses it. Try splitting the handle too.'
    hints:
      - Which part of the mug is not the same all the way around?
      - What would have to happen to the handle for each half to get the same share?
    solution:
      - 'A flat cut through the middle of the handle gives each half the same half-handle. So that plane is a plane of symmetry.'
      - The cut straight across fails, because only the bottom half has a floor, and the handle sits above the middle.

  - id: b3
    level: 2
    thinking: connect
    covers: [K1.7, S1.2, K1.4, S1.5]
    type: number
    figure: { kind: shape, shape: star }
    prompt: The eight-pointed star on star quilts made by many Plains First Nations has rotation symmetry of order **8**. What is the **smallest** turn, in degrees, that makes it land exactly on its outline?
    answer: 45
    unit: degrees
    verify: 360 / 8
    hints:
      - How many degrees are in a full turn? How many times does the star match during that turn?
      - The 8 matches are evenly spaced around the full turn.
    solution:
      - 'One full turn is 360°, and the star matches itself 8 times on the way around.'
      - 'The matches are evenly spaced, so the smallest turn is \(360 \div 8 = 45\) degrees: from one point to the next.'

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.4, S1.5, S2.2, U1.1]
    type: mc
    figure: >-
      <svg viewBox="-125 -125 250 250" class="fig-svg fig-svg--square" role="img" aria-label="A pinwheel with four identical triangular blades, all leaning the same way around the centre.">
      <path class="sy-shape" d="M0 0 L0 -105 L52 -52 Z"/>
      <path class="sy-shape" d="M0 0 L105 0 L52 52 Z"/>
      <path class="sy-shape" d="M0 0 L0 105 L-52 52 Z"/>
      <path class="sy-shape" d="M0 0 L-105 0 L-52 -52 Z"/>
      </svg>
    prompt: Describe the symmetry of this pinwheel.
    choices:
      - 'No lines of symmetry, and order 4'
      - '4 lines of symmetry, and order 4'
      - '2 lines of symmetry, and order 2'
      - 'No lines of symmetry, and order 1'
    answer: 0
    feedback:
      '1': 'It has order 4, yes. But picture folding it. All the blades lean the same way, so what happens to them in a mirror?'
      '2': 'Try a quarter turn. Does it land on its outline? Then try folding it down the middle.'
      '3': 'No fold works, that’s true. But try a quarter turn.'
    hints:
      - Do the fold test and the turn test separately.
      - In a mirror, which way would the blades lean?
    solution:
      - 'A quarter turn moves each blade onto the next one, so it matches 4 times in a full turn: order **4**.'
      - 'In a mirror, the blades would lean the other way. So no fold works, and it has **no** lines of symmetry.'
      - A shape can turn onto itself without having any line of symmetry.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: connect
    covers: [K1.1, K1.5, U1.1, S2.2]
    type: investigation
    figure: >-
      <svg viewBox="0 0 300 100" class="fig-svg" role="img" aria-label="A banner with the word MOM in big capital letters.">
      <rect class="fig-rect" x="10" y="10" width="280" height="80" rx="4"/>
      <text class="fig-label" x="150" y="72" text-anchor="middle" style="font-size:60px">MOM</text>
      </svg>
    prompt: |-
      The school hangs this banner for Mother’s Day, in plain block capitals. By mistake, a helper hangs it after
      giving it a half turn.
    parts:
      - type: text
        prompt: What does the banner say now?
        accept: [WOW]
        hints: [What does an M look like after a half turn? What about an O?]
        solution: ['A half turn makes each M look like a W, and the O stays an O. It also swaps the left and right letters. The banner now says **WOW**.']
      - type: multi
        prompt: Which of these words would read **exactly the same** after a half turn? Select all that do.
        choices: [NOON, SOS, TOOT, DAD, MOM]
        answer: [0, 1]
        feedback:
          '2': 'A T given a half turn stands on its head.'
          '3': 'An A given a half turn stands on its head.'
          '4': 'That one just became WOW!'
        hints: [Which letters look the same after a half turn? Does every letter in the word pass?]
        solution: ['N, O and S all look the same after a half turn. So **NOON** and **SOS** still read the same.']
      - type: multi
        prompt: Now picture a line straight down the middle of each word. Which words have two halves that match like **mirror images**? Select all that do.
        choices: [TOOT, MOM, NOON, SOS, DAD]
        answer: [0, 1]
        feedback:
          '2': 'In a mirror, an N comes out backward.'
          '3': 'In a mirror, an S comes out backward.'
          '4': 'In a mirror, a D comes out backward.'
        hints: [Which letters have a line of symmetry going straight up the middle?]
        solution: ['T, O and M each have a line of symmetry going straight up the middle. So **TOOT** and **MOM** work.']
    wrapUp: Reflection symmetry and rotation symmetry are two different tests. A shape, or even a word, can pass one and fail the other.

  - id: d3
    level: 3
    thinking: whatif
    covers: [S1.1, U1.2, K1.1, K1.4, S2.2]
    type: investigation
    figure: >-
      <svg viewBox="-135 -135 270 270" class="fig-svg fig-svg--square" role="img" aria-label="A snowflake with six identical arms, evenly spaced around its centre, labelled A to F going clockwise from the top.">
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95"/>
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95" transform="rotate(60)"/>
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95" transform="rotate(120)"/>
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95" transform="rotate(180)"/>
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95" transform="rotate(240)"/>
      <rect class="sy-shape" x="-6" y="-95" width="12" height="95" transform="rotate(300)"/>
      <circle class="fig-hl" cx="0" cy="0" r="12"/>
      <text class="fig-label" x="0" y="-108" text-anchor="middle">A</text>
      <text class="fig-label" x="100" y="-52" text-anchor="middle">B</text>
      <text class="fig-label" x="100" y="64" text-anchor="middle">C</text>
      <text class="fig-label" x="0" y="122" text-anchor="middle">D</text>
      <text class="fig-label" x="-100" y="64" text-anchor="middle">E</text>
      <text class="fig-label" x="-100" y="-52" text-anchor="middle">F</text>
      </svg>
    prompt: |-
      This ideal snowflake has 6 identical arms, evenly spaced. Now picture it getting bumped on its way down.
    parts:
      - type: number
        prompt: Arm **A** snaps off. How many lines of symmetry does the broken flake have now?
        answer: 1
        verify: '1'
        hints:
          - The flake had 6 lines. Which of them still work with A gone?
          - The gap has to land on itself. Which fold keeps the gap in the same place?
        solution:
          - 'The perfect flake has 6 lines. Now a fold works only if the gap lands on itself.'
          - 'Only the line through A and D does that: B lands on F, and C lands on E. So there is **1** line.'
      - type: mc
        prompt: A new perfect flake loses **three** arms, and what is left has rotation symmetry of order 3. Which three arms snapped off?
        choices: ['A, C and E', 'A, B and C', 'A, B and D', 'A, C and D']
        answer: 0
        feedback:
          '1': 'The arms D, E and F are left, all on one side. Would a turn make them land on themselves?'
          '2': 'The arms C, E and F are left, and they aren’t evenly spaced. What would a third of a turn do?'
          '3': 'The arms B, E and F are left, and they aren’t evenly spaced. What would a third of a turn do?'
        hints:
          - For order 3, a third of a turn has to carry the flake onto itself.
          - What must the leftover arms look like, so that each one lands on the next?
        solution: ['Arms B, D and F are left, evenly spaced. A third of a turn moves each one onto the next. So the flake matches itself 3 times in a full turn.']
    wrapUp: Taking away one arm spoils almost all the symmetry. Taking away arms in a pattern can leave a smaller, simpler symmetry behind.
