id: add-subtract-algorithms
grade: 5
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT5-OI1-GQ2-LO1]
order: 2
title: Adding and Subtracting with Standard Algorithms
shortTitle: Adding & subtracting
summary: >-
  Add and subtract numbers up to 1 000 000 and decimals to thousandths with the standard algorithms, check
  answers by estimating, and solve money problems.

bigIdea: |-
  The **standard algorithms** are efficient step-by-step methods. Line up digits by **place value** (decimal
  point under decimal point), work from the **right**, carry or regroup when needed, and **estimate** to check
  that the answer makes sense.

lesson:
  - title: Line up by place value
    blocks:
      - type: compare
        covers: [S1.1, K1.1]
        columns:
          - title: ❌ Lined up on the right
            body: |-
              \[\begin{array}{rr} & 12.5 \\ + & 3.75 \end{array}\]
              The 5 tenths sits under 5 hundredths. Wrong!
          - title: ✅ Decimal points lined up
            body: |-
              \[\begin{array}{rr@{.}l} & 12 & 50 \\ + & 3 & 75 \end{array}\]
              Tenths under tenths. An empty place gets a 0.
      - type: callout
        variant: remember
        covers: [MAT4-OI1-GQ2-LO1#K1.1]
        title: Remember from Grade 4
        body: The standard algorithms for decimals are based on **place value**. You used them up to hundredths and 10 000.

  - title: Adding, step by step
    blocks:
      - type: visual
        covers: [S1.1, K1.1, U1.1]
        component: column-calc
        props:
          examples:
            - { op: '+', a: '4 562.35', b: '1 287.8' }
            - { op: '+', a: '345 678', b: '254 322' }
            - { op: '+', a: '0.457', b: '0.6' }
        caption: Press **Next step** to see each column, or **Play all**. Watch where every carry goes.

  - title: Subtracting, step by step
    blocks:
      - type: visual
        covers: [S1.1, K1.1, U1.1]
        component: column-calc
        props:
          examples:
            - { op: '-', a: '5 002.4', b: '1 876.25' }
            - { op: '-', a: '804 503', b: '199 999' }
            - { op: '-', a: '7.3', b: '2.856' }
        caption: When the top digit is too small, **regroup** from the place to its left, even across zeros.

  - title: Is it reasonable? Estimate!
    blocks:
      - type: table
        covers: [S1.2]
        caption: Round to friendly numbers, then compare the estimate with the exact answer.
        headers: [Calculation, Estimate, Exact answer, Reasonable?]
        rows:
          - ['4 562.35 + 1 287.8', '4 600 + 1 300 = 5 900', '5 850.15', '✅ close to 5 900']
          - ['5 002.4 − 1 876.25', '5 000 − 1 900 = 3 100', '3 126.15', '✅ close to 3 100']
          - ['38.6 + 4.75', '39 + 5 = 44', '86.1 ❌', '❌ far from 44, so check again']

  - title: Money problems
    blocks:
      - type: example
        covers: [S1.3]
        title: How much change?
        problem: You pay with **$50.00** for a book that costs **$18.75** and a game that costs **$23.49**. How much change do you get?
        steps:
          - 'Add the costs: \(18.75 + 23.49 = 42.24\).'
          - 'Subtract from what you paid: \(50.00 - 42.24 = 7.76\).'
          - 'Estimate: \(19 + 23 = 42\), and \(50 - 42 = 8\). Close to $7.76 ✓'
        answer: You get **$7.76** in change.

keyTerms:
  - term: Standard algorithm
    covers: [K1.1]
    definition: An efficient, step-by-step method for calculating, done column by column.
  - term: Regroup
    covers: [S1.1]
    definition: 'Trade 1 of a place for 10 of the next smaller place, like 1 ten for 10 ones.'
  - term: Estimate
    covers: [S1.2]
    definition: A close, rounded answer used to check whether an exact answer is reasonable.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S1.1, K1.1]
    type: mc
    prompt: Zoe sets up \(7.4 - 2.86\) in columns. Which digit of 2.86 belongs directly **under the 4**?
    choices: ['8', '6', '2']
    answer: 0
    feedback:
      '1': 'The 6 is worth 6 hundredths. The 4 is worth 4 tenths, so these two digits are in different places.'
      '2': 'The 2 is worth 2 ones. The 4 is worth 4 tenths, so these two digits are in different places.'
    hints:
      - What is the 4 worth? Say its place out loud.
      - Which digit of 2.86 is in that same place?
    solution:
      - 'Line up the decimal points, and every column holds one place.'
      - 'The 4 is in the tenths place, and so is the **8**. Then write 7.4 as 7.40, so the 6 has a digit above it.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.1]
    type: number
    prompt: Add. \(4.6 + 2.475\)
    answer: 7.075
    verify: 4.6 + 2.475
    hints:
      - How many decimal places does each number have?
      - Write 4.6 as 4.600, then add from the right.
    solution:
      - 'Line up the decimal points: 4.600 + 2.475.'
      - 'Thousandths: 0 + 5 = 5. Hundredths: 0 + 7 = 7. Tenths: 6 + 4 = 10, so write 0 and carry 1. Ones: 4 + 2 + 1 = 7.'
      - 'The sum is **7.075**.'

  - id: w3
    level: 1
    thinking: apply
    covers: [S1.1, U1.1]
    type: number
    prompt: Subtract. Watch the zeros. \(50\,003 - 1\,275\)
    answer: 48728
    verify: 50003 - 1275
    hints:
      - The ones digit on top is too small. Can the tens lend you anything?
      - Keep going left until you find a place you can regroup from. Each zero along the way becomes a 9.
    solution:
      - 'There is nothing to regroup in the tens, hundreds or thousands, so start at the 5 ten thousands.'
      - '50 003 becomes 4 ten thousands, 9 thousands, 9 hundreds, 9 tens and 13 ones.'
      - 'Now each column works: 13 − 5 = 8, 9 − 7 = 2, 9 − 2 = 7, 9 − 1 = 8, and 4 is left. The answer is **48 728**.'

  - id: w4
    level: 1
    thinking: apply
    covers: [S1.3]
    type: number
    prompt: Adil has **$27.40** in a piggy bank and spends **$9.85** on a kite. How much money is left?
    answer: 17.55
    verify: 27.40 - 9.85
    hints:
      - Do you need to add or subtract? What happens to the money?
      - Line up the decimal points. The hundredths column needs to regroup first.
    solution:
      - 'Spending takes money away, so subtract: \(27.40 - 9.85 = 17.55\).'
      - 'Check with an estimate: \(27 - 10 = 17\), which is close. Adil has **$17.55** left.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.3, S1.1]
    type: number
    prompt: A car’s odometer counts every kilometre the car has ever driven. On a road trip it read **248 917.6 km** at home, **249 033.2 km** at lunch and **249 205.0 km** at the lake. How far did the family drive **after lunch**?
    unit: km
    answer: 171.8
    verify: 249205 - 249033.2
    hints:
      - The odometer doesn’t show the length of a trip. What does it show?
      - After lunch means from one reading to another. Which two readings do you need?
      - One of the three numbers doesn’t matter at all. Which one?
    solution:
      - 'Each reading is a running total, so a trip is the **difference** between two readings.'
      - 'After lunch runs from 249 033.2 to 249 205.0. The home reading doesn’t matter.'
      - '\(249\,205.0 - 249\,033.2 = 171.8\), so they drove **171.8 km** after lunch.'

  - id: b2
    level: 2
    thinking: estimate
    covers: [S1.2]
    type: multi
    prompt: |-
      Four children add \(3\,847.6 + 2\,195.25\), and each makes a slip. Select **all** the answers that a quick estimate would catch as wrong.
    choices:
      - 'Eve: 8 042.85'
      - 'Priti: 2 580.01'
      - 'Noah: 6 042.95'
      - 'Sol: 6 052.85'
    answer: [0, 1]
    feedback:
      '2': 'Noah’s answer is close to the estimate, so an estimate can’t tell that it is wrong. It is off by only 0.1.'
      '3': 'Sol’s answer is close to the estimate, so an estimate can’t tell that it is wrong. It is off by only 10.'
    hints:
      - Round each number to a friendly number. About how big should the sum be?
      - Compare each answer with your estimate. Which ones are far away?
    solution:
      - 'Estimate: \(3\,800 + 2\,200 = 6\,000\). The answer should be close to 6 000.'
      - 'Eve’s 8 042.85 and Priti’s 2 580.01 are far from 6 000, so the estimate catches them. Priti lined up the digits on the right, not the decimal points.'
      - 'Noah and Sol are close to 6 000, so they pass the estimate. The real sum is 6 042.85, so both are still wrong.'
      - 'What we learned: an estimate catches big mistakes. A small slip can pass, so check the columns too.'

  - id: b3
    level: 2
    thinking: flaw
    covers: [S1.1, K1.1]
    type: number
    prompt: |-
      Amira has made the same kind of mistake twice.

      \(503 - 278 = 375\)

      \(612 - 148 = 536\)

      Work out what Amira does in each column. If Amira does the same thing, what will Amira write for \(704 - 256\)?
    answer: 552
    verify: 500 + 50 + 2
    hints:
      - Look only at the ones column of the first sum. Top digit 3, bottom digit 8, answer 5. How could you get 5?
      - Check the tens column too. Does the same idea explain every column?
      - In each column, Amira takes the smaller digit from the larger one. Try that on the new subtraction.
    solution:
      - 'Look at one column at a time. In the ones of 503 − 278, the top is 3 and the bottom is 8, and Amira wrote 5. That is 8 − 3.'
      - 'Every column fits: Amira always takes the smaller digit from the larger one, and never regroups.'
      - 'So for 704 − 256: 6 − 4 = 2, then 5 − 0 = 5, then 7 − 2 = 5. Amira writes **552**.'
      - 'The real answer is 448. When the top digit is too small, you have to regroup, not swap the digits.'

  - id: b4
    level: 2
    thinking: ways
    covers: [S1.1, K1.1, S1.3]
    type: mc
    prompt: |-
      Mika has to find the change from **$100.00** for a **$63.27** game, and hates regrouping across zeros. So Mika does \(99.99 - 63.27\) instead, with no regrouping at all, and gets **36.72**.

      What should Mika do next to get the real change?
    choices:
      - Add 0.01 to 36.72.
      - Subtract 0.01 from 36.72.
      - Add 1.00 to 36.72.
      - Keep 36.72 as it is.
    answer: 0
    feedback:
      '1': 'Mika started with less than $100.00. So will the real change be more or less than 36.72?'
      '2': 'How far is 99.99 from 100.00? It is less than a whole dollar.'
      '3': 'Mika started with 99.99, not 100.00. Starting with a little more money leaves a little more change.'
    hints:
      - How much less than 100.00 did Mika start with?
      - If you start with a little more money and spend the same amount, what happens to what’s left?
    solution:
      - '99.99 is 0.01 less than 100.00. Mika’s starting number was too small by 0.01.'
      - 'The price is the same, so the change is too small by 0.01 as well. Add 0.01: \(36.72 + 0.01 = 36.73\).'
      - 'Check with the algorithm: \(100.00 - 63.27 = 36.73\). Regrouping across zeros and this trick give the same answer.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: backwards
    covers: [S1.1, S1.3]
    type: number
    figure: |-
      <svg viewBox="0 0 250 145" class="fig-svg" role="img" aria-label="A chewed receipt in columns. Top line: hay, 4, a missing digit, 8, point 7 0 dollars. Second line: fence posts, 2, 6, a missing digit, point 6 0 dollars. Total: 7 3 3 point 3 0 dollars."><rect class="fig-hl" x="118" y="14" width="26" height="30"/><rect class="fig-hl" x="142" y="56" width="26" height="30"/><line class="fig-grid" style="stroke:var(--ink);stroke-width:2" x1="70" y1="100" x2="240" y2="100"/><text class="fig-small" x="4" y="36">Hay</text><text class="fig-small" x="4" y="78">Posts</text><text class="fig-small" x="4" y="130">Total</text><text class="fig-label" x="83" y="36" text-anchor="middle">$</text><text class="fig-label" x="107" y="36" text-anchor="middle">4</text><text class="fig-label" x="131" y="36" text-anchor="middle">?</text><text class="fig-label" x="155" y="36" text-anchor="middle">8</text><text class="fig-label" x="179" y="36" text-anchor="middle">.</text><text class="fig-label" x="203" y="36" text-anchor="middle">7</text><text class="fig-label" x="227" y="36" text-anchor="middle">0</text><text class="fig-label" x="83" y="78" text-anchor="middle">$</text><text class="fig-label" x="107" y="78" text-anchor="middle">2</text><text class="fig-label" x="131" y="78" text-anchor="middle">6</text><text class="fig-label" x="155" y="78" text-anchor="middle">?</text><text class="fig-label" x="179" y="78" text-anchor="middle">.</text><text class="fig-label" x="203" y="78" text-anchor="middle">6</text><text class="fig-label" x="227" y="78" text-anchor="middle">0</text><text class="fig-label" x="83" y="130" text-anchor="middle">$</text><text class="fig-label" x="107" y="130" text-anchor="middle">7</text><text class="fig-label" x="131" y="130" text-anchor="middle">3</text><text class="fig-label" x="155" y="130" text-anchor="middle">3</text><text class="fig-label" x="179" y="130" text-anchor="middle">.</text><text class="fig-label" x="203" y="130" text-anchor="middle">3</text><text class="fig-label" x="227" y="130" text-anchor="middle">0</text></svg>
    prompt: A goat at Oak Hollow Farm chewed the receipt for hay and fence posts, and bit a digit out of each price. The total survived. How much did the **hay** cost?
    answer: 468.70
    verify: 733.30 - 264.60
    hints:
      - Add the columns you can see, working from the right. What happens in the tenths?
      - Tenths are 7 + 6 = 13, so 1 carries into the ones. In the ones, 8 + ? + 1 has to end in 3.
      - Now look at the tens. Did the ones column carry too? ? + 6 + that carry has to end in 3.
    solution:
      - 'Work through the addition just as you would if you could see it, from the right.'
      - 'Tenths: 7 + 6 = 13. Write 3, carry 1.'
      - 'Ones: 8 + ? + 1 must end in 3, so it is 13, and the posts’ missing digit is 4. Carry 1.'
      - 'Tens: ? + 6 + 1 must end in 3, so it is 13, and the hay’s missing digit is 6. Carry 1.'
      - 'Hundreds: 4 + 2 + 1 = 7, which matches the total. So the hay cost **$468.70** and the posts cost $264.60.'

  - id: d2
    level: 3
    thinking: pattern
    covers: [S1.1, S1.3]
    type: investigation
    prompt: |-
      Tess runs the till at a bake sale. At closing, the till says **$2.70** more than the money in the drawer.

      Tess remembers a mistake. She typed a **$4.70** pie as **$7.40**. She swapped the two digits beside the decimal point.
    parts:
      - type: number
        prompt: How much extra did that one mistake add to the till?
        answer: 2.70
        verify: 7.40 - 4.70
        hints:
          - What did the till record, and what should it have recorded?
        solution:
          - '\(7.40 - 4.70 = 2.70\). That explains the whole difference.'
      - type: build
        prompt: Could a **different** price have caused the same **$2.70**? Invent one. Type the two digits of the real price, the way $4.70 has a 4 and a 7. The till swaps them and records too much.
        fields:
          - { name: a, label: 'Dollars digit of the real price' }
          - { name: b, label: 'Dimes digit of the real price' }
        rules:
          - { test: 'a % 1 == 0 && b % 1 == 0 && a > 0 && b > 0 && a <= 9 && b <= 9', fail: 'Each one has to be a single digit from 1 to 9.' }
          - { test: '(b + a / 10) - (a + b / 10) == 2.7', fail: 'Write out both prices, the real one and the swapped one, and subtract. How far off is your till? Try different digits, and look at how far apart they are.' }
          - { test: 'a != 4', fail: 'That is Tess’s own pie. Find a **different** price.' }
        examples:
          - { a: 1, b: 4 }
          - { a: 6, b: 9 }
          - { a: 3, b: 6 }
        counterexamples:
          - { a: 4, b: 8 }
          - { a: 4, b: 7 }
          - { a: 7, b: 4 }
          - { a: 1.5, b: 4.5 }
        hints:
          - Try a price, such as $2.30 typed as $3.20. How far off is that?
          - Now try another swap. Compare the two digits each time. How far apart are they?
          - In $4.70 the digits 4 and 7 are 3 apart. Try other digits that are 3 apart.
        solution:
          - 'The digits of $4.70 are 3 apart, so try other digits 3 apart.'
          - '$1.40 typed as $4.10 is off by $2.70. So is $6.90 typed as $9.60, and $3.60 typed as $6.30.'
          - 'They all work for the same reason: the digits are 3 apart, and only that gap matters.'
      - type: number
        prompt: Now try a swap where the digits are **5 apart**, such as $1.60 typed as $6.10. How far off is the till?
        answer: 4.50
        verify: 6.10 - 1.60
        hints:
          - Line up the decimal points and subtract.
        solution:
          - '\(6.10 - 1.60 = 4.50\). Digits 1 apart are off by $0.90, 2 apart by $1.80, 3 apart by $2.70 and 5 apart by $4.50.'
      - type: mc
        prompt: The next day the till is off by **$3.10**. Tess wonders if she swapped the digits of a price again, the same way. What do you say?
        choices:
          - Not that kind of swap. Each one is off by 0.90, 1.80, 2.70 and so on, and 3.10 isn’t on that list.
          - It could be that swap. Digits that are far enough apart can make a till off by any amount at all.
          - It could be that swap. A difference above $3.00 must come from digits that are 4 apart.
          - We can’t tell anything. We would have to know exactly which price she typed that day.
        answer: 0
        feedback:
          '1': 'Keep your list going, adding 0.90 each time: 0.90, 1.80, 2.70, 3.60. Does it ever land on 3.10?'
          '2': 'Try digits 4 apart, such as $1.50 typed as $5.10. How far off is that till?'
          '3': 'You don’t need the price. Only the gap between the two digits matters. Which amounts can a swap make?'
        hints:
          - Make a list of how far off a swap can be, for digits 1 apart, 2 apart, 3 apart, 4 apart.
        solution:
          - 'Each extra step between the digits adds another 0.90: 0.90, 1.80, 2.70, 3.60, 4.50, and so on.'
          - '3.10 falls between 2.70 and 3.60, so this kind of swap can’t be the cause. Tess has a different mistake to find.'
    wrapUp: A swap of two side-by-side digits leaves a fingerprint. The till can only be off by certain amounts, so the size of the mistake tells you what kind of mistake it was.
    hints: []
    solution: []

  - id: d3
    level: 3
    thinking: design
    covers: [S1.2, S1.3, S1.1]
    type: build
    prompt: |-
      Malik has **$10**. To check the price of three snacks, Malik rounds each price to the nearest dollar and adds them.

      Invent **three prices** that fool Malik: the estimate says **$10 or less**, but the real total is **more than $10**.
    fields:
      - { name: a, label: 'Snack 1', unit: $ }
      - { name: b, label: 'Snack 2', unit: $ }
      - { name: c, label: 'Snack 3', unit: $ }
    rules:
      - { test: 'a > 0 && b > 0 && c > 0 && a * 100 % 1 == 0 && b * 100 % 1 == 0 && c * 100 % 1 == 0', fail: 'Each price has to be dollars and cents, more than $0, like 2.75.' }
      - { test: '(a + 0.5 - (a + 0.5) % 1) + (b + 0.5 - (b + 0.5) % 1) + (c + 0.5 - (c + 0.5) % 1) <= 10', fail: 'Round each price to the nearest dollar and add. That estimate is over $10, so Malik wouldn’t be fooled. He would put something back.' }
      - { test: 'a + b + c > 10', fail: 'The estimate is fine, but the real total is $10 or less, so Malik really can pay. How can you sneak more cents into the prices without changing how they round?' }
    examples:
      - { a: 3.49, b: 3.49, c: 3.49 }
      - { a: 2.45, b: 4.45, c: 3.45 }
      - { a: 3.40, b: 3.40, c: 3.60 }
    counterexamples:
      - { a: 3, b: 3, c: 3 }
      - { a: 3.5, b: 3.5, c: 3.5 }
      - { a: 5, b: 5, c: 5 }
      - { a: 3.333, b: 3.333, c: 3.4 }
    hints:
      - When does rounding make a price look cheaper than it is?
      - Which price rounds down by the most? Try prices that end in a lot of cents, but still round down.
      - Try three prices that each round down to $3. How high can they go?
    solution:
      - 'To fool Malik, each price should round **down** by as much as it can, so the estimate is too low.'
      - '$3.49 rounds down to $3. Three of them give an estimate of $9, but the real total is $10.47.'
      - '$2.45, $4.45 and $3.45 also work: the estimate is $9 and the total is $10.35.'
      - 'They all work for the same reason: nearly 50 cents goes missing from each price, and together those cents add up to more than a dollar.'
      - 'What we learned: an estimate tells you about how big a total is. When the total is close to your limit, work it out exactly.'
