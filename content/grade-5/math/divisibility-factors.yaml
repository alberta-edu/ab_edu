id: divisibility-factors
grade: 5
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT5-OI1-GQ3-LO1]
order: 3
title: Divisibility Tests and Factors
shortTitle: Divisibility & factors
summary: >-
  Discover the divisibility tests for 2, 3 and 5, see why dividing by zero is impossible, and use the
  tests to find the factors of a number.

bigIdea: |-
  A number is **divisible** by another when the division leaves a **remainder of 0**. Quick
  **divisibility tests** for 2, 3 and 5 tell you without dividing, and they help you find a number's
  **factors**. One rule never changes: you **can't divide by 0**.

lesson:
  - title: What "divisible" means
    blocks:
      - type: compare
        covers: [U1.1]
        columns:
          - title: ✅ Divisible
            body: |-
              \[15 \div 5 = 3 \text{ R } 0\]
              Remainder **0**, so 15 is divisible by 5.
          - title: ❌ Not divisible
            body: |-
              \[17 \div 5 = 3 \text{ R } 2\]
              Remainder **2**, so 17 is not divisible by 5.
      - type: callout
        variant: remember
        covers: [MAT4-OI1-GQ3-LO1#K1.1, MAT4-OI1-GQ3-LO1#K1.2]
        title: Remember from Grade 4
        body: A **factor** of a number divides it exactly. The number is a **multiple** of each of its factors.

  - title: Patterns on the hundred chart
    blocks:
      - type: visual
        covers: [S1.1, S1.2]
        component: divisibility
        props: { start: 2, number: 60 }
        caption: Tap a divisor from **0 to 10** and look for the pattern in the numbers that light up. For 3, look at the small digit sums.

  - title: Tests for 2, 5 and 3
    blocks:
      - type: table
        covers: [S1.2]
        headers: [Divisible by, Test, Example]
        rows:
          - ['**2**', 'The ones digit is even: 0, 2, 4, 6 or 8.', '7 3**4** ✓  &nbsp; 45**9** ✗']
          - ['**5**', 'The ones digit is 0 or 5.', '4 38**5** ✓  &nbsp; 1 50**7** ✗']
          - ['**3**', 'The sum of the digits is divisible by 3.', '4 728 → 4 + 7 + 2 + 8 = 21 ✓']

  - title: You can't divide by zero
    blocks:
      - type: compare
        covers: [K1.2]
        columns:
          - title: Sharing makes sense
            body: |-
              \[12 \div 3 = 4\]
              because \(4 \times 3 = 12\).
          - title: Zero groups doesn't
            body: |-
              \[12 \div 0 = \;?\]
              We'd need \(? \times 0 = 12\). Any number times 0 is 0, so there is **no** answer.
      - type: callout
        variant: mistake
        covers: [K1.2]
        title: Watch out
        body: '\(12 \div 0\) is **not** 0 and **not** 12. Division by 0 is not possible.'

  - title: Using the tests to find factors
    blocks:
      - type: example
        covers: [K1.1, S1.3]
        title: Find the factors of 60
        problem: Use divisibility tests to find all the factors of **60**.
        steps:
          - '**2:** the ones digit 0 is even ✓ → \(60 = 2 \times 30\)'
          - '**3:** the digit sum 6 + 0 = 6 is divisible by 3 ✓ → \(60 = 3 \times 20\)'
          - '**5:** the ones digit is 0 ✓ → \(60 = 5 \times 12\)'
          - 'Divide to check 4, 6 and 10 too: \(60 = 4 \times 15 = 6 \times 10\), and of course \(1 \times 60\).'
        answer: 'Factors of 60: **1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60**'
      - type: callout
        variant: tip
        covers: [S1.3]
        title: Try it yourself
        body: In the lab above, choose **Test a number** and type any number. You'll see each test and all the factor pairs.

keyTerms:
  - term: Divisible
    covers: [U1.1]
    definition: One number is divisible by another when the division leaves a remainder of 0.
  - term: Divisibility test
    covers: [K1.1, S1.2]
    definition: 'A quick check for whether a number is divisible by another, without dividing.'
  - term: Factor
    covers: [MAT4-OI1-GQ3-LO1#K1.1]
    definition: A number that divides another number exactly.
  - term: Digit sum
    covers: [S1.2]
    definition: 'The total of a number''s digits. For 4 728 it is 4 + 7 + 2 + 8 = 21.'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S1.2]
    type: multi
    prompt: Select **all** the numbers that are divisible by **5**.
    choices: ['4 385', '1 050', '5 005', '5 551', '3 053']
    answer: [0, 1, 2]
    feedback:
      '3': 'This number starts with a 5, but the test doesn’t look there. What is its ones digit?'
      '4': 'This number has a 5 in the middle, but the test doesn’t look there. What is its ones digit?'
    hints:
      - Which digit does the test for 5 look at?
      - The ones digit has to be 0 or 5. Any other 5s in the number don’t matter.
    solution:
      - '4 38**5**, 1 05**0** and 5 00**5** end in 0 or 5, so they are divisible by 5.'
      - '5 55**1** and 3 05**3** end in other digits, so they aren’t, even though they have 5s in them.'

  - id: w2
    level: 1
    thinking: apply
    covers: [U1.1]
    type: number
    prompt: '**30** players make teams of **4**. How many players are left without a team?'
    unit: players
    answer: 2
    verify: 30 - 4 * 7
    hints:
      - How many full teams of 4 can you make from 30 players?
      - 'Count by fours: 4, 8, 12 and so on. How close to 30 can you get?'
    solution:
      - '\(30 \div 4 = 7\) R 2, so there are 7 full teams and **2** players left.'
      - 'The remainder isn’t 0, so 30 is **not** divisible by 4.'

  - id: w3
    level: 1
    thinking: recall
    covers: [S1.2]
    type: mc
    prompt: Is **1 000 002** divisible by **3**?
    choices:
      - Yes. The sum of its digits is 3, which is divisible by 3.
      - No. Its ones digit is 2, which is not divisible by 3.
      - No. Numbers this big are almost never divisible by 3.
      - We can’t tell. We would have to divide the whole thing.
    answer: 0
    feedback:
      '1': 'The ones digit is what the tests for 2 and 5 use. What does the test for 3 use?'
      '2': 'The size of a number doesn’t decide this. Numbers divisible by 3 go on forever, every third number.'
      '3': 'The test saves you from dividing, and it works for any number. What does it ask you to add?'
    hints:
      - The test for 3 uses all the digits. What do you do with them?
    solution:
      - 'Add the digits: 1 + 0 + 0 + 0 + 0 + 0 + 2 = 3.'
      - '3 is divisible by 3, so 1 000 002 is too. A seven-digit number took one small sum.'

  - id: w4
    level: 1
    thinking: connect
    covers: [S1.2]
    type: number
    prompt: A number passes the test for **2** and the test for **5**. What must its ones digit be?
    answer: 0
    verify: '0'
    hints:
      - Which ones digits pass the test for 2? Which pass the test for 5?
      - Which digit is on both lists?
    solution:
      - 'The test for 2 allows 0, 2, 4, 6 and 8. The test for 5 allows 0 and 5.'
      - 'Only **0** is on both lists.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.2, K1.1]
    type: build
    prompt: Rain smudged the band’s list. The band has **1▢4** members, and it marches in rows of **3** with nobody left over. What digit could be under the smudge?
    fields:
      - { name: x, label: 'Digit under the smudge' }
    rules:
      - { test: 'x % 1 == 0 && x >= 0 && x <= 9', fail: 'Only one digit fits under the smudge, from 0 to 9.' }
      - { test: '(1 + x + 4) % 3 == 0', fail: 'Add the digits of your number, 1 + your digit + 4. Is the sum divisible by 3?' }
    examples:
      - { x: 1 }
      - { x: 4 }
      - { x: 7 }
    counterexamples:
      - { x: 0 }
      - { x: 2 }
      - { x: 3 }
      - { x: 10 }
    hints:
      - Rows of 3 with nobody left over. Which test does that call for?
      - The digits you can see add up to 5. What could you add to 5 to reach a number divisible by 3?
    solution:
      - 'Rows of 3 with nobody left over means the number is divisible by 3, so its digit sum must be too.'
      - 'The digit sum is 1 + 4 + ▢, or 5 + ▢. The digit can be 1 (sum 6), 4 (sum 9) or 7 (sum 12).'
      - 'They all work for the same reason. 114, 144 and 174 each have a digit sum that is divisible by 3.'

  - id: b2
    level: 2
    thinking: model
    covers: [S1.3, K1.1, S1.1]
    type: multi
    prompt: The gym has **96 chairs** for a concert. They must go in equal rows with no chairs left over. Select **all** the row sizes that work.
    choices: ['2 chairs', '3 chairs', '4 chairs', '6 chairs', '8 chairs', '5 chairs', '9 chairs', '10 chairs']
    answer: [0, 1, 2, 3, 4]
    feedback:
      '5': 'What is the ones digit of 96? Check the test for 5.'
      '6': 'Divide to check. \(96 \div 9\) leaves a remainder.'
      '7': 'What is the ones digit of 96? A number divisible by 10 ends in 0.'
    hints:
      - What does "no chairs left over" tell you about the row size and 96?
      - Use the tests for 2, 3 and 5 first. They are quick. Then divide to check the others.
      - Now divide 96 by each size that is left, 4, 6, 8 and 9. Which ones leave no remainder?
    solution:
      - 'No chairs left over means the row size is a **factor** of 96.'
      - 'Tests: 96 is even, so 2 works. Its digit sum is 15, so 3 works. It doesn’t end in 0 or 5, so 5 and 10 don’t work.'
      - 'Divide to check the rest: \(96 \div 4 = 24\), \(96 \div 6 = 16\) and \(96 \div 8 = 12\) all work. \(96 \div 9 = 10\) R 6 doesn’t.'
      - 'So rows of **2, 3, 4, 6 or 8** chairs all work.'

  - id: b3
    level: 2
    thinking: evidence
    covers: [U1.1, S1.1]
    type: build
    prompt: |-
      Farah loves the test for 3, so she invents one for 4: "Add the digits. If the sum is divisible by 4, the number is divisible by 4." It works for 40 and 44.

      Prove Farah’s test can fail. Find a two-digit number whose digit sum **is** divisible by 4, but the number **isn’t**.
    fields:
      - { name: t, label: 'Tens digit' }
      - { name: o, label: 'Ones digit' }
    rules:
      - { test: 't % 1 == 0 && o % 1 == 0 && t > 0 && t <= 9 && o >= 0 && o <= 9', fail: 'Use a single digit in each box. The tens digit can’t be 0.' }
      - { test: '(t + o) % 4 == 0', fail: 'Add your two digits. The sum has to be divisible by 4, or Farah’s test doesn’t even apply.' }
      - { test: '(10 * t + o) % 4 != 0', fail: 'That number really is divisible by 4, so Farah’s test worked here. Try another number with the same kind of digit sum.' }
    examples:
      - { t: 1, o: 3 }
      - { t: 2, o: 2 }
      - { t: 3, o: 5 }
    counterexamples:
      - { t: 4, o: 0 }
      - { t: 4, o: 4 }
      - { t: 1, o: 2 }
      - { t: 8, o: 8 }
    hints:
      - Which two digits add up to 4? There are only a few choices.
      - Try each one. Divide it by 4. Is the remainder 0?
    solution:
      - 'To break a test, you only need one number where it fails. So try numbers whose digits add up to 4 or 8.'
      - '**13**: the digit sum is 4, but \(13 \div 4 = 3\) R 1. **22**: the digit sum is 4, but \(22 \div 4 = 5\) R 2.'
      - 'They all work for the same reason: a number is divisible by 4 only if the remainder is 0, and these leave a remainder even though their digits add to 4 or 8. A test that works for 3 doesn’t have to work for 4.'

  - id: b4
    level: 2
    thinking: why
    covers: [K1.2]
    type: mc
    prompt: Two divisions are on the board, \(0 \div 8\) and \(8 \div 0\). Which is right? Check with multiplication.
    choices:
      - \(0 \div 8 = 0\), since \(0 \times 8 = 0\). But \(8 \div 0\) has no answer, since nothing \(\times\, 0\) makes 8.
      - Both come out to 0, since a division with a zero in it always ends up as nothing at all.
      - Neither one has an answer, since you can’t do any division when a zero is part of it.
      - \(0 \div 8\) has no answer, but \(8 \div 0 = 8\), since zero friends leave all 8 cookies untouched.
    answer: 0
    feedback:
      '1': 'Check \(8 \div 0 = 0\) with multiplication. Is \(0 \times 0\) equal to 8?'
      '2': 'Try \(0 \div 8\). Zero cookies shared by 8 friends: how many does each one get? Is there a problem?'
      '3': 'Check \(8 \div 0 = 8\) with multiplication. Is \(8 \times 0\) equal to 8?'
    hints:
      - For each one, ask what number times the divisor gives the number being divided.
      - For \(8 \div 0\), try some numbers. What is \(5 \times 0\)? What is \(100 \times 0\)?
    solution:
      - 'Turn each division into a multiplication. \(0 \div 8 = ?\) asks \(? \times 8 = 0\). The answer is 0, and that works.'
      - '\(8 \div 0 = ?\) asks \(? \times 0 = 8\). Any number times 0 is 0, never 8, so **division by 0 is not possible**.'
      - 'Which number sits where matters. Dividing zero is fine. Dividing **by** zero isn’t.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: design
    covers: [S1.2, S1.3, K1.1]
    type: build
    prompt: |-
      Captain Odalys counts her gold coins and smiles. Share them among **2, 3 or 5** pirates, and none are left over. Share them among **4** pirates, and some are left over for the parrot.

      How many coins could she have? Invent a number.
    fields:
      - { name: n, label: 'Gold coins' }
    rules:
      - { test: 'n > 0 && n % 1 == 0', fail: 'She needs a whole number of coins, more than 0.' }
      - { test: 'n % 2 == 0', fail: 'With 2 pirates, a coin is left over. Check the test for 2.' }
      - { test: 'n % 5 == 0', fail: 'With 5 pirates, some coins are left over. Check the test for 5.' }
      - { test: 'n % 3 == 0', fail: 'With 3 pirates, some coins are left over. Check the test for 3.' }
      - { test: 'n % 4 != 0', fail: 'The pirates are happy, but 4 pirates share every coin, and the parrot gets nothing! Try the next number that passes the tests.' }
    examples:
      - { n: 30 }
      - { n: 90 }
      - { n: 150 }
    counterexamples:
      - { n: 60 }
      - { n: 120 }
      - { n: 15 }
      - { n: 20 }
      - { n: 45 }
    hints:
      - Passing the tests for both 2 and 5 tells you something about the ones digit. What?
      - With that ones digit, what must be true of the digit sum to pass the test for 3 as well?
      - You should have a few numbers now. Divide each one by 4 and look for a remainder.
    solution:
      - 'Start with the tests. Passing 2 and 5 means the ones digit is 0. Passing 3 means the digit sum is divisible by 3.'
      - 'That gives 30, 60, 90, 120, 150, and so on.'
      - 'Now look for the parrot. \(30 \div 4 = 7\) R 2, so 30 works. \(60 \div 4 = 15\), with nothing left, so 60 doesn’t. \(90 \div 4 = 22\) R 2, so 90 works, and so does 150.'
      - 'They all work for the same reason: each passes the tests for 2, 3 and 5, but 4 isn’t one of its factors. Being divisible by 2 doesn’t promise being divisible by 4.'

  - id: d2
    level: 3
    thinking: pattern
    covers: [S1.3, U1.1]
    type: investigation
    prompt: |-
      At the **Factor Dance**, the dancers are all the factors of **36**. Two dancers are partners if they multiply to make 36, so 2 dances with 18, and 1 dances with 36.
    parts:
      - type: number
        prompt: How many dancers are there? Count every factor of 36.
        unit: dancers
        answer: 9
        verify: 2 * 4 + 1
        hints:
          - Find the partners pair by pair. 1 and 36, 2 and 18, then what?
          - 36 is divisible by 3, because its digit sum is 9. Who is 3’s partner?
        solution:
          - 'The pairs are 1 and 36, 2 and 18, 3 and 12, 4 and 9, and then just 6.'
          - 'The factors are 1, 2, 3, 4, 6, 9, 12, 18 and 36, so there are **9** dancers.'
      - type: number
        prompt: With 9 dancers, someone can’t have a different partner. Which factor dances **alone**?
        answer: 6
        verify: 36 / 6
        hints:
          - Which factor’s partner is itself? What times itself makes 36?
        solution:
          - '\(6 \times 6 = 36\). The partner of 6 is 6, so **6** dances alone.'
      - type: build
        prompt: Find another number, from 20 to 100, that has a dancer alone at its dance. Then name that dancer.
        fields:
          - { name: n, label: 'The number' }
          - { name: f, label: 'The dancer who is alone' }
        rules:
          - { test: 'n >= 20 && n <= 100 && n % 1 == 0 && n != 36', fail: 'Choose a different whole number from 20 to 100, not 36.' }
          - { test: 'f > 0 && f * f == n', fail: 'Check your dancer. A dancer who is alone has to be their own partner, so that factor times itself should make your number.' }
        examples:
          - { n: 25, f: 5 }
          - { n: 49, f: 7 }
          - { n: 100, f: 10 }
        counterexamples:
          - { n: 30, f: 5 }
          - { n: 36, f: 6 }
          - { n: 16, f: 4 }
          - { n: 50, f: 7 }
        hints:
          - 'Start with the dancer, not the number. Pick a factor. What number do you get if it partners itself?'
          - 'Try \(5 \times 5\). Is the answer between 20 and 100?'
        solution:
          - 'Pick the dancer first, then multiply it by itself.'
          - '25 has 5 alone, 49 has 7 alone, and 81 has 9 alone.'
          - 'They all work for the same reason: the number can be drawn as a square, with equal sides. That side is the dancer who is alone.'
      - type: mc
        prompt: A different number’s dance has exactly **12 dancers**. What can you be sure of, without knowing the number?
        choices:
          - Everyone has a different partner, because 12 dancers pair up with nobody left.
          - One dancer is alone, because every number’s dance has one dancer left over.
          - The number has to be 12, because every number has as many factors as itself.
          - Two dancers are alone, because a number with so many factors needs extra pairs.
        answer: 0
        feedback:
          '1': 'Check with a small number. List the factors of 6: 1, 2, 3 and 6. Is anyone alone?'
          '2': 'List the factors of 12. Are there 12 of them?'
          '3': 'A number has only one factor that times itself makes that number, so two can’t be alone.'
        hints:
          - Why did 36 have someone alone? Think about pairing up 9 people, then 12 people.
        solution:
          - 'Every factor is in a pair with a different factor, except the one who is its own partner.'
          - 'A dancer alone makes the count **odd**, as with 9. With 12 dancers, the count is even, so everyone is paired with someone else.'
    wrapUp: Factors come in pairs. So most numbers have an even number of factors. The only ones with an odd number are square numbers, where one factor is its own partner.
    hints: []
    solution: []

  - id: d3
    level: 3
    thinking: why
    covers: [S1.2, S1.1]
    type: investigation
    figure: |-
      <svg viewBox="0 0 380 96" class="fig-svg" role="img" aria-label="Aisha's cards: 2 boxes marked 100, 4 packs marked 10 and 6 single cards."><rect class="fig-rect" x="6" y="20" width="50" height="60"/><rect class="fig-rect" x="64" y="20" width="50" height="60"/><text class="fig-label" x="31" y="56" text-anchor="middle">100</text><text class="fig-label" x="89" y="56" text-anchor="middle">100</text><rect class="fig-hl" x="130" y="30" width="28" height="44"/><rect class="fig-hl" x="162" y="30" width="28" height="44"/><rect class="fig-hl" x="194" y="30" width="28" height="44"/><rect class="fig-hl" x="226" y="30" width="28" height="44"/><text class="fig-small" x="144" y="57" text-anchor="middle">10</text><text class="fig-small" x="176" y="57" text-anchor="middle">10</text><text class="fig-small" x="208" y="57" text-anchor="middle">10</text><text class="fig-small" x="240" y="57" text-anchor="middle">10</text><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="270" y="36" width="14" height="20"/><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="288" y="36" width="14" height="20"/><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="306" y="36" width="14" height="20"/><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="324" y="36" width="14" height="20"/><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="342" y="36" width="14" height="20"/><rect class="fig-grid" style="fill:none;stroke:var(--ink)" x="360" y="36" width="14" height="20"/></svg>
    prompt: |-
      Aisha has **246** hockey cards: **2 boxes of 100**, **4 packs of 10** and **6 single cards**. Three friends want to share them equally, and they share each box and pack on its own.
    parts:
      - type: number
        prompt: The friends share one **pack of 10**. How many cards are left over from the pack?
        unit: cards
        answer: 1
        verify: 10 - 3 * 3
        hints:
          - How many can each friend get from 10 cards?
        solution:
          - 'Each friend gets 3 cards. That uses 9, so **1** card is left over.'
      - type: number
        prompt: A **box of 100** also leaves 1 card, because each friend gets 33. They share all the boxes and packs, then put the leftover cards with the 6 singles. How many cards are in that pile?
        unit: cards
        answer: 12
        verify: 2 + 4 + 6
        hints:
          - How many boxes and packs are there? How many cards does each one leave?
        solution:
          - '2 boxes leave 2 cards, 4 packs leave 4 cards, and there are 6 singles: \(2 + 4 + 6 =\) **12**.'
          - 'Look at that sum. It is the digit sum of 246! The pile can be shared by 3, so all 246 cards can be.'
      - type: mc
        prompt: Now **5** friends share the same cards. Each box and each pack is shared first. Which cards decide whether there will be any left over at the end?
        choices:
          - Only the single cards, because boxes and packs share evenly among 5.
          - All of the cards, because each box and each pack leaves 1 card behind.
          - Only the two boxes, because 100 is the biggest group of cards there.
          - Only the packs, because the packs are the middle group of the cards.
        answer: 0
        feedback:
          '1': 'That was true for 3 friends. Share a pack of 10 among 5 friends. What is left over?'
          '2': 'Size doesn’t matter here. Share a box of 100 among 5 friends. What is left over?'
          '3': 'Share a pack of 10 among 5 friends. What is left over?'
        hints:
          - Share a pack of 10 among 5 friends. Then share a box of 100.
        solution:
          - '10 and 100 both share evenly among 5, with nothing left. Only the single cards can cause a leftover.'
      - type: open
        prompt: Why does the test for **3** add up all the digits, but the test for **5** only looks at the ones digit? Use the cards to explain.
        hints:
          - What does a pack of 10 leave when 3 friends share it? What does it leave when 5 friends share it?
        modelAnswer: |-
          When 3 friends share, every box and pack leaves 1 card. So the leftovers are one card for each box, one for each pack and all the singles, which is the digit sum. That pile decides it. When 5 friends share, boxes and packs leave nothing, because 10 and 100 divide evenly by 5. Only the singles can be left over, and they are the ones digit.
        rubric:
          - I said that with 3 friends, each box and pack leaves 1 card, so every digit counts.
          - I connected the leftover pile to the digit sum.
          - I said that with 5 friends, boxes and packs leave nothing, so only the ones digit counts.
    wrapUp: The tests aren’t magic. Each box and pack leaves 1 card for 3 friends, so the digit sum is the leftover pile. For 5 friends they leave nothing, so only the ones digit matters.
    hints: []
    solution: []
