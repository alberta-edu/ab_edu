id: arithmetic-sequences
grade: 5
subject: math
organizingIdea: MAT-OI6
outcomes: [MAT5-OI6-GQ1-LO1]
order: 14
title: Arithmetic Sequences
shortTitle: Arithmetic sequences
summary: >-
  Connect each term of an arithmetic sequence to its position with a table, a graph and a rule like
  3n or n + 5, then find any term you need.

bigIdea: |-
  Every term in an arithmetic sequence has a **position**: 1st, 2nd, 3rd… A **rule** connects them, like
  "multiply the position by 3", written \(3n\). Show the sequence in a **table of values** or on a
  **coordinate grid**, where the points line up in a **straight line**.

lesson:
  - title: Watch the pattern grow
    blocks:
      - type: visual
        covers: [U1.1, S1.1, K1.1, K1.2]
        component: sequence-builder
        props: { rules: [{ op: x, k: 3 }, { op: x, k: 2 }, { op: x, k: 4 }, { op: '+', k: 3 }, { op: '+', k: 5 }] }
        caption: Choose a rule. The pattern, the table and the graph all show the same sequence. Slide to predict a term far along.
      - type: callout
        variant: remember
        covers: [MAT4-OI6-GQ1-LO1#K2.1, MAT4-OI6-GQ1-LO1#K2.2]
        title: Remember from Grade 4
        body: An arithmetic sequence grows by **adding** the same amount each time. Skip counting, like 3, 6, 9, 12, is an arithmetic sequence.

  - title: Position and term
    blocks:
      - type: table
        covers: [K1.1, S1.1, U1.1]
        caption: '3, 6, 9, 12, 15, … in a table of values'
        headers: ['Position (n)', '1', '2', '3', '4', '5']
        rows:
          - ['Term', '3', '6', '9', '12', '15']
      - type: compare
        covers: [S1.3, S1.4, K1.3]
        columns:
          - title: The rule in words
            body: '**Multiply the position by 3.** Position 4 → \(4 \times 3 = 12\).'
          - title: The rule as an expression
            body: '\[3n\] where \(n\) is the position. One operation: multiply.'

  - title: The graph is a straight line
    blocks:
      - type: figure
        covers: [K1.2, S1.2, S1.1]
        figure: { kind: coord-grid, size: 12, points: [{ x: 1, y: 3 }, { x: 2, y: 6 }, { x: 3, y: 9 }, { x: 4, y: 12 }] }
        caption: 'Plot each (position, term) pair: (1, 3), (2, 6), (3, 9), (4, 12). The points of an arithmetic sequence fit on a **straight line**.'

  - title: Find any term
    blocks:
      - type: example
        covers: [S1.5, S1.4]
        title: The 40th term
        problem: 'A sequence starts 6, 7, 8, 9, … What is the term at position 40?'
        steps:
          - 'Position 1 → 6, position 2 → 7. Each term is the position **plus 5**.'
          - 'The rule is \(n + 5\).'
          - 'Position 40: \(40 + 5 = 45\).'
        answer: The 40th term is **45**.
      - type: example
        covers: [S1.6]
        title: Juice boxes
        problem: Each pack has **6** juice boxes. How many juice boxes are in **9** packs?
        steps:
          - 'Packs (position) → boxes (term): 1 → 6, 2 → 12, 3 → 18. The rule is \(6n\).'
          - '\(6 \times 9 = 54\)'
        answer: '9 packs hold **54** juice boxes.'

keyTerms:
  - term: Arithmetic sequence
    covers: [U1.1]
    definition: A sequence that grows or shrinks by the same amount each time.
  - term: Position
    covers: [U1.1]
    definition: 'Where a term is in the sequence: 1st, 2nd, 3rd…, written as \(n\).'
  - term: Term
    covers: [K1.1]
    definition: Each number in a sequence.
  - term: Table of values
    covers: [K1.1]
    definition: A table listing each position with its term.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [U1.1, S1.5]
    type: mc
    prompt: 'In the sequence 4, 8, 12, 16, …, what is the term at **position 3**?'
    choices: ['12', '3', '16', '8']
    answer: 0
    feedback:
      '1': '3 is the position, not the term.'
      '2': '16 is at position 4.'
      '3': '8 is at position 2.'
    hints:
      - Count along the sequence to the 3rd number.
    solution:
      - '1st: 4, 2nd: 8, **3rd: 12**'

  - id: w2
    level: 1
    covers: [S1.3]
    type: mc
    prompt: |-
      Which rule matches this table?

      | Position | 1 | 2 | 3 |
      |---|---|---|---|
      | Term | 5 | 10 | 15 |
    choices: ['Multiply the position by 5', 'Add 5 to the position', 'Add 4 to the position', 'Multiply the position by 10']
    answer: 0
    feedback:
      '1': 'Check position 2: 2 + 5 = 7, not 10.'
      '2': 'Check position 2: 2 + 4 = 6, not 10.'
      '3': 'Check position 1: 1 × 10 = 10, not 5.'
    hints:
      - Test each rule on every position in the table.
    solution:
      - '1 × 5 = 5, 2 × 5 = 10, 3 × 5 = 15 ✓'

  - id: w3
    level: 1
    covers: [S1.5, S1.3]
    type: number
    prompt: 'The sequence 7, 8, 9, 10, … follows the rule \(n + 6\). What is the term at **position 10**?'
    answer: 16
    verify: 10 + 6
    hints:
      - Put 10 in place of \(n\).
    solution:
      - '\(10 + 6 = 16\)'

  - id: w4
    level: 1
    covers: [K1.2, S1.2]
    type: mc
    prompt: When you plot the (position, term) points of an arithmetic sequence on a coordinate grid, what do you see?
    choices: ['The points fit on a straight line.', 'The points make a circle.', 'The points are scattered randomly.', 'All the points are at the same height.']
    answer: 0
    feedback:
      '1': The points of an arithmetic sequence never curve around.
      '2': They follow a pattern, so they aren't random.
      '3': The terms change, so the heights change too.
    hints:
      - Look at the graph in the lesson.
    solution:
      - Each step along adds the same amount, so the points fit a **straight line**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [S1.4, K1.3]
    type: mc
    prompt: 'Which expression gives the term at position \(n\) for 3, 6, 9, 12, …?'
    choices: ['\(3n\)', '\(n + 3\)', '\(n + 2\)', '\(\frac{n}{3}\)']
    answer: 0
    feedback:
      '1': 'Check position 2: \(2 + 3 = 5\), not 6.'
      '2': 'Check position 2: \(2 + 2 = 4\), not 6.'
      '3': 'Check position 3: \(\frac{3}{3} = 1\), not 9.'
    hints:
      - Is each term 3 times its position, or 3 more than its position?
    solution:
      - '1 × 3 = 3, 2 × 3 = 6, 3 × 3 = 9: the expression is \(3n\).'

  - id: b2
    level: 2
    covers: [S1.5]
    type: number
    prompt: 'A sequence follows the rule \(7n\). What is the term at **position 12**?'
    answer: 84
    verify: 7 * 12
    hints:
      - '\(7n\) means 7 times the position.'
    solution:
      - '\(7 \times 12 = 84\)'

  - id: b3
    level: 2
    covers: [S1.5, K1.1]
    type: mc
    prompt: |-
      What is the missing term?

      | Position | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | Term | 10 | 11 | 12 | ? |
    choices: ['13', '14', '40', '4']
    answer: 0
    feedback:
      '1': 'The terms go up by 1 each time.'
      '2': 'The rule is "add 9", not "multiply by 10".'
      '3': '4 is the position. The question asks for the term.'
    hints:
      - Each term is the position plus 9.
    solution:
      - 'The rule is \(n + 9\), so position 4 → \(4 + 9 = 13\).'

  - id: b4
    level: 2
    covers: [S1.3, S1.6]
    type: mc
    prompt: 'In the sequence with rule \(5n\), which **position** has the term **45**?'
    choices: ['9', '45', '40', '225']
    answer: 0
    feedback:
      '1': '45 is the term. Which position gives it?'
      '2': '40 would be \(45 - 5\). The rule multiplies, so undo it by dividing.'
      '3': '\(45 \times 5 = 225\) goes the wrong way.'
    hints:
      - '5 × ? = 45'
    solution:
      - '\(5 \times 9 = 45\), so the term 45 is at position **9**.'

  - id: b5
    level: 2
    covers: [S1.6]
    type: number
    prompt: 'Each table at a party seats **4** people. How many people can sit at **15** tables?'
    answer: 60
    verify: 4 * 15
    hints:
      - 'Tables (position) → people (term): 1 → 4, 2 → 8, … The rule is \(4n\).'
    solution:
      - '\(4 \times 15 = 60\) people.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [S1.3, U1.1]
    type: mc
    prompt: 'Is **50** a term in the sequence with rule \(3n\)?'
    choices:
      - 'No. 50 is not a multiple of 3, so no natural-number position gives 50.'
      - 'Yes, at position 50.'
      - 'Yes. Every number is in every sequence.'
      - 'Yes, at position 17.'
    answer: 0
    feedback:
      '1': 'Position 50 gives \(3 \times 50 = 150\).'
      '2': 'The sequence 3, 6, 9, … skips most numbers.'
      '3': '\(3 \times 17 = 51\), not 50.'
    hints:
      - Is there a whole number \(n\) with \(3 \times n = 50\)?
    solution:
      - '\(3 \times 16 = 48\) and \(3 \times 17 = 51\). Nothing in between gives 50, so **50 is not a term**.'

  - id: d2
    level: 3
    covers: [S1.2, K1.2]
    type: mc
    prompt: 'You graph the sequences \(2n\) and \(5n\) on the same grid. Which line is **steeper**?'
    choices:
      - '\(5n\), because its terms go up by 5 for each position.'
      - '\(2n\), because 2 is smaller.'
      - They are equally steep.
      - Neither one makes a straight line.
    answer: 0
    feedback:
      '1': 'A smaller jump per position makes a **flatter** line.'
      '2': 'One goes up 2 each step and the other goes up 5. They can''t be equally steep.'
      '3': Both are arithmetic sequences, so both make straight lines.
    hints:
      - For each step right (position + 1), how far up does each line go?
    solution:
      - 'Each step right, \(2n\) goes up 2 but \(5n\) goes up 5. The \(5n\) line is **steeper**.'

  - id: d3
    level: 3
    covers: [S1.6, S1.4]
    type: number
    prompt: 'In the sequence with rule \(n + 12\), which **position** has the term **40**?'
    answer: 28
    verify: 40 - 12
    hints:
      - '? + 12 = 40'
    solution:
      - '\(40 - 12 = 28\). Check: \(28 + 12 = 40\) ✓'

  - id: d4
    level: 3
    covers: [S1.3, S1.4, S1.5]
    type: open
    prompt: 'The sequence 6, 12, 18, 24, … continues. Describe the rule in words, write it as an expression, and find the term at **position 30**.'
    modelAnswer: |-
      Each term is the position multiplied by 6 (1 → 6, 2 → 12, 3 → 18). As an expression, it is \(6n\). At position 30,
      the term is \(6 \times 30 = 180\).
    rubric:
      - I described the rule as "multiply the position by 6".
      - I wrote the expression \(6n\).
      - I found that the 30th term is 180.
