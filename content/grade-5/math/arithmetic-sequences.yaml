id: arithmetic-sequences
grade: 5
subject: math
organizingIdea: MAT-OI6
outcomes: [MAT5-OI6-GQ1-LO1]
order: 14
title: Arithmetic Sequences
shortTitle: Arithmetic sequences
summary: >-
  Connect each term of an arithmetic sequence to its position with a table, a graph and a rule like
  3n or n + 5, then find any term you need.

bigIdea: |-
  - Every term in an arithmetic sequence has a **position**: 1st, 2nd, 3rd…
  - A **rule** connects them, like "multiply the position by 3", written \(3n\).
  - Show the sequence in a **table of values** or on a **coordinate grid**, where the points line up in a **straight line**.

lesson:
  - title: Watch the pattern grow
    blocks:
      - type: visual
        covers: [U1.1, S1.1, K1.1, K1.2]
        component: sequence-builder
        props: { rules: [{ op: x, k: 3 }, { op: x, k: 2 }, { op: x, k: 4 }, { op: '+', k: 3 }, { op: '+', k: 5 }] }
        caption: Choose a rule. The pattern, the table and the graph all show the same sequence. Slide to predict a term far along.
      - type: callout
        variant: remember
        covers: [MAT4-OI6-GQ1-LO1#K2.1, MAT4-OI6-GQ1-LO1#K2.2]
        title: Remember from Grade 4
        body: An arithmetic sequence grows by **adding** the same amount each time. Skip counting, like 3, 6, 9, 12, is an arithmetic sequence.

  - title: Position and term
    blocks:
      - type: table
        covers: [K1.1, S1.1, U1.1]
        caption: '3, 6, 9, 12, 15, … in a table of values'
        headers: ['Position (n)', '1', '2', '3', '4', '5']
        rows:
          - ['Term', '3', '6', '9', '12', '15']
      - type: compare
        covers: [S1.3, S1.4, K1.3]
        columns:
          - title: The rule in words
            body: '**Multiply the position by 3.** Position 4 → \(4 \times 3 = 12\).'
          - title: The rule as an expression
            body: '\[3n\] where \(n\) is the position. One operation: multiply.'

  - title: The graph is a straight line
    blocks:
      - type: figure
        covers: [K1.2, S1.2, S1.1]
        figure: { kind: coord-grid, size: 12, points: [{ x: 1, y: 3 }, { x: 2, y: 6 }, { x: 3, y: 9 }, { x: 4, y: 12 }] }
        caption: 'Plot each (position, term) pair: (1, 3), (2, 6), (3, 9), (4, 12). The points of an arithmetic sequence fit on a **straight line**.'

  - title: Find any term
    blocks:
      - type: example
        covers: [S1.5, S1.4]
        title: The 40th term
        problem: 'A sequence starts 6, 7, 8, 9, … What is the term at position 40?'
        steps:
          - 'Position 1 → 6, position 2 → 7. Each term is the position **plus 5**.'
          - 'The rule is \(n + 5\).'
          - 'Position 40: \(40 + 5 = 45\).'
        answer: The 40th term is **45**.
      - type: example
        covers: [S1.6]
        title: Juice boxes
        problem: Each pack has **6** juice boxes. How many juice boxes are in **9** packs?
        steps:
          - 'Packs (position) → boxes (term): 1 → 6, 2 → 12, 3 → 18. The rule is \(6n\).'
          - '\(6 \times 9 = 54\)'
        answer: '9 packs hold **54** juice boxes.'

keyTerms:
  - term: Arithmetic sequence
    covers: [U1.1]
    definition: A sequence that grows or shrinks by the same amount each time.
  - term: Position
    covers: [U1.1]
    definition: 'Where a term is in the sequence: 1st, 2nd, 3rd…, written as \(n\).'
  - term: Term
    covers: [K1.1]
    definition: Each number in a sequence.
  - term: Table of values
    covers: [K1.1]
    definition: A table listing each position with its term.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [U1.1, S1.5]
    type: mc
    prompt: 'Hockey players line up in order. Their jersey numbers go 4, 8, 12, 16, … What number is on the player at **position 3**?'
    choices: ['12', '3', '16', '8']
    answer: 0
    feedback:
      '1': '3 tells you **where** the player stands. The question asks what number is on the jersey.'
      '2': '16 is the 4th number in the line. Count again from the start.'
      '3': '8 is the 2nd number in the line. Count one more.'
    hints:
      - Which player is first in line? Point to each one and count.
    solution:
      - '1st player: 4. 2nd player: 8. **3rd player: 12**.'
      - 'The position is **where** a term is. The term is **what** is there.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.4, K1.3, K1.1]
    type: mc
    prompt: |-
      Which expression gives the number of legs on \(n\) spiders?

      | Spiders (\(n\)) | 1 | 2 | 3 |
      |---|---|---|---|
      | Legs | 8 | 16 | 24 |
    choices: ['\(8n\)', '\(n + 8\)', '\(n + 7\)', '\(\frac{n}{8}\)']
    answer: 0
    feedback:
      '1': 'Try it on 1 spider: \(1 + 8 = 9\) legs. That is one leg too many.'
      '2': 'This works for 1 spider, but try 2 spiders: \(2 + 7 = 9\), not 16.'
      '3': 'Try it on 8 spiders: \(\frac{8}{8} = 1\). Eight spiders have far more than 1 leg.'
    hints:
      - Test each expression on every column of the table.
      - A rule has to work for 1 spider, 2 spiders and 3 spiders.
    solution:
      - 'Each spider brings 8 legs, so multiply by 8.'
      - '\(8 \times 1 = 8\), \(8 \times 2 = 16\), \(8 \times 3 = 24\). The expression is \(8n\).'

  - id: w4
    level: 1
    thinking: apply
    covers: [S1.1, U1.1]
    type: mc
    prompt: 'You graph the sequence with the rule \(n + 2\). Each point is (position, term). Which point shows **position 3**?'
    choices: ['(3, 5)', '(5, 3)', '(3, 2)', '(3, 6)']
    answer: 0
    feedback:
      '1': 'These are the right numbers in the wrong order. The position comes first, so it tells you how far across.'
      '2': 'The 2 comes from the rule, but it isn''t the term. Work out \(3 + 2\).'
      '3': 'The rule says to **add** 2. You multiplied by 2.'
    hints:
      - First find the term at position 3. Then ask which number comes first in the pair.
      - 'The term is \(3 + 2\). The position goes first, and the term goes second.'
    solution:
      - 'At position 3 the term is \(3 + 2 = 5\).'
      - 'Position first, then term: **(3, 5)**.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.2, S1.2, S1.1]
    type: text
    figure: { kind: coord-grid, size: 10, points: [{ x: 1, y: 2 }, { x: 2, y: 4 }, { x: 3, y: 7 }, { x: 4, y: 8 }, { x: 5, y: 10 }] }
    prompt: 'Nia graphed pairs of mittens. Each point is (pairs, mittens). One point is wrong, and you can spot it without any math, just by looking. Where should that point be? Type it like **(2, 9)**.'
    accept: ['(3, 6)', '(3,6)', '3, 6', '3,6']
    hints:
      - Hold a ruler against the points. What should the points of an arithmetic sequence do?
      - The point at position 3 sticks out of the line. How many mittens are in 3 pairs?
    solution:
      - 'The points of an arithmetic sequence fit on a **straight line**. Four of these do. The point (3, 7) sits above that line.'
      - 'It would also mean that 3 pairs have 7 mittens. Somebody has one very lonely mitten!'
      - 'The rule is \(2n\), so 3 pairs have \(2 \times 3 = 6\) mittens. The point should be at **(3, 6)**.'

  - id: b2
    level: 2
    thinking: flaw
    covers: [S1.3, S1.5, K1.1]
    type: number
    prompt: |-
      A chipmunk hides the same number of acorns every day. Bodhi only checks on even days.

      | Day | 2 | 4 | 6 |
      |---|---|---|---|
      | Acorns hidden so far | 6 | 12 | 18 |

      Bodhi says, "It goes up by 6 each time, so the rule is \(6n\)." How many acorns will be hidden by **day 7**?
    answer: 21
    verify: 3 * 7
    unit: acorns
    hints:
      - Try Bodhi's rule on day 2. Does \(6n\) give 6?
      - Look at the top row of the table. Does the day go up by 1 each time, as a position usually does?
      - 'Compare each day with the acorns below it: 2 → 6, 4 → 12. What do you multiply the day by?'
    solution:
      - 'Test the rule first: \(6 \times 2 = 12\), but the table says 6 on day 2. So \(6n\) is wrong.'
      - 'Here is the flaw: Bodhi skipped the odd days. The acorns go up by 6, but that takes **2 days**.'
      - 'Compare each day with its acorns: 2 → 6, 4 → 12, 6 → 18. Each term is the day times 3, so the rule is \(3n\).'
      - 'Day 7: \(3 \times 7 = 21\) acorns.'

  - id: b3
    level: 2
    thinking: model
    covers: [S1.3, S1.5, S1.6]
    type: number
    prompt: 'Emil is 2. His sister Jun is 6. Emil says, "Jun is 3 times my age. So the rule is \(3n\), and when I''m 10, she''ll be 30!" How old will Jun really be when Emil is **10**?'
    answer: 14
    verify: 10 + 4
    unit: years old
    hints:
      - 'Picture next year. How old is Emil then? How old is Jun? Does \(3n\) still work?'
      - When Emil has a birthday, how many years older does Jun get?
      - What stays the same every year, no matter how old they are?
    solution:
      - 'Emil''s rule does fit today: \(3 \times 2 = 6\). But one point isn''t enough to prove a rule. Try next year.'
      - 'Next year Emil is 3 and Jun is 7. Emil''s rule would say 9, so it fails.'
      - 'They each get 1 year older every year, so Jun is **always 4 years older**. The rule is \(n + 4\).'
      - 'When Emil is 10, Jun is \(10 + 4 = 14\).'
      - 'What we learned: \(3n\) and \(n + 4\) both give 6 at position 2. The story tells you which rule is true.'

  - id: b4
    level: 2
    thinking: pattern
    covers: [S1.3, S1.5, K1.3]
    type: number
    figure: |-
      <svg viewBox="0 0 300 160" class="fig-svg" role="img" aria-label="A caterpillar drawn in three rows: 4 segments in week 1, 5 in week 2 and 6 in week 3. The last segment of each is its head."><text class="cg-num" x="4" y="35">Week 1</text><circle class="cg-poly" cx="90" cy="30" r="16"/><circle class="cg-poly" cx="124" cy="30" r="16"/><circle class="cg-poly" cx="158" cy="30" r="16"/><circle class="cg-pt" cx="192" cy="30" r="16"/><text class="cg-num" x="4" y="85">Week 2</text><circle class="cg-poly" cx="90" cy="80" r="16"/><circle class="cg-poly" cx="124" cy="80" r="16"/><circle class="cg-poly" cx="158" cy="80" r="16"/><circle class="cg-poly" cx="192" cy="80" r="16"/><circle class="cg-pt" cx="226" cy="80" r="16"/><text class="cg-num" x="4" y="135">Week 3</text><circle class="cg-poly" cx="90" cy="130" r="16"/><circle class="cg-poly" cx="124" cy="130" r="16"/><circle class="cg-poly" cx="158" cy="130" r="16"/><circle class="cg-poly" cx="192" cy="130" r="16"/><circle class="cg-poly" cx="226" cy="130" r="16"/><circle class="cg-pt" cx="260" cy="130" r="16"/></svg>
    prompt: A cartoon caterpillar grows one new segment every week. The drawing shows weeks 1, 2 and 3. How many segments will it have in **week 40**?
    answer: 43
    verify: 40 + 3
    unit: segments
    hints:
      - In the drawing, which part of the caterpillar stays the same from week to week? Which part grows?
      - Compare each week's segments to the week number. Week 1 has 4. Week 2 has 5. Is it times or plus?
      - 'Try \(4n\) on week 2 before you trust it. Does it give 5?'
    solution:
      - 'Week 1 has 4 segments, so \(4n\) looks tempting. But week 2 would then have 8, and the drawing shows 5.'
      - 'Compare with the week number: 1 → 4, 2 → 5, 3 → 6. There are always **3 more segments than the week number**.'
      - 'The rule is \(n + 3\). Week 40: \(40 + 3 = 43\) segments.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.4, S1.6, K1.2, S1.1, S1.2]
    type: investigation
    prompt: |-
      Two trolls start a beard contest. On contest day, **Hob's** beard is already **6 cm** long, and **Brak** has just shaved his off. Each week, Hob's beard grows **1 cm** and Brak's grows **3 cm**.

      Let \(n\) be the number of weeks since contest day.
    parts:
      - type: mc
        prompt: Which rules give the length of each beard after \(n\) weeks?
        choices:
          - 'Hob: \(n + 6\). Brak: \(3n\).'
          - 'Hob: \(6n\). Brak: \(3n\).'
          - 'Hob: \(n + 6\). Brak: \(n + 3\).'
          - 'Hob: \(6n\). Brak: \(n + 3\).'
        answer: 0
        feedback:
          '1': 'Test Hob after 1 week and after 2 weeks. Would his beard really jump 6 cm in a week?'
          '2': 'Test Brak after 1 week and after 2 weeks. He gains 3 cm each week, so what is he at after 2 weeks?'
          '3': 'Test both rules after 2 weeks. Hob should be at 8 cm and Brak at 6 cm.'
        hints:
          - Work out each beard after 1 week and after 2 weeks. Then test the rules.
        solution:
          - 'Hob: 6 cm, then 7, 8, 9… He is always 6 more than the number of weeks, so \(n + 6\).'
          - 'Brak: 3, 6, 9… Three cm for every week, so \(3n\).'
      - type: number
        prompt: After how many weeks are the two beards exactly the same length?
        answer: 3
        verify: 6 / (3 - 1)
        unit: weeks
        hints:
          - Make a little table with weeks 1, 2, 3 and so on.
          - How much of Hob's lead does Brak catch up each week?
        solution:
          - 'Week 1: Hob 7, Brak 3. Week 2: Hob 8, Brak 6. Week 3: Hob 9, Brak 9.'
          - 'Another way: Brak gains 2 cm on Hob each week. A 6 cm lead takes **3 weeks** to catch.'
      - type: mc
        figure: >-
          <svg viewBox="0 0 345 340" class="fig-svg" role="img" aria-label="A graph of beard length in centimetres against weeks, from week 0 to week 6. Hob's line, with round dots, starts at 6 and goes up 1 each week to 12. Brak's dashed line, with square dots, starts at 0 and goes up 3 each week to 18. The lines cross at week 3, at 9 centimetres. After that, Brak's line is higher.">
          <line class="cg-line" x1="50" y1="50" x2="50" y2="290"/><line class="cg-line" x1="90" y1="50" x2="90" y2="290"/><line class="cg-line" x1="130" y1="50" x2="130" y2="290"/><line class="cg-line" x1="170" y1="50" x2="170" y2="290"/><line class="cg-line" x1="210" y1="50" x2="210" y2="290"/><line class="cg-line" x1="250" y1="50" x2="250" y2="290"/><line class="cg-line" x1="290" y1="50" x2="290" y2="290"/><line class="cg-line" x1="50" y1="290.0" x2="290" y2="290.0"/><line class="cg-line" x1="50" y1="263.3" x2="290" y2="263.3"/><line class="cg-line" x1="50" y1="236.7" x2="290" y2="236.7"/><line class="cg-line" x1="50" y1="210.0" x2="290" y2="210.0"/><line class="cg-line" x1="50" y1="183.3" x2="290" y2="183.3"/><line class="cg-line" x1="50" y1="156.7" x2="290" y2="156.7"/><line class="cg-line" x1="50" y1="130.0" x2="290" y2="130.0"/><line class="cg-line" x1="50" y1="103.3" x2="290" y2="103.3"/><line class="cg-line" x1="50" y1="76.7" x2="290" y2="76.7"/><line class="cg-line" x1="50" y1="50.0" x2="290" y2="50.0"/>
          <text class="cg-num" x="50" y="310" text-anchor="middle">0</text><text class="cg-num" x="90" y="310" text-anchor="middle">1</text><text class="cg-num" x="130" y="310" text-anchor="middle">2</text><text class="cg-num" x="170" y="310" text-anchor="middle">3</text><text class="cg-num" x="210" y="310" text-anchor="middle">4</text><text class="cg-num" x="250" y="310" text-anchor="middle">5</text><text class="cg-num" x="290" y="310" text-anchor="middle">6</text><text class="cg-num" x="40" y="295.0" text-anchor="end">0</text><text class="cg-num" x="40" y="268.3" text-anchor="end">2</text><text class="cg-num" x="40" y="241.7" text-anchor="end">4</text><text class="cg-num" x="40" y="215.0" text-anchor="end">6</text><text class="cg-num" x="40" y="188.3" text-anchor="end">8</text><text class="cg-num" x="40" y="161.7" text-anchor="end">10</text><text class="cg-num" x="40" y="135.0" text-anchor="end">12</text><text class="cg-num" x="40" y="108.3" text-anchor="end">14</text><text class="cg-num" x="40" y="81.7" text-anchor="end">16</text><text class="cg-num" x="40" y="55.0" text-anchor="end">18</text>
          <line class="cg-axis" x1="50" y1="290" x2="298" y2="290"/><line class="cg-axis" x1="50" y1="290" x2="50" y2="42"/>
          <text class="fig-small" x="170" y="332" text-anchor="middle">Weeks since contest day</text>
          <text class="fig-small" x="8" y="26">Beard length (cm)</text>
          <polyline points="50,210.0 90,196.7 130,183.3 170,170.0 210,156.7 250,143.3 290,130.0" style="fill:none;stroke:var(--accent);stroke-width:3"/>
          <polyline points="50,290.0 90,250.0 130,210.0 170,170.0 210,130.0 250,90.0 290,50.0" style="fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:8 5"/>
          <circle class="cg-pt" cx="50" cy="210.0" r="6"/><circle class="cg-pt" cx="90" cy="196.7" r="6"/><circle class="cg-pt" cx="130" cy="183.3" r="6"/><circle class="cg-pt" cx="170" cy="170.0" r="6"/><circle class="cg-pt" cx="210" cy="156.7" r="6"/><circle class="cg-pt" cx="250" cy="143.3" r="6"/><circle class="cg-pt" cx="290" cy="130.0" r="6"/>
          <rect x="45" y="285.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="85" y="245.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="125" y="205.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="165" y="165.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="205" y="125.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="245" y="85.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><rect x="285" y="45.0" width="10" height="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/>
          <text class="cg-pt-label" x="299" y="135.0">Hob</text>
          <text class="fig-label" x="299" y="56.0">Brak</text>
          </svg>
        prompt: 'Here is the graph, with each point at (weeks, beard length). What does it tell you about the time **after week 3**?'
        choices:
          - Brak stays ahead for good, because his line is steeper and stays straight.
          - Hob gets ahead again, because his beard had a longer start than Brak's.
          - They stay equal from now on, because their lines have met at one point.
          - Brak gets ahead, then Hob catches up, because the lines will bend back.
        answer: 0
        feedback:
          '1': 'A head start only matters until it has been used up. Look at the points after week 3.'
          '2': 'Look at week 4. Hob is at 10 cm and Brak is at 12 cm.'
          '3': 'The points of an arithmetic sequence fit on a straight line, so neither line can bend back.'
        hints:
          - Look at the points after the place where they meet. Which is higher?
          - Each week, how much higher does each line go?
        solution:
          - 'The two lines cross at (3, 9), where both beards are 9 cm.'
          - 'After that, Brak''s points are higher. His line goes up 3 each step and Hob''s goes up 1.'
          - 'Both are straight, so they can never bend to meet again. Brak stays ahead.'
    wrapUp: 'A rule tells you the whole story of a sequence. The steepness of its line shows how much is added at each step. Two lines can only meet if one is steeper than the other.'

  - id: d2
    level: 3
    thinking: design
    covers: [S1.3, S1.6, U1.1]
    type: build
    prompt: |-
      A frog starts on the bank, at pad 0, and always jumps the same number of lily pads. Flies are resting on pads **24** and **40**. A skunk is asleep on pad **30**.

      Choose a jump size so the frog lands on both fly pads, and **never** lands on the skunk's pad.
    fields:
      - { name: k, label: 'Lily pads per jump' }
    rules:
      - { test: 'k > 0', fail: 'A frog that doesn''t jump catches no flies.' }
      - { test: 'k % 1 == 0', fail: 'The frog lands only on whole-numbered pads, so use a whole number of pads per jump.' }
      - { test: '24 % k == 0', fail: 'List the pads that this frog lands on. It jumps right over the flies on pad 24.' }
      - { test: '40 % k == 0', fail: 'List the pads that this frog lands on. It jumps right over the flies on pad 40.' }
      - { test: '30 % k != 0', fail: 'Both flies get eaten, but this frog lands on the skunk at pad 30. Try again, and pick a different jump.' }
    examples:
      - { k: 8 }
      - { k: 4 }
    counterexamples:
      - { k: 2 }
      - { k: 1 }
      - { k: 6 }
      - { k: 5 }
    hints:
      - If the frog jumps 3 pads each time, write down the pads it lands on. Is that a sequence you know?
      - 'A frog that jumps 3 pads follows the rule \(3n\): after jump \(n\) it is on pad \(3 \times n\). For your frog, 24 and 40 must both be terms.'
      - 'Which numbers go into both 24 and 40 with no remainder? Now check each one against 30.'
    solution:
      - 'A frog that jumps 3 pads lands on 3, 6, 9, … That is the rule \(3n\). Any jump size works the same way, and each landing pad is a term.'
      - 'A pad is a term only if the jump size goes into it with no remainder. So the jump size must go into 24 and 40, but **not** into 30.'
      - 'The numbers that go into both 24 and 40 are 1, 2, 4 and 8. Numbers 1 and 2 also go into 30, so those frogs wake the skunk.'
      - '**4 works** (rule \(4n\)): pad 24 at jump 6, pad 40 at jump 10, and it goes from 28 to 32 over the skunk.'
      - '**8 works** (rule \(8n\)): pad 24 at jump 3, pad 40 at jump 5, and it goes from 24 to 32 over the skunk.'
