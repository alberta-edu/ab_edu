id: coordinate-grids
grade: 5
subject: math
organizingIdea: MAT-OI4
outcomes: [MAT5-OI4-GQ1-LO1]
order: 12
title: Points and Polygons on a Coordinate Grid
shortTitle: Coordinate grids
summary: >-
  Locate and describe points on a coordinate grid with ordered pairs, give directions between points,
  and plot polygons from the coordinates of their vertices.

bigIdea: |-
  - A **coordinate grid** gives every crossing point an exact address: an **ordered pair** like (3, 5).
  - The **first** number is how far **across** from the vertical axis.
  - The **second** is how far **up** from the horizontal axis.
  - Coordinates describe locations **precisely**.

lesson:
  - title: Every point has an address
    blocks:
      - type: visual
        covers: [K1.1, K1.2, U1.2, S1.1, S1.2]
        component: coordinate-grid
        props: { size: 10 }
        caption: |-
          - **Explore**: tap a crossing point to read its coordinates.
          - **Find the point**: tap the point you're given.
          - **Draw a polygon**: plot each vertex in order.

  - title: Across first, then up
    blocks:
      - type: figure
        covers: [K1.2]
        figure: { kind: coord-grid, size: 8, points: [{ x: 3, y: 5, label: 'A (3, 5)' }, { x: 5, y: 3, label: 'B (5, 3)' }] }
        caption: '(3, 5) and (5, 3) use the same numbers but are **different points**. Order matters: an **ordered pair** is always across first, then up.'
      - type: callout
        variant: tip
        covers: [K1.2]
        title: Remember the order
        body: Walk along the hall (**across**), then climb the stairs (**up**).

  - title: Directions between points
    blocks:
      - type: example
        covers: [S1.3, K1.3]
        title: From A to B
        problem: Describe how to move from **A(2, 3)** to **B(6, 1)**.
        steps:
          - 'Across: from 2 to 6 is **4 right**.'
          - 'Up and down: from 3 to 1 is **2 down**.'
        answer: From A, go **4 right and 2 down** to reach B.

  - title: Polygons on the grid
    blocks:
      - type: figure
        covers: [S1.4, S1.5, U1.1]
        figure: { kind: coord-grid, size: 8, points: [{ x: 1, y: 1, label: P }, { x: 6, y: 1, label: Q }, { x: 4, y: 5, label: R }], polygon: [[1, 1], [6, 1], [4, 5]] }
        caption: 'Triangle PQR has vertices **P(1, 1)**, **Q(6, 1)** and **R(4, 5)**. The coordinates of the vertices describe exactly where the shape is.'

keyTerms:
  - term: Coordinate grid
    covers: [K1.1]
    definition: A grid of horizontal and vertical lines where every crossing point has coordinates.
  - term: Coordinates
    covers: [K1.2]
    definition: 'An ordered pair of numbers, like (3, 5), that gives the location of a point.'
  - term: Ordered pair
    covers: [K1.2]
    definition: 'Two numbers in a set order: across from the vertical axis first, then up from the horizontal axis.'
  - term: Vertex
    covers: [S1.5]
    definition: A corner point of a polygon. The plural is vertices.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S1.2, K1.2]
    type: text
    figure: { kind: coord-grid, size: 6, points: [{ x: 4, y: 2, label: Fly }] }
    prompt: A fly has landed on this grid of ceiling tiles. What are its coordinates? Type them like this, **(1, 6)**.
    accept: ['(4, 2)', '(4,2)', '4, 2', '4,2']
    hints:
      - Which way do you count first, across or up?
      - Start at 0. Count across along the bottom until you are under the fly. Then count up.
    solution:
      - 'The fly is **4** across from the vertical axis and **2** up from the horizontal axis.'
      - 'Across comes first, so it is at **(4, 2)**.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.2, K1.3, S1.3]
    type: mc
    prompt: 'A spider sits at **(5, 2)**. It climbs **3 units straight up**. Where is it now?'
    choices: ['(5, 5)', '(8, 2)', '(8, 5)', '(5, 3)']
    answer: 0
    feedback:
      '1': 'The first number tells how far **across**. Going straight up doesn''t move the spider across.'
      '2': 'Did the spider move sideways at all? Only one of the numbers should change.'
      '3': 'The 3 is how far it climbed, not where it stopped. It started 2 up, then climbed 3 more.'
    hints:
      - Which number tells how far up a point is?
      - Straight up means no moving left or right. So one number stays the same.
    solution:
      - 'Going up changes only the **second** number: 2 + 3 = 5.'
      - 'The first number stays 5, so the spider is at **(5, 5)**.'

  - id: w4
    level: 1
    thinking: apply
    covers: [S1.3, K1.3]
    type: mc
    prompt: 'The swings are at **(2, 6)** and the slide is at **(5, 2)**. How do you get from the swings to the slide?'
    choices: ['3 right and 4 down', '3 left and 4 up', '5 right and 2 down', '4 right and 3 down']
    answer: 0
    feedback:
      '1': 'That would take you from the slide back to the swings. Is the first number getting bigger or smaller?'
      '2': 'Those are the slide''s own coordinates. You aren''t starting at 0: how far is it from 2 to 5?'
      '3': 'The first numbers tell you about right and left. How far is it from 2 to 5?'
    hints:
      - Look at the first numbers, 2 and 5. Then look at the second numbers, 6 and 2.
      - Is 5 to the right or the left of 2? Is 2 higher or lower than 6?
    solution:
      - 'Across: from 2 to 5 is **3 right**.'
      - 'Up and down: from 6 to 2 is **4 down**.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [S1.2, K1.2]
    type: mc
    figure: { kind: coord-grid, size: 6, points: [{ x: 3, y: 1, label: A }, { x: 5, y: 4, label: B }] }
    prompt: 'Jia looks at this grid and writes **A(4, 2)** and **B(6, 5)**. Both answers are wrong, and wrong in the same way. What is Jia doing?'
    choices:
      - 'Counting the corner at 0 as "1", then carrying on counting from there'
      - 'Swapping the order, so she counts up first and then across'
      - 'Counting the squares she passes instead of the numbered lines'
      - 'Counting down from the top of the grid instead of up from the bottom'
    answer: 0
    feedback:
      '1': 'If she swapped the order, A would be (1, 3). Compare that with what she wrote.'
      '2': 'Try it: there are 3 squares from the vertical axis to A, and 1 square up. That gives the right answer, (3, 1).'
      '3': 'Counting down from the top, A would be 5 down. She wrote a 2.'
    hints:
      - First work out the correct coordinates of A and B yourself.
      - Put each of Jia's answers beside the correct one. What is the same about the difference?
      - Both of her numbers are 1 too big, every time. What could make a careful counter do that?
    solution:
      - 'The correct points are A(3, 1) and B(5, 4). Jia wrote A(4, 2) and B(6, 5).'
      - 'Every one of her numbers is exactly **1 too big**.'
      - 'That happens if you say "1" at the corner, where the axes meet. That corner is **0**, so the first step away from it is 1.'
      - 'What we learned: a wrong answer that is wrong the same way each time is a clue to how someone was thinking.'

  - id: b2
    level: 2
    thinking: backwards
    covers: [S1.3, S1.1, K1.3]
    type: text
    prompt: |-
      A robot vacuum gave a bored cat a ride around a kitchen floor grid. Its log says:

      1. **2 right, 3 up**
      2. **4 right, 1 down**
      3. **1 left, 2 up**

      It stopped at **(8, 6)**, with the cat still on top. Where did the ride start? Type it like **(1, 6)**.
    accept: ['(3, 2)', '(3,2)', '3, 2', '3,2']
    hints:
      - You know the end, not the start. Which move in the log should you undo first?
      - To undo "1 left, 2 up", you go 1 right and 2 down. Keep undoing, from the last move to the first.
      - After undoing the last move you are at (9, 4). Now undo "4 right, 1 down".
    solution:
      - 'Start from the end and undo each move, last move first. Every direction flips.'
      - 'Undo "1 left, 2 up": go 1 right and 2 down, from (8, 6) to (9, 4).'
      - 'Undo "4 right, 1 down": go 4 left and 1 up, to (5, 5).'
      - 'Undo "2 right, 3 up": go 2 left and 3 down, to **(3, 2)**.'
      - 'Check by riding forward: (3, 2), (5, 5), (9, 4), (8, 6). It works!'

  - id: b3
    level: 2
    thinking: ways
    covers: [S1.4, S1.5, U1.1]
    type: build
    figure: { kind: coord-grid, size: 8, points: [{ x: 4, y: 2, label: 'Flag (4, 2)' }, { x: 4, y: 5, label: 'Flag (4, 5)' }] }
    prompt: 'A Chinook blew away 2 of the 4 corner flags of a **square** play field. The flags at **(4, 2)** and **(4, 5)** are still there, along one side of the square. Where could the two missing flags go?'
    fields:
      - { name: a, label: 'Flag beside (4, 2): across' }
      - { name: b, label: 'Flag beside (4, 2): up' }
      - { name: c, label: 'Flag beside (4, 5): across' }
      - { name: d, label: 'Flag beside (4, 5): up' }
    rules:
      - { test: 'b == 2', fail: 'A side of this square runs straight across from the flag at (4, 2). Which number stays the same when you go straight across?' }
      - { test: 'd == 5', fail: 'A side of this square runs straight across from the flag at (4, 5). Which number stays the same when you go straight across?' }
      - { test: 'a == c', fail: 'The two new flags make the far side of the square, so one must be straight above the other.' }
      - { test: '(a - 1) * (a - 7) == 0', fail: 'All four sides of a square are the same length. How long is the side from (4, 2) to (4, 5)? Your new flags must be that far across.' }
    examples:
      - { a: 7, b: 2, c: 7, d: 5 }
      - { a: 1, b: 2, c: 1, d: 5 }
    counterexamples:
      - { a: 6, b: 2, c: 6, d: 5 }
      - { a: 7, b: 5, c: 7, d: 2 }
      - { a: 7, b: 2, c: 1, d: 5 }
    hints:
      - How long is the side you can already see?
      - The side from (4, 2) to (4, 5) is 3 units long. So the other sides are 3 units long too.
      - From a flag, you could go 3 units right. Could you also go another way?
    solution:
      - 'The side from (4, 2) to (4, 5) goes from 2 to 5, so it is **3 units** long. Every side of the square must be 3 units.'
      - 'Going **3 right**, the new flags are at **(7, 2)** and **(7, 5)**.'
      - 'Going **3 left**, the new flags are at **(1, 2)** and **(1, 5)**.'
      - 'Both work, because one side doesn''t tell you which way the square goes. Two corners weren''t enough to fix its location, but four corners are.'

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.4, S1.5, U1.1]
    type: mc
    figure: { kind: coord-grid, size: 7, points: [{ x: 1, y: 1, label: A }, { x: 6, y: 4, label: B }, { x: 6, y: 1, label: C }, { x: 1, y: 4, label: D }], polygon: [[1, 1], [6, 4], [6, 1], [1, 4]] }
    prompt: 'Hamid wanted to draw a rectangle hat for his snowman. He joined his four points in the order A, B, C, D and back to A. He got a bow tie. The snowman looks very fancy, but what order would have made the hat?'
    choices: ['A, C, B, D', 'A, B, D, C', 'A, D, C, B', 'None. A point must move.']
    answer: 0
    feedback:
      '1': 'Try it with your finger. A to B cuts right across the middle, so this still crosses over.'
      '2': 'Try it with your finger. D to C cuts right across the middle, so this still crosses over.'
      '3': 'A(1, 1), C(6, 1), B(6, 4) and D(1, 4) are already the corners of a rectangle. Only the joining order is wrong.'
    hints:
      - Read the coordinates of the four points. Which points are side by side, with the same up number?
      - A rectangle's sides run along the grid lines. So each line you draw should change only one number.
      - 'Start at A(1, 1). Which point can you reach by going only right?'
    solution:
      - 'The points are A(1, 1), B(6, 4), C(6, 1) and D(1, 4).'
      - 'A rectangle here has sides along the grid lines, so each joining line should change only one number.'
      - 'A to C goes across. C to B goes up. B to D goes across. D to A goes down. So the order is **A, C, B, D**.'
      - 'What we learned: the same vertices can give a different drawing. A list of vertices also needs the order for joining them.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d2
    level: 3
    thinking: breakdown
    covers: [S1.3, K1.3, U1.2]
    type: investigation
    prompt: |-
      Long ago, your school buried a time capsule at a crossing on this playground grid, which runs from 0 to 8. Nobody remembers where. Luckily, you have a rude talking metal detector.

      Stand on any crossing and it tells you which way to go, then adds "obviously". It only says left or right if you need to go that way. It only says up or down if you need to go that way.
    parts:
      - type: multi
        figure: { kind: coord-grid, size: 8, points: [{ x: 4, y: 4, label: You }] }
        prompt: 'You stand at **(4, 4)**. It says, "Right and down, obviously." Which of these could be where the capsule is? Choose all that fit.'
        choices: ['(6, 2)', '(5, 1)', '(2, 6)', '(6, 6)', '(4, 2)', '(7, 4)']
        answer: [0, 1]
        hints:
          - 'Right means the first number is bigger than 4. What does down mean?'
          - 'Both words must be true. If it were at (4, 2), would the detector have said "right"?'
        solution:
          - 'Right means the first number is **more than 4**. Down means the second number is **less than 4**.'
          - '(6, 2) and (5, 1) fit both words.'
          - '(4, 2) needs only "down", and (7, 4) needs only "right". (2, 6) and (6, 6) are too high.'
      - type: number
        figure: { kind: coord-grid, size: 8, points: [{ x: 4, y: 4, label: First }, { x: 7, y: 1, label: Now }] }
        prompt: 'You walk to **(7, 1)**. It says, "Left and up, obviously." Use **both** answers. How many crossings could still hide the capsule?'
        answer: 4
        verify: 2 * 2
        hints:
          - 'Across: it is right of 4 and left of 7. Which first numbers does that leave?'
          - 'Up: it is below 4 and above 1. Which second numbers does that leave?'
        solution:
          - 'First number: more than 4 and less than 7, so **5 or 6**.'
          - 'Second number: less than 4 and more than 1, so **2 or 3**.'
          - 'The crossings left are (5, 2), (5, 3), (6, 2) and (6, 3). That is **4** out of 81 crossings on the whole grid.'
      - type: text
        figure: { kind: coord-grid, size: 8, points: [{ x: 5, y: 2 }, { x: 5, y: 3, label: Now }, { x: 6, y: 2 }, { x: 6, y: 3 }] }
        prompt: 'You stand at **(5, 3)**. It says only, "Right, obviously." Use **all** the clues so far. Where is the capsule? Type it like **(1, 6)**.'
        accept: ['(6, 3)', '(6,3)', '6, 3', '6,3']
        hints:
          - The detector didn't say up or down. What does that tell you about the second number?
        solution:
          - 'It didn''t say up or down, so the capsule is at the same height: its second number is **3**.'
          - 'Right of 5, among the crossings left, means the first number is 6. The capsule is at **(6, 3)**.'
    wrapUp: 'Left and right talk about the first number. Up and down talk about the second. Each clue cuts away part of the grid, so three short clues can find one exact crossing.'

  - id: d3
    level: 3
    thinking: model
    covers: [S1.3, K1.3, S1.1]
    type: investigation
    figure: { kind: coord-grid, size: 8, points: [{ x: 1, y: 2, label: Ravi }, { x: 7, y: 4, label: Lena }] }
    prompt: |-
      Ravi lives at **(1, 2)** and Lena lives at **(7, 4)**. They are building the world's biggest snowman, at a street corner between their homes. Streets run along the grid lines, and one block is one unit.

      Their deal: at a **fair corner**, both walk the same number of blocks, and nobody walks an extra block. Every block must take them closer to the other person's home.
    parts:
      - type: number
        prompt: 'By the streets, how many blocks is it from Ravi''s home to Lena''s home?'
        answer: 8
        verify: (7 - 1) + (4 - 2)
        hints:
          - You can't cut through the middle. How many blocks right? How many blocks up?
        solution:
          - 'From 1 to 7 is 6 blocks right. From 2 to 4 is 2 blocks up. That is \(6 + 2 = 8\) blocks.'
      - type: build
        prompt: Find a fair corner for the snowman.
        fields:
          - { name: a, label: 'Across' }
          - { name: u, label: 'Up' }
        rules:
          - { test: 'a >= 1 && a <= 7 && u >= 2 && u <= 4', fail: 'At that corner, somebody has to walk away from the other person''s home for a while. Stay between their homes.' }
          - { test: '(a - 1) + (u - 2) == 4', fail: 'Count Ravi''s blocks to your corner, then Lena''s. They should match.' }
        examples:
          - { a: 4, u: 3 }
          - { a: 5, u: 2 }
          - { a: 3, u: 4 }
        counterexamples:
          - { a: 4, u: 4 }
          - { a: 3, u: 5 }
          - { a: 7, u: 2 }
        hints:
          - The trip is 8 blocks. How many blocks should each person walk?
          - Each walks 4 blocks. Ravi can mix right and up in any way that adds up to 4.
        solution:
          - 'The trip is 8 blocks, so each walks **4**.'
          - '(4, 3) works: Ravi goes 3 right and 1 up, and Lena goes 3 left and 1 down.'
          - '(5, 2) works too: Ravi goes 4 right, and Lena goes 2 left and 2 down.'
    wrapUp: 'Reading two points tells you how to get between them: right or left from the first numbers, up or down from the second. Add those blocks up and you know the whole trip.'
