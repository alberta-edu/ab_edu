id: area-perimeter
grade: 5
subject: math
organizingIdea: MAT-OI5
outcomes: [MAT5-OI5-GQ1-LO1]
order: 13
title: Area and Perimeter of Rectangles
shortTitle: Area & perimeter
summary: >-
  Measure area in cm², m² and km², find the area of rectangles, and see why rectangles with the same
  area can have different perimeters.

bigIdea: |-
  Area is measured in **square units**: square centimetres (cm²), square metres (m²) and square kilometres
  (km²). Choose the unit that fits. Rectangles with the **same area** can have **different perimeters**, and
  the **square** has the **least** perimeter.

lesson:
  - title: Square units
    blocks:
      - type: compare
        covers: [K1.1, K1.2, K1.3, K1.4, S1.1, S1.2]
        columns:
          - title: 1 cm²
            body: The area of a square **1 cm by 1 cm**. About the size of the tip of your little finger.
          - title: 1 m²
            body: The area of a square **1 m by 1 m**. Four metre sticks could make one.
          - title: 1 km²
            body: The area of a square **1 km by 1 km**. Many city blocks would fit inside.
      - type: figure
        covers: [S1.3, S1.4]
        figure: { kind: square-metre }
        caption: '1 m is 100 cm, so 1 m² is \(100 \times 100 = 10\,000\) cm². In the same way, 1 km is 1 000 m, so 1 km² is \(1\,000 \times 1\,000 = 1\,000\,000\) m².'

  - title: Which unit fits?
    blocks:
      - type: table
        covers: [S1.5, U1.1, S1.6]
        headers: [What you measure, Best unit, Why]
        rows:
          - ['A postage stamp', 'cm²', 'Small, so measure it precisely in small units.']
          - ['A classroom floor', 'm²', 'cm² would give a huge number.']
          - ['A city like Edmonton', 'km²', 'It covers hundreds of square kilometres.']
      - type: callout
        variant: tip
        covers: [S1.6]
        title: Estimate with a benchmark
        body: Picture how many fingertip squares (cm²) or metre-stick squares (m²) would fit, then estimate.

  - title: Area of a rectangle
    blocks:
      - type: example
        covers: [S1.7]
        title: A garden bed
        problem: A rectangular garden bed is **7 m** long and **4 m** wide. What is its area?
        steps:
          - 'Area of a rectangle = length × width.'
          - '\(7 \times 4 = 28\)'
        answer: The area is **28 m²**.
      - type: callout
        variant: remember
        covers: [MAT4-OI5-GQ1-LO1#K1.4]
        title: Remember from Grade 4
        body: The area of a rectangle equals the product of its side lengths.

  - title: Same area, different perimeter
    blocks:
      - type: visual
        covers: [U1.2, K1.5, S1.8, S1.9]
        component: rectangle-builder
        props: { areas: [24, 36, 16, 12], unit: cm }
        caption: Pick a number of tiles, then try each rectangle. The area never changes, but the perimeter does. Which rectangle has the least?

  - title: Solving problems
    blocks:
      - type: example
        covers: [S1.10, S1.9]
        title: The least fence
        problem: A rectangular garden must have an area of **36 m²**. Which side lengths need the **least fence** around it?
        steps:
          - 'Rectangles with area 36 m²: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6.'
          - 'Perimeters: 74 m, 40 m, 30 m, 26 m and **24 m**.'
          - 'The square, 6 m × 6 m, has the least perimeter.'
        answer: A **6 m by 6 m** garden needs only **24 m** of fence.

keyTerms:
  - term: Area
    covers: [K1.1]
    definition: The amount of surface a shape covers, measured in square units.
  - term: Square centimetre (cm²)
    covers: [K1.2]
    definition: The area of a square 1 cm by 1 cm.
  - term: Square metre (m²)
    covers: [K1.3]
    definition: The area of a square 1 m by 1 m. It equals 10 000 cm².
  - term: Square kilometre (km²)
    covers: [K1.4]
    definition: The area of a square 1 km by 1 km. It equals 1 000 000 m².
  - term: Perimeter
    covers: [U1.2]
    definition: The distance around a shape.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.3, S1.2, S1.3]
    type: mc
    prompt: Which of these has an area of exactly **1 m²**?
    choices:
      - A square 100 cm by 100 cm
      - A square 10 cm by 10 cm
      - A square 1 m around its edge
      - A strip 100 cm by 1 cm
    answer: 0
    feedback:
      '1': '\(10 \times 10 = 100\), so this is only 100 cm². Your hand could cover it. How long is each side of a square metre?'
      '2': 'Around the edge is the perimeter, not the area. With only 1 m around it, each side is just 25 cm.'
      '3': '\(100 \times 1 = 100\), so this is only 100 cm². It is a single row of squares, and a square metre needs many rows.'
    hints:
      - Picture 1 m². What shape is it, and how long is each side?
      - Now write that side length in centimetres.
    solution:
      - 'Start from the meaning: 1 m² is the area of a square with sides of 1 m.'
      - '1 m is 100 cm, so that same square is **100 cm by 100 cm**.'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.7]
    type: number
    figure: { kind: rect, w: 8, h: 5, unit: m }
    prompt: Anika wants new carpet to cover this whole floor. How much carpet does she need?
    unit: m²
    answer: 40
    verify: 8 * 5
    hints:
      - Does the carpet go around the floor, or cover it?
      - Covering a surface means area. Area of a rectangle = length × width.
    solution:
      - 'Carpet covers the surface, so this is an **area** question.'
      - '\(8 \times 5 = 40\), so Anika needs **40 m²** of carpet.'

  - id: w3
    level: 1
    thinking: notice
    covers: [S1.10]
    type: number
    prompt: 'Mina glues ribbon all the way around the edge of a card. The card is **15 cm** long and **10 cm** wide. How much ribbon does Mina need?'
    unit: cm
    answer: 50
    verify: 2 * (15 + 10)
    hints:
      - Does the ribbon cover the card, or go around it?
      - Going around means adding all four sides.
    solution:
      - 'The ribbon goes around the edge, so this is the **perimeter**.'
      - '\(15 + 10 + 15 + 10 = 50\), so Mina needs **50 cm** of ribbon.'
      - 'Multiplying would give 150 cm². That is the area, which tells you how much paper the card uses, not how much ribbon goes around it.'

  - id: w4
    level: 1
    thinking: recall
    covers: [S1.5, U1.1, S1.4]
    type: mc
    prompt: A sign says a large park covers **5 km²**. Why would the sign use km² and not m²?
    choices:
      - In m², the number would be too long to picture.
      - Square metres can only measure indoor spaces.
      - A km² gives a more exact measure than a m².
      - Square metres only work on straight edges.
    answer: 0
    feedback:
      '1': 'A square metre works anywhere, indoors or out. A backyard garden is often measured in m². So this can’t be the reason.'
      '2': 'It is the other way around. Small units measure more exactly, since many m² fit inside each km². What does a big unit do to the number instead?'
      '3': 'Any surface can be measured in square units, even one with curvy edges. You count or estimate the squares.'
    hints:
      - How many m² fit in just 1 km²?
      - What would 5 km² look like written in m²?
    solution:
      - '1 km² is 1 000 000 m², so 5 km² is 5 000 000 m².'
      - 'Both are true, but "5 km²" is far easier to read and picture. Big areas get big units.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: estimate
    covers: [S1.6, S1.2]
    type: number
    figure: |-
      <svg viewBox="0 0 420 300" class="fig-svg" role="img" aria-label="A curvy backyard skating pond drawn on a grid. It covers many grid squares fully and many more partly."><path class="cg-poly" d="M90 58 C110.7 41.3 148.7 41.3 178 42 C207.3 42.7 239.3 52.7 266 62 C292.7 71.3 323.3 80.7 338 98 C352.7 115.3 360.7 145.3 354 166 C347.3 186.7 320.7 214.7 298 222 C275.3 229.3 242 206.7 218 210 C194 213.3 177.3 240.7 154 242 C130.7 243.3 94.7 234.7 78 218 C61.3 201.3 52 168.7 54 142 C56 115.3 69.3 74.7 90 58 Z"/><line class="fig-grid" x1="10" y1="10" x2="10" y2="290"/><line class="fig-grid" x1="50" y1="10" x2="50" y2="290"/><line class="fig-grid" x1="90" y1="10" x2="90" y2="290"/><line class="fig-grid" x1="130" y1="10" x2="130" y2="290"/><line class="fig-grid" x1="170" y1="10" x2="170" y2="290"/><line class="fig-grid" x1="210" y1="10" x2="210" y2="290"/><line class="fig-grid" x1="250" y1="10" x2="250" y2="290"/><line class="fig-grid" x1="290" y1="10" x2="290" y2="290"/><line class="fig-grid" x1="330" y1="10" x2="330" y2="290"/><line class="fig-grid" x1="370" y1="10" x2="370" y2="290"/><line class="fig-grid" x1="410" y1="10" x2="410" y2="290"/><line class="fig-grid" x1="10" y1="10" x2="410" y2="10"/><line class="fig-grid" x1="10" y1="50" x2="410" y2="50"/><line class="fig-grid" x1="10" y1="90" x2="410" y2="90"/><line class="fig-grid" x1="10" y1="130" x2="410" y2="130"/><line class="fig-grid" x1="10" y1="170" x2="410" y2="170"/><line class="fig-grid" x1="10" y1="210" x2="410" y2="210"/><line class="fig-grid" x1="10" y1="250" x2="410" y2="250"/><line class="fig-grid" x1="10" y1="290" x2="410" y2="290"/><rect class="fig-hl" x="370" y="250" width="40" height="40"/><text class="fig-small" x="362" y="275" text-anchor="end">1 m²</text></svg>
    prompt: Amara’s family flooded part of the backyard to make a skating pond. Each grid square is **1 m by 1 m**. Estimate the area of the ice. A close estimate counts.
    unit: m²
    answer: 30
    tolerance: 4
    verify: 19 + 11
    hints:
      - Which squares are completely ice? Count those first.
      - The other squares are only part ice. Some are nearly full and some have just a sliver. How could you pair them up?
      - Two part squares often make about one whole square. About how many whole squares do all the part squares make?
    solution:
      - 'Use the 1 m² square as your benchmark, and count in two groups.'
      - 'About **19** squares are all ice.'
      - 'About **23** squares are part ice. Paired up, they make about **11** whole squares.'
      - '\(19 + 11 = 30\), so the ice is about **30 m²**. Anything from 26 to 34 is a fair estimate.'

  - id: b2
    level: 2
    thinking: estimate
    covers: [S1.5, S1.6, S1.3]
    type: mc
    prompt: Sana made a poster listing four areas. One of them can’t be right. Which one?
    choices:
      - 'A dining table top: **150 cm²**'
      - 'A classroom door: **20 000 cm²**'
      - 'A bedroom floor: **12 m²**'
      - 'A notebook cover: **500 cm²**'
    answer: 0
    feedback:
      '1': 'The number looks huge, but cm² are tiny. A door about 1 m wide and 2 m tall is 2 m², and each m² is 10 000 cm². Does that match?'
      '2': 'Picture a floor 3 m by 4 m. That is 12 m², a fine size for a bedroom.'
      '3': 'Picture a cover 20 cm by 25 cm. That is 500 cm², a fine size for a notebook.'
    hints:
      - Which number looks strange? Looking strange is not the same as being wrong.
      - Turn each area into a rectangle you can picture. What side lengths would give that area?
      - Try 150 cm² as a square about 12 cm by 12 cm. Try 20 000 cm² as 100 cm by 200 cm.
    solution:
      - 'Don’t judge by how big the number looks. Picture a rectangle with that area.'
      - '20 000 cm² is 100 cm by 200 cm, which is 1 m by 2 m. That is just right for a door.'
      - '150 cm² is about 12 cm by 12 cm, smaller than a dinner plate. A dining table can’t be that small, so **the table** is the mistake.'
      - 'What we learned: a big number of small units can still be a small area, so always think about the unit too.'

  - id: b3
    level: 2
    thinking: connect
    covers: [S1.1, S1.2, S1.3]
    type: number
    prompt: |-
      Ruby cuts a sheet of paper **1 m by 1 m** into tiny squares, each **1 cm by 1 cm**, and lays them all edge to edge in one straight line. How long is the line, in **metres**?
    unit: m
    answer: 100
    verify: 10000 / 100
    hints:
      - What two things do you need to know about the tiny squares to find the length of the line?
      - How many tiny squares are there? How long is each one along the line?
      - You will have a length in centimetres. How many centimetres make 1 m?
    solution:
      - 'First, how many squares? 1 m² is 100 cm by 100 cm, so there are \(100 \times 100 = 10\,000\) squares.'
      - 'Each square adds 1 cm to the line, so the line is 10 000 cm long.'
      - '100 cm make 1 m, so \(10\,000 \div 100 = 100\). The line is **100 m** long.'
      - 'What we learned: one square metre holds far more square centimetres than it looks like it should.'

  - id: b4
    level: 2
    thinking: connect
    covers: [U1.2, S1.8, S1.9, S1.10]
    type: number
    figure: |-
      <svg viewBox="0 0 320 240" class="fig-svg fig-svg--square" role="img" aria-label="Four square tables pushed into a 2 by 2 square, with two seats along each of the four outside edges, 8 seats in all."><rect class="fig-rect" x="90" y="50" width="70" height="70"/><rect class="fig-rect" x="90" y="120" width="70" height="70"/><rect class="fig-rect" x="160" y="50" width="70" height="70"/><rect class="fig-rect" x="160" y="120" width="70" height="70"/><circle class="cg-pt" cx="125" cy="30" r="11"/><circle class="cg-pt" cx="125" cy="210" r="11"/><circle class="cg-pt" cx="70" cy="85" r="11"/><circle class="cg-pt" cx="250" cy="85" r="11"/><circle class="cg-pt" cx="195" cy="30" r="11"/><circle class="cg-pt" cx="195" cy="210" r="11"/><circle class="cg-pt" cx="70" cy="155" r="11"/><circle class="cg-pt" cx="250" cy="155" r="11"/><text class="fig-small" x="125" y="90" text-anchor="middle">1 m × 1 m</text></svg>
    prompt: For a class party, square tables 1 m by 1 m are pushed together into one rectangle. One person sits at each metre of outside edge, as in the picture, where 4 tables seat 8. The class has **12 tables** and wants exactly **16 seats**. How many tables long is the longer side?
    unit: tables
    answer: 6
    verify: 12 / 2
    hints:
      - What rectangles can 12 tables make?
      - List them, starting with 1 by 12. For each one, how long is the outside edge?
      - The rectangles are 1 by 12, 2 by 6 and 3 by 4. How many seats does each one have?
    solution:
      - 'Seats go along the outside edge, so the number of seats is the **perimeter**.'
      - '1 by 12 seats 26 people. 2 by 6 seats 16 people. 3 by 4 seats 14 people.'
      - 'So the rectangle is 2 tables by **6 tables**.'
      - 'What we learned: all three have the same area, 12 m², but different perimeters. The long, thin one seats the most, and the one closest to a square seats the fewest.'

  - id: b5
    level: 2
    thinking: flaw
    covers: [S1.4, K1.4]
    type: number
    figure: |-
      <svg viewBox="0 0 420 300" class="fig-svg" role="img" aria-label="A square 1 kilometre on each side. One thin path, 1 metre wide and 1 kilometre long, runs up its left edge."><rect class="fig-rect" x="50" y="20" width="230" height="230"/><rect class="fig-hl" x="50" y="20" width="10" height="230"/><text class="fig-label" x="165" y="278" text-anchor="middle">1 km = 1 000 m</text><text class="fig-label" x="30" y="135" text-anchor="middle" transform="rotate(-90 30 135)">1 km = 1 000 m</text><path class="fig-arrow" d="M290 100 C 240 100 110 100 64 100"/><text class="fig-small" x="294" y="94">One path:</text><text class="fig-small" x="294" y="111">1 km long, 1 m wide</text><text class="fig-small" x="294" y="128">(drawn wider</text><text class="fig-small" x="294" y="145">to show it)</text></svg>
    prompt: |-
      Arjun says, "1 km is 1 000 m, so 1 km² must be 1 000 m²." Look at the picture before you agree.

      How many square metres are really in 1 km²?
    unit: m²
    answer: 1000000
    verify: 1000 * 1000
    hints:
      - What is the area of the one thin path in the picture?
      - Compare that with Arjun’s number. How much of the square does it fill?
      - The square is 1 000 m wide and the path is 1 m wide. How many paths would fill the square?
    solution:
      - 'Find the area of one path: \(1\,000 \times 1 = 1\,000\) m². That is exactly Arjun’s number, but it fills only one thin strip.'
      - 'Arjun changed the **length** correctly, since 1 km is 1 000 m. But area goes in two directions, and he only used one.'
      - 'The square is 1 000 m wide, so 1 000 paths fill it. \(1\,000 \times 1\,000 = 1\,000\,000\), so 1 km² is **1 000 000 m²**.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: whatif
    covers: [S1.3, S1.7, S1.10]
    type: investigation
    figure: { kind: rect, w: 40, h: 30, unit: cm }
    prompt: |-
      Wren painted this poster. It used exactly **1 jar** of paint, and **140 cm** of ribbon went around the edge. Now the art club wants a giant poster with **each side twice as long**.
    parts:
      - type: number
        prompt: How much ribbon goes around the giant poster?
        unit: cm
        answer: 280
        verify: 2 * (80 + 60)
        hints:
          - How long is each side of the giant poster?
        solution:
          - 'The sides are now 80 cm and 60 cm. \(80 + 60 + 80 + 60 = 280\) cm, exactly twice the ribbon.'
      - type: number
        prompt: Wren buys **2 jars** of paint for the giant poster and runs out. How many jars does it really take?
        unit: jars
        answer: 4
        verify: (80 * 60) / (40 * 30)
        hints:
          - Imagine laying copies of the first poster over the giant one. How many fit?
          - How many fit along the long side? How many rows are there?
        solution:
          - 'Two first posters fit along the long side, and there are two rows. \(2 \times 2 = 4\), so it takes **4 jars**.'
          - 'Check with areas: \(40 \times 30 = 1\,200\) cm² and \(80 \times 60 = 4\,800\) cm². Four of 1 200 make 4 800.'
      - type: number
        prompt: What if each side is **3 times** as long as on Wren’s first poster? How many jars would that take?
        unit: jars
        answer: 9
        verify: 3 * 3
        hints:
          - Use the same picture. How many rows of first posters would there be, and how many in each row?
        solution:
          - 'There are 3 rows of 3 first posters. \(3 \times 3 = 9\) jars. The ribbon only takes 3 times as much.'
    wrapUp: 'Make each side 2 times as long and the perimeter doubles, but the area grows \(2 \times 2 = 4\) times. It is also why 1 m² is 10 000 cm²: each side is 100 times as long, so the area is \(100 \times 100\) times as big.'

  - id: d2
    level: 3
    thinking: connect
    covers: [K1.5, S1.9, S1.10]
    type: investigation
    figure: |-
      <svg viewBox="0 0 400 210" class="fig-svg" role="img" aria-label="A rectangular garden with its top side along the school wall. A dashed fence runs along the other three sides."><text class="fig-label" x="200" y="20" text-anchor="middle">School wall: no fence here</text><rect class="fig-hl" x="30" y="30" width="340" height="16"/><rect class="fig-rect" style="stroke:none" x="110" y="46" width="180" height="120"/><path class="fig-arrow" style="stroke-width:4" d="M110 46 L110 166 L290 166 L290 46"/><text class="fig-label" x="200" y="112" text-anchor="middle">Garden</text><text class="fig-small" x="102" y="110" text-anchor="end">fence</text><text class="fig-small" x="298" y="110">fence</text><text class="fig-small" x="200" y="188" text-anchor="middle">fence</text></svg>
    prompt: |-
      The Grade 5 class is planting a **36 m²** rectangular garden. You learned that a 6 m by 6 m square needs the least fence.

      But this garden sits against the school wall, so **the side along the wall needs no fence**. All sides are whole metres.
    parts:
      - type: number
        prompt: How much fence does the 6 m by 6 m garden need now?
        unit: m
        answer: 18
        verify: 6 + 6 + 6
        hints:
          - Which sides still need fence?
        solution:
          - 'Three sides need fence: \(6 + 6 + 6 = 18\) m.'
      - type: build
        prompt: Can a different garden beat the square? Design a 36 m² garden that needs **less than 18 m** of fence.
        fields:
          - { name: a, label: 'Side along the wall', unit: m }
          - { name: b, label: 'Side going out from the wall', unit: m }
        rules:
          - { test: 'a % 1 == 0 && b % 1 == 0 && a > 0 && b > 0', fail: 'Use whole metres for both sides.' }
          - { test: 'a * b == 36', fail: 'Check the area. The garden has to be exactly 36 m².' }
          - { test: 'a + 2 * b < 18', fail: 'That garden is 36 m², but it doesn’t beat 18 m of fence. Count only the three fenced sides. Which side would you like to lie along the wall?' }
        examples:
          - { a: 9, b: 4 }
        counterexamples:
          - { a: 6, b: 6 }
          - { a: 4, b: 9 }
          - { a: 12, b: 3 }
          - { a: 8, b: 4.5 }
        hints:
          - The wall gives you one side for free. Would you rather that side were long or short?
          - List the rectangles with an area of 36 m². Try each one both ways against the wall.
          - 12 m along the wall and 3 m out uses 18 m, which is only a tie. What about the next rectangle on your list?
        solution:
          - 'The fence uses the wall side once and the side going out twice.'
          - '\(12 + 3 + 3 = 18\) m, which ties. \(9 + 4 + 4 = 17\) m, which wins. \(6 + 6 + 6 = 18\) m, and \(4 + 9 + 9 = 22\) m.'
          - '**9 m along the wall and 4 m out** uses only 17 m of fence.'
      - type: mc
        prompt: The square needs 18 m of fence and your garden needs 17 m. What is the best explanation?
        choices:
          - The free wall side saves more fence when that side is long.
          - The 9 m by 4 m garden has a smaller perimeter than the square.
          - The rule was wrong, and a square never has the least perimeter.
          - Touching the wall makes the area of the garden smaller.
        answer: 0
        feedback:
          '1': 'Check the whole way around: \(9 + 4 + 9 + 4 = 26\) m, and the square is \(6 + 6 + 6 + 6 = 24\) m.'
          '2': 'All the way around, the square uses 24 m and the other garden uses 26 m, so the rule still holds. What is different about the fence in this story?'
          '3': 'Both gardens are exactly 36 m², since \(9 \times 4\) and \(6 \times 6\) both make 36. What changed was not the area.'
        hints:
          - Find both full perimeters. Is the square still smaller?
          - How much fence does the wall save in each garden?
        solution:
          - 'All the way around, the square still wins: 24 m against 26 m.'
          - 'But the wall saves 6 m for the square and 9 m for the other garden. \(24 - 6 = 18\) and \(26 - 9 = 17\).'
    wrapUp: The square still has the least perimeter. This garden just doesn’t need a whole perimeter of fence. Before you use a rule, check that your story matches what the rule is about.
    hints: []
    solution: []

  - id: d3
    level: 3
    thinking: pattern
    covers: [S1.10, S1.7]
    type: investigation
    prompt: |-
      Area is measured in cm² and perimeter in cm, so they aren’t the same kind of thing. But for some rectangles, the two **numbers** match.
    parts:
      - type: build
        prompt: Hunt for one. Find a rectangle with whole-centimetre sides whose area number and perimeter number are the same.
        fields:
          - { name: w, label: 'Length', unit: cm }
          - { name: h, label: 'Width', unit: cm }
        rules:
          - { test: 'w % 1 == 0 && h % 1 == 0 && w > 0 && h > 0', fail: 'Use whole centimetres for both sides.' }
          - { test: 'w * h == 2 * (w + h)', fail: 'Not a match yet. Work out both numbers. Which one is bigger? How could you change the rectangle to bring them closer?' }
        examples:
          - { w: 4, h: 4 }
          - { w: 6, h: 3 }
          - { w: 3, h: 6 }
        counterexamples:
          - { w: 5, h: 5 }
          - { w: 2, h: 5 }
          - { w: 2.5, h: 10 }
        hints:
          - Try a small rectangle and work out both numbers. Which one is bigger?
          - Keep one side at 3 cm and stretch the other. Watch both numbers change.
          - '3 by 4 gives area 12 and perimeter 14. 3 by 5 gives 15 and 16. What comes next?'
