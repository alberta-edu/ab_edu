id: improper-fractions
grade: 5
subject: math
organizingIdea: MAT-OI1
outcomes: [MAT5-OI1-GQ5-LO1]
order: 5
title: Improper Fractions and Mixed Numbers
shortTitle: Improper fractions & mixed numbers
summary: >-
  Learn how fractions can be more than one whole. Change improper fractions to mixed numbers and back,
  place them on a number line, and compare them to 0, 1/2 and 1.

bigIdea: |-
  A fraction can be **more than one whole**. \(\frac{7}{4}\) is 7 fourths: 1 whole and 3 fourths more,
  so \(\frac{7}{4} = 1\frac{3}{4}\). Both names show the same amount and sit at the **same point** on the number line.

lesson:
  - title: Counting past one whole
    blocks:
      - type: visual
        covers: [K1.1, U1.1, S1.2, S1.3]
        component: fraction-explorer
        props: { numerator: 3, denominator: 4, wholes: 3 }
        caption: |-
          1. Press **+** to add one fourth at a time.
          2. Pass 4 fourths, and a new whole starts filling.
          3. Try other numbers of parts too.
      - type: callout
        variant: remember
        covers: [CLrkTvQMl0Oj1FGsDZHeJQ#K1.3, CLrkTvQMl0Oj1FGsDZHeJQ#K1.5]
        title: Remember from Grade 3
        body: |-
          In \(\frac{a}{b}\), the **denominator** \(b\) is the number of equal parts in one whole, and the
          **numerator** \(a\) counts the parts. When they are equal, like \(\frac{4}{4}\), you have one whole.

  - title: Two ways to write the same amount
    blocks:
      - type: compare
        covers: [K1.2, K1.4, S1.4]
        columns:
          - title: Improper fraction
            figure: { kind: fraction-bars, n: 7, d: 4, wholes: 2 }
            body: |-
              \[\frac{7}{4}\]
              The numerator is **greater than** the denominator: count all 7 fourths.
          - title: Mixed number
            figure: { kind: fraction-bars, n: 7, d: 4, wholes: 2 }
            body: |-
              \[1\frac{3}{4}\]
              A number of **wholes** and a **fractional part**: 1 whole and 3 fourths.
      - type: callout
        variant: mistake
        covers: [K1.4]
        title: Watch out
        body: |-
          \(1\frac{3}{4}\) means \(1 + \frac{3}{4}\). There is no multiplication hiding between the 1 and the \(\frac{3}{4}\).

  - title: Improper fraction → mixed number
    blocks:
      - type: visual
        covers: [S1.3, S1.5]
        component: fraction-regroup
        props: { presets: [[11, 4], [7, 3], [13, 5], [9, 2]] }
        caption: Press **Group into wholes** and watch every group of equal parts snap into one whole.
      - type: example
        covers: [S1.5]
        title: Write 11/4 as a mixed number
        problem: 'Write \(\frac{11}{4}\) as a mixed number.'
        steps:
          - 'Every **4 fourths** make **1 whole**. How many groups of 4 fit in 11? \[11 \div 4 = 2 \text{ R } 3\]'
          - 'The quotient **2** is the number of wholes. The remainder **3** is the fourths left over.'
          - 'Check: \(2 \times 4 + 3 = 11\) fourths ✓'
        answer: '\(\frac{11}{4} = 2\frac{3}{4}\)'

  - title: Mixed number → improper fraction
    blocks:
      - type: example
        covers: [S1.5]
        title: Write 3 2/5 as an improper fraction
        problem: 'Write \(3\frac{2}{5}\) as an improper fraction.'
        steps:
          - 'Each whole is **5 fifths**, so 3 wholes are \(3 \times 5 = 15\) fifths.'
          - 'Add the 2 fifths that are left: \(15 + 2 = 17\) fifths.'
        answer: '\(3\frac{2}{5} = \frac{17}{5}\)'
      - type: callout
        variant: tip
        covers: [S1.5]
        title: The denominator stays the same
        body: The size of each part doesn't change when you regroup, so the denominator doesn't either.

  - title: The same point on the number line
    blocks:
      - type: figure
        covers: [U1.2, S1.1]
        figure: { kind: number-line, n: 11, d: 4, wholes: 3, label: '11/4 = 2 3/4' }
        caption: '\(\frac{11}{4}\) and \(2\frac{3}{4}\) are the **same number**, so they mark the **same point**: three fourths of the way from 2 to 3.'
      - type: table
        covers: [K1.3]
        caption: Whole numbers can be written as improper fractions with a denominator of 1.
        headers: [Whole number, As a fraction]
        rows:
          - ['\(1\)', '\(\frac{1}{1}\)']
          - ['\(3\)', '\(\frac{3}{1}\)']
          - ['\(10\)', '\(\frac{10}{1}\)']

  - title: Compare to 0, ½ and 1
    blocks:
      - type: table
        covers: [S1.6]
        headers: [Benchmark, Ask yourself, Example]
        rows:
          - ['\(0\)', 'Is the numerator 0?', '\(\frac{0}{6} = 0\)']
          - ['\(\frac{1}{2}\)', 'Is the numerator more or less than **half** of the denominator?', 'Half of 8 is 4, and 5 > 4, so \(\frac{5}{8} > \frac{1}{2}\)']
          - ['\(1\)', 'Is the numerator more than, equal to, or less than the denominator?', '9 > 8, so \(\frac{9}{8} > 1\)']

keyTerms:
  - term: Improper fraction
    covers: [K1.2]
    definition: 'A fraction whose numerator is greater than its denominator, like \(\frac{9}{5}\).'
  - term: Mixed number
    covers: [K1.4]
    definition: 'A number of wholes and a fractional part, like \(1\frac{4}{5}\). It means \(1 + \frac{4}{5}\).'
  - term: Numerator
    covers: [CLrkTvQMl0Oj1FGsDZHeJQ#K1.3]
    definition: The top number of a fraction. It counts the equal parts.
  - term: Denominator
    covers: [CLrkTvQMl0Oj1FGsDZHeJQ#K1.3]
    definition: The bottom number of a fraction. It is the number of equal parts in one whole.
  - term: Benchmark
    covers: [S1.6]
    definition: 'A friendly number to compare with: \(0\), \(\frac{1}{2}\) or \(1\).'

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S1.1, S1.4]
    type: fraction
    figure: { kind: number-line, n: 13, d: 5, wholes: 3, label: P }
    prompt: What **mixed number** is at point **P**?
    answer: 2 3/5
    form: mixed
    verify: 13/5
    hints:
      - Look between 0 and 1. How many **spaces** are there? Count the spaces, not the marks.
      - Which whole number comes just before P? How many spaces past it is P?
    solution:
      - 'There are 5 equal spaces between 0 and 1, so each space is one fifth.'
      - 'P is 3 spaces past 2, so P is at \(2\frac{3}{5}\). Its other name is \(\frac{13}{5}\).'

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.5, K1.4]
    type: fraction
    prompt: 'Write \(3\frac{5}{6}\) as an **improper fraction**.'
    answer: 23/6
    form: improper
    verify: 3 + 5/6
    hints:
      - How many sixths are in one whole?
      - 'Then 3 wholes are how many sixths? Don’t forget the 5 extra sixths.'
    solution:
      - '3 wholes are \(3 \times 6 = 18\) sixths.'
      - 'Add the 5 extra sixths: \(18 + 5 = 23\). So \(3\frac{5}{6} = \frac{23}{6}\).'

  - id: w3
    level: 1
    thinking: apply
    covers: [S1.5, K1.2]
    type: fraction
    prompt: 'Write \(\frac{19}{4}\) as a **mixed number**.'
    answer: 4 3/4
    form: mixed
    verify: 19/4
    hints:
      - How many fourths make one whole?
      - 'How many groups of 4 fit in 19? What is left over?'
    solution:
      - '\(19 \div 4 = 4 \text{ R } 3\): 4 wholes and 3 fourths left over.'
      - '\(\frac{19}{4} = 4\frac{3}{4}\)'

  - id: w4
    level: 1
    thinking: apply
    covers: [S1.6]
    type: mc
    prompt: 'A truck’s gas gauge has marks at 0, \(\frac{1}{2}\) and 1. Which of these readings is **more than half** a tank?'
    choices:
      - '\(\frac{7}{12}\)'
      - '\(\frac{5}{12}\)'
      - '\(\frac{5}{10}\)'
      - '\(\frac{3}{8}\)'
    answer: 0
    feedback:
      '1': 'Half of 12 is 6. Is 5 more than 6?'
      '2': 'Half of 10 is 5, so this one is exactly on the \(\frac{1}{2}\) mark.'
      '3': 'Half of 8 is 4. Is 3 more than 4?'
    hints:
      - For each fraction, what is half of the denominator?
      - Is the numerator bigger than that half?
    solution:
      - 'Half of 12 is 6, and 7 is more than 6, so \(\frac{7}{12}\) is more than half.'
      - 'Each of the others has a numerator that is half of its denominator or less.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [S1.2, S1.3, S1.5]
    type: number
    prompt: 'Pickle the cat eats exactly \(\frac{1}{3}\) of a can of food at every meal. After **14** meals, how many cans have been **opened**?'
    answer: 5
    unit: cans
    verify: (14 + 1) / 3
    hints:
      - 'Count in thirds. After 14 meals, how many thirds of a can has Pickle eaten?'
      - 'Change that into a mixed number.'
      - 'The question isn’t how much was eaten. Is the last can empty, or just started?'
    solution:
      - 'Pickle has eaten 14 thirds: \(\frac{14}{3} = 4\frac{2}{3}\) cans.'
      - '4 cans are empty, and \(\frac{2}{3}\) of a fifth can is gone. That fifth can had to be opened, so **5** cans.'

  - id: b2
    level: 2
    thinking: notice
    covers: [K1.1, U1.1]
    type: multi
    prompt: Which of these sentences **could be true**? Choose all that could.
    choices:
      - 'Our dog ate \(\frac{5}{4}\) sandwiches.'
      - 'The hike took \(\frac{7}{4}\) hours.'
      - 'We drank \(\frac{6}{5}\) jugs of juice.'
      - '\(\frac{6}{5}\) of the students in my class are here today.'
      - 'I read \(\frac{9}{8}\) of this one book.'
      - 'Our gas tank is \(\frac{7}{6}\) full.'
    answer: [0, 1, 2]
    feedback:
      '3': '\(\frac{5}{5}\) would be the whole class. Can more than the whole class be here?'
      '4': '\(\frac{8}{8}\) is the whole book. What would you read after that?'
      '5': 'A full tank is \(\frac{6}{6}\). Can a tank hold more than full?'
    hints:
      - What does each fraction say about the whole? Is it more than 1?
      - 'Can there be more than one of the thing, or is there just one, like one class or one book?'
    solution:
      - 'Sandwiches, hours and jugs can come in more than one, so an amount past 1 makes sense: \(1\frac{1}{4}\) sandwiches, \(1\frac{3}{4}\) hours and \(1\frac{1}{5}\) jugs.'
      - 'A class, a book and a tank are each one whole here. You can’t have more than all of it, so those fractions can’t go past 1.'

  - id: b3
    level: 2
    thinking: backwards
    covers: [K1.4, S1.3, S1.5]
    type: fraction
    prompt: |-
      An ice-cube tray holds **6** cubes. Ravi fills **4** trays, and starts another one but doesn’t fill it.
      What is the **most** ice he could have? Write the number of trays as an **improper fraction**.
    answer: 29/6
    form: improper
    verify: 4 + 5/6
    hints:
      - What is the most cubes the last tray can hold without being full?
      - 'So the mixed number looks like \(4\frac{?}{6}\).'
      - 'Now count everything in sixths of a tray.'
    solution:
      - 'A full tray is 6 cubes, so the unfinished tray can hold at most 5. That is \(4\frac{5}{6}\) trays.'
      - '4 trays are \(4 \times 6 = 24\) cubes, and \(24 + 5 = 29\), so \(\frac{29}{6}\) trays.'
      - 'What we learned: the fractional part of a mixed number is always less than 1, or it would make another whole.'

  - id: b4
    level: 2
    thinking: connect
    covers: [S1.1, S1.5, MAT4-OI1-GQ5-LO1#S1.7]
    type: order
    prompt: Four pythons at a pretend reptile show are measured, in metres. Put them in order from **shortest** to **longest**.
    items:
      - '\(\frac{11}{5}\) m'
      - '\(\frac{9}{4}\) m'
      - '\(\frac{7}{3}\) m'
      - '\(2\frac{1}{2}\) m'
    hints:
      - Write each length as a mixed number. What do you notice?
      - 'All four have the same number of whole metres, so only the fractional parts matter.'
      - 'Picture one metre cut into 5 parts, and another cut into 2. Which part is longer?'
    solution:
      - '\(\frac{11}{5} = 2\frac{1}{5}\), \(\frac{9}{4} = 2\frac{1}{4}\) and \(\frac{7}{3} = 2\frac{1}{3}\). Every python is 2 metres and a bit.'
      - 'The more parts a metre is cut into, the smaller each part is, so \(\frac{1}{5} < \frac{1}{4} < \frac{1}{3} < \frac{1}{2}\).'
      - 'Shortest to longest: \(\frac{11}{5}\), \(\frac{9}{4}\), \(\frac{7}{3}\), \(2\frac{1}{2}\).'

  - id: b5
    level: 2
    thinking: flaw
    covers: [S1.3, S1.4, S1.6]
    type: mc
    figure: { kind: fraction-bars, n: 8, d: 5, wholes: 2 }
    prompt: 'Each bar is **one whole**. Tia says this picture shows \(\frac{8}{10}\), because 8 of the 10 parts are shaded. What would you tell her?'
    choices:
      - 'Each part is one fifth of a bar, so the picture shows \(\frac{8}{5}\).'
      - 'You are right, because 8 parts out of the 10 are shaded here.'
      - 'Each bar has 5 parts and 8 are shaded, so it shows \(\frac{5}{8}\).'
      - 'There are 2 bars and 8 shaded parts, so the picture shows \(\frac{8}{2}\).'
    answer: 0
    feedback:
      '1': '\(\frac{8}{10}\) is less than 1. But look: one whole bar is completely shaded, and there is more shaded after it.'
      '2': 'The numerator counts the shaded parts, and the denominator counts the parts in **one whole**. Also, \(\frac{5}{8}\) is less than 1. Does the picture show less than 1?'
      '3': '\(\frac{8}{2}\) is 4 wholes, but there are only 2 bars here. What does the denominator tell you?'
    hints:
      - Is the shaded amount more or less than one whole bar? Is \(\frac{8}{10}\) more or less than 1?
      - The denominator is the number of equal parts in **one** whole, not in the whole picture.
    solution:
      - 'One bar is fully shaded and part of the second bar too, so the amount is more than 1. But \(\frac{8}{10}\) is less than 1, so it can’t be right.'
      - 'Each bar has 5 equal parts, so each part is one fifth. 8 fifths are shaded: \(\frac{8}{5} = 1\frac{3}{5}\).'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: connect
    covers: [K1.3, S1.3, S1.5]
    type: investigation
    prompt: |-
      A junkyard has a pile of **14** wheels and nothing else. Count the pile as vehicles. A tricycle has 3 wheels,
      so one wheel is \(\frac{1}{3}\) of a tricycle’s set. A car has 4 wheels, so one wheel is \(\frac{1}{4}\) of a car’s set.
    parts:
      - type: fraction
        prompt: How many **tricycles’ worth** of wheels are in the pile? Write a mixed number.
        answer: 4 2/3
        form: mixed
        verify: 14/3
        hints:
          - 14 wheels are 14 thirds of a tricycle set. How many groups of 3 fit in 14?
        solution:
          - '\(14 \div 3 = 4 \text{ R } 2\), so \(\frac{14}{3} = 4\frac{2}{3}\) tricycles’ worth: 4 complete sets, and 2 wheels of another.'
      - type: fraction
        prompt: How many **cars’ worth** are in the same pile? Write a mixed number.
        answer: 3 2/4
        form: mixed
        verify: 14/4
        hints:
          - Same wheels, but now each group is a set of 4.
        solution:
          - '\(14 \div 4 = 3 \text{ R } 2\), so \(\frac{14}{4} = 3\frac{2}{4}\) cars’ worth. Same pile, different whole, different fraction.'
      - type: fraction
        prompt: A unicycle has only **1** wheel. Write the number of unicycles in the pile as an **improper fraction**.
        answer: 14/1
        form: improper
        verify: 14 / 1
        hints:
          - One wheel is one whole unicycle. So how many parts are in one whole?
          - The denominator is the number of parts in one whole.
        solution:
          - 'One whole unicycle has 1 part, so the denominator is 1: \(\frac{14}{1}\), which is 14 unicycles.'
      - type: build
        prompt: Bring a **new pile**. It must make a whole number of bicycles (2 wheels), tricycles (3) and cars (4), with no wheels left over. How many wheels could it have?
        fields:
          - { name: w, label: 'Number of wheels', unit: wheels }
        rules:
          - { test: 'w > 0', fail: 'A pile needs some wheels in it.' }
          - { test: 'w % 3 == 0', fail: 'Some wheels are left over when you build tricycles.' }
          - { test: 'w % 4 == 0', fail: 'The tricycles work, but some wheels are left over when you build cars.' }
        examples:
          - { w: 12 }
          - { w: 24 }
          - { w: 36 }
        counterexamples:
          - { w: 14 }
          - { w: 18 }
          - { w: 16 }
        hints:
          - The numerator must split exactly into groups of 2, groups of 3 and groups of 4.
          - Try the numbers you say when you count by 4s. Which also work for 3s?
        solution:
          - '**12** wheels make 6 bicycles, 4 tricycles and 3 cars: \(\frac{12}{2} = 6\), \(\frac{12}{3} = 4\), \(\frac{12}{4} = 3\).'
          - '**24** and **36** work too. All of them split exactly into groups of 3 and groups of 4, and those also split into 2s.'
    wrapUp: The wheels never changed. Only the whole changed, and the denominator tells you what one whole is. When the numerator splits exactly into groups of the denominator, the improper fraction is really a whole number.

  - id: d2
    level: 3
    thinking: flaw
    covers: [K1.4, S1.5, S1.3]
    type: investigation
    prompt: |-
      A pizza shop’s new robot waiter changes mixed numbers into improper fractions its own way. A customer orders
      \(3\frac{1}{2}\) pizzas. The robot adds \(3 + 1 = 4\) and proudly brings \(\frac{4}{2}\) pizzas. The customer is not impressed.
    parts:
      - type: number
        prompt: How many **half pizzas** should the customer have got?
        answer: 7
        verify: 3 * 2 + 1
        hints:
          - How many halves are in one pizza? In 3 pizzas?
        solution:
          - '3 pizzas are \(3 \times 2 = 6\) halves. One more half makes **7**.'
      - type: number
        prompt: How many half pizzas short is the robot’s delivery?
        answer: 3
        verify: 7 - 4
        hints:
          - The robot brought 4 halves.
        solution:
          - '\(7 - 4 = 3\) halves short.'
      - type: mc
        prompt: Why does the robot’s way come up short?
        choices:
          - It counts each whole pizza as only 1 part, not as 2 halves.
          - It should have added the 2 in the denominator to get 6.
          - It should have made the denominator bigger than 2 here.
          - It goes wrong only for pizzas that are cut into halves.
        answer: 0
        feedback:
          '1': '\(\frac{6}{2}\) is 3 pizzas, and the customer ordered more than 3. Think about what the robot did with the 3 whole pizzas.'
          '2': 'The parts are still halves, so the denominator stays 2. It’s the number of halves that is wrong.'
          '3': 'Try \(2\frac{3}{4}\). The robot would make \(\frac{5}{4}\), but the right answer is \(\frac{11}{4}\). Fourths go wrong too.'
        hints:
          - 'In its sum 3 + 1, what does the robot think the 3 is counting? How many halves are in 3 pizzas?'
        solution:
          - 'The robot added the 3 as if 3 pizzas were 3 halves. Really they are 6 halves. Each whole should count as all of its parts.'
      - type: open
        prompt: 'Write a better rule for the robot, one that works for any mixed number. Test it on \(2\frac{3}{4}\).'
        modelAnswer: |-
          Multiply the wholes by the denominator, because each whole has that many parts. Add the numerator. Keep the same denominator, because the
          parts don’t change size. For \(2\frac{3}{4}\): \(2 \times 4 = 8\), then \(8 + 3 = 11\), so it makes \(\frac{11}{4}\).
        rubric:
          - My rule turns each whole into parts by multiplying by the denominator.
          - My rule adds the numerator and keeps the denominator the same.
          - 'When I tested my rule, \(2\frac{3}{4}\) became \(\frac{11}{4}\).'
    wrapUp: A whole is not one part. It is as many parts as the denominator says.

  - id: d3
    level: 3
    thinking: design
    covers: [S1.1, S1.5, S1.6]
    type: build
    prompt: |-
      A ski trail is **3 km** long. The club wants a hot chocolate hut between the 2 km mark and the 3 km mark,
      **closer to the 3 km mark**. Choose a spot, and write it in kilometres as an **improper fraction**.
    fields:
      - { name: n, label: 'Numerator' }
      - { name: d, label: 'Denominator' }
    rules:
      - { test: 'd >= 2 && d % 1 == 0 && n % 1 == 0', fail: 'Use whole numbers, and a denominator of at least 2.' }
      - { test: 'n / d > 2 && n / d < 3', fail: 'That spot isn’t between the 2 km and 3 km marks. Change your fraction to a mixed number to check.' }
      - { test: 'n / d > 5 / 2', fail: 'That spot is between the marks, but is it closer to 3 km? Look at the fractional part of its mixed number.' }
    examples:
      - { n: 11, d: 4 }
      - { n: 8, d: 3 }
      - { n: 14, d: 5 }
    counterexamples:
      - { n: 9, d: 4 }
      - { n: 5, d: 2 }
      - { n: 12, d: 4 }
      - { n: 7, d: 4 }
    hints:
      - Where is the exact middle between 2 km and 3 km? Which benchmark does that use?
      - 'So your spot is 2 wholes, plus a fractional part that is more than \(\frac{1}{2}\) but less than 1.'
      - 'Choose that mixed number first. Then change it to an improper fraction.'
    solution:
      - 'The middle is \(2\frac{1}{2}\). The hut needs 2 wholes plus a part greater than \(\frac{1}{2}\).'
      - '\(2\frac{3}{4} = \frac{11}{4}\) works, because 3 is more than half of 4. So does \(2\frac{2}{3} = \frac{8}{3}\), and \(2\frac{4}{5} = \frac{14}{5}\).'
      - 'They are all different spots, and there are many more. Try halves: \(\frac{5}{2}\) is exactly the middle, and \(\frac{6}{2}\) is 3 km itself. No fraction in halves can work.'
