id: historians-sources
grade: 5
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [Fy8zbilfU0yzOlpS8c5Cdg]
order: 2
title: 'How We Know: Social Scientists and Sources'
shortTitle: Social scientists & sources
summary: >-
  Explore Pompeii with four kinds of social scientist, sort primary and secondary sources, and watch new
  technology read a burned 2,000-year-old scroll.

bigIdea: |-
  - **Historians**, **archaeologists**, **anthropologists** and **geographers** study evidence to learn about the past.
  - **Primary sources** come from the time itself. **Secondary sources** were made later.
  - When new evidence or technology appears, our understanding of the past can **change**.

lesson:
  - title: One place, four kinds of detective
    blocks:
      - type: visual
        covers: [K1.4, S1.3]
        component: social-scientists
        caption: 'Pompeii was a Roman town buried when Mount Vesuvius erupted in 79 CE. Tap each social scientist to see the evidence they study.'
      - type: table
        covers: [K1.4, S1.3]
        caption: The same goal, different evidence
        headers: [Social scientist, Studies, Example evidence]
        rows:
          - ['**Historian**', 'Written records', 'Letters, laws, stories']
          - ['**Archaeologist**', 'Objects and buildings left behind', 'Pots, tools, ruins']
          - ['**Anthropologist**', 'How people lived, and what they valued', 'Family shrines, customs, art']
          - ['**Geographer**', 'Places, and how people use the land', 'Maps, rivers, soil']

  - title: Primary or secondary?
    blocks:
      - type: compare
        covers: [S1.4]
        columns:
          - title: 🏺 Primary source
            body: Made **at the time**, by someone who was there or lived then. It can be writing, or an object.
          - title: 📚 Secondary source
            body: Made **later**, by someone who studied primary sources and explains them.
      - type: visual
        covers: [S1.4]
        component: card-sort
        props:
          bins:
            - { id: primary, label: Primary, icon: 🏺 }
            - { id: secondary, label: Secondary, icon: 📚 }
          cards:
            - { text: A letter by Pliny the Younger describing the eruption of Vesuvius, bin: primary, why: 'Pliny lived through the eruption and wrote about it himself.' }
            - { text: A loaf of bread baked in Pompeii and buried by the ash, bin: primary, why: 'Objects from the time are primary sources too.' }
            - { text: A website about Pompeii written last year, bin: secondary, why: 'Its writer studied the evidence long after the eruption.' }
            - { text: A wall painting from a house in Pompeii, bin: primary, why: 'It was made by someone who lived there at the time.' }
            - { text: Your social studies textbook, bin: secondary, why: 'Textbook writers explain the past using other sources.' }
            - { text: A modern film about ancient Rome, bin: secondary, why: 'It was made almost 2,000 years later, and it imagines parts of the story.' }

  - title: Comparing two sources
    blocks:
      - type: table
        covers: [S1.5]
        caption: What each source can and can't tell us about the eruption
        headers: ['', 'Primary: Pliny’s letter', 'Secondary: a modern encyclopedia']
        rows:
          - ['**Who made it**', 'Pliny the Younger, who was 17 at the time', 'Writers who studied the evidence']
          - ['**When**', 'About 25 years after the eruption', 'Almost 2,000 years later']
          - ['**Strength**', 'An eyewitness: he describes a cloud shaped like a pine tree', 'Puts together letters, digs and volcano science']
          - ['**Limit**', 'One person’s view, from across the bay', 'Can repeat mistakes, and depends on what was known when it was written']
      - type: callout
        variant: tip
        covers: [S1.5]
        title: Use both
        body: |-
          - **Primary sources** bring you close to the event.
          - **Secondary sources** give you the bigger picture.
          - Comparing them shows where they agree, and where to dig deeper.

  - title: New evidence changes the story
    blocks:
      - type: compare
        covers: [K1.5]
        columns:
          - title: 🪨 The Rosetta Stone
            body: |-
              **Before:** no one could read hieroglyphs.

              **New evidence:** a stone found in 1799 carried the same message in Greek and in hieroglyphs. By 1822, scholars could read them.

              **After:** Egyptians could tell their own story, through their own writing.
          - title: 🖋️ A note in charcoal
            body: |-
              **Before:** copies of Pliny’s letter pointed to an eruption in August.

              **New evidence:** in 2018, a charcoal note dated October 17 was found on a wall in Pompeii.

              **After:** many experts now think that the eruption came in the fall. They are still discussing it.
      - type: callout
        variant: mistake
        covers: [K1.5]
        title: Changing an interpretation isn't a failure
        body: An interpretation is the best explanation of the evidence we have so far. When better evidence appears, a good social scientist changes their mind.

  - title: New technology reads the unreadable
    blocks:
      - type: experiment
        covers: [K1.5, S1.6]
        title: Reading a scroll without opening it
        question: |-
          When Vesuvius erupted, hundreds of scrolls in the town of Herculaneum were burned to charcoal. Opening one makes it crumble.

          Can anyone ever read them?
        animation: scroll-scan
        predict:
          choices:
            - No. The words are lost forever.
            - Yes, but only by unrolling it carefully by hand.
            - Yes, by scanning it and using a computer, without opening it.
          answer: 2
        observe: X-rays showed the layers inside the scroll, and a computer program found the ink. In 2023, students read the first word this way, **porphyras**, the Greek word for "purple".
        explain: Technology can reach evidence that no one could study before. Each word that is read is new evidence, and it could change what we know about the ancient world.
      - type: callout
        variant: tip
        covers: [S1.6]
        title: Imagine what's next
        body: |-
          What could future technology reveal? Machines might:

          - find buried cities from the air
          - read writing that has faded away

          Each one could change our story of the past.

keyTerms:
  - term: Historian
    covers: [K1.4, S1.3]
    definition: A social scientist who studies the past, mainly through written records.
  - term: Archaeologist
    covers: [K1.4, S1.3]
    definition: A social scientist who studies objects and buildings that people left behind.
  - term: Anthropologist
    covers: [K1.4, S1.3]
    definition: A social scientist who studies how people live, and what they believe and value.
  - term: Geographer
    covers: [K1.4, S1.3]
    definition: A social scientist who studies places, the land, and how people use them.
  - term: Primary source
    covers: [S1.4]
    definition: Evidence made at the time being studied, such as a letter or a tool.
  - term: Secondary source
    covers: [S1.4]
    definition: An explanation made later by someone who studied the evidence, such as a textbook.
  - term: Interpretation
    covers: [K1.5]
    definition: An explanation of what evidence means. It can change when new evidence appears.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.4, S1.3]
    type: mc
    prompt: Four social scientists arrive at a made-up ancient town, and each one hurries off in a different direction. Which one hurries to the **old river bank and the farm soil**?
    choices:
      - The geographer
      - The historian
      - The archaeologist
      - The anthropologist
    answer: 0
    feedback:
      '1': A historian hurries to the written records. Are rivers and soil written down?
      '2': An archaeologist hurries to objects and buildings that people left behind. Did people make the river?
      '3': An anthropologist hurries to clues about how people lived and what they valued. What are rivers and soil clues about?
    hints:
      - What are a river bank and farm soil part of?
      - Which social scientist studies places, and how people use the land?
    solution:
      - Rivers and soil are part of the land. Studying places, and how people use them, is the work of a **geographer**.

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.4]
    type: multi
    prompt: You are studying ancient Rome. Which of these are **primary** sources? Choose all that apply.
    choices:
      - A Roman soldier’s letter home, asking for more socks
      - A coin made in Rome and dug up in a field
      - A wall painting from a house in Rome
      - A video game about Rome that came out last year
      - A chapter on Rome in your textbook
    answer: [0, 1, 2]
    feedback:
      '3': It shows Rome, but who made it, and when?
      '4': Textbook writers study the evidence and explain it long after. When was this chapter written?
    hints:
      - For each one, ask when it was made.
      - Remember that a primary source can be an object as well as writing.
    solution:
      - A primary source was made **at the time**. The letter, the coin and the painting all come from ancient Rome.
      - The game and the textbook were made much later, so they are secondary.

  - id: w3
    level: 1
    thinking: notice
    covers: [K1.5]
    type: mc
    prompt: Which made-up news headline shows an **interpretation of the past changing** because of new evidence?
    choices:
      - New dig shows that town’s walls are 500 years older than experts thought
      - Museum moves its famous old statue to a bigger room upstairs
      - Experts agree that the old king’s name is hard to remember
      - Textbook about ancient Egypt gets a bright new cover
    answer: 0
    feedback:
      '1': The statue has moved, but has anyone learned something new about it?
      '2': A hard name is annoying, but has anyone changed their mind about the past?
      '3': A cover changes what the book looks like. Do the ideas inside change?
    hints:
      - Which headline has something newly found in it?
      - In which headline do experts now think something different?
    solution:
      - An interpretation is the best explanation of the evidence so far.
      - In the first headline, a new dig gives new evidence, and experts change what they think about the walls.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [S1.4, K1.5]
    type: mc
    prompt: |-
      At a yard sale, a seller offers an old letter “from a soldier who helped find the Rosetta Stone in 1799”. It says:

      *Found a big stone today. Now scholars can read hieroglyphs at last!*

      A museum worker laughs. “No soldier wrote that on that day.” She hasn’t even tested the paper. How can she tell?
    choices:
      - Scholars couldn’t read hieroglyphs until 1822, so no one knew this in 1799.
      - The stone has only Greek on it, so it could never help with hieroglyphs.
      - Soldiers in 1799 couldn’t read or write, so none of them could send a letter.
      - Paper wears away in a few years, so no letter from 1799 could last until now.
    answer: 0
    feedback:
      '1': The stone carries the same message in Greek and in hieroglyphs. That is why it helped.
      '2': Plenty of people could write letters in 1799. Look at what this letter claims to know instead.
      '3': She didn’t test the paper at all. Look at what the words say.
    hints:
      - Read the letter as if you were that soldier on that day. What do you know about the future?
      - The stone was found in 1799. Scholars could read hieroglyphs by 1822. Put those two dates side by side.
      - Could anyone looking at the stone on the day it was found know how the story would end?
    solution:
      - Try being the soldier. The stone has just come out of the ground. You can see writing on it, and that is all.
      - Scholars worked it out by 1822, more than 20 years later. No one in 1799 could know that yet.
      - So the letter was written long after, by someone who already knew the ending. It isn’t a primary source from that day at all.

  - id: b2
    level: 2
    thinking: notice
    covers: [S1.4]
    type: mc
    prompt: In an attic, you find a school textbook about ancient Egypt, printed in **1950**. Which of these is true?
    choices:
      - It’s secondary about ancient Egypt, and primary about what children read in 1950.
      - It’s secondary about everything, because a textbook can never be a primary source.
      - It’s primary about ancient Egypt, because a book from 1950 counts as very old.
      - It’s of no use for anything, since people know much more now than they did in 1950.
    answer: 0
    feedback:
      '1': What could this book show someone who is studying schools in 1950? Was it made at that time?
      '2': Being old isn’t what makes a source primary. Was it made at the time of ancient Egypt?
      '3': It has limits as a book about Egypt. But is Egypt the only thing that someone could study with it?
    hints:
      - Primary means made **at the time being studied**. So what is being studied?
      - Try two different studies. First study ancient Egypt, then study schools in 1950.
    solution:
      - Whether a source is primary depends on your question. So ask what is being studied.
      - For ancient Egypt, the book was written thousands of years later by people explaining the evidence, so it is secondary.
      - For schools in 1950, the book was made at that very time, so it is primary.

  - id: b3
    level: 2
    thinking: evidence
    covers: [S1.5]
    type: mc
    prompt: |-
      Ten years ago, a town’s hockey team lost a big game. You have two sources.

      **A.** A player’s diary from that night: “We were robbed! Worst day of my life!”

      **B.** A book about the league, written last year, with every score from every season.

      Which source is best for each question? **1.** How did losing feel? **2.** Was that a good season for the team?
    choices:
      - A for question 1, and B for question 2
      - B for question 1, and A for question 2
      - A for both, because the player was there
      - B for both, because the writer checked it
    answer: 0
    feedback:
      '1': Who could tell you how that night felt? Could the diary tell you every score of the season?
      '2': The player knows that game well. But can one night’s diary show a whole season?
      '3': The book has every score. But can a list of scores tell you how a person felt?
    hints:
      - Which question needs someone who was there?
      - Which question needs a lot of information, gathered together afterward?
    solution:
      - The diary is a primary source. It brings you close to the event, so it is best for how losing felt.
      - The book is a secondary source. It gives the bigger picture, so it is best for the whole season.
      - The diary says “we were robbed”, but that is one upset person’s view. To check it, you would want other sources too.

  - id: b4
    level: 2
    thinking: connect
    covers: [S1.3, K1.5]
    type: mc
    prompt: Imagine four social scientists studying ancient Egypt in the year **1800**. No one can read hieroglyphs yet. Whose work is **most** blocked?
    choices:
      - The historian
      - The archaeologist
      - The anthropologist
      - The geographer
    answer: 0
    feedback:
      '1': Can pots, tools and ruins still be dug up and studied, even if no one can read?
      '2': Family shrines and art can still be looked at. Which kind of evidence can’t be used here?
      '3': The Nile and the soil are still there to study. Do they need reading?
    hints:
      - What can’t be used if no one can read hieroglyphs?
      - Which social scientist mainly studies that kind of evidence?
    solution:
      - Hieroglyphs are writing, so Egypt’s own written records can’t be used yet.
      - Written records are what a **historian** mainly studies. The other three can keep going with objects, art and land.
      - So when the Rosetta Stone unlocked hieroglyphs, a huge pile of new evidence opened up, all at once. That changed the story of Egypt.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [S1.4, S1.5, K1.5]
    type: investigation
    figure: |-
      <svg viewBox="0 0 360 200" class="fig-svg" role="img" aria-label="A stone carving. A queen with a crown stands three times as tall as the three soldiers beside her.">
        <rect class="fig-rect" x="4" y="4" width="352" height="192" rx="6"/>
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M72 36 l-2 -16 l8 8 l8 -10 l8 10 l8 -8 l-2 16 Z"/>
          <circle cx="86" cy="50" r="14"/>
          <line x1="86" y1="64" x2="86" y2="130"/>
          <line x1="86" y1="84" x2="54" y2="110"/>
          <line x1="86" y1="84" x2="118" y2="110"/>
          <line x1="86" y1="130" x2="66" y2="182"/>
          <line x1="86" y1="130" x2="106" y2="182"/>
          <circle cx="170" cy="137" r="5"/><line x1="170" y1="142" x2="170" y2="164"/><line x1="170" y1="150" x2="160" y2="158"/><line x1="170" y1="150" x2="180" y2="158"/><line x1="170" y1="164" x2="163" y2="182"/><line x1="170" y1="164" x2="177" y2="182"/>
          <circle cx="230" cy="137" r="5"/><line x1="230" y1="142" x2="230" y2="164"/><line x1="230" y1="150" x2="220" y2="158"/><line x1="230" y1="150" x2="240" y2="158"/><line x1="230" y1="164" x2="223" y2="182"/><line x1="230" y1="164" x2="237" y2="182"/>
          <circle cx="290" cy="137" r="5"/><line x1="290" y1="142" x2="290" y2="164"/><line x1="290" y1="150" x2="280" y2="158"/><line x1="290" y1="150" x2="300" y2="158"/><line x1="290" y1="164" x2="283" y2="182"/><line x1="290" y1="164" x2="297" y2="182"/>
        </g>
      </svg>
    prompt: |-
      A stone carving, made in Queen Tavi’s own time in the made-up land of Tesh, shows her three times as tall as her soldiers.

      A book from 1890 says, “Queen Tavi was a giant.” Its writer had only the carving to go on.

      Then, in 2020, diggers open her tomb. Her sandals are the same size as everyone else’s.
    parts:
      - type: multi
        prompt: Sort the sources first. Which are **primary** sources about Queen Tavi? Choose all that apply.
        choices:
          - The carving
          - The sandals
          - The book from 1890
        answer: [0, 1]
        feedback:
          '2': It’s old to us. But was it made in the queen’s own time?
        hints:
          - Which of these were made while Queen Tavi was alive, or soon after?
        solution:
          - The carving and the sandals come from her own time, so they are primary. An object counts too.
          - The book came much later and explains older evidence, so it is secondary, even though it is old to us.
      - type: mc
        prompt: Why did the book from 1890 get it wrong?
        choices:
          - It explained the only evidence that was known when it was written.
          - Its writer wanted to trick people into thinking that she was a giant.
          - Any book written before about 1900 is too old to be correct at all.
          - A secondary source can’t ever be trusted to explain any evidence.
        answer: 0
        feedback:
          '1': The story gives no sign of a trick. What did the writer have to go on?
          '2': Age isn’t the problem here. What couldn’t this writer have seen in 1890?
          '3': Secondary sources are very useful, and they give the big picture. What was this writer missing?
        hints:
          - What had the writer seen by 1890? What hadn’t been found yet?
        solution:
          - The tomb wasn’t opened until 2020. In 1890, the carving was all there was to explain.
          - A secondary source depends on what is known when it is written. That is why it can repeat a mistake.
      - type: mc
        prompt: The sandals show she wasn’t a giant. So what is the carving good for now?
        choices:
          - It can show how the queen wanted people to see her.
          - It can show the real height of a queen in those days.
          - It’s good for nothing now, as one mistake ruins a source.
          - It’s proof that the sandals must belong to someone else.
        answer: 0
        feedback:
          '1': Now that we have the sandals, is this a good way to learn how tall she was?
          '2': Think about why someone would carve her so big. Could that still tell us something true?
          '3': Should we throw out the new evidence to save the old idea? What else could explain the carving?
        hints:
          - Who wanted this carving made? Why would they want a queen to look so huge?
        solution:
          - The carving is poor evidence for her height. But it is good evidence for something else, which is how she wanted to be seen. Bigger meant more important.
          - So a source can be wrong about one thing and still be true evidence about another.
    wrapUp: An interpretation is the best explanation of the evidence so far. When new evidence came along, the story of Queen Tavi changed. The old sources were not thrown away. We just learned to ask them better questions.

  - id: d3
    level: 3
    thinking: notice
    covers: [K1.5, S1.5]
    type: mc
    prompt: |-
      Copies of Pliny’s letter point to an eruption in August. The charcoal note found in Pompeii gives a date of **October 17**, but it gives **no year**.

      Lucía says, “Nobody could write on a wall buried under ash. So August is wrong. Case closed!” What must experts know before they can be sure?
    choices:
      - Whether the note was written in the same year as the eruption
      - Who wrote the note, and what kind of work that person did
      - How far away the note’s wall stood from Mount Vesuvius
      - Whether the note’s writer had ever read Pliny’s letter
    answer: 0
    feedback:
      '1': That would be interesting. But would it change what the date tells us?
      '2': Ash fell on the whole town. Does the distance change whether the note disproves August?
      '3': Pliny wrote his letter about 25 years after the eruption. Could the note’s writer have read it?
    hints:
      - Lucía’s reasoning is good. But is there a gap in it? Read the date again.
      - What if the note was written the October before the eruption? Would August still be wrong?
      - What would you have to know for Lucía’s idea to work?
    solution:
      - Lucía’s thinking works, but only if the note comes from the year of the eruption. Then the town wasn’t yet buried in October, so August can’t be right.
      - If the note came from an earlier year, it wouldn’t tell us anything about August.
      - Experts point out that charcoal fades quickly, so the note was probably fresh. That makes the fall likely, but not certain, so they are still discussing it. Sometimes the honest answer is “probably”.
