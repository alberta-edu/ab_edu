id: historians-sources
grade: 5
subject: social-studies
organizingIdea: 24yj47y-kUyqX3wgOASE9A
outcomes: [Fy8zbilfU0yzOlpS8c5Cdg]
order: 2
title: 'How We Know: Social Scientists and Sources'
shortTitle: Social scientists & sources
summary: >-
  Explore Pompeii with four kinds of social scientist, sort primary and secondary sources, and watch new
  technology read a burned 2,000-year-old scroll.

bigIdea: |-
  **Historians**, **archaeologists**, **anthropologists** and **geographers** study evidence to learn about the
  past. Some evidence comes from the time itself (**primary sources**), and some was made later (**secondary
  sources**). When new evidence or technology appears, our understanding of the past can **change**.

lesson:
  - title: One place, four kinds of detective
    blocks:
      - type: visual
        covers: [K1.4, S1.3]
        component: social-scientists
        caption: 'Pompeii was a Roman town buried when Mount Vesuvius erupted in 79 CE. Tap each social scientist to see the evidence they study.'
      - type: table
        covers: [K1.4, S1.3]
        caption: The same goal, different evidence
        headers: [Social scientist, Studies, Example evidence]
        rows:
          - ['**Historian**', 'Written records', 'Letters, laws, stories']
          - ['**Archaeologist**', 'Objects and buildings left behind', 'Pots, tools, ruins']
          - ['**Anthropologist**', 'How people lived, and what they valued', 'Family shrines, customs, art']
          - ['**Geographer**', 'Places, and how people use the land', 'Maps, rivers, soil']

  - title: Primary or secondary?
    blocks:
      - type: compare
        covers: [S1.4]
        columns:
          - title: 🏺 Primary source
            body: Made **at the time**, by someone who was there or lived then. It can be writing, or an object.
          - title: 📚 Secondary source
            body: Made **later**, by someone who studied primary sources and explains them.
      - type: visual
        covers: [S1.4]
        component: card-sort
        props:
          bins:
            - { id: primary, label: Primary, icon: 🏺 }
            - { id: secondary, label: Secondary, icon: 📚 }
          cards:
            - { text: A letter by Pliny the Younger describing the eruption of Vesuvius, bin: primary, why: 'Pliny lived through the eruption and wrote about it himself.' }
            - { text: A loaf of bread baked in Pompeii and buried by the ash, bin: primary, why: 'Objects from the time are primary sources too.' }
            - { text: A website about Pompeii written last year, bin: secondary, why: 'Its writer studied the evidence long after the eruption.' }
            - { text: A wall painting from a house in Pompeii, bin: primary, why: 'It was made by someone who lived there at the time.' }
            - { text: Your social studies textbook, bin: secondary, why: 'Textbook writers explain the past using other sources.' }
            - { text: A modern film about ancient Rome, bin: secondary, why: 'It was made almost 2,000 years later, and it imagines parts of the story.' }

  - title: Comparing two sources
    blocks:
      - type: table
        covers: [S1.5]
        caption: What each source can and can't tell us about the eruption
        headers: ['', 'Primary: Pliny’s letter', 'Secondary: a modern encyclopedia']
        rows:
          - ['**Who made it**', 'Pliny the Younger, who was 17 at the time', 'Writers who studied the evidence']
          - ['**When**', 'About 25 years after the eruption', 'Almost 2,000 years later']
          - ['**Strength**', 'An eyewitness: he describes a cloud shaped like a pine tree', 'Puts together letters, digs and volcano science']
          - ['**Limit**', 'One person’s view, from across the bay', 'Can repeat mistakes, and depends on what was known when it was written']
      - type: callout
        variant: tip
        covers: [S1.5]
        title: Use both
        body: Primary sources bring you close to the event. Secondary sources give you the bigger picture. Comparing them shows where they agree, and where to dig deeper.

  - title: New evidence changes the story
    blocks:
      - type: compare
        covers: [K1.5]
        columns:
          - title: 🪨 The Rosetta Stone
            body: |-
              **Before:** no one could read hieroglyphs.

              **New evidence:** a stone found in 1799 carried the same message in Greek and in hieroglyphs. By 1822, scholars could read them.

              **After:** Egyptians could tell their own story, through their own writing.
          - title: 🖋️ A note in charcoal
            body: |-
              **Before:** copies of Pliny’s letter pointed to an eruption in August.

              **New evidence:** in 2018, a charcoal note dated October 17 was found on a wall in Pompeii.

              **After:** many experts now think that the eruption came in the fall. They are still discussing it.
      - type: callout
        variant: mistake
        covers: [K1.5]
        title: Changing an interpretation isn't a failure
        body: An interpretation is the best explanation of the evidence we have so far. When better evidence appears, a good social scientist changes their mind.

  - title: New technology reads the unreadable
    blocks:
      - type: experiment
        covers: [K1.5, S1.6]
        title: Reading a scroll without opening it
        question: Hundreds of scrolls were burned to charcoal in the town of Herculaneum when Vesuvius erupted. Opening one makes it crumble. Can anyone ever read them?
        animation: scroll-scan
        predict:
          choices:
            - No. The words are lost forever.
            - Yes, but only by unrolling it carefully by hand.
            - Yes, by scanning it and using a computer, without opening it.
          answer: 2
        observe: X-rays showed the layers inside the scroll, and a computer program found the ink. In 2023, students read the first word this way, **porphyras**, the Greek word for "purple".
        explain: Technology can reach evidence that no one could study before. Each word that is read is new evidence, and it could change what we know about the ancient world.
      - type: callout
        variant: tip
        covers: [S1.6]
        title: Imagine what's next
        body: 'What could future technology reveal? Machines might find buried cities from the air, or read writing that has faded away. Each one could change our story of the past.'

keyTerms:
  - term: Historian
    covers: [K1.4, S1.3]
    definition: A social scientist who studies the past, mainly through written records.
  - term: Archaeologist
    covers: [K1.4, S1.3]
    definition: A social scientist who studies objects and buildings that people left behind.
  - term: Anthropologist
    covers: [K1.4, S1.3]
    definition: A social scientist who studies how people live, and what they believe and value.
  - term: Geographer
    covers: [K1.4, S1.3]
    definition: A social scientist who studies places, the land, and how people use them.
  - term: Primary source
    covers: [S1.4]
    definition: Evidence made at the time being studied, such as a letter or a tool.
  - term: Secondary source
    covers: [S1.4]
    definition: An explanation made later by someone who studied the evidence, such as a textbook.
  - term: Interpretation
    covers: [K1.5]
    definition: An explanation of what evidence means. It can change when new evidence appears.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [S1.3]
    type: mc
    prompt: Who digs up and studies **objects and buildings** left behind by people of the past?
    choices: [An archaeologist, A geographer, A historian, An anthropologist]
    answer: 0
    feedback:
      '1': A geographer studies places, land and how people use them.
      '2': A historian mainly studies written records.
      '3': An anthropologist studies how people lived and what they valued.
    hints:
      - Which social scientist worked at the dig in the Pompeii picture?
    solution:
      - An **archaeologist** studies objects and buildings that people left behind.

  - id: w2
    level: 1
    covers: [S1.4]
    type: mc
    prompt: Which is a **primary** source about ancient Egypt?
    choices:
      - A clay pot made in ancient Egypt
      - A library book about Egypt, published in 2020
      - A documentary film about the pharaohs
      - An encyclopedia article on the Nile
    answer: 0
    feedback:
      '1': This book was written long after the time of ancient Egypt, so it is secondary.
      '2': This film was made long after, so it is secondary.
      '3': This article explains the past from long after, so it is secondary.
    hints:
      - Which one was made at the time, by someone living then?
    solution:
      - The pot was made **at the time**, so it is a primary source. Objects count too.

  - id: w3
    level: 1
    covers: [K1.4]
    type: multi
    prompt: Which of these are **social scientists** who study evidence of ancient civilizations? Choose all that apply.
    choices: [Historians, Geographers, Anthropologists, Archaeologists, Astronauts]
    answer: [0, 1, 2, 3]
    feedback:
      '4': Astronauts travel in space. The other four study evidence of the past.
    hints:
      - The lesson named four.
    solution:
      - Historians, archaeologists, anthropologists and geographers are all social scientists.

  - id: w4
    level: 1
    covers: [K1.5]
    type: mc
    prompt: Can our understanding of the past change?
    choices:
      - Yes, when new evidence or new technology appears.
      - No, once it is written in a book, it can never change.
      - Yes, but only if a historian guesses differently.
      - No, because the past is over.
    answer: 0
    feedback:
      '1': The eruption date at Pompeii is being rethought because of a new find.
      '2': Interpretations change because of evidence, not because of guesses.
      '3': The past is over, but what we **know** about it can still grow.
    hints:
      - Think about the Rosetta Stone.
    solution:
      - Interpretations can evolve as **new evidence and technology** appear.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [S1.3]
    type: mc
    prompt: 'A researcher asks: "Why did people settle near this volcano?" and studies the soil and the nearby bay. Who is this most likely to be?'
    choices: [A geographer, A historian, An archaeologist, An anthropologist]
    answer: 0
    feedback:
      '1': A historian would mainly look to written records.
      '2': An archaeologist would mainly dig for objects and buildings.
      '3': An anthropologist would mainly ask how people lived and what they valued.
    hints:
      - Soil and bays are features of what?
    solution:
      - Soil, bays and why people settled in a place are questions about land and place, so this is a **geographer**.

  - id: b2
    level: 2
    covers: [S1.4, S1.5]
    type: mc
    prompt: 'Pliny the Younger was 17 when Vesuvius erupted. He wrote about it years later, watching from across the bay. Which is true of his letter?'
    choices:
      - It is a primary source, but it shows only what one person saw.
      - It is a secondary source, because he wrote it down later.
      - It is a primary source, so everything in it must be correct.
      - It is not useful, because he was young.
    answer: 0
    feedback:
      '1': He lived through the event himself, so it is primary even though he wrote it later.
      '2': Primary sources can have mistakes and limits, like any other source.
      '3': His age is a limit to think about, but an eyewitness account is very valuable.
    hints:
      - Was he there? Could he have seen everything?
    solution:
      - Pliny was there, so the letter is **primary**. It still gives one person's view from one place, so we compare it with other sources.

  - id: b3
    level: 2
    covers: [S1.5]
    type: mc
    prompt: You want to know **what the eruption looked like to someone there**, and **how much land the ash covered**. Which sources fit best?
    choices:
      - Pliny's letter for the first, and a modern study for the second
      - A modern study for the first, and Pliny's letter for the second
      - Pliny's letter for both
      - Neither source can help
    answer: 0
    feedback:
      '1': Only someone who was there can tell you how it looked to them. A modern study is best for measuring the ash.
      '2': Pliny could see only part of the area. Mapping all the ash takes modern study.
      '3': Each of these sources helps with one of the questions.
    hints:
      - Which question needs an eyewitness? Which one needs a lot of measurements?
    solution:
      - An eyewitness gives the first. A modern secondary source that combines many digs and measurements gives the second.

  - id: b4
    level: 2
    covers: [K1.5]
    type: order
    prompt: Put the story of reading hieroglyphs in order.
    items:
      - Egyptians carve hieroglyphs for thousands of years.
      - People lose the ability to read hieroglyphs.
      - The Rosetta Stone is found in 1799.
      - Scholars compare the stone's Greek and hieroglyphs.
      - By 1822, hieroglyphs can be read again.
    hints:
      - What had to happen before the stone could help?
    solution:
      - Hieroglyphs were used, then forgotten. The stone was found and compared, and it opened up Egypt's own records.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [S1.4]
    type: mc
    prompt: 'A historian in ancient Rome writes about the Egyptian pyramids, which were already 2,000 years old. For someone studying **how the pyramids were built**, this writing is…'
    choices:
      - secondary, because the writer did not live when they were built.
      - primary, because everything from ancient times is primary.
      - primary, because the writer was a historian.
      - useless, because it is too old.
    answer: 0
    feedback:
      '1': Old does not always mean primary. What matters is whether it comes from the time being studied.
      '2': Being a historian does not make writing primary. Timing matters.
      '3': Old writing can still be useful. You just need to know what it can show.
    hints:
      - Primary means made **at the time being studied**. When were the pyramids built?
    solution:
      - The writer lived 2,000 years after the pyramids were built, so for this question the writing is **secondary**.

  - id: d2
    level: 3
    covers: [K1.5, S1.5]
    type: mc
    prompt: |-
      Copies of Pliny's letter point to an eruption in August, but a charcoal note found on a wall in Pompeii
      is dated October 17. Why do many experts now lean toward the fall?
    choices:
      - Faint charcoal would soon wear away, so the note was likely written just before the eruption.
      - A charcoal note is always more correct than a letter.
      - Pliny said that he had lied about the date.
      - All the experts have agreed, and no one can question it now.
    answer: 0
    feedback:
      '1': No kind of source is always correct. Each must be weighed.
      '2': Nothing suggests that he lied. What we have are copies, made over many centuries.
      '3': Experts are still discussing it, and that is how interpretations work.
    hints:
      - Why would it matter that the note was written in faint charcoal?
    solution:
      - Faint charcoal fades quickly, so a note this clear was likely written shortly before the ash buried it. That is new evidence for a later date.

  - id: d3
    level: 3
    covers: [S1.3]
    type: mc
    prompt: 'A burial is found with pots, a written name and seeds from far away. Which pair of questions best shows how two social scientists might study it **differently**?'
    choices:
      - 'Anthropologist: "What does this burial show about what people believed?" Geographer: "Where did the seeds grow, and how did they get here?"'
      - 'Anthropologist: "How deep is the soil layer?" Geographer: "What does the written name say?"'
      - 'Anthropologist: "What does the written name say?" Geographer: "What does this burial show about beliefs?"'
      - Both would ask exactly the same questions.
    answer: 0
    feedback:
      '1': Soil layers fit an archaeologist, and names fit a historian.
      '2': These questions fit a historian and an anthropologist.
      '3': They work together, but each one looks at the evidence through a different lens.
    hints:
      - Who studies beliefs? Who studies places?
    solution:
      - Anthropologists ask about beliefs and ways of life. Geographers ask about places, and how things moved between them.

  - id: d4
    level: 3
    covers: [S1.6, K1.5]
    type: open
    prompt: Imagine a new technology that doesn't exist yet. How could it change what we know about one ancient civilization?
    modelAnswer: |-
      I imagine a drone that can see through sand. It could fly over the deserts of Egypt and find buried
      villages where ordinary farmers lived. Most evidence we have is about pharaohs, since their tombs lasted.
      Finding these villages could change our view of what daily life in Egypt was like.
    rubric:
      - I described a new technology.
      - I named a civilization, and said what evidence the technology could find.
      - I explained how that evidence could change what we think about the past.
