id: government-social-systems
grade: 5
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [_qCBFNsjyUuxF_UmZ0xkwg]
order: 5
title: Governments and Social Systems
shortTitle: Governments & social systems
summary: >-
  See how ancient rulers gained and kept power, climb a social pyramid, watch empires grow on a map, and
  follow how some African empires ended and others began.

bigIdea: |-
  In **authoritarian** governments, one leader or a small group holds power. Ancient societies were arranged in
  **social classes**, with a few people at the top and most people at the bottom. **Empires** grew through trade
  and conquest, and disputes over wealth could end one empire and begin another.

lesson:
  - title: How rulers claimed power
    blocks:
      - type: visual
        covers: [K1.2, S1.3]
        component: card-sort
        props:
          bins:
            - { id: divine, label: Divinity rights, icon: ☀️ }
            - { id: heredity, label: Heredity, icon: 👑 }
            - { id: force, label: Force, icon: ⚔️ }
          cards:
            - { text: 'Egypt: the pharaoh is said to be the son of the sun god.', bin: divine, why: 'Claiming a link to a god is a divinity right.' }
            - { text: 'China: Zhou kings say that Heaven chose them to rule.', bin: divine, why: 'This is the **mandate of heaven**. Heaven could also take it away from a bad ruler.' }
            - { text: 'Europe: later kings say that God gave them the right to rule.', bin: divine, why: 'This is the **divine right of kings**.' }
            - { text: 'Egypt: a son becomes pharaoh after his father dies.', bin: heredity, why: 'Power passed down through a family is heredity.' }
            - { text: 'Rome: Julius Caesar marches his army into Italy to take control.', bin: force, why: 'Using an army to take power is force.' }
            - { text: 'China: the king of Qin conquers his rivals and makes himself emperor.', bin: force, why: 'He won power by defeating the other states in war.' }
        caption: 'Authoritarian leaders may claim power in three ways. Where does each example belong?'
      - type: compare
        covers: [K1.1, S1.2]
        columns:
          - title: 👑 Monarchy
            body: One ruler, such as a king or queen, usually from a ruling family. Egypt's pharaohs are an example.
          - title: ✊ Dictatorship
            body: One leader or small group holds total power, often by force. Julius Caesar was named dictator of Rome for life in 44 BCE.

  - title: Why people followed
    blocks:
      - type: compare
        covers: [K1.3, S1.3]
        columns:
          - title: 📜 Tradition
            body: '"Our families have always followed the pharaoh."'
          - title: 🕊️ Desire for stability
            body: '"After years of war, a strong ruler will bring peace."'
          - title: 😨 Fear
            body: '"If I speak out, the emperor''s soldiers will punish me."'
      - type: callout
        variant: tip
        covers: [U1.1, S1.3]
        title: Keeping power
        body: Leaders kept power by using these motives. They held grand ceremonies, offered order and safety, and punished people who disagreed. The government and social classes held it all in place.

  - title: The social pyramid
    blocks:
      - type: visual
        covers: [K1.7, S1.4, U1.1]
        component: social-pyramid
        caption: Tap each layer. Compare how many people it held, how much power they had, and their opportunities and challenges.
      - type: callout
        variant: mistake
        covers: [K1.7]
        title: A hierarchy can divide people
        body: Those at the top had the most **power, privilege, rights and freedoms**. Most people, including **enslaved people**, had far fewer. These differences could cause divisions.

  - title: Power and gender
    blocks:
      - type: compare
        covers: [K1.4, K1.5, K1.6]
        columns:
          - title: 👨 Patriarchal
            body: Power is based on gender, and **men** hold most of it. Rome and Athens were patriarchal.
          - title: 👩 Matriarchal
            body: Power is based on gender, and **women** hold most of it.
          - title: 🤝 Egalitarian
            body: Power is **not** based on gender.
      - type: table
        covers: [S1.5, K1.4]
        caption: How gender shaped people's roles
        headers: [Place, Men, Women]
        rows:
          - ['**Athens**', 'Citizen men could vote and hold office.', 'Women could not vote, and mostly stayed in the home.']
          - ['**Rome**', 'The eldest man had power over his family.', 'Women could not vote, though some ran businesses and owned property.']
          - ['**Egypt**', 'Men held most high offices.', 'Women could own property, and a few, such as Hatshepsut, ruled as pharaoh.']
          - ['**Kush**', 'Kings ruled Kush too.', 'Queens called **Kandakes** could rule in their own right.']
      - type: callout
        variant: tip
        covers: [K1.4, S1.5]
        title: Be careful with labels
        body: Even Kush and Egypt were not fully matriarchal or egalitarian. Evidence from so long ago is limited, and experts are still discussing which label fits each society.

  - title: Empires grow
    blocks:
      - type: compare
        covers: [S1.1]
        columns:
          - title: 🏛️ Civilization
            body: A **complex society** with cities, jobs, government and shared ways of life. It may stay in one region.
          - title: 🗺️ Empire
            body: One power that **rules over many lands and peoples**, often taken by conquest. A civilization can build an empire.
      - type: visual
        covers: [K1.8, S1.1]
        component: empire-map
        props: { set: conquest }
        caption: 'Tap an empire. For Rome, tap each date and watch it grow. What do you notice about Persia and Greece?'

  - title: African empires
    blocks:
      - type: visual
        covers: [K1.9]
        component: empire-map
        props: { set: africa }
        caption: Tap each group. Control of trade played a part in how one empire ended and another began.
      - type: callout
        variant: tip
        covers: [K1.9]
        title: Follow the trade
        body: Gold, salt, ivory and ports all meant wealth. Whoever controlled them could pay for armies and win allies. Disputes over them helped end some empires and begin others.

keyTerms:
  - term: Authoritarian government
    covers: [K1.1]
    definition: A government ruled by a single leader or a small group of leaders.
  - term: Monarchy
    covers: [K1.1]
    definition: Government by one ruler, such as a king or queen, usually from a ruling family.
  - term: Dictatorship
    covers: [K1.1]
    definition: Government by one leader or small group that holds total power, often gained by force.
  - term: Mandate of heaven
    covers: [K1.2]
    definition: The ancient Chinese belief that Heaven gives a ruler the right to rule, and can take it away.
  - term: Patriarchy
    covers: [K1.4, K1.5]
    definition: A social system in which men hold most of the power.
  - term: Matriarchy
    covers: [K1.4, K1.5]
    definition: A social system in which women hold most of the power.
  - term: Egalitarian
    covers: [K1.4, K1.6]
    definition: Describes a social system in which power is not based on gender.
  - term: Hierarchy
    covers: [K1.7]
    definition: An arrangement of groups from the highest rank to the lowest.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [K1.1, S1.2]
    type: mc
    prompt: Who rules in an **authoritarian** government?
    choices:
      - A single leader or a small group of leaders
      - Every citizen, equally
      - No one at all
      - Whoever wins a game
    answer: 0
    feedback:
      '1': When citizens share power, it is not authoritarian.
      '2': A government has someone making decisions.
      '3': Authoritarian leaders gain power by divinity rights, heredity or force.
    hints:
      - Is power spread out, or held by a few?
    solution:
      - Authoritarian governments are ruled by **a single leader or a small group**.

  - id: w2
    level: 1
    covers: [K1.2]
    type: multi
    prompt: Which are ways that authoritarian leaders may claim power? Choose all that apply.
    choices: [Divinity rights, Heredity, Force, A vote by all the people]
    answer: [0, 1, 2]
    feedback:
      '3': Leaders chosen by a vote of all the people are not authoritarian leaders.
    hints:
      - The lesson's sort had three bins.
    solution:
      - Authoritarian leaders may claim power through **divinity rights**, **heredity** and **force**.

  - id: w3
    level: 1
    covers: [K1.5, K1.6]
    type: mc
    prompt: In which social system is power **not** based on gender?
    choices: [Egalitarian, Patriarchal, Matriarchal]
    fixedOrder: true
    answer: 0
    feedback:
      '1': In a patriarchal system, men hold most of the power, so it is based on gender.
      '2': In a matriarchal system, women hold most of the power, so it is based on gender.
    hints:
      - Which word sounds like "equal"?
    solution:
      - In **egalitarian** social systems, power is not based on gender.

  - id: w4
    level: 1
    covers: [K1.7]
    type: mc
    prompt: In ancient social pyramids, who had the **fewest** people and the **most** power?
    choices:
      - The highest social class
      - The lower social classes
      - Enslaved people
      - All classes were the same size and had the same power.
    answer: 0
    feedback:
      '1': The lower classes had the most people and less power.
      '2': Enslaved people had the least power and freedom.
      '3': These social systems were hierarchical, so classes were not equal.
    hints:
      - Look at the shape of the pyramid.
    solution:
      - The narrow top of the pyramid is the **highest class**, with few people and the most power.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [K1.2, S1.3]
    type: mc
    prompt: Zhou kings said that Heaven had taken away the right to rule from the Shang rulers, and given it to them. What is this claim called?
    choices:
      - The mandate of heaven
      - The divine right of kings
      - Heredity
      - The Royal Road
    answer: 0
    feedback:
      '1': The divine right of kings was the idea used by later European kings.
      '2': Heredity is power passed down through a family. The Zhou took power from another family.
      '3': The Royal Road was a Persian road.
    hints:
      - This idea comes from ancient China.
    solution:
      - This is the **mandate of heaven**. It meant that a ruler who lost Heaven's favour could lose the throne.

  - id: b2
    level: 2
    covers: [K1.3, S1.3]
    type: mc
    prompt: '"Things were terrible during the civil wars. I don''t love the emperor, but at least now there is peace." What motivates this follower?'
    choices: [A desire for stability, Fear, Tradition, Wealth]
    answer: 0
    feedback:
      '1': This person isn't afraid of being punished. They value the peace.
      '2': This person isn't following because of old customs.
      '3': Wealth isn't mentioned.
    hints:
      - What does this person value most about the emperor?
    solution:
      - Wanting peace and order after a time of war is a **desire for stability**.

  - id: b3
    level: 2
    covers: [S1.4, K1.7]
    type: mc
    prompt: Use the pyramid. Which statement compares the classes correctly in ancient Rome?
    choices:
      - Senators could hold high office, while enslaved people were treated as property.
      - Enslaved people had more rights than senators.
      - Freed people ruled the empire.
      - All Romans had the same opportunities.
    answer: 0
    feedback:
      '1': The opposite. Enslaved people had almost no rights.
      '2': Freed people could not hold high office.
      '3': Rome was hierarchical, so opportunities depended on class.
    hints:
      - Tap the top and bottom layers of Rome's pyramid.
    solution:
      - Rome was hierarchical. Senators held high office, and enslaved people had almost no rights.

  - id: b4
    level: 2
    covers: [S1.1, K1.8]
    type: mc
    prompt: What makes an **empire** different from other civilizations?
    choices:
      - It rules over many lands and peoples, often taken through conquest.
      - It has no government.
      - It must be in Africa.
      - It has no cities.
    answer: 0
    feedback:
      '1': Empires have governments that rule their lands.
      '2': Empires grew on many continents, including Persia and Rome.
      '3': Empires have many cities.
    hints:
      - Look at how Rome's map changes from 264 BCE to 117 CE.
    solution:
      - An empire rules **many lands and peoples**, and it often gets them through trade and military conquest.

  - id: b5
    level: 2
    covers: [K1.9]
    type: order
    prompt: Put these West African empires in order, from **earliest** to **latest**.
    items: [Ghana, Mali, Songhai]
    hints:
      - Tap "Ghana, Mali and Songhai" on the map and read the timeline.
    solution:
      - '**Ghana** (about 700–1200 CE) → **Mali** (about 1235–1600 CE) → **Songhai** (about 1464–1591 CE).'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [K1.8]
    type: mc
    prompt: 'On the map, the land held by Greece in 323 BCE looks a lot like that held by Persia in 500 BCE. What is the **best** explanation?'
    choices:
      - Alexander the Great conquered the Persian Empire and took over its lands.
      - Greece and Persia were always one country.
      - Persia gave its land away as a gift.
      - The two maps show the same year.
    answer: 0
    feedback:
      '1': They were separate powers, and they fought each other.
      '2': Alexander's armies took this land by conquest.
      '3': These maps show dates about 177 years apart.
    hints:
      - Tap each empire's card and read how it grew.
    solution:
      - Alexander's armies **conquered** Persia, so much of its land became part of his empire.

  - id: d2
    level: 3
    covers: [K1.9]
    type: mc
    prompt: Mali controlled trade in gold and salt. In 1591, Morocco invaded Songhai to seize the gold trade. What do these two facts have in common?
    choices:
      - In both, control of a valuable trade was tied to power.
      - In both, the empire had no contact with others.
      - In both, trade had no effect on who ruled.
      - In both, salt was worth nothing.
    answer: 0
    feedback:
      '1': The trade routes linked these empires to many other lands.
      '2': Both show that trade had a big effect on who held power.
      '3': Salt was so valuable that people crossed the Sahara for it.
    hints:
      - Why would Morocco want to attack an empire so far away?
    solution:
      - Gold and salt meant wealth, and wealth meant power. Economic disputes helped end some empires and begin others.

  - id: d3
    level: 3
    covers: [U1.1, S1.3]
    type: multi
    prompt: A pharaoh wants to keep power. Which actions would help, based on the lesson? Choose all that apply.
    choices:
      - Hold grand ceremonies that show a link to the gods
      - Keep grain stored, so people trust that order and food will last
      - Have soldiers punish rebels
      - Let any farmer replace the pharaoh by a vote
    answer: [0, 1, 2]
    feedback:
      '3': That would give up power, not keep it.
    hints:
      - Think about tradition, stability and fear.
    solution:
      - Ceremonies draw on **tradition** and belief, stored grain offers **stability**, and soldiers create **fear**. All three help a ruler to keep power.

  - id: d4
    level: 3
    covers: [S1.5, S1.4]
    type: open
    prompt: Imagine that you are a girl and your brother is a boy, both in a citizen family in ancient Athens. Describe how your lives might differ because of gender.
    modelAnswer: |-
      My brother would likely go to school, learn to take part in public life, and vote when he grew up. I would
      mostly stay home, and learn to run a household. I could not vote, even though I am from a citizen
      family. This shows that Athens was patriarchal, since power was based on gender.
    rubric:
      - I described at least one thing the boy could do.
      - I described at least one limit on the girl.
      - I connected the differences to gender and power (a patriarchal system).
