    prompt: |-
      It is the day of the great public games in Rome. Write two short diary lines about this same day: one by a **senator**, and one by someone from the **bottom layer** of Rome’s social pyramid. Show how different the day looks from each place in the pyramid.

      | Layer | Opportunities and challenges |
      |---|---|
      | Senators and the rich | Held high office, owned land, and could afford a good education. Had to pay for public games and buildings to keep their standing. |
      | Bottom layer: the poor and enslaved people | Poor citizen men could still vote. A few enslaved people bought their freedom. The poor paid high rents in crowded buildings. Enslaved people were treated as property. |
    hints:
      - Read both rows. What is an opportunity or a challenge for each?
      - What would each person be doing or worrying about on the day of the games?
    modelAnswer: |-
      Senator: "These games cost me a fortune again, but the crowd cheered my family's name. It is worth it to keep
      our place." Enslaved person: "I was setting out benches before sunrise. Nobody asked if I wanted to come, and
      no one will ever cheer my name."
    rubric:
      - Both of my lines are about the same day of games.
      - My senator’s line fits that layer, such as paying for the games to keep their standing.
      - My other line fits the bottom layer, such as having little money or no freedom.
