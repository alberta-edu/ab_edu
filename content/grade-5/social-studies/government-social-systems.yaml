id: government-social-systems
grade: 5
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [_qCBFNsjyUuxF_UmZ0xkwg]
order: 5
title: Governments and Social Systems
shortTitle: Governments & social systems
summary: >-
  See how ancient rulers gained and kept power, climb a social pyramid, watch empires grow on a map, and
  follow how some African empires ended and others began.

bigIdea: |-
  In **authoritarian** governments, one leader or a small group holds power. Ancient societies were arranged in
  **social classes**, with a few people at the top and most people at the bottom. **Empires** grew through trade
  and conquest, and disputes over wealth could end one empire and begin another.

lesson:
  - title: How rulers claimed power
    blocks:
      - type: visual
        covers: [K1.2, S1.3]
        component: card-sort
        props:
          bins:
            - { id: divine, label: Divinity rights, icon: ☀️ }
            - { id: heredity, label: Heredity, icon: 👑 }
            - { id: force, label: Force, icon: ⚔️ }
          cards:
            - { text: 'Egypt: the pharaoh is said to be the son of the sun god.', bin: divine, why: 'Claiming a link to a god is a divinity right.' }
            - { text: 'China: Zhou kings say that Heaven chose them to rule.', bin: divine, why: 'This is the **mandate of heaven**. Heaven could also take it away from a bad ruler.' }
            - { text: 'Europe: later kings say that God gave them the right to rule.', bin: divine, why: 'This is the **divine right of kings**.' }
            - { text: 'Egypt: a son becomes pharaoh after his father dies.', bin: heredity, why: 'Power passed down through a family is heredity.' }
            - { text: 'Rome: Julius Caesar marches his army into Italy to take control.', bin: force, why: 'Using an army to take power is force.' }
            - { text: 'China: the king of Qin conquers his rivals and makes himself emperor.', bin: force, why: 'He won power by defeating the other states in war.' }
        caption: 'Authoritarian leaders may claim power in three ways. Where does each example belong?'
      - type: compare
        covers: [K1.1, S1.2]
        columns:
          - title: 👑 Monarchy
            body: One ruler, such as a king or queen, usually from a ruling family. Egypt's pharaohs are an example.
          - title: ✊ Dictatorship
            body: One leader or small group holds total power, often by force. Julius Caesar was named dictator of Rome for life in 44 BCE.

  - title: Why people followed
    blocks:
      - type: compare
        covers: [K1.3, S1.3]
        columns:
          - title: 📜 Tradition
            body: '"Our families have always followed the pharaoh."'
          - title: 🕊️ Desire for stability
            body: '"After years of war, a strong ruler will bring peace."'
          - title: 😨 Fear
            body: '"If I speak out, the emperor''s soldiers will punish me."'
      - type: callout
        variant: tip
        covers: [U1.1, S1.3]
        title: Keeping power
        body: Leaders kept power by using these motives. They held grand ceremonies, offered order and safety, and punished people who disagreed. The government and social classes held it all in place.

  - title: The social pyramid
    blocks:
      - type: visual
        covers: [K1.7, S1.4, U1.1]
        component: social-pyramid
        caption: Tap each layer. Compare how many people it held, how much power they had, and their opportunities and challenges.
      - type: callout
        variant: mistake
        covers: [K1.7]
        title: A hierarchy can divide people
        body: Those at the top had the most **power, privilege, rights and freedoms**. Most people, including **enslaved people**, had far fewer. These differences could cause divisions.

  - title: Power and gender
    blocks:
      - type: compare
        covers: [K1.4, K1.5, K1.6]
        columns:
          - title: 👨 Patriarchal
            body: Power is based on gender, and **men** hold most of it. Rome and Athens were patriarchal.
          - title: 👩 Matriarchal
            body: Power is based on gender, and **women** hold most of it.
          - title: 🤝 Egalitarian
            body: Power is **not** based on gender.
      - type: table
        covers: [S1.5, K1.4]
        caption: How gender shaped people's roles
        headers: [Place, Men, Women]
        rows:
          - ['**Athens**', 'Citizen men could vote and hold office.', 'Women could not vote, and mostly stayed in the home.']
          - ['**Rome**', 'The eldest man had power over his family.', 'Women could not vote, though some ran businesses and owned property.']
          - ['**Egypt**', 'Men held most high offices.', 'Women could own property, and a few, such as Hatshepsut, ruled as pharaoh.']
          - ['**Kush**', 'Kings ruled Kush too.', 'Queens called **Kandakes** could rule in their own right.']
      - type: callout
        variant: tip
        covers: [K1.4, S1.5]
        title: Be careful with labels
        body: Even Kush and Egypt were not fully matriarchal or egalitarian. Evidence from so long ago is limited, and experts are still discussing which label fits each society.

  - title: Empires grow
    blocks:
      - type: compare
        covers: [S1.1]
        columns:
          - title: 🏛️ Civilization
            body: A **complex society** with cities, jobs, government and shared ways of life. It may stay in one region.
          - title: 🗺️ Empire
            body: One power that **rules over many lands and peoples**, often taken by conquest. A civilization can build an empire.
      - type: visual
        covers: [K1.8, S1.1]
        component: empire-map
        props: { set: conquest }
        caption: 'Tap an empire. For Rome, tap each date and watch it grow. What do you notice about Persia and Greece?'

  - title: African empires
    blocks:
      - type: visual
        covers: [K1.9]
        component: empire-map
        props: { set: africa }
        caption: Tap each group. Control of trade played a part in how one empire ended and another began.
      - type: callout
        variant: tip
        covers: [K1.9]
        title: Follow the trade
        body: Gold, salt, ivory and ports all meant wealth. Whoever controlled them could pay for armies and win allies. Disputes over them helped end some empires and begin others.

keyTerms:
  - term: Authoritarian government
    covers: [K1.1]
    definition: A government ruled by a single leader or a small group of leaders.
  - term: Monarchy
    covers: [K1.1]
    definition: Government by one ruler, such as a king or queen, usually from a ruling family.
  - term: Dictatorship
    covers: [K1.1]
    definition: Government by one leader or small group that holds total power, often gained by force.
  - term: Mandate of heaven
    covers: [K1.2]
    definition: The ancient Chinese belief that Heaven gives a ruler the right to rule, and can take it away.
  - term: Patriarchy
    covers: [K1.4, K1.5]
    definition: A social system in which men hold most of the power.
  - term: Matriarchy
    covers: [K1.4, K1.5]
    definition: A social system in which women hold most of the power.
  - term: Egalitarian
    covers: [K1.4, K1.6]
    definition: Describes a social system in which power is not based on gender.
  - term: Hierarchy
    covers: [K1.7]
    definition: An arrangement of groups from the highest rank to the lowest.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.1, S1.2]
    type: mc
    prompt: In a made-up land, General Vex marches his soldiers into the capital and announces that he alone will now make every law. No one in his family has ever ruled. What kind of government is this?
    choices:
      - A dictatorship
      - A monarchy
      - An egalitarian one
      - An empire
    answer: 0
    feedback:
      '1': A monarchy usually has a ruler from a ruling family. Did Vex get power from his family?
      '2': Egalitarian describes a social system where power isn’t based on gender. It doesn’t tell us how Vex took control.
      '3': An empire rules over many lands and peoples. Vex has only taken over one capital so far.
    hints:
      - How did Vex get his power? Who holds it now?
    solution:
      - One leader holds total power, and he got it by force. That is a **dictatorship**, one kind of authoritarian government.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.2]
    type: multi
    prompt: A herald shouts a made-up king’s boasts to the crowd. Which boasts claim power through **divinity rights**? Choose all that apply.
    choices:
      - '"Chosen by the gods of the sky!"'
      - '"Son of the sun!"'
      - '"Grandson of old King Bram!"'
      - '"Conqueror of the Seven Valleys!"'
    answer: [0, 1]
    feedback:
      '2': This claim comes from his family, so it is heredity.
      '3': This claim comes from winning battles, so it is force.
    hints:
      - Which boasts link the king to something above the people on Earth?
    solution:
      - Being chosen by gods or being a son of the sun are **divinity rights**.
      - A famous grandfather is heredity. Conquering valleys is force.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.4, K1.5, K1.6]
    type: mc
    prompt: In the made-up valley of Orrin, the eldest woman of each family sits on the ruling council. Men may not join. What kind of social system is this?
    choices: [Matriarchal, Patriarchal, Egalitarian]
    fixedOrder: true
    answer: 0
    feedback:
      '1': In a patriarchal system, men hold most of the power. Who holds it in Orrin?
      '2': In an egalitarian system, power isn’t based on gender. Is gender deciding who sits on this council?
    hints:
      - Who has the power in Orrin, and what decides that?
    solution:
      - Power in Orrin is based on gender, and women hold it. That makes it **matriarchal**.

  - id: w4
    level: 1
    thinking: notice
    covers: [K1.7]
    type: mc
    prompt: Bryn draws a social pyramid upside down. It is wide at the top and comes to a point at the bottom. Each class is still in its right place from top to bottom. What is wrong with the drawing?
    choices:
      - It shows the most people in the highest class, but that class had the fewest.
      - It shows the highest class with no power, but that class had the most.
      - It shows enslaved people in the highest class, but they were in the lowest.
      - It shows every class at the same size, but the classes were all different.
    answer: 0
    feedback:
      '1': The highest class is still on top, so it still looks the most powerful. What does the **width** of a layer tell you?
      '2': The classes didn’t change places. Only the shape changed.
      '3': The layers in Bryn’s drawing go from wide to narrow, so they aren’t the same size.
    hints:
      - What does a wide layer mean? What does a narrow layer mean?
    solution:
      - The width of a layer shows how many people were in it.
      - The highest class had the **fewest** people, so it should be the narrow point. Most people were in the lower classes, at the wide base.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [S1.1, K1.8]
    type: mc
    prompt: Here are four made-up places. Which one is an **empire**?
    choices:
      - 'Kell: its army beat six neighbouring peoples, and it rules them all now.'
      - 'Morna: a huge city of temples and scribes, all in its own one valley.'
      - 'Sabra: its merchants trade with ten lands, and each land has its own ruler.'
      - 'Dorn: one powerful chief decides everything for the people of Dorn.'
    answer: 0
    feedback:
      '1': Morna sounds like a civilization, with cities, jobs and shared ways of life. But how many lands and peoples does it rule?
      '2': Trade can help an empire to grow. But does Sabra rule those ten lands?
      '3': That tells you how Dorn is governed. A strong leader doesn’t make an empire. What else would Dorn need?
    hints:
      - Don’t ask "How big or rich is it?" Ask "Who does it rule?"
    solution:
      - An empire is one power that **rules over many lands and peoples**. Kell took over six peoples and rules them.
      - Morna can be big and be a civilization without being an empire. Sabra is rich from trade, but it doesn’t rule the lands it trades with.

  - id: b2
    level: 2
    thinking: evidence
    covers: [S1.4, K1.7]
    type: mc
    prompt: |-
      Imagine a complaint box in ancient Rome. One note says:

      "Those games cost me a fortune again! But if I stop paying, people will forget how important my family is."

      Here is Rome’s social pyramid, from the top down. Who most likely wrote this?

      | Layer | A challenge this layer faced |
      |---|---|
      | Emperor | Rivals and the army could remove him. |
      | Senators and the rich | Had to pay for public games and buildings to keep their standing. |
      | Plebeians with a trade | Long hours in shops and workshops, and little say in how Rome was run. |
      | The poor and enslaved people | The poor paid high rents. Enslaved people were treated as property. |
    choices:
      - A senator
      - The emperor
      - A plebeian with a trade
      - An enslaved person
    answer: 0
    feedback:
      '1': The emperor’s biggest worry in the table is different. Who could remove him?
      '2': Read this row again. Long hours in the shop were this person’s challenge. Did it include paying for games?
      '3': An enslaved person had no fortune to spend. Who in the table paid for games to keep their standing?
    hints:
      - Which words in the note are clues about this person’s money and place in society?
      - Read the table row by row. Which challenge fits this note?
    solution:
      - Senators and the rich paid for public games and buildings to keep their standing. The note fits a **senator**.
      - A class with more power and privilege still has challenges, but they are very different from the challenges at the bottom.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K1.9]
    type: mc
    prompt: |-
      Ayesha says, "West African empires were like a relay race. Ghana ended and Mali began. Then Mali ended and Songhai began." Look at the timeline. What is wrong with her idea?
    figure: |-
      <svg viewBox="0 0 380 150" class="fig-svg" role="img" aria-label="A timeline from the year 700 to the year 1600. Ghana runs from about 700 to 1200. Mali runs from about 1235 to 1600. Songhai runs from about 1464 to 1591.">
        <g fill="currentColor" opacity="0.75">
          <rect x="20" y="16" width="180" height="20" rx="3"/>
          <rect x="213" y="50" width="131" height="20" rx="3"/>
          <rect x="295" y="84" width="46" height="20" rx="3"/>
        </g>
        <g fill="currentColor" font-size="13">
          <text x="208" y="31">Ghana</text>
          <text x="207" y="65" text-anchor="end">Mali</text>
          <text x="289" y="99" text-anchor="end">Songhai</text>
          <text x="20" y="136" text-anchor="middle">700</text>
          <text x="128" y="136" text-anchor="middle">1000</text>
          <text x="236" y="136" text-anchor="middle">1300</text>
          <text x="344" y="136" text-anchor="middle">1600 CE</text>
        </g>
        <line x1="20" y1="118" x2="344" y2="118" stroke="currentColor" stroke-width="2"/>
        <g stroke="currentColor" stroke-width="2">
          <line x1="20" y1="113" x2="20" y2="123"/><line x1="128" y1="113" x2="128" y2="123"/><line x1="236" y1="113" x2="236" y2="123"/><line x1="344" y1="113" x2="344" y2="123"/>
        </g>
      </svg>
    choices:
      - Songhai began while Mali was still going, so Mali hadn’t ended yet.
      - Mali began long before Ghana ended, so those two ran side by side.
      - Songhai began before Mali did, so she has those two the wrong way round.
      - Ghana came after Songhai, so she has the whole race the wrong way round.
    answer: 0
    feedback:
      '1': Find where Ghana’s bar stops and where Mali’s bar starts. Do they overlap?
      '2': Compare the left ends of the Mali and Songhai bars. Which one starts first?
      '3': Which bar starts farthest to the left?
    hints:
      - A relay runner stops before the next one gets very far. Where do two bars sit above each other?
    solution:
      - Mali’s bar and Songhai’s bar overlap for more than 100 years. Songhai didn’t wait for Mali to end. It broke away while princes in Mali were fighting over the throne.
      - Empires don’t always hand over neatly. Struggles over wealth and the gold and salt trade could start a new empire while an old one was still there.

  - id: b4
    level: 2
    thinking: breakdown
    covers: [K1.7, S1.4, U1.1]
    type: investigation
    prompt: |-
      Your class plays Pyramid Day. Of **25** students, **1** is the ruler, **4** are nobles and **20** are farmers. Only the farmers bake. They make **30** cookies. The ruler takes **10**, and each noble takes **3**.
    parts:
      - type: number
        prompt: How many cookies are left for all 20 farmers to share?
        answer: 8
        verify: 30 - 10 - 4 * 3
        unit: cookies
        hints:
          - There are 4 nobles. How many do they take altogether?
        solution:
          - The nobles take \(4 \times 3 = 12\) cookies. Then \(30 - 10 - 12 = 8\).
          - The 5 students at the top have 22 cookies. The 20 students who did all the baking share 8.
      - type: mc
        prompt: |-
          Priya drew a farmer card. "Can I study hard and move up?" she asks. Here is the real social pyramid of ancient Egypt, from the top down. Which class came through education, and what was the catch?

          | Layer | What it was based on, and what life was like |
          |---|---|
          | Pharaoh | **Heredity.** Held great wealth. Rivals could plot against the throne. |
          | Nobles and priests | **Heredity and wealth.** Ran the temples and regions. Had to stay loyal to the pharaoh. |
          | Scribes | **Education.** Good government jobs, away from heavy labour. Years of hard schooling, which few families could afford. |
          | Craftspeople and soldiers | **Occupation.** Respect for their skill. Long, hard work, and danger in war. |
          | Farmers and enslaved people | **Born into it, or captured.** Farmers paid grain tax. Enslaved people had no freedom at all. |
        choices:
          - Scribes, but few families could afford the years of schooling.
          - Scribes, but the job was mostly heavy labour.
          - Nobles and priests, but the schooling took many years.
          - The pharaoh, but rivals could plot against the throne.
        answer: 0
        feedback:
          '1': Read the Scribes row again. What does it say about heavy labour?
          '2': Read this row again. What is it based on?
          '3': Read this row. It is based on heredity. Could studying get you there?
        hints:
          - Read the bold words in the table. Which one is about studying?
        solution:
          - Scribes’ places were based on **education**. It was a real way up, but few families could afford the years of hard schooling.
      - type: mc
        prompt: A noble’s grandchild will most likely still be near the top. A farmer’s grandchild will most likely still be farming. Look at the table again. Why is that?
        choices:
          - Wealth and family place pass down, and wealth can pay for schooling.
          - Children of nobles are born cleverer, so they earn the top places.
          - Farming families chose to stay put, so their children never wished to move.
          - Each new ruler picks people for each class, based on who works hardest.
        answer: 0
        feedback:
          '1': The table says that the top places were based on heredity and wealth. Does it say anything about being born cleverer?
          '2': Priya wanted to move up. What actually stood in the way of a child like her?
          '3': The farmers in your game worked hardest, and they got the fewest cookies. Is hard work what decided a person’s class?
        hints:
          - Look at what the top classes were based on. What gets handed from parents to children?
        solution:
          - Heredity and wealth pass from parents to children, and wealth can pay for schooling. So a family’s class tends to carry on.
    wrapUp: The few at the top had the most, and the way up was narrow. A social system like this helps to keep power where it already is, and those differences can divide people.
    hints: []
    solution: []

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: whatif
    covers: [K1.3, S1.3, U1.1]
    type: investigation
    prompt: |-
      King Odo rules a made-up land. Three villagers bow as he passes.

      - **Nan:** "My family has bowed to his family for 200 years."
      - **Ferro:** "Before Odo, raiders burned my bakery twice. Now we have peace."
      - **Pim:** "I bow because his guards are watching me."
    parts:
      - type: mc
        prompt: What motivates each follower?
        choices:
          - 'Nan: tradition. Ferro: stability. Pim: fear.'
          - 'Nan: stability. Ferro: tradition. Pim: fear.'
          - 'Nan: tradition. Ferro: fear. Pim: stability.'
          - 'Nan: fear. Ferro: stability. Pim: tradition.'
        answer: 0
        feedback:
          '1': Nan never mentions peace. Which words in Nan’s quote show why she bows?
          '2': Ferro talks about what has been better since Odo came. Is that fear, or a wish for things to stay calm?
          '3': Pim mentions guards. Is that an old custom, or something else?
        hints:
          - Find the words in each quote that give the reason.
        solution:
          - 'Nan follows what her family has always done: **tradition**. Ferro wants peace to last: **stability**. Pim is afraid of the guards: **fear**.'
      - type: mc
        prompt: Odo sends all his guards to a far-off war. Who is most likely to stop bowing first?
        choices: [Pim, Nan, Ferro]
        answer: 0
        feedback:
          '1': Do guards have anything to do with Nan’s reason?
          '2': Ferro cares about raiders. It might worry Ferro later, but who changes the moment the guards leave?
        hints:
          - For each villager, ask whether their reason has just gone away.
        solution:
          - Pim only bows because the guards are watching. With no guards, that reason is gone.
      - type: mc
        prompt: The guards come back, but they stay in the palace. Raiders burn Ferro’s bakery again, and Ferro stops bowing. What is most likely to win Ferro back?
        choices:
          - Guards posted on the road to stop the raiders
          - A grand ceremony to honour Odo’s ancestors
          - Soldiers who punish Ferro for refusing to bow
          - A speech saying that the gods chose King Odo
        answer: 0
        feedback:
          '1': That might please Nan. What did Ferro say mattered?
          '2': That could make Ferro bow, but for a new reason. Ferro would be just like Pim. Is that really winning Ferro back?
          '3': Ferro never mentioned the gods. What was Ferro’s reason for bowing in the first place?
        hints:
          - Go back to Ferro’s quote. What was the reason for bowing?
        solution:
          - Ferro followed Odo for peace. Giving that peace back is what speaks to Ferro’s reason.
      - type: mc
        prompt: '"I have plenty of guards," says Odo. "Why bother with anything else?" What is the best answer?'
        choices:
          - Guards can’t watch everyone always, so fear alone stops working when they leave.
          - Guards cost so much that a ruler should send them away and rely on tradition.
          - Fear never makes anyone obey, so the guards aren’t helping you at all.
          - People’s reasons never change, so you can relax as soon as they all bow.
        answer: 0
        feedback:
          '1': Think about Ferro. Would tradition have stopped the raiders?
          '2': Pim did bow while the guards were watching. So does fear do nothing?
          '3': Look at what happened to Ferro. Did Ferro’s reason stay the same?
        hints:
          - Think back over the story. What happened to Pim’s bowing when the guards left?
        solution:
          - Fear works only while the guards are there. Rulers who kept power used tradition, stability and fear together, so that one bad day couldn’t bring it all down.
    wrapUp: To work out what could shake a ruler, ask why each person follows. Different reasons break in different ways, and that is why rulers worked to keep all three going.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: why
    covers: [K1.2, S1.3]
    type: mc
    prompt: |-
      A Zhou king says that Heaven chose him, and that Heaven can take that right away from a bad ruler. Then floods drown the crops for three years. A rebel shouts, "See? Heaven has left the king!"

      Why is this more of a danger to him than to a king who only says, "My father was king"?
    choices:
      - His claim depends on Heaven staying pleased, so bad times can be used against him.
      - Floods only come to lands where a ruler has claimed to be chosen by Heaven.
      - A king who rules by heredity can stop floods, since his family has always ruled.
      - Kings who rule by heredity never face rebels, so only this king has to worry.
    answer: 0
    feedback:
      '1': Floods can happen under any ruler. The difference is in what people can **say** about the flood.
      '2': Can anyone’s family stop a flood? Think about what the flood does to each king’s claim.
      '3': Any ruler can face rebels. So what does the rebel in this story have to work with?
    hints:
      - After the flood, is "My father was king" still true?
      - After the flood, how sure can people be that Heaven still chose this king?
    solution:
      - '"My father was king" stays true, however bad the floods get.'
      - '"Heaven chose me" can be taken back, and a disaster gives people a reason to say it has been. The **mandate of heaven** could make a ruler strong, and it could also be turned against him.'
      - 'Here is one more thing to notice: it even gives a rebel from another family a way to claim power.'

  - id: d3
    level: 3
    thinking: flaw
    covers: [S1.5, K1.4, K1.5]
    type: open
    prompt: |-
      A museum sign says: **"Egypt had a woman pharaoh, Hatshepsut. So Egypt was a matriarchy."**

      Here is what we know about gender in Egypt:

      | Men in Egypt | Women in Egypt |
      |---|---|
      | Men held most high offices. | Women could own property, and a few, such as Hatshepsut, ruled as pharaoh. |

      What is wrong with the thinking on the sign? Then write a better sign.
    hints:
      - What would have to be true of a whole society for it to be a matriarchy?
      - Look at the table. What else does it say about men and women?
    modelAnswer: |-
      One woman ruling doesn't mean that women held most of the power. The table says that men held most high
      offices in Egypt. A better sign: "In Egypt, men held most high offices. Women could own property, and a few,
      such as Hatshepsut, ruled as pharaoh."
    rubric:
      - I explained that one woman ruling doesn’t show that women held most of the power.
      - I used a fact from the table, such as who held most of the high offices.
      - My new sign says only what the evidence supports.

  - id: d4
    level: 3
    thinking: perspective
