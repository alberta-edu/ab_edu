id: informed-citizenship
grade: 5
subject: social-studies
organizingIdea: mHPvaWAVOU-k7Fefv9hAWw
outcomes: [MRmYJnVX90eGJ1QhgKk-eg]
order: 6
title: Becoming an Informed Citizen
shortTitle: Informed citizenship
summary: >-
  Use the ancient world to understand issues today, investigate a town's water problem through five sources,
  and choose ways that informed citizens can take action.

bigIdea: |-
  - Studying the past helps us understand issues **today**.
  - **Informed citizens** look at many sources and listen to different perspectives. Then they can **take action**.
  - Knowing what is really going on gives you the power to make a difference.

lesson:
  - title: The past helps explain today
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: then-now
        props: { set: issues }
        caption: Tap each topic. What does the ancient story help you notice about today?

  - title: Investigate an issue
    blocks:
      - type: visual
        covers: [K1.2, S1.3]
        component: issue-investigator
        caption: Riverbend is a made-up town. Read each source, and notice how the picture changes.
      - type: callout
        variant: mistake
        covers: [K1.2, S1.3]
        title: One source is never enough
        body: The first post you see is often the loudest, not the most accurate. Informed citizens seek out **multiple sources** with **different perspectives**.

  - title: Standing in someone else's shoes
    blocks:
      - type: table
        covers: [S1.2, K1.3]
        caption: The same issue, three perspectives
        headers: [Person, What they value, What they might want]
        rows:
          - ['🌱 **Farmer**', 'Keeping the crops and animals alive', 'Water for farms first']
          - ['🏪 **Store owner**', 'Keeping the store open and staff employed', 'As few limits as possible']
          - ['🔬 **Scientist**', 'Making the water last until fall', 'Limits on lawn watering, starting soon']
      - type: callout
        variant: tip
        covers: [K1.3]
        title: Empathy
        body: You don't have to agree with someone to understand them. Asking "What does this person value?" can build **empathy** for their actions.

  - title: Take action
    blocks:
      - type: visual
        covers: [K1.4, S1.4]
        component: card-sort
        props:
          bins:
            - { id: share, label: Sharing information, icon: 📣 }
            - { id: donate, label: Collecting donations, icon: 🎁 }
            - { id: volunteer, label: Volunteering, icon: 🙋 }
            - { id: change, label: Changing personal behaviours, icon: 🔄 }
          cards:
            - { text: Make a poster with the facts from the town's water report., bin: share, why: 'A poster passes on accurate information to others.' }
            - { text: Tell a friend that the "one week left" post was wrong., bin: share, why: 'Correcting a rumour is a way of sharing information.' }
            - { text: Hold a bake sale for families hit by the drought., bin: donate, why: 'This raises money to give to people in need.' }
            - { text: Run a drive at school to collect bottled water., bin: donate, why: 'This collects goods to give to people in need.' }
            - { text: Help plant drought-tolerant plants at the town park., bin: volunteer, why: 'You are giving your own time to help the community.' }
            - { text: Take shorter showers and turn off the tap while brushing your teeth., bin: change, why: 'You are changing what you do each day.' }
        caption: Informed citizens can respond in many ways. Where does each action belong?
      - type: callout
        variant: tip
        covers: [U1.1, S1.4]
        title: Being informed gives you power
        body: When you know the facts and understand others' views, you can make better choices, correct rumours and help others. You don't have to wait until you are older to start.

keyTerms:
  - term: Informed citizen
    covers: [K1.2]
    definition: A person who seeks information from multiple sources, with different perspectives, on issues and events.
  - term: Perspective
    covers: [K1.2, S1.2]
    definition: The way that a person sees an issue, based on their life and what they value.
  - term: Empathy
    covers: [K1.3]
    definition: Understanding the feelings, actions and values of someone else.
  - term: Volunteering
    covers: [K1.4]
    definition: Giving your time to help others, without being paid.
  - term: Contemporary
    covers: [K1.1, S1.1]
    definition: Happening or existing now.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.4]
    type: mc
    prompt: Callum reads that juice boxes make up much of the litter at the town pond. So Callum starts bringing a water bottle instead. Which kind of action is this?
    choices:
      - Changing personal behaviours
      - Sharing information
      - Collecting donations
      - Volunteering
    answer: 0
    feedback:
      '1': Has Callum told anyone? Look at what Callum is doing differently.
      '2': Is Callum asking people to give money or goods?
      '3': Is Callum giving time to help a group? Look at Callum’s own daily habit.
    hints:
      - Who is doing something differently, and who else is involved?
    solution:
      - Callum changed a daily habit, so this is **changing personal behaviours**.

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.2, S1.2]
    type: mc
    prompt: Your town may add a dog run to the park. You want to hear **different perspectives**. Which two people should you ask?
    choices:
      - A dog owner, and a neighbour who lives next to the park
      - Two dog owners from the same dog-walking club
      - A dog owner, and that dog owner’s dog-loving sister
      - The same dog owner, on two different days
    answer: 0
    feedback:
      '1': Two people can be helpful, but what do these two have in common?
      '2': These two probably see the dog run in much the same way. Who else does it affect?
      '3': That’s two answers, but is it two perspectives?
    hints:
      - Who might feel differently about a dog run, and why?
    solution:
      - A perspective comes from a person’s life and what they value. An owner and a next-door neighbour live with the dog run in different ways.
      - More people doesn’t always mean more perspectives.

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.3]
    type: mc
    prompt: Lena loves the new bike lane. Her neighbour hates it, because his shop lost its parking spots. Lena says, "I still like the lane, but I get why you’re worried about your shop." What is Lena showing?
    choices:
      - Empathy
      - Agreement
      - Changing personal behaviours
      - Collecting donations
    answer: 0
    feedback:
      '1': Does Lena agree? She says she still likes the lane. Understanding someone isn’t the same as agreeing.
      '2': Is Lena doing anything differently from before?
      '3': Is anyone giving money or goods here?
    hints:
      - Lena still has her own opinion. What has she also done?
    solution:
      - Lena understands why her neighbour feels this way, while she keeps her own view. That is **empathy**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K1.1, S1.1]
    type: mc
    prompt: Your town opens a shiny new splash park, with huge pumps and giant tipping buckets. The mayor cuts a ribbon, and everyone cheers. Someone in the crowd has studied Roman aqueducts. What is the best question for this person to ask?
    choices:
      - Who will pay to keep this running and repair it for years to come?
      - Should this be built from stone and arches, like a Roman aqueduct?
      - Will this break down after the same number of years as an aqueduct?
      - Why did the town build a splash park instead of bringing in fresh water?
    answer: 0
    feedback:
      '1': That copies what an aqueduct looked like. What did the aqueduct story teach us?
      '2': The past gives us insight, but it can’t give an exact prediction like that.
      '3': The town is not short of fresh water in this story. What was the catch with aqueducts?
    hints:
      - Think back to the aqueduct trail. Aqueducts were a success, but what was the catch?
    solution:
      - Aqueducts brought clean water, but they cost a great deal to build **and keep up**.
      - The lesson for today isn’t about stone or arches. New technology solves problems, and someone must pay to keep it running.

  - id: b2
    level: 2
    thinking: flaw
    covers: [K1.1, S1.1]
    type: mc
    prompt: |-
      At your school, only Grade 6s vote on the new playground rules, but Grade 1s have to follow them too. Malia says, "Athens had votes and left people out. So votes are just bad. Let the principal decide."

      Which reply uses the story of Athens best?
    choices:
      - A vote can be a success and still leave people out. Who should have a say here?
      - Athens was far too long ago, so it can’t teach us about a playground today.
      - The vote in Athens worked well, so our vote is just fine the way it is now.
      - You’re right. The vote in Athens failed, so we should never vote on anything.
    answer: 0
    feedback:
      '1': The people and places are different, but is the question of who gets a say any different?
      '2': That looks at only half of the story. Who was left out in Athens? Who is left out here?
      '3': Letting citizens vote was a success in Athens. Malia is looking at only the other half.
    hints:
      - The trail calls one part of Athens a success and another part a failure. Which parts?
      - What does your school’s plan have in common with Athens?
    solution:
      - Athens let citizens vote, which was a success. It left out women and enslaved people, which was a failure.
      - So the useful question for today isn’t "Are votes good or bad?" It is "Who might be left out?" Here, it’s the Grade 1s.

  - id: b3
    level: 2
    thinking: evidence
    covers: [K1.4, S1.4, U1.1]
    type: mc
    prompt: |-
      Room 12 saw a post saying, "The food bank needs food!" So they planned a Bean Drive. Before starting, they phoned the made-up food bank, and got its shelf count.

      | Food | On the shelf |
      |---|---|
      | Cans of beans | 900 |
      | Cans of soup | 300 |
      | Boxes of cereal | 12 |
      | Jars of peanut butter | 8 |

      What should Room 12 do now?
    choices:
      - Change to a cereal and peanut butter drive, and tell others what is needed.
      - Keep the Bean Drive, because any food helps the food bank just the same.
      - Cancel the drive, because the food bank already has plenty of food there.
      - Collect equal amounts of all four foods, so that nothing gets left out.
    answer: 0
    feedback:
      '1': Picture even more cans on top of those 900. Is that what these families are short of?
      '2': Look at the last two rows. Is the food bank short of nothing?
      '3': Would more soup and beans help as much as what’s running out?
    hints:
      - What does the table tell you that the post didn’t?
      - Which foods are running out?
    solution:
      - The post was true, but it left out what was needed most. The table shows plenty of beans and very little cereal or peanut butter.
      - Room 12 can still collect donations, and now share information too. Being informed didn’t shrink their help. It aimed it.

  - id: b4
    level: 2
    thinking: notice
    covers: [K1.2, S1.3]
    type: number
    prompt: |-
      Seven posts all say, **"There’s a moose at the car wash!"** An arrow from one post to another means that the second post just copied the first. A post is an **independent** source if it didn’t copy from anyone.

      How many independent sources are there?
    figure: |-
      <svg viewBox="0 0 320 225" class="fig-svg" role="img" aria-label="Seven posts, A to G, with arrows showing who copied whom. Arrows go from A to B, from A to C, from C to D, from E to F and from E to G. No arrows point to A or E.">
      <line x1="66.4" y1="55.5" x2="134.0" y2="37.1" stroke="currentColor" stroke-width="2"/>
      <polygon fill="currentColor" points="143.6,34.5 135.3,41.9 132.6,32.3"/>
      <line x1="66.4" y1="64.5" x2="134.0" y2="82.9" stroke="currentColor" stroke-width="2"/>
      <polygon fill="currentColor" points="143.6,85.5 132.6,87.7 135.3,78.1"/>
      <line x1="177.0" y1="90.0" x2="243.0" y2="90.0" stroke="currentColor" stroke-width="2"/>
      <polygon fill="currentColor" points="253.0,90.0 243.0,95.0 243.0,85.0"/>
      <line x1="66.6" y1="166.2" x2="133.7" y2="151.0" stroke="currentColor" stroke-width="2"/>
      <polygon fill="currentColor" points="143.4,148.8 134.8,155.9 132.6,146.1"/>
      <line x1="66.6" y1="173.8" x2="133.7" y2="189.0" stroke="currentColor" stroke-width="2"/>
      <polygon fill="currentColor" points="143.4,191.2 132.6,193.9 134.8,184.1"/>
      <circle cx="50" cy="60" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="50" y="65" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">A</text>
      <circle cx="160" cy="30" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="160" y="35" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">B</text>
      <circle cx="160" cy="90" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="160" y="95" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">C</text>
      <circle cx="270" cy="90" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="270" y="95" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">D</text>
      <circle cx="50" cy="170" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="50" y="175" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">E</text>
      <circle cx="160" cy="145" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="160" y="150" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">F</text>
      <circle cx="160" cy="195" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="160" y="200" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">G</text>
      </svg>
    answer: 2
    verify: 7 - 5
    unit: sources
    hints:
      - Follow the arrows backwards. Where does each post’s story come from?
      - Look for posts that no arrow points to.
    solution:
      - Follow each post back. B, C and D all come from A. F and G come from E.
      - Only **A** and **E** did not copy anyone, so there are **2** independent sources.
      - Seven posts feel like seven pieces of evidence, but copies add nothing new. They also don’t prove the story false. There might really be a moose, so the next step is to check what A and E saw.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.2, S1.3, S1.2, K1.4, U1.1]
    type: investigation
    prompt: |-
      A message races around your school: **"KETCHUP IS BANNED FROM MONDAY!!!"** You check four sources.

      - **Your cousin’s friend:** "I heard that the principal hates ketchup."
      - **School newsletter:** "From Monday, two big pumps will replace the little ketchup packets, to cut down on garbage."
      - **Caretaker:** "Those packets fill three garbage bags a day."
      - **Lunch helper:** "Grade 1s can’t reach the pumps, so the line may get slow."
    parts:
      - type: mc
        prompt: Which source can best settle whether ketchup is really banned?
        choices:
          - The newsletter, because it comes from the people making the change
          - Your cousin’s friend, because that is who started talking about it
          - The caretaker, because that source has a real number in it
          - The lunch helper, because that source works beside the ketchup
        answer: 0
        feedback:
          '1': '"I heard" means that it came from someone else. Who actually knows?'
          '2': The number is useful, but what is it a number of? Does it say anything about a ban?
          '3': The lunch helper knows a lot about the line. But who decides what happens to the ketchup?
        hints:
          - Who is in a position to know what the school has decided?
        solution:
          - The newsletter comes from the school, so it can tell you what the school has decided.
      - type: mc
        prompt: So what is true about the message?
        choices:
          - The packets are going, but the ketchup is staying.
          - All of it is false, and nothing at all will change.
          - All of it is true, and ketchup is gone on Monday.
          - No one can tell, because the sources all disagree.
        answer: 0
        feedback:
          '1': Something is changing on Monday. What does the newsletter say?
          '2': Reread the newsletter. What exactly are the pumps pumping?
          '3': Do they disagree? Try fitting them together. Each one tells you about a different part.
        hints:
          - What part of the message is close to the truth? What part went too far?
        solution:
          - There is a real change, and the message blew it out of proportion. The packets go, and the ketchup stays, in pumps.
      - type: mc
        prompt: Now you know what is going on. What is the most useful thing to do?
        choices:
          - Tell people the packets are changing, not the ketchup, and ask for a low pump for Grade 1s.
          - Start a petition to bring ketchup back, because students should have a say at lunch.
          - Forward the message to more people, because it’s better to be safe than sorry.
          - Bring your own bottle from home on Monday, in case the newsletter turns out wrong.
        answer: 0
        feedback:
          '1': You’d be fighting a ban that doesn’t exist. Is there a real problem that you could help with?
          '2': Now that you know the message is wrong, what would forwarding it do?
          '3': You read the newsletter, and it came from the school. Is there something that would help other people as well?
        hints:
          - Is there a wrong idea you could fix? Is there a real problem you could help with?
        solution:
          - You can correct the rumour by **sharing information**, and help solve the one real problem you found, for the Grade 1s.
    wrapUp: The message made everyone angry about something that wasn’t happening. Four sources later, you knew the truth and could help with the problem that was real. That is the power of being informed.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: evidence
    covers: [S1.3, K1.2, S1.2]
    type: mc
    prompt: |-
      A made-up town is deciding whether the school needs a crossing guard. The town report says, "We counted only 10 cars an hour." A parent says, "Cars stream past nonstop!"

      Then you read the small print. The town counted at 2 pm on a Sunday. The parent watches at 8:30 on school mornings. What should you conclude?
    choices:
      - Both may be honest, but they saw different times. Count on a school morning.
      - The report is the one to trust, because it has an exact number in it.
      - The parent is the one to trust, because parents stand there every day.
      - Neither one can be trusted, because they disagree. Drop the whole question.
    answer: 0
    feedback:
      '1': The number may well be right. But is it a number for the time when children cross?
      '2': The parent may be right about school mornings. But "nonstop" is not a count. How could you check?
      '3': Two sources that disagree are a reason to look closer. Why might they both have seen what they said?
    hints:
      - When do children actually need the crossing guard?
      - Is there a way that both sources could be telling the truth?
    solution:
      - Start with what the decision needs. A crossing guard matters when children are crossing.
      - The town’s count is about a quiet Sunday afternoon, so it doesn’t answer that. The parent’s words are about the right time, but they don’t give a number.
      - So count cars on school mornings. When sources disagree, ask what each one really looked at.
