        <circle class="fig-hl" cx="40" cy="215" r="6"/><text class="fig-label" x="52" y="221">Taghaza</text>
        <circle class="fig-hl" cx="40" cy="260" r="6"/><text class="fig-label" x="52" y="266">Timbuktu</text>
        <circle class="fig-hl" cx="170" cy="205" r="6"/><text class="fig-label" x="170" y="229" text-anchor="middle">Berenice</text>
        <circle class="fig-hl" cx="400" cy="255" r="6"/><text class="fig-label" x="400" y="279" text-anchor="middle">Muziris</text>
        <text class="fig-small" x="235" y="60" text-anchor="middle" style="font-size:14px;font-style:italic">Silk Road</text>
        <text class="fig-small" x="245" y="118" style="font-size:14px;font-style:italic">Royal Road</text>
        <text class="fig-small" x="15" y="294" style="font-size:14px;font-style:italic">trans-Saharan route</text>
        <text class="fig-small" x="305" y="203" text-anchor="middle" style="font-size:14px;font-style:italic">Red Sea and Indian Ocean route</text>
        <text class="fig-small" x="470" y="298" text-anchor="end">Solid = land. Dashed = water. Not to scale.</text>
      </svg>
    prompt: A merchant in Chang’an has silk to sell. A buyer is waiting in Sardis. No single route on this map links them. Which plan gets the silk to Sardis?
    choices:
      - The Silk Road, then the Royal Road
      - The Royal Road, then the Silk Road
      - The Silk Road, then the sea route
      - The Silk Road the whole way
    answer: 0
    feedback:
      '1': These are the right two routes, but check the start. Does the Royal Road reach Chang’an?
      '2': Trace the dashed line. Does it ever touch the Silk Road?
      '3': Follow the Silk Road to its end. Where does it stop?
    hints:
      - Put your finger on Chang’an. Which line can it follow?
      - Look for a place where one line crosses another.
      - The Silk Road crosses one other line. Where does that line lead?
    solution:
      - Work from both ends. Chang’an is on the Silk Road, and Sardis is on the Royal Road.
      - The two routes cross, so the silk can change routes there. Start on the Silk Road and finish on the Royal Road.
      - 'What we learned: routes joined into **networks**, so goods could travel farther than any one route went.'

  - id: b4
    level: 2
    thinking: connect
    covers: [S1.2, K1.4]
    type: mc
    prompt: A merchant from a Greek agora time-travels to a Saturday farmers’ market in your town. Most of it feels just like home. Which sight would puzzle the merchant **most**?
    choices:
      - A buyer taps a little plastic card and walks off with some tomatoes.
      - A farmer sells extra vegetables at a stall in a long row of stalls.
      - A buyer hands over a few small metal coins for a jar of honey.
      - A group of shoppers wander between stalls to compare the goods.
    answer: 0
    feedback:
      '1': People came to the agora to exchange goods, and farmers had extra food to sell. Would this seem strange?
      '2': Greece had metal coins. Would this seem strange to someone from Greece?
      '3': An agora brought buyers and sellers together in one place. What would shoppers there do?
    hints:
      - Picture the merchant walking in. What looks just like home?
      - Now watch each payment. What moves from the buyer to the seller?
    solution:
      - Sellers at stalls, and buyers walking around, are just what an agora was for. Coins would make sense too.
      - But when someone taps a card, no coins move. So how did the seller get paid? Today, the money moves between bank accounts.
      - 'What we learned: the idea of a market has lasted for thousands of years, and the way we pay has kept changing.'

  - id: b5
    level: 2
    thinking: evidence
    covers: [K1.7, K1.8, S1.4]
    type: mc
    prompt: |-
      Pliny the Elder, the Roman writer who recorded the Nile’s flood scale, also wrote about silk. He said that people far to the east comb a soft white fluff off the leaves of trees, and that the cloth made from it was worn in Rome.

      He was wrong about the leaves: silk comes from silkworms. What can a historian still learn from what he wrote?
    choices:
      - Silk reached Rome, but the true story of how it was made may not have.
      - Nothing, because a source with a mistake in it can’t teach us anything.
      - Romans and the people who made silk must have talked with each other often.
      - The silk in Rome was probably a different cloth that was made from leaves.
    answer: 0
    feedback:
      '1': Even a wrong sentence is evidence. Ask what the writer could see from where he lived, and what he never saw.
      '2': If they had talked often, would he have got it so wrong?
      '3': This trusts the very part that we know is wrong. Silk comes from silkworms.
    hints:
      - Split what Pliny says into two parts. Which part could he see for himself in Rome?
      - Which part did he only hear about from far away?
      - Remember that most Silk Road traders travelled only part of the way. What might happen to a story passed from trader to trader?
    solution:
      - Split the source in two. Silk being worn in Rome is something he could see. How it was made is something he could only hear about.
      - So the cloth made the whole long trip, but the true story of how it was made didn’t reach him.
      - That fits the Silk Road, where goods passed from trader to trader and few people travelled the whole way.
      - 'What we learned: goods can travel farther than the true story about them.'

  - id: b6
    level: 2
    thinking: evidence
    covers: [K1.7, S1.3]
    type: mc
    prompt: |-
      Imagine archaeologists dig near an old harbour town in India and find a pot of Roman gold coins. Callum says, “The Romans must have ruled this town.”

      | Route | Joins | Some goods it carried |
      |---|---|---|
      | The Silk Road | China to the Mediterranean, by land | Silk, spices, glass, horses |
      | The Royal Road | Susa to Sardis, in Persia | Cloth, metals, food |
      | The trans-Saharan route | North Africa to West Africa | Gold, salt, cloth, copper |
      | The Red Sea and Indian Ocean route | Roman Egypt to India, by sea | Pepper and other spices, gems, cotton |

      What is a better explanation?
    choices:
      - Ships brought the coins to India to pay for goods such as pepper.
      - Soldiers from Rome carried the coins to India along the Royal Road.
      - Camel caravans carried the coins to India across the Sahara.
      - Money works only in the land that made it, so Rome had to rule here.
    answer: 0
    feedback:
      '1': The Royal Road ran from Susa to Sardis, so it never reached India. A coin also doesn’t show that soldiers came.
      '2': The trans-Saharan route joined North Africa and West Africa. It didn’t go to India.
      '3': This is the same jump that Callum made. A seller can take any money they trust, so a coin can travel without a ruler.
    hints:
      - Which route in the table reaches India from Rome’s lands?
      - What did Rome want from India, and how could Romans pay for it?
    solution:
      - Coins are things that can travel, so ask how they could have got here without a ruler.
      - The Red Sea and Indian Ocean route carried Roman coins to India, and pepper and other spices came back.
      - The coins are good evidence of **trade**. They don’t tell us who ruled the town. For that, you would need other evidence, such as written records.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.3, K1.4]
    type: investigation
    prompt: |-
      On a made-up island, nobody has money yet. People only swap. Three neighbours each want something:

      - **Amara**, a farmer, has grain and wants sandals.
      - **Bao**, a sandal maker, has sandals and wants a pot.
      - **Cyrus**, a potter, has pots and wants grain.
    parts:
      - type: mc
        prompt: Amara brings grain to Bao and asks for sandals. What goes wrong?
        choices:
          - Bao doesn’t want grain, so Bao has no reason to swap.
          - Amara’s grain isn’t worth as much as a pair of sandals.
          - Bao has no sandals left to give to Amara.
          - People can only swap goods of the same kind.
        answer: 0
        feedback:
          '1': The story doesn’t say what grain is worth. Look at what each person wants.
          '2': Bao does have sandals. Look at what Bao wants in return.
          '3': Trade is an exchange of different goods, like grain for pots.
        hints:
          - Read Bao’s line again. What does Bao want?
        solution:
          - Bao wants a pot, not grain. A swap only works when each person has what the other one wants.
      - type: number
        prompt: Amara can still end up with sandals, by accepting something just to pass it on. What is the **fewest swaps** it takes for all three neighbours to get what they want?
        answer: 2
        unit: swaps
        verify: 1 + 1
        hints:
          - Who wants Amara’s grain?
          - Act it out. What does Amara get from that swap, and who wants that?
        solution:
          - 'Swap 1: Amara gives Cyrus grain and gets a pot. Cyrus is happy.'
          - 'Swap 2: Amara gives Bao the pot and gets sandals. Bao and Amara are happy.'
          - That takes 2 swaps, but only because Amara worked out the whole chain first.
      - type: mc
        prompt: |-
          As the island grows, these chains get longer and harder. People agree to use one thing as **currency**, which everyone accepts for anything. Test each idea with three questions:

          - Could you save it for a whole year?
          - Could you carry it to market to buy one egg?
          - If anyone could get as much as they liked, would people still give you sandals for it?

          Which idea passes all three?
        choices:
          - Small shells that come only from one far-off beach
          - Fresh fish caught that morning in the harbour
          - Large stones taken from the nearby hillside
          - Sand scooped up from the beach near town
        answer: 0
        feedback:
          '1': Everyone wants fish. But what happens to your savings after a week?
          '2': Stones last for a long time. But how would you carry them to market to buy one egg?
          '3': Sand lasts, and it is easy to carry in a bag. But why would anyone give you sandals for sand, when they could scoop up their own?
        hints:
          - Ask the first question about each idea, and cross out any that fail. Then ask the next one.
        solution:
          - Fish rots, so it fails the first question. Stones are too heavy, so they fail the second. Anyone can scoop up sand, so it fails the third.
          - Small shells from a far-off beach last, fit in a pocket and are hard to get. Cowrie shells were a real currency in ancient China.
      - type: open
        prompt: Now invent a currency for your class or team. What is it? Why will it last, be easy to carry and be hard to copy? What could still go wrong with it?
        modelAnswer: |-
          I would use small wooden tokens, marked with a stamp that our teacher keeps. They last a long time and fit in a pocket, and nobody can copy them without the stamp.

          One thing could still go wrong: someone could carve a stamp that looks the same. Then there would be fake tokens, and people might stop accepting them.
        rubric:
          - I named my currency.
          - I gave reasons that it would last, be easy to carry and be hard to copy.
          - I said what could still go wrong.
        hints:
          - What went wrong with the fish, the stones and the sand? Make sure your idea avoids each one.
    wrapUp: Swapping only works when each person has what the other wants. As towns grew, people agreed on something everyone would accept, such as cowrie shells, bronze money or metal coins. A currency only works because people agree to accept it.

  - id: d2
    level: 3
    thinking: whatif
    covers: [K1.7, S1.4]
    type: investigation
    prompt: |-
      Here are two made-up diary pages from the trans-Saharan route.

      **A trader from the north:** “I gave one sack of salt and got a pouch of gold. What a deal!”

      **A trader from West Africa:** “I gave one pouch of gold, which we have plenty of, and got salt, which we can’t get here. What a deal!”
    parts:
      - type: mc
        prompt: Each trader thinks they won. Who really got the better deal?
        choices:
          - Both did, because each swapped what they had plenty of for what they lacked.
