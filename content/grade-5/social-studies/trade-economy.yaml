id: trade-economy
grade: 5
subject: social-studies
organizingIdea: kogCCyLxG0WbndPR9zs-xQ
outcomes: [VtfkI_gtBk66PSC2mQV7zQ]
order: 4
title: Trade Routes and Early Economies
shortTitle: Trade routes & early economies
summary: >-
  Turn a farming village into a city, set taxes from the Nile's floods, and follow goods and ideas along the
  Silk Road, the Royal Road and the trans-Saharan route.

bigIdea: |-
  Better farming meant **fewer farmers** could feed **more people**. Others took up new jobs, and **cities**
  grew. Extra food led to **trade**, markets, banks, money and taxes. Long **trade routes** then carried goods
  and ideas across the ancient world.

lesson:
  - title: From village to city
    blocks:
      - type: visual
        covers: [K1.1, K1.2, S1.1]
        component: village-city
        caption: 'Move the slider down until people go hungry. Then add irrigation and oxen, and try again. How few farmers can feed everyone?'
      - type: compare
        covers: [K1.1, K1.2, S1.1]
        columns:
          - title: 💧 Irrigation
            body: Canals bring river water to the fields. More land grows more food.
          - title: 🐂 Animal labour
            body: Oxen pull heavy ploughs, so fewer people can farm more land.
          - title: 🏙️ Specialized jobs
            body: With fewer people farming, others become potters, weavers and traders. Towns grow into **cities**.

  - title: Extra food becomes trade
    blocks:
      - type: example
        covers: [K1.3]
        title: A farmer with a surplus
        problem: A farmer grows more grain than the family can eat. What can they do with the extra, or **surplus**?
        steps:
          - 'A potter needs food, and the farmer needs pots.'
          - 'They **exchange**: grain for pots. That is trade.'
          - 'The builder, the weaver and the healer can all join in, trading **goods and services** for food.'
        answer: Extra farm products, exchanged for goods and services, developed **trade**.
      - type: table
        covers: [K1.4, S1.2]
        caption: As cities grew, these economic practices developed. Many are still with us.
        headers: [Practice, In ancient civilizations, Today]
        rows:
          - ['**Markets**', 'People exchanged goods at the Greek agora and the Roman forum.', 'Farmers’ markets, malls and online stores']
          - ['**Banks**', 'Greek temples stored valuables for people. Some also lent money.', 'Banks keep our savings and make loans.']
          - ['**Currency**', 'Cowrie shells and bronze money in China; metal coins in Greece and Rome', 'Coins, bank notes and cards']
          - ['**Taxation**', 'Egyptian farmers paid a share of their harvest in grain.', 'People pay income tax and sales tax.']

  - title: Taxes and the Nile
    blocks:
      - type: visual
        covers: [K1.5, U1.2]
        component: nilometer
        caption: 'Egyptian officials measured the Nile’s flood with a **nilometer**. Move the slider to see what the height meant. The words come from Pliny the Elder, a Roman writer. The icons only show the idea.'
      - type: compare
        covers: [U1.2, K1.5, S1.2]
        columns:
          - title: 🏺 Why taxes then?
            body: Taxation **first developed in ancient civilizations**. Rulers collected taxes to pay for soldiers, officials and roads, and to store food.
          - title: 🏫 Why taxes now?
            body: Governments collect money from citizens to **protect communities** and **provide services**, such as fire departments, roads and schools.

  - title: Routes across the ancient world
    blocks:
      - type: visual
        covers: [K1.6, K1.7, S1.3]
        component: trade-map
        props: { show: goods }
        caption: Tap a route and watch the traveller go. Which civilizations did it connect? What did it carry?
      - type: callout
        variant: tip
        covers: [K1.6]
        title: Land and water
        body: As civilizations grew and took over more land, they built networks of **land-based** routes (solid lines) and **water-based** routes (dashed line) to connect their lands.

  - title: Trade carried more than goods
    blocks:
      - type: visual
        covers: [K1.8, S1.4]
        component: trade-map
        props: { show: ideas }
        caption: Traders carried more than goods. Tap each route to see what else travelled along it.
      - type: table
        covers: [U1.1, S1.4]
        caption: How technology and contact transformed civilizations
        headers: [Change, Example]
        rows:
          - ['**Social**', 'New jobs and new beliefs changed how people lived together.']
          - ['**Political**', 'Roads and riches helped rulers govern bigger lands.']
          - ['**Economic**', 'Markets and more goods made some cities very rich.']
          - ['**Environmental**', 'Canals and farms changed the land itself.']

keyTerms:
  - term: Irrigation
    covers: [K1.1]
    definition: Bringing water to crops through canals or other channels.
  - term: Surplus
    covers: [K1.3]
    definition: More of something than you need, such as extra food that can be traded.
  - term: Specialized labour
    covers: [K1.2]
    definition: When people do one main kind of work, such as making pots, instead of doing everything for themselves.
  - term: Currency
    covers: [K1.4]
    definition: Something accepted as money, such as cowrie shells or coins.
  - term: Taxes
    covers: [U1.2, K1.5]
    definition: Money or goods that a government collects from citizens to protect communities and provide services.
  - term: Trade route
    covers: [K1.6]
    definition: A path over land or water that traders follow to exchange goods over long distances.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.3]
    type: number
    prompt: A farm family grows **30 baskets** of grain this year. They need **22 baskets** to eat. How many baskets are their **surplus**, ready to trade?
    answer: 8
    unit: baskets
    verify: 30 - 22
    hints:
      - What does the word surplus mean?
      - Start with what they grew. Take away what they need.
    solution:
      - A surplus is what is left after your own needs are met.
      - '\(30 - 22 = 8\) baskets. That is the grain they can exchange for pots or for a healer’s help.'

  - id: w2
    level: 1
    thinking: apply
    covers: [U1.2, K1.4]
    type: mc
    prompt: Every household in a town pays a little money. The town uses that money to run the fire department and fix the roads. What is this practice called?
    choices:
      - Taxation
      - A market
      - Currency
      - A bank
    answer: 0
    feedback:
      '1': A market is where people exchange goods. Nobody in this story is buying or selling.
      '2': Currency is the money itself. This question is about why everyone pays in, and what the money does.
      '3': A bank keeps your own savings for you. This money pays for services that everyone shares.
    hints:
      - Who collects the money here, and what does it pay for?
      - Which practice supports government services?
    solution:
      - Look at where the money goes. It pays for services that the whole town shares.
      - Collecting money from citizens to protect communities and provide services is **taxation**.

  - id: w3
    level: 1
    thinking: notice
    covers: [K1.8, S1.4]
    type: multi
    prompt: Traders carried more than goods. Some things fit in a saddlebag. Others travel only in a person’s head. Choose everything that moved as an **idea**.
    choices:
      - Buddhism
      - How to make gunpowder
      - Knowledge of healing plants
      - Rolls of silk
      - Pepper
      - Horses
    answer: [0, 1, 2]
    feedback:
      '3': You can hold a roll of silk and hand it over, so it is a good.
      '4': You can pack pepper in a bag and sell it, so it is a good.
      '5': You can lead a horse on a rope and sell it, so it is a good.
    hints:
      - For each one, ask if you could pack it, or lead it on a rope.
      - If a trader lost every bag on the way, which of these would still arrive?
    solution:
      - Test each one. Silk, pepper and horses can be packed or led, so they are goods.
      - A belief, a secret recipe and knowledge about healing travel in people’s heads, so they are ideas.
      - 'Here is something to notice: when you sell your pepper, it is gone. When you teach an idea, you still have it.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: model
    covers: [K1.1, K1.2, S1.1]
    type: number
    prompt: A made-up village has **80 people**. Long ago, nearly all of them farmed. Now, with irrigation and oxen, only **20** farm. The other **60** are potters, weavers and traders. Everyone has enough to eat, and no food is left over. Each farmer grows the same amount. How many people’s food does each farmer grow?
    answer: 4
    unit: people
    verify: 80 / (80 - 60)
    hints:
      - Who eats in this village?
      - Share out all the food that has to be grown among the farmers.
      - How many groups of 20 are there in 80?
    solution:
      - Before dividing, ask who needs feeding. It is everyone, and that includes the farmers.
      - 'So 20 farmers grow food for all 80 people. Count up by 20s: 20, 40, 60, 80. That makes 4 groups, so each farmer feeds 4 people.'
      - Did you get 3? That feeds only the 60 people with other jobs, and leaves the farmers hungry.
      - 'What we learned: when one farmer can feed 4 people, 3 out of every 4 people are free to do other work. That is how a village grows into a city.'

  - id: b2
    level: 2
    thinking: notice
    covers: [K1.5]
    type: mc
    figure: |-
      <svg viewBox="0 0 480 240" class="fig-svg" role="img" aria-label="A flood scale, from top to bottom. Above 16 cubits: too much, planting comes late. 16: delight. 15: security. 14: joy. 13: still hunger. 12 or less: hunger.">
        <text class="fig-small" x="75" y="18" text-anchor="middle">Flood height (cubits)</text>
        <text class="fig-small" x="150" y="18">What the height meant</text>
        <rect class="fig-rect" x="20" y="28" width="110" height="34"/><text class="fig-label" x="75" y="51" text-anchor="middle">Above 16</text><text class="fig-label" x="150" y="51">Too much: planting comes late</text>
        <rect class="fig-rect" x="20" y="62" width="110" height="34"/><text class="fig-label" x="75" y="85" text-anchor="middle">16</text><text class="fig-label" x="150" y="85">Delight</text>
        <rect class="fig-rect" x="20" y="96" width="110" height="34"/><text class="fig-label" x="75" y="119" text-anchor="middle">15</text><text class="fig-label" x="150" y="119">Security</text>
        <rect class="fig-rect" x="20" y="130" width="110" height="34"/><text class="fig-label" x="75" y="153" text-anchor="middle">14</text><text class="fig-label" x="150" y="153">Joy</text>
        <rect class="fig-rect" x="20" y="164" width="110" height="34"/><text class="fig-label" x="75" y="187" text-anchor="middle">13</text><text class="fig-label" x="150" y="187">Still hunger</text>
        <rect class="fig-rect" x="20" y="198" width="110" height="34"/><text class="fig-label" x="75" y="221" text-anchor="middle">12 or less</text><text class="fig-label" x="150" y="221">Hunger</text>
      </svg>
    prompt: |-
      Imagine finding a scribe’s note from ancient Egypt: *“Poor harvest. Little grain came in as tax.”* It doesn’t say how high the flood was.

      Yusuf says, “Then the flood must have been too low.” Use the flood scale. Is Yusuf right?
    choices:
      - We can’t tell. Too little water or too much could both leave a poor harvest.
      - Yes. Only a flood that is too low can leave a poor harvest.
      - No. It must have been too high, since low floods still water the fields.
      - We can’t tell, because the flood had nothing to do with the harvest.
    answer: 0
    feedback:
      '1': Too low does fit the note. But look at the very top of the scale as well.
      '2': A flood that is too high does fit the note. But look at what the bottom of the scale says.
      '3': You are right that we can’t tell, but not for that reason. The scale shows that the flood’s height changed the harvest a lot.
    hints:
      - Which heights on the scale could leave a poor harvest? Find all of them, not only the first one you see.
      - Check both ends of the scale.
      - Yusuf found one part of the scale that fits the note. Is there another?
    solution:
      - Don’t start from Yusuf’s idea. Start from the note, and ask which floods could explain it.
      - A flood of 13 cubits or less meant hunger. A flood above 16 meant late planting, which could bring hunger too.
      - Both fit the note, so we can’t tell. To settle it, we would need that year’s reading from the nilometer.
      - 'What we learned: sometimes the honest answer is “this source doesn’t tell us”.'

  - id: b3
    level: 2
    thinking: model
    covers: [K1.6, S1.3]
    type: mc
    figure: |-
      <svg viewBox="0 0 480 304" class="fig-svg" role="img" aria-label="A simple route map, not to scale. The Silk Road runs from Chang'an through Samarkand to Antioch. The Royal Road runs from Susa to Sardis, and it crosses the Silk Road. The trans-Saharan route runs from Sijilmasa through Taghaza to Timbuktu. The dashed Red Sea and Indian Ocean route runs from Berenice to Muziris. These last two routes touch no other route.">
        <polyline points="440,75 310,45 120,125" fill="none" stroke="currentColor" stroke-width="3"/>
        <line x1="270" y1="150" x2="70" y2="40" stroke="currentColor" stroke-width="3"/>
        <polyline points="40,170 40,215 40,260" fill="none" stroke="currentColor" stroke-width="3"/>
        <line class="fig-arrow" x1="170" y1="205" x2="400" y2="255" style="stroke-width:3"/>
        <circle class="fig-hl" cx="440" cy="75" r="6"/><text class="fig-label" x="440" y="99" text-anchor="middle">Chang’an</text>
        <circle class="fig-hl" cx="310" cy="45" r="6"/><text class="fig-label" x="310" y="32" text-anchor="middle">Samarkand</text>
        <circle class="fig-hl" cx="120" cy="125" r="6"/><text class="fig-label" x="120" y="149" text-anchor="middle">Antioch</text>
        <circle class="fig-hl" cx="270" cy="150" r="6"/><text class="fig-label" x="270" y="174" text-anchor="middle">Susa</text>
