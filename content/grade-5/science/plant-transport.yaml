id: plant-transport
grade: 5
subject: science
organizingIdea: SCI-OI4
outcomes: [SCI5-OI4-GQ1-LO1]
order: 9
title: 'Plant Transport: Xylem and Phloem'
shortTitle: 'Plant transport: xylem and phloem'
summary: >-
  Watch water climb the xylem and sugars travel through the phloem, stand a celery stalk in blue water,
  and compare a plant's transport system with your circulatory system.

bigIdea: |-
  - Plants are complex organisms too. Their **transport system** has two kinds of tubes:
    - **Xylem** carries water and nutrients up from the roots.
    - **Phloem** carries sugars from the leaves to the rest of the plant.
  - Together they do a job like the **circulatory system** in animals.

lesson:
  - title: Two kinds of tubes
    blocks:
      - type: visual
        covers: [K2.1, K2.3, K2.4, S2.1]
        component: plant-transport
        caption: Switch between **Xylem**, **Phloem** and **Both**. Follow the dots to see what each one carries, and which way.
      - type: compare
        covers: [K2.3, K2.4]
        columns:
          - title: Xylem
            body: Carries **water and nutrients** from the **roots** to the rest of the plant.
          - title: Phloem
            body: Carries **sugars** from the **leaves** to the rest of the plant.

  - title: 'Virtual experiment: a celery stalk in blue water'
    blocks:
      - type: experiment
        covers: [K2.3, S2.1, K2.1]
        title: Stand a celery stalk in coloured water
        question: A fresh celery stalk, with its leaves, stands in a glass of water with **blue food colouring**. Wait one day.
        animation: celery-dye
        predict:
          choices:
            - The blue colour climbs the stalk into the leaves.
            - The blue colour stays in the glass.
            - Only the outside of the stalk turns blue.
          answer: 0
        observe: |-
          Blue colour climbed up **thin tubes** inside the stalk and reached the **leaves**. A cut across the stalk
          showed a row of blue dots.
        explain: |-
          - The blue dots are the **xylem** tubes.
          - Xylem carries water, and anything dissolved in it, **up** through the plant to the leaves.

  - title: Like a circulatory system
    blocks:
      - type: table
        covers: [K2.2, U2.1, S2.1]
        headers: ['', Animal circulatory system, Plant transport system]
        rows:
          - ['Tubes', 'Blood vessels', 'Xylem and phloem']
          - ['What moves', 'Blood carrying oxygen and nutrients', 'Water, nutrients and sugars']
          - ['Why it matters', 'Every part of the body gets what it needs', 'Every part of the plant gets what it needs to survive']
      - type: callout
        variant: mistake
        covers: [K2.3, K2.4]
        title: Don't mix them up
        body: |-
          **X**ylem carries water **up** from the roots. **Ph**loem carries sugars **from** the leaves. A memory trick:
          **ph**loem carries **f**ood (sugars).

keyTerms:
  - term: Xylem
    covers: [K2.3]
    definition: Tubes in a plant that carry water and nutrients from the roots to the rest of the plant.
  - term: Phloem
    covers: [K2.4]
    definition: Tubes in a plant that carry sugars from the leaves to the rest of the plant.
  - term: Transport system
    covers: [K2.1, U2.1]
    definition: Parts of an organism that move materials to where they are needed. In plants, the xylem and phloem.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K2.4, K2.1]
    type: mc
    prompt: A plant has two kinds of transport tubes. Which kind carries **sugars** away from the leaves?
    choices: [Phloem, Xylem, Both kinds, Neither kind]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Xylem starts at the other end of the plant. What does it carry, and from where?
      '2': Each kind of tube has its own cargo. Think back to the visual, where you switched between them.
      '3': The sugars do travel. Leaves aren’t the only part of a plant that needs them.
    hints:
      - Remember the memory trick in the lesson. Which tube carries food?
    solution:
      - '**Phloem** carries sugars from the leaves to the rest of the plant.'
      - Xylem has the other job. It carries water and nutrients from the roots.

  - id: w2
    level: 1
    thinking: apply
    covers: [K2.3, S2.1]
    type: mc
    figure: >-
      <svg viewBox="0 0 300 130" class="fig-svg fig-svg--square" role="img" aria-label="A slice of celery seen from above, a curved shape with a row of five red dots inside it.">
      <path class="obj" d="M40 45 Q150 5 260 45 Q270 95 225 110 Q150 80 75 110 Q30 95 40 45 Z"/>
      <circle fill="#d32f2f" cx="72" cy="64" r="7"/><circle fill="#d32f2f" cx="110" cy="50" r="7"/><circle fill="#d32f2f" cx="150" cy="45" r="7"/><circle fill="#d32f2f" cx="190" cy="50" r="7"/><circle fill="#d32f2f" cx="228" cy="64" r="7"/></svg>
    prompt: Farid stands a celery stalk in **red** water overnight, then cuts across it. He sees a row of red dots. What is each dot?
    choices:
      - A xylem tube that was cut across
      - A phloem tube that was cut across
      - A tiny blood vessel that was cut across
      - A drop that soaked in from the outside
    answer: 0
    feedback:
      '1': Phloem carries sugars from the leaves. The red came from the water in the glass. Which tube carries water?
      '2': The red colour is only food colouring. Blood vessels belong to animals.
      '3': If the colour had soaked in from the outside, where would you expect to see most of it?
    hints:
      - Where did the red colour start, and what was it mixed into?
      - Which tube carries water up from the bottom of a plant?
    solution:
      - The red colour was mixed into the water, so it travelled wherever the water went.
      - Water climbs through the **xylem**, so each dot is a xylem tube, cut across like the end of a straw.

  - id: w3
    level: 1
    thinking: recall
    covers: [K2.2]
    type: text
    prompt: Xylem and phloem do a job like one of the systems in your body. Which system? Type its name.
    accept: [circulatory, circulatory system, the circulatory system]
    hints:
      - Which system in your body moves things around in tubes?
      - Its tubes are called blood vessels.
    solution:
      - The **circulatory** system. It moves blood through blood vessels, and xylem and phloem are a plant’s tubes for moving materials.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K2.4, K2.3, S2.1]
    type: multi
    figure: >-
      <svg viewBox="0 0 420 262" class="fig-svg" role="img" aria-label="A plant with a carrot root under the ground, a stem, a leaf on each side and a fruit at the top. Arrow A goes from the right leaf down to the root and is labelled sugar. Arrow B goes from the right leaf up to the fruit and is labelled sugar. Arrow C goes from the root up to the left leaf and is labelled water. Arrow D goes from the soil into the root and is labelled sugar.">
      <rect class="sci-ground" x="10" y="186" width="400" height="72"/>
      <line class="obj-line" x1="210" y1="190" x2="210" y2="50"/>
      <ellipse class="obj" cx="295" cy="112" rx="50" ry="17"/>
      <ellipse class="obj" cx="125" cy="112" rx="50" ry="17"/>
      <line class="obj-line" x1="210" y1="118" x2="248" y2="112"/>
      <line class="obj-line" x1="210" y1="118" x2="172" y2="112"/>
      <circle class="obj" cx="210" cy="36" r="16"/>
      <path class="obj" d="M193 188 L227 188 L210 250 Z"/>
      <line class="obj-string" x1="268" y1="128" x2="226" y2="196"/><polygon class="obj-window" points="222,204 232,198 222,191"/>
      <line class="obj-string" x1="272" y1="96" x2="232" y2="46"/><polygon class="obj-window" points="226,38 238,44 229,52"/>
      <line class="obj-string" x1="196" y1="200" x2="148" y2="132"/><polygon class="obj-window" points="142,124 155,131 145,138"/>
      <line class="obj-string" x1="96" y1="226" x2="192" y2="226"/><polygon class="obj-window" points="200,226 190,220 190,232"/>
      <text class="sci-text" x="262" y="172">A: sugar</text>
      <text class="sci-text" x="262" y="68">B: sugar</text>
      <text class="sci-text" x="82" y="172">C: water</text>
      <text class="sci-text" x="26" y="231">D: sugar</text></svg>
    prompt: Each arrow shows something moving in or into this plant. Select **all** the arrows that show the **phloem** at work.
    choices: [Arrow A, Arrow B, Arrow C, Arrow D]
    fixedOrder: true
    answer: [0, 1]
    hints:
      - For each arrow, ask two things. What is moving, and where did it start?
      - Phloem carries sugars from the leaves to the **rest** of the plant. Does the rest of the plant only lie below the leaves?
    solution:
      - ✓ **A** carries sugar from a leaf down to the root. That is how a carrot gets to be sweet.
      - ✓ **B** carries sugar from a leaf up to the fruit. Phloem isn’t a one-way trip downward. It goes wherever the rest of the plant is.
      - ✗ **C** is water going from the root to a leaf, which is the xylem’s job.
      - ✗ **D** starts in the soil. A plant’s sugars come from its leaves, not from the ground.

  - id: b2
    level: 2
    thinking: model
    covers: [K2.3, U2.1]
    type: mc
    prompt: |-
      Mr. Fenn’s bean plant is drooping, so he waters it. It droops more. He waters it again, until the soil is soggy.
      When he digs it up, he finds that grubs have eaten most of its roots. Why is the plant drooping in soggy soil?
    choices:
      - Without its roots, the plant can’t get water into its xylem.
      - The wet stem has soaked up so much water that it is too heavy.
      - The phloem is carrying all the extra water away from the leaves.
      - The xylem is now pushing the extra water down from the leaves.
    answer: 0
    feedback:
      '1': There is plenty of water in the soil. But is it getting into the plant at all? Look at what the grubs ate.
      '2': Phloem has a different cargo. Which tube carries water, and where does that tube start?
      '3': Which way does xylem carry water? Where does the water get in?
    hints:
      - Is the plant short of water in the soil, or short of water inside it?
      - Where does water have to enter a plant to reach the xylem?
    solution:
      - The soil has lots of water, so the problem must be getting it **into** the plant.
      - Xylem carries water from the roots. With most of the roots gone, little water gets in, so little climbs to the leaves.
      - What we learned is that a plant can go thirsty in wet soil, because water in the ground isn’t the same as water in the tubes.

  - id: b3
    level: 2
    thinking: notice
    covers: [K2.3, S2.1]
    type: mc
    figure: >-
      <svg viewBox="0 0 420 96" class="fig-svg" role="img" aria-label="Five celery slices in a row, numbered 1 to 5 from the bottom of the stalk to the top. Slices 1, 2 and 3 each have three blue dots in the same three spots. Slices 4 and 5 have no dots.">
      <ellipse class="obj" cx="50" cy="40" rx="36" ry="24"/><ellipse class="obj" cx="130" cy="40" rx="36" ry="24"/><ellipse class="obj" cx="210" cy="40" rx="36" ry="24"/><ellipse class="obj" cx="290" cy="40" rx="36" ry="24"/><ellipse class="obj" cx="370" cy="40" rx="36" ry="24"/>
      <circle fill="#2563eb" cx="32" cy="46" r="6"/><circle fill="#2563eb" cx="50" cy="32" r="6"/><circle fill="#2563eb" cx="68" cy="46" r="6"/>
      <circle fill="#2563eb" cx="112" cy="46" r="6"/><circle fill="#2563eb" cx="130" cy="32" r="6"/><circle fill="#2563eb" cx="148" cy="46" r="6"/>
      <circle fill="#2563eb" cx="192" cy="46" r="6"/><circle fill="#2563eb" cx="210" cy="32" r="6"/><circle fill="#2563eb" cx="228" cy="46" r="6"/>
      <text class="sci-small" x="50" y="86" text-anchor="middle">1 (bottom)</text><text class="sci-small" x="130" y="86" text-anchor="middle">2</text><text class="sci-small" x="210" y="86" text-anchor="middle">3</text><text class="sci-small" x="290" y="86" text-anchor="middle">4</text><text class="sci-small" x="370" y="86" text-anchor="middle">5 (top)</text></svg>
    prompt: |-
      Zofia stands a celery stalk in blue water for an hour. Then she cuts it into thin slices and lays them out in
      order, from the bottom of the stalk to the top. Why are the blue dots in the **same spots** in slices 1, 2 and 3?
    choices:
      - Each dot is one long tube, and it was cut in three places.
      - Each slice took in its own blue water from the glass.
      - The blue water fell from the leaves and landed in those spots.
      - The knife dragged the blue colour from one slice to the next.
    answer: 0
    feedback:
      '1': Only the bottom of the stalk stood in the glass. How could slice 3 reach the water by itself?
      '2': Look at slices 4 and 5, nearest the leaves. Is there any blue up there?
      '3': A knife might smear colour, but would it leave neat dots in the very same spots?
    hints:
      - Imagine a bundle of drinking straws. What do you see if you slice across the bundle in three places?
      - What do slices 4 and 5 tell you about which way the colour was travelling?
    solution:
      - Picture a bundle of straws. Slice it anywhere, and the same round holes appear in the same places.
      - So the three dots are **three long xylem tubes**, running up the stalk.
      - Slices 4 and 5 add another clue. After one hour, the blue had climbed past slice 3 but hadn’t yet reached slice 4.

  - id: b4
    level: 2
    thinking: connect
    covers: [K2.2, K2.4]
    type: mc
    prompt: Deep in the ground, the tip of a root grows in the dark. It is far from any leaf, yet sugars from the leaves still reach it. Which thing in **your** body is most like this?
    choices:
      - Blood bringing nutrients all the way to your toes
      - Your stomach breaking down the food in your lunch
      - Your lungs taking in oxygen from the air
      - Your bones holding up your whole body
    answer: 0
    feedback:
      '1': The stomach is more like a place where food gets broken down. Is anything being delivered far away?
      '2': Lungs do take in something the body needs. But which system carries it from there to the far parts of you?
      '3': Bones hold things up, but what is the root tip story about? Is anything travelling?
    hints:
      - What is really happening to the root tip? Something is being delivered.
      - Which part of you is farthest from your lunch, and how does food reach it?
    solution:
      - The root tip gets its sugars by **delivery**, through phloem tubes.
      - Your toes get nutrients the same way, carried by blood through blood vessels. That is why xylem and phloem are compared to the circulatory system.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.3, K2.4, U2.1, S2.1]
    type: investigation
    figure: >-
      <svg viewBox="0 0 300 250" class="fig-svg fig-svg--square" role="img" aria-label="A young tree. Green leaves are at the top. Partway down the trunk is a bare ring with no bark. Just above the ring the trunk has a fat bulge. Below the ring the trunk is thin, and roots spread out under the ground.">
      <rect class="sci-ground" x="20" y="196" width="260" height="50"/>
      <ellipse class="obj" cx="150" cy="44" rx="78" ry="36"/>
      <path class="obj" d="M138 76 L162 76 L162 106 Q176 120 162 134 L138 134 Q124 120 138 106 Z"/>
      <rect class="obj obj--dark" x="141" y="134" width="18" height="16"/>
      <rect class="obj" x="138" y="150" width="24" height="46"/>
      <path class="obj-string" d="M144 196 L112 232 M150 196 L150 240 M156 196 L188 232"/>
      <text class="sci-small" x="176" y="118">bulge</text>
      <text class="sci-small" x="170" y="147">bare ring</text></svg>
    prompt: |-
      In winter, a hungry snowshoe hare chews the bark off a young birch tree, in a ring all the way around the trunk.
      The phloem lies just under the bark, so that ring of phloem is gone too. The xylem is deeper, and it isn’t hurt.

      By summer, the tree looks odd. Its leaves are still green, but a fat bulge has grown just **above** the ring.
    parts:
      - type: mc
        prompt: The leaves are above the chewed ring. How are they still getting water?
        choices:
          - The xylem isn’t cut, so water still climbs past the ring.
          - The phloem above the ring is bringing water to them.
          - The leaves take in all the rain they need to live on.
        answer: 0
        feedback:
          '1': What does phloem carry, and which way? Does it bring water from anywhere?
          '2': Rain lands on leaves, but where does a plant’s water get in, and how does it travel?
        hints:
          - Which kind of tube carries water? Did the hare reach it?
        solution:
          - Water travels in the xylem, and the hare didn’t reach the xylem. The water road is still open.
      - type: mc
        prompt: What has piled up inside the bulge, just above the ring?
        choices:
          - Sugars from the leaves that can’t get past the ring
          - Water from the roots that can’t get past the ring
          - Nutrients from the soil that can’t get past the ring
        answer: 0
        feedback:
          '1': Water comes from below, and its road isn’t blocked. If it were, which side of the ring would it pile up on?
          '2': Nutrients travel with the water in the xylem. Was that road blocked?
        hints:
          - Which road did the hare cut? Which way does that road’s cargo come from?
          - Think of a traffic jam at a broken bridge. On which side do the cars pile up?
        solution:
          - The phloem road is cut. Its cargo, sugars, comes **down from the leaves**.
          - Like cars stopped at a broken bridge, the sugars pile up on the side they arrive from, which is just above the ring.
      - type: mc
        prompt: A neighbour looks up and says, “The leaves are green, so that tree will be fine.” What will most likely happen in the end if the ring doesn’t heal?
        choices:
          - The roots die, so water stops coming, and then the leaves die too.
          - The leaves stay green for good, because the xylem was never cut.
          - The roots stay healthy by taking in sugars from the soil instead.
        answer: 0
        feedback:
          '1': The xylem isn’t cut, but where does xylem’s water get into the tree? What happens if that part dies?
          '2': Where do a plant’s sugars come from?
        hints:
          - Follow the chain. What happens to roots with no sugars? What do healthy roots do for the leaves?
        solution:
          - With no sugars, the roots slowly die. Dead roots can’t take in water, so the xylem has nothing to carry.
          - Then the leaves dry out, long after the hare has gone. The neighbour was looking at the wrong end of the tree.
    wrapUp: The two kinds of tubes depend on each other. The leaves feed the roots, and the roots water the leaves, so cutting one road slowly closes the other.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: flaw
    covers: [K2.3, S2.1]
    type: mc
    prompt: |-
      Nell’s uncle grows a tomato plant **upside down**, in a bucket hanging from the porch. The roots are in the bucket
      and the leaves hang down below it. Nell says, “That can’t work! Xylem carries water up, so water can’t get down to
      the leaves.” What is wrong with Nell’s idea?
    choices:
      - Xylem carries water from the roots to the rest of the plant, whichever way that is.
      - Upside down, the two tubes swap jobs, so now the phloem carries the water.
      - The leaves catch the water that drips from the bucket, so they don’t need xylem.
      - Nothing is wrong. With no way for water to reach its leaves, the plant will die.
    answer: 0
    feedback:
      '1': Do the tubes know which way up they are? What is each tube’s cargo, wherever the plant hangs?
      '2': Would a few drips reach every leaf? And what does the xylem do in this plant, now that the roots are in the bucket?
      '3': Nell’s idea sounds right, because we often say “up”. Why do we say it? Where are the roots on a plant in a garden?
    hints:
      - In the lesson, xylem carries water “up”. Why up? Where do the roots happen to be?
      - Try saying the xylem’s job without using the word “up”.
    solution:
      - Nell is remembering a true thing about ordinary plants. In a garden, the roots are at the bottom, so water going from the roots to the leaves goes up.
      - The real job of xylem is to carry water **from the roots to the rest of the plant**. In the bucket, the rest of the plant is below the roots.
      - The same goes for phloem. On this plant, sugars from the leaves travel upward to reach the roots.
