    prompt: |-
      The **up** arrow is the buoyant force. The **down** arrow is the weight. A longer arrow means a bigger force.
      Which block is floating **still**, not rising and not sinking?
    choices: [Block A, Block B, Block C]
    fixedOrder: true
    answer: 1
    feedback:
      '0': The up arrow on Block A is the shorter one. Which way would the bigger force move it?
      '2': The up arrow on Block C is the longer one. Which way would the bigger force move it?
    hints:
      - Look at the two arrows on each block. When would neither force win?
    solution:
      - A block stays still when neither force is bigger, so look for two arrows of the same length.
      - Block **B** floats still. Block A is sinking, because its buoyant force is less than its weight. Block C is rising.

  - id: w3
    level: 1
    thinking: apply
    covers: [K2.1, K2.3]
    type: mc
    prompt: A coin rests on the bottom of a fountain. Which sentence is true?
    choices:
      - The water pushes up on the coin, but with less force than its weight.
      - The water pushes up on the coin with a force equal to its weight.
      - The water stopped pushing on the coin at the moment it sank.
      - The water pushes down on the coin and holds it on the bottom.
    answer: 0
    feedback:
      '1': If the two forces were equal, what would the coin do in water? Did it do that?
      '2': A fluid pushes up on anything placed in it. Is the coin still in the water?
      '3': Which way does the buoyant force from a fluid always point?
    hints:
      - The coin is still in a fluid. What does a fluid always do to things placed in it?
      - The coin went down. Which force must have been bigger?
    solution:
      - The coin is in water, so the water still pushes **up** on it.
      - The coin sank, so that push is **less than** its weight.

  - id: w4
    level: 1
    thinking: notice
    covers: [S2.4, S2.3]
    type: multi
    prompt: Your class is building small boats and testing them in tubs of water, all filled to the same level. Select every **safety problem** you should fix before testing starts.
    choices:
      - Water has dripped on the floor where people walk.
      - A plugged-in hot glue gun is sitting beside a tub.
      - Open scissors are lying at the edge of a table.
      - The boats are painted different colours.
      - The tubs are only half full.
      - Two groups are sharing one roll of tape.
    answer: [0, 1, 2]
    feedback:
      '3': Colours can’t hurt anyone, and every boat can look different.
      '4': A half-full tub is safer. It is less likely to slosh over.
      '5': Sharing is fine, as long as nobody grabs or rushes.
    hints:
      - Picture someone walking past each thing. What could hurt them?
      - Think about slipping, cutting, and water getting near electricity.
    solution:
      - Look at each one and ask, “Could someone get hurt?”
      - A wet floor can make someone slip, so wipe it up.
      - Electricity and water don’t mix, so move the glue gun away from the tub.
      - Scissors should be closed and away from the edge, so nobody gets cut.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [K2.2, U2.1, S2.1]
    type: mc
    figure: { kind: forces, object: boat, water: true, forces: [{ kind: buoyant, size: 1.5 }, { kind: weight }] }
    prompt: |-
      A toy boat floats still on a pond. Hana draws these arrows and says, “The push must be bigger than the
      weight. If they were only equal, the boat would start to sink.”

      If Hana’s drawing were right, what would you see the boat doing?
    choices:
      - Moving up in the water, instead of staying still
      - Sitting still, just as it does on the pond
      - Slowly going down, because the push is so big
      - Moving sideways across the pond
    answer: 0
    feedback:
      '1': That is what the boat really does. Would it do that if one force were bigger than the other?
      '2': Which way does the buoyant force point? Would making it bigger send the boat that way?
      '3': These two forces act up and down. Which way would the bigger one move the boat?
    hints:
      - Pretend Hana is right. What did the helium balloon do when the push was bigger than its weight?
      - Compare what Hana’s arrows would make happen with what the boat really does.
    solution:
      - 'Test Hana’s idea by imagining it. A helium balloon has a push bigger than its weight, and it **rises**.'
      - So a boat with Hana’s arrows would be moving up. It isn’t. It stays still, so the push and the weight must be **equal**.
      - 'Hana’s mistake: equal forces don’t make a boat sink. It sinks only when the push is **less than** the weight.'

  - id: b2
    level: 2
    thinking: connect
    covers: [K2.1, U2.1, S2.1]
    type: mc
    prompt: |-
      Ali finds a big rock on the bottom of a shallow lake and lifts it. Under the water, it feels quite light.
      The moment it comes out of the water, it feels much heavier. What is the best explanation?
    choices:
      - The water’s push was helping Ali hold it up while it was under.
      - The rock’s weight grew as it came out into the air.
      - The rock has no weight at all while it is under water.
      - Air pushes the rock down, but water doesn’t push on it at all.
    answer: 0
    feedback:
      '1': It is the same rock, with the same amount of matter. Why would its weight change?
      '2': Weight comes from gravity. If the rock had no weight under water, why did it stay on the bottom?
      '3': Air and water are both fluids. Which way does a fluid push on things placed in it?
    hints:
      - The rock didn’t change. So what was different around it?
      - List the forces on the rock while it is under water. Then list them when it is out.
    solution:
      - Start with what stayed the same. It is the same rock, so it has the same **weight**.
      - Under water, the water pushes up on the rock. Ali only has to supply the rest of the force.
      - Out of the water, that big push is gone, so Ali has to hold up nearly all the weight alone.

