      - The air is a fluid. Which way does it push on the balloon?
      - For each balloon, ask which force is winning, if any.
      - The balloon with 3 clips isn’t going up or down. What does that tell you about the two forces?
    solution:
      - Air is a fluid, so the same comparison works here as in water.
      - Rising means the push is the bigger force. Staying still means the two are equal. Drifting down means the push is the smaller force.
      - The clips add weight, while the air’s push stays about the same.
      - 'Compare this with the clay boat: there the weight stayed the same and the push changed. Here the weight changes.'

  - id: b4
    level: 2
    thinking: flaw
    covers: [K2.2, U2.1, S2.1]
    type: mc
    prompt: The same apple floats in tap water and in salt water. In salt water it sits a little higher. Which friend is right about the buoyant force on the apple?
    choices:
      - '**Sofia:** “It’s the same in both, because the apple’s weight is the same in both.”'
      - '**Ana:** “It’s bigger in salt water, because salt water pushes up harder than tap water.”'
      - '**Dee:** “It’s smaller in salt water, because less of the apple is under the water.”'
      - '**Eli:** “You can’t compare them unless someone tells you how heavy the apple is.”'
    answer: 0
    feedback:
      '1': This feels right, because salt water did push harder on the egg. But what does **floating** tell you about the two forces? And what would an apple do if the push were bigger than its weight?
      '2': Sitting higher is a real clue, but it doesn’t mean a smaller push. If the push were less than the apple’s weight, what would the apple do?
      '3': You don’t need a number. Whatever the apple weighs, did that weight change between the glasses?
    hints:
      - What do you know for sure about the two forces on anything that floats?
      - Say that rule once for the tap water glass, then once for the salt water glass.
      - Did the apple’s weight change between the two glasses?
    solution:
      - Start with what floating means. A floating object has a buoyant force **equal to** its weight.
      - That is true in both glasses, and the apple’s weight is the same in both. So the buoyant force is the same in both.
      - Why does Ana’s idea seem right? The egg’s push really did grow, because in tap water it was less than the egg’s weight. The apple’s push already matched its weight.
      - So why does the apple sit higher in salt water? Salt water holds things up better, so less of the apple needs to be under the water to get the same push.
      - 'What we learned: when something floats, you already know the size of the buoyant force. It equals the weight, in any liquid.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.2, K2.3, U2.1, S2.1]
    type: investigation
    figure: >-
      <svg viewBox="0 0 420 150" class="fig-svg" role="img" aria-label="Two toy boats on water. The empty boat sits high, with only a little of it under the water. The boat holding 5 marbles sits low, with most of it under the water.">
      <path class="obj" d="M30 44 L170 44 L150 84 L50 84 Z"/>
      <path class="obj" d="M250 62 L390 62 L370 102 L270 102 Z"/>
      <circle class="obj obj--dark" cx="290" cy="93" r="6"/><circle class="obj obj--dark" cx="305" cy="93" r="6"/><circle class="obj obj--dark" cx="320" cy="93" r="6"/><circle class="obj obj--dark" cx="335" cy="93" r="6"/><circle class="obj obj--dark" cx="350" cy="93" r="6"/>
      <rect class="sci-water" x="4" y="72" width="192" height="58"/><line class="sci-surface" x1="4" y1="72" x2="196" y2="72"/>
      <rect class="sci-water" x="224" y="72" width="192" height="58"/><line class="sci-surface" x1="224" y1="72" x2="416" y2="72"/>
      <text class="fig-small" x="100" y="146" text-anchor="middle">Empty</text><text class="fig-small" x="320" y="146" text-anchor="middle">With 5 marbles</text></svg>
    prompt: |-
      Priya’s toy boat floats on a tub of tap water. She adds marbles one at a time. With each marble, the boat sits
      a little lower, but it still floats. At last, the water reaches the very top of the boat’s sides. One more
      marble, and the boat sinks.
    parts:
      - type: mc
        prompt: Compare the empty boat with the boat holding 5 marbles. On which one does the water push up **harder**?
        choices:
          - The boat with 5 marbles
          - The empty boat
          - The push is the same on both
        answer: 0
        feedback:
          '1': The marbles do press the boat down. But both boats are floating. What does floating tell you about the push and the weight?
          '2': It is the same boat in the same water, so this seems right. But did anything about the boat’s total weight change?
        hints:
          - Both boats are floating. What must be true of the push and the weight on each one?
          - Which boat has more weight for the push to match?
        solution:
          - Both boats float, so on each one the push **equals** the weight.
          - The marbles add weight, so the push on that boat must be bigger too.
      - type: mc
        prompt: It is the same water, yet the push got bigger. Look at the picture. Where does the extra push come from?
        choices:
          - More of the boat is under the water, taking up more space there.
          - The marbles are pushing up on the boat from the inside.
          - The marbles have made all the water in the tub heavier.
          - The bottom of the tub is pushing the boat back up.
        answer: 0
        feedback:
          '1': Marbles have weight. Which way does weight act?
          '2': The marbles are in the boat, not in the water. Did the water change at all?
          '3': Is the boat touching the bottom of the tub?
        hints:
          - What looks different between the two boats in the picture?
          - Remember the clay ball and the clay boat. Why did the water push harder on the boat?
        solution:
          - The picture shows the loaded boat sitting lower, so more of it is under the water.
          - As with the clay boat, taking up more space in the water means the water pushes up harder.
      - type: mc
        prompt: Why does that last marble sink the boat, when the other marbles didn’t?
        choices:
          - It can’t sit any lower, so the push can’t grow to match the weight.
          - That last marble must weigh much more than each of the other marbles.
          - The water reaches the top of the sides, so it stops pushing up.
          - The boat has now become heavier than all of the water in the tub.
        answer: 0
        feedback:
          '1': The story doesn’t say the marbles are different. Why might a same-sized marble do something new this time?
          '2': A rock on the bottom of a pond still has water pushing up on it. Does the push really stop?
          '3': The story never compares the boat with the water in the tub. Which two forces decide whether something sinks?
        hints:
          - Each marble so far made the boat sit lower. What can the boat no longer do now?
          - Compare the push and the weight after the last marble goes in.
        solution:
          - Until now, each new marble made the boat sit lower, and the water pushed harder to match the new weight.
          - With the water at the very top of the sides, there is no more boat to put under water. The weight goes up, but the push can’t keep up.
          - Now the push is **less than** the weight, so the boat sinks.
    wrapUp: |-
      On a floating boat, the push always matches the weight. Add weight and the boat sits lower until the water
      pushes just as hard. When it can’t sit any lower, it sinks.

  - id: d2
    level: 3
    thinking: evidence
    covers: [S2.2, U2.1, S2.1]
    type: investigation
    prompt: |-
      Noor’s class tested four tiny plastic animals in three fluids, using the same animal in every glass. When Noor copied
      the results from the class notes, she copied **one result wrong**.

      | Animal | Vegetable oil | Tap water | Salt water |
      |---|---|---|---|
      | Frog | sinks | sinks | floats |
      | Hippo | sinks | floats | sinks |
      | Moose | sinks | floats | floats |
      | Yak | floats | floats | floats |
    parts:
      - type: mc
        prompt: |-
          Remember the egg, which sank in tap water and floated in salt water. Salt water can hold up things that tap water
          can’t. Which animal’s row holds Noor’s mistake?
        choices:
          - Hippo
          - Frog
          - Moose
          - Yak
        answer: 0
        feedback:
          '1': Frog sinks in tap water and floats in salt water. Did the egg do the same thing or the opposite?
          '2': Moose floats in tap water. If tap water can hold it up, what should salt water do?
          '3': Yak floats in tap water. If tap water can hold it up, what should salt water do?
        hints:
          - Look only at the Tap water and Salt water columns. If tap water can hold an animal up, what should salt water do?
          - Which row has an animal doing the opposite of what the egg did?
        solution:
          - The egg shows that salt water holds things up better than tap water. So anything that floats in tap water must float in salt water too.
          - Hippo floats in tap water but sinks in salt water. That can’t happen, so the mistake is in **Hippo’s** row.
