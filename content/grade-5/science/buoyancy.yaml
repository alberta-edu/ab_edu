    feedback:
      '1': Which way does the push point? If it were the smaller force, which way would the balloon go?
      '2': The balloon still has weight when it stays still, and the air still surrounds it. What does staying still tell you about two forces?
      '3': If the two forces were equal, would the balloon be rising? Look at what each balloon is doing.
