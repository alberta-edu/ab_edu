      </svg>
    prompt: Sana is in the gym, taping paper clips to a helium balloon’s string, one at a time. Compare the **push from the air** with the **total weight** of the balloon and clips each time.
    choices:
      - '2 clips: push greater than weight. 3 clips: push equal to weight. 4 clips: push less than weight.'
      - '2 clips: push less than weight. 3 clips: push equal to weight. 4 clips: push greater than weight.'
      - '2 clips: push greater than weight. 3 clips: no forces at all. 4 clips: push less than weight.'
      - '2 clips: push equal to weight. 3 clips: push greater than weight. 4 clips: push less than weight.'
