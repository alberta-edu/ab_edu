id: buoyancy
grade: 5
subject: science
organizingIdea: SCI-OI2
outcomes: [SCI5-OI2-GQ1-LO1]
order: 4
title: 'Buoyancy: Why Things Float or Sink'
shortTitle: Buoyancy
summary: >-
  Drop objects into water, salt water and oil, compare the buoyant force with each object's weight, and
  find out why the same egg sinks in one glass and floats in another.

bigIdea: |-
  - A fluid pushes **up** on anything placed in it. This push is the **buoyant force**.
  - Buoyant force **equal to** the object's weight: it floats.
  - Buoyant force **less than** the weight: it sinks.

lesson:
  - title: The buoyant force
    blocks:
      - type: visual
        covers: [K2.1, K2.2, K2.3, S2.1]
        component: float-lab
        props: { start: wood }
        caption: |-
          Drop an object in. When it stops moving, compare the two arrows: **weight** pulls down, and the **buoyant
          force** from the fluid pushes up.
      - type: text
        covers: [K2.1]
        body: The **buoyant force** is an upward force from a fluid. It opposes the **weight** of anything placed in the fluid.

  - title: Float or sink?
    blocks:
      - type: compare
        covers: [K2.2, K2.3, U2.1]
        columns:
          - title: Floats
            figure: { kind: forces, object: block, water: true, forces: [{ kind: buoyant }, { kind: weight }] }
            body: Buoyant force **equals** weight. The object floats on the surface.
          - title: Sinks
            figure: { kind: forces, object: block, water: true, forces: [{ kind: buoyant, size: 0.45 }, { kind: weight }] }
            body: Buoyant force is **less than** weight. The object sinks.
      - type: callout
        variant: mistake
        covers: [K2.1, K2.3]
        title: Sinking things still feel a buoyant force
        body: A rock at the bottom of a pond still has the water pushing up on it. The push is just **smaller** than the rock's weight.

  - title: 'Virtual experiment: one egg, two fluids'
    blocks:
      - type: experiment
        covers: [S2.2, K2.2, K2.3, U2.1]
        title: Put an egg in tap water and in salt water
        question: |-
          Two glasses hold the same amount of liquid:

          - **tap water**
          - **salt water** (salt stirred in)

          The same kind of egg goes into each glass.
        animation: egg-float
        predict:
          choices:
            - It sinks in both.
            - It floats in both.
            - It sinks in tap water but floats in salt water.
            - It floats in tap water but sinks in salt water.
          answer: 2
        observe: |-
          The egg **sank** to the bottom of the tap water. In the **salt water**, the same kind of egg **floated**.
        explain: |-
          - The egg's weight was the same in both glasses. Only the **fluid** was different.
          - In tap water, the buoyant force was **less than** the egg's weight, so it sank.
          - Salt water pushed up harder. The buoyant force was **equal to** the egg's weight, so it floated.
      - type: callout
        variant: tip
        covers: [S2.2]
        title: A fair test
        body: Only one thing changed, the fluid, so the fluid must be what made the difference. Change just **one thing** at a time.

  - title: Gases are fluids too
    blocks:
      - type: figure
        covers: [K2.4, K2.1]
        figure: { kind: forces, object: balloon, forces: [{ kind: buoyant, size: 1.5 }, { kind: weight, size: 0.6 }] }
        caption: |-
          **Air** pushes up on a helium balloon. The buoyant force is greater than the balloon's weight, so the
          balloon rises.
      - type: table
        covers: [K2.4]
        caption: Fluids include liquids and gases
        headers: [Fluid, Liquid or gas?]
        rows:
          - ['Water', 'Liquid']
          - ['Vegetable oil', 'Liquid']
          - ['Air', 'Gas']

  - title: Shape it to float
    blocks:
      - type: visual
        covers: [S2.3, K2.2, K2.3]
        component: float-lab
        props: { start: clay-ball }
        caption: |-
          Drop the **Clay ball** in tap water, then the **Clay boat**. It is the same lump of clay, so it has the same
          weight.
      - type: compare
        covers: [S2.3, U2.1]
        columns:
          - title: Clay ball
            body: Buoyant force is **less than** its weight. It sinks.
          - title: Clay boat
            body: |-
              - Same clay, now a wide boat that holds air.
              - It takes up much more space, so the water pushes up harder.
              - Buoyant force **equals** its weight. It floats.

keyTerms:
  - term: Buoyant force
    covers: [K2.1]
    definition: An upward force from a fluid that opposes the weight of anything placed in the fluid.
  - term: Float
    covers: [K2.2]
    definition: To stay on the surface of a liquid. It happens when the buoyant force equals the object's weight.
  - term: Sink
    covers: [K2.3]
    definition: To go down in a fluid. It happens when the buoyant force is less than the object's weight.
  - term: Fluid
    covers: [K2.4]
    definition: A substance that can flow. Fluids include liquids and gases.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
