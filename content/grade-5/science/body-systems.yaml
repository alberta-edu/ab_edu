id: body-systems
grade: 5
subject: science
organizingIdea: SCI-OI4
outcomes: [SCI5-OI4-GQ1-LO1]
order: 8
title: Human Body Systems
shortTitle: Human body systems
summary: >-
  Explore the digestive, respiratory, circulatory and musculoskeletal systems, then follow a breath and a
  bite of food as three systems team up to feed a muscle.

bigIdea: |-
  Humans are complex organisms. Inside the body, **biological systems** carry out vital processes like
  movement, nutrition and respiration. The systems **rely on each other**: the digestive, respiratory and
  circulatory systems work together to supply the body with oxygen and nutrients.

lesson:
  - title: Four body systems
    blocks:
      - type: visual
        covers: [K1.3, S1.3, S1.2]
        component: body-systems
        props: { start: digestive }
        caption: Choose a system to see its major parts. The picture shows a person facing you, so their right side is on your left.
      - type: table
        covers: [K1.4, K1.5, K1.6, K1.7, S1.2, S1.3]
        headers: [System, What it does, Major parts]
        rows:
          - ['**Digestive**', 'Breaks down food and absorbs nutrients', 'Mouth, stomach, intestines, liver, pancreas']
          - ['**Respiratory**', 'Exchanges oxygen and carbon dioxide', 'Trachea, lungs, diaphragm']
          - ['**Circulatory**', 'Moves blood around the body', 'Heart, blood vessels']
          - ['**Musculoskeletal**', 'Supports and moves the body', 'Muscles, bones']

  - title: Vital biological processes
    blocks:
      - type: table
        covers: [K1.2, S1.1, U1.1]
        caption: Processes that complex organisms need to stay alive and healthy
        headers: [Process, What it means, Systems that carry it out]
        rows:
          - ['🏃 **Movement**', 'Moving the body and its parts', 'Musculoskeletal']
          - ['🍎 **Nutrition**', 'Getting nutrients from food', 'Digestive, with the circulatory system carrying the nutrients']
          - ['🫁 **Respiration**', 'Taking in oxygen and getting rid of carbon dioxide', 'Respiratory, with the circulatory system carrying the oxygen']
          - ['📏 **Growth**', 'Getting bigger and stronger', 'All systems, using the nutrients and oxygen they deliver']
          - ['🐣 **Reproduction**', 'Making offspring', 'Other body systems']
      - type: callout
        variant: tip
        covers: [K1.3, S1.1]
        title: Not just humans
        body: Many other animals, like dogs, horses and birds, also have digestive, respiratory, circulatory and musculoskeletal systems.

  - title: 'Virtual experiment: feed a muscle'
    blocks:
      - type: experiment
        covers: [K1.8, S1.4, K1.1]
        title: Follow a breath and a bite of food
        question: Your arm muscle needs **oxygen** and **nutrients** to work. You take a breath and eat a bite of food.
        animation: body-trip
        predict:
          choices:
            - The digestive system carries them to the muscle.
            - The respiratory system carries them to the muscle.
            - The circulatory system carries them to the muscle.
            - The muscle makes them by itself.
          answer: 2
        observe: |-
          Oxygen went from the **lungs** into the blood. Nutrients went from the **intestines** into the blood. The
          **heart** pumped the blood through **blood vessels** to the arm muscle.
        explain: |-
          - The **respiratory** system brings in oxygen.
          - The **digestive** system breaks down food and absorbs nutrients.
          - The **circulatory** system carries both to every part of the body.
          - Each system relies on the others. Together they supply oxygen and nutrients.

  - title: Systems rely on each other
    blocks:
      - type: compare
        covers: [K1.1, K1.8, U1.1]
        columns:
          - title: Without the lungs
            body: The blood would have no oxygen to carry.
          - title: Without the intestines
            body: The blood would have no nutrients to carry.
          - title: Without the heart
            body: Oxygen and nutrients would never reach the muscles.
      - type: callout
        variant: mistake
        covers: [K1.5, K1.6]
        title: The lungs don't send air to your muscles
        body: Air stays in the lungs. Only the **oxygen** passes into the blood, and the **circulatory system** carries it.

keyTerms:
  - term: Biological system
    covers: [K1.1, K1.3]
    definition: A group of body parts that work together to carry out a vital process.
  - term: Digestive system
    covers: [K1.4]
    definition: Breaks down food and absorbs nutrients. Includes the mouth, stomach, intestines, liver and pancreas.
  - term: Respiratory system
    covers: [K1.5]
    definition: Exchanges oxygen and carbon dioxide. Includes the trachea, lungs and diaphragm.
  - term: Circulatory system
    covers: [K1.6]
    definition: Moves blood around the body. Includes the heart and blood vessels.
  - term: Musculoskeletal system
    covers: [K1.7]
    definition: Supports and moves the body. Includes muscles and bones.
  - term: Nutrients
    covers: [K1.4, K1.8]
    definition: The useful parts of food that the body absorbs and uses.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S1.3, K1.3, K1.4, K1.5]
    type: mc
    prompt: |-
      A prankster swapped **two labels** on the class poster. Which two?

      | System | Labels on the poster |
      |---|---|
      | Digestive | mouth, stomach, intestines, liver, trachea |
      | Respiratory | pancreas, lungs, diaphragm |
      | Circulatory | heart, blood vessels |
      | Musculoskeletal | muscles, bones |
    choices:
      - Trachea and pancreas
      - Liver and lungs
      - Stomach and diaphragm
      - Heart and muscles
    answer: 0
    feedback:
      '1': Which system do lungs belong to? Look again at where they are on the poster.
      '2': Which system does the diaphragm belong to? Look again at where it is on the poster.
      '3': The heart moves blood, and muscles move the body. Are those two in the right rows already?
    hints:
      - Go row by row. Does anything look out of place?
    solution:
      - The trachea carries air, so it belongs with the **respiratory** system.
      - The pancreas belongs with the **digestive** system. Swap those two, and every row is right.

  - id: w2
    level: 1
    thinking: whatif
    covers: [K1.7, S1.2]
    type: mc
    prompt: In a silly comic book, every bone in a hero’s body turns into cooked spaghetti. Which job of the body is in the most trouble?
    choices:
      - Holding the body up
      - Breaking down food
      - Taking in oxygen
      - Moving blood around
    answer: 0
    feedback:
      '1': That job belongs to the digestive system. Which system are bones part of?
      '2': That job belongs to the respiratory system. Which system are bones part of?
      '3': That job belongs to the circulatory system. Which system are bones part of?
    hints:
      - Which system are bones part of, and what does it do?
    solution:
      - Bones are part of the musculoskeletal system, which **supports** and moves the body.
      - Spaghetti can’t hold anything up. The hero becomes a puddle in a cape.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.2, S1.1, U1.1]
    type: mc
    prompt: Over one summer, a puppy gets much bigger and stronger. Which vital biological process does this show?
    choices: [Growth, Reproduction, Respiration, Movement]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Reproduction means making offspring. Did the puppy have puppies of its own?
      '2': Respiration means taking in oxygen and getting rid of carbon dioxide. What changed about this puppy?
      '3': Movement means moving the body and its parts. Is that the change this story describes?
    hints:
      - What changed about the puppy over the summer?
    solution:
      - Getting bigger and stronger is **growth**. Dogs have the same kinds of body systems you do, and they carry out the same processes.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: breakdown
    covers: [S1.4, K1.8, K1.4, K1.6]
    type: order
    prompt: You eat a bite of apple, and later your big toe muscle uses its nutrients. Put the trip in **order**.
    items:
      - Chewed in the mouth
      - Broken down more in the stomach
      - Nutrients absorbed from the intestines into the blood
      - Blood pumped by the heart
      - Carried through blood vessels to the toe
    hints:
      - Start where the food goes in. Which system does the work first?
      - At what step do the nutrients change from the digestive system to the circulatory system?
    solution:
      - The digestive system goes first. The mouth and stomach break the food down, and the intestines absorb the nutrients.
      - Then the circulatory system takes over. The heart pumps the blood, and blood vessels carry it to the toe.

  - id: b2
    level: 2
    thinking: evidence
    covers: [K1.8, S1.4, K1.5, K1.6]
    type: mc
    prompt: |-
      Zuri counts for one minute, first sitting, then right after a jog.

      | | Breaths | Heartbeats |
      |---|---|---|
      | Sitting | 18 | 75 |
      | After jogging | 34 | 130 |

      Why did **both** numbers go up? Which friend explains it best?
    choices:
      - 'Bell: “My legs need more oxygen. Lungs take it in, and the heart moves it in the blood.”'
      - 'Lou: “My legs need more air. It rushes down special tubes from my lungs to my legs.”'
      - 'Mia: “Only breathing really matters. The heartbeats just went up at the same time by chance.”'
      - 'Jae: “My stomach needs more oxygen while I jog, to break down the lunch I ate.”'
    answer: 0
    feedback:
      '1': Lots of people picture this, but where does air stop? What is it that passes into the blood?
      '2': Think about the oxygen once it is in the blood. What would happen if the blood kept moving at the same slow pace?
      '3': Which part of Zuri’s body was doing the extra work during the jog?
    hints:
      - Which part of the body was working harder? What does it need?
      - How does that thing get from the lungs to the legs?
    solution:
      - Working leg muscles need more oxygen, so Zuri breathes faster to bring more into her lungs.
      - Air stays in the lungs. Oxygen passes into the blood, and a faster heart carries it to the legs more quickly.
      - The two numbers rise together because the two systems are working as a team.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K1.4, S1.2, S1.3]
    type: mc
    prompt: |-
      Food never passes through the liver or the pancreas. Instead, they make juices that help break food down. Asha
      says, “No food goes through them, so they can’t be part of the digestive system.” What is wrong with her reasoning?
    choices:
      - A system includes any part that helps do its job, even if food never touches that part.
      - They belong to the circulatory system instead, because juices are liquids like the blood.
      - Nothing is wrong. Only the mouth, stomach and intestines are really in the digestive system.
      - Food does really pass through both of them, but only after the intestines have finished.
    answer: 0
    feedback:
      '1': What is the circulatory system’s job? Is making juice for food part of that?
      '2': Think about the digestive system’s job. Do these juices help with it?
      '3': The problem tells you that food never passes through them. Take that as true. Is it the real issue?
    hints:
      - What is the digestive system’s job?
      - Does a part need to touch the food to help with that job?
    solution:
      - The digestive system’s job is to break down food and absorb nutrients.
      - The liver and pancreas help break food down, so they are doing that system’s job.
      - Asha was treating the system like a tube. A system is really a team working on one job.

  - id: b4
    level: 2
    thinking: connect
    covers: [K1.1, K1.8, K1.7, U1.1]
    type: number
    prompt: Mateo waves hello to a friend. It looks like such a small thing. How many of the **four** body systems does this wave rely on?
    answer: 4
    unit: systems
    verify: 2 + 2
    hints:
      - Start with the arm. What moves it?
      - What does that arm need delivered in order to keep working? Who brings it, and where does it come from?
    solution:
      - The **musculoskeletal** system moves the arm.
      - That muscle needs oxygen from the **respiratory** system and nutrients from the **digestive** system.
      - The **circulatory** system carries them there. So even a small wave relies on all **4**.

  - id: b5
    level: 2
    thinking: connect
    covers: [K1.6, K1.8, S1.2, S1.4]
    type: mc
    prompt: |-
      Ravi says, “The body is a city. Oxygen and nutrients are parcels. Blood vessels are roads. The heart is the
      delivery truck.” One part of his idea doesn’t fit. Which change fixes it?
    choices:
      - Blood is the truck. The heart is what keeps the trucks moving.
      - The lungs are the truck. The heart is where parcels are stored.
      - Blood vessels are the trucks. The heart is the road they use.
      - Oxygen is the truck. The nutrients are parcels that it carries.
    answer: 0
    feedback:
      '1': Do the lungs travel around the body? Does the heart store things?
      '2': Do blood vessels travel, or does something travel through them?
      '3': Oxygen and nutrients are both being delivered. What carries both of them?
    hints:
      - Does the heart itself ever leave your chest?
      - What actually travels along the blood vessels, carrying the oxygen and nutrients?
    solution:
      - A truck travels. The heart stays in one place, so it can’t be the truck.
      - The blood is what travels and carries oxygen and nutrients, so **blood is the truck**.
      - The heart pumps, and that pumping keeps the blood moving.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: backwards
    covers: [K1.1, K1.8, S1.4, K1.5, K1.4, K1.6]
    type: investigation
    prompt: |-
      A very grumpy big toe writes letters of complaint to Head Office. (In real life, toes can’t write. Go with it.)
      Each letter says what is reaching its muscle. Your job is to work backward and find out which system isn’t
      doing its job. Look at what **is** arriving as well as what isn’t.
    parts:
      - type: mc
        prompt: '**Letter 1:** “Blood is arriving. It has nutrients in it, but no oxygen!” Which system isn’t doing its job?'
        choices: [Respiratory, Digestive, Circulatory, Musculoskeletal]
        fixedOrder: true
        answer: 0
        feedback:
          '1': The toe says it is getting nutrients. Who supplies those? So is that system working?
          '2': Blood is arriving. So is the system that moves blood working?
          '3': That system supports and moves the body. Which system supplies the missing thing?
        hints:
          - What is missing, and which system brings it into the body?
        solution:
          - Oxygen is missing, and the respiratory system exchanges oxygen.
          - The blood arrives, so the circulatory system works. It has nutrients, so the digestive system works too.
      - type: mc
        prompt: '**Letter 2:** “Now NO blood is arriving at all! Not one drop!” Which system would you check first?'
        choices: [Circulatory, Respiratory, Digestive, Musculoskeletal]
        fixedOrder: true
        answer: 0
        feedback:
          '1': In Letter 1, the lungs had a problem. Did blood still arrive then?
          '2': If the intestines had a problem, would the blood stop, or would it arrive with something missing?
          '3': That system supports and moves the body. Which system moves the blood?
        hints:
          - Compare this letter with Letter 1. Was blood arriving then?
        solution:
          - This isn’t about what the blood carries. The blood itself has stopped arriving.
          - Moving blood is the job of the **circulatory** system.
      - type: multi
        prompt: '**Letter 3:** “Blood is arriving again. But it has no oxygen and no nutrients in it!” Which systems aren’t doing their jobs? Select all that fit.'
        choices: [Respiratory, Digestive, Circulatory, Musculoskeletal]
        fixedOrder: true
        answer: [0, 1]
        hints:
          - Is the blood arriving? What does that tell you about the circulatory system?
          - The blood is an empty truck. Who was supposed to load each thing onto it?
        solution:
          - Blood is arriving, so the circulatory system is working. It is carrying an empty load.
          - Oxygen comes from the respiratory system, and nutrients come from the digestive system. So **both** are not doing their jobs.
          - Letters 2 and 3 can look alike, because the toe gets nothing useful either way. Only checking whether blood arrives tells them apart.
    wrapUp: Each system has its own job, and each one relies on the others. That is why what arrives at a toe can tell you what has gone wrong far away.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: perspective
    covers: [K1.1, K1.8, U1.1, S1.2]
    type: open
    prompt: |-
      In a comic book, the body’s systems hold a meeting. The heart stands up and says, “I move blood to every part of
      the body. I’m the only one who matters. The rest of you can go home!”

      Choose the **lungs** or the **intestines**, and write what they say back. Keep it in character. Be as cheeky as you like.
    modelAnswer: |-
      “Oh, really, Heart? I’m the intestines. I absorb the nutrients from food. Without me, that blood you are so proud
      of has no nutrients to carry. You would be a delivery company with nothing to deliver! But I admit I need you too.
      Without you, my nutrients would never get out to the muscles. So nobody goes home.”
    rubric:
      - I said what the lungs or the intestines do.
      - I explained what the blood would be missing without them.
      - I showed that they rely on the heart too, or that the systems rely on each other.
    hints:
      - What would the blood be missing if your character went home?
      - Could your character get its work out to the body without the heart?

  - id: d3
    level: 3
    thinking: why
    covers: [K1.3, K1.5, K1.6, K1.7, S1.1, S1.2]
    type: mc
    prompt: |-
      At a science fair, students design made-up beasts. Other animals don’t always have the same parts as we do, so
      the judge checks each **job** instead. Which beast has a part missing, so it can’t get oxygen to its tail muscle?
    choices:
      - 'Grumph: lungs, stomach, intestines, blood vessels, muscles, bones.'
      - 'Snorfle: gills (which take oxygen from water), stomach, intestines, heart, blood vessels, muscles, bones.'
      - 'Tiffle: lungs, stomach, intestines, heart, blood vessels, muscles, a strong shell for support.'
      - 'Wapple: lungs, gills (which take oxygen from water), stomach, intestines, heart, blood vessels, muscles, bones.'
    answer: 0
    feedback:
      '1': It has no lungs, but it does have gills. What job do the gills do? Does oxygen still get in?
      '2': It has no bones, but it does have a shell. Bones are for support and movement. Does that stop oxygen from getting to the muscle?
      '3': Having extra parts isn’t a problem. Go through the steps. How does oxygen get in, and how does it move?
    hints:
      - Don’t look for what is different from a human. Think through the trip that oxygen has to make.
      - What gets oxygen in? What gets it to the tail? Check for those in each beast.
      - What makes the blood move through the blood vessels?
    solution:
      - 'Oxygen’s trip has two steps: something has to take it in, and something has to carry it to the tail.'
      - Snorfle uses gills and Tiffle uses lungs, and both have a heart and blood vessels. Wapple has both lungs and gills. Those all work.
      - Grumph can take oxygen in, and it has blood vessels, but it has **no heart**. Nothing pumps the blood, so the oxygen never gets to the tail.
      - 'What we learned: check whether each job gets done, not whether each part looks the way it does in a human.'
