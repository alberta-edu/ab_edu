id: algorithms-loops
grade: 5
subject: science
organizingIdea: SCI-OI6
outcomes: [SCI5-OI6-GQ1-LO1]
order: 12
title: Algorithms, Loops and Block Code
shortTitle: Algorithms, loops and block code
summary: >-
  Build block code to guide a robot to a star, use loops to repeat instructions, and learn why a computer
  can only do exactly what its code says.

bigIdea: |-
  - An **algorithm** is a set of steps to solve a problem.
  - **Code** turns an algorithm into instructions a computer can run.
  - A computer **cannot think for itself**: it does exactly what the code says.
  - A **loop** repeats instructions, so programs can be shorter.

lesson:
  - title: Guide the robot with code
    blocks:
      - type: visual
        covers: [K1.2, K1.4, K1.5, S1.1, S1.2, S1.3]
        component: block-code
        props: { start: line }
        caption: |-
          Tap blocks to build a program, then press **Run**. Puzzle 1 can be solved with just **2 blocks**, if you use
          a **repeat** loop.
      - type: callout
        variant: tip
        covers: [K1.6, S1.3]
        title: The robot can't think
        body: If the robot bumps into a rock, it isn't being silly. A computer **must rely on code** for everything it does, so the code needs fixing.

  - title: Code and computational artifacts
    blocks:
      - type: text
        covers: [U1.1]
        body: |-
          People use **design** to meet needs. Some designs are for:

          - **humans** to use, like a web page
          - **machines**, like the code that tells a robot how to move
      - type: compare
        covers: [K1.3, K1.4, K1.5]
        columns:
          - title: Code
            body: Any language that a computer can **understand and run**.
          - title: Visual block-based code
            body: Prepared chunks of instructions in **drag-and-drop blocks** that fit together like puzzle pieces to make a program.
      - type: table
        covers: [K1.1]
        caption: A computational artifact is anything a person creates using a computer.
        headers: [Computational artifact, Example]
        rows:
          - ['Computer programs and code', 'The robot program you just built']
          - ['Images', 'A poster designed on a computer']
          - ['Audio', 'A song recorded and edited on a computer']
          - ['Video', 'A video edited on a tablet']
          - ['Presentations', 'A slide show about the planets']
          - ['Web pages', 'This lesson']

  - title: Loops make code shorter
    blocks:
      - type: compare
        covers: [K1.7, S1.5, S1.2]
        columns:
          - title: Without a loop (8 blocks)
            figure: { kind: code, blocks: [move, right, move, right, move, right, move, right] }
            body: The same two blocks, written out four times.
          - title: With a loop (3 blocks)
            figure: { kind: code, blocks: [{ repeat: 4, body: [move, right] }] }
            body: A **loop** repeats the instructions inside it. Same result, much shorter.
      - type: callout
        variant: mistake
        covers: [K1.7, S1.3]
        title: Count the repeats carefully
        body: If a loop repeats one time too few or one time too many, the robot stops in the wrong place. Check the number.

  - title: From algorithm to code
    blocks:
      - type: example
        covers: [S1.4, S1.5, K1.2]
        title: Translate an algorithm into blocks
        problem: |-
          **Algorithm (in words):** To climb a staircase, step forward, turn to face up the stairs, step up, then turn
          to face forward again. Do this 4 times.
        steps:
          - 'Find the steps that repeat: **move forward**, **turn left**, **move forward**, **turn right**.'
          - 'They happen **4 times**, so put them inside a **repeat 4 times** block.'
          - 'Count the blocks: 1 repeat block + 4 blocks inside = **5 blocks**.'
        answer: Try it in **Puzzle 3** in step 1. Can you solve it in 5 blocks?
      - type: figure
        covers: [S1.4, S1.5]
        figure: { kind: code, blocks: [{ repeat: 4, body: [move, left, move, right] }] }
        caption: The staircase algorithm as block code.

keyTerms:
  - term: Algorithm
    covers: [K1.2]
    definition: A set of steps for solving a problem or doing a task.
  - term: Code
    covers: [K1.3]
    definition: Any language that can be understood by and run on a computer.
  - term: Visual block-based language
    covers: [K1.5]
    definition: Code made of drag-and-drop blocks that fit together like puzzle pieces.
  - term: Loop
    covers: [K1.7]
    definition: A repetition of instructions in an algorithm.
  - term: Computational artifact
    covers: [K1.1]
    definition: Anything a person creates using a computer, such as a program, image, video or web page.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.1]
    type: mc
    prompt: Which of these is a **computational artifact**?
    choices:
      - A class poster designed on a laptop
      - A class poster painted with a brush
      - A birthday song sung in the car
      - A note written in pencil
    answer: 0
    feedback:
      '1': It could look just like a poster made another way. What tool made this one?
      '2': A song can be a computational artifact in some cases. What would have to happen to this one?
      '3': A note is something a person made. But was a computer used?
    hints:
      - What does a person have to use to make a computational artifact?
    solution:
      - A computational artifact is anything a person creates **using a computer**. Only the poster designed on a laptop was.

  - id: w2
    level: 1
    thinking: apply
    covers: [S1.2, K1.7]
    type: number
    figure: { kind: code, blocks: [{ repeat: 3, body: [move, move, right] }] }
    prompt: When this code runs, how many squares does the robot move **altogether**?
    answer: 6
    unit: squares
    verify: '2 * 3'
    hints:
      - How many squares does it move each time through the loop? How many times does the loop run?
    solution:
      - 'Each time through the loop, the robot moves 2 squares. The loop runs 3 times: \(2 \times 3 = 6\) squares.'

  - id: w3
    level: 1
    thinking: recall
    covers: [K1.5, K1.4]
    type: mc
    prompt: What makes a language a **visual block-based language**?
    choices:
      - Chunks of prepared instructions fit together like puzzle pieces.
      - The computer decides by itself how the pieces should fit together.
      - The blocks are only pictures, so a computer can’t really run them.
      - Each instruction must be typed out one letter at a time.
    answer: 0
    feedback:
      '1': Who decides the order of the blocks? Can a computer think for itself?
      '2': You pressed Run in the robot puzzle. What happened to the blocks?
      '3': There are many ways to code, and typing is one. Was it what you did in the robot puzzle?
    hints:
      - Think of how you built your program in the robot puzzle.
    solution:
      - Blocks are **prepared chunks of instructions**. You drag them into place, and they fit together like puzzle pieces to make a program.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: apply
    covers: [S1.3, S1.2, K1.7]
    type: mc
    figure: >-
      <svg viewBox="0 0 300 240" class="fig-svg fig-svg--square" role="img" aria-label="A grid 5 squares wide and 4 squares tall. In the top left corner is a robot facing right. A is 2 squares to the right of the robot. B is in the top right corner, 4 squares to the right of the robot. C is 2 squares to the right and 2 squares down from the robot. D is 2 squares straight down from the robot.">
      <path class="fig-grid" d="M25 20 H275 M25 70 H275 M25 120 H275 M25 170 H275 M25 220 H275 M25 20 V220 M75 20 V220 M125 20 V220 M175 20 V220 M225 20 V220 M275 20 V220"/>
      <polygon class="fig-hl" points="36,30 36,60 66,45"/>
      <text class="sci-text" x="150" y="50" text-anchor="middle">A</text>
      <text class="sci-text" x="250" y="50" text-anchor="middle">B</text>
      <text class="sci-text" x="150" y="150" text-anchor="middle">C</text>
      <text class="sci-text" x="50" y="150" text-anchor="middle">D</text></svg>
    prompt: |-
      The robot is in the top left corner, facing right. It runs this code:

      **repeat 2 times** [move forward, move forward, turn right]

      On which lettered square does it stop?
    choices: [A, B, C, D]
    fixedOrder: true
    answer: 2
    feedback:
      '0': That is where it gets to after one time through. How many times does the loop run?
      '1': That would be four moves in a straight line. What happens between the moves?
      '3': You would get there after one more time through the loop. Count how many times it runs.
    hints:
      - Put your finger on the robot, and follow the blocks one at a time.
      - After the first **turn right**, which way is the robot facing?
    solution:
      - First time through, it moves 2 squares right to A. Then it turns right, so it now faces **down**.
      - Second time through, it moves 2 squares down to **C**. Then it turns right again, but it doesn’t move any more.

  - id: b2
    level: 2
    thinking: flaw
    covers: [S1.3, K1.7, K1.6]
    type: mc
    prompt: |-
      Clank the robot cook has to make 4 pancakes. Its code is:

      **repeat 4 times** [get out a pan, pour batter, flip, put pancake on plate]

      Soon the kitchen is full of dirty pans. What is the best fix?
    choices:
      - Put “get out a pan” before the loop, so it runs one time.
      - Change “repeat 4 times” to “repeat 1 time” to save pans.
      - Put “pour batter” before the loop, so it runs one time.
      - Leave the code alone. Clank will soon see it has enough pans.
    answer: 0
    feedback:
      '1': That would solve the pan problem. How many pancakes would Clank make?
      '2': Trace it through. How much batter would the second pancake get?
      '3': Would Clank notice? Who has to tell a computer everything it does?
    hints:
      - Go through the loop one time at a time. How many pans has Clank got out after each time?
      - Which steps need to happen for **every** pancake? Which step needs to happen only once?
    solution:
      - Everything inside a loop runs every time. Clank gets out a new pan for each pancake, because that is what the code says.
      - One pan is enough, so that block belongs **before** the loop. Pouring, flipping and plating happen for every pancake, so they stay inside.

  - id: b3
    level: 2
    thinking: ways
    covers: [S1.3, S1.2]
    type: number
    prompt: The robot’s right wheel is stuck, so its **turn right** block has stopped working. It can still **turn left**. How many turn left blocks in a row make it face the same way as one turn right?
    answer: 3
    unit: blocks
    verify: '4 - 1'
    hints:
      - Stand up and try it. Face the front of the room, and turn left, one quarter turn at a time.
      - How many quarter turns take you all the way around?
    solution:
      - Four quarter turns take the robot all the way around. A right turn is one quarter turn the other way, so it is the same as going the rest of the way around.
      - \(4 - 1 = 3\) left turns. It takes longer, but the robot ends up facing the same way.

  - id: b4
    level: 2
    thinking: pattern
    covers: [S1.2, S1.4, K1.7]
    type: mc
    prompt: |-
      Someone wrote out this program with no loop:

      move, right, move, move, right, move, move, right, move

      Which program does **exactly the same thing**?
    choices:
      - '**repeat 3 times** [move, right, move]'
      - '**repeat 3 times** [move, right]'
      - '**repeat 3 times** [move, move, right]'
      - '**repeat 4 times** [move, right]'
    answer: 0
    feedback:
      '1': Write this one out in full, block by block. Are there any places with two moves in a row?
      '2': This looks very close. Write it out in full. What are its first two blocks?
      '3': Write this one out in full. How many blocks does it have, compared with the 9 in the program?
    hints:
      - The program has 9 blocks. What are the ways to split 9 blocks into equal groups?
      - Try drawing a line after every third block. Are the groups the same?
    solution:
      - The pattern doesn’t have to start where you first expect. Split the 9 blocks into groups of 3.
      - '**move, right, move** | **move, right, move** | **move, right, move**. So the loop is repeat 3 times with those 3 blocks inside.'

  - id: b5
    level: 2
    thinking: why
    covers: [K1.6, K1.7]
    type: mc
    prompt: |-
      A salon robot washes a wig by following the words on a shampoo bottle: **Lather. Rinse. Repeat.** An hour later, the bottle is
      empty and the robot is still rubbing and rinsing. A person would have stopped after a wash or two. Why didn’t the robot?
    choices:
      - It does what its code says, and the code never says when to stop.
      - It has decided for itself that the wig isn’t clean enough yet.
      - Its repeat block is broken, so it has lost count of the washes.
      - It is waiting for the wig to tell it that the job is finished.
    answer: 0
    feedback:
      '1': That would need the robot to think about the wig. Can a computer decide things for itself?
      '2': Look at the words again. Is there any number there for it to count to?
      '3': A wig can’t talk, and a robot only does what its code says. Does the code say anything about waiting?
    hints:
      - Read the three words as code. How many times do they say to repeat?
      - What does a person know about hair washing that isn’t in those three words?
    solution:
      - A person fills in the missing part with common sense, and stops when the hair is clean.
      - A computer **relies on code** for everything. “Repeat” with no number never ends, so the robot never stops.
      - A loop that says **repeat 2 times** would fix it. The code has to say what the robot can’t work out.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: pattern
    covers: [S1.3, S1.2, K1.7]
    type: investigation
    figure: >-
      <svg viewBox="0 0 300 190" class="fig-svg fig-svg--square" role="img" aria-label="Four squares in a block, two across and two down. The bottom left square is Start, with a robot facing up. P is above Start. Q is to the right of P. R is below Q and to the right of Start.">
      <path class="fig-grid" d="M80 20 H220 M80 90 H220 M80 160 H220 M80 20 V160 M150 20 V160 M220 20 V160"/>
      <polygon class="fig-hl" points="100,142 130,142 115,106"/>
      <text class="sci-small" x="115" y="178" text-anchor="middle">Start</text>
      <text class="sci-text" x="115" y="60" text-anchor="middle">P</text>
      <text class="sci-text" x="185" y="60" text-anchor="middle">Q</text>
      <text class="sci-text" x="185" y="130" text-anchor="middle">R</text></svg>
    prompt: |-
      The robot begins on **Start**, facing up. Its code is:

      **repeat ___ times** [move forward, turn right]

      You can change the number in the blank. Predict where the robot stops, without running the code.
    parts:
      - type: mc
        prompt: The number is **4**. Where does the robot stop?
        choices: [Start, P, Q, R]
        fixedOrder: true
        answer: 0
        feedback:
          '1': That is where it stops after one time through. Keep going.
          '2': That is where it stops after two times through. Keep going.
          '3': That is where it stops after three times through. Keep going.
        hints:
          - Trace it with your finger. After each move, remember to turn right.
        solution:
          - It goes up to P, across to Q, down to R and back to Start. Four times through is one full lap.
      - type: mc
        prompt: The number is **100**. Where does the robot stop?
        choices: [Start, P, Q, R]
        fixedOrder: true
        answer: 0
        feedback:
          '1': How many full laps fit into 100 times through? Is anything left over?
          '2': How many full laps fit into 100 times through? Is anything left over?
          '3': How many full laps fit into 100 times through? Is anything left over?
        hints:
          - You just found that every 4 times through is one full lap. Do you need to trace all 100?
        solution:
          - Each lap takes 4 times through, and \(100 \div 4 = 25\) with nothing left over.
          - After 25 full laps, it is back on **Start**.
      - type: mc
        prompt: The number is **102**. Where does the robot stop?
        choices: [Start, P, Q, R]
        fixedOrder: true
        answer: 2
        feedback:
          '0': You are right that 100 brings it back to Start. But there are still some times through left.
          '1': After 100 times through, the robot is on Start. How many more times through are there?
          '3': After 100 times through, the robot is on Start. How many more times through are there?
        hints:
          - You already know where it is after 100. What is left to do?
        solution:
          - After 100 times through, it is on Start, facing up, like the very beginning.
          - Two more times through take it to P and then to **Q**.
      - type: number
        prompt: What is the **smallest number above 102** that puts the robot back on Start?
        answer: 104
        verify: '26 * 4'
        hints:
          - Which numbers bring the robot back to Start? What do they have in common?
        solution:
          - The robot is on Start after 4, 8, 12 and every other number you land on when you count by 4s. After 100 comes **104**.
    wrapUp: A computer does the same thing every time, so a loop makes a pattern. Find the pattern, and you can predict the end of a very long program without running it.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: design
    covers: [S1.5, K1.7, K1.2, S1.3]
    type: build
    prompt: |-
      A museum’s night guard robot must walk **exactly 24 squares** on patrol and finish on the square where it started. Its code uses one loop:

      **repeat ___ times** [move forward ___ squares, turn right]

      Fill in the two blanks with whole numbers.
    fields:
      - { name: r, label: 'Repeat', unit: times }
      - { name: m, label: 'Move forward', unit: squares }
    rules:
      - { test: 'r >= 1 && m >= 1 && r % 1 == 0 && m % 1 == 0', fail: 'Use whole numbers, 1 or more. A robot can’t run a loop half a time.' }
      - { test: 'r * m == 24', fail: 'Count the squares. How many does the robot walk altogether, with those numbers?' }
      - { test: 'r % 4 == 0', fail: 'That is 24 squares, but trace the turns. Does the robot get back to where it started?' }
    examples:
      - { r: 4, m: 6 }
      - { r: 8, m: 3 }
      - { r: 12, m: 2 }
      - { r: 24, m: 1 }
    counterexamples:
      - { r: 3, m: 8 }
      - { r: 6, m: 4 }
      - { r: 2, m: 12 }
      - { r: 1, m: 24 }
      - { r: 4, m: 5 }
      - { r: 0, m: 24 }
    hints:
      - Two different things have to be true. Which number controls how far the robot walks? Which controls where it ends up?
      - How many right turns does the robot need to make to face its first direction again?
      - Which numbers can you use for the repeat, if the turns have to come out evenly?
    solution:
      - The robot walks repeat × move squares, so those two numbers must multiply to 24.
      - It only gets back to the start after 4 turns, or 8, or 12 and so on, so the repeat number must be a multiple of 4.
      - '**Repeat 4, move 6** walks one big square. **Repeat 8, move 3** walks around a smaller square two times.'
      - '**Repeat 12, move 2** and **repeat 24, move 1** work too. All of them obey both rules, though the last robot only circles one tiny square, six times. Which would you hire?'

  - id: d3
    level: 3
    thinking: flaw
    covers: [S1.3, S1.4, K1.7]
    type: mc
    figure: >-
      <svg viewBox="0 0 420 92" class="fig-svg" role="img" aria-label="A row of six squares. The first five squares each hold a planted sapling. The sixth square is a pond, with a robot in it.">
      <path class="fig-grid" d="M30 16 H390 M30 76 H390 M30 16 V76 M90 16 V76 M150 16 V76 M210 16 V76 M270 16 V76 M330 16 V76 M390 16 V76"/>
      <rect class="sci-water" x="330" y="16" width="60" height="60"/>
      <path class="obj-line" d="M60 66 V44 M120 66 V44 M180 66 V44 M240 66 V44 M300 66 V44"/>
      <circle class="obj" cx="60" cy="36" r="11"/><circle class="obj" cx="120" cy="36" r="11"/><circle class="obj" cx="180" cy="36" r="11"/><circle class="obj" cx="240" cy="36" r="11"/><circle class="obj" cx="300" cy="36" r="11"/>
      <polygon class="fig-hl" points="346,32 346,62 374,47"/></svg>
    prompt: |-
      A planting robot has to plant 5 saplings in a row, one per square, starting on the square where it stands. A pond comes straight after the fifth square. Its code:

      **repeat 5 times** [plant a sapling, move forward]

      The saplings are perfect, but the robot ends up in the pond. **Splash.** Which code plants all 5 and keeps the robot dry?
    choices:
      - '**repeat 4 times** [plant a sapling, move forward], then plant a sapling'
      - '**repeat 4 times** [plant a sapling, move forward], then move forward'
      - '**repeat 5 times** [move forward, plant a sapling]'
      - '**repeat 5 times** [plant a sapling, move forward], then turn left'
    answer: 0
    feedback:
      '1': Count the saplings this code plants. Then look at where the robot ends up.
      '2': Trace it from the first square. Where is the first sapling planted, and where is the last one?
      '3': Trace it. By the time the robot gets to the turn left, where is it standing?
    hints:
      - Count the saplings in the picture. Now count how many moves it takes to go from the first sapling to the last one.
      - The number of saplings and the number of moves between them aren’t the same. What does that mean for the loop?
      - Which block does the robot need to do once more than the other?
    solution:
      - Picture the saplings. **Five saplings have only four gaps** between them, so the robot needs 5 plants but only 4 moves.
      - The old loop made 5 of each, so the fifth move took it into the pond.
      - The fix is to repeat the pair 4 times, then plant one last sapling, with no move after it.

  - id: d4
    level: 3
    thinking: design
    covers: [S1.5, K1.2, S1.4, S1.1]
    type: open
    prompt: |-
      Invent a chore for a robot at your home or school, like feeding the fish in a row of tanks. Write your algorithm as blocks with a **repeat** loop. At least one step must
      happen **outside** the loop. Then explain why that step doesn’t belong inside the loop.
    modelAnswer: |-
      My robot waters 6 plants along a window. Pick up the watering can. Repeat 6 times [water the plant, move forward]. Put down the
      watering can. Picking up the can stays outside the loop, because the robot only has to do it once. If it were inside, the robot would keep
      trying to pick up a can that it is already holding.
    rubric:
      - My code has a **repeat** block with a number.
      - The steps inside my loop are steps that really do repeat.
      - At least one step is outside the loop.
      - I explained what would go wrong if that step were inside the loop.
