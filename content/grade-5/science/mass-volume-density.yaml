id: mass-volume-density
grade: 5
subject: science
organizingIdea: SCI-OI1
outcomes: [SCI5-OI1-GQ1-LO1]
order: 2
title: Mass, Volume, Density and Compressibility
shortTitle: Mass, volume, density and compressibility
summary: >-
  Measure mass with a balance scale and volume in millilitres, compare densities by weighing and layering,
  and see why air squeezes but water doesn't.

bigIdea: |-
  **Mass** is how much matter something has. **Volume** is how much space it takes up. **Density** compares
  the two: the more mass packed into the same volume, the **denser** it is. Anything **less dense** than the
  fluid around it floats.

lesson:
  - title: Measuring mass
    blocks:
      - type: visual
        covers: [K2.2, K2.3, S2.1]
        component: measure-tools
        props: { mode: mass }
        caption: |-
          Put an object on the left pan. Add standard masses to the right pan until the beam is **level**. Then the
          two sides have the same mass.
      - type: table
        covers: [K2.1]
        caption: Physical properties of matter
        headers: [Property, What it tells you]
        rows:
          - ['State', 'Solid, liquid or gas']
          - ['Mass', 'The amount of matter']
          - ['Volume', 'The amount of space it takes up']
          - ['Density', 'How its mass compares to its volume']
          - ['Compressibility', 'How much it can be squeezed into a smaller volume']

  - title: Measuring volume
    blocks:
      - type: visual
        covers: [K2.4, K2.5, S2.2]
        component: measure-tools
        props: { mode: volume }
        caption: |-
          Pour, then read the mark that is level with the **top of the liquid**. Bend down so your eye is at the
          same height as the liquid.
      - type: table
        covers: [K2.3, K2.5, K2.6]
        caption: SI units and their abbreviations
        headers: [Measures, Unit, Abbreviation]
        rows:
          - ['Mass', 'gram', '**g**']
          - ['Mass', 'kilogram (1 kg = 1000 g)', '**kg**']
          - ['Volume of a liquid', 'millilitre', '**mL**']
          - ['Volume of a liquid', 'litre (1 L = 1000 mL)', '**L**']
      - type: callout
        variant: tip
        covers: [S2.7]
        title: Use tools safely
        body: |-
          - Set glass containers on a flat table, away from the edge.
          - Pour slowly, and wipe up spills right away.
          - Never taste anything you are measuring in an investigation.

  - title: 'Density: same size, different mass'
    blocks:
      - type: visual
        covers: [K2.7, K2.8, K2.9, K2.10, S2.3]
        component: density-balance
        caption: |-
          Every cube is the **same size** (the same volume). Put two cubes on the balance. The cube with **more
          mass** sinks lower, so it is **denser**.
      - type: compare
        covers: [K2.8, K2.9]
        columns:
          - title: Denser
            body: More mass in the same volume. A steel cube is **denser** than a wooden cube of the same size.
          - title: Less dense
            body: Less mass in the same volume. Cork is **less dense** than wood.

  - title: 'Virtual experiment: a tower of liquids'
    blocks:
      - type: experiment
        covers: [K2.10, K2.11, S2.4]
        title: Pour four liquids into one container
        question: |-
          Pour **vegetable oil** first, then **water**, then **dish soap**, then **honey**. Each liquid is poured on
          top of the ones already in the container.
        animation: liquid-layers
        predict:
          choices:
            - They stay in the order they were poured, with oil at the bottom.
            - They sort into layers, with the densest liquid at the bottom.
            - They all mix together into one colour.
          answer: 1
        observe: |-
          Each new liquid sank down through any liquid that was **less dense** than it. From bottom to top, the
          layers ended up as **honey**, **dish soap**, **water**, **vegetable oil**.
        explain: |-
          - A liquid that is **denser** sinks when it is added to another liquid.
          - A liquid that is **less dense** floats on top.
          - So honey is the densest of the four, and vegetable oil is the least dense.

  - title: Density and particles
    blocks:
      - type: compare
        covers: [S2.5, U2.1]
        columns:
          - title: Solid or liquid
            figure: { kind: particle-boxes, boxes: [liquid] }
            body: Particles are **close together**, so many particles, and a lot of mass, fit in a small volume.
          - title: Gas
            figure: { kind: particle-boxes, boxes: [gas] }
            body: Particles have **large spaces** between them, so the same volume holds far fewer particles. Gases are much **less dense**.
      - type: callout
        variant: mistake
        covers: [K2.8, K2.11]
        title: Heavy is not the same as dense
        body: |-
          A huge log has more mass than a small pebble, but the log floats and the pebble sinks. What matters is
          how much mass is packed into **each bit of space**: the pebble is denser than water, the log is not.

  - title: 'Virtual experiment: squeeze air and water'
    blocks:
      - type: experiment
        covers: [K2.12, S2.6, U2.1]
        title: Push two sealed syringes
        question: |-
          One sealed syringe holds 60 mL of **air**. The other holds 60 mL of **water**. Both plungers get the
          **same push**.
        animation: syringe-squeeze
        predict:
          choices:
            - The air squeezes into a much smaller volume. The water hardly changes.
            - The water squeezes more than the air.
            - Both squeeze to the same smaller volume.
          answer: 0
        observe: |-
          The **air** was squeezed from 60 mL to 30 mL. The **water** stayed at about 60 mL.
        explain: |-
          - Air is a gas. Its particles have **large spaces** between them, so pushing moves them closer together.
          - Water is a liquid. Its particles are already **close together**, so there is almost no space to squeeze out.
          - Air has high **compressibility**. Water has very low compressibility.

keyTerms:
  - term: Mass
    covers: [K2.2, K2.3]
    definition: The amount of matter in a solid, liquid or gas. Measured in grams (g) and kilograms (kg).
  - term: Volume
    covers: [K2.4, K2.5]
    definition: The amount of space a solid, liquid or gas takes up. Liquid volume is measured in millilitres (mL) and litres (L).
  - term: Density
    covers: [K2.7, K2.8]
    definition: A comparison of mass to volume. More mass in the same volume means a higher density.
  - term: Denser / less dense
    covers: [K2.9]
    definition: Words for comparing densities. Steel is denser than wood. Oil is less dense than water.
  - term: Compressibility
    covers: [K2.12]
    definition: The ability of a liquid or gas to reduce in volume when it is under pressure.
  - term: Balance scale
    covers: [S2.1]
    definition: A tool that measures mass by balancing an object against standard masses.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S2.1, K2.2, K2.3]
    type: number
    figure: { kind: balance, left: [Potato], right: [100 g, 100 g, 20 g, 10 g], down: none }
    prompt: The beam is level. What is the **mass** of this potato, in grams?
    answer: 230
    unit: g
    verify: '100 + 100 + 20 + 10'
    hints:
      - What does a level beam tell you about the two sides?
    solution:
      - A level beam means both sides have the same mass.
      - So the potato’s mass is the total of the standard masses. \(100 + 100 + 20 + 10 = 230\) g.

  - id: w2
    level: 1
    thinking: recall
    covers: [K2.3, K2.5, K2.6]
    type: multi
    prompt: You’re reading the labels in a kitchen. Select **all** the labels that tell you a **volume**.
    choices:
      - 'Milk: 2 L'
      - 'Vanilla: 250 mL'
      - 'Flour: 3 kg'
      - 'Butter: 500 g'
    answer: [0, 1]
    feedback:
      '2': What does kg stand for? Does it measure the space something takes up, or the amount of matter in it?
      '3': What does g stand for? Does it measure the space something takes up, or the amount of matter in it?
    hints:
      - Write out each short form in full. Which ones are units of volume?
    solution:
      - L means litres and mL means millilitres. These are units of volume.
      - kg means kilograms and g means grams. These are units of mass.

  - id: w3
    level: 1
    thinking: notice
    covers: [S2.2, K2.4, K2.5]
    type: number
    figure: { kind: cylinder, max: 50, minor: 2, major: 10, level: 38 }
    prompt: Zara measures some juice in this cylinder. Then she pours all of it into a wide, shallow bowl, where it looks like much less. What **volume** of juice is in the bowl?
    answer: 38
    unit: mL
    verify: '30 + 2 + 2 + 2 + 2'
    hints:
      - Does pouring juice into a new container change how much space the juice takes up?
      - Find the numbered mark just below the top of the juice. Each small mark is 2 mL.
    solution:
      - Pouring changes the juice’s shape, but not the amount of space it takes up. So just read the cylinder.
      - The juice is 4 small marks above 30 mL, and each small mark is 2 mL. That makes **38 mL**, in the cylinder or in the bowl.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: backwards
    covers: [S2.1, K2.2]
    type: number
    figure: { kind: balance, left: [Rock], right: [100 g, 50 g, 20 g, 5 g], down: none }
    prompt: |-
      Someone stuck a wad of gum on the left pan of the class balance! With nothing else on the pans, the beam is level
      only with a **5 g** mass on the right. Luca leaves the gum there and weighs a rock, as shown. What is the rock’s
      real mass?
    answer: 170
    unit: g
    verify: '100 + 50 + 20 + 5 - 5'
    hints:
      - What is on the left pan in the picture? Is the rock the only thing there?
      - How much mass does the gum have? How do you know?
      - The right side matches the rock **and** the gum together.
    solution:
      - A level beam means both sides have the same mass. The left side holds the rock and the gum.
      - The first test shows that the gum balances 5 g, so the gum’s mass is 5 g.
      - The right side adds up to \(100 + 50 + 20 + 5 = 175\) g. Take away the gum, and the rock is \(175 - 5 = 170\) g.
      - 'What we learned: before you weigh anything, check that the empty balance is level.'

  - id: b2
    level: 2
    thinking: evidence
    covers: [K2.10, K2.11, K2.9, S2.4]
    type: multi
    figure: >-
      <svg viewBox="0 0 340 236" class="fig-svg" role="img" aria-label="A glass with three liquid layers. Liquid X is on top, liquid Y is in the middle and liquid Z is on the bottom. Large object A floats on top of X. Medium object B rests between Y and Z. Tiny object C lies on the bottom of the glass.">
      <rect class="sci-water" x="40" y="70" width="190" height="150"/><rect class="sci-water" x="40" y="120" width="190" height="100"/><rect class="sci-water" x="40" y="170" width="190" height="50"/>
      <line class="sci-surface" x1="40" y1="70" x2="230" y2="70"/><line class="sci-surface" x1="40" y1="120" x2="230" y2="120"/><line class="sci-surface" x1="40" y1="170" x2="230" y2="170"/>
      <path class="sci-glass" d="M40 16 L40 220 L230 220 L230 16"/>
      <circle class="obj" cx="90" cy="60" r="30"/><text class="fig-label" x="90" y="66" text-anchor="middle">A</text>
      <rect class="obj" x="150" y="150" width="34" height="34" rx="4"/><text class="fig-label" x="167" y="173" text-anchor="middle">B</text>
      <circle class="obj obj--dark" cx="90" cy="211" r="8"/><text class="fig-label" x="112" y="214" text-anchor="middle">C</text>
      <text class="fig-small" x="240" y="100">Liquid X</text><text class="fig-small" x="240" y="150">Liquid Y</text><text class="fig-small" x="240" y="200">Liquid Z</text></svg>
    prompt: |-
      Mina pours three mystery liquids into a glass, and they settle into layers. Then she drops in objects A, B and C.
      The picture shows where each one stops. Select **all** the statements that must be true.
    choices:
      - Liquid Z is denser than liquid X.
      - Object B is denser than liquid Y.
      - Object C is denser than object B.
      - Object C has more mass than object A.
      - Object B is denser than liquid Z.
    answer: [0, 1, 2]
    feedback:
      '3': C did sink the deepest. But look at how big A and C are. Does denser always mean more mass?
      '4': B stopped when it reached liquid Z. What does stopping there tell you, compared with sinking right through?
    hints:
      - When one thing sinks through another, which is denser? When it floats on top, which is denser?
      - Go through the picture from top to bottom. What sank through what?
    solution:
      - Whatever sinks through a fluid is denser than it. Whatever floats on it is less dense.
      - Z lies under X, so Z is denser. B sank through Y, so B is denser than Y. But B floats on Z, so it is less dense than Z.
      - C sank through everything, even Z, and B didn’t. So C is denser than B.
      - We can’t say C has more mass than A. C is denser, but it is tiny and A is huge. Density compares mass to volume, so it doesn’t tell you the mass alone.

  - id: b3
    level: 2
    thinking: whatif
    covers: [K2.8, K2.11, K2.7]
    type: mc
    prompt: |-
      A big bar of solid chocolate sinks in a pot of water. Yusuf snaps off one small square and says, “This piece is so
      much lighter, it will float!” What will really happen to the square?
    choices:
      - It sinks. It has less mass and less volume, so it is just as dense.
      - It floats. It has much less mass now than the whole bar had.
      - It floats. A smaller piece of anything is always less dense.
      - It sinks. A smaller piece of anything is always much denser.
    answer: 0
    feedback:
      '1': The piece does have less mass. But does it take up the same space as the whole bar? Which two things does density compare?
      '2': Think about what is packed into each bit of space. Does snapping the bar change that?
      '3': You got the sinking right. But does snapping the bar pack more mass into each bit of space?
    hints:
      - What does float or sink depend on, the mass alone or something else?
      - The square has less mass than the bar. What else does it have less of?
    solution:
      - Yusuf only looked at mass. Floating depends on **density**, which compares mass to volume.
      - The square has less mass, but it has less volume too. It is the same chocolate, with the same amount packed into each bit of space.
      - So it is just as dense as the bar. It is denser than water, so it sinks too.

  - id: b4
    level: 2
    thinking: notice
    covers: [K2.7, K2.8, S2.3]
    type: multi
    figure: >-
      <svg viewBox="0 0 440 156" class="fig-svg" role="img" aria-label="Two balance scales. On scale 1, small block P on the left goes lower than big block Q on the right. On scale 2, big block R on the left goes lower than small block S on the right.">
      <line class="obj-line" x1="35" y1="92" x2="175" y2="62"/><line class="obj-line" x1="105" y1="77" x2="105" y2="132"/><line class="obj-line" x1="80" y1="132" x2="130" y2="132"/>
      <rect class="obj" x="24" y="66" width="22" height="22" rx="3"/><text class="fig-label" x="35" y="60" text-anchor="middle">P</text>
      <rect class="obj" x="150" y="10" width="50" height="50" rx="3"/><text class="fig-label" x="175" y="41" text-anchor="middle">Q</text>
      <line class="obj-line" x1="265" y1="92" x2="405" y2="62"/><line class="obj-line" x1="335" y1="77" x2="335" y2="132"/><line class="obj-line" x1="310" y1="132" x2="360" y2="132"/>
      <rect class="obj" x="240" y="40" width="50" height="50" rx="3"/><text class="fig-label" x="265" y="71" text-anchor="middle">R</text>
      <rect class="obj" x="394" y="38" width="22" height="22" rx="3"/><text class="fig-label" x="405" y="32" text-anchor="middle">S</text>
      <text class="fig-small" x="105" y="152" text-anchor="middle">Scale 1</text><text class="fig-small" x="335" y="152" text-anchor="middle">Scale 2</text></svg>
    prompt: Mateo compares four blocks made of different materials, two at a time. Look at the sizes and at which side goes lower. Which conclusions are **sure**? Select **all** of them.
    choices:
      - P is denser than Q.
      - You can’t tell from this which of R and S is denser.
      - Q is denser than P.
      - R is denser than S.
      - S is denser than R.
    answer: [0, 1]
    feedback:
      '2': Q is the bigger block, yet its side went up. Is it packing more or less mass into each bit of space?
      '3': R has more mass. But it also has more volume. Is more mass enough to make it denser?
      '4': S could be denser. Could it also be less dense? You don’t know how much more space R takes up compared with its extra mass.
    hints:
      - On each scale, which block has more mass? Which has more volume?
      - Density compares mass to volume. On which scale do both comparisons point the same way?
    solution:
      - On scale 1, P has more mass and **less** volume than Q. More mass in less space means P must be denser.
      - On scale 2, R has more mass, but it also has more volume. It might be denser, or it might just be bigger, so you can’t tell.
      - 'What we learned: this is why we compare blocks of the **same size**. Then the side that goes lower is always the denser one.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K2.2, K2.8, K2.12, S2.5, S2.6, U2.1]
    type: investigation
    prompt: |-
      The gym has a flat basketball and a pump. Mr. Okafor puts the flat ball on a sensitive balance and adds masses until the beam
      is level. Then he takes the ball off, pumps it up until it is hard, and puts it back on the same pan.
    parts:
      - type: mc
        prompt: What does the beam do?
        choices:
          - The ball’s side goes lower, because the air added has mass.
          - The ball’s side goes up, because air makes things lighter.
          - The beam stays level, because air doesn’t have any mass.
          - The ball’s side goes up, because the ball is now bigger.
        answer: 0
        feedback:
          '1': Balls full of air feel light and bouncy, so this seems right. But is air matter? What did he add to the ball?
          '2': Air is hard to feel. But mass is the amount of matter in a solid, liquid **or gas**. Is air a gas?
          '3': The ball did get bigger. But does a bigger volume mean less mass? What did he put in?
        hints:
          - What is inside the ball now that wasn’t there before?
          - Mass is the amount of matter in a solid, liquid or gas. Does that include air?
        solution:
          - Air is a gas, so it is matter, and matter has mass.
          - He added air, so the ball has more mass, and its side goes lower. It is only a few grams, so the balance has to be sensitive.
      - type: mc
        prompt: |-
          Think about the last few pumps. The ball is already round, so its size hardly changes, but more air still goes
          in. What happens to the air inside the ball?
        choices:
          - It gets denser, because there is more mass in about the same volume.
          - It gets less dense, because the ball can hold only so much air inside.
          - Its density stays the same, because air is air, however much there is.
          - It gets denser, because each particle of the air is growing heavier.
        answer: 0
        feedback:
          '1': Is there more mass or less mass in the ball now? Did its volume change much?
          '2': When you break something, its mass and volume shrink together. Here, did the mass and the volume change together?
          '3': The particles are the same as before. What is there more of in the ball?
        hints:
          - Did the mass of air inside go up, go down or stay the same? What about the volume?
          - Density compares mass to volume.
        solution:
          - More air went in, so the mass of air in the ball went up.
          - The size hardly changed, so the volume stayed about the same.
          - More mass in the same volume means the air inside is now **denser**.
      - type: mc
        prompt: How can extra air fit into a space that is already full of air?
        choices:
          - The air’s particles have large spaces between them, so they can be pushed closer.
          - The air’s particles get smaller when they are pushed, so there is more room.
          - The air’s particles stop moving when they are pushed, so they stack up neatly.
          - The air’s particles join together into fewer particles, so they need less room.
        answer: 0
        feedback:
          '1': In the particle model, is it the particles that change size, or the spaces between them?
          '2': Particles of matter are always moving. Can pushing stop them?
          '3': The number of particles went up, since more air went in. What can change to make room for them?
        hints:
          - Picture the particles in a gas. What is between them?
        solution:
          - In a gas, the particles are separated by large spaces.
          - Pumping pushes them closer together, so more particles fit in the same volume. That is what **compressibility** means for air.
      - type: mc
        prompt: Now take a hard steel bottle, filled right to the top with water, and try to pump in more **water**. What happens?
        choices:
          - Almost no more goes in, because the water’s particles are already close together.
          - Plenty more goes in, because water’s particles have spaces between them as air’s do.
          - Plenty more goes in, because a liquid flows so easily into any space it can find.
          - Almost no more goes in, because water particles are bigger than the air’s particles.
        answer: 0
        feedback:
          '1': Liquid particles do have spaces. But how do those spaces compare with the large spaces in a gas?
          '2': Water flows easily, but is there anywhere for it to flow to? Think about the sealed syringe of water.
          '3': You got the result right. Are water particles really bigger, or is the difference about something else?
        hints:
          - Remember the two sealed syringes. What did the same push do to each one?
          - Compare the spaces between particles in a liquid and in a gas.
        solution:
          - Water’s particles are already close together, so there is hardly any space to squeeze out.
          - The bottle is full, and it can’t stretch, so almost no more water can go in. Water has very low compressibility.
    wrapUp: |-
      Air has mass, and its large spaces let you push more of it into the same volume. So squeezing air makes it denser.
      Water’s particles are already close together, so it hardly squeezes at all.

  - id: d2
    level: 3
    thinking: why
    covers: [K2.7, K2.8, K2.12, S2.6]
    type: multi
    prompt: Which of these make the thing **denser** than it was before? Select **all** of them.
    choices:
      - Squash a slice of bread into a tight little ball.
      - Push the plunger into a sealed syringe of air.
      - Pour juice from a tall glass into a wide bowl.
      - Roll a ball of clay into a long, thin snake.
      - Stack a second, identical block on a wooden block.
    answer: [0, 1]
    feedback:
      '2': The juice looks different. Did its mass change? Did the amount of space it takes up change?
      '3': The clay looks bigger and longer. Did any clay get added? Did any more space get filled?
      '4': The stack has more mass. Does it take up more space too? Is each bit of it packed any tighter?
    hints:
      - For each one, ask two questions. Did the mass change? Did the volume change?
      - Something gets denser if more mass ends up packed into each bit of space.
      - Careful with the clay and the juice. A new shape can fool your eyes.
    solution:
      - Track mass and volume each time. Only a change in how tightly the mass is packed changes the density.
      - '**Bread:** almost the same mass, in a much smaller volume, because the holes full of air get squashed out. Denser.'
      - '**Syringe of air:** the same mass, in a smaller volume. Denser.'
      - '**Juice** and **clay:** the same mass and the same volume, in a new shape. No change.'
      - '**Two blocks:** twice the mass and twice the volume. No change.'

  - id: d3
    level: 3
    thinking: design
    covers: [S2.4, S2.1, S2.2, K2.10, S2.7]
    type: open
    prompt: |-
      You have two jugs of mystery liquid, A and B. They look the same, and when you pour them together they just mix, so
      they won’t make a tower. You have a balance, two identical cups and a measuring cylinder. And no tasting! **Invent** a
      way to find out which liquid is denser. What result would tell you?
    hints:
      - You can’t watch one liquid sink through the other. What else can show which one is denser?
      - The density balance compared cubes of the same size. How could you make your two liquids a fair match in the same way?
      - Why might it matter that the two cups are identical?
    modelAnswer: |-
      Use the cylinder to measure 100 mL of liquid A and pour it into one cup. Measure 100 mL of liquid B and pour it into
      the other cup. Put one cup on each pan of the balance.

      The volumes are the same and the cups match, so any difference comes from the liquids. The side that goes lower has
      more mass, so that liquid is denser. If the beam stays level, they have the same density.
    rubric:
      - I measured the **same volume** of each liquid.
      - I used the identical cups, so the cups can’t change the result.
      - I said the side that goes lower holds the liquid with **more mass**.
      - I explained that with the same volume, more mass means **denser**.
