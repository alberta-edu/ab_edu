id: forces-of-flight
grade: 5
subject: science
organizingIdea: SCI-OI2
outcomes: [SCI5-OI2-GQ1-LO1]
order: 3
title: Forces of Flight
shortTitle: Forces of flight
summary: >-
  Change thrust, drag, lift and weight and watch an airplane or a bird speed up, slow down, climb and
  descend, then see the forces at work on an arrow.

bigIdea: |-
  Four forces act on anything that flies. They come in two **opposing pairs**: **thrust** against **drag**,
  and **lift** against **weight**. Whichever force in a pair is bigger decides whether a flyer speeds up or
  slows down, and whether it climbs or descends.

lesson:
  - title: The four forces of flight
    blocks:
      - type: visual
        covers: [K1.3, K1.4, K1.5, K1.6, S1.1, S1.4]
        component: flight-forces
        caption: |-
          Move the sliders or try a flight. Watch the **speed** and **altitude** (height above the ground). Switch to
          the **bird** to see that the same forces act on living things.
      - type: table
        covers: [K1.3, K1.4, K1.5, K1.6]
        headers: [Force, Direction, What it does]
        rows:
          - ['**Thrust**', 'Forward, in the direction of movement', 'Pushes the flyer forward']
          - ['**Drag**', 'Backward, against the movement', 'Slows the flyer down']
          - ['**Lift**', 'Up', 'Overcomes weight and holds the flyer in the air']
          - ['**Weight**', 'Down', 'Pulls the flyer toward the ground. It is caused by **gravity**']

  - title: Two pairs of opposing forces
    blocks:
      - type: figure
        covers: [K1.1, K1.2, S1.1]
        figure: { kind: forces, object: plane, forces: [{ kind: thrust }, { kind: drag }, { kind: lift }, { kind: weight }] }
        caption: A force diagram. Each arrow points the way its force acts. A longer arrow means a bigger force.
      - type: compare
        covers: [K1.1, K1.2, K1.7, U1.1]
        columns:
          - title: Thrust vs. drag
            body: |-
              These two forces work **forward and backward**. Together they change the flyer's **speed** and its
              horizontal movement.
          - title: Lift vs. weight
            body: |-
              These two forces work **up and down**. Together they change the flyer's **altitude** and its vertical
              movement.

  - title: What the forces do
    blocks:
      - type: table
        covers: [K1.7, S1.2, S1.3]
        headers: [When…, The flyer…]
        rows:
          - ['thrust is **greater** than drag', '**speeds up**']
          - ['drag is **greater** than thrust', '**slows down**']
          - ['lift is **greater** than weight', '**climbs** to a higher altitude']
          - ['weight is **greater** than lift', '**descends** to a lower altitude']
          - ['thrust **equals** drag **and** lift **equals** weight', 'flies **straight and level** at the same speed']
      - type: figure
        covers: [K1.7, S1.3, S1.1]
        figure: { kind: forces, object: bird, forces: [{ kind: thrust }, { kind: drag }, { kind: lift, size: 1.5 }, { kind: weight }] }
        caption: Lift is greater than weight, and thrust equals drag. This bird **climbs** without speeding up or slowing down.

  - title: 'Virtual experiment: shoot an arrow'
    blocks:
      - type: experiment
        covers: [K1.3, K1.4, K1.6, K1.8, U1.1, S1.2, S1.3]
        title: Aim an arrow straight at the centre
        question: The archer aims the arrow **straight at the centre** of a target, then lets go.
        animation: arrow-flight
        predict:
          choices:
            - It flies in a straight line and hits the centre.
            - Its path curves down, and it hits below the centre.
            - Its path curves up, and it hits above the centre.
          answer: 1
        observe: |-
          The bowstring pushed the arrow forward only **while it was touching it**. Then the arrow slowed down, its
          path curved downward, and it hit **below** the centre.
        explain: |-
          - **Thrust** from the bowstring acts only at the start.
          - **Drag** acts against the movement the whole time, so the arrow slows down.
          - **Weight** pulls down the whole time, and an arrow has almost no lift, so its path curves toward the ground.
      - type: callout
        variant: mistake
        covers: [K1.3, K1.6]
        title: Thrust doesn't ride along
        body: Once an arrow leaves the bow, nothing pushes it forward any more. **Drag** and **weight** keep acting until it lands.

  - title: Traditional technologies of flight
    blocks:
      - type: figure
        covers: [K1.8, S1.1]
        figure: { kind: forces, object: spear, forces: [{ kind: thrust }, { kind: drag, size: 0.5 }, { kind: weight, size: 0.7 }] }
        caption: |-
          A fishing spear at the moment it is thrown. The throw gives it **thrust**. Its long, thin shape keeps
          **drag** small, and **weight** pulls it down.
      - type: compare
        covers: [K1.8, S1.5]
        columns:
          - title: Bow and arrow
            body: The bent bow springs back, and the string gives the arrow **thrust**.
          - title: Slingshot
            body: The stretched band snaps forward and gives the stone **thrust**.
          - title: Fishing spear
            body: A strong throw gives the spear **thrust**. Its shape keeps **drag** small.
      - type: text
        covers: [K1.8, S1.5]
        body: |-
          Peoples of many cultures developed these tools long ago. First Nations and Inuit hunters used bows and arrows
          and fishing spears. Each tool shows an understanding of the forces that affect flight.

keyTerms:
  - term: Thrust
    covers: [K1.3]
    definition: A force that can act in the direction of movement.
  - term: Drag
    covers: [K1.4]
    definition: A force that can act against the direction of movement.
  - term: Lift
    covers: [K1.5]
    definition: An upward force that overcomes weight and holds a flyer in the air.
  - term: Weight
    covers: [K1.6]
    definition: A downward force caused by gravity.
  - term: Opposing forces
    covers: [K1.1, K1.2]
    definition: 'Forces that act in opposite directions: thrust and drag, and lift and weight.'
  - term: Altitude
    covers: [K1.7]
    definition: How high something is above the ground.
  - term: Straight and level flight
    covers: [K1.7]
    definition: Flying at the same speed and altitude, when thrust equals drag and lift equals weight.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K1.7, S1.1, S1.2]
    type: mc
    figure: { kind: forces, object: plane, forces: [{ kind: thrust, size: 0.6 }, { kind: drag }, { kind: lift }, { kind: weight }] }
    prompt: Each arrow points the way its force acts, and a longer arrow means a bigger force. What is this airplane doing?
    choices:
      - Slowing down, at the same altitude
      - Speeding up, at the same altitude
      - Climbing, at the same speed
      - Descending, at the same speed
    answer: 0
    feedback:
      '1': Which arrow is longer, thrust or drag? Which way would that change the speed?
      '2': Which pair of arrows decides whether a plane climbs? Are they different lengths?
      '3': Which pair of arrows decides whether a plane descends? Are they different lengths?
    hints:
      - Compare the arrows two at a time. Start with thrust and drag, then lift and weight.
    solution:
      - Drag is longer than thrust, so the plane **slows down**.
      - Lift and weight are the same length, so its altitude stays the same.

  - id: w2
    level: 1
    thinking: recall
    covers: [K1.1, K1.2, K1.3, K1.4, K1.5, K1.6]
    type: multi
    prompt: Select **all** the true statements about the forces on a flying gull.
    choices:
      - Thrust and drag are opposing forces.
      - Lift and weight are opposing forces.
      - Weight is caused by gravity.
      - Drag acts in the direction the gull is moving.
      - Lift acts forward, and thrust acts upward.
    answer: [0, 1, 2]
    feedback:
      '3': Which force pushes in the direction of movement? What does the other force in that pair do?
      '4': Which force holds a flyer up in the air? Which one pushes it forward?
    hints:
      - Picture the four arrows on a force diagram. Which way does each one point?
    solution:
      - Thrust (forward) and drag (backward) are one opposing pair. Lift (up) and weight (down) are the other.
      - Weight is caused by gravity. Drag acts against the movement, and lift is the upward force.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.3, K1.8]
    type: mc
    prompt: A fishing spear has just left the thrower’s hand. Which force on the spear has now **stopped**?
    choices: [Thrust, Drag, Weight]
    fixedOrder: true
    answer: 0
    feedback:
      '1': The spear is still moving through the air. What does the air do to something moving through it?
      '2': Is gravity still pulling on the spear after it leaves the hand?
    hints:
      - What was pushing the spear forward? Is it still touching the spear?
    solution:
      - The thrower’s push gave the spear **thrust**, but only while the hand was touching it.
      - Drag and weight keep acting until the spear lands.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [K1.7, S1.2, U1.1]
    type: mc
    prompt: |-
      On a family flight, the seat screen shows the same speed and the same altitude for a whole hour. Omar says, “The
      engines must be pushing harder than the drag, or else we’d be slowing down.” What should his sister tell him?
    choices:
      - Equal thrust and drag keep the speed steady. We’d slow down only if drag were bigger.
      - You’re right. Thrust always has to be bigger than drag for a plane to keep on flying.
      - At this height there is no drag at all, so the engines don’t have to push against it.
      - Drag is bigger than thrust right now. That’s what stops the plane from speeding up.
    answer: 0
    feedback:
      '1': If thrust really were bigger than drag for a whole hour, what would the speed number on the screen be doing?
      '2': The plane is moving, so what does drag do? Check the two arrows in the thrust and drag pair.
      '3': If drag were the bigger force, which way would the speed number on the screen go?
    hints:
      - What would the speed on the screen do if thrust were bigger than drag?
      - Look back at what happens when thrust equals drag.
    solution:
      - Test Omar’s idea against the screen. If thrust were bigger than drag, the plane would keep **speeding up**. The speed isn’t changing.
      - So thrust and drag must be **equal**. Equal forces don’t stop the plane. They keep it at the same speed.
      - It only slows down if drag becomes the bigger force.

  - id: b2
    level: 2
    thinking: model
    covers: [K1.7, S1.2, S1.3, S1.4]
    type: mc
    prompt: |-
      You watch a magpie from your window. It leaves the roof with its wings spread, and it doesn’t flap at all. It glides
      lower and lower, getting slower, until it lands on the lawn. What is true during the glide?
    choices:
      - Weight is greater than lift, and drag is greater than thrust.
      - Weight is greater than lift, and thrust is equal to drag.
      - Lift is equal to weight, and drag is greater than thrust.
      - There is no lift, because its wings are not flapping.
    answer: 0
    feedback:
      '1': Thrust equal to drag would keep the speed steady. What did the story say about its speed?
      '2': Lift equal to weight would keep its altitude the same. What happened to its altitude?
      '3': If there were no lift at all, it would drop straight down like a stone. Does a glide look like that?
    hints:
      - The story describes two changes. Which pair of forces goes with each one?
      - Lower and lower is about one pair of forces. Slower and slower is about the other pair.
    solution:
      - The magpie goes lower and lower, so weight is greater than lift. There is still some lift, or it would drop like a stone.
      - It gets slower, so drag is greater than thrust. With no flapping, there is nothing to push it forward.

  - id: b3
    level: 2
    thinking: connect
    covers: [K1.4, K1.8, S1.2, S1.5]
    type: mc
    prompt: |-
      In an empty field, Ruth pulls a slingshot band back the same distance twice. She shoots a small, smooth stone, and
      then a big ball of crumpled foil with the **same weight**. Which one goes farther, and why?
    choices:
      - The stone, because its small, smooth shape has less drag to slow it down.
      - The foil, because its big shape catches more thrust from the slingshot’s band.
      - Neither, because the same pull gives the same thrust, so they fly the same.
      - The stone, because weight pulls down much less on it than it does on the foil.
    answer: 0
    feedback:
      '1': The band does the same job both times. After that, does being big help or hurt as it moves through the air?
      '2': They start out the same. Which force acts on them all through the flight, and could it be different for each?
      '3': The story says they have the same weight. What is different about them?
    hints:
      - What is the same in both shots? What is different?
      - Why is a fishing spear made long and thin?
    solution:
      - The pull is the same and the weight is the same, so neither of those can make a difference.
      - What’s different is the shape. A big, crumpled shape has much more **drag**, so the foil slows down sooner.
      - The small, smooth stone keeps its speed for longer, so it goes farther. It’s the same idea as a long, thin spear.

  - id: b4
    level: 2
    thinking: notice
    covers: [S1.7, S1.6]
    type: mc
    figure: >-
      <svg viewBox="0 0 440 250" class="fig-svg" role="img" aria-label="A map of a gym. A group at tables is in the bottom left corner. Kids on a bench are in the bottom right corner. Fan A starts in the middle and spreads to the left, reaching the tables. Fan B starts near the top middle and spreads to the right, reaching the bench. Fan C starts at the left wall and spreads toward the top middle, reaching nobody.">
      <rect class="pb-box" x="5" y="5" width="430" height="240" rx="6"/>
      <rect class="obj" x="20" y="170" width="120" height="65" rx="4"/><text class="fig-small" x="80" y="200" text-anchor="middle">Group</text><text class="fig-small" x="80" y="218" text-anchor="middle">at tables</text>
      <rect class="obj" x="340" y="175" width="85" height="60" rx="4"/><text class="fig-small" x="382" y="202" text-anchor="middle">Kids on</text><text class="fig-small" x="382" y="220" text-anchor="middle">a bench</text>
      <polygon class="fig-arrow" points="215,130 60,110 60,220"/><polygon class="fig-arrow" points="260,60 420,110 420,210"/><polygon class="fig-arrow" points="25,70 235,25 235,115"/>
      <circle class="fig-hl" cx="215" cy="130" r="6"/><circle class="fig-hl" cx="260" cy="60" r="6"/><circle class="fig-hl" cx="25" cy="70" r="6"/>
      <text class="fig-label" x="228" y="150">A</text><text class="fig-label" x="254" y="44">B</text><text class="fig-label" x="20" y="54">C</text></svg>
    prompt: |-
      Your class is testing gliders you built, using a rubber-band launcher in the gym. Test gliders often veer off to one
      side. Each dashed fan shows everywhere a glider might go from that launch spot. Which spot is safest?
    choices: [Spot A, Spot B, Spot C]
    fixedOrder: true
    answer: 2
    feedback:
      '0': The middle of this fan is clear. But follow its lower edge. Who is there, if a glider veers that way?
      '1': The middle of this fan is clear. But follow its lower edge. Who is there, if a glider veers that way?
    hints:
      - Don’t look only at the middle of each fan. A glider could go anywhere inside it.
      - Follow both edges of each fan to the end. Does either edge reach a person?
    solution:
      - A glider’s nose can hurt someone, so the whole flight path has to be clear, not just the straight line.
      - The edge of fan A reaches the group at the tables. The edge of fan B reaches the kids on the bench.
      - All of fan C stays clear of people, so **Spot C** is safest. Testing a new device means expecting it to go the wrong way.

  - id: b5
    level: 2
    thinking: design
    covers: [S1.1, K1.7, S1.2, S1.3]
    type: build
    prompt: |-
      A stunt pilot is drawing a force diagram for a trick called the **Lazy Elevator**. The plane **climbs** while it
      **slows down**. The weight arrow is **6 cm** long. Choose whole-number lengths from 1 cm to 12 cm for the other
      three arrows, to make the trick work.
    fields:
      - { name: thrust, label: 'Thrust', unit: cm }
      - { name: drag, label: 'Drag', unit: cm }
      - { name: lift, label: 'Lift', unit: cm }
    rules:
      - { test: 'thrust % 1 == 0 && drag % 1 == 0 && lift % 1 == 0', fail: 'Use whole numbers of centimetres.' }
      - { test: 'thrust >= 1 && drag >= 1 && lift >= 1 && thrust <= 12 && drag <= 12 && lift <= 12', fail: 'Keep each arrow between 1 cm and 12 cm.' }
      - { test: 'lift > 6', fail: 'This plane isn’t climbing. Which arrow has to beat the weight arrow?' }
      - { test: 'drag > thrust', fail: 'This plane isn’t slowing down. Which of thrust and drag has to be longer?' }
    examples:
      - { thrust: 3, drag: 5, lift: 8 }
      - { thrust: 1, drag: 12, lift: 7 }
      - { thrust: 9, drag: 10, lift: 12 }
    counterexamples:
      - { thrust: 5, drag: 3, lift: 8 }
      - { thrust: 3, drag: 5, lift: 6 }
      - { thrust: 3, drag: 5, lift: 13 }
      - { thrust: 2.5, drag: 5, lift: 8 }
    hints:
      - Which pair of arrows decides whether the plane climbs? Which pair decides whether it slows down?
      - Deal with one pair at a time. Does what you choose for one pair change the other pair?
    solution:
      - The two pairs do separate jobs. Lift and weight decide the climbing. Thrust and drag decide the speed.
      - To climb, lift must be longer than 6 cm. To slow down, drag must be longer than thrust.
      - 'Thrust 3 cm, drag 5 cm, lift 8 cm works. So does thrust 9 cm, drag 10 cm, lift 12 cm. Both follow the same two rules, however long the arrows are.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.2, K1.5, K1.6, K1.7, S1.3, S1.2, U1.1]
    type: investigation
    figure: >-
      <svg viewBox="0 0 440 226" class="fig-svg" role="img" aria-label="A graph of a drone's altitude over its trip. In section A it rises from the ground. In section B it stays level. At the treehouse it drops the pizza. In section C it rises again. In section D it stays level at a higher altitude. In section E it descends to the ground.">
      <line class="sci-tick" x1="30" y1="10" x2="30" y2="196"/><line class="sci-tick" x1="30" y1="196" x2="430" y2="196"/>
      <line class="obj-line" x1="30" y1="194" x2="110" y2="100"/><line class="obj-line" x1="110" y1="100" x2="220" y2="100"/><line class="obj-line" x1="220" y1="100" x2="280" y2="56"/><line class="obj-line" x1="280" y1="56" x2="350" y2="56"/><line class="obj-line" x1="350" y1="56" x2="420" y2="194"/>
      <circle class="fig-hl" cx="220" cy="100" r="7"/>
      <text class="fig-label" x="56" y="134">A</text><text class="fig-label" x="160" y="90">B</text><text class="fig-label" x="238" y="66">C</text><text class="fig-label" x="310" y="46">D</text><text class="fig-label" x="396" y="124">E</text>
      <text class="fig-small" x="220" y="124" text-anchor="middle">drops the pizza</text>
      <text class="fig-small" x="230" y="216" text-anchor="middle">Along the trip</text><text class="fig-small" x="36" y="22">Altitude</text></svg>
    prompt: |-
      Zippy is a make-believe delivery drone. Its propellers give it both lift and thrust. Zippy takes off with a pizza,
      flies to a treehouse and drops the pizza into the basket without stopping. The graph shows its altitude on the trip.
    parts:
      - type: multi
        prompt: In which sections does the lift **equal** the weight? Select **all** of them.
        choices: [Section A, Section B, Section C, Section D, Section E]
        fixedOrder: true
        answer: [1, 3]
        feedback:
          '0': The line is going up here. What does that tell you about lift and weight?
          '2': The line is going up here. What does that tell you about lift and weight?
          '4': The line is going down here. What does that tell you about lift and weight?
        hints:
          - What does the line look like when the altitude isn’t changing?
        solution:
          - When lift equals weight, the altitude stays the same, so the line is flat. That happens in sections **B** and **D**.
          - In A and C, lift is greater than weight. In E, weight is greater than lift.
      - type: mc
        prompt: Right after the pizza drops, Zippy shoots upward, even though its propellers haven’t changed at all. Why?
        choices:
          - The weight got smaller, so the same lift is now greater than the weight.
          - The lift got bigger, because lift grows as soon as the pizza is gone.
          - The falling pizza pushes the drone upward, and that gives it some thrust.
          - The drag from the air disappears, so the drone is free to go upward.
        answer: 0
        feedback:
          '1': The story says the propellers haven’t changed. So which of the two forces did change?
          '2': Thrust comes from Zippy’s propellers, and they haven’t changed. What did the pizza add to the drone before it dropped?
          '3': Drag acts against the movement. Which pair of forces decides whether a flyer goes up or down?
        hints:
          - Lift and weight decide whether Zippy climbs. Which of these changed when the pizza left?
        solution:
          - The pizza was part of what gravity was pulling down. Without it, Zippy’s **weight** is smaller.
          - The lift is the same as before, so now lift is greater than weight, and Zippy climbs.
      - type: mc
        prompt: In section D, Zippy is flying level again without the pizza. What must have happened at the end of section C?
        choices:
          - The propellers slowed so that lift got smaller, down to the new weight.
          - Zippy’s weight went up, until it was the same as the weight it had before.
          - The propellers sped up so that the lift got greater than the new weight.
          - Thrust grew until it was the same as the lift from the propellers.
        answer: 0
        feedback:
          '1': Nothing was added to Zippy. Can the weight go back up without the pizza?
          '2': If lift got even greater than the weight, would the line on the graph go flat?
          '3': Thrust is paired with drag, not lift. Which pair decides the altitude?
        hints:
          - What must be true of lift and weight in a flat section? Has the weight changed since the pizza dropped?
        solution:
          - Level flight needs lift to equal weight. Zippy’s weight is now smaller, and it stays that way.
          - So the lift must have come down to match it. That happens when the propellers slow a little.
      - type: mc
        prompt: |-
          The next day, Zippy tows a huge, flat banner that weighs **the same** as the pizza. Zippy must fly at the same
          speed and altitude as in section B. What has to change, compared with carrying the pizza?
        choices:
          - More thrust, because the banner adds drag. The lift can stay the same.
          - More lift, because the banner is so big. The thrust can stay the same.
          - More lift and more thrust, because any big load needs more of each one.
          - Nothing at all, because the banner has the same weight as the pizza.
        answer: 0
        feedback:
          '1': The banner weighs the same as the pizza. So does lift need to change to hold it up?
          '2': Look at each pair on its own. Did the weight change? Did the drag change?
          '3': Weight is one of four forces. What would a huge, flat shape do as it moves through the air?
        hints:
          - Check each opposing pair on its own. Which force in the lift and weight pair has changed, if any?
          - What does a huge, flat shape do as it moves through the air?
        solution:
          - 'Lift and weight: the weight is the same, so the same lift holds Zippy at that altitude.'
          - 'Thrust and drag: a huge, flat banner has much more drag. To keep the same speed, thrust has to grow to match the new drag.'
    wrapUp: |-
      Each opposing pair does its own job. Change the weight, and the altitude is affected. Change the drag, and the speed
      is affected. To fix a flight, find out which pair has become uneven.

  - id: d2
    level: 3
    thinking: why
    covers: [K1.3, K1.4, K1.6, S1.2, S1.3, U1.1]
    type: investigation
    figure: >-
      <svg viewBox="0 0 400 150" class="fig-svg" role="img" aria-label="A foam rocket in three stages. Going up, it points up with a dashed arrow pointing up. At the top, it has stopped. Coming down, it points down with a dashed arrow pointing down.">
      <rect class="obj" x="62" y="46" width="16" height="48" rx="3"/><polygon class="obj" points="62,46 78,46 70,28"/><line class="fig-arrow" x1="100" y1="90" x2="100" y2="30"/><polygon class="fig-hl" points="100,20 93,34 107,34"/>
      <rect class="obj" x="192" y="26" width="16" height="48" rx="3"/><polygon class="obj" points="192,26 208,26 200,8"/>
      <rect class="obj" x="322" y="46" width="16" height="48" rx="3"/><polygon class="obj" points="322,94 338,94 330,112"/><line class="fig-arrow" x1="360" y1="40" x2="360" y2="100"/><polygon class="fig-hl" points="360,110 353,96 367,96"/>
      <text class="fig-small" x="80" y="140" text-anchor="middle">Going up</text><text class="fig-small" x="200" y="140" text-anchor="middle">Stopped at the top</text><text class="fig-small" x="330" y="140" text-anchor="middle">Coming down</text></svg>
    prompt: |-
      On a still day in an open field, you launch a foam rocket straight up. Once it leaves the launcher, nothing pushes
      it any more. It rises, slows down, stops for a moment at the top and comes back down.
    parts:
      - type: mc
        prompt: Which way does the **drag** on the rocket point?
        choices:
          - 'Going up, it points down. Coming down, it points up.'
          - 'Going up, it points down. Coming down, it points down.'
          - 'Going up, it points up. Coming down, it points down.'
