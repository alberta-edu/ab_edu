id: energy-resources
grade: 5
subject: science
organizingIdea: SCI-OI2
outcomes: [SCI5-OI2-GQ2-LO1]
order: 5
title: Renewable and Non-renewable Energy
shortTitle: Renewable and non-renewable energy
summary: >-
  Run 100 years of energy use to see which resources run out, compare renewable and non-renewable energy,
  and explore how Alberta and the rest of Canada make electricity.

bigIdea: |-
  - People rely on **energy resources** to meet their energy needs.
  - **Renewable** resources, like sunlight and wind, are naturally replenished.
  - **Non-renewable** resources, like fossil fuels, get used up. They take thousands or millions of years to form again.

lesson:
  - title: 'Virtual experiment: 100 years of energy'
    blocks:
      - type: experiment
        covers: [K1.1, K1.2, K1.4, U1.1]
        title: Use five energy resources every year for 100 years
        question: |-
          A town uses **solar**, **wind**, **biomass** (wood from a forest that is replanted), **coal** and
          **natural gas** every year. Watch what is left.
        animation: energy-run
        predict:
          choices:
            - All five run out.
            - Coal and natural gas run out. The others are still there.
            - Solar and wind run out. The others are still there.
            - None of them run out.
          answer: 1
        observe: |-
          After 100 years, **solar**, **wind** and **biomass** were still available. **Coal** and **natural gas** ran
          out, and they did not come back.
        explain: |-
          - The Sun shines and the wind blows again every day. New trees grow where trees were cut, because the forest was replanted. These are **renewable**.
          - Coal and natural gas take **millions of years** to form. Once they are used, they are gone for a very long time. They are **non-renewable**.

  - title: Renewable energy resources
    blocks:
      - type: table
        covers: [K1.2, K1.3]
        caption: Renewable resources are naturally replenished, if they are handled responsibly.
        headers: [Resource, The energy comes from…]
        rows:
          - ['☀️ **Solar**', 'sunlight']
          - ['💨 **Wind**', 'moving air']
          - ['🌳 **Biomass**', 'wood and other plant material']
          - ['🌋 **Geothermal**', 'heat from deep inside Earth']
          - ['🌊 **Tidal**', 'ocean tides rising and falling']
          - ['💧 **Water and hydro**', 'flowing water in rivers and at dams']
      - type: callout
        variant: mistake
        covers: [K1.2]
        title: Renewable only if handled responsibly
        body: A forest is renewable **if it is replanted**. Cut trees faster than they can grow back, and the forest gets used up.

  - title: Non-renewable energy resources
    blocks:
      - type: compare
        covers: [K1.4, K1.5]
        columns:
          - title: Fossil fuels
            body: |-
              **Coal**, **oil** and **natural gas**. They take millions of years to form, so once they are burned, they
              are not replenished.
          - title: Nuclear
            body: |-
              Nuclear power stations use **uranium**, a metal mined from the ground. Earth won't make more of it for
              us to use.
      - type: compare
        covers: [K1.1, S1.1]
        columns:
          - title: Renewable
            body: Naturally **replenished**. Not used up over time.
          - title: Non-renewable
            body: '**Used up** over time. Not replenished for thousands or millions of years.'

  - title: Advantages and disadvantages
    blocks:
      - type: table
        covers: [S1.2, S1.1, U1.1]
        headers: [Resource, Advantage, Disadvantage]
        rows:
          - ['Solar', 'Renewable. No smoke while making electricity.', 'Works only when the Sun is shining.']
          - ['Wind', 'Renewable. No smoke while making electricity.', 'Works only when the wind is blowing.']
          - ['Water and hydro', 'Renewable. Makes electricity day and night.', 'Dams flood land and change rivers where animals live.']
          - ['Biomass', 'Renewable when forests and crops are replanted.', 'Burning it makes smoke.']
          - ['Fossil fuels', 'Ready any time. Easy to store and move.', 'Non-renewable. Burning them pollutes the air.']
          - ['Nuclear', 'Makes a lot of electricity steadily, with no smoke.', 'Non-renewable. Its waste must be stored safely for a very long time.']

  - title: Energy across Canada
    blocks:
      - type: visual
        covers: [S1.3, K1.6]
        component: energy-map
        props: { start: AB }
        caption: |-
          - Each box is a province or territory, in roughly the right place.
          - The colour shows how it makes **most of its electricity**. Tap a box to read more.
          - Based on 2021 data from the Canada Energy Regulator.
      - type: callout
        variant: tip
        covers: [K1.6]
        title: Alberta uses both kinds
        body: |-
          Alberta relies on **fossil fuels** (non-renewable) and on **water and hydro**, **wind** and **biomass**
          (renewable) to meet its energy needs.

keyTerms:
  - term: Energy resource
    covers: [K1.1, U1.1]
    definition: Something people use to meet their energy needs, such as wind, sunlight or coal.
  - term: Renewable
    covers: [K1.2]
    definition: Naturally replenished, so it is not used up over time if it is handled responsibly.
  - term: Non-renewable
    covers: [K1.4]
    definition: Used up over time, because it will not be replenished for thousands or millions of years.
  - term: Fossil fuels
    covers: [K1.5]
    definition: Coal, oil and natural gas. They are non-renewable.
  - term: Biomass
    covers: [K1.3]
    definition: Wood and other plant material used for energy. Renewable when it is replanted.
  - term: Geothermal
    covers: [K1.3]
    definition: Energy from heat deep inside Earth. Renewable.
  - term: Tidal
    covers: [K1.3]
    definition: Energy from ocean tides rising and falling. Renewable.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.1, K1.3, K1.5]
    type: multi
    prompt: A class is putting a green leaf sticker on every **renewable** energy resource. Which ones get a sticker?
    choices: [Tidal, Geothermal, Biomass, Oil, Coal, Nuclear]
    answer: [0, 1, 2]
    hints:
      - Which of these does nature keep making more of, soon enough for us to use?
      - Coal and oil are fossil fuels. What does that tell you?
    solution:
      - Tides keep rising and falling, heat keeps coming from deep inside Earth, and replanted plants grow back. Those three get a sticker.
      - Oil and coal are fossil fuels, and nuclear uses uranium. All three are non-renewable.

  - id: w2
    level: 1
    thinking: why
    covers: [K1.4, K1.5]
    type: mc
    prompt: Coal forms naturally in the ground. So why don’t we call it **renewable**?
    choices:
      - New coal takes millions of years to form.
      - Coal is found under the ground.
      - Burning coal makes smoke.
      - Coal is not a natural material.
    answer: 0
    feedback:
      '1': Heat for geothermal energy also comes from under the ground, and geothermal is renewable. Where something is found doesn’t decide it.
      '2': Burning wood makes smoke too, and wood from a replanted forest is renewable. What does the word “renewable” ask about?
      '3': The question says coal forms naturally. Being natural isn’t enough. What else matters?
    hints:
      - Renewable means nature replenishes it. How long would that take for coal?
    solution:
      - Renewable is about how soon nature replaces what we use.
      - Coal takes **millions of years** to form, so what we burn won’t be replaced in time for anyone to use it.

  - id: w3
    level: 1
    thinking: notice
    covers: [S1.2]
    type: multi
    prompt: Picture a **dark, calm** night. No Sun, and not one leaf is moving. Which of these **can’t** make electricity right now?
    choices: [Solar, Wind, Water and hydro, Nuclear, Natural gas]
    answer: [0, 1]
    hints:
      - For each one, ask what it needs. Is that thing there tonight?
    solution:
      - Solar needs sunshine and wind needs moving air. Tonight neither is there.
      - A river keeps flowing at night, and nuclear and natural gas power stations don’t need sun or wind.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [K1.4, S1.1, S1.3]
    type: mc
    prompt: |-
      Almost all of Nunavut’s electricity comes from diesel, a fossil fuel. A ship brings a new load every summer.
      Arlo says, “It comes back every year, so diesel is renewable!” What is wrong with Arlo’s thinking?
    choices:
      - The ship brings more, but nature won’t replace that fuel for millions of years.
      - It comes back only once a year, and it would need to come back every day.
      - Nothing that comes from far away can be called a renewable resource.
      - The ship uses fuel to get there, so more fuel is lost than the ship brings.
    answer: 0
    feedback:
      '1': What if a ship came every single day? Would that change how long the fuel takes to form?
      '2': Sunlight comes from very far away, and solar is renewable. Distance isn’t the test.
      '3': That may matter, but it isn’t what makes a resource renewable or not. What does the word ask about?
    hints:
      - Who is doing the “bringing back” here, people or nature?
      - Follow the fuel backward. Once the ship’s load is burned, what replaces the fuel in the ground?
    solution:
      - Renewable means **nature** replenishes the resource. So ask who is bringing the diesel back.
      - People move it from a store of fuel that took millions of years to form. Each load leaves that store a little emptier.
      - Why it seemed right is that the fuel really does arrive every year. Being delivered again isn’t the same as being made again.

  - id: b2
    level: 2
    thinking: notice
    covers: [S1.3, S1.2, U1.1]
    type: mc
    prompt: |-
      The map says Prince Edward Island is “mostly wind”. Read the details: “Almost all the electricity **made** on the
      island comes from wind, but most of what Islanders **use** is bought from New Brunswick.”

      A calm week comes and the island’s turbines stop. What is most likely?
    choices:
      - Most lights stay on, because most of the electricity comes from New Brunswick.
      - All the lights go out, because the island’s electricity is made from wind.
      - The turbines keep spinning, because wind is renewable and can’t run out.
      - The island switches to tidal power, because it has the ocean all around it.
    answer: 0
    feedback:
      '1': That would be true if all the electricity Islanders use were made on the island. Read the details again.
      '2': Renewable means the wind will come back. Does it mean the wind blows every day?
      '3': Nothing in the details says the island makes tidal power. What do they say about where its electricity comes from?
    hints:
      - The details use two different words in bold. What is the difference between them?
      - Where does most of the electricity Islanders use come from? Does that place need wind on the island?
    solution:
      - The map colour shows how electricity is **made** on the island. That isn’t the same as what people there **use**.
      - Most of what Islanders use comes from New Brunswick, so a calm week on the island doesn’t stop most of it.
      - 'What we learned: to know how a place meets its energy needs, read past the colour on the map.'

  - id: b3
    level: 2
    thinking: connect
    covers: [S1.1, S1.2, K1.3, K1.5]
    type: text
    figure: >-
      <svg viewBox="0 0 420 210" class="fig-svg" role="img" aria-label="A chart with two columns, no smoke and makes smoke, and two rows, renewable and non-renewable. Solar is in the box for renewable with no smoke. A question mark is in the box for renewable that makes smoke. Nuclear is in the box for non-renewable with no smoke. Coal is in the box for non-renewable that makes smoke.">
      <text class="fig-label" x="205" y="28" text-anchor="middle">No smoke</text><text class="fig-label" x="340" y="28" text-anchor="middle">Makes smoke</text>
      <text class="fig-label" x="4" y="92">Renewable</text><text class="fig-label" x="4" y="172">Non-</text><text class="fig-label" x="4" y="192">renewable</text>
      <rect class="fig-rect" x="140" y="44" width="130" height="76"/><rect class="fig-hl" x="275" y="44" width="130" height="76"/>
      <rect class="fig-rect" x="140" y="126" width="130" height="76"/><rect class="fig-rect" x="275" y="126" width="130" height="76"/>
      <text class="fig-label" x="205" y="88" text-anchor="middle">Solar</text><text class="fig-label" x="340" y="90" text-anchor="middle" font-size="30">?</text>
      <text class="fig-label" x="205" y="170" text-anchor="middle">Nuclear</text><text class="fig-label" x="340" y="170" text-anchor="middle">Coal</text>
      </svg>
    prompt: |-
      Cleo says, “Renewable and no smoke mean the same thing!” She makes this chart to prove it, then gets stuck on
      the **?** box. Which energy resource from the lesson belongs in that box?
    accept: [biomass, wood, burning wood, trees, plant material]
    hints:
      - The box needs a resource that is renewable but still makes smoke. How can something make smoke?
      - Look for a renewable resource that gets burned.
    solution:
      - 'The **?** box needs something renewable that makes smoke when it is used: **biomass**. Burned wood makes smoke, and a replanted forest grows back.'
      - Cleo’s chart also has **nuclear**, which has no smoke but is non-renewable. So her idea fails both ways.
      - These are two different questions. Will it run out? Does it make smoke? One answer doesn’t tell you the other.

  - id: b4
    level: 2
    thinking: connect
    covers: [S1.3, K1.5, K1.6]
    type: multi
    prompt: |-
      The silly villain Baron Blackout steals **every drop and lump of fossil fuel** in Canada. These notes come from
      the lesson’s map. Which places lose most of their electricity?

      | Place | Makes most electricity from |
      |---|---|
      | Alberta | natural gas |
      | Quebec | water (hydro) |
      | Ontario | nuclear |
      | Nunavut | diesel, made from oil |
      | Nova Scotia | coal and natural gas |
    choices: [Alberta, Nunavut, Nova Scotia, Ontario, Quebec]
    answer: [0, 1, 2]
    hints:
      - Which three things count as fossil fuels?
      - Non-renewable and fossil fuel are not the same group. Check Ontario with care.
    solution:
      - Fossil fuels are coal, oil and natural gas. Alberta, Nunavut and Nova Scotia all rely on them, so the Baron’s plan works there.
      - Ontario’s nuclear energy is non-renewable, but it isn’t a fossil fuel. It keeps running.
      - Quebec doesn’t even notice. Its rivers keep flowing.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: evidence
    covers: [S1.2, K1.3, S1.1]
    type: investigation
    prompt: |-
      The lights in Aunt Bea’s cabin turn on and off by themselves. Her neighbour blames a ghost named Gerald. The
      cabin has one energy source and no batteries. You keep a log.

      | When | Sky | Wind | Lights |
      |---|---|---|---|
      | Mon noon | sunny | calm | on |
      | Mon midnight | dark | calm | off |
      | Tue noon | sunny | windy | on |
      | Tue midnight | dark | windy | off |
    parts:
      - type: mc
        prompt: Which energy source fits **every** row of the log?
        choices: [Solar, Wind, Hydro from a creek, A diesel generator]
        answer: 0
        feedback:
          '1': Look at Monday noon and Tuesday midnight. Do the lights follow the wind?
          '2': A creek flows day and night. Would the lights go off at midnight?
          '3': Diesel is ready any time. Why would it stop at midnight?
        hints:
          - Find two rows where only one thing changed.
          - Compare Tuesday noon with Tuesday midnight. What changed, and what stayed the same?
        solution:
          - The lights are on in both sunny rows and off in both dark rows. The wind makes no difference.
          - So the cabin runs on **solar**. Sorry, Gerald.
      - type: mc
        prompt: |-
          The cabin next door also has one source and no batteries. Its log has only two rows:
          **noon, sunny and windy: on.** **Midnight, dark and calm: off.** What can you say about its source?
        choices:
          - You can’t tell yet, because solar and wind both fit.
          - It must be solar, because the lights are on when it is sunny.
          - It must be wind, because the lights are on when it is windy.
          - It can’t be solar or wind, because both rows are different.
        answer: 0
        feedback:
          '1': That fits the log. But test wind against the same two rows. Does it fit too?
          '2': That fits the log. But test solar against the same two rows. Does it fit too?
          '3': Being different is what you would expect from solar or wind. Try each one on both rows.
        hints:
          - Test solar on both rows. Then test wind on both rows.
          - In this log, the Sun and the wind always came and went together.
        solution:
          - Solar would give on, then off. Wind would also give on, then off.
          - Sun and wind changed **together** in this log, so it can’t separate them. Sometimes the honest answer is “not yet”.
      - type: mc
        prompt: You can log one more moment at the cabin next door. Which moment would **settle** it?
        choices:
          - A dark, windy night
          - A sunny, windy noon
          - A dark, calm night
        answer: 0
        feedback:
          '1': Solar and wind would both give “on” here. Would that help you choose?
          '2': Solar and wind would both give “off” here. Would that help you choose?
        hints:
          - You need a moment when solar and wind would give **different** results.
          - So you want one of them to be there and the other to be missing.
        solution:
          - On a dark, windy night, solar would give off and wind would give on. Either result tells you the source.
          - A sunny, calm noon would settle it too. Both moments pull the Sun and the wind apart.
    wrapUp: Each resource needs something to work. Knowing what it needs lets you predict when it stops, and clears Gerald’s name.
    hints: []
    solution: []

  - id: d3
    level: 3
    thinking: connect
    covers: [K1.1, K1.2, K1.4, S1.1]
    type: multi
    prompt: |-
      People on the made-up planet Zibble use these four energy resources. Nobody on Earth has heard of them, but
      the meaning of **renewable** still works. Select **all** the renewable ones.
    choices:
      - 'Fizzweed: only one small patch left, but it grows back in a month if some is left.'
      - 'Geyser steam: Zibble’s hot centre keeps pushing it up, day after day.'
      - 'Snorp crystals: enough for 1000 more years, but new ones take 9 million years to form.'
      - 'Blue tar: easy to store and ready any time. It took 5 million years to form.'
    answer: [0, 1]
    hints:
      - Ignore how much there is for now. What question does the word “renewable” ask?
      - For each one, ask how soon nature would replace what people use.
    solution:
      - Renewable asks whether nature replenishes a resource soon enough to use it, not how much there is today.
      - Fizzweed grows back in a month, so it is renewable, though only if people handle it responsibly. If they burn the whole patch, it is gone.
      - Geyser steam keeps coming, like geothermal heat on Earth.
      - Snorp crystals feel safe because there are so many, but they are slowly being used up. Blue tar is handy, but handy isn’t the test. Both are non-renewable.
