id: seasons-day-length
grade: 5
subject: science
organizingIdea: SCI-OI5
outcomes: [SCI5-OI5-GQ1-LO1]
order: 10
title: "Seasons, Day Length and Earth's Tilt"
shortTitle: "Seasons, day length and Earth's tilt"
summary: >-
  Move Earth around the Sun to see how its tilt makes seasons and long or short days, watch the midnight
  sun in Inuvik, and see how seasons guide people's lives.

bigIdea: |-
  - Earth's axis is **tilted**, and it always tilts the same way as Earth travels around the Sun.
  - Tilted **toward** the Sun: summer and **longer days**.
  - Tilted **away**: winter and shorter days.
  - So the northern and southern hemispheres have opposite seasons.

lesson:
  - title: "Earth's tilt makes the seasons"
    blocks:
      - type: visual
        covers: [K1.4, K1.5, S1.1, S1.7]
        component: seasons-orbit
        caption: |-
          Press **Play a year** or drag the date. Watch which hemisphere tilts **toward** the Sun, and how the
          daylight bars grow and shrink.
      - type: compare
        covers: [K1.4, K1.5]
        columns:
          - title: Tilted toward the Sun
            body: '**Summer.** Longer days and shorter nights.'
          - title: Tilted away from the Sun
            body: '**Winter.** Shorter days and longer nights.'

  - title: Solstices and equinoxes
    blocks:
      - type: table
        covers: [K1.2, K1.5, S1.4, K1.3]
        caption: Daylight in Edmonton, Alberta. These days come back every year.
        headers: [Day, About when, What happens, Daylight in Edmonton]
        rows:
          - ['**June solstice**', 'June 21', 'Northern hemisphere tilted most toward the Sun. Longest day of the year in the north.', 'About 17 hours']
          - ['**September equinox**', 'September 22 or 23', 'Neither hemisphere tilted toward the Sun. Day and night are about equal everywhere.', 'About 12 hours']
          - ['**December solstice**', 'December 21', 'Northern hemisphere tilted most away from the Sun. Shortest day of the year in the north.', 'About 7½ hours']
          - ['**March equinox**', 'March 20', 'Neither hemisphere tilted toward the Sun. Day and night are about equal everywhere.', 'About 12 hours']
      - type: callout
        variant: mistake
        covers: [K1.4]
        title: Not about being closer to the Sun
        body: |-
          - If seasons came from Earth moving closer to the Sun, the whole planet would have summer at the same time.
          - Instead, it is summer in one hemisphere while it is winter in the other.
          - The **tilt** is the reason.

  - title: 'Virtual experiment: the midnight sun'
    blocks:
      - type: experiment
        covers: [K1.5, S1.1, S1.6]
        title: Watch the Sun from noon until midnight on June 21
        question: Watch the Sun from noon until midnight in **Edmonton** and in **Inuvik**, a town much farther north in the Northwest Territories.
        animation: sun-path
        predict:
          choices:
            - At midnight, the Sun is still in the sky in Inuvik only.
            - At midnight, the Sun is still in the sky in Edmonton only.
            - At midnight, the Sun is still in the sky in both places.
            - At midnight, the Sun has set in both places.
          answer: 0
        observe: |-
          In **Edmonton**, the Sun set late in the evening. In **Inuvik**, the Sun dipped low in the north but stayed
          above the horizon, even at **midnight**.
        explain: |-
          - In June, the northern hemisphere is tilted toward the Sun.
          - Inuvik is so far north that it stays in sunlight all day and night. This is the **midnight sun**.
          - In December, the north is tilted away, and Inuvik has weeks when the Sun doesn't rise: the **polar night**.
      - type: text
        covers: [S1.6, S1.8]
        body: |-
          - In the far North, the Sun's return after the dark of winter is a big event.
          - In Inuit tradition, the Sun was not safely back until it rose about a mitten's width above the horizon.
          - Today, the town of Inuvik holds a **Sunrise Festival** each January to welcome it back.

  - title: Seasons in people's lives
    blocks:
      - type: table
        covers: [K1.8, S1.7, S1.8]
        caption: Ways people represent astronomical phenomena
        headers: [Representation, Example]
        rows:
          - ['**Calendars**', 'Calendars mark the solstices and equinoxes.']
          - ['**Cycles**', 'Spring, summer, fall and winter repeat in the same order every year.']
          - ['**Stories and legends**', 'Inuit stories of the Sun and the Moon as a sister and a brother chasing each other across the sky.']
          - ['**Artifacts**', 'Objects made to follow the Sun, like a sundial.']
          - ['**Models and digital simulations**', 'The orbit model in step 1 of this lesson.']
      - type: compare
        covers: [K1.7, K1.9, S1.5, S1.9, U1.1]
        columns:
          - title: Ceremonies
            body: First Nations, Métis and Inuit ways of living connect to the seasons. Many Plains First Nations hold the **Sun Dance**, a yearly ceremony usually held in late spring or early summer.
          - title: Planting and harvesting
            body: Longer, warmer days in spring tell farmers it is time to **plant**. Shorter days in fall mean it is time to **harvest**.
          - title: Hunting
            body: Hunters watch the seasons, because many animals **migrate** and gather at the same times each year.

keyTerms:
  - term: Axis
    covers: [K1.4]
    definition: The imaginary line through the North and South Poles that Earth spins around. It is tilted.
  - term: Northern hemisphere
    covers: [K1.4]
    definition: The half of Earth north of the equator. Canada is in the northern hemisphere.
  - term: Solstice
    covers: [K1.2]
    definition: The day with the longest or the shortest daylight of the year, in June or December.
  - term: Equinox
    covers: [K1.2]
    definition: A day in March or September when day and night are about equal everywhere.
  - term: Midnight sun
    covers: [K1.5, S1.6]
    definition: When the Sun stays in the sky all night, far in the north in summer.
  - term: Polar night
    covers: [K1.5, S1.6]
    definition: When the Sun doesn't rise all day, far in the north in winter.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.4, K1.2]
    type: mc
    prompt: On the **December solstice**, which hemisphere is tilted toward the Sun?
    choices: [Southern, Northern, Both, Neither]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Think about Alberta in December. What season is it, and what does that say about the tilt?
      '2': Earth is one solid ball with one tilt. If one end leans toward the Sun, what does the other end do?
      '3': That is true on another kind of day. Which days are those?
    hints:
      - What season is it in Canada in December?
    solution:
      - It is winter in Canada, so the north is tilted away from the Sun. That means the **southern** hemisphere is tilted toward it.

  - id: w2
    level: 1
    thinking: apply
    covers: [K1.5, S1.1]
    type: number
    prompt: On the June solstice, Edmonton gets about **17 hours** of daylight. About how many hours of **darkness** does it get that day?
    answer: 7
    unit: hours
    verify: '24 - 17'
    hints:
      - How many hours are there in one whole day, light and dark together?
    solution:
      - 'A day always has 24 hours. The tilt only changes how they are shared out: \(24 - 17 = 7\) hours of darkness.'

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.5, S1.6]
    type: mc
    prompt: It is midnight on June 21. You are camping near Inuvik. You unzip the tent and look north. What do you see?
    choices:
      - The Sun, low above the horizon
      - The Sun, high overhead
      - A dark sky full of stars
      - The Moon, where the Sun should be
    answer: 0
    feedback:
      '1': The Sun does stay up, but think back to the experiment. Where was it at midnight?
      '2': That is what midnight looks like in Edmonton on a clear night. What is special about Inuvik in June?
      '3': The Moon doesn’t take over from the Sun. Which way is the north tilted in June?
    hints:
      - Remember the experiment that followed the Sun from noon until midnight.
    solution:
      - This is the **midnight sun**. In June, Inuvik stays in sunlight all night, and the Sun dips low in the north without setting.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.4, K1.5, S1.1]
    type: mc
    figure: >-
      <svg viewBox="0 0 420 180" class="fig-svg" role="img" aria-label="The Sun in the middle with Earth on each side. Earth A is to the left of the Sun and Earth B is to the right. On both, the axis leans the same way, with the north end marked N leaning to the right. So on Earth A the N end leans toward the Sun, and on Earth B it leans away.">
      <circle class="fig-hl" cx="210" cy="86" r="36"/>
      <text class="sci-text" x="210" y="91" text-anchor="middle">Sun</text>
      <circle class="obj" cx="70" cy="86" r="34"/><line class="fig-arrow" x1="39" y1="73" x2="101" y2="99"/><line class="obj-line" x1="90" y1="40" x2="50" y2="132"/>
      <text class="sci-text" x="94" y="36">N</text>
      <circle class="obj" cx="350" cy="86" r="34"/><line class="fig-arrow" x1="319" y1="73" x2="381" y2="99"/><line class="obj-line" x1="370" y1="40" x2="330" y2="132"/>
      <text class="sci-text" x="374" y="36">N</text>
      <text class="sci-text" x="70" y="166" text-anchor="middle">Earth A</text><text class="sci-text" x="350" y="166" text-anchor="middle">Earth B</text></svg>
    prompt: This picture shows Earth at two points on its trip around the Sun. **N** marks the North Pole, and the picture is not to scale. Which Earth shows **June** in Alberta?
    choices: [Earth A, Earth B, Both, Neither]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Put your finger on the N. Which way does that end lean, compared with where the Sun is?
      '2': The axis leans the same way in both pictures, which is easy to notice. But is the N end on the same side of the Sun?
      '3': The north is tilted toward the Sun for part of the year. Check both pictures again.
    hints:
      - Alberta is in the northern half of Earth. Find the N on each Earth.
      - In June, is the north tilted toward the Sun or away from it?
    solution:
      - On **Earth A**, the N end leans toward the Sun, so the north has summer and long days. That is June.
      - On Earth B, the same lean now points away from the Sun, so that is December.
      - Look at what didn’t change. The axis leans the same way in both pictures. Only Earth’s place on its trip changed.

  - id: b2
    level: 2
    thinking: pattern
    covers: [K1.5, S1.1]
    type: mc
    prompt: |-
      Here is the daylight in three made-up towns in the northern hemisphere. Which town is **farthest north**?

      | Town | June solstice | December solstice |
      |---|---|---|
      | Pine Hollow | 15 hours | 9 hours |
      | Elk Crossing | 18 hours | 6 hours |
      | Lynx Bay | 22 hours | 2 hours |
    choices: [Lynx Bay, Pine Hollow, Elk Crossing, You can’t tell]
    fixedOrder: true
    answer: 0
    feedback:
      '1': It is tempting to think the far north is dark, so it must have the fewest hours in June. What happened in Inuvik in June?
      '2': Elk Crossing fits in the middle. Which town has the biggest change between June and December?
      '3': You can tell. You already know what Edmonton and Inuvik do. Which one has the bigger change, and which one is farther north?
    hints:
      - Compare two places you know, Edmonton and Inuvik. What happens to each of them in June and in December?
      - Work out the gap between June and December for each town.
    solution:
      - Edmonton goes from about 17 hours to about 7½. Inuvik, much farther north, goes from all day to none. The farther north, the **bigger the swing**.
      - The gaps are Pine Hollow 6 hours, Elk Crossing 12 hours and Lynx Bay 20 hours. So **Lynx Bay** is farthest north.

  - id: b3
    level: 2
    thinking: notice
    covers: [S1.4, K1.3]
    type: multi
    prompt: You are filling in next year’s calendar today, **in pen**. Which of these could you mark on the right day, within a day or so? Select **all** that work.
    choices:
      - The longest day of the year
      - The day in March when day and night are about equal
      - The first big snowfall of the winter
      - The hottest afternoon of the summer
    fixedOrder: true
    answer: [0, 1]
    hints:
      - Which of these are caused by where Earth is on its trip around the Sun? Which are weather?
    solution:
      - ✓ The longest day is the June solstice. Earth’s trip repeats every year, so you can mark it years ahead.
      - ✓ The March equinox comes back on time every year in the same way.
      - ✗ A snowfall is weather. Weather follows the seasons in a rough way, but no one can give its exact day a year ahead.
      - ✗ The hottest afternoon is weather too. It can move by weeks from one year to the next.

  - id: b4
    level: 2
    thinking: decide
    covers: [S1.9, K1.9, U1.1]
    type: mc
    prompt: |-
      In February, a Chinook, a warm winter wind, melts the snow on Aunt Marnie’s farm. She stands outside in a T-shirt
      with her tomato seeds. “It’s spring! Time to plant!” Grandpa points at the Sun, already setting in the late afternoon. Which clue should she trust more?
    choices:
      - The short days, because day length follows the same cycle each year
      - The warm wind, because seeds only care about the temperature today
      - The warm wind, because a Chinook means that spring has come early
      - The short days, because February days are as long as those in June
    answer: 0
    feedback:
      '1': The warmth is real, but how long might it last? Seeds will need warm days for weeks.
      '2': A Chinook is weather. It can blow for a few days and then leave. Has Earth moved any farther along its trip?
      '3': Right clue, wrong reason. Compare February’s short days with the long days of June.
    hints:
      - Which of the two clues could change again by next week?
      - What moves the seasons along? Could one warm wind speed that up?
    solution:
      - A Chinook is **weather**, and it can be gone in days. Winter can come right back and kill young plants.
      - Day length comes from Earth’s tilt and its trip around the Sun, so it can’t be fooled. Short days tell Aunt Marnie that it is still winter.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d2
    level: 3
    thinking: flaw
    covers: [K1.4]
    type: mc
    prompt: |-
      Hanif’s pen pal Bronte lives in Perth, Australia. Bronte writes, “Earth is closest to the Sun in early January. I checked! And January
      here is boiling. So being closer must cause summer.” Hanif reads this in Edmonton, beside a snowdrift. Bronte’s fact is true. So where does Bronte’s reasoning fail?
    choices:
      - Earth is that close for Edmonton too, and it is winter in Edmonton.
      - Perth is much nearer to the Sun than Edmonton is in January.
      - Perth’s heat in January comes from its deserts and not from the Sun.
      - Nothing in space can be at its closest during a winter month.
    answer: 0
    feedback:
      '1': Compared with how far away the Sun is, is the gap between two towns on Earth a big one or a tiny one?
      '2': Why are there deserts and hot summers there in the first place? And why is January hot, but not July?
      '3': The problem says that Bronte’s fact is true, and it is. Winter in one place doesn’t stop Earth being close.
    hints:
      - Bronte checked one place. Try Bronte’s reason in another place on the same day.
      - If being closer caused summer, who else should be having summer in January?
    solution:
      - Test the reason in another place. In early January, the whole Earth is at its closest, yet Edmonton is deep in winter.
      - So closeness can’t be the cause. In January, Perth is tilted toward the Sun and Edmonton is tilted away.
      - It seemed right because Bronte’s two facts really do happen together in Perth. One place that fits doesn’t prove a cause.

  - id: d4
    level: 3
    thinking: design
    covers: [K1.4, K1.5, S1.7, S1.1]
    type: build
    prompt: |-
      A storybook writer invents **Kelp Harbour**, a town in the **southern** hemisphere. Science-loving readers will check the book’s daylight chart.
      Fill it in so that they can’t complain. Make June and December add up to about 24 hours, as they do in Edmonton (17 + 7½).
    fields:
      - { name: june, label: 'June solstice', unit: hours }
      - { name: sept, label: 'September equinox', unit: hours }
      - { name: dec, label: 'December solstice', unit: hours }
      - { name: mar, label: 'March equinox', unit: hours }
    rules:
      - { test: 'sept == 12 && mar == 12', fail: 'Check the equinoxes. Is either hemisphere tilted toward the Sun on those days?' }
      - { test: 'june < 12', fail: 'Which way is the southern hemisphere tilted in June? What does that do to the length of the day?' }
      - { test: 'dec > 12', fail: 'Which way is the southern hemisphere tilted in December? What does that do to the length of the day?' }
      - { test: 'june >= 0 && dec <= 24', fail: 'A day only has 24 hours, so daylight must be between 0 and 24 hours.' }
      - { test: 'june + dec >= 23 && june + dec <= 25', fail: 'The seasons look right. Now check that June and December add up to about 24 hours.' }
    examples:
      - { june: 8, sept: 12, dec: 16, mar: 12 }
      - { june: 7.5, sept: 12, dec: 17, mar: 12 }
      - { june: 2, sept: 12, dec: 22, mar: 12 }
    counterexamples:
      - { june: 16, sept: 12, dec: 8, mar: 12 }
      - { june: 8, sept: 8, dec: 16, mar: 16 }
      - { june: 5, sept: 12, dec: 13, mar: 12 }
      - { june: 0, sept: 12, dec: 30, mar: 12 }
    hints:
      - Start with the two easy ones. What are the equinoxes like everywhere on Earth?
      - In June, the north tilts toward the Sun. What is the south doing?
      - Try starting with Edmonton’s chart. What would you need to swap to move it to the south?
    solution:
      - On an equinox, neither hemisphere tilts toward the Sun, so both equinoxes get about 12 hours everywhere.
      - In June, the south tilts away, so June must be short. In December, it tilts toward the Sun, so December must be long.
      - June 8, December 16 works. So does June 7½, December 17, which is Edmonton’s chart with the two solstices swapped.
      - June 2, December 22 works too, for a town very far south. All of these have the tilt the right way around, which is what matters.
