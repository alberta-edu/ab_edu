id: moon-eclipses-auroras
grade: 5
subject: science
organizingIdea: SCI-OI5
outcomes: [SCI5-OI5-GQ1-LO1]
order: 11
title: Moon Phases, Eclipses and Auroras
shortTitle: Moon phases, eclipses and auroras
summary: >-
  Move the Moon around Earth to see its phases, watch a solar and a lunar eclipse happen, and see what
  the northern lights look like.

bigIdea: |-
  - **Astronomical phenomena** are events we can observe among objects in space.
  - The Moon's **phases** repeat in a predictable cycle of about a month.
  - **Eclipses** happen when the Sun, Earth and Moon line up.
  - **Auroras** light up the night sky. In the north we call them the **northern lights**.

lesson:
  - title: Phases of the Moon
    blocks:
      - type: visual
        covers: [K1.2, K1.3, S1.2, S1.7]
        component: moon-phases
        caption: |-
          1. Press **Play a month**, or drag the day.
          2. The Sun always lights **half** of the Moon.
          3. The phase is how much of that lit half we can see from Earth.
      - type: figure
        covers: [K1.3, S1.4]
        figure: { kind: moons, ages: [3.7, 7.4, 14.8, 22.1, 25.8], labels: [Crescent, First qtr, Full, Third qtr, Crescent] }
        caption: The Moon grows from **new** to **full** (waxing), then shrinks back to new (waning). The whole cycle takes about **29½ days**.

  - title: A predictable cycle
    blocks:
      - type: table
        covers: [K1.3, S1.4, S1.2]
        headers: [Phase, About which day, What you see]
        rows:
          - ['New Moon', 'Day 0', 'Almost nothing: the lit half faces away from Earth.']
          - ['First quarter', 'Day 7', 'The right half is lit.']
          - ['Full Moon', 'Day 15', 'The whole face is lit.']
          - ['Third quarter', 'Day 22', 'The left half is lit.']
          - ['New Moon again', 'Day 29½', 'The cycle starts over.']
      - type: text
        covers: [K1.8, S1.5, K1.7]
        body: |-
          Because the Moon's cycle is so predictable, many First Nations, including Cree and Anishinaabe peoples, **name the moons of the year**.

          - Anishinaabe teachings often count **13 moons**.
          - Cree calendars differ from community to community.
          - Many names come from nature at that time, such as geese returning or berries ripening.
          - Métis calendars mark the year by seasonal hunting, gathering and farming.
      - type: callout
        variant: mistake
        covers: [K1.2, S1.3]
        title: "Phases aren't Earth's shadow"
        body: |-
          - Earth's shadow doesn't make the phases.
          - The phase depends on how much of the Moon's **lit half** faces us.
          - Earth's shadow falls on the Moon only during a **lunar eclipse**.

  - title: 'Virtual experiment: two kinds of eclipses'
    blocks:
      - type: experiment
        covers: [S1.3, K1.2, K1.1]
        title: Line up the Sun, Earth and Moon
        question: |-
          Watch two line-ups:

          - **Solar eclipse**: the Moon moves between the Sun and Earth.
          - **Lunar eclipse**: Earth is between the Sun and the Moon.
        animation: eclipses
        predict:
          choices:
            - During the lunar eclipse, the full Moon turns dark and reddish.
            - During the lunar eclipse, the Moon gets brighter.
            - During the lunar eclipse, the Moon becomes a crescent.
          answer: 0
        observe: |-
          **Solar eclipse:** the Moon covered the Sun, and the daytime sky went dark. **Lunar eclipse:** the full
          Moon slid into Earth's shadow and turned a dark, reddish colour.
        explain: |-
          - In a solar eclipse, the Moon blocks the Sun's light from reaching part of Earth.
          - In a lunar eclipse, Earth blocks the Sun's light from reaching the Moon.

  - title: Solar and lunar eclipses
    blocks:
      - type: compare
        covers: [S1.3, K1.2]
        columns:
          - title: Solar eclipse
            body: |-
              **Line-up:** Sun → Moon → Earth.

              **What you observe:** the Moon covers part or all of the Sun in the daytime. During a total eclipse, the
              sky goes dark like evening.
          - title: Lunar eclipse
            body: |-
              **Line-up:** Sun → Earth → Moon.

              **What you observe:** at night, the full Moon slowly darkens and often turns reddish or copper-coloured.
      - type: callout
        variant: tip
        covers: [S1.3]
        title: Stay safe
        body: Never look straight at the Sun, even during a solar eclipse. It can hurt your eyes. A lunar eclipse is safe to watch.

  - title: The northern lights
    blocks:
      - type: visual
        covers: [K1.6, S1.3, K1.1]
        component: aurora
        caption: |-
          - **Auroras** are curtains and ribbons of coloured light that ripple across the night sky.
          - They are often green, sometimes with pink or purple edges.
          - In the northern hemisphere they are the **northern lights**, or **aurora borealis**.
      - type: text
        covers: [S1.6, S1.8, U1.1]
        body: |-
          The northern lights are often seen in northern Alberta and across northern Canada on dark, clear nights. **Stories** about them differ from place to place:

          - **Inuvialuit** legends say they are the spirits of people who once lived, playing a game with a walrus skull.
          - **Cree** legends say they are spirits who remain in the sky.
          - **Dene** Elder Jonas Antoine of Fort Simpson learned from his grandfather that if you listen closely, you can hear them.
          - In many northern communities, children are told never to whistle at them.

keyTerms:
  - term: Astronomical phenomena
    covers: [K1.1, K1.2]
    definition: Events that can be observed among objects in space, such as Moon phases, eclipses and auroras.
  - term: Moon phase
    covers: [K1.2, K1.3]
    definition: The shape of the lit part of the Moon that we see from Earth. Phases repeat about every 29½ days.
  - term: Waxing / waning
    covers: [K1.3]
    definition: Waxing means the lit part is growing. Waning means it is shrinking.
  - term: Solar eclipse
    covers: [S1.3]
    definition: When the Moon passes between the Sun and Earth and blocks the Sun.
  - term: Lunar eclipse
    covers: [S1.3]
    definition: "When Earth passes between the Sun and the Moon, and Earth's shadow falls on the Moon."
  - term: Aurora borealis
    covers: [K1.6]
    definition: The northern lights. Curtains of coloured light in the night sky of the northern hemisphere.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.3, K1.2]
    type: number
    prompt: Tonight is a **new Moon**. About how many days will it be until the **full Moon**?
    answer: 15
    tolerance: 1
    unit: days
    verify: '15'
    hints:
      - Look back at the table in the lesson. Which day is each phase on?
    solution:
      - The new Moon is about day 0 and the full Moon is about day **15**, about halfway through the cycle.

  - id: w3
    level: 1
    thinking: notice
    covers: [K1.3, S1.2]
    type: mc
    figure: { kind: moons, ages: [3.7], labels: [Tonight] }
    prompt: Tonight the Moon looks like this. Over the next few nights, what will happen to the lit part?
    choices: [It will grow., It will shrink., It will stay the same., It will be gone by tomorrow.]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Which side is lit? Look at the drawings in the lesson. Which crescent comes just after the new Moon?
      '2': The Moon’s look changes a little every night. What do the phases do over a month?
      '3': The change is slow. It takes about a week for a crescent to become a half Moon.
    hints:
      - In the lesson, was the right side or the left side lit as the Moon was growing?
    solution:
      - The right side is lit, so this is the crescent just after the new Moon. The Moon is **waxing**, so the lit part will grow.

  - id: w4
    level: 1
    thinking: recall
    covers: [K1.6, S1.3]
    type: mc
    prompt: On a dark, clear night in northern Alberta, green curtains of light ripple across the sky. What are you seeing?
    choices: [Aurora borealis, A lunar eclipse, The midnight sun, A crescent Moon]
    fixedOrder: true
    answer: 0
    feedback:
      '1': A lunar eclipse darkens the Moon. It doesn’t fill the sky with curtains of light.
      '2': The midnight sun happens in summer, when the Sun stays up. Would that be a dark night?
      '3': The Moon is one small bright shape. It doesn’t ripple.
    hints:
      - Think of the rippling colours in the lesson’s visual.
    solution:
      - These are auroras. In the northern hemisphere they are the northern lights, or **aurora borealis**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: pattern
    covers: [S1.2, K1.3]
    type: mc
    figure: { kind: moons, ages: [7.4, 14.8, 3.7, 29.4], labels: [Week 1, Week 2, Week 3, Week 4] }
    prompt: |-
      Yara kept a Moon diary, drawing the Moon once a week. One night was cloudy, so she drew that week’s Moon from her
      imagination. Which drawing did she make up?
    choices: [Week 1, Week 2, Week 3, Week 4]
    fixedOrder: true
    answer: 2
    feedback:
      '0': A half Moon with the right side lit is a fine place to start. What should come one week later?
      '1': One week after a first quarter Moon is about a full Moon. So this one fits.
      '3': Week 4 is about a new Moon. Count back three weeks from it. Does it fit with Week 1?
    hints:
      - Name the phase in Week 1. What day of the cycle is that?
      - Add 7 days each week. Which phase should each week show?
    solution:
      - Week 1 is a first quarter Moon, about day 7. So Week 2 is about day 15, which is full. That fits.
      - Week 3 should be about day 22, a **third quarter** Moon with the left half lit.
      - Yara drew a thin crescent lit on the right. That crescent comes just after a new Moon, so **Week 3** is the made-up one.

  - id: b2
    level: 2
    thinking: why
    covers: [S1.3, K1.2]
    type: mc
    prompt: |-
      Tova phones her cousin Emeka, who lives far away. “It’s the middle of the day and the sky just went dark! It’s a total solar
      eclipse!” Emeka looks outside. “It’s bright and sunny here. You’re making it up.” Both are telling the truth. How can that be?
    choices:
      - The Moon blocks the Sun’s light from only part of Earth.
      - The Moon blocks the Sun, but only in the northern hemisphere.
      - Earth’s shadow has fallen on Tova’s town but not on Emeka’s.
      - A big cloud moved over Tova’s town, and she thinks it is an eclipse.
    answer: 0
    feedback:
      '1': Hemispheres matter for seasons. What in an eclipse would decide who stays in the light?
      '2': Whose shadow is it in a solar eclipse? Look back at the line-up.
      '3': The problem says that both are telling the truth. It is a real eclipse.
    hints:
      - Which object is in the way during a solar eclipse?
      - Hold your hand up near a lamp, and picture its shadow. Does it cover the whole room?
    solution:
      - In a solar eclipse, the Moon is the thing in the way, and the Moon is small compared with Earth.
      - It can block the Sun’s light from only **part of Earth**. Tova is in that part, and Emeka isn’t.

  - id: b3
    level: 2
    thinking: connect
    covers: [K1.8, S1.5, K1.3]
    type: mc
    prompt: |-
      Many First Nations, including Cree and Anishinaabe peoples, name the moons of the year, and many of the names come from nature.
      Imagine two communities, one far south of the other. Each has a moon named for the geese returning. In the south, that moon comes earlier in the year. Why?
    choices:
      - Geese reach the south first, and the name follows what happens in each place.
      - The Moon’s phases run on an earlier schedule in the south than in the north.
      - One of the communities must have lost count of its moons during the winter.
      - Geese travel only at full Moon, so they wait longer before going north.
    answer: 0
    feedback:
      '1': Do the phases change from place to place? Everyone sees the same Moon go through the same cycle.
      '2': This isn’t a mistake. What is each name actually describing?
      '3': The name comes from what people see in nature. Which way are the geese flying in spring?
    hints:
      - What part of each moon’s name comes from the sky, and what part comes from the land?
      - In spring, which community would see geese first?
    solution:
      - The Moon’s cycle is the same for both communities. It is the steady clock.
      - The name comes from what is happening **in nature in that place**. Returning geese reach the south first.
      - So neither is wrong. That is why moon names differ from place to place.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.2, S1.3, K1.3, S1.7]
    type: investigation
    figure: >-
      <svg viewBox="0 0 420 240" class="fig-svg" role="img" aria-label="A view from above. The Sun is at the far left. Earth is in the middle right, with a dashed circle around it showing the Moon's path. Four Moons sit on the circle. A is on the side toward the Sun, B is at the top, C is on the side away from the Sun, and D is at the bottom. The left half of Earth and the left half of each Moon are lit. The right half of each is dark.">
      <circle class="fig-hl" cx="26" cy="120" r="38"/><text class="sci-text" x="24" y="125" text-anchor="middle">Sun</text>
      <line class="obj-string" x1="72" y1="72" x2="112" y2="72"/><polygon class="obj-window" points="120,72 110,66 110,78"/>
      <line class="obj-string" x1="72" y1="168" x2="112" y2="168"/><polygon class="obj-window" points="120,168 110,162 110,174"/>
      <circle class="fig-arrow" cx="250" cy="120" r="90"/>
      <circle class="obj" cx="250" cy="120" r="28"/><path class="obj obj--dark" d="M250 92 A28 28 0 0 1 250 148 Z"/>
      <text class="sci-small" x="250" y="166" text-anchor="middle">Earth</text>
      <circle class="obj" cx="160" cy="120" r="14"/><path class="obj obj--dark" d="M160 106 A14 14 0 0 1 160 134 Z"/><text class="sci-text" x="134" y="125" text-anchor="middle">A</text>
      <circle class="obj" cx="250" cy="30" r="14"/><path class="obj obj--dark" d="M250 16 A14 14 0 0 1 250 44 Z"/><text class="sci-text" x="278" y="35" text-anchor="middle">B</text>
      <circle class="obj" cx="340" cy="120" r="14"/><path class="obj obj--dark" d="M340 106 A14 14 0 0 1 340 134 Z"/><text class="sci-text" x="368" y="125" text-anchor="middle">C</text>
      <circle class="obj" cx="250" cy="210" r="14"/><path class="obj obj--dark" d="M250 196 A14 14 0 0 1 250 224 Z"/><text class="sci-text" x="278" y="215" text-anchor="middle">D</text></svg>
    prompt: |-
      This map looks down from far above Earth, and it is not to scale. Sunlight comes from the left, so the left half of Earth and the left
      half of the Moon are lit. The letters show four spots on the Moon’s trip around Earth.

      Use the map to work out how phases and eclipses fit together.
    parts:
      - type: mc
        prompt: Stand on Earth and look toward spot **C**. Which half of the Moon faces you, and what phase do you see?
        choices:
          - The lit half, so a full Moon
          - The dark half, so a new Moon
          - Half of each, so a quarter Moon
        answer: 0
        feedback:
          '1': Spot C is to the right of Earth. Which side of the Moon at C is pointing back toward Earth, the left or the right?
          '2': That happens at the spots above and below Earth. Where does the Moon at C point its lit side?
        hints:
          - Trace a line from Earth to the Moon at C. Which side of the Moon does your line touch?
        solution:
          - From Earth, you look to the right at C, and you see the Moon’s left side. That is its lit side, so the whole lit half faces you. It is a **full Moon**.
      - type: mc
        prompt: Earth’s shadow stretches away from the Sun. At which spot could the shadow fall on the Moon and make a **lunar eclipse**?
        choices: [A, B, C, D]
        fixedOrder: true
        answer: 2
        feedback:
          '0': At A, the Moon is on the sunny side of Earth. Which way does Earth’s shadow go?
          '1': Picture Earth with the Sun on its left. Does its shadow reach up to B?
          '3': Picture Earth with the Sun on its left. Does its shadow reach down to D?
        hints:
          - Sunlight comes from the left. Which way does a shadow point when the light comes from the left?
        solution:
          - The shadow stretches to the right, toward **C**. That is the line-up Sun, Earth, Moon.
          - You just found that C is the full Moon spot. This is why a lunar eclipse can only happen at a full Moon.
      - type: mc
        prompt: A friend says, “When the Moon is at spot B, it looks half lit because Earth’s shadow covers half of it.” Why can’t that be right?
        choices:
          - Earth’s shadow points toward C, so the Moon at B is nowhere near it.
          - Earth’s shadow only appears when the Sun is on the other side of the Moon.
          - Earth’s shadow is much too small to cover half of the Moon at any spot.
        answer: 0
        feedback:
          '1': Look at the map. Which way does the Sun’s light travel past Earth, and which spot does it leave in shadow?
          '2': The Moon does go into Earth’s shadow during a lunar eclipse. Where is the Moon then, compared with B?
        hints:
          - You have already found where Earth’s shadow goes. Is B in it?
          - If it isn’t the shadow, why would we see half? Look at the Moon at B from Earth.
        solution:
          - The shadow points to C, so the Moon at B is in full sunlight, with its usual lit half.
          - From Earth, we see half of that lit half and half of the dark half. So it looks half lit with no shadow at all.
    wrapUp: One map explains it all. The phase is how much of the lit half faces us, and an eclipse only happens when the three line up exactly.
    hints: []
    solution: []

  - id: d4
    level: 3
    thinking: connect
    covers: [K1.6, S1.3, K1.5, U1.1]
    type: mc
    prompt: |-
      A tour company’s ad says, “**See the northern lights in Inuvik at midnight on June 21! Bring your camera!**”
      In Inuvik in June, the Sun stays up all night. What should you tell the company?
    choices:
      - The sky stays bright all night in June, so plan the tour for winter, when the nights are long and dark.
      - The northern lights only happen in winter, because in June the Sun is too far away from Earth to make them.
      - Midnight is the right time, but Inuvik is too far north, so the tour should go somewhere farther south.
      - The plan is fine, because the northern lights are bright enough to see even when the Sun is up in the sky.
    answer: 0
    feedback:
      '1': 'Earth isn’t farther from the Sun in June. What does the sky over Inuvik look like at midnight in June?'
      '2': 'Northern Alberta and the North are good places to see the northern lights. What gets in the way at midnight in June?'
      '3': 'The northern lights are faint next to the Sun. When can you see them?'
    hints:
      - When can you see the northern lights? In a bright sky or a dark one?
      - In June, the north is tilted toward the Sun. What does that do to the nights in Inuvik?
    solution:
      - 'On June 21, the north is tilted toward the Sun, so Inuvik has the midnight sun. The sky stays bright all night.'
      - 'The northern lights are seen on dark, clear nights. Nobody will see them in a bright sky.'
      - 'In winter, the north is tilted away from the Sun, so the nights are long and dark. That is the time to go.'
