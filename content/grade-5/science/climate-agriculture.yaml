id: climate-agriculture
grade: 5
subject: science
organizingIdea: SCI-OI3
outcomes: [SCI5-OI3-GQ1-LO1]
order: 7
title: Climate, Living Things and Agriculture
shortTitle: Climate, living things and agriculture
summary: >-
  See how climate shapes the way people and animals live, test soil cover in a windstorm, and harvest
  fish from a lake without running out.

bigIdea: |-
  Climate affects how **people** and **animals** live, and what **farmers** can grow and raise. Farmers
  watch for weather events like drought and windstorms, and use **conservation agriculture** and
  **sustainable harvesting** so the land, plants and animals stay healthy for future harvests.

lesson:
  - title: Climate shapes how people live
    blocks:
      - type: table
        covers: [K3.1, S3.1, U3.1]
        headers: [Human activity, How climate affects it in Canada]
        rows:
          - ['🌾 **Agriculture**', 'Farmers grow crops that can ripen in a short growing season between spring and fall frosts.']
          - ['🏠 **Infrastructure**', 'Houses are insulated against the cold, and water pipes are buried deep so they don''t freeze.']
          - ['🧥 **Clothing**', 'Warm parkas, mitts and boots in winter. Light clothes and sun hats in summer.']
          - ['🚚 **Transportation**', 'Winter tires on snowy roads. In the North, trucks drive on ice roads over frozen lakes.']
          - ['⛸️ **Recreation**', 'Skiing and skating in winter. Swimming and canoeing in summer.']

  - title: Climate shapes how animals live
    blocks:
      - type: compare
        covers: [K3.2, S3.1, U3.1]
        columns:
          - title: Migration
            body: Canada geese **fly south** in the fall, before winter, and return in spring.
          - title: Accessing food
            body: Caribou **dig through snow** with their hooves to reach the lichen they eat.
          - title: Timing of reproduction
            body: Many animals have their young in **spring**, when the weather is warmer and food is easier to find.
      - type: text
        covers: [K5.1, U5.1, S5.1]
        body: |-
          People who watch the weather and animals over many years, like First Nations, Métis and Inuit Elders and
          knowledge keepers, recognize **patterns and cycles**. When geese gather and fly south, colder weather is
          coming. Sharing these observations from one generation to the next helps communities understand weather
          and seasons.

  - title: Farming in Alberta's climate
    blocks:
      - type: table
        covers: [S4.1, K4.1, K4.4, S4.3, U4.1]
        headers: [Weather event, What it can do to a farm, How farmers respond]
        rows:
          - ['☀️ **Drought**', 'Less **water access**, so smaller crops and less water for **animals**.', 'Irrigate with water from rivers. Choose crops that need less water.']
          - ['🌊 **Flooding**', 'Washes away **soil** and drowns crops.', 'Keep plant cover on the soil. Move animals to higher ground.']
          - ['🔥 **Fires**', 'Burns crops, hay and fences, and harms **animal populations**.', 'Watch fire warnings. Keep firebreaks around buildings.']
          - ['💨 **Windstorms**', 'Blows away bare **soil** and flattens crops.', 'Keep the soil covered with plants or stubble.']
      - type: callout
        variant: tip
        covers: [S4.1, K4.1]
        title: Alberta farms
        body: |-
          Alberta's farmers grow crops such as **wheat**, **canola** and **barley**, and raise **cattle**. The **crop
          type** has to suit a cold climate with a short growing season.

  - title: 'Virtual experiment: a windstorm on two fields'
    blocks:
      - type: experiment
        covers: [K4.2, K4.4, K4.5, S4.2]
        title: The same windstorm blows across two fields
        question: |-
          One field was **tilled** (ploughed) and left bare. The other was **not tilled**, and last year's crop stubble
          was left on the soil.
        animation: soil-storm
        predict:
          choices:
            - The bare, tilled field loses more soil.
            - The field with stubble loses more soil.
            - Both fields lose the same amount of soil.
          answer: 0
        observe: |-
          The wind lifted soil from the **bare, tilled** field and blew it away. The field with **stubble** kept its
          soil in place.
        explain: |-
          - Stubble and plants **cover the soil** and hold it down.
          - Tilling breaks the soil into loose bits that the wind can carry away.
          - **Minimizing soil disturbance** and **maintaining soil cover** are conservation agriculture practices.

  - title: Conservation agriculture
    blocks:
      - type: table
        covers: [K4.5, K4.2, K4.3, S4.2]
        caption: Conservation agriculture responds to local climate and weather, and is adapted to what is farmed.
        headers: [Practice, What it looks like]
        rows:
          - ['**Minimizing soil disturbance**', 'Planting seeds without ploughing the whole field.']
          - ['**Maintaining soil cover**', 'Leaving stubble or growing cover plants so soil is never bare.']
          - ['**Using water efficiently**', 'Watering at the right time and only as much as crops and animals need.']
          - ['**Using sustainable harvesting practices**', 'Harvesting in ways that leave enough for next year.']

  - title: Sustainable harvesting
    blocks:
      - type: visual
        covers: [K4.6, S4.4]
        component: harvest-sim
        caption: |-
          Each year, the fish in the lake have young. Choose how many fish are caught each year. Can the population
          stay **stable** over 30 years?
      - type: table
        covers: [K4.6, S4.4]
        headers: [Practice, Example]
        rows:
          - ['**Crop rotation**', 'Growing a different crop in a field each year, such as canola, then wheat, then peas.']
          - ['**Companion planting**', 'Growing plants together that help each other, like corn, beans and squash, the Three Sisters grown by the Haudenosaunee and other Indigenous nations.']
          - ['**Limiting hunting and trapping**', 'Hunting seasons and limits that leave enough animals to have young.']
          - ['**Considering future harvests**', 'Taking only what can be replaced, so there is more next year.']

keyTerms:
  - term: Migration
    covers: [K3.2, K5.1]
    definition: Moving from one region to another with the seasons, like geese flying south for the winter.
  - term: Drought
    covers: [K4.4]
    definition: A long time with much less precipitation than usual.
  - term: Conservation agriculture
    covers: [K4.2, K4.5]
    definition: Sustainable farming that responds to local climate and weather, such as keeping soil covered and using water efficiently.
  - term: Soil cover
    covers: [K4.5]
    definition: Plants or crop stubble that protect the soil from wind and water.
  - term: Sustainable harvesting
    covers: [K4.6]
    definition: Harvesting in ways that keep plant and animal populations stable over time.
  - term: Crop rotation
    covers: [K4.6]
    definition: Growing a different crop in the same field from one year to the next.
  - term: Companion planting
    covers: [K4.6]
    definition: Growing plants together that help each other grow.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K3.1, S3.1, U3.1]
    type: mc
    prompt: A builder from Edmonton takes her usual house plans to Singapore, where it is hot all year. Which part of her plans is **no use** there?
    choices:
      - Burying the water pipes deep so they don’t freeze
      - A roof that keeps the rain out of the house
      - Windows that open to let the air through
      - Water pipes that bring water into the kitchen
    answer: 0
    feedback:
      '1': Singapore gets a lot of rain. Would a house there still need a good roof?
      '2': In a place that is hot all year, would moving air be useful?
      '3': People need water in every climate. Is there something about how the pipes are placed that wouldn’t matter there?
    hints:
      - Which of these is only there because of Edmonton’s cold winters?
    solution:
      - Pipes are buried deep in Canada because winters are cold enough to freeze the ground.
      - Singapore’s climate is hot all year, so nothing will freeze. Climate decides how we build.

  - id: w2
    level: 1
    thinking: notice
    covers: [K3.2, S3.1, U3.1]
    type: mc
    prompt: Moose in Alberta have their calves in late spring, when the weather is warmer and food is easier to find. Which way that climate affects animals does this show?
    choices: [Timing of reproduction, Migration, Accessing food]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Migration means moving from one region to another with the seasons. Did the story say the moose moved?
      '2': Food is part of the reason, but what event is the story about? What is being timed?
    hints:
      - What is the moose doing at this time of year?
    solution:
      - Having calves is reproduction, and the story says **when** it happens.
      - Late spring gives the calves warmer weather and more food, so climate affects the timing.

  - id: w3
    level: 1
    thinking: recall
    covers: [K4.5, K4.2]
    type: multi
    prompt: Which of these are **conservation agriculture** practices? Select all that fit.
    choices:
      - Leaving last year’s stubble on the field
      - Planting seeds without ploughing the whole field
      - Watering only as much as the crop needs
      - Ploughing a field and leaving it bare all winter
    answer: [0, 1, 2]
    hints:
      - Ask of each one, “Does this protect the soil and the water, or use them up?”
    solution:
      - Stubble keeps the soil covered, less ploughing disturbs the soil less, and careful watering uses water efficiently.
      - A ploughed, bare field has loose soil with nothing to cover it, so wind can carry it away.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: evidence
    covers: [K4.5, K4.4, S4.3, S4.2]
    type: mc
    prompt: |-
      Two prairie fields lie side by side. One was ploughed bare in the fall. The other still has its stubble. Late in
      fall, when only the ditches hold snow, a windstorm blows for two days. Afterwards, the snow beside the **north
      field** is clean and white. The snow beside the **south field** is striped dark brown. Which field was ploughed?
    choices:
      - The south field, because the brown stripes are its soil, blown away.
      - The north field, because ploughing kept its soil at home in the wind.
      - The south field, because brown snow falls from the sky after windstorms.
      - You can’t tell, because a windstorm blows the same on both of the fields.
    answer: 0
    feedback:
      '1': In the experiment with two fields, which one lost its soil to the wind?
      '2': The right field, but check the reason. If snow fell from the sky brown, why would only one ditch have it?
      '3': The wind may be the same, but the fields aren’t. What does stubble do that bare soil can’t?
    hints:
      - What could be brown and able to blow across a field?
      - Think back to the experiment. Which kind of field gives up its soil?
    solution:
      - The brown stripes must be something blown into the ditch. On a farm field, that is **soil**.
      - Tilled, bare soil is loose, and nothing holds it down. Stubble covers soil and keeps it in place.
      - So the south field was the ploughed one, and part of it is now in the ditch.

  - id: b2
    level: 2
    thinking: model
    covers: [K4.5, K4.4, S4.2]
    type: number
    prompt: |-
      A made-up vegetable field needs **30 mm** of water a week. Its sprinkler is on a timer and gives **30 mm** every
      week, rain or shine. In week 1, the rain gauge shows 18 mm of rain. In week 2, it shows 35 mm, and the sprinkler
      runs during a storm. How many mm of sprinkler water were not needed?
    answer: 48
    unit: mm
    verify: (30 - (30 - 18)) + 30
    hints:
      - Do one week at a time. How much did the field still need after the rain?
      - In week 2, did the field need anything from the sprinkler at all?
    solution:
      - 'Week 1: the rain gave 18 mm, so the field still needed \(30 - 18 = 12\) mm. The sprinkler gave 30 mm, so \(30 - 12 = 18\) mm was not needed.'
      - 'Week 2: the rain alone gave more than 30 mm, so all 30 mm from the sprinkler was not needed.'
      - '\(18 + 30 = 48\) mm. A cheap rain gauge and a look at the weather would have saved all of that. Using water efficiently starts with measuring.'

  - id: b3
    level: 2
    thinking: connect
    covers: [K4.6, K4.5, S4.4]
    type: mc
    prompt: |-
      In a Three Sisters garden, grown by the Haudenosaunee and other Indigenous nations, corn, beans and squash grow
      together. Beans climb the corn stalks. The big leaves of the squash spread out low over the ground. Which
      conservation practice are the squash leaves also doing?
    choices:
      - Maintaining soil cover
      - Crop rotation
      - Minimizing soil disturbance
      - Limiting the harvest
    fixedOrder: true
    answer: 0
    feedback:
      '1': Crop rotation means growing different crops from one year to the next. These three grow together in the same year.
      '2': Disturbing soil means breaking it up, as a plough does. What are the leaves doing to the ground?
      '3': Limiting a harvest means taking less. Do the leaves have anything to do with how much is picked?
    hints:
      - Picture the ground under those big leaves. What can you see of the soil?
    solution:
      - The leaves spread over the ground, so the soil isn’t left bare. That is **maintaining soil cover**.
      - So this garden does two things at once. The plants are companions, and one of them protects the soil the way stubble does on a wheat field.

  - id: b4
    level: 2
    thinking: flaw
    covers: [K4.6, S4.4]
    type: mc
    prompt: |-
      In a made-up valley, trappers agreed long ago to limit how many snowshoe hares each person takes in a year. The
      hare population has stayed steady for 20 years. Cora says, “We have plenty of hares now, so the limit did its
      job. We can get rid of it.” What is the problem with Cora’s idea?
    choices:
      - The limit may be why the hares stay steady, so without it that could change.
      - Nothing is wrong, because a limit is only needed while hares are hard to find.
      - The limit is too weak, because a good limit makes the hares grow every year.
      - Hares have young every year, so limits never really change how many there are.
    answer: 0
    feedback:
      '1': The population is steady **with** the limit in place. What do you know about what would happen without it?
      '2': Sustainable harvesting aims for stable populations. Does a steady population sound like a failure?
      '3': Having young helps, but what happens if more hares are taken than are born?
    hints:
      - What has been the same for all of those 20 years?
      - Finish this sentence, “I wear mitts and my hands stay warm, so I can get rid of my mitts…”
    solution:
      - The hares have stayed steady during all the years the limit was there. That is a clue the limit is **working**, not that it is finished.
      - It is like saying, “My mitts keep my hands warm, so I don’t need mitts any more.”
      - A limit leaves enough animals to have young. Taking it away removes the very thing that may be holding the population steady.

  - id: b5
    level: 2
    thinking: whatif
    covers: [K3.2, S3.1, U3.1]
    type: mc
    prompt: |-
      Caribou dig through snow with their hooves to reach lichen to eat. One January, a warm spell brings rain onto the
      snow. Then it freezes into a thick, hard layer of ice on top of the lichen. What is most likely that winter?
    choices:
      - Caribou have a harder time reaching food there.
      - Caribou find food more easily, because ice is smooth.
      - Nothing changes, because caribou eat only in summer.
      - The lichen gets more water, so caribou eat better.
    answer: 0
    feedback:
      '1': Being smooth might help with walking. But where is the lichen? Could hooves get through?
      '2': The lesson says caribou dig through **snow** to find food. When would that be?
      '3': It may have water, but can a caribou reach it? Follow the hoof down through the layers.
    hints:
      - Picture a hoof digging. What does it hit now that it didn’t hit before?
    solution:
      - Soft snow can be dug through. Thick ice is much harder, so the lichen is sealed away.
      - This really happens. Winter ice has been linked to some drops in caribou numbers in Canada’s Arctic, because food becomes hard to reach.
      - A single weather event can change how animals get their food.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K5.1, U5.1, S5.1, K3.2, K4.4]
    type: investigation
    prompt: |-
      Great-Grandma Odile kept a notebook on her made-up farm for 45 years. Each fall, she wrote down two dates. Now
      the family reads it.

      | Year | Geese flew south | First hard frost |
      |---|---|---|
      | 1978 | Oct 3 | Oct 13 |
      | 1990 | Oct 9 | Oct 19 |
      | 2004 | Oct 1 | Oct 12 |
      | 2016 | Oct 6 | Oct 15 |
      | 2023 | Oct 8 | Oct 18 |
    parts:
      - type: mc
        prompt: What pattern do you see in the notebook?
        choices:
          - The frost comes about 10 days after the geese fly south.
          - The geese fly south on the very same day each year.
          - The first hard frost comes on the same date each year.
          - The frost comes first, and then the geese fly south.
        answer: 0
        feedback:
          '1': Check the “Geese flew south” column. Do the dates match?
          '2': Check the “First hard frost” column. Do the dates match?
          '3': Pick one row. Which date comes first?
        hints:
          - The dates move around from year to year. Does anything stay about the same?
          - For each row, find how many days there are between the two dates.
        solution:
          - 'The gaps are 10, 10, 11, 9 and 10 days. The dates change, but the gap stays about the same.'
      - type: number
        prompt: This year, the geese fly south on **October 5**. On about which day in October should the family expect the first hard frost? Type just the day number.
        answer: 15
        tolerance: 1
        verify: 5 + 10
        hints:
          - Use the pattern you found.
        solution:
          - 'About 10 days after October 5 is around **October 15**. It is an estimate, so a day or so either way is fine.'
          - That gives the family time to finish harvesting before the frost.
      - type: mc
        prompt: Why is Odile’s notebook better evidence than one person watching for one fall?
        choices:
          - Many years can show a pattern. One fall could be unusual.
          - Older notes are more accurate, because they were written by hand.
          - One person can’t see geese and frost in the same fall.
          - A long notebook is better because it has more pages to read.
        answer: 0
        feedback:
          '1': Handwriting doesn’t make something more accurate. What can 45 years show that one fall can’t?
          '2': One person could see both. What couldn’t they see from a single fall?
          '3': What matters is what the pages can show. What can you see across many years?
        hints:
          - Could you have found the 10-day gap from just one row? Would you trust it?
        solution:
          - One fall gives one gap, and it could be a strange year. Many years let you see what keeps happening.
          - Observations passed along from one generation to the next can show patterns nobody could see in a single year.
      - type: mc
        prompt: |-
          Uncle Stu has a plan. “Frost comes after the geese leave. So I’ll feed the geese a mountain of bread, they’ll
          stay, and we’ll never get frost!” What is wrong with his plan?
        choices:
          - The geese leaving is a sign that cold is coming. It doesn’t bring the cold.
          - It needs more bread, because frost stays away only if the geese are very full.
          - It would work only if he could keep every single goose in Alberta on the farm.
          - The geese would stay, but then frost would simply come before they had left.
        answer: 0
        feedback:
          '1': Would any amount of bread change the weather? What do the geese have to do with the frost?
          '2': Suppose he could keep every goose. Would that stop winter from coming?
          '3': Think about what is causing what. Do the geese decide when the frost comes?
        hints:
          - Does one thing coming before another mean that the first thing **causes** the second?
          - A rooster crows before sunrise. Could you stop the sunrise by keeping it quiet?
        solution:
          - The notebook shows that the two events go together. It doesn’t show that the geese cause the frost.
          - Colder weather is coming either way. The geese are a **sign** of it, like a warning light.
          - Uncle Stu would just have a very full goose and a frosty farm.
    wrapUp: Watching animals and weather over many years reveals patterns. A pattern can warn you what is coming, even though the sign doesn’t cause it.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: decide
    covers: [K4.1, K4.3, S4.1, U4.1, K4.4]
    type: investigation
    prompt: |-
      A made-up farm’s **growing season** is the number of days between the last spring frost and the first fall frost.
      Here are the last 10 seasons, ending with last year:

      **80, 95, 88, 102, 91, 76, 99, 84, 93, 113**

      A seed seller arrives. “Slowpoke Squash needs just 110 days, and last year you had 113! It’s perfect for your farm!”

      | Seed | Days it needs to ripen |
      |---|---|
      | Turbo Turnip | 70 |
      | Bashful Barley | 90 |
      | Slowpoke Squash | 110 |
    parts:
      - type: number
        prompt: In how many of the 10 seasons would Slowpoke Squash have ripened?
        answer: 1
        unit: seasons
        verify: 10 - 9
        hints:
          - The season has to be at least as long as the days the squash needs. Check each number against 110.
        solution:
          - Only 113 is at least 110. So the squash would have ripened in just **1** season out of 10.
      - type: mc
        prompt: What is the mistake in what the seller said?
        choices:
          - One long season is weather. A crop has to suit the pattern over many years.
          - Squash can’t ever grow on a farm with frost in both spring and fall.
          - A season of 113 days must be a mistake, so the farmer shouldn’t use it.
          - Slowpoke Squash needs more than 113 days, so it wouldn’t have ripened last year.
        answer: 0
        feedback:
          '1': It ripened last year, so it can grow here. How often would that happen?
          '2': Nothing in the story says the number is wrong. Is it the usual length, though?
          '3': Compare 110 and 113. Would it have ripened last year? So what else is wrong with the seller’s reasoning?
        hints:
          - Is last year a good picture of what usually happens on this farm?
        solution:
          - The seller is right about last year, but last year was the longest season of the 10.
          - The crop type has to suit the climate, the pattern over many years, not one lucky summer.
      - type: number
        prompt: In how many of the 10 seasons would Bashful Barley have ripened?
        answer: 6
        unit: seasons
        verify: 10 - 4
        hints:
          - It helps to cross off the seasons shorter than 90 days.
        solution:
          - 80, 88, 76 and 84 are too short. That leaves 95, 102, 91, 99, 93 and 113, so **6** seasons.
      - type: open
        prompt: |-
          Turbo Turnip ripens in **all 10** seasons. Bashful Barley gives a much bigger harvest, but only when it
          ripens. Which would you plant on this farm? Defend your choice using the numbers.
        modelAnswer: |-
          I would plant Turbo Turnip, because it ripened in all 10 seasons and the family would always have a harvest.
          Barley gives more, but in 4 of the 10 seasons it wouldn’t ripen, and that is a lot of years with nothing. Someone
          could also choose barley because 6 good harvests might be worth more than 10 small ones, as long as they had
          food or money saved for the bad years.
        rubric:
          - I chose one crop.
          - I used the numbers (10 out of 10, or 6 out of 10) in my reason.
          - I said what the farm would give up by making this choice.
    wrapUp: Farmers choose crops for the climate, the pattern over many years. A single good year can fool you.
    hints: []
    solution: []

  - id: d3
    level: 3
    thinking: design
    covers: [K4.5, K4.2, K4.4, S4.2, S4.3]
    type: open
    prompt: |-
      You are a handful of soil on a bare, ploughed Alberta field. You have had a terrible year, and you are writing
      to the farmer. In your letter, describe **one or two weather events** that nearly carried you off. Then ask for
      **two conservation practices**, and explain how each one would help you.

      Be as funny as you like, but keep the science true.
    modelAnswer: |-
      Dear Farmer, last spring a windstorm blew half my family into a ditch. Then a flood tried to wash the rest of us
      away. I am tired of being bare! Please leave your stubble on me after the harvest. It would cover me and hold me
      down in the wind. Also, please plant your seeds without ploughing the whole field. Ploughing breaks me into
      loose bits that blow away, so leaving me in place would help me stay put. Yours truly, Soil.
    rubric:
      - I described a weather event that can harm soil, such as a windstorm or a flood.
      - I asked for two real conservation practices.
      - I explained how each practice protects the soil.
    hints:
      - What did you see happen to the bare field in the experiment?
      - Look back at the table of conservation practices. Which ones would a handful of soil beg for?
