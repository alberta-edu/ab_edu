id: climate-agriculture
grade: 5
subject: science
organizingIdea: SCI-OI3
outcomes: [SCI5-OI3-GQ1-LO1]
order: 7
title: Climate, Living Things and Agriculture
shortTitle: Climate, living things and agriculture
summary: >-
  See how climate shapes the way people and animals live, test soil cover in a windstorm, and harvest
  fish from a lake without running out.

bigIdea: |-
  Climate affects how **people** and **animals** live, and what **farmers** can grow and raise. Farmers
  watch for weather events like drought and windstorms, and use **conservation agriculture** and
  **sustainable harvesting** so the land, plants and animals stay healthy for future harvests.

lesson:
  - title: Climate shapes how people live
    blocks:
      - type: table
        covers: [K3.1, S3.1, U3.1]
        headers: [Human activity, How climate affects it in Canada]
        rows:
          - ['🌾 **Agriculture**', 'Farmers grow crops that can ripen in a short growing season between spring and fall frosts.']
          - ['🏠 **Infrastructure**', 'Houses are insulated against the cold, and water pipes are buried deep so they don''t freeze.']
          - ['🧥 **Clothing**', 'Warm parkas, mitts and boots in winter. Light clothes and sun hats in summer.']
          - ['🚚 **Transportation**', 'Winter tires on snowy roads. In the North, trucks drive on ice roads over frozen lakes.']
          - ['⛸️ **Recreation**', 'Skiing and skating in winter. Swimming and canoeing in summer.']

  - title: Climate shapes how animals live
    blocks:
      - type: compare
        covers: [K3.2, S3.1, U3.1]
        columns:
          - title: Migration
            body: Canada geese **fly south** in the fall, before winter, and return in spring.
          - title: Accessing food
            body: Caribou **dig through snow** with their hooves to reach the lichen they eat.
          - title: Timing of reproduction
            body: Many animals have their young in **spring**, when the weather is warmer and food is easier to find.
      - type: text
        covers: [K5.1, U5.1, S5.1]
        body: |-
          People who watch the weather and animals over many years, like First Nations, Métis and Inuit Elders and
          knowledge keepers, recognize **patterns and cycles**. When geese gather and fly south, colder weather is
          coming. Sharing these observations from one generation to the next helps communities understand weather
          and seasons.

  - title: Farming in Alberta's climate
    blocks:
      - type: table
        covers: [S4.1, K4.1, K4.4, S4.3, U4.1]
        headers: [Weather event, What it can do to a farm, How farmers respond]
        rows:
          - ['☀️ **Drought**', 'Less **water access**, so smaller crops and less water for **animals**.', 'Irrigate with water from rivers. Choose crops that need less water.']
          - ['🌊 **Flooding**', 'Washes away **soil** and drowns crops.', 'Keep plant cover on the soil. Move animals to higher ground.']
          - ['🔥 **Fires**', 'Burns crops, hay and fences, and harms **animal populations**.', 'Watch fire warnings. Keep firebreaks around buildings.']
          - ['💨 **Windstorms**', 'Blows away bare **soil** and flattens crops.', 'Keep the soil covered with plants or stubble.']
      - type: callout
        variant: tip
        covers: [S4.1, K4.1]
        title: Alberta farms
        body: |-
          Alberta's farmers grow crops such as **wheat**, **canola** and **barley**, and raise **cattle**. The **crop
          type** has to suit a cold climate with a short growing season.

  - title: 'Virtual experiment: a windstorm on two fields'
    blocks:
      - type: experiment
        covers: [K4.2, K4.4, K4.5, S4.2]
        title: The same windstorm blows across two fields
        question: |-
          One field was **tilled** (ploughed) and left bare. The other was **not tilled**, and last year's crop stubble
          was left on the soil.
        animation: soil-storm
        predict:
          choices:
            - The bare, tilled field loses more soil.
            - The field with stubble loses more soil.
            - Both fields lose the same amount of soil.
          answer: 0
        observe: |-
          The wind lifted soil from the **bare, tilled** field and blew it away. The field with **stubble** kept its
          soil in place.
        explain: |-
          - Stubble and plants **cover the soil** and hold it down.
          - Tilling breaks the soil into loose bits that the wind can carry away.
          - **Minimizing soil disturbance** and **maintaining soil cover** are conservation agriculture practices.

  - title: Conservation agriculture
    blocks:
      - type: table
        covers: [K4.5, K4.2, K4.3, S4.2]
        caption: Conservation agriculture responds to local climate and weather, and is adapted to what is farmed.
        headers: [Practice, What it looks like]
        rows:
          - ['**Minimizing soil disturbance**', 'Planting seeds without ploughing the whole field.']
          - ['**Maintaining soil cover**', 'Leaving stubble or growing cover plants so soil is never bare.']
          - ['**Using water efficiently**', 'Watering at the right time and only as much as crops and animals need.']
          - ['**Using sustainable harvesting practices**', 'Harvesting in ways that leave enough for next year.']

  - title: Sustainable harvesting
    blocks:
      - type: visual
        covers: [K4.6, S4.4]
        component: harvest-sim
        caption: |-
          Each year, the fish in the lake have young. Choose how many fish are caught each year. Can the population
          stay **stable** over 30 years?
      - type: table
        covers: [K4.6, S4.4]
        headers: [Practice, Example]
        rows:
          - ['**Crop rotation**', 'Growing a different crop in a field each year, such as canola, then wheat, then peas.']
          - ['**Companion planting**', 'Growing plants together that help each other, like corn, beans and squash, the Three Sisters planted by many First Nations.']
          - ['**Limiting hunting and trapping**', 'Hunting seasons and limits that leave enough animals to have young.']
          - ['**Considering future harvests**', 'Taking only what can be replaced, so there is more next year.']

keyTerms:
  - term: Migration
    covers: [K3.2, K5.1]
    definition: Moving from one region to another with the seasons, like geese flying south for the winter.
  - term: Drought
    covers: [K4.4]
    definition: A long time with much less precipitation than usual.
  - term: Conservation agriculture
    covers: [K4.2, K4.5]
    definition: Sustainable farming that responds to local climate and weather, such as keeping soil covered and using water efficiently.
  - term: Soil cover
    covers: [K4.5]
    definition: Plants or crop stubble that protect the soil from wind and water.
  - term: Sustainable harvesting
    covers: [K4.6]
    definition: Harvesting in ways that keep plant and animal populations stable over time.
  - term: Crop rotation
    covers: [K4.6]
    definition: Growing a different crop in the same field from one year to the next.
  - term: Companion planting
    covers: [K4.6]
    definition: Growing plants together that help each other grow.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [K3.1]
    type: mc
    prompt: People in Iqaluit, Nunavut wear heavy parkas for much of the year. Which part of human activity does this show climate affecting?
    choices: [Clothing, Recreation, Transportation, Agriculture]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Recreation is about fun activities, like skiing or swimming.
      '2': Transportation is about how people travel.
      '3': Agriculture is about farming.
    hints:
      - What is a parka?
    solution:
      - A parka is **clothing** that suits a cold climate.

  - id: w2
    level: 1
    covers: [K3.2, K5.1]
    type: mc
    prompt: Every fall, Canada geese fly south, and they return in spring. What is this called?
    choices: [Migration, Reproduction, Crop rotation, Drought]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Reproduction is having young.
      '2': Crop rotation is a farming practice.
      '3': A drought is a long dry time.
    hints:
      - It is a seasonal movement from one region to another.
    solution:
      - Moving with the seasons is **migration**.

  - id: w3
    level: 1
    covers: [K4.5]
    type: mc
    prompt: Which is a **conservation agriculture** practice?
    choices:
      - Maintaining soil cover
      - Leaving fields bare all winter
      - Ploughing the soil as often as possible
      - Using as much water as possible
    answer: 0
    feedback:
      '1': Bare soil blows and washes away.
      '2': Conservation agriculture **minimizes** soil disturbance.
      '3': Conservation agriculture uses water **efficiently**.
    hints:
      - Think of the field that kept its soil in the windstorm.
    solution:
      - '**Maintaining soil cover** protects the soil from wind and water.'

  - id: w4
    level: 1
    covers: [K4.6]
    type: multi
    prompt: Select **all** the sustainable harvesting practices.
    choices: [Crop rotation, Companion planting, Limiting hunting and trapping, Considering future harvests, Catching as many fish as possible]
    fixedOrder: true
    answer: [0, 1, 2, 3]
    hints:
      - Sustainable practices keep populations stable over time.
    solution:
      - ✓ The first four keep plant and animal populations stable.
      - ✗ Catching as many fish as possible can empty a lake.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [K4.5, S4.2, K4.4]
    type: mc
    prompt: In the virtual experiment, why did the field with stubble keep its soil during the windstorm?
    choices:
      - The stubble covered the soil and held it in place.
      - The wind was weaker on that field.
      - Stubble makes soil heavier than rock.
      - That field had no soil to lose.
    answer: 0
    feedback:
      '1': The same windstorm blew across both fields.
      '2': Stubble doesn't change what the soil is made of. It covers and protects it.
      '3': Both fields had the same soil.
    hints:
      - What was different between the two fields?
    solution:
      - The stubble was **soil cover**. It held the soil down, and the field wasn't tilled, so the soil wasn't loose.

  - id: b2
    level: 2
    covers: [K4.1, K4.4, S4.3]
    type: mc
    prompt: Southern Alberta has a **drought** all summer. Which is the most likely effect on farms there?
    choices:
      - Smaller crops and less water for animals
      - Fields flood and wash away
      - Crops grow bigger than usual
      - Nothing changes for farms
    answer: 0
    feedback:
      '1': Flooding comes from too much water, not too little.
      '2': Crops need water to grow.
      '3': Drought affects crop production and water access.
    hints:
      - A drought means much less precipitation than usual.
    solution:
      - Less **water access** means smaller **crop production** and less water for **animals**.

  - id: b3
    level: 2
    covers: [K4.6, S4.4]
    type: mc
    prompt: In the lake simulator, which catch keeps the fish population **stable** for 30 years?
    choices: [100 fish a year, 200 fish a year, 250 fish a year, 'The more you catch, the more stable it is']
    fixedOrder: true
    answer: 0
    feedback:
      '1': At 200 a year, the lake runs out of fish in about 11 years.
      '2': At 250 a year, the lake runs out of fish quickly.
      '3': Catching more than the fish can replace makes the population shrink.
    hints:
      - Try each number on the slider.
    solution:
      - Catching **100** a year takes no more fish than the lake can replace, so the population stays stable.

  - id: b4
    level: 2
    covers: [K3.2, S3.1]
    type: mc
    prompt: Why do many animals in Alberta have their young in **spring**?
    choices:
      - The weather is warmer and food is easier to find.
      - Snow makes it easier to hide the young.
      - Animals can only count to spring.
      - There is less daylight in spring.
    answer: 0
    feedback:
      '1': Most snow melts in spring, and finding food matters more.
      '2': Animals respond to the seasons, not to counting.
      '3': Days get **longer** in spring.
    hints:
      - What do newborn animals need?
    solution:
      - Spring and summer bring warmer weather and more food, so the young are more likely to survive.

  - id: b5
    level: 2
    covers: [K4.6]
    type: mc
    prompt: A farmer grows canola in a field one year, wheat the next year, and peas the year after. What practice is this?
    choices: [Crop rotation, Companion planting, Migration, Tilling]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Companion planting means growing different plants **together** at the same time.
      '2': Migration is a seasonal movement of animals.
      '3': Tilling means ploughing the soil.
    hints:
      - The crop changes from year to year.
    solution:
      - Growing a different crop in a field each year is **crop rotation**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [K4.6]
    type: mc
    prompt: |-
      Many First Nations planted corn, beans and squash together, called the Three Sisters. The corn stalk holds up
      the bean vine, and the big squash leaves shade the soil. What kind of practice is this?
    choices:
      - Companion planting, because the plants help each other grow
      - Crop rotation, because the crops change every year
      - Tilling, because it disturbs the soil
      - Migration, because the plants move
    answer: 0
    feedback:
      '1': The three crops grow **together** at the same time, not one after another.
      '2': Squash leaves cover and protect the soil.
      '3': Plants don't migrate.
    hints:
      - Are the plants growing at the same time or in different years?
    solution:
      - Plants grown together that help each other is **companion planting**, a sustainable harvesting practice.

  - id: d2
    level: 3
    covers: [K5.1, U5.1, S5.1]
    type: mc
    prompt: |-
      Over many years, an Elder notices that when geese gather and fly south early, cold weather also comes early.
      What does this show?
    choices:
      - Observations of animal behaviour and weather over many years can reveal patterns and cycles.
      - Geese control the weather.
      - One year of watching geese is enough to predict every winter.
      - Animal behaviour has nothing to do with the seasons.
    answer: 0
    feedback:
      '1': The geese respond to the seasons. They don't cause them.
      '2': Patterns show up over **many** years of observing.
      '3': Seasonal migration is a pattern linked to the seasons.
    hints:
      - The Elder noticed this over many years.
    solution:
      - Long-term observations of **weather and animal behaviour** reveal **patterns and cycles**, such as seasonal migration.

  - id: d3
    level: 3
    covers: [K3.1, S3.1]
    type: mc
    prompt: In Alberta, water pipes are buried deep underground. Which climate fact explains this?
    choices:
      - Winters are cold enough to freeze the ground near the surface.
      - Summers are very hot.
      - Alberta gets more rain than anywhere in Canada.
      - Pipes are buried deep in every climate on Earth.
    answer: 0
    feedback:
      '1': Hot summers wouldn't damage pipes.
      '2': Alberta is fairly dry.
      '3': Places with warm climates don't need to bury pipes as deep.
    hints:
      - What happens to water when it gets very cold?
    solution:
      - Cold winters freeze the ground near the surface. Burying pipes deep keeps the water from freezing. Climate affects **infrastructure**.

  - id: d4
    level: 3
    covers: [S4.1, S4.2, S4.3]
    type: open
    prompt: |-
      Describe one way Alberta's climate or weather events affect a farm. Then explain one conservation agriculture
      practice that helps the farm respond.
    modelAnswer: |-
      Southern Alberta can have droughts, so there is less water for crops and cattle. The farmer can use water
      efficiently, by watering only when the crops need it, and keep stubble on the fields to cover the soil, so it
      holds moisture and doesn't blow away in windstorms.
    rubric:
      - I described a real effect of Alberta's climate or a weather event on a farm.
      - I named a conservation agriculture practice.
      - I explained how the practice helps.
