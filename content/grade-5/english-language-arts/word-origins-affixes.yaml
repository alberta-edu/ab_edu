id: word-origins-affixes
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI3
outcomes: [LANENG5-OI3-GQ1-LO1]
order: 4
title: Word Origins, Bases and Affixes
shortTitle: Word origins & affixes
summary: >-
  Trace English words back around the world, see how meanings change, take words apart into bases and
  affixes, and build your vocabulary with the right tools.

bigIdea: |-
  - English words come from **many languages**, and their meanings keep changing.
  - Most long words are built from parts: a **base** that holds the meaning, plus **affixes** that change it.
  - Knowing those parts helps you understand words you have never seen.

lesson:
  - title: Words from around the world
    blocks:
      - type: visual
        covers: [K1.1, K1.2, S1.1, S1.2, S1.3, U1.1]
        component: word-journey
        caption: Tap a word to find where it came from. Then look at the other two tabs. Source for word histories, Wiktionary.

  - title: Take words apart
    blocks:
      - type: visual
        covers: [K1.3, S1.4, U1.1]
        component: word-builder
        caption: Tap each prefix and suffix. An **affix** changes the meaning of a word when it is added to a **base**.
      - type: callout
        variant: tip
        covers: [K1.3, S1.4]
        title: A base keeps its meaning
        body: '**port** means “carry” in *transport* and *export*. **mit** means “send” in *transmit*, *admit* and *permit*. Learn one base, and you get a hint about a whole family of words.'

  - title: Solve a word you’ve never seen
    blocks:
      - type: example
        covers: [S1.4, K1.3, K2.1]
        title: What does “circumnavigate” mean?
        problem: 'You read: “Her dream was to **circumnavigate** the globe in a small boat.”'
        steps:
          - '**Find the prefix:** *circum-* means “around.”'
          - '**Find the base:** *navigate* means “to steer a ship or find your way.”'
          - '**Put them together:** to steer around.'
          - '**Check the sentence:** to steer around the globe in a boat makes sense ✓'
        answer: To **circumnavigate** is to sail or travel all the way around something.
      - type: callout
        variant: tip
        covers: [K2.1]
        title: More words, better reading
        body: Each word you know makes the next text easier to understand.

  - title: Two tools for words
    blocks:
      - type: compare
        covers: [K2.2, S2.3, U2.1]
        columns:
          - title: 📖 Dictionary
            body: |-
              Tells you what a word **means**, and often where it came from.

              > **spacious** (adj.) having plenty of room. *A spacious kitchen.*
          - title: 📗 Thesaurus
            body: |-
              Gives you **other words** with similar or opposite meanings.

              > **spacious:** roomy, large, wide. *Opposite:* cramped.
      - type: callout
        variant: mistake
        covers: [K2.2]
        title: Check before you swap
        body: Words from a thesaurus aren’t exact matches. Look up a new word in a dictionary to make sure that it fits your sentence.

  - title: Grow your word collection
    blocks:
      - type: compare
        covers: [K2.3, S2.1, S2.2, S2.4]
        columns:
          - title: 📚 Read widely
            body: Stories, news, comics and science books all use different words. Each kind adds some to your collection.
          - title: 👂 Listen and note
            body: When someone uses a word in an interesting way, notice how they used it, and try it yourself.
          - title: 📝 Keep a word log
            body: Record words that interest you, what they mean, and a sentence of your own. Say each one, draw it or use it to help you remember.

  - title: Words for school subjects
    blocks:
      - type: table
        covers: [S3.1, S3.2, S3.3, U3.1]
        caption: Tier 2 and tier 3 words give you exact ways to say what you mean.
        headers: [Kind of word, What it is, Examples, 'In a sentence']
        rows:
          - ['**Tier 2**', 'Useful in many subjects', '*compare, analyze, predict*', 'Let’s **compare** the two maps.']
          - ['**Tier 3**', 'Belongs to one subject', '*denominator* (math), *buoyancy* (science), *latitude* (social studies)', 'The **denominator** of this fraction is 8.']
      - type: callout
        variant: tip
        covers: [U3.1, S3.1]
        title: A lifelong project
        body: Nobody ever finishes learning words. Each new one you learn gives you a new way to communicate.

keyTerms:
  - term: Base
    covers: [K1.3, S1.4]
    definition: The part of a word that holds its main meaning. Affixes attach to it.
  - term: Affix
    covers: [K1.3]
    definition: A word part added to a base that changes its meaning.
  - term: Prefix
    covers: [K1.3]
    definition: An affix that goes before a base, such as trans- or sub-.
  - term: Suffix
    covers: [K1.3]
    definition: An affix that goes after a base, such as -ous or -ment.
  - term: Word origin
    covers: [K1.1, S1.1]
    definition: Where a word came from, such as the language it was first used in.
  - term: Thesaurus
    covers: [K2.2]
    definition: A book or website that lists words with similar or opposite meanings.
  - term: Tier 2 word
    covers: [S3.2]
    definition: A useful word that appears in many subjects, such as compare.
  - term: Tier 3 word
    covers: [S3.3]
    definition: A word that belongs to one subject, such as denominator in math.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.3, S1.4]
    type: mc
    prompt: |-
      A silly sign at the park says **NO TRANSPUDDLING!** The word isn’t real, but its prefix is. What is the
      sign banning?
    choices:
      - Going across the puddles
      - Going around the puddles
      - Going under the puddles
      - Taking water out of the puddles
    answer: 0
    feedback:
      '1': That would be *circum-*. Which prefix is on the sign?
      '2': That would be *sub-*. Which prefix is on the sign?
      '3': That would be *ex-*. Which prefix is on the sign?
    hints:
      - Cover up “puddling.” Which prefix is left?
      - Think of *transport*. Where does it carry things?
    solution:
      - Find the prefix first. *Trans-* means “across.”
      - So transpuddling is going **across** puddles. You can read a word you have never seen, even a made-up one.

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.1, S1.1, K2.2]
    type: mc
    prompt: |-
      A dictionary says: **pyjamas**. From Hindi and Urdu, from Persian *pā* “leg” + *jāma* “garment.”

      Going by its origin, what does the word *pyjamas* name?
    choices:
      - Something you wear on your legs
      - Something you wear to sleep
      - Something you wear at home
      - Something you wear in Persia
    answer: 0
    feedback:
      '1': That is how we use the word today. The question asks what its parts first said. Read the meanings in the entry.
      '2': That fits how we use them today, but neither part of the word means home.
      '3': Persian is the language the word came through. The word’s parts don’t name a place.
    hints:
      - The entry gives you two parts. What does each part mean?
      - Put the two meanings together.
    solution:
      - '*Pā* means “leg” and *jāma* means “garment,” so the word names a **garment for the legs**.'
      - A word’s origin can tell you something that its meaning today doesn’t. And your bedtime clothes have a word that came from Asia.

  - id: w3
    level: 1
    thinking: recall
    covers: [S3.3, S3.2]
    type: mc
    prompt: |-
      Your friend says, “the distance all the way around the outside of the rectangle.” Which **tier 3** math
      word says all of that at once?
    choices: [perimeter, area, compare, predict]
    answer: 0
    feedback:
      '1': Area is a tier 3 math word too, but it means the space inside a shape, not the distance around it.
      '2': You compare things in every subject, so this is a tier 2 word. It doesn’t mean a distance either.
      '3': You predict in science, reading and more, so this is a tier 2 word. It doesn’t mean a distance either.
    hints:
      - A tier 3 word belongs to one subject. Which of these did you learn in math?
      - Are you walking around the edge of the shape or covering the inside?
    solution:
      - '**Perimeter** means the distance around a shape. It belongs to math, so it is a tier 3 word.'
      - One exact word can do the work of a whole long phrase.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K1.3, S1.4]
    type: multi
    prompt: |-
      Mina is writing a joke dictionary. “**Elephant:** a person who elephs.”

      It’s funny because *-ant* is a real suffix, but not in *elephant*. Which of these words **really** have the
      suffix *-ant*? Take off *-ant* and see if a real word with a linked meaning is left. A silent *e* may have
      dropped when the suffix joined on.
    choices: [pleasant, plant, giant, servant, ant]
    fixedOrder: true
    answer: [0, 3]
    feedback:
      '1': Take off *-ant* and you have *pl*. That isn’t a word, so these letters are not a suffix here.
      '2': Take off *-ant* and you have *gi*. That isn’t a word, so these letters are not a suffix here.
      '4': Take off *-ant* and nothing at all is left. An ant is not a person who does anything!
    hints:
      - Try the test on each word. What is left when you cover the last three letters?
      - For *pleasant* and *servant*, try putting a silent *e* back on what is left.
      - Is what you found linked to the whole word’s meaning?
    solution:
      - '*Pleasant* leaves *please*: something pleasant is pleasing. *Servant* leaves *serve*: a servant is a person who serves.'
      - '*Plant* and *giant* leave *pl* and *gi*, and *ant* leaves nothing. So in those words the last letters just happen to look like a suffix.'
      - 'What we learned: letters that look like an affix aren’t always one. Test what is left.'

  - id: b2
    level: 2
    thinking: connect
    covers: [S1.4, K1.3, U1.1]
    type: mc
    prompt: |-
      In a video game, your character can **teleport**. That word was shortened from *teleportation*, which was
      made by joining *tele* “far away,” the same part as in *telephone*, to the end of *transportation*. So the
      *port* in it comes from *transport*. Going by those parts, what does your character do?
    choices:
      - Gets carried far away
      - Hears a voice from far away
      - Sails to a far-off harbour
      - Carries a far-off phone
    answer: 0
    feedback:
      '1': That is *telephone*, where *tele* joins with a part meaning “voice.” What does *port* mean in *transport*?
      '2': A *port* can also be a harbour, but that is a different word. Here the base is the one in *transport*. What does *transport* do?
      '3': Nothing here is about a phone. *Tele* only means “far away,” and it joins many words.
    hints:
      - What does *transport* do to goods? That tells you what *port* means.
      - Now put “far away” and that meaning together.
    solution:
      - In *transport*, *port* means “carry.” *Tele* means “far away.”
      - Far + carry = **carried far away**. The word tells you what the power does.
      - Another way to check it is to ask whether it fits the game. Your character does vanish here and turn up far away ✓

  - id: b3
    level: 2
    thinking: evidence
    covers: [K1.2, S1.2]
    type: mc
    prompt: |-
      Imagine a letter written hundreds of years ago: “That winter we had little **meat**: only bread, apples and
      a pot of beans.”

      Judging from the letter, what did the word *meat* mean to the writer?
    choices:
      - Any kind of food
      - Only beef or pork
      - Only bread and grains
      - Only food for winter
    answer: 0
    feedback:
      '1': That is close to what the word means today. But the writer lists bread, apples and beans as the meat they had.
      '2': Then apples and beans wouldn’t be on the list. What do all three things have in common?
      '3': The letter says “that winter,” but that tells you when, not what the word means. Look at the list after it.
    hints:
      - What does the writer list as their “meat”?
      - What do bread, apples and beans have in common?
    solution:
      - Don’t use today’s meaning. Use the writer’s own clue, the list after the colon.
      - Bread, apples and beans are all **food**, so *meat* must have meant food of any kind.
      - The letter is made up, but the history is true. *Meat* comes from an Old English word for food, and vocabulary changes over time.

  - id: b4
    level: 2
    thinking: notice
    covers: [K2.2, S2.3]
    type: text
    prompt: |-
      You write, “Grandma’s new sunglasses are **cool**.” You click your app’s *Make It Fancy* button. It looks in a
      thesaurus, which lists *chilly*, *calm* and *stylish*, and it picks the first word:

      “Grandma’s new sunglasses are chilly.”

      Which listed word did you really mean?
    accept: [stylish]
    hints:
      - Picture the sunglasses. What were you saying about them?
      - Try each listed word in your sentence.
    solution:
      - '*Cool* has more than one meaning, and each listed word matches only one of them. *Chilly* is about temperature, and *calm* is about staying relaxed.'
      - You meant **stylish**. Words from a thesaurus aren’t exact matches, so choose by meaning, and look up any new word in a dictionary.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.3, S1.4, U1.1]
    type: investigation
    prompt: |-
      A **tractor** hauls a plow across a field. Your boot sinks in deep mud, and you **extract** it (*ex-* means
      “out”). Both words hold the same base: **tract**. Let’s follow this base and see where it turns up.
    parts:
      - type: text
        prompt: What do you think the base **tract** means? Answer in one word.
        accept: [pull, pulls, pulling, to pull, drag, drags, dragging, to drag, draw, tug, haul, hauls, hauling, yank]
        hints:
          - What is the tractor doing to the plow?
          - What are you doing to your boot, in the direction “out”?
        solution:
          - A tractor pulls a plow. To extract your boot is to pull it out of the mud. So **tract** means “pull.”
      - type: mc
        prompt: |-
          The prefix *ad-* means “to, toward.” Its *d* sometimes changes to match the next letter, so *ad* + *tract*
          is spelled **attract**. A fridge magnet *attracts* a paper clip. Going by the parts, what does the magnet do?
        choices:
          - It pulls the clip toward itself.
          - It pulls the clip out and away.
          - It pulls the clip down under it.
          - It pulls the clip across the room.
        answer: 0
        feedback:
          '1': That sounds like *ex-*. What does *ad-* mean?
          '2': That sounds like *sub-*. What does *ad-* mean?
          '3': That sounds like *trans-*. What does *ad-* mean?
        hints:
          - Put together “to, toward” and “pull.”
        solution:
          - Toward + pull = pull toward. A magnet pulls the clip **toward** itself.
      - type: mc
        prompt: |-
          Your dog is trotting straight home when a squirrel darts past. Now the dog is staring up a tree, and home is
          forgotten. You say, “The squirrel **distracted** him.” Here *dis-* means “apart.” Which picture does the word
          really paint?
        choices:
          - His attention got pulled off in another direction.
          - His legs got too tired to carry on going home.
          - His memory lost the way home for good.
          - His owner pulled him toward the tree by the leash.
        answer: 0
        feedback:
          '1': Nothing in the word or the story says he’s tired. What does *tract* mean, and what is being pulled?
          '2': He hasn’t lost his way. He’s only looking at something else. What is being pulled apart?
          '3': There is a pull here, but who or what is doing the pulling in the story?
        hints:
          - Use *dis-* “apart” and *tract* “pull.” What gets pulled apart from what?
          - The dog’s body hasn’t been pulled. So what has?
        solution:
          - Apart + pull = pulled apart. Nobody touched the dog, but his **attention** was pulled away from going home.
          - That is what a distraction feels like, and now you can see why the word fits.
    wrapUp: A tractor, a magnet and a distracted dog all share one base. A base keeps its meaning across a whole family of words, so learning one can unlock many.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: perspective
    covers: [K1.2, S1.2, S1.3, S3.1]
    type: investigation
    prompt: |-
      You leave this note on the fridge:

      > *The mouse is broken. My selfies are safe in the cloud. Send Dad an emoji.*

      Then your great-great-grandmother Edith steps out of a time machine from the year 1900 and reads it. She
      has never seen a computer. Think like Edith.
    parts:
      - type: multi
        prompt: Some words in the note fool Edith because she knows an older meaning. Other words she has **never met at all**. Which has she never met?
        choices: [selfies, mouse, emoji, cloud, Dad]
        fixedOrder: true
        answer: [0, 2]
        feedback:
          '1': Edith knows this word well, but she pictures a small furry animal.
          '3': Edith knows this word well. She just pictures the sky.
          '4': Edith knows this word, and it means just what it means to you.
        hints:
          - Which of these words were made because of phones and the internet?
        solution:
          - '*Selfie* and *emoji* are new to English. Neither word existed in 1900.'
          - '*Mouse* and *cloud* are old words with new jobs, and that’s why they’re the ones that fool her.'
      - type: mc
        prompt: |-
          *Dad* means the same to Edith as it does to you. So why did *mouse* and *cloud* pick up new meanings
          when *Dad* didn’t?
        choices:
          - People’s lives changed, and new things needed names.
          - Longer words change much faster than shorter words.
          - Words about nature change, and words about family don’t.
          - Somebody changes a list of words every few years.
        answer: 0
        feedback:
          '1': '*Mouse* is only a little longer than *Dad*, and many short words have changed. Is length really the reason? What was new in the world?'
          '2': That fits these three words, but it’s a guess from a very small list. *Mouse* now names a computer tool. What new thing needed that name?
          '3': Nobody is in charge of that. People change words simply by using them.
        hints:
          - What arrived in the world between 1900 and now?
          - Did anything new turn up that needed a *dad* word?
        solution:
          - New machines arrived, and people needed names for them, so they gave old words new jobs.
          - Vocabulary reflects how people are using words at that time. When life changes, words change too.
    wrapUp: A word’s meaning belongs to its time. When you read something old, or explain something new, ask what the words meant to the people using them.
    hints: []
    solution: []
