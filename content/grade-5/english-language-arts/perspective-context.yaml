id: perspective-context
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI7
outcomes: [LANENG5-OI7-GQ1-LO1]
order: 7
title: Perspective and Context
shortTitle: Perspective & context
summary: >-
  Look at one beaver pond through three people’s eyes, explore how life shapes what they think, connect
  texts to your world, and summarize with evidence.

bigIdea: |-
  - Two people can look at the same thing and see something completely different.
  - Their **perspectives** come from their cultures, experiences and interests.
  - The **context** around a person, an event or a text helps you understand why.

lesson:
  - title: One pond, three views
    blocks:
      - type: visual
        covers: [K4.1, K4.2, K4.3]
        component: perspective-lens
        props:
          people:
            - id: dad
              icon: 🚜
              name: Dad
              focus: field
              thinks: “That water is drowning my winter feed.”
              shapedBy: His **experience** on the farm, and his **interest** in keeping his cattle fed.
            - id: tess
              icon: ✏️
              name: Tess
              focus: pond
              thinks: “That pond is the best thing that ever happened to this creek.”
              shapedBy: Her **interest** in wild animals. She spent the summer drawing them.
            - id: novak
              icon: 🥚
              name: Mrs. Novak
              focus: dam
              thinks: “A dam like that would have saved us in the dry years.”
              shapedBy: Her **experience** of a time when her well ran dry.
        caption: Tap each person. What does each one notice first?

  - title: Read the story
    blocks:
      - type: passage
        id: pond
        title: The Beaver Pond
        form: Realistic fiction
        paragraphs:
          - The water had come up overnight. It covered the low corner of the hay field, and Dad stood at the edge of it with his jaw tight. “That’s a whole corner of winter feed,” he said. “Those beavers have to go.”
          - Tess said nothing. She had spent all summer sketching the pond from the willows, and she knew each duck family by sight. To her, the dam wasn’t a problem. It was the best thing that had ever happened to the creek.
          - Mrs. Novak from the next farm came by with a carton of eggs. She looked at the water and laughed. “You weren’t here in the dry years, Tess,” she said. “My well went dry, and the cattle stood around in the mud where this creek used to be. I would have paid good money for a pond like that.”
          - Dad looked at the water for a long time. A flood had taken his father’s whole crop when Dad was ten, and he had never forgotten that fall.
          - That night, Tess drew the creek again, but this time she drew the hay field too. At the top of the page she wrote, “What if the water could go around?” She left the sketch beside Dad’s coffee cup.
        note: An original story written for Alberta Edu.

  - title: Why they see it that way
    blocks:
      - type: table
        covers: [S4.2, S4.3, K4.2]
        caption: A main character and supporting characters can see the same pond differently.
        headers: [Character, Their experiences and interests, What they think and do]
        rows:
          - ['**Tess** (main)', 'She loves drawing wildlife, and she never lived through a drought.', 'She wants to keep the pond, and looks for a way to keep the field too.']
          - ['**Dad** (supporting)', 'He needs the feed, and his father lost a crop to a flood.', 'He sees danger, and wants the beavers gone.']
          - ['**Mrs. Novak** (supporting)', 'She lived through the dry years, when her well went dry.', 'She sees stored water, and she laughs at the “problem.”']
      - type: callout
        variant: tip
        covers: [K4.2, S4.4]
        title: Propose another view
        body: |-
          A story doesn’t tell you everything. Ask: **whose view is missing?**

          How would a neighbour downstream, who needs the creek to keep flowing, see this dam?

  - title: Text can change your mind
    blocks:
      - type: compare
        covers: [S4.1, U4.1]
        columns:
          - title: Before reading
            body: '“Beavers are cute. Who could be against them?”'
          - title: After reading
            body: '“I still like beavers, but now I see why a farmer would worry about losing his feed.”'
      - type: callout
        variant: tip
        covers: [S4.1, U4.1]
        title: Your view can grow
        body: Reading about other perspectives doesn’t mean giving up your own. It means your understanding of the world gets bigger.

  - title: Context is the background
    blocks:
      - type: compare
        covers: [K5.1, K5.4, S5.1, S5.2, S5.5]
        columns:
          - title: Without context
            body: |-
              > Dad stood with his jaw tight.

              He seems angry about a little water.
          - title: With context
            body: |-
              > A flood had taken his father’s whole crop when Dad was ten.

              Now we can see that he is **afraid**, and why.
      - type: text
        covers: [U5.1, K5.4]
        body: '**Context** means the circumstances that form the background of a person, event, idea or text. Knowing it helps you understand why characters think and act as they do.'

  - title: Who wrote it, and who is reading?
    blocks:
      - type: table
        covers: [K5.2, K5.3, S5.3, S5.4]
        caption: Two articles about beaver dams. What is the context of each writer?
        headers: [Writer, Their background, How that may shape the text]
        rows:
          - ['A wetland scientist', 'Studies birds and frogs for a living', 'May focus on how ponds help wildlife']
          - ['A rancher', 'Has lost hay to flooding', 'May focus on how dams harm farms']
      - type: callout
        variant: tip
        covers: [S5.3, S5.4, K5.2]
        title: Check the author, and check yourself
        body: |-
          1. For an informational text, look up who wrote it, and why.
          2. Then notice your own context. If you grew up on a ranch, you may read that article very differently than someone who lives in a city.

  - title: Connect and summarize
    blocks:
      - type: visual
        covers: [K2.1, S2.1]
        component: card-sort
        props:
          bins:
            - { id: self, label: Text to self, icon: 🙋 }
            - { id: text, label: Text to text, icon: 📚 }
            - { id: world, label: Text to world, icon: 🌎 }
          cards:
            - { text: "“Tess reminds me of when I wanted to keep a stray cat, and my mom said no.”", bin: self, why: 'This connects the story to your own life.' }
            - { text: "“My family had a flood in our basement, so I get why Dad is scared.”", bin: self, why: 'This connects the story to your own experience.' }
            - { text: “Nadia in ‘The Arch’ also learned something from an older person.”, bin: text, why: 'This connects the story to another text.' }
            - { text: "“I read a book where beavers rebuilt a stream, which is what happens here.”", bin: text, why: 'This connects the story to another book.' }
            - { text: "“People on the news are arguing about water use, too.”", bin: world, why: 'This connects the story to what is happening in the world.' }
            - { text: "“Dry years really do happen on the prairies, and farmers really do worry.”", bin: world, why: 'This connects the story to real events in the world.' }
        caption: Connections can become evidence for what you think. Where does each one belong?
      - type: example
        covers: [K2.2, S2.1, U2.1]
        title: Summarize “The Beaver Pond”
        problem: Give the main idea, with supporting evidence.
        steps:
          - '**Main idea:** People can see the same pond differently, because of what they have lived through.'
          - '**Evidence from the text:** Dad fears flooding (paragraph 4), and Mrs. Novak remembers drought (paragraph 3).'
          - '**Evidence from the world:** Farmers on the prairies can face both floods and dry years.'
        answer: 'Dad, Tess and Mrs. Novak each see the pond differently because of their experiences, and Tess starts looking for a solution that works for everyone.'

keyTerms:
  - term: Perspective
    covers: [K4.1]
    definition: An attitude, belief or way of thinking about events or information.
  - term: Context
    covers: [K5.1]
    definition: The circumstances that form the background of a person, an event, an idea or a text.
  - term: Main character
    covers: [S4.3]
    definition: The character the story is mostly about.
  - term: Supporting character
    covers: [S4.3]
    definition: A character who helps tell the main character’s story.
  - term: Text-to-self connection
    covers: [K2.1]
    definition: A link between a text and your own life.
  - term: Text-to-text connection
    covers: [K2.1]
    definition: A link between a text and another text.
  - term: Text-to-world connection
    covers: [K2.1]
    definition: A link between a text and events or ideas in the world.
  - term: Summarize
    covers: [K2.2]
    definition: To identify the main ideas of a text and use supporting evidence.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K4.1, K4.2]
    type: mc
    prompt: |-
      It snows all night. A child looks out and shouts, “Snow day!” The snowplow driver looks out and groans, “Fourteen
      hours in the truck.” Why do they think so differently?
    choices:
      - Their lives make the snow mean different things.
      - They are looking at different amounts of snow.
      - One of them must be wrong about the snow.
      - The driver has never seen a snowfall before.
    answer: 0
    feedback:
      '1': It’s the same snow outside the same window. What’s different about the two people?
      '2': Both can be right, since they aren’t arguing about what the snow is. They’re saying what it means for them.
      '3': It’s the opposite. The driver knows snow very well, and that is why the groan comes so fast.
    hints:
      - What does the snow mean for the child’s day? What does it mean for the driver’s day?
    solution:
      - The snow is the same. The **perspectives** are different, because each person’s experiences and interests are different.

  - id: w2
    level: 1
    thinking: recall
    covers: [K2.1]
    type: mc
    prompt: |-
      You finish a story about a girl whose best friend moves away. You think, “This is just like when my best friend moved
      to Regina last year.” What kind of connection is that?
    choices: [Text to self, Text to text, Text to world, It isn’t a connection]
    answer: 0
    feedback:
      '1': That would link this story to another book or text. What are you linking it to here?
      '2': That would link the story to events in the world, such as the news. Whose life are you thinking about here?
      '3': You did link the story to something else. What did you link it to?
    hints:
      - Whose best friend moved to Regina?
    solution:
      - It happened to **you**, so this is a **text-to-self** connection.

  - id: w3
    level: 1
    thinking: notice
    covers: [K5.1, S5.1]
    type: mc
    prompt: |-
      “Ana answered in a whisper, and she kept her eyes on her desk.” Which piece of background gives you the best
      **context** for this?
    choices:
      - It was Ana’s first day at this school, and she knew nobody.
      - The walls in Ana’s new classroom were painted a light green.
      - The classroom clock said that it was almost a quarter past ten.
      - The class was going to have pizza for lunch at noon that day.
    answer: 0
    feedback:
      '1': That’s a real detail, but does it help you understand why she’s whispering?
      '2': That tells you when, but does it help you understand how she’s feeling?
      '3': Would pizza make someone whisper? Look for what is going on in Ana’s life.
    hints:
      - Which detail would help you understand why she is acting this way?
    solution:
      - Context is the background to a person or event. Being new and knowing nobody helps explain the whisper. The other details don’t.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b2
    level: 2
    thinking: evidence
    covers: [S4.2, S5.2, U4.1]
    type: evidence
    prompt: At the start, Tess sees only a wonderful pond. Tap the sentence where you can **first** tell that she now sees Dad’s side too.
    passage: pond
    paragraphs: [2, 5]
    answer: [p5s1]
    feedback:
      p2s1: She isn’t saying anything here, and we don’t yet know what she’s thinking. Read on.
      p2s2: This shows what she cares about before anything has changed.
      p2s3: This is still her first view. Look for where her view grows.
      p2s4: This is still her first view. Look for where her view grows.
      p5s2: This does show it, but something earlier already gave it away. Read the sentence before this one.
      p5s3: She’s sharing the idea here, but it began earlier. What did she draw first?
    hints:
      - In her first drawings, what did Tess draw? What’s different in the last paragraph?
      - Look at what she adds to the page.
    solution:
      - All summer, Tess sketched only the pond. Now “this time she drew the hay field too.”
      - The hay field is what Dad is worried about. Putting it on the page shows that her view has grown to include his.

  - id: b3
    level: 2
    thinking: notice
    covers: [S4.4, K4.3]
    type: mc
    prompt: |-
      **Everybody Loves the New Rink Lights!**

      “We can skate until midnight!” says Jess, a teenager. “Sales are up!” says the snack bar owner. “More ice time!”
      says the hockey coach.

      Whose view is missing, and most likely to be different?
    choices:
      - A family whose bedroom windows face the rink
      - A second coach from the same hockey league
      - A skater who drives in from the next town
      - A company that sells snacks to the snack bar
    answer: 0
    feedback:
      '1': More ice time would help this coach as well. Who might not enjoy the rink being lit up at midnight?
      '2': This skater would also get more time on the ice. Who gets something bad from those lights?
      '3': This company would also sell more. Think about who lives near the rink.
    hints:
      - The headline says *everybody*. What do all three people get from the lights?
      - Who might lose something when the lights stay on until midnight?
    solution:
      - All three people quoted get something good from the lights. That’s a clue that someone may have been left out.
      - A family with bedroom windows facing the rink would have bright lights and noise at midnight. They could see this very differently.

  - id: b4
    level: 2
    thinking: evidence
    covers: [K5.3, S5.4]
    type: mc
    prompt: |-
      A pamphlet is called *Why Thin Crust Is the Best Pizza*. It lists five reasons. At the bottom, it says, “By Dom, owner of
      Dom’s Thin Crust Pizza.” How should knowing this change how you read the pamphlet?
    choices:
      - Keep reading, and ask what Dom may have left out.
      - Stop reading, since all of it must be untrue.
      - Trust all of it, since Dom knows pizza best.
      - Change nothing, since writers don’t matter.
    answer: 0
    feedback:
      '1': Dom may tell the truth about thin crust, and his crust may be great. His job doesn’t make his reasons false. What might he not bother to mention, though?
      '2': He probably does know a lot about pizza. But he also has a shop to run. Would he write much about what’s good about thick crust?
      '3': A writer’s context can shape what is in a text. What might Dom’s job make him focus on?
    hints:
      - What does Dom do all day? What would he want to write about?
      - Does that make his reasons false? Or just one part of the story?
    solution:
      - Knowing who wrote a text gives you its context. Dom’s job may shape what he chooses to focus on.
      - That doesn’t make him wrong, so you don’t have to throw the pamphlet away. You read it knowing there may be more to the story.

  - id: b5
    level: 2
    thinking: flaw
    covers: [K2.2, S2.1, U2.1]
    type: mc
    prompt: |-
      Jun summarizes *The Beaver Pond* like this:

      “**Main idea:** Dad hates animals. **Evidence:** He says, ‘Those beavers have to go.’”

      Where does Jun’s summary go wrong?
    choices:
      - The quote shows a worry about his hay, not a hatred of animals.
      - The quote isn’t really in the story, so it can’t be evidence.
      - A summary can’t have a quote, since it has to use your own words.
      - A main idea has to be about Tess, since she is the main character.
    answer: 0
    feedback:
      '1': He does say that, in the first paragraph. Read what he says just before it.
      '2': A short quote is good evidence for a summary. Does this one prove what Jun says it proves?
      '3': A main idea has to be about the whole story, and that can include other characters. Does “Dad hates animals” sum up the story?
    hints:
      - Read Dad’s words in the first paragraph. What is he upset about?
      - Does the whole story seem to be about Dad hating animals?
    solution:
      - Just before that line, Dad says, “That’s a whole corner of winter feed.” Paragraph 4 tells us about his fear of floods. He’s worried about water and hay, and he never says anything about hating animals.
      - A stronger summary has a main idea that fits the whole story, such as “People can see the same pond differently because of what they have lived through,” with evidence for it.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K5.1, K5.4, S5.1, S5.2, U5.1, K4.2]
    type: investigation
    prompt: |-
      Every morning at 8:00, old Mrs. Kovacs walks to the bus stop on Elm Street. The Number 9 bus pulls up. The doors open.
      The driver waves. Mrs. Kovacs shakes her head, waves back, and the bus drives on. Then she walks home.
    parts:
      - type: mc
        prompt: From only this much, what can you honestly say?
        choices:
          - She goes there on purpose, but we can’t tell why.
          - She gets mixed up and forgets where she’s going.
          - She is afraid of getting on the bus and riding.
          - She is waiting for some other bus to come along.
        answer: 0
        feedback:
          '1': Could be, but what in the story shows that? She does this calmly, every day, and she knows the way home.
          '2': Could be, but what in the story shows that? She’s waving at the driver.
          '3': If so, why does she walk home right after this bus leaves?
        hints:
          - Sort what the story says from what you are guessing. Does the story say why she does it?
        solution:
          - The story says what she does, and it doesn’t say why. She does it every day, so it isn’t an accident. But for the reason, we need more.
      - type: mc
        prompt: |-
          Now you find out that Mrs. Kovacs drove the Number 9 bus for 40 years. She retired last spring. Luis, today’s
          driver, is someone she trained. What do you now think her morning walk is?
        choices:
          - A daily visit to her old route and an old friend
          - A daily check so she can report Luis to his boss
          - A daily try to get her old job back from Luis
          - A daily trip she wishes that she could still ride
        answer: 0
        feedback:
          '1': Does she act like someone looking for mistakes? Look at what she and Luis do when the doors open.
          '2': She shakes her head when the doors open, and then she goes home. Does that look like someone asking for a job?
          '3': She could get on if she wanted to, since the doors open every day. So what does she come for?
        hints:
          - Read the story again, knowing this. What does the wave mean now?
        solution:
          - The actions are the same, but the wave now looks like a hello between two old friends. She’s come to see her route and the person she trained.
          - Context didn’t change what she does. It changed what we understand.
      - type: mc
        prompt: Imani rides the Number 9 each day. She tells her mom, “That poor lady keeps missing her bus.” Why does Imani read it this way?
        choices:
          - She can see what happens, but she doesn’t know the background.
          - She doesn’t care very much about older people in her community.
          - She isn’t on the bus often enough to see what Mrs. Kovacs does.
          - She can’t be sure, since people on a bus can’t see the bus stop.
        answer: 0
        feedback:
          '1': She calls her “poor lady,” so she does seem to care. What is it that she’s missing?
          '2': She rides it every day, so she sees it often. Is seeing it enough to understand it?
          '3': She can see the stop, and she sees exactly what happens. What did you know that she doesn’t?
        hints:
          - What did you know after the second part that Imani doesn’t know?
        solution:
          - Imani sees just what you saw at the start. Without the context, she fills in a reason of her own.
    wrapUp: The same actions can mean very different things. Before you decide why someone does something, ask what you don’t know about their background.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: perspective
    covers: [K5.2, S5.3, U5.1]
    type: investigation
    prompt: |-
      Read this bit of a story twice, the way two different readers might read it:

      > *A huge dog bounded across the yard, jumped up on Sadie and licked her whole face. She could not get away.*

      Reader 1 grew up with big, gentle dogs. Reader 2 got knocked down by a big dog last year.
    parts:
      - type: mc
        prompt: How is each reader likely to feel about this moment?
        choices:
          - Reader 1 smiles, and Reader 2 feels tense.
          - Reader 1 feels tense, and Reader 2 smiles.
          - Both of them smile, because the dog is friendly.
          - Both of them feel tense, because she’s trapped.
        answer: 0
        feedback:
          '1': Which reader has a good memory of big dogs? Which one has a bad memory?
          '2': The words do fit a friendly dog. But think about what Reader 2 remembers while reading them.
          '3': The words do fit that as well. But think about what Reader 1 remembers while reading them.
        hints:
          - What memory does each reader bring along?
        solution:
          - Reader 1 remembers gentle dogs, so this looks fun. Reader 2 remembers getting knocked down, so “could not get away” feels bad.
          - The words are exactly the same. What each reader brings to them is different.
      - type: multi
        prompt: Each reader’s experience can change how the story feels. But which of these are **actually in the text**?
        choices:
          - The dog licked Sadie’s face.
          - The dog wanted to hurt Sadie.
          - The dog is big.
          - Sadie loved every second of it.
        fixedOrder: true
        answer: [0, 2]
        feedback:
          '1': The text never says what the dog wanted. That comes from a reader’s own memories.
          '3': The text never says how Sadie feels. That comes from a reader’s own memories.
        hints:
          - Point to the words. If you can’t point to them, it came from the reader.
        solution:
          - '“Licked her whole face” and “huge dog” are right there in the text.'
          - What the dog wanted and how Sadie felt aren’t in the text. Each reader added those. That’s fine, but it’s good to notice when you’re doing it.
    wrapUp: Readers bring their own lives to every text, and writers can use their words to guide what readers feel.
    hints: []
    solution: []
