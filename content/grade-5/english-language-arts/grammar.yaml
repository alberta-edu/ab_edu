id: grammar
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI9
outcomes: [LANENG5-OI9-GQ1-LO1]
order: 11
title: "Grammar: Tense, Pronouns, Adverbs and Conjunctions"
shortTitle: Grammar
summary: >-
  Change a sentence and see what happens: find subjects and objects, swap in pronouns, keep your tense
  steady, slide adverbs around, and join ideas with conjunctions.

bigIdea: |-
  Grammar lets readers follow your meaning.

  - **Tense** tells them when.
  - **Subjects and objects** tell them who did what to whom.
  - **Pronouns** save repeating nouns.
  - **Adverbs** describe actions.
  - **Conjunctions** join ideas.

lesson:
  - title: Who did what to whom?
    blocks:
      - type: visual
        covers: [K2.4, K2.5, S2.3, S2.4, S2.5, S2.8]
        component: sentence-lab
        props: { mode: roles }
        caption: Press the button to swap in pronouns. What stays the same? Try another sentence.
      - type: table
        covers: [K2.4, K2.5, S2.8]
        caption: Three types of pronouns
        headers: [Type, Job, Examples]
        rows:
          - ['**Subject pronoun**', 'Replaces the noun doing the action', 'I, you, he, she, it, we, they']
          - ['**Object pronoun**', 'Replaces the noun receiving the action', 'me, you, him, her, us, them, whom']
          - ['**Possessive pronoun**', 'Shows who something belongs to', 'my, your, his, her, our, their']

  - title: Pronouns must agree
    blocks:
      - type: compare
        covers: [K2.4, S2.5]
        columns:
          - title: ❌ Doesn’t agree
            body: |-
              The **players** packed **her** bags.

              *Players* is plural, but *her* is singular.
          - title: ✅ Agrees
            body: |-
              The **players** packed **their** bags.

              *Players* and *their* are both plural.
      - type: callout
        variant: mistake
        covers: [S2.3, S2.4, S2.8]
        title: “Sam and me” or “Sam and I”?
        body: |-
          Take away the other person, and listen:

          - “**Sam and I** found the puck” (*I* found it: subject)
          - “The dog followed **Sam and me**” (followed *me*: object)

  - title: Subject and verb agree, too
    blocks:
      - type: table
        covers: [S2.2, U2.1]
        caption: A singular subject takes a singular verb. A plural subject takes a plural verb.
        headers: [Subject, Verb, Sentence]
        rows:
          - ['**Maya** (one)', 'skates', 'Maya **skates** on the lagoon.']
          - ['**Maya and Leo** (two)', 'skate', 'Maya and Leo **skate** on the lagoon.']
          - ['**The dog** (one)', 'barks', 'The dog **barks** at the geese.']
          - ['**The dogs** (more than one)', 'bark', 'The dogs **bark** at the geese.']

  - title: Stay in one time
    blocks:
      - type: visual
        covers: [K2.1, S2.1]
        component: sentence-lab
        props: { mode: tense }
        caption: Press Past, Present and Future. Watch how the verb changes, and where the marker moves.
      - type: compare
        covers: [K2.1, S2.1]
        columns:
          - title: ❌ Tense shifts
            body: I **walked** to the rink, and I **lace** up my skates.
          - title: ✅ Tense stays
            body: I **walked** to the rink, and I **laced** up my skates.

  - title: Adverbs on the move
    blocks:
      - type: visual
        covers: [K2.2, S2.6]
        component: sentence-lab
        props: { mode: adverb }
        caption: An **adverb** describes a verb, and it often ends in *-ly*. Move it, then try another sentence.

  - title: Join your ideas
    blocks:
      - type: visual
        covers: [K2.3, S2.7]
        component: sentence-lab
        props: { mode: join }
        caption: '**Conjunctions** are connecting words. Each one tells the reader how two ideas are related.'

keyTerms:
  - term: Tense
    covers: [K2.1]
    definition: The form of a verb that shows when an action happens, such as past, present or future.
  - term: Subject
    covers: [S2.3]
    definition: The noun or pronoun that does the action in a sentence.
  - term: Object
    covers: [S2.4, K2.5]
    definition: The noun or pronoun that receives the action in a sentence.
  - term: Pronoun
    covers: [K2.4]
    definition: A word used in place of a noun, such as she, them or their.
  - term: Adverb
    covers: [K2.2]
    definition: A word that describes a verb. It often ends in -ly, and it can go before or after the verb.
  - term: Conjunction
    covers: [K2.3]
    definition: A connecting word that joins ideas together in a sentence.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S2.4, S2.3]
    type: text
    prompt: |-
      > The mayor chased a pig across the parking lot.

      What is the **object** of this sentence? Type the noun that receives the action.
    accept: [pig, the pig, a pig]
    hints:
      - Who is doing the chasing? Who is being chased?
    solution:
      - The mayor does the chasing, so *mayor* is the subject.
      - The **pig** gets chased, so it receives the action. It is the object.
      - Swap them, and you get a very different news story. “The pig chased the mayor.”

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.2]
    type: mc
    prompt: |-
      > The silly goat quietly ate my hat.

      Two words here end in *-ly*. Which one is the **adverb**?
    choices:
      - '*quietly*, because it describes how the goat ate'
      - '*silly*, because it describes what the goat is like'
      - Both of them, because every word ending in *-ly* is an adverb
    answer: 0
    feedback:
      '1': An adverb describes a verb. *Goat* isn’t a verb, so what kind of word is *silly* describing?
      '2': Adverbs **often** end in *-ly*, but not every *-ly* word is an adverb. What does each word describe?
    hints:
      - Find the verb. What did the goat do? Which word tells you how?
    solution:
      - The verb is *ate*. How did the goat eat? **Quietly.** So *quietly* is the adverb.
      - '*Silly* describes the goat, which is a noun. The *-ly* is a clue, but you have to check what the word describes.'

  - id: w3
    level: 1
    thinking: notice
    covers: [K2.1, S2.1]
    type: text
    prompt: |-
      One verb slipped out of the past tense. Type that verb the way it should be.

      > The walrus yawned, scratched his belly and rolls over.
    accept: [rolled, rolled over]
    hints:
      - Find the three things that the walrus did. When did he do them?
    solution:
      - '*Yawned* and *scratched* are in the past tense, but *rolls* is in the present.'
      - All three actions happen at the same time, so it should be **rolled**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [S2.8, K2.5, K2.4]
    type: mc
    prompt: |-
      Both sentences have the word *her*.

      > **A.** I drew her.
      >
      > **B.** I drew her horse.

      What type of pronoun is *her* in each one?
    choices:
      - A is an object pronoun. B is a possessive pronoun.
      - A is a possessive pronoun. B is an object pronoun.
      - Both are object pronouns, since I’m doing the drawing.
      - Both are possessive pronouns, since it is the same word.
    answer: 0
    feedback:
      '1': In which picture does a horse belong to someone? Look again at which sentence has the horse.
      '2': In sentence B, what got drawn? Was it her, or something of hers?
      '3': The word looks the same, but it has two different jobs. Ask what each one is doing.
    hints:
      - What is in each drawing?
      - In which sentence does *her* receive the action? In which does it tell you who owns something?
    solution:
      - In A, *her* is the person in the picture. She receives the action, so it is an **object pronoun**.
      - In B, the horse is in the picture, and *her* tells you whose horse it is. That makes it a **possessive pronoun**.
      - You can’t tell a pronoun’s type just by how it looks. You have to see what job it does.

  - id: b2
    level: 2
    thinking: flaw
    covers: [S2.8, S2.4, K2.5]
    type: mc
    prompt: |-
      Rina wrote this:

      > At the farm, the llama licked Hugo and I.

      “It has to be *I*,” she says. “*Hugo and I* always sounds more polite.” Where did her thinking go wrong?
    choices:
      - Polite isn’t the test. The pronoun receives the action, so it must be *me*.
      - Nothing went wrong. *I* is correct after *and*, so her sentence can stay.
      - It should be *Hugo and my*. The pronoun shows who the lick belonged to.
      - It should be *Hugo and we*. Two people got licked, so it must be plural.
    answer: 0
    feedback:
      '1': Take away “Hugo and,” then read it aloud. Does “the llama licked I” sound right?
      '2': Nothing here is owned. *My* would need a noun after it, like *my hand*.
      '3': Hugo is already named, so the pronoun only stands for the speaker. Would you say “the llama licked we”?
    hints:
      - Take away Hugo. What would the sentence say?
      - Who is doing the licking? Who gets licked?
    solution:
      - Take away “Hugo and,” and the mistake shows. “The llama licked I” sounds wrong, and “The llama licked **me**” sounds right.
      - The llama is the subject. Hugo and the speaker receive the lick, so the speaker needs an object pronoun.
      - '*Hugo and I* is right when they do the action. “Hugo and I fed the llama.” It depends on the job, not on how polite it sounds.'

  - id: b3
    level: 2
    thinking: notice
    covers: [S2.5, K2.4]
    type: mc
    prompt: |-
      A muddy puppy is wearing little boots. Two people left two notes about it, and the notes differ by just one word.

      > **Note A:** Take the boots off the puppy, and put **them** in the tub.
      >
      > **Note B:** Take the boots off the puppy, and put **it** in the tub.

      What goes in the tub?
    choices:
      - A puts the boots in the tub. B puts the puppy in the tub.
      - A puts the puppy in the tub. B puts the boots in the tub.
      - Both notes put the boots in the tub, since boots are named first.
      - You can’t tell, because a pronoun could stand for either noun.
    answer: 0
    feedback:
      '1': Is *them* for one thing or more than one? How many puppies are there?
      '2': Look at *it*. Could *it* stand for a pair of boots?
      '3': Often that’s a real problem, but here one noun is singular and one is plural. Does that help?
    hints:
      - Is *boots* singular or plural? What about *puppy*?
      - Which noun could *them* replace? Which could *it* replace?
    solution:
      - A pronoun must agree with its noun in number. *Boots* is plural and *puppy* is singular.
      - So *them* can only be the boots, and *it* can only be the puppy. One small word decides who gets a bath.

  - id: b4
    level: 2
    thinking: model
    covers: [S2.7, K2.3]
    type: mc
    prompt: |-
      The dog started it. It howled first, and that made Dad start to sing. Which conjunction tells the story correctly?

      > The dog howled, ___ Dad sang.
    choices: [so, because, or, although]
    answer: 0
    feedback:
      '1': “The dog howled because Dad sang” says that Dad’s singing made the dog howl. Who started it in that version?
      '2': This offers a choice between the two, but both of them happened.
      '3': This means that Dad sang even though the dog howled. Was the howl stopping him, or starting him?
    hints:
      - Which came first? Which one caused the other?
      - Read the sentence aloud with each conjunction. Who started it each time?
    solution:
      - Conjunctions tell the reader how two ideas are related, and that can change the whole story.
      - “The dog howled, **so** Dad sang” means that the howl came first. “The dog howled **because** Dad sang” turns the story around.

  - id: b5
    level: 2
    thinking: pattern
    covers: [S2.3, S2.4, S2.8]
    type: text
    prompt: |-
      In a comic, one panel says:

      > They followed us.

      In the next panel, the chase turns around. Now we’re behind them. Write the new caption, using only pronouns and the verb *followed*.
    accept: [we followed them]
    hints:
      - Who is doing the following now? That is the subject.
      - Can *us* be the subject of a sentence? What would you use instead?
    solution:
      - We are now the ones following, so we’re the subject. *Us* becomes **we**.
      - They now receive the action, so they’re the object. *They* becomes **them**.
      - With nouns, you only swap the places, as in “The geese followed the kids” and “The kids followed the geese.” Many pronouns also change their form when they change jobs.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: notice
    covers: [S2.2, S2.5, K2.4, U2.1]
    type: investigation
    prompt: |-
      The word *deer* looks the same for one deer or for many. So how could you tell how many are in your garden?

      Read each sentence and look for clues.
    parts:
      - type: mc
        prompt: '“The deer **eat** my tulips.” How many deer?'
        choices: [One, More than one, You can’t tell]
        fixedOrder: true
        answer: 1
        feedback:
          '0': For one animal, we say “The goose *eats*.” What does *eat* with no *s* go with?
          '2': The noun doesn’t tell you, but look at the verb.
        hints:
          - Compare “The dog eats” with “The dogs eat.”
        solution:
          - A plural subject takes a plural verb. *Eat* goes with more than one, so the verb gives it away.
      - type: mc
        prompt: '“The deer **ate** my tulips.” How many deer?'
        choices: [One, More than one, You can’t tell]
        fixedOrder: true
        answer: 2
        feedback:
          '0': Try the past tense with one dog, and then with two. “The dog ate.” “The dogs ate.” What do you notice?
          '1': Did the verb give that away this time? Compare “The dog ate” with “The dogs ate.”
        hints:
          - Compare “The dog ate” with “The dogs ate.” Does the verb change?
        solution:
          - In the past tense, this verb is the same for one or for many. So the clue has disappeared, and the honest answer is that you can’t tell.
      - type: mc
        prompt: '“The deer ate my tulips. Then **they** ran away.” How many deer?'
        choices: [One, More than one, You can’t tell]
        fixedOrder: true
        answer: 1
        feedback:
          '0': Would you use *they* for one deer? What would you say instead?
          '2': The verbs don’t help here, but there’s a new clue. Which word replaces *deer*?
        hints:
          - Which noun does *they* stand for? Is *they* singular or plural?
        solution:
          - A pronoun must agree in number with the noun that it replaces. *They* is plural, so there was more than one deer.
    wrapUp: Grammar can carry real information. Even when a noun doesn’t tell you how many, a present-tense verb or a pronoun can. Agreement isn’t only a rule. It is how readers work out what’s going on.

  - id: d2
    level: 3
    thinking: why
    covers: [S2.1, K2.1]
    type: multi
    prompt: |-
      Hazel is checking the class newspaper. She circled every sentence with two tenses. “They’re all mistakes,” she says. Which of these are **really** mistakes? Choose all that apply.
    choices:
      - Yesterday the goat ate my hat and runs away.
      - Last week we built a fort, and then it falls down.
      - Last night I ate six tacos, and today I feel awful.
      - I lost a skate yesterday, so I will borrow one tomorrow.
    answer: [0, 1]
    feedback:
      '2': When did the eating happen? When is the feeling awful happening? Do those times match?
      '3': Is the losing happening at the same time as the borrowing?
    hints:
      - In each sentence, ask when each action really happens.
      - Is the writer talking about one time, or about two different times?
    solution:
      - Tense tells the reader when. So keep your tense steady for as long as the time stays the same.
      - The goat ate and ran away yesterday, so *runs* is a mistake. The fort was built and fell down last week, so *falls* is a mistake.
      - The tacos were eaten last night, but the awful feeling is happening today. The verbs change because the **time** really changes. So Hazel’s rule goes too far.

  - id: d3
    level: 3
    thinking: design
    covers: [S2.6, K2.2]
    type: investigation
    prompt: |-
      Here are two sentences about the school mascot. They have the same words in a different order.

      > **A.** The mascot stood up slowly and danced.
      >
      > **B.** The mascot stood up and danced slowly.
    parts:
      - type: mc
        prompt: In which sentence does the mascot do a slow-motion dance?
        choices: [B, A]
        answer: 0
        feedback:
          '1': In A, *slowly* comes right after *stood up*. Which action is it describing?
        hints:
          - Which verb is *slowly* right beside in each sentence?
        solution:
          - In B, *slowly* follows *danced*, so the dance is slow. In A, the standing up is slow, and the dance could be any speed.
      - type: open
        prompt: Now make your own pair. Write a sentence with two verbs and an adverb. Then move the adverb so that it describes the other verb, and say how the picture changes.
        modelAnswer: |-
          **One:** The goalie skated quickly and waved.

          **Two:** The goalie skated and waved quickly.

          In the first, the skating is fast and the wave is normal. In the second, the goalie could be skating at any speed, but the wave is a quick little flick.
        rubric:
          - Both of my sentences have the same two verbs and the same adverb.
          - The adverb describes a different verb in each sentence.
          - I said how the picture changes.
    wrapUp: An adverb can move, and sometimes that doesn’t change the meaning. But when a sentence has two verbs, moving the adverb can change which action it describes.
