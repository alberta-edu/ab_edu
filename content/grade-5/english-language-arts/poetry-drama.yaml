id: poetry-drama
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI1
outcomes: [LANENG5-OI1-GQ1-LO1]
order: 2
title: Poetry and Drama
shortTitle: Poetry & drama
summary: >-
  Listen to a lyric poem, learn it by heart, write your own, then watch a scripted scene to see how
  words, bodies and voices bring a story and a place to life.

bigIdea: |-
  Poetry can be read, heard or spoken, and it can be enjoyed for its **beauty and emotion**. Drama
  tells a story through **dialogue and action**. Both can connect us to people and to the land.

lesson:
  - title: Listen to a poem
    blocks:
      - type: visual
        covers: [K5.1, K5.2, K5.4, S5.1, S5.4]
        component: poem-reader
        props:
          title: Coulee Morning
          ideas:
            - Climbing the coulee alone at sunrise
            - Missing the grandmother who walked here too
            - A bird’s song, and the sadness lifting
          stanzas:
            - - The morning sun is a slow gold door
              - that opens on the prairie floor.
              - I climb the coulee, all alone,
              - my boots loud on the frosty stone.
            - - My grandmother walked this trail with me.
              - She knew each bird and every tree.
              - Now I say their names out loud.
              - My voice is small beneath the cloud.
            - - Then a meadowlark begins to sing,
              - like a bell on a small brown wing,
              - and the ache in my chest is a fist letting go,
              - and I know what she knew. I know. I know.
        caption: Press Listen, or read it aloud. Each block of lines is a **stanza** that relates to one idea.
      - type: callout
        variant: tip
        covers: [U5.1, S5.1]
        title: What did you feel?
        body: You don’t have to “solve” a poem. Notice where it sounds beautiful, and what it makes you feel.

  - title: Lyric poems carry feelings
    blocks:
      - type: table
        covers: [K5.3, S5.3, U5.1]
        caption: '“Coulee Morning” is a **lyric poem**: it expresses personal feelings. Figurative language helps us feel them.'
        headers: [Stanza, The words, The feeling]
        rows:
          - ['1', '“The morning sun is a slow gold door”', 'Quiet wonder. The sun isn’t really a door, but the words let us see it opening.']
          - ['2', '“My voice is small beneath the cloud.”', 'Loneliness. A small voice under a big sky makes the speaker feel tiny.']
          - ['3', '“like a bell on a small brown wing”', 'Joy returning. The bird’s song rings out, clear as a bell.']
          - ['3', '“the ache in my chest is a fist letting go”', 'Relief. We can almost feel the sadness loosen.']

  - title: Learn it by heart
    blocks:
      - type: visual
        covers: [S5.2, K5.1]
        component: poem-reader
        props:
          title: Coulee Morning
          stanzas:
            - - The morning sun is a slow gold door
              - that opens on the prairie floor.
              - I climb the coulee, all alone,
              - my boots loud on the frosty stone.
            - - My grandmother walked this trail with me.
              - She knew each bird and every tree.
              - Now I say their names out loud.
              - My voice is small beneath the cloud.
            - - Then a meadowlark begins to sing,
              - like a bell on a small brown wing,
              - and the ache in my chest is a fist letting go,
              - and I know what she knew. I know. I know.
        caption: Press “Hide some words” after each try. Recite it, or make up a tune and sing it.
      - type: callout
        variant: tip
        covers: [S5.2, S5.4]
        title: One stanza at a time
        body: Each stanza holds one idea. Picture the idea, say that stanza, then add the next one.

  - title: Write a lyric poem
    blocks:
      - type: example
        covers: [S5.5, K5.3, K5.4]
        title: From a feeling to a stanza
        problem: Write a stanza about a feeling you know well.
        steps:
          - '**Pick a real feeling:** proud after finishing a long ski trail.'
          - '**Picture one moment:** the top of the last hill, with my legs shaking.'
          - '**Compare it to something:** my legs are wet noodles, and the wind is cheering.'
          - '**Group the lines around that one idea:** that group is your stanza.'
        answer: |-
          My legs are noodles, wet and weak.
          The wind is cheering on my cheek.

  - title: A scene on stage
    blocks:
      - type: visual
        covers: [K6.2, K6.3, S6.1]
        component: script-stage
        props:
          characters: [Anna, Tomas]
          lines:
            - { who: 0, say: 'Dust on the sill again. I wiped it an hour ago.', body: 'Drops her shoulders, and wipes the sill slowly.', voice: 'Slow and flat. She sounds tired.', pose: down }
            - { who: 1, say: 'Pa says rain is coming.', body: 'Stands tall and looks up at the sky.', voice: 'Bright, with a rising pitch. He sounds hopeful.', pose: up }
            - { who: 0, say: 'Pa said that in June. And in July.', body: 'Turns away from him.', voice: 'Quiet and sharp, with stress on **July**.', pose: away }
            - { who: 1, say: 'Then we plant again. There is still seed in the shed.', body: 'Leans toward her.', voice: 'Steady and firm, at an even pace.', pose: lean }
            - { who: 0, say: 'And if the wind takes that too?', body: 'Looks down at the cloth in her hands.', voice: 'Soft, rising at the end, because it is a real question.', pose: down }
            - { who: 1, say: 'Then we wipe the sill again. Together.', body: 'Holds out his hand for the cloth.', voice: 'Slow and warm, with a pause before **Together**.', pose: lean }
        caption: 'The plot moves through **dialogue and action**. Step through it and watch all three kinds of language.'

  - title: Reading a script
    blocks:
      - type: passage
        id: dust
        title: Dust on the Sill
        form: Script
        paragraphs:
          - 'A farmhouse kitchen on the southern Alberta prairie, 1934. It has not rained properly in years.'
          - 'ANNA: (wiping the windowsill) Dust on the sill again. I wiped it an hour ago.'
          - 'TOMAS: (looking out at the sky) Pa says rain is coming.'
          - 'ANNA: (turning away) Pa said that in June. And in July.'
          - 'TOMAS: Then we plant again. There is still seed in the shed.'
          - 'ANNA: And if the wind takes that too?'
          - 'TOMAS: (holding out his hand) Then we wipe the sill again. Together.'
          - 'Anna gives him the cloth. They both look out at the empty sky.'
        note: An original scene written for AB Edu. Words in parentheses are stage directions.
      - type: compare
        covers: [K6.1, S6.2, U6.1]
        columns:
          - title: What we learn about the time
            body: Drama can show people in other **times, places and situations**. We see the dust, and how long a family waited for rain.
          - title: Main characters and events
            body: '**Anna** has almost given up. **Tomas** keeps hoping. The main event is small: she hands him the cloth. It shows she will keep going, too.'

  - title: Poems, places and you
    blocks:
      - type: visual
        covers: [K7.1, S7.1]
        component: card-sort
        props:
          bins:
            - { id: living, label: Living things, icon: 🌾 }
            - { id: built, label: Human-made structures, icon: 🌉 }
            - { id: cycles, label: Patterns and cycles, icon: 🔄 }
            - { id: stories, label: Stories of place, icon: 🗺️ }
          cards:
            - { text: The meadowlark you listen for every spring, bin: living, why: 'A bird is a living thing that can tie you to a place.' }
            - { text: The poplar you climbed at your cousin’s farm, bin: living, why: 'Trees and plants can hold memories of a place.' }
            - { text: The old bridge your family crosses on the way to the lake, bin: built, why: 'People built it, and it is part of how you know the land.' }
            - { text: The grain elevator you can see from your window, bin: built, why: 'A human-made landmark can feel like part of home.' }
            - { text: "The first frost, when your family brings in the garden", bin: cycles, why: 'The seasons repeat every year.' }
            - { text: The way the sun sets further north as summer comes, bin: cycles, why: 'This pattern repeats every year.' }
            - { text: Your uncle’s story of how the coulee near his farm got its name, bin: stories, why: 'A story can teach you what a place means.' }
        caption: Land can matter to us in many ways. Sort these personal connections.
      - type: callout
        variant: tip
        covers: [U7.1, S7.1]
        title: What place matters to you?
        body: In “Coulee Morning,” a trail and a bird connect the speaker to a grandmother. **Meaning comes from experience.** Think of a place that means something to you, and why.

keyTerms:
  - term: Stanza
    covers: [K5.4]
    definition: A series of lines grouped together in a poem that relate to a similar idea.
  - term: Lyric poetry
    covers: [K5.3]
    definition: Poetry that expresses personal emotions or feelings.
  - term: Script
    covers: [K6.2]
    definition: The written form of a dramatic work, in which plot and characters are developed through dialogue and action.
  - term: Dialogue
    covers: [K6.2]
    definition: The words characters say to each other.
  - term: Non-verbal language
    covers: [K6.3]
    definition: Showing ideas without words, through things like body movement.
  - term: Paraverbal language
    covers: [K6.3]
    definition: How the voice delivers words, such as how fast, how loud, and in what tone.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K5.2, K5.4, S5.4]
    type: mc
    prompt: |-
      This poem should have **two stanzas**, but someone forgot the blank line.

      1. The bus pulls up. My stomach drops.
      2. New school, new kids, and twenty stops.
      3. I hug my bag and find a seat.
      4. I want to vanish. I watch my feet.
      5. “Hey, want a chip?” a girl leans in.
      6. I take the chip. I start to grin.

      Where should the second stanza begin?
    choices: [At line 3, At line 5, At line 6]
    fixedOrder: true
    answer: 1
    feedback:
      '0': Lines 3 and 4 have a new action, but how does the speaker feel? Is it a new idea, or the same one?
      '2': Is taking the chip a new idea, or part of the moment that starts just before it?
    hints:
      - What is the one idea of the first few lines? Where does that idea stop?
      - Look for the line where the speaker’s day begins to change.
    solution:
      - A stanza is a group of lines that relate to a similar idea, so look for where the idea changes.
      - Lines 1 to 4 are all about feeling nervous and alone. Lines 5 and 6 are about a new friend. So the new stanza begins **at line 5**.

  - id: w2
    level: 1
    thinking: apply
    covers: [K6.3]
    type: mc
    prompt: |-
      > MILO: (hiding the muddy boots behind his back, in a squeaky voice) What boots?

      Which part tells the actor about **paraverbal** language?
    choices:
      - in a squeaky voice
      - hiding the muddy boots behind his back
      - What boots?
    answer: 0
    feedback:
      '1': That is something Milo does with his body. That makes it non-verbal. Which part is about how he sounds?
      '2': Those are the words he says, so they are verbal. Which part is about how he says them?
    hints:
      - You can sort this line into words, body and voice. Which part is the voice?
    solution:
      - 'The line has all three kinds of language. The words “What boots?” are **verbal**. Hiding the boots is **non-verbal**.'
      - A squeaky voice is about how the words are delivered, so it is **paraverbal**. That squeak tells us he is guilty!

  - id: w3
    level: 1
    thinking: apply
    covers: [K5.3, S5.1]
    type: mc
    prompt: |-
      Two poems about snow:

      **Poem A**
      > Snow fell on Tuesday, ten centimetres deep.\
      > The plows came out at six, while the town was asleep.

      **Poem B**
      > The snow came down on Dad’s old truck\
      > and I was the only one awake.\
      > So quiet. So mine. I could have burst.

      Which one is a **lyric poem**, and how can you tell?
    choices:
      - Poem B, because the speaker shares a personal feeling about the snow.
      - Poem B, because it doesn’t rhyme, and a lyric poem isn’t allowed to rhyme.
      - Poem A, because it rhymes, and a lyric poem always has to have a rhyme.
      - Poem A, because it tells you exact facts about the snow on that Tuesday.
    answer: 0
    feedback:
      '1': “Coulee Morning” rhymes, and it is a lyric poem. So rhyme can’t be what decides. What does a lyric poem express?
      '2': Rhyme isn’t what makes a poem lyric. “Coulee Morning” rhymes, but look at what else it shares with us.
      '3': Facts are what Poem A gives us. What does it leave out that “Coulee Morning” is full of?
    hints:
      - After each poem, ask, “Do I know how the speaker feels?”
    solution:
      - Poem A reports what happened. It could be a weather report that rhymes.
      - Poem B lets us feel what the speaker feels, “So quiet. So mine.” Lyric poetry expresses **personal feelings**, so it is Poem B.

  - id: w4
    level: 1
    thinking: recall
    covers: [S5.2, S5.4]
    type: mc
    prompt: Eli has three days to learn “Coulee Morning” by heart so that he can recite it. Which plan makes the best use of the poem’s **stanzas**?
    choices:
      - Picture the idea of stanza 1 and say it, then add stanza 2 the same way.
      - Say the whole poem very fast, twenty times, until the lines all stick.
      - Learn the last word of each line, and then fill in all the other words.
      - Copy the poem out as one long block, so there are no gaps to remember.
    answer: 0
    feedback:
      '1': Speed can hide the words you’re missing. And what is he picturing while he rushes?
      '2': The rhymes might help a little, but what would connect one stanza to the next?
      '3': Those gaps are useful. Each one tells you that a new idea is about to begin.
    hints:
      - What does each stanza hold?
    solution:
      - Each stanza holds one idea. A picture of the idea helps you find the words.
      - The climb at sunrise, then missing the grandmother, then the bird. Once he has those three pictures, he always knows what comes next.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K5.3, S5.1, U5.1]
    type: mc
    prompt: |-
      > I climb the coulee, all alone,\
      > my boots loud on the frosty stone.

      Boots aren’t usually very loud. What does the word *loud* help you feel here?
    choices:
      - How silent and empty it is, with only the speaker there to make a sound
      - How big and heavy the speaker’s boots are, compared with other people’s
      - How angry the speaker feels about having to climb up there in the cold
      - How close the birds are, since the speaker is trying to frighten them off
    answer: 0
    feedback:
      '1': The poem doesn’t say anything about their size. Look at the two words at the end of the line before.
      '2': Is there an angry word anywhere in this stanza? Read it again, and listen to how quiet it is.
      '3': No birds have appeared yet, and the speaker loves their names. Think about what else you would hear up there.
    hints:
      - When have small sounds seemed loud to you? Where were you?
      - Look at the line before. What do the words “all alone” do to the sound of boots?
    solution:
      - Think of walking through your house when everyone is asleep. Every step sounds huge.
      - Boots are only *loud* when nothing else is making a sound. Next to “all alone,” that one word lets us feel how empty the morning is.
      - The poem never says “I felt lonely.” It lets us hear it.

  - id: b2
    level: 2
    thinking: whatif
    covers: [S5.3, U5.1]
    type: mc
    prompt: |-
      “Coulee Morning” begins:

      > The morning sun is a slow gold door\
      > that opens on the prairie floor.

      Suppose the poet had written *big* instead of *slow*. What would we lose?
    choices:
      - The feeling that morning comes gently, taking its time to open
      - The bright colour of the sun as it comes up over the prairie
      - The comparison that lets us picture the sun as a kind of door
      - The sound of the rhyme at the end of the line, with *floor*
    answer: 0
    feedback:
      '1': The word *gold* would still be in the line. So what would be missing?
      '2': The word *door* would still be in the line, so we would still have the comparison. What does *slow* add to it?
      '3': The last word of the line would still be *door*, so the rhyme stays. Only one word changes. What does it do?
    hints:
      - Say both versions. Which words are the same in both?
      - Picture a big door opening. Now picture a slow door opening. What is different?
    solution:
      - Only one word changes, so anything else in the line stays. That rules out the colour, the door and the rhyme.
      - A big door could swing open with a bang. A *slow* door opens a little at a time, the way a sunrise does.
      - That one word gives the stanza its feeling of quiet wonder.

  - id: b3
    level: 2
    thinking: notice
    covers: [K6.1, S6.1, S6.2]
    type: mc
    prompt: |-
      In “Dust on the Sill,” Tomas says:

      > Then we plant again. There is still seed in the shed.

      Look closely at one word, **still**. What does it tell the audience about this family in 1934?
    choices:
      - They have lost a lot already, and the seed they have left could run out.
      - They have plenty of seed, so the dry weather isn’t much of a problem.
      - They keep the seed in the shed, because the kitchen is full of dust.
      - They haven’t planted any seed this year, since Pa told them to wait.
    answer: 0
    feedback:
      '1': Do people say “there is still some” when they have plenty? Try it with the milk in your fridge.
      '2': The word *still* isn’t telling us why the seed is in the shed. What does it tell us about how much is left?
      '3': He says “plant **again**.” What does that tell you about this year?
    hints:
      - Say the line without the word, “There is seed in the shed.” Now say it with the word. What is different?
      - When would you say “There is still some milk left”?
    solution:
      - We say *still* about something that might be gone by now. So Tomas is saying, “We haven’t run out yet.”
      - Together with “plant again,” it tells us that crops have failed already.
      - One small word gives us a family’s whole situation, and that is how drama can show people in another time and place.

  - id: b4
    level: 2
    thinking: perspective
    covers: [K7.1, U7.1, S7.1]
    type: mc
    prompt: |-
      A hiker climbs the same coulee on the same morning as the speaker of “Coulee Morning,” and hears the same meadowlark. The hiker never knew the speaker’s grandmother.

      Will the song mean the same to the hiker as it does to the speaker?
    choices:
      - No, because its meaning comes partly from the speaker’s own memories there.
      - Yes, because a bird’s song is the same sound for everyone who hears it.
      - Yes, because a coulee has one meaning, and the poem has told us what it is.
      - No, because a hiker who is only visiting can’t enjoy a bird or a place at all.
    answer: 0
    feedback:
      '1': The sound is the same, that’s true. But why does this song loosen the ache in the speaker’s chest?
      '2': Think about a place you love. Would it mean exactly the same to someone who has never been there before?
      '3': The hiker might love that song. Might the reasons be different, though?
    hints:
      - Why does the song matter so much to the speaker? What happened on this trail before?
      - Do the hiker and the speaker bring the same memories up the hill?
    solution:
      - The bird is a living thing that anyone can hear. Its meaning for the speaker comes from walking this trail with a grandmother.
      - The hiker may enjoy the song a lot, but for different reasons. **Meaning comes from personal experience.**

  - id: b5
    level: 2
    thinking: evidence
    covers: [K6.2, S6.1, S6.2]
    type: evidence
    prompt: No one in “Dust on the Sill” says it, but Anna has stopped believing that the rain will come. Tap the line that best shows it.
    passage: dust
    paragraphs: [2, 3, 4, 6, 8]
    answer: [p4s1, p4s2]
    feedback:
      p2s1: Anna is tired of the dust here. Does she say anything about the rain?
      p2s2: This shows how fast the dust comes back. Does it say anything about the rain?
      p3s1: This is Tomas, and he sounds hopeful. Whose belief are you looking for?
      p6s1: Anna is worried here, but about the seed. Which line is about the rain itself?
      p8s1: This action shows that she will keep going. Does it show what she thinks about the rain?
      p8s2: The sky is empty, and that’s what they both see. Does it show what Anna believes?
    hints:
      - Which line is Anna’s answer to “Pa says rain is coming”?
      - Why would she name those months?
    solution:
      - 'Either part works: “Pa said that in June.” or “And in July.”'
      - Together they answer “Pa says rain is coming.” Pa has said it before, more than once, and the rain never came. So she has stopped believing it, and she never has to say so.
      - In a script, characters grow through what they say and do. Two short lines can tell us a whole summer.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: decide
    covers: [K5.3, S5.1, S5.3, U5.1]
    type: open
    prompt: |-
      “Coulee Morning” ends:

      > and I know what she knew. I know. I know.

      The poem never says *what* the speaker knows.

      - **Rae** thinks the speaker has finally learned the names of the birds.
      - **Jo** thinks the speaker now understands why the grandmother loved this place.

      Whose reading has stronger evidence? Use lines from **at least two stanzas**. Then say what the other reader has in her favour.
    modelAnswer: |-
      Jo’s reading is stronger. In stanza 2, the speaker says, “Now I say their names out loud,” so the speaker already knows the names before the bird sings. That doesn’t fit Rae’s idea of “finally learning” them. In stanza 3, “I know” comes right after “the ache in my chest is a fist letting go.” So the knowing is about a feeling, and the song makes the speaker feel what the grandmother may have felt here.

      Rae does have a point. Stanza 2 says “She knew each bird and every tree,” which uses the same word, *knew*, and the speaker does name the meadowlark.
    rubric:
      - I chose one reading and said so clearly.
      - I used lines from at least two stanzas, and I quoted them or named the stanzas.
      - I explained how each line supports my reading.
      - I said what the other reader has in her favour.
    hints:
      - Find the word *knew* earlier in the poem. What did the grandmother know there?
      - Does the speaker know the names of the birds before the meadowlark sings? Look for evidence in stanza 2.
      - What happens in the line right before “I know”?

  - id: d2
    level: 3
    thinking: breakdown
    covers: [K6.2, K6.3, S6.1, S6.2, U6.1]
    type: investigation
    prompt: |-
      You are directing “Dust on the Sill.” The rule is that you can’t change one word of the dialogue, but your actors can change everything else.

      How much of the story can you change without touching the words?
    parts:
      - type: mc
        prompt: The actor playing Tomas says “Then we wipe the sill again. Together.” with a shrug, in a flat voice, looking at the floor. What does the audience now think of Tomas?
        choices:
          - He has lost hope too, and he is only saying what he thinks he should.
          - He is still full of hope, since the words themselves haven’t changed.
          - He is furious with Anna, and he wants her to get out of the kitchen.
        answer: 0
        feedback:
          '1': The words are the same, that’s true. But would you believe a friend who said “Great job” in a flat voice, looking at the floor?
          '2': A shrug and a flat voice are not angry. Do they sound like someone with a lot of energy left?
        hints:
          - Which would an audience believe, the words or the way they are delivered?
        solution:
          - The shrug is **non-verbal** and the flat voice is **paraverbal**. Both of them say the opposite of what “Together” means.
          - So the same words now make a different character.
      - type: mc
        prompt: 'The scene ends with an action that has no words: “Anna gives him the cloth.” To save time, someone cuts that action. What does the audience no longer find out?'
        choices:
          - Whether Anna has chosen to keep going with Tomas
          - Whether the rain Pa talked about is going to come
          - Whether the story is set in a dry time long ago
          - Whether the windowsill has more dust on it again
        answer: 0
        feedback:
          '1': The audience doesn’t find that out with the action, either. The sky stays empty at the end.
          '2': Paragraph 1 and the talk about dust and rain already tell us that.
          '3': Anna’s very first line tells us that.
        hints:
          - What did Anna ask just before Tomas held out his hand? Did she answer in words?
        solution:
          - Tomas says “Together” and holds out his hand. Anna never answers him in words.
          - Handing over the cloth **is** her answer. Without it, we never learn what she decided, so the plot has no ending.
      - type: open
        prompt: |-
          Now give the scene a different ending. Replace “Anna gives him the cloth” with a **new stage direction**. It has to show, with no spoken words, that Anna has given up.

          Then explain how the audience could tell.
        modelAnswer: |-
          Anna lets the cloth fall onto the sill and walks out of the kitchen. Tomas stands alone, looking at the empty sky.

          The audience could tell because she has been wiping that sill all scene, so dropping the cloth means she has stopped trying. Walking out is also her answer to “Together.”
        rubric:
          - My stage direction has only actions and no spoken words.
          - It shows that Anna has given up.
          - I used something from the scene, such as the cloth, the sill or the sky.
          - I explained how the audience could tell.
        hints:
          - What is Anna holding? What has she been doing with it the whole time?
          - What did Tomas just offer her? What would saying no look like, with no words?
    wrapUp: In a script, plot and characters grow through dialogue **and** action. You kept every word, and you still changed a character and the ending of the story.

  - id: d3
    level: 3
    thinking: design
    covers: [S5.5, K5.3, K5.4, K7.1, S7.1]
    type: open
    prompt: |-
      Pick a place that means something to you, such as a rink, a porch, a riverbank or a top bunk.

      Write **one stanza** of a lyric poem about it, 2 to 4 lines long, with at least one comparison.

      The catch is that you can’t name your feeling. Don’t use words like *happy*, *sad*, *proud* or *scared*. Make your reader feel it.

      Then write one more sentence, saying what happened there that made this place matter to you.
    modelAnswer: |-
      The rink at night is a dark, cold plate.
      My blades write circles, slow and late.
      Nobody’s calling me in. Not yet.
      The whole sky holds its breath.

      It matters to me because my sister taught me to skate there, the winter before she moved away.
    rubric:
      - My lines relate to one idea, so they form a stanza.
      - I used at least one comparison.
      - A reader can tell how I feel, and I didn’t use a feeling word to say it.
      - My extra sentence names something that happened to me in this place.
    hints:
      - Close your eyes and stand in that place. What is one small thing you can hear, see or feel on your skin?
      - What is that thing like? Try “The ___ is a ___.”
