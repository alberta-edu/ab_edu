id: spelling-punctuation
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI9
outcomes: [LANENG5-OI9-GQ1-LO1]
order: 12
title: Spelling Patterns, Capitals and Punctuation
shortTitle: Spelling & punctuation
summary: >-
  Watch words join and change their spelling, use word parts to spell long words, fix capital letters, and
  try parentheses and abbreviations to get the effect you want.

bigIdea: |-
  - English spelling has **patterns**. Words are built from meaningful parts, and those parts help you spell.
  - **Capitals and punctuation** do real work too. They show what’s important, and tell readers how your writing should sound.

lesson:
  - title: Watch the spelling change
    blocks:
      - type: visual
        covers: [K3.2, S3.1, S3.2, S3.3]
        component: spell-builder
        caption: Pick a pattern. Predict the spelling, then press “Join them.”

  - title: Prefixes stay whole
    blocks:
      - type: table
        covers: [S3.3, K3.2]
        caption: A prefix doesn’t change. Just join it to the base, even if that puts two letters together.
        headers: [Prefix, Base, Word]
        rows:
          - ['trans-', 'port', '**transport**']
          - ['sub-', 'marine', '**submarine**']
          - ['ex-', 'hale', '**exhale**']
          - ['com-', 'mit', '**commit** (two m’s: one from the prefix, one from the base)']
      - type: table
        covers: [S3.1, U3.1]
        caption: Suffix families help you choose between a and e.
        headers: [This word ends in…, So this word ends in…]
        rows:
          - ['assist**ant**', 'assist**ance**']
          - ['import**ant**', 'import**ance**']
          - ['differ**ent**', 'differ**ence**']
          - ['resid**ent**', 'resid**ence**']

  - title: Patterns make writing faster
    blocks:
      - type: example
        covers: [K3.1, S3.2, K3.2]
        title: Spell a word you’ve never written
        problem: How would you spell the word that means “full of mystery”?
        steps:
          - '**Find the parts:** mystery + ous.'
          - '**Check the base:** it ends in a consonant and *y*.'
          - '**Use the pattern:** the *y* changes to *i*.'
          - '**Join them:** mysteri + ous.'
        answer: '**mysterious**'
      - type: callout
        variant: tip
        covers: [K3.1, U3.1]
        title: Why bother?
        body: When you can spell patterns quickly and correctly, you have more attention left for your ideas. Your writing flows better.

  - title: Capitals show what’s important
    blocks:
      - type: visual
        covers: [K1.1, S1.1]
        component: punct-lab
        props:
          mode: capitals
          sentence: Last July, Mayor Singh and Dr. Ortiz visited Banff National Park in Alberta.
        caption: Tap the words that need capitals. Common words in the middle of the sentence stay lowercase.

  - title: Parentheses and abbreviations
    blocks:
      - type: compare
        covers: [K1.3, S1.2]
        columns:
          - title: ( ) Parentheses
            body: |-
              Show **additional, separate or less important** words or numbers.

              > The rink (the one by the school) opens today.

              > Lethbridge (population about 100,000) is windy.
          - title: Abbreviations
            body: |-
              Shorter forms make communication **easier and faster**.

              > Dr. Ortiz lives on Centre St. It’s 3 km away.
      - type: callout
        variant: mistake
        covers: [K1.2, U1.1]
        title: Will your reader know it?
        body: Save abbreviations for ones that your reader will understand. “See you at the ASAP mtg” is confusing if your reader doesn’t know what you mean.

  - title: Make punctuation work for you
    blocks:
      - type: visual
        covers: [S1.3, U1.1, S1.2]
        component: punct-lab
        props:
          mode: effect
          versions:
            - { text: 'We won.', effect: 'A plain period sounds calm and maybe a little flat.' }
            - { text: 'We won!', effect: 'An exclamation mark shows excitement.' }
            - { text: 'WE WON!!!', effect: 'All capitals look like shouting. Use them rarely, for a big effect.' }
            - { text: 'We won (somehow).', effect: 'The parentheses add a quiet, funny side comment.' }
        caption: Same message, different effects. Which fits a text to your best friend? Which fits a school report?

keyTerms:
  - term: Morpheme
    covers: [K3.2]
    definition: The smallest part of a word that has meaning, such as a base, a prefix or a suffix.
  - term: Spelling pattern
    covers: [K3.1, S3.1]
    definition: A regular way that letters behave in words, which you can use to spell other words.
  - term: Parentheses
    covers: [K1.3]
    definition: Marks ( ) that show additional, separate or less important words or numbers.
  - term: Abbreviation
    covers: [K1.2]
    definition: A shortened form of a word or phrase, such as Dr. for Doctor.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [S3.3, K3.2]
    type: text
    prompt: |-
      Our cat climbed the curtains, the fridge and then the neighbour’s roof. She is very ___.

      Join the parts. **adventure** + **ous** = ?
    accept: [adventurous]
    hints:
      - What letter does the suffix start with? What happens to a silent e?
    solution:
      - The suffix *-ous* starts with a vowel, so the silent e drops. That gives **adventurous**.

  - id: w2
    level: 1
    thinking: apply
    covers: [S3.3, K3.2]
    type: text
    prompt: |-
      Gran was ___ when the dog ate her slippers.

      Join the parts. **fury** + **ous** = ?
    accept: [furious]
    hints:
      - The base ends in a consonant and y. What does the y turn into?
    solution:
      - The base ends in *r* and *y*, so the y changes to i. That gives **furious**.

  - id: w3
    level: 1
    thinking: apply
    covers: [S3.3, K3.2]
    type: text
    prompt: Prefixes stay whole. Join the parts. **com** + **mand** = ?
    accept: [command]
    hints:
      - Does a prefix lose a letter when it joins a base? Write out both parts.
    solution:
      - Keep every letter of the prefix and every letter of the base. That’s why **command** has two m’s, with one from each part.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [S3.3, S3.1, K3.2]
    type: mc
    prompt: |-
      Ren’s story has these four spelling mistakes.

      > hopeing, nerveous, furyous, gloryous

      What one habit explains all of them?
    choices:
      - Ren glues on the suffix without changing the end of the base.
      - Ren spells each word just the way it sounds out loud.
      - Ren forgets that a prefix stays whole when it joins a base.
      - Ren always takes away a letter before adding a suffix.
    answer: 0
    feedback:
      '1': If Ren spelled by sound, would *hopeing* have that silent e? Look at where the letters came from.
      '2': Are these parts at the start of the word or at the end?
      '3': Try it. Take the suffix off each word. Has any letter been taken away from the base?
    hints:
      - Pull each word apart. *hope* + *ing*. What are the other three?
      - Compare each base with how it looks in Ren’s word. Did it change?
    solution:
      - Pull them apart, and you find hope + ing, nerve + ous, fury + ous and glory + ous. Each base is still whole.
      - So Ren is gluing the parts together without checking the end of the base. The correct spellings are **hoping, nervous, furious** and **glorious**.
      - That is good news for Ren. It’s not four problems, but one habit to fix. Look at the end of the base before you join.

  - id: b3
    level: 2
    thinking: notice
    covers: [K1.1, S1.1]
    type: text
    caseSensitive: true
    prompt: |-
      Type this sentence with the right capital letters. One *turkey* is a bird, and the other is a country.

      > we ate turkey in turkey last march.
    accept: [We ate turkey in Turkey last March]
    hints:
      - Which words name one particular place or time?
      - Would you ever write *march* with a small letter? When would it be a capital?
    solution:
      - '*We* starts the sentence. **Turkey** the country is a name, so it takes a capital, but the bird doesn’t.'
      - '**March** the month is a name too. (A band would *march* with a small letter.)'
      - “We ate turkey in Turkey last March.” Capitals tell the reader which one you mean.

  - id: b4
    level: 2
    thinking: notice
    covers: [K1.2, S1.1]
    type: mc
    prompt: |-
      Yuna’s invitation says:

      > Party at Dr. Patel’s, 14 Patel Dr., St. Albert. Park on Main St.

      Here, *Dr.* can mean *Doctor* or *Drive*, and *St.* can mean *Saint* or *Street*. How can a reader tell which is which?
    choices:
      - Before a name, they are *Doctor* and *Saint*. After a name, they are *Drive* and *Street*.
      - Each one has a single meaning, so *Dr.* is a *Doctor* and *St.* is a *Street* every time.
      - The one with a capital letter is a title, and the one with a small letter is a road.
      - A reader can’t tell, so abbreviations should never be used on an invitation like this.
    answer: 0
    feedback:
      '1': Could Yuna’s party be at “14 Patel Doctor”? Try the words in their places.
      '2': Look again. All four of these abbreviations start with a capital.
      '3': Try reading it aloud. Did you actually get stuck? What told you which was which?
    hints:
      - Read it aloud, saying the full words. Which meaning did you use each time?
      - Where does each abbreviation sit, compared with the name beside it?
    solution:
      - Abbreviations make writing faster, and a reader uses the words around them to work out what they mean.
      - '*Dr. Patel* is a person, and *Patel Dr.* is a road. *St. Albert* is a saint’s name, and *Main St.* is a road. The spot beside the name gives it away.'

  - id: b5
    level: 2
    thinking: decide
    covers: [S1.3, K1.1, K1.3, U1.1]
    type: mc
    prompt: The caretaker has just painted the bench by the rink. Which sign would do the best job of keeping people off it?
    choices:
      - WET PAINT!
      - wet paint
      - Wet paint (probably)
      - (Wet paint)
    answer: 0
    feedback:
      '1': It’s accurate, but it’s very quiet. Would you stop for it if you were rushing to the rink?
      '2': That little *(probably)* gives people a reason to touch it and find out. Does the sign sound sure?
      '3': Parentheses hold what is extra or less important. Is this less important?
    hints:
      - What does each sign make you think about the paint?
      - Which marks say “this matters,” and which say “this is just a side note”?
    solution:
      - The sign has one job, and that’s to grab attention right away.
      - Capitals show what’s important, and they look like shouting. Here, that’s what you want. So is the exclamation mark.
      - In a school report, those same capitals would be too loud. The effect has to suit the job.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: pattern
    covers: [S3.1, S3.2, K3.2, U3.1]
    type: investigation
    prompt: |-
      A silent e drops before a suffix that starts with a vowel.

      > fame + ous = famous
      >
      > nerve + ous = nervous

      But look at this one.

      > courage + ous = courageous

      The e stayed! Is the rule broken, or is the e doing a job?
    parts:
      - type: mc
        prompt: In *courage*, the g sounds like a j. Without the e, the new word would be *couragous*. Think of the g in *got* and *gum*, then read it aloud. What would happen?
        choices:
          - The g would sound hard, as in *got*, so it wouldn’t sound like *courage*.
          - The g would go silent, as in *sign*, so you wouldn’t hear it at all.
          - The g would still sound like a j, so the e isn’t needed there at all.
        answer: 0
        feedback:
          '1': Read *cou-ra-gous* slowly. Can you hear a g in it?
          '2': Look at the letters after the g in *gum* and *got*. What letter comes after the g in *couragous*?
        hints:
          - Which letter comes right after the g in *couragous*? Is it like *got* or like *gum*?
        solution:
          - A g followed by *o* is hard, as in *got*. So *couragous* would have the wrong sound.
          - The e is keeping the g sounding like a j. It stays because it has a job to do.
      - type: text
        prompt: Test your idea on a new word. **outrage** + **ous** = ?
        accept: [outrageous]
        hints:
          - In *outrage*, does the g sound like a j? What would keep it that way?
        solution:
          - The g in *outrage* sounds like a j too, so the e stays. **outrageous**
      - type: mc
        prompt: Now use your idea to decide about two more words. What are **change** + **able** and **change** + **ing**?
        choices:
          - changable and changeing
          - changeable and changeing
          - changable and changing
          - changeable and changing
        fixedOrder: true
        answer: 3
        feedback:
          '0': Check each word separately. Which of them needs the e to keep the g’s sound, and which doesn’t?
          '1': Read *changing* aloud without the e. Does the g still sound like a j? Then does the e have a job?
          '2': Read *changable* aloud. The g comes before an *a*. How does it sound?
        hints:
          - Try each word aloud with no e. Does the g still sound like a j?
          - Which letter comes right after the g in each one?
        solution:
          - Without the e, *changable* would have a hard g, as in *gas*. So the e stays. **changeable**
          - In *changing*, the g still sounds like a j with the *i* right after it. The e has no job, so it drops. **changing**
    wrapUp: A spelling pattern usually has a reason. The silent e drops when it has no job to do, and it stays when it’s keeping a sound right. If you know why, you can work out words that you’ve never seen.

  - id: d2
    level: 3
    thinking: why
    covers: [K3.2, S3.2, S3.1, U3.1]
    type: investigation
    prompt: |-
      A silly new club wants every word spelled just the way it sounds. Its first two changes are *sign* to *sine* and *muscle* to *mussel*. “All those silent letters are useless,” says the club.

      Is that true?
    parts:
      - type: text
        prompt: Say the word *muscular*. Which letter can you hear in it that is silent in *muscle*? Type the letter.
        accept: [c]
        hints:
          - Say *mus-cu-lar* slowly. Then look at how *muscle* is spelled.
        solution:
          - You can hear the **c** in *muscular*. The silent c in *muscle* shows that the two words are in one family.
      - type: mc
        prompt: What would readers lose if the club got its way?
        choices:
          - They couldn’t see that *sign*, *signal* and *signature* all belong to one family.
          - They could no longer read words aloud, since sounds wouldn’t match the letters.
          - They’d lose nothing at all, because a word’s spelling has no link to its meaning.
          - They’d have to learn a bigger alphabet, since each sound would need a new letter.
        answer: 0
        feedback:
          '1': The club’s spellings do match the sounds. What would they hide instead?
          '2': You just used a word’s meaning to spell *soften*. Does that fit this idea?
          '3': The club isn’t adding any letters. Compare *sine* with *signal*. What has gone missing?
        hints:
          - Write *sine* beside *signal*. Do they still look related?
        solution:
          - The spelling *sign* keeps the g, and you can hear that g in *signal* and *signature*. So the spelling shows you the meaning family.
          - If you change it to *sine*, the family link disappears. And there’s a bonus problem. A *mussel* is a shellfish, so “flex your mussel” would be quite a sight!
    wrapUp: Silent letters aren’t always useless. Spelling shows meaning as well as sound, so looking for a word’s family can help you spell words that you can’t sound out.
