id: figurative-language
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI3
outcomes: [LANENG5-OI3-GQ1-LO1]
order: 5
title: Similes, Metaphors and Analogies
shortTitle: Figurative language
summary: >-
  See what figurative language would look like if you read it literally, tell similes from metaphors and
  analogies, notice how context changes meaning, and write your own.

bigIdea: |-
  **Figurative language** doesn’t mean exactly what the words say. It compares things in surprising ways, so
  that readers can see and feel an idea. Figure out the comparison, and you can figure out the meaning.

lesson:
  - title: Literally or figuratively?
    blocks:
      - type: visual
        covers: [K3.1, S3.5, S3.6]
        component: figure-lens
        props:
          items:
            - phrase: The classroom was a zoo.
              kind: Metaphor
              picture: 🦁🐒🦓📚
              literally: Real lions and monkeys are sitting at the desks!
              means: The class was loud and wild.
              because: A class and a zoo aren’t alike, but both can be noisy and full of motion.
            - phrase: Leo ran like the wind.
              kind: Simile
              picture: 🌬️🏃💨
              literally: Leo turned into moving air and blew down the street!
              means: Leo ran very fast.
              because: Wind and a boy aren’t alike, but both can rush past you.
            - phrase: Snow was a white blanket on the field.
              kind: Metaphor
              picture: 🛏️🌾❄️
              literally: Someone tucked in the field with a real blanket!
              means: Snow covered the field softly and evenly.
              because: Snow and a blanket aren’t alike, but both lie smoothly over what’s underneath.
            - phrase: Starting at a new school is like your first day on skates.
              kind: Analogy
              picture: ⛸️🏫🤕
              literally: You must wear skates in the hallway on your first day!
              means: Both feel wobbly at first, and both get easier with practice.
              because: An analogy explains something new by showing how it works like something you know.
        caption: Press each lens. The funny picture shows why the words can’t be literal.

  - title: Three ways to compare
    blocks:
      - type: compare
        covers: [K3.1, K3.2, S3.5]
        columns:
          - title: Simile
            body: |-
              Compares using **like** or **as**.

              > The lake was **as** flat **as** a plate.
          - title: Metaphor
            body: |-
              Compares two things that are **not alike** but have something in common, **without** *like* or *as*.

              > The lake **was** a plate of glass.
          - title: Analogy
            body: |-
              Shows how one **relationship** is like another.

              > A captain is to a ship **as** a pilot is to a plane.
      - type: callout
        variant: mistake
        covers: [K3.2, S3.5]
        title: Not every “like” is a simile
        body: '“I like skating” doesn’t compare anything. A simile needs two different things being compared: “She skates **like** a swallow in flight.”'

  - title: Find them in a story
    blocks:
      - type: passage
        id: storm
        title: Storm over the Foothills
        form: Descriptive writing
        paragraphs:
          - The storm was a grey giant, striding over the foothills toward our farm. Dad pointed at the sky. We ran for the barn.
          - My little brother held my sleeve as tightly as a burr on a sock. Then the thunder rolled, like empty barrels down a wooden ramp, and the first rain came down in silver needles.
          - We watched from the door of the barn. Inside, the horses stamped and snorted. Dad checked the latch twice and said nothing.
          - As fast as it had come, the giant was gone. The whole valley glittered like a jar of new coins, and my brother finally let go of my sleeve.
        note: An original description written for AB Edu.
      - type: table
        covers: [S3.6, S3.5]
        caption: What do these words help you see?
        headers: [The words, Kind, What it means]
        rows:
          - ['“The storm was a grey giant”', 'Metaphor', 'The storm was huge, and it moved in like something alive and powerful.']
          - ['“as tightly as a burr on a sock”', 'Simile', 'He held on very tight and would not let go.']
          - ['“like a jar of new coins”', 'Simile', 'Wet things shone and sparkled in the sun.']

  - title: Context changes the meaning
    blocks:
      - type: table
        covers: [S3.4]
        caption: One word, many meanings. The words around it tell you which one.
        headers: [Sentence, What **cold** means here]
        rows:
          - ['It’s a **cold** morning, so wear your mitts.', 'A low temperature (literal)']
          - ['I caught a **cold** at camp.', 'An illness (literal)']
          - ['She gave me a **cold** stare.', 'Unfriendly (figurative)']
      - type: callout
        variant: tip
        covers: [S3.4, S3.6]
        title: Read around the word
        body: When a phrase doesn’t make sense word for word, ask what the sentence around it is about. If someone **“breaks the ice”** at a party, there is no ice. They are helping people start talking.

  - title: Write your own
    blocks:
      - type: example
        covers: [S3.7, S3.1, U3.1]
        title: Build a comparison, one step at a time
        problem: You want to describe a very quiet gym after everyone has left.
        steps:
          - '**Name the feeling:** so empty and still that it feels strange.'
          - '**Think of something else that feels that way:** a whale’s belly, or a giant holding its breath.'
          - '**Choose the comparison that fits best:** a giant holding its breath.'
          - '**Write it. Metaphor:** The gym was a giant holding its breath. **Simile:** The gym was as still as a giant holding its breath.'
      - type: callout
        variant: tip
        covers: [S3.7]
        title: Say it, too
        body: Figurative language isn’t only for writing. Try it in a speech or a story you tell out loud. Save it for the moments that matter.

keyTerms:
  - term: Figurative language
    covers: [K3.1]
    definition: Language with non-literal meanings, such as metaphors.
  - term: Literal
    covers: [K3.1, S3.6]
    definition: Meaning exactly what the words say.
  - term: Metaphor
    covers: [K3.2]
    definition: A comparison of two things that are not alike but have something in common, without using comparison words such as like or as.
  - term: Simile
    covers: [S3.5]
    definition: A comparison of two different things using like or as.
  - term: Analogy
    covers: [S3.5]
    definition: A comparison that shows how one relationship is like another, often to explain something new.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [S3.5]
    type: mc
    prompt: '“The puck flew **like** a bullet.” What kind of comparison is this?'
    choices: [Simile, Metaphor, Analogy]
    fixedOrder: true
    answer: 0
    feedback:
      '1': A metaphor compares **without** *like* or *as*. Check the bold word.
      '2': An analogy shows how one relationship is like another. This just compares a puck and a bullet.
    hints:
      - Which comparison uses *like* or *as*?
    solution:
      - It compares using **like**, so it is a **simile**.

  - id: w2
    level: 1
    covers: [K3.2, S3.5]
    type: mc
    prompt: Which sentence is a **metaphor**?
    choices:
      - My backpack is a bag of bricks today.
      - My backpack is as heavy as bricks.
      - My backpack has a brick in it.
      - I carried my backpack home.
    answer: 0
    feedback:
      '1': This uses *as*, so it is a simile.
      '2': This could be literally true, so it doesn’t compare two things.
      '3': This is a plain, literal statement.
    hints:
      - A metaphor says one thing **is** another, without *like* or *as*.
    solution:
      - The backpack isn’t really bricks. It is **compared** to them without *like* or *as*.

  - id: w3
    level: 1
    covers: [K3.1, S3.6]
    type: mc
    prompt: '“Her words **cut** me.” What does this figurative phrase mean?'
    choices:
      - What she said hurt my feelings.
      - She used scissors on me.
      - She wrote the words on paper and cut them out.
      - She spoke very quietly.
    answer: 0
    feedback:
      '1': That is the literal reading. Words can’t really cut skin.
      '2': That is still reading it literally. How do you feel when words “cut” you?
      '3': The phrase isn’t about how loud she was. It’s about how the words felt.
    hints:
      - What does a cut feel like? How could words make you feel that way?
    solution:
      - Words can’t really cut. The phrase means that they **hurt my feelings**.

  - id: w4
    level: 1
    covers: [S3.5, K3.2]
    type: mc
    prompt: What do **similes and metaphors** have in common?
    choices:
      - Both compare things that are different in order to show an idea.
      - Both must use the word *like*.
      - Both can only be used in poems.
      - Both mean exactly what the words say.
    answer: 0
    feedback:
      '1': Only similes use *like* or *as*. Metaphors do not.
      '2': You can use them in stories, speeches and everyday talk.
      '3': That would be literal language, not figurative language.
    hints:
      - Think about what both are doing with two different things.
    solution:
      - Both **compare different things**, which helps readers see an idea in a new way.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [S3.5, S3.6]
    type: evidence
    prompt: Tap the sentence in paragraph 1 that uses a **metaphor**.
    passage: storm
    paragraphs: [1]
    answer: [p1s1]
    feedback:
      p1s2: Dad really did point at the sky. This is literal.
      p1s3: They really did run. This is literal.
    hints:
      - Which sentence says that one thing **is** another?
    solution:
      - '“The storm was a grey giant…” The storm is compared to a giant, without *like* or *as*.'

  - id: b2
    level: 2
    covers: [S3.5]
    type: evidence
    prompt: Tap a sentence in “Storm over the Foothills” that uses a **simile**.
    passage: storm
    paragraphs: [2, 3, 4]
    answer: [p2s1, p2s2, p4s2]
    feedback:
      p3s1: They really did watch from the door. This is literal.
      p3s2: Horses really do stamp and snort. This is literal.
      p3s3: Dad really did check the latch. This is literal.
      p4s1: This does use *as*, but it compares two speeds. It talks about how fast the storm left. The giant here is the metaphor from before.
    hints:
      - Look for *like* or *as*, comparing two different things.
    solution:
      - '“as tightly as a burr on a sock,” “like empty barrels down a wooden ramp” and “like a jar of new coins” are all similes.'

  - id: b3
    level: 2
    covers: [S3.4]
    type: mc
    prompt: '“The new goalie is really **cool** under pressure.” In this context, what does *cool* mean?'
    choices: [Calm, A little cold, Popular, Wearing cold clothing]
    answer: 0
    feedback:
      '1': That is the temperature meaning. It wouldn’t make sense with “under pressure.”
      '2': That can be a meaning of *cool*, but the words “under pressure” point to something else.
      '3': Nothing in the sentence is about clothes.
    hints:
      - How would a good goalie act when the game gets tense?
    solution:
      - The words “under pressure” tell you that *cool* here means **calm**.

  - id: b4
    level: 2
    covers: [S3.5]
    type: mc
    prompt: Finish the **analogy**. *Bird is to nest as bee is to ___.*
    choices: [hive, flower, honey, wing]
    answer: 0
    feedback:
      '1': Bees visit flowers, but a nest is a home. What is a bee’s home?
      '2': Bees make honey, but a nest is where a bird lives.
      '3': A wing is a body part. A nest is a home.
    hints:
      - What is the relationship between a bird and a nest?
    solution:
      - A nest is a bird’s **home**. A **hive** is a bee’s home.

  - id: b5
    level: 2
    covers: [S3.6]
    type: mc
    prompt: '“The thunder rolled, like empty barrels down a wooden ramp.” What does this help you **hear**?'
    choices:
      - A deep, rumbling, tumbling sound
      - A high, sweet sound
      - Complete silence
      - A short, sharp click
    answer: 0
    feedback:
      '1': Big empty barrels don’t make high, sweet sounds.
      '2': Barrels rolling down a ramp would be loud.
      '3': The barrels keep rolling, so the sound keeps going.
    hints:
      - Imagine that sound. What would it be like?
    solution:
      - Empty barrels on wood make a **deep, tumbling rumble**, just like thunder.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [S3.5, K3.2]
    type: mc
    prompt: 'Which sentence is **not** figurative language?'
    choices:
      - I like my grandmother’s house.
      - My grandmother’s house is a warm hug.
      - My grandmother’s house is like a warm hug.
      - Coming to Grandmother’s house is like coming back to harbour after a storm.
    answer: 0
    feedback:
      '1': The house isn’t really a hug. That is a metaphor.
      '2': This compares a house and a hug using *like*, so it is a simile.
      '3': This compares two relationships, so it is an analogy.
    hints:
      - One sentence uses *like*, but doesn’t compare two things.
    solution:
      - '“I like” means “I enjoy.” No two things are compared, so this sentence is **literal**.'

  - id: d2
    level: 3
    covers: [S3.6, S3.4]
    type: mc
    prompt: 'At the end of the story, “the giant was gone.” What does **the giant** refer to, and how do you know?'
    choices:
      - The storm. Paragraph 1 compared the storm to a grey giant.
      - A real giant that walked away.
      - Dad, who is the tallest person in the story.
      - The barn, which is the biggest building.
    answer: 0
    feedback:
      '1': Nothing suggests a real giant. Go back to how the writer used the word in paragraph 1.
      '2': Dad is in the barn with the children, and he doesn’t leave.
      '3': The barn doesn’t go anywhere. What has gone away by the end?
    hints:
      - Look back at the first sentence of the story.
    solution:
      - The metaphor from paragraph 1 returns. The **context** tells you that the giant is the storm.

  - id: d3
    level: 3
    covers: [S3.7, S3.1]
    type: open
    prompt: |-
      Describe a time you felt nervous, using **one simile and one metaphor** of your own. Explain what each one
      helps your reader feel.
    modelAnswer: |-
      Before my speech, my heart was a woodpecker on a hollow tree (metaphor). My hands shook like leaves in a chinook
      (simile). The woodpecker helps you hear how fast and hard my heart was beating, and the leaves help you see that
      I could not hold my hands still.
    rubric:
      - I wrote a simile that uses *like* or *as*.
      - I wrote a metaphor, without *like* or *as*.
      - My comparisons are my own, not ones I have heard a lot.
      - I explained what each one helps the reader feel.
