id: figurative-language
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI3
outcomes: [LANENG5-OI3-GQ1-LO1]
order: 5
title: Similes, Metaphors and Analogies
shortTitle: Figurative language
summary: >-
  See what figurative language would look like if you read it literally, tell similes from metaphors and
  analogies, notice how context changes meaning, and write your own.

bigIdea: |-
  - **Figurative language** doesn’t mean exactly what the words say.
  - It compares things in surprising ways, so readers can see and feel an idea.
  - Figure out the comparison, and you can figure out the meaning.

lesson:
  - title: Literally or figuratively?
    blocks:
      - type: visual
        covers: [K3.1, S3.5, S3.6]
        component: figure-lens
        props:
          items:
            - phrase: The classroom was a zoo.
              kind: Metaphor
              picture: 🦁🐒🦓📚
              literally: Real lions and monkeys are sitting at the desks!
              means: The class was loud and wild.
              because: A class and a zoo aren’t alike, but both can be noisy and full of motion.
            - phrase: Leo ran like the wind.
              kind: Simile
              picture: 🌬️🏃💨
              literally: Leo turned into moving air and blew down the street!
              means: Leo ran very fast.
              because: Wind and a boy aren’t alike, but both can rush past you.
            - phrase: Snow was a white blanket on the field.
              kind: Metaphor
              picture: 🛏️🌾❄️
              literally: Someone tucked in the field with a real blanket!
              means: Snow covered the field softly and evenly.
              because: Snow and a blanket aren’t alike, but both lie smoothly over what’s underneath.
            - phrase: Starting at a new school is like your first day on skates.
              kind: Analogy
              picture: ⛸️🏫🤕
              literally: You must wear skates in the hallway on your first day!
              means: Both feel wobbly at first, and both get easier with practice.
              because: An analogy explains something new by showing how it works like something you know.
        caption: Press each lens. The funny picture shows why the words can’t be literal.

  - title: Three ways to compare
    blocks:
      - type: compare
        covers: [K3.1, K3.2, S3.5]
        columns:
          - title: Simile
            body: |-
              Compares using **like** or **as**.

              > The lake was **as** flat **as** a plate.
          - title: Metaphor
            body: |-
              Compares two things that are **not alike** but have something in common, **without** *like* or *as*.

              > The lake **was** a plate of glass.
          - title: Analogy
            body: |-
              Shows how one **relationship** is like another.

              > A captain is to a ship **as** a pilot is to a plane.
      - type: callout
        variant: mistake
        covers: [K3.2, S3.5]
        title: Not every “like” is a simile
        body: '“I like skating” doesn’t compare anything. A simile needs two different things being compared: “She skates **like** a swallow in flight.”'

  - title: Find them in a story
    blocks:
      - type: passage
        id: storm
        title: Storm over the Foothills
        form: Descriptive writing
        paragraphs:
          - The storm was a grey giant, striding over the foothills toward our farm. Dad pointed at the sky. We ran for the barn.
          - My little brother held my sleeve as tightly as a burr on a sock. Then the thunder rolled, like empty barrels down a wooden ramp, and the first rain came down in silver needles.
          - We watched from the door of the barn. Inside, the horses stamped and snorted. Dad checked the latch twice and said nothing.
          - As fast as it had come, the giant was gone. The whole valley glittered like a jar of new coins, and my brother finally let go of my sleeve.
        note: An original description written for Alberta Edu.
      - type: table
        covers: [S3.6, S3.5]
        caption: What do these words help you see?
        headers: [The words, Kind, What it means]
        rows:
          - ['“The storm was a grey giant”', 'Metaphor', 'The storm was huge, and it moved in like something alive and powerful.']
          - ['“as tightly as a burr on a sock”', 'Simile', 'He held on very tight and would not let go.']
          - ['“like a jar of new coins”', 'Simile', 'Wet things shone and sparkled in the sun.']

  - title: Context changes the meaning
    blocks:
      - type: table
        covers: [S3.4]
        caption: One word, many meanings. The words around it tell you which one.
        headers: [Sentence, What **cold** means here]
        rows:
          - ['It’s a **cold** morning, so wear your mitts.', 'A low temperature (literal)']
          - ['I caught a **cold** at camp.', 'An illness (literal)']
          - ['She gave me a **cold** stare.', 'Unfriendly (figurative)']
      - type: callout
        variant: tip
        covers: [S3.4, S3.6]
        title: Read around the word
        body: |-
          - When a phrase doesn’t make sense word for word, ask what the sentence around it is about.
          - If someone **“breaks the ice”** at a party, there is no ice. They are helping people start talking.

  - title: Write your own
    blocks:
      - type: example
        covers: [S3.7, S3.1, U3.1]
        title: Build a comparison, one step at a time
        problem: You want to describe a very quiet gym after everyone has left.
        steps:
          - '**Name the feeling:** so empty and still that it feels strange.'
          - '**Think of something else that feels that way:** a whale’s belly, or a giant holding its breath.'
          - '**Choose the comparison that fits best:** a giant holding its breath.'
          - '**Write it. Metaphor:** The gym was a giant holding its breath. **Simile:** The gym was as still as a giant holding its breath.'
      - type: callout
        variant: tip
        covers: [S3.7]
        title: Say it, too
        body: |-
          - Figurative language isn’t only for writing.
          - Try it in a speech, or a story you tell out loud.
          - Save it for the moments that matter.

keyTerms:
  - term: Figurative language
    covers: [K3.1]
    definition: Language with non-literal meanings, such as metaphors.
  - term: Literal
    covers: [K3.1, S3.6]
    definition: Meaning exactly what the words say.
  - term: Metaphor
    covers: [K3.2]
    definition: A comparison of two things that are not alike but have something in common, without using comparison words such as like or as.
  - term: Simile
    covers: [S3.5]
    definition: A comparison of two different things using like or as.
  - term: Analogy
    covers: [S3.5]
    definition: A comparison that shows how one relationship is like another, often to explain something new.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K3.2, S3.5]
    type: mc
    prompt: |-
      “By three o’clock, my backpack was a sack of bricks.” What kind of comparison is this?
    choices: [A metaphor, A simile, An analogy, 'It isn’t a comparison, it’s literal']
    answer: 0
    feedback:
      '1': A simile compares using *like* or *as*. Can you find either word here?
      '2': An analogy shows how one relationship is like another. This just says one thing **was** another.
      '3': Would there really be bricks in the backpack? It only feels that way.
    hints:
      - Look for *like* or *as*. Are they there?
    solution:
      - A backpack and a sack of bricks aren’t alike, but both feel very heavy. There is no *like* or *as*, so this is a **metaphor**.

  - id: w2
    level: 1
    thinking: apply
    covers: [K3.1, S3.6]
    type: mc
    prompt: |-
      Everyone says that Grandma Ruby has a **heart of gold**. What do they mean?
    choices:
      - She is very kind to people.
      - She owns a lot of gold.
      - She is tough and hard.
      - She likes shiny things.
    answer: 0
    feedback:
      '1': That reads the words literally. It’s her *heart* that is golden here, so think about what a heart stands for.
      '2': Gold is a hard metal, but when people say “heart of gold,” they are thinking of how precious gold is.
      '3': That reads *gold* literally. What is a heart often used to talk about?
    hints:
      - People don’t mean a real heart or real gold. What does a person’s heart stand for? How do people feel about gold?
    solution:
      - A heart often stands for how someone treats others. Gold is precious.
      - So a heart of gold is a precious way of treating people. Grandma Ruby is **very kind**.

  - id: w3
    level: 1
    thinking: apply
    covers: [S3.5]
    type: text
    prompt: |-
      Finish the analogy with one word: **A glove is to a hand as a sock is to a** ___.
    accept: [foot, a foot, feet]
    hints:
      - What does a glove do for a hand? Now, what does a sock do that for?
    solution:
      - A glove covers a hand. A sock covers a **foot**. An analogy keeps the same relationship and changes the things.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [K3.1, S3.6]
    type: multi
    prompt: |-
      “When the bell rings, our hallway is a **river**, and my locker is always upstream.”

      (*Upstream* means against the way the water flows.) A metaphor carries over only some things about a river. Which of these does the writer want you to picture?
    choices:
      - The floor of the hallway is wet.
      - Students all stream along in one direction.
      - Someone built a bridge over the hallway.
      - It’s hard to walk the other way.
      - Students are swimming to class.
    fixedOrder: true
    answer: [1, 3]
    feedback:
      '0': A river is wet, but the writer isn’t talking about water. What about a river is like students moving?
      '2': Rivers can have bridges, but what would that tell you about the bell ringing?
      '4': That reads the metaphor literally. Your feet are still on the floor, so what does a river do that a crowd does too?
    hints:
      - Picture a river. Now picture the crowd when the bell rings. What do they do the same way?
      - Try walking the wrong way in each one. What happens?
    solution:
      - Think about what a river **does**. It flows along one way, and it pushes against you if you go the other way.
      - A crowd of students does both of those things. The water, the bridges and the swimming don’t come along for the trip.
      - 'What we learned: a metaphor picks out what the two things share and leaves the rest behind.'

  - id: b2
    level: 2
    thinking: notice
    covers: [S3.4, S3.6]
    type: mc
    prompt: |-
      **Story A:** It’s late March. Amir walks out on the pond, and the ice creaks. Dad calls, “Come back! You’re on thin ice!”

      **Story B:** Priya has forgotten her homework for the third time this week. Her teacher looks over her glasses. “You’re on thin ice,” she says.

      What does the teacher mean in Story B?
    choices:
      - One more mistake could get Priya into trouble.
      - Priya has to go and stand far from the pond.
      - Priya’s homework got wet and has to be redone.
      - The classroom is much too cold for Priya today.
    answer: 0
    feedback:
      '1': That would fit Story A. Where is Priya in Story B? Is there any ice there?
      '2': Nothing in the story says the homework got wet. What has she been doing three times this week?
      '3': That takes *ice* to be about temperature. What’s happening between Priya and her teacher?
    hints:
      - Where is each person standing? In which story could the ice be real?
      - What could happen on thin ice if you take one more step? How is Priya’s week like that?
    solution:
      - The words are the same. The stories around them are different.
      - In Story A, the ice is real. Story B is set at school, so the words must be figurative.
      - Thin ice can hold you for now, but one more step could go badly. Priya has **one mistake left before she’s in trouble**.

  - id: b3
    level: 2
    thinking: whatif
    covers: [S3.6, S3.5]
    type: mc
    prompt: |-
      In *Storm over the Foothills*, the writer describes the first rain.

      > …the first rain came down in silver **needles**.

      Suppose the writer changed one word, to “silver **threads**.” What would change for a reader?
    choices:
      - The rain would seem soft and not sharp.
      - The rain would be a different colour.
      - The words would become a simile.
      - The rain would seem to last longer.
    answer: 0
    feedback:
      '1': Both versions say “silver,” so the colour stays the same. What is different between needles and threads?
      '2': Neither version has *like* or *as*, so both are still metaphors.
      '3': Nothing in either word tells you how long it rained. How would each one feel on your skin?
    hints:
      - Imagine each one landing on your arm. What does a needle feel like? A thread?
    solution:
      - Needles are thin, hard and sharp. Threads are thin and soft.
      - Both show thin lines of rain, but *needles* makes the rain feel like it stings, which fits a frightening storm. *Threads* would make it gentle.
      - One word can change how a whole moment feels.

  - id: b4
    level: 2
    thinking: evidence
    covers: [S3.6, S3.5]
    type: evidence
    prompt: A **burr** is a prickly seed case that clings to your clothes. No one in this story says that the little brother is scared, but a comparison shows it. Tap that sentence.
    passage: storm
    paragraphs: [1, 2, 4]
    answer: [p2s1]
    feedback:
      p1s1: This is a comparison, but it’s about the storm. Which one is about the brother?
      p1s2: Nothing is being compared here. Look for a sentence about the brother.
      p1s3: Nothing is being compared here. Look for a sentence about the brother.
      p2s2: These comparisons are about the thunder and the rain. Which one is about the brother?
      p4s1: This brings the giant back, but it’s about the storm leaving. Which comparison is about the brother?
      p4s2: The end of this sentence is a good clue, because he finally lets go. But the comparison here is about the valley. Which comparison shows how he was holding on?
    hints:
      - Which sentences mention the brother?
      - In each of those, what is being compared with what?
    solution:
      - '“My little brother held my sleeve as tightly as a burr on a sock.”'
      - A burr clings and won’t let go until you pull it off. Someone holding on that tightly is scared, and the writer never has to say so.
      - That is what a simile can do. It lets you feel an idea that the words don’t state.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d2
    level: 3
    thinking: why
    covers: [K3.2, S3.6]
    type: mc
    prompt: |-
      *Storm over the Foothills* begins like this:

      > The storm was a grey giant, striding over the foothills toward our farm.

      Near the end, it says:

      > As fast as it had come, the **giant** was gone.

      Suppose the writer had put “the **storm** was gone” there instead. What would we lose?
    choices:
      - The feeling that something alive came and then walked away
      - The clue that the family saw a real giant in the valley
      - The fact that the storm went away faster than it arrived
      - The comparison word that makes this sentence a simile
    answer: 0
    feedback:
      '1': The family never sees a real giant. The first sentence told you the storm *was* one, and that’s a metaphor. So what is the word *giant* doing here?
      '2': Both versions say “as fast as it had come,” so the speed stays the same. What does *giant* add that *storm* doesn’t?
      '3': Neither version has *like* or *as*, so this isn’t a simile. What does the word *giant* make you picture?
    hints:
      - Read both versions aloud. Which one could walk off over the hills?
      - The writer already told you what the giant is. Why go back to that word at the end?
    solution:
      - A storm is just weather. A giant has a body, and it can come striding in and walk away.
      - By using *giant* again, the writer keeps the first picture going to the very end. The storm feels like a living thing that visited and left.
      - 'What we learned: a metaphor can stay with a story, and it doesn’t have to end after one sentence.'

  - id: d4
    level: 3
    thinking: design
    covers: [S3.7, S3.1, K3.2, S3.5]
    type: open
    prompt: |-
      Grandpa’s old pickup truck rattles, coughs out smoke and has never once broken down.

      Write **one simile** that makes a reader love this truck. Then write **one metaphor** that makes a reader a little
      nervous about getting in.
    modelAnswer: |-
      **Simile:** The old truck bounced down the lane like a happy dog that’s shaking itself dry.

      **Metaphor:** At every stop sign, that truck is a tired dragon, coughing and deciding whether to keep going.
    rubric:
      - My first sentence uses *like* or *as*, and it makes the truck seem lovable.
      - My second sentence compares without *like* or *as*, and it makes the truck seem a bit worrying.
      - Each sentence compares the truck with something that isn’t a truck.
    hints:
      - The truck is the same both times. Only what you compare it to changes. What’s a rattling, smoky thing you’d love? What’s one you wouldn’t want to get close to?
      - Say what you want the reader to feel first. Then choose the comparison.
