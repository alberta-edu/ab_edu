id: authors-craft
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 9
title: "Author’s Craft: Show, Don’t Tell"
shortTitle: Author’s craft
summary: >-
  Turn a dial from telling to showing, set a mood with sensory words, learn from a mentor text, and use
  plot, dialogue and point of view to entertain your readers.

bigIdea: |-
  Great writers choose their words on purpose. They **show** what is happening, so that readers can see, hear and
  feel it for themselves. Every word choice shapes the **mood**, the **voice**, and what the audience takes away.

lesson:
  - title: Turn the dial from tell to show
    blocks:
      - type: visual
        covers: [K2.4, K2.6, S2.4, S2.6]
        component: show-dial
        props:
          moods:
            - id: cozy
              label: Cozy
              tell: The cabin was a nice place to be.
              details:
                - { sense: sight, text: 'Yellow light spilled from the cabin windows onto the snow.' }
                - { sense: smell, text: 'Woodsmoke and cinnamon drifted down the path.' }
                - { sense: sound, text: 'Inside, a kettle began to sing.' }
                - { sense: touch, text: 'I pulled off my frozen mitts and held my hands to the stove.' }
            - id: eerie
              label: Eerie
              tell: The cabin was a scary place to be.
              details:
                - { sense: sight, text: 'Black windows stared out across the snow.' }
                - { sense: smell, text: 'The air smelled of cold ash and old rot.' }
                - { sense: sound, text: 'Somewhere inside, a door creaked, then stopped.' }
                - { sense: touch, text: 'The latch was so cold that it burned my fingers.' }
        caption: Slide the dial, then change the mood. Same cabin, but do you feel the same?
      - type: callout
        variant: tip
        covers: [K2.6, S2.4]
        title: What is mood?
        body: '**Mood** is the atmosphere of a text. It comes from the setting, the attitude of the narrator, and the descriptions. Notice that neither cabin says “cozy” or “scary” once the dial is up. You feel it.'

  - title: The words writers choose
    blocks:
      - type: table
        covers: [K2.4, S2.8]
        caption: 'Five ways to find the right word. Use a thesaurus or a dictionary, on paper or online.'
        headers: [Kind of word, Instead of…, Try…]
        rows:
          - ['**Sensory language**', 'The soup was good.', 'The soup was hot and peppery.']
          - ['**Synonyms**', 'She walked slowly.', 'She shuffled. She trudged.']
          - ['**Antonyms**', 'He was not brave.', 'He was timid.']
          - ['**Specific words**', 'A dog ran by.', 'A muddy husky tore past.']
          - ['**Figurative language**', 'The rain was heavy.', 'The rain was a drum on the roof.']

  - title: Voice is you on the page
    blocks:
      - type: table
        covers: [K2.3, S2.7]
        caption: Word choice can reflect the author’s voice through…
        headers: [Choice, Example]
        rows:
          - ['**Detail**', '“Her hockey bag smelled like a hundred-year-old sandwich.”']
          - ['**Clarity**', '“Stop. Look left. Then go.”']
          - ['**Variety**', '“She crept. She paused. Then she bolted for the door.”']
          - ['**Humour**', '“My brother’s room is the place where socks go to die.”']
          - ['**Dialogue**', '“You call that a snowman?” Gran said. “I’ve seen better on a cold pizza.”']
      - type: callout
        variant: tip
        covers: [S2.7]
        title: Dialogue reveals voice
        body: In the last example, just two short sentences of dialogue tell you that Gran is funny and blunt. Language and dialogue express **voice, point of view and ideas**.

  - title: Learn from a mentor
    blocks:
      - type: passage
        id: mentor
        title: First Dive
        form: Mentor text
        paragraphs:
          - The diving board groaned. Lena stopped, one foot forward, and held her breath.
          - “It’s just the spring,” Max called from the pool deck. “It does that.”
          - Lena looked down. Blue water moved far below her like a slow, deep thought. Her knees began to shake.
          - She took one more step. The board groaned again, and this time she laughed, because a sound was just a sound, and she had come here to dive.
        note: An original piece written for AB Edu. A **mentor text** is an example of effective writing that you can learn from.
      - type: example
        covers: [K2.5, S2.2, S2.5, S2.3]
        title: What can we learn from “First Dive”?
        problem: Use this mentor text to see how an author builds a story for an audience.
        steps:
          - '**Plot and problem:** Lena is scared to walk to the end of a high diving board.'
          - '**Setting:** A high board above a pool. The word *groaned* helps the audience hear it.'
          - '**Point of view:** Third person. The narrator tells us what Lena does and feels.'
          - '**Dialogue:** Max’s two calm sentences show how different he is from Lena.'
          - '**Figurative language:** “like a slow, deep thought” makes the water seem strange and far away.'

  - title: Words depend on who is reading
    blocks:
      - type: compare
        covers: [K2.2, S2.2]
        columns:
          - title: To a friend
            body: “The new rink is so cool! You’ve gotta come see it!”
          - title: To the town council
            body: “Our new rink needs a bigger parking lot.”
          - title: To a Grade 1 class
            body: “Put on your helmet before you step on the ice.”
      - type: callout
        variant: tip
        covers: [K2.2, S2.2]
        title: Same topic, new words
        body: Words change with **audience, purpose and context**. Good writers ask, “Who is reading? What do I want them to do?”

  - title: Creative thinking is a process
    blocks:
      - type: table
        covers: [K2.1, S2.1, U2.1]
        caption: How a story about a lost dog gets better
        headers: [Creative step, What the writer does]
        rows:
          - ['**Construct a draft or model**', 'Writes a first version quickly, knowing it won’t be perfect.']
          - ['**Consider other creators**', 'Studies how another author made readers worry about a pet.']
          - ['**Apply feedback**', 'A friend says, “I didn’t care about the dog until the end.” The writer adds a scene with the dog at the start.']
          - ['**Elaborate for the audience**', 'Adds a funny moment, because the readers are in Grade 3.']
          - ['**Confront challenges**', 'The ending is hard, so the writer tries three different ones.']

keyTerms:
  - term: Mood
    covers: [K2.6]
    definition: The atmosphere of a text, created by the setting, the attitude of the narrator, and descriptions.
  - term: Sensory language
    covers: [K2.4]
    definition: Words that help readers see, hear, smell, taste or feel.
  - term: Synonym
    covers: [K2.4]
    definition: A word with the same or a similar meaning as another word.
  - term: Antonym
    covers: [K2.4]
    definition: A word with the opposite meaning of another word.
  - term: Voice
    covers: [K2.3]
    definition: The author’s own style, which comes through their word choice.
  - term: Mentor text
    covers: [K2.5]
    definition: An example of effective communication for students to learn from.
  - term: Show, don’t tell
    covers: [S2.6]
    definition: Using details and actions to let readers experience story events, instead of just stating them.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [S2.6]
    type: mc
    prompt: Which sentence **shows**, rather than tells, that Leo is cold?
    choices:
      - Leo’s teeth chattered, and he tucked his hands into his armpits.
      - Leo was very cold.
      - Leo felt cold outside today.
      - It was cold, and Leo felt it.
    answer: 0
    feedback:
      '1': This **tells** us. It names the feeling.
      '2': The word “cold” is doing all the work. What would we see Leo do?
      '3': This still tells us. Show what the cold does to him.
    hints:
      - Which sentence never uses the word *cold*?
    solution:
      - Chattering teeth and hidden hands let us **see** that he is cold.

  - id: w2
    level: 1
    covers: [K2.6]
    type: mc
    prompt: What creates **mood** in a text?
    choices:
      - Setting, the attitude of the narrator, and descriptions
      - Only the title
      - Only the number of pages
      - The size of the font
    answer: 0
    feedback:
      '1': A title may hint at the mood, but it isn’t the whole picture.
      '2': Length doesn’t create atmosphere.
      '3': The font doesn’t create atmosphere. Words do.
    hints:
      - Remember the cabin. What changed the mood?
    solution:
      - Mood comes from the **setting, the attitude of the narrator, and descriptions**.

  - id: w3
    level: 1
    covers: [K2.4, S2.8]
    type: mc
    prompt: Which word is a **synonym** for *tired*?
    choices: [exhausted, energetic, hungry, quick]
    answer: 0
    feedback:
      '1': That is an **antonym**, a word with the opposite meaning.
      '2': That is a different feeling, not the same one.
      '3': That doesn’t mean anything like *tired*.
    hints:
      - A synonym has the same or a similar meaning.
    solution:
      - '**Exhausted** means very tired.'

  - id: w4
    level: 1
    covers: [K2.5]
    type: mc
    prompt: What is a **mentor text**?
    choices:
      - An example of effective writing that you can learn from
      - A message that a teacher texts to a student
      - A dictionary
      - A list of spelling rules
    answer: 0
    feedback:
      '1': That is a real text message. A mentor text is an example to study.
      '2': A dictionary gives you meanings, but it isn’t an example of effective storytelling.
      '3': Rules aren’t an example of writing to learn from.
    hints:
      - We studied one in this lesson, called “First Dive.”
    solution:
      - A mentor text is **an example of effective communication**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [K2.4, S2.4]
    type: multi
    prompt: Which of these use **sensory language**?
    choices:
      - The bread smelled sweet and yeasty.
      - The ice cracked like a rifle shot.
      - The wool scratched at my neck.
      - The town has about 5,000 people.
    fixedOrder: true
    answer: [0, 1, 2]
    feedback:
      '3': This is a useful fact, but it doesn’t help you see, hear, smell, taste or feel anything.
    hints:
      - Which ones let you smell, hear or feel something?
    solution:
      - Smell, hearing and touch are all **senses**. The population is just a fact.

  - id: b2
    level: 2
    covers: [S2.6, S2.5]
    type: evidence
    prompt: Tap the sentence that **shows** that Lena is scared.
    passage: mentor
    paragraphs: [1, 3]
    answer: [p1s2, p3s3]
    feedback:
      p1s1: This describes the board. How does **Lena** react?
      p3s1: This describes where she looks. Look for what her body does.
      p3s2: This shows what she sees. Look for how she reacts.
    hints:
      - Look for what her body does.
    solution:
      - '“Lena stopped, one foot forward, and held her breath.” and “Her knees began to shake.” The word *scared* is never used.'

  - id: b3
    level: 2
    covers: [S2.7, K2.3]
    type: mc
    prompt: 'Max calls, “It’s just the spring. It does that.” What do his words show about his **voice** in the story?'
    choices:
      - He is calm and sure about the board.
      - He is scared and doesn’t know what to do.
      - He is angry at Lena.
      - He wants Lena to get off the board.
    answer: 0
    feedback:
      '1': He sounds the opposite of scared. His short sentences are relaxed.
      '2': Nothing he says is angry. It’s meant to help.
      '3': He says the noise is normal, so he isn’t telling her to leave.
    hints:
      - Read what he says in a relaxed way, then a scared way. Which one fits?
    solution:
      - His short, relaxed sentences show that he is **calm and sure**.

  - id: b4
    level: 2
    covers: [K2.2, S2.2]
    type: mc
    prompt: You are writing about a thunderstorm for a Grade 1 class. Which sentence best suits your **audience**?
    choices:
      - “The sky went boom, and everyone ran inside to stay safe!”
      - “The atmospheric disturbance produced significant electrical discharge.”
      - “Thunderstorms pose hazards that residents should mitigate.”
      - “A storm was reported in the municipality on Tuesday evening.”
    answer: 0
    feedback:
      '1': Grade 1 students wouldn’t know these words.
      '2': These words are too hard for that audience, and it sounds like a government report.
      '3': That sounds like a news report for adults.
    hints:
      - Which sentence would a six-year-old enjoy and understand?
    solution:
      - The **words change with the audience**. Short, lively words suit young readers.

  - id: b5
    level: 2
    covers: [K2.1, S2.1]
    type: mc
    prompt: A friend reads your draft and says, “I got confused at the part in the barn.” What should a good writer do?
    choices:
      - Look at that part again and improve it. Feedback helps.
      - Throw out the whole story.
      - Ignore it, because your friend is wrong.
      - Make the barn part longer without changing it.
    answer: 0
    feedback:
      '1': One confusing part doesn’t mean the whole story is bad.
      '2': Your friend is telling you what a reader experienced. That’s useful, even if it is hard to hear.
      '3': More of a confusing part is still confusing.
    hints:
      - Creative thinking includes applying feedback.
    solution:
      - '**Applying feedback** is a key part of creative work.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [K2.6, S2.4]
    type: mc
    prompt: |-
      What **mood** do these sentences create?

      > Fog sat on the empty road. A single street light buzzed and flickered. Somewhere behind me, gravel crunched.
    choices: [Tense and uneasy, Cheerful and sunny, Silly and playful, Bored and sleepy]
    answer: 0
    feedback:
      '1': Fog, flickering light and footsteps from behind aren’t cheerful.
      '2': Nothing here is a joke. What would you feel on this road?
      '3': The narrator is paying close attention. A crunch behind you would wake you up!
    hints:
      - How would you feel if you were on that road?
    solution:
      - The fog, the flicker and the unseen footsteps create a **tense, uneasy** mood.

  - id: d2
    level: 3
    covers: [S2.2, K2.3]
    type: evidence
    prompt: 'Which sentence from “First Dive” uses **figurative language** to make the water seem strange?'
    passage: mentor
    paragraphs: [3]
    answer: [p3s2]
    feedback:
      p3s1: This only says what she does. Look for a comparison.
      p3s3: This shows her fear, but it doesn’t compare anything. Find the simile.
    hints:
      - Look for the word *like*.
    solution:
      - '“Blue water moved far below her like a slow, deep thought.” The comparison makes the water feel strange and far away.'

  - id: d3
    level: 3
    covers: [S2.6, S2.4, S2.1]
    type: open
    prompt: |-
      Change this **telling** sentence into two or three sentences that **show** it. Use at least two senses, and
      don’t use the word *excited*.

      > Maya was excited about the first day of the fair.
    modelAnswer: |-
      Maya was up before the sun, with her boots already on. She could smell the mini doughnuts from the end of the
      block, and she started to run.
    rubric:
      - I never used the word *excited*.
      - I used at least two senses.
      - A reader can tell how Maya feels from what she does.
      - I read it aloud and made it better.

  - id: d4
    level: 3
    covers: [S2.3, S2.5, K2.3]
    type: open
    prompt: |-
      Write the opening of a story that will **entertain** your classmates. Establish a **setting**, a **problem**, and a
      **point of view**. Include at least one line of **dialogue** and one piece of **figurative language**.
    modelAnswer: |-
      The canoe was a leaf spinning on the Bow River, and Sam had just lost the paddle. “Nice work,” said his sister, who was
      holding the only sandwich. The dock got smaller and smaller behind them, and neither of them knew how to swim.
    rubric:
      - The reader can tell where the story takes place.
      - There is a clear problem.
      - I kept to one point of view.
      - I used dialogue and figurative language.
