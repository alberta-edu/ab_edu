id: authors-craft
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 9
title: "Author’s Craft: Show, Don’t Tell"
shortTitle: Author’s craft
summary: >-
  Turn a dial from telling to showing, set a mood with sensory words, learn from a mentor text, and use
  plot, dialogue and point of view to entertain your readers.

bigIdea: |-
  - Great writers choose their words on purpose.
  - They **show** what is happening, so readers can see, hear and feel it for themselves.
  - Every word choice shapes the **mood**, the **voice**, and what the audience takes away.

lesson:
  - title: Turn the dial from tell to show
    blocks:
      - type: visual
        covers: [K2.4, K2.6, S2.4, S2.6]
        component: show-dial
        props:
          moods:
            - id: cozy
              label: Cozy
              tell: The cabin was a nice place to be.
              details:
                - { sense: sight, text: 'Yellow light spilled from the cabin windows onto the snow.' }
                - { sense: smell, text: 'Woodsmoke and cinnamon drifted down the path.' }
                - { sense: sound, text: 'Inside, a kettle began to sing.' }
                - { sense: touch, text: 'I pulled off my frozen mitts and held my hands to the stove.' }
            - id: eerie
              label: Eerie
              tell: The cabin was a scary place to be.
              details:
                - { sense: sight, text: 'Black windows stared out across the snow.' }
                - { sense: smell, text: 'The air smelled of cold ash and old rot.' }
                - { sense: sound, text: 'Somewhere inside, a door creaked, then stopped.' }
                - { sense: touch, text: 'The latch was so cold that it burned my fingers.' }
        caption: Slide the dial, then change the mood. Same cabin, but do you feel the same?
      - type: callout
        variant: tip
        covers: [K2.6, S2.4]
        title: What is mood?
        body: |-
          **Mood** is the atmosphere of a text. It comes from:

          - the setting
          - the attitude of the narrator
          - the descriptions

          Neither cabin says “cozy” or “scary” once the dial is up. You feel it.

  - title: The words writers choose
    blocks:
      - type: table
        covers: [K2.4, S2.8]
        caption: 'Five ways to find the right word. Use a thesaurus or a dictionary, on paper or online.'
        headers: [Kind of word, Instead of…, Try…]
        rows:
          - ['**Sensory language**', 'The soup was good.', 'The soup was hot and peppery.']
          - ['**Synonyms**', 'She walked slowly.', 'She shuffled. She trudged.']
          - ['**Antonyms**', 'He was not brave.', 'He was timid.']
          - ['**Specific words**', 'A dog ran by.', 'A muddy husky tore past.']
          - ['**Figurative language**', 'The rain was heavy.', 'The rain was a drum on the roof.']

  - title: Voice is you on the page
    blocks:
      - type: table
        covers: [K2.3, S2.7]
        caption: Word choice can reflect the author’s voice through…
        headers: [Choice, Example]
        rows:
          - ['**Detail**', '“Her hockey bag smelled like a hundred-year-old sandwich.”']
          - ['**Clarity**', '“Stop. Look left. Then go.”']
          - ['**Variety**', '“She crept. She paused. Then she bolted for the door.”']
          - ['**Humour**', '“My brother’s room is the place where socks go to die.”']
          - ['**Dialogue**', '“You call that a snowman?” Gran said. “I’ve seen better on a cold pizza.”']
      - type: callout
        variant: tip
        covers: [S2.7]
        title: Dialogue reveals voice
        body: In the last example, just two short sentences of dialogue tell you that Gran is funny and blunt. Language and dialogue express **voice, point of view and ideas**.

  - title: Learn from a mentor
    blocks:
      - type: passage
        id: mentor
        title: First Dive
        form: Mentor text
        paragraphs:
          - The diving board groaned. Lena stopped, one foot forward, and held her breath.
          - “It’s just the spring,” Max called from the pool deck. “It does that.”
          - Lena looked down. Blue water moved far below her like a slow, deep thought. Her knees began to shake.
          - She took one more step. The board groaned again, and this time she laughed, because a sound was just a sound, and she had come here to dive.
        note: An original piece written for AB Edu. A **mentor text** is an example of effective writing that you can learn from.
      - type: example
        covers: [K2.5, S2.2, S2.5, S2.3]
        title: What can we learn from “First Dive”?
        problem: Use this mentor text to see how an author builds a story for an audience.
        steps:
          - '**Plot and problem:** Lena is scared to walk to the end of a high diving board.'
          - '**Setting:** A high board above a pool. The word *groaned* helps the audience hear it.'
          - '**Point of view:** Third person. The narrator tells us what Lena does and feels.'
          - '**Dialogue:** Max’s two calm sentences show how different he is from Lena.'
          - '**Figurative language:** “like a slow, deep thought” makes the water seem strange and far away.'

  - title: Words depend on who is reading
    blocks:
      - type: compare
        covers: [K2.2, S2.2]
        columns:
          - title: To a friend
            body: “The new rink is so cool! You’ve gotta come see it!”
          - title: To the town council
            body: “Our new rink needs a bigger parking lot.”
          - title: To a Grade 1 class
            body: “Put on your helmet before you step on the ice.”
      - type: callout
        variant: tip
        covers: [K2.2, S2.2]
        title: Same topic, new words
        body: Words change with **audience, purpose and context**. Good writers ask, “Who is reading? What do I want them to do?”

  - title: Creative thinking is a process
    blocks:
      - type: table
        covers: [K2.1, S2.1, U2.1]
        caption: How a story about a lost dog gets better
        headers: [Creative step, What the writer does]
        rows:
          - ['**Construct a draft or model**', 'Writes a first version quickly, knowing it won’t be perfect.']
          - ['**Consider other creators**', 'Studies how another author made readers worry about a pet.']
          - ['**Apply feedback**', 'A friend says, “I didn’t care about the dog until the end.” The writer adds a scene with the dog at the start.']
          - ['**Elaborate for the audience**', 'Adds a funny moment, because the readers are in Grade 3.']
          - ['**Confront challenges**', 'The ending is hard, so the writer tries three different ones.']

keyTerms:
  - term: Mood
    covers: [K2.6]
    definition: The atmosphere of a text, created by the setting, the attitude of the narrator, and descriptions.
  - term: Sensory language
    covers: [K2.4]
    definition: Words that help readers see, hear, smell, taste or feel.
  - term: Synonym
    covers: [K2.4]
    definition: A word with the same or a similar meaning as another word.
  - term: Antonym
    covers: [K2.4]
    definition: A word with the opposite meaning of another word.
  - term: Voice
    covers: [K2.3]
    definition: The author’s own style, which comes through their word choice.
  - term: Mentor text
    covers: [K2.5]
    definition: An example of effective communication for students to learn from.
  - term: Show, don’t tell
    covers: [S2.6]
    definition: Using details and actions to let readers experience story events, instead of just stating them.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [S2.6]
    type: mc
    prompt: The goalie is nervous before the big game. Which sentence **shows** that, rather than tells it?
    choices:
      - The goalie retied the same skate four times and forgot to drink her water.
      - The goalie had never felt so worried and so jumpy in her whole life.
      - The goalie was far more nervous than anyone on the team could have guessed.
      - Everyone in the room could tell how nervous and upset the goalie felt.
    answer: 0
    feedback:
      '1': '*Worried* and *jumpy* still name the feeling. The sentence tells us instead of letting us see it.'
      '2': This says *nervous* right out loud. What would we see the goalie do?
      '3': The sentence says everyone could tell, but it doesn’t let **you** see what they saw.
    hints:
      - Try to draw each sentence. Which one gives you a picture?
      - Look for a sentence that never names a feeling.
    solution:
      - Showing lets the reader work out the feeling from what a person does.
      - Nobody ties the same skate four times unless their mind is on something else, so we **see** the nerves. The word *nervous* isn’t needed.

  - id: w2
    level: 1
    thinking: apply
    covers: [K2.4, S2.8]
    type: mc
    prompt: |-
      A thesaurus lists four synonyms for *walked*. Which one fits best here?

      > So that the baby wouldn’t wake up, Grandpa ___ past the crib.
    choices: [tiptoed, marched, strolled, staggered]
    answer: 0
    feedback:
      '1': It means *walked*, but marching is loud. The baby would be awake by the second step.
      '2': It means *walked*, but strolling is relaxed. Grandpa is being careful here.
      '3': It means *walked*, but someone who staggers might crash into the crib.
    hints:
      - What is Grandpa trying to do? Read the start of the sentence again.
      - Picture each word. Which way of walking is the quietest?
    solution:
      - All four are synonyms, but they don’t mean exactly the same thing.
      - The sentence needs quiet, careful steps, so **tiptoed** fits. A thesaurus gives you choices, and you still have to pick.

  - id: w3
    level: 1
    thinking: apply
    covers: [K2.5, K2.1]
    type: mc
    prompt: Dara loves a funny book where a lost boot tells its own story. Which shows Dara using the book as a **mentor text**?
    choices:
      - She notices how the boot’s grumbling makes her laugh, then lets her own lost mitten grumble.
      - She copies the funniest page into her story, then changes every *boot* to *mitten*.
      - She reads the book again and again, until she knows every one of its jokes by heart.
      - She writes a review telling her class that it is the funniest book of the whole year.
    answer: 0
    feedback:
      '1': That is copying with one word changed. A mentor text teaches you a move to try in your **own** words.
      '2': Enjoying a book is great, but she hasn’t studied how the author does it or tried it herself.
      '3': A review tells others about the book. A mentor text is something you learn to write from.
    hints:
      - What does a mentor do? They show you how, so that you can do it yourself.
    solution:
      - A **mentor text** is an example of effective writing that you learn from.
      - Dara works out how the author gets the laugh. Then she uses that idea in her own story, with her own words.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: notice
    covers: [S2.5]
    type: mc
    prompt: |-
      Tam wrote this story opening. Everyone who read it yawned.

      > The sun shone on the farm. “Nice day,” said Pa. “Very nice,” said Lou. The goats ate their grass. Everyone was happy.

      What is missing?
    choices: [A problem, A setting, Some dialogue, A point of view]
    answer: 0
    feedback:
      '1': Look at the first sentence. Where does this story happen?
      '2': Pa and Lou are talking. The dialogue just isn’t giving us anything to care about.
      '3': The narrator is telling us about the characters by name, so this is third person.
    hints:
      - Check each choice against the opening. Which ones can you find in it?
      - What does anyone in this story want or need?
    solution:
      - The setting, the dialogue and the point of view are all there. So what’s wrong?
      - Nobody needs anything, so nothing has to happen. A story needs a **problem**.
      - One sentence can wake it up. “The goats ate their grass, and then they ate Pa’s truck keys.”

  - id: b2
    level: 2
    thinking: evidence
    covers: [S2.7, K2.3]
    type: mc
    prompt: |-
      A birthday cake has just landed face-down on the floor.

      > “Five-second rule,” said Pax, reaching for a fork.
      >
      > “It’s ruined. I ruin everything,” said Oona.
      >
      > “Okay. Someone find a spatula. Someone get ice cream. We have ten minutes,” said Ngozi.

      Later, a raccoon walks into the kitchen. A voice says, “Right. Shut the pantry first, then get a broom.” Who is it most likely to be?
    choices:
      - Pax
      - Oona
      - Ngozi
      - It could be any of them, because this is a new problem.
    fixedOrder: true
    answer: 2
    feedback:
      '0': Pax’s voice is cheerful and goes straight for the food. Pax would probably be offering the raccoon some cake.
      '1': Oona’s voice blames herself when things go wrong. This speaker isn’t worried about blame at all.
      '3': The problem is new, but people keep their voices. Compare how each one talks when things go wrong.
    hints:
      - How does each person handle the fallen cake? What do their words tell you?
      - Read the raccoon line aloud. Is it a joke, a worry or a set of instructions?
    solution:
      - Just one line of dialogue gives each person a voice. Pax jokes, Oona worries and Ngozi gives orders.
      - The raccoon line gives orders, step by step, just like the spatula line. So it sounds like **Ngozi**.
      - That is how dialogue works. It tells us who someone is, without the author having to say it.

  - id: b3
    level: 2
    thinking: decide
    covers: [K2.1, S2.1]
    type: multi
    prompt: Arjun wrote a pirate story for Grade 3 readers, and four people gave him feedback. Which comments can he actually **use** to make his story better?
    choices:
      - “On page 2, I didn’t know why the pirate was crying, so I stopped caring.”
      - “I’m in Grade 3, and I don’t know what *melancholy* means. Is it important?”
      - “It’s great! You’re the best writer in the whole school, and I love it so much!”
      - “Pirates are boring. You should cut them all and write about horses, like me.”
    answer: [0, 1]
    feedback:
      '2': That is kind, and it’s nice to hear. But does it tell Arjun anything to change?
      '3': This reader wants a different story. It doesn’t show where this one goes wrong.
    hints:
      - For each comment, ask, “What would Arjun do tomorrow because of this?”
      - Who is this story for? Whose confusion matters most?
    solution:
      - Useful feedback points to a place where a reader got lost.
      - The page 2 comment tells Arjun where to add a reason for the tears. The Grade 3 reader shows that the word *melancholy* (very sad) is too hard for his audience.
      - The praise gives him nothing to change, and the horse comment asks for someone else’s story.

  - id: b4
    level: 2
    thinking: perspective
    covers: [K2.2, S2.1]
    type: open
    prompt: |-
      A skunk has moved in under the school. The principal puts this sign on the Kindergarten door:

      > Students are advised to avoid the vicinity of the odorous mammal.

      (*Vicinity* means the area nearby. *Odorous* means smelly.) The five-year-olds just stare at it. Rewrite the sign so that they would understand it.
    modelAnswer: |-
      There is a skunk under our school! It can make a big stink. Stay away from it!
    rubric:
      - My sign says that there is a skunk and that children should stay away.
      - Every word is one that a five-year-old knows.
      - My sentences are short.
    hints:
      - What is the sign really trying to say? Say it the way you would to a little brother or sister.

  - id: b5
    level: 2
    thinking: notice
    covers: [K2.6, S2.4, S2.8]
    type: investigation
    prompt: |-
      Farah wants her story to feel creepy. Her friend read this part and burst out laughing.

      > Cold air hung in the black hallway. Behind the lockers, something scraped. Then, very slowly, it wiggled closer.
    parts:
      - type: mc
        prompt: Which word broke the mood?
        choices: [wiggled, scraped, black, slowly]
        answer: 0
        feedback:
          '1': A scraping sound you can’t see is creepy. This word is helping.
          '2': A black hallway is a creepy setting. This word is helping.
          '3': Something coming *slowly* builds the tension. This word is helping.
        hints:
          - Picture the thing behind the lockers doing each action. When do you start to laugh?
        solution:
          - Every other word builds the creepy mood. Then *wiggled* makes the thing sound like a happy puppy.
      - type: mc
        prompt: Farah looks in a thesaurus for other words that could fit. Which one should replace *wiggled*?
        choices: [crawled, bounced, strolled, went]
        answer: 0
        feedback:
          '1': Now it sounds like a beach ball. The mood breaks again.
          '2': Now it sounds like it’s out for a nice walk with an ice cream.
          '3': It isn’t silly, but it’s flat. The reader can’t picture anything, so the mood fades.
        hints:
          - Try each word in the sentence. Which one lets you picture something you wouldn’t want to meet?
        solution:
          - “Then, very slowly, it **crawled** closer.” We can picture it, and we don’t want to.
    wrapUp: Mood is built from the setting and the descriptions, one word at a time, and one wrong word can knock it down. A thesaurus gives you choices, but you decide which one fits.

  - id: b6
    level: 2
    thinking: evidence
    covers: [S2.6, K2.5]
    type: evidence
    prompt: The author of “First Dive” never writes, “Lena was scared.” Tap a sentence that **shows** her fear through what her body does.
    passage: mentor
    paragraphs: [1, 2, 3, 4]
    answer: [p1s2, p3s3]
    feedback:
      p1s1: This is the sound that scares her. But it’s about the board. What does her body do?
      p2s1: This is Max talking. Does it show what is happening to Lena?
      p2s2: This is Max talking. Does it show what is happening to Lena?
      p3s1: Anyone on a diving board might look down. What else happens to her that shows fear?
      p3s2: This comparison makes the water seem strange and far away. But it’s about the water. What about Lena’s body?
      p4s1: She is moving forward here. Does that show fear, or something else?
      p4s2: She laughs here, so the fear is going away. Look earlier in the story.
    hints:
      - Which sentences are about Lena’s body?
      - What does a body do when someone is afraid?
    solution:
      - 'Either of these works: “Lena stopped, one foot forward, and held her breath.” or “Her knees began to shake.”'
      - Neither sentence names a feeling. You see what her body does, and you work out the fear for yourself.
      - That is what “show, don’t tell” means. Try it when you write.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: why
    covers: [S2.2, K2.4, K2.6]
    type: mc
    prompt: |-
      In “First Dive,” the word *groaned* appears twice.

      > The diving board groaned. Lena stopped, one foot forward, and held her breath.
      >
      > She took one more step. The board groaned again, and this time she laughed…

      The author could have used a synonym the second time, such as *creaked*. Why keep the same word?
    choices:
      - The sound stays exactly the same, so we can see that Lena is the one who has changed.
      - The board is getting weaker, so the second groan warns us that it is about to break.
      - The same word reminds us that the board is still scary, so the tense mood keeps going.
      - Repeating a word is always stronger than using a synonym, so writers should avoid them.
    answer: 0
    feedback:
      '1': Max already told us that the sound is “just the spring.” Does the story treat the board as breaking?
      '2': Look at what Lena does the second time. Does the mood stay tense?
      '3': Synonyms are often just what a writer needs. So why was the same word better **here**?
    hints:
      - What does Lena do after the first groan? What does she do after the second?
      - Did the board change, or did something else?
      - What would a reader think if the sound had a new name the second time?
    solution:
      - Compare the two moments. The first groan stops her, and the second makes her laugh.
      - The board hasn’t changed, and the word tells us so. All that has changed is Lena, and the mood flips with her.
      - If the author had written *creaked*, we might think that the sound was different. Here, a repeated word does more than a new one.

  - id: d2
    level: 3
    thinking: perspective
    covers: [K2.6, S2.7]
    type: investigation
    prompt: |-
      Two narrators describe the same morning.

      **Narrator A**

      > Snow lay on the window ledge, thick and soft as bread dough. The plows hadn’t come. Not one car moved on our street. Perfect.

      **Narrator B**

      > Snow lay on the window ledge, thick and heavy as wet cement. The plows hadn’t come. Not one car moved on our street. Perfect.
    parts:
      - type: mc
        prompt: Only one comparison is different. Who is each narrator most likely to be?
        choices:
          - A is a child hoping for a snow day. B is a bus driver who has to get to work.
          - A is a bus driver who has to get to work. B is a child hoping for a snow day.
          - A and B are both children hoping for a snow day, since they both say *Perfect*.
          - You can’t tell anything, since almost all of their words are exactly the same.
        answer: 0
        feedback:
          '1': Would someone who has to drive through it think of soft bread dough? Who would think of wet cement?
          '2': Look at the comparisons again. Would you choose *wet cement* for snow that you were glad to see?
          '3': One comparison can give away a lot. How does each narrator feel about that snow?
        hints:
          - Which narrator likes this snow? How can you tell?
        solution:
          - Bread dough is soft and fun to play with. Wet cement is heavy and gets in your way.
          - The same snow feels different because the narrators want different things.
      - type: mc
        prompt: Both narrators end with the word *Perfect*. Narrator B lets out a long sigh before saying it. What does Narrator B mean by it?
        choices:
          - The opposite of what the word says. This is a terrible morning.
          - Just what the word says. The snow looks beautiful this morning.
          - The same as Narrator A. It’s wonderful that nobody can go out.
          - That the plows have done a perfect job of clearing the street.
        answer: 0
        feedback:
          '1': Does someone who sees wet cement on the ledge think that it looks beautiful?
          '2': Who needs the street to be clear? Would that person be glad that no cars can move?
          '3': Read the story again. The plows haven’t come at all.
        hints:
          - Read B’s paragraph aloud in the voice of a tired driver. How does *Perfect* come out?
        solution:
          - After *wet cement*, an unplowed street and a long sigh, *Perfect* can only be a grumble. B means the opposite of the word.
          - The same word carries two moods, because the narrators have two attitudes.
      - type: mc
        prompt: Which sentence could come next for Narrator B, keeping the same mood and **showing** it?
        choices:
          - Somewhere under that white mess was my bus, and all I had was a tiny shovel.
          - Somewhere under that white pile was my sled, and today it was all mine.
          - I felt very grumpy about all of the snow, and I wished that it would melt.
          - The snow on the street was white, and it was about as deep as a chair.
        answer: 0
        feedback:
          '1': That is a happy sled. Whose mood does this belong to?
          '2': It’s the right mood, but it **tells** us with the word *grumpy*. Can a sentence let us see it?
          '3': This only gives facts. Where has B’s attitude gone?
        hints:
          - Which choices sound like B? Of those, which one lets you picture the problem?
        solution:
          - The buried bus and tiny shovel keep B’s grumbling mood, and they let us see it without naming a feeling.
    wrapUp: The setting can stay exactly the same while the mood changes completely. Mood also comes from the attitude of the narrator, and one comparison can give that attitude away.

  - id: d3
    level: 3
    thinking: design
    covers: [K2.5, S2.2, K2.3, S2.1]
    type: open
    prompt: |-
      Treat this line as a **mentor text**.

      > My grandmother has three rules: wipe your boots, say thank you, and never, ever touch the good scissors.

      First, say in a sentence what makes it funny. Then borrow the trick, not the words: write your own line about a different person or a pet.
    hints:
      - Read the three rules. Which one would make you ask a question?
      - What do the first two rules make you expect from the third?
    modelAnswer: |-
      **The trick:** The first two rules are ordinary, so you expect a third ordinary one. Then comes one that is oddly exact, and you wonder what happened to those scissors.

      **Mine:** Our dog is afraid of three things: thunder, the vet, and one particular sock.
    rubric:
      - I said what makes the line funny, such as ordinary things followed by a surprise.
      - The first things in my line are ordinary, and the last one is a surprise.
      - My surprise is something specific that makes a reader wonder.
      - My line has a new subject and my own words.

  - id: d4
    level: 3
    thinking: whatif
    covers: [S2.4, S2.6, K2.6, K2.4]
    type: open
    prompt: |-
      Here is a very boring sentence.

      > A cat walked across the kitchen table.

      Rewrite it twice, using one or two sentences each time. It’s the same cat on the same table. First make it **cozy**. Then make it **spooky**. You may not use any feeling words, such as *cozy*, *spooky* or *afraid*.
    hints:
      - What could you see, hear or touch at that table in each version?
      - Try changing *walked* first. Then change the light in the room.
    modelAnswer: |-
      **Cozy:** Mittens padded across the warm table and curled up beside the toast, purring.

      **Spooky:** Two yellow eyes slid across the dark table. A claw tapped once on the glass, and the purring stopped.
    rubric:
      - Both versions have a cat on a kitchen table.
      - I didn’t name a feeling in either version.
      - Each version has a sensory or specific word that helps set the mood.
      - Without labels, a reader could tell which version is cozy and which is spooky.
