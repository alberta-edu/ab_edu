id: oral-communication
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI2
outcomes: [LANENG5-OI2-GQ1-LO1]
order: 3
title: Speaking with Purpose
shortTitle: Oral communication
summary: >-
  Play with stress, pitch, pace and tone, project your voice across a room, explore oral traditions and
  trickster tales, and work together with respectful dialogue.

bigIdea: |-
  How you say something matters as much as what you say. Speakers design their **words, bodies and
  voices** for their purpose, audience and space. For a very long time, people have used speech to share
  knowledge, hold communities together, and solve problems together.

lesson:
  - title: One sentence, many meanings
    blocks:
      - type: visual
        covers: [K2.4, K2.6, S2.1, U2.1]
        component: voice-lab
        props:
          words: [You, ate, my, sandwich]
          meanings:
            - You did it. I thought it was someone else!
            - You ate it? I thought you only moved it!
            - That sandwich was **mine**, not yours!
            - You ate my sandwich, and not my apple?
        caption: Tap a word to **stress** it, and try each control. The line shows **inflection**, your voice sliding up and down.

  - title: Three kinds of language
    blocks:
      - type: compare
        covers: [K2.1, K2.2, K2.3, K2.4]
        columns:
          - title: 🗣️ Verbal
            body: The **words** you choose and how you use them.
          - title: 🧍 Non-verbal
            body: Your **body**. Choose your movements on purpose. A nod, a step forward or open hands all send a message.
          - title: 🎚️ Paraverbal
            body: How you **deliver** a message. It includes stress, articulation, pace, pitch and tone.
      - type: callout
        variant: tip
        covers: [S2.1, U2.1]
        title: Make them work together
        body: If you say “I’m so happy for you” with your arms crossed and a flat voice, listeners will believe your body and voice. Make all three match.

  - title: Fill the room with your voice
    blocks:
      - type: visual
        covers: [K2.5, S2.2]
        component: voice-reach
        caption: Vocal sounds are affected by **breath, body and energy**. Switch them on and watch the sound reach the back row.

  - title: The room changes your voice
    blocks:
      - type: experiment
        covers: [K3.3, S3.1]
        title: Same voice, different rooms
        question: You say the same sentence at the same speed in a small carpeted classroom and in a big empty gym.
        animation: echo-room
        predict:
          choices:
            - The words stay clear in the classroom but blur in the gym.
            - The words blur in the classroom but stay clear in the gym.
            - The words sound exactly the same in both rooms.
          answer: 0
        observe: In the gym, the sound travels far and bounces back. The **echo** lands on top of your next words. In the small carpeted room, the words stay clear.
        explain: The **size, shape, layout and acoustics** of a space affect how you are heard. In a gym, slow your pace and lift your voice.

  - title: Design it for your listeners
    blocks:
      - type: table
        covers: [K3.1, K3.2, S3.2, S3.3, U3.1]
        caption: 'One piece of news: the class won the science fair. Who is listening, and why?'
        headers: [Audience, Purpose, Format, 'What you might say']
        rows:
          - ['Your best friend', 'To entertain', 'A chat at recess', '“We actually won! You should have seen Sam’s face!”']
          - ['The whole school', 'To inform', 'An announcement', '“Good morning. I am proud to share that Room 12 won first prize.”']
          - ['The Mayor, visiting', 'To persuade', 'A short speech', '“Thank you for coming, Your Worship. Please keep funding the science fair.”']
      - type: callout
        variant: tip
        covers: [K3.4, S3.3, S3.4]
        title: Choose your tools and plan your order
        body: Tools can help, such as a microphone, slides, or a recording. Whatever you choose, present your ideas in a **logical order**, so listeners can follow along.

  - title: Oral traditions
    blocks:
      - type: table
        covers: [K1.1, U1.1]
        caption: Different time periods gave rise to different forms of oral communication.
        headers: [When, Form, Example]
        rows:
          - ['Long before writing', '**Storytelling**', 'Families and communities passing down knowledge by telling stories.']
          - ['Ancient Greece', '**Poetry**', 'Long poems were recited from memory for listeners.']
          - ['Ancient Greece', '**Drama** and **choral speech**', 'Plays where a group, the chorus, spoke or sang together in unison.']
          - ['Ancient Greece and Rome', '**Speeches**', 'Speakers tried to persuade crowds and courts.']
          - ['Today', '**Presentations**', 'Slides in class, podcasts and video speeches.']
      - type: compare
        covers: [K1.3, K1.2, K1.5]
        columns:
          - title: Tales of everyday life
            body: Stories that connect what people already know to what they live each day.
          - title: Sacred stories
            body: Stories that a community holds as holy. Ask that community before you share one.
          - title: Extraordinary experiences
            body: Stories of amazing things that happened to someone.
          - title: Trickster stories
            body: Tales about a clever character who plays tricks, and is sometimes tricked.
      - type: text
        covers: [K1.5, S1.1]
        body: Stories like these hold communities together, because everyone who hears them shares some of the same **knowledge and values**.

  - title: Meet two tricksters
    blocks:
      - type: compare
        covers: [K1.4, S1.1, S1.2]
        columns:
          - title: 🕷️ Anansi (Akan people, Ghana)
            body: |-
              Anansi the spider wants all the stories, held by Nyame, the sky god. The price is to capture a python,
              a leopard and hornets. Small Anansi uses **tricks, not strength**, and wins. The Akan call these
              tales *Anansesem*, “spider stories.”
          - title: 🧓 Napi (Blackfoot people, Alberta)
            body: |-
              Napi, or Old Man, is a trickster in Blackfoot stories. Some of these stories are tied to the land, such as the
              big rock at Okotoks. The collection *Napi: The Trickster*, by Hugh A. Dempsey, shares stories with the
              permission of Blackfoot Elders.
      - type: table
        covers: [K1.4, S1.2]
        caption: Trickster stories can do three things.
        headers: [They can…, In the story of Anansi]
        rows:
          - ['Have human, superhuman and animal characters', 'A spider, a python and a leopard, along with a sky god']
          - ['Teach lessons', 'Cleverness can beat size and strength.']
          - ['Reflect aspects of a culture', 'The spider owns the stories, which shows how much the Akan value storytelling.']

  - title: Talk it out
    blocks:
      - type: visual
        covers: [K4.1, K4.2, K4.3, K4.4, S4.1, S4.2, S4.3, S4.4, U4.1]
        component: talk-it-out
        props:
          turns:
            - speaker: Priya
              says: For our class project, I think we should make a bird feeder for the school yard.
              choices:
                - { text: 'That won’t work. Bird feeders are boring.', good: false, reply: 'Priya looks down and stops talking.', why: 'This shuts down the idea. Disagree with an idea, not with the person, and use respectful language.' }
                - { text: 'I like that birds would get food. Can I add an idea?', good: true, reply: 'Priya smiles. “Sure, go ahead.”', why: 'You **listened and acknowledged** her idea before adding yours. That builds trust.' }
                - { text: '(Say nothing, and look at your phone.)', good: false, reply: 'Priya sighs and turns to someone else.', why: 'Body language counts. Looking away tells her you are not listening.' }
            - speaker: Omar
              says: I disagree. I think a poster about birds would be easier, and everyone could help.
              choices:
                - { text: 'You’re wrong. We’re doing the feeder.', good: false, reply: 'Omar folds his arms. The group goes quiet.', why: 'Nobody can reach agreement when one person decides for everyone.' }
                - { text: 'Good point about everyone helping. I see it differently, because a feeder would last all year.', good: true, reply: 'Omar nods. “OK, that’s true.”', why: 'You **considered his perspective** and disagreed respectfully, with a reason.' }
            - speaker: Maya
              says: "Could we do both? And by the way, please call me Maya, not May."
              choices:
                - { text: 'Sure, May. So what do you think?', good: false, reply: 'Maya frowns.', why: 'Calling people what they ask to be called keeps your relationship strong.' }
                - { text: 'Sorry, Maya! Both could work: we build one feeder, and make a poster to explain it. Is everyone OK with that?', good: true, reply: 'Everyone nods. “Yes, that works!”', why: 'You respected how she wishes to be addressed, stayed **flexible**, and built **consensus**.' }
          ending: 'You reached **consensus**: a plan that the whole group accepts. Everyone gave something up, and everyone gained something.'
        caption: Choose what you say. Watch how the group’s trust changes.
      - type: callout
        variant: tip
        covers: [K4.5, U4.1]
        title: Your voice and body join in, too
        body: A nod, eye contact and a calm tone show you are really listening. Dialogue is **active**. Everyone has a part to play.

keyTerms:
  - term: Verbal
    covers: [K2.2]
    definition: Communication through word choice and use.
  - term: Non-verbal
    covers: [K2.3]
    definition: Communication through body movement.
  - term: Paraverbal
    covers: [K2.4]
    definition: The way a message is delivered, including stress, articulation, pace, pitch and tone.
  - term: Inflection
    covers: [K2.6]
    definition: The way the voice slides up and down through a range of pitches.
  - term: Acoustics
    covers: [K3.3]
    definition: How sound behaves in a space, such as how it echoes.
  - term: Oral tradition
    covers: [K1.2, K1.5]
    definition: Stories and knowledge passed on by speaking, which connect people and hold communities together.
  - term: Trickster
    covers: [K1.4]
    definition: A character in some oral stories who plays clever tricks. The stories can teach lessons and reflect a culture.
  - term: Consensus
    covers: [K4.4]
    definition: An agreement that everyone in a group can accept.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K2.4, S2.1]
    type: mc
    prompt: |-
      You are telling a friend some big news:

      > Dad put a frog in the soup.

      You would have expected this from your little brother, but not from Dad! Which word do you **stress**?
    choices:
      - “**Dad** put a frog in the soup.”
      - “Dad **put** a frog in the soup.”
      - “Dad put a **frog** in the soup.”
      - “Dad put a frog in the **soup**.”
    answer: 0
    feedback:
      '1': This makes it sound as if he placed it there on purpose, rather than dropping it. What is the surprise in this story?
      '2': This says you’re surprised by **what** went in. Maybe you expected a carrot. What is the surprise in this story?
      '3': This says you’re surprised by **where** it went. Maybe you expected the pond. What is the surprise in this story?
    hints:
      - What part of the news surprises you the most? Who, what or where?
      - Try saying the sentence out loud four ways, leaning on a different word each time.
    solution:
      - Stress points at the part of the message that matters most.
      - The surprise is about **who** did it, so you lean on *Dad*.

  - id: w2
    level: 1
    thinking: notice
    covers: [K2.1, K2.2, K2.3, K2.4]
    type: mc
    prompt: Nasrin practises her speech and makes one change each time. Which change is to her **paraverbal** language?
    choices:
      - She slows right down for her last sentence.
      - She swaps the word *big* for *enormous*.
      - She walks out to the front of the stage.
      - She opens her hands wide when she finishes.
    answer: 0
    feedback:
      '1': That changes her word choice, so it is verbal. Which change is about how the words are delivered?
      '2': That is her body moving, so it is non-verbal. Which change could you hear with your eyes shut, even if the words stayed the same?
      '3': That is her body again, so it is non-verbal. Which change could you hear with your eyes shut, even if the words stayed the same?
    hints:
      - Imagine you can hear Nasrin but can’t see her, and the words stay the same. Which change would you notice?
    solution:
      - Sort each change into words, body or voice.
      - The word swap is verbal, and the walk and the open hands are non-verbal. Slowing down keeps the same words but delivers them differently. Pace is **paraverbal**.

  - id: w3
    level: 1
    thinking: notice
    covers: [K2.4, K2.6]
    type: mc
    figure: >-
      <svg viewBox="0 0 400 130" class="fig-svg" role="img" aria-label="Two pitch lines for the words It’s raining. Speaker A’s line stays low and level, then slides up at the end. Speaker B’s line starts high and slides down at the end.">
      <text class="fig-label" x="10" y="20">Speaker A</text>
      <polyline class="cg-axis" fill="none" points="10,84 110,84 180,34"/>
      <text class="fig-small" x="50" y="118">It’s raining</text>
      <text class="fig-label" x="220" y="20">Speaker B</text>
      <polyline class="cg-axis" fill="none" points="220,34 320,34 390,84"/>
      <text class="fig-small" x="260" y="118">It’s raining</text>
      </svg>
    prompt: Each line shows the **inflection** of a voice saying the same two words. Which speaker sounds as if they are asking a question?
    choices: [Speaker A, Speaker B, Both speakers]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Try it out loud. Let your voice slide down at the end of “It’s raining.” Does that sound like asking, or telling?
      '2': The words are the same, but are the lines the same? Say each one out loud, following the line with your voice.
    hints:
      - Say the words out loud and let your voice follow each line.
    solution:
      - Inflection is the voice sliding up and down. Try each line with your own voice.
      - When Speaker A’s voice slides **up** at the end, it sounds like “It’s raining?” Speaker B slides down, so it sounds like “It’s raining.”

  - id: w4
    level: 1
    thinking: flaw
    covers: [K2.5, S2.2]
    type: mc
    prompt: Bram’s voice isn’t reaching the back row. He stands bent over his notes, takes tiny breaths, and his sentences fade away at the end. What would help the most?
    choices:
      - Stand tall, take a full breath, and put energy into every word.
      - Shout as hard as he can, while he keeps his eyes on his notes.
      - Speak faster, so that he has fewer of those tiny breaths to take.
      - Hold his notes up higher, so that they cover more of his face.
    answer: 0
    feedback:
      '1': Shouting into a page sends the sound down and makes his throat sore. Look at the three things going wrong.
      '2': Fast words on tiny breaths would fade away even sooner. What does his voice need more of?
      '3': Then his voice would hit the paper. Where should his voice be going?
    hints:
      - Look at how he stands, how he breathes, and how his sentences end. Which three switches did you turn on in the classroom picture?
    solution:
      - Match each problem to a fix. Bent over means **body**. Tiny breaths mean **breath**. Fading sentences mean **energy**.
      - Vocal sounds are affected by all three. So Bram doesn’t need a bigger shout. He needs to use them together.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: connect
    covers: [K3.3, S3.1]
    type: mc
    prompt: |-
      In the gym, Tia learned to slow down and lift her voice, because the echo landed on her next words.

      Now she has to give the same talk outside, on a snowy field. There are no walls to make an echo, but the wind carries her voice away. What should she do?
    choices:
      - Keep lifting her voice, but she no longer has to slow down for an echo.
      - Keep slowing down, because the echo will bounce back off all the snow.
      - Drop her voice, because without an echo it will sound much too loud.
      - Change nothing, because a good talk works the same way in every space.
    answer: 0
    feedback:
      '1': The story says there are no walls to make an echo. Which of her two reasons has gone away?
      '2': With wind carrying her voice away, will it sound too loud or too quiet at the far side of the field?
      '3': In the experiment, the same voice sounded different in two rooms. Is a windy field more like a gym, or something new?
    hints:
      - Tia did two things in the gym. What was the reason for each one?
      - For each thing she did, ask if the reason is still true outside.
    solution:
      - Don’t just copy the gym advice. Ask why it worked.
      - Slowing down was for the echo, and there is no echo now. Lifting her voice was to reach everyone, and the wind makes that even harder.
      - The space is part of the talk. When the space changes, check your reasons again.

  - id: b2
    level: 2
    thinking: model
    covers: [K3.1, K3.4, S3.3]
    type: mc
    prompt: Odalys wants to teach the Grade 2 class how to tie their skate laces, but she can’t be in their classroom. They do have one big screen. Which format should she choose?
    choices:
      - A short video, with close-ups of her hands as she ties
      - A sound recording, in which she explains every step
      - A few slides of long sentences, describing each step
      - A morning announcement, read out over the speakers
    answer: 0
    feedback:
      '1': Her voice would come through. But how would you explain a loop with words alone to a seven-year-old with a lace in hand?
      '2': The screen would work. But think about who is reading it, and how easy it is to read about a knot.
      '3': Everybody would hear it. But could the Grade 2s stop it, or see what she means?
    hints:
      - Who is the audience? What do they need to do when it is over?
      - What is the hardest part of tying a lace to explain? What would make it easier?
    solution:
      - Start with the audience and purpose. Young children need to **do** something with their hands.
      - Tying a knot is much easier to show than to describe. A video lets them see her hands, even though she isn’t in the room.

  - id: b3
    level: 2
    thinking: why
    covers: [K1.2, K1.3, K1.5, S1.2]
    type: mc
    prompt: |-
      Every winter, Aunt Lupe tells how the family car got stuck in a snowbank, and everybody pushed, even the baby. Everyone knows the ending, and they all shout the last line together. And now, nobody in the family leaves home in winter without a shovel.

      Why do they keep telling a story they already know?
    choices:
      - It reminds them of what they have learned and what they share.
      - They keep forgetting how it ended, so it has to be told again.
      - They want to check who can remember the most exact details.
      - They need to decide who was to blame for getting the car stuck.
    answer: 0
    feedback:
      '1': They all shout the last line, so does it sound as if they forgot?
      '2': Do they sound as if they’re taking a test? Look at what they do at the end.
      '3': Does anyone sound upset? Everybody pushed, even the baby.
    hints:
      - What does the family do together at the end of the story?
      - Look at the last sentence. What has the story changed in their lives?
    solution:
      - It isn’t for the news, since everyone already knows it. So look at what the telling does.
      - The shovel connects the story to how they live now. Shouting the last line together shows they belong to the same group.
      - This is a tale of everyday life. On a bigger scale, shared stories like these hold whole communities together, through their **shared knowledge and values**.

  - id: b4
    level: 2
    thinking: whatif
    covers: [K1.4, S1.1, S1.2]
    type: mc
    prompt: Suppose someone retold the story of Anansi with a huge lion instead of a tiny spider. The lion fights the python and the leopard, and wins all the stories. What would be lost?
    choices:
      - The lesson that cleverness can beat size and strength
      - The sky god, Nyame, who holds all of the stories
      - The python and leopard that have to be captured
      - The stories, which are what the hero is trying to win
    answer: 0
    feedback:
      '1': Nyame could still be in this retelling. Which part of the story depends on the hero being small?
      '2': The python and the leopard are still there, in the new telling. What is different about how they get beaten?
      '3': The lion still wins them, so they are still the prize. What is different about **how** he wins?
    hints:
      - Which things are still in the new telling? Cross those out.
      - Why does it matter that Anansi is small?
    solution:
      - Most of the story is still there. There is still a god, the animals and the prize.
      - But a huge lion beating animals by fighting is no surprise. The lesson comes from a **small** hero who uses **tricks, not strength**.
      - In a trickster story, the character and the lesson are tied together.

  - id: b5
    level: 2
    thinking: decide
    covers: [K1.3, K3.2, S1.1, S3.2, U1.1]
    type: mc
    prompt: |-
      Imagine that your class finds a Blackfoot story about the big rock at Okotoks on a website, and wants to act it out at the school assembly. The Government of Alberta calls the rock “a historical site of great spiritual significance to the Blackfoot peoples.”

      What should the class do first?
    choices:
      - Find out from Blackfoot Elders if it can be shared, and how.
      - Perform it, since anything on a website is free to retell.
      - Change some of the details, so that it belongs to the class.
      - Perform it in a smaller room, so that fewer people will hear.
    answer: 0
    feedback:
      '1': Being easy to find isn’t the same as being free to perform. Whose story is this?
      '2': Changing a story that may be holy to the people it comes from could hurt more, not less. Whose story is it?
      '3': A smaller room is still a performance. Who would know if this is all right?
    hints:
      - Whose story is this? Who would know how it should be shared?
    solution:
      - This story comes from the Blackfoot peoples, and it is about a place that has great spiritual significance to them. It may be a sacred story, one that a community holds as holy. A website can’t tell you that.
      - 'Blackfoot Elders would know. The book *Napi: The Trickster* uses Blackfoot stories by permission of Blackfoot Elders, so a careful class would ask too. The answer may be yes, or it may be no.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K4.1, K4.2, K4.4, K4.5, S4.1, S4.2, S4.3, S4.4, U4.1]
    type: investigation
    prompt: |-
      Three friends are planning a booth for the school fair.

      > **Ivy:** So we’re doing a ring toss. Everyone OK?
      >
      > **Sanjit:** Yes!
      >
      > **Mo:** (looking at the floor, with a shrug and a flat voice) Sure.

      Ivy writes “**Consensus!**” at the top of the plan.
    parts:
      - type: mc
        prompt: Does this group really have consensus?
        choices:
          - Not yet, because Mo’s body and voice don’t match what the word says.
          - Yes, because every person in the group has now said they agree.
          - Yes, because two out of three is enough to make it a consensus.
          - Not yet, because Ivy should have asked them to take a secret vote.
        answer: 0
        feedback:
          '1': Every person did say a yes word. But would you believe that “Sure” if you were sitting beside Mo?
          '2': Consensus is an agreement that **everyone** can accept. Two out of three leaves someone out.
          '3': A vote could tell you how many agree. Would it tell you how to reach a plan that Mo can accept?
        hints:
          - Listen to Mo’s “Sure” in your head. Now look at what Mo’s body is doing.
        solution:
          - Mo’s word says yes. The shrug, the floor and the flat voice all say something else.
          - Non-verbal and paraverbal language are part of the dialogue. Ivy read only the word.
      - type: mc
        prompt: What is Ivy’s best next line?
        choices:
          - “Mo, you seem unsure. What would you change about it?”
          - “Mo, you said sure, so you can’t change your mind now.”
          - “Mo, don’t be like that. A ring toss will be really fun.”
          - “OK, then we’ll do whatever Mo wants, to keep everyone happy.”
        answer: 0
        feedback:
          '1': That holds Mo to the word and ignores the shrug. Will Mo trust Ivy any more after hearing that?
          '2': That tells Mo how to feel and doesn’t ask what Mo thinks. Who is doing the listening here?
          '3': Being flexible is good, but what about Sanjit and Ivy? Everyone needs to be able to accept the plan.
        hints:
          - What does Ivy still not know? Which line would help her find out?
        solution:
          - Ivy doesn’t yet know what is bothering Mo. A respectful question invites Mo to say so.
          - Listening comes before fixing. It also builds trust, because Mo can see that Ivy noticed.
      - type: open
        prompt: |-
          Now they talk.

          > **Mo:** I wanted people to make something, not just throw things.
          >
          > **Sanjit:** But a ring toss is cheap, and it’s easy to set up.

          You are Ivy. **Write what you say next.** Show that you heard them both, and suggest a plan that could work for the whole group.
        modelAnswer: |-
          “Mo, making something would be more fun for people, and Sanjit, you’re right that we can’t spend much. What if kids decorate their own paper ring first, and then toss it? It’s still cheap, and they get to make something. Does that work for everybody?”
        rubric:
          - I acknowledged what Mo said and what Sanjit said.
          - I used respectful language.
          - My plan includes something from each of them.
          - I checked that the whole group can accept it.
        hints:
          - What does each friend care about most? Make a short list.
          - Can you keep both things on the list by changing the booth a little?
    wrapUp: Consensus isn’t a word on a plan. You have to listen to more than the words, ask, and be willing to change. Then everyone can really say yes.

  - id: d2
    level: 3
    thinking: design
    covers: [K1.4, S1.2]
    type: open
    prompt: |-
      Invent a trickster of your own, for your school, your rink or your town. Make up someone new, and don’t retell a story from a real tradition.

      In **three or four sentences**, tell who your trickster is and what trick they play. Then say what lesson listeners could take from it, and one thing it shows about your community.
    modelAnswer: |-
      Pockets the magpie lives behind our rink’s snack hut. The big crows always get the dropped fries, so Pockets tells them there are free fries at the far end of the parking lot. While they fly away, she eats her fill.

      The lesson is that you can win with your head when you aren’t the biggest. It also shows that in our town, everybody goes to the rink.
    rubric:
      - My trickster is a human, superhuman or animal character I made up.
      - My story has a clever trick in it.
      - I said what lesson listeners could take from it.
