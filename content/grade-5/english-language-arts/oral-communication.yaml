id: oral-communication
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI2
outcomes: [LANENG5-OI2-GQ1-LO1]
order: 3
title: Speaking with Purpose
shortTitle: Oral communication
summary: >-
  Play with stress, pitch, pace and tone, project your voice across a room, explore oral traditions and
  trickster tales, and work together with respectful dialogue.

bigIdea: |-
  How you say something matters as much as what you say. Speakers design their **words, bodies and
  voices** for their purpose, audience and space. For a very long time, people have used speech to share
  knowledge, hold communities together, and solve problems together.

lesson:
  - title: One sentence, many meanings
    blocks:
      - type: visual
        covers: [K2.4, K2.6, S2.1, U2.1]
        component: voice-lab
        props:
          words: [You, ate, my, sandwich]
          meanings:
            - You did it. I thought it was someone else!
            - You ate it? I thought you only moved it!
            - That sandwich was **mine**, not yours!
            - You ate my sandwich, and not my apple?
        caption: Tap a word to **stress** it, and try each control. The line shows **inflection**, your voice sliding up and down.

  - title: Three kinds of language
    blocks:
      - type: compare
        covers: [K2.1, K2.2, K2.3, K2.4]
        columns:
          - title: 🗣️ Verbal
            body: The **words** you choose and how you use them.
          - title: 🧍 Non-verbal
            body: Your **body**. Choose your movements on purpose. A nod, a step forward or open hands all send a message.
          - title: 🎚️ Paraverbal
            body: How you **deliver** a message. It includes stress, articulation, pace, pitch and tone.
      - type: callout
        variant: tip
        covers: [S2.1, U2.1]
        title: Make them work together
        body: If you say “I’m so happy for you” with your arms crossed and a flat voice, listeners will believe your body and voice. Make all three match.

  - title: Fill the room with your voice
    blocks:
      - type: visual
        covers: [K2.5, S2.2]
        component: voice-reach
        caption: Vocal sounds are affected by **breath, body and energy**. Switch them on and watch the sound reach the back row.

  - title: The room changes your voice
    blocks:
      - type: experiment
        covers: [K3.3, S3.1]
        title: Same voice, different rooms
        question: You say the same sentence at the same speed in a small carpeted classroom and in a big empty gym.
        animation: echo-room
        predict:
          choices:
            - The words stay clear in the classroom but blur in the gym.
            - The words blur in the classroom but stay clear in the gym.
            - The words sound exactly the same in both rooms.
          answer: 0
        observe: In the gym, the sound travels far and bounces back. The **echo** lands on top of your next words. In the small carpeted room, the words stay clear.
        explain: The **size, shape, layout and acoustics** of a space affect how you are heard. In a gym, slow your pace and lift your voice.

  - title: Design it for your listeners
    blocks:
      - type: table
        covers: [K3.1, K3.2, S3.2, S3.3, U3.1]
        caption: 'One piece of news: the class won the science fair. Who is listening, and why?'
        headers: [Audience, Purpose, Format, 'What you might say']
        rows:
          - ['Your best friend', 'To entertain', 'A chat at recess', '“We actually won! You should have seen Sam’s face!”']
          - ['The whole school', 'To inform', 'An announcement', '“Good morning. I am proud to share that Room 12 won first prize.”']
          - ['The Mayor, visiting', 'To persuade', 'A short speech', '“Thank you for coming, Your Worship. Please keep funding the science fair.”']
      - type: callout
        variant: tip
        covers: [K3.4, S3.3, S3.4]
        title: Choose your tools and plan your order
        body: Tools can help, such as a microphone, slides, or a recording. Whatever you choose, present your ideas in a **logical order**, so listeners can follow along.

  - title: Oral traditions
    blocks:
      - type: table
        covers: [K1.1, U1.1]
        caption: Different time periods gave rise to different forms of oral communication.
        headers: [When, Form, Example]
        rows:
          - ['Long before writing', '**Storytelling**', 'Families and communities passing down knowledge by telling stories.']
          - ['Ancient Greece', '**Poetry**', 'Long poems were recited from memory for listeners.']
          - ['Ancient Greece', '**Drama** and **choral speech**', 'Plays where a group, the chorus, spoke or sang together in unison.']
          - ['Ancient Greece and Rome', '**Speeches**', 'Speakers tried to persuade crowds and courts.']
          - ['Today', '**Presentations**', 'Slides in class, podcasts and video speeches.']
      - type: compare
        covers: [K1.3, K1.2, K1.5]
        columns:
          - title: Tales of everyday life
            body: Stories that connect what people already know to what they live each day.
          - title: Sacred stories
            body: Stories that a community holds as holy. Many communities share them only in certain ways.
          - title: Extraordinary experiences
            body: Stories of amazing things that happened to someone.
          - title: Trickster stories
            body: Tales about a clever character who plays tricks, and is sometimes tricked.
      - type: text
        covers: [K1.5, S1.1]
        body: Stories like these hold communities together, because everyone who hears them shares some of the same **knowledge and values**.

  - title: Meet two tricksters
    blocks:
      - type: compare
        covers: [K1.4, S1.1, S1.2]
        columns:
          - title: 🕷️ Anansi (Akan people, Ghana)
            body: |-
              Anansi the spider wants all the stories, held by Nyame, the sky god. The price is to capture a python,
              a leopard and hornets. Small Anansi uses **tricks, not strength**, and wins. The Akan call these
              tales *Anansesem*, “spider stories.”
          - title: 🧓 Napi (Blackfoot people, Alberta)
            body: |-
              Napi, or Old Man, is a trickster in Blackfoot stories. Some of these stories are tied to the land, such as the
              big rock at Okotoks. A published collection, *Napi: The Trickster*, shares stories with the
              permission of Blackfoot Elders.
      - type: table
        covers: [K1.4, S1.2]
        caption: Trickster stories can do three things.
        headers: [They can…, In the story of Anansi]
        rows:
          - ['Have human, superhuman and animal characters', 'A spider, a python and a leopard, along with a sky god']
          - ['Teach lessons', 'Cleverness can beat size and strength.']
          - ['Reflect aspects of a culture', 'The spider owns the stories, which shows how much the Akan value storytelling.']

  - title: Talk it out
    blocks:
      - type: visual
        covers: [K4.1, K4.2, K4.3, K4.4, S4.1, S4.2, S4.3, S4.4, U4.1]
        component: talk-it-out
        props:
          turns:
            - speaker: Priya
              says: For our class project, I think we should make a bird feeder for the school yard.
              choices:
                - { text: 'That won’t work. Bird feeders are boring.', good: false, reply: 'Priya looks down and stops talking.', why: 'This shuts down the idea. Disagree with an idea, not with the person, and use respectful language.' }
                - { text: 'I like that birds would get food. Can I add an idea?', good: true, reply: 'Priya smiles. “Sure, go ahead.”', why: 'You **listened and acknowledged** her idea before adding yours. That builds trust.' }
                - { text: '(Say nothing, and look at your phone.)', good: false, reply: 'Priya sighs and turns to someone else.', why: 'Body language counts. Looking away tells her you are not listening.' }
            - speaker: Omar
              says: I disagree. I think a poster about birds would be easier, and everyone could help.
              choices:
                - { text: 'You’re wrong. We’re doing the feeder.', good: false, reply: 'Omar folds his arms. The group goes quiet.', why: 'Nobody can reach agreement when one person decides for everyone.' }
                - { text: 'Good point about everyone helping. I see it differently, because a feeder would last all year.', good: true, reply: 'Omar nods. “OK, that’s true.”', why: 'You **considered his perspective** and disagreed respectfully, with a reason.' }
            - speaker: Maya
              says: "Could we do both? And by the way, please call me Maya, not May."
              choices:
                - { text: 'Sure, May. So what do you think?', good: false, reply: 'Maya frowns.', why: 'Calling people what they ask to be called keeps your relationship strong.' }
                - { text: 'Sorry, Maya! Both could work: we build one feeder, and make a poster to explain it. Is everyone OK with that?', good: true, reply: 'Everyone nods. “Yes, that works!”', why: 'You respected how she wishes to be addressed, stayed **flexible**, and built **consensus**.' }
          ending: 'You reached **consensus**: a plan that the whole group accepts. Everyone gave something up, and everyone gained something.'
        caption: Choose what you say. Watch how the group’s trust changes.
      - type: callout
        variant: tip
        covers: [K4.5, U4.1]
        title: Your voice and body join in, too
        body: A nod, eye contact and a calm tone show you are really listening. Dialogue is **active**. Everyone has a part to play.

keyTerms:
  - term: Verbal
    covers: [K2.2]
    definition: Communication through word choice and use.
  - term: Non-verbal
    covers: [K2.3]
    definition: Communication through body movement.
  - term: Paraverbal
    covers: [K2.4]
    definition: The way a message is delivered, including stress, articulation, pace, pitch and tone.
  - term: Inflection
    covers: [K2.6]
    definition: The way the voice slides up and down through a range of pitches.
  - term: Acoustics
    covers: [K3.3]
    definition: How sound behaves in a space, such as how it echoes.
  - term: Oral tradition
    covers: [K1.2, K1.5]
    definition: Stories and knowledge passed on by speaking, which connect people and hold communities together.
  - term: Trickster
    covers: [K1.4]
    definition: A character in some oral stories who plays clever tricks. The stories can teach lessons and reflect a culture.
  - term: Consensus
    covers: [K4.4]
    definition: An agreement that everyone in a group can accept.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [K2.1, K2.4]
    type: mc
    prompt: Sam speaks **very fast** when he gets nervous. What kind of language is this?
    choices: [Paraverbal, Verbal, Non-verbal]
    fixedOrder: true
    answer: 0
    feedback:
      '1': Verbal means the words he chooses. Speed is about how he delivers them.
      '2': Non-verbal means the body. Pace comes from the voice.
    hints:
      - Is this about his words, his body or his voice?
    solution:
      - Pace is part of how a message is delivered, so it is **paraverbal**.

  - id: w2
    level: 1
    covers: [K2.6]
    type: mc
    prompt: What is **inflection**?
    choices:
      - The voice sliding up and down through a range of pitches
      - The words a speaker chooses
      - How loudly a crowd claps
      - Standing up straight
    answer: 0
    feedback:
      '1': That is verbal language.
      '2': That is the audience, not the speaker’s voice.
      '3': That is the body. Inflection is in the voice.
    hints:
      - Remember the line in the voice lab that rose and fell.
    solution:
      - Inflection is the voice **sliding up and down** through a range of pitches.

  - id: w3
    level: 1
    covers: [K2.5, S2.2]
    type: multi
    prompt: Which things help your voice be heard across a room?
    choices: [Breath, Body, Energy, Mumbling, Looking at the floor]
    fixedOrder: true
    answer: [0, 1, 2]
    feedback:
      '3': Mumbling blurs your sounds, so they are harder to hear.
      '4': Looking at the floor sends your voice down, not out to your listeners.
    hints:
      - Think about the three switches in the classroom picture.
    solution:
      - Vocal sounds are affected by **breath, body and energy**.

  - id: w4
    level: 1
    covers: [K1.4]
    type: multi
    prompt: What can **trickster stories** do?
    choices: [Teach lessons, Reflect aspects of a culture, Have human or animal characters, Only tell facts about science]
    fixedOrder: true
    answer: [0, 1, 2]
    feedback:
      '3': Trickster stories are told to teach and to share culture. They are not science reports.
    hints:
      - Remember Anansi’s story. What did it do?
    solution:
      - They can have human, superhuman and animal characters, teach lessons, and reflect aspects of a culture.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [K2.4, S2.1]
    type: mc
    prompt: |-
      Which version means “It wasn’t **me** who took it, it was somebody else”?
    choices:
      - “**I** didn’t take your pen.”
      - “I didn’t take **your** pen.”
      - “I didn’t take your **pen**.”
      - “I **didn’t** take your pen, did I?”
    answer: 0
    feedback:
      '1': Here the stress says it wasn’t **your** pen I took. Maybe I took someone else’s.
      '2': Here the stress says I took something else, not your pen.
      '3': This stress just strongly denies it. It doesn’t point to anyone else.
    hints:
      - Stress the word that tells **who**.
    solution:
      - Stressing “I” points to the person, so it suggests that somebody else did it.

  - id: b2
    level: 2
    covers: [K3.3, S3.1]
    type: mc
    prompt: You must give a talk in a big gym that echoes. What should you do?
    choices:
      - Slow down and project your voice.
      - Speak faster so you finish before the echo.
      - Speak more softly to avoid echoes.
      - Turn your back to the crowd.
    answer: 0
    feedback:
      '1': Faster words pile up on their own echoes, which makes them harder to understand.
      '2': In a big room, a soft voice may never reach the back row.
      '3': Facing away sends your voice toward the wall, not your listeners.
    hints:
      - What happened to the words in the gym in the experiment?
    solution:
      - Echoes land on your next words. A **slower pace** leaves room for them, and **projecting** reaches the back.

  - id: b3
    level: 2
    covers: [K3.1, K3.2, S3.2]
    type: mc
    prompt: Which is the best way to **greet the mayor** when she visits your school assembly?
    choices:
      - “Good morning, Your Worship. Welcome to our school.”
      - “Hey, what’s up?”
      - “Yo, Mayor, you’re late!”
      - (Wave and say nothing.)
    answer: 0
    feedback:
      '1': That could work for a friend at recess. An assembly calls for more formal language.
      '2': This is not respectful, and it may embarrass the guest.
      '3': A wave is friendly, but at an assembly a guest expects spoken words of welcome.
    hints:
      - Language conventions change with the audience and purpose.
    solution:
      - A public welcome to a guest calls for **respectful, formal** language.

  - id: b4
    level: 2
    covers: [S3.3, K3.4, S3.4]
    type: mc
    prompt: You want to teach Grade 2 students how a bird feeder works. Which format fits **best**?
    choices:
      - A short demonstration with a real feeder and pictures
      - A long speech with no pictures
      - A list of bird names read out at top speed
      - A whispered talk from the back of the room
    answer: 0
    feedback:
      '1': Young listeners find long speeches hard. Showing helps them follow along.
      '2': This doesn’t explain how a feeder works, and it is too fast to follow.
      '3': They couldn’t hear you or see you.
    hints:
      - Think about who is listening and what you want them to learn.
    solution:
      - A **demonstration** with real objects suits young listeners and the purpose of informing them.

  - id: b5
    level: 2
    covers: [K1.2, K1.5, S1.1]
    type: mc
    prompt: How do **oral traditions** help hold a community together?
    choices:
      - People who hear the stories share some of the same knowledge and values.
      - Everyone must tell the same joke every day.
      - The stories stop people from talking to other communities.
      - They replace the need for food and shelter.
    answer: 0
    feedback:
      '1': Oral traditions are about more than jokes, and they aren’t rules.
      '2': They don’t keep people apart. They give people something in common.
      '3': Stories are important, but they don’t replace basic needs.
    hints:
      - What do listeners have in common after hearing the same stories?
    solution:
      - Shared stories give people **shared knowledge and values**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [S4.2, S4.3, K4.2]
    type: mc
    prompt: Your friend suggests holding the bake sale at lunch. You think after school is better. What is the most **respectful** way to disagree?
    choices:
      - “I can see why lunch is handy. I’d choose after school, because more parents can come.”
      - “That’s a terrible idea.”
      - “Fine, whatever you want,” while you roll your eyes.
      - “Everyone knows after school is better.”
    answer: 0
    feedback:
      '1': This attacks the idea and gives no reason.
      '2': The words agree, but your body and tone say something else.
      '3': This claims everyone agrees and gives no reason. It ignores your friend’s view.
    hints:
      - Acknowledge your friend’s idea, then give your reason.
    solution:
      - It **acknowledges** the friend’s perspective, then **disagrees with a reason** in respectful language.

  - id: d2
    level: 3
    covers: [S4.4, K4.4]
    type: mc
    prompt: 'Half your group wants a skit and half wants a poster. Time is short. Which choice shows **adaptability** that builds consensus?'
    choices:
      - Suggest a short skit, with a poster that the actors hold up.
      - Vote once, and tell the losers to stop complaining.
      - Do nothing until the teacher decides.
      - Split up, and make two projects that have nothing to do with each other.
    answer: 0
    feedback:
      '1': A vote may decide it, but telling people to stop complaining doesn’t build agreement.
      '2': That leaves your group out of the decision.
      '3': Then there’s no shared plan, and that’s the opposite of consensus.
    hints:
      - Look for an idea that both sides could accept.
    solution:
      - Combining the ideas lets each side **compromise**, and everyone can accept the plan.

  - id: d3
    level: 3
    covers: [K1.4, S1.2, U1.1]
    type: mc
    prompt: 'Anansi, a tiny spider, wins all the stories by using tricks. What **lesson** could listeners take from this?'
    choices:
      - You don’t have to be the biggest to succeed. Clever thinking can win.
      - Spiders are the strongest animals in the world.
      - You should always trust a stranger’s plan.
      - Stories have no value.
    answer: 0
    feedback:
      '1': The story says the opposite. Anansi is small, and he doesn’t rely on strength.
      '2': The python and the leopard in the story trusted Anansi, and they got caught!
      '3': Anansi works very hard to win them, and the Akan named their tales after him. Stories are valuable.
    hints:
      - Compare Anansi’s size with the animals that he captures.
    solution:
      - A small spider beats a python and a leopard using **wits**. Size isn’t everything.

  - id: d4
    level: 3
    covers: [S2.1, S3.1, S3.4, K3.1]
    type: open
    prompt: |-
      You have one minute to **persuade** your class to join a new club. Write what you would say, in a logical
      order. Then add notes on how you will use your **body** and your **voice**.
    modelAnswer: |-
      “Do you ever wish you could build your own video game? Join Code Club! First, you learn with friends, so no one gets
      stuck alone. Second, it’s free, and it meets on Wednesdays at lunch. Sign up today at Room 12!”

      Body: stand tall, look across the room, and use open hands. Voice: start with a rising question, stress “free,” and
      slow down for the room number.
    rubric:
      - I opened by catching people’s attention.
      - My reasons came in a logical order.
      - I ended by saying what to do next.
      - I included notes for my body and my voice.
