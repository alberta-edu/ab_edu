id: writing-process
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 8
title: The Writing Process and Strong Paragraphs
shortTitle: Writing process
summary: >-
  Follow one piece of writing from plan to publication, build paragraphs with topic sentences and
  transitions, see the rhythm of your sentences, and choose the right tools.

bigIdea: |-
  - Nobody writes a great piece in one try.
  - The **writing process** breaks the work into manageable chunks: **planning, drafting, revising, editing and publishing**.
  - So you can focus on one thing at a time.

lesson:
  - title: One piece, five stages
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.3, K1.8, S1.3, S1.7, S1.8, S1.9]
        component: writing-path
        props:
          stages:
            - icon: 🗺️
              label: Plan
              job: Think about your audience, purpose and form. Generate ideas, then narrow the topic.
              page: |-
                **Audience:** my town council. **Purpose:** to persuade. **Form:** a letter.

                **Ideas:** new playground? longer library hours? a bike path?

                **Narrowed topic:** a safe bike path to school
            - icon: ✏️
              label: Draft
              job: Get your ideas down. Don’t stop to fix anything yet.
              page: |-
                we need a bike path. i ride my bike to school and it is scary. the cars go by really fast and it is scary. also i like bikes. A bike path would be good.
            - icon: 🔧
              label: Revise
              job: Add or remove words, phrases or sentences, to make it clear and focused.
              page: |-
                we need a bike path ++on Centre Street++. i ride my bike to school ~~and it is scary~~. ++Last week, a truck passed so close that my handlebars shook.++ ~~the cars go by really fast and it is scary. also i like bikes.~~ A bike path would ~~be good~~ ++keep students safe++.
            - icon: 🔍
              label: Edit
              job: Fix spelling, punctuation and grammar.
              page: |-
                ~~w~~++W++e need a bike path on Centre Street. ~~i~~++I++ ride my bike to school. Last week, a truck passed so close that my handlebars shook. A bike path would keep students safe.
            - icon: 🚀
              label: Publish
              job: Choose your final form, and add graphics, captions or charts that support your purpose.
              page: |-
                ### A Safe Path to School

                We need a bike path on Centre Street. I ride my bike to school. Last week, a truck passed so close that my handlebars shook. A bike path would keep students safe.

                *🚲 Map: where the path would go, from Centre Street to the school.*
        caption: Tap each stage. In Revise and Edit, **red** words are cut and **green** words are new.
      - type: callout
        variant: tip
        covers: [K1.1, U1.1]
        title: One job at a time
        body: Trying to get ideas, spelling and punctuation right all at once is really hard. Doing them one at a time leaves room for artistry, and your writing can even change minds.

  - title: Build a paragraph
    blocks:
      - type: example
        covers: [K1.4, K1.5, S1.5]
        title: The parts of a strong paragraph
        problem: Look at how each sentence does its job.
        steps:
          - '**Topic sentence (the lead):** Centre Street isn’t safe for students on bikes.'
          - '**Detail:** The cars there go up to 60 kilometres an hour.'
          - '**Transition + detail:** *In addition,* the road has no space between the cars and the curb.'
          - '**Transition + detail:** *Most importantly,* a truck almost hit me last week.'
          - '**Concluding sentence:** A bike path would solve all of these problems.'
      - type: callout
        variant: tip
        covers: [K1.4, S1.5]
        title: Choose an order
        body: Put details in order of **sequence** (first, next, last) or of **importance** (save the strongest for last). **Transitions** like *in addition* and *however* link your ideas.

  - title: Several paragraphs, one position
    blocks:
      - type: table
        covers: [S1.4, S1.6, S1.1, S1.2]
        caption: A longer piece has an introduction, supporting evidence and a conclusion.
        headers: [Paragraph, Its job, In the bike path letter]
        rows:
          - ['1. **Introduction**', 'Give the topic and your position.', 'Centre Street needs a bike path.']
          - ['2. **Evidence**', 'Support your position with relevant facts.', 'Cars go up to 60 km/h. There is no shoulder.']
          - ['3. **Evidence**', 'Give another reason.', 'More students would ride, and there would be less traffic.']
          - ['4. **Conclusion**', 'Remind readers of your position.', 'Please build the path this year.']
      - type: callout
        variant: mistake
        covers: [S1.6]
        title: Stay on the evidence
        body: “I like bikes” isn’t evidence that a path is needed. Keep what supports your position, and cut the rest.

  - title: Hear the rhythm
    blocks:
      - type: visual
        covers: [K1.6, K1.7, S1.7]
        component: sentence-rhythm
        props:
          examples:
            - label: Choppy
              text: I ride to school. I take Centre Street. The cars go fast. It feels scary. I want a path.
            - label: Flowing
              text: Every morning, I ride my bike down Centre Street to school. The cars go fast. Last week, a truck passed so close that my handlebars shook, and I had to stop at the curb to catch my breath. We need a path.
        caption: Each bar is one sentence. **Change the sentences** or write your own, and watch the bars change.

  - title: Choose your tool
    blocks:
      - type: compare
        covers: [K4.1, K4.2, S4.3]
        columns:
          - title: ✏️ Printing
            body: Clear and easy to read. Great for posters and labels.
          - title: ✍️ Cursive
            body: Joined letters that flow quickly. A personal touch for a card or letter.
          - title: ⌨️ Keyboarding
            body: Easy to change and share. Great for long pieces and reports.
      - type: table
        covers: [U4.1, S4.1, S4.2]
        caption: The tool you choose can change how readers respond.
        headers: [Your text, Tool, 'What the reader may feel']
        rows:
          - ['A thank-you note to your grandfather', 'Cursive, by hand', 'You took time, and you care.']
          - ['A report for your teacher', 'Keyboard, with headings', 'It is clear, neat and organized.']
          - ['A notice about a lost cat', 'Big printing and a photo', 'It is easy to read from far away.']

keyTerms:
  - term: Planning
    covers: [K1.3]
    definition: Thinking about your audience, purpose and form, generating ideas, and narrowing your topic.
  - term: Revising
    covers: [K1.8]
    definition: Adding or removing words, phrases or sentences, to make writing clear and focused from beginning to end.
  - term: Editing
    covers: [S1.8]
    definition: Fixing spelling, punctuation and grammar.
  - term: Publishing
    covers: [S1.9]
    definition: Sharing a finished piece, with graphics, captions, charts or other features that support its purpose.
  - term: Topic sentence
    covers: [K1.5]
    definition: A sentence that gives the main idea of a paragraph and links the ideas within it.
  - term: Concluding sentence
    covers: [K1.5]
    definition: A sentence that closes a paragraph and links its ideas together.
  - term: Transition
    covers: [K1.4, S1.5]
    definition: A word or phrase that links sentences or paragraphs, such as however or in addition.
  - term: Writing fluency
    covers: [K1.7]
    definition: The rhythm and flow of language in written text.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: recall
    covers: [K1.2, S1.8, S1.9]
    type: order
    prompt: You are writing a thank-you letter to your bus driver. Put your steps in order.
    items:
      - Decide who will read it and what you want to say
      - Write it all down fast, without stopping to fix anything
      - Add the story of the day the bus got stuck in the snow
      - Fix the spelling and the commas
      - Add a drawing and hand it to the driver
    hints:
      - The five stages are planning, drafting, revising, editing and publishing. Which step matches each one?
    solution:
      - '**Plan** who it’s for. **Draft** it fast. **Revise** by adding the story. **Edit** the spelling and commas. **Publish** it with a drawing.'

  - id: w2
    level: 1
    thinking: notice
    covers: [K1.8, S1.8]
    type: mc
    prompt: |-
      Here is a draft: “our lizerd, Gary, is the best class pet”

      Which of these changes is **revising**, not editing?
    choices:
      - 'Adding the sentence “He stares at every substitute teacher.”'
      - Changing *lizerd* to *lizard*
      - Giving *our* a capital letter
      - Putting a period at the end
    answer: 0
    feedback:
      '1': That fixes spelling, so that’s editing. Which change makes the writing say more?
      '2': That fixes a capital letter, so that’s editing. Which change makes the writing say more?
      '3': That fixes punctuation, so that’s editing. Which change makes the writing say more?
    hints:
      - Editing fixes spelling, punctuation and grammar. Which of these does something else?
    solution:
      - Editing fixes mistakes. **Revising** adds or removes words, phrases or sentences to make the writing clear and focused. Adding the sentence about Gary is revising.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.5]
    type: mc
    prompt: |-
      Which sentence would make the best **topic sentence** for this paragraph?

      “___ He put his socks in the freezer. He fed my homework to the printer. Last night, he tried to wash the remote.”
    choices:
      - My little brother is a one-person disaster.
      - My little brother’s socks were very cold.
      - My little brother is six years old now.
      - My little brother did not wash the remote.
    answer: 0
    feedback:
      '1': That only covers one detail. A topic sentence has to link all of them.
      '2': That’s true of him, maybe, but it doesn’t link the socks, the homework and the remote.
      '3': The paragraph says he tried. And this covers just one detail. What do all three details show?
    hints:
      - What do all three details have in common?
    solution:
      - All three details show the same thing, that he causes trouble. A topic sentence gives the main idea, and it links all of the details. **“A one-person disaster”** does that.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b2
    level: 2
    thinking: decide
    covers: [S1.6, K1.3, S1.1]
    type: multi
    prompt: |-
      You’re writing to your **principal**. Your position: *Our school should hold one Hat Day.* Which two reasons
      are the strongest evidence for this reader?
    choices:
      - I own a really excellent hat.
      - Everyone wearing a hat would give $1 to the library fund.
      - Hats are fun, and everybody knows it.
      - The school next door held a Hat Day, and it went smoothly.
      - My dad says that hats are back in style.
    fixedOrder: true
    answer: [1, 3]
    feedback:
      '0': That’s good news for you. But what does it do for the school?
      '2': Saying “everybody knows it” isn’t evidence. What would a principal need to know?
      '4': Your dad’s fashion opinion doesn’t help a principal decide. What does a principal worry about?
    hints:
      - Imagine that you are the principal. What are you hoping for? What are you worried about?
    solution:
      - A principal cares about the school. Money for the library is a real benefit to the school. A Hat Day that went smoothly next door answers the worry that it might cause trouble.
      - The other reasons might work on your friends. Strong evidence fits your position and matters to your reader.

  - id: b3
    level: 2
    thinking: notice
    covers: [K1.4, S1.5]
    type: mc
    prompt: |-
      “My sister hates spiders. **So,** she keeps one as a pet.” Which transition should replace *So* to make these two sentences
      make sense together?
    choices: [However, In addition, Most importantly, First]
    answer: 0
    feedback:
      '1': That adds another detail of the same kind. Is keeping a spider the same kind of detail as hating spiders?
      '2': That says the next detail matters most, but it doesn’t explain how these two ideas fit together.
      '3': That would start a list in order. Is there a list here?
    hints:
      - Would you expect someone who hates spiders to keep one? What sort of word warns a reader about a surprise?
    solution:
      - The second sentence is the opposite of what you’d expect. **However** tells a reader that a surprise or a change of direction is coming.
      - A transition is more than decoration. It tells the reader how two ideas are linked.

  - id: b4
    level: 2
    thinking: decide
    covers: [S1.9, K4.2, S4.1, U4.1]
    type: multi
    prompt: |-
      Your family wants to get rid of an old couch. You are making a poster for the end of your driveway, and people will
      see it from their cars:

      **FREE COUCH. It smells a little like a hockey bag. You carry it.**

      Which choices would help this poster do its job?
    choices:
      - A chart of every couch your family has ever owned
      - Huge printing that people can read from the road
      - Tiny, curly cursive that looks really fancy
      - A photo of the couch with the caption “This couch”
      - An arrow that points up the driveway to the couch
    fixedOrder: true
    answer: [1, 3, 4]
    feedback:
      '0': A chart can be helpful, but does a driver need this one to decide about the couch?
      '2': Cursive can be a lovely personal touch on a card. Can it be read from a moving car?
    hints:
      - What is the poster’s purpose? Who will be reading it, and from where?
    solution:
      - The purpose is to get someone to take the couch, and the readers are people going by in cars.
      - Big printing can be read from far away. A photo with a caption shows what’s on offer, and an arrow shows where it is.
      - Each choice has to support the purpose and the audience. The tool you choose changes how readers respond.

  - id: b5
    level: 2
    thinking: model
    covers: [K1.1, S1.3]
    type: mc
    prompt: |-
      Yara has been writing a story for 40 minutes, and she has one sentence. After every word, she stops to check the spelling,
      fix a comma and try to make it sound better. What should she change?
    choices:
      - Get her ideas down first, and leave the fixing for later stages.
      - Do all of her fixing faster, and keep doing it after each word.
      - Look up every word that she might need before she starts writing.
      - Publish the one sentence now, since it’s been checked so carefully.
    answer: 0
    feedback:
      '1': Speed isn’t the trouble. She’s trying to do several jobs at the same time. What could she do about that?
      '2': She would spend the whole afternoon looking up words and not writing. What is the first draft’s job?
      '3': One sentence isn’t a story yet. Which stage does she need to spend more time on?
    hints:
      - How many jobs is she trying to do at the same time?
      - Which stage is for getting ideas down? Which stages are for fixing them?
    solution:
      - Yara is drafting, revising and editing all at once, and that’s really hard.
      - The writing process breaks the work into chunks. She should draft first without stopping, and then revise and edit later. That gives each job its own turn.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [K1.8, S1.7, K1.4, K1.5, S1.5]
    type: investigation
    prompt: |-
      Here is Gabi’s first draft. You’re helping to revise it.

      1. My uncle’s campfire chili is the worst food in Alberta.
      2. His truck is blue.
      3. Then the dog sniffed it and walked away.
      4. First, he added a whole bottle of hot sauce.
      5. Next, a marshmallow fell in, and he left it there.
      6. It was bad.
    parts:
      - type: mc
        prompt: One sentence doesn’t belong in a piece about terrible chili. Which sentence should Gabi cut?
        choices: [Sentence 2, Sentence 3, Sentence 5, Sentence 6]
        answer: 0
        feedback:
          '1': The dog walking away is great evidence that the chili is bad! It only needs a better place.
          '2': The marshmallow is a funny and useful detail about the chili. Which sentence isn’t about the chili?
          '3': This sentence does need work, but it’s about the chili. Which one isn’t?
        hints:
          - Read each sentence, and ask whether it tells you about the chili.
        solution:
          - The colour of the truck has nothing to do with the chili. Revising includes removing what doesn’t help.
      - type: mc
        prompt: Gabi uses *First*, *Next* and *Then* to put the details in order. Which sentence is in the wrong place?
        choices:
          - Move sentence 3 to come after sentence 5.
          - Move sentence 4 to come after sentence 5.
          - Move sentence 5 to come before sentence 1.
          - Move sentence 1 to come after sentence 3.
        answer: 0
        feedback:
          '1': Sentence 4 begins with *First*, so what is it doing after *Next*? Follow the order words.
          '2': The topic sentence has to come before the details. And *Next* can’t come before *First*.
          '3': Sentence 1 is the topic sentence, which tells readers what the piece is about. Which order word is out of place?
        hints:
          - Which order word should come first? Which should come last?
        solution:
          - The order should be *First*, *Next*, *Then*. The sentence that starts with *Then* has to come after the other two.
          - It’s funnier that way too, because the dog’s reaction comes after you’ve heard about the chili.
      - type: open
        prompt: |-
          Sentence 6, “It was bad,” is the concluding sentence. It doesn’t do much. Rewrite it so that it links back to the
          topic sentence and gives the piece a good ending.
        modelAnswer: Even our dog, who eats socks, wouldn’t touch it, so my uncle’s chili is still the worst food in Alberta.
        rubric:
          - My new sentence links back to the idea that the chili is the worst food in Alberta.
          - It says more than “It was bad.” It gives an interesting or funny ending.
    wrapUp: Revising doesn’t mean fixing the spelling. It means cutting what doesn’t help, moving what’s in the wrong place, and making what’s left stronger.
    hints: []
    solution: []

  - id: d2
    level: 3
    thinking: why
    covers: [K1.6, K1.7, S1.7]
    type: mc
    figure: |-
      <svg viewBox="0 0 340 112" class="fig-svg" role="img" aria-label="Bars showing sentence lengths. Draft A has four short bars of nearly equal length. Draft B has one very long bar, then one short bar, which is highlighted."><text class="fig-label" x="0" y="31">Draft A</text><rect class="fig-rect" x="72" y="14" width="48" height="24"/><rect class="fig-rect" x="126" y="14" width="48" height="24"/><rect class="fig-rect" x="180" y="14" width="48" height="24"/><rect class="fig-hl" x="234" y="14" width="36" height="24"/><text class="fig-label" x="0" y="87">Draft B</text><rect class="fig-rect" x="72" y="70" width="204" height="24"/><rect class="fig-hl" x="282" y="70" width="36" height="24"/></svg>
    prompt: |-
      **Draft A:** The rink was cold. The ice was hard. The puck was fast. I was slow.

      **Draft B:** The rink was cold, the ice was hard, and the puck flew past everyone like a rocket. I was slow.

      Each bar shows one sentence. Read both aloud. *I was slow* is exactly the same in both drafts, but it’s funnier in Draft B. Why?
    choices:
      - The long sentence builds up speed, so the short one lands hard.
      - The sentence *I was slow* has more words in it in Draft B.
      - Draft B has more sentences, which makes it longer and funnier.
      - Only Draft B tells a reader that the writer was a slow skater.
    answer: 0
    feedback:
      '1': Count the words in the bars at the end. Both have the same three words.
      '2': Count the bars. Draft A has four sentences, and Draft B has only two.
      '3': Both drafts end with “I was slow.” It’s not what it says. It’s what comes before it.
    hints:
      - Look at the bars just before the highlighted one. What is different?
      - Read Draft B aloud. What happens to your voice in the long sentence? Then what happens at *I was slow*?
    solution:
      - In Draft A, all the sentences are about the same length, so they sound like a drumbeat. *I was slow* is just one more beat.
      - In Draft B, the long sentence rushes along, and then the short one stops you. That sudden change is what makes it funny.
      - 'What we learned: length is a tool. Writing fluency is the rhythm and flow of language, and a short sentence hits hardest after a long one.'
