id: writing-process
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 8
title: The Writing Process and Strong Paragraphs
shortTitle: Writing process
summary: >-
  Follow one piece of writing from plan to publication, build paragraphs with topic sentences and
  transitions, see the rhythm of your sentences, and choose the right tools.

bigIdea: |-
  Nobody writes a great piece in one try. The **writing process** breaks the work into manageable chunks,
  so you can focus on one thing at a time: **planning, drafting, revising, editing and publishing**.

lesson:
  - title: One piece, five stages
    blocks:
      - type: visual
        covers: [K1.1, K1.2, K1.3, K1.8, S1.3, S1.7, S1.8, S1.9]
        component: writing-path
        props:
          stages:
            - icon: 🗺️
              label: Plan
              job: Think about your audience, purpose and form. Generate ideas, then narrow the topic.
              page: |-
                **Audience:** my town council. **Purpose:** to persuade. **Form:** a letter.

                **Ideas:** new playground? longer library hours? a bike path?

                **Narrowed topic:** a safe bike path to school
            - icon: ✏️
              label: Draft
              job: Get your ideas down. Don’t stop to fix anything yet.
              page: |-
                we need a bike path. i ride my bike to school and it is scary. the cars go by really fast and it is scary. also i like bikes. A bike path would be good.
            - icon: 🔧
              label: Revise
              job: Add or remove words, phrases or sentences, to make it clear and focused.
              page: |-
                we need a bike path ++on Centre Street++. i ride my bike to school ~~and it is scary~~. ++Last week, a truck passed so close that my handlebars shook.++ ~~the cars go by really fast and it is scary. also i like bikes.~~ A bike path would ~~be good~~ ++keep students safe++.
            - icon: 🔍
              label: Edit
              job: Fix spelling, punctuation and grammar.
              page: |-
                ~~w~~++W++e need a bike path on Centre Street. ~~i~~++I++ ride my bike to school. Last week, a truck passed so close that my handlebars shook. A bike path would keep students safe.
            - icon: 🚀
              label: Publish
              job: Choose your final form, and add graphics, captions or charts that support your purpose.
              page: |-
                ### A Safe Path to School

                We need a bike path on Centre Street. I ride my bike to school. Last week, a truck passed so close that my handlebars shook. A bike path would keep students safe.

                *🚲 Map: where the path would go, from Centre Street to the school.*
        caption: Tap each stage. In Revise and Edit, **red** words are cut and **green** words are new.
      - type: callout
        variant: tip
        covers: [K1.1, U1.1]
        title: One job at a time
        body: Trying to get ideas, spelling and punctuation right all at once is really hard. Doing them one at a time leaves room for artistry, and your writing can even change minds.

  - title: Build a paragraph
    blocks:
      - type: example
        covers: [K1.4, K1.5, S1.5]
        title: The parts of a strong paragraph
        problem: Look at how each sentence does its job.
        steps:
          - '**Topic sentence (the lead):** Centre Street isn’t safe for students on bikes.'
          - '**Detail:** The cars there go up to 60 kilometres an hour.'
          - '**Transition + detail:** *In addition,* the road has no space between the cars and the curb.'
          - '**Transition + detail:** *Most importantly,* a truck almost hit me last week.'
          - '**Concluding sentence:** A bike path would solve all of these problems.'
      - type: callout
        variant: tip
        covers: [K1.4, S1.5]
        title: Choose an order
        body: Put details in order of **sequence** (first, next, last) or of **importance** (save the strongest for last). **Transitions** like *in addition* and *however* link your ideas.

  - title: Several paragraphs, one position
    blocks:
      - type: table
        covers: [S1.4, S1.6, S1.1, S1.2]
        caption: A longer piece has an introduction, supporting evidence and a conclusion.
        headers: [Paragraph, Its job, In the bike path letter]
        rows:
          - ['1. **Introduction**', 'Give the topic and your position.', 'Centre Street needs a bike path.']
          - ['2. **Evidence**', 'Support your position with relevant facts.', 'Cars go up to 60 km/h. There is no shoulder.']
          - ['3. **Evidence**', 'Give another reason.', 'More students would ride, and there would be less traffic.']
          - ['4. **Conclusion**', 'Remind readers of your position.', 'Please build the path this year.']
      - type: callout
        variant: mistake
        covers: [S1.6]
        title: Stay on the evidence
        body: “I like bikes” isn’t evidence that a path is needed. Keep what supports your position, and cut the rest.

  - title: Hear the rhythm
    blocks:
      - type: visual
        covers: [K1.6, K1.7, S1.7]
        component: sentence-rhythm
        props:
          examples:
            - label: Choppy
              text: I ride to school. I take Centre Street. The cars go fast. It feels scary. I want a path.
            - label: Flowing
              text: Every morning, I ride my bike down Centre Street to school. The cars go fast. Last week, a truck passed so close that my handlebars shook, and I had to stop at the curb to catch my breath. We need a path.
        caption: Each bar is one sentence. **Change the sentences** or write your own, and watch the bars change.

  - title: Choose your tool
    blocks:
      - type: compare
        covers: [K4.1, K4.2, S4.3]
        columns:
          - title: ✏️ Printing
            body: Clear and easy to read. Great for posters and labels.
          - title: ✍️ Cursive
            body: Joined letters that flow quickly. A personal touch for a card or letter.
          - title: ⌨️ Keyboarding
            body: Easy to change and share. Great for long pieces and reports.
      - type: table
        covers: [U4.1, S4.1, S4.2]
        caption: The tool you choose can change how readers respond.
        headers: [Your text, Tool, 'What the reader may feel']
        rows:
          - ['A thank-you note to your grandfather', 'Cursive, by hand', 'You took time, and you care.']
          - ['A report for your teacher', 'Keyboard, with headings', 'It is clear, neat and organized.']
          - ['A notice about a lost cat', 'Big printing and a photo', 'It is easy to read from far away.']

keyTerms:
  - term: Planning
    covers: [K1.3]
    definition: Thinking about your audience, purpose and form, generating ideas, and narrowing your topic.
  - term: Revising
    covers: [K1.8]
    definition: Adding or removing words, phrases or sentences, to make writing clear and focused from beginning to end.
  - term: Editing
    covers: [S1.8]
    definition: Fixing spelling, punctuation and grammar.
  - term: Publishing
    covers: [S1.9]
    definition: Sharing a finished piece, with graphics, captions, charts or other features that support its purpose.
  - term: Topic sentence
    covers: [K1.5]
    definition: A sentence that gives the main idea of a paragraph and links the ideas within it.
  - term: Concluding sentence
    covers: [K1.5]
    definition: A sentence that closes a paragraph and links its ideas together.
  - term: Transition
    covers: [K1.4, S1.5]
    definition: A word or phrase that links sentences or paragraphs, such as however or in addition.
  - term: Writing fluency
    covers: [K1.7]
    definition: The rhythm and flow of language in written text.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [K1.2]
    type: order
    prompt: Put the stages of the writing process in order.
    items: [Planning, Drafting, Revising, Editing, Publishing]
    hints:
      - You can’t fix what isn’t written, and you publish last.
    solution:
      - '**Planning → drafting → revising → editing → publishing.**'

  - id: w2
    level: 1
    covers: [K1.8, S1.8]
    type: mc
    prompt: Ari changes “i like dogs” to “I like dogs.” Which stage is this?
    choices: [Editing, Planning, Revising, Publishing]
    answer: 0
    feedback:
      '1': Planning comes before you write any sentences.
      '2': Revising changes the words and ideas. Ari only fixed a capital and a period.
      '3': Publishing shares the finished piece.
    hints:
      - Did Ari change the idea, or just fix the capital and the punctuation?
    solution:
      - Fixing spelling, punctuation and grammar is **editing**.

  - id: w3
    level: 1
    covers: [K1.5]
    type: mc
    prompt: What does a **topic sentence** do?
    choices:
      - It gives the main idea and links the ideas in a paragraph.
      - It comes at the very end and says goodbye.
      - It lists every fact in the paragraph.
      - It always asks a question.
    answer: 0
    feedback:
      '1': That is closer to a concluding sentence. A topic sentence introduces the paragraph.
      '2': The details do that. A topic sentence states the main idea.
      '3': It can, but it doesn’t have to. What matters is that it gives the main idea.
    hints:
      - It tells your reader what the paragraph is about.
    solution:
      - A topic sentence gives structure, and it links the ideas within the paragraph.

  - id: w4
    level: 1
    covers: [K1.3]
    type: multi
    prompt: Which of these are part of **planning**?
    choices: [Thinking about your audience, Generating ideas, Narrowing a topic, Fixing commas]
    fixedOrder: true
    answer: [0, 1, 2]
    feedback:
      '3': You fix commas when you **edit**, long after planning.
    hints:
      - Planning happens before you begin to draft.
    solution:
      - Planning includes considering audience, purpose and form, generating ideas, and narrowing a topic.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [K1.4, S1.5]
    type: mc
    prompt: |-
      Which **transition** best joins these sentences?

      > Most of the class wanted a field trip. ___, the bus cost too much.
    choices: [However, For example, Also, First]
    answer: 0
    feedback:
      '1': The second sentence isn’t an example of the first.
      '2': '*Also* adds something similar, but this is a contrast.'
      '3': '*First* begins a list, but here the second idea pushes back against the first.'
    hints:
      - Does the second sentence agree with the first, or push against it?
    solution:
      - The second idea **contrasts** with the first, so **However** fits best.

  - id: b2
    level: 2
    covers: [K1.8, S1.7]
    type: mc
    prompt: |-
      This paragraph is about how to stay safe on a bike path. Which sentence should you **remove** so that it stays focused?

      > Always wear a helmet. Ride on the right. My cousin has a red bike. Ring your bell when you pass.
    choices:
      - My cousin has a red bike.
      - Always wear a helmet.
      - Ride on the right.
      - Ring your bell when you pass.
    answer: 0
    feedback:
      '1': A helmet is about safety, so it belongs.
      '2': Riding on the right is about safety, so it belongs.
      '3': Ringing a bell is about safety, so it belongs.
    hints:
      - Which sentence has nothing to do with staying safe?
    solution:
      - The colour of a cousin’s bike doesn’t help with safety, so **cut** it.

  - id: b3
    level: 2
    covers: [K1.6, K1.7, S1.7]
    type: mc
    prompt: |-
      Which version has the best **writing fluency**?
    choices:
      - The wind rose. For a moment, the whole field of wheat bent low, as if the land itself were bowing to the storm.
      - The wind rose. The wheat bent. The storm came. The sky went dark.
      - The wind rose and the wheat bent and the storm came and the sky went dark and it rained.
      - Wind. Wheat. Storm. Dark.
    answer: 0
    feedback:
      '1': Every sentence is the same length, so it sounds choppy.
      '2': One long string joined by *and* doesn’t give readers a place to rest.
      '3': These aren’t complete sentences, and they don’t flow.
    hints:
      - Read each one out loud. Which has a mix of short and long?
    solution:
      - Mixing a **short** sentence with a **long** one gives writing rhythm and flow.

  - id: b4
    level: 2
    covers: [S1.6, S1.4]
    type: mc
    prompt: You are writing to persuade your principal to add a recycling program. Which is the most **relevant evidence**?
    choices:
      - Our class threw away 40 plastic bottles in one week.
      - Recycling bins come in blue and green.
      - I like the colour green.
      - The principal has a nice office.
    answer: 0
    feedback:
      '1': The colour of the bins doesn’t show why a program is needed.
      '2': That is a personal preference. It isn’t evidence for your position.
      '3': That has nothing to do with recycling.
    hints:
      - Which detail shows that there’s a real need?
    solution:
      - A real count of bottles shows the need, so it **supports** the position.

  - id: b5
    level: 2
    covers: [K4.2, S4.1, U4.1]
    type: mc
    prompt: You are making a sign for a bake sale that people should see from down the hall. Which **tool** fits best?
    choices:
      - Big, bold printing with a marker
      - Tiny cursive with a thin pen
      - A long report typed in a small font
      - Pencil on lined paper
    answer: 0
    feedback:
      '1': Tiny cursive is hard to read up close, let alone down the hall.
      '2': A long report takes too long to read while walking by.
      '3': Pencil lines are too light to see from far away.
    hints:
      - Think about how far away your readers are.
    solution:
      - Big, bold **printing** can be read from far away, which suits the purpose.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [K1.4, S1.5]
    type: order
    prompt: Put these sentences in the **best order** to make a paragraph.
    items:
      - Beavers change the land around them.
      - First, they build a dam across a stream.
      - Next, the water behind the dam spreads out into a pond.
      - Soon, ducks, frogs and moose move in.
      - One small animal can create a whole new home for others.
    hints:
      - Start with the topic sentence. Use the transitions to find the sequence.
    solution:
      - The **topic sentence** comes first, then details in sequence (*First, Next, Soon*), then the **concluding sentence**.

  - id: d2
    level: 3
    covers: [S1.7, K1.8]
    type: mc
    prompt: |-
      A student’s whole revision of a draft was to add three exclamation marks and fix one spelling error. What is
      the problem?
    choices:
      - That is editing. Revising means improving the ideas, by adding or removing words, phrases or sentences.
      - Nothing. Fixing errors is the same as revising.
      - The student should have published first.
      - A draft can never be improved.
    answer: 0
    feedback:
      '1': Fixing errors is **editing**. Revising changes the writing’s content, order and clarity.
      '2': Publishing is the last stage. It comes after revising and editing.
      '3': That’s what revising is for!
    hints:
      - What’s the difference between revising and editing?
    solution:
      - Revising improves **fluency, coherence, sequence and support**. Editing fixes **spelling, punctuation and grammar**.

  - id: d3
    level: 3
    covers: [S1.9, K1.3, S1.2]
    type: mc
    prompt: You are publishing a report for parents about why students need more recess. What would **best support your purpose**?
    choices:
      - A chart showing how many students feel more focused after recess, with a caption
      - A clip art picture of a dinosaur on every page
      - A very long glossary of playground words
      - A secret code that readers must solve
    answer: 0
    feedback:
      '1': The pictures may be fun, but they don’t help persuade parents.
      '2': Parents don’t need a long list of playground words to understand your point.
      '3': Making readers work harder gets in the way of your purpose.
    hints:
      - What would help convince a parent?
    solution:
      - A chart with a caption shows **evidence**, so it supports your purpose and connects with your audience.

  - id: d4
    level: 3
    covers: [S1.1, S1.4, S1.5, S1.6]
    type: open
    prompt: |-
      Write a short piece to persuade your class of something that matters to you. Include a **topic introduction**, at
      least **two pieces of evidence**, **transitions**, and a **conclusion**.
    modelAnswer: |-
      Our school should start a Friday reading club. First, reading with friends makes it more fun, and last year the
      book fair sold out in one day, so students clearly like books. In addition, the library is already open at lunch, so
      a club would cost nothing. Most importantly, it would give students a quiet place to relax. For all of these
      reasons, a Friday reading club would be good for everyone.
    rubric:
      - My first sentence introduces the topic and my position.
      - I gave at least two pieces of relevant evidence.
      - I used transitions to link my ideas.
      - I ended with a conclusion.
      - I read it over, then revised and edited it.
