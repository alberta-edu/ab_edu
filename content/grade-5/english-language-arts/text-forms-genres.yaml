id: text-forms-genres
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI1
outcomes: [LANENG5-OI1-GQ1-LO1]
order: 1
title: Text Forms, Genres and Structures
shortTitle: Text forms & genres
summary: >-
  Find out why texts are written, explore photo essays, tall tales and science fiction, and see how
  text features and story structures help you follow along.

bigIdea: |-
  - Every text has a **purpose**, a **form** and a **structure**.
  - Knowing what kind of text you are reading helps you enjoy it and understand it.
  - It also helps you see the world through someone else’s eyes.

lesson:
  - title: Why was it written?
    blocks:
      - type: visual
        covers: [K1.1, K1.2, S1.1]
        component: card-sort
        props:
          bins:
            - { id: inform, label: To inform, icon: 📘 }
            - { id: entertain, label: To entertain, icon: 🎭 }
            - { id: persuade, label: To persuade, icon: 📣 }
            - { id: inspire, label: To inspire, icon: ✨ }
          cards:
            - { text: A website that explains how bees make honey, bin: inform, why: 'It gives facts, so its purpose is to inform.' }
            - { text: A printed bus schedule, bin: inform, why: 'It tells people when the buses come. A text does not have to be on a screen.' }
            - { text: A funny comic about a dog who drives a tractor, bin: entertain, why: 'It is there to make you laugh.' }
            - { text: A video game story about a lost dragon, bin: entertain, why: 'A digital story can entertain, too.' }
            - { text: A poster that says “Vote for Maya for class president!”, bin: persuade, why: 'It tries to change what you will do.' }
            - { text: A letter asking the town to build a skate park, bin: persuade, why: 'It tries to change the town’s mind.' }
            - { text: A speech about an athlete who never gave up, bin: inspire, why: 'It makes you feel that you could do hard things too.' }
            - { text: A song about a community helping each other after a flood, bin: inspire, why: 'It lifts people up and makes them want to help.' }
        caption: Where does each text belong? Some are digital and some are not. Both count as texts.
      - type: callout
        variant: tip
        covers: [K1.2]
        title: Often more than one
        body: A text can have **more than one purpose**. A funny video about recycling can entertain you and inform you at the same time.

  - title: Three text forms
    blocks:
      - type: visual
        covers: [K1.4, K1.5, S1.3]
        component: page-explorer
        props: { set: forms }
        caption: Look at each form. What do you notice first on each page?
      - type: callout
        variant: mistake
        covers: [K1.4, K1.5]
        title: A form can mix
        body: Literary forms can be **fiction** (invented) or **non-fiction** (true). A **hybrid** includes both in one text.

  - title: Text features point the way
    blocks:
      - type: visual
        covers: [K2.1, U2.1, S2.1]
        component: page-explorer
        props: { set: features }
        caption: Tap each feature, then switch the features off. What gets harder to find?
      - type: callout
        variant: tip
        covers: [S2.2, K2.1]
        title: Use them in your own writing
        body: When you write a report or a web page, add **sidebars**, a **glossary**, headings and bold words, so your reader can find what matters most.

  - title: How a story moves
    blocks:
      - type: visual
        covers: [K1.6, K3.4, K3.5, S3.2]
        component: story-path
        props:
          stages:
            - { label: Beginning, text: 'We meet Big Marie, a woman so tall that geese steer around her head.' }
            - { label: Problem, text: 'Snow buries the whole town up to the chimneys. Nobody can find the road.' }
            - { label: Events, text: 'Many events with many details: Marie laughs, picks up a grain elevator and scoops out the main street, then the county.' }
            - { label: Resolution, text: 'The roads are clear. The problem is solved.' }
            - { label: Ending, text: 'Marie pats the snow into a pile in the west, and that is how the Rocky Mountains got their snowy tops.' }
          flash:
            after: 2
            text: '*A hundred years later, children ski down those mountains. Not one of them knows whose mitten patted the snow smooth.* Then the story jumps back to Marie.'
        caption: Walk through the story. Then add a flash-forward and walk through it again.
      - type: callout
        variant: remember
        covers: [LANENG4-OI1-GQ1-LO1#K1.6]
        title: Remember from Grade 4
        body: Narrative texts, both fiction and non-fiction, can follow a structure.
      - type: text
        covers: [K1.6]
        body: Both fiction and non-fiction **narratives** can use this structure. A true story of a rescue has a problem and a resolution too.

  - title: A tall tale
    blocks:
      - type: passage
        id: marie
        title: Big Marie of the Peace
        form: Tall tale
        paragraphs:
          - Everyone in Peace River country knows about Big Marie. She was so tall that geese flying south had to steer around her head. When she sneezed, farmers two valleys over held on to their hats.
          - One winter, the snow fell so deep that it buried the whole town up to the chimneys. Nobody could find the road, the school or the store. People tunnelled out, looked around and went back to bed.
          - Big Marie just laughed, and her laugh shook the icicles off every roof for a hundred kilometres. She picked up a grain elevator, turned it upside down and used it as a shovel. With three scoops she cleared the main street. With ten, she cleared the county.
          - She piled all that snow up in the west, higher and higher, and patted it smooth with her mitten. And that, folks will tell you, is how the Rocky Mountains got their snowy tops.
        note: An original tall tale written for AB Edu. Paragraph numbers help you point to evidence.
      - type: compare
        covers: [K3.1, K3.2, K3.3, S3.1]
        columns:
          - title: 🤠 Tall tale
            body: An **exaggerated** tale about a central **legendary character** with extraordinary body features or abilities.
          - title: 🚀 Science fiction
            body: A modern fantasy about **technology**, **futuristic situations**, and real or imagined **scientific** happenings.

  - title: Characters and theme
    blocks:
      - type: passage
        id: mars
        title: The Greenhouse on Mars
        form: Science fiction
        paragraphs:
          - Ines hated the red dust. Three months after landing on Mars, she still woke up homesick for Lethbridge and its endless wind. “Nothing grows here,” she told her brother Teo, pressing her glove against the window of the dome.
          - “Schedule says water the beans at 0800,” said Commander Bo, without looking up from the tablet. Commander Bo said the same thing every morning, in the same voice.
          - Teo leaned over and whispered, “Ines only pretends she doesn’t care. She waters the beans twice when no one is looking.”
          - One morning, the robot gardener broke down, and the beans began to droop. Ines ran to the greenhouse and mixed the water by hand. She sat beside the plants all night, watching the sensors blink.
          - Ten years later, Ines would stand in this same dome and show a class of children the first forest on Mars. She would tell them about this night. But that was still far away.
          - For now, there was only one green shoot, pushing up through the red dust. Ines touched it and smiled. “Schedule says water the beans at 0800,” said Commander Bo. “I know,” said Ines. “This is my garden now.”
        note: An original story written for AB Edu.
      - type: table
        covers: [K3.8, K3.9, K3.10, K3.11, S3.4]
        caption: Two types of characters in “The Greenhouse on Mars”
        headers: [Character, Type, 'How we know']
        rows:
          - ['**Ines**', '**Round:** interesting and layered, and she changes', 'What she **says** at first (“Nothing grows here”), what she **does** (sits up all night), and what her brother **says** about her.']
          - ['**Commander Bo**', '**Flat:** does not change', 'Says the same thing, in the same voice, from the first day to the last.']
      - type: compare
        covers: [K3.6, K3.7, S3.3, U3.1]
        columns:
          - title: Theme
            body: The **underlying message** of a text. It is rarely stated. Here, a place can become home when you care for it.
          - title: Third person
            body: The author narrates, using names or pronouns (*Ines*, *she*). No one in the story says “I” except when speaking.

  - title: Non-fiction that argues
    blocks:
      - type: passage
        id: rink
        title: Keep the Rink Open
        form: Editorial, Riverbend Times (a made-up town)
        paragraphs:
          - Town council wants to close Riverbend’s outdoor rink to save $8,000 a year. We think that would be a mistake.
          - The rink keeps children active all winter. Because it is free, families who cannot pay for arena time can still skate.
          - The rink also brings neighbours together. When the lights come on, people who have never met end up sharing a bench and a thermos of hot chocolate.
          - Council should find its savings somewhere else. Keep the rink open.
        note: An original editorial written for AB Edu. An editorial is an opinion piece by a newspaper’s editors.
      - type: table
        covers: [K4.1, K4.2, S4.1]
        caption: Finding the structure of “Keep the Rink Open”
        headers: [Structure, Where you see it]
        rows:
          - ['**Larger topic**', 'Whether to keep the rink open']
          - ['**Subtopics**', 'Keeping children active (paragraph 2), and bringing neighbours together (paragraph 3)']
          - ['**Cause and effect**', 'The rink is free (cause), so families who cannot pay for arena time can still skate (effect).']
      - type: callout
        variant: tip
        covers: [K4.3, S4.2, U4.1]
        title: Form your own opinion
        body: |-
          Ask three questions:

          1. **Structure:** how is the argument built?
          2. **Content:** what reasons are given, and what is left out?
          3. **Source:** who wrote it, and why?

          Then talk it over. Others may see it differently, and you will see the issue through their eyes.

  - title: Build your reading stamina
    blocks:
      - type: compare
        covers: [K1.3, S1.4, S1.2]
        columns:
          - title: 🏃 Stamina grows like a muscle
            body: Reading stamina is how long you can stay with a text. It grows when you read things you **enjoy**.
          - title: 📚 Try many genres
            body: Sample tall tales, science fiction, photo essays, news and opinion pieces. Notice which ones you want to keep reading.
      - type: callout
        variant: tip
        covers: [U1.1, S1.4]
        title: Enjoying a text is part of the point
        body: Genres, forms and structures help writers share ideas and help readers enjoy them. Follow what you like, and read a little longer each time.

keyTerms:
  - term: Hybrid
    covers: [K1.5]
    definition: A type of text that includes both fiction and non-fiction text forms.
  - term: Sidebar
    covers: [K2.1]
    definition: A box beside the main text with extra information about the topic.
  - term: Glossary
    covers: [K2.1]
    definition: A list of important words from a text, with their meanings.
  - term: Tall tale
    covers: [K3.2]
    definition: An exaggerated tale about a central legendary character with extraordinary physical features or abilities.
  - term: Science fiction
    covers: [K3.3]
    definition: A modern fantasy text about technology, futuristic situations, and real or imagined scientific happenings.
  - term: Flash-forward
    covers: [K3.5]
    definition: A break in the plot that takes the audience forward in time to future events.
  - term: Theme
    covers: [K3.6]
    definition: The underlying message of a text.
  - term: Third person
    covers: [K3.7]
    definition: A point of view where the author narrates a story about the characters, using names or pronouns.
  - term: Round character
    covers: [K3.9]
    definition: An interesting, layered character who may change throughout a story.
  - term: Flat character
    covers: [K3.10]
    definition: A character who does not change throughout a story.
  - term: Editorial
    covers: [K4.1]
    definition: A persuasive non-fiction text that gives the opinion of a newspaper’s editors.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K1.1, K1.2, S1.1]
    type: mc
    prompt: |-
      Your class watches a video. A hamster puppet falls into a compost bin, and everyone laughs. Then the hamster explains how worms turn scraps into soil.

      Nia says, “It’s to entertain. It’s funny!” Sol says, “It’s to inform. It has facts!”

      Who is right?
    choices:
      - Both of them, because one text can have more than one purpose.
      - Nia, because a funny video can’t be teaching you facts as well.
      - Sol, because jokes are only extras and never count as a purpose.
      - Neither of them, because a video on a screen doesn’t count as a text.
    answer: 0
    feedback:
      '1': Think about what you would know after watching. Did the jokes stop you from learning about the worms?
      '2': Why would someone put a falling hamster in the video at all? Making you laugh is a job, too.
      '3': Texts can be digital or non-digital. A video on a screen counts.
    hints:
      - Look at each part of the video. What is the puppet’s fall there to do? What are the worms there to do?
      - Do the two friends really have to disagree?
    solution:
      - Check the video one part at a time. The fall makes you laugh, so it entertains. The worms teach you something, so they inform.
      - Each friend has noticed one purpose. A text can have **more than one** at the same time.

  - id: w2
    level: 1
    thinking: notice
    covers: [K3.7, S3.3]
    type: mc
    prompt: Which line comes from a story told in the **third person**?
    choices:
      - “I smell socks,” said Zeke, and he held his nose.
      - I smelled socks, so I held my nose and said so.
      - We smelled socks, so we all held our noses tight.
      - My brother and I smelled socks and held our noses.
    answer: 0
    feedback:
      '1': The person telling this story is also in it. A third-person narrator tells about the characters.
      '2': The word *we* puts the storyteller inside the story. Who is telling this one?
      '3': The words *my* and *I* show that the storyteller is one of the two people in the story.
    hints:
      - Cover up any words inside quotation marks. Those are a character talking. What is left?
      - Who is telling what happened? Someone in the story, or someone telling about the characters?
    solution:
      - Words in quotation marks are a character speaking, so the *I* in “I smell socks” belongs to Zeke.
      - 'Now read what is left: *said Zeke, and he held his nose.* The narrator uses a name and a pronoun. That is **third person**.'
      - In the other lines, the *I* or *we* is outside any quotation marks, so the storyteller is in the story.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.4, K1.5, S1.3]
    type: mc
    prompt: A news article reports that a moose walked into a grocery store and ate all the carrots. The editor wants to turn the page into a **hybrid**. What should she add?
    choices:
      - An invented diary by the moose, printed beside the real report
      - Five more true facts about how moose live in the wild
      - A row of real photos of the moose, with short captions
      - A stronger headline that makes more people want to read
    answer: 0
    feedback:
      '1': More true facts are great, but the page would still be all non-fiction. What kind of writing is missing?
      '2': Real photos are still non-fiction. That moves the page toward a photo essay. What does a hybrid mix?
      '3': A headline is part of a news article already. It doesn’t change what kind of text this is.
    hints:
      - The report is true. What kind of writing would have to join it?
      - A hybrid includes both fiction and non-fiction. Which choice is made up?
    solution:
      - The report is **non-fiction**. A hybrid includes both fiction and non-fiction, so the page needs something invented.
      - A moose can’t really keep a diary, so that part is fiction. Side by side, the two make a **hybrid**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: flaw
    covers: [K2.1, U2.1, S2.1, S2.2]
    type: mc
    figure: >-
      <svg viewBox="0 0 400 270" class="fig-svg" role="img" aria-label="Aiko’s web page, Our Class Gecko. The large main text is headed The Great Boot Escape and tells how Pickle hid in the principal’s boot. A small sidebar on the right lists fun facts. Its last line says Feed: 2 crickets at 3:00. A small glossary at the bottom says gecko: a small lizard.">
      <rect class="cg-axis" x="2" y="2" width="396" height="266" fill="none"/>
      <text class="fig-label" x="16" y="28">Our Class Gecko</text>
      <rect class="cg-axis" x="12" y="42" width="256" height="150" fill="none"/>
      <text class="fig-label" x="22" y="68">The Great Boot Escape</text>
      <text class="fig-small" x="22" y="96">One day, Pickle climbed out</text>
      <text class="fig-small" x="22" y="118">and hid in the principal’s boot.</text>
      <text class="fig-small" x="22" y="140">Then the whole school heard</text>
      <text class="fig-small" x="22" y="162">a very loud scream!</text>
      <rect class="cg-axis" x="280" y="42" width="108" height="150" fill="none"/>
      <text class="fig-label" x="288" y="66">Sidebar</text>
      <text class="fig-small" x="288" y="88">Age: 2</text>
      <text class="fig-small" x="288" y="107">Naps on a rock</text>
      <text class="fig-small" x="288" y="126">Hates loud bells</text>
      <text class="fig-small" x="288" y="145">Likes the sun</text>
      <text class="fig-small" x="288" y="164">Feed: 2 crickets</text>
      <text class="fig-small" x="288" y="183">at 3:00</text>
      <rect class="cg-axis" x="12" y="204" width="376" height="54" fill="none"/>
      <text class="fig-label" x="22" y="226">Glossary</text>
      <text class="fig-small" x="22" y="248">gecko: a small lizard</text>
      </svg>
    prompt: |-
      Aiko made this page about the class gecko, Pickle. Tomorrow a substitute teacher will use it for one job: feeding Pickle on time. Right now, the feeding note is the last line of a sidebar of fun facts.

      What is the best change to Aiko’s page?
    choices:
      - Move the feeding note into the main text, and the boot story into the sidebar.
      - Move the feeding note into the glossary, where the important words are listed.
      - Make the boot story longer, so that readers learn more details about Pickle.
      - Remove the sidebar and the glossary, so that there is less on the page to read.
    answer: 0
    feedback:
      '1': A glossary is for the meanings of words. Would a teacher look there for what to do at 3:00?
      '2': That makes the main text even bigger. Where would the substitute’s eyes go first, and what would they find?
      '3': The sidebar is the only place that says what Pickle eats. What would the substitute do without it?
    hints:
      - What is the most important thing on this page for the person using it?
      - Where do your eyes go first on the page? What do they find there?
    solution:
      - Start with the reader. The substitute needs the feeding note, and fast.
      - The biggest part of the page is the boot story. The feeding note is at the bottom of a small box, under the fun facts.
      - A sidebar is for **extra** information. The boot story is a fun extra, so it belongs there. The feeding note is what matters most, so it goes in the main text.
      - The glossary can stay. It does its own job.

  - id: b4
    level: 2
    thinking: evidence
    covers: [K4.1, K4.3, S4.2]
    type: mc
    prompt: |-
      Imagine you learn something new about “Keep the Rink Open.” One of the editors who wrote it also owns the snack hut at the rink.

      What should a careful reader do now?
    choices:
      - Still weigh the reasons, but look for other sources, since the writer gains if the rink stays.
      - Throw out every reason, since someone who gains from the rink must be making them all up.
      - Trust every reason, since the editors of a town newspaper must have checked all of them.
      - Ignore the news, since only the reasons matter, and who wrote them makes no difference.
    answer: 0
    feedback:
      '1': The rink may really be free, even if the writer sells snacks there. Gaining from something doesn’t make every reason false.
      '2': An editorial gives the opinion of its editors. It argues one side, and this writer has a reason to want that side to win.
      '3': The source is one of the three things to ask about. Would you read it the same way if the writer had nothing to gain?
    hints:
      - Before this news, what questions could you ask about an editorial? Which one does the news change?
      - Is “the writer gains from this” the same as “the writer is lying”?
    solution:
      - Remember the three questions about structure, content and **source**. The news is about the source.
      - It doesn’t make the reasons false. The rink may still be free, and neighbours may still meet there.
      - But it gives you a reason to find out more from somebody else before you form your opinion.

  - id: b5
    level: 2
    thinking: notice
    covers: [K4.2, S4.1]
    type: mc
    prompt: |-
      The editors want to add one sentence to “Keep the Rink Open”:

      > Mr. Ostrowski, who is 82, has never skated here, but on that bench he has met every family on his street.

      Where does it belong?
    choices:
      - Paragraph 3, about bringing neighbours together
      - Paragraph 2, about keeping children active
      - Paragraph 1, about what the council wants to do
      - Paragraph 4, about what the council should do
    answer: 0
    feedback:
      '1': The sentence does mention skating. But is anyone getting active here? Look at what it is really about.
      '2': The first paragraph sets up the topic. Does this sentence tell you about the council’s plan?
      '3': The last paragraph tells the council what to do. Does this sentence do that?
    hints:
      - Ask what the sentence is really about. Is it the skating, or something else?
      - Name the subtopic of each paragraph. Which one would this sentence be an example of?
    solution:
      - The larger topic is keeping the rink open. Paragraphs 2 and 3 each hold one subtopic.
      - An older man meeting the families on his street is neighbours coming together, so it fits **paragraph 3**.
      - Don’t be fooled by one word. *Skated* points to staying active, but he has never skated there at all.

  - id: b6
    level: 2
    thinking: evidence
    covers: [K3.9, K3.11, S3.4]
    type: evidence
    prompt: Teo says that Ines only pretends she doesn’t care. Don’t just take his word for it. Tap a sentence where what Ines **does** backs him up.
    passage: mars
    paragraphs: [1, 3, 4]
    answer: [p4s2, p4s3]
    feedback:
      p1s1: This is how she feels about the dust. Does it back Teo up, or make him look wrong?
      p1s2: This is a real feeling, but it’s about home in Lethbridge. Does it show her doing something for the garden?
      p1s3: This is what she **says**, and she sounds as if she doesn’t care. Teo says that’s only pretending. What does she do?
      p3s1: This is Teo’s claim, and that is what you are checking.
      p3s2: This is still Teo talking. He may be right, but so far we only have his word. Find where the story shows her doing something.
      p4s1: Something happens here, but Ines isn’t in this sentence. What does she do next?
    hints:
      - Who is speaking in each sentence? Is it the story showing you Ines, or someone telling you about her?
      - Look for a moment when she has to act.
    solution:
      - 'Either of these works: “Ines ran to the greenhouse and mixed the water by hand.” or “She sat beside the plants all night, watching the sensors blink.”'
      - Someone who didn’t care wouldn’t run to the greenhouse or sit up all night. Now we don’t need only Teo’s word.
      - What she says, what she does and what someone else says about her show different sides of her. That is what makes her a round character.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: flaw
    covers: [K1.4, K3.1, K3.2, K3.3, S3.1]
    type: investigation
    prompt: |-
      The school library has a new sorting robot called Shelfie. Shelfie has two rules:

      - **Robots in the book?** Science fiction shelf.
      - **Someone very tall in the book?** Tall tale shelf.

      Let’s see how Shelfie does.
    parts:
      - type: mc
        prompt: Shelfie picks up *How Robots Build Cars*. It has real photos from a car factory, with short captions. Shelfie puts it on the science fiction shelf. What did Shelfie miss?
        choices:
          - Its robots are real and it gives true information, so it isn’t fiction.
          - It has no spaceships in it, and science fiction must have a spaceship.
          - Its robots don’t talk to anyone, and science fiction robots always talk.
          - It has photos in it, and a book with photos can’t be about technology.
        answer: 0
        feedback:
          '1': Science fiction can be about many kinds of technology and future situations. Look at something bigger first. Is this book made up?
          '2': Plenty of story robots might never say a word. Look at something bigger first. Is this book made up?
          '3': Photos can show technology very well. Look at what the photos are of. Is this book made up?
        hints:
          - Science fiction is a kind of fiction. What is this book?
        solution:
          - Science fiction is a sub-genre of **fiction**. This book shows real factories, so it is non-fiction.
          - It is really a photo essay. Shelfie looked at one word and never asked if the book was invented.
      - type: mc
        prompt: Next is *Hana, the Tallest Kid in Room 6*. In this made-up story, Hana bumps her head on the bus door and learns to love basketball. Nothing impossible happens. Shelfie puts it on the tall tale shelf. What should Shelfie have checked?
        choices:
          - Whether her body or abilities are wildly beyond what could ever be real.
          - Whether she is taller than all the other characters in the whole story.
          - Whether the story is invented, since all made-up stories are tall tales.
          - Whether she lives in a real place, since tall tales never name real ones.
        answer: 0
        feedback:
          '1': Hana is the tallest in her room, and she is still an ordinary kid. How tall is “tall” in Big Marie’s story?
          '2': Hana’s story is made up, and it still isn’t a tall tale. Fiction has many sub-genres.
          '3': Big Marie lives in Peace River country, and that’s a real place. Look for something else.
        hints:
          - Compare Hana with Big Marie. How would geese deal with each of them?
        solution:
          - A tall tale has a legendary character with **extraordinary** features or abilities, told with lots of exaggeration.
          - Hana is just tall. Marie makes geese steer around her head. The word *tall* in the name of the genre fooled Shelfie.
    wrapUp: One word can’t tell you the genre. Shelfie looked for robots and tall people. Readers look at what the whole text does, and some texts really do fit in two places.

  - id: d2
    level: 3
    thinking: why
    covers: [K3.8, K3.9, K3.10, S3.4]
    type: mc
    prompt: |-
      In paragraph 2 of “The Greenhouse on Mars,” Commander Bo says, “Schedule says water the beans at 0800.” In paragraph 6, he says it again, word for word.

      Why might the author have kept this flat character’s line exactly the same?
    choices:
      - It gives us something steady, so that we can hear how much Ines has changed.
      - It lets readers keep track of what time the beans are supposed to get watered.
      - It proves that Bo is a poor commander, who cares only about the crew’s schedule.
      - It shows that Bo is really the main character, because his words come first and last.
    answer: 0
    feedback:
      '1': The time is the same both times, so why would we need to hear it twice? Look at what comes right after the line in paragraph 6.
      '2': Flat doesn’t mean bad. It means he doesn’t change. The story never says he does his job poorly.
      '3': Whose feelings does the story follow from start to end? Who has the very last words?
    hints:
      - Compare how Ines acts around that line in paragraph 1 and in paragraph 6.
      - Suppose Bo’s words had changed at the end, too. Would it be easier or harder to notice what is different about Ines?
      - 'Bo says the same words. What is different the second time?'
    solution:
      - Look at what changes around the line. At the start, Ines says, “Nothing grows here.” At the end she answers Bo, “I know. This is my garden now.”
      - Bo’s words haven’t moved at all. That makes the change in Ines easy to hear.
      - 'What we learned: a flat character isn’t a mistake. A character who stays the same can show us how far a round character has come.'
