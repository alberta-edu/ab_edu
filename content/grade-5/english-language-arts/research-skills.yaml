id: research-skills
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 10
title: Research and Using Information Ethically
shortTitle: Research skills
summary: >-
  Narrow a topic down a funnel, choose reliable sources, learn from Elders and Knowledge Keepers with care,
  organize your notes, and use and share information fairly.

bigIdea: |-
  Research is a process: **ask questions, gather information, organize it and record it**. Then you can reach
  new conclusions. Good researchers choose their sources carefully, and treat people’s knowledge with respect.

lesson:
  - title: Narrow your topic
    blocks:
      - type: visual
        covers: [K3.2, S3.2]
        component: topic-funnel
        props:
          levels:
            - { topic: Animals, note: 'Far too broad. You could fill a library and never finish.' }
            - { topic: Animals in Alberta, note: 'Better, but this is still far too much for one report.' }
            - { topic: Grizzly bears in Alberta, note: 'Getting closer. Now, what do you want to know about them?' }
            - { topic: How do grizzly bears get ready for winter?, note: 'Just right. It is a clear question that you can answer in a few paragraphs.' }
        caption: Press the button to drop the topic down the funnel. What makes the last one easy to research?

  - title: The research process
    blocks:
      - type: table
        covers: [K3.1, K3.8, U3.1, S3.6]
        caption: Follow the process, with “How do grizzly bears get ready for winter?”
        headers: [Step, What you do, Example]
        rows:
          - ['**Question**', 'Decide what you need to find out.', 'What do they eat in the fall? Where do they sleep?']
          - ['**Gather**', 'Find information in several sources.', 'A park website, a library book, a wildlife officer']
          - ['**Organize**', 'Group what you found, using a method or tool.', 'A chart with columns for *food* and *dens*']
          - ['**Record**', 'Take notes in your own words, and note the source.', '“Eat a lot in fall.” (Park website)']
      - type: callout
        variant: tip
        covers: [U3.1, S3.6, K3.8]
        title: Reach your own conclusion
        body: When you put notes from **several sources** together, you can see something that none of them says alone. That is a new conclusion, and it’s yours.

  - title: Can you trust this source?
    blocks:
      - type: visual
        covers: [S3.4, S3.5]
        component: card-sort
        props:
          bins:
            - { id: strong, label: Valid and reliable, icon: ✅ }
            - { id: check, label: Check it first, icon: ⚠️ }
          cards:
            - { text: A provincial park website about bears, bin: strong, why: 'People who work with bears wrote it, and it is kept up to date.' }
            - { text: A library book by a wildlife biologist, bin: strong, why: 'The author is an expert, and you can find out who they are.' }
            - { text: "A video with no name on it, saying “Bears sleep underwater!”", bin: check, why: 'No one takes responsibility for it, and the claim sounds strange. Check it against other sources.' }
            - { text: A website selling bear spray that says bears attack every day, bin: check, why: 'The site wants to sell you something, so it may exaggerate. Compare it with other sources.' }
            - { text: "A forum post that says, “My uncle told me bears can run 200 km/h”", bin: check, why: 'You have no way to know this. Check it against other sources.' }
        caption: Who wrote it? Why? Is it up to date? Do other sources agree?

  - title: People are sources too
    blocks:
      - type: compare
        covers: [K3.3, K3.4, K3.5]
        columns:
          - title: Knowledge Keeper
            body: A respected community member who is recognized as having **expertise** in specific issues or skills.
          - title: Elder
            body: A person recognized by their community as having **historical, cultural and spiritual knowledge and wisdom**.
          - title: Spiritual leader
            body: A person who guides others in a community’s spiritual life. Spiritual leaders, too, can be sources of knowledge.
      - type: callout
        variant: tip
        covers: [K3.6, K3.7, S3.7]
        title: Ask how to ask
        body: '**Protocols** are ways of showing respect. They may vary by source, context, community or culture, and there can be protocols for sharing stories and histories. For example, some Elders may expect a gift such as tobacco, and others may not. Always ask ahead of time what is right, and ask before you record or share what you hear.'

  - title: Use information ethically
    blocks:
      - type: table
        covers: [K3.10, S3.7]
        caption: Three habits of an ethical researcher
        headers: [Habit, What it looks like]
        rows:
          - ['**Ask permission**', 'Ask your friend before you share the photo they took, or the story they told you.']
          - ['**Cite your sources**', 'Note where your information came from, such as the title and website or author.']
          - ['**Be fair and accurate**', 'Don’t change what someone said or make a person look worse than they are. If someone said “sometimes,” don’t write “always.”']
      - type: example
        covers: [S3.6, K3.10]
        title: Notes in your own words
        problem: 'A website says: “Grizzly bears may eat for 20 hours a day in the fall, to store fat for the winter.”'
        steps:
          - '**Don’t copy it.** Close the page, and think about what it means.'
          - '**Write your note:** Fall: eat most of the day, to store fat.'
          - '**Cite the source:** Name of the website, and the date you read it.'

  - title: Write it, and share it
    blocks:
      - type: example
        covers: [S3.1, S3.3]
        title: A main idea, with support
        problem: Write to explain how grizzly bears get ready for winter.
        steps:
          - '**Main idea:** Grizzly bears spend the fall getting ready for a long winter.'
          - '**Fact:** They eat for most of the day to store fat.'
          - '**Detail:** They eat berries, roots, and other foods they find.'
          - '**Explanation:** The stored fat keeps them alive while they sleep through the winter.'
      - type: compare
        covers: [K3.9]
        columns:
          - title: 🖼️ Visual
            body: A labelled drawing of a den, or a map
          - title: 📝 Written
            body: A report or a booklet
          - title: 💻 Digital
            body: A slide show or a web page

keyTerms:
  - term: Research question
    covers: [K3.1, S3.2]
    definition: A clear question that guides your research.
  - term: Reliable
    covers: [S3.4]
    definition: Able to be trusted to be correct.
  - term: Elder
    covers: [K3.5]
    definition: A person recognized by their community as having historical, cultural and spiritual knowledge and wisdom.
  - term: Knowledge Keeper
    covers: [K3.4]
    definition: A respected community member who is recognized as having expertise in specific issues or skills.
  - term: Protocol
    covers: [K3.6, K3.7]
    definition: A way of acting that shows respect when you access or share information. It can vary by source, community or culture.
  - term: Citing
    covers: [K3.10]
    definition: Giving basic information about where your information came from.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    covers: [K3.2, S3.2]
    type: mc
    prompt: Which research topic is **narrow enough** for a short report?
    choices: [How do beavers build dams?, Animals, Nature, Everything about Canada]
    answer: 0
    feedback:
      '1': There are millions of animals. This is far too broad.
      '2': Nature covers almost everything! This is far too broad.
      '3': Nobody could write this in a short report.
    hints:
      - Which question could you answer in a few paragraphs?
    solution:
      - '“How do beavers build dams?” is one **clear, well-defined** question.'

  - id: w2
    level: 1
    covers: [K3.1]
    type: order
    prompt: Put these research steps in a sensible order.
    items: [Ask a question, Gather information, Organize what you found, Record your notes and sources]
    hints:
      - What do you need to know before you start to gather?
    solution:
      - '**Question → gather → organize → record.** You may repeat these as you find out more.'

  - id: w3
    level: 1
    covers: [K3.5]
    type: mc
    prompt: What is an **Elder**?
    choices:
      - A person recognized by their community as having historical, cultural and spiritual knowledge and wisdom
      - Anyone over 65
      - The oldest student in a class
      - A person who owns a large library
    answer: 0
    feedback:
      '1': Age alone doesn’t make someone an Elder. Their community recognizes them.
      '2': It isn’t about the age of a student. Think about the community.
      '3': Owning books doesn’t give someone this role. It comes from the community.
    hints:
      - Who decides who is an Elder?
    solution:
      - Elders are **recognized by their communities**.

  - id: w4
    level: 1
    covers: [K3.10, S3.7]
    type: mc
    prompt: What does it mean to **cite** a source?
    choices:
      - To give basic information about where you got your information
      - To copy all of it word for word
      - To change it so that it sounds better
      - To keep your source a secret
    answer: 0
    feedback:
      '1': That is copying. Citing means telling readers where it came from.
      '2': Changing what a source says isn’t fair or accurate.
      '3': Citing does the opposite. It lets readers check your source.
    hints:
      - Citing helps your reader find where you got the information.
    solution:
      - Citing means sharing basic information about your source, such as its title or author.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    covers: [S3.4, S3.5]
    type: mc
    prompt: You are researching how a chinook wind works. Which source is most likely to be **reliable**?
    choices:
      - An Environment Canada web page about chinooks
      - A comment on a video that says, “Chinooks make cows fly”
      - An advertisement for winter coats
      - A joke book about the weather
    answer: 0
    feedback:
      '1': No one knows who wrote this, and it sounds silly. Check other sources.
      '2': An ad is trying to sell something. It isn’t trying to teach about wind.
      '3': A joke book is meant to entertain. It isn’t a source of facts.
    hints:
      - Who has weather experts on staff?
    solution:
      - '**Environment Canada** studies weather, and it says who wrote its information.'

  - id: b2
    level: 2
    covers: [S3.4]
    type: mc
    prompt: Three reliable sources say a lake is about 100 metres deep. One blog says it is “basically bottomless.” What should you do?
    choices:
      - Use about 100 metres, and be suspicious of the blog.
      - Write “bottomless,” because it is more exciting.
      - Average all four numbers.
      - Use the blog, because it is the most recent thing you read.
    answer: 0
    feedback:
      '1': Being exciting doesn’t make something true.
      '2': “Bottomless” isn’t a number, and you can’t average with it.
      '3': Being the last thing you read doesn’t make it valid.
    hints:
      - Do the sources agree? Who disagrees?
    solution:
      - When reliable sources **agree**, you can trust them more than one exaggerated claim.

  - id: b3
    level: 2
    covers: [K3.6, K3.7, S3.7]
    type: mc
    prompt: 'Your class wants to invite an Elder to share a story. What should you do **first**?'
    choices:
      - Ask a helper or the Elder what the right protocols are for approaching them, and for sharing the story.
      - Record the story and put it online right away.
      - Assume that every community has the same rules.
      - Tell the Elder exactly what to say.
    answer: 0
    feedback:
      '1': You need to ask permission before you share what someone says.
      '2': Protocols may vary by community and culture, so you need to ask.
      '3': The Elder is the source of knowledge. Listen with respect.
    hints:
      - Protocols may vary. How can you find out what is right?
    solution:
      - Protocols vary, so **ask first**. There can be special protocols for sharing stories and histories.

  - id: b4
    level: 2
    covers: [S3.6, K3.8]
    type: mc
    prompt: 'A book says: “Bison herds once numbered in the millions on the prairies.” Which is the **best note**?'
    choices:
      - Bison = once millions on prairies (Book title, author)
      - “Bison herds once numbered in the millions on the prairies.” (no source)
      - Prairies have grass.
      - There were a lot of bison, I think, somewhere.
    answer: 0
    feedback:
      '1': This copies everything and doesn’t say where it came from. Use your own words and name the source.
      '2': That isn’t what the book said. It doesn’t record the main fact.
      '3': This loses the key facts and has no source.
    hints:
      - A good note is short, in your own words, and names its source.
    solution:
      - It is **short, in your own words, and cites the source**.

  - id: b5
    level: 2
    covers: [K3.10, S3.7]
    type: multi
    prompt: Which of these show **ethical use** of information?
    choices:
      - Asking your friend before sharing their drawing in your report
      - Writing “from Parks Canada” beside a fact that you found there
      - Telling an interview subject’s words accurately
      - Copying a paragraph and saying that you wrote it
      - Changing “some bears” to “all bears” to make your report more exciting
    fixedOrder: true
    answer: [0, 1, 2]
    feedback:
      '3': Claiming someone else’s writing as your own isn’t honest.
      '4': That makes the information inaccurate.
    hints:
      - Think about asking permission, citing, and being fair and accurate.
    solution:
      - Ethical use means **asking permission, citing and representing fairly**.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    covers: [S3.2, K3.2]
    type: mc
    prompt: 'A student has the topic “The Rocky Mountains.” Which is the best **next step**?'
    choices:
      - Narrow it to a question, such as “How do people stay safe from avalanches in the Rockies?”
      - Make it wider, to “Mountains of the World.”
      - Start writing everything that comes to mind.
      - Pick a different topic that is even bigger.
    answer: 0
    feedback:
      '1': That is even harder to cover well.
      '2': Without a clear focus, the writing will be hard to organize.
      '3': A bigger topic would make the problem worse.
    hints:
      - The topic is too broad. What does it need?
    solution:
      - A **clear question** turns a broad topic into a focused one.

  - id: d2
    level: 3
    covers: [S3.4, S3.5, U3.1]
    type: mc
    prompt: |-
      You find a tourism website that says your town is “the sunniest in Canada.” A weather records page lists many
      sunnier places. What is the most reasonable conclusion?
    choices:
      - The tourism site wants visitors, so it may exaggerate. The weather records page is more reliable for this fact.
      - The weather records must be wrong, because tourism sites know best.
      - Both are lying, so nothing about weather can be known.
      - The town must have moved.
    answer: 0
    feedback:
      '1': A tourism site has a reason to make the town sound good.
      '2': One exaggeration doesn’t mean that nothing can be known. Compare the sources.
      '3': That isn’t a reasonable explanation. Think about each source’s purpose.
    hints:
      - What does each source want? Which one is trying to measure, and which one is trying to attract?
    solution:
      - Think about the **purpose** of each source. Comparing them lets you reach a sound conclusion.

  - id: d3
    level: 3
    covers: [S3.3, S3.1, S3.6]
    type: mc
    prompt: 'Which detail would **best support** this main idea: “Beaver dams can help other animals”?'
    choices:
      - Ducks and frogs can use the pond behind a dam.
      - Beavers have orange teeth.
      - The beaver is on the Canadian nickel.
      - Some people find beavers cute.
    answer: 0
    feedback:
      '1': That is a true fact, but it isn’t about helping other animals.
      '2': This is also true, but it has nothing to do with the main idea.
      '3': This is an opinion, and it doesn’t support the idea.
    hints:
      - Which detail shows another animal being helped?
    solution:
      - Ducks and frogs **using the pond** directly supports the main idea.

  - id: d4
    level: 3
    covers: [S3.1, S3.2, S3.3, S3.7]
    type: open
    prompt: |-
      Pick a topic you are curious about. Write a **narrow research question**. List **two sources** you could use and
      say why each is reliable. Then write a short paragraph with a main idea, based on what you already know, and
      explain what you would need to check.
    modelAnswer: |-
      **Question:** How do snowboards stay on top of deep snow? **Sources:** a library book about snow science, because
      the author is an expert, and a coach at the ski hill, because they know from experience (I would ask permission to quote
      them). **Paragraph:** Snowboards float on deep snow because they are wide. The board spreads your weight out over a big
      area. I would need to check whether speed matters too.
    rubric:
      - My question is narrow enough to answer in a few paragraphs.
      - I named two sources and said why each is reliable.
      - My paragraph has a main idea with details.
      - I said what I still need to check.
