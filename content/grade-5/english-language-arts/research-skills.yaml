id: research-skills
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI8
outcomes: [LANENG5-OI8-GQ1-LO1]
order: 10
title: Research and Using Information Ethically
shortTitle: Research skills
summary: >-
  Narrow a topic down a funnel, choose reliable sources, learn from Elders and Knowledge Keepers with care,
  organize your notes, and use and share information fairly.

bigIdea: |-
  - Research is a process: **ask questions, gather information, organize it and record it**. Then you can reach new conclusions.
  - Good researchers choose their sources carefully.
  - They treat people’s knowledge with respect.

lesson:
  - title: Narrow your topic
    blocks:
      - type: visual
        covers: [K3.2, S3.2]
        component: topic-funnel
        props:
          levels:
            - { topic: Animals, note: 'Far too broad. You could fill a library and never finish.' }
            - { topic: Animals in Alberta, note: 'Better, but this is still far too much for one report.' }
            - { topic: Grizzly bears in Alberta, note: 'Getting closer. Now, what do you want to know about them?' }
            - { topic: How do grizzly bears get ready for winter?, note: 'Just right. It is a clear question that you can answer in a few paragraphs.' }
        caption: Press the button to drop the topic down the funnel. What makes the last one easy to research?

  - title: The research process
    blocks:
      - type: table
        covers: [K3.1, K3.8, U3.1, S3.6]
        caption: Follow the process, with “How do grizzly bears get ready for winter?”
        headers: [Step, What you do, Example]
        rows:
          - ['**Question**', 'Decide what you need to find out.', 'What do they eat in the fall? Where do they sleep?']
          - ['**Gather**', 'Find information in several sources.', 'A park website, a library book, a wildlife officer']
          - ['**Organize**', 'Group what you found, using a method or tool.', 'A chart with columns for *food* and *dens*']
          - ['**Record**', 'Take notes in your own words, and note the source.', '“Eat a lot in fall.” (Park website)']
      - type: callout
        variant: tip
        covers: [U3.1, S3.6, K3.8]
        title: Reach your own conclusion
        body: When you put notes from **several sources** together, you can see something that none of them says alone. That is a new conclusion, and it’s yours.

  - title: Can you trust this source?
    blocks:
      - type: visual
        covers: [S3.4, S3.5]
        component: card-sort
        props:
          bins:
            - { id: strong, label: Valid and reliable, icon: ✅ }
            - { id: check, label: Check it first, icon: ⚠️ }
          cards:
            - { text: A provincial park website about bears, bin: strong, why: 'People who work with bears wrote it, and it is kept up to date.' }
            - { text: A library book by a wildlife biologist, bin: strong, why: 'The author is an expert, and you can find out who they are.' }
            - { text: "A video with no name on it, saying “Bears sleep underwater!”", bin: check, why: 'No one takes responsibility for it, and the claim sounds strange. Check it against other sources.' }
            - { text: A website selling bear spray that says bears attack every day, bin: check, why: 'The site wants to sell you something, so it may exaggerate. Compare it with other sources.' }
            - { text: "A forum post that says, “My uncle told me bears can run 200 km/h”", bin: check, why: 'You have no way to know this. Check it against other sources.' }
        caption: Who wrote it? Why? Is it up to date? Do other sources agree?

  - title: People are sources too
    blocks:
      - type: compare
        covers: [K3.3, K3.4, K3.5]
        columns:
          - title: Knowledge Keeper
            body: A respected community member who is recognized as having **expertise** in specific issues or skills.
          - title: Elder
            body: A person recognized by their community as having **historical, cultural and spiritual knowledge and wisdom**.
          - title: Spiritual leader
            body: A person who guides others in a community’s spiritual life. Spiritual leaders, too, can be sources of knowledge.
      - type: callout
        variant: tip
        covers: [K3.6, K3.7, S3.7]
        title: Ask how to ask
        body: |-
          - **Protocols** are ways of showing respect.
          - They may vary by source, context, community or culture. There can be protocols for sharing stories and histories.
          - Always ask ahead of time what is right, and ask before you record or share what you hear.

  - title: Use information ethically
    blocks:
      - type: table
        covers: [K3.10, S3.7]
        caption: Three habits of an ethical researcher
        headers: [Habit, What it looks like]
        rows:
          - ['**Ask permission**', 'Ask your friend before you share the photo they took, or the story they told you.']
          - ['**Cite your sources**', 'Note where your information came from, such as the title and website or author.']
          - ['**Be fair and accurate**', 'Don’t change what someone said or make a person look worse than they are. If someone said “sometimes,” don’t write “always.”']
      - type: example
        covers: [S3.6, K3.10]
        title: Notes in your own words
        problem: 'A website says: “Grizzly bears may eat for 20 hours a day in the fall, to store fat for the winter.”'
        steps:
          - '**Don’t copy it.** Close the page, and think about what it means.'
          - '**Write your note:** Fall: eat most of the day, to store fat.'
          - '**Cite the source:** Name of the website, and the date you read it.'

  - title: Write it, and share it
    blocks:
      - type: example
        covers: [S3.1, S3.3]
        title: A main idea, with support
        problem: Write to explain how grizzly bears get ready for winter.
        steps:
          - '**Main idea:** Grizzly bears spend the fall getting ready for a long winter.'
          - '**Fact:** They eat for most of the day to store fat.'
          - '**Detail:** They eat berries, roots, and other foods they find.'
          - '**Explanation:** The stored fat keeps them alive while they sleep through the winter.'
      - type: compare
        covers: [K3.9]
        columns:
          - title: 🖼️ Visual
            body: A labelled drawing of a den, or a map
          - title: 📝 Written
            body: A report or a booklet
          - title: 💻 Digital
            body: A slide show or a web page

keyTerms:
  - term: Research question
    covers: [K3.1, S3.2]
    definition: A clear question that guides your research.
  - term: Reliable
    covers: [S3.4]
    definition: Able to be trusted to be correct.
  - term: Elder
    covers: [K3.5]
    definition: A person recognized by their community as having historical, cultural and spiritual knowledge and wisdom.
  - term: Knowledge Keeper
    covers: [K3.4]
    definition: A respected community member who is recognized as having expertise in specific issues or skills.
  - term: Protocol
    covers: [K3.6, K3.7]
    definition: A way of acting that shows respect when you access or share information. It can vary by source, community or culture.
  - term: Citing
    covers: [K3.10]
    definition: Giving basic information about where your information came from.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: apply
    covers: [K3.2, S3.2]
    type: order
    prompt: Drop this topic down the funnel. Put these in order, from the broadest to the one that is ready for a short report.
    items:
      - Sports
      - Winter sports
      - Curling
      - Why do curlers sweep the ice?
    hints:
      - Which one could fill a whole library? Start there.
      - Each step should fit inside the one before it.
    solution:
      - Each step is a smaller part of the one before it. *Curling* is one winter sport, and winter sports are one kind of sport.
      - The last step turns the topic into a **clear question** that you could answer in a few paragraphs.

  - id: w2
    level: 1
    thinking: recall
    covers: [K3.5, K3.3]
    type: mc
    prompt: Who recognizes a person as an **Elder**?
    choices: [Their community, Their school, A government office, The person themselves]
    answer: 0
    feedback:
      '1': Schools may invite Elders to visit, but a school doesn’t decide who is one.
      '2': This isn’t a job that an office gives out.
      '3': Elders don’t give themselves this role. Who knows their knowledge and wisdom best?
    hints:
      - Who has seen this person’s knowledge and wisdom over many years?
    solution:
      - Elders are recognized by **their communities** as having historical, cultural and spiritual knowledge and wisdom.

  - id: w3
    level: 1
    thinking: apply
    covers: [K3.10, S3.7]
    type: mc
    prompt: Jia’s report says that a beaver’s front teeth never stop growing. Which note beside it **cites** her source?
    choices:
      - (*Beavers at Work*, by M. Roy)
      - (I read it somewhere)
      - (A book at the library)
      - (Lots of people know this)
    answer: 0
    feedback:
      '1': Where? A reader couldn’t find “somewhere” to check it.
      '2': That’s closer, but which book? There are thousands in a library.
      '3': How many people know something doesn’t tell a reader where to check it.
    hints:
      - Pretend you’re the reader and you want to check this fact. Which note lets you find it?
    solution:
      - Citing gives basic information, such as the title and the author, so that a reader could find the same source.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b2
    level: 2
    thinking: model
    covers: [S3.5, K3.3]
    type: multi
    prompt: |-
      Gwen’s research question is, “How did our town’s ferry work before the bridge was built?” Which sources are relevant? Choose all that apply.
    choices:
      - An old newspaper story about the ferry’s first crossing
      - A neighbour who rode the ferry as a child
      - Photos of the ferry at work, from the town museum
      - A new video on how to steer a modern speedboat
      - A storybook about a ferry that can talk to fish
      - A book about the tallest bridges in the world
    answer: [0, 1, 2]
    feedback:
      '3': It’s about boats, but not this boat, and not back then.
      '4': A storybook is made up, so it can’t tell Gwen how a real ferry worked.
      '5': It’s about bridges, but Gwen’s question is about the time before the bridge.
    hints:
      - For each source, ask whether it could tell Gwen something about **this** ferry.
    solution:
      - Keep the question in front of you. A source is relevant only if it helps to answer it.
      - The three good sources are also different kinds. A newspaper, a person and photos can each show something that the others miss.

  - id: b3
    level: 2
    thinking: flaw
    covers: [K3.10, S3.7]
    type: mc
    prompt: |-
      Coach Hale told the school newspaper:

      > “This is the best team I have ever coached at losing water bottles.”

      Zeke’s article says:

      > Coach Hale says, “This is the best team I have ever coached.”

      What is the problem?
    choices:
      - Cutting the end changes what the coach meant, so the quotation isn’t fair or accurate.
      - Nothing is wrong, because every word in the quotation really did come from the coach.
      - Zeke only used one source, so he has to ask a second coach what the team is like.
      - Zeke didn’t cite the quotation, because he never said who gave him those words.
    answer: 0
    feedback:
      '1': The words are real. But what would readers believe about the team? Is that what the coach meant?
      '2': One source can be enough for what one coach said. Look at how the quotation was changed.
      '3': Zeke did name the coach. Compare the two quotations again.
    hints:
      - What did the coach really think about this team? What will readers of the article think?
      - Compare the endings of the two quotations.
    solution:
      - Compare what the coach meant with what readers will now believe. The coach said that the team is great at losing water bottles, not great at the game!
      - Every word is real, and the quotation is still unfair. Using information ethically means showing what people really meant.

  - id: b4
    level: 2
    thinking: evidence
    covers: [S3.3, U3.1, K3.8]
    type: mc
    prompt: |-
      Yara watched a chipmunk at a campsite and took these notes.

      - Stuffed its cheeks with seeds until its face looked like a ball.
      - Ran to a hole under the picnic table.
      - Came back with skinny cheeks. Did this six times.
      - Stole a corner of Dad’s granola bar. Same hole.

      Which main idea do **all** of her notes support?
    choices:
      - This chipmunk is busy moving food into a hiding place.
      - This chipmunk has learned to steal from hungry campers.
      - Chipmunks are small animals that live all over Canada.
      - This chipmunk is the fastest animal at the campground.
    answer: 0
    feedback:
      '1': The granola bar is only one note. What about the seeds?
      '2': None of her notes are about Canada, or about chipmunks in general.
      '3': Do any of the notes measure its speed?
    hints:
      - Test each main idea against all four notes, one at a time.
      - Where does the food go? What happens to the cheeks?
    solution:
      - A main idea has to hold up all of the details. Test each one against each note.
      - Food goes in, the chipmunk runs to the hole, and it comes back with empty cheeks. No note says “hiding place,” but all of them point to it.
      - That is a new conclusion, and Yara reached it by looking at her notes together.

  - id: b6
    level: 2
    thinking: flaw
    covers: [K3.7, K3.6, S3.7, K3.10]
    type: mc
    prompt: |-
      Imagine that a Cree Elder visits your class and shares a story. Jules plans to record it and put it on the school website. “It’s fine,” says Jules. “I’ll put the Elder’s name on it.”

      What has Jules missed?
    choices:
      - Naming a source isn’t the same as having permission, so ask about protocols first.
      - A name alone isn’t a full citation, so Jules should also add the date of the visit.
      - A website isn’t the right form, so Jules should share the recording with the class.
      - A story told aloud belongs to anyone who hears it, so Jules doesn’t need the name.
    answer: 0
    feedback:
      '1': The date is useful, but even a perfect citation doesn’t answer this question. Who decides whether the story is shared?
      '2': The class hasn’t been told that it can record or share the story, either. What comes before choosing a form?
      '3': A story can belong to someone even after you have heard it. There can be protocols for sharing stories.
    hints:
      - Whose story is it? Who gets to decide where it goes?
      - Citing tells people where something came from. What does it **not** give you?
    solution:
      - Citing and asking permission are two different habits. Jules has thought about the first one only.
      - Protocols may vary by community and culture, and there can be protocols for sharing stories. So Jules can’t guess. Ask the Elder ahead of time, before anything is recorded or shared.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: breakdown
    covers: [U3.1, S3.6, K3.10]
    type: investigation
    prompt: |-
      **Research question:** Why does the east hall of the school smell awful every Thursday?

      Here are your notes.

      1. Lunch menu: Fish sticks are served every Wednesday.
      2. Kitchen staff: Leftover food goes into the bins by the east door.
      3. Library sign: Books are due every Thursday.
      4. Caretaker: The bins by the east door get emptied on Fridays only.
    parts:
      - type: mc
        prompt: Which note can you set aside?
        choices: [Note 1, Note 2, Note 3, Note 4]
        fixedOrder: true
        answer: 2
        feedback:
          '0': Fish sticks are a strong clue about what could smell. Keep this one for now.
          '1': This note tells you where the food ends up, and that’s near the east hall. Keep it.
          '3': This note tells you how long things stay in those bins. Keep it.
        hints:
          - One note says *Thursday*. Does that make it useful? Would library books explain a smell?
        solution:
          - Note 3 has the word *Thursday*, but it has nothing to do with a smell in the east hall. A matching word doesn’t make a note relevant.
      - type: mc
        prompt: No note mentions a smell. Put the other three together. What is the best conclusion?
        choices:
          - Wednesday’s leftover fish sticks sit in the east bins until they’re emptied on Friday.
          - Fish sticks are served on Thursdays, so the hall smells on the same day as the lunch.
          - The caretaker forgets to clean the east hall each Thursday, so the smell builds up.
          - The kitchen staff put leftovers in the hall every day, so it always smells the same.
        answer: 0
        feedback:
          '1': Check the menu note again. Which day are fish sticks served?
          '2': The note says only when the bins get emptied. Does it say that anybody forgets anything?
          '3': The research question says that the smell comes on Thursdays. Does this explain that?
        hints:
          - Follow one fish stick through the week. Where is it on Wednesday? Thursday? Friday?
        solution:
          - On Wednesday, the leftovers go into the bins. On Thursday, they’re still there, a day older. On Friday, they’re gone.
          - None of the notes says this alone. You reached it by putting them together.
      - type: mc
        prompt: You write this in your report. “The caretaker says that old fish sticks cause the Thursday smell.” What is wrong with it?
        choices:
          - The caretaker never said that. The conclusion is yours, so it shouldn’t be credited to him.
          - You need to cite the lunch menu here instead, since the fish sticks came from that note.
          - A report can only repeat what its sources say, so you must leave your conclusion out.
          - Nothing is wrong with it, since the caretaker’s note was one of the ones you used.
        answer: 0
        feedback:
          '1': The menu didn’t say this either. Did any single source say it?
          '2': Reaching a new conclusion is one of the best parts of research. How can you show whose it is?
          '3': Read his note again. What did he really say? What did you work out?
        hints:
          - Find the caretaker’s note. Does it mention fish sticks or a smell?
        solution:
          - He only told you when the bins get emptied. Being fair and accurate means not putting your words in his mouth.
          - A better way is to say, “The caretaker says the bins are emptied on Fridays. I think that this explains the smell.”
    wrapUp: Notes put together can show something that no source says alone. That conclusion is yours, so say that it’s yours, and let each source say only what it really said.

  - id: d2
    level: 3
    thinking: evidence
    covers: [S3.4, S3.5]
    type: multi
    prompt: |-
      You are researching the monster said to live in Lake Wobble, a made-up lake. You have three sources:

      - a scientist who has studied the lake for twenty years
      - the owner of the Monster Gift Shop
      - a 1952 newspaper with a photo of a dark shape in the water

      Which of these can you reasonably trust? Choose all that apply.
    choices:
      - The shop owner, on how many monster T-shirts she sold last summer
      - The scientist, on how deep the lake is
      - The newspaper, on whether people were talking about a monster in 1952
      - The shop owner, on whether the monster is real
      - The newspaper, on what the dark shape in the photo really was
      - The scientist, on which T-shirt looks the best
    answer: [0, 1, 2]
    feedback:
      '3': She’s honest about her sales, maybe, but what happens to her shop if there’s no monster?
      '4': A photo shows a dark shape. Can it tell you what that shape was?
      '5': Being an expert on a lake doesn’t make someone an expert on T-shirts!
    hints:
      - Don’t sort the sources into good and bad. Ask what each one is really in a position to know.
      - For each choice, ask whether this source has a reason to get it wrong, and how it could know.
    solution:
      - The question isn’t “Can I trust this source?” It’s “Can I trust this source **for this**?”
      - The shop owner keeps track of her sales, but she earns money if people believe in the monster. The scientist knows the lake, not T-shirts.
      - The newspaper can’t tell us what the shape was, but it does show what people were talking about in 1952. A source can be reliable for something different from what it claims.
