id: inference-evidence
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI7
outcomes: [LANENG5-OI7-GQ1-LO1]
order: 6
title: Making Inferences with Text Evidence
shortTitle: Inferences & text evidence
summary: >-
  Read like a detective: tell explicit from implicit ideas, make inferences from clues, prove them with
  text evidence, and revise predictions as you read.

bigIdea: |-
  Authors don't tell you everything. Some ideas are **explicit** (stated in the words). Others are
  **implicit** (hinted at). You make an **inference** by putting **clues in the text** together with
  **what you already know**, and you support it with **evidence** from the text.

lesson:
  - title: How an inference is built
    blocks:
      - type: visual
        covers: [K1.1, S3.2]
        component: inference-equation
        props:
          examples:
            - clue: Leo's umbrella is dripping and his shoes squeak on the floor.
              know: Things get wet when it rains.
              inference: It is raining outside.
            - clue: Priya keeps checking the clock and tapping her foot.
              know: People do that when they are waiting and getting impatient.
              inference: Priya is impatient for something to start.
            - clue: The cookie jar is empty, and the dog has crumbs on its nose.
              know: Dogs eat food they can reach.
              inference: The dog ate the cookies!
        caption: Press the button to build each inference one part at a time.

  - title: Explicit or implicit?
    blocks:
      - type: compare
        covers: [K3.1, S3.1, U3.1]
        columns:
          - title: Explicit
            body: |-
              **Stated** right in the words.

              > Sam was nervous about the test.

              Find it by **looking** in the text.
          - title: Implicit
            body: |-
              **Hinted at.** The reader works it out.

              > Sam chewed his pencil and read the first question five times.

              Find it with **clues + what you know**.

  - title: Read the story
    blocks:
      - type: text
        covers: [S1.1, K3.2]
        body: As you read, notice what the characters **do** and **say**. Make a prediction about what will happen tomorrow.
      - type: passage
        id: arch
        title: The Arch
        form: Realistic fiction
        paragraphs:
          - The thermometer outside the kitchen window read minus twenty-six. Nadia pressed her forehead against the frosty glass and watched her breath make a cloud. Tomorrow, her whole class was going skating on the lagoon at Bowness Park. She had been counting down the days for two weeks.
          - “Great,” she said to no one, and pushed her skates deeper into the back of the closet.
          - Grandpa Ray came in from shovelling the walk, stamping snow off his boots. His eyebrows were white with frost. He hung up his coat, then stopped at the window and squinted toward the mountains in the west.
          - A long band of clear blue sky stretched above them, as straight as if someone had drawn it with a ruler. Above the band, the clouds were thick and grey.
          - “Look at that arch,” Grandpa said. He smiled the way he did when he knew the answer to a riddle. “Leave your heavy mitts at home tomorrow.”
          - Nadia rolled her eyes. “Very funny, Grandpa. It's minus twenty-six.”
          - “I've been watching that sky for seventy winters,” he said, and went to make tea.
          - That night, something woke Nadia. A strong wind was pushing against the house, and from the roof came a steady drip, drip, drip. She pulled her blanket over her head and fell back asleep.
          - In the morning, the thermometer read plus seven. The icicles along the garage were shrinking, and water ran down the driveway in shiny streams. Nadia unzipped her winter coat halfway, then all the way. She dug to the back of the closet, pulled out her skates, and ran for the door.
          - “Mitts?” Grandpa called after her.
          - Nadia held up her thinnest pair and grinned.
        note: An original story written for AB Edu. Paragraph numbers help you point to evidence.

  - title: An inference, step by step
    blocks:
      - type: example
        covers: [S3.2, S3.3, S3.5]
        title: What made the drip, drip, drip?
        problem: In paragraph 8, what is making the **drip, drip, drip** sound?
        steps:
          - '**Clue:** “A strong wind was pushing against the house, and from the roof came a steady drip, drip, drip.” (paragraph 8)'
          - '**What I know:** When snow on a roof melts, water drips off the edge.'
          - '**Inference:** The weather is getting warmer, and the snow on the roof is melting.'
          - '**Check:** In paragraph 9 the thermometer reads plus seven and the icicles are shrinking. Confirmed ✓'
        answer: The snow on the roof is **melting** because the weather got warmer overnight.

  - title: Predict, then check
    blocks:
      - type: table
        covers: [K3.2, S3.3]
        caption: Good readers keep checking their predictions as they read.
        headers: [After paragraph…, A reader might predict…, Then the text shows…, So the reader…]
        rows:
          - ['2', 'Nadia will skip the skating trip.', 'Paragraph 9: she pulls out her skates and runs for the door.', '**Revises** the prediction.']
          - ['5', 'The weather will get warmer.', 'Paragraph 9: the thermometer reads plus seven.', '**Confirms** the prediction.']

  - title: Strong evidence
    blocks:
      - type: compare
        covers: [S3.5]
        columns:
          - title: ❌ Weak
            body: '"Nadia seems sad."'
          - title: ✅ Strong
            body: '"In paragraph 2, Nadia pushes her skates deeper into the closet."'
      - type: callout
        variant: tip
        covers: [S3.5]
        title: Point to the exact words
        body: Quote the words, or name the paragraph number, so your reader can check your evidence.

  - title: Your reading toolkit
    blocks:
      - type: table
        covers: [K1.1, K1.2, K1.6, S1.1, U1.1]
        caption: You have now used two of these with “The Arch.” Good readers use all six before, during and after reading.
        headers: [Strategy, What you do, 'In “The Arch”']
        rows:
          - ['**Predicting**', 'Guess what comes next.', 'The weather will change.']
          - ['**Inferring**', 'Work out what is hinted at.', 'The roof is dripping, so it is getting warmer.']
          - ['**Making connections**', 'Link the text to your life, to other texts or to the world.', 'My grandmother reads the sky, too.']
          - ['**Summarizing**', 'Give the main idea briefly.', 'Grandpa reads the sky and knows that a warm spell is coming.']
          - ['**Synthesizing**', 'Put ideas together into something new.', 'Long experience can teach what a thermometer can’t.']
          - ['**Evaluating**', 'Make a judgement, based on evidence in the text.', 'Grandpa is a good weather reader, because he was right.']
      - type: callout
        variant: tip
        covers: [K1.6, K1.7]
        title: Know why you are reading
        body: 'Reading is easier when your **purpose** is clear. For a report, you also manage information: research it, organize it, and use it for that purpose.'

  - title: When reading gets stuck
    blocks:
      - type: visual
        covers: [K1.4, S1.3]
        component: card-sort
        props:
          bins:
            - { id: reread, label: Reread, icon: 🔁 }
            - { id: rate, label: Adjust my rate, icon: 🐢 }
            - { id: ask, label: Ask questions, icon: ❓ }
            - { id: clues, label: Use context clues, icon: 🔍 }
            - { id: resources, label: Use a resource, icon: 📖 }
          cards:
            - { text: I got to the end of the page and I don't know what happened., bin: reread, why: 'Go back and read it again.' }
            - { text: "This part has lots of details, and I'm rushing.", bin: rate, why: 'Slow down for the harder parts.' }
            - { text: Why would Grandpa smile at a cold sky?, bin: ask, why: 'Asking questions gives you something to look for.' }
            - { text: "I don't know “squinted,” but he is looking at something far away.", bin: clues, why: 'The words around it hint at its meaning.' }
            - { text: "Paragraph 4 describes an arch, and I can't picture it.", bin: resources, why: 'A picture or a dictionary can help.' }
        caption: Noticing that you are lost is called **self-monitoring**. What would you do in each case?
      - type: compare
        covers: [K1.3, K1.5, S1.2]
        columns:
          - title: 🧠 Metacognition
            body: '**Thinking about your thinking.** “Wait. I’m confused. What part lost me?”'
          - title: ✅ Did it work?
            body: After you try a strategy, check it. If you still don't understand, try another. Reading gets more fluent as this gets easier.

keyTerms:
  - term: Explicit
    covers: [K3.1]
    definition: Stated directly in the text.
  - term: Implicit
    covers: [K3.1]
    definition: Hinted at but not stated directly. The reader works it out.
  - term: Inference
    covers: [K3.2, S3.2]
    definition: An idea you work out by putting clues in the text together with what you already know.
  - term: Evidence
    covers: [S3.5]
    definition: The exact words or details from a text that support your answer.
  - term: Prediction
    covers: [K3.2, S3.3]
    definition: A thoughtful guess about what will happen, which you confirm or revise as you read.
  - term: Context clues
    covers: [K1.4]
    definition: Words around an unfamiliar word that help you work out its meaning.
  - term: Self-monitoring
    covers: [K1.4]
    definition: Noticing when you stop understanding, and using a skill to make sense of the text.
  - term: Metacognition
    covers: [K1.5]
    definition: Thinking about your own thinking, to help you understand better.
  - term: Evaluating
    covers: [K1.2]
    definition: Making a judgement based on evidence in the text.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    thinking: notice
    covers: [K3.1, S3.1]
    type: mc
    figure: |-
      <svg viewBox="0 0 390 140" class="fig-svg" role="img" aria-label="Three pictures of the sky over mountains. Picture 1: a curved blue arch, like a rainbow, across grey clouds. Picture 2: a straight band of blue sky just above the mountains, with thick grey clouds above the band. Picture 3: thick grey clouds just above the mountains, with blue sky above the clouds.">
        <g>
          <rect width="120" height="110" fill="#8e93a0"/>
          <ellipse cx="28" cy="20" rx="24" ry="11" fill="#7c818e"/><ellipse cx="94" cy="24" rx="22" ry="11" fill="#7c818e"/>
          <path d="M14 104 Q60 -30 106 104" fill="none" stroke="#8fcdf2" stroke-width="18"/>
          <polygon points="0,110 25,78 43,92 65,70 87,90 105,76 120,88 120,110" fill="#565e6c"/>
          <text class="fig-label" x="60" y="132" text-anchor="middle">Picture 1</text>
        </g>
        <g transform="translate(135 0)">
          <rect width="120" height="50" fill="#8e93a0"/>
          <ellipse cx="30" cy="22" rx="24" ry="12" fill="#7c818e"/><ellipse cx="88" cy="20" rx="26" ry="12" fill="#7c818e"/>
          <rect y="50" width="120" height="60" fill="#8fcdf2"/>
          <polygon points="0,110 25,78 43,92 65,70 87,90 105,76 120,88 120,110" fill="#565e6c"/>
          <text class="fig-label" x="60" y="132" text-anchor="middle">Picture 2</text>
        </g>
        <g transform="translate(270 0)">
          <rect width="120" height="50" fill="#8fcdf2"/>
          <rect y="50" width="120" height="60" fill="#8e93a0"/>
          <ellipse cx="34" cy="62" rx="24" ry="8" fill="#7c818e"/><ellipse cx="90" cy="60" rx="24" ry="7" fill="#7c818e"/>
          <polygon points="0,110 25,78 43,92 65,70 87,90 105,76 120,88 120,110" fill="#565e6c"/>
          <text class="fig-label" x="60" y="132" text-anchor="middle">Picture 3</text>
        </g>
      </svg>
    prompt: |-
      Grandpa calls it an **arch**. Now look at what the author wrote in paragraph 4:

      > A long band of clear blue sky stretched above them, as straight as if someone had drawn it with a ruler. Above the band, the clouds were thick and grey.

      “Them” means the mountains. Which picture matches the author’s words?
    choices: [Picture 1, Picture 2, Picture 3]
    fixedOrder: true
    answer: 1
    feedback:
      '0': The word *arch* makes many of us picture this shape. What do the author’s words say about the shape of the band?
      '2': Read the last sentence again. Where are the clouds, compared with the band?
    hints:
      - Which words tell you the **shape** of the blue band?
      - Check one detail at a time. Where is the blue, and where are the clouds?
    solution:
      - Test each picture against the words, one detail at a time.
      - '“As straight as if someone had drawn it with a ruler” means no curve. That rules out Picture 1.'
      - '“Above the band, the clouds were thick and grey” puts the clouds on top. That rules out Picture 3.'
      - Picture 2 fits every detail. These details are **explicit**. When the picture in your head doesn’t match the words, trust the words.

  - id: w2
    level: 1
    thinking: notice
    covers: [K3.1, S3.1, U3.1]
    type: multi
    prompt: Which of these ideas are **explicit** in “The Arch”? Choose every idea the story states outright.
    choices:
      - Nadia’s class was going skating the next day.
      - A strong wind blew against the house that night.
      - In the morning, the icicles were getting smaller.
      - Nadia did not believe what Grandpa told her.
      - Grandpa felt sure about the weather.
    answer: [0, 1, 2]
    feedback:
      '3': Can you point to a sentence that says this? Look again at what she does and says in paragraph 6.
      '4': Can you point to a sentence that says this? Or did you work it out from how he acts?
    hints:
      - For each idea, try to put your finger on one sentence that says it.
      - Different words with the same meaning still count as explicit. *Shrinking* means getting smaller.
    solution:
      - '**Explicit** ideas are stated, even if you say them in your own words: the trip (paragraph 1), the wind (paragraph 8) and the shrinking icicles (paragraph 9).'
      - '**Implicit** ideas are hinted at. No sentence says Nadia didn’t believe him. You work it out from her rolled eyes and “Very funny.”'
      - The same goes for Grandpa feeling sure. You work that out from his smile and his seventy winters.

  - id: w3
    level: 1
    thinking: apply
    covers: [K1.1, S3.2]
    type: mc
    prompt: |-
      > Mina sits at the window with her boots on and her backpack zipped. Each time a car turns the corner, she sits up tall.

      A reader infers: *Mina is waiting for someone to come and get her.*

      Which of these is the **what I already know** part of that inference?
    choices:
      - People watch the road when they are expecting someone.
      - Mina has her boots on and her backpack zipped.
      - Mina is waiting for someone to come and get her.
      - People wear boots when there is snow outside.
    answer: 0
    feedback:
      '1': This is in the text, so it is a **clue**. What did you bring from your own life?
      '2': This is where you end up, so it is the **inference**. What helped you get there?
      '3': You do know this, but where does it lead? It might tell you about the weather. Does it tell you why she watches the cars?
    hints:
      - Which choices could you know even if you had never read about Mina?
      - Of those, which one links the watching to the waiting?
    solution:
      - 'Sort the pieces. Clue: boots on, backpack zipped, sitting up at each car. Inference: she is waiting for a ride.'
      - The missing link comes from your own life. People watch the road when they are expecting someone.
      - Knowing something true isn’t enough. It has to connect the clue to the inference.

  - id: w4
    level: 1
    thinking: recall
    covers: [K1.1, K1.2, S1.1]
    type: mc
    prompt: Four friends finish “The Arch,” and each one says something about it. Which friend is **evaluating**?
    choices:
      - “Nadia should have listened, because Grandpa had watched that sky for seventy winters.”
      - “A girl gives up on a skating trip, until one warm night changes her mind.”
      - “My uncle checks the clouds every morning on his farm, just like Grandpa does.”
      - “Nadia will listen next time Grandpa reads the sky, because she saw he was right.”
    answer: 0
    feedback:
      '1': This gives the main idea briefly. That is **summarizing**.
      '2': This links the story to someone in the friend’s own life. That is **making a connection**.
      '3': This looks ahead to what might happen next. That is **predicting**, even with a good reason attached.
    hints:
      - What is each friend doing? Retelling, linking to life, looking ahead, or judging?
      - Evaluating makes a judgement and backs it up with evidence from the text.
    solution:
      - '“Should have listened” is a **judgement**. “Watched that sky for seventy winters” is the **evidence** from the text.'
      - A judgement backed by evidence is **evaluating**.

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    thinking: why
    covers: [S3.1, S3.2, S3.4]
    type: mc
    prompt: |-
      Nadia has just seen the thermometer.

      > “Great,” she said to no one, and pushed her skates deeper into the back of the closet.

      What does she really mean by **“Great”**?
    choices:
      - This cold is bad news for my trip.
      - This cold will make the ice perfect.
      - My skates are put away, all ready to go.
      - I can’t wait to tell Grandpa.
    answer: 0
    feedback:
      '1': That takes the word at face value, and it even has a reason. But look at her hands. Would someone happy about the ice do that with her skates?
      '2': Picture what she does. If you were getting skates ready, would you push them **deeper into the back** of a closet?
      '3': Look at three words in the sentence, “to no one.” Grandpa doesn’t come in until paragraph 3.
    hints:
      - Look at what she does right after she speaks. Do her words and her hands agree?
      - When someone’s words and actions don’t match, which would you trust?
      - Say “Great” out loud the way someone would after getting bad news. Does it fit the sentence?
    solution:
      - The word itself is explicit, but its meaning isn’t. So check it against what she does.
      - She pushes the skates away and deeper in. People don’t do that with something they are happy about.
      - Paragraph 1 adds the reason. The trip she has waited two weeks for is tomorrow, and it is minus twenty-six.
      - '**What we learned:** words in quotation marks can mean the opposite of what they say. Actions are evidence too.'

  - id: b2
    level: 2
    thinking: whatif
    covers: [S3.2, S3.4]
    type: mc
    prompt: |-
      The story ends like this:

      > “Mitts?” Grandpa called after her.
      >
      > Nadia held up her thinnest pair and grinned.

      Suppose the author had written “her mitts” and left out *thinnest*. What is the most important thing we would lose?
    choices:
      - A silent way for Nadia to tell Grandpa that he was right.
      - The only clue that it has turned warm outside this morning.
      - The clue that shows Nadia has decided to go skating.
      - The fact that Nadia owns more than one pair of mitts.
    answer: 0
    feedback:
      '1': Thin mitts do fit warm weather. But is this the only clue? Look back at paragraph 9.
      '2': Would we still know this without the word? Look at what she does with her skates.
      '3': The word does tell us this. But would the ending feel any different without that fact?
    hints:
      - What did Grandpa say about mitts in paragraph 5? How did Nadia react?
      - Take each choice. Would we still know it if *thinnest* were gone?
      - One word, “Mitts?”, is really a bigger question. What is Grandpa asking her?
    solution:
      - 'Go back to where mitts first come up. Grandpa says, “Leave your heavy mitts at home,” and Nadia rolls her eyes.'
      - So “Mitts?” is really a friendly tease. *Well, what do you think of my advice now?*
      - Holding up her **thinnest** pair answers him without a word. *You were right.* The grin says she doesn’t mind.
      - The warm weather and the skating trip already come through in paragraph 9. One small word carries the whole joke between them.

  - id: b3
    level: 2
    thinking: evidence
    covers: [S3.2, S3.3, S3.5]
    type: evidence
    prompt: Nadia expected another bitter cold day. In the morning, new information makes her **revise** that. Tap the sentence that shows her changing her mind **little by little**.
    passage: arch
    paragraphs: [8, 9]
    answer: [p9s3]
    feedback:
      p8s1: Something woke her, but what does she do about it?
      p8s2: This is a clue for the reader. Is Nadia working anything out yet?
      p8s3: She goes back to sleep here, so she isn’t changing her mind yet.
      p9s1: This is the new information itself. Find what Nadia does about it.
      p9s2: This is more new information about the weather. Find what Nadia does about it.
      p9s4: By now her mind is made up, because she is already running. Look for the step just before this.
    hints:
      - Which sentences tell you what Nadia **does**?
      - Is there a sentence where she does something in two stages?
    solution:
      - '“Nadia unzipped her winter coat halfway, then all the way.”'
      - The author could have written “She unzipped her coat.” *Halfway, then all the way* lets us watch her test the warm air, then trust it.
      - Readers revise the same way. New information comes in, you check it, and you change your idea.

  - id: b4
    level: 2
    thinking: flaw
    covers: [K1.4, K1.5, S1.2, S1.3]
    type: mc
    prompt: |-
      Zoe reads paragraph 5 of “The Arch” three times, until she can say it from memory. “Got it,” she says.

      A friend asks, “Why does Grandpa say to leave the heavy mitts at home?” Zoe has no idea.

      What should Zoe learn from this about her reading?
    choices:
      - Rereading gave her the words, so now she needs a skill that helps with the meaning.
      - Rereading is the right skill, so she should read it a few more times until it clicks.
      - She read it too slowly, so she should read it faster to keep the ideas together.
      - The question is unfair, because paragraph 5 never says why Grandpa gave that advice.
    answer: 0
    feedback:
      '1': She can already say every word. What would one more time give her that she doesn’t already have?
      '2': Her speed isn’t what is stopping her. Would reading faster help her work out a hint?
      '3': It’s true that paragraph 5 doesn’t say. That makes the idea **implicit**, not unfair. How do readers find implicit ideas?
    hints:
      - Zoe can say the words. What can’t she do yet?
      - After you try a strategy, ask, “Did it work?” What did rereading do for Zoe, and what didn’t it do?
    solution:
      - 'Notice: the friend’s question shows Zoe that “Got it” wasn’t true yet.'
      - 'Check: rereading worked for remembering the words. It didn’t work for the meaning.'
      - 'Try something else: ask a question, such as “What is Grandpa looking at just before he speaks?” Then read paragraphs 3 and 4 for clues.'
      - 'What we learned: being able to say the words isn’t the same as understanding them.'

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    thinking: notice
    covers: [S3.1, S3.2, S3.5]
    type: multi
    prompt: Readers wrote these ideas after finishing “The Arch.” Some **go further than the story can support**. Choose every idea that goes too far.
    choices:
      - Grandpa knew the thermometer would read plus seven.
      - Nadia’s class had a wonderful time on the lagoon.
      - Grandpa has lived in the same house for seventy years.
      - Grandpa expected warmer weather by the next day.
      - Nadia decided to go once she saw how warm it was.
      - By the end, Nadia no longer thought the mitts were a joke.
    answer: [0, 1, 2]
    feedback:
      '3': There is good support for this one. What would make heavy mitts unnecessary?
      '4': There is good support for this one. Look at the order of what she does in paragraph 9.
      '5': There is good support for this one. Which mitts does she hold up at the end?
    hints:
      - For each idea, try to point to a clue. Does the clue really say that much, or only part of it?
      - Be careful with exact numbers, and with anything that would happen after the last line.
      - What does “seventy winters” tell you he was doing? Does it tell you where he lived?
    solution:
      - Grandpa’s advice supports “warmer,” because heavy mitts wouldn’t be needed. Nothing says he knew the exact number.
      - The story ends as Nadia runs out the door, so we never see the lagoon. She might have had a great time, but **we can’t tell**.
      - Seventy winters of watching the sky tells us how long he has been watching. It doesn’t tell us about his house.
      - The other three each have clues behind them. Her coat comes off before she digs out her skates, and she holds up her thinnest mitts with a grin.
      - 'What we learned: an inference needs clues behind it. “You can’t tell” is sometimes the smartest answer.'

  - id: d2
    level: 3
    thinking: decide
    covers: [S3.2, S3.4, S3.5]
    type: open
    prompt: |-
      Nadia has just rolled her eyes at Grandpa. Then:

      > “I’ve been watching that sky for seventy winters,” he said, and went to make tea.

      Why does he walk away without arguing?

      - **Ella** thinks his feelings are hurt.
      - **Jonah** thinks he is so sure that he doesn’t need to argue.

      Whose reading does the evidence support better? Use clues from **at least two different paragraphs**, and say how each clue helps. Then say what the other reader has in their favour.
    modelAnswer: |-
      Jonah’s reading is stronger. In paragraph 5, Grandpa “smiled the way he did when he knew the answer to a riddle.” People smile like that when they are enjoying a secret, not when they are worried about being believed. In paragraph 10, he calls “Mitts?” after Nadia. That sounds like friendly teasing, and I don’t think someone with hurt feelings would joke like that.

      Ella does have a point. He stops talking and leaves right after Nadia rolls her eyes, and that could look like hurt feelings. But no clue shows him upset. There are no sad words and no frown.
    rubric:
      - I chose one reading and said so clearly.
      - I used clues from at least **two different paragraphs**, and I quoted them or named the paragraphs.
      - I explained how each clue points to my reading (clue + what I know).
      - I was fair to the other reader, and I said what they have in their favour.
    hints:
      - Look at how Grandpa acts in paragraph 5, and again in paragraph 10.
      - Make two short lists, one of clues for Ella and one for Jonah. Which list is stronger?

  - id: d3
    level: 3
    thinking: flaw
    covers: [S3.5, S3.4, S3.2]
    type: investigation
    prompt: |-
      Liam writes: “Grandpa **wasn’t just guessing** about the weather. My proof: *In the morning, the thermometer read plus seven.*”

      Sana frowns. “That sentence is in the story. But does it prove **that**?”
    parts:
      - type: mc
        prompt: What does the sentence Liam quoted really show?
        choices:
          - That Grandpa’s advice turned out right, but not what it was based on.
          - That Grandpa had a good reason, because his advice turned out right.
          - Nothing at all, because a thermometer can’t really be trusted.
          - That Grandpa read the thermometer himself early that morning.
        answer: 0
        feedback:
          '1': Being right is good evidence that he gave good advice, and that is why we can judge him a good weather reader. But if you guess who will win a race and that runner wins, did you have a reason?
          '2': Nothing in the story makes us doubt the thermometer. The sentence does show something. It just may not be what Liam says.
          '3': The story doesn’t say who read it. And who read it wouldn’t tell us why Grandpa gave his advice the day before.
        hints:
          - Read Liam’s claim and his proof one at a time. What is the claim about? What is the proof about?
          - When does Liam’s sentence happen? When did Grandpa give his advice?
        solution:
          - Liam’s claim is about **why** Grandpa spoke up the day before. His proof is about the weather the next morning.
          - The sentence is good evidence for a different idea, that Grandpa’s advice was right. That is why we can call him a good weather reader.
          - But a lucky guess would turn out right too. To show he wasn’t guessing, we need clues from **before** the weather changed.
      - type: multi
        prompt: So which details **do** help show that Grandpa wasn’t just guessing?
        choices:
          - “Look at that arch,” Grandpa said.
          - “I’ve been watching that sky for seventy winters,” he said.
          - Nadia rolled her eyes.
          - The icicles along the garage were shrinking.
          - His eyebrows were white with frost.
        answer: [0, 1]
        feedback:
          '2': This shows what Nadia thinks, not where Grandpa’s advice came from.
          '3': This is Liam’s trap again. It shows the warm weather came, not what Grandpa based his advice on.
          '4': This shows he has been out in the cold. Does it show he can read the sky?
        hints:
          - You are looking for clues from **before** the weather changed. What was Grandpa looking at? How did he learn to read it?
        solution:
          - '“Look at that arch” shows he saw something in the sky. He gave his advice because of it.'
          - Seventy winters of watching tells us how he learned what it means. Together they give him a reason, and a guess doesn’t have one.
    wrapUp: A true sentence can still be the wrong evidence. Always ask, “Does this prove **my** idea, or something else?”

