id: inference-evidence
grade: 5
subject: english-language-arts
organizingIdea: LANENG-OI7
outcomes: [LANENG5-OI7-GQ1-LO1]
order: 6
title: Making Inferences with Text Evidence
shortTitle: Inferences & text evidence
summary: >-
  Read like a detective: tell explicit from implicit ideas, make inferences from clues, prove them with
  text evidence, and revise predictions as you read.

bigIdea: |-
  Authors don't tell you everything. Some ideas are **explicit** (stated right in the words). Others are
  **implicit** (hinted at). You make an **inference** by putting together **clues in the text** with
  **what you already know**, and you prove it with **evidence**: the exact words that led you there.

lesson:
  - type: visual
    component: inference-equation
    heading: How an inference is built
    props:
      examples:
        - clue: Leo's umbrella is dripping and his shoes squeak on the floor.
          know: Things get wet when it rains.
          inference: It is raining outside.
        - clue: Priya keeps checking the clock and tapping her foot.
          know: People do that when they are waiting and getting impatient.
          inference: Priya is impatient for something to start.
        - clue: The cookie jar is empty, and the dog has crumbs on its nose.
          know: Dogs eat food they can reach.
          inference: The dog ate the cookies!
    caption: Press the button to build each inference one part at a time.

  - type: table
    heading: Explicit or implicit?
    headers: ['', Explicit, Implicit]
    rows:
      - ['**Means**', 'Stated directly in the words', 'Hinted at; the reader works it out']
      - ['**Example**', '“Sam was nervous about the test.”', '“Sam chewed his pencil and read the first question five times.”']
      - ['**How you find it**', 'Look it up in the text', 'Clues + what you know = inference']

  - type: section
    heading: Read like a detective
    body: |-
      1. **Notice a clue.** What a character does, says or thinks, or a detail about the setting.
      2. **Add what you know** from your own life or other books.
      3. **Make an inference.** What does the author want you to figure out?
      4. **Keep checking.** As you read on, look for evidence that **confirms** your idea, or makes you **revise** it.

  - type: passage
    id: arch
    title: The Arch
    form: Realistic fiction
    paragraphs:
      - The thermometer outside the kitchen window read minus twenty-six. Nadia pressed her forehead against the frosty glass and watched her breath make a cloud. Tomorrow, her whole class was going skating on the lagoon at Bowness Park. She had been counting down the days for two weeks.
      - “Great,” she said to no one, and pushed her skates deeper into the back of the closet.
      - Grandpa Ray came in from shovelling the walk, stamping snow off his boots. His eyebrows were white with frost. He hung up his coat, then stopped at the window and squinted toward the mountains in the west.
      - A long band of clear blue sky stretched above them, as straight as if someone had drawn it with a ruler. Above the band, the clouds were thick and grey.
      - “Look at that arch,” Grandpa said. He smiled the way he did when he knew the answer to a riddle. “Leave your heavy mitts at home tomorrow.”
      - Nadia rolled her eyes. “Very funny, Grandpa. It's minus twenty-six.”
      - “I've been watching that sky for seventy winters,” he said, and went to make tea.
      - That night, something woke Nadia. A strong wind was pushing against the house, and from the roof came a steady drip, drip, drip. She pulled her blanket over her head and fell back asleep.
      - In the morning, the thermometer read plus seven. The icicles along the garage were shrinking, and water ran down the driveway in shiny streams. Nadia unzipped her winter coat halfway, then all the way. She dug to the back of the closet, pulled out her skates, and ran for the door.
      - “Mitts?” Grandpa called after her.
      - Nadia held up her thinnest pair and grinned.
    note: An original story written for AB Edu. Paragraph numbers help you point to evidence.

  - type: example
    title: An inference, step by step
    problem: In paragraph 8, what is making the **drip, drip, drip** sound?
    steps:
      - '**Clue:** “A strong wind was pushing against the house, and from the roof came a steady drip, drip, drip.” (paragraph 8)'
      - '**What I know:** When snow on a roof melts, water drips off the edge.'
      - '**Inference:** A warm wind is melting the snow on the roof.'
      - '**Check with more evidence:** In paragraph 9, the thermometer reads plus seven and the icicles are shrinking. ✓ Confirmed!'
    answer: 'The snow on the roof is melting because a **warm wind** arrived in the night.'

  - type: callout
    variant: tip
    title: Strong evidence points to exact words
    body: |-
      “**In paragraph 2, Nadia pushes her skates deeper into the closet**” is much stronger than “she seems sad.”
      Quote the words, or name the paragraph number, so your reader can check.

  - type: callout
    variant: connection
    title: Connection to Science
    body: |-
      Grandpa's arch is a real Alberta sign. A band of clear sky over the Rockies, called a **chinook arch**, often
      comes before a warm, dry **chinook** wind. Grandpa's "seventy winters" of watching the sky is a kind of
      long-term observation, like the ones you will explore in the Science weather and climate topic.

keyTerms:
  - term: Explicit
    definition: Stated directly in the text.
  - term: Implicit
    definition: Suggested or hinted at, but not stated directly. The reader has to work it out.
  - term: Inference
    definition: A conclusion you reach by combining clues in the text with what you already know.
  - term: Evidence
    definition: The exact words or details from a text that support your answer.
  - term: Prediction
    definition: A thoughtful guess about what will happen next, which you confirm or revise as you read.

problems:
  # ---------------------------------------------------------------- Level 1: Warm-up
  - id: w1
    level: 1
    type: mc
    prompt: In “The Arch,” what did the thermometer read **in the morning**?
    choices: [Plus seven, Minus twenty-six, Zero, Minus seven]
    answer: 0
    feedback:
      '1': Minus twenty-six was the temperature the day **before** (paragraph 1).
      '2': Zero is not mentioned in the story. Look at paragraph 9.
      '3': Read paragraph 9 again carefully. Is it plus or minus?
    hints:
      - This answer is **explicit**. It is stated right in the words. Look at paragraph 9.
    solution:
      - 'Paragraph 9 says: “In the morning, the thermometer read plus seven.”'
      - This is **explicit** information because the text states it directly.

  - id: w2
    level: 1
    type: mc
    prompt: |-
      Is this idea **explicit** or **implicit** in the story?

      > Nadia did not want to go skating in such cold weather.
    choices:
      - Implicit. The author hints at it, and the reader figures it out from clues.
      - Explicit. The author states it directly.
    fixedOrder: true
    answer: 0
    feedback:
      '1': Search the story. The author never writes that Nadia didn't want to go. We figure it out from what she says and does.
    hints:
      - Can you find a sentence that says exactly this? If not, how do you know it?
    solution:
      - The story never says “Nadia did not want to go.”
      - We **infer** it from clues, like her flat “Great” and pushing her skates into the closet. So it is **implicit**.

  - id: w3
    level: 1
    type: evidence
    prompt: Tap a sentence that shows the **weather changed** overnight.
    passage: arch
    paragraphs: [9]
    answer: [p9s1, p9s2]
    feedback:
      p9s3: Good thinking. She unzipped her coat **because** it was warm. But this sentence shows how Nadia reacted. Find a sentence about the weather itself.
      p9s4: This shows how Nadia feels, not what the weather is like.
    hints:
      - Look for a sentence about the temperature, or about snow and ice.
    solution:
      - '“In the morning, the thermometer read plus seven.” The temperature went from minus twenty-six to plus seven.'
      - '“The icicles along the garage were shrinking…” Melting ice is also evidence of warmer weather.'

  - id: w4
    level: 1
    type: mc
    prompt: Which is the best description of an **inference**?
    choices:
      - A conclusion you reach using clues from the text plus what you already know.
      - A sentence you copy word for word from the story.
      - A wild guess with no reasons.
      - The title of a story.
    answer: 0
    feedback:
      '1': Copying words gives you **evidence** or **explicit** information. An inference goes beyond the words.
      '2': An inference is a smart guess **with reasons**, which come from clues in the text.
      '3': A title can give clues, but it is not an inference.
    hints:
      - Think of the “equation” at the top of the lesson.
    solution:
      - 'Clue in the text + what I already know = **inference**.'

  # ---------------------------------------------------------------- Level 2: Build
  - id: b1
    level: 2
    type: evidence
    prompt: At the start, Nadia no longer wants to go skating. Tap the sentence that is the **best evidence**.
    passage: arch
    paragraphs: [1, 2]
    answer: [p2s1]
    feedback:
      p1s1: This tells us the temperature, but not how Nadia **feels** about the trip.
      p1s2: She is looking at the cold, but this sentence doesn't show her feelings about skating.
      p1s3: This explains what the trip is, not how Nadia feels about it now.
      p1s4: This shows she **was** excited before. Look for what she does after seeing the temperature.
    hints:
      - Look for something Nadia **says** or **does** after she sees how cold it is.
    solution:
      - '“Great,” she said to no one, and pushed her skates deeper into the back of the closet.'
      - Her flat “Great” doesn't really mean great, and hiding her skates shows she doesn't plan to use them.

  - id: b2
    level: 2
    type: mc
    prompt: Why does Grandpa tell Nadia to leave her heavy mitts at home?
    choices:
      - From the arch in the sky, he predicts that warm weather is coming.
      - He thinks she should stay home from the trip.
      - He forgot how cold it was outside.
      - Her heavy mitts are wet from shovelling.
    answer: 0
    feedback:
      '1': He wants her to go, just with lighter mitts. Nothing in the story says he wants her to stay home.
      '2': He just came in from shovelling with frost on his eyebrows. He knows it's cold **now**.
      '3': Grandpa did the shovelling, not Nadia, and the story doesn't mention wet mitts.
    hints:
      - What does Grandpa look at right before he speaks? (paragraphs 3 to 5)
      - What would make heavy mitts unnecessary?
    solution:
      - Grandpa sees the arch of clear sky over the mountains (paragraph 4).
      - Heavy mitts are for cold days, so telling her to leave them means he expects **warm** weather.
      - The ending confirms he was right.

  - id: b3
    level: 2
    type: evidence
    prompt: Tap the sentence that best shows **why Grandpa trusts** his prediction.
    passage: arch
    paragraphs: [5, 6, 7]
    answer: [p7s1]
    feedback:
      p5s1: This is where he points out the arch, but not why he trusts what it means.
      p5s2: His smile shows he is confident. Now find the sentence that explains **where** that confidence comes from.
      p5s3: This is his prediction, not his reason for trusting it.
      p6s1: This is Nadia's reaction, not Grandpa's reason.
    hints:
      - Look for what Grandpa says about his **experience**.
    solution:
      - '“I''ve been watching that sky for seventy winters,” he said…'
      - Seventy winters of watching the sky gives him a lot of experience with what the arch means.

  - id: b4
    level: 2
    type: mc
    prompt: How do Nadia's feelings change from the beginning of the story to the end?
    choices:
      - From disappointed to excited
      - From excited to disappointed
      - From scared to angry
      - They stay the same the whole time.
    fixedOrder: true
    answer: 0
    feedback:
      '1': That's backwards. At the end she grabs her skates and grins.
      '2': Nothing in the story suggests she is scared or angry. Look at her actions in paragraphs 2 and 9.
      '3': Compare paragraph 2 (skates pushed into the closet) with paragraph 9 (skates pulled out, running for the door).
    hints:
      - Compare what Nadia does with her skates in paragraph 2 and in paragraph 9.
    solution:
      - 'Beginning: she hides her skates and says a flat “Great”: **disappointed**.'
      - 'End: she grabs her skates, runs for the door, and grins: **excited**.'

  - id: b5
    level: 2
    type: mc
    prompt: In paragraph 3, Grandpa **squinted** toward the mountains. Using context clues, what does *squinted* most likely mean?
    choices:
      - Looked with his eyes partly closed, to see something far away
      - Shouted loudly
      - Closed his eyes to sleep
      - Turned his back
    answer: 0
    feedback:
      '1': Grandpa doesn't say anything until paragraph 5. What is he doing **toward the mountains**?
      '2': He is looking at something in the distance, not sleeping.
      '3': The next paragraph describes what he sees, so he must be **facing** the mountains.
    hints:
      - What does Grandpa do right after squinting? Paragraph 4 describes what he sees.
    solution:
      - Grandpa is looking at the faraway mountains, and paragraph 4 describes what he sees.
      - So *squinted* means he narrowed his eyes to see better.

  # ---------------------------------------------------------------- Level 3: Deep Think
  - id: d1
    level: 3
    type: evidence
    prompt: Tap the sentence that suggests Grandpa **already knew** what would happen, even before he said it.
    passage: arch
    paragraphs: [5]
    answer: [p5s2]
    feedback:
      p5s1: He points out the arch here, but this doesn't yet show that he knows what it means.
      p5s3: Here he **says** his prediction. Find the clue that shows he knew the answer **before** he spoke.
    hints:
      - Look at how Grandpa's face is described.
    solution:
      - '“He smiled the way he did when he knew the answer to a riddle.”'
      - The author compares the arch to a riddle that Grandpa has already solved. That is an implicit clue that he knows what's coming.

  - id: d2
    level: 3
    type: mc
    prompt: |-
      After paragraph 2, a reader might **predict** that Nadia will skip the skating trip.
      Which detail later makes the reader **revise** that prediction?
    choices:
      - She pulls out her skates and runs for the door.
      - She rolls her eyes at Grandpa.
      - A strong wind wakes her in the night.
      - Grandpa goes to make tea.
    answer: 0
    feedback:
      '1': Rolling her eyes shows she still doesn't believe Grandpa. That **supports** the first prediction.
      '2': The wind is a clue that the weather is changing, but it doesn't tell us what Nadia will decide.
      '3': This doesn't tell us anything about Nadia's plans.
    hints:
      - Which detail shows Nadia doing the **opposite** of skipping the trip?
    solution:
      - In paragraph 9, Nadia digs out her skates and runs for the door.
      - That shows she **is** going after all, so readers revise their prediction.

  - id: d3
    level: 3
    type: mc
    prompt: |-
      Why might the author show Nadia pushing her skates into the closet, instead of simply writing
      “Nadia felt disappointed”?
    choices:
      - Showing actions lets readers infer the feeling themselves, which makes the story more interesting.
      - The author didn't know how Nadia felt.
      - Feelings are not allowed in realistic fiction.
      - It makes the story shorter.
    answer: 0
    feedback:
      '1': The author created Nadia, and gave us clues about her feelings on purpose.
      '2': Realistic fiction is full of feelings. The question is **how** the author shares them.
      '3': Showing an action often takes **more** words than naming a feeling. The author chose it for a different reason.
    hints:
      - How does it feel as a reader to figure something out yourself, compared to being told?
    solution:
      - Authors often **show** feelings through actions and dialogue instead of **telling** them.
      - This makes readers infer, which pulls them into the story. It's a choice of the author's craft.

  - id: d4
    level: 3
    type: open
    prompt: |-
      What does the arch in the sky mean, and how did it help Grandpa? Use **evidence from at least two
      paragraphs** and explain what you inferred.
    modelAnswer: |-
      The arch is a band of clear blue sky over the mountains (paragraph 4). Grandpa says he has been
      “watching that sky for seventy winters” (paragraph 7), so he knows the arch means warm weather is coming,
      and he tells Nadia to leave her heavy mitts at home (paragraph 5). I inferred he was right because the next
      morning the thermometer read plus seven and the icicles were shrinking (paragraph 9). In Alberta, this warm
      wind is called a chinook.
    rubric:
      - I used evidence from at least **two different paragraphs**.
      - I quoted words or named paragraph numbers.
      - I explained my inference (clue + what I know).
      - I connected the arch to what happened next (the warm weather).
